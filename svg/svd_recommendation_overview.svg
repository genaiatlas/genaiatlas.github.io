<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="userGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="itemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E74C3C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C0392B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="latentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#27AE60;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#229954;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#F8F9FA"/>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2C3E50">
    Recommendation System: Matrix Completion with SVD
  </text>
  
  <!-- User-Item Matrix -->
  <g transform="translate(100, 100)">
    <text x="100" y="-20" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2C3E50">
      User-Item Matrix (L)
    </text>
    
    <!-- Matrix Grid -->
    <rect x="0" y="0" width="200" height="200" fill="white" stroke="#BDC3C7" stroke-width="2"/>
    
    <!-- Row headers (Users) -->
    <text x="-30" y="30" font-family="Arial, sans-serif" font-size="14" text-anchor="end" fill="#4A90E2">u₁</text>
    <text x="-30" y="80" font-family="Arial, sans-serif" font-size="14" text-anchor="end" fill="#4A90E2">u₂</text>
    <text x="-30" y="130" font-family="Arial, sans-serif" font-size="14" text-anchor="end" fill="#4A90E2">u₃</text>
    <text x="-30" y="180" font-family="Arial, sans-serif" font-size="14" text-anchor="end" fill="#4A90E2">u₄</text>
    
    <!-- Column headers (Items) -->
    <text x="25" y="-10" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#E74C3C">i₁</text>
    <text x="75" y="-10" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#E74C3C">i₂</text>
    <text x="125" y="-10" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#E74C3C">i₃</text>
    <text x="175" y="-10" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#E74C3C">i₄</text>
    
    <!-- Grid lines -->
    <line x1="0" y1="50" x2="200" y2="50" stroke="#ECF0F1" stroke-width="1"/>
    <line x1="0" y1="100" x2="200" y2="100" stroke="#ECF0F1" stroke-width="1"/>
    <line x1="0" y1="150" x2="200" y2="150" stroke="#ECF0F1" stroke-width="1"/>
    <line x1="50" y1="0" x2="50" y2="200" stroke="#ECF0F1" stroke-width="1"/>
    <line x1="100" y1="0" x2="100" y2="200" stroke="#ECF0F1" stroke-width="1"/>
    <line x1="150" y1="0" x2="150" y2="200" stroke="#ECF0F1" stroke-width="1"/>
    
    <!-- Matrix values -->
    <text x="25" y="30" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2C3E50">5</text>
    <text x="75" y="30" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#95A5A6">?</text>
    <text x="125" y="30" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2C3E50">3</text>
    <text x="175" y="30" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#95A5A6">?</text>
    
    <text x="25" y="80" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#95A5A6">?</text>
    <text x="75" y="80" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2C3E50">4</text>
    <text x="125" y="80" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#95A5A6">?</text>
    <text x="175" y="80" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2C3E50">2</text>
    
    <text x="25" y="130" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2C3E50">4</text>
    <text x="75" y="130" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2C3E50">5</text>
    <text x="125" y="130" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#95A5A6">?</text>
    <text x="175" y="130" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#95A5A6">?</text>
    
    <text x="25" y="180" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#95A5A6">?</text>
    <text x="75" y="180" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#95A5A6">?</text>
    <text x="125" y="180" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2C3E50">4</text>
    <text x="175" y="180" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2C3E50">5</text>
  </g>
  
  <!-- Arrow -->
  <path d="M 350 200 L 420 200" stroke="#7F8C8D" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="385" y="190" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#7F8C8D">SVD</text>
  
  <!-- Latent Features -->
  <g transform="translate(450, 100)">
    <text x="100" y="-20" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2C3E50">
      Latent Features
    </text>
    
    <!-- User Features Box -->
    <rect x="0" y="0" width="80" height="160" fill="url(#userGrad)" opacity="0.2" stroke="#4A90E2" stroke-width="2" rx="5"/>
    <text x="40" y="-35" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#4A90E2">
      User Features
    </text>
    <text x="40" y="30" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#4A90E2">u₁</text>
    <text x="40" y="60" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#4A90E2">u₂</text>
    <text x="40" y="90" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#4A90E2">u₃</text>
    <text x="40" y="120" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#4A90E2">u₄</text>
    
    <!-- Item Features Box -->
    <rect x="120" y="0" width="80" height="160" fill="url(#itemGrad)" opacity="0.2" stroke="#E74C3C" stroke-width="2" rx="5"/>
    <text x="160" y="-35" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#E74C3C">
      Item Features
    </text>
    <text x="160" y="30" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#E74C3C">v₁</text>
    <text x="160" y="60" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#E74C3C">v₂</text>
    <text x="160" y="90" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#E74C3C">v₃</text>
    <text x="160" y="120" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#E74C3C">v₄</text>
  </g>
  
  <!-- Formula -->
  <g transform="translate(400, 350)">
    <rect x="-120" y="-30" width="240" height="60" fill="white" stroke="#27AE60" stroke-width="2" rx="5"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#27AE60">
      L_ij = f(u_i, v_j)
    </text>
  </g>
  
  <!-- Legend -->
  <g transform="translate(150, 450)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2C3E50">Legend:</text>
    <rect x="0" y="10" width="20" height="20" fill="#2C3E50"/>
    <text x="30" y="25" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">Known Rating</text>
    
    <rect x="150" y="10" width="20" height="20" fill="#95A5A6"/>
    <text x="180" y="25" font-family="Arial, sans-serif" font-size="12" fill="#7F8C8D">Missing Value (?)</text>
    
    <rect x="320" y="10" width="20" height="20" fill="url(#latentGrad)" opacity="0.3"/>
    <text x="350" y="25" font-family="Arial, sans-serif" font-size="12" fill="#27AE60">Predicted Value</text>
  </g>
  
  <!-- Key Points -->
  <g transform="translate(100, 520)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" fill="#34495E">
      • Extract latent features from known ratings
    </text>
    <text x="0" y="25" font-family="Arial, sans-serif" font-size="12" fill="#34495E">
      • Use features to predict missing values
    </text>
    <text x="0" y="50" font-family="Arial, sans-serif" font-size="12" fill="#34495E">
      • Dimensionality reduction captures essential patterns
    </text>
  </g>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#7F8C8D"/>
    </marker>
  </defs>
</svg>