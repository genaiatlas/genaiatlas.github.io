<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="precisionGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3498db" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#2980b9" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="recallGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9b59b6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8e44ad" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#00000030"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#2c3e50">
    Precision and Recall Formulas
  </text>

  <!-- Precision Section -->
  <g transform="translate(50, 70)">
    <rect x="0" y="0" width="320" height="220" rx="15" fill="url(#precisionGradient)" stroke="#2980b9" stroke-width="3" filter="url(#shadow)"/>
    
    <text x="160" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1a5490">
      PRECISION
    </text>
    
    <text x="160" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">
      "How accurate are my positive predictions?"
    </text>
    
    <line x1="30" y1="80" x2="290" y2="80" stroke="#2980b9" stroke-width="2"/>
    
    <!-- Formula -->
    <text x="160" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">
      Precision =
    </text>
    
    <g transform="translate(160, 130)">
      <rect x="-90" y="-5" width="180" height="35" fill="none" stroke="#2980b9" stroke-width="2" rx="5"/>
      <line x1="-80" y1="15" x2="80" y2="15" stroke="#2980b9" stroke-width="2"/>
      
      <text x="0" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
        True Positives (TP)
      </text>
      <text x="0" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
        TP + False Positives (FP)
      </text>
    </g>
    
    <text x="160" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">
      Out of all cases predicted as positive,
    </text>
    <text x="160" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">
      how many were actually positive?
    </text>
  </g>

  <!-- Recall Section -->
  <g transform="translate(430, 70)">
    <rect x="0" y="0" width="320" height="220" rx="15" fill="url(#recallGradient)" stroke="#8e44ad" stroke-width="3" filter="url(#shadow)"/>
    
    <text x="160" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#6a1b7a">
      RECALL
    </text>
    
    <text x="160" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">
      "How many positives did I catch?"
    </text>
    
    <line x1="30" y1="80" x2="290" y2="80" stroke="#8e44ad" stroke-width="2"/>
    
    <!-- Formula -->
    <text x="160" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">
      Recall =
    </text>
    
    <g transform="translate(160, 130)">
      <rect x="-90" y="-5" width="180" height="35" fill="none" stroke="#8e44ad" stroke-width="2" rx="5"/>
      <line x1="-80" y1="15" x2="80" y2="15" stroke="#8e44ad" stroke-width="2"/>
      
      <text x="0" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
        True Positives (TP)
      </text>
      <text x="0" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
        TP + False Negatives (FN)
      </text>
    </g>
    
    <text x="160" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">
      Out of all actual positive cases,
    </text>
    <text x="160" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">
      how many did I identify correctly?
    </text>
  </g>

  <!-- Example Calculation -->
  <g transform="translate(100, 320)">
    <text x="300" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#2c3e50">
      Example Calculation
    </text>
    
    <text x="300" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#7f8c8d">
      Using our fraud detection confusion matrix: TP=2, FP=8, FN=4, TN=86
    </text>
    
    <!-- Precision calculation -->
    <g transform="translate(0, 80)">
      <rect x="0" y="0" width="250" height="120" fill="#ecf8ff" stroke="#3498db" stroke-width="2" rx="8"/>
      
      <text x="125" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2980b9">
        Precision Calculation
      </text>
      
      <text x="125" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#2c3e50">
        Precision = TP / (TP + FP)
      </text>
      <text x="125" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#2c3e50">
        Precision = 2 / (2 + 8) = 2/10
      </text>
      <text x="125" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2980b9">
        = 0.2 or 20%
      </text>
    </g>
    
    <!-- Recall calculation -->
    <g transform="translate(350, 80)">
      <rect x="0" y="0" width="250" height="120" fill="#faf4ff" stroke="#9b59b6" stroke-width="2" rx="8"/>
      
      <text x="125" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#8e44ad">
        Recall Calculation
      </text>
      
      <text x="125" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#2c3e50">
        Recall = TP / (TP + FN)
      </text>
      <text x="125" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#2c3e50">
        Recall = 2 / (2 + 4) = 2/6
      </text>
      <text x="125" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#8e44ad">
        = 0.33 or 33%
      </text>
    </g>
  </g>

  <!-- Interpretation -->
  <g transform="translate(50, 480)">
    <rect x="0" y="0" width="700" height="90" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2" rx="8"/>
    
    <text x="350" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">
      📊 Interpretation of Results
    </text>
    
    <text x="50" y="50" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">
      <tspan font-weight="bold" fill="#2980b9">Precision = 20%:</tspan> When our model predicts fraud, it's correct only 20% of the time
    </text>
    <text x="50" y="70" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">
      <tspan font-weight="bold" fill="#8e44ad">Recall = 33%:</tspan> Our model catches only 33% of all actual fraud cases - missing 67% of fraud!
    </text>
  </g>

  <!-- Additional notes -->
  <text x="400" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d" font-style="italic">
    Note: Recall is also known as Sensitivity or True Positive Rate (TPR)
  </text>
</svg>