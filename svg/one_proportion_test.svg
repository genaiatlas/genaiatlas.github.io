<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', sans-serif; font-size: 18px; font-weight: bold; fill: #2c3e50; }
      .header { font-family: 'Segoe UI', sans-serif; font-size: 14px; font-weight: bold; fill: #34495e; }
      .text { font-family: 'Segoe UI', sans-serif; font-size: 11px; fill: #2c3e50; }
      .small-text { font-family: 'Segoe UI', sans-serif; font-size: 9px; fill: #7f8c8d; }
      .math { font-family: 'Times New Roman', serif; font-size: 12px; fill: #8e44ad; }
      .box { fill: #ecf0f1; stroke: #34495e; stroke-width: 2; }
      .formula-box { fill: #fff2cc; stroke: #d6b656; stroke-width: 2; }
      .example-box { fill: #d5e8d4; stroke: #82b366; stroke-width: 2; }
      .assumption-box { fill: #f8cecc; stroke: #b85450; stroke-width: 2; }
      .ci-box { fill: #e1d5e7; stroke: #9673a6; stroke-width: 2; }
    </style>
  </defs>

  <!-- Title -->
  <text x="400" y="25" class="title" text-anchor="middle">Test for One Population Proportion</text>

  <!-- Purpose -->
  <rect x="50" y="40" width="700" height="50" class="box" rx="8"/>
  <text x="400" y="60" class="header" text-anchor="middle">Purpose: Test whether a population proportion equals a specific value</text>
  <text x="400" y="80" class="text" text-anchor="middle">Used when the outcome variable is categorical (success/failure, yes/no, etc.)</text>

  <!-- Hypotheses and Test Statistic -->
  <rect x="50" y="110" width="350" height="120" class="formula-box" rx="8"/>
  <text x="225" y="130" class="header" text-anchor="middle">Hypotheses</text>
  
  <text x="70" y="150" class="math">H₀: p = p₀</text>
  <text x="70" y="170" class="text">Two-tailed:</text>
  <text x="90" y="185" class="math">H₁: p ≠ p₀</text>
  <text x="70" y="205" class="text">One-tailed:</text>
  <text x="90" y="220" class="math">H₁: p &gt; p₀  or  H₁: p &lt; p₀</text>

  <rect x="420" y="110" width="330" height="120" class="formula-box" rx="8"/>
  <text x="585" y="130" class="header" text-anchor="middle">Test Statistic</text>
  
  <text x="440" y="150" class="math">Z = (p̂ - p₀)/√(p₀(1-p₀)/n)</text>
  
  <text x="440" y="175" class="text">Where:</text>
  <text x="460" y="190" class="small-text">p̂ = x/n = sample proportion</text>
  <text x="460" y="205" class="small-text">x = number of successes</text>
  <text x="460" y="220" class="small-text">n = sample size</text>

  <!-- Assumptions -->
  <rect x="50" y="250" width="350" height="100" class="assumption-box" rx="8"/>
  <text x="225" y="270" class="header" text-anchor="middle">Assumptions</text>
  <text x="70" y="290" class="text">✓ Random sampling</text>
  <text x="70" y="305" class="text">✓ Independent trials (binomial conditions)</text>
  <text x="70" y="320" class="text">✓ Large sample approximation:</text>
  <text x="90" y="335" class="small-text">np₀ ≥ 5 and n(1-p₀) ≥ 5</text>

  <!-- Continuity Correction -->
  <rect x="420" y="250" width="330" height="100" class="assumption-box" rx="8"/>
  <text x="585" y="270" class="header" text-anchor="middle">Continuity Correction</text>
  <text x="440" y="290" class="text">For improved accuracy with small samples:</text>
  
  <text x="440" y="310" class="math">Z = (|p̂ - p₀| - 1/(2n))/√(p₀(1-p₀)/n)</text>
  
  <text x="440" y="330" class="small-text">Adjusts for discrete → continuous approximation</text>

  <!-- Example -->
  <rect x="50" y="370" width="700" height="110" class="example-box" rx="8"/>
  <text x="400" y="390" class="header" text-anchor="middle">Example: Quality Control</text>
  
  <text x="70" y="410" class="text">Question: A manufacturer claims that 95% of their products pass quality inspection.</text>
  <text x="70" y="425" class="text">A sample of 200 products shows 185 pass inspection. Is the claim supported?</text>
  
  <text x="70" y="445" class="text">Solution: H₀: p = 0.95 vs H₁: p ≠ 0.95, α = 0.05</text>
  <text x="70" y="460" class="text">p̂ = 185/200 = 0.925, Z = (0.925 - 0.95)/√(0.95×0.05/200) = -0.025/0.0154 = -1.62</text>
  <text x="70" y="475" class="text">Critical values: ±1.96, Since |-1.62| &lt; 1.96 → Fail to reject H₀ (claim is supported)</text>

</svg>