<svg viewBox="0 0 900 650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="crossEntropyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196F3;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#42A5F5;stop-opacity:0.6" />
    </linearGradient>
    <radialGradient id="probGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#4CAF50;stop-opacity:0.7" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="650" fill="#fafafa"/>
  
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1a1a1a">Cross-Entropy Loss for Binary Classification</text>
  
  <!-- Loss Curve Section -->
  <g transform="translate(50, 60)">
    <text x="200" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">Loss vs Predicted Probability</text>
    
    <!-- Plot axes -->
    <line x1="50" y1="250" x2="350" y2="250" stroke="#333" stroke-width="2"/>
    <line x1="50" y1="50" x2="50" y2="250" stroke="#333" stroke-width="2"/>
    
    <!-- Axis labels -->
    <text x="200" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#555">Predicted Probability</text>
    <text x="25" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#555" transform="rotate(-90, 25, 150)">Loss</text>
    
    <!-- Tick marks and labels -->
    <g font-family="Arial, sans-serif" font-size="10" fill="#666">
      <!-- X-axis ticks -->
      <line x1="80" y1="250" x2="80" y2="255" stroke="#666"/>
      <text x="80" y="268" text-anchor="middle">0.2</text>
      <line x1="140" y1="250" x2="140" y2="255" stroke="#666"/>
      <text x="140" y="268" text-anchor="middle">0.5</text>
      <line x1="200" y1="250" x2="200" y2="255" stroke="#666"/>
      <text x="200" y="268" text-anchor="middle">0.7</text>
      <line x1="290" y1="250" x2="290" y2="255" stroke="#666"/>
      <text x="290" y="268" text-anchor="middle">0.9</text>
      
      <!-- Y-axis ticks -->
      <line x1="45" y1="200" x2="50" y2="200" stroke="#666"/>
      <text x="40" y="205" text-anchor="end">1</text>
      <line x1="45" y1="150" x2="50" y2="150" stroke="#666"/>
      <text x="40" y="155" text-anchor="end">2</text>
      <line x1="45" y1="100" x2="50" y2="100" stroke="#666"/>
      <text x="40" y="105" text-anchor="end">3</text>
      <line x1="45" y1="70" x2="50" y2="70" stroke="#666"/>
      <text x="40" y="75" text-anchor="end">4</text>
    </g>
    
    <!-- Loss curves -->
    <!-- Class 1 curve: -log(p) -->
    <path d="M 55 245 Q 80 200 120 150 Q 160 100 200 80 Q 240 65 290 58 Q 320 55 345 54" 
          stroke="#E91E63" stroke-width="3" fill="none"/>
    <text x="310" y="50" font-family="Arial, sans-serif" font-size="11" fill="#E91E63" font-weight="bold">Class 1: -log(p)</text>
    
    <!-- Class 0 curve: -log(1-p) -->
    <path d="M 55 54 Q 85 55 120 58 Q 160 65 200 80 Q 240 100 280 150 Q 320 200 345 245" 
          stroke="#4CAF50" stroke-width="3" fill="none"/>
    <text x="270" y="180" font-family="Arial, sans-serif" font-size="11" fill="#4CAF50" font-weight="bold">Class 0: -log(1-p)</text>
    
    <!-- Key points -->
    <circle cx="200" cy="115" r="4" fill="#E91E63"/>
    <circle cx="200" cy="115" r="4" fill="#4CAF50"/>
    <text x="210" y="120" font-family="Arial, sans-serif" font-size="10" fill="#333">p=0.5: Equal loss</text>
  </g>
  
  <!-- Formula Section -->
  <g transform="translate(450, 80)">
    <rect x="0" y="0" width="380" height="220" rx="10" fill="url(#crossEntropyGradient)"/>
    
    <!-- Formula Title -->
    <text x="190" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">Cross-Entropy Formula</text>
    
    <!-- Binary Formula -->
    <text x="190" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white" font-weight="bold">L = -[y log(p) + (1-y) log(1-p)]</text>
    
    <!-- General Formula -->
    <text x="190" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">For n samples:</text>
    <text x="190" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="white" font-weight="bold">L = -(1/n) Σ [yᵢ log(pᵢ) + (1-yᵢ) log(1-pᵢ)]</text>
    
    <!-- Components -->
    <text x="20" y="135" font-family="Arial, sans-serif" font-size="12" fill="white" font-weight="bold">Where:</text>
    <text x="20" y="155" font-family="Arial, sans-serif" font-size="11" fill="white">• y ∈ {0, 1} = true class label</text>
    <text x="20" y="170" font-family="Arial, sans-serif" font-size="11" fill="white">• p = P(y=1|x) = predicted probability</text>
    <text x="20" y="185" font-family="Arial, sans-serif" font-size="11" fill="white">• Output from sigmoid: σ(z) = 1/(1+e⁻ᶻ)</text>
    
    <!-- Key Properties -->
    <text x="190" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">✓ Probabilistic ✓ Differentiable ✓ Penalizes Confidence</text>
  </g>
  
  <!-- Intuition Examples -->
  <g transform="translate(50, 320)">
    <rect x="0" y="0" width="780" height="160" rx="8" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
    
    <text x="20" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">Intuitive Examples</text>
    
    <!-- Example 1: Perfect Prediction -->
    <g transform="translate(20, 45)">
      <rect x="0" y="0" width="230" height="90" rx="5" fill="#d4edda" stroke="#c3e6cb" stroke-width="1"/>
      <text x="115" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#155724">Perfect Prediction ✅</text>
      <text x="10" y="40" font-family="Arial, sans-serif" font-size="11" fill="#155724">True: y = 1, Predicted: p = 1.0</text>
      <text x="10" y="55" font-family="Arial, sans-serif" font-size="11" fill="#155724">Loss = -[1×log(1.0) + 0×log(0)]</text>
      <text x="10" y="70" font-family="Arial, sans-serif" font-size="11" fill="#155724">Loss = -[1×0 + 0] = 0</text>
      <text x="115" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#155724">Minimum Loss!</text>
    </g>
    
    <!-- Example 2: Wrong Prediction -->
    <g transform="translate(270, 45)">
      <rect x="0" y="0" width="230" height="90" rx="5" fill="#f8d7da" stroke="#f5c6cb" stroke-width="1"/>
      <text x="115" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#721c24">Wrong Prediction ❌</text>
      <text x="10" y="40" font-family="Arial, sans-serif" font-size="11" fill="#721c24">True: y = 1, Predicted: p = 0.1</text>
      <text x="10" y="55" font-family="Arial, sans-serif" font-size="11" fill="#721c24">Loss = -[1×log(0.1) + 0×log(0.9)]</text>
      <text x="10" y="70" font-family="Arial, sans-serif" font-size="11" fill="#721c24">Loss = -[1×(-2.3) + 0] = 2.3</text>
      <text x="115" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#721c24">High Loss!</text>
    </g>
    
    <!-- Example 3: Uncertain Prediction -->
    <g transform="translate(520, 45)">
      <rect x="0" y="0" width="230" height="90" rx="5" fill="#fff3cd" stroke="#ffeaa7" stroke-width="1"/>
      <text x="115" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#856404">Uncertain Prediction ⚠️</text>
      <text x="10" y="40" font-family="Arial, sans-serif" font-size="11" fill="#856404">True: y = 1, Predicted: p = 0.5</text>
      <text x="10" y="55" font-family="Arial, sans-serif" font-size="11" fill="#856404">Loss = -[1×log(0.5) + 0×log(0.5)]</text>
      <text x="10" y="70" font-family="Arial, sans-serif" font-size="11" fill="#856404">Loss = -[1×(-0.69) + 0] = 0.69</text>
      <text x="115" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#856404">Moderate Loss</text>
    </g>
  </g>
  
  <!-- Probability Interpretation -->
  <g transform="translate(50, 500)">
    <rect x="0" y="0" width="780" height="120" rx="8" fill="#e3f2fd" stroke="#90caf9" stroke-width="1"/>
    
    <text x="20" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0d47a1">Probability Interpretation</text>
    
    <text x="20" y="50" font-family="Arial, sans-serif" font-size="12" fill="#1565c0">• <strong>Sigmoid Output:</strong> Neural network outputs probability p ∈ [0,1] for class 1</text>
    <text x="20" y="70" font-family="Arial, sans-serif" font-size="12" fill="#1565c0">• <strong>Complementary Probability:</strong> P(class 0) = 1 - p</text>
    <text x="20" y="90" font-family="Arial, sans-serif" font-size="12" fill="#1565c0">• <strong>Loss Behavior:</strong> Heavily penalizes confident wrong predictions (approaches ∞)</text>
    <text x="20" y="110" font-family="Arial, sans-serif" font-size="12" fill="#1565c0">• <strong>Gradient Flow:</strong> Larger gradients for bigger errors → faster correction</text>
  </g>
  
  <!-- Sigmoid visualization -->
  <g transform="translate(450, 320)">
    <text x="190" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Sigmoid Activation</text>
    
    <!-- Mini sigmoid plot -->
    <rect x="0" y="20" width="380" height="120" rx="5" fill="white" stroke="#ddd" stroke-width="1"/>
    
    <!-- Sigmoid curve -->
    <path d="M 20 120 Q 100 120 190 70 Q 280 20 360 20" stroke="#FF9800" stroke-width="3" fill="none"/>
    
    <!-- Labels -->
    <text x="30" y="135" font-family="Arial, sans-serif" font-size="10" fill="#666">0</text>
    <text x="350" y="135" font-family="Arial, sans-serif" font-size="10" fill="#666">1</text>
    <text x="190" y="135" font-family="Arial, sans-serif" font-size="10" fill="#666">0.5</text>
    <text x="10" y="125" font-family="Arial, sans-serif" font-size="10" fill="#666">0</text>
    <text x="10" y="25" font-family="Arial, sans-serif" font-size="10" fill="#666">1</text>
    
    <text x="190" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#FF9800" font-weight="bold">σ(z) = 1/(1+e⁻ᶻ)</text>
  </g>
</svg>