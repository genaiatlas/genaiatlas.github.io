<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#64748b" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGradient)"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1e293b">Simple Linear Regression</text>
  
  <!-- Main plot area -->
  <rect x="120" y="80" width="520" height="380" fill="white" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  
  <!-- Axes -->
  <line x1="140" y1="440" x2="620" y2="440" stroke="#475569" stroke-width="2"/>
  <line x1="140" y1="440" x2="140" y2="100" stroke="#475569" stroke-width="2"/>
  
  <!-- Grid lines -->
  <g stroke="#e2e8f0" stroke-width="1" opacity="0.5">
    <!-- Vertical grid lines -->
    <line x1="200" y1="100" x2="200" y2="440"/>
    <line x1="260" y1="100" x2="260" y2="440"/>
    <line x1="320" y1="100" x2="320" y2="440"/>
    <line x1="380" y1="100" x2="380" y2="440"/>
    <line x1="440" y1="100" x2="440" y2="440"/>
    <line x1="500" y1="100" x2="500" y2="440"/>
    <line x1="560" y1="100" x2="560" y2="440"/>
    
    <!-- Horizontal grid lines -->
    <line x1="140" y1="120" x2="620" y2="120"/>
    <line x1="140" y1="160" x2="620" y2="160"/>
    <line x1="140" y1="200" x2="620" y2="200"/>
    <line x1="140" y1="240" x2="620" y2="240"/>
    <line x1="140" y1="280" x2="620" y2="280"/>
    <line x1="140" y1="320" x2="620" y2="320"/>
    <line x1="140" y1="360" x2="620" y2="360"/>
    <line x1="140" y1="400" x2="620" y2="400"/>
  </g>
  
  <!-- Scatter points -->
  <g fill="#3b82f6" opacity="0.7">
    <circle cx="180" cy="380" r="4"/>
    <circle cx="200" cy="360" r="4"/>
    <circle cx="220" cy="340" r="4"/>
    <circle cx="240" cy="330" r="4"/>
    <circle cx="260" cy="315" r="4"/>
    <circle cx="280" cy="300" r="4"/>
    <circle cx="300" cy="285" r="4"/>
    <circle cx="320" cy="275" r="4"/>
    <circle cx="340" cy="260" r="4"/>
    <circle cx="360" cy="245" r="4"/>
    <circle cx="380" cy="230" r="4"/>
    <circle cx="400" cy="220" r="4"/>
    <circle cx="420" cy="205" r="4"/>
    <circle cx="440" cy="190" r="4"/>
    <circle cx="460" cy="180" r="4"/>
    <circle cx="480" cy="165" r="4"/>
    <circle cx="500" cy="150" r="4"/>
    <circle cx="520" cy="140" r="4"/>
    <circle cx="540" cy="125" r="4"/>
    <circle cx="560" cy="115" r="4"/>
  </g>
  
  <!-- Regression line -->
  <line x1="160" y1="400" x2="580" y2="110" stroke="#dc2626" stroke-width="3"/>
  
  <!-- Residual lines (showing error) -->
  <g stroke="#64748b" stroke-width="1" stroke-dasharray="2,2" opacity="0.6">
    <line x1="200" y1="360" x2="200" y2="375"/>
    <line x1="260" y1="315" x2="260" y2="290"/>
    <line x1="320" y1="275" x2="320" y2="260"/>
    <line x1="380" y1="230" x2="380" y2="230"/>
    <line x1="440" y1="190" x2="440" y2="205"/>
    <line x1="500" y1="150" x2="500" y2="145"/>
  </g>
  
  <!-- Axis labels -->
  <text x="380" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#475569">X (Independent Variable)</text>
  <text x="70" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#475569" transform="rotate(-90, 70, 270)">Y (Dependent Variable)</text>
  
  <!-- Axis tick labels -->
  <g font-family="Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">
    <text x="200" y="455">1</text>
    <text x="260" y="455">2</text>
    <text x="320" y="455">3</text>
    <text x="380" y="455">4</text>
    <text x="440" y="455">5</text>
    <text x="500" y="455">6</text>
    <text x="560" y="455">7</text>
  </g>
  
  <g font-family="Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="end">
    <text x="135" y="405">0</text>
    <text x="135" y="365">2</text>
    <text x="135" y="325">4</text>
    <text x="135" y="285">6</text>
    <text x="135" y="245">8</text>
    <text x="135" y="205">10</text>
    <text x="135" y="165">12</text>
    <text x="135" y="125">14</text>
  </g>
  
  <!-- Equation display -->
  <rect x="450" y="320" width="180" height="80" fill="white" stroke="#cbd5e1" stroke-width="1" rx="5" filter="url(#shadow)"/>
  <text x="540" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Regression Equation</text>
  <text x="540" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">Y = β₀ + β₁X + ε</text>
  <text x="540" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Y = 2.1 + 1.8X + ε</text>
  
  <!-- Legend -->
  <g transform="translate(680, 120)">
    <rect x="-20" y="-10" width="140" height="120" fill="white" stroke="#cbd5e1" stroke-width="1" rx="5" filter="url(#shadow)"/>
    <text x="50" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Legend</text>
    
    <circle cx="5" cy="30" r="4" fill="#3b82f6"/>
    <text x="15" y="35" font-family="Arial, sans-serif" font-size="11" fill="#475569">Data Points</text>
    
    <line x1="0" y1="50" x2="20" y2="50" stroke="#dc2626" stroke-width="3"/>
    <text x="25" y="55" font-family="Arial, sans-serif" font-size="11" fill="#475569">Regression Line</text>
    
    <line x1="0" y1="70" x2="20" y2="70" stroke="#64748b" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="25" y="75" font-family="Arial, sans-serif" font-size="11" fill="#475569">Residuals</text>
  </g>
  
  <!-- Key metrics -->
  <rect x="40" y="500" width="720" height="80" fill="white" stroke="#cbd5e1" stroke-width="1" rx="5" filter="url(#shadow)"/>
  <text x="400" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">Key Concepts</text>
  
  <g font-family="Arial, sans-serif" font-size="12" fill="#475569">
    <text x="60" y="545"><tspan font-weight="bold" fill="#dc2626">β₀ (Intercept):</tspan> Y-value when X = 0</text>
    <text x="300" y="545"><tspan font-weight="bold" fill="#dc2626">β₁ (Slope):</tspan> Change in Y per unit change in X</text>
    <text x="580" y="545"><tspan font-weight="bold" fill="#dc2626">R² = 0.85:</tspan> 85% of variance explained</text>
    
    <text x="60" y="565"><tspan font-weight="bold" fill="#3b82f6">Residual:</tspan> Difference between observed and predicted Y</text>
    <text x="380" y="565"><tspan font-weight="bold" fill="#3b82f6">OLS:</tspan> Minimizes sum of squared residuals</text>
  </g>
</svg>