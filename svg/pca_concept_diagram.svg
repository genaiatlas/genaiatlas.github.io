<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="highDimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#4ecdc4;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="lowDimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#45b7d1;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#96ceb4;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">
    Principal Component Analysis (PCA) Concept
  </text>
  
  <!-- High Dimensional Data (Left) -->
  <g transform="translate(50, 80)">
    <text x="100" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">
      High-Dimensional Data
    </text>
    
    <!-- 3D Cube representation -->
    <g transform="translate(20, 20)">
      <!-- Back face -->
      <rect x="30" y="30" width="120" height="120" fill="url(#highDimGrad)" stroke="#2c3e50" stroke-width="2" opacity="0.6"/>
      <!-- Front face -->
      <rect x="0" y="60" width="120" height="120" fill="url(#highDimGrad)" stroke="#2c3e50" stroke-width="2"/>
      <!-- Connecting lines -->
      <line x1="0" y1="60" x2="30" y2="30" stroke="#2c3e50" stroke-width="2"/>
      <line x1="120" y1="60" x2="150" y2="30" stroke="#2c3e50" stroke-width="2"/>
      <line x1="0" y1="180" x2="30" y2="150" stroke="#2c3e50" stroke-width="2"/>
      <line x1="120" y1="180" x2="150" y2="150" stroke="#2c3e50" stroke-width="2"/>
    </g>
    
    <!-- Data points in 3D -->
    <circle cx="60" cy="100" r="4" fill="#e74c3c"/>
    <circle cx="80" cy="120" r="4" fill="#e74c3c"/>
    <circle cx="100" cy="90" r="4" fill="#e74c3c"/>
    <circle cx="70" cy="140" r="4" fill="#e74c3c"/>
    <circle cx="90" cy="110" r="4" fill="#e74c3c"/>
    <circle cx="110" cy="130" r="4" fill="#e74c3c"/>
    
    <!-- Dimension labels -->
    <text x="10" y="250" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">
      Features: x₁, x₂, x₃, ..., xₙ
    </text>
    <text x="40" y="270" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">
      High complexity
    </text>
  </g>
  
  <!-- Arrow -->
  <g transform="translate(320, 200)">
    <path d="M 0 0 L 120 0 L 100 -15 M 120 0 L 100 15" stroke="#2c3e50" stroke-width="3" fill="none"/>
    <text x="60" y="-25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
      PCA
    </text>
    <text x="60" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">
      Dimensionality Reduction
    </text>
  </g>
  
  <!-- Low Dimensional Data (Right) -->
  <g transform="translate(500, 80)">
    <text x="100" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">
      Low-Dimensional Data
    </text>
    
    <!-- 2D Plane representation -->
    <rect x="30" y="30" width="140" height="140" fill="url(#lowDimGrad)" stroke="#2c3e50" stroke-width="2"/>
    
    <!-- Principal component axes -->
    <line x1="30" y1="100" x2="170" y2="100" stroke="#2c3e50" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="100" y1="30" x2="100" y2="170" stroke="#2c3e50" stroke-width="2" stroke-dasharray="5,5"/>
    
    <!-- PC1 arrow -->
    <path d="M 40 110 L 160 90 L 150 85 M 160 90 L 150 95" stroke="#e74c3c" stroke-width="3" fill="none"/>
    <text x="120" y="85" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e74c3c">PC1</text>
    
    <!-- PC2 arrow -->
    <path d="M 110 160 L 90 40 L 85 50 M 90 40 L 95 50" stroke="#3498db" stroke-width="3" fill="none"/>
    <text x="75" y="100" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#3498db">PC2</text>
    
    <!-- Data points in 2D -->
    <circle cx="80" cy="90" r="4" fill="#e74c3c"/>
    <circle cx="120" cy="95" r="4" fill="#e74c3c"/>
    <circle cx="100" cy="85" r="4" fill="#e74c3c"/>
    <circle cx="90" cy="105" r="4" fill="#e74c3c"/>
    <circle cx="110" cy="100" r="4" fill="#e74c3c"/>
    <circle cx="130" cy="95" r="4" fill="#e74c3c"/>
    
    <!-- Dimension labels -->
    <text x="20" y="250" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">
      Principal Components: PC1, PC2
    </text>
    <text x="50" y="270" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">
      Reduced complexity
    </text>
  </g>
  
  <!-- Benefits box -->
  <g transform="translate(250, 320)">
    <rect x="0" y="0" width="300" height="70" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" rx="5"/>
    <text x="150" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
      Benefits of PCA
    </text>
    <text x="20" y="40" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
      • Noise reduction  • Data visualization  • Computational efficiency
    </text>
    <text x="20" y="55" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
      • Pattern discovery  • Storage reduction  • Feature selection
    </text>
  </g>
</svg>