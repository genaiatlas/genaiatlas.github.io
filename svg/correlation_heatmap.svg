<svg viewBox="0 0 900 750" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="900" height="750" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="450" y="35" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Multicollinearity: When Predictors Are Too Similar
  </text>
  
  <!-- Top section: Visual representation -->
  <g transform="translate(50, 70)">
    
    <!-- No Multicollinearity (Good) -->
    <g transform="translate(0, 0)">
      <text x="175" y="0" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#27ae60">
        No Multicollinearity (Good)
      </text>
      <text x="175" y="20" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d" font-style="italic">
        Predictors are independent
      </text>
      
      <!-- Venn diagram - separate circles -->
      <circle cx="120" cy="120" r="60" fill="#3498db" opacity="0.4" stroke="#2980b9" stroke-width="2"/>
      <circle cx="230" cy="120" r="60" fill="#e74c3c" opacity="0.4" stroke="#c0392b" stroke-width="2"/>
      
      <text x="100" y="125" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2980b9">X₁</text>
      <text x="250" y="125" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#c0392b">X₂</text>
      
      <!-- Correlation indicator -->
      <text x="175" y="210" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#27ae60">
        r(X₁, X₂) ≈ 0
      </text>
      
      <!-- Explanation -->
      <rect x="10" y="230" width="330" height="90" fill="#d5f4e6" stroke="#27ae60" stroke-width="2" rx="5"/>
      <text x="175" y="255" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#27ae60" font-weight="bold">
        ✓ Each predictor provides unique info
      </text>
      <text x="175" y="273" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">
        • Coefficients are stable
      </text>
      <text x="175" y="289" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">
        • Standard errors are small
      </text>
      <text x="175" y="305" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">
        • Easy to interpret individual effects
      </text>
    </g>
    
    <!-- High Multicollinearity (Problem) -->
    <g transform="translate(450, 0)">
      <text x="175" y="0" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#e74c3c">
        High Multicollinearity (Problem)
      </text>
      <text x="175" y="20" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d" font-style="italic">
        Predictors are highly correlated
      </text>
      
      <!-- Venn diagram - overlapping circles -->
      <circle cx="145" cy="120" r="60" fill="#3498db" opacity="0.4" stroke="#2980b9" stroke-width="2"/>
      <circle cx="205" cy="120" r="60" fill="#e74c3c" opacity="0.4" stroke="#c0392b" stroke-width="2"/>
      
      <!-- Overlap region -->
      <path d="M 175 67 A 60 60 0 0 1 175 173 A 60 60 0 0 1 175 67" fill="#9b59b6" opacity="0.6"/>
      
      <text x="125" y="125" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2980b9">X₁</text>
      <text x="225" y="125" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#c0392b">X₂</text>
      <text x="175" y="125" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">Shared</text>
      
      <!-- Correlation indicator -->
      <text x="175" y="210" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#e74c3c">
        r(X₁, X₂) ≈ 0.9
      </text>
      
      <!-- Explanation -->
      <rect x="10" y="230" width="330" height="90" fill="#fadbd8" stroke="#e74c3c" stroke-width="2" rx="5"/>
      <text x="175" y="255" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#e74c3c" font-weight="bold">
        ✗ Predictors contain redundant info
      </text>
      <text x="175" y="273" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">
        • Coefficients become unstable
      </text>
      <text x="175" y="289" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">
        • Standard errors inflate dramatically
      </text>
      <text x="175" y="305" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">
        • Can't isolate individual effects
      </text>
    </g>
  </g>
  
  <!-- Middle section: Coefficient instability illustration -->
  <g transform="translate(50, 400)">
    <text x="400" y="0" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Impact on Coefficient Estimates
    </text>
    
    <!-- Sample 1 -->
    <g transform="translate(50, 30)">
      <rect x="0" y="0" width="180" height="60" fill="white" stroke="#95a5a6" stroke-width="2" rx="5"/>
      <text x="90" y="20" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#34495e">
        Sample 1
      </text>
      <text x="90" y="40" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">
        β₁ = 2.3, β₂ = 1.8
      </text>
    </g>
    
    <!-- Sample 2 -->
    <g transform="translate(270, 30)">
      <rect x="0" y="0" width="180" height="60" fill="white" stroke="#95a5a6" stroke-width="2" rx="5"/>
      <text x="90" y="20" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#34495e">
        Sample 2
      </text>
      <text x="90" y="40" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">
        β₁ = 4.1, β₂ = -0.5
      </text>
    </g>
    
    <!-- Sample 3 -->
    <g transform="translate(490, 30)">
      <rect x="0" y="0" width="180" height="60" fill="white" stroke="#95a5a6" stroke-width="2" rx="5"/>
      <text x="90" y="20" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#34495e">
        Sample 3
      </text>
      <text x="90" y="40" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">
        β₁ = 0.9, β₂ = 3.2
      </text>
    </g>
    
    <text x="400" y="120" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#e74c3c" font-style="italic">
      Small changes in data lead to wildly different coefficients!
    </text>
  </g>
  
  <!-- Bottom section: Detection and solutions -->
  <g transform="translate(50, 550)">
    <rect x="0" y="0" width="800" height="180" fill="white" stroke="#3498db" stroke-width="2" rx="8"/>
    
    <text x="400" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Detection and Solutions
    </text>
    
    <!-- Detection section -->
    <g transform="translate(30, 50)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#3498db">
        How to Detect:
      </text>
      
      <circle cx="5" cy="22" r="3" fill="#3498db"/>
      <text x="15" y="26" font-family="Arial, sans-serif" font-size="11" fill="#34495e">
        <tspan font-weight="bold">Variance Inflation Factor (VIF):</tspan> VIF &gt; 10 indicates problem
      </text>
      
      <circle cx="5" cy="45" r="3" fill="#3498db"/>
      <text x="15" y="49" font-family="Arial, sans-serif" font-size="11" fill="#34495e">
        <tspan font-weight="bold">Correlation matrix:</tspan> Look for |r| &gt; 0.8 between predictors
      </text>
      
      <circle cx="5" cy="68" r="3" fill="#3498db"/>
      <text x="15" y="72" font-family="Arial, sans-serif" font-size="11" fill="#34495e">
        <tspan font-weight="bold">Condition number:</tspan> κ &gt; 30 suggests multicollinearity
      </text>
      
      <circle cx="5" cy="91" r="3" fill="#3498db"/>
      <text x="15" y="95" font-family="Arial, sans-serif" font-size="11" fill="#34495e">
        <tspan font-weight="bold">Symptoms:</tspan> High R², but few significant coefficients
      </text>
    </g>
    
    <!-- Solutions section -->
    <g transform="translate(430, 50)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#27ae60">
        Solutions:
      </text>
      
      <circle cx="5" cy="22" r="3" fill="#27ae60"/>
      <text x="15" y="26" font-family="Arial, sans-serif" font-size="11" fill="#34495e">
        <tspan font-weight="bold">Remove variables:</tspan> Drop redundant predictors
      </text>
      
      <circle cx="5" cy="45" r="3" fill="#27ae60"/>
      <text x="15" y="49" font-family="Arial, sans-serif" font-size="11" fill="#34495e">
        <tspan font-weight="bold">Combine variables:</tspan> Create composite index
      </text>
      
      <circle cx="5" cy="68" r="3" fill="#27ae60"/>
      <text x="15" y="72" font-family="Arial, sans-serif" font-size="11" fill="#34495e">
        <tspan font-weight="bold">Regularization:</tspan> Ridge or Lasso regression
      </text>
      
      <circle cx="5" cy="91" r="3" fill="#27ae60"/>
      <text x="15" y="95" font-family="Arial, sans-serif" font-size="11" fill="#34495e">
        <tspan font-weight="bold">PCA:</tspan> Transform to uncorrelated components
      </text>
    </g>
  </g>
</svg>