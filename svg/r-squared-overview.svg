<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title-text { font-family: 'Arial', sans-serif; font-size: 24px; font-weight: bold; fill: #2c3e50; }
      .subtitle-text { font-family: 'Arial', sans-serif; font-size: 18px; font-weight: bold; fill: #34495e; }
      .label-text { font-family: 'Arial', sans-serif; font-size: 14px; fill: #34495e; }
      .small-text { font-family: 'Arial', sans-serif; font-size: 12px; fill: #7f8c8d; }
      .equation-text { font-family: 'Times New Roman', serif; font-size: 16px; fill: #2c3e50; }
      .concept-box { fill: #f8f9fa; stroke: #6c757d; stroke-width: 2; rx: 10; }
      .tss-box { fill: #ffe6e6; stroke: #dc3545; stroke-width: 2; rx: 8; }
      .rss-box { fill: #e6f3ff; stroke: #007bff; stroke-width: 2; rx: 8; }
      .r2-box { fill: #e6ffe6; stroke: #28a745; stroke-width: 2; rx: 8; }
      .arrow { stroke: #6c757d; stroke-width: 2; fill: #6c757d; }
      .flow-arrow { stroke: #007bff; stroke-width: 3; fill: #007bff; }
    </style>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title-text">R-Squared: Coefficient of Determination</text>
  
  <!-- Central concept -->
  <g transform="translate(250, 70)">
    <rect x="0" y="0" width="300" height="100" class="concept-box"/>
    <text x="150" y="30" text-anchor="middle" class="subtitle-text">R² Measures</text>
    <text x="150" y="55" text-anchor="middle" class="label-text">Proportion of Variance Explained</text>
    <text x="150" y="80" text-anchor="middle" class="equation-text">R² = 1 - RSS/TSS</text>
  </g>
  
  <!-- TSS (Total Sum of Squares) -->
  <g transform="translate(50, 220)">
    <rect x="0" y="0" width="200" height="120" class="tss-box"/>
    <text x="100" y="25" text-anchor="middle" class="subtitle-text" fill="#721c24">Total Sum of Squares</text>
    <text x="100" y="50" text-anchor="middle" class="equation-text">TSS = Σ(Yᵢ - Ȳ)²</text>
    <text x="20" y="75" class="small-text">• Total variation in Y</text>
    <text x="20" y="90" class="small-text">• Baseline comparison</text>
    <text x="20" y="105" class="small-text">• Null model performance</text>
  </g>
  
  <!-- RSS (Residual Sum of Squares) -->
  <g transform="translate(300, 220)">
    <rect x="0" y="0" width="200" height="120" class="rss-box"/>
    <text x="100" y="25" text-anchor="middle" class="subtitle-text" fill="#004085">Residual Sum of Squares</text>
    <text x="100" y="50" text-anchor="middle" class="equation-text">RSS = Σ(Yᵢ - Ŷᵢ)²</text>
    <text x="20" y="75" class="small-text">• Unexplained variation</text>
    <text x="20" y="90" class="small-text">• Prediction errors</text>
    <text x="20" y="105" class="small-text">• Model residuals</text>
  </g>
  
  <!-- R² Result -->
  <g transform="translate(550, 220)">
    <rect x="0" y="0" width="200" height="120" class="r2-box"/>
    <text x="100" y="25" text-anchor="middle" class="subtitle-text" fill="#155724">R² Value</text>
    <text x="100" y="50" text-anchor="middle" class="equation-text">0 ≤ R² ≤ 1</text>
    <text x="20" y="75" class="small-text">• Fraction explained</text>
    <text x="20" y="90" class="small-text">• Model quality measure</text>
    <text x="20" y="105" class="small-text">• Higher = better fit</text>
  </g>
  
  <!-- Arrows from central concept -->
  <g transform="translate(350, 170)">
    <!-- To TSS -->
    <path d="M -200 0 L -180 30 L -185 25 M -180 30 L -175 25" class="flow-arrow"/>
    <!-- To RSS -->
    <path d="M 0 0 L 0 30 L -5 25 M 0 30 L 5 25" class="flow-arrow"/>
    <!-- To R² -->
    <path d="M 200 0 L 180 30 L 185 25 M 180 30 L 175 25" class="flow-arrow"/>
  </g>
  
  <!-- Interpretation scale -->
  <g transform="translate(100, 380)">
    <text x="300" y="0" text-anchor="middle" class="subtitle-text">R² Interpretation Scale</text>
    
    <!-- Scale bar -->
    <rect x="50" y="20" width="500" height="30" fill="url(#gradient)" stroke="#333" stroke-width="1"/>
    
    <!-- Scale markers -->
    <line x1="50" y1="15" x2="50" y2="55" stroke="#333" stroke-width="2"/>
    <text x="50" y="70" text-anchor="middle" class="small-text">0.0</text>
    <text x="50" y="85" text-anchor="middle" class="small-text">Poor</text>
    
    <line x1="175" y1="15" x2="175" y2="55" stroke="#333" stroke-width="1"/>
    <text x="175" y="70" text-anchor="middle" class="small-text">0.25</text>
    <text x="175" y="85" text-anchor="middle" class="small-text">Weak</text>
    
    <line x1="300" y1="15" x2="300" y2="55" stroke="#333" stroke-width="1"/>
    <text x="300" y="70" text-anchor="middle" class="small-text">0.5</text>
    <text x="300" y="85" text-anchor="middle" class="small-text">Moderate</text>
    
    <line x1="425" y1="15" x2="425" y2="55" stroke="#333" stroke-width="1"/>
    <text x="425" y="70" text-anchor="middle" class="small-text">0.75</text>
    <text x="425" y="85" text-anchor="middle" class="small-text">Strong</text>
    
    <line x1="550" y1="15" x2="550" y2="55" stroke="#333" stroke-width="2"/>
    <text x="550" y="70" text-anchor="middle" class="small-text">1.0</text>
    <text x="550" y="85" text-anchor="middle" class="small-text">Perfect</text>
  </g>
  
  <!-- Key insights -->
  <g transform="translate(50, 480)">
    <rect x="0" y="0" width="700" height="100" class="concept-box"/>
    <text x="350" y="25" text-anchor="middle" class="subtitle-text">Key Insights</text>
    
    <text x="50" y="50" class="label-text">• R² = 0.75 means 75% of variation explained by model</text>
    <text x="50" y="70" class="label-text">• Higher R² indicates better model fit</text>
    <text x="50" y="90" class="label-text">• Context matters: good R² varies by field and application</text>
    
    <text x="400" y="50" class="label-text">• Always between 0 and 1 (inclusive)</text>
    <text x="400" y="70" class="label-text">• Independent of units of measurement</text>
    <text x="400" y="90" class="label-text">• Can be misleading without proper diagnostics</text>
  </g>
  
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#dc3545;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#ffc107;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fd7e14;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#20c997;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#28a745;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>