<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; text-anchor: middle; }
      .subtitle { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; }
      .label { font-family: Arial, sans-serif; font-size: 12px; text-anchor: middle; }
      .axis-label { font-family: Arial, sans-serif; font-size: 10px; text-anchor: middle; }
      .red-dot { fill: #E74C3C; stroke: #C0392B; stroke-width: 1; }
      .blue-dot { fill: #3498DB; stroke: #2980B9; stroke-width: 1; }
      .boundary { stroke: #2C3E50; stroke-width: 3; fill: none; }
      .grid-line { stroke: #BDC3C7; stroke-width: 0.5; opacity: 0.5; }
      .background { fill: #FAFAFA; stroke: #E5E7EB; stroke-width: 1; }
    </style>
  </defs>
  
  <!-- Title -->
  <text x="450" y="25" class="title">Decision Boundary Evolution with Increasing Hidden Neurons</text>
  
  <!-- 2 Neurons Plot -->
  <g id="plot-2-neurons">
    <text x="150" y="60" class="subtitle">2 Hidden Neurons</text>
    <rect x="50" y="80" width="200" height="160" class="background"/>
    
    <!-- Grid lines -->
    <line x1="50" y1="120" x2="250" y2="120" class="grid-line"/>
    <line x1="50" y1="160" x2="250" y2="160" class="grid-line"/>
    <line x1="50" y1="200" x2="250" y2="200" class="grid-line"/>
    <line x1="100" y1="80" x2="100" y2="240" class="grid-line"/>
    <line x1="150" y1="80" x2="150" y2="240" class="grid-line"/>
    <line x1="200" y1="80" x2="200" y2="240" class="grid-line"/>
    
    <!-- Axes -->
    <line x1="50" y1="240" x2="250" y2="240" stroke="#2C3E50" stroke-width="2"/>
    <line x1="50" y1="80" x2="50" y2="240" stroke="#2C3E50" stroke-width="2"/>
    
    <!-- Data points - Red (class 1) -->
    <circle cx="80" cy="100" r="3" class="red-dot"/>
    <circle cx="90" cy="110" r="3" class="red-dot"/>
    <circle cx="110" cy="95" r="3" class="red-dot"/>
    <circle cx="180" cy="105" r="3" class="red-dot"/>
    <circle cx="190" cy="115" r="3" class="red-dot"/>
    <circle cx="200" cy="100" r="3" class="red-dot"/>
    <circle cx="220" cy="110" r="3" class="red-dot"/>
    
    <!-- Data points - Blue (class 2) -->
    <circle cx="70" cy="200" r="3" class="blue-dot"/>
    <circle cx="85" cy="210" r="3" class="blue-dot"/>
    <circle cx="100" cy="190" r="3" class="blue-dot"/>
    <circle cx="120" cy="205" r="3" class="blue-dot"/>
    <circle cx="170" cy="195" r="3" class="blue-dot"/>
    <circle cx="185" cy="210" r="3" class="blue-dot"/>
    <circle cx="210" cy="200" r="3" class="blue-dot"/>
    
    <!-- Simple decision boundary -->
    <line x1="60" y1="150" x2="240" y2="155" class="boundary"/>
    
    <!-- Axis labels -->
    <text x="150" y="260" class="axis-label">Feature 1</text>
    <text x="30" y="165" class="axis-label" transform="rotate(-90, 30, 165)">Feature 2</text>
  </g>
  
  <!-- 10 Neurons Plot -->
  <g id="plot-10-neurons">
    <text x="450" y="60" class="subtitle">10 Hidden Neurons</text>
    <rect x="350" y="80" width="200" height="160" class="background"/>
    
    <!-- Grid lines -->
    <line x1="350" y1="120" x2="550" y2="120" class="grid-line"/>
    <line x1="350" y1="160" x2="550" y2="160" class="grid-line"/>
    <line x1="350" y1="200" x2="550" y2="200" class="grid-line"/>
    <line x1="400" y1="80" x2="400" y2="240" class="grid-line"/>
    <line x1="450" y1="80" x2="450" y2="240" class="grid-line"/>
    <line x1="500" y1="80" x2="500" y2="240" class="grid-line"/>
    
    <!-- Axes -->
    <line x1="350" y1="240" x2="550" y2="240" stroke="#2C3E50" stroke-width="2"/>
    <line x1="350" y1="80" x2="350" y2="240" stroke="#2C3E50" stroke-width="2"/>
    
    <!-- Data points - Red (class 1) -->
    <circle cx="380" cy="100" r="3" class="red-dot"/>
    <circle cx="390" cy="110" r="3" class="red-dot"/>
    <circle cx="410" cy="95" r="3" class="red-dot"/>
    <circle cx="480" cy="105" r="3" class="red-dot"/>
    <circle cx="490" cy="115" r="3" class="red-dot"/>
    <circle cx="500" cy="100" r="3" class="red-dot"/>
    <circle cx="520" cy="110" r="3" class="red-dot"/>
    
    <!-- Data points - Blue (class 2) -->
    <circle cx="370" cy="200" r="3" class="blue-dot"/>
    <circle cx="385" cy="210" r="3" class="blue-dot"/>
    <circle cx="400" cy="190" r="3" class="blue-dot"/>
    <circle cx="420" cy="205" r="3" class="blue-dot"/>
    <circle cx="470" cy="195" r="3" class="blue-dot"/>
    <circle cx="485" cy="210" r="3" class="blue-dot"/>
    <circle cx="510" cy="200" r="3" class="blue-dot"/>
    
    <!-- More complex decision boundary -->
    <path d="M 360,140 Q 400,130 420,145 Q 450,160 480,150 Q 510,140 540,155" class="boundary"/>
    
    <!-- Axis labels -->
    <text x="450" y="260" class="axis-label">Feature 1</text>
    <text x="330" y="165" class="axis-label" transform="rotate(-90, 330, 165)">Feature 2</text>
  </g>
  
  <!-- 100 Neurons Plot -->
  <g id="plot-100-neurons">
    <text x="750" y="60" class="subtitle">100 Hidden Neurons</text>
    <rect x="650" y="80" width="200" height="160" class="background"/>
    
    <!-- Grid lines -->
    <line x1="650" y1="120" x2="850" y2="120" class="grid-line"/>
    <line x1="650" y1="160" x2="850" y2="160" class="grid-line"/>
    <line x1="650" y1="200" x2="850" y2="200" class="grid-line"/>
    <line x1="700" y1="80" x2="700" y2="240" class="grid-line"/>
    <line x1="750" y1="80" x2="750" y2="240" class="grid-line"/>
    <line x1="800" y1="80" x2="800" y2="240" class="grid-line"/>
    
    <!-- Axes -->
    <line x1="650" y1="240" x2="850" y2="240" stroke="#2C3E50" stroke-width="2"/>
    <line x1="650" y1="80" x2="650" y2="240" stroke="#2C3E50" stroke-width="2"/>
    
    <!-- Data points - Red (class 1) -->
    <circle cx="680" cy="100" r="3" class="red-dot"/>
    <circle cx="690" cy="110" r="3" class="red-dot"/>
    <circle cx="710" cy="95" r="3" class="red-dot"/>
    <circle cx="780" cy="105" r="3" class="red-dot"/>
    <circle cx="790" cy="115" r="3" class="red-dot"/>
    <circle cx="800" cy="100" r="3" class="red-dot"/>
    <circle cx="820" cy="110" r="3" class="red-dot"/>
    
    <!-- Data points - Blue (class 2) -->
    <circle cx="670" cy="200" r="3" class="blue-dot"/>
    <circle cx="685" cy="210" r="3" class="blue-dot"/>
    <circle cx="700" cy="190" r="3" class="blue-dot"/>
    <circle cx="720" cy="205" r="3" class="blue-dot"/>
    <circle cx="770" cy="195" r="3" class="blue-dot"/>
    <circle cx="785" cy="210" r="3" class="blue-dot"/>
    <circle cx="810" cy="200" r="3" class="blue-dot"/>
    
    <!-- Very smooth decision boundary -->
    <path d="M 660,135 Q 680,125 700,140 Q 720,155 740,145 Q 760,135 780,150 Q 800,165 820,155 Q 835,145 840,150" class="boundary"/>
    
    <!-- Axis labels -->
    <text x="750" y="260" class="axis-label">Feature 1</text>
    <text x="630" y="165" class="axis-label" transform="rotate(-90, 630, 165)">Feature 2</text>
  </g>
  
  <!-- Hyperplane visualization -->
  <g id="hyperplane-demo">
    <text x="450" y="320" class="subtitle">Hyperplane Contribution Analysis</text>
    <rect x="100" y="340" width="700" height="180" class="background"/>
    
    <!-- Individual hyperplanes -->
    <line x1="120" y1="480" x2="220" y2="360" stroke="#E74C3C" stroke-width="2" opacity="0.6"/>
    <line x1="180" y1="480" x2="280" y2="350" stroke="#3498DB" stroke-width="2" opacity="0.6"/>
    <line x1="250" y1="490" x2="350" y2="340" stroke="#2ECC71" stroke-width="2" opacity="0.6"/>
    <line x1="320" y1="485" x2="420" y2="345" stroke="#F39C12" stroke-width="2" opacity="0.6"/>
    <line x1="400" y1="480" x2="500" y2="355" stroke="#9B59B6" stroke-width="2" opacity="0.6"/>
    <line x1="480" y1="490" x2="580" y2="340" stroke="#E67E22" stroke-width="2" opacity="0.6"/>
    <line x1="560" y1="485" x2="660" y2="350" stroke="#1ABC9C" stroke-width="2" opacity="0.6"/>
    <line x1="640" y1="480" x2="740" y2="360" stroke="#34495E" stroke-width="2" opacity="0.6"/>
    
    <!-- Combined boundary -->
    <path d="M 120,450 Q 200,420 280,440 Q 360,460 440,435 Q 520,415 600,445 Q 680,465 760,440" stroke="#2C3E50" stroke-width="4"/>
    
    <!-- Labels -->
    <text x="150" y="375" class="label">H₁</text>
    <text x="210" y="365" class="label">H₂</text>
    <text x="280" y="355" class="label">H₃</text>
    <text x="350" y="360" class="label">H₄</text>
    <text x="430" y="370" class="label">H₅</text>
    <text x="510" y="355" class="label">H₆</text>
    <text x="590" y="365" class="label">H₇</text>
    <text x="670" y="375" class="label">H₈</text>
    
    <text x="450" y="545" class="label">Individual Hyperplanes (colored lines) + Combined Decision Boundary (thick black)</text>
  </g>
  
  <!-- Summary Box -->
  <rect x="50" y="560" width="800" height="30" fill="#ECF0F1" stroke="#BDC3C7" stroke-width="1" rx="3"/>
  <text x="450" y="580" class="label">Evolution Pattern: Linear → Piecewise Linear → Smooth Complex → Risk of Overfitting</text>
</svg>