<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bayesGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Bayes' Theorem
  </text>
  
  <!-- Main Formula Box -->
  <g transform="translate(150, 80)">
    <rect x="0" y="0" width="500" height="120" rx="12" fill="url(#bayesGrad)" filter="url(#shadow)"/>
    
    <text x="250" y="35" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="white">
      Basic Form
    </text>
    
    <text x="250" y="75" font-family="Arial" font-size="32" font-weight="bold" text-anchor="middle" fill="white">
      P(B|A) = P(A|B) × P(B) / P(A)
    </text>
    
    <text x="250" y="105" font-family="Arial" font-size="14" text-anchor="middle" fill="#e0e6ff">
      Posterior = Likelihood × Prior / Evidence
    </text>
  </g>
  
  <!-- Component Breakdown -->
  <g transform="translate(50, 230)">
    <!-- Posterior -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="170" height="100" rx="8" fill="#3498db" fill-opacity="0.9" filter="url(#shadow)"/>
      <text x="85" y="30" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
        P(B|A)
      </text>
      <text x="85" y="50" font-family="Arial" font-size="14" text-anchor="middle" fill="white">
        Posterior
      </text>
      <text x="85" y="70" font-family="Arial" font-size="11" text-anchor="middle" fill="#e8f4fd">
        Updated belief
      </text>
      <text x="85" y="85" font-family="Arial" font-size="11" text-anchor="middle" fill="#e8f4fd">
        after evidence
      </text>
    </g>
    
    <!-- Likelihood -->
    <g transform="translate(210, 0)">
      <rect x="0" y="0" width="170" height="100" rx="8" fill="#e74c3c" fill-opacity="0.9" filter="url(#shadow)"/>
      <text x="85" y="30" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
        P(A|B)
      </text>
      <text x="85" y="50" font-family="Arial" font-size="14" text-anchor="middle" fill="white">
        Likelihood
      </text>
      <text x="85" y="70" font-family="Arial" font-size="11" text-anchor="middle" fill="#fdeaea">
        How likely is
      </text>
      <text x="85" y="85" font-family="Arial" font-size="11" text-anchor="middle" fill="#fdeaea">
        evidence given B
      </text>
    </g>
    
    <!-- Prior -->
    <g transform="translate(420, 0)">
      <rect x="0" y="0" width="170" height="100" rx="8" fill="#27ae60" fill-opacity="0.9" filter="url(#shadow)"/>
      <text x="85" y="30" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
        P(B)
      </text>
      <text x="85" y="50" font-family="Arial" font-size="14" text-anchor="middle" fill="white">
        Prior
      </text>
      <text x="85" y="70" font-family="Arial" font-size="11" text-anchor="middle" fill="#e8f8f5">
        Initial belief
      </text>
      <text x="85" y="85" font-family="Arial" font-size="11" text-anchor="middle" fill="#e8f8f5">
        before evidence
      </text>
    </g>
    
    <!-- Evidence -->
    <g transform="translate(630, 0)">
      <rect x="0" y="0" width="120" height="100" rx="8" fill="#f39c12" fill-opacity="0.9" filter="url(#shadow)"/>
      <text x="60" y="30" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
        P(A)
      </text>
      <text x="60" y="50" font-family="Arial" font-size="14" text-anchor="middle" fill="white">
        Evidence
      </text>
      <text x="60" y="70" font-family="Arial" font-size="11" text-anchor="middle" fill="#fef5e7">
        Marginal
      </text>
      <text x="60" y="85" font-family="Arial" font-size="11" text-anchor="middle" fill="#fef5e7">
        probability
      </text>
    </g>
  </g>
  
  <!-- Extended Form with Partition -->
  <g transform="translate(100, 370)">
    <rect x="-20" y="-10" width="640" height="100" rx="10" fill="#f4ecf7" stroke="#8e44ad" stroke-width="2"/>
    
    <text x="300" y="15" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#8e44ad">
      Extended Form (Law of Total Probability)
    </text>
    
    <text x="300" y="45" font-family="Arial" font-size="20" text-anchor="middle" fill="#2c3e50">
      P(Bⱼ|A) = P(A|Bⱼ) × P(Bⱼ) / Σᵢ P(A|Bᵢ) × P(Bᵢ)
    </text>
    
    <text x="300" y="70" font-family="Arial" font-size="12" text-anchor="middle" fill="#7f8c8d">
      Where B₁, B₂, ..., Bₙ form a partition of the sample space
    </text>
  </g>
  
  <!-- Applications -->
  <g transform="translate(50, 500)">
    <text x="0" y="0" font-family="Arial" font-size="18" font-weight="bold" fill="#34495e">
      Applications:
    </text>
    
    <g transform="translate(150, -10)">
      <!-- Medical -->
      <g transform="translate(0, 0)">
        <circle cx="20" cy="20" r="18" fill="#e74c3c" fill-opacity="0.2" stroke="#e74c3c" stroke-width="2"/>
        <text x="20" y="25" font-family="Arial" font-size="20" text-anchor="middle">🏥</text>
        <text x="20" y="50" font-family="Arial" font-size="11" text-anchor="middle" fill="#666">
          Medical
        </text>
        <text x="20" y="62" font-family="Arial" font-size="11" text-anchor="middle" fill="#666">
          Diagnosis
        </text>
      </g>
      
      <!-- Spam Filter -->
      <g transform="translate(100, 0)">
        <circle cx="20" cy="20" r="18" fill="#3498db" fill-opacity="0.2" stroke="#3498db" stroke-width="2"/>
        <text x="20" y="25" font-family="Arial" font-size="20" text-anchor="middle">📧</text>
        <text x="20" y="50" font-family="Arial" font-size="11" text-anchor="middle" fill="#666">
          Spam
        </text>
        <text x="20" y="62" font-family="Arial" font-size="11" text-anchor="middle" fill="#666">
          Filtering
        </text>
      </g>
      
      <!-- ML -->
      <g transform="translate(200, 0)">
        <circle cx="20" cy="20" r="18" fill="#9b59b6" fill-opacity="0.2" stroke="#9b59b6" stroke-width="2"/>
        <text x="20" y="25" font-family="Arial" font-size="20" text-anchor="middle">🤖</text>
        <text x="20" y="50" font-family="Arial" font-size="11" text-anchor="middle" fill="#666">
          Machine
        </text>
        <text x="20" y="62" font-family="Arial" font-size="11" text-anchor="middle" fill="#666">
          Learning
        </text>
      </g>
      
      <!-- Statistics -->
      <g transform="translate(300, 0)">
        <circle cx="20" cy="20" r="18" fill="#27ae60" fill-opacity="0.2" stroke="#27ae60" stroke-width="2"/>
        <text x="20" y="25" font-family="Arial" font-size="20" text-anchor="middle">📊</text>
        <text x="20" y="50" font-family="Arial" font-size="11" text-anchor="middle" fill="#666">
          Statistical
        </text>
        <text x="20" y="62" font-family="Arial" font-size="11" text-anchor="middle" fill="#666">
          Inference
        </text>
      </g>
      
      <!-- Finance -->
      <g transform="translate(400, 0)">
        <circle cx="20" cy="20" r="18" fill="#f39c12" fill-opacity="0.2" stroke="#f39c12" stroke-width="2"/>
        <text x="20" y="25" font-family="Arial" font-size="20" text-anchor="middle">💰</text>
        <text x="20" y="50" font-family="Arial" font-size="11" text-anchor="middle" fill="#666">
          Risk
        </text>
        <text x="20" y="62" font-family="Arial" font-size="11" text-anchor="middle" fill="#666">
          Analysis
        </text>
      </g>
    </g>
  </g>
</svg>