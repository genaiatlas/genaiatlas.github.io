<svg width="900" height="700" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="900" height="700" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">Non-Parametric Tests Comparison</text>
  
  <!-- Subtitle -->
  <text x="450" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#666">Distribution-free alternatives to parametric tests</text>
  
  <!-- Mann-Whitney U Test -->
  <rect x="50" y="80" width="380" height="180" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="10"/>
  <text x="240" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1976d2">Mann-Whitney U Test</text>
  
  <text x="240" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Alternative to: Independent t-test</text>
  <text x="240" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">Compares medians of two independent groups</text>
  
  <text x="70" y="175" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Use when:</text>
  <text x="70" y="190" font-family="Arial, sans-serif" font-size="11" fill="#333">• Data not normally distributed</text>
  <text x="70" y="205" font-family="Arial, sans-serif" font-size="11" fill="#333">• Ordinal data</text>
  <text x="70" y="220" font-family="Arial, sans-serif" font-size="11" fill="#333">• Small sample sizes</text>
  
  <text x="250" y="175" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Test statistic:</text>
  <text x="250" y="190" font-family="Arial, sans-serif" font-size="11" fill="#333">U = n₁×n₂ + n₁(n₁+1)/2 - R₁</text>
  <text x="250" y="205" font-family="Arial, sans-serif" font-size="11" fill="#333">R₁ = sum of ranks for group 1</text>
  
  <!-- Wilcoxon Tests -->
  <rect x="470" y="80" width="380" height="180" fill="#fff3e0" stroke="#f57c00" stroke-width="2" rx="10"/>
  <text x="660" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#f57c00">Wilcoxon Tests</text>
  
  <text x="490" y="130" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Signed-Rank Test:</text>
  <text x="490" y="145" font-family="Arial, sans-serif" font-size="12" fill="#333">• Alternative to paired t-test</text>
  <text x="490" y="160" font-family="Arial, sans-serif" font-size="12" fill="#333">• Tests paired differences</text>
  
  <text x="490" y="180" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Rank-Sum Test:</text>
  <text x="490" y="195" font-family="Arial, sans-serif" font-size="12" fill="#333">• Alternative to independent t-test</text>
  <text x="490" y="210" font-family="Arial, sans-serif" font-size="12" fill="#333">• Equivalent to Mann-Whitney U</text>
  <text x="490" y="225" font-family="Arial, sans-serif" font-size="12" fill="#333">• Compares two groups</text>
  
  <!-- Kruskal-Wallis Test -->
  <rect x="260" y="280" width="380" height="180" fill="#e8f5e8" stroke="#4caf50" stroke-width="2" rx="10"/>
  <text x="450" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#4caf50">Kruskal-Wallis Test</text>
  
  <text x="450" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Alternative to: One-way ANOVA</text>
  <text x="450" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">Compares three or more independent groups</text>
  
  <text x="280" y="375" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Test statistic:</text>
  <text x="280" y="390" font-family="Arial, sans-serif" font-size="11" fill="#333">H = (12/N(N+1)) × Σ(Rᵢ²/nᵢ) - 3(N+1)</text>
  <text x="280" y="405" font-family="Arial, sans-serif" font-size="11" fill="#333">N = total sample size</text>
  <text x="280" y="420" font-family="Arial, sans-serif" font-size="11" fill="#333">Rᵢ = sum of ranks for group i</text>
  
  <text x="280" y="440" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Post-hoc: Dunn's test</text>
  
  <!-- Advantages and Disadvantages -->
  <text x="450" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">Advantages vs Disadvantages</text>
  
  <!-- Advantages -->
  <rect x="50" y="510" width="380" height="140" fill="#e8f5e8" stroke="#4caf50" stroke-width="2" rx="10"/>
  <text x="240" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#4caf50">Advantages</text>
  
  <text x="70" y="555" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">• Distribution-free:</text>
  <text x="190" y="555" font-family="Arial, sans-serif" font-size="12" fill="#333">No normality assumptions</text>
  
  <text x="70" y="575" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">• Robust:</text>
  <text x="125" y="575" font-family="Arial, sans-serif" font-size="12" fill="#333">Less sensitive to outliers</text>
  
  <text x="70" y="595" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">• Flexible:</text>
  <text x="130" y="595" font-family="Arial, sans-serif" font-size="12" fill="#333">Work with ordinal data</text>
  
  <text x="70" y="615" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">• Small samples:</text>
  <text x="170" y="615" font-family="Arial, sans-serif" font-size="12" fill="#333">Often more appropriate</text>
  
  <text x="70" y="635" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">• Few assumptions:</text>
  <text x="180" y="635" font-family="Arial, sans-serif" font-size="12" fill="#333">Easier to satisfy</text>
  
  <!-- Disadvantages -->
  <rect x="470" y="510" width="380" height="140" fill="#ffebee" stroke="#f44336" stroke-width="2" rx="10"/>
  <text x="660" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#f44336">Disadvantages</text>
  
  <text x="490" y="555" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">• Less powerful:</text>
  <text x="580" y="555" font-family="Arial, sans-serif" font-size="12" fill="#333">Lower statistical power</text>
  
  <text x="490" y="575" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">• Information loss:</text>
  <text x="595" y="575" font-family="Arial, sans-serif" font-size="12" fill="#333">Convert to ranks</text>
  
  <text x="490" y="595" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">• Interpretation:</text>
  <text x="575" y="595" font-family="Arial, sans-serif" font-size="12" fill="#333">About ranks, not means</text>
  
  <text x="490" y="615" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">• Still assumptions:</text>
  <text x="590" y="615" font-family="Arial, sans-serif" font-size="12" fill="#333">Independence required</text>
  
  <text x="490" y="635" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">• Effect sizes:</text>
  <text x="570" y="635" font-family="Arial, sans-serif" font-size="12" fill="#333">Less familiar measures</text>
  
  <!-- Decision Rule -->
  <rect x="150" y="670" width="600" height="25" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2" rx="5"/>
  <text x="450" y="687" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#9c27b0">Choose non-parametric when assumptions of parametric tests are violated</text>
</svg>