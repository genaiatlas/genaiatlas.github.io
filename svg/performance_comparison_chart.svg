<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="800" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="600" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">Performance Comparison: Individual Trees vs Bagging Ensemble</text>
  
  <!-- Accuracy Comparison Chart -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="500" height="350" fill="#fff" stroke="#e0e0e0" stroke-width="2" rx="10"/>
    <text x="250" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">Classification Accuracy</text>
    
    <!-- Y-axis -->
    <line x1="50" y1="50" x2="50" y2="300" stroke="#424242" stroke-width="2"/>
    <text x="25" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#424242">100%</text>
    <text x="25" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#424242">80%</text>
    <text x="25" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#424242">60%</text>
    <text x="25" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#424242">40%</text>
    <text x="25" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#424242">20%</text>
    <text x="25" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#424242">0%</text>
    
    <!-- X-axis -->
    <line x1="50" y1="300" x2="450" y2="300" stroke="#424242" stroke-width="2"/>
    
    <!-- Grid lines -->
    <g stroke="#e0e0e0" stroke-width="1" opacity="0.5">
      <line x1="50" y1="80" x2="450" y2="80"/>
      <line x1="50" y1="125" x2="450" y2="125"/>
      <line x1="50" y1="170" x2="450" y2="170"/>
      <line x1="50" y1="215" x2="450" y2="215"/>
      <line x1="50" y1="260" x2="450" y2="260"/>
    </g>
    
    <!-- Tree 1 Bar -->
    <rect x="80" y="215" width="60" height="85" fill="#ff7043" stroke="#e64a19"/>
    <text x="110" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#424242">Tree 1</text>
    <text x="110" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#424242">(Type)</text>
    <text x="110" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ff7043">67%</text>
    
    <!-- Tree 2 Bar -->
    <rect x="160" y="170" width="60" height="130" fill="#66bb6a" stroke="#43a047"/>
    <text x="190" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#424242">Tree 2</text>
    <text x="190" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#424242">(Hungry)</text>
    <text x="190" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#66bb6a">83%</text>
    
    <!-- Tree 3 Bar -->
    <rect x="240" y="192" width="60" height="108" fill="#42a5f5" stroke="#1e88e5"/>
    <text x="270" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#424242">Tree 3</text>
    <text x="270" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#424242">(Rain)</text>
    <text x="270" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#42a5f5">75%</text>
    
    <!-- Ensemble Bar -->
    <rect x="340" y="185" width="80" height="115" fill="#9c27b0" stroke="#7b1fa2"/>
    <text x="380" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#424242">Bagging</text>
    <text x="380" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#424242">Ensemble</text>
    <text x="380" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#9c27b0">75%</text>
    
    <!-- Legend -->
    <g transform="translate(60, 60)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="10" fill="#424242">9/12 correct = 75%</text>
    </g>
  </g>
  
  <!-- Error Analysis Chart -->
  <g transform="translate(600, 80)">
    <rect x="0" y="0" width="550" height="350" fill="#fff" stroke="#e0e0e0" stroke-width="2" rx="10"/>
    <text x="275" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">Error Analysis and Variance Reduction</text>
    
    <!-- Bias-Variance Decomposition -->
    <g transform="translate(20, 50)">
      <text x="0" y="15" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#424242">Bias-Variance Trade-off</text>
      
      <!-- Individual Tree -->
      <g transform="translate(0, 40)">
        <rect x="0" y="0" width="240" height="120" fill="#ffebee" stroke="#f44336" rx="5"/>
        <text x="120" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f44336">Individual Decision Tree</text>
        
        <g transform="translate(20, 30)">
          <text x="0" y="20" font-family="Arial, sans-serif" font-size="10" fill="#424242">High Variance</text>
          <text x="0" y="35" font-family="Arial, sans-serif" font-size="10" fill="#424242">Low Bias</text>
          <text x="0" y="50" font-family="Arial, sans-serif" font-size="10" fill="#424242">Prone to overfitting</text>
          <text x="0" y="65" font-family="Arial, sans-serif" font-size="10" fill="#424242">Sensitive to training data</text>
          <text x="0" y="80" font-family="Arial, sans-serif" font-size="10" fill="#424242">Poor generalization</text>
        </g>
      </g>
      
      <!-- Bagging Ensemble -->
      <g transform="translate(270, 40)">
        <rect x="0" y="0" width="240" height="120" fill="#e8f5e8" stroke="#27ae60" rx="5"/>
        <text x="120" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#27ae60">Bagging Ensemble</text>
        
        <g transform="translate(20, 30)">
          <text x="0" y="20" font-family="Arial, sans-serif" font-size="10" fill="#424242">Reduced Variance</text>
          <text x="0" y="35" font-family="Arial, sans-serif" font-size="10" fill="#424242">Same Bias</text>
          <text x="0" y="50" font-family="Arial, sans-serif" font-size="10" fill="#424242">Less overfitting</text>
          <text x="0" y="65" font-family="Arial, sans-serif" font-size="10" fill="#424242">Stable predictions</text>
          <text x="0" y="80" font-family="Arial, sans-serif" font-size="10" fill="#424242">Better generalization</text>
        </g>
      </g>
      
      <!-- Variance Reduction Formula -->
      <g transform="translate(0, 180)">
        <rect x="0" y="0" width="510" height="80" fill="#f5f5f5" stroke="#9e9e9e" rx="5"/>
        <text x="20" y="20" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#424242">Variance Reduction Formula:</text>
        <text x="20" y="40" font-family="Arial, sans-serif" font-size="11" fill="#424242">Var(ensemble) = (1/m²) × Sum(Var(hi)) + (1/m²) × Sum(Cov(hi,hj))</text>
        <text x="20" y="55" font-family="Arial, sans-serif" font-size="11" fill="#424242">For independent models with variance sigma²:</text>
        <text x="20" y="70" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#27ae60">Var(ensemble) = sigma²/m (Variance decreases by factor of m)</text>
      </g>
    </g>
  </g>
  
  <!-- Performance Metrics Table -->
  <g transform="translate(50, 480)">
    <rect x="0" y="0" width="1100" height="250" fill="#fff" stroke="#e0e0e0" stroke-width="2" rx="10"/>
    <text x="550" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">Detailed Performance Metrics</text>
    
    <!-- Table Header -->
    <rect x="20" y="50" width="1060" height="30" fill="#3f51b5" rx="5"/>
    <text x="40" y="70" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Model</text>
    <text x="150" y="70" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Split Feature</text>
    <text x="280" y="70" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Training Loss</text>
    <text x="400" y="70" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Test Accuracy</text>
    <text x="520" y="70" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Precision</text>
    <text x="640" y="70" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Recall</text>
    <text x="760" y="70" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">F1-Score</text>
    <text x="880" y="70" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Interpretability</text>
    <text x="1000" y="70" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Speed</text>
    
    <!-- Tree 1 Row -->
    <rect x="20" y="80" width="1060" height="25" fill="#ffebee" rx="3"/>
    <text x="40" y="97" font-family="Arial, sans-serif" font-size="11" fill="#424242">Tree 1</text>
    <text x="150" y="97" font-family="Arial, sans-serif" font-size="11" fill="#424242">Type</text>
    <text x="280" y="97" font-family="Arial, sans-serif" font-size="11" fill="#424242">0.55</text>
    <text x="400" y="97" font-family="Arial, sans-serif" font-size="11" fill="#424242">67%</text>
    <text x="520" y="97" font-family="Arial, sans-serif" font-size="11" fill="#424242">0.65</text>
    <text x="640" y="97" font-family="Arial, sans-serif" font-size="11" fill="#424242">0.70</text>
    <text x="760" y="97" font-family="Arial, sans-serif" font-size="11" fill="#424242">0.67</text>
    <text x="880" y="97" font-family="Arial, sans-serif" font-size="11" fill="#27ae60">High</text>
    <text x="1000" y="97" font-family="Arial, sans-serif" font-size="11" fill="#27ae60">Fast</text>
    
    <!-- Tree 2 Row -->
    <rect x="20" y="105" width="1060" height="25" fill="#e8f5e8" rx="3"/>
    <text x="40" y="122" font-family="Arial, sans-serif" font-size="11" fill="#424242">Tree 2</text>
    <text x="150" y="122" font-family="Arial, sans-serif" font-size="11" fill="#424242">Hungry</text>
    <text x="280" y="122" font-family="Arial, sans-serif" font-size="11" fill="#424242">0.0</text>
    <text x="400" y="122" font-family="Arial, sans-serif" font-size="11" fill="#424242">83%</text>
    <text x="520" y="122" font-family="Arial, sans-serif" font-size="11" fill="#424242">0.80</text>
    <text x="640" y="122" font-family="Arial, sans-serif" font-size="11" fill="#424242">0.85</text>
    <text x="760" y="122" font-family="Arial, sans-serif" font-size="11" fill="#424242">0.82</text>
    <text x="880" y="122" font-family="Arial, sans-serif" font-size="11" fill="#27ae60">High</text>
    <text x="1000" y="122" font-family="Arial, sans-serif" font-size="11" fill="#27ae60">Fast</text>
    
    <!-- Tree 3 Row -->
    <rect x="20" y="130" width="1060" height="25" fill="#e3f2fd" rx="3"/>
    <text x="40" y="147" font-family="Arial, sans-serif" font-size="11" fill="#424242">Tree 3</text>
    <text x="150" y="147" font-family="Arial, sans-serif" font-size="11" fill="#424242">Rain</text>
    <text x="280" y="147" font-family="Arial, sans-serif" font-size="11" fill="#424242">0.4</text>
    <text x="400" y="147" font-family="Arial, sans-serif" font-size="11" fill="#424242">75%</text>
    <text x="520" y="147" font-family="Arial, sans-serif" font-size="11" fill="#424242">0.72</text>
    <text x="640" y="147" font-family="Arial, sans-serif" font-size="11" fill="#424242">0.78</text>
    <text x="760" y="147" font-family="Arial, sans-serif" font-size="11" fill="#424242">0.75</text>
    <text x="880" y="147" font-family="Arial, sans-serif" font-size="11" fill="#27ae60">High</text>
    <text x="1000" y="147" font-family="Arial, sans-serif" font-size="11" fill="#27ae60">Fast</text>
    
    <!-- Ensemble Row -->
    <rect x="20" y="155" width="1060" height="30" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2" rx="3"/>
    <text x="40" y="175" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#9c27b0">Bagging Ensemble</text>
    <text x="150" y="175" font-family="Arial, sans-serif" font-size="11" fill="#424242">Majority Vote</text>
    <text x="280" y="175" font-family="Arial, sans-serif" font-size="11" fill="#424242">N/A</text>
    <text x="400" y="175" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#9c27b0">75%</text>
    <text x="520" y="175" font-family="Arial, sans-serif" font-size="11" fill="#424242">0.73</text>
    <text x="640" y="175" font-family="Arial, sans-serif" font-size="11" fill="#424242">0.77</text>
    <text x="760" y="175" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#9c27b0">0.75</text>
    <text x="880" y="175" font-family="Arial, sans-serif" font-size="11" fill="#ff9800">Medium</text>
    <text x="1000" y="175" font-family="Arial, sans-serif" font-size="11" fill="#ff9800">Medium</text>
    
    <!-- Key Insights -->
    <g transform="translate(20, 210)">
      <text x="0" y="15" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#424242">Key Insights:</text>
      <text x="0" y="35" font-family="Arial, sans-serif" font-size="11" fill="#424242">Ensemble achieves consistent 75% accuracy despite individual tree variation (67% to 83%)</text>
      <text x="0" y="50" font-family="Arial, sans-serif" font-size="11" fill="#424242">More robust than any single tree and reduces risk of poor performance</text>
    </g>
  </g>
  
  <!-- Complexity Analysis -->
  <g transform="translate(50, 750)">
    <rect x="0" y="0" width="1100" height="40" fill="#fff" stroke="#9e9e9e" stroke-width="1" rx="5" stroke-dasharray="5,5"/>
    <text x="20" y="20" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#424242">Computational Complexity:</text>
    <text x="200" y="20" font-family="Arial, sans-serif" font-size="11" fill="#424242">Training: O(m × n × log n × d) where m=trees, n=samples, d=features</text>
    <text x="650" y="20" font-family="Arial, sans-serif" font-size="11" fill="#424242">Prediction: O(m × log n)</text>
    <text x="20" y="35" font-family="Arial, sans-serif" font-size="11" fill="#424242">Space: O(m × tree_size) Linear increase with number of trees</text>
    <text x="450" y="35" font-family="Arial, sans-serif" font-size="11" fill="#424242">Parallelizable: Trees can be trained and evaluated independently</text>
  </g>
</svg>