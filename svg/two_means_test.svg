<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', sans-serif; font-size: 18px; font-weight: bold; fill: #2c3e50; }
      .header { font-family: 'Segoe UI', sans-serif; font-size: 14px; font-weight: bold; fill: #34495e; }
      .text { font-family: 'Segoe UI', sans-serif; font-size: 11px; fill: #2c3e50; }
      .small-text { font-family: 'Segoe UI', sans-serif; font-size: 9px; fill: #7f8c8d; }
      .math { font-family: 'Times New Roman', serif; font-size: 12px; fill: #8e44ad; }
      .box { fill: #ecf0f1; stroke: #34495e; stroke-width: 2; }
      .formula-box { fill: #fff2cc; stroke: #d6b656; stroke-width: 2; }
      .pooled-box { fill: #d5e8d4; stroke: #82b366; stroke-width: 2; }
      .separate-box { fill: #f8cecc; stroke: #b85450; stroke-width: 2; }
      .comparison-box { fill: #e1d5e7; stroke: #9673a6; stroke-width: 2; }
    </style>
  </defs>

  <!-- Title -->
  <text x="400" y="25" class="title" text-anchor="middle">Test for Equality of Two Population Means</text>

  <!-- Purpose and Hypotheses -->
  <rect x="50" y="40" width="700" height="60" class="box" rx="8"/>
  <text x="400" y="60" class="header" text-anchor="middle">Purpose: Compare means between two independent populations</text>
  <text x="70" y="80" class="math">H₀: μ₁ = μ₂  (or equivalently, μ₁ - μ₂ = 0)</text>
  <text x="70" y="95" class="math">H₁: μ₁ ≠ μ₂  (two-tailed)  or  μ₁ &gt; μ₂  (right-tailed)  or  μ₁ &lt; μ₂  (left-tailed)</text>

  <!-- Pooled Variance Method -->
  <rect x="50" y="120" width="350" height="140" class="pooled-box" rx="8"/>
  <text x="225" y="140" class="header" text-anchor="middle">Equal Variances (Pooled Method)</text>
  
  <text x="70" y="160" class="text">When σ₁² = σ₂² (variances assumed equal):</text>
  
  <text x="70" y="180" class="math">t = (X̄₁ - X̄₂)/√(s²ₚ(1/n₁ + 1/n₂))</text>
  
  <text x="70" y="200" class="text">Pooled variance:</text>
  <text x="70" y="215" class="math">s²ₚ = [(n₁-1)s₁² + (n₂-1)s₂²]/(n₁+n₂-2)</text>
  
  <text x="70" y="235" class="text">Degrees of freedom: df = n₁ + n₂ - 2</text>
  <text x="70" y="250" class="small-text">Use when F-test suggests equal variances</text>

  <!-- Separate Variance Method (Welch's) -->
  <rect x="420" y="120" width="330" height="140" class="separate-box" rx="8"/>
  <text x="585" y="140" class="header" text-anchor="middle">Unequal Variances (Welch's t-test)</text>
  
  <text x="440" y="160" class="text">When σ₁² ≠ σ₂² (variances not assumed equal):</text>
  
  <text x="440" y="180" class="math">t = (X̄₁ - X̄₂)/√(s₁²/n₁ + s₂²/n₂)</text>
  
  <text x="440" y="200" class="text">Welch-Satterthwaite df:</text>
  <text x="440" y="215" class="math">df = (s₁²/n₁ + s₂²/n₂)²/[(s₁²/n₁)²/(n₁-1) + (s₂²/n₂)²/(n₂-1)]</text>
  
  <text x="440" y="235" class="small-text">More robust, default choice when uncertain</text>
  <text x="440" y="250" class="small-text">about variance equality</text>

  <!-- Testing Variance Equality -->
  <rect x="50" y="280" width="700" height="80" class="formula-box" rx="8"/>
  <text x="400" y="300" class="header" text-anchor="middle">Testing for Equal Variances (F-test)</text>
  
  <text x="70" y="320" class="math">F = s₁²/s₂²  (larger variance in numerator)</text>
  <text x="400" y="320" class="text">with df₁ = n₁-1, df₂ = n₂-1</text>
  
  <text x="70" y="340" class="text">Decision: If F &gt; F_{α/2,df₁,df₂}, reject equal variance assumption and use Welch's test</text>
  <text x="70" y="355" class="text">Otherwise, variances can be considered equal and pooled method is appropriate</text>

  <!-- Comparison and Guidelines -->
  <rect x="50" y="380" width="700" height="100" class="comparison-box" rx="8"/>
  <text x="400" y="400" class="header" text-anchor="middle">Method Selection Guidelines</text>
  
  <text x="70" y="420" class="text">Use Pooled Variance When:</text>
  <text x="90" y="435" class="small-text">• F-test suggests equal variances  • Sample sizes approximately equal  • Similar-looking sample variances</text>
  
  <text x="400" y="420" class="text">Use Separate Variance (Welch's) When:</text>
  <text x="420" y="435" class="small-text">• F-test suggests unequal variances  • Very different sample sizes  • Uncertain about variance equality</text>
  
  <text x="70" y="455" class="text">⚠️ Welch's t-test is generally more robust and is often the default choice in statistical software</text>
  <text x="70" y="470" class="text">📊 Results are often similar for large, equal sample sizes regardless of method chosen</text>

</svg>