<svg viewBox="0 0 1100 750" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="550" y="35" font-size="26" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Speech Recognition with HMM
  </text>
  
  <!-- Background -->
  <rect x="50" y="60" width="1000" height="650" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2" rx="10"/>
  
  <!-- Example Sentence Section -->
  <rect x="70" y="80" width="960" height="70" fill="#e8eaf6" stroke="#5C6BC0" stroke-width="2" rx="8"/>
  <text x="550" y="105" font-size="18" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Example: "I like cats"
  </text>
  <text x="550" y="132" font-size="14" text-anchor="middle" fill="#546e7a">
    Goal: Convert audio waveform to text sequence
  </text>
  
  <!-- Hidden States (Words) -->
  <text x="80" y="185" font-size="18" font-weight="bold" fill="#2c3e50">Hidden States: Spoken Words</text>
  <rect x="70" y="200" width="960" height="160" fill="#e3f2fd" stroke="#2196F3" stroke-width="2" rx="8"/>
  
  <!-- Word Nodes -->
  <g id="word1">
    <rect x="130" y="230" width="120" height="80" fill="#2196F3" stroke="#1565C0" stroke-width="3" rx="8"/>
    <text x="190" y="258" font-size="18" font-weight="bold" text-anchor="middle" fill="white">X₁</text>
    <text x="190" y="283" font-size="16" text-anchor="middle" fill="white">"I"</text>
    <text x="190" y="302" font-size="11" text-anchor="middle" fill="#e3f2fd">Word 1</text>
  </g>
  
  <g id="word2">
    <rect x="340" y="230" width="120" height="80" fill="#2196F3" stroke="#1565C0" stroke-width="3" rx="8"/>
    <text x="400" y="258" font-size="18" font-weight="bold" text-anchor="middle" fill="white">X₂</text>
    <text x="400" y="283" font-size="16" text-anchor="middle" fill="white">"like"</text>
    <text x="400" y="302" font-size="11" text-anchor="middle" fill="#e3f2fd">Word 2</text>
  </g>
  
  <g id="word3">
    <rect x="550" y="230" width="120" height="80" fill="#2196F3" stroke="#1565C0" stroke-width="3" rx="8"/>
    <text x="610" y="258" font-size="18" font-weight="bold" text-anchor="middle" fill="white">X₃</text>
    <text x="610" y="283" font-size="16" text-anchor="middle" fill="white">"cats"</text>
    <text x="610" y="302" font-size="11" text-anchor="middle" fill="#e3f2fd">Word 3</text>
  </g>
  
  <!-- Dots -->
  <circle cx="730" cy="270" r="4" fill="#1565C0"/>
  <circle cx="755" cy="270" r="4" fill="#1565C0"/>
  <circle cx="780" cy="270" r="4" fill="#1565C0"/>
  
  <g id="wordt">
    <rect x="820" y="230" width="120" height="80" fill="#2196F3" stroke="#1565C0" stroke-width="3" rx="8"/>
    <text x="880" y="258" font-size="18" font-weight="bold" text-anchor="middle" fill="white">Xₜ</text>
    <text x="880" y="283" font-size="16" text-anchor="middle" fill="white">"word"</text>
    <text x="880" y="302" font-size="11" text-anchor="middle" fill="#e3f2fd">Word t</text>
  </g>
  
  <!-- Transition Arrows between words -->
  <defs>
    <marker id="arrow1" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/>
    </marker>
  </defs>
  
  <path d="M 250 270 L 340 270" stroke="#1565C0" stroke-width="3" fill="none" marker-end="url(#arrow1)"/>
  <text x="295" y="260" font-size="12" font-weight="bold" fill="#1565C0">P(like|I)</text>
  
  <path d="M 460 270 L 550 270" stroke="#1565C0" stroke-width="3" fill="none" marker-end="url(#arrow1)"/>
  <text x="505" y="260" font-size="12" font-weight="bold" fill="#1565C0">P(cats|like)</text>
  
  <path d="M 670 270 L 705 270" stroke="#1565C0" stroke-width="3" fill="none" marker-end="url(#arrow1)"/>
  <path d="M 805 270 L 820 270" stroke="#1565C0" stroke-width="3" fill="none" marker-end="url(#arrow1)"/>
  
  <!-- Observations (Audio Waveforms) -->
  <text x="80" y="405" font-size="18" font-weight="bold" fill="#2c3e50">Observations: Audio Waveforms</text>
  <rect x="70" y="420" width="960" height="160" fill="#fff3e0" stroke="#FF9800" stroke-width="2" rx="8"/>
  
  <!-- Waveform representations -->
  <g id="waveform1">
    <rect x="130" y="450" width="120" height="80" fill="#FF9800" stroke="#F57C00" stroke-width="3" rx="8"/>
    <text x="190" y="475" font-size="18" font-weight="bold" text-anchor="middle" fill="white">Y₁</text>
    <path d="M 145 495 Q 155 485 165 495 T 185 495 T 205 495 T 225 495" stroke="white" stroke-width="2" fill="none"/>
    <text x="190" y="520" font-size="11" text-anchor="middle" fill="#fff3e0">Audio /aɪ/</text>
  </g>
  
  <g id="waveform2">
    <rect x="340" y="450" width="120" height="80" fill="#FF9800" stroke="#F57C00" stroke-width="3" rx="8"/>
    <text x="400" y="475" font-size="18" font-weight="bold" text-anchor="middle" fill="white">Y₂</text>
    <path d="M 355 495 Q 365 485 375 495 T 395 495 T 415 495 T 435 495" stroke="white" stroke-width="2" fill="none"/>
    <text x="400" y="520" font-size="11" text-anchor="middle" fill="#fff3e0">Audio /laɪk/</text>
  </g>
  
  <g id="waveform3">
    <rect x="550" y="450" width="120" height="80" fill="#FF9800" stroke="#F57C00" stroke-width="3" rx="8"/>
    <text x="610" y="475" font-size="18" font-weight="bold" text-anchor="middle" fill="white">Y₃</text>
    <path d="M 565 495 Q 575 485 585 495 T 605 495 T 625 495 T 645 495" stroke="white" stroke-width="2" fill="none"/>
    <text x="610" y="520" font-size="11" text-anchor="middle" fill="#fff3e0">Audio /kæts/</text>
  </g>
  
  <!-- Dots -->
  <circle cx="730" cy="490" r="4" fill="#F57C00"/>
  <circle cx="755" cy="490" r="4" fill="#F57C00"/>
  <circle cx="780" cy="490" r="4" fill="#F57C00"/>
  
  <g id="waveformt">
    <rect x="820" y="450" width="120" height="80" fill="#FF9800" stroke="#F57C00" stroke-width="3" rx="8"/>
    <text x="880" y="475" font-size="18" font-weight="bold" text-anchor="middle" fill="white">Yₜ</text>
    <path d="M 835 495 Q 845 485 855 495 T 875 495 T 895 495 T 915 495" stroke="white" stroke-width="2" fill="none"/>
    <text x="880" y="520" font-size="11" text-anchor="middle" fill="#fff3e0">Audio signal</text>
  </g>
  
  <!-- Emission Arrows -->
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#F57C00"/>
    </marker>
  </defs>
  
  <path d="M 190 310 L 190 450" stroke="#F57C00" stroke-width="2.5" fill="none" marker-end="url(#arrow2)" stroke-dasharray="5,5"/>
  <text x="205" y="385" font-size="11" font-weight="bold" fill="#F57C00">P(Y₁|"I")</text>
  
  <path d="M 400 310 L 400 450" stroke="#F57C00" stroke-width="2.5" fill="none" marker-end="url(#arrow2)" stroke-dasharray="5,5"/>
  <text x="415" y="385" font-size="11" font-weight="bold" fill="#F57C00">P(Y₂|"like")</text>
  
  <path d="M 610 310 L 610 450" stroke="#F57C00" stroke-width="2.5" fill="none" marker-end="url(#arrow2)" stroke-dasharray="5,5"/>
  <text x="625" y="385" font-size="11" font-weight="bold" fill="#F57C00">P(Y₃|"cats")</text>
  
  <path d="M 880 310 L 880 450" stroke="#F57C00" stroke-width="2.5" fill="none" marker-end="url(#arrow2)" stroke-dasharray="5,5"/>
  <text x="895" y="385" font-size="11" font-weight="bold" fill="#F57C00">P(Yₜ|Xₜ)</text>
  
  <!-- Model Components -->
  <rect x="70" y="600" width="960" height="95" fill="#e8f5e9" stroke="#4CAF50" stroke-width="2" rx="5"/>
  
  <text x="550" y="625" font-size="16" font-weight="bold" text-anchor="middle" fill="#2e7d32">
    Two Key Components
  </text>
  
  <rect x="100" y="640" width="420" height="45" fill="white" stroke="#4CAF50" stroke-width="1" rx="5"/>
  <text x="310" y="658" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    1. Language Model (Transitions)
  </text>
  <text x="310" y="676" font-size="12" text-anchor="middle" fill="#546e7a">
    P(Wordₜ | Wordₜ₋₁) - Word sequence probabilities
  </text>
  
  <rect x="580" y="640" width="420" height="45" fill="white" stroke="#4CAF50" stroke-width="1" rx="5"/>
  <text x="790" y="658" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    2. Acoustic Model (Emissions)
  </text>
  <text x="790" y="676" font-size="12" text-anchor="middle" fill="#546e7a">
    P(Audioₜ | Wordₜ) - How words sound acoustically
  </text>
  
</svg>