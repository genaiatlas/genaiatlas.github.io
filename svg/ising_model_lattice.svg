<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="600" y="40" font-size="28" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Ising Model: Two-Dimensional Square Lattice
  </text>
  
  <!-- Background -->
  <rect x="50" y="70" width="1100" height="700" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2" rx="10"/>
  
  <!-- Legend -->
  <g transform="translate(80, 100)">
    <text x="0" y="0" font-size="20" font-weight="bold" fill="#495057">Spin States:</text>
    <!-- Up arrow -->
    <g transform="translate(20, 35)">
      <line x1="0" y1="0" x2="0" y2="-25" stroke="#e74c3c" stroke-width="4" marker-end="url(#arrowhead-up)"/>
      <text x="20" y="-8" font-size="16" fill="#495057">σᵢ = +1 (Up/Like)</text>
    </g>
    <!-- Down arrow -->
    <g transform="translate(20, 75)">
      <line x1="0" y1="0" x2="0" y2="25" stroke="#3498db" stroke-width="4" marker-end="url(#arrowhead-down)"/>
      <text x="20" y="15" font-size="16" fill="#495057">σᵢ = -1 (Down/Dislike)</text>
    </g>
  </g>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead-up" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#e74c3c"/>
    </marker>
    <marker id="arrowhead-down" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#3498db"/>
    </marker>
  </defs>
  
  <!-- Main Lattice Grid -->
  <g transform="translate(400, 250)">
    <!-- Draw grid -->
    <defs>
      <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
        <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#bdc3c7" stroke-width="1.5"/>
      </pattern>
    </defs>
    <rect width="540" height="420" fill="url(#grid)"/>
    <rect width="540" height="420" fill="none" stroke="#7f8c8d" stroke-width="3"/>
    
    <!-- Draw spins (mixture of up and down states) -->
    <!-- Row 1 -->
    <g transform="translate(30, 30)">
      <line x1="0" y1="0" x2="0" y2="-20" stroke="#e74c3c" stroke-width="5" marker-end="url(#arrowhead-up)"/>
    </g>
    <g transform="translate(90, 30)">
      <line x1="0" y1="0" x2="0" y2="-20" stroke="#e74c3c" stroke-width="5" marker-end="url(#arrowhead-up)"/>
    </g>
    <g transform="translate(150, 30)">
      <line x1="0" y1="0" x2="0" y2="20" stroke="#3498db" stroke-width="5" marker-end="url(#arrowhead-down)"/>
    </g>
    <g transform="translate(210, 30)">
