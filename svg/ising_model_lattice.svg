    <text x="200" y="25" font-size="16" font-weight="bold" text-anchor="middle" fill="#2e7d32">Energy Function</text>
    <text x="200" y="50" font-size="15" text-anchor="middle" fill="#2e7d32">E = -Σ Jᵢⱼ σᵢ σⱼ - Σ hᵢ σᵢ</text>
    <text x="200" y="72" font-size="12" text-anchor="middle" fill="#2e7d32">(J = coupling strength, h = external field)</text>
  </g>
  
