<svg viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="700" y="40" font-size="28" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Item-Item Collaborative Filtering Overview
  </text>
  
  <!-- User-Based Approach (Left Side) -->
  <g transform="translate(100, 100)">
    <rect x="0" y="0" width="500" height="320" fill="#fff8f0" stroke="#ff9933" stroke-width="2" rx="8"/>
    <text x="250" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#ff6600">
      Traditional: User-Based CF
    </text>
    
    <!-- User Matrix -->
    <g transform="translate(50, 60)">
      <text x="0" y="-10" font-size="14" font-weight="bold" fill="#333">Users × Items Matrix</text>
      
      <!-- Matrix representation -->
      <rect x="0" y="0" width="180" height="120" fill="#fff" stroke="#999" stroke-width="1"/>
      
      <!-- Sparse dots -->
      <circle cx="20" cy="20" r="4" fill="#333"/>
      <circle cx="140" cy="30" r="4" fill="#333"/>
      <circle cx="60" cy="50" r="4" fill="#333"/>
      <circle cx="100" cy="70" r="4" fill="#333"/>
      <circle cx="30" cy="90" r="4" fill="#333"/>
      <circle cx="150" cy="100" r="4" fill="#333"/>
      
      <!-- Red placeholders -->
      <circle cx="80" cy="20" r="3" fill="#ff4444" opacity="0.4"/>
      <circle cx="50" cy="30" r="3" fill="#ff4444" opacity="0.4"/>
      <circle cx="120" cy="50" r="3" fill="#ff4444" opacity="0.4"/>
      <circle cx="40" cy="70" r="3" fill="#ff4444" opacity="0.4"/>
      <circle cx="160" cy="85" r="3" fill="#ff4444" opacity="0.4"/>
      <circle cx="90" cy="100" r="3" fill="#ff4444" opacity="0.4"/>
      
      <text x="90" y="145" font-size="12" text-anchor="middle" fill="#666">
        ■ Rated  ○ Missing
      </text>
    </g>
    
    <!-- Arrow -->
    <path d="M 250 180 L 250 220" stroke="#ff6600" stroke-width="3" fill="none" marker-end="url(#arrowRed)"/>
    
    <!-- Problem statement -->
    <g transform="translate(30, 230)">
      <text x="220" y="0" font-size="14" font-weight="bold" text-anchor="middle" fill="#d63031">
        ❌ Sparse Overlap Problem
      </text>
      <text x="220" y="25" font-size="12" text-anchor="middle" fill="#555">
        • Each user rates ~1-2% of items
      </text>
      <text x="220" y="45" font-size="12" text-anchor="middle" fill="#555">
        • Low collision rate between users
      </text>
      <text x="220" y="65" font-size="12" text-anchor="middle" fill="#555">
        • Unreliable similarity measurements
      </text>
    </g>
  </g>
  
  <!-- Arrow between approaches -->
  <g transform="translate(640, 260)">
    <path d="M 0 0 L 60 0" stroke="#2d3436" stroke-width="4" fill="none" marker-end="url(#arrowBlack)"/>
    <text x="30" y="-10" font-size="16" font-weight="bold" text-anchor="middle" fill="#0984e3">
      Solution
    </text>
  </g>
  
  <!-- Item-Based Approach (Right Side) -->
  <g transform="translate(750, 100)">
    <rect x="0" y="0" width="500" height="320" fill="#f0f8ff" stroke="#0066ff" stroke-width="2" rx="8"/>
    <text x="250" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#0044cc">
      Item-Item Collaborative Filtering
    </text>
    
    <!-- Item Matrix (transposed) -->
    <g transform="translate(50, 60)">
      <text x="0" y="-10" font-size="14" font-weight="bold" fill="#333">Items × Users Matrix</text>
      
      <!-- Matrix representation -->
      <rect x="0" y="0" width="180" height="120" fill="#fff" stroke="#999" stroke-width="1"/>
      
      <!-- Dense dots for popular items -->
      <circle cx="20" cy="20" r="4" fill="#0066ff"/>
      <circle cx="40" cy="20" r="4" fill="#0066ff"/>
      <circle cx="60" cy="20" r="4" fill="#0066ff"/>
      <circle cx="80" cy="20" r="4" fill="#0066ff"/>
      <circle cx="100" cy="20" r="4" fill="#0066ff"/>
      <circle cx="120" cy="20" r="4" fill="#0066ff"/>
      <circle cx="140" cy="20" r="4" fill="#0066ff"/>
      <circle cx="160" cy="20" r="4" fill="#0066ff"/>
      
      <circle cx="20" cy="40" r="4" fill="#0066ff"/>
      <circle cx="40" cy="40" r="4" fill="#0066ff"/>
      <circle cx="60" cy="40" r="4" fill="#0066ff"/>
      <circle cx="80" cy="40" r="4" fill="#0066ff"/>
      <circle cx="100" cy="40" r="4" fill="#0066ff"/>
      <circle cx="120" cy="40" r="4" fill="#0066ff"/>
      <circle cx="140" cy="40" r="4" fill="#0066ff"/>
      <circle cx="160" cy="40" r="4" fill="#0066ff"/>
      
      <!-- Some sparse areas -->
      <circle cx="30" cy="80" r="4" fill="#0066ff"/>
      <circle cx="90" cy="80" r="4" fill="#0066ff"/>
      <circle cx="150" cy="80" r="4" fill="#0066ff"/>
      <circle cx="50" cy="100" r="4" fill="#0066ff"/>
      <circle cx="110" cy="100" r="4" fill="#0066ff"/>
      
      <text x="90" y="145" font-size="12" text-anchor="middle" fill="#666">
        Popular items: Dense ratings
      </text>
    </g>
    
    <!-- Arrow -->
    <path d="M 250 180 L 250 220" stroke="#0066ff" stroke-width="3" fill="none" marker-end="url(#arrowBlue)"/>
    
    <!-- Solution statement -->
    <g transform="translate(30, 230)">
      <text x="220" y="0" font-size="14" font-weight="bold" text-anchor="middle" fill="#00b894">
        ✓ Dense Overlap Solution
      </text>
      <text x="220" y="25" font-size="12" text-anchor="middle" fill="#555">
        • Popular items rated by 50%+ users
      </text>
      <text x="220" y="45" font-size="12" text-anchor="middle" fill="#555">
        • High collision rate between items
      </text>
      <text x="220" y="65" font-size="12" text-anchor="middle" fill="#555">
        • Reliable similarity measurements
      </text>
    </g>
  </g>
  
  <!-- Algorithm Comparison -->
  <g transform="translate(100, 480)">
    <rect x="0" y="0" width="1200" height="350" fill="#f9f9f9" stroke="#666" stroke-width="2" rx="8"/>
    <text x="600" y="35" font-size="22" font-weight="bold" text-anchor="middle" fill="#2d3436">
      Algorithm Comparison
    </text>
    
    <!-- User-Based -->
    <g transform="translate(50, 70)">
      <text x="250" y="0" font-size="16" font-weight="bold" text-anchor="middle" fill="#ff6600">
        User-Based CF
      </text>
      
      <text x="0" y="35" font-size="13" font-weight="bold" fill="#333">Step 1:</text>
      <text x="60" y="35" font-size="12" fill="#555">Find similar users</text>
      
      <text x="0" y="60" font-size="13" font-weight="bold" fill="#333">Step 2:</text>
      <text x="60" y="60" font-size="12" fill="#555">similarity(user₁, user₂)</text>
      
      <text x="0" y="85" font-size="13" font-weight="bold" fill="#333">Step 3:</text>
      <text x="60" y="85" font-size="12" fill="#555">Σ (rating₁ₖ × rating₂ₖ)</text>
      
      <text x="0" y="115" font-size="13" font-weight="bold" fill="#d63031">Problem:</text>
      <text x="80" y="115" font-size="12" fill="#555">Sparse overlap (~3 collisions)</text>
      
      <text x="0" y="145" font-size="13" font-weight="bold" fill="#333">Accuracy:</text>
      <text x="80" y="145" font-size="12" fill="#555">Lower due to sparse data</text>
      
      <text x="0" y="175" font-size="13" font-weight="bold" fill="#333">Computation:</text>
      <text x="100" y="175" font-size="12" fill="#555">Online (expensive)</text>
      
      <text x="0" y="205" font-size="13" font-weight="bold" fill="#333">Scalability:</text>
      <text x="85" y="205" font-size="12" fill="#555">Poor (users grow fast)</text>
    </g>
    
    <!-- Item-Based -->
    <g transform="translate(650, 70)">
      <text x="250" y="0" font-size="16" font-weight="bold" text-anchor="middle" fill="#0066ff">
        Item-Based CF
      </text>
      
      <text x="0" y="35" font-size="13" font-weight="bold" fill="#333">Step 1:</text>
      <text x="60" y="35" font-size="12" fill="#555">Find similar items</text>
      
      <text x="0" y="60" font-size="13" font-weight="bold" fill="#333">Step 2:</text>
      <text x="60" y="60" font-size="12" fill="#555">similarity(item₁, item₂)</text>
      
      <text x="0" y="85" font-size="13" font-weight="bold" fill="#333">Step 3:</text>
      <text x="60" y="85" font-size="12" fill="#555">Σ (ratingᵤ₁ × ratingᵤ₂)</text>
      
      <text x="0" y="115" font-size="13" font-weight="bold" fill="#00b894">Solution:</text>
      <text x="80" y="115" font-size="12" fill="#555">Dense overlap (125k collisions)</text>
      
      <text x="0" y="145" font-size="13" font-weight="bold" fill="#333">Accuracy:</text>
      <text x="80" y="145" font-size="12" fill="#555">Higher due to dense data</text>
      
      <text x="0" y="175" font-size="13" font-weight="bold" fill="#333">Computation:</text>
      <text x="100" y="175" font-size="12" fill="#555">Offline (precomputed)</text>
      
      <text x="0" y="205" font-size="13" font-weight="bold" fill="#333">Scalability:</text>
      <text x="85" y="205" font-size="12" fill="#555">Good (items grow slower)</text>
    </g>
    
    <!-- Comparison metrics -->
    <g transform="translate(50, 290)">
      <rect x="0" y="0" width="1100" height="40" fill="#fff3cd" stroke="#ffc107" stroke-width="2" rx="5"/>
      <text x="550" y="26" font-size="14" font-weight="bold" text-anchor="middle" fill="#856404">
        ⚡ Performance: Item-Based CF outperforms User-Based by ~40,000× in collision rate
      </text>
    </g>
  </g>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ff6600"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0066ff"/>
    </marker>
    <marker id="arrowBlack" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2d3436"/>
    </marker>
  </defs>
</svg>