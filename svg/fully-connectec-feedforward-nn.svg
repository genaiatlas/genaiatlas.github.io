<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="nodeGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#4285f4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a73e8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="hiddenGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#34a853;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#137333;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="outputGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ea4335;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d33b2c;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#202124">
    Fully-Connected Feedforward Neural Network
  </text>

  <!-- Input Layer -->
  <text x="120" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f1f1f">
    Input Layer
  </text>
  
  <!-- Input nodes -->
  <circle cx="120" cy="120" r="15" fill="url(#nodeGradient)" stroke="#1a73e8" stroke-width="2"/>
  <text x="120" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">x₁</text>
  
  <circle cx="120" cy="170" r="15" fill="url(#nodeGradient)" stroke="#1a73e8" stroke-width="2"/>
  <text x="120" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">x₂</text>
  
  <circle cx="120" cy="220" r="15" fill="url(#nodeGradient)" stroke="#1a73e8" stroke-width="2"/>
  <text x="120" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">x₃</text>
  
  <!-- Dots for more inputs -->
  <circle cx="120" cy="260" r="3" fill="#5f6368"/>
  <circle cx="120" cy="275" r="3" fill="#5f6368"/>
  <circle cx="120" cy="290" r="3" fill="#5f6368"/>
  
  <circle cx="120" cy="330" r="15" fill="url(#nodeGradient)" stroke="#1a73e8" stroke-width="2"/>
  <text x="120" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">xₙ</text>

  <!-- Hidden Layer 1 -->
  <text x="300" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f1f1f">
    Hidden Layer 1
  </text>
  
  <circle cx="300" cy="100" r="15" fill="url(#hiddenGradient)" stroke="#137333" stroke-width="2"/>
  <circle cx="300" cy="140" r="15" fill="url(#hiddenGradient)" stroke="#137333" stroke-width="2"/>
  <circle cx="300" cy="180" r="15" fill="url(#hiddenGradient)" stroke="#137333" stroke-width="2"/>
  <circle cx="300" cy="220" r="15" fill="url(#hiddenGradient)" stroke="#137333" stroke-width="2"/>
  <circle cx="300" cy="260" r="15" fill="url(#hiddenGradient)" stroke="#137333" stroke-width="2"/>
  <circle cx="300" cy="300" r="15" fill="url(#hiddenGradient)" stroke="#137333" stroke-width="2"/>
  <circle cx="300" cy="340" r="15" fill="url(#hiddenGradient)" stroke="#137333" stroke-width="2"/>

  <!-- Hidden Layer 2 -->
  <text x="480" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f1f1f">
    Hidden Layer 2
  </text>
  
  <circle cx="480" cy="120" r="15" fill="url(#hiddenGradient)" stroke="#137333" stroke-width="2"/>
  <circle cx="480" cy="160" r="15" fill="url(#hiddenGradient)" stroke="#137333" stroke-width="2"/>
  <circle cx="480" cy="200" r="15" fill="url(#hiddenGradient)" stroke="#137333" stroke-width="2"/>
  <circle cx="480" cy="240" r="15" fill="url(#hiddenGradient)" stroke="#137333" stroke-width="2"/>
  <circle cx="480" cy="280" r="15" fill="url(#hiddenGradient)" stroke="#137333" stroke-width="2"/>
  <circle cx="480" cy="320" r="15" fill="url(#hiddenGradient)" stroke="#137333" stroke-width="2"/>

  <!-- Output Layer -->
  <text x="660" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f1f1f">
    Output Layer
  </text>
  
  <circle cx="660" cy="180" r="15" fill="url(#outputGradient)" stroke="#d33b2c" stroke-width="2"/>
  <text x="660" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">ŷ</text>
  
  <circle cx="660" cy="220" r="15" fill="url(#outputGradient)" stroke="#d33b2c" stroke-width="2"/>
  <circle cx="660" cy="260" r="15" fill="url(#outputGradient)" stroke="#d33b2c" stroke-width="2"/>

  <!-- Connections from Input to Hidden Layer 1 -->
  <g stroke="#5f6368" stroke-width="1" opacity="0.6">
    <!-- From x1 to all hidden layer 1 nodes -->
    <line x1="135" y1="120" x2="285" y2="100"/>
    <line x1="135" y1="120" x2="285" y2="140"/>
    <line x1="135" y1="120" x2="285" y2="180"/>
    <line x1="135" y1="120" x2="285" y2="220"/>
    <line x1="135" y1="120" x2="285" y2="260"/>
    <line x1="135" y1="120" x2="285" y2="300"/>
    <line x1="135" y1="120" x2="285" y2="340"/>
    
    <!-- From x2 to all hidden layer 1 nodes -->
    <line x1="135" y1="170" x2="285" y2="100"/>
    <line x1="135" y1="170" x2="285" y2="140"/>
    <line x1="135" y1="170" x2="285" y2="180"/>
    <line x1="135" y1="170" x2="285" y2="220"/>
    <line x1="135" y1="170" x2="285" y2="260"/>
    <line x1="135" y1="170" x2="285" y2="300"/>
    <line x1="135" y1="170" x2="285" y2="340"/>
    
    <!-- From x3 to all hidden layer 1 nodes -->
    <line x1="135" y1="220" x2="285" y2="100"/>
    <line x1="135" y1="220" x2="285" y2="140"/>
    <line x1="135" y1="220" x2="285" y2="180"/>
    <line x1="135" y1="220" x2="285" y2="220"/>
    <line x1="135" y1="220" x2="285" y2="260"/>
    <line x1="135" y1="220" x2="285" y2="300"/>
    <line x1="135" y1="220" x2="285" y2="340"/>
    
    <!-- From xn to all hidden layer 1 nodes -->
    <line x1="135" y1="330" x2="285" y2="100"/>
    <line x1="135" y1="330" x2="285" y2="140"/>
    <line x1="135" y1="330" x2="285" y2="180"/>
    <line x1="135" y1="330" x2="285" y2="220"/>
    <line x1="135" y1="330" x2="285" y2="260"/>
    <line x1="135" y1="330" x2="285" y2="300"/>
    <line x1="135" y1="330" x2="285" y2="340"/>
  </g>

  <!-- Connections from Hidden Layer 1 to Hidden Layer 2 -->
  <g stroke="#5f6368" stroke-width="1" opacity="0.6">
    <!-- Sample connections - showing fully connected -->
    <line x1="315" y1="100" x2="465" y2="120"/>
    <line x1="315" y1="100" x2="465" y2="160"/>
    <line x1="315" y1="100" x2="465" y2="200"/>
    <line x1="315" y1="140" x2="465" y2="120"/>
    <line x1="315" y1="140" x2="465" y2="160"/>
    <line x1="315" y1="180" x2="465" y2="200"/>
    <line x1="315" y1="220" x2="465" y2="240"/>
    <line x1="315" y1="260" x2="465" y2="280"/>
    <line x1="315" y1="300" x2="465" y2="320"/>
    <line x1="315" y1="340" x2="465" y2="320"/>
  </g>

  <!-- Connections from Hidden Layer 2 to Output -->
  <g stroke="#5f6368" stroke-width="1" opacity="0.6">
    <line x1="495" y1="120" x2="645" y2="180"/>
    <line x1="495" y1="160" x2="645" y2="180"/>
    <line x1="495" y1="200" x2="645" y2="220"/>
    <line x1="495" y1="240" x2="645" y2="220"/>
    <line x1="495" y1="280" x2="645" y2="260"/>
    <line x1="495" y1="320" x2="645" y2="260"/>
  </g>

  <!-- Mathematical notation -->
  <text x="210" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#5f6368">
    z = W·x + b
  </text>
  <text x="390" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#5f6368">
    a = f(z)
  </text>
  <text x="570" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#5f6368">
    ŷ = softmax(z)
  </text>

  <!-- Legend -->
  <rect x="50" y="420" width="700" height="60" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="5"/>
  <text x="400" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#202124">
    Fully-Connected Architecture: Every neuron connects to all neurons in the next layer
  </text>
  <text x="400" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5f6368">
    Each connection represents a learnable weight parameter
  </text>
</svg>