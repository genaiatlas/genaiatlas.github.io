<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title-text { font-family: 'Arial', sans-serif; font-size: 24px; font-weight: bold; fill: #2C3E50; }
      .subtitle-text { font-family: 'Arial', sans-serif; font-size: 16px; fill: #555; }
      .node-circle { fill: #4A90E2; stroke: #2E5C8A; stroke-width: 3; }
      .node-leaf { fill: #27AE60; stroke: #1E8449; stroke-width: 3; }
      .node-root { fill: #E74C3C; stroke: #C0392B; stroke-width: 4; }
      .node-label { font-family: 'Arial', sans-serif; font-size: 14px; fill: white; font-weight: bold; text-anchor: middle; }
      .edge-line { stroke: #666; stroke-width: 2.5; }
      .message-arrow { stroke: #9B59B6; stroke-width: 2.5; fill: none; }
      .label-text { font-family: 'Arial', sans-serif; font-size: 13px; fill: #555; }
      .property-text { font-family: 'Arial', sans-serif; font-size: 14px; fill: #333; }
    </style>
    
    <marker id="purple-arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#9B59B6"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" class="title-text" text-anchor="middle">Tree-Structured Graphical Model</text>
  <text x="400" y="55" class="subtitle-text" text-anchor="middle">Belief Propagation on Trees</text>
  
  <!-- Tree Structure -->
  <g transform="translate(0, 80)">
    <!-- Edges -->
    <line x1="400" y1="50" x2="300" y2="120" class="edge-line"/>
    <line x1="400" y1="50" x2="500" y2="120" class="edge-line"/>
    <line x1="300" y1="120" x2="220" y2="190" class="edge-line"/>
    <line x1="300" y1="120" x2="340" y2="190" class="edge-line"/>
    <line x1="500" y1="120" x2="460" y2="190" class="edge-line"/>
    <line x1="500" y1="120" x2="580" y2="190" class="edge-line"/>
    <line x1="220" y1="190" x2="170" y2="260" class="edge-line"/>
    <line x1="220" y1="190" x2="250" y2="260" class="edge-line"/>
    <line x1="580" y1="190" x2="620" y2="260" class="edge-line"/>
    <line x1="580" y1="190" x2="680" y2="260" class="edge-line"/>
    
    <!-- Message flow arrows (examples) -->
    <path d="M 175 245 L 215 205" class="message-arrow" marker-end="url(#purple-arrow)"/>
    <path d="M 255 245 L 225 205" class="message-arrow" marker-end="url(#purple-arrow)"/>
    <path d="M 625 245 L 585 205" class="message-arrow" marker-end="url(#purple-arrow)"/>
    <path d="M 675 245 L 585 205" class="message-arrow" marker-end="url(#purple-arrow)"/>
    
    <path d="M 225 175 L 295 135" class="message-arrow" marker-end="url(#purple-arrow)"/>
    <path d="M 345 175 L 305 135" class="message-arrow" marker-end="url(#purple-arrow)"/>
    <path d="M 575 175 L 505 135" class="message-arrow" marker-end="url(#purple-arrow)"/>
    
    <!-- Root Node -->
    <circle cx="400" cy="50" r="28" class="node-root"/>
    <text x="400" y="57" class="node-label" style="font-size: 15px;">Root</text>
    <text x="400" y="0" class="label-text" text-anchor="middle" font-weight="bold" fill="#E74C3C">Target Node</text>
    
    <!-- Internal Nodes -->
    <circle cx="300" cy="120" r="24" class="node-circle"/>
    <text x="300" y="127" class="node-label">X₂</text>
    
    <circle cx="500" cy="120" r="24" class="node-circle"/>
    <text x="500" y="127" class="node-label">X₃</text>
    
    <circle cx="220" cy="190" r="24" class="node-circle"/>
    <text x="220" y="197" class="node-label">X₄</text>
    
    <circle cx="340" cy="190" r="24" class="node-circle"/>
    <text x="340" y="197" class="node-label">X₅</text>
    
    <circle cx="460" cy="190" r="24" class="node-circle"/>
    <text x="460" y="197" class="node-label">X₆</text>
    
    <circle cx="580" cy="190" r="24" class="node-circle"/>
    <text x="580" y="197" class="node-label">X₇</text>
    
    <!-- Leaf Nodes -->
    <circle cx="170" cy="260" r="24" class="node-leaf"/>
    <text x="170" y="267" class="node-label">X₈</text>
    
    <circle cx="250" cy="260" r="24" class="node-leaf"/>
    <text x="250" y="267" class="node-label">X₉</text>
    
    <circle cx="620" cy="260" r="24" class="node-leaf"/>
    <text x="620" y="267" class="node-label">X₁₀</text>
    
    <circle cx="680" cy="260" r="24" class="node-leaf"/>
    <text x="680" y="267" class="node-label">X₁₁</text>
    
    <text x="425" y="290" class="label-text" font-weight="bold" fill="#27AE60">Leaf Nodes (degree 1)</text>
    <text x="425" y="308" class="label-text" fill="#27AE60">Start message passing here</text>
  </g>
  
  <!-- Tree Properties -->
  <g transform="translate(50, 400)">
    <rect x="0" y="0" width="340" height="170" fill="#F0F8FF" stroke="#3498DB" stroke-width="2" rx="5"/>
    <text x="170" y="30" class="subtitle-text" text-anchor="middle" font-weight="bold">Tree Properties</text>
    
    <text x="20" y="60" class="property-text">✓ No cycles (acyclic)</text>
    <text x="20" y="85" class="property-text">✓ Unique path between nodes</text>
    <text x="20" y="110" class="property-text">✓ Has leaf nodes (degree 1)</text>
    <text x="20" y="135" class="property-text">✓ Belief propagation is exact</text>
    <text x="20" y="160" class="property-text">✓ Linear time complexity</text>
  </g>
  
  <!-- Algorithm Steps -->
  <g transform="translate(410, 400)">
    <rect x="0" y="0" width="340" height="170" fill="#FFF9E6" stroke="#FFA500" stroke-width="2" rx="5"/>
    <text x="170" y="30" class="subtitle-text" text-anchor="middle" font-weight="bold">Message Passing Steps</text>
    
    <text x="20" y="60" class="property-text" font-weight="bold">1. Start at leaves</text>
    <text x="30" y="80" class="label-text">Leaf nodes have degree 1</text>
    
    <text x="20" y="105" class="property-text" font-weight="bold">2. Pass messages inward</text>
    <text x="30" y="125" class="label-text">From leaves toward root</text>
    
    <text x="20" y="150" class="property-text" font-weight="bold">3. Compute marginals</text>
    <text x="30" y="170" class="label-text">Use received messages</text>
  </g>
</svg>