      <rect x="0" y="150" width="30" height="30"/><text x="15" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">2</text>
      <rect x="30" y="150" width="30" height="30"/><text x="45" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">4</text>
      <rect x="60" y="150" width="30" height="30"/><text x="75" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">5</text>
      <rect x="90" y="150" width="30" height="30"/><text x="105" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">2</text>
      <rect x="120" y="150" width="30" height="30"/><text x="135" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">3</text>
      <rect x="150" y="150" width="30" height="30"/><text x="165" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">9</text>
    </g>
    
    <!-- Highlight first 3x3 region -->
