      <rect x="60" y="90" width="30" height="30"/><text x="75" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">3</text>
      <rect x="90" y="90" width="30" height="30"/><text x="105" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">1</text>
