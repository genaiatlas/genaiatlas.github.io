      <rect x="30" y="60" width="30" height="30"/><text x="45" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">7</text>
      <rect x="60" y="60" width="30" height="30"/><text x="75" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">2</text>
      <rect x="90" y="60" width="30" height="30"/><text x="105" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">5</text>
      <rect x="120" y="60" width="30" height="30"/><text x="135" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">1</text>
      <rect x="150" y="60" width="30" height="30"/><text x="165" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">3</text>
      
