      <rect x="30" y="0" width="30" height="30"/><text x="45" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">-4</text>
      <rect x="60" y="0" width="30" height="30"/><text x="75" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">0</text>
      <rect x="90" y="0" width="30" height="30"/><text x="105" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">8</text>
      
      <!-- Row 2 -->
      <rect x="0" y="30" width="30" height="30"/><text x="15" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">-10</text>
      <rect x="30" y="30" width="30" height="30"/><text x="45" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">-2</text>
      <rect x="60" y="30" width="30" height="30"/><text x="75" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">2</text>
      <rect x="90" y="30" width="30" height="30"/><text x="105" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">3</text>
      
      <!-- Row 3 -->
      <rect x="0" y="60" width="30" height="30"/><text x="15" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">4</text>
      <rect x="30" y="60" width="30" height="30"/><text x="45" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">-3</text>
      <rect x="60" y="60" width="30" height="30"/><text x="75" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">-2</text>
      <rect x="90" y="60" width="30" height="30"/><text x="105" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">-7</text>
      
      <!-- Row 4 -->
      <rect x="0" y="90" width="30" height="30"/><text x="15" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">-3</text>
      <rect x="30" y="90" width="30" height="30"/><text x="45" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">-2</text>
      <rect x="60" y="90" width="30" height="30"/><text x="75" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">8</text>
      <rect x="90" y="90" width="30" height="30"/><text x="105" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">-6</text>
    </g>
  </g>
  
  <!-- Detailed calculation box -->
  <g transform="translate(80, 340)">
    <rect x="0" y="0" width="650" height="220" fill="#f8f9fa" stroke="#bdc3c7" stroke-width="2" rx="10"/>
    <text x="325" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">Detailed Calculation for First Output Element</text>
    
    <!-- Highlighted 3x3 section -->
    <g transform="translate(30, 50)">
      <text x="45" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e74c3c">Input Region</text>
      <g stroke="#e74c3c" stroke-width="2" fill="#fdeaea">
        <rect x="0" y="0" width="25" height="25"/><text x="12" y="17" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">3</text>
        <rect x="25" y="0" width="25" height="25"/><text x="37" y="17" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">0</text>
        <rect x="50" y="0" width="25" height="25"/><text x="62" y="17" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">1</text>
        
        <rect x="0" y="25" width="25" height="25"/><text x="12" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">1</text>
        <rect x="25" y="25" width="25" height="25"/><text x="37" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">5</text>
        <rect x="50" y="25" width="25" height="25"/><text x="62" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">8</text>
        
        <rect x="0" y="50" width="25" height="25"/><text x="12" y="67" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">2</text>
        <rect x="25" y="50" width="25" height="25"/><text x="37" y="67" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">7</text>
        <rect x="50" y="50" width="25" height="25"/><text x="62" y="67" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">2</text>
      </g>
    </g>
    
    <!-- Multiplication symbol -->
    <text x="140" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">⊙</text>
    
    <!-- Filter -->
    <g transform="translate(170, 50)">
      <text x="37" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f39c12">Filter</text>
      <g stroke="#e67e22" stroke-width="2" fill="#fef9e7">
        <rect x="0" y="0" width="25" height="25"/><text x="12" y="17" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">1</text>
        <rect x="25" y="0" width="25" height="25"/><text x="37" y="17" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">0</text>
        <rect x="50" y="0" width="25" height="25"/><text x="62" y="17" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">-1</text>
        
        <rect x="0" y="25" width="25" height="25"/><text x="12" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">1</text>
        <rect x="25" y="25" width="25" height="25"/><text x="37" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">0</text>
        <rect x="50" y="25" width="25" height="25"/><text x="62" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">-1</text>
        
        <rect x="0" y="50" width="25" height="25"/><text x="12" y="67" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">1</text>
        <rect x="25" y="50" width="25" height="25"/><text x="37" y="67" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">0</text>
        <rect x="50" y="50" width="25" height="25"/><text x="62" y="67" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">-1</text>
      </g>
    </g>
    
    <!-- Equals -->
    <text x="270" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">=</text>
    
    <!-- Result -->
    <g transform="translate(300, 70)">
      <rect x="0" y="0" width="40" height="40" fill="#d5f4e6" stroke="#229954" stroke-width="3"/>
      <text x="20" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#27ae60">-5</text>
    </g>
    
    <!-- Mathematical equation -->
    <text x="30" y="130" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50" font-weight="bold">Calculation:</text>
    <text x="30" y="150" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">(3×1) + (0×0) + (1×(-1)) + (1×1) + (5×0) + (8×(-1)) + (2×1) + (7×0) + (2×(-1))</text>
    <text x="30" y="170" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">= 3 + 0 - 1 + 1 + 0 - 8 + 2 + 0 - 2</text>
    <text x="30" y="190" font-family="Arial, sans-serif" font-size="12" fill="#27ae60" font-weight="bold">= -5</text>
  </g>
  
  <!-- Key formula -->
  <g transform="translate(780, 340)">
    <rect x="0" y="0" width="380" height="120" fill="#eef7ff" stroke="#3498db" stroke-width="2" rx="10"/>
    <text x="190" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Output Dimensions Formula</text>
    
    <text x="20" y="55" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50" font-weight="bold">Output Size = Input Size - Filter Size + 1</text>
    <text x="20" y="80" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">For this example: 6 - 3 + 1 = 4</text>
    <text x="20" y="100" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">This process repeats for all valid positions</text>
  </g>
</svg>