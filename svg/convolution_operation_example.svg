  </g>
  
  <!-- Convolution operator -->
  <text x="340" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">★</text>
  
  <!-- Filter (3x3) -->
