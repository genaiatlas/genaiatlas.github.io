      <rect x="30" y="0" width="30" height="30"/><text x="45" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">0</text>
      <rect x="60" y="0" width="30" height="30"/><text x="75" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">1</text>
      <rect x="90" y="0" width="30" height="30"/><text x="105" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">2</text>
      <rect x="120" y="0" width="30" height="30"/><text x="135" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">7</text>
      <rect x="150" y="0" width="30" height="30"/><text x="165" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">4</text>
      
      <!-- Row 2 -->
      <rect x="0" y="30" width="30" height="30"/><text x="15" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">1</text>
      <rect x="30" y="30" width="30" height="30"/><text x="45" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">5</text>
      <rect x="60" y="30" width="30" height="30"/><text x="75" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">8</text>
      <rect x="90" y="30" width="30" height="30"/><text x="105" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">9</text>
      <rect x="120" y="30" width="30" height="30"/><text x="135" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">3</text>
      <rect x="150" y="30" width="30" height="30"/><text x="165" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">1</text>
      
