    <text x="60" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#27ae60">Output (4×4)</text>
    
    <g stroke="#229954" stroke-width="2" fill="#d5f4e6">
      <!-- Row 1 -->
