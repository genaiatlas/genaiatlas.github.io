    <text x="45" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#f39c12">Filter (3×3)</text>
    
    <g stroke="#e67e22" stroke-width="2" fill="#f39c12">
      <rect x="0" y="0" width="30" height="30"/><text x="15" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">1</text>
      <rect x="30" y="0" width="30" height="30"/><text x="45" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">0</text>
      <rect x="60" y="0" width="30" height="30"/><text x="75" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">-1</text>
      
      <rect x="0" y="30" width="30" height="30"/><text x="15" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">1</text>
      <rect x="30" y="30" width="30" height="30"/><text x="45" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">0</text>
      <rect x="60" y="30" width="30" height="30"/><text x="75" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">-1</text>
      
      <rect x="0" y="60" width="30" height="30"/><text x="15" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">1</text>
      <rect x="30" y="60" width="30" height="30"/><text x="45" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">0</text>
      <rect x="60" y="60" width="30" height="30"/><text x="75" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">-1</text>
    </g>
    <text x="45" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#e67e22">Vertical Edge Detector</text>
  </g>
  
  <!-- Equals sign -->
