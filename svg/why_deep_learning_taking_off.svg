<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="900" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">Why Deep Learning is Taking Off Now?</text>
  <text x="450" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">Three Key Driving Forces</text>
  
  <!-- Central Deep Learning Circle -->
  <circle cx="450" cy="300" r="80" fill="#3498db" stroke="#2980b9" stroke-width="3"/>
  <text x="450" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">Deep</text>
  <text x="450" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">Learning</text>
  <text x="450" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">Revolution</text>
  
  <!-- Factor 1: Data -->
  <rect x="50" y="100" width="200" height="150" rx="15" fill="#e74c3c" stroke="#c0392b" stroke-width="3"/>
  <text x="150" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">📊 DATA</text>
  <text x="150" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Exponential Growth</text>
  
  <!-- Data details -->
  <rect x="70" y="170" width="160" height="70" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="150" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#2c3e50">Sources:</text>
  <text x="150" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#34495e">• Digitalization</text>
  <text x="150" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#34495e">• IoT Devices</text>
  <text x="150" y="231" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#34495e">• Social Media</text>
  
  <!-- Factor 2: Computation -->
  <rect x="650" y="100" width="200" height="150" rx="15" fill="#f39c12" stroke="#e67e22" stroke-width="3"/>
  <text x="750" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">⚡ COMPUTATION</text>
  <text x="750" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Hardware Revolution</text>
  
  <!-- Computation details -->
  <rect x="670" y="170" width="160" height="70" rx="5" fill="#ffffff" stroke="#e67e22" stroke-width="1"/>
  <text x="750" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#2c3e50">Advances:</text>
  <text x="750" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#34495e">• GPU Development</text>
  <text x="750" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#34495e">• Cloud Computing</text>
  <text x="750" y="231" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#34495e">• Parallel Processing</text>
  
  <!-- Factor 3: Algorithms -->
  <rect x="350" y="450" width="200" height="120" rx="15" fill="#27ae60" stroke="#229954" stroke-width="3"/>
  <text x="450" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">🔧 ALGORITHMS</text>
  <text x="450" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Iterative Innovation</text>
  
  <!-- Algorithm details -->
  <rect x="370" y="520" width="160" height="40" rx="5" fill="#ffffff" stroke="#229954" stroke-width="1"/>
  <text x="450" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#34495e">• Architecture Innovation</text>
  <text x="450" y="548" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#34495e">• Faster Iteration Cycles</text>
  
  <!-- Connecting Arrows and Relationships -->
  <!-- Data to Deep Learning -->
  <path d="M 250 180 Q 320 240 370 280" stroke="#e74c3c" stroke-width="4" marker-end="url(#arrowhead-red)" fill="none"/>
  <text x="300" y="220" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#c0392b">More Data =</text>
  <text x="300" y="235" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#c0392b">Better Performance</text>
  
  <!-- Computation to Deep Learning -->
  <path d="M 650 180 Q 580 240 530 280" stroke="#f39c12" stroke-width="4" marker-end="url(#arrowhead-orange)" fill="none"/>
  <text x="580" y="220" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#e67e22">Faster Training =</text>
  <text x="580" y="235" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#e67e22">Larger Models</text>
  
  <!-- Deep Learning to Algorithms -->
  <path d="M 450 380 Q 450 420 450 450" stroke="#27ae60" stroke-width="4" marker-end="url(#arrowhead-green)" fill="none"/>
  <text x="470" y="415" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#229954">Enables Innovation</text>
  
  <!-- Feedback Loops -->
  <!-- Computation to Algorithms -->
  <path d="M 700 250 Q 650 350 550 450" stroke="#9b59b6" stroke-width="3" fill="none" stroke-dasharray="8,4"/>
  <text x="620" y="350" font-family="Arial, sans-serif" font-size="9" fill="#8e44ad" transform="rotate(-30, 620, 350)">Accelerates</text>
  <text x="620" y="363" font-family="Arial, sans-serif" font-size="9" fill="#8e44ad" transform="rotate(-30, 620, 363)">Innovation</text>
  
  <!-- Algorithms back to Data -->
  <path d="M 350 500 Q 200 400 150 250" stroke="#9b59b6" stroke-width="3" fill="none" stroke-dasharray="8,4"/>
  <text x="250" y="375" font-family="Arial, sans-serif" font-size="9" fill="#8e44ad" transform="rotate(45, 250, 375)">Better Models</text>
  <text x="250" y="388" font-family="Arial, sans-serif" font-size="9" fill="#8e44ad" transform="rotate(45, 250, 388)">Process More Data</text>
  
  <!-- Performance Timeline -->
  <rect x="100" y="300" width="250" height="100" rx="10" fill="#ecf0f1" stroke="#95a5a6" stroke-width="2"/>
  <text x="225" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Historical Context</text>
  
  <text x="120" y="340" font-family="Arial, sans-serif" font-size="9" fill="#34495e">• 1980s-2000s: Limited progress</text>
  <text x="120" y="355" font-family="Arial, sans-serif" font-size="9" fill="#34495e">• 2006-2012: Deep learning research</text>
  <text x="120" y="370" font-family="Arial, sans-serif" font-size="9" fill="#34495e">• 2012+: Breakthrough applications</text>
  <text x="120" y="385" font-family="Arial, sans-serif" font-size="9" fill="#c0392b">🔥 <tspan font-weight="bold">Perfect Storm of factors!</tspan></text>
  
  <!-- Impact Metrics -->
  <rect x="550" y="300" width="250" height="100" rx="10" fill="#ecf0f1" stroke="#95a5a6" stroke-width="2"/>
  <text x="675" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Current Impact</text>
  
  <text x="570" y="340" font-family="Arial, sans-serif" font-size="9" fill="#34495e">• Data: Petabytes → Exabytes</text>
  <text x="570" y="355" font-family="Arial, sans-serif" font-size="9" fill="#34495e">• Compute: 1000x faster training</text>
  <text x="570" y="370" font-family="Arial, sans-serif" font-size="9" fill="#34495e">• Algorithms: Beyond human performance</text>
  <text x="570" y="385" font-family="Arial, sans-serif" font-size="9" fill="#27ae60">🚀 <tspan font-weight="bold">Dominant ML paradigm</tspan></text>
  
  <!-- Positive Feedback Loop Indicator -->
  <ellipse cx="450" cy="150" rx="120" ry="30" fill="none" stroke="#9b59b6" stroke-width="3" stroke-dasharray="15,5"/>
  <text x="450" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#8e44ad">Synergistic</text>
  <text x="450" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#8e44ad">Feedback Loop</text>
  
  <!-- Mathematical Relationship -->
  <rect x="300" y="80" width="300" height="40" rx="5" fill="#d5e8fc" stroke="#3498db" stroke-width="1"/>
  <text x="450" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">Performance ∝ f(Data × Computation × Innovation)</text>
  <text x="450" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#34495e">Exponential improvement when all factors align</text>
  
  <!-- Arrow marker definitions -->
  <defs>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
    <marker id="arrowhead-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f39c12"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#27ae60"/>
    </marker>
  </defs>
</svg>