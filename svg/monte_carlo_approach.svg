<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="800" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="600" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Monte Carlo Approach for Influence Estimation
  </text>
  
  <!-- Seed Node Selection -->
  <g id="seed_selection">
    <rect x="50" y="70" width="280" height="180" fill="#ffffff" stroke="#3498db" stroke-width="3" rx="10"/>
    <text x="190" y="100" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      1. Select Candidate Node
    </text>
    
    <!-- Network with highlighted node -->
    <circle cx="130" cy="150" r="20" fill="#e74c3c" stroke="#c0392b" stroke-width="3"/>
    <text x="130" y="156" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">
      v
    </text>
    <circle cx="190" cy="130" r="15" fill="#ecf0f1" stroke="#95a5a6" stroke-width="2"/>
    <circle cx="250" cy="150" r="15" fill="#ecf0f1" stroke="#95a5a6" stroke-width="2"/>
    <circle cx="220" cy="200" r="15" fill="#ecf0f1" stroke="#95a5a6" stroke-width="2"/>
    <circle cx="160" cy="210" r="15" fill="#ecf0f1" stroke="#95a5a6" stroke-width="2"/>
    
    <line x1="130" y1="150" x2="180" y2="135" stroke="#95a5a6" stroke-width="2"/>
    <line x1="130" y1="150" x2="240" y2="150" stroke="#95a5a6" stroke-width="2"/>
    <line x1="130" y1="150" x2="210" y2="195" stroke="#95a5a6" stroke-width="2"/>
    <line x1="130" y1="150" x2="165" y2="205" stroke="#95a5a6" stroke-width="2"/>
  </g>
  
  <!-- Arrow down to simulations -->
  <line x1="190" y1="260" x2="190" y2="300" stroke="#2c3e50" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Simulations -->
  <g id="simulations">
    <rect x="50" y="310" width="1100" height="240" fill="#ffffff" stroke="#3498db" stroke-width="3" rx="10"/>
    <text x="600" y="340" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      2. Run log(N) Independent Simulations
    </text>
    
    <!-- Simulation 1 -->
    <g id="sim1">
      <rect x="80" y="360" width="200" height="170" fill="#ecf0f1" stroke="#95a5a6" stroke-width="2" rx="5"/>
      <text x="180" y="385" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#2c3e50">
        Simulation 1
      </text>
      
      <circle cx="130" cy="420" r="15" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
      <circle cx="180" cy="410" r="12" fill="#27ae60" stroke="#229954" stroke-width="2"/>
      <circle cx="230" cy="420" r="12" fill="#27ae60" stroke="#229954" stroke-width="2"/>
      <circle cx="210" cy="470" r="12" fill="#27ae60" stroke="#229954" stroke-width="2"/>
      <circle cx="150" cy="480" r="12" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
      
      <text x="180" y="510" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2c3e50">
        Final Active: 4
      </text>
    </g>
    
    <!-- Simulation 2 -->
    <g id="sim2">
      <rect x="310" y="360" width="200" height="170" fill="#ecf0f1" stroke="#95a5a6" stroke-width="2" rx="5"/>
      <text x="410" y="385" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#2c3e50">
        Simulation 2
      </text>
      
      <circle cx="360" cy="420" r="15" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
      <circle cx="410" cy="410" r="12" fill="#27ae60" stroke="#229954" stroke-width="2"/>
      <circle cx="460" cy="420" r="12" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
      <circle cx="440" cy="470" r="12" fill="#27ae60" stroke="#229954" stroke-width="2"/>
      <circle cx="380" cy="480" r="12" fill="#27ae60" stroke="#229954" stroke-width="2"/>
      
      <text x="410" y="510" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2c3e50">
        Final Active: 4
      </text>
    </g>
    
    <!-- Simulation 3 -->
    <g id="sim3">
      <rect x="540" y="360" width="200" height="170" fill="#ecf0f1" stroke="#95a5a6" stroke-width="2" rx="5"/>
      <text x="640" y="385" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#2c3e50">
        Simulation 3
      </text>
      
      <circle cx="590" cy="420" r="15" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
      <circle cx="640" cy="410" r="12" fill="#27ae60" stroke="#229954" stroke-width="2"/>
      <circle cx="690" cy="420" r="12" fill="#27ae60" stroke="#229954" stroke-width="2"/>
      <circle cx="670" cy="470" r="12" fill="#27ae60" stroke="#229954" stroke-width="2"/>
      <circle cx="610" cy="480" r="12" fill="#27ae60" stroke="#229954" stroke-width="2"/>
      
      <text x="640" y="510" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2c3e50">
        Final Active: 5
      </text>
    </g>
    
    <!-- Dots indicating more simulations -->
    <text x="790" y="445" font-family="Arial, sans-serif" font-size="36" text-anchor="middle" fill="#7f8c8d">
      ...
    </text>
    
    <!-- Simulation log(N) -->
    <g id="simN">
      <rect x="860" y="360" width="200" height="170" fill="#ecf0f1" stroke="#95a5a6" stroke-width="2" rx="5"/>
      <text x="960" y="385" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#2c3e50">
        Simulation log(N)
      </text>
      
      <circle cx="910" cy="420" r="15" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
      <circle cx="960" cy="410" r="12" fill="#27ae60" stroke="#229954" stroke-width="2"/>
      <circle cx="1010" cy="420" r="12" fill="#27ae60" stroke="#229954" stroke-width="2"/>
      <circle cx="990" cy="470" r="12" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
      <circle cx="930" cy="480" r="12" fill="#27ae60" stroke="#229954" stroke-width="2"/>
      
      <text x="960" y="510" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2c3e50">
        Final Active: 4
      </text>
    </g>
  </g>
  
  <!-- Arrow down to average -->
  <line x1="600" y1="560" x2="600" y2="600" stroke="#2c3e50" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Averaging -->
  <g id="averaging">
    <rect x="350" y="610" width="500" height="120" fill="#27ae60" stroke="#229954" stroke-width="3" rx="10"/>
    <text x="600" y="645" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#ffffff">
      3. Calculate Average Influence
    </text>
    
    <text x="600" y="680" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#ffffff">
      Influence(v) = (4 + 4 + 5 + ... + 4) / log(N)
    </text>
    
    <text x="600" y="710" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">
      Influence(v) ≈ 4.2 nodes
    </text>
  </g>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#2c3e50"/>
    </marker>
  </defs>
  
  <!-- Key Information Box -->
  <g id="info">
    <rect x="870" y="70" width="280" height="180" fill="#ffffff" stroke="#e67e22" stroke-width="3" rx="10"/>
    <text x="1010" y="100" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Why Monte Carlo?
    </text>
    
    <text x="890" y="130" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">
      <tspan x="890" dy="0"><tspan font-weight="bold">✓ Fast:</tspan> Only log(N) runs needed</tspan>
      <tspan x="890" dy="25"><tspan font-weight="bold">✓ Accurate:</tspan> Law of large numbers</tspan>
      <tspan x="890" dy="25"><tspan font-weight="bold">✓ Simple:</tspan> Easy to implement</tspan>
      <tspan x="890" dy="25"><tspan font-weight="bold">✓ Flexible:</tspan> Works with any model</tspan>
      <tspan x="890" dy="25"><tspan font-weight="bold">✓ Handles randomness:</tspan> Averages</tspan>
      <tspan x="900" dy="15">over stochastic outcomes</tspan>
    </text>
  </g>
  
  <!-- Complexity Box -->
  <rect x="400" y="70" width="420" height="70" fill="#3498db" rx="8"/>
  <text x="610" y="105" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">
    Computational Cost for Single Node
  </text>
  <text x="610" y="130" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#ffffff">
    Time Complexity: O(M × log(N))
  </text>
</svg>