<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
    <!-- Background and title -->
    <rect x="0" y="0" width="800" height="500" fill="#f8f9fa" rx="10" ry="10"/>
    <text x="400" y="40" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold">Covariance Matrix Structure</text>
    
    <!-- Structural model box -->
    <rect x="100" y="80" width="600" height="120" fill="#e1f5fe" stroke="#0288d1" stroke-width="2" rx="10" ry="10"/>
    <text x="400" y="110" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">Structural Model</text>
    
    <!-- Structural model equations -->
    <text x="400" y="150" font-family="Arial" font-size="18" text-anchor="middle">Yi = (θ*)ᵀXi + Wi</text>
    <text x="400" y="180" font-family="Arial" font-size="18" text-anchor="middle">θ̂ = (XᵀX)⁻¹XᵀY</text>
    
    <!-- Covariance matrix -->
    <rect x="100" y="240" width="600" height="200" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="10" ry="10"/>
    <text x="400" y="270" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">Covariance Matrix of θ̂</text>
    
    <!-- Covariance matrix equation -->
    <text x="400" y="310" font-family="Arial" font-size="18" text-anchor="middle">E[(θ̂ - θ*)(θ̂ - θ*)ᵀ]</text>
    
    <!-- Matrix visualization -->
    <rect x="270" y="330" width="260" height="90" fill="white" stroke="#ff9800" stroke-width="2"/>
    
    <!-- Matrix cells -->
    <line x1="320" y1="330" x2="320" y2="420" stroke="#ff9800" stroke-width="1"/>
    <line x1="370" y1="330" x2="370" y2="420" stroke="#ff9800" stroke-width="1"/>
    <line x1="420" y1="330" x2="420" y2="420" stroke="#ff9800" stroke-width="1"/>
    <line x1="470" y1="330" x2="470" y2="420" stroke="#ff9800" stroke-width="1"/>
    
    <line x1="270" y1="350" x2="530" y2="350" stroke="#ff9800" stroke-width="1"/>
    <line x1="270" y1="370" x2="530" y2="370" stroke="#ff9800" stroke-width="1"/>
    <line x1="270" y1="390" x2="530" y2="390" stroke="#ff9800" stroke-width="1"/>
    
    <!-- Diagonal elements -->
    <circle cx="295" cy="340" r="10" fill="#f44336" stroke="none"/>
    <circle cx="345" cy="360" r="10" fill="#f44336" stroke="none"/>
    <circle cx="395" cy="380" r="10" fill="#f44336" stroke="none"/>
    <circle cx="445" cy="400" r="10" fill="#f44336" stroke="none"/>
    <circle cx="495" cy="340" r="10" fill="#f44336" stroke="none"/>
    
    <!-- Off-diagonal elements -->
    <circle cx="345" cy="340" r="6" fill="#2196f3" stroke="none"/>
    <circle cx="395" cy="340" r="6" fill="#2196f3" stroke="none"/>
    <circle cx="445" cy="340" r="6" fill="#2196f3" stroke="none"/>
    <circle cx="495" cy="360" r="6" fill="#2196f3" stroke="none"/>
    <circle cx="495" cy="380" r="6" fill="#2196f3" stroke="none"/>
    <circle cx="495" cy="400" r="6" fill="#2196f3" stroke="none"/>
    <circle cx="295" cy="400" r="6" fill="#2196f3" stroke="none"/>
    
    <!-- Labels -->
    <text x="180" y="370" font-family="Arial" font-size="16" text-anchor="end">Dimensions:</text>
    <text x="190" y="370" font-family="Arial" font-size="16" text-anchor="start">(m+1) × (m+1)</text>
    
    <text x="620" y="350" font-family="Arial" font-size="16" text-anchor="start" fill="#f44336">Diagonal: Var(θ̂j)</text>
    <text x="620" y="380" font-family="Arial" font-size="16" text-anchor="start" fill="#2196f3">Off-diagonal: Cov(θ̂i,θ̂j)</text>
</svg>