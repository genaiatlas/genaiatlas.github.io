<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="surfaceGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e3f2fd"/>
      <stop offset="100%" style="stop-color:#1976d2"/>
    </linearGradient>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1976d2">
    Step Size in Gradient Descent Optimization
  </text>
  
  <!-- Loss Surface (Parabolic) -->
  <path d="M 100 350 Q 400 150 700 350" stroke="#1976d2" stroke-width="3" fill="none"/>
  <path d="M 120 370 Q 400 180 680 370" stroke="#42a5f5" stroke-width="2" fill="none" opacity="0.7"/>
  <path d="M 140 390 Q 400 210 660 390" stroke="#90caf9" stroke-width="2" fill="none" opacity="0.5"/>
  
  <!-- Axes -->
  <line x1="80" y1="400" x2="720" y2="400" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="100" y1="420" x2="100" y2="80" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Axis Labels -->
  <text x="730" y="405" font-family="Arial, sans-serif" font-size="14" fill="#666">w</text>
  <text x="85" y="75" font-family="Arial, sans-serif" font-size="14" fill="#666">L(w)</text>
  
  <!-- Global Minimum Point -->
  <circle cx="400" cy="150" r="5" fill="#d32f2f"/>
  <text x="405" y="140" font-family="Arial, sans-serif" font-size="12" fill="#d32f2f" font-weight="bold">Global Minimum</text>
  
  <!-- Step Size Examples -->
  <!-- Small Step Size -->
  <g id="smallSteps">
    <circle cx="150" cy="320" r="4" fill="#4caf50"/>
    <text x="120" y="310" font-family="Arial, sans-serif" font-size="11" fill="#4caf50" font-weight="bold">Small η</text>
    
    <!-- Small steps path -->
    <path d="M 150 320 L 180 300 L 210 280 L 240 260 L 270 245 L 300 230 L 330 210 L 360 185 L 390 160" 
          stroke="#4caf50" stroke-width="2" fill="none" stroke-dasharray="5,5"/>
    
    <!-- Step arrows -->
    <line x1="150" y1="320" x2="180" y2="300" stroke="#4caf50" stroke-width="1" marker-end="url(#arrowhead)"/>
    <line x1="180" y1="300" x2="210" y2="280" stroke="#4caf50" stroke-width="1" marker-end="url(#arrowhead)"/>
    <line x1="210" y1="280" x2="240" y2="260" stroke="#4caf50" stroke-width="1" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- Large Step Size -->
  <g id="largeSteps">
    <circle cx="600" cy="280" r="4" fill="#f44336"/>
    <text x="610" y="270" font-family="Arial, sans-serif" font-size="11" fill="#f44336" font-weight="bold">Large η</text>
    
    <!-- Large steps path (overshooting) -->
    <path d="M 600 280 L 350 240 L 550 220 L 300 200 L 500 180" 
          stroke="#f44336" stroke-width="2" fill="none" stroke-dasharray="3,3"/>
    
    <!-- Overshoot arrows -->
    <line x1="600" y1="280" x2="350" y2="240" stroke="#f44336" stroke-width="1" marker-end="url(#arrowhead)"/>
    <line x1="350" y1="240" x2="550" y2="220" stroke="#f44336" stroke-width="1" marker-end="url(#arrowhead)"/>
    <line x1="550" y1="220" x2="300" y2="200" stroke="#f44336" stroke-width="1" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- Optimal Step Size -->
  <g id="optimalSteps">
    <circle cx="250" cy="260" r="4" fill="#ff9800"/>
    <text x="200" y="250" font-family="Arial, sans-serif" font-size="11" fill="#ff9800" font-weight="bold">Optimal η</text>
    
    <!-- Optimal steps path -->
    <path d="M 250 260 L 300 220 L 350 190 L 385 165" 
          stroke="#ff9800" stroke-width="2" fill="none"/>
    
    <!-- Optimal step arrows -->
    <line x1="250" y1="260" x2="300" y2="220" stroke="#ff9800" stroke-width="1" marker-end="url(#arrowhead)"/>
    <line x1="300" y1="220" x2="350" y2="190" stroke="#ff9800" stroke-width="1" marker-end="url(#arrowhead)"/>
    <line x1="350" y1="190" x2="385" y2="165" stroke="#ff9800" stroke-width="1" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- Update Rule -->
  <rect x="50" y="440" width="300" height="40" fill="white" stroke="#ddd" stroke-width="1" rx="5"/>
  <text x="200" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#333">
    w<tspan baseline-shift="sub" font-size="10">t+1</tspan> = w<tspan baseline-shift="sub" font-size="10">t</tspan> - η ∇L(w<tspan baseline-shift="sub" font-size="10">t</tspan>)
  </text>
  
  <!-- Legend -->
  <rect x="520" y="440" width="250" height="50" fill="white" stroke="#ddd" stroke-width="1" rx="5"/>
  <text x="525" y="455" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Step Size Effects:</text>
  <line x1="530" y1="465" x2="550" y2="465" stroke="#4caf50" stroke-width="2"/>
  <text x="555" y="470" font-family="Arial, sans-serif" font-size="10" fill="#4caf50">Small: Slow but stable</text>
  <line x1="530" y1="475" x2="550" y2="475" stroke="#ff9800" stroke-width="2"/>
  <text x="555" y="480" font-family="Arial, sans-serif" font-size="10" fill="#ff9800">Optimal: Fast convergence</text>
  <line x1="530" y1="485" x2="550" y2="485" stroke="#f44336" stroke-width="2"/>
  <text x="555" y="490" font-family="Arial, sans-serif" font-size="10" fill="#f44336">Large: Overshooting</text>
</svg>