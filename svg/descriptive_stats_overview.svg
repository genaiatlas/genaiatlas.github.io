<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f9ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0f2fe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0fdf4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dcfce7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef7cd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fde68a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fdf2f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fce7f3;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#ffffff"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="800" height="80" fill="url(#headerGrad)"/>
  <text x="400" y="35" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="bold">Descriptive Statistics Framework</text>
  <text x="400" y="55" text-anchor="middle" fill="#e0f2fe" font-family="Arial, sans-serif" font-size="14">Summarize, Describe, and Understand Your Data</text>
  
  <!-- Central Data Icon -->
  <circle cx="400" cy="200" r="40" fill="#1e40af" opacity="0.1"/>
  <circle cx="400" cy="200" r="30" fill="#1e40af" opacity="0.2"/>
  <circle cx="400" cy="200" r="20" fill="#1e40af"/>
  <text x="400" y="205" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">DATA</text>
  
  <!-- Central Tendency Card -->
  <rect x="80" y="120" width="180" height="110" rx="10" fill="url(#cardGrad1)" stroke="#0ea5e9" stroke-width="2"/>
  <text x="170" y="140" text-anchor="middle" fill="#0c4a6e" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Central Tendency</text>
  <text x="90" y="160" fill="#0c4a6e" font-family="Arial, sans-serif" font-size="12">• Mean (Average)</text>
  <text x="90" y="175" fill="#0c4a6e" font-family="Arial, sans-serif" font-size="12">• Median (Middle)</text>
  <text x="90" y="190" fill="#0c4a6e" font-family="Arial, sans-serif" font-size="12">• Mode (Most frequent)</text>
  <text x="170" y="210" text-anchor="middle" fill="#0c4a6e" font-family="Arial, sans-serif" font-size="11" font-style="italic">Where is the center?</text>
  
  <!-- Variability Card -->
  <rect x="540" y="120" width="180" height="110" rx="10" fill="url(#cardGrad2)" stroke="#10b981" stroke-width="2"/>
  <text x="630" y="140" text-anchor="middle" fill="#064e3b" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Variability</text>
  <text x="550" y="160" fill="#064e3b" font-family="Arial, sans-serif" font-size="12">• Range</text>
  <text x="550" y="175" fill="#064e3b" font-family="Arial, sans-serif" font-size="12">• Standard Deviation</text>
  <text x="550" y="190" fill="#064e3b" font-family="Arial, sans-serif" font-size="12">• Interquartile Range</text>
  <text x="630" y="210" text-anchor="middle" fill="#064e3b" font-family="Arial, sans-serif" font-size="11" font-style="italic">How spread out?</text>
  
  <!-- Shape Card -->
  <rect x="80" y="280" width="180" height="110" rx="10" fill="url(#cardGrad3)" stroke="#f59e0b" stroke-width="2"/>
  <text x="170" y="300" text-anchor="middle" fill="#92400e" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Distribution Shape</text>
  <text x="90" y="320" fill="#92400e" font-family="Arial, sans-serif" font-size="12">• Skewness</text>
  <text x="90" y="335" fill="#92400e" font-family="Arial, sans-serif" font-size="12">• Kurtosis</text>
  <text x="90" y="350" fill="#92400e" font-family="Arial, sans-serif" font-size="12">• Normality</text>
  <text x="170" y="370" text-anchor="middle" fill="#92400e" font-family="Arial, sans-serif" font-size="11" font-style="italic">What's the shape?</text>
  
  <!-- Relationships Card -->
  <rect x="540" y="280" width="180" height="110" rx="10" fill="url(#cardGrad4)" stroke="#ec4899" stroke-width="2"/>
  <text x="630" y="300" text-anchor="middle" fill="#831843" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Relationships</text>
  <text x="550" y="320" fill="#831843" font-family="Arial, sans-serif" font-size="12">• Correlation</text>
  <text x="550" y="335" fill="#831843" font-family="Arial, sans-serif" font-size="12">• Covariance</text>
  <text x="550" y="350" fill="#831843" font-family="Arial, sans-serif" font-size="12">• Dependencies</text>
  <text x="630" y="370" text-anchor="middle" fill="#831843" font-family="Arial, sans-serif" font-size="11" font-style="italic">How do variables relate?</text>
  
  <!-- Connecting Lines -->
  <line x1="260" y1="175" x2="360" y2="190" stroke="#64748b" stroke-width="2" opacity="0.6"/>
  <line x1="540" y1="175" x2="440" y2="190" stroke="#64748b" stroke-width="2" opacity="0.6"/>
  <line x1="260" y1="335" x2="360" y2="210" stroke="#64748b" stroke-width="2" opacity="0.6"/>
  <line x1="540" y1="335" x2="440" y2="210" stroke="#64748b" stroke-width="2" opacity="0.6"/>
  
  <!-- Process Flow -->
  <rect x="50" y="450" width="700" height="120" rx="15" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="400" y="475" text-anchor="middle" fill="#1e293b" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Descriptive Statistics Process</text>
  
  <!-- Process Steps -->
  <circle cx="150" cy="510" r="25" fill="#3b82f6"/>
  <text x="150" y="515" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">1</text>
  <text x="150" y="535" text-anchor="middle" fill="#1e293b" font-family="Arial, sans-serif" font-size="11">Collect Data</text>
  
  <circle cx="300" cy="510" r="25" fill="#10b981"/>
  <text x="300" y="515" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">2</text>
  <text x="300" y="535" text-anchor="middle" fill="#1e293b" font-family="Arial, sans-serif" font-size="11">Calculate Stats</text>
  
  <circle cx="450" cy="510" r="25" fill="#f59e0b"/>
  <text x="450" y="515" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">3</text>
  <text x="450" y="535" text-anchor="middle" fill="#1e293b" font-family="Arial, sans-serif" font-size="11">Visualize</text>
  
  <circle cx="600" cy="510" r="25" fill="#ec4899"/>
  <text x="600" y="515" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">4</text>
  <text x="600" y="535" text-anchor="middle" fill="#1e293b" font-family="Arial, sans-serif" font-size="11">Interpret</text>
  
  <!-- Process Arrows -->
  <path d="M 175 510 L 270 510" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 325 510 L 420 510" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 475 510 L 570 510" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>
</svg>