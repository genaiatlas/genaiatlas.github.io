<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="supervisedHeaderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#2e7d32;stop-opacity:0.9"/>
    </linearGradient>
    <linearGradient id="unsupervisedHeaderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196f3;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#1565c0;stop-opacity:0.9"/>
    </linearGradient>
    <linearGradient id="supervisedBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f5e8;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#c8e6c9;stop-opacity:0.5"/>
    </linearGradient>
    <linearGradient id="unsupervisedBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e3f2fd;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#bbdefb;stop-opacity:0.5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="700" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#2c3e50">
    Supervised vs Unsupervised Learning Comparison
  </text>
  
  <!-- VS indicator -->
  <circle cx="500" cy="350" r="30" fill="#ff5722" stroke="#ffffff" stroke-width="3" filter="url(#shadow)"/>
  <text x="500" y="358" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">
    VS
  </text>
  
  <!-- Supervised Learning Column -->
  <rect x="50" y="80" width="400" height="550" rx="15" fill="url(#supervisedBg)" stroke="#4caf50" stroke-width="2" filter="url(#shadow)"/>
  
  <!-- Supervised Header -->
  <rect x="50" y="80" width="400" height="60" rx="15" fill="url(#supervisedHeaderGrad)" stroke="#4caf50" stroke-width="2"/>
  <text x="250" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">
    📋 SUPERVISED LEARNING
  </text>
  
  <!-- Supervised Content -->
  <text x="70" y="170" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2e7d32">
    🎯 Data Type:
  </text>
  <text x="90" y="190" font-family="Arial, sans-serif" font-size="12" fill="#1b5e20">
    • Labeled datasets (input-output pairs)
  </text>
  <text x="90" y="205" font-family="Arial, sans-serif" font-size="12" fill="#1b5e20">
    • Each example has known correct answer
  </text>
  
  <text x="70" y="235" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2e7d32">
    🎯 Primary Goal:
  </text>
  <text x="90" y="255" font-family="Arial, sans-serif" font-size="12" fill="#1b5e20">
    • Predict outcomes for new data
  </text>
  <text x="90" y="270" font-family="Arial, sans-serif" font-size="12" fill="#1b5e20">
    • Learn mapping from inputs to outputs
  </text>
  
  <text x="70" y="300" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2e7d32">
    📊 Performance Evaluation:
  </text>
  <text x="90" y="320" font-family="Arial, sans-serif" font-size="12" fill="#1b5e20">
    • Clear accuracy metrics available
  </text>
  <text x="90" y="335" font-family="Arial, sans-serif" font-size="12" fill="#1b5e20">
    • Precision, recall, F1-score, RMSE
  </text>
  <text x="90" y="350" font-family="Arial, sans-serif" font-size="12" fill="#1b5e20">
    • Easy to measure success objectively
  </text>
  
  <text x="70" y="380" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2e7d32">
    💰 Cost Factors:
  </text>
  <text x="90" y="400" font-family="Arial, sans-serif" font-size="12" fill="#1b5e20">
    • High initial cost (data labeling)
  </text>
  <text x="90" y="415" font-family="Arial, sans-serif" font-size="12" fill="#1b5e20">
    • Requires domain expertise
  </text>
  <text x="90" y="430" font-family="Arial, sans-serif" font-size="12" fill="#1b5e20">
    • Time-intensive preparation
  </text>
  
  <text x="70" y="460" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2e7d32">
    🛠️ Common Use Cases:
  </text>
  <text x="90" y="480" font-family="Arial, sans-serif" font-size="12" fill="#1b5e20">
    • Email spam detection
  </text>
  <text x="90" y="495" font-family="Arial, sans-serif" font-size="12" fill="#1b5e20">
    • Medical diagnosis
  </text>
  <text x="90" y="510" font-family="Arial, sans-serif" font-size="12" fill="#1b5e20">
    • Price prediction
  </text>
  <text x="90" y="525" font-family="Arial, sans-serif" font-size="12" fill="#1b5e20">
    • Image classification
  </text>
  
  <text x="70" y="555" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2e7d32">
    ⚡ Speed to Deployment:
  </text>
  <text x="90" y="575" font-family="Arial, sans-serif" font-size="12" fill="#1b5e20">
    • Fast (if labeled data available)
  </text>
  <text x="90" y="590" font-family="Arial, sans-serif" font-size="12" fill="#1b5e20">
    • Immediate business value
  </text>
  
  <!-- Unsupervised Learning Column -->
  <rect x="550" y="80" width="400" height="550" rx="15" fill="url(#unsupervisedBg)" stroke="#2196f3" stroke-width="2" filter="url(#shadow)"/>
  
  <!-- Unsupervised Header -->
  <rect x="550" y="80" width="400" height="60" rx="15" fill="url(#unsupervisedHeaderGrad)" stroke="#2196f3" stroke-width="2"/>
  <text x="750" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">
    🔍 UNSUPERVISED LEARNING
  </text>
  
  <!-- Unsupervised Content -->
  <text x="570" y="170" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1565c0">
    🎯 Data Type:
  </text>
  <text x="590" y="190" font-family="Arial, sans-serif" font-size="12" fill="#0d47a1">
    • Unlabeled datasets (input only)
  </text>
  <text x="590" y="205" font-family="Arial, sans-serif" font-size="12" fill="#0d47a1">
    • No predetermined correct answers
  </text>
  
  <text x="570" y="235" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1565c0">
    🎯 Primary Goal:
  </text>
  <text x="590" y="255" font-family="Arial, sans-serif" font-size="12" fill="#0d47a1">
    • Discover hidden patterns in data
  </text>
  <text x="590" y="270" font-family="Arial, sans-serif" font-size="12" fill="#0d47a1">
    • Find natural data structures
  </text>
  
  <text x="570" y="300" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1565c0">
    📊 Performance Evaluation:
  </text>
  <text x="590" y="320" font-family="Arial, sans-serif" font-size="12" fill="#0d47a1">
    • Subjective assessment required
  </text>
  <text x="590" y="335" font-family="Arial, sans-serif" font-size="12" fill="#0d47a1">
    • Domain expertise for validation
  </text>
  <text x="590" y="350" font-family="Arial, sans-serif" font-size="12" fill="#0d47a1">
    • Difficult to define "correctness"
  </text>
  
  <text x="570" y="380" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1565c0">
    💰 Cost Factors:
  </text>
  <text x="590" y="400" font-family="Arial, sans-serif" font-size="12" fill="#0d47a1">
    • Lower initial cost (no labeling)
  </text>
  <text x="590" y="415" font-family="Arial, sans-serif" font-size="12" fill="#0d47a1">
    • Computational resources needed
  </text>
  <text x="590" y="430" font-family="Arial, sans-serif" font-size="12" fill="#0d47a1">
    • Interpretation expertise required
  </text>
  
  <text x="570" y="460" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1565c0">
    🛠️ Common Use Cases:
  </text>
  <text x="590" y="480" font-family="Arial, sans-serif" font-size="12" fill="#0d47a1">
    • Customer segmentation
  </text>
  <text x="590" y="495" font-family="Arial, sans-serif" font-size="12" fill="#0d47a1">
    • Anomaly detection
  </text>
  <text x="590" y="510" font-family="Arial, sans-serif" font-size="12" fill="#0d47a1">
    • Data compression
  </text>
  <text x="590" y="525" font-family="Arial, sans-serif" font-size="12" fill="#0d47a1">
    • Market basket analysis
  </text>
  
  <text x="570" y="555" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1565c0">
    ⚡ Speed to Deployment:
  </text>
  <text x="590" y="575" font-family="Arial, sans-serif" font-size="12" fill="#0d47a1">
    • Variable (exploration phase)
  </text>
  <text x="590" y="590" font-family="Arial, sans-serif" font-size="12" fill="#0d47a1">
    • Long-term strategic insights
  </text>
  
  <!-- Decision Framework Box -->
  <rect x="200" y="650" width="600" height="40" rx="8" fill="#ffffff" stroke="#34495e" stroke-width="2" filter="url(#shadow)"/>
  <text x="500" y="670" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2c3e50">
    💡 Decision Rule: Choose Supervised for prediction tasks with labeled data,
  </text>
  <text x="500" y="685" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2c3e50">
    Unsupervised for exploration and pattern discovery
  </text>
</svg>