<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="675" fill="#f8fafc"/>
  
  <!-- Fast Track Ribbon -->
  <polygon points="1050,0 1200,0 1200,80 1050,60" fill="#3b82f6"/>
  <text x="1125" y="35" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">FAST TRACK</text>
  
  <!-- Title -->
  <text x="600" y="80" text-anchor="middle" fill="#1e293b" font-family="Arial, sans-serif" font-size="36" font-weight="bold">Conditional Loops</text>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowgreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <polygon points="0,0 0,6 9,3" fill="#10b981"/>
    </marker>
    <marker id="arrowyellow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <polygon points="0,0 0,6 9,3" fill="#f59e0b"/>
    </marker>
    <marker id="arrowblue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <polygon points="0,0 0,6 9,3" fill="#0ea5e9"/>
    </marker>
  </defs>
  
  <!-- For Loop -->
  <rect x="80" y="130" width="250" height="180" fill="#ecfdf5" stroke="#059669" stroke-width="2" rx="8"/>
  <text x="205" y="160" text-anchor="middle" fill="#059669" font-family="Arial, sans-serif" font-size="20" font-weight="bold">For Loop</text>
  <text x="205" y="185" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="14">Known iterations</text>
  
  <!-- For loop flowchart -->
  <rect x="140" y="200" width="130" height="30" fill="#d1fae5" stroke="#10b981" stroke-width="1" rx="4"/>
  <text x="205" y="220" text-anchor="middle" fill="#065f46" font-family="Arial, sans-serif" font-size="12">for i in range(5):</text>
  
  <path d="M 205 230 L 205 250" stroke="#10b981" stroke-width="2" marker-end="url(#arrowgreen)"/>
  
  <rect x="140" y="250" width="130" height="30" fill="#d1fae5" stroke="#10b981" stroke-width="1" rx="4"/>
  <text x="205" y="270" text-anchor="middle" fill="#065f46" font-family="Arial, sans-serif" font-size="12">print(f"Step {i}")</text>
  
  <!-- While Loop -->
  <rect x="360" y="130" width="250" height="180" fill="#fef3c7" stroke="#d97706" stroke-width="2" rx="8"/>
  <text x="485" y="160" text-anchor="middle" fill="#d97706" font-family="Arial, sans-serif" font-size="20" font-weight="bold">While Loop</text>
  <text x="485" y="185" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="14">Condition-based</text>
  
  <!-- While loop flowchart -->
  <rect x="420" y="200" width="130" height="30" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" rx="4"/>
  <text x="485" y="220" text-anchor="middle" fill="#92400e" font-family="Arial, sans-serif" font-size="12">while x &lt; 10:</text>
  
  <path d="M 485 230 L 485 250" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowyellow)"/>
  
  <rect x="420" y="250" width="130" height="30" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" rx="4"/>
  <text x="485" y="270" text-anchor="middle" fill="#92400e" font-family="Arial, sans-serif" font-size="12">x += 1</text>
  
  <!-- If Statement -->
  <rect x="640" y="130" width="250" height="180" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" rx="8"/>
  <text x="765" y="160" text-anchor="middle" fill="#0284c7" font-family="Arial, sans-serif" font-size="20" font-weight="bold">If Statement</text>
  <text x="765" y="185" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="14">Decision making</text>
  
  <!-- If statement flowchart -->
  <polygon points="700,200 830,200 820,230 710,230" fill="#bae6fd" stroke="#0ea5e9" stroke-width="1"/>
  <text x="765" y="220" text-anchor="middle" fill="#0c4a6e" font-family="Arial, sans-serif" font-size="12">if age &gt;= 18:</text>
  
  <path d="M 765 230 L 765 250" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arrowblue)"/>
  
  <rect x="700" y="250" width="130" height="30" fill="#bae6fd" stroke="#0ea5e9" stroke-width="1" rx="4"/>
  <text x="765" y="270" text-anchor="middle" fill="#0c4a6e" font-family="Arial, sans-serif" font-size="12">print("Adult")</text>
  
  <!-- List Comprehension -->
  <rect x="920" y="130" width="250" height="180" fill="#fce7f3" stroke="#db2777" stroke-width="2" rx="8"/>
  <text x="1045" y="160" text-anchor="middle" fill="#db2777" font-family="Arial, sans-serif" font-size="20" font-weight="bold">List Comp</text>
  <text x="1045" y="185" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="14">Pythonic lists</text>
  
  <!-- List comprehension example -->
  <rect x="980" y="200" width="130" height="50" fill="#fce7f3" stroke="#ec4899" stroke-width="1" rx="4"/>
  <text x="1045" y="220" text-anchor="middle" fill="#831843" font-family="Arial, sans-serif" font-size="11">[x*2 for x</text>
  <text x="1045" y="235" text-anchor="middle" fill="#831843" font-family="Arial, sans-serif" font-size="11">in numbers]</text>
  
  <!-- Comparison Section -->
  <rect x="100" y="350" width="1000" height="260" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="12"/>
  <text x="600" y="385" text-anchor="middle" fill="#1e293b" font-family="Arial, sans-serif" font-size="24" font-weight="bold">When to Use Each</text>
  
  <!-- Examples row -->
  <rect x="150" y="410" width="180" height="90" fill="#f0fdf4" stroke="#22c55e" stroke-width="1" rx="6"/>
  <text x="240" y="435" text-anchor="middle" fill="#16a34a" font-family="Arial, sans-serif" font-size="14" font-weight="bold">For Loop</text>
  <text x="240" y="455" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">• Processing lists</text>
  <text x="240" y="470" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">• Fixed iterations</text>
  <text x="240" y="485" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">• File reading</text>
  
  <rect x="360" y="410" width="180" height="90" fill="#fffbeb" stroke="#f59e0b" stroke-width="1" rx="6"/>
  <text x="450" y="435" text-anchor="middle" fill="#d97706" font-family="Arial, sans-serif" font-size="14" font-weight="bold">While Loop</text>
  <text x="450" y="455" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">• User input</text>
  <text x="450" y="470" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">• Unknown end</text>
  <text x="450" y="485" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">• Game loops</text>
  
  <rect x="570" y="410" width="180" height="90" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1" rx="6"/>
  <text x="660" y="435" text-anchor="middle" fill="#0284c7" font-family="Arial, sans-serif" font-size="14" font-weight="bold">If Statement</text>
  <text x="660" y="455" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">• Validation</text>
  <text x="660" y="470" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">• Branching logic</text>
  <text x="660" y="485" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">• Error handling</text>
  
  <rect x="780" y="410" width="180" height="90" fill="#fdf2f8" stroke="#ec4899" stroke-width="1" rx="6"/>
  <text x="870" y="435" text-anchor="middle" fill="#db2777" font-family="Arial, sans-serif" font-size="14" font-weight="bold">List Comp</text>
  <text x="870" y="455" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">• Transform data</text>
  <text x="870" y="470" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">• Filter lists</text>
  <text x="870" y="485" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">• One-liner magic</text>
  
  <!-- Best practices -->
  <rect x="200" y="530" width="800" height="60" fill="#f1f5f9" stroke="#64748b" stroke-width="1" rx="6"/>
  <text x="600" y="550" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Best Practices</text>
  <text x="600" y="568" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="13">Use for loops for known counts • Always have exit conditions in while loops</text>
  <text x="600" y="583" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="13">List comprehensions are faster but keep them readable</text>
</svg>