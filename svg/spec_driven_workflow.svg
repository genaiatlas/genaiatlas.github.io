<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1400" height="1000" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="700" y="50" font-size="32" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Spec-Driven Development Workflow
  </text>
  <text x="700" y="85" font-size="16" text-anchor="middle" fill="#666">
    From Specification to Implementation with AI Assistance
  </text>
  
  <!-- Workflow Steps -->
  
  <!-- Step 1: Create Specification -->
  <g transform="translate(100, 150)">
    <rect x="0" y="0" width="280" height="180" fill="#3498db" rx="12" opacity="0.9"/>
    <text x="140" y="35" font-size="20" font-weight="bold" text-anchor="middle" fill="white">
      1️⃣ Create
    </text>
    <text x="140" y="60" font-size="20" font-weight="bold" text-anchor="middle" fill="white">
      Specification
    </text>
    
    <text x="20" y="95" font-size="13" fill="white">• Define goals &amp; intent</text>
    <text x="20" y="118" font-size="13" fill="white">• Write user stories</text>
    <text x="20" y="141" font-size="13" fill="white">• Set constraints</text>
    <text x="20" y="164" font-size="13" fill="white">• List acceptance criteria</text>
  </g>
  
  <!-- Arrow 1 -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#555" />
    </marker>
  </defs>
  <path d="M 380 240 L 470 240" stroke="#555" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="425" y="230" font-size="14" text-anchor="middle" fill="#555">AI-assisted</text>
  
  <!-- Step 2: Agent Planning -->
  <g transform="translate(470, 150)">
    <rect x="0" y="0" width="280" height="180" fill="#9b59b6" rx="12" opacity="0.9"/>
    <text x="140" y="35" font-size="20" font-weight="bold" text-anchor="middle" fill="white">
      2️⃣ Agent
    </text>
    <text x="140" y="60" font-size="20" font-weight="bold" text-anchor="middle" fill="white">
      Planning
    </text>
    
    <text x="20" y="95" font-size="13" fill="white">• Parse specification</text>
    <text x="20" y="118" font-size="13" fill="white">• Create implementation plan</text>
    <text x="20" y="141" font-size="13" fill="white">• Identify required tools</text>
    <text x="20" y="164" font-size="13" fill="white">• Break down tasks</text>
  </g>
  
  <!-- Arrow 2 -->
  <path d="M 750 240 L 840 240" stroke="#555" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="795" y="230" font-size="14" text-anchor="middle" fill="#555">Review</text>
  
  <!-- Step 3: Review & Refine Plan -->
  <g transform="translate(840, 150)">
    <rect x="0" y="0" width="280" height="180" fill="#e67e22" rx="12" opacity="0.9"/>
    <text x="140" y="35" font-size="20" font-weight="bold" text-anchor="middle" fill="white">
      3️⃣ Review &amp;
    </text>
    <text x="140" y="60" font-size="20" font-weight="bold" text-anchor="middle" fill="white">
      Refine Plan
    </text>
    
    <text x="20" y="95" font-size="13" fill="white">• Verify approach</text>
    <text x="20" y="118" font-size="13" fill="white">• Adjust scope if needed</text>
    <text x="20" y="141" font-size="13" fill="white">• Add missing details</text>
    <text x="20" y="164" font-size="13" fill="white">• Approve or iterate</text>
  </g>
  
  <!-- Arrow 3 (down) -->
  <path d="M 980 330 L 980 410" stroke="#555" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  
  <!-- Step 4: Implementation -->
  <g transform="translate(840, 410)">
    <rect x="0" y="0" width="280" height="180" fill="#27ae60" rx="12" opacity="0.9"/>
    <text x="140" y="35" font-size="20" font-weight="bold" text-anchor="middle" fill="white">
      4️⃣ Agent
    </text>
    <text x="140" y="60" font-size="20" font-weight="bold" text-anchor="middle" fill="white">
      Implementation
    </text>
    
    <text x="20" y="95" font-size="13" fill="white">• Execute plan steps</text>
    <text x="20" y="118" font-size="13" fill="white">• Use tools (test, lint, git)</text>
    <text x="20" y="141" font-size="13" fill="white">• Self-correct from errors</text>
    <text x="20" y="164" font-size="13" fill="white">• Generate code &amp; tests</text>
  </g>
  
  <!-- Arrow 4 (left) -->
  <path d="M 840 500 L 750 500" stroke="#555" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  
  <!-- Step 5: Incremental Verification -->
  <g transform="translate(470, 410)">
    <rect x="0" y="0" width="280" height="180" fill="#e74c3c" rx="12" opacity="0.9"/>
    <text x="140" y="35" font-size="20" font-weight="bold" text-anchor="middle" fill="white">
      5️⃣ Incremental
    </text>
    <text x="140" y="60" font-size="20" font-weight="bold" text-anchor="middle" fill="white">
      Verification
    </text>
    
    <text x="20" y="95" font-size="13" fill="white">• Review small changes</text>
    <text x="20" y="118" font-size="13" fill="white">• Run tests</text>
    <text x="20" y="141" font-size="13" fill="white">• Check acceptance criteria</text>
    <text x="20" y="164" font-size="13" fill="white">• Version control commits</text>
  </g>
  
  <!-- Decision Diamond -->
  <g transform="translate(610, 640)">
    <polygon points="0,50 80,-30 160,50 80,130" fill="#f39c12" opacity="0.9"/>
    <text x="80" y="45" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
      Meets
    </text>
    <text x="80" y="65" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
      Acceptance
    </text>
    <text x="80" y="85" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
      Criteria?
    </text>
  </g>
  
  <!-- Arrow from verification to decision -->
  <path d="M 610 590 L 610 640" stroke="#555" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  
  <!-- No path back to implementation -->
  <path d="M 770 690 Q 900 690 900 590" stroke="#e74c3c" stroke-width="3" fill="none" marker-end="url(#arrow)" stroke-dasharray="8,4"/>
  <text x="850" y="680" font-size="14" fill="#e74c3c" font-weight="bold">No</text>
  
  <!-- Yes path to completion -->
  <path d="M 610 770 L 610 830" stroke="#27ae60" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="630" y="805" font-size="14" fill="#27ae60" font-weight="bold">Yes</text>
  
  <!-- Step 6: Complete -->
  <g transform="translate(470, 830)">
    <rect x="0" y="0" width="280" height="120" fill="#16a085" rx="12" opacity="0.9"/>
    <text x="140" y="40" font-size="22" font-weight="bold" text-anchor="middle" fill="white">
      ✅ Complete
    </text>
    
    <text x="20" y="75" font-size="13" fill="white">• Document changes</text>
    <text x="20" y="98" font-size="13" fill="white">• Final review &amp; merge</text>
  </g>
  
  <!-- Specification Components Box -->
  <g transform="translate(50, 680)">
    <rect x="0" y="0" width="350" height="280" fill="#ecf0f1" rx="10" stroke="#95a5a6" stroke-width="2"/>
    <text x="175" y="35" font-size="18" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      📋 Specification Components
    </text>
    
    <text x="20" y="70" font-size="13" font-weight="bold" fill="#34495e">Goals / Intent</text>
    <text x="30" y="90" font-size="11" fill="#5d6d7e">Explain the "why" behind task</text>
    
    <text x="20" y="120" font-size="13" font-weight="bold" fill="#34495e">User Stories</text>
    <text x="30" y="140" font-size="11" fill="#5d6d7e">How feature will be used</text>
    
    <text x="20" y="170" font-size="13" font-weight="bold" fill="#34495e">Constraints</text>
    <text x="30" y="190" font-size="11" fill="#5d6d7e">Boundaries and rules</text>
    
    <text x="20" y="220" font-size="13" font-weight="bold" fill="#34495e">Acceptance Criteria</text>
    <text x="30" y="240" font-size="11" fill="#5d6d7e">Clear, testable conditions</text>
    
    <text x="20" y="270" font-size="11" fill="#34495e">+ Approach, Data, Context...</text>
  </g>
  
  <!-- Benefits Box -->
  <g transform="translate(1000, 680)">
    <rect x="0" y="0" width="350" height="280" fill="#d5f4e6" rx="10" stroke="#27ae60" stroke-width="2"/>
    <text x="175" y="35" font-size="18" font-weight="bold" text-anchor="middle" fill="#145a32">
      💡 Key Benefits
    </text>
    
    <text x="20" y="75" font-size="13" fill="#145a32">✓ Clear expectations from start</text>
    <text x="20" y="105" font-size="13" fill="#145a32">✓ Reduced ambiguity &amp; guesswork</text>
    <text x="20" y="135" font-size="13" fill="#145a32">✓ Better agent decision-making</text>
    <text x="20" y="165" font-size="13" fill="#145a32">✓ Easier verification</text>
    <text x="20" y="195" font-size="13" fill="#145a32">✓ Documentation as byproduct</text>
    <text x="20" y="225" font-size="13" fill="#145a32">✓ AI-assisted spec creation</text>
    <text x="20" y="255" font-size="13" fill="#145a32">✓ Version-controlled plans</text>
  </g>
</svg>