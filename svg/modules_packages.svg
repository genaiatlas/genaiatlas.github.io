<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="675" fill="#f8fafc"/>
  
  <!-- Fast Track Ribbon -->
  <polygon points="1050,0 1200,0 1200,80 1050,60" fill="#3b82f6"/>
  <text x="1125" y="35" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">FAST TRACK</text>
  
  <!-- Title -->
  <text x="600" y="80" text-anchor="middle" fill="#1e293b" font-family="Arial, sans-serif" font-size="36" font-weight="bold">Modules &amp; Package Management</text>
  
  <!-- Import Statements -->
  <rect x="80" y="130" width="260" height="160" fill="#f0f9ff" stroke="#0284c7" stroke-width="2" rx="8"/>
  <text x="210" y="160" text-anchor="middle" fill="#0284c7" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Import Statements</text>
  <rect x="120" y="180" width="180" height="100" fill="#ffffff" stroke="#d1d5db" stroke-width="1" rx="4"/>
  <text x="130" y="200" fill="#374151" font-family="Courier, monospace" font-size="11">import math</text>
  <text x="130" y="220" fill="#374151" font-family="Courier, monospace" font-size="11">from datetime import datetime</text>
  <text x="130" y="240" fill="#374151" font-family="Courier, monospace" font-size="11">import numpy as np</text>
  <text x="130" y="260" fill="#374151" font-family="Courier, monospace" font-size="11">from mymodule import *</text>
  
  <!-- Package Installation -->
  <rect x="360" y="130" width="260" height="160" fill="#ecfdf5" stroke="#059669" stroke-width="2" rx="8"/>
  <text x="490" y="160" text-anchor="middle" fill="#059669" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Package Installation</text>
  <rect x="400" y="180" width="180" height="100" fill="#ffffff" stroke="#d1d5db" stroke-width="1" rx="4"/>
  <text x="410" y="200" fill="#374151" font-family="Courier, monospace" font-size="11">pip install requests</text>
  <text x="410" y="220" fill="#374151" font-family="Courier, monospace" font-size="11">pip install pandas==1.5.0</text>
  <text x="410" y="240" fill="#374151" font-family="Courier, monospace" font-size="11">pip list</text>
  <text x="410" y="260" fill="#374151" font-family="Courier, monospace" font-size="11">pip uninstall package</text>
  
  <!-- Virtual Environments -->
  <rect x="640" y="130" width="260" height="160" fill="#fef3c7" stroke="#d97706" stroke-width="2" rx="8"/>
  <text x="770" y="160" text-anchor="middle" fill="#d97706" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Virtual Environments</text>
  <rect x="680" y="180" width="180" height="100" fill="#ffffff" stroke="#d1d5db" stroke-width="1" rx="4"/>
  <text x="690" y="200" fill="#374151" font-family="Courier, monospace" font-size="10">python -m venv myenv</text>
  <text x="690" y="220" fill="#374151" font-family="Courier, monospace" font-size="10">myenv\Scripts\activate  # Win</text>
  <text x="690" y="240" fill="#374151" font-family="Courier, monospace" font-size="10">source myenv/bin/activate</text>
  <text x="690" y="260" fill="#374151" font-family="Courier, monospace" font-size="10">deactivate</text>
  
  <!-- Creating Modules -->
  <rect x="920" y="130" width="260" height="160" fill="#fce7f3" stroke="#db2777" stroke-width="2" rx="8"/>
  <text x="1050" y="160" text-anchor="middle" fill="#db2777" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Creating Modules</text>
  <rect x="960" y="180" width="180" height="100" fill="#ffffff" stroke="#d1d5db" stroke-width="1" rx="4"/>
  <text x="970" y="200" fill="#374151" font-family="Courier, monospace" font-size="11"># mymodule.py</text>
  <text x="970" y="220" fill="#374151" font-family="Courier, monospace" font-size="11">def greet(name):</text>
  <text x="980" y="240" fill="#374151" font-family="Courier, monospace" font-size="11">return f"Hello {name}"</text>
  <text x="970" y="260" fill="#374151" font-family="Courier, monospace" font-size="11">PI = 3.14159</text>
  
  <!-- Module System Flow -->
  <rect x="100" y="320" width="1000" height="280" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="12"/>
  <text x="600" y="355" text-anchor="middle" fill="#1e293b" font-family="Arial, sans-serif" font-size="24" font-weight="bold">Python Module System</text>
  
  <!-- Built-in Modules -->
  <rect x="150" y="380" width="180" height="80" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="8"/>
  <text x="240" y="405" text-anchor="middle" fill="#1e40af" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Built-in Modules</text>
  <text x="240" y="425" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">math, datetime, os</text>
  <text x="240" y="445" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">json, random, sys</text>
  
  <!-- Simple down arrow -->
  <path d="M 240 460 L 240 490" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrow)"/>
  
  <!-- Third-party Packages -->
  <rect x="350" y="380" width="180" height="80" fill="#dcfce7" stroke="#16a34a" stroke-width="2" rx="8"/>
  <text x="440" y="405" text-anchor="middle" fill="#15803d" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Third-party</text>
  <text x="440" y="425" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">requests, pandas</text>
  <text x="440" y="445" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">numpy, matplotlib</text>
  
  <!-- Simple down arrow -->
  <path d="M 440 460 L 440 490" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow)"/>
  
  <!-- Your Modules -->
  <rect x="550" y="380" width="180" height="80" fill="#fef3c7" stroke="#d97706" stroke-width="2" rx="8"/>
  <text x="640" y="405" text-anchor="middle" fill="#b45309" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Your Modules</text>
  <text x="640" y="425" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">Custom .py files</text>
  <text x="640" y="445" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">Organize your code</text>
  
  <!-- Simple down arrow -->
  <path d="M 640 460 L 640 490" stroke="#d97706" stroke-width="3" marker-end="url(#arrow)"/>
  
  <!-- Package Index -->
  <rect x="750" y="380" width="180" height="80" fill="#fce7f3" stroke="#db2777" stroke-width="2" rx="8"/>
  <text x="840" y="405" text-anchor="middle" fill="#be185d" font-family="Arial, sans-serif" font-size="16" font-weight="bold">PyPI Repository</text>
  <text x="840" y="425" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">500,000+ packages</text>
  <text x="840" y="445" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">pypi.org</text>
  
  <!-- Simple down arrow -->
  <path d="M 840 460 L 840 490" stroke="#db2777" stroke-width="3" marker-end="url(#arrow)"/>
  
  <!-- Your Project - spans the width -->
  <rect x="200" y="500" width="640" height="60" fill="#f1f5f9" stroke="#64748b" stroke-width="2" rx="8"/>
  <text x="520" y="525" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Your Python Project</text>
  <text x="520" y="545" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="14">Imports and uses all module types</text>
  
  <!-- Best Practices -->
  <text x="150" y="620" fill="#374151" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Best Practices:</text>
  <circle cx="120" cy="635" r="3" fill="#16a34a"/>
  <text x="135" y="640" fill="#374151" font-family="Arial, sans-serif" font-size="12">Use virtual environments for each project</text>
  <circle cx="120" cy="655" r="3" fill="#16a34a"/>
  <text x="135" y="660" fill="#374151" font-family="Arial, sans-serif" font-size="12">Create requirements.txt: pip freeze &gt; requirements.txt</text>
  
  <circle cx="450" cy="635" r="3" fill="#16a34a"/>
  <text x="465" y="640" fill="#374151" font-family="Arial, sans-serif" font-size="12">Import only what you need for better performance</text>
  <circle cx="450" cy="655" r="3" fill="#16a34a"/>
  <text x="465" y="660" fill="#374151" font-family="Arial, sans-serif" font-size="12">Use descriptive module names, avoid naming conflicts</text>
  
  <!-- Popular Packages -->
  <text x="800" y="620" fill="#374151" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Popular Packages:</text>
  <text x="800" y="640" fill="#6b7280" font-family="Arial, sans-serif" font-size="12">requests (HTTP), pandas (data), numpy (math), matplotlib (plots)</text>
  <text x="800" y="655" fill="#6b7280" font-family="Arial, sans-serif" font-size="12">flask/django (web), pytest (testing), pillow (images)</text>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <polygon points="0,0 0,6 9,3" fill="#374151"/>
    </marker>
  </defs>
</svg>