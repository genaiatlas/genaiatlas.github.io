<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Conditional Probability &amp; Independence
  </text>
  
  <!-- Conditional Probability Section -->
  <g transform="translate(50, 80)">
    <text x="0" y="0" font-family="Arial" font-size="18" font-weight="bold" fill="#34495e">
      Conditional Probability: P(A|B)
    </text>
    
    <!-- Venn Diagram -->
    <g transform="translate(50, 30)">
      <rect x="-10" y="-10" width="220" height="170" rx="5" fill="#ecf0f1" stroke="#95a5a6" stroke-width="1"/>
      <text x="100" y="-15" font-family="Arial" font-size="12" text-anchor="middle" fill="#7f8c8d">
        Sample Space
      </text>
      
      <!-- Event B -->
      <circle cx="70" cy="70" r="50" fill="#3498db" fill-opacity="0.4" stroke="#2980b9" stroke-width="2"/>
      <text x="50" y="75" font-family="Arial" font-size="16" font-weight="bold" fill="#2980b9">
        B
      </text>
      
      <!-- Event A -->
      <circle cx="130" cy="70" r="50" fill="#e74c3c" fill-opacity="0.4" stroke="#c0392b" stroke-width="2"/>
      <text x="150" y="75" font-family="Arial" font-size="16" font-weight="bold" fill="#c0392b">
        A
      </text>
      
      <!-- Intersection -->
      <text x="100" y="75" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#8e44ad">
        A∩B
      </text>
    </g>
    
    <!-- Formula -->
    <g transform="translate(300, 50)">
      <rect x="0" y="0" width="200" height="80" rx="8" fill="#fff" stroke="#3498db" stroke-width="2" filter="url(#shadow)"/>
      <text x="100" y="30" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">
        Formula:
      </text>
      <text x="100" y="55" font-family="Arial" font-size="18" text-anchor="middle" fill="#2c3e50">
        P(A|B) = P(A∩B)/P(B)
      </text>
      <text x="100" y="72" font-family="Arial" font-size="12" text-anchor="middle" fill="#7f8c8d">
        where P(B) &gt; 0
      </text>
    </g>
  </g>
  
  <!-- Independence Section -->
  <g transform="translate(50, 280)">
    <text x="0" y="0" font-family="Arial" font-size="18" font-weight="bold" fill="#34495e">
      Independence
    </text>
    
    <!-- Independent Events -->
    <g transform="translate(0, 30)">
      <rect x="0" y="0" width="320" height="100" rx="8" fill="#e8f8f5" stroke="#16a085" stroke-width="2"/>
      <text x="10" y="25" font-family="Arial" font-size="14" font-weight="bold" fill="#16a085">
        Events A and B are independent if:
      </text>
      <text x="20" y="50" font-family="Arial" font-size="13" fill="#2c3e50">
        • P(A ∩ B) = P(A) × P(B)
      </text>
      <text x="20" y="70" font-family="Arial" font-size="13" fill="#2c3e50">
        • P(A|B) = P(A)
      </text>
      <text x="20" y="90" font-family="Arial" font-size="13" fill="#2c3e50">
        • P(B|A) = P(B)
      </text>
    </g>
    
    <!-- Example Visualization -->
    <g transform="translate(350, 30)">
      <rect x="0" y="0" width="150" height="100" rx="8" fill="#fff5e6" stroke="#f39c12" stroke-width="2"/>
      <text x="75" y="20" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#e67e22">
        Example: Die &amp; Coin
      </text>
      
      <!-- Die -->
      <rect x="20" y="35" width="30" height="30" rx="3" fill="#e74c3c" stroke="#c0392b" stroke-width="1"/>
      <circle cx="30" cy="45" r="2" fill="white"/>
      <circle cx="40" cy="45" r="2" fill="white"/>
      <circle cx="30" cy="55" r="2" fill="white"/>
      <circle cx="40" cy="55" r="2" fill="white"/>
      
      <!-- Coin -->
      <circle cx="100" cy="50" r="20" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
      <text x="100" y="55" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
        H
      </text>
      
      <text x="75" y="85" font-family="Arial" font-size="10" text-anchor="middle" fill="#7f8c8d">
        Independent outcomes
      </text>
    </g>
  </g>
  
  <!-- Conditional Independence Section -->
  <g transform="translate(50, 430)">
    <text x="0" y="0" font-family="Arial" font-size="18" font-weight="bold" fill="#34495e">
      Conditional Independence
    </text>
    
    <g transform="translate(0, 30)">
      <rect x="0" y="0" width="700" height="110" rx="8" fill="#f4ecf7" stroke="#8e44ad" stroke-width="2"/>
      
      <text x="10" y="25" font-family="Arial" font-size="14" font-weight="bold" fill="#8e44ad">
        A and B are conditionally independent given C if: P(A ∩ B|C) = P(A|C) × P(B|C)
      </text>
      
      <!-- Two Coin Example -->
      <g transform="translate(20, 40)">
        <text x="0" y="0" font-family="Arial" font-size="12" font-weight="bold" fill="#2c3e50">
          Example: Two-Coin Box
        </text>
        
        <!-- Regular Coin -->
        <g transform="translate(0, 15)">
          <circle cx="20" cy="20" r="15" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
          <text x="20" y="25" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle" fill="white">
            H/T
          </text>
          <text x="20" y="45" font-family="Arial" font-size="10" text-anchor="middle" fill="#7f8c8d">
            Regular
          </text>
        </g>
        
        <!-- Two-Headed Coin -->
        <g transform="translate(80, 15)">
          <circle cx="20" cy="20" r="15" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
          <text x="20" y="25" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle" fill="white">
            H/H
          </text>
          <text x="20" y="45" font-family="Arial" font-size="10" text-anchor="middle" fill="#7f8c8d">
            Two-headed
          </text>
        </g>
        
        <!-- Explanation -->
        <text x="180" y="20" font-family="Arial" font-size="11" fill="#2c3e50">
          C = coin selected (known)
        </text>
        <text x="180" y="35" font-family="Arial" font-size="11" fill="#2c3e50">
          A = First toss is H
        </text>
        <text x="180" y="50" font-family="Arial" font-size="11" fill="#2c3e50">
          B = Second toss is H
        </text>
        
        <text x="380" y="35" font-family="Arial" font-size="11" fill="#8e44ad">
          → Given C, A and B become independent
        </text>
      </g>
    </g>
  </g>
</svg>