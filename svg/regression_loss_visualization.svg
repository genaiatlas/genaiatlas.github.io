<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#66BB6A;stop-opacity:0.6" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="600" fill="#fafafa"/>
  
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1a1a1a">Mean Squared Error (MSE) Loss Visualization</text>
  
  <!-- Main Plot Area -->
  <g transform="translate(80, 80)">
    <!-- Axes -->
    <line x1="0" y1="350" x2="500" y2="350" stroke="#333" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="350" stroke="#333" stroke-width="2"/>
    
    <!-- Axis Labels -->
    <text x="250" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#555">Input (x)</text>
    <text x="-40" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#555" transform="rotate(-90, -40, 175)">Output (y)</text>
    
    <!-- Grid Lines -->
    <g stroke="#e0e0e0" stroke-width="1" opacity="0.5">
      <line x1="100" y1="0" x2="100" y2="350"/>
      <line x1="200" y1="0" x2="200" y2="350"/>
      <line x1="300" y1="0" x2="300" y2="350"/>
      <line x1="400" y1="0" x2="400" y2="350"/>
      <line x1="0" y1="70" x2="500" y2="70"/>
      <line x1="0" y1="140" x2="500" y2="140"/>
      <line x1="0" y1="210" x2="500" y2="210"/>
      <line x1="0" y1="280" x2="500" y2="280"/>
    </g>
    
    <!-- True Function (curved line) -->
    <path d="M0 300 Q125 250 250 200 Q375 150 500 100" stroke="#2196F3" stroke-width="3" fill="none"/>
    <text x="420" y="90" font-family="Arial, sans-serif" font-size="12" fill="#2196F3" font-weight="bold">True Function</text>
    
    <!-- Predicted Function (straight line) -->
    <line x1="0" y1="320" x2="500" y2="120" stroke="#FF5722" stroke-width="3" stroke-dasharray="8,4"/>
    <text x="350" y="140" font-family="Arial, sans-serif" font-size="12" fill="#FF5722" font-weight="bold">Predicted Function</text>
    
    <!-- Data Points and Errors -->
    <!-- Point 1 -->
    <circle cx="100" cy="275" r="6" fill="#2196F3" stroke="white" stroke-width="2"/>
    <circle cx="100" cy="288" r="4" fill="#FF5722"/>
    <line x1="100" y1="275" x2="100" y2="288" stroke="#E91E63" stroke-width="3"/>
    <text x="110" y="270" font-family="Arial, sans-serif" font-size="10" fill="#333">True</text>
    <text x="110" y="295" font-family="Arial, sans-serif" font-size="10" fill="#333">Pred</text>
    
    <!-- Point 2 -->
    <circle cx="200" cy="230" r="6" fill="#2196F3" stroke="white" stroke-width="2"/>
    <circle cx="200" cy="248" r="4" fill="#FF5722"/>
    <line x1="200" y1="230" x2="200" y2="248" stroke="#E91E63" stroke-width="3"/>
    
    <!-- Point 3 -->
    <circle cx="300" cy="180" r="6" fill="#2196F3" stroke="white" stroke-width="2"/>
    <circle cx="300" cy="208" r="4" fill="#FF5722"/>
    <line x1="300" y1="180" x2="300" y2="208" stroke="#E91E63" stroke-width="3"/>
    
    <!-- Point 4 -->
    <circle cx="400" cy="140" r="6" fill="#2196F3" stroke="white" stroke-width="2"/>
    <circle cx="400" cy="168" r="4" fill="#FF5722"/>
    <line x1="400" y1="140" x2="400" y2="168" stroke="#E91E63" stroke-width="3"/>
    
    <!-- Error Visualization (Squared Areas) -->
    <rect x="85" y="275" width="13" height="13" fill="#E91E6350" stroke="#E91E63" stroke-width="1"/>
    <rect x="182" y="230" width="18" height="18" fill="#E91E6350" stroke="#E91E63" stroke-width="1"/>
    <rect x="272" y="180" width="28" height="28" fill="#E91E6350" stroke="#E91E63" stroke-width="1"/>
    <rect x="372" y="140" width="28" height="28" fill="#E91E6350" stroke="#E91E63" stroke-width="1"/>
    
    <!-- Error Labels -->
    <text x="91" y="295" font-family="Arial, sans-serif" font-size="9" fill="#E91E63">e₁²</text>
    <text x="191" y="255" font-family="Arial, sans-serif" font-size="9" fill="#E91E63">e₂²</text>
    <text x="286" y="215" font-family="Arial, sans-serif" font-size="9" fill="#E91E63">e₃²</text>
    <text x="386" y="175" font-family="Arial, sans-serif" font-size="9" fill="#E91E63">e₄²</text>
  </g>
  
  <!-- Formula Section -->
  <g transform="translate(600, 100)">
    <rect x="0" y="0" width="280" height="200" rx="10" fill="url(#mseGradient)" filter="url(#glow)"/>
    
    <!-- Formula Title -->
    <text x="140" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">MSE Formula</text>
    
    <!-- Main Formula -->
    <text x="140" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="white" font-weight="bold">L(data, θ) = 1/n Σ(yᵢ - F(xᵢ;θ))²</text>
    
    <!-- Step by Step -->
    <text x="20" y="95" font-family="Arial, sans-serif" font-size="12" fill="white">Where:</text>
    <text x="20" y="115" font-family="Arial, sans-serif" font-size="11" fill="white">• n = number of data points</text>
    <text x="20" y="130" font-family="Arial, sans-serif" font-size="11" fill="white">• yᵢ = true value</text>
    <text x="20" y="145" font-family="Arial, sans-serif" font-size="11" fill="white">• F(xᵢ;θ) = predicted value</text>
    <text x="20" y="160" font-family="Arial, sans-serif" font-size="11" fill="white">• (yᵢ - F(xᵢ;θ)) = error</text>
    
    <!-- Key Property -->
    <text x="140" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Range: [0, ∞) | Lower = Better</text>
  </g>
  
  <!-- Calculation Example -->
  <g transform="translate(80, 450)">
    <rect x="0" y="0" width="740" height="120" rx="8" fill="#f5f5f5" stroke="#ccc" stroke-width="1"/>
    
    <text x="20" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Step-by-Step MSE Calculation:</text>
    
    <!-- Step 1 -->
    <text x="20" y="50" font-family="Arial, sans-serif" font-size="12" fill="#333">1. Calculate individual errors: e₁ = 13, e₂ = 18, e₃ = 28, e₄ = 28</text>
    
    <!-- Step 2 -->
    <text x="20" y="70" font-family="Arial, sans-serif" font-size="12" fill="#333">2. Square the errors: e₁² = 169, e₂² = 324, e₃² = 784, e₄² = 784</text>
    
    <!-- Step 3 -->
    <text x="20" y="90" font-family="Arial, sans-serif" font-size="12" fill="#333">3. Average the squared errors: MSE = (169 + 324 + 784 + 784) / 4 = 515.25</text>
    
    <!-- Insight -->
    <text x="20" y="110" font-family="Arial, sans-serif" font-size="11" fill="#666" font-style="italic">💡 Larger errors are penalized more heavily due to squaring</text>
  </g>
  
  <!-- Legend -->
  <g transform="translate(650, 350)">
    <rect x="0" y="0" width="200" height="80" rx="5" fill="white" stroke="#ddd" stroke-width="1"/>
    <text x="100" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Legend</text>
    
    <circle cx="20" cy="35" r="4" fill="#2196F3"/>
    <text x="35" y="40" font-family="Arial, sans-serif" font-size="10" fill="#333">Actual Values</text>
    
    <circle cx="20" cy="50" r="3" fill="#FF5722"/>
    <text x="35" y="55" font-family="Arial, sans-serif" font-size="10" fill="#333">Predictions</text>
    
    <line x1="15" y1="65" x2="25" y2="65" stroke="#E91E63" stroke-width="2"/>
    <text x="35" y="70" font-family="Arial, sans-serif" font-size="10" fill="#333">Error</text>
  </g>
</svg>