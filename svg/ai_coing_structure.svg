<svg viewBox="0 0 1200 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="1000" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="600" y="50" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#1e293b" text-anchor="middle">Implementation Approach</text>
  <text x="600" y="85" font-family="Arial, sans-serif" font-size="16" fill="#64748b" text-anchor="middle">Progressive Adoption Strategy for AI-Assisted Development</text>
  
  <!-- Phase 1: Foundation -->
  <g transform="translate(100, 140)">
    <rect width="450" height="180" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="3"/>
    
    <circle cx="40" cy="30" r="22" fill="#3b82f6"/>
    <text x="40" y="38" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">1</text>
    
    <text x="80" y="35" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1e40af">Foundation &amp; Setup</text>
    
    <g transform="translate(30, 70)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">Topics:</text>
      <text x="0" y="25" font-family="Arial, sans-serif" font-size="13" fill="#475569">• Understanding how AI coding tools work</text>
      <text x="0" y="45" font-family="Arial, sans-serif" font-size="13" fill="#475569">• Configuring tools for your workflow</text>
      <text x="0" y="65" font-family="Arial, sans-serif" font-size="13" fill="#475569">• Building project-specific context stack</text>
      <text x="0" y="85" font-family="Arial, sans-serif" font-size="13" fill="#475569">• Establishing team conventions</text>
    </g>
  </g>
  
  <!-- Arrow down -->
  <line x1="325" y1="330" x2="325" y2="380" stroke="#6366f1" stroke-width="4" marker-end="url(#arrow1)"/>
  <text x="360" y="360" font-family="Arial, sans-serif" font-size="14" fill="#6366f1">Next</text>
  
  <!-- Phase 2: Interactive Development -->
  <g transform="translate(650, 140)">
    <rect width="450" height="180" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="3"/>
    
    <circle cx="40" cy="30" r="22" fill="#22c55e"/>
    <text x="40" y="38" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">2</text>
    
    <text x="80" y="35" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#15803d">Interactive Development</text>
    
    <g transform="translate(30, 70)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">Topics:</text>
      <text x="0" y="25" font-family="Arial, sans-serif" font-size="13" fill="#475569">• Working with IDE and terminal agents</text>
      <text x="0" y="45" font-family="Arial, sans-serif" font-size="13" fill="#475569">• Effective team collaboration patterns</text>
      <text x="0" y="65" font-family="Arial, sans-serif" font-size="13" fill="#475569">• Feature development workflows</text>
      <text x="0" y="85" font-family="Arial, sans-serif" font-size="13" fill="#475569">• From idea to merge-ready PR</text>
    </g>
  </g>
  
  <!-- Arrow down -->
  <line x1="875" y1="330" x2="875" y2="380" stroke="#6366f1" stroke-width="4" marker-end="url(#arrow1)"/>
  <text x="910" y="360" font-family="Arial, sans-serif" font-size="14" fill="#6366f1">Next</text>
  
  <!-- Phase 3: Advanced Automation -->
  <g transform="translate(100, 400)">
    <rect width="450" height="180" rx="12" fill="#fce7f3" stroke="#ec4899" stroke-width="3"/>
    
    <circle cx="40" cy="30" r="22" fill="#ec4899"/>
    <text x="40" y="38" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">3</text>
    
    <text x="80" y="35" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#be185d">Advanced Automation</text>
    
    <g transform="translate(30, 70)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">Topics:</text>
      <text x="0" y="25" font-family="Arial, sans-serif" font-size="13" fill="#475569">• Background and autonomous agents</text>
      <text x="0" y="45" font-family="Arial, sans-serif" font-size="13" fill="#475569">• Schedule and event-driven tasks</text>
      <text x="0" y="65" font-family="Arial, sans-serif" font-size="13" fill="#475569">• CI/CD pipeline integration</text>
      <text x="0" y="85" font-family="Arial, sans-serif" font-size="13" fill="#475569">• Custom integrations for specific needs</text>
    </g>
  </g>
  
  <!-- Arrow down -->
  <line x1="325" y1="590" x2="325" y2="640" stroke="#6366f1" stroke-width="4" marker-end="url(#arrow1)"/>
  <text x="360" y="620" font-family="Arial, sans-serif" font-size="14" fill="#6366f1">Next</text>
  
  <!-- Phase 4: Continuous Optimization -->
  <g transform="translate(650, 400)">
    <rect width="450" height="180" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
    
    <circle cx="40" cy="30" r="22" fill="#f59e0b"/>
    <text x="40" y="38" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">4</text>
    
    <text x="80" y="35" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#b45309">Continuous Optimization</text>
    
    <g transform="translate(30, 70)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">Topics:</text>
      <text x="0" y="25" font-family="Arial, sans-serif" font-size="13" fill="#475569">• Measure and track effectiveness</text>
      <text x="0" y="45" font-family="Arial, sans-serif" font-size="13" fill="#475569">• Update context based on learnings</text>
      <text x="0" y="65" font-family="Arial, sans-serif" font-size="13" fill="#475569">• Expand to new use cases</text>
      <text x="0" y="85" font-family="Arial, sans-serif" font-size="13" fill="#475569">• Share knowledge across organization</text>
    </g>
  </g>
  
  <!-- Arrow down -->
  <line x1="875" y1="590" x2="875" y2="640" stroke="#6366f1" stroke-width="4" marker-end="url(#arrow1)"/>
  <text x="910" y="620" font-family="Arial, sans-serif" font-size="14" fill="#6366f1">Next</text>
  
  <!-- Benefits Banner -->
  <g transform="translate(200, 660)">
    <rect width="800" height="180" rx="12" fill="#ede9fe" stroke="#8b5cf6" stroke-width="3"/>
    
    <text x="400" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#5b21b6" text-anchor="middle">Expected Outcomes</text>
    
    <g transform="translate(50, 60)">
      <circle cx="10" cy="15" r="6" fill="#8b5cf6"/>
      <text x="30" y="20" font-family="Arial, sans-serif" font-size="14" fill="#1e293b">Comprehensive AI toolchain integrated into workflow</text>
      
      <circle cx="10" cy="45" r="6" fill="#8b5cf6"/>
      <text x="30" y="50" font-family="Arial, sans-serif" font-size="14" fill="#1e293b">Faster feature development with maintained quality</text>
      
      <circle cx="10" cy="75" r="6" fill="#8b5cf6"/>
      <text x="30" y="80" font-family="Arial, sans-serif" font-size="14" fill="#1e293b">Systematic automation across development lifecycle</text>
      
      <circle cx="10" cy="105" r="6" fill="#8b5cf6"/>
      <text x="30" y="110" font-family="Arial, sans-serif" font-size="14" fill="#1e293b">Scalable practices that grow with the team</text>
      
      <circle cx="10" cy="135" r="6" fill="#8b5cf6"/>
      <text x="30" y="140" font-family="Arial, sans-serif" font-size="14" fill="#1e293b">Continuous improvement and knowledge sharing</text>
    </g>
  </g>
  
  <!-- Bottom Note -->
  <g transform="translate(250, 880)">
    <rect width="700" height="70" rx="10" fill="#6366f1" opacity="0.9"/>
    <text x="350" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">Progressive Adoption:</text>
    <text x="350" y="52" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">Start small with low-risk use cases, establish patterns,</text>
    <text x="350" y="70" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">then systematically expand across your workflow</text>
  </g>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrow1" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#6366f1"/>
    </marker>
  </defs>
  
  <!-- Feedback loop arrow -->
  <path d="M 875 660 Q 1050 500, 875 340" stroke="#f59e0b" stroke-width="3" fill="none" stroke-dasharray="8,4" marker-end="url(#arrow2)"/>
  <text x="1030" y="500" font-family="Arial, sans-serif" font-size="13" fill="#f59e0b" transform="rotate(-90, 1030, 500)">Continuous</text>
  <text x="1050" y="500" font-family="Arial, sans-serif" font-size="13" fill="#f59e0b" transform="rotate(-90, 1050, 500)">Feedback</text>
  
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#f59e0b"/>
    </marker>
  </defs>
</svg>