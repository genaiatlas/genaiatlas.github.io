<svg width="1200" height="675" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="675" fill="#f8f9fa"/>
  
  <!-- Fast Track Ribbon -->
  <polygon points="1050,0 1200,0 1200,150" fill="#e74c3c"/>
  <text x="1125" y="75" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" transform="rotate(45 1125 75)">FAST TRACK</text>
  
  <!-- Title -->
  <text x="600" y="50" fill="#2c3e50" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle">Hypothesis Testing in Python</text>
  
  <!-- Main Flow -->
  <rect x="50" y="100" width="200" height="80" fill="#3498db" stroke="#2c3e50" stroke-width="2" rx="10"/>
  <text x="150" y="130" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">1. Define</text>
  <text x="150" y="150" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Hypotheses</text>
  <text x="150" y="170" fill="white" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">H₀ vs H₁</text>
  
  <rect x="300" y="100" width="200" height="80" fill="#27ae60" stroke="#2c3e50" stroke-width="2" rx="10"/>
  <text x="400" y="130" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">2. Choose Test</text>
  <text x="400" y="150" fill="white" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">scipy.stats</text>
  <text x="400" y="170" fill="white" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">functions</text>
  
  <rect x="550" y="100" width="200" height="80" fill="#f39c12" stroke="#2c3e50" stroke-width="2" rx="10"/>
  <text x="650" y="130" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">3. Calculate</text>
  <text x="650" y="150" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Statistics</text>
  <text x="650" y="170" fill="white" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">p-value</text>
  
  <rect x="800" y="100" width="200" height="80" fill="#9b59b6" stroke="#2c3e50" stroke-width="2" rx="10"/>
  <text x="900" y="130" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">4. Make</text>
  <text x="900" y="150" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Decision</text>
  <text x="900" y="170" fill="white" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">α = 0.05</text>
  
  <!-- Arrows -->
  <path d="M 250 140 L 300 140" stroke="#2c3e50" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 500 140 L 550 140" stroke="#2c3e50" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 750 140 L 800 140" stroke="#2c3e50" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Test Types -->
  <text x="100" y="230" fill="#2c3e50" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Common Tests:</text>
  
  <rect x="50" y="250" width="250" height="60" fill="#ecf0f1" stroke="#34495e" stroke-width="1" rx="5"/>
  <text x="60" y="270" fill="#2c3e50" font-family="Arial, sans-serif" font-size="14" font-weight="bold">One-sample t-test</text>
  <text x="60" y="290" fill="#7f8c8d" font-family="monospace" font-size="12">ttest_1samp(data, popmean)</text>
  
  <rect x="320" y="250" width="250" height="60" fill="#ecf0f1" stroke="#34495e" stroke-width="1" rx="5"/>
  <text x="330" y="270" fill="#2c3e50" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Two-sample t-test</text>
  <text x="330" y="290" fill="#7f8c8d" font-family="monospace" font-size="12">ttest_ind(group1, group2)</text>
  
  <rect x="590" y="250" width="250" height="60" fill="#ecf0f1" stroke="#34495e" stroke-width="1" rx="5"/>
  <text x="600" y="270" fill="#2c3e50" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Chi-square</text>
  <text x="600" y="290" fill="#7f8c8d" font-family="monospace" font-size="12">chi2_contingency(table)</text>
  
  <rect x="860" y="250" width="250" height="60" fill="#ecf0f1" stroke="#34495e" stroke-width="1" rx="5"/>
  <text x="870" y="270" fill="#2c3e50" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Mann-Whitney U</text>
  <text x="870" y="290" fill="#7f8c8d" font-family="monospace" font-size="12">mannwhitneyu(x, y)</text>
  
  <!-- Code Example -->
  <rect x="50" y="350" width="1100" height="120" fill="#2c3e50" stroke="#34495e" stroke-width="2" rx="5"/>
  <text x="70" y="380" fill="#f39c12" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Example Code:</text>
  <text x="70" y="410" fill="#ecf0f1" font-family="monospace" font-size="14">import scipy.stats as stats</text>
  <text x="70" y="430" fill="#ecf0f1" font-family="monospace" font-size="14">import numpy as np</text>
  <text x="70" y="450" fill="#ecf0f1" font-family="monospace" font-size="14">statistic, p_value = stats.ttest_1samp(data, popmean=100)</text>
  
  <!-- Key Points -->
  <rect x="50" y="500" width="500" height="120" fill="#e8f8f5" stroke="#27ae60" stroke-width="2" rx="5"/>
  <text x="70" y="530" fill="#27ae60" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Key Points:</text>
  <text x="70" y="550" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12">• Check assumptions before testing</text>
  <text x="70" y="570" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12">• p value less than 0.05 typically indicates significance</text>
  <text x="70" y="590" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12">• Consider effect size alongside p-value</text>
  <text x="70" y="610" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12">• Use non-parametric tests when needed</text>
  
  <!-- Decision Tree -->
  <rect x="600" y="500" width="550" height="120" fill="#fef9e7" stroke="#f39c12" stroke-width="2" rx="5"/>
  <text x="620" y="530" fill="#f39c12" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Decision Guide:</text>
  <text x="620" y="550" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12">• Normal data + 1 group → One-sample t-test</text>
  <text x="620" y="570" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12">• Normal data + 2 groups → Two-sample t-test</text>
  <text x="620" y="590" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12">• Categorical data → Chi-square test</text>
  <text x="620" y="610" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12">• Non-normal data → Mann-Whitney U</text>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/>
    </marker>
  </defs>
</svg>