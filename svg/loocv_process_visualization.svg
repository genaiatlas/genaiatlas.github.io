<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font-family: Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #2c3e50; }
    .subtitle { font-family: Arial, sans-serif; font-size: 16px; fill: #34495e; font-weight: bold; }
    .text { font-family: Arial, sans-serif; font-size: 12px; fill: #34495e; }
    .small { font-family: Arial, sans-serif; font-size: 10px; fill: #34495e; }
  </style>
  
  <!-- Background -->
  <rect width="800" height="600" fill="white"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title">Leave-One-Out Cross-Validation (LOOCV)</text>
  
  <!-- Process illustration -->
  <rect x="50" y="60" width="700" height="150" fill="#e8f6f3" stroke="#16a085" stroke-width="2" rx="8"/>
  <text x="400" y="85" text-anchor="middle" class="subtitle" style="fill: #16a085;">LOOCV Process: n Iterations</text>
  
  <!-- Iteration 1 -->
  <g transform="translate(80, 110)">
    <circle cx="15" cy="15" r="12" fill="#34495e"/>
    <text x="15" y="20" text-anchor="middle" style="fill: white; font-size: 12px; font-weight: bold;">1</text>
    <text x="35" y="20" class="text">Iteration 1: Leave out point 1</text>
    
    <!-- Data visualization -->
    <rect x="0" y="30" width="15" height="12" fill="#e74c3c" stroke="#c0392b"/>
    <text x="7.5" y="50" text-anchor="middle" class="small">Val</text>
    
    <rect x="20" y="30" width="100" height="12" fill="#3498db" stroke="#2980b9"/>
    <text x="70" y="50" text-anchor="middle" class="small">Training (n-1 points)</text>
  </g>
  
  <!-- Iteration 2 -->
  <g transform="translate(280, 110)">
    <circle cx="15" cy="15" r="12" fill="#34495e"/>
    <text x="15" y="20" text-anchor="middle" style="fill: white; font-size: 12px; font-weight: bold;">2</text>
    <text x="35" y="20" class="text">Iteration 2: Leave out point 2</text>
    
    <rect x="0" y="30" width="15" height="12" fill="#3498db" stroke="#2980b9"/>
    <rect x="20" y="30" width="15" height="12" fill="#e74c3c" stroke="#c0392b"/>
    <text x="27.5" y="50" text-anchor="middle" class="small">Val</text>
    
    <rect x="40" y="30" width="80" height="12" fill="#3498db" stroke="#2980b9"/>
    <text x="80" y="50" text-anchor="middle" class="small">Training</text>
  </g>
  
  <!-- Iteration n -->
  <g transform="translate(480, 110)">
    <circle cx="15" cy="15" r="12" fill="#34495e"/>
    <text x="15" y="20" text-anchor="middle" style="fill: white; font-size: 12px; font-weight: bold;">n</text>
    <text x="35" y="20" class="text">Iteration n: Leave out point n</text>
    
    <rect x="0" y="30" width="100" height="12" fill="#3498db" stroke="#2980b9"/>
    <text x="50" y="50" text-anchor="middle" class="small">Training</text>
    
    <rect x="105" y="30" width="15" height="12" fill="#e74c3c" stroke="#c0392b"/>
    <text x="112.5" y="50" text-anchor="middle" class="small">Val</text>
  </g>
  
  <!-- Final result -->
  <rect x="600" y="130" width="80" height="30" fill="#27ae60" stroke="#229954" rx="4"/>
  <text x="640" y="150" text-anchor="middle" style="fill: white; font-size: 12px;">LOOCV Error</text>
  
  <!-- Formula -->
  <rect x="80" y="230" width="640" height="40" fill="#fff3cd" stroke="#ffc107" rx="8"/>
  <text x="400" y="255" text-anchor="middle" class="text" style="fill: #856404;">LOOCV = (1/n) Σ(yi - ŷ(-i))² where ŷ(-i) is prediction without point i</text>
  
  <!-- Advantages -->
  <rect x="50" y="290" width="340" height="120" fill="#d4edda" stroke="#28a745" rx="8"/>
  <text x="220" y="315" text-anchor="middle" class="subtitle" style="fill: #155724;">Advantages</text>
  <text x="70" y="340" class="text" style="fill: #155724;">• Maximum data utilization (n-1 points)</text>
  <text x="70" y="360" class="text" style="fill: #155724;">• Deterministic results</text>
  <text x="70" y="380" class="text" style="fill: #155724;">• Nearly unbiased estimates</text>
  <text x="70" y="400" class="text" style="fill: #155724;">• Every point used for validation</text>
  
  <!-- Disadvantages -->
  <rect x="410" y="290" width="340" height="120" fill="#f8d7da" stroke="#dc3545" rx="8"/>
  <text x="580" y="315" text-anchor="middle" class="subtitle" style="fill: #721c24;">Disadvantages</text>
  <text x="430" y="340" class="text" style="fill: #721c24;">• Computationally expensive (n fits)</text>
  <text x="430" y="360" class="text" style="fill: #721c24;">• High correlation between errors</text>
  <text x="430" y="380" class="text" style="fill: #721c24;">• High variance estimates</text>
  <text x="430" y="400" class="text" style="fill: #721c24;">• Not practical for large datasets</text>
  
  <!-- Use cases -->
  <rect x="50" y="430" width="700" height="80" fill="#f8f9fa" stroke="#dee2e6" rx="8"/>
  <text x="400" y="455" text-anchor="middle" class="subtitle">When to Use LOOCV</text>
  <text x="70" y="480" class="text">• Small datasets (n &lt; 50): Maximum data efficiency crucial</text>
  <text x="70" y="500" class="text">• Expensive data collection: Every sample valuable</text>
  
  <!-- Performance note -->
  <rect x="50" y="530" width="700" height="50" fill="#e3f2fd" stroke="#1976d2" rx="8"/>
  <text x="400" y="555" text-anchor="middle" class="text" style="fill: #1565c0;">For linear regression: LOOCV can be computed efficiently using leverage values</text>
</svg>