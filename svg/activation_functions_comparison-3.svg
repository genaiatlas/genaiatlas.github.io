<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <dropShadow dx="2" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
    <linearGradient id="stepGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e1f5fe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b3e5fc;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="tanhGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f3e5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8eaf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="reluGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e8f5e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c8e6c8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="700" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="600" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#333">Activation Functions: Impact on Data Representations</text>
  
  <!-- Step Function Section -->
  <rect x="50" y="70" width="350" height="520" fill="url(#stepGradient)" stroke="#0277bd" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="225" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#0277bd">Step/Threshold Function</text>
  <text x="225" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">Output: {0, 1}</text>
  
  <!-- Step function plot -->
  <rect x="70" y="130" width="200" height="150" fill="white" stroke="#ccc" stroke-width="1"/>
  <line x1="80" y1="270" x2="260" y2="270" stroke="#333" stroke-width="2"/>
  <line x1="80" y1="270" x2="80" y2="140" stroke="#333" stroke-width="2"/>
  
  <!-- Step function curve -->
  <line x1="80" y1="260" x2="170" y2="260" stroke="#0277bd" stroke-width="4"/>
  <line x1="170" y1="260" x2="170" y2="150" stroke="#0277bd" stroke-width="4"/>
  <line x1="170" y1="150" x2="260" y2="150" stroke="#0277bd" stroke-width="4"/>
  <circle cx="170" cy="260" r="4" fill="white" stroke="#0277bd" stroke-width="3"/>
  <circle cx="170" cy="150" r="4" fill="#0277bd"/>
  
  <text x="170" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">0</text>
  <text x="65" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">1</text>
  <text x="65" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">0</text>
  
  <!-- Step function data representation -->
  <rect x="70" y="300" width="200" height="150" fill="white" stroke="#ccc" stroke-width="1"/>
  <line x1="80" y1="440" x2="260" y2="440" stroke="#333" stroke-width="2"/>
  <line x1="80" y1="440" x2="80" y2="310" stroke="#333" stroke-width="2"/>
  
  <text x="170" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">a₁</text>
  <text x="55" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333" transform="rotate(-90, 55, 375)">a₂</text>
  
  <!-- Grid marks -->
  <line x1="170" y1="435" x2="170" y2="445" stroke="#333" stroke-width="1"/>
  <text x="170" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">1</text>
  <line x1="75" y1="350" x2="85" y2="350" stroke="#333" stroke-width="1"/>
  <text x="70" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">1</text>
  
  <!-- Step function data points -->
  <circle cx="80" cy="350" r="8" fill="#f44336" stroke="#d32f2f" stroke-width="2"/>
  <text x="95" y="345" font-family="Arial, sans-serif" font-size="10" fill="#f44336">(0,1) Red</text>
  
  <circle cx="170" cy="350" r="8" fill="#2196f3" stroke="#1976d2" stroke-width="2"/>
  <text x="185" y="345" font-family="Arial, sans-serif" font-size="10" fill="#2196f3">(1,1) Blue</text>
  
  <circle cx="170" cy="440" r="8" fill="#f44336" stroke="#d32f2f" stroke-width="2"/>
  <text x="185" y="460" font-family="Arial, sans-serif" font-size="10" fill="#f44336">(1,0) Red</text>
  
  <!-- Step function properties -->
  <text x="225" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0277bd">Properties:</text>
  <text x="70" y="500" font-family="Arial, sans-serif" font-size="11" fill="#333">• Binary output {0,1}</text>
  <text x="70" y="515" font-family="Arial, sans-serif" font-size="11" fill="#333">• Multiple points → same coordinates</text>
  <text x="70" y="530" font-family="Arial, sans-serif" font-size="11" fill="#333">• Loss of information</text>
  <text x="70" y="545" font-family="Arial, sans-serif" font-size="11" fill="#d32f2f">• NOT preferred for hidden layers</text>
  <text x="70" y="565" font-family="Arial, sans-serif" font-size="11" fill="#333">• Simple, fast computation</text>
  
  <!-- Tanh Function Section -->
  <rect x="425" y="70" width="350" height="520" fill="url(#tanhGradient)" stroke="#7b1fa2" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="600" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#7b1fa2">Hyperbolic Tangent (Tanh)</text>
  <text x="600" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">Output: [-1, +1]</text>
  
  <!-- Tanh function plot -->
  <rect x="445" y="130" width="200" height="150" fill="white" stroke="#ccc" stroke-width="1"/>
  <line x1="455" y1="270" x2="635" y2="270" stroke="#333" stroke-width="2"/>
  <line x1="455" y1="270" x2="455" y2="140" stroke="#333" stroke-width="2"/>
  <line x1="545" y1="275" x2="545" y2="265" stroke="#333" stroke-width="1"/>
  <text x="545" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">0</text>
  
  <!-- Tanh function curve (S-shaped) -->
  <path d="M 460 265 Q 500 265, 520 205 Q 540 160, 570 160 Q 600 160, 620 150 Q 630 145, 630 145" 
        fill="none" stroke="#7b1fa2" stroke-width="4"/>
  
  <text x="440" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">1</text>
  <text x="440" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">-1</text>
  
  <!-- Tanh function data representation -->
  <rect x="445" y="300" width="200" height="150" fill="white" stroke="#ccc" stroke-width="1"/>
  <line x1="455" y1="440" x2="635" y2="440" stroke="#333" stroke-width="2"/>
  <line x1="455" y1="440" x2="455" y2="310" stroke="#333" stroke-width="2"/>
  
  <text x="545" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">a₁</text>
  <text x="430" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333" transform="rotate(-90, 430, 375)">a₂</text>
  
  <!-- Tanh function data points (continuous values) -->
  <circle cx="485" cy="380" r="6" fill="#f44336" stroke="#d32f2f" stroke-width="2"/>
  <circle cx="495" cy="375" r="6" fill="#f44336" stroke="#d32f2f" stroke-width="2"/>
  <circle cx="505" cy="385" r="6" fill="#f44336" stroke="#d32f2f" stroke-width="2"/>
  <text x="515" y="370" font-family="Arial, sans-serif" font-size="10" fill="#f44336">Red (varied)</text>
  
  <circle cx="575" cy="340" r="6" fill="#2196f3" stroke="#1976d2" stroke-width="2"/>
  <circle cx="585" cy="335" r="6" fill="#2196f3" stroke="#1976d2" stroke-width="2"/>
  <circle cx="565" cy="345" r="6" fill="#2196f3" stroke="#1976d2" stroke-width="2"/>
  <circle cx="595" cy="350" r="6" fill="#2196f3" stroke="#1976d2" stroke-width="2"/>
  <text x="605" y="330" font-family="Arial, sans-serif" font-size="10" fill="#2196f3">Blue (varied)</text>
  
  <!-- Separating line for tanh -->
  <line x1="515" y1="320" x2="605" y2="420" stroke="#4caf50" stroke-width="3"/>
  <text x="535" y="315" font-family="Arial, sans-serif" font-size="10" fill="#4caf50">Separable</text>
  
  <!-- Tanh properties -->
  <text x="600" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#7b1fa2">Properties:</text>
  <text x="445" y="500" font-family="Arial, sans-serif" font-size="11" fill="#333">• Smooth, differentiable</text>
  <text x="445" y="515" font-family="Arial, sans-serif" font-size="11" fill="#333">• Each point unique representation</text>
  <text x="445" y="530" font-family="Arial, sans-serif" font-size="11" fill="#333">• Distance to boundary preserved</text>
  <text x="445" y="545" font-family="Arial, sans-serif" font-size="11" fill="#4caf50">• Excellent for hidden layers</text>
  <text x="445" y="565" font-family="Arial, sans-serif" font-size="11" fill="#333">• Zero-centered output</text>
  
  <!-- ReLU Function Section -->
  <rect x="800" y="70" width="350" height="520" fill="url(#reluGradient)" stroke="#2e7d32" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="975" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2e7d32">Rectified Linear Unit (ReLU)</text>
  <text x="975" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">Output: [0, +∞)</text>
  
  <!-- ReLU function plot -->
  <rect x="820" y="130" width="200" height="150" fill="white" stroke="#ccc" stroke-width="1"/>
  <line x1="830" y1="270" x2="1010" y2="270" stroke="#333" stroke-width="2"/>
  <line x1="830" y1="270" x2="830" y2="140" stroke="#333" stroke-width="2"/>
  <line x1="920" y1="275" x2="920" y2="265" stroke="#333" stroke-width="1"/>
  <text x="920" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">0</text>
  
  <!-- ReLU function curve (hockey stick shape) -->
  <line x1="830" y1="270" x2="920" y2="270" stroke="#2e7d32" stroke-width="4"/>
  <line x1="920" y1="270" x2="1010" y2="140" stroke="#2e7d32" stroke-width="4"/>
  <circle cx="920" cy="270" r="3" fill="#2e7d32"/>
  
  <text x="815" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">+</text>
  <text x="815" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">0</text>
  
  <!-- ReLU function data representation -->
  <rect x="820" y="300" width="200" height="150" fill="white" stroke="#ccc" stroke-width="1"/>
  <line x1="830" y1="440" x2="1010" y2="440" stroke="#333" stroke-width="2"/>
  <line x1="830" y1="440" x2="830" y2="310" stroke="#333" stroke-width="2"/>
  
  <text x="920" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">a₁</text>
  <text x="805" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333" transform="rotate(-90, 805, 375)">a₂</text>
  
  <!-- ReLU function data points -->
  <circle cx="860" cy="400" r="6" fill="#f44336" stroke="#d32f2f" stroke-width="2"/>
  <circle cx="870" cy="395" r="6" fill="#f44336" stroke="#d32f2f" stroke-width="2"/>
  <circle cx="880" cy="405" r="6" fill="#f44336" stroke="#d32f2f" stroke-width="2"/>
  <text x="890" y="390" font-family="Arial, sans-serif" font-size="10" fill="#f44336">Red (varied)</text>
  
  <circle cx="960" cy="350" r="6" fill="#2196f3" stroke="#1976d2" stroke-width="2"/>
  <circle cx="970" cy="345" r="6" fill="#2196f3" stroke="#1976d2" stroke-width="2"/>
  <circle cx="980" cy="355" r="6" fill="#2196f3" stroke="#1976d2" stroke-width="2"/>
  <circle cx="950" cy="360" r="6" fill="#2196f3" stroke="#1976d2" stroke-width="2"/>
  <text x="990" y="340" font-family="Arial, sans-serif" font-size="10" fill="#2196f3">Blue (varied)</text>
  
  <!-- Separating line for ReLU -->
  <line x1="890" y1="320" x2="980" y2="420" stroke="#4caf50" stroke-width="3"/>
  <text x="910" y="315" font-family="Arial, sans-serif" font-size="10" fill="#4caf50">Separable</text>
  
  <!-- ReLU properties -->
  <text x="975" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2e7d32">Properties:</text>
  <text x="820" y="500" font-family="Arial, sans-serif" font-size="11" fill="#333">• Computationally efficient</text>
  <text x="820" y="515" font-family="Arial, sans-serif" font-size="11" fill="#333">• Each point unique representation</text>
  <text x="820" y="530" font-family="Arial, sans-serif" font-size="11" fill="#333">• Sparse activations (many zeros)</text>
  <text x="820" y="545" font-family="Arial, sans-serif" font-size="11" fill="#4caf50">• Most popular in modern networks</text>
  <text x="820" y="565" font-family="Arial, sans-serif" font-size="11" fill="#333">• Unbounded positive output</text>
  
  <!-- Comparison summary -->
  <rect x="100" y="610" width="1000" height="70" fill="white" stroke="#ff9800" stroke-width="3" rx="10" filter="url(#shadow)"/>
  <text x="600" y="630" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ff9800">🔑 Key Insight</text>
  <text x="600" y="650" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#333">Smooth activation functions (Tanh, ReLU) preserve individual data point differences,</text>
  <text x="600" y="665" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#333">enabling more powerful and nuanced representations than step functions.</text>
</svg>