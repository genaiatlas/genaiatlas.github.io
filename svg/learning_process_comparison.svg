<svg viewBox="0 0 900 650" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="900" height="650" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">Traditional ML vs Neural Networks: Learning Approaches</text>
  
  <!-- Traditional ML Section -->
  <g id="traditional-ml">
    <rect x="50" y="70" width="380" height="250" fill="#ecf0f1" stroke="#95a5a6" stroke-width="2" rx="10"/>
    <text x="240" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">🔧 Traditional Machine Learning</text>
    
    <!-- Manual Feature Engineering -->
    <g id="manual-features">
      <rect x="80" y="120" width="100" height="80" fill="#e8f6f3" stroke="#16a085" stroke-width="1" rx="5"/>
      <text x="130" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#16a085">Manual Feature</text>
      <text x="130" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#16a085">Engineering</text>
      
      <!-- Human figure -->
      <circle cx="130" cy="175" r="8" fill="#34495e"/>
      <line x1="130" y1="183" x2="130" y2="195" stroke="#34495e" stroke-width="2"/>
      <text x="130" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Human Expert</text>
    </g>
    
    <!-- Arrow -->
    <line x1="190" y1="160" x2="220" y2="160" stroke="#34495e" stroke-width="2" marker-end="url(#arrow-traditional)"/>
    
    <!-- Fixed Features -->
    <g id="fixed-features">
      <rect x="240" y="120" width="80" height="80" fill="#fdf2e9" stroke="#e67e22" stroke-width="1" rx="5"/>
      <text x="280" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e67e22">Fixed</text>
      <text x="280" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e67e22">Features</text>
      
      <!-- Feature bars -->
      <rect x="250" y="170" width="6" height="15" fill="#e67e22"/>
      <rect x="258" y="170" width="6" height="20" fill="#e67e22"/>
      <rect x="266" y="170" width="6" height="12" fill="#e67e22"/>
      <rect x="274" y="170" width="6" height="18" fill="#e67e22"/>
      <rect x="282" y="170" width="6" height="16" fill="#e67e22"/>
      <rect x="290" y="170" width="6" height="14" fill="#e67e22"/>
      <rect x="298" y="170" width="6" height="22" fill="#e67e22"/>
      <rect x="306" y="170" width="6" height="10" fill="#e67e22"/>
      
      <text x="280" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">φ(x) = predefined</text>
    </g>
    
    <!-- Arrow -->
    <line x1="330" y1="160" x2="360" y2="160" stroke="#34495e" stroke-width="2" marker-end="url(#arrow-traditional)"/>
    
    <!-- Classifier -->
    <g id="traditional-classifier">
      <rect x="370" y="120" width="50" height="80" fill="#e8f5e8" stroke="#27ae60" stroke-width="1" rx="5"/>
      <text x="395" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#27ae60">Train</text>
      <text x="395" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#27ae60">Classifier</text>
      
      <!-- Simple classifier representation -->
      <line x1="380" y1="170" x2="410" y2="185" stroke="#27ae60" stroke-width="2"/>
      <text x="395" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">θᵀφ(x) > t</text>
    </g>
    
    <!-- Limitations -->
    <g id="traditional-limitations">
      <rect x="80" y="230" width="320" height="75" fill="#fadbd8" stroke="#e74c3c" stroke-width="1" rx="5"/>
      <text x="240" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e74c3c">❌ Limitations</text>
      <text x="90" y="270" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Requires domain expertise for feature design</text>
      <text x="90" y="285" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Features may not be optimal for the task</text>
      <text x="90" y="300" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Difficult to adapt to new domains</text>
    </g>
  </g>
  
  <!-- Neural Networks Section -->
  <g id="neural-networks">
    <rect x="50" y="350" width="380" height="250" fill="#eaf2ff" stroke="#3498db" stroke-width="2" rx="10"/>
    <text x="240" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">🧠 Neural Networks</text>
    
    <!-- Raw Data -->
    <g id="raw-data-nn">
      <rect x="80" y="400" width="80" height="80" fill="#e8f6f3" stroke="#16a085" stroke-width="1" rx="5"/>
      <text x="120" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#16a085">Raw Data</text>
      
      <!-- Data representations -->
      <rect x="90" y="435" width="20" height="15" fill="#3498db" opacity="0.7"/>
      <rect x="115" y="435" width="20" height="15" fill="#e74c3c" opacity="0.7"/>
      <rect x="140" y="435" width="20" height="15" fill="#f39c12" opacity="0.7"/>
      
      <text x="120" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">No preprocessing</text>
    </g>
    
    <!-- Arrow -->
    <line x1="170" y1="440" x2="200" y2="440" stroke="#34495e" stroke-width="2" marker-end="url(#arrow-neural)"/>
    
    <!-- Neural Network Learning -->
    <g id="neural-learning">
      <rect x="220" y="400" width="120" height="80" fill="#fff3e0" stroke="#ff9800" stroke-width="1" rx="5"/>
      <text x="280" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ff9800">Neural Network</text>
      <text x="280" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ff9800">End-to-End Learning</text>
      
      <!-- Mini network -->
      <circle cx="240" cy="450" r="4" fill="#3498db"/>
      <circle cx="260" cy="445" r="4" fill="#e74c3c"/>
      <circle cx="260" cy="455" r="4" fill="#e74c3c"/>
      <circle cx="280" cy="450" r="4" fill="#f39c12"/>
      <circle cx="300" cy="445" r="4" fill="#2ecc71"/>
      <circle cx="300" cy="455" r="4" fill="#2ecc71"/>
      <circle cx="320" cy="450" r="4" fill="#9b59b6"/>
      
      <!-- Connections -->
      <line x1="244" y1="450" x2="256" y2="445" stroke="#34495e" stroke-width="1"/>
      <line x1="244" y1="450" x2="256" y2="455" stroke="#34495e" stroke-width="1"/>
      <line x1="264" y1="445" x2="276" y2="450" stroke="#34495e" stroke-width="1"/>
      <line x1="264" y1="455" x2="276" y2="450" stroke="#34495e" stroke-width="1"/>
      <line x1="284" y1="450" x2="296" y2="445" stroke="#34495e" stroke-width="1"/>
      <line x1="284" y1="450" x2="296" y2="455" stroke="#34495e" stroke-width="1"/>
      <line x1="304" y1="445" x2="316" y2="450" stroke="#34495e" stroke-width="1"/>
      <line x1="304" y1="455" x2="316" y2="450" stroke="#34495e" stroke-width="1"/>
      
      <text x="280" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Learn φ(x) and f together</text>
    </g>
    
    <!-- Arrow -->
    <line x1="350" y1="440" x2="380" y2="440" stroke="#34495e" stroke-width="2" marker-end="url(#arrow-neural)"/>
    
    <!-- Optimal Features + Classifier -->
    <g id="optimal-output">
      <rect x="390" y="400" width="30" height="80" fill="#e8f5e8" stroke="#27ae60" stroke-width="1" rx="5"/>
      <text x="405" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#27ae60">Output</text>
      
      <!-- Output representation -->
      <circle cx="405" cy="445" r="8" fill="#27ae60"/>
      <text x="405" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#fff">ŷ</text>
      
      <text x="405" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Prediction</text>
    </g>
    
    <!-- Advantages -->
    <g id="neural-advantages">
      <rect x="80" y="510" width="340" height="75" fill="#d5f4e6" stroke="#27ae60" stroke-width="1" rx="5"/>
      <text x="250" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#27ae60">✅ Advantages</text>
      <text x="90" y="550" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Automatic feature discovery from data</text>
      <text x="90" y="565" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Learns optimal representations for the task</text>
      <text x="90" y="580" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Generalizes across domains with minimal modification</text>
    </g>
  </g>
  
  <!-- Mathematical Comparison -->
  <g id="mathematical-comparison">
    <rect x="470" y="70" width="380" height="520" fill="#f4f4f4" stroke="#7f8c8d" stroke-width="2" rx="10"/>
    <text x="660" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">📊 Mathematical Comparison</text>
    
    <!-- Traditional ML Math -->
    <g id="traditional-math">
      <rect x="490" y="120" width="340" height="120" fill="#fadbd8" stroke="#e74c3c" stroke-width="1" rx="5"/>
      <text x="660" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e74c3c">Traditional ML</text>
      
      <text x="510" y="170" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">1. Design features: φ(x) = [x₁², x₁x₂, log(x₃), ...]</text>
      <text x="510" y="190" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">2. Train classifier: θ* = argmin L(θᵀφ(x), y)</text>
      <text x="510" y="210" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">3. Predict: ŷ = f(θ*ᵀφ(x))</text>
      
      <text x="660" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-style="italic" fill="#7f8c8d">Features fixed, only θ learned</text>
    </g>
    
    <!-- Neural Network Math -->
    <g id="neural-math">
      <rect x="490" y="260" width="340" height="140" fill="#d5f4e6" stroke="#27ae60" stroke-width="1" rx="5"/>
      <text x="660" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#27ae60">Neural Networks</text>
      
      <text x="510" y="310" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">1. Forward pass: h⁽ˡ⁾ = σ(W⁽ˡ⁾h⁽ˡ⁻¹⁾ + b⁽ˡ⁾)</text>
      <text x="510" y="330" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">2. Joint optimization: θ* = argmin L(fᵩ(x), y)</text>
      <text x="510" y="350" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">3. Learned features: φ(x) = h⁽ᴸ⁻¹⁾(x; θ*)</text>
      <text x="510" y="370" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">4. Predict: ŷ = f(φ(x); θ*)</text>
      
      <text x="660" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-style="italic" fill="#7f8c8d">Both features and classifier learned jointly</text>
    </g>
    
    <!-- Key Equations -->
    <g id="key-equations">
      <rect x="490" y="420" width="340" height="90" fill="#eaf2ff" stroke="#3498db" stroke-width="1" rx="5"/>
      <text x="660" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#3498db">Key Difference</text>
      
      <text x="510" y="470" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Traditional: E[φ(x)] fixed → optimize f only</text>
      <text x="510" y="490" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Neural: E[φ(x;θ)] learned → optimize f and φ together</text>
    </g>
    
    <!-- Performance Comparison -->
    <g id="performance-comparison">
      <rect x="490" y="530" width="340" height="50" fill="#fff3e0" stroke="#ff9800" stroke-width="1" rx="5"/>
      <text x="660" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ff9800">Typical Performance</text>
      <text x="510" y="570" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Traditional ML: Good on structured data, limited on raw data</text>
      <text x="510" y="585" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Neural Networks: Excellent on raw, high-dimensional data</text>
    </g>
  </g>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrow-traditional" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#34495e" />
    </marker>
    <marker id="arrow-neural" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#34495e" />
    </marker>
  </defs>
  
  <!-- Bottom summary -->
  <text x="450" y="630" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Neural Networks: From Manual Engineering to Automatic Discovery</text>
</svg>