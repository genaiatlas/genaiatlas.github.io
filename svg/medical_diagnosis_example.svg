<svg viewBox="0 0 800 650" xmlns="http://www.w3.org/2000/svg">
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4b5563"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="650" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Medical Diagnosis: Flu Prediction Neural Network</text>
  
  <!-- Input symptoms -->
  <g id="symptoms">
    <text x="120" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#3b82f6">Symptoms (Inputs)</text>
    
    <circle cx="120" cy="120" r="18" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="120" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1e40af">x₁</text>
    <text x="30" y="126" font-family="Arial, sans-serif" font-size="11" fill="#64748b">Stomach ache?</text>
    
    <circle cx="120" cy="180" r="18" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="120" y="186" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1e40af">x₂</text>
    <text x="50" y="186" font-family="Arial, sans-serif" font-size="11" fill="#64748b">Fever?</text>
    
    <circle cx="120" cy="240" r="18" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="120" y="246" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1e40af">x₃</text>
    <text x="50" y="246" font-family="Arial, sans-serif" font-size="11" fill="#64748b">Cough?</text>
  </g>
  
  <!-- Weight connections -->
  <g id="weights">
    <line x1="138" y1="120" x2="280" y2="180" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="200" y="140" font-family="Arial, sans-serif" font-size="12" fill="#7c3aed" font-weight="bold">w₁ = -1</text>
    
    <line x1="138" y1="180" x2="280" y2="180" stroke="#10b981" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="200" y="175" font-family="Arial, sans-serif" font-size="12" fill="#10b981" font-weight="bold">w₂ = +3</text>
    
    <line x1="138" y1="240" x2="280" y2="180" stroke="#10b981" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="200" y="220" font-family="Arial, sans-serif" font-size="12" fill="#10b981" font-weight="bold">w₃ = +3</text>
  </g>
  
  <!-- Neuron -->
  <g id="neuron">
    <circle cx="300" cy="180" r="25" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
    <text x="300" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#92400e">f</text>
    <text x="300" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#92400e">threshold=5</text>
  </g>
  
  <!-- Output -->
  <g id="output">
    <circle cx="450" cy="180" r="22" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="450" y="186" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#166534">Flu?</text>
    
    <text x="520" y="170" font-family="Arial, sans-serif" font-size="12" fill="#64748b">"Does the</text>
    <text x="520" y="185" font-family="Arial, sans-serif" font-size="12" fill="#64748b">patient have</text>
    <text x="520" y="200" font-family="Arial, sans-serif" font-size="12" fill="#64748b">the flu?"</text>
  </g>
  
  <!-- Connection from neuron to output -->
  <line x1="325" y1="180" x2="428" y2="180" stroke="#4b5563" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Case examples -->
  <g id="case-examples">
    <rect x="50" y="290" width="700" height="320" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
    <text x="400" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">Example Cases</text>
    
    <!-- Case 1 -->
    <g id="case1">
      <rect x="70" y="330" width="300" height="120" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
      <text x="220" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#991b1b">Case 1: No Flu Predicted</text>
      
      <text x="80" y="370" font-family="Arial, sans-serif" font-size="11" fill="#1e293b">Inputs:</text>
      <text x="80" y="385" font-family="Arial, sans-serif" font-size="10" fill="#64748b">Stomach ache: YES (1)</text>
      <text x="80" y="400" font-family="Arial, sans-serif" font-size="10" fill="#64748b">Fever: NO (0)</text>
      <text x="80" y="415" font-family="Arial, sans-serif" font-size="10" fill="#64748b">Cough: YES (1)</text>
      
      <text x="210" y="385" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">Calculation:</text>
      <text x="210" y="400" font-family="Arial, sans-serif" font-size="10" fill="#64748b">Z = 1×(-1) + 0×3 + 1×3</text>
      <text x="210" y="415" font-family="Arial, sans-serif" font-size="10" fill="#64748b">Z = -1 + 0 + 3 = 2</text>
      <text x="210" y="430" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#dc2626">2 &lt; 5 → No Flu</text>
    </g>
    
    <!-- Case 2 -->
    <g id="case2">
      <rect x="430" y="330" width="300" height="120" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
      <text x="580" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#166534">Case 2: Flu Predicted</text>
      
      <text x="440" y="370" font-family="Arial, sans-serif" font-size="11" fill="#1e293b">Inputs:</text>
      <text x="440" y="385" font-family="Arial, sans-serif" font-size="10" fill="#64748b">Stomach ache: NO (0)</text>
      <text x="440" y="400" font-family="Arial, sans-serif" font-size="10" fill="#64748b">Fever: YES (1)</text>
      <text x="440" y="415" font-family="Arial, sans-serif" font-size="10" fill="#64748b">Cough: YES (1)</text>
      
      <text x="570" y="385" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">Calculation:</text>
      <text x="570" y="400" font-family="Arial, sans-serif" font-size="10" fill="#64748b">Z = 0×(-1) + 1×3 + 1×3</text>
      <text x="570" y="415" font-family="Arial, sans-serif" font-size="10" fill="#64748b">Z = 0 + 3 + 3 = 6</text>
      <text x="570" y="430" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#16a34a">6 &gt; 5 → Has Flu</text>
    </g>
  </g>
  
  <!-- Weight reasoning -->
  <g id="weight-reasoning">
    <rect x="70" y="470" width="660" height="120" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
    <text x="400" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#92400e">Weight Assignment Reasoning</text>
    
    <text x="80" y="515" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#7c2d12">Stomach Ache (w₁ = -1):</text>
    <text x="80" y="530" font-family="Arial, sans-serif" font-size="10" fill="#78716c">Not typically a flu symptom, so negative weight decreases flu likelihood</text>
    
    <text x="80" y="550" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#166534">Fever and Cough (w₂ = w₃ = +3):</text>
    <text x="80" y="565" font-family="Arial, sans-serif" font-size="10" fill="#78716c">Strong indicators of flu, so high positive weights increase flu likelihood</text>
    
    <text x="400" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-style="italic" fill="#64748b">Note: Weights and threshold chosen for demonstration purposes</text>
  </g>
</svg>