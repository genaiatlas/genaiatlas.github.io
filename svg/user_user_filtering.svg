<svg viewBox="0 0 1100 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1100" height="800" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="550" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    User-User Collaborative Filtering
  </text>
  
  <text x="550" y="60" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#7f8c8d" font-style="italic">
    "Users like you also liked..."
  </text>
  
  <!-- User-Item Rating Matrix -->
  <g transform="translate(50, 100)">
    <text x="200" y="-10" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#34495e">
      User-Item Rating Matrix
    </text>
    
    <!-- Matrix headers -->
    <text x="0" y="30" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#34495e">Users</text>
    <text x="120" y="10" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#34495e">Item 1</text>
    <text x="180" y="10" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#34495e">Item 2</text>
    <text x="240" y="10" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#34495e">Item 3</text>
    <text x="300" y="10" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#34495e">Item 4</text>
    <text x="360" y="10" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#34495e">Item 5</text>
    
    <!-- Target User (Alice) - highlighted -->
    <rect x="0" y="20" width="400" height="40" fill="#e8f8f5" stroke="#27ae60" stroke-width="3"/>
    <text x="10" y="45" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#27ae60">Alice (Target)</text>
    <text x="130" y="45" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">5</text>
    <text x="190" y="45" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">3</text>
    <text x="250" y="45" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#e74c3c" font-weight="bold">?</text>
    <text x="310" y="45" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">4</text>
    <text x="370" y="45" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">2</text>
    
    <!-- Similar User 1 (Bob) -->
    <rect x="0" y="60" width="400" height="40" fill="#ebf5fb" stroke="#3498db" stroke-width="2"/>
    <text x="10" y="85" font-family="Arial, sans-serif" font-size="11" fill="#34495e">Bob</text>
    <text x="130" y="85" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">5</text>
    <text x="190" y="85" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">4</text>
    <text x="250" y="85" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#3498db" font-weight="bold">4</text>
    <text x="310" y="85" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">5</text>
    <text x="370" y="85" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">1</text>
    
    <!-- Similar User 2 (Carol) -->
    <rect x="0" y="100" width="400" height="40" fill="#ebf5fb" stroke="#3498db" stroke-width="2"/>
    <text x="10" y="125" font-family="Arial, sans-serif" font-size="11" fill="#34495e">Carol</text>
    <text x="130" y="125" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">4</text>
    <text x="190" y="125" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">3</text>
    <text x="250" y="125" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#3498db" font-weight="bold">5</text>
    <text x="310" y="125" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">4</text>
    <text x="370" y="125" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">3</text>
    
    <!-- Dissimilar User (Dave) -->
    <rect x="0" y="140" width="400" height="40" fill="white" stroke="#bdc3c7" stroke-width="1"/>
    <text x="10" y="165" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">Dave</text>
    <text x="130" y="165" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d">1</text>
    <text x="190" y="165" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d">2</text>
    <text x="250" y="165" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d">1</text>
    <text x="310" y="165" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d">2</text>
    <text x="370" y="165" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d">5</text>
    
    <!-- Item 3 highlight -->
    <rect x="235" y="20" width="50" height="160" fill="none" stroke="#f39c12" stroke-width="2" stroke-dasharray="5,5"/>
  </g>
  
  <!-- Step-by-step process -->
  <g transform="translate(500, 100)">
    <text x="250" y="-10" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#34495e">
      Prediction Process
    </text>
    
    <!-- Step 1 -->
    <g transform="translate(0, 10)">
      <circle cx="20" cy="20" r="15" fill="#3498db"/>
      <text x="20" y="26" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">1</text>
      <rect x="45" y="5" width="505" height="45" fill="white" stroke="#3498db" stroke-width="2" rx="5"/>
      <text x="55" y="23" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#3498db">
        Find users who rated Item 3
      </text>
      <text x="55" y="40" font-family="Arial, sans-serif" font-size="10" fill="#34495e">
        Bob and Carol have rated Item 3 (Dave hasn't rated many items Alice liked)
      </text>
    </g>
    
    <!-- Step 2 -->
    <g transform="translate(0, 70)">
      <circle cx="20" cy="20" r="15" fill="#27ae60"/>
      <text x="20" y="26" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">2</text>
      <rect x="45" y="5" width="505" height="65" fill="white" stroke="#27ae60" stroke-width="2" rx="5"/>
      <text x="55" y="23" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#27ae60">
        Calculate similarity between Alice and each user
      </text>
      <text x="55" y="40" font-family="Arial, sans-serif" font-size="10" fill="#34495e">
        sim(Alice, Bob) = 0.85 (high similarity)
      </text>
      <text x="55" y="55" font-family="Arial, sans-serif" font-size="10" fill="#34495e">
        sim(Alice, Carol) = 0.92 (very high similarity)
      </text>
    </g>
    
    <!-- Step 3 -->
    <g transform="translate(0, 150)">
      <circle cx="20" cy="20" r="15" fill="#f39c12"/>
      <text x="20" y="26" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">3</text>
      <rect x="45" y="5" width="505" height="45" fill="white" stroke="#f39c12" stroke-width="2" rx="5"/>
      <text x="55" y="23" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#f39c12">
        Select k nearest neighbors (k=2)
      </text>
      <text x="55" y="40" font-family="Arial, sans-serif" font-size="10" fill="#34495e">
        Choose Bob and Carol as they have highest similarity
      </text>
    </g>
    
    <!-- Step 4 -->
    <g transform="translate(0, 210)">
      <circle cx="20" cy="20" r="15" fill="#9b59b6"/>
      <text x="20" y="26" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">4</text>
      <rect x="45" y="5" width="505" height="75" fill="white" stroke="#9b59b6" stroke-width="2" rx="5"/>
      <text x="55" y="23" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#9b59b6">
        Compute weighted average prediction
      </text>
      <text x="55" y="45" font-family="Arial, sans-serif" font-size="10" fill="#34495e">
        Predicted rating = (0.85 × 4 + 0.92 × 5) / (0.85 + 0.92)
      </text>
      <text x="55" y="60" font-family="Arial, sans-serif" font-size="10" fill="#34495e">
        = (3.4 + 4.6) / 1.77 = 4.52
      </text>
    </g>
  </g>
  
  <!-- Visual representation of similarity -->
  <g transform="translate(50, 380)">
    <text x="250" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#34495e">
      User Similarity Network
    </text>
    
    <!-- Target user Alice -->
    <circle cx="250" cy="100" r="40" fill="#27ae60" opacity="0.3" stroke="#27ae60" stroke-width="3"/>
    <text x="250" y="95" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">Alice</text>
    <text x="250" y="110" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#27ae60">(Target)</text>
    
    <!-- Similar user Bob -->
    <circle cx="150" cy="200" r="35" fill="#3498db" opacity="0.3" stroke="#3498db" stroke-width="2"/>
    <text x="150" y="203" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#3498db">Bob</text>
    
    <!-- Similar user Carol -->
    <circle cx="350" cy="200" r="35" fill="#3498db" opacity="0.3" stroke="#3498db" stroke-width="2"/>
    <text x="350" y="203" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#3498db">Carol</text>
    
    <!-- Dissimilar user Dave -->
    <circle cx="250" cy="280" r="30" fill="#95a5a6" opacity="0.2" stroke="#95a5a6" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="250" y="283" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">Dave</text>
    
    <!-- Similarity connections -->
    <line x1="230" y1="135" x2="170" y2="170" stroke="#27ae60" stroke-width="3"/>
    <text x="185" y="145" font-family="Arial, sans-serif" font-size="10" fill="#27ae60" font-weight="bold">0.85</text>
    
    <line x1="270" y1="135" x2="330" y2="170" stroke="#27ae60" stroke-width="3"/>
    <text x="315" y="145" font-family="Arial, sans-serif" font-size="10" fill="#27ae60" font-weight="bold">0.92</text>
    
    <line x1="250" y1="140" x2="250" y2="250" stroke="#95a5a6" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="260" y="195" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">0.15</text>
  </g>
  
  <!-- Formula box -->
  <g transform="translate(550, 380)">
    <rect x="0" y="0" width="500" height="180" fill="white" stroke="#3498db" stroke-width="2" rx="8"/>
    <text x="250" y="30" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#3498db">
      User-Based Prediction Formula
    </text>
    
    <text x="250" y="60" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#34495e">
      r̂(Alice, Item 3) = Σ sim(Alice, u) × r(u, Item 3) / Σ |sim(Alice, u)|
    </text>
    
    <text x="250" y="95" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Key Characteristics:
    </text>
    
    <circle cx="30" cy="118" r="3" fill="#27ae60"/>
    <text x="40" y="122" font-family="Arial, sans-serif" font-size="10" fill="#34495e">
      Finds users with similar rating patterns
    </text>
    
    <circle cx="30" cy="138" r="3" fill="#27ae60"/>
    <text x="40" y="142" font-family="Arial, sans-serif" font-size="10" fill="#34495e">
      Better for new items (more user history available)
    </text>
    
    <circle cx="30" cy="158" r="3" fill="#27ae60"/>
    <text x="40" y="162" font-family="Arial, sans-serif" font-size="10" fill="#34495e">
      Requires recomputing similarities as users change
    </text>
  </g>
  
  <!-- Bottom insight box -->
  <g transform="translate(100, 600)">
    <rect x="0" y="0" width="900" height="140" fill="#fff3cd" stroke="#f39c12" stroke-width="2" rx="8"/>
    <text x="450" y="30" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#856404">
      💡 How User-User CF Works
    </text>
    
    <text x="450" y="55" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">
      Alice hasn't rated Item 3, but Bob and Carol (who have similar tastes to Alice) both rated it highly.
    </text>
    <text x="450" y="73" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">
      Since Bob (similarity 0.85) gave it 4 stars and Carol (similarity 0.92) gave it 5 stars,
    </text>
    <text x="450" y="91" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">
      we predict Alice would rate it 4.52 stars based on their weighted preferences.
    </text>
    
    <text x="450" y="118" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#856404" font-style="italic">
      This is the "wisdom of the crowd" - leveraging similar users' opinions to make personalized predictions
    </text>
  </g>
</svg>