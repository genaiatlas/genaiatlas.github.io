<svg width="1000" height="700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 24px; font-weight: bold; fill: #2c3e50; }
      .chart-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #34495e; }
      .axis-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #7f8c8d; }
      .tick-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #95a5a6; }
      .legend-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #34495e; }
      .good-curve { stroke: #e74c3c; stroke-width: 3; fill: none; }
      .poor-curve { stroke: #3498db; stroke-width: 3; fill: none; }
      .failed-curve { stroke: #95a5a6; stroke-width: 3; fill: none; stroke-dasharray: 5,5; }
      .axis { stroke: #bdc3c7; stroke-width: 2; }
      .grid { stroke: #ecf0f1; stroke-width: 1; }
      .highlight-box { fill: #f8f9fa; stroke: #dee2e6; stroke-width: 2; rx: 8; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="700" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="500" y="35" class="title" text-anchor="middle">Weight Initialization Impact on Neural Network Training</text>
  
  <!-- 22-Layer Network Chart -->
  <g transform="translate(80, 80)">
    <text x="200" y="20" class="chart-title" text-anchor="middle">22-Layer ReLU Network</text>
    
    <!-- Chart background -->
    <rect x="0" y="30" width="400" height="250" fill="#fefefe" stroke="#e9ecef" stroke-width="1"/>
    
    <!-- Grid lines -->
    <line x1="0" y1="80" x2="400" y2="80" class="grid"/>
    <line x1="0" y1="130" x2="400" y2="130" class="grid"/>
    <line x1="0" y1="180" x2="400" y2="180" class="grid"/>
    <line x1="0" y1="230" x2="400" y2="230" class="grid"/>
    
    <line x1="100" y1="30" x2="100" y2="280" class="grid"/>
    <line x1="200" y1="30" x2="200" y2="280" class="grid"/>
    <line x1="300" y1="30" x2="300" y2="280" class="grid"/>
    
    <!-- Axes -->
    <line x1="0" y1="280" x2="400" y2="280" class="axis"/>
    <line x1="0" y1="30" x2="0" y2="280" class="axis"/>
    
    <!-- Good initialization curve (red) - faster convergence -->
    <path d="M 0 230 Q 50 190 100 140 Q 150 100 200 80 Q 250 70 300 65 L 400 60" class="good-curve"/>
    
    <!-- Poor initialization curve (blue) - slower convergence -->
    <path d="M 0 250 Q 50 240 100 220 Q 150 190 200 160 Q 250 130 300 110 L 400 100" class="poor-curve"/>
    
    <!-- Axis labels -->
    <text x="200" y="305" class="axis-label" text-anchor="middle">Epochs</text>
    <text x="-15" y="155" class="axis-label" text-anchor="middle" transform="rotate(-90, -15, 155)">Error</text>
    
    <!-- Tick marks -->
    <text x="0" y="295" class="tick-label" text-anchor="middle">0</text>
    <text x="100" y="295" class="tick-label" text-anchor="middle">10</text>
    <text x="200" y="295" class="tick-label" text-anchor="middle">20</text>
    <text x="300" y="295" class="tick-label" text-anchor="middle">30</text>
    <text x="400" y="295" class="tick-label" text-anchor="middle">40</text>
    
    <text x="-10" y="235" class="tick-label" text-anchor="end">1.0</text>
    <text x="-10" y="185" class="tick-label" text-anchor="end">0.5</text>
    <text x="-10" y="135" class="tick-label" text-anchor="end">0.3</text>
    <text x="-10" y="85" class="tick-label" text-anchor="end">0.1</text>
    
    <!-- Legend -->
    <rect x="250" y="50" width="140" height="60" class="highlight-box"/>
    <line x1="260" y1="70" x2="290" y2="70" class="good-curve"/>
    <text x="300" y="75" class="legend-text">Good Init (σ² = 2/n)</text>
    <line x1="260" y1="90" x2="290" y2="90" class="poor-curve"/>
    <text x="300" y="95" class="legend-text">Poor Init (σ² = 1/n)</text>
  </g>
  
  <!-- 30-Layer Network Chart -->
  <g transform="translate(520, 80)">
    <text x="200" y="20" class="chart-title" text-anchor="middle">30-Layer ReLU Network</text>
    
    <!-- Chart background -->
    <rect x="0" y="30" width="400" height="250" fill="#fefefe" stroke="#e9ecef" stroke-width="1"/>
    
    <!-- Grid lines -->
    <line x1="0" y1="80" x2="400" y2="80" class="grid"/>
    <line x1="0" y1="130" x2="400" y2="130" class="grid"/>
    <line x1="0" y1="180" x2="400" y2="180" class="grid"/>
    <line x1="0" y1="230" x2="400" y2="230" class="grid"/>
    
    <line x1="100" y1="30" x2="100" y2="280" class="grid"/>
    <line x1="200" y1="30" x2="200" y2="280" class="grid"/>
    <line x1="300" y1="30" x2="300" y2="280" class="grid"/>
    
    <!-- Axes -->
    <line x1="0" y1="280" x2="400" y2="280" class="axis"/>
    <line x1="0" y1="30" x2="0" y2="280" class="axis"/>
    
    <!-- Good initialization curve (red) - still converges -->
    <path d="M 0 250 Q 50 200 100 150 Q 150 110 200 85 Q 250 70 300 65 L 400 60" class="good-curve"/>
    
    <!-- Poor initialization curve (blue) - fails to learn -->
    <path d="M 0 260 L 50 258 L 100 257 L 150 257 L 200 258 L 250 259 L 300 258 L 400 257" class="failed-curve"/>
    
    <!-- Axis labels -->
    <text x="200" y="305" class="axis-label" text-anchor="middle">Epochs</text>
    <text x="-15" y="155" class="axis-label" text-anchor="middle" transform="rotate(-90, -15, 155)">Error</text>
    
    <!-- Tick marks -->
    <text x="0" y="295" class="tick-label" text-anchor="middle">0</text>
    <text x="100" y="295" class="tick-label" text-anchor="middle">10</text>
    <text x="200" y="295" class="tick-label" text-anchor="middle">20</text>
    <text x="300" y="295" class="tick-label" text-anchor="middle">30</text>
    <text x="400" y="295" class="tick-label" text-anchor="middle">40</text>
    
    <text x="-10" y="235" class="tick-label" text-anchor="end">1.0</text>
    <text x="-10" y="185" class="tick-label" text-anchor="end">0.5</text>
    <text x="-10" y="135" class="tick-label" text-anchor="end">0.3</text>
    <text x="-10" y="85" class="tick-label" text-anchor="end">0.1</text>
    
    <!-- Legend -->
    <rect x="250" y="50" width="140" height="80" class="highlight-box"/>
    <line x1="260" y1="70" x2="290" y2="70" class="good-curve"/>
    <text x="300" y="75" class="legend-text">Good Init (σ² = 2/n)</text>
    <line x1="260" y1="90" x2="290" y2="90" class="failed-curve"/>
    <text x="300" y="95" class="legend-text">Poor Init (σ² = 1/n)</text>
    <text x="300" y="115" class="legend-text" font-size="12" fill="#e74c3c">Training Failed!</text>
  </g>
  
  <!-- Key Insights -->
  <g transform="translate(80, 420)">
    <text x="420" y="20" class="chart-title" text-anchor="middle">Key Experimental Insights</text>
    
    <!-- Insight boxes -->
    <rect x="0" y="40" width="280" height="120" fill="#d4edda" stroke="#27ae60" stroke-width="2" rx="8"/>
    <text x="140" y="65" class="legend-text" text-anchor="middle" font-weight="bold" fill="#155724">✅ Proper Initialization</text>
    <text x="20" y="90" class="legend-text" fill="#155724">• 3x faster convergence in 22 layers</text>
    <text x="20" y="110" class="legend-text" fill="#155724">• Enables training of 30-layer networks</text>
    <text x="20" y="130" class="legend-text" fill="#155724">• Lower final error rates</text>
    <text x="20" y="150" class="legend-text" fill="#155724">• Stable gradient flow</text>
    
    <rect x="300" y="40" width="280" height="120" fill="#f8d7da" stroke="#e74c3c" stroke-width="2" rx="8"/>
    <text x="440" y="65" class="legend-text" text-anchor="middle" font-weight="bold" fill="#721c24">❌ Poor Initialization</text>
    <text x="320" y="90" class="legend-text" fill="#721c24">• Slow/no convergence</text>
    <text x="320" y="110" class="legend-text" fill="#721c24">• Complete failure in deep networks</text>
    <text x="320" y="130" class="legend-text" fill="#721c24">• High final error rates</text>
    <text x="320" y="150" class="legend-text" fill="#721c24">• Vanishing gradients</text>
    
    <rect x="600" y="40" width="280" height="120" fill="#fff3cd" stroke="#ffc107" stroke-width="2" rx="8"/>
    <text x="740" y="65" class="legend-text" text-anchor="middle" font-weight="bold" fill="#856404">⚡ Performance Impact</text>
    <text x="620" y="90" class="legend-text" fill="#856404">• 50% reduction in final error</text>
    <text x="620" y="110" class="legend-text" fill="#856404">• 2-5x faster training time</text>
    <text x="620" y="130" class="legend-text" fill="#856404">• Enables deeper architectures</text>
    <text x="620" y="150" class="legend-text" fill="#856404">• Lower computational cost</text>
  </g>
  
  <!-- Mathematical Explanation -->
  <g transform="translate(80, 580)">
    <text x="420" y="20" class="chart-title" text-anchor="middle">Why He Initialization Works</text>
    
    <rect x="0" y="40" width="840" height="80" class="highlight-box"/>
    <text x="20" y="65" class="legend-text" font-weight="bold">Mathematical Principle:</text>
    <text x="20" y="85" class="legend-text">• ReLU activation zeros ~50% of neurons → variance is halved</text>
    <text x="20" y="105" class="legend-text">• He initialization (σ² = 2/n) compensates by doubling initial variance</text>
    
    <text x="450" y="65" class="legend-text" font-weight="bold">Practical Result:</text>
    <text x="450" y="85" class="legend-text">• Maintains consistent activation variance across layers</text>
    <text x="450" y="105" class="legend-text">• Prevents vanishing/exploding gradients in deep networks</text>
  </g>
</svg>