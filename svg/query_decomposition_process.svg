<svg viewBox="0 0 1200 1000" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="1000" fill="#f8f9fa"/>
  <text x="600" y="40" font-family="Arial" font-size="28" font-weight="bold" text-anchor="middle">Query Decomposition Process</text>
  
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" fill="#495057"/></marker></defs>
  
  <rect x="150" y="80" width="900" height="80" rx="10" fill="#ffc9c9" stroke="#f03e3e" stroke-width="3"/>
  <text x="600" y="110" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">Complex Query</text>
  <text x="600" y="135" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">"Compare GDP growth of China and India over past decade and explain</text>
  <text x="600" y="150" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">key economic factors contributing to differences"</text>
  
  <line x1="600" y1="160" x2="600" y2="195" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  
  <rect x="250" y="205" width="700" height="60" rx="10" fill="#9333ea" stroke="#7950f2" stroke-width="3"/>
  <text x="600" y="240" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Decompose into Sub-Questions</text>
  
  <line x1="600" y1="265" x2="600" y2="300" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  
  <g id="subquestions">
    <rect x="50" y="310" width="1100" height="450" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="3"/>
    <text x="600" y="340" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Sub-Questions (Sequential)</text>
    
    <rect x="80" y="360" width="500" height="80" rx="8" fill="#d3f9d8" stroke="#37b24d" stroke-width="2"/>
    <text x="330" y="385" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Sub-Q1</text>
    <text x="100" y="405" font-family="Arial" font-size="10">"What was China's GDP growth rate</text>
    <text x="100" y="422" font-family="Arial" font-size="10">over the past decade?"</text>
    
    <line x1="330" y1="440" x2="330" y2="465" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
    
    <rect x="80" y="475" width="500" height="80" rx="8" fill="#d3f9d8" stroke="#37b24d" stroke-width="2"/>
    <text x="330" y="500" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Sub-Q2</text>
    <text x="100" y="520" font-family="Arial" font-size="10">"What was India's GDP growth rate</text>
    <text x="100" y="537" font-family="Arial" font-size="10">over the past decade?"</text>
    
    <line x1="330" y1="555" x2="330" y2="580" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
    
    <rect x="80" y="590" width="500" height="80" rx="8" fill="#d3f9d8" stroke="#37b24d" stroke-width="2"/>
    <text x="330" y="615" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Sub-Q3</text>
    <text x="100" y="635" font-family="Arial" font-size="10">"What key economic factors</text>
    <text x="100" y="652" font-family="Arial" font-size="10">affected their growth?"</text>
    
    <line x1="330" y1="670" x2="330" y2="695" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
    
    <rect x="80" y="705" width="500" height="40" rx="8" fill="#ffdeeb" stroke="#e64980" stroke-width="2"/>
    <text x="330" y="732" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">Synthesize All Answers</text>
    
    <rect x="620" y="360" width="500" height="385" rx="8" fill="#fff3bf" stroke="#f59f00" stroke-width="2"/>
    <text x="870" y="385" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Retrieved Context</text>
    
    <rect x="640" y="400" width="460" height="50" rx="5" fill="#fff" stroke="#f59f00" stroke-width="1"/>
    <text x="655" y="417" font-family="Arial" font-size="9">Context 1: China data</text>
    <text x="655" y="432" font-family="Arial" font-size="9">Retrieved docs about China's economy</text>
    
    <rect x="640" y="465" width="460" height="50" rx="5" fill="#fff" stroke="#f59f00" stroke-width="1"/>
    <text x="655" y="482" font-family="Arial" font-size="9">Context 2: India data</text>
    <text x="655" y="497" font-family="Arial" font-size="9">Retrieved docs about India's economy</text>
    
    <rect x="640" y="530" width="460" height="50" rx="5" fill="#fff" stroke="#f59f00" stroke-width="1"/>
    <text x="655" y="547" font-family="Arial" font-size="9">Context 3: Economic factors</text>
    <text x="655" y="562" font-family="Arial" font-size="9">Retrieved comparative analysis docs</text>
    
    <rect x="640" y="595" width="460" height="135" rx="5" fill="#d0bfff" stroke="#7950f2" stroke-width="2"/>
    <text x="870" y="615" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle">Execution Strategy</text>
    <text x="655" y="635" font-family="Arial" font-size="9">1. Answer Sub-Q1 with Context 1</text>
    <text x="655" y="652" font-family="Arial" font-size="9">2. Answer Sub-Q2 with Context 2</text>
    <text x="655" y="669" font-family="Arial" font-size="9">3. Answer Sub-Q3 with Context 3</text>
    <text x="655" y="686" font-family="Arial" font-size="9">   + previous answers</text>
    <text x="655" y="703" font-family="Arial" font-size="9">4. Synthesize comprehensive</text>
    <text x="655" y="720" font-family="Arial" font-size="9">   comparison answer</text>
  </g>
  
  <line x1="600" y1="760" x2="600" y2="795" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  
  <rect x="200" y="805" width="800" height="165" rx="10" fill="#51cf66" stroke="#2f9e44" stroke-width="3"/>
  <text x="600" y="835" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Comprehensive Answer</text>
  <rect x="230" y="850" width="740" height="105" rx="5" fill="#fff" stroke="#2f9e44" stroke-width="2"/>
  <text x="250" y="872" font-family="Arial" font-size="10" fill="#495057">✓ Complete comparison with specific data points</text>
  <text x="250" y="890" font-family="Arial" font-size="10" fill="#495057">✓ Context from multiple retrieval operations</text>
  <text x="250" y="908" font-family="Arial" font-size="10" fill="#495057">✓ Explicit reasoning chain (transparent, debuggable)</text>
  <text x="250" y="926" font-family="Arial" font-size="10" fill="#495057">✓ Handles complexity that single query cannot address</text>
  <text x="250" y="944" font-family="Arial" font-size="10" fill="#495057">✓ Each sub-answer builds on previous context</text>
</svg>