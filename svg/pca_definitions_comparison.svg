<svg viewBox="0 0 900 650" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="900" height="650" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#2c3e50">
    Two Equivalent Definitions of PCA
  </text>
  
  <!-- Definition 1: Maximize Variance -->
  <g transform="translate(50, 70)">
    <rect x="0" y="0" width="380" height="250" fill="#e8f5e8" stroke="#27ae60" stroke-width="3" rx="10"/>
    <text x="190" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#27ae60">
      Definition 1: Maximize Projection Variance
    </text>
    
    <!-- 3D to 2D projection visualization -->
    <g transform="translate(30, 40)">
      <!-- Original 3D data cloud -->
      <ellipse cx="80" cy="60" rx="50" ry="25" fill="rgba(52, 152, 219, 0.4)" stroke="#3498db" stroke-width="2" transform="rotate(-15 80 60)"/>
      
      <!-- Data points -->
      <circle cx="60" cy="65" r="3" fill="#e74c3c"/>
      <circle cx="75" cy="55" r="3" fill="#e74c3c"/>
      <circle cx="90" cy="50" r="3" fill="#e74c3c"/>
      <circle cx="85" cy="70" r="3" fill="#e74c3c"/>
      <circle cx="100" cy="60" r="3" fill="#e74c3c"/>
      
      <!-- Projection arrows -->
      <line x1="130" y1="60" x2="200" y2="60" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
      <text x="165" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Project</text>
      
      <!-- 2D result -->
      <g transform="translate(220, 0)">
        <rect x="0" y="20" width="120" height="80" fill="rgba(231, 76, 60, 0.1)" stroke="#e74c3c" stroke-width="2"/>
        <line x1="10" y1="90" x2="110" y2="90" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
        <line x1="10" y1="90" x2="10" y2="30" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
        
        <!-- Projected points with high spread -->
        <circle cx="25" cy="80" r="3" fill="#e74c3c"/>
        <circle cx="40" cy="75" r="3" fill="#e74c3c"/>
        <circle cx="55" cy="70" r="3" fill="#e74c3c"/>
        <circle cx="70" cy="85" r="3" fill="#e74c3c"/>
        <circle cx="85" cy="75" r="3" fill="#e74c3c"/>
        
        <!-- Variance indicator -->
        <line x1="20" y1="100" x2="90" y2="100" stroke="#27ae60" stroke-width="4"/>
        <text x="55" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#27ae60" font-weight="bold">MAX SPREAD</text>
      </g>
    </g>
    
    <!-- Key points -->
    <text x="20" y="160" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Key Points:</text>
    <text x="25" y="180" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• PC1: Direction of largest variance</text>
    <text x="25" y="195" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• PC2: ⊥ to PC1, next largest variance</text>
    <text x="25" y="210" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• PC3: ⊥ to PC1,PC2, next largest variance</text>
    <text x="25" y="230" font-family="Arial, sans-serif" font-size="12" fill="#27ae60" font-weight="bold">Goal: Keep maximum information</text>
  </g>
  
  <!-- Definition 2: Minimize Residuals -->
  <g transform="translate(470, 70)">
    <rect x="0" y="0" width="380" height="250" fill="#fdf2f2" stroke="#e74c3c" stroke-width="3" rx="10"/>
    <text x="190" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#e74c3c">
      Definition 2: Minimize Projection Residuals
    </text>
    
    <!-- Residual visualization -->
    <g transform="translate(30, 40)">
      <!-- Original 3D data cloud -->
      <ellipse cx="80" cy="60" rx="50" ry="25" fill="rgba(52, 152, 219, 0.4)" stroke="#3498db" stroke-width="2" transform="rotate(-15 80 60)"/>
      
      <!-- Data points with residual lines -->
      <circle cx="60" cy="65" r="3" fill="#e74c3c"/>
      <circle cx="75" cy="55" r="3" fill="#e74c3c"/>
      <circle cx="90" cy="50" r="3" fill="#e74c3c"/>
      <circle cx="85" cy="70" r="3" fill="#e74c3c"/>
      <circle cx="100" cy="60" r="3" fill="#e74c3c"/>
      
      <!-- Residual lines (lost information) -->
      <line x1="60" y1="65" x2="65" y2="75" stroke="#e67e22" stroke-width="2" stroke-dasharray="3,3"/>
      <line x1="75" y1="55" x2="70" y2="65" stroke="#e67e22" stroke-width="2" stroke-dasharray="3,3"/>
      <line x1="90" y1="50" x2="85" y2="60" stroke="#e67e22" stroke-width="2" stroke-dasharray="3,3"/>
      <line x1="85" y1="70" x2="80" y2="80" stroke="#e67e22" stroke-width="2" stroke-dasharray="3,3"/>
      
      <!-- Projection line -->
      <line x1="40" y1="80" x2="120" y2="55" stroke="#2c3e50" stroke-width="3"/>
      
      <!-- Arrow to result -->
      <line x1="130" y1="60" x2="200" y2="60" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
      <text x="165" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Project</text>
      
      <!-- 2D result -->
      <g transform="translate(220, 0)">
        <rect x="0" y="20" width="120" height="80" fill="rgba(231, 76, 60, 0.1)" stroke="#e74c3c" stroke-width="2"/>
        <line x1="10" y1="90" x2="110" y2="90" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
        <line x1="10" y1="90" x2="10" y2="30" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
        
        <!-- Projected points -->
        <circle cx="25" cy="80" r="3" fill="#e74c3c"/>
        <circle cx="40" cy="75" r="3" fill="#e74c3c"/>
        <circle cx="55" cy="70" r="3" fill="#e74c3c"/>
        <circle cx="70" cy="85" r="3" fill="#e74c3c"/>
        <circle cx="85" cy="75" r="3" fill="#e74c3c"/>
        
        <!-- Lost information indicator -->
        <text x="55" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e67e22" font-weight="bold">MIN LOSS</text>
      </g>
    </g>
    
    <!-- Key points -->
    <text x="20" y="160" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Key Points:</text>
    <text x="25" y="180" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• PC1: Line with smallest ⊥ distance to points</text>
    <text x="25" y="195" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• PC1&PC2: Plane with smallest ⊥ distance</text>
    <text x="25" y="210" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• Residuals = Information lost in projection</text>
    <text x="25" y="230" font-family="Arial, sans-serif" font-size="12" fill="#e74c3c" font-weight="bold">Goal: Lose minimum information</text>
  </g>
  
  <!-- Mathematical equivalence section -->
  <g transform="translate(50, 350)">
    <rect x="0" y="0" width="800" height="120" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2" rx="10"/>
    <text x="400" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">
      Mathematical Equivalence
    </text>
    
    <!-- Equation -->
    <g transform="translate(50, 40)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">Total Variance =</text>
      <text x="120" y="0" font-family="Arial, sans-serif" font-size="14" fill="#27ae60" font-weight="bold">Preserved Variance</text>
      <text x="280" y="0" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">+</text>
      <text x="310" y="0" font-family="Arial, sans-serif" font-size="14" fill="#e74c3c" font-weight="bold">Lost Variance</text>
      
      <text x="200" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">(constant)</text>
      <text x="200" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">(maximize)</text>
      <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">(minimize)</text>
      
      <!-- Arrows -->
      <line x1="180" y1="50" x2="220" y2="50" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
      <line x1="380" y1="50" x2="420" y2="50" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
    </g>
    
    <text x="400" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50" font-weight="bold">
      Therefore: Maximizing preserved variance ≡ Minimizing lost variance
    </text>
  </g>
  
  <!-- Implementation note -->
  <g transform="translate(50, 490)">
    <rect x="0" y="0" width="800" height="120" fill="#e8f4fd" stroke="#3498db" stroke-width="2" rx="10"/>
    <text x="400" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#3498db">
      Computational Implementation
    </text>
    
    <text x="20" y="50" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Both definitions lead to the same algorithm:</text>
    <text x="40" y="70" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">1. Compute covariance matrix: R = (1/n)X^T X</text>
    <text x="40" y="85" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">2. Find eigendecomposition: R = VΛV^T</text>
    <text x="40" y="100" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">3. Select top-k eigenvectors (largest eigenvalues)</text>
  </g>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e"/>
    </marker>
  </defs>
</svg>