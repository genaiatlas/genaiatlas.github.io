<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
     refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
    <linearGradient id="linearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="nonlinearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="2" flood-color="#00000030"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="500" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#2c3e50">
    Linear vs Non-Linear Embeddings
  </text>
  
  <!-- Linear Embeddings Section -->
  <g id="linear-section">
    <rect x="50" y="60" width="380" height="200" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2" rx="10" filter="url(#shadow)"/>
    
    <text x="240" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2980b9">
      Linear Embeddings (PCA)
    </text>
    
    <!-- Original space -->
    <g id="linear-original">
      <rect x="70" y="110" width="100" height="80" fill="url(#linearGrad)" stroke="#2c3e50" stroke-width="1" rx="5"/>
      <text x="120" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">
        Original Space
      </text>
      <text x="120" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">
        High Dimensional
      </text>
      
      <!-- Data points in grid pattern -->
      <circle cx="90" cy="160" r="2" fill="white"/>
      <circle cx="105" cy="160" r="2" fill="white"/>
      <circle cx="120" cy="160" r="2" fill="white"/>
      <circle cx="135" cy="160" r="2" fill="white"/>
      <circle cx="150" cy="160" r="2" fill="white"/>
      <circle cx="90" cy="170" r="2" fill="white"/>
      <circle cx="105" cy="170" r="2" fill="white"/>
      <circle cx="120" cy="170" r="2" fill="white"/>
      <circle cx="135" cy="170" r="2" fill="white"/>
      <circle cx="150" cy="170" r="2" fill="white"/>
    </g>
    
    <!-- Linear transformation arrow -->
    <path d="M 180 150 L 220 150" stroke="#34495e" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
    <text x="200" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">
      Linear Transform
    </text>
    <text x="200" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#7f8c8d">
      Y = XW
    </text>
    
    <!-- Embedded space -->
    <g id="linear-embedded">
      <rect x="240" y="110" width="100" height="80" fill="#16a085" stroke="#2c3e50" stroke-width="1" rx="5"/>
      <text x="290" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">
        Embedded Space
      </text>
      <text x="290" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">
        Low Dimensional
      </text>
      
      <!-- Linearly transformed points -->
      <circle cx="260" cy="165" r="2" fill="white"/>
      <circle cx="270" cy="162" r="2" fill="white"/>
      <circle cx="280" cy="160" r="2" fill="white"/>
      <circle cx="290" cy="158" r="2" fill="white"/>
      <circle cx="300" cy="155" r="2" fill="white"/>
      <circle cx="310" cy="168" r="2" fill="white"/>
      <circle cx="320" cy="165" r="2" fill="white"/>
    </g>
    
    <!-- Linear properties -->
    <g id="linear-properties">
      <text x="70" y="215" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#2c3e50">
        Properties:
      </text>
      <text x="70" y="230" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">
        • Preserves global structure
      </text>
      <text x="70" y="243" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">
        • Weighted sum of components
      </text>
      
      <text x="250" y="215" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#2c3e50">
        Formula:
      </text>
      <text x="250" y="230" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">
        x_i = Σ w_ij * v_j
      </text>
      <text x="250" y="243" font-family="Arial, sans-serif" font-size="8" fill="#7f8c8d">
        (linear combination)
      </text>
    </g>
  </g>
  
  <!-- Non-Linear Embeddings Section -->
  <g id="nonlinear-section">
    <rect x="470" y="60" width="380" height="200" fill="#fdf2e9" stroke="#d68910" stroke-width="2" rx="10" filter="url(#shadow)"/>
    
    <text x="660" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#c0392b">
      Non-Linear Embeddings (Spectral)
    </text>
    
    <!-- Original space with graph structure -->
    <g id="nonlinear-original">
      <rect x="490" y="110" width="100" height="80" fill="url(#nonlinearGrad)" stroke="#2c3e50" stroke-width="1" rx="5"/>
      <text x="540" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">
        Graph Structure
      </text>
      <text x="540" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">
        Pairwise Relations
      </text>
      
      <!-- Connected points in clusters -->
      <circle cx="510" cy="160" r="3" fill="white"/>
      <circle cx="525" cy="155" r="3" fill="white"/>
      <circle cx="540" cy="165" r="3" fill="white"/>
      <circle cx="555" cy="160" r="3" fill="white"/>
      <circle cx="570" cy="170" r="3" fill="white"/>
      
      <!-- Connections -->
      <line x1="510" y1="160" x2="525" y2="155" stroke="white" stroke-width="1"/>
      <line x1="525" y1="155" x2="540" y2="165" stroke="white" stroke-width="1"/>
      <line x1="540" y1="165" x2="555" y2="160" stroke="white" stroke-width="1"/>
      <line x1="555" y1="160" x2="570" y2="170" stroke="white" stroke-width="1"/>
      <line x1="510" y1="160" x2="540" y2="165" stroke="white" stroke-width="1"/>
    </g>
    
    <!-- Non-linear transformation arrow -->
    <path d="M 600 150 L 640 150" stroke="#34495e" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
    <text x="620" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">
      Graph Laplacian
    </text>
    <text x="620" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#7f8c8d">
      L = D - W
    </text>
    
    <!-- Embedded space with manifold -->
    <g id="nonlinear-embedded">
      <rect x="660" y="110" width="100" height="80" fill="#8e44ad" stroke="#2c3e50" stroke-width="1" rx="5"/>
      <text x="710" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">
        Manifold Space
      </text>
      <text x="710" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">
        Local Structure
      </text>
      
      <!-- Curved manifold points -->
      <path d="M 680 155 Q 700 165 720 160 Q 740 155 750 170" 
            stroke="white" stroke-width="2" fill="none"/>
      <circle cx="680" cy="155" r="2" fill="white"/>
      <circle cx="695" cy="162" r="2" fill="white"/>
      <circle cx="710" cy="164" r="2" fill="white"/>
      <circle cx="725" cy="160" r="2" fill="white"/>
      <circle cx="740" cy="165" r="2" fill="white"/>
    </g>
    
    <!-- Non-linear properties -->
    <g id="nonlinear-properties">
      <text x="490" y="215" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#2c3e50">
        Properties:
      </text>
      <text x="490" y="230" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">
        • Preserves local neighborhoods
      </text>
      <text x="490" y="243" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">
        • Captures curved manifolds
      </text>
      
      <text x="670" y="215" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#2c3e50">
        Process:
      </text>
      <text x="670" y="230" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">
        1. Build similarity graph
      </text>
      <text x="670" y="243" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">
        2. Find eigenvectors
      </text>
    </g>
  </g>
  
  <!-- Comparison Section -->
  <g id="comparison">
    <rect x="50" y="290" width="800" height="180" fill="#ffffff" stroke="#34495e" stroke-width="2" rx="10" filter="url(#shadow)"/>
    
    <text x="450" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">
      Key Differences
    </text>
    
    <!-- Comparison table -->
    <g id="comparison-table">
      <!-- Headers -->
      <rect x="70" y="330" width="120" height="30" fill="#34495e"/>
      <rect x="190" y="330" width="280" height="30" fill="#3498db"/>
      <rect x="470" y="330" width="280" height="30" fill="#e74c3c"/>
      
      <text x="130" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
        Aspect
      </text>
      <text x="330" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
        Linear (PCA)
      </text>
      <text x="610" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
        Non-Linear (Spectral)
      </text>
      
      <!-- Row 1: Input -->
      <rect x="70" y="360" width="120" height="25" fill="#ecf0f1"/>
      <rect x="190" y="360" width="280" height="25" fill="#ebf3fd"/>
      <rect x="470" y="360" width="280" height="25" fill="#fdf2f2"/>
      
      <text x="130" y="377" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
        Input Data
      </text>
      <text x="330" y="377" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
        Feature vectors (numerical)
      </text>
      <text x="610" y="377" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
        Similarity/adjacency matrix
      </text>
      
      <!-- Row 2: Representation -->
      <rect x="70" y="385" width="120" height="25" fill="#ecf0f1"/>
      <rect x="190" y="385" width="280" height="25" fill="#ebf3fd"/>
      <rect x="470" y="385" width="280" height="25" fill="#fdf2f2"/>
      
      <text x="130" y="402" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
        Representation
      </text>
      <text x="330" y="402" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
        Linear combination
      </text>
      <text x="610" y="402" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
        Non-linear transformation
      </text>
      
      <!-- Row 3: Best for -->
      <rect x="70" y="410" width="120" height="25" fill="#ecf0f1"/>
      <rect x="190" y="410" width="280" height="25" fill="#ebf3fd"/>
      <rect x="470" y="410" width="280" height="25" fill="#fdf2f2"/>
      
      <text x="130" y="427" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
        Best For
      </text>
      <text x="330" y="427" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
        Gaussian data, global patterns
      </text>
      <text x="610" y="427" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
        Clustered data, local patterns
      </text>
      
      <!-- Row 4: Complexity -->
      <rect x="70" y="435" width="120" height="25" fill="#ecf0f1"/>
      <rect x="190" y="435" width="280" height="25" fill="#ebf3fd"/>
      <rect x="470" y="435" width="280" height="25" fill="#fdf2f2"/>
      
      <text x="130" y="452" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
        Complexity
      </text>
      <text x="330" y="452" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
        O(d³) for covariance matrix
      </text>
      <text x="610" y="452" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
        O(n³) for graph construction
      </text>
    </g>
  </g>
</svg>