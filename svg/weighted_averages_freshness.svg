<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="800" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="600" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Time-Based Weighting for Review Freshness
  </text>
  
  <!-- Why Weight by Time? -->
  <g transform="translate(100, 80)">
    <rect x="0" y="0" width="1000" height="100" fill="#fff" stroke="#34495e" stroke-width="2" rx="8"/>
    <text x="500" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      🤔 Why Weight Reviews by Time?
    </text>
    
    <g transform="translate(50, 50)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" fill="#34495e">
        • Restaurant quality changes over time (new chef, management, ingredients)
      </text>
      <text x="0" y="25" font-family="Arial, sans-serif" font-size="14" fill="#34495e">
        • Recent reviews are more relevant for current quality assessment
      </text>
    </g>
  </g>
  
  <!-- Half-Life Concept -->
  <g transform="translate(100, 210)">
    <rect x="0" y="0" width="480" height="260" fill="#fff" stroke="#34495e" stroke-width="2" rx="8"/>
    <text x="240" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      ⏱️ Half-Life Concept
    </text>
    
    <!-- Definition -->
    <g transform="translate(30, 60)">
      <rect x="0" y="0" width="420" height="80" fill="#e8f8f5" stroke="#3498db" stroke-width="2" rx="4"/>
      <text x="210" y="25" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50" font-weight="bold">
        Half-Life Definition
      </text>
      <text x="210" y="48" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#34495e">
        Timescale at which changes become relevant
      </text>
      <text x="210" y="68" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#7f8c8d" font-style="italic">
        Example: 3 months for restaurants
      </text>
    </g>
    
    <!-- Normalized Age Formula -->
    <g transform="translate(30, 155)">
      <rect x="0" y="0" width="420" height="80" fill="#fef5e7" stroke="#f39c12" stroke-width="2" rx="4"/>
      <text x="210" y="25" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50" font-weight="bold">
        Normalized Age
      </text>
      <text x="210" y="50" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#e67e22" font-style="italic">
        Norm. Age = Actual Age / Half-Life
      </text>
    </g>
  </g>
  
  <!-- Weight Decay Function -->
  <g transform="translate(620, 210)">
    <rect x="0" y="0" width="480" height="260" fill="#fff" stroke="#34495e" stroke-width="2" rx="8"/>
    <text x="240" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      📉 Exponential Weight Decay
    </text>
    
    <!-- Weight Formula -->
    <g transform="translate(30, 60)">
      <rect x="0" y="0" width="420" height="80" fill="#fdedec" stroke="#e74c3c" stroke-width="2" rx="4"/>
      <text x="210" y="25" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50" font-weight="bold">
        Weight Function
      </text>
      <text x="210" y="50" font-family="Arial, sans-serif" font-size="17" text-anchor="middle" fill="#c0392b" font-style="italic">
        w = exp(-Normalized Age)
      </text>
    </g>
    
    <!-- Example Calculation -->
    <g transform="translate(30, 155)">
      <rect x="0" y="0" width="420" height="80" fill="#e8f4f8" stroke="#3498db" stroke-width="2" rx="4"/>
      <text x="210" y="20" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#2c3e50" font-weight="bold">
        Example: Review 12 months old (Half-life = 3 months)
      </text>
      <text x="210" y="42" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#34495e">
        Norm. Age = 12/3 = 4
      </text>
      <text x="210" y="62" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#2980b9" font-weight="bold">
        Weight = exp(-4) ≈ 0.018 (1.8% of recent reviews)
      </text>
    </g>
  </g>
  
  <!-- Visual Timeline -->
  <g transform="translate(100, 500)">
    <rect x="0" y="0" width="1000" height="260" fill="#fff" stroke="#34495e" stroke-width="2" rx="8"/>
    <text x="500" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      📅 Weight Decay Over Time (Half-life = 3 months)
    </text>
    
    <!-- Timeline axis -->
    <line x1="80" y1="200" x2="920" y2="200" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead3)"/>
    
    <!-- Time markers and weights -->
    <g transform="translate(80, 200)">
      <!-- Now -->
      <circle cx="0" cy="0" r="10" fill="#27ae60"/>
      <text x="0" y="-20" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#2c3e50" font-weight="bold">
        Now
      </text>
      <text x="0" y="30" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#27ae60" font-weight="bold">
        w = 1.00
      </text>
      <line x1="0" y1="10" x2="0" y2="190" stroke="#27ae60" stroke-width="2" stroke-dasharray="3,3"/>
      <rect x="-30" y="60" width="60" height="120" fill="#27ae60" opacity="0.8"/>
    </g>
    
    <g transform="translate(290, 200)">
      <!-- 3 months -->
      <circle cx="0" cy="0" r="10" fill="#f39c12"/>
      <text x="0" y="-20" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#2c3e50" font-weight="bold">
        3 mo
      </text>
      <text x="0" y="30" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#e67e22" font-weight="bold">
        w = 0.37
      </text>
      <line x1="0" y1="10" x2="0" y2="190" stroke="#f39c12" stroke-width="2" stroke-dasharray="3,3"/>
      <rect x="-30" y="106" width="60" height="74" fill="#f39c12" opacity="0.8"/>
    </g>
    
    <g transform="translate(500, 200)">
      <!-- 6 months -->
      <circle cx="0" cy="0" r="10" fill="#e67e22"/>
      <text x="0" y="-20" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#2c3e50" font-weight="bold">
        6 mo
      </text>
      <text x="0" y="30" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#d35400" font-weight="bold">
        w = 0.14
      </text>
      <line x1="0" y1="10" x2="0" y2="190" stroke="#e67e22" stroke-width="2" stroke-dasharray="3,3"/>
      <rect x="-30" y="153" width="60" height="27" fill="#e67e22" opacity="0.8"/>
    </g>
    
    <g transform="translate(710, 200)">
      <!-- 9 months -->
      <circle cx="0" cy="0" r="10" fill="#e74c3c"/>
      <text x="0" y="-20" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#2c3e50" font-weight="bold">
        9 mo
      </text>
      <text x="0" y="30" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#c0392b" font-weight="bold">
        w = 0.05
      </text>
      <line x1="0" y1="10" x2="0" y2="190" stroke="#e74c3c" stroke-width="2" stroke-dasharray="3,3"/>
      <rect x="-30" y="170" width="60" height="10" fill="#e74c3c" opacity="0.8"/>
    </g>
    
    <g transform="translate(920, 200)">
      <!-- 12 months -->
      <circle cx="0" cy="0" r="10" fill="#95a5a6"/>
      <text x="0" y="-20" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#2c3e50" font-weight="bold">
        12 mo
      </text>
      <text x="0" y="30" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#7f8c8d" font-weight="bold">
        w = 0.02
      </text>
      <line x1="0" y1="10" x2="0" y2="190" stroke="#95a5a6" stroke-width="2" stroke-dasharray="3,3"/>
      <rect x="-30" y="176" width="60" height="4" fill="#95a5a6" opacity="0.8"/>
    </g>
    
    <!-- Age label -->
    <text x="500" y="235" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#7f8c8d" font-style="italic">
      Review Age →
    </text>
  </g>
  
  <!-- Weighted Average Formula -->
  <g transform="translate(200, 775)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50" font-weight="bold">
      Weighted Average:
    </text>
    <text x="135" y="0" font-family="Arial, sans-serif" font-size="14" fill="#2980b9" font-style="italic">
      Score = Σ(wᵢ × rᵢ) / Σ(wᵢ)
    </text>
    <text x="350" y="0" font-family="Arial, sans-serif" font-size="13" fill="#7f8c8d">
      where wᵢ = exp(-ageᵢ/half-life)
    </text>
  </g>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead3" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#2c3e50"/>
    </marker>
  </defs>
</svg>