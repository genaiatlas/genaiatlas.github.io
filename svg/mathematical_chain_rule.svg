<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="formulaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#34495e"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="500" fill="#fafafa"/>
  
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">
    Mathematical Chain Rule Decomposition
  </text>
  
  <!-- Main Formula Box -->
  <rect x="50" y="50" width="800" height="80" fill="url(#formulaGrad)" rx="10" filter="url(#shadow)"/>
  <text x="450" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="white" font-weight="bold">
    ∂/∂w₁₁ ℒ(xⁱ, yⁱ, θ) = ∂z₁/∂w₁₁ · ∂a₁/∂z₁ · ∂z/∂a₁ · ∂ℒ/∂z
  </text>
  <text x="450" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white" opacity="0.9">
    Chain Rule of Calculus Applied to Neural Networks
  </text>
  
  <!-- Individual Components -->
  <g transform="translate(50, 160)">
    
    <!-- Component 1: Weight to Preactivation -->
    <rect x="0" y="0" width="180" height="120" fill="#e8f6f3" stroke="#1abc9c" stroke-width="2" rx="8"/>
    <text x="90" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#1abc9c" font-weight="bold">
      ∂z₁/∂w₁₁
    </text>
    <text x="90" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50" font-weight="bold">
      Weight Influence
    </text>
    <text x="90" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
      How weight affects
    </text>
    <text x="90" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
      preactivation z₁
    </text>
    <text x="90" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#16a085" font-weight="bold">
      = x₁
    </text>
    <text x="90" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#16a085">
      (input value)
    </text>
    
    <!-- Component 2: Preactivation to Activation -->
    <rect x="200" y="0" width="180" height="120" fill="#fdf2e9" stroke="#e67e22" stroke-width="2" rx="8"/>
    <text x="290" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#e67e22" font-weight="bold">
      ∂a₁/∂z₁
    </text>
    <text x="290" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50" font-weight="bold">
      Activation Function
    </text>
    <text x="290" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
      Derivative of non-linearity
    </text>
    <text x="290" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
      (e.g., ReLU, sigmoid)
    </text>
    <text x="290" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#d35400" font-weight="bold">
      ReLU': {1 if z₁>0, 0 else}
    </text>
    
    <!-- Component 3: Hidden to Output -->
    <rect x="400" y="0" width="180" height="120" fill="#ebf3fd" stroke="#3498db" stroke-width="2" rx="8"/>
    <text x="490" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#3498db" font-weight="bold">
      ∂z/∂a₁
    </text>
    <text x="490" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50" font-weight="bold">
      Output Weight
    </text>
    <text x="490" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
      Connection strength from
    </text>
    <text x="490" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
      hidden to output layer
    </text>
    <text x="490" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2980b9" font-weight="bold">
      = v₁
    </text>
    <text x="490" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2980b9">
      (output weight)
    </text>
    
    <!-- Component 4: Loss Function -->
    <rect x="600" y="0" width="180" height="120" fill="#fdebf7" stroke="#e91e63" stroke-width="2" rx="8"/>
    <text x="690" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#e91e63" font-weight="bold">
      ∂ℒ/∂z
    </text>
    <text x="690" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50" font-weight="bold">
      Error Term
    </text>
    <text x="690" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
      How loss changes with
    </text>
    <text x="690" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
      output activation
    </text>
    <text x="690" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#c2185b" font-weight="bold">
      = ŷ - y
    </text>
    <text x="690" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#c2185b">
      (prediction error)
    </text>
  </g>
  
  <!-- Multiplication symbols -->
  <g transform="translate(50, 220)">
    <circle cx="190" cy="20" r="15" fill="#34495e"/>
    <text x="190" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white" font-weight="bold">×</text>
    
    <circle cx="390" cy="20" r="15" fill="#34495e"/>
    <text x="390" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white" font-weight="bold">×</text>
    
    <circle cx="590" cy="20" r="15" fill="#34495e"/>
    <text x="590" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white" font-weight="bold">×</text>
  </g>
  
  <!-- Arrows showing flow -->
  <g transform="translate(50, 250)">
    <line x1="90" y1="0" x2="130" y2="0" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="250" y1="0" x2="290" y2="0" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="450" y1="0" x2="490" y2="0" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="650" y1="0" x2="690" y2="0" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
    
    <text x="110" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#34495e">Forward</text>
    <text x="270" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#34495e">Forward</text>
    <text x="470" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#34495e">Forward</text>
    <text x="670" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#34495e">Forward</text>
  </g>
  
  <!-- Backward arrows -->
  <g transform="translate(50, 270)">
    <line x1="690" y1="0" x2="650" y2="0" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="4,2"/>
    <line x1="590" y1="0" x2="550" y2="0" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="4,2"/>
    <line x1="390" y1="0" x2="350" y2="0" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="4,2"/>
    <line x1="190" y1="0" x2="150" y2="0" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="4,2"/>
    
    <text x="670" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#e74c3c">Backward</text>
    <text x="570" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#e74c3c">Backward</text>
    <text x="370" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#e74c3c">Backward</text>
    <text x="170" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#e74c3c">Backward</text>
  </g>
  
  <!-- Mathematical Properties Box -->
  <g transform="translate(50, 320)">
    <rect x="0" y="0" width="800" height="140" fill="white" stroke="#bdc3c7" stroke-width="2" rx="8" filter="url(#shadow)"/>
    
    <text x="20" y="25" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50" font-weight="bold">
      Mathematical Properties:
    </text>
    
    <g transform="translate(20, 40)">
      <!-- Property 1 -->
      <circle cx="5" cy="5" r="3" fill="#27ae60"/>
      <text x="15" y="10" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
        <tspan font-weight="bold">Multiplicative Property:</tspan> If any component is zero, entire gradient is zero
      </text>
      
      <!-- Property 2 -->
      <circle cx="5" cy="25" r="3" fill="#f39c12"/>
      <text x="15" y="30" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
        <tspan font-weight="bold">Error Dependency:</tspan> Perfect predictions (ŷ = y) result in zero gradients
      </text>
      
      <!-- Property 3 -->
      <circle cx="5" cy="45" r="3" fill="#e74c3c"/>
      <text x="15" y="50" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
        <tspan font-weight="bold">Activation Gating:</tspan> Inactive neurons (ReLU ≤ 0) block gradient flow
      </text>
      
      <!-- Property 4 -->
      <circle cx="5" cy="65" r="3" fill="#9b59b6"/>
      <text x="15" y="70" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
        <tspan font-weight="bold">Local Computation:</tspan> Each derivative computed using only local information
      </text>
      
      <!-- Property 5 -->
      <circle cx="5" cy="85" r="3" fill="#3498db"/>
      <text x="15" y="90" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
        <tspan font-weight="bold">Scale Dependency:</tspan> Larger inputs and weights lead to larger gradients
      </text>
    </g>
    
    <!-- Example calculation -->
    <g transform="translate(450, 40)">
      <rect x="0" y="0" width="320" height="85" fill="#ecf0f1" stroke="#95a5a6" rx="5"/>
      <text x="160" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50" font-weight="bold">
        Example Calculation:
      </text>
      <text x="10" y="35" font-family="Monaco, monospace" font-size="10" fill="#2c3e50">
        Given: x₁ = 0.5, z₁ = 1.2, v₁ = 0.8, error = 0.3
      </text>
      <text x="10" y="50" font-family="Monaco, monospace" font-size="10" fill="#2c3e50">
        ∂ℒ/∂w₁₁ = x₁ × ReLU'(z₁) × v₁ × error
      </text>
      <text x="10" y="65" font-family="Monaco, monospace" font-size="10" fill="#2c3e50">
        ∂ℒ/∂w₁₁ = 0.5 × 1 × 0.8 × 0.3 = 0.12
      </text>
    </g>
  </g>
</svg>