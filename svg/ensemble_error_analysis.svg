<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #2c3e50; }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #34495e; }
      .label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #2c3e50; }
      .axis-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #2c3e50; }
      .tick-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10px; fill: #2c3e50; }
      .legend-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #2c3e50; }
      .grid-line { stroke: #ecf0f1; stroke-width: 1; stroke-dasharray: 2,2; }
      .axis-line { stroke: #2c3e50; stroke-width: 2; }
      .ensemble-curve { stroke: #3498db; stroke-width: 3; fill: none; }
      .base-line { stroke: #e74c3c; stroke-width: 2; stroke-dasharray: 8,4; fill: none; }
      .threshold-line { stroke: #f39c12; stroke-width: 2; stroke-dasharray: 6,3; fill: none; }
    </style>
  </defs>
  
  <!-- Title -->
  <text x="400" y="25" text-anchor="middle" class="title">Ensemble Error vs Base Error Rate</text>
  <text x="400" y="45" text-anchor="middle" class="subtitle">(25 Classifiers, Uncorrelated Errors)</text>
  
  <!-- Chart area background -->
  <rect x="80" y="70" width="500" height="350" fill="#fafafa" stroke="#bdc3c7" stroke-width="1"/>
  
  <!-- Grid lines -->
  <g class="grid-line">
    <!-- Horizontal grid lines -->
    <line x1="80" y1="120" x2="580" y2="120"/>
    <line x1="80" y1="170" x2="580" y2="170"/>
    <line x1="80" y1="220" x2="580" y2="220"/>
    <line x1="80" y1="270" x2="580" y2="270"/>
    <line x1="80" y1="320" x2="580" y2="320"/>
    <line x1="80" y1="370" x2="580" y2="370"/>
    
    <!-- Vertical grid lines -->
    <line x1="130" y1="70" x2="130" y2="420"/>
    <line x1="180" y1="70" x2="180" y2="420"/>
    <line x1="230" y1="70" x2="230" y2="420"/>
    <line x1="330" y1="70" x2="330" y2="420"/>
    <line x1="430" y1="70" x2="430" y2="420"/>
    <line x1="530" y1="70" x2="530" y2="420"/>
  </g>
  
  <!-- Axes -->
  <line x1="80" y1="420" x2="580" y2="420" class="axis-line"/>
  <line x1="80" y1="70" x2="80" y2="420" class="axis-line"/>
  
  <!-- X-axis labels -->
  <text x="80" y="440" text-anchor="middle" class="tick-label">0.0</text>
  <text x="130" y="440" text-anchor="middle" class="tick-label">0.1</text>
  <text x="180" y="440" text-anchor="middle" class="tick-label">0.2</text>
  <text x="230" y="440" text-anchor="middle" class="tick-label">0.3</text>
  <text x="280" y="440" text-anchor="middle" class="tick-label">0.4</text>
  <text x="330" y="440" text-anchor="middle" class="tick-label">0.5</text>
  <text x="380" y="440" text-anchor="middle" class="tick-label">0.6</text>
  <text x="430" y="440" text-anchor="middle" class="tick-label">0.7</text>
  <text x="480" y="440" text-anchor="middle" class="tick-label">0.8</text>
  <text x="530" y="440" text-anchor="middle" class="tick-label">0.9</text>
  <text x="580" y="440" text-anchor="middle" class="tick-label">1.0</text>
  
  <!-- Y-axis labels -->
  <text x="70" y="425" text-anchor="end" class="tick-label">0.0</text>
  <text x="70" y="375" text-anchor="end" class="tick-label">0.1</text>
  <text x="70" y="325" text-anchor="end" class="tick-label">0.2</text>
  <text x="70" y="275" text-anchor="end" class="tick-label">0.3</text>
  <text x="70" y="225" text-anchor="end" class="tick-label">0.4</text>
  <text x="70" y="175" text-anchor="end" class="tick-label">0.5</text>
  <text x="70" y="125" text-anchor="end" class="tick-label">0.6</text>
  <text x="70" y="75" text-anchor="end" class="tick-label">0.7</text>
  
  <!-- Axis titles -->
  <text x="330" y="470" text-anchor="middle" class="axis-label">Base Error Rate (ε)</text>
  <text x="30" y="245" text-anchor="middle" class="axis-label" transform="rotate(-90, 30, 245)">Ensemble Error Rate</text>
  
  <!-- 0.5 threshold line -->
  <line x1="330" y1="70" x2="330" y2="420" class="threshold-line"/>
  <text x="340" y="85" class="label">Critical Threshold</text>
  <text x="340" y="100" class="label">ε = 0.5</text>
  
  <!-- Base error line (y = x) -->
  <line x1="80" y1="420" x2="580" y2="70" class="base-line"/>
  
  <!-- Ensemble error curve -->
  <path d="M 80 420 
           C 90 419, 100 418, 110 416
           C 120 413, 130 408, 140 402
           C 150 395, 160 386, 170 375
           C 180 362, 190 347, 200 330
           C 210 312, 220 292, 230 270
           C 240 247, 250 222, 260 196
           C 270 169, 280 141, 290 112
           C 300 83, 310 54, 320 25
           C 330 70, 340 115, 350 160
           C 360 205, 370 250, 380 295
           C 390 340, 400 365, 410 390
           C 420 395, 430 400, 440 405
           C 450 408, 460 410, 470 412
           C 480 413, 490 414, 500 415
           C 510 415.5, 520 416, 530 416.3
           C 540 416.5, 550 416.7, 560 416.8
           C 570 416.9, 580 417" 
        class="ensemble-curve"/>
  
  <!-- Key points marked -->
  <circle cx="230" cy="375" r="4" fill="#e74c3c"/>
  <circle cx="280" cy="320" r="4" fill="#e74c3c"/>
  <circle cx="330" cy="245" r="4" fill="#f39c12"/>
  
  <!-- Point labels -->
  <text x="240" y="370" class="label">ε=0.3, E≈0.06</text>
  <text x="290" y="315" class="label">ε=0.4, E≈0.19</text>
  <text x="340" y="240" class="label">ε=0.5, E=0.5</text>
  
  <!-- Legend -->
  <rect x="600" y="100" width="180" height="140" fill="white" stroke="#bdc3c7" stroke-width="1" rx="5"/>
  <text x="690" y="125" text-anchor="middle" class="subtitle">Legend</text>
  
  <!-- Legend items -->
  <line x1="615" y1="145" x2="645" y2="145" class="ensemble-curve"/>
  <text x="655" y="150" class="legend-text">Ensemble Error</text>
  
  <line x1="615" y1="165" x2="645" y2="165" class="base-line"/>
  <text x="655" y="170" class="legend-text">Base Error (ε)</text>
  
  <line x1="615" y1="185" x2="645" y2="185" class="threshold-line"/>
  <text x="655" y="190" class="legend-text">Critical Threshold</text>
  
  <circle cx="630" cy="205" r="3" fill="#e74c3c"/>
  <text x="655" y="210" class="legend-text">Key Points</text>
  
  <!-- Mathematical insight box -->
  <rect x="80" y="480" width="500" height="100" fill="#e8f5ff" stroke="#3498db" stroke-width="2" rx="8"/>
  <text x="330" y="505" text-anchor="middle" class="subtitle">Key Insights</text>
  
  <text x="100" y="525" class="label">• Ensemble error &lt; Base error when ε &lt; 0.5</text>
  <text x="100" y="540" class="label">• Maximum benefit occurs around ε = 0.3-0.4</text>
  <text x="100" y="555" class="label">• At ε = 0.5, ensemble provides no improvement</text>
  <text x="100" y="570" class="label">• Formula: P(majority error) = Σₖ₌₁₃²⁵ (²⁵ₖ)εᵏ(1-ε)²⁵⁻ᵏ</text>
  
</svg>