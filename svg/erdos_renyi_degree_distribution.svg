<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="400" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Degree Distribution Comparison
  </text>
  
  <!-- Erdos-Renyi Distribution (Left) -->
  <g id="erdos-renyi">
    <!-- Label -->
    <text x="200" y="65" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Erdős-Rényi Model
    </text>
    <text x="200" y="85" font-size="12" text-anchor="middle" fill="#7f8c8d">
      (Binomial Distribution)
    </text>
    
    <!-- Axes -->
    <line x1="50" y1="320" x2="350" y2="320" stroke="#34495e" stroke-width="2"/>
    <line x1="50" y1="120" x2="50" y2="320" stroke="#34495e" stroke-width="2"/>
    
    <!-- X-axis label -->
    <text x="200" y="350" font-size="14" text-anchor="middle" fill="#34495e">
      Degree (k)
    </text>
    
    <!-- Y-axis label -->
    <text x="25" y="220" font-size="14" text-anchor="middle" fill="#34495e" transform="rotate(-90 25 220)">
      P(k)
    </text>
    
    <!-- Bell curve (Binomial/Poisson) -->
    <path d="M 60,310 Q 90,300 100,280 Q 120,220 140,180 Q 160,150 180,140 Q 200,130 220,140 Q 240,150 260,180 Q 280,220 300,280 Q 310,300 340,310" 
          fill="#3498db" fill-opacity="0.6" stroke="#2980b9" stroke-width="2"/>
    
    <!-- Peak marker -->
    <circle cx="200" cy="132" r="4" fill="#e74c3c"/>
    <text x="210" y="125" font-size="11" fill="#e74c3c" font-weight="bold">Peak at ⟨k⟩</text>
    
    <!-- Ticks -->
    <line x1="100" y1="320" x2="100" y2="325" stroke="#34495e" stroke-width="1"/>
    <line x1="150" y1="320" x2="150" y2="325" stroke="#34495e" stroke-width="1"/>
    <line x1="200" y1="320" x2="200" y2="325" stroke="#34495e" stroke-width="1"/>
    <line x1="250" y1="320" x2="250" y2="325" stroke="#34495e" stroke-width="1"/>
    <line x1="300" y1="320" x2="300" y2="325" stroke="#34495e" stroke-width="1"/>
  </g>
  
  <!-- Power-Law Distribution (Right) -->
  <g id="power-law">
    <!-- Label -->
    <text x="600" y="65" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Real-World Networks
    </text>
    <text x="600" y="85" font-size="12" text-anchor="middle" fill="#7f8c8d">
      (Power-Law Distribution)
    </text>
    
    <!-- Axes -->
    <line x1="450" y1="320" x2="750" y2="320" stroke="#34495e" stroke-width="2"/>
    <line x1="450" y1="120" x2="450" y2="320" stroke="#34495e" stroke-width="2"/>
    
    <!-- X-axis label -->
    <text x="600" y="350" font-size="14" text-anchor="middle" fill="#34495e">
      Degree (k)
    </text>
    
    <!-- Y-axis label -->
    <text x="425" y="220" font-size="14" text-anchor="middle" fill="#34495e" transform="rotate(-90 425 220)">
      P(k)
    </text>
    
    <!-- Power-law curve -->
    <path d="M 460,130 Q 480,140 500,165 Q 520,195 540,225 Q 560,255 580,275 Q 600,290 620,300 Q 640,307 660,312 Q 680,315 700,317 Q 720,318 740,319" 
          fill="#e74c3c" fill-opacity="0.6" stroke="#c0392b" stroke-width="2"/>
    
    <!-- Heavy tail annotation -->
    <line x1="650" y1="310" x2="720" y2="310" stroke="#f39c12" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="685" y="305" font-size="10" text-anchor="middle" fill="#f39c12" font-weight="bold">
      Heavy tail
    </text>
    
    <!-- Hubs annotation -->
    <circle cx="470" cy="135" r="4" fill="#9b59b6"/>
    <text x="485" y="125" font-size="11" fill="#9b59b6" font-weight="bold">Hubs</text>
    
    <!-- Ticks -->
    <line x1="500" y1="320" x2="500" y2="325" stroke="#34495e" stroke-width="1"/>
    <line x1="550" y1="320" x2="550" y2="325" stroke="#34495e" stroke-width="1"/>
    <line x1="600" y1="320" x2="600" y2="325" stroke="#34495e" stroke-width="1"/>
    <line x1="650" y1="320" x2="650" y2="325" stroke="#34495e" stroke-width="1"/>
    <line x1="700" y1="320" x2="700" y2="325" stroke="#34495e" stroke-width="1"/>
  </g>
  
  <!-- Key Differences Box -->
  <g id="differences">
    <rect x="50" y="365" width="700" height="30" fill="#ecf0f1" stroke="#95a5a6" stroke-width="1" rx="5"/>
    <text x="400" y="385" font-size="13" text-anchor="middle" fill="#2c3e50" font-weight="bold">
      Erdős-Rényi: Homogeneous degrees, no hubs | Real Networks: Heterogeneous degrees, hub nodes exist
    </text>
  </g>
</svg>