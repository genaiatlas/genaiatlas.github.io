<svg viewBox="0 0 900 650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="identityGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#66BB6A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sigmoidGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2196F3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#42A5F5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="softmaxGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF9800;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFB74D;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <dropShadow dx="3" dy="3" stdDeviation="3" flood-color="#00000020"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="650" fill="#fafafa"/>
  
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1a1a1a">Activation Functions for Different Loss Functions</text>
  
  <!-- Identity Function for Regression -->
  <g transform="translate(50, 70)">
    <rect x="0" y="0" width="260" height="350" rx="15" fill="url(#identityGradient)" filter="url(#shadow)"/>
    
    <!-- Header -->
    <text x="130" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">REGRESSION</text>
    <text x="130" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">Identity Activation</text>
    
    <!-- Function plot -->
    <rect x="20" y="70" width="220" height="150" rx="5" fill="#ffffff90"/>
    
    <!-- Plot identity function -->
    <g transform="translate(130, 145)">
      <!-- Axes -->
      <line x1="-90" y1="60" x2="90" y2="60" stroke="#333" stroke-width="1.5"/>
      <line x1="0" y1="-60" x2="0" y2="60" stroke="#333" stroke-width="1.5"/>
      
      <!-- Identity line -->
      <line x1="-80" y1="40" x2="80" y2="-40" stroke="#1B5E20" stroke-width="3"/>
      
      <!-- Labels -->
      <text x="0" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">z</text>
      <text x="-105" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333" transform="rotate(-90, -105, 5)">f(z)</text>
      
      <!-- Function equation -->
      <text x="0" y="-75" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1B5E20">f(z) = z</text>
    </g>
    
    <!-- Properties -->
    <rect x="20" y="240" width="220" height="90" rx="5" fill="#ffffff40"/>
    <text x="30" y="260" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Properties:</text>
    <text x="30" y="280" font-family="Arial, sans-serif" font-size="11" fill="white">• Range: (-∞, +∞)</text>
    <text x="30" y="295" font-family="Arial, sans-serif" font-size="11" fill="white">• Linear output</text>
    <text x="30" y="310" font-family="Arial, sans-serif" font-size="11" fill="white">• No saturation</text>
    <text x="30" y="325" font-family="Arial, sans-serif" font-size="11" fill="white">• Perfect for continuous values</text>
    
    <!-- Use case -->
    <text x="130" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Use with: MSE Loss</text>
  </g>
  
  <!-- Sigmoid Function for Binary Classification -->
  <g transform="translate(320, 70)">
    <rect x="0" y="0" width="260" height="350" rx="15" fill="url(#sigmoidGradient)" filter="url(#shadow)"/>
    
    <!-- Header -->
    <text x="130" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">BINARY CLASSIFICATION</text>
    <text x="130" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">Sigmoid Activation</text>
    
    <!-- Function plot -->
    <rect x="20" y="70" width="220" height="150" rx="5" fill="#ffffff90"/>
    
    <!-- Plot sigmoid function -->
    <g transform="translate(130, 145)">
      <!-- Axes -->
      <line x1="-90" y1="60" x2="90" y2="60" stroke="#333" stroke-width="1.5"/>
      <line x1="0" y1="-60" x2="0" y2="60" stroke="#333" stroke-width="1.5"/>
      
      <!-- Sigmoid curve -->
      <path d="M -80 55 Q -40 50 -20 30 Q 0 0 20 -30 Q 40 -50 80 -55" stroke="#0D47A1" stroke-width="3" fill="none"/>
      
      <!-- Horizontal asymptotes -->
      <line x1="-90" y1="-55" x2="90" y2="-55" stroke="#666" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="-90" y1="55" x2="90" y2="55" stroke="#666" stroke-width="1" stroke-dasharray="3,3"/>
      
      <!-- Labels -->
      <text x="0" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">z</text>
      <text x="-105" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333" transform="rotate(-90, -105, 5)">σ(z)</text>
      <text x="95" y="-50" font-family="Arial, sans-serif" font-size="9" fill="#666">1</text>
      <text x="95" y="60" font-family="Arial, sans-serif" font-size="9" fill="#666">0</text>
      
      <!-- Function equation -->
      <text x="0" y="-75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0D47A1">σ(z) = 1/(1+e⁻ᶻ)</text>
    </g>
    
    <!-- Properties -->
    <rect x="20" y="240" width="220" height="90" rx="5" fill="#ffffff40"/>
    <text x="30" y="260" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Properties:</text>
    <text x="30" y="280" font-family="Arial, sans-serif" font-size="11" fill="white">• Range: (0, 1)</text>
    <text x="30" y="295" font-family="Arial, sans-serif" font-size="11" fill="white">• Probability interpretation</text>
    <text x="30" y="310" font-family="Arial, sans-serif" font-size="11" fill="white">• Smooth, differentiable</text>
    <text x="30" y="325" font-family="Arial, sans-serif" font-size="11" fill="white">• S-shaped curve</text>
    
    <!-- Use case -->
    <text x="130" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Use with: Cross-Entropy Loss</text>
  </g>
  
  <!-- Softmax Function for Multi-class Classification -->
  <g transform="translate(590, 70)">
    <rect x="0" y="0" width="260" height="350" rx="15" fill="url(#softmaxGradient)" filter="url(#shadow)"/>
    
    <!-- Header -->
    <text x="130" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">MULTI-CLASS</text>
    <text x="130" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">Softmax Activation</text>
    
    <!-- Function visualization -->
    <rect x="20" y="70" width="220" height="150" rx="5" fill="#ffffff90"/>
    
    <!-- Softmax visualization -->
    <g transform="translate(130, 145)">
      <!-- Show probability distribution -->
      <rect x="-80" y="-20" width="35" height="40" fill="#FF5722" opacity="0.7"/>
      <rect x="-40" y="-35" width="35" height="55" fill="#4CAF50" opacity="0.7"/>
      <rect x="0" y="-45" width="35" height="65" fill="#2196F3" opacity="0.7"/>
      <rect x="40" y="-15" width="35" height="35" fill="#9C27B0" opacity="0.7"/>
      
      <!-- Labels for classes -->
      <text x="-62" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">C₁</text>
      <text x="-22" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">C₂</text>
      <text x="17" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">C₃</text>
      <text x="57" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">C₄</text>
      
      <!-- Probability values -->
      <text x="-62" y="-25" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">0.1</text>
      <text x="-22" y="-40" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">0.2</text>
      <text x="17" y="-50" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">0.6</text>
      <text x="57" y="-20" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">0.1</text>
      
      <!-- Sum = 1 indicator -->
      <text x="0" y="-65" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Σpᵢ = 1</text>
      
      <!-- Function equation -->
      <text x="0" y="-75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#E65100">pᵢ = eᶻⁱ/Σeᶻʲ</text>
    </g>
    
    <!-- Properties -->
    <rect x="20" y="240" width="220" height="90" rx="5" fill="#ffffff40"/>
    <text x="30" y="260" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Properties:</text>
    <text x="30" y="280" font-family="Arial, sans-serif" font-size="11" fill="white">• Range: (0, 1) for each output</text>
    <text x="30" y="295" font-family="Arial, sans-serif" font-size="11" fill="white">• Sum of outputs = 1</text>
    <text x="30" y="310" font-family="Arial, sans-serif" font-size="11" fill="white">• Probability distribution</text>
    <text x="30" y="325" font-family="Arial, sans-serif" font-size="11" fill="white">• Multi-class classification</text>
    
    <!-- Use case -->
    <text x="130" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Use with: Categorical Cross-Entropy</text>
  </g>
  
  <!-- Comparison Table -->
  <g transform="translate(50, 450)">
    <rect x="0" y="0" width="800" height="180" rx="10" fill="white" stroke="#ddd" stroke-width="1"/>
    
    <text x="400" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#333">Activation Function Comparison</text>
    
    <!-- Table headers -->
    <rect x="20" y="40" width="760" height="30" fill="#f0f0f0"/>
    <text x="50" y="60" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Task</text>
    <text x="200" y="60" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Activation</text>
    <text x="350" y="60" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Loss Function</text>
    <text x="550" y="60" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Output Range</text>
    <text x="680" y="60" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Use Case</text>
    
    <!-- Row 1: Regression -->
    <rect x="20" y="70" width="760" height="30" fill="#e8f5e8"/>
    <text x="50" y="90" font-family="Arial, sans-serif" font-size="11" fill="#333">Regression</text>
    <text x="200" y="90" font-family="Arial, sans-serif" font-size="11" fill="#333">Identity: f(z) = z</text>
    <text x="350" y="90" font-family="Arial, sans-serif" font-size="11" fill="#333">Mean Squared Error</text>
    <text x="550" y="90" font-family="Arial, sans-serif" font-size="11" fill="#333">(-∞, +∞)</text>
    <text x="680" y="90" font-family="Arial, sans-serif" font-size="11" fill="#333">Price prediction</text>
    
    <!-- Row 2: Binary Classification -->
    <rect x="20" y="100" width="760" height="30" fill="#e3f2fd"/>
    <text x="50" y="120" font-family="Arial, sans-serif" font-size="11" fill="#333">Binary Class.</text>
    <text x="200" y="120" font-family="Arial, sans-serif" font-size="11" fill="#333">Sigmoid: 1/(1+e⁻ᶻ)</text>
    <text x="350" y="120" font-family="Arial, sans-serif" font-size="11" fill="#333">Binary Cross-Entropy</text>
    <text x="550" y="120" font-family="Arial, sans-serif" font-size="11" fill="#333">(0, 1)</text>
    <text x="680" y="120" font-family="Arial, sans-serif" font-size="11" fill="#333">Spam detection</text>
    
    <!-- Row 3: Multi-class Classification -->
    <rect x="20" y="130" width="760" height="30" fill="#fff3e0"/>
    <text x="50" y="150" font-family="Arial, sans-serif" font-size="11" fill="#333">Multi-class</text>
    <text x="200" y="150" font-family="Arial, sans-serif" font-size="11" fill="#333">Softmax: eᶻⁱ/Σeᶻʲ</text>
    <text x="350" y="150" font-family="Arial, sans-serif" font-size="11" fill="#333">Categorical Cross-Entropy</text>
    <text x="550" y="150" font-family="Arial, sans-serif" font-size="11" fill="#333">(0, 1), Σ=1</text>
    <text x="680" y="150" font-family="Arial, sans-serif" font-size="11" fill="#333">Image classification</text>
  </g>
  
  <!-- Key Principle -->
  <rect x="150" y="610" width="600" height="30" rx="15" fill="#4CAF50" opacity="0.1" stroke="#4CAF50" stroke-width="2"/>
  <text x="450" y="630" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2E7D32">💡 Activation function must match the expected output range and loss function requirements</text>
</svg>