<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title-text { font-family: Arial, sans-serif; font-size: 24px; font-weight: bold; fill: #2c3e50; }
      .section-text { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #34495e; }
      .label-text { font-family: Arial, sans-serif; font-size: 12px; fill: #2c3e50; }
      .formula-text { font-family: Courier New, monospace; font-size: 14px; fill: #e74c3c; }
      .node-good { fill: #3498db; stroke: #2980b9; stroke-width: 2; }
      .node-bad { fill: #e74c3c; stroke: #c0392b; stroke-width: 2; }
      .edge-thick { stroke: #2c3e50; stroke-width: 3; }
      .edge-thin { stroke: #7f8c8d; stroke-width: 1; stroke-dasharray: 5,5; }
      .community-outline { fill: none; stroke: #9b59b6; stroke-width: 3; stroke-dasharray: 10,5; opacity: 0.7; }
      .arrow { fill: #2c3e50; }
    </style>
  </defs>
  
  <text x="400" y="30" text-anchor="middle" class="title-text">Modularity Clustering: Core Concept</text>
  
  <text x="120" y="70" text-anchor="middle" class="section-text">Original Graph</text>
  
  <ellipse cx="80" cy="140" rx="50" ry="40" class="community-outline"/>
  <circle cx="60" cy="120" r="8" class="node-good"/>
  <circle cx="100" cy="120" r="8" class="node-good"/>
  <circle cx="80" cy="160" r="8" class="node-good"/>
  <line x1="60" y1="120" x2="100" y2="120" class="edge-thick"/>
  <line x1="60" y1="120" x2="80" y2="160" class="edge-thick"/>
  <line x1="100" y1="120" x2="80" y2="160" class="edge-thick"/>
  
  <ellipse cx="160" cy="140" rx="50" ry="40" class="community-outline"/>
  <circle cx="140" cy="130" r="8" class="node-bad"/>
  <circle cx="180" cy="130" r="8" class="node-bad"/>
  <circle cx="160" cy="150" r="8" class="node-bad"/>
  <line x1="140" y1="130" x2="180" y2="130" class="edge-thin"/>
  
  <line x1="100" y1="120" x2="140" y2="130" class="edge-thin"/>
  
  <text x="80" y="200" text-anchor="middle" class="label-text">High Modularity</text>
  <text x="160" y="200" text-anchor="middle" class="label-text">Low Modularity</text>
  
  <path d="M 250 140 L 290 140 L 285 135 M 290 140 L 285 145" class="arrow" stroke="#2c3e50" stroke-width="2" fill="none"/>
  
  <text x="450" y="70" text-anchor="middle" class="section-text">Baseline Comparison</text>
  
  <rect x="350" y="90" width="200" height="100" fill="none" stroke="#95a5a6" stroke-width="2"/>
  <text x="450" y="110" text-anchor="middle" class="label-text">Random Baseline Graph</text>
  
  <circle cx="380" cy="130" r="6" fill="#95a5a6"/>
  <circle cx="420" cy="130" r="6" fill="#95a5a6"/>
  <circle cx="460" cy="130" r="6" fill="#95a5a6"/>
  <circle cx="500" cy="130" r="6" fill="#95a5a6"/>
  <circle cx="400" cy="160" r="6" fill="#95a5a6"/>
  <circle cx="480" cy="160" r="6" fill="#95a5a6"/>
  
  <line x1="380" y1="130" x2="420" y2="130" stroke="#bdc3c7" stroke-width="1"/>
  <line x1="420" y1="130" x2="460" y2="130" stroke="#bdc3c7" stroke-width="1"/>
  <line x1="380" y1="130" x2="400" y2="160" stroke="#bdc3c7" stroke-width="1"/>
  <line x1="460" y1="130" x2="480" y2="160" stroke="#bdc3c7" stroke-width="1"/>
  
  <rect x="50" y="250" width="700" height="80" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
  <text x="400" y="275" text-anchor="middle" class="section-text">Modularity Score Formula</text>
  <text x="400" y="300" text-anchor="middle" class="formula-text">Q = Σ (A_ij - P_ij) for nodes i,j in same community</text>
  <text x="200" y="320" text-anchor="middle" class="label-text">A_ij = actual edge (0 or 1)</text>
  <text x="600" y="320" text-anchor="middle" class="label-text">P_ij = expected edge probability</text>
  
  <text x="400" y="370" text-anchor="middle" class="section-text">Score Interpretation</text>
  
  <rect x="100" y="380" width="150" height="40" fill="#2ecc71" opacity="0.7"/>
  <text x="175" y="395" text-anchor="middle" class="label-text">Q &gt; 0.3</text>
  <text x="175" y="410" text-anchor="middle" class="label-text">Strong Communities</text>
  
  <rect x="275" y="380" width="150" height="40" fill="#f39c12" opacity="0.7"/>
  <text x="350" y="395" text-anchor="middle" class="label-text">Q ≈ 0</text>
  <text x="350" y="410" text-anchor="middle" class="label-text">Random Structure</text>
  
  <rect x="450" y="380" width="150" height="40" fill="#e74c3c" opacity="0.7"/>
  <text x="525" y="395" text-anchor="middle" class="label-text">Q &lt; 0</text>
  <text x="525" y="410" text-anchor="middle" class="label-text">Anti-Communities</text>
  
  <text x="400" y="450" text-anchor="middle" class="section-text">Key Insight: Good communities have more internal edges than expected by chance</text>
  
</svg>