<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="24" font-weight="bold" fill="#2c3e50">
    Random Variables
  </text>
  
  <!-- Definition Box -->
  <rect x="100" y="50" width="600" height="60" fill="#3498db" fill-opacity="0.1" stroke="#3498db" stroke-width="2" rx="5"/>
  <text x="400" y="75" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50">
    A random variable is a function that assigns numerical values
  </text>
  <text x="400" y="95" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50">
    to outcomes of a random experiment
  </text>
  
  <!-- Discrete vs Continuous Division -->
  <line x1="400" y1="130" x2="400" y2="550" stroke="#bdc3c7" stroke-width="2"/>
  
  <!-- Discrete Random Variables (Left Side) -->
  <text x="200" y="150" text-anchor="middle" font-size="20" font-weight="bold" fill="#e74c3c">
    Discrete Random Variables
  </text>
  
  <!-- Discrete characteristics -->
  <rect x="50" y="170" width="300" height="120" fill="#e74c3c" fill-opacity="0.1" stroke="#e74c3c" stroke-width="1" rx="5"/>
  <text x="200" y="190" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">Characteristics:</text>
  <text x="70" y="210" font-size="12" fill="#2c3e50">• Countable values (finite or countably infinite)</text>
  <text x="70" y="225" font-size="12" fill="#2c3e50">• Can be listed: {x₁, x₂, x₃, ...}</text>
  <text x="70" y="240" font-size="12" fill="#2c3e50">• Probability Mass Function (PMF): P(X = x)</text>
  <text x="70" y="255" font-size="12" fill="#2c3e50">• Examples: coin flips, dice rolls, counts</text>
  <text x="70" y="275" font-size="12" font-weight="bold" fill="#e74c3c">Properties: Σ P(X = xᵢ) = 1</text>
  
  <!-- Discrete Example: Dice Roll -->
  <rect x="50" y="310" width="300" height="220" fill="#ffffff" stroke="#e74c3c" stroke-width="2" rx="5"/>
  <text x="200" y="330" text-anchor="middle" font-size="14" font-weight="bold" fill="#e74c3c">
    Example: Six-sided Die
  </text>
  
  <!-- Bar chart for dice -->
  <g transform="translate(80, 350)">
    <!-- Axes -->
    <line x1="0" y1="150" x2="240" y2="150" stroke="#2c3e50" stroke-width="1"/>
    <line x1="0" y1="0" x2="0" y2="150" stroke="#2c3e50" stroke-width="1"/>
    
    <!-- Bars -->
    <rect x="10" y="25" width="30" height="125" fill="#e74c3c" fill-opacity="0.7"/>
    <rect x="50" y="25" width="30" height="125" fill="#e74c3c" fill-opacity="0.7"/>
    <rect x="90" y="25" width="30" height="125" fill="#e74c3c" fill-opacity="0.7"/>
    <rect x="130" y="25" width="30" height="125" fill="#e74c3c" fill-opacity="0.7"/>
    <rect x="170" y="25" width="30" height="125" fill="#e74c3c" fill-opacity="0.7"/>
    <rect x="210" y="25" width="30" height="125" fill="#e74c3c" fill-opacity="0.7"/>
    
    <!-- Labels -->
    <text x="25" y="165" text-anchor="middle" font-size="10" fill="#2c3e50">1</text>
    <text x="65" y="165" text-anchor="middle" font-size="10" fill="#2c3e50">2</text>
    <text x="105" y="165" text-anchor="middle" font-size="10" fill="#2c3e50">3</text>
    <text x="145" y="165" text-anchor="middle" font-size="10" fill="#2c3e50">4</text>
    <text x="185" y="165" text-anchor="middle" font-size="10" fill="#2c3e50">5</text>
    <text x="225" y="165" text-anchor="middle" font-size="10" fill="#2c3e50">6</text>
    
    <!-- Probability values -->
    <text x="25" y="15" text-anchor="middle" font-size="9" fill="#2c3e50">1/6</text>
    <text x="65" y="15" text-anchor="middle" font-size="9" fill="#2c3e50">1/6</text>
    <text x="105" y="15" text-anchor="middle" font-size="9" fill="#2c3e50">1/6</text>
    <text x="145" y="15" text-anchor="middle" font-size="9" fill="#2c3e50">1/6</text>
    <text x="185" y="15" text-anchor="middle" font-size="9" fill="#2c3e50">1/6</text>
    <text x="225" y="15" text-anchor="middle" font-size="9" fill="#2c3e50">1/6</text>
    
    <!-- Axis labels -->
    <text x="120" y="185" text-anchor="middle" font-size="12" fill="#2c3e50">Outcome</text>
    <text x="-15" y="75" text-anchor="middle" font-size="12" fill="#2c3e50" transform="rotate(-90, -15, 75)">P(X=x)</text>
  </g>
  
  <!-- Continuous Random Variables (Right Side) -->
  <text x="600" y="150" text-anchor="middle" font-size="20" font-weight="bold" fill="#27ae60">
    Continuous Random Variables
  </text>
  
  <!-- Continuous characteristics -->
  <rect x="450" y="170" width="300" height="120" fill="#27ae60" fill-opacity="0.1" stroke="#27ae60" stroke-width="1" rx="5"/>
  <text x="600" y="190" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">Characteristics:</text>
  <text x="470" y="210" font-size="12" fill="#2c3e50">• Uncountable values (any value in interval)</text>
  <text x="470" y="225" font-size="12" fill="#2c3e50">• Cannot be listed individually</text>
  <text x="470" y="240" font-size="12" fill="#2c3e50">• Probability Density Function (PDF): f(x)</text>
  <text x="470" y="255" font-size="12" fill="#2c3e50">• Examples: height, weight, time, temperature</text>
  <text x="470" y="275" font-size="12" font-weight="bold" fill="#27ae60">Properties: ∫ f(x)dx = 1</text>
  
  <!-- Continuous Example: Normal Distribution -->
  <rect x="450" y="310" width="300" height="220" fill="#ffffff" stroke="#27ae60" stroke-width="2" rx="5"/>
  <text x="600" y="330" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">
    Example: Normal Distribution
  </text>
  
  <!-- Normal curve -->
  <g transform="translate(480, 350)">
    <!-- Axes -->
    <line x1="0" y1="150" x2="240" y2="150" stroke="#2c3e50" stroke-width="1"/>
    <line x1="0" y1="0" x2="0" y2="150" stroke="#2c3e50" stroke-width="1"/>
    
    <!-- Normal curve path -->
    <path d="M 20 140 Q 60 100 120 80 Q 180 100 220 140" 
          fill="none" stroke="#27ae60" stroke-width="3"/>
    <path d="M 20 140 Q 60 100 120 80 Q 180 100 220 140 L 220 150 L 20 150 Z" 
          fill="#27ae60" fill-opacity="0.3"/>
    
    <!-- Area shading example -->
    <path d="M 80 110 Q 100 85 120 80 Q 140 85 160 110 L 160 150 L 80 150 Z" 
          fill="#f39c12" fill-opacity="0.5"/>
    
    <!-- Labels -->
    <text x="120" y="165" text-anchor="middle" font-size="12" fill="#2c3e50">μ</text>
    <text x="80" y="170" text-anchor="middle" font-size="10" fill="#f39c12">a</text>
    <text x="160" y="170" text-anchor="middle" font-size="10" fill="#f39c12">b</text>
    
    <!-- Axis labels -->
    <text x="120" y="185" text-anchor="middle" font-size="12" fill="#2c3e50">x</text>
    <text x="-15" y="75" text-anchor="middle" font-size="12" fill="#2c3e50" transform="rotate(-90, -15, 75)">f(x)</text>
    
    <!-- Area label -->
    <text x="120" y="125" text-anchor="middle" font-size="10" fill="#f39c12">P(a ≤ X ≤ b)</text>
  </g>
  
  <!-- Key Difference Box -->
  <rect x="150" y="550" width="500" height="40" fill="#f1c40f" fill-opacity="0.2" stroke="#f1c40f" stroke-width="1" rx="5"/>
  <text x="400" y="570" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">
    Key Difference: Discrete uses P(X = x), Continuous uses P(a ≤ X ≤ b)
  </text>
  <text x="400" y="585" text-anchor="middle" font-size="12" fill="#2c3e50">
    For continuous: P(X = any specific value) = 0
  </text>
</svg>