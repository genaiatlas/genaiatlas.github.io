<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="900" fill="#f8f9fa"/>
  <text x="600" y="40" font-family="Arial" font-size="28" font-weight="bold" text-anchor="middle">Step-Back Prompting</text>
  
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" fill="#495057"/></marker></defs>
  
  <rect x="200" y="80" width="800" height="80" rx="10" fill="#ffc9c9" stroke="#f03e3e" stroke-width="3"/>
  <text x="600" y="110" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Specific Original Query</text>
  <text x="600" y="135" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">"How does oxidative phosphorylation produce ATP in mitochondria?"</text>
  
  <line x1="600" y1="160" x2="600" y2="195" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  
  <rect x="250" y="205" width="700" height="70" rx="10" fill="#9333ea" stroke="#7950f2" stroke-width="3"/>
  <text x="600" y="235" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Step-Back Generator</text>
  <text x="600" y="255" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Generate higher-level, foundational question</text>
  
  <line x1="600" y1="275" x2="600" y2="310" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  
  <rect x="200" y="320" width="800" height="80" rx="10" fill="#d0bfff" stroke="#7950f2" stroke-width="3"/>
  <text x="600" y="350" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Step-Back Question (More General)</text>
  <text x="600" y="375" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">"What is cellular respiration and what are its major pathways?"</text>
  
  <g id="dual-retrieval">
    <line x1="400" y1="400" x2="300" y2="450" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="800" y1="400" x2="900" y2="450" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
    
    <rect x="50" y="460" width="450" height="180" rx="10" fill="#d3f9d8" stroke="#37b24d" stroke-width="3"/>
    <text x="275" y="490" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Foundational Context</text>
    <text x="275" y="510" font-family="Arial" font-size="11" text-anchor="middle">(From Step-Back Question)</text>
    <rect x="70" y="525" width="410" height="100" rx="5" fill="#fff" stroke="#37b24d" stroke-width="2"/>
    <text x="85" y="545" font-family="Arial" font-size="10">Retrieved Documents:</text>
    <text x="85" y="565" font-family="Arial" font-size="9">• Overview of cellular respiration</text>
    <text x="85" y="582" font-family="Arial" font-size="9">• Explanation of mitochondrial function</text>
    <text x="85" y="599" font-family="Arial" font-size="9">• Basic biochemistry of energy production</text>
    <text x="85" y="616" font-family="Arial" font-size="9">• Introduction to metabolic pathways</text>
    
    <rect x="700" y="460" width="450" height="180" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="3"/>
    <text x="925" y="490" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Specific Information</text>
    <text x="925" y="510" font-family="Arial" font-size="11" text-anchor="middle">(From Original Question)</text>
    <rect x="720" y="525" width="410" height="100" rx="5" fill="#fff" stroke="#1971c2" stroke-width="2"/>
    <text x="735" y="545" font-family="Arial" font-size="10">Retrieved Documents:</text>
    <text x="735" y="565" font-family="Arial" font-size="9">• Detailed oxidative phosphorylation mechanism</text>
    <text x="735" y="582" font-family="Arial" font-size="9">• ATP synthase function and structure</text>
    <text x="735" y="599" font-family="Arial" font-size="9">• Electron transport chain specifics</text>
    <text x="735" y="616" font-family="Arial" font-size="9">• Chemiosmotic theory explanation</text>
  </g>
  
  <line x1="275" y1="640" x2="450" y2="690" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="925" y1="640" x2="750" y2="690" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  
  <rect x="250" y="700" width="700" height="170" rx="10" fill="#51cf66" stroke="#2f9e44" stroke-width="3"/>
  <text x="600" y="730" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Combined Context for Generation</text>
  <text x="600" y="755" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Foundational Knowledge + Specific Details</text>
  <rect x="270" y="770" width="660" height="85" rx="5" fill="#fff" stroke="#2f9e44" stroke-width="2"/>
  <text x="290" y="790" font-family="Arial" font-size="10" fill="#495057" font-weight="bold">Benefits:</text>
  <text x="290" y="810" font-family="Arial" font-size="9" fill="#495057">✓ LLM has necessary background to understand specific concepts</text>
  <text x="290" y="827" font-family="Arial" font-size="9" fill="#495057">✓ Can explain from first principles, not just technical details</text>
  <text x="290" y="844" font-family="Arial" font-size="9" fill="#495057">✓ Reduces hallucination by providing foundational context</text>
</svg>