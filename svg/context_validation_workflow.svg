<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0fdf4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dcfce7;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow3">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#22c55e"/>
    </marker>
  </defs>
  
  <rect width="1400" height="1000" fill="url(#bgGrad3)"/>
  
  <!-- Title -->
  <text x="700" y="50" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#0f172a" text-anchor="middle">Context Validation Workflow</text>
  <text x="700" y="85" font-family="Arial, sans-serif" font-size="16" fill="#64748b" text-anchor="middle">Best Practices for Crafting and Validating Context</text>
  
  <!-- Left Side: Crafting Context -->
  <g transform="translate(50, 130)">
    <rect width="600" height="820" rx="15" fill="#dbeafe" stroke="#3b82f6" stroke-width="3"/>
    
    <text x="300" y="45" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1e40af" text-anchor="middle">✍️ Crafting Context</text>
    
    <!-- Be Specific Section -->
    <g transform="translate(30, 80)">
      <rect width="540" height="180" rx="10" fill="white" stroke="#3b82f6" stroke-width="2"/>
      
      <text x="20" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1e40af">Be Specific and Explicit</text>
      
      <text x="20" y="60" font-family="Arial, sans-serif" font-size="14" fill="#334155">Use More Words - Don't assume brevity is better</text>
      
      <circle cx="25" cy="85" r="4" fill="#22c55e"/>
      <text x="35" y="90" font-family="Arial, sans-serif" font-size="13" fill="#475569">Clear intent and constraints</text>
      
      <circle cx="25" cy="110" r="4" fill="#22c55e"/>
      <text x="35" y="115" font-family="Arial, sans-serif" font-size="13" fill="#475569">File paths and exact locations</text>
      
      <circle cx="25" cy="135" r="4" fill="#22c55e"/>
      <text x="35" y="140" font-family="Arial, sans-serif" font-size="13" fill="#475569">Examples (both good and bad)</text>
      
      <circle cx="25" cy="160" r="4" fill="#22c55e"/>
      <text x="35" y="165" font-family="Arial, sans-serif" font-size="13" fill="#475569">Operational instructions</text>
    </g>
    
    <!-- Teammate Test -->
    <g transform="translate(30, 280)">
      <rect width="540" height="100" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
      
      <text x="20" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#78350f">🤝 The Teammate Test</text>
      
      <text x="20" y="55" font-family="Arial, sans-serif" font-size="13" fill="#92400e">If a teammate could follow your instructions</text>
      <text x="20" y="75" font-family="Arial, sans-serif" font-size="13" fill="#92400e">without ambiguity, the AI model can too.</text>
    </g>
    
    <!-- Key Elements -->
    <g transform="translate(30, 400)">
      <rect width="540" height="220" rx="10" fill="white" stroke="#3b82f6" stroke-width="2"/>
      
      <text x="20" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1e40af">Include Critical Details</text>
      
      <g transform="translate(20, 50)">
        <rect width="240" height="70" rx="6" fill="#eff6ff"/>
        <text x="10" y="20" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e40af">What to Include:</text>
        <text x="10" y="40" font-family="Arial, sans-serif" font-size="11" fill="#475569">• Goals and constraints</text>
        <text x="10" y="55" font-family="Arial, sans-serif" font-size="11" fill="#475569">• File paths and structure</text>
      </g>
      
      <g transform="translate(280, 50)">
        <rect width="240" height="70" rx="6" fill="#eff6ff"/>
        <text x="10" y="20" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e40af">Provide Examples:</text>
        <text x="10" y="40" font-family="Arial, sans-serif" font-size="11" fill="#475569">• Preferred patterns</text>
        <text x="10" y="55" font-family="Arial, sans-serif" font-size="11" fill="#475569">• What NOT to do</text>
      </g>
      
      <g transform="translate(20, 135)">
        <rect width="500" height="70" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
        <text x="10" y="20" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#78350f">💡 Pro Tip:</text>
        <text x="10" y="40" font-family="Arial, sans-serif" font-size="12" fill="#92400e">Specificity is not verbosity - it's clarity.</text>
        <text x="10" y="58" font-family="Arial, sans-serif" font-size="12" fill="#92400e">Precisely define both the target and the boundaries.</text>
      </g>
    </g>
    
    <!-- Iterative Improvement -->
    <g transform="translate(30, 640)">
      <rect width="540" height="120" rx="10" fill="white" stroke="#3b82f6" stroke-width="2"/>
      
      <text x="20" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e40af">🔄 Iterative Improvement</text>
      
      <text x="20" y="55" font-family="Arial, sans-serif" font-size="13" fill="#475569">1. Start simple with basic context</text>
      <text x="20" y="75" font-family="Arial, sans-serif" font-size="13" fill="#475569">2. Monitor where AI makes mistakes</text>
      <text x="20" y="95" font-family="Arial, sans-serif" font-size="13" fill="#475569">3. Refine context based on observed issues</text>
    </g>
  </g>
  
  <!-- Arrow between sections -->
  <line x1="660" y1="550" x2="740" y2="550" stroke="#22c55e" stroke-width="4" marker-end="url(#arrow3)"/>
  <text x="700" y="540" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#22c55e" text-anchor="middle">Validate</text>
  
  <!-- Right Side: Validation -->
  <g transform="translate(750, 130)">
    <rect width="600" height="820" rx="15" fill="#dcfce7" stroke="#22c55e" stroke-width="3"/>
    
    <text x="300" y="45" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#15803d" text-anchor="middle">✅ Validating Context</text>
    
    <!-- Smoke Testing -->
    <g transform="translate(30, 80)">
      <rect width="540" height="340" rx="10" fill="white" stroke="#22c55e" stroke-width="2"/>
      
      <text x="20" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#15803d">Manual Smoke Testing</text>
      
      <text x="20" y="60" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#166534">Approach:</text>
      <circle cx="25" cy="80" r="4" fill="#22c55e"/>
      <text x="35" y="85" font-family="Arial, sans-serif" font-size="13" fill="#475569">Start the agent and use chat</text>
      <circle cx="25" cy="105" r="4" fill="#22c55e"/>
      <text x="35" y="110" font-family="Arial, sans-serif" font-size="13" fill="#475569">Ask questions only answerable with context</text>
      <circle cx="25" cy="130" r="4" fill="#22c55e"/>
      <text x="35" y="135" font-family="Arial, sans-serif" font-size="13" fill="#475569">Test if it loaded your docs</text>
      
      <text x="20" y="165" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#166534">What to Test:</text>
      <circle cx="25" cy="185" r="4" fill="#22c55e"/>
      <text x="35" y="190" font-family="Arial, sans-serif" font-size="13" fill="#475569">Details from your documentation</text>
      <circle cx="25" cy="210" r="4" fill="#22c55e"/>
      <text x="35" y="215" font-family="Arial, sans-serif" font-size="13" fill="#475569">Operational instructions</text>
      <circle cx="25" cy="235" r="4" fill="#22c55e"/>
      <text x="35" y="240" font-family="Arial, sans-serif" font-size="13" fill="#475569">Convention adherence</text>
      
      <rect x="10" y="260" width="520" height="60" rx="6" fill="#d1fae5"/>
      <text x="270" y="280" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#166534" text-anchor="middle">When to Use:</text>
      <text x="270" y="300" font-family="Arial, sans-serif" font-size="12" fill="#22543d" text-anchor="middle">Quick validation, after changes, debugging</text>
    </g>
    
    <!-- Scripted Checks -->
    <g transform="translate(30, 440)">
      <rect width="540" height="320" rx="10" fill="white" stroke="#22c55e" stroke-width="2"/>
      
      <text x="20" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#15803d">Automated Scripted Checks</text>
      
      <text x="20" y="60" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#166534">How to Test:</text>
      <g transform="translate(25, 75)">
        <circle cx="0" cy="0" r="12" fill="#22c55e"/>
        <text x="0" y="5" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">1</text>
        <text x="20" y="5" font-family="Arial, sans-serif" font-size="13" fill="#475569">Ask AI to do something specific</text>
      </g>
      
      <g transform="translate(25, 110)">
        <circle cx="0" cy="0" r="12" fill="#22c55e"/>
        <text x="0" y="5" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">2</text>
        <text x="20" y="5" font-family="Arial, sans-serif" font-size="13" fill="#475569">Inspect the result programmatically</text>
      </g>
      
      <g transform="translate(25, 145)">
        <circle cx="0" cy="0" r="12" fill="#22c55e"/>
        <text x="0" y="5" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">3</text>
        <text x="20" y="5" font-family="Arial, sans-serif" font-size="13" fill="#475569">Look for evidence of context usage</text>
      </g>
      
      <text x="20" y="185" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#166534">What to Check:</text>
      <circle cx="25" cy="205" r="4" fill="#22c55e"/>
      <text x="35" y="210" font-family="Arial, sans-serif" font-size="13" fill="#475569">Correct coding convention applied</text>
      <circle cx="25" cy="230" r="4" fill="#22c55e"/>
      <text x="35" y="235" font-family="Arial, sans-serif" font-size="13" fill="#475569">Instructed process followed</text>
      <circle cx="25" cy="255" r="4" fill="#22c55e"/>
      <text x="35" y="260" font-family="Arial, sans-serif" font-size="13" fill="#475569">Constraints respected</text>
      
      <rect x="10" y="280" width="520" height="20" rx="4" fill="#d1fae5"/>
      <text x="270" y="295" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#166534" text-anchor="middle">Fits naturally with CI/CD pipelines</text>
    </g>
  </g>
  
  <!-- Bottom banner -->
  <g transform="translate(150, 980)">
    <text x="550" y="-20" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#15803d" text-anchor="middle">Don't assume context works - validate it produces the results you need</text>
  </g>
</svg>