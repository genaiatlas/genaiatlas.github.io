<svg viewBox="0 0 1200 950" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="950" fill="#f8f9fa"/>
  <text x="600" y="40" font-family="Arial" font-size="28" font-weight="bold" text-anchor="middle">Logical Routing: Rule-Based Decision Tree</text>
  
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" fill="#495057"/></marker></defs>
  
  <rect x="400" y="80" width="400" height="60" rx="10" fill="#fff3bf" stroke="#f59f00" stroke-width="3"/>
  <text x="600" y="118" font-family="Arial" font-size="12" text-anchor="middle">What is our employee vacation policy?</text>
  
  <line x1="600" y1="140" x2="600" y2="175" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  
  <rect x="350" y="185" width="500" height="80" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="3"/>
  <text x="600" y="215" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Rule 1: Check Financial Keywords</text>
  <text x="600" y="240" font-family="Arial" font-size="11" text-anchor="middle">Contains: revenue, profit, budget, financial?</text>
  
  <line x1="450" y1="265" x2="300" y2="315" stroke="#f03e3e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="360" y="295" font-family="Arial" font-size="10" fill="#f03e3e" font-weight="bold">NO</text>
  
  <line x1="750" y1="265" x2="900" y2="315" stroke="#37b24d" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="840" y="295" font-family="Arial" font-size="10" fill="#37b24d" font-weight="bold">YES</text>
  
  <rect x="775" y="325" width="250" height="80" rx="8" fill="#51cf66" stroke="#2f9e44" stroke-width="2"/>
  <text x="900" y="360" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Route to:</text>
  <text x="900" y="385" font-family="Arial" font-size="13" text-anchor="middle" fill="#2f9e44" font-weight="bold">Financial Database</text>
  
  <rect x="175" y="325" width="500" height="80" rx="10" fill="#d0ebff" stroke="#1971c2" stroke-width="3"/>
  <text x="425" y="355" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Rule 2: Check HR Keywords</text>
  <text x="425" y="380" font-family="Arial" font-size="11" text-anchor="middle">Contains: employee, vacation, salary, benefits, HR?</text>
  
  <line x1="325" y1="405" x2="200" y2="455" stroke="#f03e3e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="250" y="435" font-family="Arial" font-size="10" fill="#f03e3e" font-weight="bold">NO</text>
  
  <line x1="525" y1="405" x2="650" y2="455" stroke="#37b24d" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="600" y="435" font-family="Arial" font-size="10" fill="#37b24d" font-weight="bold">YES</text>
  
  <rect x="525" y="465" width="250" height="80" rx="8" fill="#51cf66" stroke="#2f9e44" stroke-width="2"/>
  <text x="650" y="500" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Route to:</text>
  <text x="650" y="525" font-family="Arial" font-size="13" text-anchor="middle" fill="#2f9e44" font-weight="bold">HR Database</text>
  
  <rect x="50" y="465" width="350" height="80" rx="10" fill="#d0ebff" stroke="#1971c2" stroke-width="3"/>
  <text x="225" y="495" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Rule 3: Check Technical Keywords</text>
  <text x="225" y="520" font-family="Arial" font-size="11" text-anchor="middle">Contains: bug, error, code, system?</text>
  
  <line x1="150" y1="545" x2="100" y2="595" stroke="#f03e3e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="115" y="575" font-family="Arial" font-size="10" fill="#f03e3e" font-weight="bold">NO</text>
  
  <line x1="300" y1="545" x2="350" y2="595" stroke="#37b24d" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="335" y="575" font-family="Arial" font-size="10" fill="#37b24d" font-weight="bold">YES</text>
  
  <rect x="225" y="605" width="250" height="80" rx="8" fill="#51cf66" stroke="#2f9e44" stroke-width="2"/>
  <text x="350" y="640" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Route to:</text>
  <text x="350" y="665" font-family="Arial" font-size="13" text-anchor="middle" fill="#2f9e44" font-weight="bold">Technical Docs</text>
  
  <rect x="25" y="735" width="200" height="80" rx="8" fill="#ffc9c9" stroke="#f03e3e" stroke-width="2"/>
  <text x="125" y="770" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Default:</text>
  <text x="125" y="795" font-family="Arial" font-size="13" text-anchor="middle" fill="#f03e3e">General Knowledge</text>
  
  <line x1="100" y1="595" x2="100" y2="725" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
  
  <rect x="800" y="600" width="350" height="320" rx="10" fill="#fff9db" stroke="#fab005" stroke-width="3"/>
  <text x="975" y="630" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Rule Structure</text>
  <rect x="820" y="645" width="310" height="260" rx="5" fill="#fff" stroke="#fab005" stroke-width="2"/>
  <text x="835" y="670" font-family="Courier" font-size="10" fill="#495057">rules = {</text>
  <text x="850" y="690" font-family="Courier" font-size="9" fill="#37b24d">"financial": [</text>
  <text x="865" y="707" font-family="Courier" font-size="9" fill="#495057">"revenue", "profit",</text>
  <text x="865" y="722" font-family="Courier" font-size="9" fill="#495057">"budget", "financial"</text>
  <text x="850" y="739" font-family="Courier" font-size="9" fill="#37b24d">],</text>
  <text x="850" y="759" font-family="Courier" font-size="9" fill="#1971c2">"hr": [</text>
  <text x="865" y="776" font-family="Courier" font-size="9" fill="#495057">"employee", "vacation",</text>
  <text x="865" y="791" font-family="Courier" font-size="9" fill="#495057">"salary", "benefits"</text>
  <text x="850" y="808" font-family="Courier" font-size="9" fill="#1971c2">],</text>
  <text x="850" y="828" font-family="Courier" font-size="9" fill="#9333ea">"technical": [</text>
  <text x="865" y="845" font-family="Courier" font-size="9" fill="#495057">"bug", "error", "code"</text>
  <text x="850" y="862" font-family="Courier" font-size="9" fill="#9333ea">]</text>
  <text x="835" y="879" font-family="Courier" font-size="10" fill="#495057">}</text>
  
  <rect x="250" y="750" width="500" height="170" rx="10" fill="#d0bfff" stroke="#7950f2" stroke-width="3"/>
  <text x="500" y="780" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Benefits and Characteristics</text>
  <text x="270" y="810" font-family="Arial" font-size="11" fill="#495057">+ Fast: O(1) keyword lookup</text>
  <text x="270" y="832" font-family="Arial" font-size="11" fill="#495057">+ Predictable: Same query gives same route</text>
  <text x="270" y="854" font-family="Arial" font-size="11" fill="#495057">+ Explainable: Clear rule trace</text>
  <text x="270" y="876" font-family="Arial" font-size="11" fill="#495057">+ Easy to debug: Can test each rule</text>
  <text x="270" y="898" font-family="Arial" font-size="11" fill="#495057">- Brittle: Fails on unexpected queries</text>
</svg>