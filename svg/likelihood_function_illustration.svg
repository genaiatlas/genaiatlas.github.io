<svg viewBox="0 0 800 550" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="likelihoodFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#ff6b35;stop-opacity:0.2"/>
    </linearGradient>
    <linearGradient id="dataFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4ecdc4;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#4ecdc4;stop-opacity:0.3"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="550" fill="#fafafa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1a1a1a">
    Likelihood Function Illustration
  </text>
  
  <!-- Left Panel: Data Perspective -->
  <rect x="50" y="60" width="320" height="200" rx="8" fill="url(#dataFill)" stroke="#4ecdc4" stroke-width="2"/>
  <text x="210" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a1a1a">
    Data Perspective: P(D|θ)
  </text>
  <text x="210" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">
    "How likely is this data given parameter θ?"
  </text>
  
  <!-- Data points visualization -->
  <circle cx="120" cy="140" r="4" fill="#00b894"/>
  <circle cx="150" cy="160" r="4" fill="#00b894"/>
  <circle cx="180" cy="145" r="4" fill="#00b894"/>
  <circle cx="210" cy="170" r="4" fill="#00b894"/>
  <circle cx="240" cy="155" r="4" fill="#00b894"/>
  <circle cx="270" cy="165" r="4" fill="#00b894"/>
  <circle cx="300" cy="150" r="4" fill="#00b894"/>
  
  <!-- Model curve through data -->
  <path d="M 100 180 Q 150 140 200 150 Q 250 160 320 145" 
        fill="none" stroke="#0984e3" stroke-width="2" stroke-dasharray="5,5"/>
  
  <text x="210" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">
    Fixed Data: D = {x₁, x₂, ..., xₙ}
  </text>
  <text x="210" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">
    Variable Parameter: θ
  </text>
  <text x="210" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#00b894">
    Probability Distribution
  </text>
  
  <!-- Right Panel: Parameter Perspective -->
  <rect x="430" y="60" width="320" height="200" rx="8" fill="url(#likelihoodFill)" stroke="#ff6b35" stroke-width="2"/>
  <text x="590" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a1a1a">
    Parameter Perspective: L(θ|D)
  </text>
  <text x="590" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">
    "How well does parameter θ explain the data?"
  </text>
  
  <!-- Likelihood curve -->
  <path d="M 450 220 Q 500 120 550 110 Q 600 105 650 130 Q 700 160 730 200" 
        fill="url(#likelihoodFill)" stroke="#ff6b35" stroke-width="3"/>
  
  <!-- MLE point -->
  <circle cx="590" cy="108" r="6" fill="#d63031"/>
  <text x="590" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#d63031">
    θ_MLE
  </text>
  
  <text x="590" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">
    Fixed Data: D = {x₁, x₂, ..., xₙ}
  </text>
  <text x="590" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">
    Variable Parameter: θ
  </text>
  <text x="590" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ff6b35">
    Function of Parameters
  </text>
  
  <!-- Key Properties Box -->
  <rect x="100" y="290" width="600" height="160" rx="8" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="400" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1a1a1a">
    Likelihood Function Properties
  </text>
  
  <!-- Properties in two columns -->
  <text x="150" y="345" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Mathematical Properties:</text>
  <text x="150" y="365" font-family="Arial, sans-serif" font-size="12" fill="#333">• L(θ|D) = P(D|θ) for fixed data D</text>
  <text x="150" y="380" font-family="Arial, sans-serif" font-size="12" fill="#333">• Not a probability over θ (doesn't integrate to 1)</text>
  <text x="150" y="395" font-family="Arial, sans-serif" font-size="12" fill="#333">• Contains all information about θ in the data</text>
  <text x="150" y="410" font-family="Arial, sans-serif" font-size="12" fill="#333">• Maximum at θ_MLE</text>
  
  <text x="450" y="345" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Practical Applications:</text>
  <text x="450" y="365" font-family="Arial, sans-serif" font-size="12" fill="#333">• Parameter estimation (MLE)</text>
  <text x="450" y="380" font-family="Arial, sans-serif" font-size="12" fill="#333">• Model comparison (likelihood ratios)</text>
  <text x="450" y="395" font-family="Arial, sans-serif" font-size="12" fill="#333">• Uncertainty quantification</text>
  <text x="450" y="410" font-family="Arial, sans-serif" font-size="12" fill="#333">• Bayesian inference (posterior calculation)</text>
  
  <!-- Example Formula -->
  <rect x="150" y="470" width="500" height="60" rx="5" fill="#e3f2fd" stroke="#1976d2" stroke-width="1"/>
  <text x="400" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1a1a1a">
    Example: Normal Distribution
  </text>
  <text x="400" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">
    L(μ,σ|x₁,...,xₙ) = ∏ᵢ (1/√(2πσ²)) exp(-(xᵢ-μ)²/(2σ²))
  </text>
</svg>