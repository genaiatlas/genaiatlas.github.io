<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FB923C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EA580C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ADE80;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22C55E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A78BFA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
    <filter id="softShadow">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#F9FAFB"/>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#1F2937">
    Iterative Collaborative Filtering Network
  </text>
  
  <!-- Sparse Data Challenge Box -->
  <g transform="translate(50, 55)">
    <rect x="0" y="0" width="700" height="45" rx="6" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5"/>
    <text x="350" y="20" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle" fill="#991B1B">
      Sparse Data Challenge
    </text>
    <text x="350" y="35" font-family="Arial" font-size="11" text-anchor="middle" fill="#7F1D1D">
      When direct neighbors have insufficient data, we expand the search through network iterations
    </text>
  </g>
  
  <!-- Main Visualization Area -->
  <g transform="translate(400, 300)">
    <!-- Concentric circles for hop levels -->
    <circle cx="0" cy="0" r="180" fill="none" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="2,4" opacity="0.5"/>
    <circle cx="0" cy="0" r="120" fill="none" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="2,4" opacity="0.5"/>
    <circle cx="0" cy="0" r="60" fill="none" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="2,4" opacity="0.5"/>
    
    <!-- Center: Target User -->
    <g>
      <circle cx="0" cy="0" r="30" fill="url(#orangeGrad)" filter="url(#softShadow)"/>
      <text x="0" y="0" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="white" dy="-5">Target</text>
      <text x="0" y="0" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="white" dy="8">User</text>
    </g>
    
    <!-- Hop 1: Direct Neighbors (60px radius) -->
    <g>
      <!-- U1 at top -->
      <circle cx="0" cy="-60" r="20" fill="url(#blueGrad)" opacity="0.9"/>
      <text x="0" y="-56" font-family="Arial" font-size="10" text-anchor="middle" fill="white">U1</text>
      <line x1="0" y1="-30" x2="0" y2="-40" stroke="#3B82F6" stroke-width="2" opacity="0.6"/>
      
      <!-- U2 at bottom right -->
      <circle cx="52" cy="30" r="20" fill="url(#blueGrad)" opacity="0.9"/>
      <text x="52" y="34" font-family="Arial" font-size="10" text-anchor="middle" fill="white">U2</text>
      <line x1="26" y1="15" x2="32" y2="20" stroke="#3B82F6" stroke-width="2" opacity="0.6"/>
      
      <!-- U3 at bottom left -->
      <circle cx="-52" cy="30" r="20" fill="url(#blueGrad)" opacity="0.9"/>
      <text x="-52" y="34" font-family="Arial" font-size="10" text-anchor="middle" fill="white">U3</text>
      <line x1="-26" y1="15" x2="-32" y2="20" stroke="#3B82F6" stroke-width="2" opacity="0.6"/>
    </g>
    
    <!-- Hop 2: Extended Network (120px radius) -->
    <g>
      <!-- From U1 -->
      <circle cx="-42" cy="-113" r="16" fill="url(#greenGrad)" opacity="0.8"/>
      <text x="-42" y="-109" font-family="Arial" font-size="9" text-anchor="middle" fill="white">U4</text>
      <line x1="-14" y1="-76" x2="-28" y2="-98" stroke="#22C55E" stroke-width="1.5" opacity="0.4" stroke-dasharray="2,2"/>
      
      <circle cx="42" cy="-113" r="16" fill="url(#greenGrad)" opacity="0.8"/>
      <text x="42" y="-109" font-family="Arial" font-size="9" text-anchor="middle" fill="white">U5</text>
      <line x1="14" y1="-76" x2="28" y2="-98" stroke="#22C55E" stroke-width="1.5" opacity="0.4" stroke-dasharray="2,2"/>
      
      <!-- From U2 -->
      <circle cx="104" cy="60" r="16" fill="url(#greenGrad)" opacity="0.8"/>
      <text x="104" y="64" font-family="Arial" font-size="9" text-anchor="middle" fill="white">U6</text>
      <line x1="68" y1="40" x2="88" y2="50" stroke="#22C55E" stroke-width="1.5" opacity="0.4" stroke-dasharray="2,2"/>
      
      <circle cx="85" cy="-85" r="16" fill="url(#greenGrad)" opacity="0.8"/>
      <text x="85" y="-81" font-family="Arial" font-size="9" text-anchor="middle" fill="white">U7</text>
      <line x1="56" y1="12" x2="72" y2="-70" stroke="#22C55E" stroke-width="1.5" opacity="0.4" stroke-dasharray="2,2"/>
      
      <!-- From U3 -->
      <circle cx="-104" cy="60" r="16" fill="url(#greenGrad)" opacity="0.8"/>
      <text x="-104" y="64" font-family="Arial" font-size="9" text-anchor="middle" fill="white">U8</text>
      <line x1="-68" y1="40" x2="-88" y2="50" stroke="#22C55E" stroke-width="1.5" opacity="0.4" stroke-dasharray="2,2"/>
      
      <circle cx="-85" cy="-85" r="16" fill="url(#greenGrad)" opacity="0.8"/>
      <text x="-85" y="-81" font-family="Arial" font-size="9" text-anchor="middle" fill="white">U9</text>
      <line x1="-56" y1="12" x2="-72" y2="-70" stroke="#22C55E" stroke-width="1.5" opacity="0.4" stroke-dasharray="2,2"/>
    </g>
    
    <!-- Hop 3: Further Expansion (180px radius) -->
    <g>
      <circle cx="0" cy="-180" r="14" fill="url(#purpleGrad)" opacity="0.6"/>
      <text x="0" y="-176" font-family="Arial" font-size="8" text-anchor="middle" fill="white">U10</text>
      <line x1="0" y1="-129" x2="0" y2="-166" stroke="#8B5CF6" stroke-width="1" opacity="0.3" stroke-dasharray="1,3"/>
      
      <circle cx="127" cy="-127" r="14" fill="url(#purpleGrad)" opacity="0.6"/>
      <text x="127" y="-123" font-family="Arial" font-size="8" text-anchor="middle" fill="white">U11</text>
      <line x1="92" y1="-98" x2="115" y2="-115" stroke="#8B5CF6" stroke-width="1" opacity="0.3" stroke-dasharray="1,3"/>
      
      <circle cx="-127" cy="-127" r="14" fill="url(#purpleGrad)" opacity="0.6"/>
      <text x="-127" y="-123" font-family="Arial" font-size="8" text-anchor="middle" fill="white">U12</text>
      <line x1="-92" y1="-98" x2="-115" y2="-115" stroke="#8B5CF6" stroke-width="1" opacity="0.3" stroke-dasharray="1,3"/>
    </g>
  </g>
  
  <!-- Legend Box -->
  <g transform="translate(50, 120)">
    <rect x="0" y="0" width="200" height="110" rx="6" fill="white" stroke="#D1D5DB" stroke-width="1" filter="url(#softShadow)"/>
    <text x="100" y="20" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle" fill="#374151">
      Iteration Process
    </text>
    
    <g transform="translate(15, 35)">
      <circle cx="10" cy="10" r="6" fill="#EA580C"/>
      <text x="25" y="14" font-family="Arial" font-size="11" fill="#4B5563">Hop 0: Target user</text>
      
      <circle cx="10" cy="27" r="6" fill="#3B82F6"/>
      <text x="25" y="31" font-family="Arial" font-size="11" fill="#4B5563">Hop 1: Direct neighbors</text>
      
      <circle cx="10" cy="44" r="6" fill="#22C55E"/>
      <text x="25" y="48" font-family="Arial" font-size="11" fill="#4B5563">Hop 2: Extended network</text>
      
      <circle cx="10" cy="61" r="6" fill="#8B5CF6"/>
      <text x="25" y="65" font-family="Arial" font-size="11" fill="#4B5563">Hop 3: Further expansion</text>
    </g>
  </g>
  
  <!-- Item j indicator -->
  <g transform="translate(400, 460)">
    <rect x="-25" y="0" width="50" height="28" rx="4" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5"/>
    <text x="0" y="18" font-family="Arial" font-size="11" text-anchor="middle" fill="#DC2626">Item j</text>
    
    <!-- Sample connections to network -->
    <line x1="-10" y1="0" x2="-80" y2="-100" stroke="#8B5CF6" stroke-width="0.8" opacity="0.2" stroke-dasharray="3,3"/>
    <line x1="10" y1="0" x2="80" y2="-100" stroke="#22C55E" stroke-width="0.8" opacity="0.2" stroke-dasharray="3,3"/>
  </g>
  
  <!-- Benefits Box -->
  <g transform="translate(50, 490)">
    <rect x="0" y="0" width="330" height="95" rx="6" fill="#F0FDF4" stroke="#22C55E" stroke-width="1.5"/>
    <text x="165" y="20" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle" fill="#14532D">
      Benefits of Iterative Approach
    </text>
    
    <text x="15" y="40" font-family="Arial" font-size="10" fill="#1F2937">• Handles extreme sparsity effectively</text>
    <text x="15" y="56" font-family="Arial" font-size="10" fill="#1F2937">• Discovers indirect but meaningful relationships</text>
    <text x="15" y="72" font-family="Arial" font-size="10" fill="#1F2937">• Improves coverage for new/rare items</text>
    <text x="15" y="88" font-family="Arial" font-size="10" fill="#1F2937">• Weighted by path distance for accuracy</text>
  </g>
  
  <!-- Implementation Box -->
  <g transform="translate(420, 490)">
    <rect x="0" y="0" width="330" height="95" rx="6" fill="#FFF7ED" stroke="#FB923C" stroke-width="1.5"/>
    <text x="165" y="20" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle" fill="#7C2D12">
      Implementation Considerations
    </text>
    
    <text x="15" y="40" font-family="Arial" font-size="10" fill="#1F2937">• Set maximum iteration depth (typically 3-4)</text>
    <text x="15" y="56" font-family="Arial" font-size="10" fill="#1F2937">• Apply similarity threshold for quality</text>
    <text x="15" y="72" font-family="Arial" font-size="10" fill="#1F2937">• Weight decreases with hop distance</text>
    <text x="15" y="88" font-family="Arial" font-size="10" fill="#1F2937">• Monitor computational complexity</text>
  </g>
</svg>