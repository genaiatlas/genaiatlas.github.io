<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="700" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="600" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Conservative vs Optimistic Corrections
  </text>
  
  <!-- Example Restaurant Scenario -->
  <g transform="translate(100, 80)">
    <rect x="0" y="0" width="1000" height="120" fill="#fff" stroke="#34495e" stroke-width="2" rx="8"/>
    <text x="500" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Example: New Restaurant with 4 Five-Star Reviews
    </text>
    
    <g transform="translate(50, 50)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="15" fill="#34495e">
        Average Rating: 5.0 stars
      </text>
      <text x="0" y="25" font-family="Arial, sans-serif" font-size="15" fill="#34495e">
        Number of Reviews (n): 4
      </text>
      <text x="0" y="50" font-family="Arial, sans-serif" font-size="15" fill="#34495e">
        Correction Constant (C): 2.5 (for 1-5 scale)
      </text>
    </g>
    
    <g transform="translate(500, 50)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="15" fill="#34495e">
        Correction Term: C divided by square root of n = 2.5 divided by 2 = 1.25
      </text>
      <text x="0" y="25" font-family="Arial, sans-serif" font-size="15" fill="#e67e22" font-weight="bold">
        Conservative: 5.0 - 1.25 = 3.75
      </text>
      <text x="0" y="50" font-family="Arial, sans-serif" font-size="15" fill="#3498db" font-weight="bold">
        Optimistic: 5.0 + 1.25 = 6.25 (capped at 5.0)
      </text>
    </g>
  </g>
  
  <!-- Conservative Correction Section -->
  <g transform="translate(100, 240)">
    <rect x="0" y="0" width="480" height="380" fill="#fff" stroke="#e67e22" stroke-width="3" rx="8"/>
    <rect x="0" y="0" width="480" height="50" fill="#e67e22" rx="8"/>
    <text x="240" y="33" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#fff">
      Conservative Correction
    </text>
    
    <!-- Formula -->
    <g transform="translate(40, 80)">
      <rect x="0" y="0" width="400" height="60" fill="#fef5e7" stroke="#e67e22" stroke-width="2" rx="4"/>
      <text x="200" y="23" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#2c3e50" font-weight="bold">
        Adjusted Score Formula
      </text>
      <text x="200" y="45" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#e67e22" font-style="italic">
        Score = Avg Rating - C divided by square root n
      </text>
    </g>
    
    <!-- Advantages -->
    <g transform="translate(20, 160)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#27ae60">
        Advantages:
      </text>
      <g transform="translate(0, 15)">
        <text x="10" y="15" font-family="Arial, sans-serif" font-size="13" fill="#34495e">
          Prevents gaming and manipulation
        </text>
        <text x="10" y="35" font-family="Arial, sans-serif" font-size="13" fill="#34495e">
          Protects users from unreliable data
        </text>
        <text x="10" y="55" font-family="Arial, sans-serif" font-size="13" fill="#34495e">
          Conservative bias is safer
        </text>
        <text x="10" y="75" font-family="Arial, sans-serif" font-size="13" fill="#34495e">
          Rewards established quality
        </text>
      </g>
    </g>
    
    <!-- Disadvantages -->
    <g transform="translate(20, 270)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#e74c3c">
        Disadvantages:
      </text>
      <g transform="translate(0, 15)">
        <text x="10" y="15" font-family="Arial, sans-serif" font-size="13" fill="#34495e">
          Penalizes new high-quality items
        </text>
        <text x="10" y="35" font-family="Arial, sans-serif" font-size="13" fill="#34495e">
          Reduces exploration and discovery
        </text>
        <text x="10" y="55" font-family="Arial, sans-serif" font-size="13" fill="#34495e">
          May be overly cautious
        </text>
      </g>
    </g>
  </g>
  
  <!-- Optimistic Correction Section -->
  <g transform="translate(620, 240)">
    <rect x="0" y="0" width="480" height="380" fill="#fff" stroke="#3498db" stroke-width="3" rx="8"/>
    <rect x="0" y="0" width="480" height="50" fill="#3498db" rx="8"/>
    <text x="240" y="33" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#fff">
      Optimistic Correction
    </text>
    
    <!-- Formula -->
    <g transform="translate(40, 80)">
      <rect x="0" y="0" width="400" height="60" fill="#ebf5fb" stroke="#3498db" stroke-width="2" rx="4"/>
      <text x="200" y="23" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#2c3e50" font-weight="bold">
        Adjusted Score Formula
      </text>
      <text x="200" y="45" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#2980b9" font-style="italic">
        Score = Avg Rating + C divided by square root n
      </text>
    </g>
    
    <!-- Advantages -->
    <g transform="translate(20, 160)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#27ae60">
        Advantages:
      </text>
      <g transform="translate(0, 15)">
        <text x="10" y="15" font-family="Arial, sans-serif" font-size="13" fill="#34495e">
          Encourages exploration
        </text>
        <text x="10" y="35" font-family="Arial, sans-serif" font-size="13" fill="#34495e">
          Helps discover hidden gems
        </text>
        <text x="10" y="55" font-family="Arial, sans-serif" font-size="13" fill="#34495e">
          Fair to new high-quality items
        </text>
        <text x="10" y="75" font-family="Arial, sans-serif" font-size="13" fill="#34495e">
          Promotes market diversity
        </text>
      </g>
    </g>
    
    <!-- Disadvantages -->
    <g transform="translate(20, 270)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#e74c3c">
        Disadvantages:
      </text>
      <g transform="translate(0, 15)">
        <text x="10" y="15" font-family="Arial, sans-serif" font-size="13" fill="#34495e">
          More vulnerable to manipulation
        </text>
        <text x="10" y="35" font-family="Arial, sans-serif" font-size="13" fill="#34495e">
          May mislead users initially
        </text>
        <text x="10" y="55" font-family="Arial, sans-serif" font-size="13" fill="#34495e">
          Higher risk for users
        </text>
      </g>
    </g>
  </g>
  
  <!-- When to Use Box -->
  <g transform="translate(250, 640)">
    <rect x="0" y="0" width="700" height="50" fill="#e8f8f5" stroke="#27ae60" stroke-width="2" rx="6"/>
    <text x="20" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#27ae60">
      When to Use:
    </text>
    <text x="140" y="20" font-family="Arial, sans-serif" font-size="13" fill="#34495e">
      Conservative for main rankings, safety-critical applications
    </text>
    <text x="140" y="38" font-family="Arial, sans-serif" font-size="13" fill="#34495e">
      Optimistic for New and Notable sections, discovery features
    </text>
  </g>
</svg>