<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    Data Science Process (CRISP-DM Framework)
  </text>
  
  <!-- Central circle with arrows -->
  <circle cx="400" cy="300" r="120" fill="none" stroke="#95a5a6" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Business Understanding -->
  <circle cx="400" cy="120" r="50" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <text x="400" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Business
  </text>
  <text x="400" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Understanding
  </text>
  
  <!-- Data Understanding -->
  <circle cx="580" cy="200" r="50" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="580" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Data
  </text>
  <text x="580" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Understanding
  </text>
  
  <!-- Data Preparation -->
  <circle cx="580" cy="400" r="50" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
  <text x="580" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Data
  </text>
  <text x="580" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Preparation
  </text>
  
  <!-- Modeling -->
  <circle cx="400" cy="480" r="50" fill="#27ae60" stroke="#229954" stroke-width="2"/>
  <text x="400" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Modeling
  </text>
  
  <!-- Evaluation -->
  <circle cx="220" cy="400" r="50" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
  <text x="220" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Evaluation
  </text>
  
  <!-- Deployment -->
  <circle cx="220" cy="200" r="50" fill="#1abc9c" stroke="#16a085" stroke-width="2"/>
  <text x="220" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Deployment
  </text>
  
  <!-- Arrows connecting the circles -->
  <!-- Business Understanding to Data Understanding -->
  <path d="M 445 145 Q 500 160 535 175" fill="none" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Data Understanding to Data Preparation -->
  <path d="M 580 250 L 580 350" fill="none" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Data Preparation to Modeling -->
  <path d="M 535 425 Q 480 440 445 455" fill="none" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Modeling to Evaluation -->
  <path d="M 350 480 Q 300 465 270 440" fill="none" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Evaluation to Deployment -->
  <path d="M 220 350 L 220 250" fill="none" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Deployment to Business Understanding -->
  <path d="M 265 175 Q 320 160 355 145" fill="none" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Data Understanding to Modeling (direct connection) -->
  <path d="M 545 230 Q 480 320 435 450" fill="none" stroke="#95a5a6" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrowhead-gray)"/>
  
  <!-- Define arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e"/>
    </marker>
    <marker id="arrowhead-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#95a5a6"/>
    </marker>
  </defs>
  
  <!-- Phase descriptions -->
  <rect x="50" y="80" width="150" height="80" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" rx="5"/>
  <text x="125" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">
    Business Understanding
  </text>
  <text x="60" y="115" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">
    • Define objectives
  </text>
  <text x="60" y="127" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">
    • Assess situation
  </text>
  <text x="60" y="139" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">
    • Create project plan
  </text>
  <text x="60" y="151" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">
    • Determine success criteria
  </text>
  
  <rect x="600" y="80" width="150" height="80" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" rx="5"/>
  <text x="675" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">
    Data Understanding
  </text>
  <text x="610" y="115" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">
    • Collect initial data
  </text>
  <text x="610" y="127" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">
    • Describe data
  </text>
  <text x="610" y="139" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">
    • Explore data
  </text>
  <text x="610" y="151" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">
    • Verify data quality
  </text>
  
  <rect x="600" y="440" width="150" height="80" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" rx="5"/>
  <text x="675" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">
    Data Preparation
  </text>
  <text x="610" y="475" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">
    • Select data
  </text>
  <text x="610" y="487" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">
    • Clean data
  </text>
  <text x="610" y="499" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">
    • Construct data
  </text>
  <text x="610" y="511" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">
    • Format data
  </text>
  
  <rect x="325" y="530" width="150" height="60" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" rx="5"/>
  <text x="400" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">
    Modeling
  </text>
  <text x="335" y="565" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">
    • Select modeling technique
  </text>
  <text x="335" y="577" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">
    • Build and assess model
  </text>
  
  <rect x="50" y="440" width="150" height="80" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" rx="5"/>
  <text x="125" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">
    Evaluation
  </text>
  <text x="60" y="475" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">
    • Evaluate results
  </text>
  <text x="60" y="487" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">
    • Review process
  </text>
  <text x="60" y="499" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">
    • Determine next steps
  </text>
  <text x="60" y="511" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">
    • Validate models
  </text>
  
  <rect x="50" y="240" width="150" height="80" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" rx="5"/>
  <text x="125" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">
    Deployment
  </text>
  <text x="60" y="275" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">
    • Plan deployment
  </text>
  <text x="60" y="287" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">
    • Monitor and maintain
  </text>
  <text x="60" y="299" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">
    • Produce final report
  </text>
  <text x="60" y="311" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">
    • Review project
  </text>
</svg>