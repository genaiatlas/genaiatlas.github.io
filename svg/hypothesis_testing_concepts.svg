<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', sans-serif; font-size: 18px; font-weight: bold; fill: #2c3e50; }
      .header { font-family: 'Segoe UI', sans-serif; font-size: 14px; font-weight: bold; fill: #34495e; }
      .text { font-family: 'Segoe UI', sans-serif; font-size: 11px; fill: #2c3e50; }
      .small-text { font-family: 'Segoe UI', sans-serif; font-size: 9px; fill: #7f8c8d; }
      .math { font-family: 'Times New Roman', serif; font-size: 12px; fill: #8e44ad; }
      .box { fill: #ecf0f1; stroke: #34495e; stroke-width: 2; }
      .concept-box { fill: #3498db; stroke: #2980b9; stroke-width: 2; }
      .error-box { fill: #e74c3c; stroke: #c0392b; stroke-width: 2; }
      .decision-box { fill: #f39c12; stroke: #e67e22; stroke-width: 2; }
    </style>
  </defs>

  <!-- Title -->
  <text x="400" y="25" class="title" text-anchor="middle">Basic Concepts of Hypothesis Testing</text>

  <!-- Hypotheses Section -->
  <rect x="50" y="50" width="300" height="120" class="concept-box" rx="8"/>
  <text x="200" y="70" class="header" text-anchor="middle" fill="white">Hypotheses</text>
  
  <text x="70" y="90" class="text" fill="white">Null Hypothesis (H₀):</text>
  <text x="70" y="105" class="small-text" fill="white">• Statement of no effect or no difference</text>
  <text x="70" y="115" class="small-text" fill="white">• What we assume to be true initially</text>
  <text x="70" y="125" class="small-text" fill="white">• Example: H₀: μ = 50</text>

  <text x="70" y="145" class="text" fill="white">Alternative Hypothesis (H₁):</text>
  <text x="70" y="160" class="small-text" fill="white">• Research hypothesis, what we want to prove</text>
  <text x="70" y="170" class="small-text" fill="white">• Example: H₁: μ ≠ 50 (two-tailed)</text>

  <!-- Statistical Measures Section -->
  <rect x="380" y="50" width="350" height="120" class="concept-box" rx="8"/>
  <text x="555" y="70" class="header" text-anchor="middle" fill="white">Statistical Measures</text>
  
  <text x="400" y="90" class="text" fill="white">Test Statistic:</text>
  <text x="400" y="105" class="small-text" fill="white">• Standardized measure of evidence against H₀</text>
  <text x="400" y="115" class="small-text" fill="white">• Examples: Z, t, χ², F</text>

  <text x="400" y="135" class="text" fill="white">P-value:</text>
  <text x="400" y="150" class="small-text" fill="white">• Probability of observing data ≥ extreme if H₀ true</text>
  <text x="400" y="160" class="small-text" fill="white">• Lower p-value = stronger evidence against H₀</text>

  <!-- Error Types Section -->
  <rect x="50" y="200" width="300" height="150" class="error-box" rx="8"/>
  <text x="200" y="220" class="header" text-anchor="middle" fill="white">Types of Errors</text>

  <!-- Error Table -->
  <rect x="70" y="240" width="260" height="100" fill="white" stroke="#c0392b" stroke-width="1"/>
  
  <!-- Table headers -->
  <text x="85" y="255" class="small-text">Truth</text>
  <text x="150" y="245" class="small-text">H₀ True</text>
  <text x="225" y="245" class="small-text">H₀ False</text>
  
  <!-- Row headers -->
  <text x="75" y="275" class="small-text">Reject H₀</text>
  <text x="75" y="305" class="small-text">Fail to</text>
  <text x="75" y="315" class="small-text">Reject H₀</text>

  <!-- Table content -->
  <text x="150" y="275" class="small-text" text-anchor="middle">Type I Error</text>
  <text x="150" y="285" class="small-text" text-anchor="middle">(α)</text>
  <text x="225" y="275" class="small-text" text-anchor="middle">Correct</text>
  <text x="225" y="285" class="small-text" text-anchor="middle">(Power = 1-β)</text>
  
  <text x="150" y="305" class="small-text" text-anchor="middle">Correct</text>
  <text x="150" y="315" class="small-text" text-anchor="middle">(1-α)</text>
  <text x="225" y="305" class="small-text" text-anchor="middle">Type II Error</text>
  <text x="225" y="315" class="small-text" text-anchor="middle">(β)</text>

  <!-- Table lines -->
  <line x1="120" y1="235" x2="120" y2="335" stroke="#7f8c8d" stroke-width="1"/>
  <line x1="185" y1="235" x2="185" y2="335" stroke="#7f8c8d" stroke-width="1"/>
  <line x1="70" y1="260" x2="330" y2="260" stroke="#7f8c8d" stroke-width="1"/>
  <line x1="70" y1="290" x2="330" y2="290" stroke="#7f8c8d" stroke-width="1"/>

  <!-- Decision Process Section -->
  <rect x="380" y="200" width="350" height="150" class="decision-box" rx="8"/>
  <text x="555" y="220" class="header" text-anchor="middle" fill="white">Decision Process</text>
  
  <text x="400" y="240" class="text" fill="white">Significance Level (α):</text>
  <text x="400" y="255" class="small-text" fill="white">• Probability of Type I Error</text>
  <text x="400" y="265" class="small-text" fill="white">• Commonly α = 0.05, 0.01, or 0.10</text>
  <text x="400" y="275" class="small-text" fill="white">• Set before conducting the test</text>

  <text x="400" y="295" class="text" fill="white">Decision Rule:</text>
  <text x="400" y="310" class="small-text" fill="white">• If p-value ≤ α: Reject H₀</text>
  <text x="400" y="320" class="small-text" fill="white">• If p-value &gt; α: Fail to reject H₀</text>
  <text x="400" y="330" class="small-text" fill="white">• Never "accept" H₀, only fail to reject</text>

  <!-- Critical Values Section -->
  <rect x="50" y="380" width="680" height="100" class="box" rx="8"/>
  <text x="390" y="400" class="header" text-anchor="middle">Critical Values and Regions</text>
  
  <text x="70" y="420" class="text">Critical Value: Boundary value that separates rejection region from non-rejection region</text>
  <text x="70" y="435" class="text">Critical Region: Range of test statistic values that lead to rejecting H₀</text>
  <text x="70" y="450" class="text">Confidence Level: 1 - α (e.g., 95% confidence level when α = 0.05)</text>
  <text x="70" y="465" class="text">Power: Probability of correctly rejecting false H₀ (1 - β, where β = P(Type II Error))</text>

  <!-- Mathematical Examples -->
  <rect x="50" y="500" width="680" height="80" class="box" rx="8"/>
  <text x="390" y="520" class="header" text-anchor="middle">Common Test Statistics</text>
  
  <text x="70" y="540" class="math">Z-test: Z = (X̄ - μ₀)/(σ/√n)</text>
  <text x="300" y="540" class="math">t-test: t = (X̄ - μ₀)/(s/√n)</text>
  <text x="500" y="540" class="math">χ²-test: χ² = (n-1)s²/σ₀²</text>
  
  <text x="70" y="560" class="small-text">Used when σ known</text>
  <text x="300" y="560" class="small-text">Used when σ unknown</text>
  <text x="500" y="560" class="small-text">Used for variance testing</text>

</svg>