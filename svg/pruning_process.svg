<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title-text { font-family: 'Arial', sans-serif; font-size: 18px; font-weight: bold; text-anchor: middle; }
      .subtitle-text { font-family: 'Arial', sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; }
      .node-text { font-family: 'Arial', sans-serif; font-size: 10px; text-anchor: middle; }
      .feature-text { font-family: 'Arial', sans-serif; font-size: 9px; text-anchor: middle; font-weight: bold; }
      .label-text { font-family: 'Arial', sans-serif; font-size: 11px; text-anchor: middle; }
      .useful-node { fill: #87ceeb; stroke: #4682b4; stroke-width: 2; }
      .redundant-node { fill: #ffcccb; stroke: #cd5c5c; stroke-width: 2; }
      .pruned-node { fill: #98fb98; stroke: #32cd32; stroke-width: 2; }
      .arrow { stroke: #333; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
    </style>
    <!-- Arrow marker -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#fafafa"/>
  
  <!-- Main Title -->
  <text x="400" y="25" class="title-text">Decision Tree Pruning Process</text>
  
  <!-- Before Pruning Section -->
  <g id="before-pruning">
    <text x="180" y="60" class="subtitle-text" fill="#cd5c5c">Before Pruning (Overfitted)</text>
    
    <!-- Root -->
    <rect x="150" y="80" width="60" height="35" class="useful-node" rx="3"/>
    <text x="180" y="95" class="feature-text">Est. Wait</text>
    <text x="180" y="107" class="node-text">samples=12</text>
    
    <!-- Level 1 -->
    <rect x="80" y="140" width="50" height="30" class="useful-node" rx="3"/>
    <text x="105" y="153" class="feature-text">0-10</text>
    <text x="105" y="164" class="node-text">n=3</text>
    
    <rect x="140" y="140" width="50" height="30" class="useful-node" rx="3"/>
    <text x="165" y="153" class="feature-text">10-30</text>
    <text x="165" y="164" class="node-text">n=4</text>
    
    <rect x="200" y="140" width="50" height="30" class="useful-node" rx="3"/>
    <text x="225" y="153" class="feature-text">30-60</text>
    <text x="225" y="164" class="node-text">n=3</text>
    
    <rect x="260" y="140" width="50" height="30" class="useful-node" rx="3"/>
    <text x="285" y="153" class="feature-text">&gt;60</text>
    <text x="285" y="164" class="node-text">n=2</text>
    
    <!-- Level 2 - Many redundant branches -->
    <rect x="60" y="200" width="40" height="25" class="redundant-node" rx="3"/>
    <text x="80" y="210" class="feature-text">Pat</text>
    <text x="80" y="220" class="node-text">n=3</text>
    
    <rect x="110" y="200" width="40" height="25" class="redundant-node" rx="3"/>
    <text x="130" y="210" class="feature-text">Hungry</text>
    <text x="130" y="220" class="node-text">n=2</text>
    
    <rect x="160" y="200" width="40" height="25" class="redundant-node" rx="3"/>
    <text x="180" y="210" class="feature-text">Hungry</text>
    <text x="180" y="220" class="node-text">n=2</text>
    
    <rect x="210" y="200" width="40" height="25" class="useful-node" rx="3"/>
    <text x="230" y="210" class="feature-text">Hungry</text>
    <text x="230" y="220" class="node-text">n=3</text>
    
    <rect x="260" y="200" width="40" height="25" class="redundant-node" rx="3"/>
    <text x="280" y="210" class="feature-text">Leave</text>
    <text x="280" y="220" class="node-text">n=2</text>
    
    <!-- Level 3 - Unnecessary leaves -->
    <rect x="50" y="250" width="30" height="20" class="redundant-node" rx="2"/>
    <text x="65" y="258" class="feature-text">Leave</text>
    <text x="65" y="268" class="node-text">n=1</text>
    
    <rect x="90" y="250" width="30" height="20" class="redundant-node" rx="2"/>
    <text x="105" y="258" class="feature-text">Wait</text>
    <text x="105" y="268" class="node-text">n=2</text>
    
    <rect x="130" y="250" width="30" height="20" class="redundant-node" rx="2"/>
    <text x="145" y="258" class="feature-text">Leave</text>
    <text x="145" y="268" class="node-text">n=1</text>
    
    <rect x="170" y="250" width="30" height="20" class="redundant-node" rx="2"/>
    <text x="185" y="258" class="feature-text">Wait</text>
    <text x="185" y="268" class="node-text">n=1</text>
    
    <rect x="210" y="250" width="30" height="20" class="useful-node" rx="2"/>
    <text x="225" y="258" class="feature-text">Leave</text>
    <text x="225" y="268" class="node-text">n=2</text>
    
    <rect x="250" y="250" width="30" height="20" class="useful-node" rx="2"/>
    <text x="265" y="258" class="feature-text">Wait</text>
    <text x="265" y="268" class="node-text">n=1</text>
    
    <!-- Connections for before tree -->
    <line x1="180" y1="115" x2="105" y2="140" stroke="#666" stroke-width="1"/>
    <line x1="180" y1="115" x2="165" y2="140" stroke="#666" stroke-width="1"/>
    <line x1="180" y1="115" x2="225" y2="140" stroke="#666" stroke-width="1"/>
    <line x1="180" y1="115" x2="285" y2="140" stroke="#666" stroke-width="1"/>
    
    <line x1="105" y1="170" x2="80" y2="200" stroke="#666" stroke-width="1"/>
    <line x1="165" y1="170" x2="130" y2="200" stroke="#666" stroke-width="1"/>
    <line x1="165" y1="170" x2="180" y2="200" stroke="#666" stroke-width="1"/>
    <line x1="225" y1="170" x2="230" y2="200" stroke="#666" stroke-width="1"/>
    <line x1="285" y1="170" x2="280" y2="200" stroke="#666" stroke-width="1"/>
    
    <line x1="80" y1="225" x2="65" y2="250" stroke="#666" stroke-width="1"/>
    <line x1="80" y1="225" x2="105" y2="250" stroke="#666" stroke-width="1"/>
    <line x1="130" y1="225" x2="145" y2="250" stroke="#666" stroke-width="1"/>
    <line x1="180" y1="225" x2="185" y2="250" stroke="#666" stroke-width="1"/>
    <line x1="230" y1="225" x2="225" y2="250" stroke="#666" stroke-width="1"/>
    <line x1="230" y1="225" x2="265" y2="250" stroke="#666" stroke-width="1"/>
  </g>
  
  <!-- Arrow indicating pruning process -->
  <path d="M 350 180 L 450 180" class="arrow"/>
  <text x="400" y="165" class="label-text" fill="#333" font-weight="bold">Pruning Process</text>
  <text x="400" y="200" class="label-text" fill="#666">Remove redundant branches</text>
  
  <!-- After Pruning Section -->
  <g id="after-pruning">
    <text x="620" y="60" class="subtitle-text" fill="#32cd32">After Pruning (Optimized)</text>
    
    <!-- Root -->
    <rect x="590" y="80" width="60" height="35" class="pruned-node" rx="3"/>
    <text x="620" y="95" class="feature-text">Est. Wait</text>
    <text x="620" y="107" class="node-text">samples=12</text>
    
    <!-- Level 1 - Simplified -->
    <rect x="520" y="140" width="50" height="30" class="pruned-node" rx="3"/>
    <text x="545" y="153" class="feature-text">0-10</text>
    <text x="545" y="164" class="node-text">n=3</text>
    
    <rect x="580" y="140" width="50" height="30" class="pruned-node" rx="3"/>
    <text x="605" y="153" class="feature-text">10-30</text>
    <text x="605" y="164" class="node-text">n=4</text>
    
    <rect x="640" y="140" width="50" height="30" class="pruned-node" rx="3"/>
    <text x="665" y="153" class="feature-text">30-60</text>
    <text x="665" y="164" class="node-text">n=3</text>
    
    <rect x="700" y="140" width="50" height="30" class="pruned-node" rx="3"/>
    <text x="725" y="153" class="feature-text">&gt;60</text>
    <text x="725" y="164" class="node-text">n=2</text>
    
    <!-- Level 2 - Only essential branches -->
    <rect x="510" y="200" width="40" height="25" class="pruned-node" rx="3"/>
    <text x="530" y="210" class="feature-text">Leave</text>
    <text x="530" y="220" class="node-text">n=3</text>
    
    <rect x="570" y="200" width="40" height="25" class="pruned-node" rx="3"/>
    <text x="590" y="210" class="feature-text">Wait</text>
    <text x="590" y="220" class="node-text">n=4</text>
    
    <rect x="630" y="200" width="40" height="25" class="pruned-node" rx="3"/>
    <text x="650" y="210" class="feature-text">Hungry</text>
    <text x="650" y="220" class="node-text">n=3</text>
    
    <rect x="690" y="200" width="40" height="25" class="pruned-node" rx="3"/>
    <text x="710" y="210" class="feature-text">Leave</text>
    <text x="710" y="220" class="node-text">n=2</text>
    
    <!-- Final leaves - only where necessary -->
    <rect x="620" y="250" width="30" height="20" class="pruned-node" rx="2"/>
    <text x="635" y="258" class="feature-text">Leave</text>
    <text x="635" y="268" class="node-text">n=2</text>
    
    <rect x="660" y="250" width="30" height="20" class="pruned-node" rx="2"/>
    <text x="675" y="258" class="feature-text">Wait</text>
    <text x="675" y="268" class="node-text">n=1</text>
    
    <!-- Connections for after tree -->
    <line x1="620" y1="115" x2="545" y2="140" stroke="#666" stroke-width="1"/>
    <line x1="620" y1="115" x2="605" y2="140" stroke="#666" stroke-width="1"/>
    <line x1="620" y1="115" x2="665" y2="140" stroke="#666" stroke-width="1"/>
    <line x1="620" y1="115" x2="725" y2="140" stroke="#666" stroke-width="1"/>
    
    <line x1="545" y1="170" x2="530" y2="200" stroke="#666" stroke-width="1"/>
    <line x1="605" y1="170" x2="590" y2="200" stroke="#666" stroke-width="1"/>
    <line x1="665" y1="170" x2="650" y2="200" stroke="#666" stroke-width="1"/>
    <line x1="725" y1="170" x2="710" y2="200" stroke="#666" stroke-width="1"/>
    
    <line x1="650" y1="225" x2="635" y2="250" stroke="#666" stroke-width="1"/>
    <line x1="650" y1="225" x2="675" y2="250" stroke="#666" stroke-width="1"/>
  </g>
  
  <!-- Benefits comparison -->
  <g transform="translate(50, 330)">
    <rect x="0" y="0" width="700" height="220" fill="white" stroke="#ccc" stroke-width="1" rx="5"/>
    <text x="350" y="25" class="subtitle-text">Pruning Analysis &amp; Benefits</text>
    
    <!-- Before metrics -->
    <g transform="translate(50, 50)">
      <text x="100" y="0" class="subtitle-text" fill="#cd5c5c">Before Pruning</text>
      <text x="0" y="20" class="label-text">• Tree Depth: 4 levels</text>
      <text x="0" y="35" class="label-text">• Total Nodes: 15</text>
      <text x="0" y="50" class="label-text">• Leaf Nodes: 6</text>
      <text x="0" y="65" class="label-text">• Redundant Branches: 8</text>
      <text x="0" y="80" class="label-text">• Training Error: 5%</text>
      <text x="0" y="95" class="label-text">• Validation Error: 22%</text>
      <text x="0" y="110" class="label-text">• Overfitting: High</text>
      <text x="0" y="125" class="label-text">• Model Complexity: High</text>
      <text x="0" y="140" class="label-text">• Interpretability: Low</text>
    </g>
    
    <!-- After metrics -->
    <g transform="translate(400, 50)">
      <text x="100" y="0" class="subtitle-text" fill="#32cd32">After Pruning</text>
      <text x="0" y="20" class="label-text">• Tree Depth: 3 levels</text>
      <text x="0" y="35" class="label-text">• Total Nodes: 9</text>
      <text x="0" y="50" class="label-text">• Leaf Nodes: 4</text>
      <text x="0" y="65" class="label-text">• Redundant Branches: 0</text>
      <text x="0" y="80" class="label-text">• Training Error: 8%</text>
      <text x="0" y="95" class="label-text">• Validation Error: 15%</text>
      <text x="0" y="110" class="label-text">• Overfitting: Reduced</text>
      <text x="0" y="125" class="label-text">• Model Complexity: Medium</text>
      <text x="0" y="140" class="label-text">• Interpretability: High</text>
    </g>
    
    <!-- Key improvements -->
    <g transform="translate(250, 50)">
      <text x="50" y="0" class="subtitle-text" fill="#2c3e50">Key Improvements</text>
      <text x="0" y="25" class="label-text" fill="#27ae60">✓ 40% reduction in nodes</text>
      <text x="0" y="45" class="label-text" fill="#27ae60">✓ 32% better validation error</text>
      <text x="0" y="65" class="label-text" fill="#27ae60">✓ Eliminated overfitting</text>
      <text x="0" y="85" class="label-text" fill="#27ae60">✓ Faster inference</text>
      <text x="0" y="105" class="label-text" fill="#27ae60">✓ Better generalization</text>
      <text x="0" y="125" class="label-text" fill="#27ae60">✓ Simpler interpretation</text>
    </g>
  </g>
  
  <!-- Legend -->
  <g transform="translate(300, 570)">
    <rect x="0" y="0" width="200" height="25" fill="white" stroke="#ccc" stroke-width="1"/>
    <rect x="5" y="8" width="15" height="10" class="redundant-node"/>
    <text x="25" y="17" class="node-text">Redundant Branch</text>
    <rect x="120" y="8" width="15" height="10" class="pruned-node"/>
    <text x="140" y="17" class="node-text">Optimized</text>
  </g>
</svg>