<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="500" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">Deep Learning Applications Overview</text>
  
  <!-- Central Deep Learning Node -->
  <circle cx="400" cy="250" r="80" fill="#3498db" stroke="#2980b9" stroke-width="3"/>
  <text x="400" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Deep</text>
  <text x="400" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Learning</text>
  
  <!-- Speech Recognition -->
  <circle cx="200" cy="120" r="50" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <text x="200" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Speech</text>
  <text x="200" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Recognition</text>
  
  <!-- Game Mastery (Go) -->
  <circle cx="600" cy="120" r="50" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
  <text x="600" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Game</text>
  <text x="600" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Mastery</text>
  
  <!-- Computer Vision -->
  <circle cx="200" cy="380" r="50" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
  <text x="200" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Computer</text>
  <text x="200" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Vision</text>
  
  <!-- Self-Driving Cars -->
  <circle cx="600" cy="380" r="50" fill="#27ae60" stroke="#229954" stroke-width="2"/>
  <text x="600" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Self-Driving</text>
  <text x="600" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Cars</text>
  
  <!-- Connecting Lines -->
  <line x1="320" y1="200" x2="250" y2="150" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="480" y1="200" x2="550" y2="150" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="320" y1="300" x2="250" y2="350" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="480" y1="300" x2="550" y2="350" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Application Details -->
  <text x="200" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Real-time Processing</text>
  <text x="200" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Natural Language</text>
  
  <text x="600" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">AlphaGo Breakthrough</text>
  <text x="600" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Strategic Thinking</text>
  
  <text x="200" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Image Classification</text>
  <text x="200" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Object Detection</text>
  
  <text x="600" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Autonomous Navigation</text>
  <text x="600" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Safety Systems</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e"/>
    </marker>
  </defs>
</svg>