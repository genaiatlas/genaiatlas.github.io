<svg width="800" height="700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'Arial', sans-serif; font-size: 20px; font-weight: bold; fill: #2c3e50; }
      .subtitle { font-family: 'Arial', sans-serif; font-size: 16px; fill: #34495e; font-weight: bold; }
      .section-title { font-family: 'Arial', sans-serif; font-size: 14px; fill: #34495e; font-weight: bold; }
      .description { font-family: 'Arial', sans-serif; font-size: 12px; fill: #34495e; }
      .small-text { font-family: 'Arial', sans-serif; font-size: 10px; fill: #34495e; }
      .percentage { font-family: 'Arial', sans-serif; font-size: 11px; fill: #2c3e50; font-weight: bold; }
      .box { fill: #f8f9fa; stroke: #dee2e6; stroke-width: 2; rx: 8; }
      .train-color { fill: #3498db; }
      .val-color { fill: #f39c12; }
      .test-color { fill: #e74c3c; }
      .random-box { fill: #e8f6f3; stroke: #16a085; stroke-width: 2; rx: 8; }
      .temporal-box { fill: #fff3e0; stroke: #ff9800; stroke-width: 2; rx: 8; }
      .stratified-box { fill: #f3e5f5; stroke: #9c27b0; stroke-width: 2; rx: 8; }
      .arrow { stroke: #34495e; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .split-line { stroke: #e74c3c; stroke-width: 2; stroke-dasharray: 5,5; }
      .data-point { fill: #2c3e50; stroke: white; stroke-width: 1; }
      .timeline { stroke: #34495e; stroke-width: 2; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e" />
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="700" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="400" y="25" text-anchor="middle" class="title">Data Splitting Strategies for Model Validation</text>
  
  <!-- Random Splitting Section -->
  <rect x="50" y="50" width="700" height="140" class="random-box"/>
  <text x="400" y="75" text-anchor="middle" class="subtitle" fill="#16a085">1. Random Splitting (Standard Approach)</text>
  
  <!-- Original dataset -->
  <g transform="translate(100, 100)">
    <text x="0" y="15" class="section-title">Original Dataset (n=1000)</text>
    <rect x="0" y="20" width="400" height="30" fill="#95a5a6" stroke="#7f8c8d" stroke-width="2" rx="4"/>
    <text x="200" y="40" text-anchor="middle" class="description" fill="white">Mixed Data Points</text>
    
    <!-- Split arrows -->
    <path d="M 120 60 L 120 85" class="arrow"/>
    <path d="M 280 60 L 280 85" class="arrow"/>
    
    <!-- Training set -->
    <rect x="20" y="90" width="240" height="25" class="train-color" stroke="#2980b9" stroke-width="2" rx="4"/>
    <text x="140" y="107" text-anchor="middle" class="description" fill="white">Training Set (80%)</text>
    <text x="140" y="125" text-anchor="middle" class="percentage">n = 800</text>
    
    <!-- Validation set -->
    <rect x="280" y="90" width="80" height="25" class="val-color" stroke="#e67e22" stroke-width="2" rx="4"/>
    <text x="320" y="107" text-anchor="middle" class="description" fill="white">Validation (20%)</text>
    <text x="320" y="125" text-anchor="middle" class="percentage">n = 200</text>
    
    <!-- Random indicator -->
    <text x="450" y="50" class="description">Random shuffle before split</text>
    <text x="450" y="65" class="description">Ensures representative samples</text>
    <text x="450" y="80" class="description">Most common approach</text>
  </g>
  
  <!-- Temporal Splitting Section -->
  <rect x="50" y="210" width="700" height="140" class="temporal-box"/>
  <text x="400" y="235" text-anchor="middle" class="subtitle" fill="#ff9800">2. Temporal Splitting (Time Series Data)</text>
  
  <!-- Timeline visualization -->
  <g transform="translate(100, 260)">
    <text x="0" y="15" class="section-title">Time-Ordered Data</text>
    
    <!-- Timeline -->
    <line x1="0" y1="40" x2="400" y2="40" class="timeline"/>
    
    <!-- Time markers -->
    <line x1="0" y1="35" x2="0" y2="45" class="timeline"/>
    <text x="0" y="55" text-anchor="middle" class="small-text">2020</text>
    
    <line x1="200" y1="35" x2="200" y2="45" class="timeline"/>
    <text x="200" y="55" text-anchor="middle" class="small-text">2022</text>
    
    <line x1="320" y1="35" x2="320" y2="45" class="timeline"/>
    <text x="320" y="55" text-anchor="middle" class="small-text">2024</text>
    
    <line x1="400" y1="35" x2="400" y2="45" class="timeline"/>
    <text x="400" y="55" text-anchor="middle" class="small-text">2025</text>
    
    <!-- Training period -->
    <rect x="0" y="25" width="200" height="30" class="train-color" stroke="#2980b9" stroke-width="2" rx="4" opacity="0.8"/>
    <text x="100" y="45" text-anchor="middle" class="description" fill="white">Training (Historical)</text>
    
    <!-- Validation period -->
    <rect x="220" y="25" width="100" height="30" class="val-color" stroke="#e67e22" stroke-width="2" rx="4" opacity="0.8"/>
    <text x="270" y="45" text-anchor="middle" class="description" fill="white">Validation</text>
    
    <!-- Future period -->
    <rect x="340" y="25" width="60" height="30" class="test-color" stroke="#c0392b" stroke-width="2" rx="4" opacity="0.8"/>
    <text x="370" y="45" text-anchor="middle" class="description" fill="white">Future</text>
    
    <!-- Temporal split lines -->
    <line x1="220" y1="20" x2="220" y2="60" class="split-line"/>
    <line x1="340" y1="20" x2="340" y2="60" class="split-line"/>
    
    <!-- Guidelines -->
    <text x="450" y="30" class="description">• No data leakage from future</text>
    <text x="450" y="45" class="description">• Preserves temporal order</text>
    <text x="450" y="60" class="description">• Realistic for forecasting</text>
  </g>
  
  <!-- Stratified Splitting Section -->
  <rect x="50" y="370" width="700" height="160" class="stratified-box"/>
  <text x="400" y="395" text-anchor="middle" class="subtitle" fill="#9c27b0">3. Stratified Splitting (Classification Tasks)</text>
  
  <!-- Class distribution visualization -->
  <g transform="translate(100, 420)">
    <text x="0" y="15" class="section-title">Maintaining Class Proportions</text>
    
    <!-- Original distribution -->
    <text x="0" y="40" class="description">Original Dataset:</text>
    
    <!-- Class A (60%) -->
    <rect x="0" y="50" width="120" height="20" fill="#3498db" stroke="#2980b9" stroke-width="1" rx="2"/>
    <text x="60" y="65" text-anchor="middle" class="small-text" fill="white">Class A (60%)</text>
    
    <!-- Class B (30%) -->
    <rect x="125" y="50" width="60" height="20" fill="#e74c3c" stroke="#c0392b" stroke-width="1" rx="2"/>
    <text x="155" y="65" text-anchor="middle" class="small-text" fill="white">Class B (30%)</text>
    
    <!-- Class C (10%) -->
    <rect x="190" y="50" width="20" height="20" fill="#f39c12" stroke="#e67e22" stroke-width="1" rx="2"/>
    <text x="200" y="65" text-anchor="middle" class="small-text" fill="white">C</text>
    <text x="225" y="65" class="small-text">(10%)</text>
    
    <!-- Arrow to splits -->
    <path d="M 105 80 L 105 100" class="arrow"/>
    
    <!-- Training split -->
    <text x="0" y="120" class="description">Training (80%):</text>
    <rect x="0" y="125" width="96" height="15" fill="#3498db" stroke="#2980b9" stroke-width="1" rx="2"/>
    <text x="48" y="137" text-anchor="middle" class="small-text" fill="white">A: 60%</text>
    
    <rect x="100" y="125" width="48" height="15" fill="#e74c3c" stroke="#c0392b" stroke-width="1" rx="2"/>
    <text x="124" y="137" text-anchor="middle" class="small-text" fill="white">B: 30%</text>
    
    <rect x="152" y="125" width="16" height="15" fill="#f39c12" stroke="#e67e22" stroke-width="1" rx="2"/>
    <text x="160" y="137" text-anchor="middle" class="small-text" fill="white">C</text>
    
    <!-- Validation split -->
    <text x="200" y="120" class="description">Validation (20%):</text>
    <rect x="200" y="125" width="24" height="15" fill="#3498db" stroke="#2980b9" stroke-width="1" rx="2"/>
    <text x="212" y="137" text-anchor="middle" class="small-text" fill="white">A</text>
    
    <rect x="228" y="125" width="12" height="15" fill="#e74c3c" stroke="#c0392b" stroke-width="1" rx="2"/>
    <text x="234" y="137" text-anchor="middle" class="small-text" fill="white">B</text>
    
    <rect x="244" y="125" width="4" height="15" fill="#f39c12" stroke="#e67e22" stroke-width="1" rx="2"/>
    
    <!-- Benefits -->
    <text x="300" y="40" class="description">Benefits:</text>
    <text x="300" y="55" class="description">• Preserves class distribution</text>
    <text x="300" y="70" class="description">• Reduces selection bias</text>
    <text x="300" y="85" class="description">• Better for imbalanced classes</text>
    <text x="300" y="100" class="description">• More reliable performance estimates</text>
  </g>
  
  <!-- Comparison Table -->
  <rect x="50" y="550" width="700" height="120" class="box"/>
  <text x="400" y="575" text-anchor="middle" class="subtitle">Splitting Strategy Comparison</text>
  
  <!-- Table headers -->
  <text x="100" y="595" text-anchor="middle" class="section-title">Strategy</text>
  <text x="250" y="595" text-anchor="middle" class="section-title">Best Use Case</text>
  <text x="450" y="595" text-anchor="middle" class="section-title">Advantages</text>
  <text x="650" y="595" text-anchor="middle" class="section-title">Limitations</text>
  
  <!-- Horizontal line -->
  <line x1="70" y1="600" x2="730" y2="600" stroke="#bdc3c7" stroke-width="1"/>
  
  <!-- Row 1: Random -->
  <text x="100" y="615" text-anchor="middle" class="description" font-weight="bold">Random</text>
  <text x="250" y="615" text-anchor="middle" class="description">General ML tasks</text>
  <text x="450" y="615" text-anchor="middle" class="description">Simple, widely applicable</text>
  <text x="650" y="615" text-anchor="middle" class="description">May not preserve structure</text>
  
  <!-- Row 2: Temporal -->
  <text x="100" y="635" text-anchor="middle" class="description" font-weight="bold">Temporal</text>
  <text x="250" y="635" text-anchor="middle" class="description">Time series forecasting</text>
  <text x="450" y="635" text-anchor="middle" class="description">Realistic evaluation</text>
  <text x="650" y="635" text-anchor="middle" class="description">Less data for training</text>
  
  <!-- Row 3: Stratified -->
  <text x="100" y="655" text-anchor="middle" class="description" font-weight="bold">Stratified</text>
  <text x="250" y="655" text-anchor="middle" class="description">Imbalanced classification</text>
  <text x="450" y="655" text-anchor="middle" class="description">Preserves distributions</text>
  <text x="650" y="655" text-anchor="middle" class="description">More complex implementation</text>
</svg>