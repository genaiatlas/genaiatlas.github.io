<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', sans-serif; font-size: 20px; font-weight: bold; fill: #2c3e50; }
      .header { font-family: 'Segoe UI', sans-serif; font-size: 14px; font-weight: bold; fill: #34495e; }
      .text { font-family: 'Segoe UI', sans-serif; font-size: 12px; fill: #2c3e50; }
      .small-text { font-family: 'Segoe UI', sans-serif; font-size: 10px; fill: #7f8c8d; }
      .box { fill: #ecf0f1; stroke: #34495e; stroke-width: 2; }
      .process-box { fill: #3498db; stroke: #2980b9; stroke-width: 2; }
      .decision-box { fill: #e74c3c; stroke: #c0392b; stroke-width: 2; }
      .result-box { fill: #27ae60; stroke: #229954; stroke-width: 2; }
      .arrow { stroke: #34495e; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="30" class="title" text-anchor="middle">Hypothesis Testing Framework</text>

  <!-- Main Flow -->
  <!-- Step 1: Research Question -->
  <rect x="50" y="60" width="140" height="60" class="box" rx="8"/>
  <text x="120" y="80" class="header" text-anchor="middle">Research Question</text>
  <text x="120" y="95" class="text" text-anchor="middle">What do we want</text>
  <text x="120" y="110" class="text" text-anchor="middle">to investigate?</text>

  <!-- Step 2: Formulate Hypotheses -->
  <rect x="230" y="60" width="140" height="60" class="process-box" rx="8"/>
  <text x="300" y="80" class="header" text-anchor="middle" fill="white">Formulate</text>
  <text x="300" y="95" class="text" text-anchor="middle" fill="white">H₀ and H₁</text>
  <text x="300" y="110" class="text" text-anchor="middle" fill="white">hypotheses</text>

  <!-- Step 3: Collect Data -->
  <rect x="410" y="60" width="140" height="60" class="box" rx="8"/>
  <text x="480" y="80" class="header" text-anchor="middle">Collect Data</text>
  <text x="480" y="95" class="text" text-anchor="middle">Sample from</text>
  <text x="480" y="110" class="text" text-anchor="middle">population</text>

  <!-- Step 4: Calculate Test Statistic -->
  <rect x="590" y="60" width="140" height="60" class="process-box" rx="8"/>
  <text x="660" y="80" class="header" text-anchor="middle" fill="white">Calculate</text>
  <text x="660" y="95" class="text" text-anchor="middle" fill="white">Test Statistic</text>
  <text x="660" y="110" class="text" text-anchor="middle" fill="white">and P-value</text>

  <!-- Decision Diamond -->
  <polygon points="400,180 450,220 400,260 350,220" class="decision-box"/>
  <text x="400" y="215" class="text" text-anchor="middle" fill="white">p ≤ α?</text>
  <text x="400" y="230" class="text" text-anchor="middle" fill="white">Decision</text>

  <!-- Reject H₀ -->
  <rect x="200" y="320" width="140" height="60" class="result-box" rx="8"/>
  <text x="270" y="340" class="header" text-anchor="middle" fill="white">Reject H₀</text>
  <text x="270" y="355" class="text" text-anchor="middle" fill="white">Evidence supports</text>
  <text x="270" y="370" class="text" text-anchor="middle" fill="white">alternative hypothesis</text>

  <!-- Fail to Reject H₀ -->
  <rect x="460" y="320" width="140" height="60" class="result-box" rx="8"/>
  <text x="530" y="340" class="header" text-anchor="middle" fill="white">Fail to Reject H₀</text>
  <text x="530" y="355" class="text" text-anchor="middle" fill="white">Insufficient evidence</text>
  <text x="530" y="370" class="text" text-anchor="middle" fill="white">against null</text>

  <!-- Arrows -->
  <line x1="190" y1="90" x2="230" y2="90" class="arrow"/>
  <line x1="370" y1="90" x2="410" y2="90" class="arrow"/>
  <line x1="550" y1="90" x2="590" y2="90" class="arrow"/>
  <line x1="600" y1="120" x2="400" y2="180" class="arrow"/>
  <line x1="350" y1="220" x2="270" y2="320" class="arrow"/>
  <line x1="450" y1="220" x2="530" y2="320" class="arrow"/>

  <!-- Labels for decision paths -->
  <text x="300" y="270" class="small-text">Yes (p ≤ α)</text>
  <text x="480" y="270" class="small-text">No (p &gt; α)</text>

  <!-- Key Concepts Box -->
  <rect x="50" y="420" width="700" height="60" class="box" rx="8"/>
  <text x="70" y="440" class="header">Key Concepts:</text>
  <text x="70" y="455" class="text">• H₀ (Null): Status quo or no effect  • H₁ (Alternative): What we want to prove  • α: Significance level (usually 0.05)</text>
  <text x="70" y="470" class="text">• p-value: Probability of observing data if H₀ is true  • Test Statistic: Standardized measure of evidence</text>

</svg>