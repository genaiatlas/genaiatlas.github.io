<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4285f4;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#1a73e8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="partGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#34a853;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#137333;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="objectGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ea4335;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#d33b2c;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.15)"/>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#5f6368" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#202124">
    Feature Detection Progression: Car Recognition Example
  </text>

  <!-- Stage 1: Edge Detection -->
  <rect x="50" y="80" width="320" height="200" fill="url(#edgeGrad)" stroke="#1a73e8" stroke-width="3" rx="15" filter="url(#shadow)"/>
  <text x="210" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white">
    Stage 1: Edge Detection
  </text>
  <text x="210" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">
    First Hidden Layer
  </text>

  <!-- Edge examples with visual representations -->
  <g stroke="white" stroke-width="3" fill="white">
    <!-- Horizontal edges -->
    <line x1="80" y1="160" x2="130" y2="160"/>
    <text x="105" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">Horizontal</text>
    
    <!-- Vertical edges -->
    <line x1="160" y1="150" x2="160" y2="200"/>
    <text x="160" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">Vertical</text>
    
    <!-- Diagonal edges -->
    <line x1="190" y1="150" x2="230" y2="190"/>
    <text x="210" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">Diagonal</text>
    
    <!-- Curved edges -->
    <path d="M 260 160 Q 285 140 310 160" stroke="white" stroke-width="3" fill="none"/>
    <text x="285" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">Curved</text>
  </g>

  <!-- Mathematical representation for edge detection -->
  <text x="210" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    Edge = σ(W₁ * pixel_values + b₁)
  </text>

  <!-- Arrow 1 -->
  <path d="M 380 180 L 430 180" stroke="#5f6368" stroke-width="4" fill="none" marker-end="url(#arrowhead)"/>
  <text x="405" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5f6368" font-weight="bold">Combine</text>

  <!-- Stage 2: Object Parts -->
  <rect x="450" y="80" width="320" height="200" fill="url(#partGrad)" stroke="#137333" stroke-width="3" rx="15" filter="url(#shadow)"/>
  <text x="610" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white">
    Stage 2: Object Parts
  </text>
  <text x="610" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">
    Second Hidden Layer
  </text>

  <!-- Object parts with detailed visual representations -->
  <g stroke="white" stroke-width="2" fill="none">
    <!-- Wheel (combination of circular edges) -->
    <circle cx="500" cy="170" r="20"/>
    <circle cx="500" cy="170" r="12"/>
    <circle cx="495" cy="165" r="2" fill="white"/>
    <circle cx="505" cy="175" r="2" fill="white"/>
    <text x="500" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white" font-weight="bold">Wheel</text>
    
    <!-- Car body (rectangular combination) -->
    <rect x="540" y="150" width="50" height="30" rx="8"/>
    <rect x="545" y="155" width="15" height="12" rx="2"/>
    <rect x="570" y="155" width="15" height="12" rx="2"/>
    <text x="565" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white" font-weight="bold">Body</text>
    
    <!-- Headlight -->
    <ellipse cx="630" cy="165" rx="15" ry="12"/>
    <ellipse cx="630" cy="165" rx="8" ry="6" fill="white" opacity="0.5"/>
    <text x="630" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white" font-weight="bold">Headlight</text>
    
    <!-- Window -->
    <rect x="680" y="155" width="25" height="18" rx="3"/>
    <line x1="685" y1="155" x2="685" y2="173"/>
    <line x1="700" y1="155" x2="700" y2="173"/>
    <text x="692" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white" font-weight="bold">Window</text>
  </g>

  <!-- Mathematical representation for parts -->
  <text x="610" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    Part = σ(W₂ * edges + b₂)
  </text>

  <!-- Arrow 2 -->
  <path d="M 780 180 L 830 180" stroke="#5f6368" stroke-width="4" fill="none" marker-end="url(#arrowhead)"/>
  <text x="805" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5f6368" font-weight="bold">Assemble</text>

  <!-- Stage 3: Complete Objects -->
  <rect x="850" y="80" width="300" height="200" fill="url(#objectGrad)" stroke="#d33b2c" stroke-width="3" rx="15" filter="url(#shadow)"/>
  <text x="1000" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white">
    Stage 3: Complete Objects
  </text>
  <text x="1000" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">
    Third Hidden Layer
  </text>

  <!-- Complete car assembly -->
  <g stroke="white" stroke-width="2" fill="none">
    <!-- Main car body -->
    <rect x="920" y="155" width="80" height="35" rx="8"/>
    <!-- Windshield -->
    <polygon points="930,155 970,155 965,145 935,145" fill="none"/>
    <!-- Front wheels -->
    <circle cx="935" cy="200" r="12"/>
    <circle cx="935" cy="200" r="7"/>
    <!-- Rear wheels -->
    <circle cx="985" cy="200" r="12"/>
    <circle cx="985" cy="200" r="7"/>
    <!-- Headlights -->
    <ellipse cx="1005" cy="170" rx="6" ry="8"/>
    <!-- Side windows -->
    <rect x="940" y="160" width="12" height="10" rx="2"/>
    <rect x="955" y="160" width="12" height="10" rx="2"/>
    <!-- Door lines -->
    <line x1="950" y1="155" x2="950" y2="190"/>
  </g>

  <text x="1000" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
    Complete Car
  </text>

  <!-- Mathematical representation for complete object -->
  <text x="1000" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    Car = σ(W₃ * parts + b₃)
  </text>

  <!-- Feature Detail Section -->
  <rect x="50" y="320" width="1100" height="200" fill="#ffffff" stroke="#dadce0" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="600" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#202124">
    Detailed Feature Learning Process
  </text>

  <!-- Edge detection details -->
  <rect x="80" y="370" width="300" height="130" fill="#e3f2fd" stroke="#1976d2" stroke-width="1" rx="8"/>
  <text x="230" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1976d2">
    Edge Detection Filters
  </text>
  
  <!-- Sobel filter examples -->
  <g font-family="monospace" font-size="10" fill="#1976d2">
    <text x="100" y="415">Horizontal: [-1 -2 -1]</text>
    <text x="100" y="430">           [ 0  0  0]</text>
    <text x="100" y="445">           [ 1  2  1]</text>
    
    <text x="220" y="415">Vertical: [-1  0  1]</text>
    <text x="220" y="430">          [-2  0  2]</text>
    <text x="220" y="445">          [-1  0  1]</text>
  </g>
  
  <text x="230" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5f6368">
    • Detect intensity gradients
  </text>
  <text x="230" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5f6368">
    • Respond to changes in pixel values
  </text>

  <!-- Part detection details -->
  <rect x="450" y="370" width="300" height="130" fill="#e8f5e8" stroke="#2e7d32" stroke-width="1" rx="8"/>
  <text x="600" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2e7d32">
    Part Assembly Logic
  </text>
  
  <text x="600" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#2e7d32">
    Wheel = Circular_edges + Center_point
  </text>
  <text x="600" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#2e7d32">
    Body = Rectangular_edges + Corner_detection
  </text>
  <text x="600" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#2e7d32">
    Window = Transparent_region + Frame_edges
  </text>
  
  <text x="600" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5f6368">
    • Combines multiple edge patterns
  </text>
  <text x="600" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5f6368">
    • Creates meaningful object components
  </text>

  <!-- Object recognition details -->
  <rect x="820" y="370" width="300" height="130" fill="#fce8e6" stroke="#c62828" stroke-width="1" rx="8"/>
  <text x="970" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#c62828">
    Object Recognition
  </text>
  
  <text x="970" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#c62828">
    Car = Body + Wheels + Windows + Lights
  </text>
  <text x="970" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#c62828">
    Confidence = Sum(part_confidence * weights)
  </text>
  <text x="970" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#c62828">
    Classification = argmax(object_scores)
  </text>
  
  <text x="970" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5f6368">
    • Spatial relationship validation
  </text>
  <text x="970" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5f6368">
    • Context-aware object classification
  </text>

  <!-- Information flow arrows -->
  <rect x="50" y="550" width="1100" height="200" fill="#f1f3f4" stroke="#dadce0" stroke-width="1" rx="10"/>
  <text x="600" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#202124">
    Information Flow and Ensemble Decision Making
  </text>

  <!-- Flow diagram -->
  <rect x="100" y="610" width="120" height="50" fill="#4285f4" stroke="#1565c0" stroke-width="2" rx="8"/>
  <text x="160" y="630" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Raw Pixels</text>
  <text x="160" y="645" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">784 features</text>

  <path d="M 230 635 L 270 635" stroke="#5f6368" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>

  <rect x="290" y="610" width="120" height="50" fill="#34a853" stroke="#2e7d32" stroke-width="2" rx="8"/>
  <text x="350" y="630" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Edge Features</text>
  <text x="350" y="645" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">512 neurons</text>

  <path d="M 420 635 L 460 635" stroke="#5f6368" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>

  <rect x="480" y="610" width="120" height="50" fill="#ff9800" stroke="#ef6c00" stroke-width="2" rx="8"/>
  <text x="540" y="630" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Part Features</text>
  <text x="540" y="645" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">256 neurons</text>

  <path d="M 610 635 L 650 635" stroke="#5f6368" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>

  <rect x="670" y="610" width="120" height="50" fill="#ea4335" stroke="#c62828" stroke-width="2" rx="8"/>
  <text x="730" y="630" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Object Class</text>
  <text x="730" y="645" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">10 classes</text>

  <!-- Ensemble decision explanation -->
  <rect x="850" y="595" width="280" height="120" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="8"/>
  <text x="990" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#e65100">
    🔄 Ensemble Decisions
  </text>
  <text x="990" y="645" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5f6368">
    • Multiple neurons vote on features
  </text>
  <text x="990" y="665" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5f6368">
    • Weighted combinations of simple classifiers
  </text>
  <text x="990" y="685" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5f6368">
    • Robust to individual neuron errors
  </text>
  <text x="990" y="705" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5f6368">
    • Emergent complex behavior
  </text>
</svg>