<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="forwardGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00b894;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00a085;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dataGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#74b9ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0984e3;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <marker id="forwardArrow" markerWidth="12" markerHeight="12" refX="10" refY="3" orient="auto">
      <path d="M0,0 L0,6 L12,3 z" fill="#00b894"/>
    </marker>
    <marker id="dataArrow" markerWidth="10" markerHeight="10" refX="8" refY="2" orient="auto">
      <path d="M0,0 L0,4 L10,2 z" fill="#2d3436"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="700" fill="#fafafa"/>
  
  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">
    Forward Propagation: Information Flow Through Network
  </text>
  
  <!-- Forward Flow Indicator -->
  <g transform="translate(50, 50)">
    <rect x="0" y="0" width="900" height="40" fill="url(#forwardGrad)" rx="20"/>
    <text x="450" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="white" font-weight="bold">
      Forward Direction: Input → Hidden → Output → Loss
    </text>
  </g>
  
  <!-- Step 1: Input Layer -->
  <g transform="translate(80, 150)">
    <rect x="0" y="0" width="120" height="200" fill="white" stroke="#74b9ff" stroke-width="3" rx="10" filter="url(#shadow)"/>
    <text x="60" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0984e3">
      Step 1: Input
    </text>
    
    <!-- Input values -->
    <circle cx="60" cy="60" r="20" fill="url(#dataGrad)" filter="url(#shadow)"/>
    <text x="60" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white" font-weight="bold">x₁</text>
    <text x="60" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Value: 0.8</text>
    
    <circle cx="60" cy="130" r="20" fill="url(#dataGrad)" filter="url(#shadow)"/>
    <text x="60" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white" font-weight="bold">x₂</text>
    <text x="60" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Value: 0.3</text>
    
    <text x="60" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d" font-style="italic">
      Raw features
    </text>
  </g>
  
  <!-- Arrow 1 -->
  <line x1="210" y1="250" x2="260" y2="250" stroke="#00b894" stroke-width="4" marker-end="url(#forwardArrow)"/>
  <text x="235" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#00b894" font-weight="bold">
    Multiply by weights
  </text>
  
  <!-- Step 2: Preactivation -->
  <g transform="translate(280, 150)">
    <rect x="0" y="0" width="140" height="200" fill="white" stroke="#00cec9" stroke-width="3" rx="10" filter="url(#shadow)"/>
    <text x="70" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#00b894">
      Step 2: Preactivation
    </text>
    
    <!-- Weighted sums -->
    <rect x="10" y="40" width="120" height="35" fill="#f0f9ff" stroke="#00cec9" stroke-width="1" rx="5"/>
    <text x="70" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50" font-weight="bold">
      z₁ = w₁₁x₁ + w₁₂x₂
    </text>
    <text x="70" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">
      = 0.5×0.8 + 0.3×0.3 = 0.49
    </text>
    
    <rect x="10" y="90" width="120" height="35" fill="#f0f9ff" stroke="#00cec9" stroke-width="1" rx="5"/>
    <text x="70" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50" font-weight="bold">
      z₂ = w₂₁x₁ + w₂₂x₂
    </text>
    <text x="70" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">
      = 0.2×0.8 + 0.7×0.3 = 0.37
    </text>
    
    <!-- Weights visualization -->
    <g transform="translate(10, 140)">
      <text x="60" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#636e72" font-weight="bold">Weights:</text>
      <text x="20" y="25" font-family="Arial, sans-serif" font-size="8" fill="#636e72">w₁₁=0.5</text>
      <text x="70" y="25" font-family="Arial, sans-serif" font-size="8" fill="#636e72">w₁₂=0.3</text>
      <text x="20" y="38" font-family="Arial, sans-serif" font-size="8" fill="#636e72">w₂₁=0.2</text>
      <text x="70" y="38" font-family="Arial, sans-serif" font-size="8" fill="#636e72">w₂₂=0.7</text>
    </g>
  </g>
  
  <!-- Arrow 2 -->
  <line x1="430" y1="250" x2="480" y2="250" stroke="#00b894" stroke-width="4" marker-end="url(#forwardArrow)"/>
  <text x="455" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#00b894" font-weight="bold">
    Apply ReLU
  </text>
  
  <!-- Step 3: Hidden Activation -->
  <g transform="translate(500, 150)">
    <rect x="0" y="0" width="120" height="200" fill="white" stroke="#fd79a8" stroke-width="3" rx="10" filter="url(#shadow)"/>
    <text x="60" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e84393">
      Step 3: Activation
    </text>
    
    <!-- Activated values -->
    <circle cx="60" cy="70" r="25" fill="#fd79a8" filter="url(#shadow)"/>
    <text x="60" y="67" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" font-weight="bold">a₁</text>
    <text x="60" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">ReLU(z₁)</text>
    <text x="60" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">
      = max(0, 0.49) = 0.49
    </text>
    
    <circle cx="60" cy="140" r="25" fill="#fd79a8" filter="url(#shadow)"/>
    <text x="60" y="137" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" font-weight="bold">a₂</text>
    <text x="60" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">ReLU(z₂)</text>
    <text x="60" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">
      = max(0, 0.37) = 0.37
    </text>
  </g>
  
  <!-- Arrow 3 -->
  <line x1="630" y1="250" x2="680" y2="250" stroke="#00b894" stroke-width="4" marker-end="url(#forwardArrow)"/>
  <text x="655" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#00b894" font-weight="bold">
    Output weights
  </text>
  
  <!-- Step 4: Output Preactivation -->
  <g transform="translate(700, 150)">
    <rect x="0" y="0" width="120" height="200" fill="white" stroke="#fdcb6e" stroke-width="3" rx="10" filter="url(#shadow)"/>
    <text x="60" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f39c12">
      Step 4: Output
    </text>
    
    <!-- Output sum -->
    <rect x="10" y="50" width="100" height="50" fill="#fff5e6" stroke="#fdcb6e" stroke-width="2" rx="5"/>
    <text x="60" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50" font-weight="bold">
      z = v₁a₁ + v₂a₂
    </text>
    <text x="60" y="83" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">
      = 0.6×0.49 + 0.4×0.37
    </text>
    <text x="60" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">
      = 0.442
    </text>
    
    <!-- Output activation -->
    <circle cx="60" cy="140" r="20" fill="#fdcb6e" filter="url(#shadow)"/>
    <text x="60" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white" font-weight="bold">ŷ</text>
    <text x="60" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">
      σ(0.442) = 0.609
    </text>
  </g>
  
  <!-- Arrow 4 -->
  <line x1="830" y1="250" x2="880" y2="250" stroke="#00b894" stroke-width="4" marker-end="url(#forwardArrow)"/>
  <text x="855" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#00b894" font-weight="bold">
    Compare with target
  </text>
  
  <!-- Step 5: Loss -->
  <g transform="translate(900, 190)">
    <rect x="0" y="0" width="80" height="120" fill="white" stroke="#e17055" stroke-width="3" rx="10" filter="url(#shadow)"/>
    <text x="40" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#d63031">
      Loss
    </text>
    
    <circle cx="40" cy="60" r="18" fill="#e17055" filter="url(#shadow)"/>
    <text x="40" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" font-weight="bold">ℒ</text>
    
    <text x="40" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">
      Target: y = 1
    </text>
    <text x="40" y="97" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">
      Prediction: ŷ = 0.609
    </text>
    <text x="40" y="109" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">
      Error: 0.391
    </text>
  </g>
  
  <!-- Mathematical Flow Equations -->
  <g transform="translate(50, 400)">
    <rect x="0" y="0" width="900" height="260" fill="white" stroke="#bdc3c7" stroke-width="2" rx="10" filter="url(#shadow)"/>
    
    <text x="450" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">
      Complete Forward Pass Mathematical Flow
    </text>
    
    <!-- Step equations -->
    <g transform="translate(20, 40)">
      <!-- Input to Hidden -->
      <rect x="0" y="10" width="200" height="60" fill="#e8f4fd" stroke="#74b9ff" stroke-width="1" rx="5"/>
      <text x="100" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50" font-weight="bold">
        Hidden Layer Preactivation
      </text>
      <text x="100" y="40" text-anchor="middle" font-family="Monaco, monospace" font-size="9" fill="#2c3e50">
        z₁ = w₁₁x₁ + w₁₂x₂ + b₁
      </text>
      <text x="100" y="52" text-anchor="middle" font-family="Monaco, monospace" font-size="9" fill="#2c3e50">
        z₂ = w₂₁x₁ + w₂₂x₂ + b₂
      </text>
      <text x="100" y="64" text-anchor="middle" font-family="Monaco, monospace" font-size="9" fill="#2c3e50">
        ... for all hidden units
      </text>
      
      <!-- Hidden Activation -->
      <rect x="220" y="10" width="200" height="60" fill="#e8f6e8" stroke="#00b894" stroke-width="1" rx="5"/>
      <text x="320" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50" font-weight="bold">
        Hidden Layer Activation
      </text>
      <text x="320" y="40" text-anchor="middle" font-family="Monaco, monospace" font-size="9" fill="#2c3e50">
        a₁ = ReLU(z₁) = max(0, z₁)
      </text>
      <text x="320" y="52" text-anchor="middle" font-family="Monaco, monospace" font-size="9" fill="#2c3e50">
        a₂ = ReLU(z₂) = max(0, z₂)
      </text>
      <text x="320" y="64" text-anchor="middle" font-family="Monaco, monospace" font-size="9" fill="#2c3e50">
        ... element-wise operation
      </text>
      
      <!-- Output Layer -->
      <rect x="440" y="10" width="200" height="60" fill="#fff9e6" stroke="#fdcb6e" stroke-width="1" rx="5"/>
      <text x="540" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50" font-weight="bold">
        Output Layer
      </text>
      <text x="540" y="40" text-anchor="middle" font-family="Monaco, monospace" font-size="9" fill="#2c3e50">
        z = Σᵢ vᵢaᵢ + c
      </text>
      <text x="540" y="52" text-anchor="middle" font-family="Monaco, monospace" font-size="9" fill="#2c3e50">
        ŷ = σ(z) = 1/(1 + e⁻ᶻ)
      </text>
      <text x="540" y="64" text-anchor="middle" font-family="Monaco, monospace" font-size="9" fill="#2c3e50">
        Sigmoid activation
      </text>
      
      <!-- Loss Function -->
      <rect x="660" y="10" width="200" height="60" fill="#ffe6e6" stroke="#e17055" stroke-width="1" rx="5"/>
      <text x="760" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50" font-weight="bold">
        Loss Computation
      </text>
      <text x="760" y="40" text-anchor="middle" font-family="Monaco, monospace" font-size="9" fill="#2c3e50">
        ℒ = -[y log(ŷ) + (1-y) log(1-ŷ)]
      </text>
      <text x="760" y="52" text-anchor="middle" font-family="Monaco, monospace" font-size="9" fill="#2c3e50">
        Binary cross-entropy
      </text>
      <text x="760" y="64" text-anchor="middle" font-family="Monaco, monospace" font-size="9" fill="#2c3e50">
        Measures prediction error
      </text>
    </g>
    
    <!-- Flow arrows -->
    <g transform="translate(20, 115)">
      <line x1="200" y1="0" x2="220" y2="0" stroke="#00b894" stroke-width="2" marker-end="url(#forwardArrow)"/>
      <line x1="420" y1="0" x2="440" y2="0" stroke="#00b894" stroke-width="2" marker-end="url(#forwardArrow)"/>
      <line x1="640" y1="0" x2="660" y2="0" stroke="#00b894" stroke-width="2" marker-end="url(#forwardArrow)"/>
    </g>
    
    <!-- Key Properties -->
    <g transform="translate(20, 140)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50" font-weight="bold">
        Forward Propagation Key Properties:
      </text>
      
      <g transform="translate(0, 20)">
        <circle cx="5" cy="5" r="3" fill="#74b9ff"/>
        <text x="15" y="10" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
          <tspan font-weight="bold">Sequential Processing:</tspan> Each layer processes the output of the previous layer
        </text>
        
        <circle cx="5" cy="25" r="3" fill="#00b894"/>
        <text x="15" y="30" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
          <tspan font-weight="bold">Non-linearity:</tspan> ReLU activation enables learning of complex patterns
        </text>
        
        <circle cx="5" cy="45" r="3" fill="#fdcb6e"/>
        <text x="15" y="50" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
          <tspan font-weight="bold">Information Transformation:</tspan> Each layer transforms input to more useful representation
        </text>
        
        <circle cx="5" cy="65" r="3" fill="#e17055"/>
        <text x="15" y="70" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
          <tspan font-weight="bold">Deterministic:</tspan> Given same inputs and weights, output is always the same
        </text>
        
        <circle cx="5" cy="85" r="3" fill="#fd79a8"/>
        <text x="15" y="90" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
          <tspan font-weight="bold">Differentiable:</tspan> All operations are differentiable, enabling backpropagation
        </text>
      </g>
    </g>
  </g>
</svg>