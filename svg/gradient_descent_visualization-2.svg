<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bowlGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e3f2fd;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#bbdefb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#90caf9;stop-opacity:1" />
    </linearGradient>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
            refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d32f2f" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1565c0">
    Gradient Descent Optimization Process
  </text>
  
  <!-- Cost function bowl shape -->
  <path d="M 100 400 Q 400 200 700 400" stroke="#1976d2" stroke-width="3" fill="url(#bowlGradient)" opacity="0.7"/>
  
  <!-- Grid lines -->
  <g stroke="#e0e0e0" stroke-width="1" opacity="0.5">
    <line x1="100" y1="450" x2="700" y2="450"/>
    <line x1="200" y1="440" x2="200" y2="460"/>
    <line x1="300" y1="440" x2="300" y2="460"/>
    <line x1="400" y1="440" x2="400" y2="460"/>
    <line x1="500" y1="440" x2="500" y2="460"/>
    <line x1="600" y1="440" x2="600" y2="460"/>
  </g>
  
  <!-- Axes -->
  <line x1="100" y1="450" x2="700" y2="450" stroke="#333" stroke-width="2"/>
  <text x="400" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#333">Weight Values</text>
  
  <line x1="100" y1="450" x2="100" y2="150" stroke="#333" stroke-width="2"/>
  <text x="70" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#333" transform="rotate(-90, 70, 300)">Cost Function</text>
  
  <!-- Initial position -->
  <circle cx="200" cy="280" r="6" fill="#f44336"/>
  <text x="200" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#f44336">Initial Weight</text>
  
  <!-- Gradient descent path -->
  <path d="M 200 280 Q 250 260 300 250 Q 350 240 400 200" stroke="#d32f2f" stroke-width="3" 
        fill="none" marker-end="url(#arrowhead)" stroke-dasharray="5,5"/>
  
  <!-- Step indicators -->
  <circle cx="250" cy="260" r="4" fill="#ff5722"/>
  <text x="250" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#ff5722">Step 1</text>
  
  <circle cx="300" cy="250" r="4" fill="#ff9800"/>
  <text x="300" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#ff9800">Step 2</text>
  
  <circle cx="350" cy="240" r="4" fill="#ffc107"/>
  <text x="350" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#ffc107">Step 3</text>
  
  <!-- Global minimum -->
  <circle cx="400" cy="200" r="8" fill="#4caf50"/>
  <text x="400" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#4caf50">Global Minimum</text>
  
  <!-- Gradient arrows -->
  <g stroke="#e91e63" stroke-width="2" marker-end="url(#arrowhead)">
    <line x1="200" y1="290" x2="230" y2="285"/>
    <line x1="250" y1="270" x2="275" y2="265"/>
    <line x1="300" y1="260" x2="320" y2="255"/>
  </g>
  
  <!-- Algorithm steps box -->
  <rect x="520" y="80" width="250" height="200" rx="5" fill="#f5f5f5" stroke="#1976d2" stroke-width="2"/>
  <text x="645" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1976d2">
    Gradient Descent Steps
  </text>
  
  <text x="535" y="130" font-family="Arial, sans-serif" font-size="12" fill="#333">
    <tspan x="535" y="130">1. Initialize random weights</tspan>
    <tspan x="535" y="150">2. Calculate cost function</tspan>
    <tspan x="535" y="170">3. Compute gradient ∇C</tspan>
    <tspan x="535" y="190">4. Update: w = w - α∇C</tspan>
    <tspan x="535" y="210">5. Repeat until convergence</tspan>
  </text>
  
  <!-- Learning rate indicator -->
  <text x="535" y="245" font-family="Arial, sans-serif" font-size="11" fill="#666">
    α = learning rate
  </text>
  <text x="535" y="260" font-family="Arial, sans-serif" font-size="11" fill="#666">
    ∇C = gradient of cost function
  </text>
</svg>