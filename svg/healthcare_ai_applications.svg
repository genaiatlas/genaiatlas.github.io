<svg width="800" height="700" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="700" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1e293b">
    Healthcare AI Applications
  </text>
  
  <!-- Diagnostic Systems Section -->
  <rect x="50" y="80" width="300" height="180" rx="10" fill="#ef4444" stroke="#dc2626" stroke-width="2"/>
  <text x="200" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
    Diagnostic and Clinical Decision Support
  </text>
  
  <!-- Medical Imaging -->
  <circle cx="120" cy="140" r="25" fill="#f87171" stroke="#dc2626" stroke-width="2"/>
  <text x="120" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#dc2626">
    MI
  </text>
  <text x="120" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Medical Imaging
  </text>
  
  <!-- Pathology -->
  <circle cx="200" cy="140" r="25" fill="#f87171" stroke="#dc2626" stroke-width="2"/>
  <text x="200" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#dc2626">
    PA
  </text>
  <text x="200" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Pathology
  </text>
  
  <!-- Radiology -->
  <circle cx="280" cy="140" r="25" fill="#f87171" stroke="#dc2626" stroke-width="2"/>
  <text x="280" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#dc2626">
    RA
  </text>
  <text x="280" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Radiology
  </text>
  
  <!-- Clinical Decision Support -->
  <circle cx="160" cy="210" r="25" fill="#f87171" stroke="#dc2626" stroke-width="2"/>
  <text x="160" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#dc2626">
    CD
  </text>
  <text x="160" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Clinical Decision
  </text>
  
  <!-- Patient Monitoring Section -->
  <rect x="450" y="80" width="300" height="180" rx="10" fill="#059669" stroke="#047857" stroke-width="2"/>
  <text x="600" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
    Patient Monitoring and Analytics
  </text>
  
  <!-- Vital Signs -->
  <circle cx="520" cy="140" r="25" fill="#34d399" stroke="#047857" stroke-width="2"/>
  <text x="520" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#047857">
    VS
  </text>
  <text x="520" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Vital Signs
  </text>
  
  <!-- Risk Stratification -->
  <circle cx="600" cy="140" r="25" fill="#34d399" stroke="#047857" stroke-width="2"/>
  <text x="600" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#047857">
    RS
  </text>
  <text x="600" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Risk Assessment
  </text>
  
  <!-- Readmission Prevention -->
  <circle cx="680" cy="140" r="25" fill="#34d399" stroke="#047857" stroke-width="2"/>
  <text x="680" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#047857">
    RP
  </text>
  <text x="680" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Readmission Prev
  </text>
  
  <!-- Medication Management -->
  <circle cx="560" cy="210" r="25" fill="#34d399" stroke="#047857" stroke-width="2"/>
  <text x="560" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#047857">
    MM
  </text>
  <text x="560" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Medication Mgmt
  </text>
  
  <!-- Electronic Health Records -->
  <circle cx="640" cy="210" r="25" fill="#34d399" stroke="#047857" stroke-width="2"/>
  <text x="640" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#047857">
    EH
  </text>
  <text x="640" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    EHR Integration
  </text>
  
  <!-- Precision Medicine Section -->
  <rect x="250" y="300" width="300" height="120" rx="10" fill="#8b5cf6" stroke="#7c3aed" stroke-width="2"/>
  <text x="400" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
    Precision Medicine
  </text>
  
  <!-- Genomics -->
  <circle cx="320" cy="360" r="25" fill="#a78bfa" stroke="#7c3aed" stroke-width="2"/>
  <text x="320" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#7c3aed">
    GE
  </text>
  <text x="320" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Genomics
  </text>
  
  <!-- Treatment Optimization -->
  <circle cx="400" cy="360" r="25" fill="#a78bfa" stroke="#7c3aed" stroke-width="2"/>
  <text x="400" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#7c3aed">
    TO
  </text>
  <text x="400" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Treatment Opt
  </text>
  
  <!-- Drug Discovery -->
  <circle cx="480" cy="360" r="25" fill="#a78bfa" stroke="#7c3aed" stroke-width="2"/>
  <text x="480" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#7c3aed">
    DD
  </text>
  <text x="480" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Drug Discovery
  </text>
  
  <!-- Diagnostic Accuracy Formula -->
  <rect x="50" y="450" width="350" height="120" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="225" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#334155">
    Diagnostic Accuracy Model
  </text>
  <text x="225" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">
    Accuracy = (TP + TN) / (TP + TN + FP + FN)
  </text>
  <text x="70" y="525" font-family="Arial, sans-serif" font-size="10" fill="#64748b">
    Where: TP = True Positives, TN = True Negatives
  </text>
  <text x="70" y="540" font-family="Arial, sans-serif" font-size="10" fill="#64748b">
    FP = False Positives, FN = False Negatives
  </text>
  <text x="70" y="555" font-family="Arial, sans-serif" font-size="10" fill="#64748b">
    Target Accuracy: 95-99% for clinical applications
  </text>
  
  <!-- Clinical Outcomes -->
  <rect x="450" y="450" width="300" height="120" rx="10" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
  <text x="600" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    Clinical Outcomes
  </text>
  <text x="470" y="500" font-family="Arial, sans-serif" font-size="11" fill="white">
    • Diagnostic accuracy: +15-30%
  </text>
  <text x="470" y="520" font-family="Arial, sans-serif" font-size="11" fill="white">
    • Treatment response: +25-40%
  </text>
  <text x="470" y="540" font-family="Arial, sans-serif" font-size="11" fill="white">
    • Hospital readmissions: -20-35%
  </text>
  <text x="470" y="560" font-family="Arial, sans-serif" font-size="11" fill="white">
    • Medication errors: -50-70%
  </text>
  
  <!-- Regulatory and Compliance -->
  <rect x="50" y="590" width="340" height="80" rx="10" fill="#64748b" stroke="#475569" stroke-width="2"/>
  <text x="220" y="615" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    Regulatory Compliance
  </text>
  <text x="220" y="635" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    HIPAA | FDA 510(k) | Clinical Guidelines
  </text>
  <text x="220" y="650" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Data Privacy | Patient Safety | Audit Trails
  </text>
  
  <!-- Technology Stack -->
  <rect x="410" y="590" width="340" height="80" rx="10" fill="#6366f1" stroke="#4f46e5" stroke-width="2"/>
  <text x="580" y="615" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    Healthcare Technology Stack
  </text>
  <text x="580" y="635" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    FHIR | HL7 | DICOM | Cloud: AWS HIPAA, Azure Healthcare
  </text>
  <text x="580" y="650" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    ML: TensorFlow, PyTorch | Specialized: MONAI, SimpleITK
  </text>
  
  <!-- Connection Lines -->
  <line x1="350" y1="180" x2="390" y2="300" stroke="#64748b" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="450" y1="180" x2="410" y2="300" stroke="#64748b" stroke-width="2" stroke-dasharray="5,5"/>
</svg>