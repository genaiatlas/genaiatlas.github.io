<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="600" y="40" font-size="28" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Kalman Filter Overview</text>
  
  <!-- Hidden State Chain -->
  <text x="150" y="100" font-size="18" font-weight="bold" fill="#2c5aa0">Hidden States (Xₜ)</text>
  
  <!-- State nodes X1, X2, X3, X4, Xt -->
  <circle cx="150" cy="200" r="40" fill="#e3f2fd" stroke="#2c5aa0" stroke-width="3"/>
  <text x="150" y="205" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c5aa0">X₁</text>
  
  <circle cx="350" cy="200" r="40" fill="#e3f2fd" stroke="#2c5aa0" stroke-width="3"/>
  <text x="350" y="205" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c5aa0">X₂</text>
  
  <circle cx="550" cy="200" r="40" fill="#e3f2fd" stroke="#2c5aa0" stroke-width="3"/>
  <text x="550" y="205" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c5aa0">X₃</text>
  
  <circle cx="750" cy="200" r="40" fill="#e3f2fd" stroke="#2c5aa0" stroke-width="3"/>
  <text x="750" y="205" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c5aa0">X₄</text>
  
  <text x="900" y="205" font-size="24" text-anchor="middle" fill="#666">···</text>
  
  <circle cx="1050" cy="200" r="40" fill="#e3f2fd" stroke="#2c5aa0" stroke-width="3"/>
  <text x="1050" y="205" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c5aa0">Xₜ</text>
  
  <!-- State transition arrows -->
  <defs>
    <marker id="arrowblue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2c5aa0"/>
    </marker>
    <marker id="arrowred" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#c62828"/>
    </marker>
  </defs>
  
  <line x1="190" y1="200" x2="310" y2="200" stroke="#2c5aa0" stroke-width="2" marker-end="url(#arrowblue)"/>
  <text x="250" y="185" font-size="16" text-anchor="middle" fill="#2c5aa0">A</text>
  
  <line x1="390" y1="200" x2="510" y2="200" stroke="#2c5aa0" stroke-width="2" marker-end="url(#arrowblue)"/>
  <text x="450" y="185" font-size="16" text-anchor="middle" fill="#2c5aa0">A</text>
  
  <line x1="590" y1="200" x2="710" y2="200" stroke="#2c5aa0" stroke-width="2" marker-end="url(#arrowblue)"/>
  <text x="650" y="185" font-size="16" text-anchor="middle" fill="#2c5aa0">A</text>
  
  <line x1="790" y1="200" x2="860" y2="200" stroke="#2c5aa0" stroke-width="2" marker-end="url(#arrowblue)"/>
  <text x="825" y="185" font-size="16" text-anchor="middle" fill="#2c5aa0">A</text>
  
  <line x1="940" y1="200" x2="1010" y2="200" stroke="#2c5aa0" stroke-width="2" marker-end="url(#arrowblue)"/>
  <text x="975" y="185" font-size="16" text-anchor="middle" fill="#2c5aa0">A</text>
  
  <!-- Process noise indicators -->
  <text x="150" y="270" font-size="14" text-anchor="middle" fill="#666">+ W₁</text>
  <text x="350" y="270" font-size="14" text-anchor="middle" fill="#666">+ W₂</text>
  <text x="550" y="270" font-size="14" text-anchor="middle" fill="#666">+ W₃</text>
  <text x="750" y="270" font-size="14" text-anchor="middle" fill="#666">+ W₄</text>
  <text x="1050" y="270" font-size="14" text-anchor="middle" fill="#666">+ Wₜ</text>
  
  <!-- Observations -->
  <text x="150" y="360" font-size="18" font-weight="bold" fill="#c62828">Observations (Yₜ)</text>
  
  <!-- Observation nodes Y1, Y2, Y3, Y4, Yt -->
  <rect x="110" y="420" width="80" height="60" rx="5" fill="#ffebee" stroke="#c62828" stroke-width="3"/>
  <text x="150" y="455" font-size="20" font-weight="bold" text-anchor="middle" fill="#c62828">Y₁</text>
  
  <rect x="310" y="420" width="80" height="60" rx="5" fill="#ffebee" stroke="#c62828" stroke-width="3"/>
  <text x="350" y="455" font-size="20" font-weight="bold" text-anchor="middle" fill="#c62828">Y₂</text>
  
  <rect x="510" y="420" width="80" height="60" rx="5" fill="#ffebee" stroke="#c62828" stroke-width="3"/>
  <text x="550" y="455" font-size="20" font-weight="bold" text-anchor="middle" fill="#c62828">Y₃</text>
  
  <rect x="710" y="420" width="80" height="60" rx="5" fill="#ffebee" stroke="#c62828" stroke-width="3"/>
  <text x="750" y="455" font-size="20" font-weight="bold" text-anchor="middle" fill="#c62828">Y₄</text>
  
  <text x="900" y="455" font-size="24" text-anchor="middle" fill="#666">···</text>
  
  <rect x="1010" y="420" width="80" height="60" rx="5" fill="#ffebee" stroke="#c62828" stroke-width="3"/>
  <text x="1050" y="455" font-size="20" font-weight="bold" text-anchor="middle" fill="#c62828">Yₜ</text>
  
  <!-- Observation edges -->
  <line x1="150" y1="240" x2="150" y2="420" stroke="#c62828" stroke-width="2" marker-end="url(#arrowred)"/>
  <text x="165" y="330" font-size="16" fill="#c62828">B</text>
  
  <line x1="350" y1="240" x2="350" y2="420" stroke="#c62828" stroke-width="2" marker-end="url(#arrowred)"/>
  <text x="365" y="330" font-size="16" fill="#c62828">B</text>
  
  <line x1="550" y1="240" x2="550" y2="420" stroke="#c62828" stroke-width="2" marker-end="url(#arrowred)"/>
  <text x="565" y="330" font-size="16" fill="#c62828">B</text>
  
  <line x1="750" y1="240" x2="750" y2="420" stroke="#c62828" stroke-width="2" marker-end="url(#arrowred)"/>
  <text x="765" y="330" font-size="16" fill="#c62828">B</text>
  
  <line x1="1050" y1="240" x2="1050" y2="420" stroke="#c62828" stroke-width="2" marker-end="url(#arrowred)"/>
  <text x="1065" y="330" font-size="16" fill="#c62828">B</text>
  
  <!-- Measurement noise indicators -->
  <text x="150" y="510" font-size="14" text-anchor="middle" fill="#666">+ Z₁</text>
  <text x="350" y="510" font-size="14" text-anchor="middle" fill="#666">+ Z₂</text>
  <text x="550" y="510" font-size="14" text-anchor="middle" fill="#666">+ Z₃</text>
  <text x="750" y="510" font-size="14" text-anchor="middle" fill="#666">+ Z₄</text>
  <text x="1050" y="510" font-size="14" text-anchor="middle" fill="#666">+ Zₜ</text>
  
  <!-- Key equations box -->
  <rect x="50" y="560" width="1100" height="200" rx="10" fill="#f5f5f5" stroke="#666" stroke-width="2"/>
  
  <text x="600" y="595" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Kalman Filter Equations</text>
  
  <!-- State Evolution -->
  <text x="80" y="635" font-size="16" font-weight="bold" fill="#2c5aa0">State Evolution:</text>
  <text x="100" y="660" font-size="15" fill="#1a1a1a">Xₜ = A·Xₜ₋₁ + Wₜ</text>
  <text x="100" y="680" font-size="13" fill="#666">where Wₜ ~ N(0, Q)</text>
  
  <!-- Observation Model -->
  <text x="380" y="635" font-size="16" font-weight="bold" fill="#c62828">Observation Model:</text>
  <text x="400" y="660" font-size="15" fill="#1a1a1a">Yₜ = B·Xₜ + Zₜ</text>
  <text x="400" y="680" font-size="13" fill="#666">where Zₜ ~ N(0, R)</text>
  
  <!-- Goal -->
  <text x="700" y="635" font-size="16" font-weight="bold" fill="#00695c">Goal:</text>
  <text x="720" y="660" font-size="15" fill="#1a1a1a">Estimate P(Xₜ | Y₁, Y₂, ..., Yₜ)</text>
  <text x="720" y="680" font-size="13" fill="#666">Posterior distribution of state</text>
  
  <!-- Properties -->
  <text x="80" y="720" font-size="14" font-weight="bold" fill="#1a1a1a">Key Properties:</text>
  <text x="100" y="740" font-size="13" fill="#1a1a1a">• Recursive algorithm (no history storage)</text>
  <text x="380" y="740" font-size="13" fill="#1a1a1a">• Optimal for Gaussian systems</text>
  <text x="680" y="740" font-size="13" fill="#1a1a1a">• Real-time capable</text>
  <text x="920" y="740" font-size="13" fill="#1a1a1a">• Works iteratively</text>
</svg>