<svg width="900" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #333; }
      .subtitle { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #333; }
      .label { font-family: Arial, sans-serif; font-size: 12px; fill: #333; }
      .equation { font-family: Arial, sans-serif; font-size: 11px; fill: #333; }
      .metric-box { fill: #f8f9fa; stroke: #dee2e6; stroke-width: 2; rx: 8; }
      .good { fill: #d4edda; stroke: #28a745; }
      .poor { fill: #f8d7da; stroke: #dc3545; }
      .neutral { fill: #fff3cd; stroke: #ffc107; }
      .arrow { stroke: #666; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" class="title">Model Performance Metrics</text>
  
  <!-- R-squared Section -->
  <g transform="translate(50, 60)">
    <rect x="0" y="0" width="240" height="140" class="metric-box" />
    <text x="120" y="20" text-anchor="middle" class="subtitle">R-squared (R²)</text>
    <text x="15" y="40" class="equation">R² = 1 - (SS_res / SS_tot)</text>
    <text x="15" y="55" class="label">• Range: 0 to 1</text>
    <text x="15" y="70" class="label">• Higher = better fit</text>
    <text x="15" y="85" class="label">• Explains variance</text>
    
    <!-- R² Examples -->
    <rect x="15" y="100" width="50" height="20" class="good" />
    <text x="40" y="112" text-anchor="middle" class="equation">R² = 0.85</text>
    <text x="75" y="112" class="equation">Excellent</text>
    
    <rect x="120" y="100" width="50" height="20" class="neutral" />
    <text x="145" y="112" text-anchor="middle" class="equation">R² = 0.65</text>
    <text x="180" y="112" class="equation">Good</text>
  </g>
  
  <!-- Adjusted R-squared Section -->
  <g transform="translate(320, 60)">
    <rect x="0" y="0" width="240" height="140" class="metric-box" />
    <text x="120" y="20" text-anchor="middle" class="subtitle">Adjusted R-squared</text>
    <text x="15" y="40" class="equation">Adj R² = 1-[(1-R²)(n-1)/(n-k-1)]</text>
    <text x="15" y="55" class="label">• Accounts for features</text>
    <text x="15" y="70" class="label">• Penalizes irrelevant</text>
    <text x="15" y="85" class="label">• Better for multiple</text>
    
    <!-- Comparison arrows -->
    <line x1="15" y1="105" x2="85" y2="105" class="arrow" />
    <text x="15" y="120" class="equation">Add useful → Adj R² ↑</text>
    <line x1="15" y1="125" x2="85" y2="125" stroke="#dc3545" class="arrow" />
    <text x="15" y="135" class="equation">Add useless → Adj R² ↓</text>
  </g>
  
  <!-- RMSE Section -->
  <g transform="translate(590, 60)">
    <rect x="0" y="0" width="200" height="140" class="metric-box" />
    <text x="100" y="20" text-anchor="middle" class="subtitle">RMSE</text>
    <text x="15" y="40" class="equation">RMSE = √(Σ(y-ŷ)²/n)</text>
    <text x="15" y="55" class="label">• Same units as target</text>
    <text x="15" y="70" class="label">• Lower = better</text>
    <text x="15" y="85" class="label">• Sensitive to outliers</text>
    
    <rect x="15" y="100" width="40" height="20" class="good" />
    <text x="35" y="112" text-anchor="middle" class="equation">Low</text>
    <text x="65" y="112" class="equation">Good</text>
    
    <rect x="100" y="100" width="40" height="20" class="poor" />
    <text x="120" y="112" text-anchor="middle" class="equation">High</text>
    <text x="150" y="112" class="equation">Poor</text>
  </g>
  
  <!-- Visual Comparison Chart -->
  <g transform="translate(50, 250)">
    <text x="400" y="0" text-anchor="middle" class="subtitle">Model Performance Comparison</text>
    
    <!-- Chart axes -->
    <line x1="50" y1="200" x2="750" y2="200" stroke="#333" stroke-width="2" />
    <line x1="50" y1="30" x2="50" y2="200" stroke="#333" stroke-width="2" />
    
    <!-- Axis labels -->
    <text x="400" y="220" text-anchor="middle" class="label">Model Complexity</text>
    <text x="30" y="115" text-anchor="middle" class="label" transform="rotate(-90 30 115)">Performance</text>
    
    <!-- Training Performance Line (decreasing) -->
    <path d="M 80 180 Q 200 120 300 80 Q 500 50 700 40" stroke="#28a745" stroke-width="3" fill="none" />
    <text x="720" y="45" class="label" fill="#28a745">Training Error</text>
    
    <!-- Validation Performance Line (U-shaped) -->
    <path d="M 80 100 Q 200 80 350 75 Q 500 80 700 130" stroke="#dc3545" stroke-width="3" fill="none" />
    <text x="720" y="135" class="label" fill="#dc3545">Validation Error</text>
    
    <!-- Optimal point -->
    <circle cx="350" cy="75" r="5" fill="#ffc107" stroke="#333" stroke-width="2" />
    <text x="360" y="70" class="label" fill="#333">Optimal Point</text>
    <line x1="350" y1="75" x2="350" y2="200" stroke="#ffc107" stroke-width="2" stroke-dasharray="5,5" />
    <text x="360" y="190" class="label" fill="#333">Best Complexity</text>
    
    <!-- Regions -->
    <text x="150" y="220" text-anchor="middle" class="label" fill="#666">Underfitting</text>
    <text x="550" y="220" text-anchor="middle" class="label" fill="#666">Overfitting</text>
  </g>
  
  <!-- Interpretation Guide -->
  <g transform="translate(50, 480)">
    <rect x="0" y="0" width="800" height="100" class="metric-box" />
    <text x="400" y="20" text-anchor="middle" class="subtitle">Interpretation Guide</text>
    
    <text x="20" y="40" class="label">🎯 <tspan font-weight="bold">Good Model:</tspan> High R² (&gt; 0.7), Low RMSE, Small gap between training and validation performance</text>
    <text x="20" y="55" class="label">⚠️ <tspan font-weight="bold">Overfitting:</tspan> Very high training R², much lower validation R², large RMSE on test data</text>
    <text x="20" y="70" class="label">📉 <tspan font-weight="bold">Underfitting:</tspan> Low R² on both training and validation, consistently high RMSE</text>
    <text x="20" y="85" class="label">🔍 <tspan font-weight="bold">Best Practice:</tspan> Use cross-validation to get robust estimates, monitor multiple metrics together</text>
  </g>
</svg>