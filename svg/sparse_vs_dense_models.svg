<svg viewBox="0 0 1000 650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title-text { font-family: 'Arial', sans-serif; font-size: 20px; font-weight: bold; fill: #2c3e50; }
      .subtitle-text { font-family: 'Arial', sans-serif; font-size: 16px; font-weight: bold; fill: #34495e; }
      .label-text { font-family: 'Arial', sans-serif; font-size: 12px; fill: #2c3e50; }
      .math-text { font-family: 'Times New Roman', serif; font-size: 14px; fill: #2c3e50; }
      .axis-line { stroke: #7f8c8d; stroke-width: 2; fill: none; }
      .grid-line { stroke: #ecf0f1; stroke-width: 1; fill: none; }
      .sparse-bar { fill: #e74c3c; stroke: #c0392b; }
      .dense-bar { fill: #3498db; stroke: #2980b9; }
      .zero-line { stroke: #95a5a6; stroke-width: 1; stroke-dasharray: "5,5"; }
    </style>
  </defs>
  
  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" class="title-text">Sparse vs Dense Coefficient Patterns in High-Dimensional Regression</text>
  
  <!-- Sparse Model Panel -->
  <g transform="translate(50, 70)">
    <text x="200" y="20" text-anchor="middle" class="subtitle-text">Sparse Model (Lasso-friendly)</text>
    <text x="200" y="40" text-anchor="middle" class="math-text">βⱼ = 1/j², j = 1,...,20</text>
    
    <!-- Axes -->
    <line x1="40" y1="200" x2="360" y2="200" class="axis-line"/>
    <line x1="40" y1="60" x2="40" y2="210" class="axis-line"/>
    
    <!-- Grid lines -->
    <line x1="40" y1="150" x2="360" y2="150" class="grid-line"/>
    <line x1="40" y1="100" x2="360" y2="100" class="grid-line"/>
    
    <!-- Sparse coefficients (few large, many zero/small) -->
    <!-- Large coefficients -->
    <rect x="60" y="80" width="12" height="120" class="sparse-bar"/>
    <rect x="75" y="140" width="12" height="60" class="sparse-bar"/>
    <rect x="90" y="160" width="12" height="40" class="sparse-bar"/>
    <rect x="105" y="175" width="12" height="25" class="sparse-bar"/>
    <rect x="120" y="185" width="12" height="15" class="sparse-bar"/>
    
    <!-- Small/zero coefficients -->
    <rect x="135" y="195" width="12" height="5" class="sparse-bar"/>
    <rect x="150" y="197" width="12" height="3" class="sparse-bar"/>
    <rect x="165" y="198" width="12" height="2" class="sparse-bar"/>
    <rect x="180" y="199" width="12" height="1" class="sparse-bar"/>
    <rect x="195" y="199" width="12" height="1" class="sparse-bar"/>
    
    <!-- Essentially zero coefficients -->
    <rect x="210" y="200" width="12" height="0" class="sparse-bar"/>
    <rect x="225" y="200" width="12" height="0" class="sparse-bar"/>
    <rect x="240" y="200" width="12" height="0" class="sparse-bar"/>
    <rect x="255" y="200" width="12" height="0" class="sparse-bar"/>
    <rect x="270" y="200" width="12" height="0" class="sparse-bar"/>
    <rect x="285" y="200" width="12" height="0" class="sparse-bar"/>
    <rect x="300" y="200" width="12" height="0" class="sparse-bar"/>
    <rect x="315" y="200" width="12" height="0" class="sparse-bar"/>
    <rect x="330" y="200" width="12" height="0" class="sparse-bar"/>
    <rect x="345" y="200" width="12" height="0" class="sparse-bar"/>
    
    <!-- Zero line -->
    <line x1="40" y1="200" x2="360" y2="200" class="zero-line"/>
    
    <!-- Labels -->
    <text x="370" y="205" class="label-text">j (coefficient index)</text>
    <text x="25" y="55" class="label-text">|βⱼ|</text>
    
    <!-- Axis numbers -->
    <text x="65" y="220" text-anchor="middle" class="label-text">1</text>
    <text x="200" y="220" text-anchor="middle" class="label-text">10</text>
    <text x="350" y="220" text-anchor="middle" class="label-text">20</text>
    
    <text x="30" y="205" text-anchor="middle" class="label-text">0</text>
    <text x="30" y="155" text-anchor="middle" class="label-text">0.5</text>
    <text x="30" y="105" text-anchor="middle" class="label-text">1.0</text>
    
    <!-- Characteristics -->
    <text x="200" y="240" text-anchor="middle" class="label-text">Characteristics:</text>
    <text x="200" y="255" text-anchor="middle" class="label-text">• Few large coefficients</text>
    <text x="200" y="270" text-anchor="middle" class="label-text">• Many zero coefficients</text>
    <text x="200" y="285" text-anchor="middle" class="label-text">• Fast decay pattern</text>
    <text x="200" y="300" text-anchor="middle" class="label-text">• Lasso performs well</text>
  </g>
  
  <!-- Dense Model Panel -->
  <g transform="translate(550, 70)">
    <text x="200" y="20" text-anchor="middle" class="subtitle-text">Dense Model (Ridge-friendly)</text>
    <text x="200" y="40" text-anchor="middle" class="math-text">βⱼ = 0.1 × (0.9)ʲ, j = 1,...,20</text>
    
    <!-- Axes -->
    <line x1="40" y1="200" x2="360" y2="200" class="axis-line"/>
    <line x1="40" y1="60" x2="40" y2="210" class="axis-line"/>
    
    <!-- Grid lines -->
    <line x1="40" y1="150" x2="360" y2="150" class="grid-line"/>
    <line x1="40" y1="100" x2="360" y2="100" class="grid-line"/>
    
    <!-- Dense coefficients (all non-zero, gradual decay) -->
    <rect x="60" y="120" width="12" height="80" class="dense-bar"/>
    <rect x="75" y="128" width="12" height="72" class="dense-bar"/>
    <rect x="90" y="135" width="12" height="65" class="dense-bar"/>
    <rect x="105" y="141" width="12" height="59" class="dense-bar"/>
    <rect x="120" y="146" width="12" height="54" class="dense-bar"/>
    <rect x="135" y="151" width="12" height="49" class="dense-bar"/>
    <rect x="150" y="155" width="12" height="45" class="dense-bar"/>
    <rect x="165" y="159" width="12" height="41" class="dense-bar"/>
    <rect x="180" y="162" width="12" height="38" class="dense-bar"/>
    <rect x="195" y="165" width="12" height="35" class="dense-bar"/>
    <rect x="210" y="168" width="12" height="32" class="dense-bar"/>
    <rect x="225" y="170" width="12" height="30" class="dense-bar"/>
    <rect x="240" y="172" width="12" height="28" class="dense-bar"/>
    <rect x="255" y="174" width="12" height="26" class="dense-bar"/>
    <rect x="270" y="176" width="12" height="24" class="dense-bar"/>
    <rect x="285" y="178" width="12" height="22" class="dense-bar"/>
    <rect x="300" y="180" width="12" height="20" class="dense-bar"/>
    <rect x="315" y="182" width="12" height="18" class="dense-bar"/>
    <rect x="330" y="184" width="12" height="16" class="dense-bar"/>
    <rect x="345" y="186" width="12" height="14" class="dense-bar"/>
    
    <!-- Zero line -->
    <line x1="40" y1="200" x2="360" y2="200" class="zero-line"/>
    
    <!-- Labels -->
    <text x="370" y="205" class="label-text">j (coefficient index)</text>
    <text x="25" y="55" class="label-text">|βⱼ|</text>
    
    <!-- Axis numbers -->
    <text x="65" y="220" text-anchor="middle" class="label-text">1</text>
    <text x="200" y="220" text-anchor="middle" class="label-text">10</text>
    <text x="350" y="220" text-anchor="middle" class="label-text">20</text>
    
    <text x="30" y="205" text-anchor="middle" class="label-text">0</text>
    <text x="30" y="155" text-anchor="middle" class="label-text">0.05</text>
    <text x="30" y="105" text-anchor="middle" class="label-text">0.1</text>
    
    <!-- Characteristics -->
    <text x="200" y="240" text-anchor="middle" class="label-text">Characteristics:</text>
    <text x="200" y="255" text-anchor="middle" class="label-text">• All coefficients non-zero</text>
    <text x="200" y="270" text-anchor="middle" class="label-text">• Gradual decay pattern</text>
    <text x="200" y="285" text-anchor="middle" class="label-text">• No natural sparsity</text>
    <text x="200" y="300" text-anchor="middle" class="label-text">• Ridge performs well</text>
  </g>
  
  <!-- Comparison Table -->
  <g transform="translate(50, 400)">
    <text x="450" y="20" text-anchor="middle" class="subtitle-text">Model Selection Guidelines</text>
    
    <!-- Table -->
    <rect x="0" y="40" width="900" height="180" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2"/>
    
    <!-- Headers -->
    <rect x="20" y="60" width="200" height="30" fill="#e9ecef" stroke="#dee2e6"/>
    <rect x="220" y="60" width="200" height="30" fill="#e9ecef" stroke="#dee2e6"/>
    <rect x="420" y="60" width="200" height="30" fill="#e9ecef" stroke="#dee2e6"/>
    <rect x="620" y="60" width="200" height="30" fill="#e9ecef" stroke="#dee2e6"/>
    
    <text x="120" y="80" text-anchor="middle" class="label-text">Model Type</text>
    <text x="320" y="80" text-anchor="middle" class="label-text">Coefficient Pattern</text>
    <text x="520" y="80" text-anchor="middle" class="label-text">Best Method</text>
    <text x="720" y="80" text-anchor="middle" class="label-text">Why It Works</text>
    
    <!-- Row 1: Sparse -->
    <rect x="20" y="90" width="200" height="35" fill="white" stroke="#dee2e6"/>
    <rect x="220" y="90" width="200" height="35" fill="white" stroke="#dee2e6"/>
    <rect x="420" y="90" width="200" height="35" fill="white" stroke="#dee2e6"/>
    <rect x="620" y="90" width="200" height="35" fill="white" stroke="#dee2e6"/>
    
    <text x="120" y="110" text-anchor="middle" class="label-text">Sparse</text>
    <text x="320" y="110" text-anchor="middle" class="label-text">Few large, many zero</text>
    <text x="520" y="110" text-anchor="middle" class="label-text">Lasso</text>
    <text x="720" y="105" text-anchor="middle" class="label-text">L1 penalty sets</text>
    <text x="720" y="118" text-anchor="middle" class="label-text">irrelevant coeffs to 0</text>
    
    <!-- Row 2: Dense -->
    <rect x="20" y="125" width="200" height="35" fill="white" stroke="#dee2e6"/>
    <rect x="220" y="125" width="200" height="35" fill="white" stroke="#dee2e6"/>
    <rect x="420" y="125" width="200" height="35" fill="white" stroke="#dee2e6"/>
    <rect x="620" y="125" width="200" height="35" fill="white" stroke="#dee2e6"/>
    
    <text x="120" y="145" text-anchor="middle" class="label-text">Dense</text>
    <text x="320" y="145" text-anchor="middle" class="label-text">All small, non-zero</text>
    <text x="520" y="145" text-anchor="middle" class="label-text">Ridge</text>
    <text x="720" y="140" text-anchor="middle" class="label-text">L2 penalty shrinks</text>
    <text x="720" y="153" text-anchor="middle" class="label-text">without eliminating</text>
    
    <!-- Row 3: Mixed -->
    <rect x="20" y="160" width="200" height="35" fill="white" stroke="#dee2e6"/>
    <rect x="220" y="160" width="200" height="35" fill="white" stroke="#dee2e6"/>
    <rect x="420" y="160" width="200" height="35" fill="white" stroke="#dee2e6"/>
    <rect x="620" y="160" width="200" height="35" fill="white" stroke="#dee2e6"/>
    
    <text x="120" y="180" text-anchor="middle" class="label-text">Mixed</text>
    <text x="320" y="180" text-anchor="middle" class="label-text">Both patterns present</text>
    <text x="520" y="175" text-anchor="middle" class="label-text">Elastic Net</text>
    <text x="520" y="188" text-anchor="middle" class="label-text">or Lava</text>
    <text x="720" y="175" text-anchor="middle" class="label-text">Combines L1+L2</text>
    <text x="720" y="188" text-anchor="middle" class="label-text">advantages</text>
  </g>
</svg>