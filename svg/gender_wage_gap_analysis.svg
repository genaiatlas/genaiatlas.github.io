<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="maleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="femaleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#b91c1c;stop-opacity:0.8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="700" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1e293b">
    Gender Wage Gap Analysis: US Current Population Survey 2012
  </text>
  
  <!-- Dataset Info -->
  <rect x="50" y="60" width="800" height="50" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
  <text x="450" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#334155">
    Sample: ~4,000 single workers | Education: High school, some college, college graduates
  </text>
  <text x="450" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">
    Research Question: What is the wage difference between men and women with same job-relevant characteristics?
  </text>
  
  <!-- Raw Wage Comparison -->
  <text x="450" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">
    1. Raw Wage Comparison (Unadjusted)
  </text>
  
  <!-- Male wage bar -->
  <rect x="200" y="170" width="180" height="60" rx="6" fill="url(#maleGradient)" filter="url(#shadow)"/>
  <text x="290" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    Male Average
  </text>
  <text x="290" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
    $16.12/hour
  </text>
  
  <!-- Female wage bar -->
  <rect x="420" y="170" width="180" height="60" rx="6" fill="url(#femaleGradient)" filter="url(#shadow)"/>
  <text x="510" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    Female Average
  </text>
  <text x="510" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
    $14.72/hour
  </text>
  
  <!-- Raw difference -->
  <rect x="620" y="170" width="120" height="60" rx="6" fill="#fbbf24" filter="url(#shadow)"/>
  <text x="680" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#92400e">
    Raw Difference
  </text>
  <text x="680" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#92400e">
    $1.40/hour
  </text>
  
  <!-- Descriptive Statistics Table -->
  <text x="450" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">
    2. Descriptive Statistics by Gender
  </text>
  
  <!-- Table header -->
  <rect x="150" y="300" width="600" height="30" fill="#374151"/>
  <text x="200" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Characteristic
  </text>
  <text x="350" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Male Means
  </text>
  <text x="500" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Female Means
  </text>
  <text x="650" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Difference
  </text>
  
  <!-- Table rows -->
  <rect x="150" y="330" width="600" height="25" fill="#f9fafb"/>
  <text x="200" y="347" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">Experience</text>
  <text x="350" y="347" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">13.58</text>
  <text x="500" y="347" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">13.04</text>
  <text x="650" y="347" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#059669">+0.54</text>
  
  <rect x="150" y="355" width="600" height="25" fill="#ffffff"/>
  <text x="200" y="372" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">College graduate</text>
  <text x="350" y="372" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">0.35</text>
  <text x="500" y="372" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">0.41</text>
  <text x="650" y="372" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#dc2626">-0.06</text>
  
  <rect x="150" y="380" width="600" height="25" fill="#f9fafb"/>
  <text x="200" y="397" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">Some college</text>
  <text x="350" y="397" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">0.30</text>
  <text x="500" y="397" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">0.35</text>
  <text x="650" y="397" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#dc2626">-0.05</text>
  
  <!-- Regression Results -->
  <text x="450" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">
    3. Regression Results (Controlling for Job-Relevant Characteristics)
  </text>
  
  <!-- Model comparison table -->
  <rect x="150" y="470" width="600" height="30" fill="#374151"/>
  <text x="250" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Model
  </text>
  <text x="350" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Estimate
  </text>
  <text x="450" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Std Error
  </text>
  <text x="600" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    95% Confidence Interval
  </text>
  
  <!-- Basic model row -->
  <rect x="150" y="500" width="600" height="25" fill="#fef3c7"/>
  <text x="250" y="517" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#92400e">Basic (10 regressors)</text>
  <text x="350" y="517" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#dc2626">-$1.83</text>
  <text x="450" y="517" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#92400e">0.42</text>
  <text x="600" y="517" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#92400e">[-2.66, -0.99]</text>
  
  <!-- Flexible model row -->
  <rect x="150" y="525" width="600" height="25" fill="#ddd6fe"/>
  <text x="250" y="542" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5b21b6">Flexible (33 regressors)</text>
  <text x="350" y="542" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#dc2626">-$1.88</text>
  <text x="450" y="542" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5b21b6">0.42</text>
  <text x="600" y="542" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5b21b6">[-2.71, -1.05]</text>
  
  <!-- Key Finding Box -->
  <rect x="200" y="580" width="500" height="80" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#dc2626">
    Key Finding
  </text>
  <text x="450" y="625" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#991b1b">
    Women earn approximately $2 less per hour than men
  </text>
  <text x="450" y="645" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#991b1b">
    with identical job-relevant characteristics (statistically significant)
  </text>
  
  <!-- Interpretation note -->
  <text x="450" y="690" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#64748b">
    Note: Gap may reflect discrimination and/or occupational selection effects
  </text>
</svg>