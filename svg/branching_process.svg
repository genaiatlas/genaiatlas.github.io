<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="900" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="600" y="40" font-size="28" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Branching Process and Epidemic Threshold
  </text>
  
  <!-- Formula Box -->
  <g id="formula">
    <rect x="350" y="70" width="500" height="100" fill="#e3f2fd" stroke="#1976d2" stroke-width="3" rx="10"/>
    <text x="600" y="105" font-size="20" font-weight="bold" text-anchor="middle" fill="#0d47a1">
      Branching Number (R₀)
    </text>
    <text x="600" y="140" font-size="24" font-family="monospace" text-anchor="middle" fill="#1565c0">
      R₀ = d̄ × p
    </text>
  </g>
  
  <!-- Variable Definitions -->
  <g id="variables">
    <text x="100" y="210" font-size="15" fill="#424242">
      <tspan font-weight="bold">Where:</tspan>
    </text>
    <text x="100" y="235" font-size="14" fill="#424242">
      • d̄ = average degree (number of neighbors)
    </text>
    <text x="100" y="260" font-size="14" fill="#424242">
      • p = infection probability per edge
    </text>
    <text x="100" y="285" font-size="14" fill="#424242">
      • R₀ = expected new infections per infected node
    </text>
  </g>
  
  <!-- Threshold Conditions -->
  <g id="threshold">
    <rect x="50" y="320" width="530" height="260" fill="#fff3e0" stroke="#ef6c00" stroke-width="3" rx="10"/>
    <text x="315" y="355" font-size="18" font-weight="bold" text-anchor="middle" fill="#e65100">
      🔥 Epidemic Threshold
    </text>
    
    <!-- R0 > 1 -->
    <rect x="70" y="380" width="490" height="60" fill="#ffebee" stroke="#c62828" stroke-width="2" rx="6"/>
    <text x="85" y="405" font-size="16" font-weight="bold" fill="#b71c1c">R₀ &gt; 1:</text>
    <text x="85" y="430" font-size="13" fill="#424242">
      Epidemic spreads exponentially to large fraction of network
    </text>
    
    <!-- R0 = 1 -->
    <rect x="70" y="455" width="490" height="60" fill="#fff9c4" stroke="#f57f17" stroke-width="2" rx="6"/>
    <text x="85" y="480" font-size="16" font-weight="bold" fill="#f57f17">R₀ = 1:</text>
    <text x="85" y="505" font-size="13" fill="#424242">
      Critical threshold (phase transition boundary)
    </text>
    
    <!-- R0 < 1 -->
    <rect x="70" y="530" width="490" height="60" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" rx="6"/>
    <text x="85" y="555" font-size="16" font-weight="bold" fill="#1b5e20">R₀ &lt; 1:</text>
    <text x="85" y="580" font-size="13" fill="#424242">
      Epidemic dies out quickly (affects only local neighborhood)
    </text>
  </g>
  
  <!-- Example 1: Exponential Growth -->
  <g id="example-growth">
    <rect x="620" y="320" width="530" height="260" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3" rx="10"/>
    <text x="885" y="355" font-size="18" font-weight="bold" text-anchor="middle" fill="#1b5e20">
      📈 Example: R₀ = 2 (Growth)
    </text>
    
    <text x="640" y="390" font-size="14" fill="#424242">
      <tspan font-weight="bold">Network:</tspan> d̄ = 7, p = 1/3
    </text>
    <text x="640" y="415" font-size="14" font-family="monospace" fill="#1b5e20">
      R₀ = 7 × (1/3) ≈ 2.33 &gt; 1
    </text>
    
    <text x="640" y="450" font-size="13" fill="#424242" font-weight="bold">
      Round-by-round infections:
    </text>
    
    <!-- Growth visualization -->
    <circle cx="670" cy="485" r="15" fill="#f44336" stroke="#c62828" stroke-width="2"/>
    <text x="700" y="490" font-size="12" fill="#424242">Round 0: 1 infected</text>
    
    <circle cx="670" cy="515" r="15" fill="#f44336" stroke="#c62828" stroke-width="2"/>
    <circle cx="695" cy="515" r="15" fill="#ef5350" stroke="#d32f2f" stroke-width="2"/>
    <text x="725" y="520" font-size="12" fill="#424242">Round 1: ~2 new</text>
    
    <circle cx="655" cy="545" r="12" fill="#f44336" stroke="#c62828" stroke-width="2"/>
    <circle cx="675" cy="545" r="12" fill="#f44336" stroke="#c62828" stroke-width="2"/>
    <circle cx="695" cy="545" r="12" fill="#ef5350" stroke="#d32f2f" stroke-width="2"/>
    <circle cx="715" cy="545" r="12" fill="#ef5350" stroke="#d32f2f" stroke-width="2"/>
    <text x="745" y="550" font-size="12" fill="#424242">Round 2: ~4 new</text>
    
    <text x="640" y="575" font-size="13" fill="#c62828" font-weight="bold">
      Growth: 1 → 2 → 4 → 8 → 16 → 32...
    </text>
  </g>
  
  <!-- Example 2: Die Out -->
  <g id="example-dieout">
    <rect x="50" y="610" width="530" height="260" fill="#ffebee" stroke="#c62828" stroke-width="3" rx="10"/>
    <text x="315" y="645" font-size="18" font-weight="bold" text-anchor="middle" fill="#b71c1c">
      📉 Example: R₀ = 0.67 (Die Out)
    </text>
    
    <text x="70" y="680" font-size="14" fill="#424242">
      <tspan font-weight="bold">Network:</tspan> d̄ = 3, p = 1/3
    </text>
    <text x="70" y="705" font-size="14" font-family="monospace" fill="#c62828">
      R₀ = 3 × (1/3) = 1 × (2/3) ≈ 0.67 &lt; 1
    </text>
    
    <text x="70" y="735" font-size="13" fill="#424242">
      <tspan font-style="italic">(Accounting for infecting neighbor: d̄ - 1 = 2)</tspan>
    </text>
    
    <text x="70" y="765" font-size="13" fill="#424242" font-weight="bold">
      Expected infections decay:
    </text>
    
    <text x="70" y="795" font-size="13" fill="#424242">
      Round 0: 1.00 infected
    </text>
    <text x="70" y="815" font-size="13" fill="#424242">
      Round 1: 0.67 expected new infections
    </text>
    <text x="70" y="835" font-size="13" fill="#424242">
      Round 2: 0.44 expected new infections
    </text>
    <text x="70" y="855" font-size="13" fill="#424242">
      Round 3: 0.29 expected new infections → dies out
    </text>
  </g>
  
  <!-- Network Structure Impact -->
  <g id="network-impact">
    <rect x="620" y="610" width="530" height="260" fill="#e1f5fe" stroke="#0277bd" stroke-width="3" rx="10"/>
    <text x="885" y="645" font-size="18" font-weight="bold" text-anchor="middle" fill="#01579b">
      🌐 Network Structure Matters
    </text>
    
    <!-- Dense Network -->
    <text x="640" y="680" font-size="14" font-weight="bold" fill="#0277bd">
      Dense Networks (schools, offices):
    </text>
    <text x="655" y="705" font-size="13" fill="#424242">
      • High average degree (d̄ ≈ 20-50)
    </text>
    <text x="655" y="725" font-size="13" fill="#424242">
      • Easier to exceed R₀ &gt; 1 threshold
    </text>
    <text x="655" y="745" font-size="13" fill="#424242">
      • Rapid epidemic spread likely
    </text>
    
    <!-- Sparse Network -->
    <text x="640" y="780" font-size="14" font-weight="bold" fill="#0277bd">
      Sparse Networks (rural, online):
    </text>
    <text x="655" y="805" font-size="13" fill="#424242">
      • Low average degree (d̄ ≈ 3-8)
    </text>
    <text x="655" y="825" font-size="13" fill="#424242">
      • Requires higher infection probability p
    </text>
    <text x="655" y="845" font-size="13" fill="#424242">
      • Epidemic less likely to take off
    </text>
  </g>
</svg>