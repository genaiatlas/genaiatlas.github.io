<svg viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="500" y="35" font-size="24" font-weight="bold" text-anchor="middle" fill="#2C3E50">
    Collaborative Filtering Prediction Mechanism
  </text>
  
  <!-- Scenario box -->
  <rect x="50" y="60" width="900" height="80" fill="#E8F4F8" stroke="#3498DB" stroke-width="2" rx="10"/>
  <text x="500" y="90" font-size="16" font-weight="bold" text-anchor="middle" fill="#2C3E50">
    Scenario: Predict Prof's preference for "Iron Man vs Superman"
  </text>
  <text x="500" y="115" font-size="13" text-anchor="middle" fill="#34495E">
    Known: Your preference (+1, similarity: +1/3) | Philip's preference (-1, similarity: -1/3)
  </text>
  
  <!-- Prediction Formula -->
  <rect x="150" y="165" width="700" height="70" fill="#FEF5E7" stroke="#E67E22" stroke-width="2" rx="8"/>
  <text x="500" y="195" font-size="15" font-weight="bold" text-anchor="middle" fill="#2C3E50">
    Weighted Prediction Formula
  </text>
  <text x="500" y="220" font-size="18" text-anchor="middle" fill="#E67E22" font-weight="bold">
    Predicted = Σ(Similarity_i × Preference_i) / Σ|Similarity_i|
  </text>
  
  <!-- Step-by-step calculation -->
  <g transform="translate(50, 260)">
    <!-- Step 1 -->
    <rect x="0" y="0" width="440" height="200" fill="#E8F8F5" stroke="#27AE60" stroke-width="2" rx="8"/>
    <text x="220" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#2C3E50">
      Step 1: Weighted Contributions
    </text>
    
    <!-- Your contribution -->
    <rect x="20" y="50" width="400" height="65" fill="white" stroke="#3498DB" stroke-width="1" rx="5"/>
    <text x="30" y="70" font-size="13" font-weight="bold" fill="#3498DB">Your Contribution:</text>
    <text x="30" y="90" font-size="12" fill="#34495E">Similarity × Preference = (1/3) × (+1)</text>
    <text x="30" y="108" font-size="14" font-weight="bold" fill="#27AE60">= +1/3 = 0.333</text>
    
    <!-- Philip's contribution -->
    <rect x="20" y="125" width="400" height="65" fill="white" stroke="#E74C3C" stroke-width="1" rx="5"/>
    <text x="30" y="145" font-size="13" font-weight="bold" fill="#E74C3C">Philip's Contribution:</text>
    <text x="30" y="165" font-size="12" fill="#34495E">Similarity × Preference = (-1/3) × (-1)</text>
    <text x="30" y="183" font-size="14" font-weight="bold" fill="#27AE60">= +1/3 = 0.333</text>
  </g>
  
  <!-- Step 2 -->
  <g transform="translate(510, 260)">
    <rect x="0" y="0" width="440" height="200" fill="#FEF5E7" stroke="#E67E22" stroke-width="2" rx="8"/>
    <text x="220" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#2C3E50">
      Step 2: Sum Contributions
    </text>
    
    <!-- Numerator -->
    <rect x="20" y="55" width="400" height="55" fill="white" stroke="#3498DB" stroke-width="1" rx="5"/>
    <text x="30" y="75" font-size="13" font-weight="bold" fill="#2C3E50">Numerator (Sum of contributions):</text>
    <text x="30" y="100" font-size="14" fill="#34495E">1/3 + 1/3 = 2/3 = 0.667</text>
    
    <!-- Denominator -->
    <rect x="20" y="120" width="400" height="70" fill="white" stroke="#E74C3C" stroke-width="1" rx="5"/>
    <text x="30" y="140" font-size="13" font-weight="bold" fill="#2C3E50">Denominator (Sum of |similarities|):</text>
    <text x="30" y="160" font-size="12" fill="#34495E">|1/3| + |-1/3| = 1/3 + 1/3</text>
    <text x="30" y="180" font-size="14" fill="#34495E">= 2/3 = 0.667</text>
  </g>
  
  <!-- Step 3: Final Result -->
  <rect x="50" y="480" width="900" height="100" fill="#27AE60" stroke="#27AE60" stroke-width="3" rx="10"/>
  <text x="500" y="515" font-size="18" font-weight="bold" text-anchor="middle" fill="white">
    Step 3: Calculate Final Prediction
  </text>
  <text x="500" y="545" font-size="16" text-anchor="middle" fill="white">
    Predicted Value = 0.667 / 0.667 = 1.0
  </text>
  <text x="500" y="570" font-size="15" font-weight="bold" text-anchor="middle" fill="white">
    ✓ Prof is predicted to prefer Iron Man over Superman
  </text>
  
  <!-- Alternative Scenario -->
  <rect x="50" y="605" width="900" height="165" fill="#F8F9F9" stroke="#9B59B6" stroke-width="2" rx="10"/>
  <text x="500" y="635" font-size="16" font-weight="bold" text-anchor="middle" fill="#2C3E50">
    Alternative Scenario: Different Similarities
  </text>
  <text x="500" y="660" font-size="13" text-anchor="middle" fill="#34495E">
    If Philip liked Iron Man (+1) and his similarity to Prof was -1 (not -1/3):
  </text>
  
  <!-- Alternative calculation -->
  <g transform="translate(150, 670)">
    <rect x="0" y="0" width="700" height="85" fill="white" stroke="#BDC3C7" stroke-width="1" rx="5"/>
    <text x="15" y="25" font-size="13" fill="#34495E">
      Numerator: (1/3)(+1) + (-1)(+1) = 1/3 - 1 = -2/3
    </text>
    <text x="15" y="48" font-size="13" fill="#34495E">
      Denominator: |1/3| + |-1| = 1/3 + 1 = 4/3
    </text>
    <text x="15" y="71" font-size="14" font-weight="bold" fill="#E74C3C">
      Predicted Value = (-2/3) / (4/3) = -1/2 = -0.5 (Superman preferred)
    </text>
  </g>
  
  <!-- Key Insight -->
  <rect x="50" y="785" width="900" height="0" fill="none"/>
</svg>