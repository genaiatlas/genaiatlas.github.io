<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="900" height="400" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">Computer Vision Pipeline for Autonomous Systems</text>
  
  <!-- Input Stage -->
  <rect x="50" y="80" width="120" height="60" rx="10" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <text x="110" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Multi-Camera</text>
  <text x="110" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Input</text>
  
  <!-- Image Processing -->
  <rect x="220" y="80" width="120" height="60" rx="10" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
  <text x="280" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Image</text>
  <text x="280" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Processing</text>
  
  <!-- Feature Extraction -->
  <rect x="390" y="80" width="120" height="60" rx="10" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
  <text x="450" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Feature</text>
  <text x="450" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Extraction</text>
  
  <!-- Object Detection -->
  <rect x="560" y="80" width="120" height="60" rx="10" fill="#27ae60" stroke="#229954" stroke-width="2"/>
  <text x="620" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Object</text>
  <text x="620" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Detection</text>
  
  <!-- Decision Making -->
  <rect x="730" y="80" width="120" height="60" rx="10" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="790" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Decision</text>
  <text x="790" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Making</text>
  
  <!-- Arrows -->
  <path d="M 170 110 L 210 110" stroke="#34495e" stroke-width="3" marker-end="url(#arrowhead)" fill="none"/>
  <path d="M 340 110 L 380 110" stroke="#34495e" stroke-width="3" marker-end="url(#arrowhead)" fill="none"/>
  <path d="M 510 110 L 550 110" stroke="#34495e" stroke-width="3" marker-end="url(#arrowhead)" fill="none"/>
  <path d="M 680 110 L 720 110" stroke="#34495e" stroke-width="3" marker-end="url(#arrowhead)" fill="none"/>
  
  <!-- Detailed Descriptions -->
  <rect x="50" y="180" width="120" height="140" rx="5" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
  <text x="110" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#2c3e50">Camera Inputs:</text>
  <text x="110" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#34495e">• Front View</text>
  <text x="110" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#34495e">• Side Views</text>
  <text x="110" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#34495e">• Rear View</text>
  <text x="110" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#34495e">• 360° Coverage</text>
  <text x="110" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">Real-time Video</text>
  <text x="110" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">Multiple Angles</text>
  
  <rect x="220" y="180" width="120" height="140" rx="5" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
  <text x="280" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#2c3e50">Processing:</text>
  <text x="280" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#34495e">• Noise Reduction</text>
  <text x="280" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#34495e">• Enhancement</text>
  <text x="280" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#34495e">• Normalization</text>
  <text x="280" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#34495e">• Frame Alignment</text>
  <text x="280" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">Image Quality</text>
  <text x="280" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">Optimization</text>
  
  <rect x="390" y="180" width="120" height="140" rx="5" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
  <text x="450" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#2c3e50">Deep Learning:</text>
  <text x="450" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#34495e">• Edge Detection</text>
  <text x="450" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#34495e">• Pattern Recognition</text>
  <text x="450" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#34495e">• Shape Analysis</text>
  <text x="450" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#34495e">• Texture Mapping</text>
  <text x="450" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">CNN Layers</text>
  <text x="450" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">Feature Maps</text>
  
  <rect x="560" y="180" width="120" height="140" rx="5" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
  <text x="620" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#2c3e50">Detection:</text>
  <text x="620" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#34495e">• Vehicles</text>
  <text x="620" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#34495e">• Pedestrians</text>
  <text x="620" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#34495e">• Traffic Signs</text>
  <text x="620" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#34495e">• Road Boundaries</text>
  <text x="620" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">YOLO/R-CNN</text>
  <text x="620" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">Bounding Boxes</text>
  
  <rect x="730" y="180" width="120" height="140" rx="5" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
  <text x="790" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#2c3e50">Actions:</text>
  <text x="790" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#34495e">• Steering Control</text>
  <text x="790" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#34495e">• Speed Adjustment</text>
  <text x="790" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#34495e">• Lane Changes</text>
  <text x="790" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#34495e">• Emergency Stop</text>
  <text x="790" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">Safety Priority</text>
  <text x="790" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">Real-time Control</text>
  
  <!-- Performance Metrics -->
  <rect x="200" y="340" width="500" height="40" rx="5" fill="#d5dbdb" stroke="#85929e" stroke-width="1"/>
  <text x="450" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Real-time Performance Requirements</text>
  <text x="450" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#34495e">Processing Speed: &lt;100ms | Accuracy: &gt;99.9% | Safety-Critical Operation</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e"/>
    </marker>
  </defs>
</svg>