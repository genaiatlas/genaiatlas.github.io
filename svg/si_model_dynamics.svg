<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="800" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="600" y="40" font-size="28" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    SI Model: Susceptible-Infected Dynamics
  </text>
  
  <!-- State Diagram -->
  <g id="state-diagram">
    <text x="150" y="100" font-size="18" font-weight="bold" fill="#1976d2">State Transitions:</text>
    
    <!-- Susceptible State -->
    <circle cx="250" cy="150" r="40" fill="#e3f2fd" stroke="#1976d2" stroke-width="3"/>
    <text x="250" y="145" font-size="18" font-weight="bold" text-anchor="middle" fill="#1565c0">S</text>
    <text x="250" y="165" font-size="12" text-anchor="middle" fill="#1565c0">Susceptible</text>
    
    <!-- Arrow -->
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
        <polygon points="0 0, 10 3, 0 6" fill="#f44336"/>
      </marker>
    </defs>
    <line x1="295" y1="150" x2="395" y2="150" stroke="#f44336" stroke-width="3" marker-end="url(#arrowhead)"/>
    <text x="345" y="140" font-size="14" font-weight="bold" text-anchor="middle" fill="#c62828">
      Infection (p)
    </text>
    
    <!-- Infected State -->
    <circle cx="445" cy="150" r="40" fill="#ffebee" stroke="#c62828" stroke-width="3"/>
    <text x="445" y="145" font-size="18" font-weight="bold" text-anchor="middle" fill="#b71c1c">I</text>
    <text x="445" y="165" font-size="12" text-anchor="middle" fill="#b71c1c">Infected</text>
    
    <!-- No recovery arrow -->
    <text x="445" y="210" font-size="12" text-anchor="middle" fill="#424242" font-style="italic">
      (Permanent infection)
    </text>
  </g>
  
  <!-- Probability Explanation -->
  <g id="probability">
    <rect x="50" y="250" width="500" height="180" fill="#fff3e0" stroke="#ef6c00" stroke-width="2" rx="8"/>
    <text x="300" y="280" font-size="16" font-weight="bold" text-anchor="middle" fill="#e65100">
      Transmission Probability (p)
    </text>
    
    <text x="70" y="310" font-size="13" fill="#424242">
      <tspan x="70" dy="0">• Each infected node independently infects</tspan>
      <tspan x="85" dy="20">susceptible neighbors with probability p</tspan>
    </text>
    
    <text x="70" y="355" font-size="13" fill="#424242">
      <tspan x="70" dy="0">• High p (0.7-0.9): Highly contagious content</tspan>
      <tspan x="85" dy="20">(viral videos, breaking news)</tspan>
    </text>
    
    <text x="70" y="400" font-size="13" fill="#424242">
      <tspan x="70" dy="0">• Low p (0.1-0.3): Weakly contagious content</tspan>
      <tspan x="85" dy="20">(mundane information, niche topics)</tspan>
    </text>
  </g>
  
  <!-- Multiple Infected Neighbors -->
  <g id="multiple-neighbors">
    <rect x="650" y="250" width="500" height="180" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" rx="8"/>
    <text x="900" y="280" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b5e20">
      Multiple Infection Attempts
    </text>
    
    <text x="670" y="310" font-size="13" fill="#424242">
      If susceptible node has k infected neighbors:
    </text>
    
    <text x="670" y="340" font-size="14" font-family="monospace" fill="#1b5e20">
      P(remain susceptible) = (1 - p)^k
    </text>
    
    <text x="670" y="370" font-size="14" font-family="monospace" fill="#c62828">
      P(become infected) = 1 - (1 - p)^k
    </text>
    
    <text x="670" y="405" font-size="12" fill="#616161" font-style="italic">
      Each neighbor provides independent chance of infection
    </text>
  </g>
  
  <!-- Network Spreading Visualization -->
  <g id="spreading-viz">
    <text x="600" y="480" font-size="18" font-weight="bold" text-anchor="middle" fill="#1976d2">
      Spreading Process Through Network
    </text>
    
    <!-- Time t=0 -->
    <text x="150" y="525" font-size="14" font-weight="bold" fill="#424242">t = 0</text>
    <circle cx="150" cy="580" r="25" fill="#f44336" stroke="#c62828" stroke-width="2"/>
    <circle cx="220" cy="560" r="20" fill="#e0e0e0" stroke="#757575" stroke-width="2"/>
    <circle cx="220" cy="600" r="20" fill="#e0e0e0" stroke="#757575" stroke-width="2"/>
    <circle cx="100" cy="640" r="20" fill="#e0e0e0" stroke="#757575" stroke-width="2"/>
    <line x1="150" y1="580" x2="220" y2="560" stroke="#90a4ae" stroke-width="2"/>
    <line x1="150" y1="580" x2="220" y2="600" stroke="#90a4ae" stroke-width="2"/>
    <line x1="150" y1="580" x2="100" y2="640" stroke="#90a4ae" stroke-width="2"/>
    <text x="150" y="690" font-size="12" text-anchor="middle" fill="#616161">1 infected</text>
    
    <!-- Time t=1 -->
    <text x="400" y="525" font-size="14" font-weight="bold" fill="#424242">t = 1</text>
    <circle cx="400" cy="580" r="25" fill="#f44336" stroke="#c62828" stroke-width="2"/>
    <circle cx="470" cy="560" r="20" fill="#ef5350" stroke="#d32f2f" stroke-width="2"/>
    <circle cx="470" cy="600" r="20" fill="#e0e0e0" stroke="#757575" stroke-width="2"/>
    <circle cx="350" cy="640" r="20" fill="#ef5350" stroke="#d32f2f" stroke-width="2"/>
    <circle cx="520" cy="540" r="18" fill="#e0e0e0" stroke="#757575" stroke-width="2"/>
    <circle cx="520" cy="620" r="18" fill="#e0e0e0" stroke="#757575" stroke-width="2"/>
    <line x1="400" y1="580" x2="470" y2="560" stroke="#90a4ae" stroke-width="2"/>
    <line x1="400" y1="580" x2="470" y2="600" stroke="#90a4ae" stroke-width="2"/>
    <line x1="400" y1="580" x2="350" y2="640" stroke="#90a4ae" stroke-width="2"/>
    <line x1="470" y1="560" x2="520" y2="540" stroke="#90a4ae" stroke-width="2"/>
    <line x1="470" y1="600" x2="520" y2="620" stroke="#90a4ae" stroke-width="2"/>
    <text x="400" y="690" font-size="12" text-anchor="middle" fill="#616161">3 infected</text>
    
    <!-- Time t=2 -->
    <text x="700" y="525" font-size="14" font-weight="bold" fill="#424242">t = 2</text>
    <circle cx="700" cy="580" r="25" fill="#f44336" stroke="#c62828" stroke-width="2"/>
    <circle cx="770" cy="560" r="20" fill="#f44336" stroke="#c62828" stroke-width="2"/>
    <circle cx="770" cy="600" r="20" fill="#ef5350" stroke="#d32f2f" stroke-width="2"/>
    <circle cx="650" cy="640" r="20" fill="#f44336" stroke="#c62828" stroke-width="2"/>
    <circle cx="820" cy="540" r="18" fill="#ef5350" stroke="#d32f2f" stroke-width="2"/>
    <circle cx="820" cy="580" r="18" fill="#e0e0e0" stroke="#757575" stroke-width="2"/>
    <circle cx="820" cy="620" r="18" fill="#ef5350" stroke="#d32f2f" stroke-width="2"/>
    <circle cx="630" cy="680" r="18" fill="#ef5350" stroke="#d32f2f" stroke-width="2"/>
    <line x1="700" y1="580" x2="770" y2="560" stroke="#90a4ae" stroke-width="2"/>
    <line x1="700" y1="580" x2="770" y2="600" stroke="#90a4ae" stroke-width="2"/>
    <line x1="700" y1="580" x2="650" y2="640" stroke="#90a4ae" stroke-width="2"/>
    <line x1="770" y1="560" x2="820" y2="540" stroke="#90a4ae" stroke-width="2"/>
    <line x1="770" y1="560" x2="820" y2="580" stroke="#90a4ae" stroke-width="2"/>
    <line x1="770" y1="600" x2="820" y2="620" stroke="#90a4ae" stroke-width="2"/>
    <line x1="650" y1="640" x2="630" y2="680" stroke="#90a4ae" stroke-width="2"/>
    <text x="700" y="710" font-size="12" text-anchor="middle" fill="#616161">7 infected</text>
    
    <!-- Time t=3 -->
    <text x="1000" y="525" font-size="14" font-weight="bold" fill="#424242">t = 3</text>
    <circle cx="1000" cy="580" r="25" fill="#f44336" stroke="#c62828" stroke-width="2"/>
    <circle cx="1070" cy="560" r="20" fill="#f44336" stroke="#c62828" stroke-width="2"/>
    <circle cx="1070" cy="600" r="20" fill="#f44336" stroke="#c62828" stroke-width="2"/>
    <circle cx="950" cy="640" r="20" fill="#f44336" stroke="#c62828" stroke-width="2"/>
    <circle cx="1120" cy="540" r="18" fill="#f44336" stroke="#c62828" stroke-width="2"/>
    <circle cx="1120" cy="580" r="18" fill="#ef5350" stroke="#d32f2f" stroke-width="2"/>
    <circle cx="1120" cy="620" r="18" fill="#f44336" stroke="#c62828" stroke-width="2"/>
    <circle cx="930" cy="680" r="18" fill="#f44336" stroke="#c62828" stroke-width="2"/>
    <circle cx="1000" cy="700" r="18" fill="#ef5350" stroke="#d32f2f" stroke-width="2"/>
    <line x1="1000" y1="580" x2="1070" y2="560" stroke="#90a4ae" stroke-width="2"/>
    <line x1="1000" y1="580" x2="1070" y2="600" stroke="#90a4ae" stroke-width="2"/>
    <line x1="1000" y1="580" x2="950" y2="640" stroke="#90a4ae" stroke-width="2"/>
    <line x1="1070" y1="560" x2="1120" y2="540" stroke="#90a4ae" stroke-width="2"/>
    <line x1="1070" y1="560" x2="1120" y2="580" stroke="#90a4ae" stroke-width="2"/>
    <line x1="1070" y1="600" x2="1120" y2="620" stroke="#90a4ae" stroke-width="2"/>
    <line x1="950" y1="640" x2="930" y2="680" stroke="#90a4ae" stroke-width="2"/>
    <line x1="950" y1="640" x2="1000" y2="700" stroke="#90a4ae" stroke-width="2"/>
    <text x="1000" y="730" font-size="12" text-anchor="middle" fill="#616161">~15 infected</text>
  </g>
  
  <!-- Key Properties -->
  <g id="properties">
    <rect x="50" y="750" width="1100" height="40" fill="#e1f5fe" stroke="#0277bd" stroke-width="2" rx="6"/>
    <text x="600" y="775" font-size="13" text-anchor="middle" fill="#01579b">
      <tspan font-weight="bold">Key Property:</tspan> Once infected, nodes remain infected forever • No recovery • No immunity loss
    </text>
  </g>
</svg>