<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="startGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="processGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27ae60;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="decisionGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d68910;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dataGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9b59b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8e44ad;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="updateGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1abc9c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a085;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Title -->
  <text x="600" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#2c3e50">
    Stochastic Gradient Descent (SGD) Algorithm Flow
  </text>
  
  <!-- Horizontal Main Flow -->
  
  <!-- 1. Initialize Weights -->
  <g id="step1" transform="translate(50, 120)">
    <rect x="0" y="0" width="140" height="70" fill="url(#startGradient)" stroke="#2980b9" stroke-width="2" rx="10" filter="url(#shadow)"/>
    <text x="70" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Initialize</text>
    <text x="70" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Weights</text>
    <text x="70" y="58" text-anchor="middle" font-family="monospace" font-size="11" fill="#ecf0f1">w₀ ~ Random</text>
  </g>
  
  <!-- 2. Shuffle Dataset -->
  <g id="step2" transform="translate(230, 120)">
    <rect x="0" y="0" width="140" height="70" fill="url(#dataGradient)" stroke="#8e44ad" stroke-width="2" rx="10" filter="url(#shadow)"/>
    <text x="70" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Shuffle</text>
    <text x="70" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Dataset</text>
    <text x="70" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ecf0f1">Randomize order</text>
  </g>
  
  <!-- 3. Select Sample -->
  <g id="step3" transform="translate(410, 120)">
    <rect x="0" y="0" width="140" height="70" fill="url(#processGradient)" stroke="#27ae60" stroke-width="2" rx="10" filter="url(#shadow)"/>
    <text x="70" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Select Sample</text>
    <text x="70" y="43" text-anchor="middle" font-family="monospace" font-size="12" fill="#ecf0f1">(xᵢ, yᵢ)</text>
    <text x="70" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#ecf0f1">Single data point</text>
  </g>
  
  <!-- 4. Forward Pass -->
  <g id="step4" transform="translate(590, 120)">
    <rect x="0" y="0" width="140" height="70" fill="#3498db" stroke="#2980b9" stroke-width="2" rx="10" filter="url(#shadow)"/>
    <text x="70" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Forward Pass</text>
    <text x="70" y="43" text-anchor="middle" font-family="monospace" font-size="12" fill="#ecf0f1">ŷᵢ = f(xᵢ, w)</text>
    <text x="70" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#ecf0f1">Make prediction</text>
  </g>
  
  <!-- 5. Compute Loss -->
  <g id="step5" transform="translate(770, 120)">
    <rect x="0" y="0" width="140" height="70" fill="#e74c3c" stroke="#c0392b" stroke-width="2" rx="10" filter="url(#shadow)"/>
    <text x="70" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Compute Loss</text>
    <text x="70" y="43" text-anchor="middle" font-family="monospace" font-size="12" fill="#ecf0f1">L(ŷᵢ, yᵢ)</text>
    <text x="70" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#ecf0f1">Single sample loss</text>
  </g>
  
  <!-- 6. Compute Gradients -->
  <g id="step6" transform="translate(950, 120)">
    <rect x="0" y="0" width="140" height="70" fill="#9b59b6" stroke="#8e44ad" stroke-width="2" rx="10" filter="url(#shadow)"/>
    <text x="70" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Compute</text>
    <text x="70" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Gradients</text>
    <text x="70" y="58" text-anchor="middle" font-family="monospace" font-size="12" fill="#ecf0f1">∂L/∂w</text>
  </g>
  
  <!-- Second Row - Update and Decision Flow -->
  
  <!-- 7. Update Weights -->
  <g id="step7" transform="translate(950, 240)">
    <rect x="0" y="0" width="140" height="70" fill="url(#updateGradient)" stroke="#16a085" stroke-width="2" rx="10" filter="url(#shadow)"/>
    <text x="70" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Update</text>
    <text x="70" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Weights</text>
    <text x="70" y="58" text-anchor="middle" font-family="monospace" font-size="11" fill="#ecf0f1">w ← w - α∇L</text>
  </g>
  
  <!-- 8. More Samples Decision -->
  <g id="decision1" transform="translate(750, 240)">
    <rect x="0" y="0" width="140" height="70" fill="url(#decisionGradient)" stroke="#d68910" stroke-width="2" rx="10" filter="url(#shadow)"/>
    <text x="70" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">More Samples</text>
    <text x="70" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">in Epoch?</text>
  </g>
  
  <!-- 9. Convergence Decision -->
  <g id="decision2" transform="translate(550, 240)">
    <rect x="0" y="0" width="140" height="70" fill="url(#decisionGradient)" stroke="#d68910" stroke-width="2" rx="10" filter="url(#shadow)"/>
    <text x="70" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Training</text>
    <text x="70" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Converged?</text>
  </g>
  
  <!-- 10. Training Complete -->
  <g id="complete" transform="translate(350, 240)">
    <ellipse cx="70" cy="35" rx="70" ry="35" fill="#27ae60" stroke="#1e8449" stroke-width="2" filter="url(#shadow)"/>
    <text x="70" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Training</text>
    <text x="70" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Complete!</text>
  </g>
  
  <!-- Horizontal Flow Arrows -->
  <g stroke="#2c3e50" stroke-width="3" fill="#2c3e50">
    <!-- Main horizontal flow -->
    <path d="M 190 155 L 230 155" marker-end="url(#arrowhead)"/>
    <path d="M 370 155 L 410 155" marker-end="url(#arrowhead)"/>
    <path d="M 550 155 L 590 155" marker-end="url(#arrowhead)"/>
    <path d="M 730 155 L 770 155" marker-end="url(#arrowhead)"/>
    <path d="M 910 155 L 950 155" marker-end="url(#arrowhead)"/>
    
    <!-- Down from gradients to update -->
    <path d="M 1020 190 L 1020 240" marker-end="url(#arrowhead)"/>
    
    <!-- From update to decision -->
    <path d="M 950 275 L 890 275" marker-end="url(#arrowhead)"/>
    
    <!-- From first decision to second -->
    <path d="M 750 275 L 690 275" marker-end="url(#arrowhead)" stroke="#e74c3c" stroke-width="2"/>
    
    <!-- From second decision to complete -->
    <path d="M 550 275 L 420 275" marker-end="url(#arrowhead)" stroke="#27ae60" stroke-width="3"/>
  </g>
  
  <!-- Loop Arrows -->
  <g stroke="#27ae60" stroke-width="3" fill="none">
    <!-- Yes - More samples loop back -->
    <path d="M 820 240 L 820 100 L 480 100 L 480 120" marker-end="url(#greenarrow)"/>
    <text x="650" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#27ae60" font-weight="bold">YES - Next Sample</text>
  </g>
  
  <g stroke="#e74c3c" stroke-width="3" fill="none">
    <!-- No - New epoch loop -->
    <path d="M 620 240 L 620 80 L 300 80 L 300 120" marker-end="url(#redarrow)"/>
    <text x="460" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#e74c3c" font-weight="bold">NO - New Epoch</text>
  </g>
  
  <!-- Labels for decision paths -->
  <text x="820" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#e74c3c" font-weight="bold">NO</text>
  <text x="820" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#27ae60" font-weight="bold">YES</text>
  
  <text x="620" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#27ae60" font-weight="bold">YES</text>
  <text x="620" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#e74c3c" font-weight="bold">NO</text>
  
  <!-- Information Panels -->
  
  <!-- SGD vs Batch Comparison -->
  <g id="comparison" transform="translate(50, 380)">
    <rect x="0" y="0" width="520" height="180" fill="#f8f9fa" stroke="#6c757d" stroke-width="2" rx="15" filter="url(#shadow)"/>
    <text x="260" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">
      SGD vs Batch Gradient Descent Comparison
    </text>
    
    <!-- Headers -->
    <text x="130" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#e74c3c">
      Stochastic GD
    </text>
    <text x="390" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#3498db">
      Batch GD
    </text>
    
    <!-- SGD Advantages -->
    <text x="30" y="75" font-family="Arial, sans-serif" font-size="12" fill="#27ae60">✓ Fast updates per sample</text>
    <text x="30" y="95" font-family="Arial, sans-serif" font-size="12" fill="#27ae60">✓ Memory efficient</text>
    <text x="30" y="115" font-family="Arial, sans-serif" font-size="12" fill="#27ae60">✓ Escapes local minima</text>
    <text x="30" y="135" font-family="Arial, sans-serif" font-size="12" fill="#27ae60">✓ Online learning capable</text>
    
    <!-- SGD Disadvantages -->
    <text x="30" y="155" font-family="Arial, sans-serif" font-size="12" fill="#e74c3c">✗ Noisy gradient estimates</text>
    
    <!-- Batch GD Advantages -->
    <text x="290" y="75" font-family="Arial, sans-serif" font-size="12" fill="#27ae60">✓ Stable convergence</text>
    <text x="290" y="95" font-family="Arial, sans-serif" font-size="12" fill="#27ae60">✓ Accurate gradients</text>
    <text x="290" y="115" font-family="Arial, sans-serif" font-size="12" fill="#27ae60">✓ Theoretical guarantees</text>
    
    <!-- Batch GD Disadvantages -->
    <text x="290" y="135" font-family="Arial, sans-serif" font-size="12" fill="#e74c3c">✗ Slow for large datasets</text>
    <text x="290" y="155" font-family="Arial, sans-serif" font-size="12" fill="#e74c3c">✗ High memory requirements</text>
  </g>
  
  <!-- Key Concepts -->
  <g id="concepts" transform="translate(620, 380)">
    <rect x="0" y="0" width="470" height="180" fill="#e8f6f3" stroke="#1abc9c" stroke-width="2" rx="15" filter="url(#shadow)"/>
    <text x="235" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#16a085">
      Key SGD Concepts &amp; Parameters
    </text>
    
    <text x="20" y="50" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2c3e50">
      Epoch: <tspan font-weight="normal" fill="#34495e">One complete pass through the entire dataset</tspan>
    </text>
    
    <text x="20" y="75" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2c3e50">
      Learning Rate (α): <tspan font-weight="normal" fill="#34495e">Step size, typically 0.001-0.1</tspan>
    </text>
    
    <text x="20" y="100" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2c3e50">
      Batch Size: <tspan font-weight="normal" fill="#34495e">1 for SGD, 32-512 for mini-batch</tspan>
    </text>
    
    <text x="20" y="125" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2c3e50">
      Momentum: <tspan font-weight="normal" fill="#34495e">Accumulates gradients for smoother updates</tspan>
    </text>
    
    <text x="20" y="150" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2c3e50">
      Shuffling: <tspan font-weight="normal" fill="#34495e">Randomize sample order each epoch</tspan>
    </text>
  </g>
  
  <!-- Mini-Batch Note -->
  <g id="minibatch-note" transform="translate(50, 580)">
    <rect x="0" y="0" width="1040" height="60" fill="#fff3cd" stroke="#f39c12" stroke-width="2" rx="10" filter="url(#shadow)"/>
    <text x="520" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#d68910">
      💡 Mini-Batch SGD: Best of Both Worlds
    </text>
    <text x="520" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#856404">
      Process small batches (32-256 samples) instead of single samples for better GPU utilization and stable gradients
    </text>
  </g>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/>
    </marker>
    <marker id="greenarrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#27ae60"/>
    </marker>
    <marker id="redarrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
  </defs>
</svg>