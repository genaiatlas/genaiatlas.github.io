<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="headerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3f51b5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5c6bc0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="regressionGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#66BB6A;stop-opacity:0.6" />
    </linearGradient>
    <linearGradient id="classificationGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2196F3;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#42A5F5;stop-opacity:0.6" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <dropShadow dx="2" dy="2" stdDeviation="2" flood-color="#00000030"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="700" fill="#fafafa"/>
  
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1a1a1a">Comprehensive Loss Function Comparison</text>
  
  <!-- Main Comparison Table -->
  <g transform="translate(50, 60)">
    <rect x="0" y="0" width="800" height="400" rx="10" fill="white" stroke="#ddd" stroke-width="1" filter="url(#shadow)"/>
    
    <!-- Header row -->
    <rect x="0" y="0" width="800" height="50" rx="10" fill="url(#headerGradient)"/>
    <text x="100" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Aspect</text>
    <text x="300" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">MSE (Regression)</text>
    <text x="550" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Cross-Entropy (Classification)</text>
    <text x="750" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Rating</text>
    
    <!-- Row 1: Mathematical Formula -->
    <rect x="0" y="50" width="800" height="40" fill="#f8f9fa"/>
    <text x="20" y="75" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Formula</text>
    <text x="200" y="70" font-family="Arial, sans-serif" font-size="11" fill="#333">L = (1/n)Σ(yᵢ - ŷᵢ)²</text>
    <text x="450" y="70" font-family="Arial, sans-serif" font-size="11" fill="#333">L = -(1/n)Σ[yᵢlog(pᵢ) +</text>
    <text x="500" y="82" font-family="Arial, sans-serif" font-size="11" fill="#333">(1-yᵢ)log(1-pᵢ)]</text>
    <text x="750" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">-</text>
    
    <!-- Row 2: Output Range -->
    <rect x="0" y="90" width="800" height="35" fill="white"/>
    <text x="20" y="112" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Output Range</text>
    <text x="300" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">[0, ∞)</text>
    <text x="550" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">[0, ∞)</text>
    <circle cx="750" cy="107" r="8" fill="#4CAF50"/>
    <text x="750" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">✓</text>
    
    <!-- Row 3: Computational Complexity -->
    <rect x="0" y="125" width="800" height="35" fill="#f8f9fa"/>
    <text x="20" y="147" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Complexity</text>
    <text x="300" y="147" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">O(n) - Simple</text>
    <text x="550" y="147" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">O(n) - Log operations</text>
    <circle cx="720" cy="142" r="8" fill="#4CAF50"/>
    <circle cx="750" cy="142" r="8" fill="#FF9800"/>
    <circle cx="780" cy="142" r="8" fill="#FF9800"/>
    
    <!-- Row 4: Gradient Behavior -->
    <rect x="0" y="160" width="800" height="35" fill="white"/>
    <text x="20" y="182" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Gradient</text>
    <text x="300" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">Linear with error</text>
    <text x="550" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">Exponential scaling</text>
    <circle cx="720" cy="177" r="8" fill="#FF9800"/>
    <circle cx="750" cy="177" r="8" fill="#4CAF50"/>
    <circle cx="780" cy="177" r="8" fill="#4CAF50"/>
    
    <!-- Row 5: Outlier Robustness -->
    <rect x="0" y="195" width="800" height="35" fill="#f8f9fa"/>
    <text x="20" y="217" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Outlier Robust</text>
    <text x="300" y="217" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">Low (quadratic penalty)</text>
    <text x="550" y="217" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">Moderate</text>
    <circle cx="750" cy="212" r="8" fill="#F44336"/>
    <circle cx="780" cy="212" r="8" fill="#FF9800"/>
    
    <!-- Row 6: Convergence Speed -->
    <rect x="0" y="230" width="800" height="35" fill="white"/>
    <text x="20" y="252" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Convergence</text>
    <text x="300" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">Moderate</text>
    <text x="550" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">Fast (when calibrated)</text>
    <circle cx="720" cy="247" r="8" fill="#FF9800"/>
    <circle cx="750" cy="247" r="8" fill="#4CAF50"/>
    <circle cx="780" cy="247" r="8" fill="#4CAF50"/>
    
    <!-- Row 7: Numerical Stability -->
    <rect x="0" y="265" width="800" height="35" fill="#f8f9fa"/>
    <text x="20" y="287" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Numerical Stability</text>
    <text x="300" y="287" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">High</text>
    <text x="550" y="287" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">Requires care (log(0))</text>
    <circle cx="720" cy="282" r="8" fill="#4CAF50"/>
    <circle cx="750" cy="282" r="8" fill="#4CAF50"/>
    <circle cx="780" cy="282" r="8" fill="#F44336"/>
    
    <!-- Row 8: Activation Function -->
    <rect x="0" y="300" width="800" height="35" fill="white"/>
    <text x="20" y="322" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Best Activation</text>
    <text x="300" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">Identity (Linear)</text>
    <text x="550" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">Sigmoid / Softmax</text>
    <circle cx="750" cy="317" r="8" fill="#4CAF50"/>
    <text x="750" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">✓</text>
    
    <!-- Row 9: Use Cases -->
    <rect x="0" y="335" width="800" height="35" fill="#f8f9fa"/>
    <text x="20" y="357" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Typical Applications</text>
    <text x="300" y="357" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">Price, Temperature</text>
    <text x="550" y="357" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">Spam, Medical Diagnosis</text>
    <circle cx="750" cy="352" r="8" fill="#4CAF50"/>
    <text x="750" y="357" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">✓</text>
    
    <!-- Legend -->
    <g transform="translate(650, 375)">
      <text x="0" y="10" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#333">Rating:</text>
      <circle cx="15" cy="20" r="6" fill="#4CAF50"/>
      <text x="25" y="25" font-family="Arial, sans-serif" font-size="9" fill="#333">Excellent</text>
      <circle cx="70" cy="20" r="6" fill="#FF9800"/>
      <text x="80" y="25" font-family="Arial, sans-serif" font-size="9" fill="#333">Good</text>
      <circle cx="115" cy="20" r="6" fill="#F44336"/>
      <text x="125" y="25" font-family="Arial, sans-serif" font-size="9" fill="#333">Poor</text>
    </g>
  </g>
  
  <!-- Performance Characteristics Chart -->
  <g transform="translate(50, 480)">
    <rect x="0" y="0" width="380" height="200" rx="10" fill="url(#regressionGradient)"/>
    <text x="190" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">MSE Performance Profile</text>
    
    <!-- Radar-like chart for MSE -->
    <g transform="translate(190, 120)">
      <!-- Axes -->
      <line x1="0" y1="-60" x2="0" y2="60" stroke="#ffffff80" stroke-width="1"/>
      <line x1="-60" y1="0" x2="60" y2="0" stroke="#ffffff80" stroke-width="1"/>
      <line x1="-42" y1="-42" x2="42" y2="42" stroke="#ffffff80" stroke-width="1"/>
      <line x1="42" y1="-42" x2="-42" y2="42" stroke="#ffffff80" stroke-width="1"/>
      
      <!-- Performance polygon for MSE -->
      <polygon points="0,-50 35,25 10,45 -25,30 -40,-15 -20,-45" 
               fill="#ffffff60" stroke="white" stroke-width="2"/>
      
      <!-- Labels -->
      <text x="0" y="-75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Speed</text>
      <text x="75" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Simplicity</text>
      <text x="0" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Stability</text>
      <text x="-75" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Robustness</text>
      
      <!-- Scores -->
      <circle cx="0" cy="-50" r="3" fill="white"/>
      <circle cx="35" cy="25" r="3" fill="white"/>
      <circle cx="10" cy="45" r="3" fill="white"/>
      <circle cx="-40" cy="-15" r="3" fill="white"/>
    </g>
  </g>
  
  <!-- Cross-Entropy Performance Chart -->
  <g transform="translate(470, 480)">
    <rect x="0" y="0" width="380" height="200" rx="10" fill="url(#classificationGradient)"/>
    <text x="190" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">Cross-Entropy Performance Profile</text>
    
    <!-- Radar-like chart for Cross-Entropy -->
    <g transform="translate(190, 120)">
      <!-- Axes -->
      <line x1="0" y1="-60" x2="0" y2="60" stroke="#ffffff80" stroke-width="1"/>
      <line x1="-60" y1="0" x2="60" y2="0" stroke="#ffffff80" stroke-width="1"/>
      <line x1="-42" y1="-42" x2="42" y2="42" stroke="#ffffff80" stroke-width="1"/>
      <line x1="42" y1="-42" x2="-42" y2="42" stroke="#ffffff80" stroke-width="1"/>
      
      <!-- Performance polygon for Cross-Entropy -->
      <polygon points="0,-55 20,20 30,50 -10,40 -45,5 -30,-40" 
               fill="#ffffff60" stroke="white" stroke-width="2"/>
      
      <!-- Labels -->
      <text x="0" y="-75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Speed</text>
      <text x="75" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Gradient Quality</text>
      <text x="0" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Prob. Interp.</text>
      <text x="-75" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Stability</text>
      
      <!-- Scores -->
      <circle cx="0" cy="-55" r="3" fill="white"/>
      <circle cx="20" cy="20" r="3" fill="white"/>
      <circle cx="30" cy="50" r="3" fill="white"/>
      <circle cx="-45" cy="5" r="3" fill="white"/>
    </g>
  </g>
  
  <!-- Key Recommendations -->
  <rect x="50" y="650" width="800" height="40" rx="8" fill="#e8f5e8" stroke="#4caf50" stroke-width="1"/>
  <text x="70" y="670" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2e7d32">🎯 Choice Guidelines:</text>
  <text x="70" y="685" font-family="Arial, sans-serif" font-size="11" fill="#2e7d32">• Use MSE for continuous outputs • Use Cross-Entropy for probability-based predictions • Consider data characteristics and computational constraints</text>
</svg>