<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="900" height="700" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="450" y="35" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Normal Distribution Properties
  </text>
  
  <!-- Main bell curve -->
  <g transform="translate(150, 80)">
    <!-- Define the bell curve path -->
    <path d="M 50 250 Q 100 180, 150 130 T 250 90 T 350 90 T 450 130 T 550 250" 
          fill="none" stroke="#3498db" stroke-width="3"/>
    <path d="M 50 250 Q 100 180, 150 130 T 250 90 T 350 90 T 450 130 T 550 250 L 550 250 L 50 250 Z" 
          fill="#3498db" opacity="0.1"/>
    
    <!-- X-axis -->
    <line x1="50" y1="250" x2="550" y2="250" stroke="#34495e" stroke-width="2"/>
    
    <!-- Mean line -->
    <line x1="300" y1="90" x2="300" y2="270" stroke="#e74c3c" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="300" y="285" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#e74c3c">μ</text>
    
    <!-- Standard deviation markers -->
    <!-- -3σ -->
    <line x1="90" y1="245" x2="90" y2="255" stroke="#7f8c8d" stroke-width="2"/>
    <text x="90" y="270" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d">-3σ</text>
    
    <!-- -2σ -->
    <line x1="160" y1="245" x2="160" y2="255" stroke="#7f8c8d" stroke-width="2"/>
    <text x="160" y="270" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d">-2σ</text>
    
    <!-- -1σ -->
    <line x1="230" y1="245" x2="230" y2="255" stroke="#7f8c8d" stroke-width="2"/>
    <text x="230" y="270" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d">-1σ</text>
    
    <!-- +1σ -->
    <line x1="370" y1="245" x2="370" y2="255" stroke="#7f8c8d" stroke-width="2"/>
    <text x="370" y="270" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d">+1σ</text>
    
    <!-- +2σ -->
    <line x1="440" y1="245" x2="440" y2="255" stroke="#7f8c8d" stroke-width="2"/>
    <text x="440" y="270" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d">+2σ</text>
    
    <!-- +3σ -->
    <line x1="510" y1="245" x2="510" y2="255" stroke="#7f8c8d" stroke-width="2"/>
    <text x="510" y="270" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d">+3σ</text>
    
    <!-- 68% region (±1σ) -->
    <path d="M 230 250 Q 250 150, 265 105 T 300 90 T 335 105 T 370 250" 
          fill="#27ae60" opacity="0.3"/>
    <text x="300" y="170" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#27ae60">68.27%</text>
    <line x1="230" y1="150" x2="230" y2="180" stroke="#27ae60" stroke-width="2"/>
    <line x1="370" y1="150" x2="370" y2="180" stroke="#27ae60" stroke-width="2"/>
    <line x1="230" y1="165" x2="370" y2="165" stroke="#27ae60" stroke-width="2"/>
    
    <!-- 95% region (±2σ) -->
    <path d="M 160 250 Q 185 165, 210 120 T 265 95 T 300 90 T 335 95 T 390 120 T 440 250" 
          fill="#f39c12" opacity="0.2"/>
    <text x="300" y="210" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#f39c12">95.45%</text>
    <line x1="160" y1="195" x2="160" y2="225" stroke="#f39c12" stroke-width="2"/>
    <line x1="440" y1="195" x2="440" y2="225" stroke="#f39c12" stroke-width="2"/>
    <line x1="160" y1="210" x2="440" y2="210" stroke="#f39c12" stroke-width="2"/>
    
    <!-- 99.7% region (±3σ) -->
    <text x="300" y="40" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#9b59b6">99.73%</text>
    <line x1="90" y1="25" x2="90" y2="55" stroke="#9b59b6" stroke-width="2"/>
    <line x1="510" y1="25" x2="510" y2="55" stroke="#9b59b6" stroke-width="2"/>
    <line x1="90" y1="40" x2="510" y2="40" stroke="#9b59b6" stroke-width="2"/>
  </g>
  
  <!-- Formula box -->
  <g transform="translate(150, 380)">
    <rect x="0" y="0" width="600" height="60" fill="#ecf0f1" stroke="#95a5a6" stroke-width="2" rx="5"/>
    <text x="300" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Probability Density Function
    </text>
    <text x="300" y="45" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#34495e">
      f(x) = (1 / σ√(2π)) × exp(-(x-μ)² / 2σ²)
    </text>
  </g>
  
  <!-- Key Properties -->
  <g transform="translate(100, 470)">
    <text x="350" y="0" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Key Properties
    </text>
    
    <g transform="translate(0, 25)">
      <!-- Property 1 -->
      <rect x="0" y="0" width="330" height="80" fill="white" stroke="#3498db" stroke-width="2" rx="5"/>
      <text x="165" y="25" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#3498db">
        Symmetry
      </text>
      <text x="165" y="45" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">
        Bell-shaped and symmetric
      </text>
      <text x="165" y="60" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">
        around the mean μ
      </text>
    </g>
    
    <g transform="translate(360, 25)">
      <!-- Property 2 -->
      <rect x="0" y="0" width="330" height="80" fill="white" stroke="#27ae60" stroke-width="2" rx="5"/>
      <text x="165" y="25" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#27ae60">
        Mean = Median = Mode
      </text>
      <text x="165" y="45" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">
        All measures of central
      </text>
      <text x="165" y="60" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">
        tendency coincide at μ
      </text>
    </g>
    
    <g transform="translate(0, 115)">
      <!-- Property 3 -->
      <rect x="0" y="0" width="330" height="80" fill="white" stroke="#f39c12" stroke-width="2" rx="5"/>
      <text x="165" y="25" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#f39c12">
        Asymptotic
      </text>
      <text x="165" y="45" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">
        Tails approach but never
      </text>
      <text x="165" y="60" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">
        touch the horizontal axis
      </text>
    </g>
    
    <g transform="translate(360, 115)">
      <!-- Property 4 -->
      <rect x="0" y="0" width="330" height="80" fill="white" stroke="#9b59b6" stroke-width="2" rx="5"/>
      <text x="165" y="25" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#9b59b6">
        Total Area = 1
      </text>
      <text x="165" y="45" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">
        Entire area under the curve
      </text>
      <text x="165" y="60" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">
        equals 1 (100% probability)
      </text>
    </g>
  </g>
  
  <!-- Bottom note -->
  <text x="450" y="680" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d" font-style="italic">
    The Empirical Rule: Most data (99.7%) falls within 3 standard deviations of the mean
  </text>
</svg>