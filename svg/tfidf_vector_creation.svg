<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="vectorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dbeafe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bfdbfe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="formulaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f3f4f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e5e7eb;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1f2937">
    TF-IDF Vector Creation Process
  </text>
  
  <!-- Step 1: Raw Entity Counts -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="200" height="120" rx="8" fill="url(#formulaGrad)" stroke="#6b7280" stroke-width="2"/>
    <text x="100" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#374151">Raw Entity Counts</text>
    <text x="100" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">Dictionary: 1,063 entities</text>
    
    <!-- Vector representation -->
    <rect x="20" y="60" width="160" height="25" rx="3" fill="white" stroke="#9ca3af" stroke-width="1"/>
    <text x="30" y="75" font-family="monospace" font-size="10" fill="#374151">[0, 0, 0, 3, 1, 0, 6, 0, ...]</text>
    <text x="100" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">Position 138: Britain (6×)</text>
    <text x="100" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">Position 442: Brexit (3×)</text>
  </g>
  
  <!-- Arrow -->
  <path d="M 270 140 L 310 140" stroke="#3b82f6" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Step 2: Term Frequency Calculation -->
  <g transform="translate(330, 80)">
    <rect x="0" y="0" width="200" height="120" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="100" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#92400e">Term Frequency</text>
    <text x="100" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#92400e">Normalize by article length</text>
    
    <!-- Formula -->
    <rect x="20" y="60" width="160" height="35" rx="3" fill="white" stroke="#f59e0b" stroke-width="1"/>
    <text x="100" y="75" text-anchor="middle" font-family="monospace" font-size="12" fill="#92400e">TF = count / total</text>
    <text x="100" y="85" text-anchor="middle" font-family="monospace" font-size="10" fill="#92400e">Britain: 6/200 = 0.03</text>
    
    <text x="100" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#92400e">Accounts for article length</text>
  </g>
  
  <!-- Arrow -->
  <path d="M 550 140 L 590 140" stroke="#3b82f6" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Step 3: Inverse Document Frequency -->
  <g transform="translate(610, 80)">
    <rect x="0" y="0" width="200" height="120" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="100" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#166534">Inverse Doc Freq</text>
    <text x="100" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#166534">Weight by rarity</text>
    
    <!-- Formula -->
    <rect x="20" y="60" width="160" height="35" rx="3" fill="white" stroke="#22c55e" stroke-width="1"/>
    <text x="100" y="75" text-anchor="middle" font-family="monospace" font-size="12" fill="#166534">IDF = 1 / df(term)</text>
    <text x="100" y="85" text-anchor="middle" font-family="monospace" font-size="10" fill="#166534">Britain: 1/35 = 0.029</text>
    
    <text x="100" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#166534">Rare terms get higher weight</text>
  </g>
  
  <!-- Arrow down -->
  <path d="M 500 220 L 500 260" stroke="#3b82f6" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Final TF-IDF Calculation -->
  <g transform="translate(300, 280)">
    <rect x="0" y="0" width="400" height="100" rx="8" fill="url(#vectorGrad)" stroke="#3b82f6" stroke-width="3"/>
    <text x="200" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1e40af">TF-IDF Final Score</text>
    
    <rect x="50" y="40" width="300" height="35" rx="3" fill="white" stroke="#3b82f6" stroke-width="2"/>
    <text x="200" y="55" text-anchor="middle" font-family="monospace" font-size="14" fill="#1e40af">TF-IDF = TF × IDF</text>
    <text x="200" y="68" text-anchor="middle" font-family="monospace" font-size="12" fill="#1e40af">Britain: 0.03 × 0.029 = 0.00087</text>
    
    <text x="200" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1e40af">Higher scores = more distinctive to article</text>
  </g>
  
  <!-- Example Calculation Table -->
  <g transform="translate(100, 420)">
    <rect x="0" y="0" width="800" height="220" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <text x="400" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">Example: Brexit Article TF-IDF Calculation</text>
    
    <!-- Headers -->
    <rect x="20" y="40" width="120" height="25" fill="#3b82f6" rx="3"/>
    <text x="80" y="57" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Entity</text>
    
    <rect x="140" y="40" width="80" height="25" fill="#3b82f6" rx="3"/>
    <text x="180" y="57" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Count</text>
    
    <rect x="220" y="40" width="100" height="25" fill="#3b82f6" rx="3"/>
    <text x="270" y="57" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Total Entities</text>
    
    <rect x="320" y="40" width="80" height="25" fill="#3b82f6" rx="3"/>
    <text x="360" y="57" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">TF</text>
    
    <rect x="400" y="40" width="100" height="25" fill="#3b82f6" rx="3"/>
    <text x="450" y="57" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Doc Freq</text>
    
    <rect x="500" y="40" width="80" height="25" fill="#3b82f6" rx="3"/>
    <text x="540" y="57" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">IDF</text>
    
    <rect x="580" y="40" width="100" height="25" fill="#3b82f6" rx="3"/>
    <text x="630" y="57" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">TF-IDF</text>
    
    <rect x="680" y="40" width="100" height="25" fill="#3b82f6" rx="3"/>
    <text x="730" y="57" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Significance</text>
    
    <!-- Data rows -->
    <g transform="translate(0, 65)">
      <!-- Row 1: Brexit -->
      <rect x="20" y="0" width="760" height="20" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
      <text x="80" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">Brexit</text>
      <text x="180" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">3</text>
      <text x="270" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">200</text>
      <text x="360" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">0.015</text>
      <text x="450" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">12</text>
      <text x="540" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">0.083</text>
      <text x="630" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">0.00125</text>
      <text x="730" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#059669">High</text>
      
      <!-- Row 2: Britain -->
      <rect x="20" y="20" width="760" height="20" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
      <text x="80" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">Britain</text>
      <text x="180" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">6</text>
      <text x="270" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">200</text>
      <text x="360" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">0.030</text>
      <text x="450" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">35</text>
      <text x="540" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">0.029</text>
      <text x="630" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">0.00087</text>
      <text x="730" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#f59e0b">Medium</text>
      
      <!-- Row 3: EU -->
      <rect x="20" y="40" width="760" height="20" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
      <text x="80" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">EU</text>
      <text x="180" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">11</text>
      <text x="270" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">200</text>
      <text x="360" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">0.055</text>
      <text x="450" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">18</text>
      <text x="540" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">0.056</text>
      <text x="630" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">0.00308</text>
      <text x="730" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#dc2626">Very High</text>
      
      <!-- Row 4: Daniel Hannan -->
      <rect x="20" y="60" width="760" height="20" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
      <text x="80" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">D. Hannan</text>
      <text x="180" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">1</text>
      <text x="270" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">200</text>
      <text x="360" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">0.005</text>
      <text x="450" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">2</text>
      <text x="540" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">0.500</text>
      <text x="630" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">0.00250</text>
      <text x="730" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#dc2626">Very High</text>
      
      <!-- Row 5: Common word example -->
      <rect x="20" y="80" width="760" height="20" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
      <text x="80" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">London</text>
      <text x="180" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">4</text>
      <text x="270" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">200</text>
      <text x="360" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">0.020</text>
      <text x="450" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">58</text>
      <text x="540" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">0.017</text>
      <text x="630" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">0.00034</text>
      <text x="730" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">Low</text>
    </g>
    
    <!-- Key Insights -->
    <g transform="translate(50, 170)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#374151">Key Insights:</text>
      <text x="0" y="20" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">• Rare entities (Daniel Hannan) get very high TF-IDF despite low frequency</text>
      <text x="0" y="35" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">• Common locations (London) get lower scores even with multiple mentions</text>
      <text x="0" y="50" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">• Article-specific terms (Brexit, EU) receive highest relevance scores</text>
    </g>
  </g>
  
  <!-- Mathematical Formula -->
  <g transform="translate(50, 660)">
    <rect x="0" y="0" width="900" height="35" rx="5" fill="#1f2937" stroke="#374151" stroke-width="2"/>
    <text x="450" y="23" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="white">
      TF-IDF(term, doc) = (count(term, doc) / |entities(doc)|) × (1 / documents_containing(term))
    </text>
  </g>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
     refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6" />
    </marker>
  </defs>
</svg>