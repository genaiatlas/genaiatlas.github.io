<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1400" height="1000" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="700" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Indexing Optimization Strategies
  </text>
  <text x="700" y="70" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#495057">
    Maximizing Retrieval Quality and System Performance
  </text>
  
  <!-- Strategy 1: Chunking Optimization -->
  <g id="chunking-optimization">
    <rect x="50" y="110" width="420" height="200" rx="10" fill="#fff5f5" stroke="#c92a2a" stroke-width="3"/>
    <text x="260" y="145" font-family="Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      1️⃣ Chunking Optimization
    </text>
    
    <text x="70" y="175" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#c92a2a">
      Fixed-Size Chunking
    </text>
    <text x="70" y="195" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Simple, fast (e.g., 512 tokens)
    </text>
    <text x="70" y="212" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • May break context at boundaries
    </text>
    
    <text x="70" y="240" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#c92a2a">
      Semantic Chunking
    </text>
    <text x="70" y="260" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Respects topic boundaries
    </text>
    <text x="70" y="277" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Better context preservation
    </text>
    <text x="70" y="294" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Variable chunk sizes
    </text>
  </g>
  
  <!-- Strategy 2: Multi-Representation -->
  <g id="multi-representation">
    <rect x="490" y="110" width="420" height="200" rx="10" fill="#fff5f5" stroke="#c92a2a" stroke-width="3"/>
    <text x="700" y="145" font-family="Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      2️⃣ Multi-Representation
    </text>
    
    <text x="510" y="175" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#c92a2a">
      Document Summary Indexing
    </text>
    <text x="510" y="195" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Index summaries for better recall
    </text>
    <text x="510" y="212" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Retrieve full documents
    </text>
    
    <text x="510" y="240" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#c92a2a">
      Propositions Indexing
    </text>
    <text x="510" y="260" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Break into atomic facts
    </text>
    <text x="510" y="277" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • High precision retrieval
    </text>
    <text x="510" y="294" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Better for fact-based queries
    </text>
  </g>
  
  <!-- Strategy 3: Hierarchical Indexing -->
  <g id="hierarchical-indexing">
    <rect x="930" y="110" width="420" height="200" rx="10" fill="#fff5f5" stroke="#c92a2a" stroke-width="3"/>
    <text x="1140" y="145" font-family="Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      3️⃣ Hierarchical Indexing
    </text>
    
    <text x="950" y="175" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#c92a2a">
      Document Hierarchy
    </text>
    <text x="950" y="195" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Parent → Child relationships
    </text>
    <text x="950" y="212" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Section → Subsection → Chunks
    </text>
    
    <text x="950" y="240" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#c92a2a">
      Benefits
    </text>
    <text x="950" y="260" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Retrieve at appropriate granularity
    </text>
    <text x="950" y="277" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Navigate up/down hierarchy
    </text>
    <text x="950" y="294" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Better context assembly
    </text>
  </g>
  
  <!-- Strategy 4: Embedding Optimization -->
  <g id="embedding-optimization">
    <rect x="50" y="330" width="420" height="250" rx="10" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="3"/>
    <text x="260" y="365" font-family="Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      4️⃣ Embedding Optimization
    </text>
    
    <text x="70" y="395" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1c7ed6">
      Model Selection
    </text>
    <text x="70" y="415" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Domain-specific models
    </text>
    <text x="70" y="432" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Higher dimensions = better quality
    </text>
    <text x="70" y="449" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Trade-off: quality vs speed/cost
    </text>
    
    <text x="70" y="477" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1c7ed6">
      Hybrid Embeddings
    </text>
    <text x="70" y="497" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Combine dense + sparse vectors
    </text>
    <text x="70" y="514" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Dense: semantic similarity
    </text>
    <text x="70" y="531" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Sparse: keyword matching (BM25)
    </text>
    <text x="70" y="548" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Best of both worlds
    </text>
  </g>
  
  <!-- Strategy 5: Context Enrichment -->
  <g id="context-enrichment">
    <rect x="490" y="330" width="420" height="250" rx="10" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="3"/>
    <text x="700" y="365" font-family="Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      5️⃣ Context Enrichment
    </text>
    
    <text x="510" y="395" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1c7ed6">
      Sentence Window
    </text>
    <text x="510" y="415" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Index small chunks
    </text>
    <text x="510" y="432" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Retrieve with surrounding context
    </text>
    <text x="510" y="449" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Better precision + context
    </text>
    
    <text x="510" y="477" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1c7ed6">
      Auto-Merging Retrieval
    </text>
    <text x="510" y="497" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Merge adjacent retrieved chunks
    </text>
    <text x="510" y="514" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Combine related context
    </text>
    <text x="510" y="531" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Reduce fragmentation
    </text>
  </g>
  
  <!-- Strategy 6: Index Maintenance -->
  <g id="index-maintenance">
    <rect x="930" y="330" width="420" height="250" rx="10" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="3"/>
    <text x="1140" y="365" font-family="Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      6️⃣ Index Maintenance
    </text>
    
    <text x="950" y="395" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1c7ed6">
      Incremental Updates
    </text>
    <text x="950" y="415" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Add/update documents efficiently
    </text>
    <text x="950" y="432" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Avoid full re-indexing
    </text>
    <text x="950" y="449" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Track document versions
    </text>
    
    <text x="950" y="477" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1c7ed6">
      Deduplication
    </text>
    <text x="950" y="497" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Remove duplicate content
    </text>
    <text x="950" y="514" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Improve index quality
    </text>
    <text x="950" y="531" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Reduce storage costs
    </text>
    
    <text x="950" y="559" font-family="Arial, sans-serif" font-size="11" fill="#868e96" font-style="italic">
      Regular index optimization needed
    </text>
  </g>
  
  <!-- Strategy 7: Query-Time Optimizations -->
  <g id="query-time">
    <rect x="50" y="600" width="660" height="220" rx="10" fill="#d3f9d8" stroke="#37b24d" stroke-width="3"/>
    <text x="380" y="635" font-family="Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      7️⃣ Query-Time Optimizations
    </text>
    
    <rect x="70" y="655" width="300" height="145" rx="8" fill="#fff" stroke="#37b24d" stroke-width="2"/>
    <text x="220" y="680" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#37b24d">
      Pre-Filtering
    </text>
    <text x="90" y="705" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Filter by metadata first
    </text>
    <text x="90" y="722" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Reduce search space
    </text>
    <text x="90" y="739" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Date, category, author filters
    </text>
    <text x="90" y="756" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Faster, more relevant results
    </text>
    <text x="220" y="785" font-family="Arial, sans-serif" font-size="10" font-style="italic" text-anchor="middle" fill="#37b24d">
      Filter before semantic search
    </text>
    
    <rect x="390" y="655" width="300" height="145" rx="8" fill="#fff" stroke="#37b24d" stroke-width="2"/>
    <text x="540" y="680" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#37b24d">
      Result Re-Ranking
    </text>
    <text x="410" y="705" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Initial retrieval (top-k)
    </text>
    <text x="410" y="722" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Re-rank with better model
    </text>
    <text x="410" y="739" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Cross-encoder models
    </text>
    <text x="410" y="756" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Improves top results quality
    </text>
    <text x="540" y="785" font-family="Arial, sans-serif" font-size="10" font-style="italic" text-anchor="middle" fill="#37b24d">
      Two-stage retrieval
    </text>
  </g>
  
  <!-- Strategy 8: Storage Optimization -->
  <g id="storage-optimization">
    <rect x="730" y="600" width="620" height="220" rx="10" fill="#d3f9d8" stroke="#37b24d" stroke-width="3"/>
    <text x="1040" y="635" font-family="Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      8️⃣ Storage Optimization
    </text>
    
    <rect x="750" y="655" width="280" height="145" rx="8" fill="#fff" stroke="#37b24d" stroke-width="2"/>
    <text x="890" y="680" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#37b24d">
      Vector Compression
    </text>
    <text x="770" y="705" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Product Quantization (PQ)
    </text>
    <text x="770" y="722" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Scalar Quantization (SQ)
    </text>
    <text x="770" y="739" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Reduce memory footprint
    </text>
    <text x="770" y="756" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Trade-off: size vs accuracy
    </text>
    <text x="890" y="785" font-family="Arial, sans-serif" font-size="10" font-style="italic" text-anchor="middle" fill="#37b24d">
      8x-32x compression
    </text>
    
    <rect x="1050" y="655" width="280" height="145" rx="8" fill="#fff" stroke="#37b24d" stroke-width="2"/>
    <text x="1190" y="680" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#37b24d">
      Hot/Cold Tiering
    </text>
    <text x="1070" y="705" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Hot: Recent/frequent in RAM
    </text>
    <text x="1070" y="722" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Warm: SSD storage
    </text>
    <text x="1070" y="739" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Cold: Archive/disk storage
    </text>
    <text x="1070" y="756" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Cost-effective scaling
    </text>
    <text x="1190" y="785" font-family="Arial, sans-serif" font-size="10" font-style="italic" text-anchor="middle" fill="#37b24d">
      Balance cost &amp; performance
    </text>
  </g>
  
  <!-- Best Practices Summary -->
  <rect x="50" y="840" width="1300" height="140" rx="10" fill="#fff3bf" stroke="#fcc419" stroke-width="3"/>
  <text x="700" y="875" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    💡 Optimization Best Practices
  </text>
  <text x="70" y="905" font-family="Arial, sans-serif" font-size="12" fill="#495057">
    ✓ Start simple, measure performance, then optimize based on bottlenecks
  </text>
  <text x="70" y="925" font-family="Arial, sans-serif" font-size="12" fill="#495057">
    ✓ Balance quality vs speed vs cost based on your use case requirements
  </text>
  <text x="70" y="945" font-family="Arial, sans-serif" font-size="12" fill="#495057">
    ✓ Monitor key metrics: latency, throughput, accuracy, storage costs
  </text>
  <text x="70" y="965" font-family="Arial, sans-serif" font-size="12" fill="#495057">
    ✓ Experiment with different strategies and combinations - no one-size-fits-all solution
  </text>
</svg>