<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="500" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">Feature Scaling: Before vs After Normalization</text>
  
  <!-- Before Normalization Section -->
  <g transform="translate(50, 70)">
    <text x="150" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#e74c3c">Before Normalization</text>
    
    <!-- Coordinate system -->
    <g transform="translate(20, 30)">
      <!-- Axes -->
      <line x1="0" y1="150" x2="280" y2="150" stroke="#2c3e50" stroke-width="2"/>
      <line x1="20" y1="0" x2="20" y2="170" stroke="#2c3e50" stroke-width="2"/>
      
      <!-- X-axis labels (Height in inches) -->
      <text x="20" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">60</text>
      <text x="80" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">65</text>
      <text x="140" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">70</text>
      <text x="200" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">75</text>
      <text x="260" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">80</text>
      
      <!-- Y-axis labels (Age in years) -->
      <text x="5" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">0</text>
      <text x="5" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">25</text>
      <text x="5" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">50</text>
      <text x="5" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">75</text>
      <text x="5" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">100</text>
      
      <!-- Data points -->
      <circle cx="140" cy="80" r="6" fill="#e74c3c" opacity="0.8"/>
      <circle cx="120" cy="100" r="6" fill="#e74c3c" opacity="0.8"/>
      <circle cx="160" cy="90" r="6" fill="#e74c3c" opacity="0.8"/>
      <circle cx="180" cy="70" r="6" fill="#e74c3c" opacity="0.8"/>
      <circle cx="100" cy="110" r="6" fill="#e74c3c" opacity="0.8"/>
      
      <!-- Cluster showing elongation -->
      <ellipse cx="140" cy="90" rx="50" ry="25" fill="none" stroke="#e74c3c" stroke-width="2" stroke-dasharray="5,5"/>
      
      <!-- Axis labels -->
      <text x="150" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Height (inches)</text>
      <text x="-10" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50" transform="rotate(-90, -10, 80)">Age (years)</text>
    </g>
    
    <!-- Problem explanation -->
    <text x="0" y="220" font-family="Arial, sans-serif" font-size="12" fill="#e74c3c" font-weight="bold">Problem: Elongated clusters</text>
    <text x="0" y="240" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">• Height dominates distance calculation</text>
    <text x="0" y="255" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">• Age variations seem insignificant</text>
    <text x="0" y="270" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">• Non-spherical cluster assumption violated</text>
  </g>
  
  <!-- After Normalization Section -->
  <g transform="translate(450, 70)">
    <text x="150" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#27ae60">After Normalization</text>
    
    <!-- Coordinate system -->
    <g transform="translate(20, 30)">
      <!-- Axes -->
      <line x1="0" y1="150" x2="280" y2="150" stroke="#2c3e50" stroke-width="2"/>
      <line x1="20" y1="0" x2="20" y2="170" stroke="#2c3e50" stroke-width="2"/>
      
      <!-- X-axis labels (Normalized height) -->
      <text x="20" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">-2</text>
      <text x="80" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">-1</text>
      <text x="140" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">0</text>
      <text x="200" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">1</text>
      <text x="260" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">2</text>
      
      <!-- Y-axis labels (Normalized age) -->
      <text x="5" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">-2</text>
      <text x="5" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">-1</text>
      <text x="5" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">0</text>
      <text x="5" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">1</text>
      <text x="5" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">2</text>
      
      <!-- Data points (normalized) -->
      <circle cx="140" cy="80" r="6" fill="#27ae60" opacity="0.8"/>
      <circle cx="110" cy="100" r="6" fill="#27ae60" opacity="0.8"/>
      <circle cx="170" cy="90" r="6" fill="#27ae60" opacity="0.8"/>
      <circle cx="190" cy="70" r="6" fill="#27ae60" opacity="0.8"/>
      <circle cx="90" cy="110" r="6" fill="#27ae60" opacity="0.8"/>
      
      <!-- Cluster showing proper spherical shape -->
      <circle cx="140" cy="90" r="35" fill="none" stroke="#27ae60" stroke-width="2" stroke-dasharray="5,5"/>
      
      <!-- Axis labels -->
      <text x="150" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Height (normalized)</text>
      <text x="-10" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50" transform="rotate(-90, -10, 80)">Age (normalized)</text>
    </g>
    
    <!-- Solution explanation -->
    <text x="0" y="220" font-family="Arial, sans-serif" font-size="12" fill="#27ae60" font-weight="bold">Solution: Spherical clusters</text>
    <text x="0" y="240" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">• Both features contribute equally</text>
    <text x="0" y="255" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">• Spherical cluster assumption holds</text>
    <text x="0" y="270" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">• K-Means performs optimally</text>
  </g>
  
  <!-- Normalization formulas -->
  <g transform="translate(50, 350)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#34495e">Normalization Methods:</text>
    
    <!-- Min-Max Normalization -->
    <g transform="translate(0, 30)">
      <rect x="0" y="0" width="320" height="60" fill="#fff3cd" stroke="#ffc107" stroke-width="1" rx="5"/>
      <text x="10" y="20" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#856404">Min-Max Normalization:</text>
      <text x="10" y="40" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">x_norm = (x - x_min) / (x_max - x_min)</text>
      <text x="10" y="55" font-family="Arial, sans-serif" font-size="11" fill="#6c757d">Result: Values in range [0, 1]</text>
    </g>
    
    <!-- Z-Score Standardization -->
    <g transform="translate(350, 30)">
      <rect x="0" y="0" width="320" height="60" fill="#d1ecf1" stroke="#17a2b8" stroke-width="1" rx="5"/>
      <text x="10" y="20" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0c5460">Z-Score Standardization:</text>
      <text x="10" y="40" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">x_std = (x - μ) / σ</text>
      <text x="10" y="55" font-family="Arial, sans-serif" font-size="11" fill="#6c757d">Result: Mean=0, Standard Deviation=1</text>
    </g>
  </g>
  
  <!-- Impact visualization -->
  <g transform="translate(50, 430)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#dc3545">Impact on Distance Calculation:</text>
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Without scaling: √[(70-65)² + (45-25)²] = √[25 + 400] = 20.6 (age dominates)</text>
    <text x="0" y="35" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">With scaling: √[(0.5-(-0.5))² + (0.2-(-0.8))²] = √[1 + 1] = 1.4 (balanced contribution)</text>
  </g>
</svg>