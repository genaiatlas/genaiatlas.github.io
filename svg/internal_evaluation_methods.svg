<svg width="900" height="650" viewBox="0 0 900 650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="clusterGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#3498db;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="clusterGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#e74c3c;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="clusterGradient3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#27ae60;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#27ae60;stop-opacity:0.1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="650" fill="url(#bgGradient)"/>
  
  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    Internal Evaluation Methods
  </text>
  <text x="450" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#7f8c8d">
    Evaluating Clustering Quality Without Ground Truth
  </text>
  
  <!-- Silhouette Analysis Section -->
  <rect x="50" y="80" width="800" height="280" rx="15" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">
    Silhouette Coefficient Analysis
  </text>
  
  <!-- Cluster visualization -->
  <g id="clusters">
    <!-- Cluster 1 (Blue) -->
    <ellipse cx="200" cy="200" rx="60" ry="40" fill="url(#clusterGradient1)" stroke="#3498db" stroke-width="2"/>
    <circle cx="180" cy="190" r="6" fill="#3498db"/>
    <circle cx="200" cy="200" r="7" fill="#2980b9" stroke="#fff" stroke-width="2"/> <!-- Selected point -->
    <circle cx="220" cy="180" r="6" fill="#3498db"/>
    <circle cx="190" cy="210" r="6" fill="#3498db"/>
    <circle cx="210" cy="220" r="6" fill="#3498db"/>
    <text x="200" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2980b9">
      Cluster A
    </text>
    
    <!-- Cluster 2 (Red) -->
    <ellipse cx="400" cy="200" rx="50" ry="35" fill="url(#clusterGradient2)" stroke="#e74c3c" stroke-width="2"/>
    <circle cx="385" cy="190" r="6" fill="#e74c3c"/>
    <circle cx="400" cy="200" r="6" fill="#e74c3c"/>
    <circle cx="415" cy="185" r="6" fill="#e74c3c"/>
    <circle cx="390" cy="215" r="6" fill="#e74c3c"/>
    <text x="400" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#c0392b">
      Cluster B
    </text>
    
    <!-- Cluster 3 (Green) -->
    <ellipse cx="600" cy="200" rx="55" ry="38" fill="url(#clusterGradient3)" stroke="#27ae60" stroke-width="2"/>
    <circle cx="580" cy="190" r="6" fill="#27ae60"/>
    <circle cx="600" cy="200" r="6" fill="#27ae60"/>
    <circle cx="620" cy="185" r="6" fill="#27ae60"/>
    <circle cx="590" cy="215" r="6" fill="#27ae60"/>
    <circle cx="610" cy="220" r="6" fill="#27ae60"/>
    <text x="600" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#229954">
      Cluster C
    </text>
  </g>
  
  <!-- Distance lines for selected point -->
  <g id="distances">
    <!-- Intra-cluster distances (within Cluster A) -->
    <line x1="200" y1="200" x2="180" y2="190" stroke="#3498db" stroke-width="2" stroke-dasharray="3,3"/>
    <line x1="200" y1="200" x2="220" y2="180" stroke="#3498db" stroke-width="2" stroke-dasharray="3,3"/>
    <line x1="200" y1="200" x2="190" y2="210" stroke="#3498db" stroke-width="2" stroke-dasharray="3,3"/>
    <line x1="200" y1="200" x2="210" y2="220" stroke="#3498db" stroke-width="2" stroke-dasharray="3,3"/>
    
    <!-- Inter-cluster distance to nearest cluster (Cluster B) -->
    <line x1="200" y1="200" x2="400" y2="200" stroke="#f39c12" stroke-width="3"/>
    <text x="300" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#f39c12" font-weight="bold">
      b(i) - nearest cluster
    </text>
  </g>
  
  <!-- Legend for distances -->
  <rect x="700" y="120" width="130" height="80" rx="5" fill="#fff" stroke="#bdc3c7" stroke-width="1"/>
  <text x="765" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#2c3e50">
    Distance Legend
  </text>
  <line x1="715" y1="145" x2="735" y2="145" stroke="#3498db" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="745" y="150" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">a(i) - intra-cluster</text>
  <line x1="715" y1="160" x2="735" y2="160" stroke="#f39c12" stroke-width="3"/>
  <text x="745" y="165" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">b(i) - inter-cluster</text>
  <circle cx="725" cy="180" r="4" fill="#2980b9" stroke="#fff" stroke-width="1"/>
  <text x="745" y="185" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">Selected point</text>
  
  <!-- Silhouette Formula Section -->
  <rect x="80" y="290" width="340" height="60" rx="8" fill="#fff" stroke="#3498db" stroke-width="2" filter="url(#shadow)"/>
  <text x="250" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
    Silhouette Coefficient Formula
  </text>
  <text x="250" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#2c3e50">
    s(i) = (b(i) - a(i)) / max(a(i), b(i))
  </text>
  
  <!-- Interpretation -->
  <rect x="450" y="290" width="340" height="60" rx="8" fill="#fff" stroke="#27ae60" stroke-width="2" filter="url(#shadow)"/>
  <text x="620" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
    Interpretation
  </text>
  <text x="620" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#27ae60">s(i) ≈ 1: Well-clustered</text>
  <text x="620" y="338" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#f39c12">s(i) ≈ 0: On boundary</text>
  <text x="620" y="351" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#e74c3c">s(i) &lt; 0: Wrong cluster</text>
  
  <!-- Other Internal Metrics Section -->
  <rect x="80" y="390" width="740" height="180" rx="10" fill="#f8f9fa" stroke="#34495e" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">
    Additional Internal Evaluation Metrics
  </text>
  
  <!-- Metrics Grid -->
  <g id="metricsGrid">
    <!-- Calinski-Harabasz Index -->
    <rect x="110" y="440" width="200" height="100" rx="8" fill="#fff" stroke="#9b59b6" stroke-width="2"/>
    <text x="210" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#8e44ad">
      Calinski-Harabasz Index
    </text>
    <text x="210" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
      CH = SS_B/(k-1) / SS_W/(n-k)
    </text>
    <text x="210" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">
      • Higher values = better
    </text>
    <text x="210" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">
      • Between/within cluster variance
    </text>
    <text x="210" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">
      • No upper bound
    </text>
    
    <!-- Davies-Bouldin Index -->
    <rect x="350" y="440" width="200" height="100" rx="8" fill="#fff" stroke="#e67e22" stroke-width="2"/>
    <text x="450" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#d35400">
      Davies-Bouldin Index
    </text>
    <text x="450" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
      DB = (1/k)Σmax(σᵢ+σⱼ)/d(cᵢ,cⱼ)
    </text>
    <text x="450" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">
      • Lower values = better
    </text>
    <text x="450" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">
      • Cluster separation measure
    </text>
    <text x="450" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">
      • Range: [0, ∞)
    </text>
    
    <!-- Dunn Index -->
    <rect x="590" y="440" width="200" height="100" rx="8" fill="#fff" stroke="#16a085" stroke-width="2"/>
    <text x="690" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#138d75">
      Dunn Index
    </text>
    <text x="690" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
      DI = min d(Cᵢ,Cⱼ) / max Δ(Cₗ)
    </text>
    <text x="690" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">
      • Higher values = better
    </text>
    <text x="690" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">
      • Min inter / max intra distance
    </text>
    <text x="690" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">
      • Computationally expensive
    </text>
  </g>
  
  <!-- Key Insights -->
  <rect x="150" y="590" width="600" height="50" rx="8" fill="#fff" stroke="#2c3e50" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
    Key Principle: Good clusters have high intra-cluster similarity
  </text>
  <text x="450" y="628" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
    and low inter-cluster similarity
  </text>
</svg>