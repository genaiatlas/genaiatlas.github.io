<svg viewBox="0 0 800 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow4" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#2c3e50"/>
    </marker>
    <filter id="shadow3">
      <feDropShadow dx="3" dy="3" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="700" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Three-State Markov Chain Example
  </text>
  
  <!-- States in triangle formation -->
  <g transform="translate(400, 350)">
    <!-- State A (top) -->
    <circle cx="0" cy="-120" r="55" fill="#3498db" stroke="#2980b9" stroke-width="3" filter="url(#shadow3)"/>
    <text x="0" y="-115" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="white">A</text>
    
    <!-- State B (bottom left) -->
    <circle cx="-140" cy="80" r="55" fill="#e74c3c" stroke="#c0392b" stroke-width="3" filter="url(#shadow3)"/>
    <text x="-140" y="85" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="white">B</text>
    
    <!-- State C (bottom right) -->
    <circle cx="140" cy="80" r="55" fill="#27ae60" stroke="#229954" stroke-width="3" filter="url(#shadow3)"/>
    <text x="140" y="85" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="white">C</text>
    
    <!-- Self loops -->
    <!-- A self loop -->
    <path d="M -30 -160 Q -50 -200, 0 -220 Q 50 -200, 30 -160" 
          fill="none" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow4)"/>
    <text x="0" y="-230" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#2c3e50">53/72</text>
    
    <!-- B self loop -->
    <path d="M -180 50 Q -220 30, -220 80 Q -220 130, -180 110" 
          fill="none" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow4)"/>
    <text x="-240" y="85" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#2c3e50">10/18</text>
    
    <!-- C self loop -->
    <path d="M 180 50 Q 220 30, 220 80 Q 220 130, 180 110" 
          fill="none" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow4)"/>
    <text x="240" y="85" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#2c3e50">17/24</text>
    
    <!-- Transitions between states -->
    <!-- A to B -->
    <path d="M -35 -75 L -105 35" fill="none" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow4)"/>
    <text x="-85" y="-20" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2c3e50">1/18</text>
    
    <!-- B to A -->
    <path d="M -100 35 L -30 -70" fill="none" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow4)"/>
    <text x="-50" y="-10" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2c3e50">5/18</text>
    
    <!-- A to C -->
    <path d="M 35 -75 L 105 35" fill="none" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow4)"/>
    <text x="85" y="-20" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2c3e50">1/8</text>
    
    <!-- C to A -->
    <path d="M 100 35 L 30 -70" fill="none" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow4)"/>
    <text x="50" y="-10" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2c3e50">5/24</text>
    
    <!-- B to C -->
    <path d="M -85 80 L 85 80" fill="none" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow4)"/>
    <text x="0" y="100" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2c3e50">1/6</text>
    
    <!-- C to B -->
    <path d="M 85 100 L -85 100" fill="none" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow4)"/>
    <text x="0" y="120" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2c3e50">1/6</text>
  </g>
  
  <!-- Comparison Data Table -->
  <g transform="translate(50, 100)">
    <rect x="0" y="0" width="180" height="150" rx="5" fill="white" stroke="#ddd" stroke-width="1"/>
    <text x="90" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">
      Comparison Data
    </text>
    <text x="90" y="45" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666">
      (with Laplace +1)
    </text>
    <text x="20" y="70" font-family="monospace" font-size="13" fill="#666">     A   B   C</text>
    <text x="20" y="90" font-family="monospace" font-size="13" fill="#666">A    -  10   3</text>
    <text x="20" y="110" font-family="monospace" font-size="13" fill="#666">B    2   -   3</text>
    <text x="20" y="130" font-family="monospace" font-size="13" fill="#666">C    5   3   -</text>
  </g>
  
  <!-- Probability Calculations -->
  <g transform="translate(570, 100)">
    <rect x="0" y="0" width="180" height="150" rx="5" fill="white" stroke="#ddd" stroke-width="1"/>
    <text x="90" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">
      Win Probabilities
    </text>
    <text x="20" y="55" font-family="Arial, sans-serif" font-size="13" fill="#666">A vs B: 10/12</text>
    <text x="20" y="75" font-family="Arial, sans-serif" font-size="13" fill="#666">A vs C: 3/8</text>
    <text x="20" y="95" font-family="Arial, sans-serif" font-size="13" fill="#666">B vs C: 3/6</text>
    <text x="20" y="115" font-family="Arial, sans-serif" font-size="13" fill="#666">Norm: 1/3</text>
  </g>
  
  <!-- Steady State Results -->
  <g transform="translate(200, 550)">
    <rect x="0" y="0" width="400" height="120" rx="10" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2"/>
    <text x="200" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Steady-State Scores
    </text>
    <text x="200" y="60" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#34495e">
      Score(A) = 0.417 (Rank 1)
    </text>
    <text x="200" y="80" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#34495e">
      Score(C) = 0.333 (Rank 2)
    </text>
    <text x="200" y="100" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#34495e">
      Score(B) = 0.250 (Rank 3)
    </text>
  </g>
</svg>