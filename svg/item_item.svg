<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#48BB78;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38A169;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow2">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <rect width="30" height="30" fill="none" stroke="#E2E8F0" stroke-width="0.5"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#F7FAFC"/>
  
  <!-- Title -->
  <text x="400" y="35" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#2C3E50">
    Item-Item Collaborative Filtering Process
  </text>
  
  <!-- Step 1: Matrix with Items Focus -->
  <g transform="translate(50, 70)">
    <rect x="0" y="0" width="320" height="200" rx="8" fill="white" stroke="#CBD5E0" stroke-width="2" filter="url(#shadow2)"/>
    <text x="160" y="25" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#2D3748">
      Step 1: User-Item Matrix (Item Focus)
    </text>
    
    <!-- Matrix Grid -->
    <g transform="translate(20, 40)">
      <!-- Headers -->
      <text x="50" y="15" font-size="12" font-weight="bold" text-anchor="middle" fill="#38A169">Item 1</text>
      <text x="100" y="15" font-size="12" font-weight="bold" text-anchor="middle" fill="#E53E3E">Item j</text>
      <text x="150" y="15" font-size="12" font-weight="bold" text-anchor="middle" fill="#38A169">Item M</text>
      
      <text x="10" y="40" font-size="12" font-weight="bold" fill="#4A5568">User 1</text>
      <text x="10" y="70" font-size="12" font-weight="bold" fill="#E53E3E">User i</text>
      <text x="10" y="100" font-size="12" font-weight="bold" fill="#4A5568">User N</text>
      
      <!-- Matrix cells with item focus -->
      <rect x="35" y="25" width="30" height="25" fill="#EDF2F7" stroke="#CBD5E0"/>
      <text x="50" y="42" font-size="11" text-anchor="middle" fill="#2D3748">3</text>
      
      <rect x="85" y="25" width="30" height="25" fill="#FEE2E2" stroke="#E53E3E" stroke-width="2"/>
      <text x="100" y="42" font-size="11" text-anchor="middle" fill="#2D3748">-</text>
      
      <rect x="135" y="25" width="30" height="25" fill="#EDF2F7" stroke="#CBD5E0"/>
      <text x="150" y="42" font-size="11" text-anchor="middle" fill="#2D3748">2</text>
      
      <rect x="35" y="55" width="30" height="25" fill="#C6F6D5" stroke="#38A169" stroke-width="2"/>
      <text x="50" y="72" font-size="11" text-anchor="middle" fill="#22543D">1</text>
      
      <rect x="85" y="55" width="30" height="25" fill="#FEE2E2" stroke="#E53E3E" stroke-width="3"/>
      <text x="100" y="72" font-size="11" font-weight="bold" text-anchor="middle" fill="#E53E3E">?</text>
      
      <rect x="135" y="55" width="30" height="25" fill="#C6F6D5" stroke="#38A169" stroke-width="2"/>
      <text x="150" y="72" font-size="11" text-anchor="middle" fill="#22543D">4</text>
      
      <rect x="35" y="85" width="30" height="25" fill="#EDF2F7" stroke="#CBD5E0"/>
      <text x="50" y="102" font-size="11" text-anchor="middle" fill="#2D3748">1</text>
      
      <rect x="85" y="85" width="30" height="25" fill="#FEE2E2" stroke="#E53E3E" stroke-width="2"/>
      <text x="100" y="102" font-size="11" text-anchor="middle" fill="#2D3748">4</text>
      
      <rect x="135" y="85" width="30" height="25" fill="#EDF2F7" stroke="#CBD5E0"/>
      <text x="150" y="102" font-size="11" text-anchor="middle" fill="#2D3748">4</text>
      
      <!-- Highlight columns -->
      <rect x="35" y="25" width="30" height="85" fill="#38A169" opacity="0.1"/>
      <rect x="135" y="25" width="30" height="85" fill="#38A169" opacity="0.1"/>
    </g>
    
    <text x="160" y="180" font-family="Arial" font-size="11" text-anchor="middle" fill="#718096">
      Focus: Items rated by User i
    </text>
  </g>
  
  <!-- Step 2: Item Similarity -->
  <g transform="translate(430, 70)">
    <rect x="0" y="0" width="320" height="200" rx="8" fill="white" stroke="#CBD5E0" stroke-width="2" filter="url(#shadow2)"/>
    <text x="160" y="25" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#2D3748">
      Step 2: Calculate Item Similarity
    </text>
    
    <!-- Item comparison visualization -->
    <g transform="translate(40, 45)">
      <rect x="20" y="10" width="60" height="60" rx="8" fill="#C6F6D5" stroke="#38A169" stroke-width="2"/>
      <text x="50" y="45" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#22543D">Item 1</text>
      
      <rect x="100" y="10" width="60" height="60" rx="8" fill="#FED7D7" stroke="#E53E3E" stroke-width="2"/>
      <text x="130" y="45" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#E53E3E">Item j</text>
      
      <rect x="180" y="10" width="60" height="60" rx="8" fill="#C6F6D5" stroke="#38A169" stroke-width="2"/>
      <text x="210" y="45" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#22543D">Item M</text>
      
      <!-- Similarity arrows -->
      <path d="M 80 40 L 100 40" stroke="#4A5568" stroke-width="2" fill="none" marker-end="url(#arrowMarker)"/>
      <path d="M 160 40 L 180 40" stroke="#4A5568" stroke-width="2" fill="none" marker-end="url(#arrowMarker)"/>
      
      <!-- Similarity scores -->
      <text x="90" y="90" font-family="Arial" font-size="10" text-anchor="middle" fill="#4A5568">sim = 0.85</text>
      <text x="170" y="90" font-family="Arial" font-size="10" text-anchor="middle" fill="#4A5568">sim = 0.92</text>
      
      <rect x="60" y="105" width="140" height="35" rx="5" fill="url(#greenGrad)"/>
      <text x="130" y="127" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="white">
        Item M most similar
      </text>
    </g>
  </g>
  
  <!-- Step 3: Neighborhood of Items -->
  <g transform="translate(50, 300)">
    <rect x="0" y="0" width="320" height="180" rx="8" fill="white" stroke="#CBD5E0" stroke-width="2" filter="url(#shadow2)"/>
    <text x="160" y="25" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#2D3748">
      Step 3: Select Similar Items
    </text>
    
    <!-- Item network -->
    <g transform="translate(60, 50)">
      <!-- Target item -->
      <rect x="75" y="40" width="50" height="50" rx="8" fill="#E53E3E" opacity="0.8"/>
      <text x="100" y="70" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Item j</text>
      
      <!-- Similar items -->
      <rect x="15" y="10" width="40" height="40" rx="6" fill="#38A169" opacity="0.7"/>
      <text x="35" y="35" font-family="Arial" font-size="10" text-anchor="middle" fill="white">I1</text>
      
      <rect x="145" y="10" width="40" height="40" rx="6" fill="#38A169" opacity="0.9"/>
      <text x="165" y="35" font-family="Arial" font-size="10" text-anchor="middle" fill="white">IM</text>
      
      <rect x="30" y="70" width="40" height="40" rx="6" fill="#38A169" opacity="0.6"/>
      <text x="50" y="95" font-family="Arial" font-size="10" text-anchor="middle" fill="white">I3</text>
      
      <rect x="130" y="70" width="40" height="40" rx="6" fill="#38A169" opacity="0.5"/>
      <text x="150" y="95" font-family="Arial" font-size="10" text-anchor="middle" fill="white">I7</text>
      
      <!-- Connection lines -->
      <line x1="75" y1="65" x2="55" y2="35" stroke="#718096" stroke-width="1" stroke-dasharray="3,2" opacity="0.5"/>
      <line x1="125" y1="65" x2="145" y2="35" stroke="#2D3748" stroke-width="2" opacity="0.8"/>
      <line x1="75" y1="65" x2="70" y2="85" stroke="#718096" stroke-width="1" stroke-dasharray="3,2" opacity="0.5"/>
      <line x1="125" y1="65" x2="130" y2="85" stroke="#718096" stroke-width="1" stroke-dasharray="3,2" opacity="0.5"/>
    </g>
    
    <text x="160" y="160" font-family="Arial" font-size="11" text-anchor="middle" fill="#718096">
      Items User i has rated
    </text>
  </g>
  
  <!-- Step 4: Prediction -->
  <g transform="translate(430, 300)">
    <rect x="0" y="0" width="320" height="180" rx="8" fill="white" stroke="#CBD5E0" stroke-width="2" filter="url(#shadow2)"/>
    <text x="160" y="25" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#2D3748">
      Step 4: Generate Prediction
    </text>
    
    <!-- Prediction calculation -->
    <g transform="translate(30, 45)">
      <text x="130" y="15" font-family="Arial" font-size="12" text-anchor="middle" fill="#4A5568">
        Based on User i's ratings
      </text>
      
      <rect x="20" y="25" width="220" height="35" rx="5" fill="#F7FAFC" stroke="#CBD5E0"/>
      <text x="130" y="47" font-family="Courier" font-size="10" text-anchor="middle" fill="#2D3748">
        r̂ᵢⱼ = Σ(sim(j,k) × rᵢₖ) / Σ|sim(j,k)|
      </text>
      
      <!-- Calculation breakdown -->
      <text x="130" y="75" font-family="Arial" font-size="10" text-anchor="middle" fill="#718096">
        (0.85×1 + 0.92×4) / (0.85 + 0.92)
      </text>
      
      <!-- Result -->
      <rect x="60" y="85" width="140" height="40" rx="5" fill="#48BB78"/>
      <text x="130" y="110" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
        Prediction: 2.6
      </text>
    </g>
  </g>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowMarker" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#4A5568"/>
    </marker>
  </defs>
  
  <!-- Process flow -->
  <path d="M 370 170 L 430 170" stroke="#718096" stroke-width="2" fill="none" marker-end="url(#arrowMarker)"/>
  <path d="M 210 270 L 210 300" stroke="#718096" stroke-width="2" fill="none" marker-end="url(#arrowMarker)"/>
  <path d="M 590 270 L 590 300" stroke="#718096" stroke-width="2" fill="none" marker-end="url(#arrowMarker)"/>
  
  <!-- Summary Box -->
  <g transform="translate(150, 510)">
    <rect x="0" y="0" width="500" height="70" rx="8" fill="#F0FFF4" stroke="#38A169" stroke-width="2"/>
    <text x="250" y="25" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle" fill="#22543D">
      Algorithm Summary
    </text>
    <text x="250" y="45" font-family="Arial" font-size="11" text-anchor="middle" fill="#2D3748">
      1. Identify items rated by user → 2. Calculate item similarities → 3. Select most similar items
    </text>
    <text x="250" y="60" font-family="Arial" font-size="11" text-anchor="middle" fill="#2D3748">
      → 4. Aggregate user's ratings on similar items weighted by similarity
    </text>
  </g>
</svg>