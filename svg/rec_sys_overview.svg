<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7B68EE;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#50C878;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3CB371;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB347;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B6B;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="800" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="600" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#2c3e50">
    Recommendation Systems Architecture
  </text>
  
  <!-- User Component -->
  <g transform="translate(100, 150)">
    <rect x="0" y="0" width="200" height="250" rx="15" fill="url(#grad1)" filter="url(#shadow)"/>
    <text x="100" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="white">USERS</text>
    
    <g transform="translate(20, 70)">
      <circle cx="20" cy="0" r="3" fill="white"/>
      <text x="35" y="5" font-size="14" fill="white">Demographics</text>
    </g>
    <g transform="translate(20, 100)">
      <circle cx="20" cy="0" r="3" fill="white"/>
      <text x="35" y="5" font-size="14" fill="white">Preferences</text>
    </g>
    <g transform="translate(20, 130)">
      <circle cx="20" cy="0" r="3" fill="white"/>
      <text x="35" y="5" font-size="14" fill="white">Behavior History</text>
    </g>
    <g transform="translate(20, 160)">
      <circle cx="20" cy="0" r="3" fill="white"/>
      <text x="35" y="5" font-size="14" fill="white">Context</text>
    </g>
  </g>
  
  <!-- Items Component -->
  <g transform="translate(900, 150)">
    <rect x="0" y="0" width="200" height="250" rx="15" fill="url(#grad2)" filter="url(#shadow)"/>
    <text x="100" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="white">ITEMS</text>
    
    <g transform="translate(20, 70)">
      <circle cx="20" cy="0" r="3" fill="white"/>
      <text x="35" y="5" font-size="14" fill="white">Features</text>
    </g>
    <g transform="translate(20, 100)">
      <circle cx="20" cy="0" r="3" fill="white"/>
      <text x="35" y="5" font-size="14" fill="white">Categories</text>
    </g>
    <g transform="translate(20, 130)">
      <circle cx="20" cy="0" r="3" fill="white"/>
      <text x="35" y="5" font-size="14" fill="white">Metadata</text>
    </g>
    <g transform="translate(20, 160)">
      <circle cx="20" cy="0" r="3" fill="white"/>
      <text x="35" y="5" font-size="14" fill="white">Popularity</text>
    </g>
  </g>
  
  <!-- Core Engine -->
  <g transform="translate(400, 200)">
    <rect x="0" y="0" width="400" height="350" rx="20" fill="white" stroke="#3498db" stroke-width="3" filter="url(#shadow)"/>
    <text x="200" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#2c3e50">Recommendation Engine</text>
    
    <!-- Sub-components -->
    <g transform="translate(20, 70)">
      <rect x="0" y="0" width="160" height="60" rx="10" fill="#ecf0f1" stroke="#95a5a6" stroke-width="1"/>
      <text x="80" y="35" text-anchor="middle" font-size="14" fill="#2c3e50">Data Processing</text>
    </g>
    
    <g transform="translate(220, 70)">
      <rect x="0" y="0" width="160" height="60" rx="10" fill="#ecf0f1" stroke="#95a5a6" stroke-width="1"/>
      <text x="80" y="35" text-anchor="middle" font-size="14" fill="#2c3e50">Feature Engineering</text>
    </g>
    
    <g transform="translate(20, 150)">
      <rect x="0" y="0" width="160" height="60" rx="10" fill="#ecf0f1" stroke="#95a5a6" stroke-width="1"/>
      <text x="80" y="35" text-anchor="middle" font-size="14" fill="#2c3e50">ML Algorithms</text>
    </g>
    
    <g transform="translate(220, 150)">
      <rect x="0" y="0" width="160" height="60" rx="10" fill="#ecf0f1" stroke="#95a5a6" stroke-width="1"/>
      <text x="80" y="35" text-anchor="middle" font-size="14" fill="#2c3e50">Ranking &amp; Filtering</text>
    </g>
    
    <g transform="translate(120, 230)">
      <rect x="0" y="0" width="160" height="60" rx="10" fill="#ecf0f1" stroke="#95a5a6" stroke-width="1"/>
      <text x="80" y="35" text-anchor="middle" font-size="14" fill="#2c3e50">Personalization</text>
    </g>
  </g>
  
  <!-- Data Flow Arrows -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3498db"/>
    </marker>
  </defs>
  
  <!-- User to Engine -->
  <path d="M 300 275 L 400 275" stroke="#3498db" stroke-width="3" marker-end="url(#arrowhead)" stroke-dasharray="5,5">
    <animate attributeName="stroke-dashoffset" values="0;10" dur="1s" repeatCount="indefinite"/>
  </path>
  
  <!-- Engine to Items -->
  <path d="M 800 375 L 900 275" stroke="#3498db" stroke-width="3" marker-end="url(#arrowhead)" stroke-dasharray="5,5">
    <animate attributeName="stroke-dashoffset" values="0;10" dur="1s" repeatCount="indefinite"/>
  </path>
  
  <!-- Feedback Loop -->
  <path d="M 900 400 Q 600 500 300 400" stroke="#e74c3c" stroke-width="2" fill="none" marker-end="url(#arrowhead)" stroke-dasharray="5,5">
    <animate attributeName="stroke-dashoffset" values="0;10" dur="1.5s" repeatCount="indefinite"/>
  </path>
  
  <!-- Output Section -->
  <g transform="translate(450, 600)">
    <rect x="0" y="0" width="300" height="120" rx="15" fill="url(#grad3)" filter="url(#shadow)"/>
    <text x="150" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="white">RECOMMENDATIONS</text>
    <text x="150" y="65" text-anchor="middle" font-size="14" fill="white">• Personalized Rankings</text>
    <text x="150" y="85" text-anchor="middle" font-size="14" fill="white">• Top-N Suggestions</text>
    <text x="150" y="105" text-anchor="middle" font-size="14" fill="white">• Explanations</text>
  </g>
  
  <!-- Labels -->
  <text x="200" y="450" text-anchor="middle" font-size="12" fill="#7f8c8d">User Data</text>
  <text x="1000" y="450" text-anchor="middle" font-size="12" fill="#7f8c8d">Item Catalog</text>
  <text x="600" y="580" text-anchor="middle" font-size="12" fill="#e74c3c">Feedback Loop</text>
</svg>