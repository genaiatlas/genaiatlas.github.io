<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title-text { font-family: 'Arial', sans-serif; font-size: 26px; font-weight: bold; fill: #2c3e50; }
      .header-text { font-family: 'Arial', sans-serif; font-size: 18px; font-weight: bold; fill: #34495e; }
      .metric-text { font-family: 'Arial', sans-serif; font-size: 16px; font-weight: bold; fill: white; }
      .formula-text { font-family: 'Arial', sans-serif; font-size: 14px; fill: white; }
      .desc-text { font-family: 'Arial', sans-serif; font-size: 14px; fill: #2c3e50; }
      .emphasis-text { font-family: 'Arial', sans-serif; font-size: 13px; font-weight: bold; fill: #2c3e50; }
    </style>
    
    <!-- Arrow marker -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e"/>
    </marker>
    
    <!-- Curved arrow marker -->
    <marker id="curvedarrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8e44ad"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title-text">Performance Metrics Relationship</text>
  
  <!-- Precision Circle -->
  <circle cx="200" cy="150" r="80" fill="#27ae60" stroke="#1e8449" stroke-width="3"/>
  <text x="200" y="135" text-anchor="middle" class="metric-text">PRECISION</text>
  <text x="200" y="155" text-anchor="middle" class="formula-text">TP / (TP + FP)</text>
  <text x="200" y="175" text-anchor="middle" class="formula-text">Focus: Positive</text>
  <text x="200" y="190" text-anchor="middle" class="formula-text">Prediction Accuracy</text>
  
  <!-- Recall Circle -->
  <circle cx="600" cy="150" r="80" fill="#3498db" stroke="#2980b9" stroke-width="3"/>
  <text x="600" y="135" text-anchor="middle" class="metric-text">RECALL</text>
  <text x="600" y="155" text-anchor="middle" class="formula-text">TP / (TP + FN)</text>
  <text x="600" y="175" text-anchor="middle" class="formula-text">Focus: Positive</text>
  <text x="600" y="190" text-anchor="middle" class="formula-text">Case Detection</text>
  
  <!-- F1-Score Rectangle -->
  <rect x="300" y="320" width="200" height="100" fill="#8e44ad" stroke="#6c3483" stroke-width="3" rx="10"/>
  <text x="400" y="345" text-anchor="middle" class="metric-text">F1-SCORE</text>
  <text x="400" y="365" text-anchor="middle" class="formula-text">Harmonic Mean</text>
  <text x="400" y="385" text-anchor="middle" class="formula-text">2 × (P × R) / (P + R)</text>
  <text x="400" y="405" text-anchor="middle" class="formula-text">Balances Both</text>
  
  <!-- Arrows from Precision and Recall to F1 -->
  <path d="M 250 200 Q 300 250 350 330" stroke="#8e44ad" stroke-width="3" fill="none" marker-end="url(#curvedarrow)"/>
  <path d="M 550 200 Q 500 250 450 330" stroke="#8e44ad" stroke-width="3" fill="none" marker-end="url(#curvedarrow)"/>
  
  <!-- Trade-off arrow -->
  <path d="M 280 150 L 520 150" stroke="#e74c3c" stroke-width="4" marker-end="url(#arrowhead)"/>
  <text x="400" y="140" text-anchor="middle" class="emphasis-text" fill="#e74c3c">TRADE-OFF</text>
  
  <!-- Characteristic boxes -->
  <!-- Precision characteristics -->
  <rect x="50" y="260" width="300" height="120" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" rx="5"/>
  <text x="200" y="280" text-anchor="middle" class="header-text" fill="#27ae60">Precision Characteristics</text>
  <text x="70" y="300" class="desc-text">• Minimizes False Positives</text>
  <text x="70" y="320" class="desc-text">• Conservative approach</text>
  <text x="70" y="340" class="desc-text">• High confidence in positive predictions</text>
  <text x="70" y="360" class="desc-text">• May miss some true positives</text>
  
  <!-- Recall characteristics -->
  <rect x="450" y="260" width="300" height="120" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" rx="5"/>
  <text x="600" y="280" text-anchor="middle" class="header-text" fill="#3498db">Recall Characteristics</text>
  <text x="470" y="300" class="desc-text">• Minimizes False Negatives</text>
  <text x="470" y="320" class="desc-text">• Aggressive approach</text>
  <text x="470" y="340" class="desc-text">• Catches most positive cases</text>
  <text x="470" y="360" class="desc-text">• May include some false positives</text>
  
  <!-- F1-Score benefits -->
  <rect x="200" y="450" width="400" height="120" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" rx="5"/>
  <text x="400" y="470" text-anchor="middle" class="header-text" fill="#8e44ad">F1-Score Benefits</text>
  <text x="220" y="490" class="desc-text">• Single metric for model comparison</text>
  <text x="220" y="510" class="desc-text">• Balances precision and recall equally</text>
  <text x="220" y="530" class="desc-text">• Penalizes extremely low precision or recall</text>
  <text x="220" y="550" class="desc-text">• Useful for imbalanced datasets</text>
  
  <!-- Key insight -->
  <text x="400" y="590" text-anchor="middle" class="emphasis-text" font-style="italic">Choose based on whether false positives or false negatives are more costly</text>
</svg>