<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
     refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
    <linearGradient id="dataGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pcaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">
    PCA Dimensionality Reduction Process
  </text>
  
  <!-- Original Data Section -->
  <g id="original-data">
    <!-- Data Matrix -->
    <rect x="50" y="80" width="120" height="80" fill="url(#dataGrad)" stroke="#2c3e50" stroke-width="2" rx="5"/>
    <text x="110" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
      Original Data
    </text>
    <text x="110" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
      n &#215; d matrix
    </text>
    <text x="110" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
      High Dimensional
    </text>
    <text x="110" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
      (d features)
    </text>
    
    <!-- Sample data points -->
    <circle cx="70" cy="190" r="3" fill="#3498db"/>
    <circle cx="85" cy="195" r="3" fill="#3498db"/>
    <circle cx="95" cy="185" r="3" fill="#3498db"/>
    <circle cx="110" cy="200" r="3" fill="#3498db"/>
    <circle cx="125" cy="190" r="3" fill="#3498db"/>
    <circle cx="140" cy="185" r="3" fill="#3498db"/>
    <circle cx="150" cy="195" r="3" fill="#3498db"/>
    
    <text x="110" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">
      Sample Data Points
    </text>
  </g>
  
  <!-- Arrow 1 -->
  <path d="M 180 120 L 230 120" stroke="#34495e" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="205" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
    Center &amp; Compute
  </text>
  <text x="205" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
    Covariance
  </text>
  
  <!-- Covariance Matrix Section -->
  <g id="covariance">
    <rect x="250" y="80" width="100" height="80" fill="#9b59b6" stroke="#2c3e50" stroke-width="2" rx="5"/>
    <text x="300" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
      Covariance
    </text>
    <text x="300" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
      Matrix
    </text>
    <text x="300" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
      C = X^T X
    </text>
    <text x="300" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
      d &#215; d
    </text>
  </g>
  
  <!-- Arrow 2 -->
  <path d="M 360 120 L 410 120" stroke="#34495e" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="385" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
    Eigenvalue
  </text>
  <text x="385" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
    Decomposition
  </text>
  
  <!-- Eigenvectors Section -->
  <g id="eigenvectors">
    <rect x="430" y="80" width="120" height="80" fill="#e67e22" stroke="#2c3e50" stroke-width="2" rx="5"/>
    <text x="490" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
      Eigenvectors
    </text>
    <text x="490" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
      Principal
    </text>
    <text x="490" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
      Components
    </text>
    <text x="490" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
      (Sorted by variance)
    </text>
    
    <!-- Eigenvalue visualization -->
    <rect x="440" y="190" width="25" height="30" fill="#e74c3c"/>
    <rect x="470" y="200" width="25" height="20" fill="#f39c12"/>
    <rect x="500" y="205" width="25" height="15" fill="#f1c40f"/>
    <text x="490" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">
      v1 &gt; v2 &gt; v3
    </text>
  </g>
  
  <!-- Arrow 3 -->
  <path d="M 560 120 L 610 120" stroke="#34495e" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="585" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
    Project to
  </text>
  <text x="585" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
    k dimensions
  </text>
  
  <!-- Reduced Data Section -->
  <g id="reduced-data">
    <rect x="630" y="80" width="120" height="80" fill="url(#pcaGrad)" stroke="#2c3e50" stroke-width="2" rx="5"/>
    <text x="690" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
      Reduced Data
    </text>
    <text x="690" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
      n &#215; k matrix
    </text>
    <text x="690" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
      Low Dimensional
    </text>
    <text x="690" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
      (k &lt;&lt; d)
    </text>
    
    <!-- 2D projection visualization -->
    <line x1="640" y1="200" x2="740" y2="200" stroke="#2c3e50" stroke-width="1"/>
    <line x1="690" y1="180" x2="690" y2="220" stroke="#2c3e50" stroke-width="1"/>
    
    <!-- Projected points -->
    <circle cx="660" cy="195" r="3" fill="#e74c3c"/>
    <circle cx="675" cy="190" r="3" fill="#e74c3c"/>
    <circle cx="685" cy="205" r="3" fill="#e74c3c"/>
    <circle cx="700" cy="185" r="3" fill="#e74c3c"/>
    <circle cx="715" cy="195" r="3" fill="#e74c3c"/>
    <circle cx="720" cy="210" r="3" fill="#e74c3c"/>
    
    <text x="690" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">
      Embedded Points
    </text>
  </g>
  
  <!-- Mathematical equation -->
  <g id="equation">
    <rect x="150" y="280" width="500" height="80" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" rx="5"/>
    <text x="400" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
      PCA Transformation
    </text>
    <text x="400" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">
      Y = X &#215; Vk    where Vk contains top k eigenvectors
    </text>
    <text x="400" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">
      Preserves maximum variance in reduced dimensions
    </text>
  </g>
  
  <!-- Benefits box -->
  <g id="benefits">
    <rect x="50" y="280" width="80" height="80" fill="#2ecc71" stroke="#27ae60" stroke-width="2" rx="5"/>
    <text x="90" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">
      Benefits
    </text>
    <text x="90" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">
      &#8226; Noise reduction
    </text>
    <text x="90" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">
      &#8226; Visualization
    </text>
    <text x="90" y="341" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">
      &#8226; Compression
    </text>
    <text x="90" y="354" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">
      &#8226; Speed up ML
    </text>
  </g>
</svg>