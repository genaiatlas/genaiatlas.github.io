<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'Arial', sans-serif; font-size: 20px; font-weight: bold; fill: #2c3e50; }
      .subtitle { font-family: 'Arial', sans-serif; font-size: 14px; fill: #34495e; }
      .axis-label { font-family: 'Arial', sans-serif; font-size: 12px; fill: #2c3e50; }
      .training-error { stroke: #3498db; stroke-width: 3; fill: none; }
      .validation-error { stroke: #e74c3c; stroke-width: 3; fill: none; }
      .optimal-line { stroke: #27ae60; stroke-width: 2; stroke-dasharray: 5,5; }
      .grid-line { stroke: #ecf0f1; stroke-width: 1; }
      .legend-box { fill: #ffffff; stroke: #bdc3c7; stroke-width: 1; }
      .region-label { font-family: 'Arial', sans-serif; font-size: 12px; font-weight: bold; }
      .underfitting { fill: #f39c12; }
      .optimal { fill: #27ae60; }
      .overfitting { fill: #e74c3c; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title">Model Complexity vs Prediction Error</text>
  
  <!-- Grid lines -->
  <g class="grid-line">
    <!-- Vertical grid lines -->
    <line x1="100" y1="60" x2="100" y2="360"/>
    <line x1="180" y1="60" x2="180" y2="360"/>
    <line x1="260" y1="60" x2="260" y2="360"/>
    <line x1="340" y1="60" x2="340" y2="360"/>
    <line x1="420" y1="60" x2="420" y2="360"/>
    <line x1="500" y1="60" x2="500" y2="360"/>
    <line x1="580" y1="60" x2="580" y2="360"/>
    <line x1="660" y1="60" x2="660" y2="360"/>
    <!-- Horizontal grid lines -->
    <line x1="100" y1="120" x2="660" y2="120"/>
    <line x1="100" y1="180" x2="660" y2="180"/>
    <line x1="100" y1="240" x2="660" y2="240"/>
    <line x1="100" y1="300" x2="660" y2="300"/>
  </g>
  
  <!-- Axes -->
  <line x1="100" y1="60" x2="100" y2="370" stroke="#34495e" stroke-width="2"/>
  <line x1="90" y1="360" x2="670" y2="360" stroke="#34495e" stroke-width="2"/>
  
  <!-- Axis labels -->
  <text x="380" y="390" text-anchor="middle" class="axis-label">Model Complexity (Number of Features)</text>
  <text x="50" y="210" text-anchor="middle" class="axis-label" transform="rotate(-90 50 210)">Prediction Error (MSE)</text>
  
  <!-- Tick marks and labels -->
  <g class="axis-label">
    <line x1="100" y1="360" x2="100" y2="365" stroke="#34495e" stroke-width="1"/>
    <text x="100" y="380" text-anchor="middle">1</text>
    <line x1="180" y1="360" x2="180" y2="365" stroke="#34495e" stroke-width="1"/>
    <text x="180" y="380" text-anchor="middle">2</text>
    <line x1="260" y1="360" x2="260" y2="365" stroke="#34495e" stroke-width="1"/>
    <text x="260" y="380" text-anchor="middle">3</text>
    <line x1="340" y1="360" x2="340" y2="365" stroke="#34495e" stroke-width="1"/>
    <text x="340" y="380" text-anchor="middle">4</text>
    <line x1="420" y1="360" x2="420" y2="365" stroke="#34495e" stroke-width="1"/>
    <text x="420" y="380" text-anchor="middle">5</text>
    <line x1="500" y1="360" x2="500" y2="365" stroke="#34495e" stroke-width="1"/>
    <text x="500" y="380" text-anchor="middle">6</text>
    <line x1="580" y1="360" x2="580" y2="365" stroke="#34495e" stroke-width="1"/>
    <text x="580" y="380" text-anchor="middle">7</text>
    <line x1="660" y1="360" x2="660" y2="365" stroke="#34495e" stroke-width="1"/>
    <text x="660" y="380" text-anchor="middle">8</text>
    
    <!-- Y-axis labels -->
    <line x1="95" y1="300" x2="100" y2="300" stroke="#34495e" stroke-width="1"/>
    <text x="85" y="305" text-anchor="end">1</text>
    <line x1="95" y1="240" x2="100" y2="240" stroke="#34495e" stroke-width="1"/>
    <text x="85" y="245" text-anchor="end">2</text>
    <line x1="95" y1="180" x2="100" y2="180" stroke="#34495e" stroke-width="1"/>
    <text x="85" y="185" text-anchor="end">3</text>
    <line x1="95" y1="120" x2="100" y2="120" stroke="#34495e" stroke-width="1"/>
    <text x="85" y="125" text-anchor="end">4</text>
  </g>
  
  <!-- Training Error Curve (monotonically decreasing) -->
  <path d="M 100 300 C 180 280 260 240 340 200 C 420 160 500 120 580 90 C 620 80 640 75 660 70" class="training-error"/>
  
  <!-- Validation Error Curve (U-shaped) -->
  <path d="M 100 330 C 180 310 260 260 340 200 C 380 180 400 175 420 180 C 500 200 580 240 660 290" class="validation-error"/>
  
  <!-- Optimal complexity line -->
  <line x1="420" y1="60" x2="420" y2="360" class="optimal-line"/>
  
  <!-- Region background colors (transparent) -->
  <rect x="100" y="60" width="240" height="300" fill="#f39c12" opacity="0.1"/>
  <rect x="340" y="60" width="160" height="300" fill="#27ae60" opacity="0.1"/>
  <rect x="500" y="60" width="160" height="300" fill="#e74c3c" opacity="0.1"/>
  
  <!-- Region labels -->
  <text x="220" y="90" text-anchor="middle" class="region-label underfitting">UNDERFITTING</text>
  <text x="220" y="105" text-anchor="middle" class="subtitle underfitting">High Bias, Low Variance</text>
  
  <text x="420" y="90" text-anchor="middle" class="region-label optimal">OPTIMAL</text>
  <text x="420" y="105" text-anchor="middle" class="subtitle optimal">Balanced Bias-Variance</text>
  
  <text x="580" y="90" text-anchor="middle" class="region-label overfitting">OVERFITTING</text>
  <text x="580" y="105" text-anchor="middle" class="subtitle overfitting">Low Bias, High Variance</text>
  
  <!-- Legend -->
  <rect x="520" y="120" width="180" height="80" class="legend-box"/>
  <text x="610" y="140" text-anchor="middle" class="subtitle">Error Types</text>
  
  <line x1="535" y1="155" x2="565" y2="155" class="training-error"/>
  <text x="575" y="160" class="subtitle">Training Error</text>
  
  <line x1="535" y1="175" x2="565" y2="175" class="validation-error"/>
  <text x="575" y="180" class="subtitle">Validation Error</text>
  
  <!-- Key insights -->
  <rect x="100" y="410" width="600" height="80" fill="#e8f6f3" stroke="#16a085" stroke-width="2" rx="8"/>
  <text x="400" y="430" text-anchor="middle" class="subtitle" fill="#16a085">Key Insights</text>
  <text x="120" y="450" class="axis-label" fill="#16a085">• Training error always decreases with model complexity</text>
  <text x="120" y="465" class="axis-label" fill="#16a085">• Validation error follows U-shape: decreases then increases</text>
  <text x="120" y="480" class="axis-label" fill="#16a085">• Optimal complexity minimizes validation error (generalization gap)</text>
  
  <!-- Optimal point marker -->
  <circle cx="420" cy="180" r="6" fill="#27ae60" stroke="white" stroke-width="2"/>
  <text x="420" y="170" text-anchor="middle" class="subtitle optimal">Optimal</text>
  <text x="420" y="200" text-anchor="middle" class="axis-label optimal">Complexity</text>
</svg>