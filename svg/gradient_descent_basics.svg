<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="networkGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2ecc71;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="arrowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    Gradient Descent: Neural Network Training Overview
  </text>
  
  <!-- Neural Network Representation -->
  <g id="neural-network">
    <!-- Input Layer -->
    <circle cx="100" cy="150" r="20" fill="url(#networkGradient)" stroke="#2980b9" stroke-width="2"/>
    <circle cx="100" cy="200" r="20" fill="url(#networkGradient)" stroke="#2980b9" stroke-width="2"/>
    <circle cx="100" cy="250" r="20" fill="url(#networkGradient)" stroke="#2980b9" stroke-width="2"/>
    <text x="100" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#34495e">Input Layer</text>
    
    <!-- Hidden Layer -->
    <circle cx="250" cy="130" r="20" fill="url(#networkGradient)" stroke="#2980b9" stroke-width="2"/>
    <circle cx="250" cy="180" r="20" fill="url(#networkGradient)" stroke="#2980b9" stroke-width="2"/>
    <circle cx="250" cy="230" r="20" fill="url(#networkGradient)" stroke="#2980b9" stroke-width="2"/>
    <circle cx="250" cy="280" r="20" fill="url(#networkGradient)" stroke="#2980b9" stroke-width="2"/>
    <text x="250" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#34495e">Hidden Layer</text>
    
    <!-- Output Layer -->
    <circle cx="400" cy="200" r="20" fill="url(#networkGradient)" stroke="#2980b9" stroke-width="2"/>
    <text x="400" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#34495e">Output Layer</text>
    
    <!-- Connections with weights -->
    <g stroke="#95a5a6" stroke-width="2" opacity="0.7">
      <!-- Input to Hidden -->
      <line x1="120" y1="150" x2="230" y2="130"/>
      <line x1="120" y1="150" x2="230" y2="180"/>
      <line x1="120" y1="200" x2="230" y2="180"/>
      <line x1="120" y1="200" x2="230" y2="230"/>
      <line x1="120" y1="250" x2="230" y2="230"/>
      <line x1="120" y1="250" x2="230" y2="280"/>
      
      <!-- Hidden to Output -->
      <line x1="270" y1="130" x2="380" y2="200"/>
      <line x1="270" y1="180" x2="380" y2="200"/>
      <line x1="270" y1="230" x2="380" y2="200"/>
      <line x1="270" y1="280" x2="380" y2="200"/>
    </g>
    
    <!-- Weight labels -->
    <text x="175" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c" font-weight="bold">w₁₁</text>
    <text x="175" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c" font-weight="bold">w₂₂</text>
    <text x="325" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c" font-weight="bold">wᵢⱼ</text>
  </g>
  
  <!-- Challenge Box -->
  <g id="challenge-box">
    <rect x="500" y="100" width="280" height="120" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2" rx="10"/>
    <text x="640" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#e74c3c">
      The Challenge
    </text>
    <text x="510" y="150" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">
      • Hundreds of weights to adjust
    </text>
    <text x="510" y="170" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">
      • Minimize loss function efficiently
    </text>
    <text x="510" y="190" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">
      • Navigate high-dimensional space
    </text>
    <text x="510" y="210" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">
      • Avoid local minima
    </text>
  </g>
  
  <!-- Solution Arrow -->
  <g id="solution-arrow">
    <path d="M 640 240 L 640 280 L 620 270 M 640 280 L 660 270" 
          stroke="url(#arrowGradient)" stroke-width="4" fill="none" marker-end="url(#arrowhead)"/>
    <text x="640" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e74c3c">
      Gradient Descent Solution
    </text>
  </g>
  
  <!-- Solution Box -->
  <g id="solution-box">
    <rect x="500" y="320" width="280" height="140" fill="#e8f8f5" stroke="#1abc9c" stroke-width="2" rx="10"/>
    <text x="640" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#16a085">
      Gradient Descent Approach
    </text>
    <text x="510" y="370" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">
      1. Random weight initialization
    </text>
    <text x="510" y="390" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">
      2. Calculate partial derivatives
    </text>
    <text x="510" y="410" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">
      3. Small steps opposite to gradient
    </text>
    <text x="510" y="430" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">
      4. Iterate until convergence
    </text>
    <text x="510" y="450" font-family="Arial, sans-serif" font-size="12" fill="#16a085" font-weight="bold">
      Result: Optimal weight configuration
    </text>
  </g>
  
  <!-- Mathematical notation -->
  <g id="math-notation">
    <text x="100" y="400" font-family="Arial, sans-serif" font-size="14" fill="#8e44ad" font-weight="bold">
      Key Formula:
    </text>
    <text x="100" y="425" font-family="monospace" font-size="16" fill="#8e44ad">
      w_new = w_old - α × ∂L/∂w
    </text>
    <text x="100" y="450" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">
      where α = learning rate, L = loss function
    </text>
  </g>
</svg>