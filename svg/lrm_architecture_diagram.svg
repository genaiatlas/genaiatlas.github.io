<svg viewBox="0 0 900 850" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="900" height="850" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="450" y="35" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    LRM Architecture (Large Reasoning Model)
  </text>
  
  <text x="450" y="60" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d" font-style="italic">
    Enhanced Logical Inference with RAG Integration
  </text>
  
  <!-- Input Problem -->
  <g transform="translate(325, 90)">
    <rect x="0" y="0" width="250" height="50" fill="#e74c3c" stroke="#c0392b" stroke-width="2" rx="5"/>
    <text x="125" y="32" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">
      Complex Problem / Query
    </text>
  </g>
  
  <line x1="450" y1="140" x2="450" y2="170" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Problem Analysis -->
  <g transform="translate(250, 170)">
    <rect x="0" y="0" width="400" height="70" fill="#3498db" stroke="#2980b9" stroke-width="2" rx="5"/>
    <text x="200" y="25" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">
      1. Problem Analysis &amp; Decomposition
    </text>
    <text x="200" y="45" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
      Break complex problem into sub-components
    </text>
    <text x="200" y="60" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
      Identify information needs
    </text>
  </g>
  
  <line x1="450" y1="240" x2="450" y2="270" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- RAG Component -->
  <g transform="translate(150, 270)">
    <rect x="0" y="0" width="600" height="120" fill="white" stroke="#f39c12" stroke-width="3" rx="8"/>
    <text x="300" y="25" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#f39c12">
      2. Knowledge Retrieval (RAG)
    </text>
    
    <!-- Knowledge Database -->
    <g transform="translate(30, 40)">
      <rect x="0" y="0" width="180" height="60" fill="#fef5e7" stroke="#f39c12" stroke-width="2" rx="5"/>
      <text x="90" y="20" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#f39c12">
        Knowledge Base
      </text>
      <text x="90" y="37" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#34495e">
        📚 Documents
      </text>
      <text x="90" y="52" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#34495e">
        🔬 Scientific Papers
      </text>
    </g>
    
    <!-- Retrieval Process -->
    <line x1="220" y1="70" x2="280" y2="70" stroke="#f39c12" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="250" y="63" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#f39c12">retrieve</text>
    
    <!-- Retrieved Context -->
    <g transform="translate(290, 40)">
      <rect x="0" y="0" width="280" height="60" fill="#d5f4e6" stroke="#27ae60" stroke-width="2" rx="5"/>
      <text x="140" y="20" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#27ae60">
        Retrieved Context
      </text>
      <text x="140" y="38" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#34495e">
        RAG(q) = LLM(concat(q, retrieve(q, 𝒟)))
      </text>
      <text x="140" y="52" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#34495e">
        Relevant facts and evidence
      </text>
    </g>
  </g>
  
  <line x1="450" y1="390" x2="450" y2="420" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Chain-of-Thought Reasoning -->
  <g transform="translate(200, 420)">
    <rect x="0" y="0" width="500" height="140" fill="white" stroke="#9b59b6" stroke-width="3" rx="8"/>
    <text x="250" y="25" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#9b59b6">
      3. Chain-of-Thought Reasoning
    </text>
    
    <!-- Step 1 -->
    <g transform="translate(20, 40)">
      <circle cx="15" cy="15" r="12" fill="#9b59b6"/>
      <text x="15" y="20" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="white">1</text>
      <text x="40" y="20" font-family="Arial, sans-serif" font-size="10" fill="#34495e">
        First, analyze the given information...
      </text>
    </g>
    
    <!-- Step 2 -->
    <g transform="translate(20, 70)">
      <circle cx="15" cy="15" r="12" fill="#9b59b6"/>
      <text x="15" y="20" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="white">2</text>
      <text x="40" y="20" font-family="Arial, sans-serif" font-size="10" fill="#34495e">
        Then, apply logical rules and constraints...
      </text>
    </g>
    
    <!-- Step 3 -->
    <g transform="translate(20, 100)">
      <circle cx="15" cy="15" r="12" fill="#9b59b6"/>
      <text x="15" y="20" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="white">3</text>
      <text x="40" y="20" font-family="Arial, sans-serif" font-size="10" fill="#34495e">
        Finally, synthesize solution with verification...
      </text>
    </g>
  </g>
  
  <line x1="450" y1="560" x2="450" y2="590" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Verification -->
  <g transform="translate(250, 590)">
    <rect x="0" y="0" width="400" height="60" fill="#27ae60" stroke="#229954" stroke-width="2" rx="5"/>
    <text x="200" y="25" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">
      4. Solution Verification
    </text>
    <text x="200" y="45" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
      Self-checking | Consistency validation | Confidence scoring
    </text>
  </g>
  
  <line x1="450" y1="650" x2="450" y2="680" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Output -->
  <g transform="translate(300, 680)">
    <rect x="0" y="0" width="300" height="50" fill="#16a085" stroke="#138d75" stroke-width="2" rx="5"/>
    <text x="150" y="32" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">
      Verified Solution + Reasoning Path
    </text>
  </g>
  
  <!-- Applications Panel -->
  <g transform="translate(50, 760)">
    <rect x="0" y="0" width="800" height="70" fill="#ecf0f1" stroke="#95a5a6" stroke-width="2" rx="5"/>
    <text x="400" y="22" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      AI Agent Applications
    </text>
    <text x="400" y="40" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">
      🔬 Scientific Research | ⚖️ Legal Analysis | 🏥 Medical Diagnosis | 💼 Financial Planning
    </text>
    <text x="400" y="57" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">
      📊 Data Analysis | 🧩 Complex Problem Solving | 🎓 Educational Tutoring
    </text>
  </g>
  
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#34495e"/>
    </marker>
  </defs>
</svg>