<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradReasoning" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4F46E5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradRAG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891B2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradMemory" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradVerify" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#00000020"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="bold" fill="#1e293b">Large Reasoning Model (LRM)</text>
  <text x="400" y="60" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#64748b">Enhanced Logical Inference &amp; Problem Solving</text>
  
  <!-- Input -->
  <rect x="200" y="530" width="400" height="45" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" rx="8" filter="url(#shadow)"/>
  <text x="400" y="558" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#475569">Complex Problem Query</text>
  
  <!-- Supporting Systems -->
  <g id="rag-system">
    <rect x="50" y="300" width="200" height="180" fill="url(#gradRAG)" stroke="#0891B2" stroke-width="2" rx="12" filter="url(#shadow)"/>
    <text x="150" y="330" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold" fill="white">RAG System</text>
    <text x="150" y="350" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#ecfeff">Retrieval Augmented Generation</text>
    
    <rect x="70" y="370" width="160" height="28" fill="white" fill-opacity="0.9" rx="6"/>
    <text x="150" y="389" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#0891B2">Knowledge Base</text>
    
    <rect x="70" y="405" width="160" height="28" fill="white" fill-opacity="0.9" rx="6"/>
    <text x="150" y="424" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#0891B2">Vector Search</text>
    
    <rect x="70" y="440" width="160" height="28" fill="white" fill-opacity="0.9" rx="6"/>
    <text x="150" y="459" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#0891B2">Context Retrieval</text>
  </g>
  
  <g id="memory-system">
    <rect x="550" y="300" width="200" height="180" fill="url(#gradMemory)" stroke="#D97706" stroke-width="2" rx="12" filter="url(#shadow)"/>
    <text x="650" y="330" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold" fill="white">Memory System</text>
    <text x="650" y="350" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#fef3c7">State &amp; History Management</text>
    
    <rect x="570" y="370" width="160" height="28" fill="white" fill-opacity="0.9" rx="6"/>
    <text x="650" y="389" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#D97706">Working Memory</text>
    
    <rect x="570" y="405" width="160" height="28" fill="white" fill-opacity="0.9" rx="6"/>
    <text x="650" y="424" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#D97706">Long-term Store</text>
    
    <rect x="570" y="440" width="160" height="28" fill="white" fill-opacity="0.9" rx="6"/>
    <text x="650" y="459" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#D97706">Context Buffer</text>
  </g>
  
  <!-- Core Reasoning Engine -->
  <rect x="275" y="320" width="250" height="140" fill="url(#gradReasoning)" stroke="#4F46E5" stroke-width="3" rx="15" filter="url(#shadow)"/>
  <text x="400" y="350" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="bold" fill="white">Core Reasoning Engine</text>
  
  <!-- Chain of Thought Steps -->
  <g id="chain-steps">
    <rect x="295" y="370" width="45" height="25" fill="#e0e7ff" stroke="#6366F1" stroke-width="1" rx="4"/>
    <text x="317" y="387" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#4F46E5">Step 1</text>
    
    <rect x="350" y="370" width="45" height="25" fill="#e0e7ff" stroke="#6366F1" stroke-width="1" rx="4"/>
    <text x="372" y="387" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#4F46E5">Step 2</text>
    
    <rect x="405" y="370" width="45" height="25" fill="#e0e7ff" stroke="#6366F1" stroke-width="1" rx="4"/>
    <text x="427" y="387" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#4F46E5">Step 3</text>
    
    <rect x="460" y="370" width="45" height="25" fill="#e0e7ff" stroke="#6366F1" stroke-width="1" rx="4"/>
    <text x="482" y="387" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#4F46E5">Step N</text>
  </g>
  
  <text x="400" y="415" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#c7d2fe">Chain-of-Thought Processing</text>
  <text x="400" y="435" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#c7d2fe">Logical Inference &amp; Reasoning</text>
  
  <!-- Verification Module -->
  <rect x="300" y="200" width="200" height="80" fill="url(#gradVerify)" stroke="#059669" stroke-width="2" rx="12" filter="url(#shadow)"/>
  <text x="400" y="225" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold" fill="white">Verification Module</text>
  <text x="400" y="245" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#d1fae5">Consistency Check</text>
  <text x="400" y="265" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#d1fae5">Error Detection &amp; Validation</text>
  
  <!-- Output -->
  <rect x="275" y="110" width="250" height="60" fill="#dcfce7" stroke="#16a34a" stroke-width="2" rx="12" filter="url(#shadow)"/>
  <text x="400" y="135" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold" fill="#166534">Reasoned Solution</text>
  <text x="400" y="155" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#166534">with Logical Justification</text>
  
  <!-- RAG Formula -->
  <rect x="50" y="490" width="200" height="65" fill="#f0f9ff" stroke="#06B6D4" stroke-width="2" rx="8"/>
  <text x="150" y="510" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0c4a6e">RAG Formula</text>
  <text x="150" y="528" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#0891B2">RAG(q) = LLM(concat(</text>
  <text x="150" y="543" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#0891B2">q, retrieve(q, 𝒟)))</text>
  
  <!-- Arrows and Flow -->
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,8 L12,4 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,8 L12,4 z" fill="#06B6D4"/>
    </marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,8 L12,4 z" fill="#F59E0B"/>
    </marker>
  </defs>
  
  <!-- Main vertical flow -->
  <path d="M 400 530 L 400 460" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 400 320 L 400 280" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 400 200 L 400 170" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  
  <!-- Side connections -->
  <path d="M 250 390 L 275 390" stroke="#06B6D4" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M 525 390 L 550 390" stroke="#F59E0B" stroke-width="3" marker-end="url(#arrow-orange)"/>
  
  <!-- Step flow arrows -->
  <path d="M 340 382 L 350 382" stroke="#6366F1" stroke-width="2"/>
  <path d="M 395 382 L 405 382" stroke="#6366F1" stroke-width="2"/>
  <path d="M 450 382 L 460 382" stroke="#6366F1" stroke-width="2"/>
  
  <!-- Side labels -->
  <text x="265" y="385" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#06B6D4">Knowledge</text>
  <text x="535" y="385" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#F59E0B">Memory</text>
  
  <!-- Flow label -->
  <text x="420" y="495" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#64748b">Problem Analysis</text>
  <text x="420" y="300" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#64748b">Solution Verification</text>
  <text x="420" y="190" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#64748b">Final Output</text>
</svg>