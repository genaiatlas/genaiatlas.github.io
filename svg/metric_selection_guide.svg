<svg width="1000" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title-text { font-family: 'Arial', sans-serif; font-size: 28px; font-weight: bold; fill: #2c3e50; }
      .decision-text { font-family: 'Arial', sans-serif; font-size: 14px; font-weight: bold; fill: #2c3e50; }
      .outcome-text { font-family: 'Arial', sans-serif; font-size: 16px; font-weight: bold; fill: white; }
      .example-text { font-family: 'Arial', sans-serif; font-size: 12px; fill: white; }
      .label-text { font-family: 'Arial', sans-serif; font-size: 12px; font-weight: bold; fill: #34495e; }
      .branch-text { font-family: 'Arial', sans-serif; font-size: 13px; font-weight: bold; fill: #2c3e50; }
    </style>
    
    <!-- Arrow marker -->
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#34495e"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="800" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" class="title-text">Metric Selection Decision Guide</text>
  
  <!-- Start node -->
  <rect x="420" y="60" width="160" height="50" fill="#34495e" stroke="#2c3e50" stroke-width="2" rx="25"/>
  <text x="500" y="80" text-anchor="middle" class="outcome-text">START</text>
  <text x="500" y="95" text-anchor="middle" class="example-text">Choose Evaluation Metric</text>
  
  <!-- First decision: Dataset balance -->
  <polygon points="500,140 560,170 500,200 440,170" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="500" y="165" text-anchor="middle" class="decision-text">Balanced</text>
  <text x="500" y="180" text-anchor="middle" class="decision-text">Dataset?</text>
  
  <!-- Arrow from start to first decision -->
  <line x1="500" y1="110" x2="500" y2="135" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- YES branch from balanced dataset -->
  <line x1="440" y1="170" x2="300" y2="170" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="360" y="165" text-anchor="middle" class="branch-text">YES</text>
  
  <!-- Accuracy outcome -->
  <rect x="150" y="145" width="150" height="50" fill="#27ae60" stroke="#1e8449" stroke-width="2" rx="10"/>
  <text x="225" y="165" text-anchor="middle" class="outcome-text">ACCURACY</text>
  <text x="225" y="180" text-anchor="middle" class="example-text">Equal class importance</text>
  
  <!-- NO branch from balanced dataset -->
  <line x1="500" y1="200" x2="500" y2="240" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="520" y="220" text-anchor="middle" class="branch-text">NO</text>
  
  <!-- Second decision: Cost comparison -->
  <polygon points="500,260 580,300 500,340 420,300" fill="#e67e22" stroke="#d35400" stroke-width="2"/>
  <text x="500" y="290" text-anchor="middle" class="decision-text">False Positive</text>
  <text x="500" y="305" text-anchor="middle" class="decision-text">vs False Negative</text>
  <text x="500" y="320" text-anchor="middle" class="decision-text">Cost?</text>
  
  <!-- FP more costly branch -->
  <line x1="420" y1="300" x2="300" y2="300" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="350" y="290" text-anchor="middle" class="branch-text">FP More</text>
  <text x="350" y="305" text-anchor="middle" class="branch-text">Costly</text>
  
  <!-- Precision outcome -->
  <rect x="150" y="275" width="150" height="50" fill="#8e44ad" stroke="#6c3483" stroke-width="2" rx="10"/>
  <text x="225" y="295" text-anchor="middle" class="outcome-text">PRECISION</text>
  <text x="225" y="310" text-anchor="middle" class="example-text">Avoid false alarms</text>
  
  <!-- FN more costly branch -->
  <line x1="580" y1="300" x2="700" y2="300" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="650" y="290" text-anchor="middle" class="branch-text">FN More</text>
  <text x="650" y="305" text-anchor="middle" class="branch-text">Costly</text>
  
  <!-- Recall outcome -->
  <rect x="700" y="275" width="150" height="50" fill="#e74c3c" stroke="#c0392b" stroke-width="2" rx="10"/>
  <text x="775" y="295" text-anchor="middle" class="outcome-text">RECALL</text>
  <text x="775" y="310" text-anchor="middle" class="example-text">Catch all cases</text>
  
  <!-- Equal cost branch -->
  <line x1="500" y1="340" x2="500" y2="380" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="520" y="360" text-anchor="middle" class="branch-text">Equal Cost</text>
  
  <!-- F1-Score outcome -->
  <rect x="425" y="390" width="150" height="50" fill="#2c3e50" stroke="#1a252f" stroke-width="2" rx="10"/>
  <text x="500" y="410" text-anchor="middle" class="outcome-text">F1-SCORE</text>
  <text x="500" y="425" text-anchor="middle" class="example-text">Balanced approach</text>
  
  <!-- Use case examples section -->
  <rect x="50" y="480" width="900" height="280" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2" rx="10"/>
  <text x="500" y="505" text-anchor="middle" class="title-text" font-size="22px">Real-World Use Case Examples</text>
  
  <!-- Accuracy examples -->
  <rect x="80" y="530" width="200" height="100" fill="#e8f5e8" stroke="#27ae60" stroke-width="2" rx="5"/>
  <text x="180" y="550" text-anchor="middle" class="label-text" fill="#27ae60" font-weight="bold">ACCURACY</text>
  <text x="100" y="570" class="label-text">• Balanced image classification</text>
  <text x="100" y="585" class="label-text">• A/B testing evaluation</text>
  <text x="100" y="600" class="label-text">• General performance reporting</text>
  <text x="100" y="615" class="label-text">• Equal importance scenarios</text>
  
  <!-- Precision examples -->
  <rect x="300" y="530" width="200" height="100" fill="#f4f1ff" stroke="#8e44ad" stroke-width="2" rx="5"/>
  <text x="400" y="550" text-anchor="middle" class="label-text" fill="#8e44ad" font-weight="bold">PRECISION</text>
  <text x="320" y="570" class="label-text">• Email spam detection</text>
  <text x="320" y="585" class="label-text">• Investment recommendations</text>
  <text x="320" y="600" class="label-text">• Quality control</text>
  <text x="320" y="615" class="label-text">• Legal document classification</text>
  
  <!-- Recall examples -->
  <rect x="520" y="530" width="200" height="100" fill="#fdf2f2" stroke="#e74c3c" stroke-width="2" rx="5"/>
  <text x="620" y="550" text-anchor="middle" class="label-text" fill="#e74c3c" font-weight="bold">RECALL</text>
  <text x="540" y="570" class="label-text">• Medical diagnosis</text>
  <text x="540" y="585" class="label-text">• Fraud detection</text>
  <text x="540" y="600" class="label-text">• Security threat detection</text>
  <text x="540" y="615" class="label-text">• Emergency response</text>
  
  <!-- F1-Score examples -->
  <rect x="740" y="530" width="200" height="100" fill="#f8f9fa" stroke="#2c3e50" stroke-width="2" rx="5"/>
  <text x="840" y="550" text-anchor="middle" class="label-text" fill="#2c3e50" font-weight="bold">F1-SCORE</text>
  <text x="760" y="570" class="label-text">• Content moderation</text>
  <text x="760" y="585" class="label-text">• Search relevance</text>
  <text x="760" y="600" class="label-text">• Model comparison</text>
  <text x="760" y="615" class="label-text">• Imbalanced datasets</text>
  
  <!-- Additional considerations -->
  <rect x="100" y="650" width="800" height="80" fill="#fff3e0" stroke="#e67e22" stroke-width="2" rx="5"/>
  <text x="500" y="670" text-anchor="middle" class="label-text" fill="#e67e22" font-weight="bold">ADDITIONAL CONSIDERATIONS</text>
  <text x="120" y="690" class="label-text">• <tspan font-weight="bold">Domain expertise:</tspan> Consult with domain experts about error costs</text>
  <text x="120" y="705" class="label-text">• <tspan font-weight="bold">Business impact:</tspan> Quantify the actual cost of different error types</text>
  <text x="120" y="720" class="label-text">• <tspan font-weight="bold">Multiple metrics:</tspan> Consider reporting multiple metrics for comprehensive evaluation</text>
  
  <!-- Key insight at bottom -->
  <text x="500" y="780" text-anchor="middle" class="decision-text" font-style="italic" fill="#8e44ad">
    Remember: The "best" metric depends on your specific use case, not mathematical perfection
  </text>
</svg>