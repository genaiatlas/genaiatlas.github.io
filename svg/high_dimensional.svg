<svg viewBox="0 0 1100 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="550" y="35" font-size="24" font-weight="bold" text-anchor="middle" fill="#2C3E50">
    The High-Dimensional Challenge in Collaborative Filtering
  </text>
  
  <!-- Subtitle -->
  <text x="550" y="60" font-size="14" text-anchor="middle" fill="#7F8C8D">
    Why simple similarity measures fail in 17,000-dimensional movie space
  </text>
  
  <!-- Section 1: Central User Concept -->
  <g id="central-user">
    <text x="180" y="100" font-size="15" font-weight="bold" text-anchor="middle" fill="#34495E">
      Central User Pattern
    </text>
    
    <rect x="50" y="115" width="260" height="180" fill="#EBF5FB" stroke="#2980B9" stroke-width="2" rx="5"/>
    
    <!-- Central user visualization -->
    <circle cx="180" cy="180" r="35" fill="#3498DB" stroke="#2980B9" stroke-width="3"/>
    <text x="180" y="188" font-size="14" font-weight="bold" text-anchor="middle" fill="white">3 3 3</text>
    <text x="180" y="235" font-size="12" font-weight="bold" text-anchor="middle" fill="#2980B9">Central User</text>
    <text x="180" y="252" font-size="10" text-anchor="middle" fill="#555">Rates all movies: 3</text>
    
    <!-- Variation users -->
    <circle cx="120" cy="150" r="18" fill="#85C1E9" opacity="0.8"/>
    <text x="120" y="155" font-size="9" text-anchor="middle" fill="#2C3E50">C+D₁</text>
    
    <circle cx="240" cy="150" r="18" fill="#85C1E9" opacity="0.8"/>
    <text x="240" y="155" font-size="9" text-anchor="middle" fill="#2C3E50">C+D₂</text>
    
    <circle cx="120" cy="210" r="18" fill="#85C1E9" opacity="0.8"/>
    <text x="120" y="215" font-size="9" text-anchor="middle" fill="#2C3E50">C+D₃</text>
    
    <circle cx="240" cy="210" r="18" fill="#85C1E9" opacity="0.8"/>
    <text x="240" y="215" font-size="9" text-anchor="middle" fill="#2C3E50">C+D₄</text>
    
    <text x="180" y="275" font-size="10" font-style="italic" text-anchor="middle" fill="#7F8C8D">
      Small variations (±1)
    </text>
  </g>
  
  <!-- Section 2: Rating Distribution -->
  <g id="rating-distribution">
    <text x="520" y="100" font-size="15" font-weight="bold" text-anchor="middle" fill="#34495E">
      Variation Pattern
    </text>
    
    <rect x="360" y="115" width="320" height="180" fill="#FEF9E7" stroke="#F39C12" stroke-width="2" rx="5"/>
    
    <!-- Bar chart for probabilities -->
    <text x="520" y="145" font-size="11" font-weight="bold" text-anchor="middle" fill="#555">User Rating Distribution</text>
    
    <!-- Rating 2 -->
    <rect x="380" y="210" width="60" height="60" fill="#E74C3C" opacity="0.7"/>
    <text x="410" y="245" font-size="16" font-weight="bold" text-anchor="middle" fill="white">2</text>
    <text x="410" y="285" font-size="10" text-anchor="middle" fill="#555">P = 1/4</text>
    
    <!-- Rating 3 -->
    <rect x="450" y="170" width="60" height="100" fill="#3498DB" opacity="0.7"/>
    <text x="480" y="225" font-size="16" font-weight="bold" text-anchor="middle" fill="white">3</text>
    <text x="480" y="285" font-size="10" text-anchor="middle" fill="#555">P = 1/2</text>
    
    <!-- Rating 4 -->
    <rect x="520" y="210" width="60" height="60" fill="#27AE60" opacity="0.7"/>
    <text x="550" y="245" font-size="16" font-weight="bold" text-anchor="middle" fill="white">4</text>
    <text x="550" y="285" font-size="10" text-anchor="middle" fill="#555">P = 1/4</text>
    
    <line x1="375" y1="270" x2="585" y2="270" stroke="#34495E" stroke-width="2"/>
    <line x1="375" y1="270" x2="375" y2="165" stroke="#34495E" stroke-width="2"/>
  </g>
  
  <!-- Section 3: Inner Product Problem -->
  <g id="inner-product-problem">
    <text x="900" y="100" font-size="15" font-weight="bold" text-anchor="middle" fill="#34495E">
      Inner Product Scale
    </text>
    
    <rect x="730" y="115" width="340" height="180" fill="#FADBD8" stroke="#E74C3C" stroke-width="2" rx="5"/>
    
    <text x="900" y="145" font-size="12" font-weight="bold" text-anchor="middle" fill="#555">
      Central × Central:
    </text>
    <text x="900" y="170" font-size="16" font-weight="bold" text-anchor="middle" fill="#27AE60">
      3×3 + 3×3 + ... (17,000 times)
    </text>
    <text x="900" y="195" font-size="20" font-weight="bold" text-anchor="middle" fill="#27AE60">
      = 153,000
    </text>
    
    <line x1="760" y1="210" x2="1040" y2="210" stroke="#BDC3C7" stroke-width="1" stroke-dasharray="3,3"/>
    
    <text x="900" y="230" font-size="12" font-weight="bold" text-anchor="middle" fill="#555">
      Variation Range (D·D'):
    </text>
    <text x="900" y="255" font-size="18" font-weight="bold" text-anchor="middle" fill="#E74C3C">
      ≈ -200 to +200
    </text>
    <text x="900" y="280" font-size="10" font-style="italic" text-anchor="middle" fill="#7F8C8D">
      Small compared to 153,000!
    </text>
  </g>
  
  <!-- Divider -->
  <line x1="50" y1="320" x2="1050" y2="320" stroke="#BDC3C7" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Section 4: Cluster Overlap Problem -->
  <g id="cluster-overlap">
    <text x="550" y="360" font-size="16" font-weight="bold" text-anchor="middle" fill="#34495E">
      The Cluster Overlap Problem
    </text>
    
    <!-- Left: Central Cluster -->
    <g id="central-cluster-viz">
      <text x="200" y="395" font-size="13" font-weight="bold" text-anchor="middle" fill="#3498DB">
        Central Cluster
      </text>
      
      <ellipse cx="200" cy="480" rx="120" ry="80" fill="#85C1E9" opacity="0.4" stroke="#2980B9" stroke-width="2"/>
      
      <!-- Dots representing users -->
      <circle cx="180" cy="460" r="4" fill="#2980B9"/>
      <circle cx="220" cy="470" r="4" fill="#2980B9"/>
      <circle cx="190" cy="490" r="4" fill="#2980B9"/>
      <circle cx="210" cy="485" r="4" fill="#2980B9"/>
      <circle cx="200" cy="505" r="4" fill="#2980B9"/>
      <circle cx="170" cy="475" r="4" fill="#2980B9"/>
      <circle cx="230" cy="490" r="4" fill="#2980B9"/>
      
      <text x="200" y="580" font-size="11" text-anchor="middle" fill="#555">
        Inner product: ~153,000
      </text>
      <text x="200" y="595" font-size="10" text-anchor="middle" fill="#7F8C8D">
        Variation: ±200
      </text>
    </g>
    
    <!-- Right: Dance Cluster -->
    <g id="dance-cluster-viz">
      <text x="550" y="395" font-size="13" font-weight="bold" text-anchor="middle" fill="#9B59B6">
        Dance Preference Cluster
      </text>
      
      <ellipse cx="540" cy="480" rx="120" ry="80" fill="#D7BDE2" opacity="0.4" stroke="#8E44AD" stroke-width="2"/>
      
      <!-- Dots representing users -->
      <circle cx="520" cy="460" r="4" fill="#8E44AD"/>
      <circle cx="560" cy="470" r="4" fill="#8E44AD"/>
      <circle cx="530" cy="490" r="4" fill="#8E44AD"/>
      <circle cx="550" cy="485" r="4" fill="#8E44AD"/>
      <circle cx="540" cy="505" r="4" fill="#8E44AD"/>
      <circle cx="510" cy="475" r="4" fill="#8E44AD"/>
      <circle cx="570" cy="490" r="4" fill="#8E44AD"/>
      
      <text x="540" y="580" font-size="11" text-anchor="middle" fill="#555">
        Inner product: ~153,100
      </text>
      <text x="540" y="595" font-size="10" text-anchor="middle" fill="#7F8C8D">
        (+100 for dance movies)
      </text>
    </g>
    
    <!-- Overlap visualization -->
    <path d="M 320 480 Q 430 460 540 480" stroke="#E74C3C" stroke-width="3" stroke-dasharray="8,4" fill="none"/>
    <text x="430" y="450" font-size="11" font-weight="bold" text-anchor="middle" fill="#E74C3C">
      OVERLAP!
    </text>
    
    <text x="370" y="630" font-size="12" font-weight="bold" text-anchor="middle" fill="#E74C3C">
      ⚠️ Problem: Difference of 100 is too small!
    </text>
    <text x="370" y="650" font-size="11" text-anchor="middle" fill="#555">
      Many dance cluster users appear more similar to central users
    </text>
    <text x="370" y="668" font-size="11" text-anchor="middle" fill="#555">
      than actual central cluster members (±200 variation)
    </text>
  </g>
  
  <!-- Histograms -->
  <g id="histograms">
    <text x="900" y="395" font-size="13" font-weight="bold" text-anchor="middle" fill="#34495E">
      Similarity Distributions
    </text>
    
    <rect x="770" y="410" width="260" height="270" fill="#F8F9FA" stroke="#34495E" stroke-width="2" rx="5"/>
    
    <!-- Histogram 1: Within central cluster -->
    <text x="900" y="435" font-size="11" font-weight="bold" text-anchor="middle" fill="#3498DB">
      Central ↔ Central
    </text>
    
    <!-- Bell curve visualization -->
    <path d="M 800 520 Q 900 460 1000 520" stroke="#3498DB" stroke-width="3" fill="none"/>
    <path d="M 800 520 L 800 525 M 850 480 L 850 525 M 900 460 L 900 525 M 950 480 L 950 525 M 1000 520 L 1000 525" 
          stroke="#3498DB" stroke-width="2" opacity="0.6"/>
    
    <line x1="785" y1="525" x2="1015" y2="525" stroke="#34495E" stroke-width="1"/>
    <text x="820" y="540" font-size="9" text-anchor="middle" fill="#555">152,800</text>
    <text x="900" y="540" font-size="9" text-anchor="middle" fill="#555">153,000</text>
    <text x="980" y="540" font-size="9" text-anchor="middle" fill="#555">153,200</text>
    
    <!-- Histogram 2: Central to dance cluster -->
    <text x="900" y="565" font-size="11" font-weight="bold" text-anchor="middle" fill="#9B59B6">
      Central ↔ Dance
    </text>
    
    <!-- Overlapping bell curve -->
    <path d="M 800 640 Q 920 580 1000 640" stroke="#9B59B6" stroke-width="3" fill="none"/>
    <path d="M 800 640 L 800 645 M 860 600 L 860 645 M 920 580 L 920 645 M 970 600 L 970 645 M 1000 640 L 1000 645" 
          stroke="#9B59B6" stroke-width="2" opacity="0.6"/>
    
    <line x1="785" y1="645" x2="1015" y2="645" stroke="#34495E" stroke-width="1"/>
    <text x="820" y="660" font-size="9" text-anchor="middle" fill="#555">152,900</text>
    <text x="900" y="660" font-size="9" text-anchor="middle" fill="#555">153,100</text>
    <text x="980" y="660" font-size="9" text-anchor="middle" fill="#555">153,300</text>
    
    <text x="900" y="680" font-size="10" font-style="italic" text-anchor="middle" fill="#E74C3C">
      Huge overlap!
    </text>
  </g>
  
  <!-- Solution Section -->
  <g id="solution">
    <text x="550" y="730" font-size="16" font-weight="bold" text-anchor="middle" fill="#27AE60">
      💡 Solution: Focus on Relevant Dimensions
    </text>
    
    <rect x="100" y="750" width="900" height="120" fill="#E8F8F5" stroke="#27AE60" stroke-width="2" rx="8"/>
    
    <text x="550" y="780" font-size="13" font-weight="bold" text-anchor="middle" fill="#27AE60">
      Instead of using all 17,000 dimensions...
    </text>
    
    <text x="130" y="810" font-size="12" text-anchor="start" fill="#555">
      <tspan font-weight="bold">1. Focus on dance movies only:</tspan> Reduces noise, makes clusters clearly separable
    </text>
    
    <text x="130" y="832" font-size="12" text-anchor="start" fill="#555">
      <tspan font-weight="bold">2. Use SVD to find important dimensions:</tspan> Automatically discovers which movie groups matter
    </text>
    
    <text x="130" y="854" font-size="12" text-anchor="start" fill="#555">
      <tspan font-weight="bold">3. Simultaneous user + item clustering:</tspan> Finds patterns in both users and movies together
    </text>
  </g>
</svg>