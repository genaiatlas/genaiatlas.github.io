<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="treatmentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="controlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="nullGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <dropShadow dx="2" dy="3" stdDeviation="2" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="700" fill="#fafafa"/>
  
  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1f2937">
    How Permutation Tests Work
  </text>

  <!-- Step 1: Original Data -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="280" height="140" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" filter="url(#shadow)"/>
    
    <text x="140" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2937">
      1. Observed Data
    </text>
    
    <!-- Treatment Group -->
    <rect x="20" y="40" width="100" height="35" rx="4" fill="url(#treatmentGrad)"/>
    <text x="70" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
      Treatment: 8.3
    </text>
    
    <!-- Control Group -->
    <rect x="160" y="40" width="100" height="35" rx="4" fill="url(#controlGrad)"/>
    <text x="210" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
      Control: 6.2
    </text>
    
    <!-- Difference -->
    <rect x="70" y="90" width="120" height="35" rx="4" fill="#f59e0b"/>
    <text x="130" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
      Difference: 2.1
    </text>
  </g>

  <!-- Step 2: The Question -->
  <g transform="translate(380, 80)">
    <rect x="0" y="0" width="280" height="140" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" filter="url(#shadow)"/>
    
    <text x="140" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2937">
      2. The Key Question
    </text>
    
    <text x="140" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#374151">
      Is this difference (2.1) just due to
    </text>
    <text x="140" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#374151">
      random chance, or is there a
    </text>
    <text x="140" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#374151">
      real effect?
    </text>
    
    <text x="140" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#dc2626">
      Permutation test will tell us!
    </text>
  </g>

  <!-- Step 3: Permutation Process -->
  <g transform="translate(710, 80)">
    <rect x="0" y="0" width="240" height="140" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" filter="url(#shadow)"/>
    
    <text x="120" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2937">
      3. Test Strategy
    </text>
    
    <text x="120" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#374151">
      If there's NO real difference,
    </text>
    <text x="120" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#374151">
      then randomly shuffling the
    </text>
    <text x="120" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#374151">
      group labels should give us
    </text>
    <text x="120" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#374151">
      similar differences
    </text>
    
    <text x="120" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#059669">
      Let's test this idea!
    </text>
  </g>

  <!-- Step 4: Simulation Results -->
  <g transform="translate(50, 260)">
    <rect x="0" y="0" width="500" height="200" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" filter="url(#shadow)"/>
    
    <text x="250" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2937">
      4. Simulation: 10,000 Random Shuffles
    </text>
    
    <!-- Histogram -->
    <g transform="translate(50, 40)">
      <!-- Bars -->
      <rect x="20" y="110" width="18" height="20" fill="url(#nullGrad)"/>
      <rect x="45" y="100" width="18" height="30" fill="url(#nullGrad)"/>
      <rect x="70" y="85" width="18" height="45" fill="url(#nullGrad)"/>
      <rect x="95" y="70" width="18" height="60" fill="url(#nullGrad)"/>
      <rect x="120" y="50" width="18" height="80" fill="url(#nullGrad)"/>
      <rect x="145" y="35" width="18" height="95" fill="url(#nullGrad)"/>
      <rect x="170" y="25" width="18" height="105" fill="url(#nullGrad)"/>
      <rect x="195" y="20" width="18" height="110" fill="url(#nullGrad)"/>
      <rect x="220" y="25" width="18" height="105" fill="url(#nullGrad)"/>
      <rect x="245" y="35" width="18" height="95" fill="url(#nullGrad)"/>
      <rect x="270" y="50" width="18" height="80" fill="url(#nullGrad)"/>
      <rect x="295" y="70" width="18" height="60" fill="url(#nullGrad)"/>
      <rect x="320" y="85" width="18" height="45" fill="url(#nullGrad)"/>
      <rect x="345" y="100" width="18" height="30" fill="url(#nullGrad)"/>
      <rect x="370" y="110" width="18" height="20" fill="url(#nullGrad)"/>
      
      <!-- Observed value line -->
      <line x1="350" y1="15" x2="350" y2="140" stroke="#dc2626" stroke-width="4"/>
      <text x="355" y="30" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#dc2626">
        Our observed
      </text>
      <text x="355" y="45" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#dc2626">
        difference: 2.1
      </text>
      
      <!-- Extreme region -->
      <rect x="345" y="15" width="50" height="125" fill="#dc2626" fill-opacity="0.2"/>
      
      <!-- Axes -->
      <line x1="15" y1="140" x2="400" y2="140" stroke="#374151" stroke-width="2"/>
      <text x="200" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#374151">
        Difference in Group Means
      </text>
      
      <!-- Scale -->
      <text x="70" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#374151">-2</text>
      <text x="145" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#374151">-1</text>
      <text x="220" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#374151">0</text>
      <text x="295" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#374151">1</text>
      <text x="370" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#374151">2</text>
    </g>
    
    <text x="250" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#059669">
      Most random shuffles give differences near 0
    </text>
  </g>

  <!-- Step 5: Conclusion -->
  <g transform="translate(600, 260)">
    <rect x="0" y="0" width="350" height="200" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" filter="url(#shadow)"/>
    
    <text x="175" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2937">
      5. The Answer
    </text>
    
    <rect x="20" y="40" width="310" height="50" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
    <text x="175" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">
      Only 23 out of 10,000 shuffles
    </text>
    <text x="175" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#dc2626">
      gave differences as extreme as 2.1
    </text>
    
    <text x="175" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#374151">
      P-value = 23/10,000 = 0.0023
    </text>
    
    <rect x="20" y="125" width="310" height="50" rx="4" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
    <text x="175" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#059669">
      Since 0.0023 &lt; 0.05:
    </text>
    <text x="175" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#059669">
      The difference is NOT due to chance!
    </text>
  </g>

  <!-- Bottom Insight -->
  <g transform="translate(50, 500)">
    <rect x="0" y="0" width="900" height="120" rx="8" fill="#f8fafc" stroke="#6366f1" stroke-width="2" filter="url(#shadow)"/>
    
    <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#4338ca">
      Key Insight: The Power of Permutation Tests
    </text>
    
    <text x="450" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#374151">
      • No assumptions about data distribution needed
    </text>
    <text x="450" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#374151">
      • Works with any group size or test statistic
    </text>
    <text x="450" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#374151">
      • Gives exact p-values through direct simulation
    </text>
  </g>

  <!-- Flow arrows -->
  <path d="M 330 150 L 380 150" stroke="#6b7280" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 660 150 L 710 150" stroke="#6b7280" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 500 220 L 500 260" stroke="#6b7280" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 550 360 L 600 360" stroke="#6b7280" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
  </defs>

</svg>