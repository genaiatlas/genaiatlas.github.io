<svg viewBox="0 0 1400 1050" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1400" height="1050" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="700" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Vector Database Metadata Filters
  </text>
  <text x="700" y="70" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#495057">
    Combining Semantic Search with Structured Filtering
  </text>
  
  <!-- User Query -->
  <g id="user-query">
    <rect x="300" y="100" width="800" height="80" rx="10" fill="#fff3bf" stroke="#f59f00" stroke-width="3"/>
    <text x="700" y="130" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#495057">
      Natural Language Query with Metadata
    </text>
    <text x="700" y="155" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#868e96" font-style="italic">
      "Find recent technical documentation about machine learning in Python"
    </text>
  </g>
  
  <!-- Arrow -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#495057"/>
    </marker>
  </defs>
  <line x1="700" y1="180" x2="700" y2="215" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  
  <!-- Query Decomposition -->
  <g id="decomposition">
    <rect x="50" y="225" width="1300" height="200" rx="10" fill="#e9d5ff" stroke="#9333ea" stroke-width="3"/>
    <text x="700" y="255" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Query Decomposition
    </text>
    
    <!-- Semantic Component -->
    <rect x="80" y="275" width="580" height="130" rx="8" fill="#d3f9d8" stroke="#37b24d" stroke-width="3"/>
    <text x="370" y="300" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Semantic Component
    </text>
    <text x="370" y="325" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#495057">
      (For Vector Similarity Search)
    </text>
    <rect x="100" y="340" width="540" height="50" rx="5" fill="#fff" stroke="#37b24d" stroke-width="2"/>
    <text x="370" y="360" font-family="Arial, sans-serif" font-size="12" fill="#495057">
      Query Text:
    </text>
    <text x="370" y="378" font-family="Arial, sans-serif" font-size="12" font-style="italic" text-anchor="middle" fill="#7950f2">
      "technical documentation about machine learning in Python"
    </text>
    
    <!-- Metadata Component -->
    <rect x="690" y="275" width="630" height="130" rx="8" fill="#ffc9c9" stroke="#f03e3e" stroke-width="3"/>
    <text x="1005" y="300" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Metadata Filters
    </text>
    <text x="1005" y="325" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#495057">
      (Extracted Structured Constraints)
    </text>
    <rect x="710" y="340" width="590" height="50" rx="5" fill="#fff" stroke="#f03e3e" stroke-width="2"/>
    <text x="725" y="360" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Recency: date > 2023-01-01
    </text>
    <text x="725" y="378" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Type: category = "technical_documentation"
    </text>
    <text x="1000" y="360" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Topic: tags CONTAINS "machine_learning"
    </text>
    <text x="1000" y="378" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Language: programming_language = "python"
    </text>
  </g>
  
  <line x1="700" y1="425" x2="700" y2="460" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  
  <!-- Filter Construction -->
  <g id="filter-construction">
    <rect x="50" y="470" width="1300" height="300" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="3"/>
    <text x="700" y="500" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Filter Query Construction
    </text>
    
    <rect x="80" y="520" width="1240" height="235" rx="5" fill="#fff" stroke="#1971c2" stroke-width="2"/>
    <text x="700" y="545" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#495057">
      Generated Filter Query (JSON Format)
    </text>
    
    <text x="100" y="575" font-family="Courier New, monospace" font-size="11" fill="#495057">
      {
    </text>
    <text x="130" y="595" font-family="Courier New, monospace" font-size="11" fill="#e64980">
      "filter": {
    </text>
    <text x="160" y="615" font-family="Courier New, monospace" font-size="11" fill="#7950f2">
      "must": [
    </text>
    <text x="190" y="635" font-family="Courier New, monospace" font-size="10" fill="#495057">
      {"term": {"category": "technical_documentation"}},
    </text>
    <text x="190" y="652" font-family="Courier New, monospace" font-size="10" fill="#495057">
      {"term": {"programming_language": "python"}},
    </text>
    <text x="190" y="669" font-family="Courier New, monospace" font-size="10" fill="#495057">
      {"terms": {"tags": ["machine_learning", "ml", "ai"]}}
    </text>
    <text x="160" y="686" font-family="Courier New, monospace" font-size="11" fill="#7950f2">
      ],
    </text>
    <text x="160" y="703" font-family="Courier New, monospace" font-size="11" fill="#7950f2">
      "filter": [
    </text>
    <text x="190" y="720" font-family="Courier New, monospace" font-size="10" fill="#495057">
      {"range": {"date": {"gte": "2023-01-01"}}}
    </text>
    <text x="160" y="737" font-family="Courier New, monospace" font-size="11" fill="#7950f2">
      ]
    </text>
    <text x="130" y="754" font-family="Courier New, monospace" font-size="11" fill="#e64980">
      }
    </text>
    <text x="100" y="771" font-family="Courier New, monospace" font-size="11" fill="#495057">
      }
    </text>
  </g>
  
  <line x1="700" y1="770" x2="700" y2="805" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  
  <!-- Metadata Types -->
  <g id="metadata-types">
    <rect x="50" y="815" width="1300" height="210" rx="10" fill="#fff9db" stroke="#fab005" stroke-width="3"/>
    <text x="700" y="845" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Common Metadata Types &amp; Filter Patterns
    </text>
    
    <!-- Temporal -->
    <rect x="80" y="865" width="290" height="145" rx="5" fill="#fff" stroke="#fab005" stroke-width="2"/>
    <text x="225" y="888" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#495057">
      ⏰ Temporal Metadata
    </text>
    <text x="95" y="910" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Created Date: 2024-01-15
    </text>
    <text x="95" y="927" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Modified Date: 2024-10-10
    </text>
    <text x="95" y="944" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Expiration: 2025-12-31
    </text>
    <text x="95" y="961" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Version: v2.3.1
    </text>
    <rect x="95" y="970" width="260" height="30" rx="3" fill="#f8f9fa" stroke="#fab005" stroke-width="1"/>
    <text x="225" y="990" font-family="Courier New, monospace" font-size="9" text-anchor="middle" fill="#495057">
      {"range": {"date": {"gte": "2024-01-01"}}}
    </text>
    
    <!-- Categorical -->
    <rect x="390" y="865" width="290" height="145" rx="5" fill="#fff" stroke="#fab005" stroke-width="2"/>
    <text x="535" y="888" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#495057">
      📂 Categorical Metadata
    </text>
    <text x="405" y="910" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Type: article, report, tutorial
    </text>
    <text x="405" y="927" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Category: technical, business
    </text>
    <text x="405" y="944" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Tags: [ml, python, deep-learning]
    </text>
    <text x="405" y="961" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Language: English, Spanish
    </text>
    <rect x="405" y="970" width="260" height="30" rx="3" fill="#f8f9fa" stroke="#fab005" stroke-width="1"/>
    <text x="535" y="990" font-family="Courier New, monospace" font-size="9" text-anchor="middle" fill="#495057">
      {"term": {"category": "technical"}}
    </text>
    
    <!-- Hierarchical -->
    <rect x="700" y="865" width="300" height="145" rx="5" fill="#fff" stroke="#fab005" stroke-width="2"/>
    <text x="850" y="888" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#495057">
      🏢 Hierarchical Metadata
    </text>
    <text x="715" y="910" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Organization: Acme Corp
    </text>
    <text x="715" y="927" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Department: Engineering
    </text>
    <text x="715" y="944" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Project: ProjectX, ProjectY
    </text>
    <text x="715" y="961" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Author: john.doe@company.com
    </text>
    <rect x="715" y="970" width="270" height="30" rx="3" fill="#f8f9fa" stroke="#fab005" stroke-width="1"/>
    <text x="850" y="990" font-family="Courier New, monospace" font-size="9" text-anchor="middle" fill="#495057">
      {"term": {"department": "engineering"}}
    </text>
    
    <!-- Numeric -->
    <rect x="1020" y="865" width="300" height="145" rx="5" fill="#fff" stroke="#fab005" stroke-width="2"/>
    <text x="1170" y="888" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#495057">
      🔢 Numeric Metadata
    </text>
    <text x="1035" y="910" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Page Count: 45
    </text>
    <text x="1035" y="927" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • View Count: 1,234
    </text>
    <text x="1035" y="944" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Rating: 4.5 / 5.0
    </text>
    <text x="1035" y="961" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Priority: 1-10
    </text>
    <rect x="1035" y="970" width="270" height="30" rx="3" fill="#f8f9fa" stroke="#fab005" stroke-width="1"/>
    <text x="1170" y="990" font-family="Courier New, monospace" font-size="9" text-anchor="middle" fill="#495057">
      {"range": {"rating": {"gte": 4.0}}}
    </text>
  </g>
</svg>