<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
    <!-- Background and title -->
    <rect x="0" y="0" width="800" height="500" fill="#f8f9fa" rx="10" ry="10"/>
    <text x="400" y="40" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold">Understanding Hypothesis Test Interpretations</text>
    
    <!-- Article reference -->
    <rect x="100" y="80" width="300" height="120" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="10" ry="10"/>
    <text x="250" y="110" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Scientists rise up against</text>
    <text x="250" y="130" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">statistical significance</text>
    <text x="250" y="160" font-family="Arial" font-size="14" text-anchor="middle" font-style="italic">Nature, March 2019</text>
    
    <!-- Pie chart -->
    <circle cx="550" cy="140" r="90" fill="none" stroke="#424242" stroke-width="1"/>
    
    <!-- Pie chart segments -->
    <path d="M 550,140 L 550,50 A 90,90 0 0,1 640,140 Z" fill="#4caf50" stroke="white" stroke-width="1"/>
    <path d="M 550,140 L 640,140 A 90,90 0 0,1 550,230 A 90,90 0 0,1 460,140 A 90,90 0 0,1 550,50 Z" fill="#f44336" stroke="white" stroke-width="1"/>
    
    <!-- Pie chart labels -->
    <text x="600" y="110" font-family="Arial" font-size="14" text-anchor="middle">Appropriately</text>
    <text x="600" y="130" font-family="Arial" font-size="14" text-anchor="middle">interpreted</text>
    <text x="600" y="150" font-family="Arial" font-size="14" text-anchor="middle">49%</text>
    
    <text x="500" y="170" font-family="Arial" font-size="14" text-anchor="middle">Wrongly</text>
    <text x="500" y="190" font-family="Arial" font-size="14" text-anchor="middle">interpreted</text>
    <text x="500" y="210" font-family="Arial" font-size="14" text-anchor="middle">51%</text>
    
    <text x="550" y="70" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">ARTICLES</text>
    <text x="550" y="90" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">791</text>
    
    <!-- Common misinterpretations section -->
    <rect x="100" y="230" width="600" height="240" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="10" ry="10"/>
    <text x="400" y="260" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">Proper Interpretations of Hypothesis Tests</text>
    
    <!-- When rejecting null -->
    <rect x="130" y="280" width="260" height="170" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" rx="5" ry="5"/>
    <text x="260" y="300" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">When Rejecting H₀: θj* = 0</text>
    
    <text x="140" y="330" font-family="Arial" font-size="14" text-anchor="start">• Data seem inconsistent with H₀</text>
    <text x="140" y="360" font-family="Arial" font-size="14" text-anchor="start">• If H₀ was true, observed data would</text>
    <text x="150" y="380" font-family="Arial" font-size="14" text-anchor="start">occur with probability &lt; 5%</text>
    <text x="140" y="410" font-family="Arial" font-size="14" text-anchor="start">• 5% of rejections will be incorrect</text>
    <text x="140" y="440" font-family="Arial" font-size="14" text-anchor="start">• We have evidence that θj* ≠ 0</text>
    
    <!-- When not rejecting null -->
    <rect x="410" y="280" width="260" height="170" fill="#ffebee" stroke="#f44336" stroke-width="2" rx="5" ry="5"/>
    <text x="540" y="300" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">When NOT Rejecting H₀</text>
    
    <text x="420" y="330" font-family="Arial" font-size="14" text-anchor="start">• θj* = 0 is POSSIBLE, not proven</text>
    <text x="420" y="360" font-family="Arial" font-size="14" text-anchor="start">• Data compatible with H₀</text>
    <text x="420" y="390" font-family="Arial" font-size="14" text-anchor="start">• Possible explanations:</text>
    <text x="430" y="415" font-family="Arial" font-size="14" text-anchor="start">1. No effect (θj* = 0)</text>
    <text x="430" y="440" font-family="Arial" font-size="14" text-anchor="start">2. Small effect (θj* ≈ 0)</text>
    <text x="430" y="465" font-family="Arial" font-size="14" text-anchor="start">3. Too few data points</text>
</svg>