<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="articleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f9fafb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f3f4f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="entityGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dbeafe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bfdbfe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="processGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1f2937">
    Named Entity Extraction from News Articles
  </text>
  
  <!-- Sample Article -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="280" height="200" rx="8" fill="url(#articleGrad)" stroke="#6b7280" stroke-width="2"/>
    <text x="140" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#374151">Brexit Article Example</text>
    <text x="10" y="50" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">The Guardian - June 23, 2016</text>
    
    <!-- Article text with highlighted entities -->
    <text x="10" y="75" font-family="Arial, sans-serif" font-size="11" fill="#374151">"Leave campaign rows back on key immigration and</text>
    <text x="10" y="90" font-family="Arial, sans-serif" font-size="11" fill="#374151">NHS pledges. Tory MP Daniel Hannan says</text>
    <rect x="115" y="82" width="45" height="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" rx="2"/>
    <text x="138" y="90" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#92400e">PERSON</text>
    
    <text x="165" y="90" font-family="Arial, sans-serif" font-size="11" fill="#374151">Brexit</text>
    <rect x="165" y="82" width="30" height="12" fill="#dcfce7" stroke="#22c55e" stroke-width="1" rx="2"/>
    <text x="180" y="90" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#166534">EVENT</text>
    
    <text x="10" y="105" font-family="Arial, sans-serif" font-size="11" fill="#374151">voters will be disappointed if they think there will</text>
    <text x="10" y="120" font-family="Arial, sans-serif" font-size="11" fill="#374151">be no immigration from</text>
    <text x="140" y="120" font-family="Arial, sans-serif" font-size="11" fill="#374151">EU</text>
    <rect x="140" y="112" width="18" height="12" fill="#fee2e2" stroke="#ef4444" stroke-width="1" rx="2"/>
    <text x="149" y="120" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#dc2626">ORG</text>
    
    <text x="10" y="135" font-family="Arial, sans-serif" font-size="11" fill="#374151">after it emerged immigration levels could remain</text>
    <text x="10" y="150" font-family="Arial, sans-serif" font-size="11" fill="#374151">unchanged. Leading Brexit figures had disagreed</text>
    <text x="10" y="165" font-family="Arial, sans-serif" font-size="11" fill="#374151">throughout the campaign on issues..."</text>
    
    <text x="10" y="185" font-family="Arial, sans-serif" font-size="10" font-style="italic" fill="#6b7280">720 total words in article</text>
  </g>
  
  <!-- Arrow to NLP Pipeline -->
  <path d="M 350 180 L 390 180" stroke="#3b82f6" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- NLP Processing Pipeline -->
  <g transform="translate(410, 120)">
    <rect x="0" y="0" width="160" height="120" rx="8" fill="url(#processGrad)" stroke="#1d4ed8" stroke-width="2"/>
    <text x="80" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">NLP Pipeline</text>
    
    <!-- SpaCy logo representation -->
    <circle cx="80" cy="50" r="15" fill="#0ea5e9" stroke="white" stroke-width="2"/>
    <text x="80" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">NLP</text>
    
    <text x="80" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#dbeafe">SpaCy/BERT</text>
    <text x="80" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#dbeafe">Named Entity Recognition</text>
    <text x="80" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#bfdbfe">en_core_web_sm</text>
  </g>
  
  <!-- Arrow to Entity Types -->
  <path d="M 590 180 L 630 180" stroke="#3b82f6" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Entity Classification -->
  <g transform="translate(650, 80)">
    <rect x="0" y="0" width="280" height="200" rx="8" fill="url(#entityGrad)" stroke="#3b82f6" stroke-width="2"/>
    <text x="140" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e40af">Extracted Entities</text>
    
    <!-- Entity Types -->
    <!-- PERSON -->
    <rect x="20" y="50" width="80" height="40" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="60" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#92400e">PERSON</text>
    <text x="60" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#92400e">Names</text>
    
    <!-- ORGANIZATION -->
    <rect x="120" y="50" width="80" height="40" rx="5" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <text x="160" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#dc2626">ORGANIZATION</text>
    <text x="160" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#dc2626">Companies</text>
    
    <!-- LOCATION -->
    <rect x="220" y="50" width="80" height="40" rx="5" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="260" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#166534">LOCATION</text>
    <text x="260" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#166534">Places</text>
  </g>
  
  <!-- Entity Examples Table -->
  <g transform="translate(70, 320)">
    <rect x="0" y="0" width="860" height="250" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <text x="430" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">Entity Extraction Results</text>
    
    <!-- Table Headers -->
    <rect x="20" y="40" width="200" height="30" fill="#3b82f6" rx="4"/>
    <text x="120" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Entity Name</text>
    
    <rect x="220" y="40" width="150" height="30" fill="#3b82f6" rx="4"/>
    <text x="295" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Entity Type</text>
    
    <rect x="370" y="40" width="100" height="30" fill="#3b82f6" rx="4"/>
    <text x="420" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Count</text>
    
    <rect x="470" y="40" width="200" height="30" fill="#3b82f6" rx="4"/>
    <text x="570" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">TF-IDF Score</text>
    
    <rect x="670" y="40" width="170" height="30" fill="#3b82f6" rx="4"/>
    <text x="755" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Significance</text>
    
    <!-- Table Data -->
    <g transform="translate(0, 70)">
      <!-- Row 1 -->
      <rect x="20" y="0" width="820" height="25" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
      <text x="30" y="17" font-family="Arial, sans-serif" font-size="12" fill="#374151">Brexit</text>
      <text x="230" y="17" font-family="Arial, sans-serif" font-size="12" fill="#374151">EVENT/TOPIC</text>
      <text x="420" y="17" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#374151">3</text>
      <text x="570" y="17" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#374151">0.045</text>
      <text x="755" y="17" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#059669">High</text>
      
      <!-- Row 2 -->
      <rect x="20" y="25" width="820" height="25" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
      <text x="30" y="42" font-family="Arial, sans-serif" font-size="12" fill="#374151">Britain</text>
      <text x="230" y="42" font-family="Arial, sans-serif" font-size="12" fill="#374151">LOCATION</text>
      <text x="420" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#374151">6</text>
      <text x="570" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#374151">0.086</text>
      <text x="755" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#059669">High</text>
      
      <!-- Row 3 -->
      <rect x="20" y="50" width="820" height="25" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
      <text x="30" y="67" font-family="Arial, sans-serif" font-size="12" fill="#374151">EU</text>
      <text x="230" y="67" font-family="Arial, sans-serif" font-size="12" fill="#374151">ORGANIZATION</text>
      <text x="420" y="67" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#374151">11</text>
      <text x="570" y="67" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#374151">0.157</text>
      <text x="755" y="67" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#dc2626">Very High</text>
      
      <!-- Row 4 -->
      <rect x="20" y="75" width="820" height="25" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
      <text x="30" y="92" font-family="Arial, sans-serif" font-size="12" fill="#374151">Daniel Hannan</text>
      <text x="230" y="92" font-family="Arial, sans-serif" font-size="12" fill="#374151">PERSON</text>
      <text x="420" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#374151">1</text>
      <text x="570" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#374151">0.029</text>
      <text x="755" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#f59e0b">Medium</text>
      
      <!-- Row 5 -->
      <rect x="20" y="100" width="820" height="25" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
      <text x="30" y="117" font-family="Arial, sans-serif" font-size="12" fill="#374151">NHS</text>
      <text x="230" y="117" font-family="Arial, sans-serif" font-size="12" fill="#374151">ORGANIZATION</text>
      <text x="420" y="117" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#374151">3</text>
      <text x="570" y="117" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#374151">0.043</text>
      <text x="755" y="117" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#059669">High</text>
      
      <!-- Row 6 -->
      <rect x="20" y="125" width="820" height="25" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
      <text x="30" y="142" font-family="Arial, sans-serif" font-size="12" fill="#374151">Bank of England</text>
      <text x="230" y="142" font-family="Arial, sans-serif" font-size="12" fill="#374151">ORGANIZATION</text>
      <text x="420" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#374151">1</text>
      <text x="570" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#374151">0.029</text>
      <text x="755" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#f59e0b">Medium</text>
    </g>
    
    <!-- Summary Statistics -->
    <g transform="translate(50, 220)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#374151">Summary: 1,063 unique entities across 60 articles</text>
      <text x="0" y="20" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">• Average entities per article: 17.7</text>
      <text x="250" y="20" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">• PERSON: 324 entities</text>
      <text x="400" y="20" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">• ORGANIZATION: 289 entities</text>
      <text x="600" y="20" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">• LOCATION: 450 entities</text>
    </g>
  </g>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
     refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6" />
    </marker>
  </defs>
</svg>