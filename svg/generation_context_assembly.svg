<svg viewBox="0 0 1400 950" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1400" height="950" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="700" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Context Assembly Process
  </text>
  <text x="700" y="70" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#495057">
    Organizing Retrieved Documents for Optimal Generation
  </text>
  
  <!-- Input: Raw Retrieved Documents -->
  <rect x="50" y="110" width="240" height="180" rx="10" fill="#e9ecef" stroke="#495057" stroke-width="2"/>
  <text x="170" y="140" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    📄 Retrieved Docs
  </text>
  <text x="170" y="165" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#868e96">
    (Unorganized)
  </text>
  <rect x="70" y="180" width="200" height="90" rx="5" fill="#fff" stroke="#868e96" stroke-width="1"/>
  <text x="80" y="198" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    Doc 1: Score 0.82
  </text>
  <text x="80" y="215" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    Doc 2: Score 0.91
  </text>
  <text x="80" y="232" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    Doc 3: Score 0.75
  </text>
  <text x="80" y="249" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    Doc 4: Score 0.88
  </text>
  <text x="80" y="266" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    Doc 5: Score 0.79
  </text>
  
  <!-- Arrow -->
  <path d="M 290 200 L 350 200" stroke="#495057" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Context Assembly Pipeline -->
  <rect x="350" y="110" width="1000" height="720" rx="15" fill="#d0ebff" stroke="#1c7ed6" stroke-width="4"/>
  <text x="850" y="150" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Context Assembly Pipeline
  </text>
  
  <!-- Step 1: Ranking & Re-ranking -->
  <g id="ranking">
    <rect x="380" y="180" width="450" height="150" rx="10" fill="#fff" stroke="#1c7ed6" stroke-width="3"/>
    <text x="605" y="210" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Step 1: Ranking &amp; Re-ranking
    </text>
    
    <rect x="400" y="230" width="195" height="85" rx="8" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="2"/>
    <text x="497" y="255" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1c7ed6">
      Initial Ranking
    </text>
    <text x="420" y="277" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Vector similarity scores
    </text>
    <text x="420" y="293" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Basic relevance ordering
    </text>
    
    <rect x="615" y="230" width="195" height="85" rx="8" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="2"/>
    <text x="712" y="255" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1c7ed6">
      Advanced Re-ranking
    </text>
    <text x="635" y="277" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Cross-encoder models
    </text>
    <text x="635" y="293" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Query-document pairs
    </text>
  </g>
  
  <!-- Arrow -->
  <path d="M 605 330 L 605 370" stroke="#1c7ed6" stroke-width="3" fill="none" marker-end="url(#arrowhead2)"/>
  
  <!-- Step 2: Filtering -->
  <g id="filtering">
    <rect x="380" y="370" width="450" height="150" rx="10" fill="#fff" stroke="#1c7ed6" stroke-width="3"/>
    <text x="605" y="400" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Step 2: Filtering
    </text>
    
    <rect x="400" y="420" width="195" height="85" rx="8" fill="#fff3bf" stroke="#fab005" stroke-width="2"/>
    <text x="497" y="445" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#fab005">
      Relevance Threshold
    </text>
    <text x="420" y="467" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Remove low scores
    </text>
    <text x="420" y="483" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Keep top-k documents
    </text>
    
    <rect x="615" y="420" width="195" height="85" rx="8" fill="#fff3bf" stroke="#fab005" stroke-width="2"/>
    <text x="712" y="445" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#fab005">
      Deduplication
    </text>
    <text x="635" y="467" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Remove duplicates
    </text>
    <text x="635" y="483" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Merge similar chunks
    </text>
  </g>
  
  <!-- Arrow -->
  <path d="M 605 520 L 605 560" stroke="#fab005" stroke-width="3" fill="none" marker-end="url(#arrowhead3)"/>
  
  <!-- Step 3: Structuring -->
  <g id="structuring">
    <rect x="380" y="560" width="450" height="150" rx="10" fill="#fff" stroke="#1c7ed6" stroke-width="3"/>
    <text x="605" y="590" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Step 3: Structuring
    </text>
    
    <rect x="400" y="610" width="410" height="85" rx="8" fill="#d3f9d8" stroke="#37b24d" stroke-width="2"/>
    <text x="605" y="635" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#37b24d">
      Logical Organization
    </text>
    <text x="420" y="657" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Group by topic/theme • Chronological ordering • Add section headers
    </text>
    <text x="420" y="675" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Include metadata (source, date) • Format for readability
    </text>
  </g>
  
  <!-- Arrow -->
  <path d="M 605 710 L 605 750" stroke="#37b24d" stroke-width="3" fill="none" marker-end="url(#arrowhead4)"/>
  
  <!-- Step 4: Token Management -->
  <g id="token-management">
    <rect x="380" y="750" width="450" height="60" rx="10" fill="#e9d5ff" stroke="#9333ea" stroke-width="3"/>
    <text x="605" y="775" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#9333ea">
      Step 4: Token Budget Management
    </text>
    <text x="605" y="795" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#495057">
      Ensure context fits within LLM's window • Truncate if necessary • Prioritize most relevant
    </text>
  </g>
  
  <!-- Context Assembly Strategies -->
  <g id="strategies">
    <rect x="860" y="180" width="460" height="630" rx="10" fill="#fff" stroke="#c92a2a" stroke-width="3"/>
    <text x="1090" y="215" font-family="Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Assembly Strategies
    </text>
    
    <!-- Stuff Strategy -->
    <rect x="880" y="240" width="420" height="95" rx="8" fill="#fff5f5" stroke="#c92a2a" stroke-width="2"/>
    <text x="1090" y="265" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#c92a2a">
      1. Stuff Strategy
    </text>
    <text x="900" y="285" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      Insert all docs directly into prompt
    </text>
    <text x="900" y="303" font-family="Arial, sans-serif" font-size="10" fill="#37b24d">
      ✓ Simple and fast
    </text>
    <text x="900" y="321" font-family="Arial, sans-serif" font-size="10" fill="#e03131">
      ✗ Limited by context window
    </text>
    
    <!-- Map-Reduce Strategy -->
    <rect x="880" y="350" width="420" height="95" rx="8" fill="#fff5f5" stroke="#c92a2a" stroke-width="2"/>
    <text x="1090" y="375" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#c92a2a">
      2. Map-Reduce Strategy
    </text>
    <text x="900" y="395" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      Summarize each doc → Combine summaries
    </text>
    <text x="900" y="413" font-family="Arial, sans-serif" font-size="10" fill="#37b24d">
      ✓ Handles many documents
    </text>
    <text x="900" y="431" font-family="Arial, sans-serif" font-size="10" fill="#e03131">
      ✗ May lose details in summaries
    </text>
    
    <!-- Refine Strategy -->
    <rect x="880" y="460" width="420" height="95" rx="8" fill="#fff5f5" stroke="#c92a2a" stroke-width="2"/>
    <text x="1090" y="485" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#c92a2a">
      3. Refine Strategy
    </text>
    <text x="900" y="505" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      Iteratively refine answer with each doc
    </text>
    <text x="900" y="523" font-family="Arial, sans-serif" font-size="10" fill="#37b24d">
      ✓ High quality, comprehensive
    </text>
    <text x="900" y="541" font-family="Arial, sans-serif" font-size="10" fill="#e03131">
      ✗ Slower (multiple LLM calls)
    </text>
    
    <!-- Map-Rerank Strategy -->
    <rect x="880" y="570" width="420" height="95" rx="8" fill="#fff5f5" stroke="#c92a2a" stroke-width="2"/>
    <text x="1090" y="595" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#c92a2a">
      4. Map-Rerank Strategy
    </text>
    <text x="900" y="615" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      Generate answer from each doc → Rank best
    </text>
    <text x="900" y="633" font-family="Arial, sans-serif" font-size="10" fill="#37b24d">
      ✓ Best single answer selection
    </text>
    <text x="900" y="651" font-family="Arial, sans-serif" font-size="10" fill="#e03131">
      ✗ Resource-intensive
    </text>
    
    <!-- Hybrid Approach -->
    <rect x="880" y="680" width="420" height="110" rx="8" fill="#d3f9d8" stroke="#37b24d" stroke-width="3"/>
    <text x="1090" y="705" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#37b24d">
      💡 Hybrid Approach
    </text>
    <text x="900" y="725" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      Combine strategies based on:
    </text>
    <text x="900" y="743" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Number of documents • Document lengths
    </text>
    <text x="900" y="761" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Query complexity • Performance requirements
    </text>
    <text x="900" y="779" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      Choose optimal strategy per query!
    </text>
  </g>
  
  <!-- Arrow to output -->
  <path d="M 605 810 L 605 870" stroke="#37b24d" stroke-width="3" fill="none" marker-end="url(#arrowhead4)"/>
  
  <!-- Output: Assembled Context -->
  <rect x="450" y="870" width="310" height="60" rx="10" fill="#d3f9d8" stroke="#37b24d" stroke-width="3"/>
  <text x="605" y="895" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    ✅ Assembled Context
  </text>
  <text x="605" y="915" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#495057">
    Optimized for LLM generation
  </text>
  
  <!-- Best Practices -->
  <rect x="50" y="320" width="290" height="360" rx="10" fill="#fff3bf" stroke="#fcc419" stroke-width="2"/>
  <text x="195" y="355" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    💡 Best Practices
  </text>
  
  <text x="70" y="385" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#495057">
    Quality Over Quantity:
  </text>
  <text x="70" y="403" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    • 3-5 highly relevant docs better
  </text>
  <text x="70" y="419" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    than 20 mediocre ones
  </text>
  
  <text x="70" y="445" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#495057">
    Maintain Context:
  </text>
  <text x="70" y="463" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    • Keep document structure
  </text>
  <text x="70" y="479" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    • Preserve relationships
  </text>
  
  <text x="70" y="505" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#495057">
    Add Metadata:
  </text>
  <text x="70" y="523" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    • Source, date, author
  </text>
  <text x="70" y="539" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    • Helps with citation
  </text>
  
  <text x="70" y="565" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#495057">
    Diversity Matters:
  </text>
  <text x="70" y="583" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    • Include different perspectives
  </text>
  <text x="70" y="599" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    • Avoid redundancy
  </text>
  
  <text x="70" y="625" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#495057">
    Monitor Token Usage:
  </text>
  <text x="70" y="643" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    • Track context window usage
  </text>
  <text x="70" y="659" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    • Balance cost vs quality
  </text>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#495057"/>
    </marker>
    <marker id="arrowhead2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#1c7ed6"/>
    </marker>
    <marker id="arrowhead3" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#fab005"/>
    </marker>
    <marker id="arrowhead4" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#37b24d"/>
    </marker>
  </defs>
</svg>