<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">Multi-Class Probability Output Example</text>
  
  <!-- Input Image Section -->
  <g id="input-section">
    <text x="100" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#34495e">Input Image</text>
    
    <!-- Stylized digit "2" -->
    <rect x="60" y="80" width="80" height="80" fill="#000000" stroke="#34495e" stroke-width="2" rx="5"/>
    <path d="M75,95 Q95,90 115,95 Q115,105 95,115 L75,145 L115,145" fill="none" stroke="#ffffff" stroke-width="4"/>
    
    <text x="100" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">28×28 pixels</text>
    <text x="100" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">Handwritten "2"</text>
  </g>
  
  <!-- Arrow from input to network -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e"/>
    </marker>
  </defs>
  <line x1="160" y1="130" x2="210" y2="130" stroke="#34495e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="185" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#34495e">Neural Network</text>
  
  <!-- Network representation (simplified) -->
  <g id="network-simple">
    <rect x="230" y="100" width="120" height="60" fill="#e74c3c" stroke="#c0392b" stroke-width="2" rx="10"/>
    <text x="290" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">Multi-Class</text>
    <text x="290" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">Neural Network</text>
    <text x="290" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#ffffff">with Softmax</text>
  </g>
  
  <!-- Arrow from network to output -->
  <line x1="370" y1="130" x2="420" y2="130" stroke="#34495e" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Output Probabilities -->
  <g id="output-probabilities">
    <text x="600" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#34495e">Output Probabilities</text>
    
    <!-- Probability bars for each class -->
    <g id="prob-bars">
      <!-- Class 0 -->
      <g transform="translate(450, 90)">
        <text x="0" y="15" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Digit 0:</text>
        <rect x="60" y="0" width="200" height="20" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" rx="10"/>
        <rect x="60" y="0" width="20" height="20" fill="#e74c3c" rx="10"/>
        <text x="270" y="15" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">0.10</text>
      </g>
      
      <!-- Class 1 -->
      <g transform="translate(450, 120)">
        <text x="0" y="15" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Digit 1:</text>
        <rect x="60" y="0" width="200" height="20" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" rx="10"/>
        <rect x="60" y="0" width="10" height="20" fill="#e74c3c" rx="10"/>
        <text x="270" y="15" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">0.05</text>
      </g>
      
      <!-- Class 2 (highest probability) -->
      <g transform="translate(450, 150)">
        <text x="0" y="15" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#27ae60">Digit 2:</text>
        <rect x="60" y="0" width="200" height="20" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" rx="10"/>
        <rect x="60" y="0" width="170" height="20" fill="#27ae60" rx="10"/>
        <text x="270" y="15" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#27ae60">0.85</text>
      </g>
      
      <!-- Class 3 -->
      <g transform="translate(450, 180)">
        <text x="0" y="15" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Digit 3:</text>
        <rect x="60" y="0" width="200" height="20" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" rx="10"/>
        <rect x="60" y="0" width="0" height="20" fill="#e74c3c" rx="10"/>
        <text x="270" y="15" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">0.00</text>
      </g>
      
      <!-- Class 4 -->
      <g transform="translate(450, 210)">
        <text x="0" y="15" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Digit 4:</text>
        <rect x="60" y="0" width="200" height="20" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" rx="10"/>
        <rect x="60" y="0" width="0" height="20" fill="#e74c3c" rx="10"/>
        <text x="270" y="15" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">0.00</text>
      </g>
      
      <!-- Class 5-9 (remaining classes) -->
      <g transform="translate(450, 240)">
        <text x="0" y="15" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">Digits 5-9:</text>
        <rect x="60" y="0" width="200" height="20" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" rx="10"/>
        <rect x="60" y="0" width="0" height="20" fill="#e74c3c" rx="10"/>
        <text x="270" y="15" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">0.00 each</text>
      </g>
    </g>
    
    <!-- Sum verification -->
    <text x="600" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">Sum = 1.00 ✓</text>
  </g>
  
  <!-- Decision Process -->
  <g id="decision-process" transform="translate(50, 320)">
    <rect x="0" y="0" width="700" height="120" fill="#ffffff" stroke="#bdc3c7" stroke-width="2" rx="10"/>
    <text x="350" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Decision Process</text>
    
    <!-- Step 1 -->
    <g transform="translate(20, 45)">
      <circle cx="15" cy="0" r="12" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
      <text x="15" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">1</text>
      <text x="40" y="5" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50"><tspan font-weight="bold">Apply Softmax:</tspan> Convert logits to probabilities</text>
      <text x="40" y="20" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Each output neuron produces a probability between 0 and 1</text>
    </g>
    
    <!-- Step 2 -->
    <g transform="translate(20, 75)">
      <circle cx="15" cy="0" r="12" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
      <text x="15" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">2</text>
      <text x="40" y="5" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50"><tspan font-weight="bold">Find Maximum:</tspan> argmax([0.10, 0.05, 0.85, 0.00, ...]) = 2</text>
      <text x="40" y="20" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Select the class with the highest probability</text>
    </g>
    
    <!-- Result -->
    <g transform="translate(400, 45)">
      <rect x="0" y="10" width="250" height="50" fill="#d5f4e6" stroke="#27ae60" stroke-width="2" rx="10"/>
      <text x="125" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#27ae60">Prediction: Digit 2</text>
      <text x="125" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#27ae60">Confidence: 85%</text>
      <text x="125" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#27ae60">✓ Correct Classification</text>
    </g>
  </g>
  
  <!-- Mathematical Representation -->
  <g id="math-section" transform="translate(50, 460)">
    <rect x="0" y="0" width="700" height="100" fill="#f4f6f7" stroke="#bdc3c7" stroke-width="2" rx="10"/>
    <text x="350" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Mathematical Representation</text>
    
    <!-- Softmax formula -->
    <text x="50" y="50" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50"><tspan font-weight="bold">Softmax Function:</tspan></text>
    <text x="50" y="70" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">P(y = j | x) = exp(z_j) / Σ(exp(z_k)) for k = 0 to 9</text>
    
    <!-- Example calculation -->
    <text x="400" y="50" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50"><tspan font-weight="bold">Example for class 2:</tspan></text>
    <text x="400" y="70" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">P(y = 2 | x) = exp(z_2) / Σ(exp(z_k)) = 0.85</text>
  </g>
  
  <!-- Comparison with other outputs -->
  <g id="comparison" transform="translate(50, 580)">
    <text x="350" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">
      <tspan font-weight="bold">Key Properties:</tspan> All probabilities sum to 1.0 • Higher logits → Higher probabilities • Differentiable for backpropagation
    </text>
  </g>
  
  <!-- Confidence indicator -->
  <g id="confidence" transform="translate(300, 270)">
    <circle cx="0" cy="0" r="40" fill="none" stroke="#27ae60" stroke-width="6" stroke-dasharray="0 251"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#27ae60" stroke-width="6" stroke-dasharray="213.5 251" transform="rotate(-90)"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#27ae60">85%</text>
    <text x="0" y="-55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#27ae60">Confidence</text>
  </g>
</svg>