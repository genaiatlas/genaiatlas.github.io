<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .node { fill: #4A90E2; stroke: #2E5D8A; stroke-width: 2; }
      .input-node { fill: #7ED321; stroke: #5AA016; }
      .output-node { fill: #F5A623; stroke: #D1890B; }
      .loss-node { fill: #E74C3C; stroke: #C0392B; }
      .forward-arrow { stroke: #7ED321; stroke-width: 3; fill: none; }
      .backward-arrow { stroke: #E74C3C; stroke-width: 3; fill: none; }
      .connection { stroke: #666; stroke-width: 1; opacity: 0.5; }
      .text-label { font-family: Arial, sans-serif; font-size: 12px; text-anchor: middle; fill: white; font-weight: bold; }
      .equation-text { font-family: 'Times New Roman', serif; font-size: 11px; text-anchor: middle; fill: #333; }
      .phase-title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #333; }
      .step-text { font-family: Arial, sans-serif; font-size: 12px; fill: #555; }
      .main-title { font-family: Arial, sans-serif; font-size: 20px; text-anchor: middle; font-weight: bold; fill: #333; }
    </style>
    <marker id="forward-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7ED321" />
    </marker>
    <marker id="backward-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#E74C3C" />
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="700" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>
  
  <!-- Main Title -->
  <text x="500" y="30" class="main-title">Backpropagation Algorithm: Forward and Backward Pass</text>
  
  <!-- Forward Pass Section -->
  <rect x="20" y="60" width="960" height="280" fill="#F0F8F0" stroke="#7ED321" stroke-width="2" rx="10"/>
  <text x="50" y="85" class="phase-title" fill="#2E7D2E">Forward Pass: Compute Activations</text>
  
  <!-- Input Layer -->
  <circle cx="100" cy="150" r="18" class="node input-node"/>
  <text x="100" y="155" class="text-label">x₁</text>
  <circle cx="100" cy="200" r="18" class="node input-node"/>
  <text x="100" y="205" class="text-label">x₂</text>
  <circle cx="100" cy="250" r="18" class="node input-node"/>
  <text x="100" y="255" class="text-label">x₃</text>
  
  <!-- Hidden Layer 1 -->
  <circle cx="250" cy="130" r="16" class="node"/>
  <text x="250" y="135" class="text-label" style="font-size: 10px;">h₁¹</text>
  <circle cx="250" cy="180" r="16" class="node"/>
  <text x="250" y="185" class="text-label" style="font-size: 10px;">h₂¹</text>
  <circle cx="250" cy="230" r="16" class="node"/>
  <text x="250" y="235" class="text-label" style="font-size: 10px;">h₃¹</text>
  <circle cx="250" cy="280" r="16" class="node"/>
  <text x="250" y="285" class="text-label" style="font-size: 10px;">h₄¹</text>
  
  <!-- Hidden Layer 2 -->
  <circle cx="400" cy="150" r="16" class="node"/>
  <text x="400" y="155" class="text-label" style="font-size: 10px;">h₁²</text>
  <circle cx="400" cy="200" r="16" class="node"/>
  <text x="400" y="205" class="text-label" style="font-size: 10px;">h₂²</text>
  <circle cx="400" cy="250" r="16" class="node"/>
  <text x="400" y="255" class="text-label" style="font-size: 10px;">h₃²</text>
  
  <!-- Output Layer -->
  <circle cx="550" cy="200" r="18" class="node output-node"/>
  <text x="550" y="205" class="text-label">ŷ</text>
  
  <!-- Loss -->
  <circle cx="700" cy="200" r="18" class="node loss-node"/>
  <text x="700" y="205" class="text-label">ℒ</text>
  
  <!-- Forward Pass Connections -->
  <line x1="118" y1="150" x2="232" y2="130" class="connection"/>
  <line x1="118" y1="200" x2="232" y2="180" class="connection"/>
  <line x1="118" y1="250" x2="232" y2="230" class="connection"/>
  
  <line x1="266" y1="130" x2="384" y2="150" class="connection"/>
  <line x1="266" y1="180" x2="384" y2="200" class="connection"/>
  <line x1="266" y1="230" x2="384" y2="250" class="connection"/>
  
  <line x1="416" y1="150" x2="532" y2="200" class="connection"/>
  <line x1="416" y1="200" x2="532" y2="200" class="connection"/>
  <line x1="416" y1="250" x2="532" y2="200" class="connection"/>
  
  <line x1="568" y1="200" x2="682" y2="200" class="connection"/>
  
  <!-- Forward Pass Arrows -->
  <line x1="150" y1="200" x2="200" y2="200" class="forward-arrow" marker-end="url(#forward-arrow)"/>
  <line x1="300" y1="200" x2="350" y2="200" class="forward-arrow" marker-end="url(#forward-arrow)"/>
  <line x1="450" y1="200" x2="500" y2="200" class="forward-arrow" marker-end="url(#forward-arrow)"/>
  <line x1="600" y1="200" x2="650" y2="200" class="forward-arrow" marker-end="url(#forward-arrow)"/>
  
  <!-- Forward Pass Equations -->
  <text x="175" y="300" class="equation-text">z¹ = W¹x + b¹</text>
  <text x="175" y="315" class="equation-text">a¹ = σ(z¹)</text>
  
  <text x="325" y="300" class="equation-text">z² = W²a¹ + b²</text>
  <text x="325" y="315" class="equation-text">a² = σ(z²)</text>
  
  <text x="475" y="300" class="equation-text">z³ = W³a² + b³</text>
  <text x="475" y="315" class="equation-text">ŷ = σ(z³)</text>
  
  <text x="625" y="300" class="equation-text">ℒ = Loss(ŷ, y)</text>
  
  <!-- Forward Pass Steps -->
  <text x="750" y="120" class="step-text">Forward Pass Steps:</text>
  <text x="750" y="140" class="step-text">1. Input → Hidden Layer 1</text>
  <text x="750" y="155" class="step-text">2. Hidden Layer 1 → Hidden Layer 2</text>
  <text x="750" y="170" class="step-text">3. Hidden Layer 2 → Output</text>
  <text x="750" y="185" class="step-text">4. Output → Loss</text>
  <text x="750" y="210" class="step-text">Store all activations:</text>
  <text x="750" y="225" class="step-text">a¹, a², ŷ for backprop</text>
  
  <!-- Backward Pass Section -->
  <rect x="20" y="360" width="960" height="280" fill="#F8F0F0" stroke="#E74C3C" stroke-width="2" rx="10"/>
  <text x="50" y="385" class="phase-title" fill="#C0392B">Backward Pass: Compute Gradients</text>
  
  <!-- Same network structure for backward pass -->
  <!-- Input Layer (backward) -->
  <circle cx="100" cy="450" r="18" class="node input-node"/>
  <text x="100" y="455" class="text-label">∂ℒ/∂W¹</text>
  <circle cx="100" cy="500" r="18" class="node input-node"/>
  <text x="100" y="505" class="text-label">∂ℒ/∂b¹</text>
  <circle cx="100" cy="550" r="18" class="node input-node"/>
  <text x="100" y="555" class="text-label">∂ℒ/∂x</text>
  
  <!-- Hidden Layer 1 (backward) -->
  <circle cx="250" cy="430" r="16" class="node"/>
  <text x="250" y="435" class="text-label" style="font-size: 9px;">∂ℒ/∂a¹</text>
  <circle cx="250" cy="480" r="16" class="node"/>
  <text x="250" y="485" class="text-label" style="font-size: 9px;">∂ℒ/∂W²</text>
  <circle cx="250" cy="530" r="16" class="node"/>
  <text x="250" y="535" class="text-label" style="font-size: 9px;">∂ℒ/∂b²</text>
  
  <!-- Hidden Layer 2 (backward) -->
  <circle cx="400" cy="450" r="16" class="node"/>
  <text x="400" y="455" class="text-label" style="font-size: 9px;">∂ℒ/∂a²</text>
  <circle cx="400" cy="500" r="16" class="node"/>
  <text x="400" y="505" class="text-label" style="font-size: 9px;">∂ℒ/∂W³</text>
  <circle cx="400" cy="550" r="16" class="node"/>
  <text x="400" y="555" class="text-label" style="font-size: 9px;">∂ℒ/∂b³</text>
  
  <!-- Output Layer (backward) -->
  <circle cx="550" cy="500" r="18" class="node output-node"/>
  <text x="550" y="505" class="text-label">∂ℒ/∂ŷ</text>
  
  <!-- Loss (backward) -->
  <circle cx="700" cy="500" r="18" class="node loss-node"/>
  <text x="700" y="505" class="text-label">∂ℒ/∂ℒ=1</text>
  
  <!-- Backward Pass Arrows -->
  <line x1="650" y1="500" x2="600" y2="500" class="backward-arrow" marker-end="url(#backward-arrow)"/>
  <line x1="500" y1="500" x2="450" y2="500" class="backward-arrow" marker-end="url(#backward-arrow)"/>
  <line x1="350" y1="480" x2="300" y2="480" class="backward-arrow" marker-end="url(#backward-arrow)"/>
  <line x1="200" y1="480" x2="150" y2="480" class="backward-arrow" marker-end="url(#backward-arrow)"/>
  
  <!-- Backward Pass Equations -->
  <text x="175" y="600" class="equation-text">δ¹ = (W²)ᵀδ² ⊙ σ'(z¹)</text>
  <text x="175" y="615" class="equation-text">∂ℒ/∂W¹ = δ¹(x)ᵀ</text>
  
  <text x="325" y="600" class="equation-text">δ² = (W³)ᵀδ³ ⊙ σ'(z²)</text>
  <text x="325" y="615" class="equation-text">∂ℒ/∂W² = δ²(a¹)ᵀ</text>
  
  <text x="475" y="600" class="equation-text">δ³ = ∂ℒ/∂ŷ ⊙ σ'(z³)</text>
  <text x="475" y="615" class="equation-text">∂ℒ/∂W³ = δ³(a²)ᵀ</text>
  
  <!-- Backward Pass Steps -->
  <text x="750" y="420" class="step-text">Backward Pass Steps:</text>
  <text x="750" y="440" class="step-text">1. Compute ∂ℒ/∂ŷ</text>
  <text x="750" y="455" class="step-text">2. Output → Hidden Layer 2</text>
  <text x="750" y="470" class="step-text">3. Hidden Layer 2 → Hidden Layer 1</text>
  <text x="750" y="485" class="step-text">4. Hidden Layer 1 → Input</text>
  <text x="750" y="510" class="step-text">Use stored activations:</text>
  <text x="750" y="525" class="step-text">Reuse a¹, a², z¹, z², z³</text>
  <text x="750" y="540" class="step-text">Compute all ∂ℒ/∂W, ∂ℒ/∂b</text>
  
  <!-- Algorithm Summary -->
  <text x="500" y="680" class="equation-text" style="font-size: 14px; font-weight: bold;">
    Time Complexity: O(W) | Space Complexity: O(N) | Single backward pass computes all gradients
  </text>
</svg>