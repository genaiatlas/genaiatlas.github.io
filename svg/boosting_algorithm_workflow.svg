<svg width="900" height="750" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title-text { font-family: 'Arial', sans-serif; font-size: 18px; font-weight: bold; text-anchor: middle; fill: #34495e; }
      .step-title { font-family: 'Arial', sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; fill: #2c3e50; }
      .formula-text { font-family: 'Arial', sans-serif; font-size: 12px; text-anchor: middle; fill: #2c3e50; }
      .value-text { font-family: 'Arial', sans-serif; font-size: 11px; text-anchor: middle; fill: #2c3e50; }
      .label-text { font-family: 'Arial', sans-serif; font-size: 10px; text-anchor: start; fill: #7f8c8d; }
      .iteration-text { font-family: 'Arial', sans-serif; font-size: 10px; text-anchor: middle; fill: white; }
      .node-text { font-family: 'Arial', sans-serif; font-size: 9px; text-anchor: middle; fill: white; }
    </style>
    
    <!-- Arrow marker -->
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" 
       refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c" />
      </marker>
    </defs>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="750" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="450" y="30" class="title-text">Boosting Algorithm: Sequential Learning from Residuals</text>
  
  <!-- Step 1: Initialization -->
  <rect x="50" y="60" width="180" height="100" fill="#3498db" stroke="#2980b9" stroke-width="2" rx="5"/>
  <text x="140" y="80" class="step-title" fill="white">Step 1: Initialize</text>
  <text x="140" y="100" class="formula-text" fill="white">R₁ = Y₁ - Ȳ</text>
  <text x="140" y="115" class="formula-text" fill="white">R₂ = Y₂ - Ȳ</text>
  <text x="140" y="130" class="formula-text" fill="white">...</text>
  <text x="140" y="145" class="formula-text" fill="white">Rₙ = Yₙ - Ȳ</text>
  
  <!-- Arrow to Iteration 1 -->
  <line x1="250" y1="110" x2="300" y2="110" stroke="#e74c3c" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Iteration 1 -->
  <rect x="320" y="70" width="120" height="80" fill="#e67e22" stroke="#d35400" stroke-width="2" rx="5"/>
  <text x="380" y="90" class="step-title" fill="white">Iteration 1</text>
  
  <!-- Tree 1 -->
  <rect x="335" y="100" width="30" height="15" rx="2" fill="#f39c12" stroke="#e67e22" stroke-width="1"/>
  <text x="350" y="110" class="iteration-text" font-size="8px">ĝ₁</text>
  
  <circle cx="345" cy="125" r="6" fill="#2ecc71" stroke="#27ae60" stroke-width="1"/>
  <text x="345" y="128" class="node-text">-2</text>
  
  <circle cx="365" cy="125" r="6" fill="#2ecc71" stroke="#27ae60" stroke-width="1"/>
  <text x="365" y="128" class="node-text">+3</text>
  
  <line x1="345" y1="115" x2="345" y2="119" stroke="#34495e" stroke-width="1"/>
  <line x1="355" y1="115" x2="365" y2="119" stroke="#34495e" stroke-width="1"/>
  
  <text x="380" y="140" class="formula-text" fill="white" font-size="10px">Fit to residuals</text>
  
  <!-- Update Arrow -->
  <line x1="460" y1="110" x2="510" y2="110" stroke="#e74c3c" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="485" y="100" class="label-text">Update</text>
  <text x="485" y="125" class="label-text">R ← R - λĝ₁</text>
  
  <!-- Iteration 2 -->
  <rect x="530" y="70" width="120" height="80" fill="#9b59b6" stroke="#8e44ad" stroke-width="2" rx="5"/>
  <text x="590" y="90" class="step-title" fill="white">Iteration 2</text>
  
  <!-- Tree 2 -->
  <rect x="545" y="100" width="30" height="15" rx="2" fill="#8e44ad" stroke="#7d3c98" stroke-width="1"/>
  <text x="560" y="110" class="iteration-text" font-size="8px">ĝ₂</text>
  
  <circle cx="555" cy="125" r="6" fill="#2ecc71" stroke="#27ae60" stroke-width="1"/>
  <text x="555" y="128" class="node-text">-1</text>
  
  <circle cx="575" cy="125" r="6" fill="#2ecc71" stroke="#27ae60" stroke-width="1"/>
  <text x="575" y="128" class="node-text">+1</text>
  
  <line x1="555" y1="115" x2="555" y2="119" stroke="#34495e" stroke-width="1"/>
  <line x1="565" y1="115" x2="575" y2="119" stroke="#34495e" stroke-width="1"/>
  
  <text x="590" y="140" class="formula-text" fill="white" font-size="10px">Fit to updated residuals</text>
  
  <!-- Continuation -->
  <text x="720" y="110" class="step-title">... Continue for J iterations</text>
  
  <!-- Detailed Algorithm Steps -->
  <rect x="50" y="180" width="800" height="150" fill="#ffffff" stroke="#bdc3c7" stroke-width="2" rx="10"/>
  <text x="450" y="205" class="step-title">Detailed Boosting Algorithm</text>
  
  <!-- Step boxes -->
  <rect x="70" y="220" width="200" height="100" fill="#ecf0f1" stroke="#95a5a6" stroke-width="1" rx="5"/>
  <text x="170" y="240" class="step-title" font-size="12px">Step 1: Initialize</text>
  <text x="80" y="260" class="value-text">R₀ᵢ = Yᵢ for i = 1,...,n</text>
  <text x="80" y="275" class="value-text">(Start with original outcomes)</text>
  <text x="80" y="295" class="value-text">Set iteration j = 1</text>
  
  <rect x="290" y="220" width="200" height="100" fill="#e8f5e8" stroke="#27ae60" stroke-width="1" rx="5"/>
  <text x="390" y="240" class="step-title" font-size="12px">Step 2: For j = 1,...,J</text>
  <text x="300" y="260" class="value-text">1. Fit ĝⱼ(Z) to (Zᵢ, Rᵢʲ⁻¹)</text>
  <text x="300" y="275" class="value-text">2. Update: Rᵢʲ = Rᵢʲ⁻¹ - λĝⱼ(Zᵢ)</text>
  <text x="300" y="295" class="value-text">3. Increment j</text>
  
  <rect x="510" y="220" width="200" height="100" fill="#ffe8e8" stroke="#e74c3c" stroke-width="1" rx="5"/>
  <text x="610" y="240" class="step-title" font-size="12px">Step 3: Final Model</text>
  <text x="520" y="260" class="value-text">ĝ(Z) = Σⱼ₌₁ᴶ λĝⱼ(Z)</text>
  <text x="520" y="280" class="value-text">(Sum all weak learners)</text>
  
  <rect x="730" y="220" width="110" height="100" fill="#f0f8ff" stroke="#3498db" stroke-width="1" rx="5"/>
  <text x="785" y="240" class="step-title" font-size="12px">Parameters</text>
  <text x="740" y="260" class="value-text">λ: Learning rate</text>
  <text x="740" y="275" class="value-text">J: # iterations</text>
  <text x="740" y="290" class="value-text">Choose via CV</text>
  
  <!-- Visual Example -->
  <rect x="50" y="350" width="800" height="200" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2" rx="10"/>
  <text x="450" y="375" class="step-title">Visual Example: Three Boosting Iterations</text>
  
  <!-- Iteration sequence -->
  <g transform="translate(100, 390)">
    <!-- Original Data -->
    <rect x="0" y="0" width="80" height="60" fill="#ffffff" stroke="#ced6e0" stroke-width="1" rx="3"/>
    <text x="40" y="15" class="value-text" font-size="10px">Original Y</text>
    <text x="40" y="30" class="value-text">[20, 25, 18, 22]</text>
    <text x="40" y="45" class="value-text">Mean: 21.25</text>
    
    <!-- Residuals 0 -->
    <rect x="100" y="0" width="80" height="60" fill="#ffebee" stroke="#f44336" stroke-width="1" rx="3"/>
    <text x="140" y="15" class="value-text" font-size="10px">Residuals R⁰</text>
    <text x="140" y="30" class="value-text">[-1.25, 3.75,</text>
    <text x="140" y="45" class="value-text">-3.25, 0.75]</text>
    
    <!-- Tree 1 -->
    <rect x="200" y="0" width="80" height="60" fill="#e3f2fd" stroke="#2196f3" stroke-width="1" rx="3"/>
    <text x="240" y="15" class="value-text" font-size="10px">Tree ĝ₁</text>
    <text x="240" y="30" class="value-text">[-1, 2, -2, 1]</text>
    <text x="240" y="45" class="value-text">λ = 0.5</text>
    
    <!-- Residuals 1 -->
    <rect x="300" y="0" width="80" height="60" fill="#ffebee" stroke="#f44336" stroke-width="1" rx="3"/>
    <text x="340" y="15" class="value-text" font-size="10px">Residuals R¹</text>
    <text x="340" y="30" class="value-text">[-0.75, 2.75,</text>
    <text x="340" y="45" class="value-text">-2.25, 0.25]</text>
    
    <!-- Tree 2 -->
    <rect x="400" y="0" width="80" height="60" fill="#e8f5e9" stroke="#4caf50" stroke-width="1" rx="3"/>
    <text x="440" y="15" class="value-text" font-size="10px">Tree ĝ₂</text>
    <text x="440" y="30" class="value-text">[-0.5, 1.5,</text>
    <text x="440" y="45" class="value-text">-1.5, 0.5]</text>
    
    <!-- Final Prediction -->
    <rect x="500" y="0" width="80" height="60" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1" rx="3"/>
    <text x="540" y="15" class="value-text" font-size="10px">Final ĝ</text>
    <text x="540" y="30" class="value-text">[20.5, 23.25,</text>
    <text x="540" y="45" class="value-text">19.5, 22.0]</text>
    
    <!-- Arrows -->
    <polygon points="85,30 95,25 95,35" fill="#e74c3c"/>
    <polygon points="185,30 195,25 195,35" fill="#e74c3c"/>
    <polygon points="285,30 295,25 295,35" fill="#e74c3c"/>
    <polygon points="385,30 395,25 395,35" fill="#e74c3c"/>
    <polygon points="485,30 495,25 495,35" fill="#e74c3c"/>
  </g>
  
  <!-- Key Differences Section -->
  <rect x="50" y="570" width="800" height="120" fill="#ffeaa7" stroke="#fdcb6e" stroke-width="2" rx="10"/>
  <text x="450" y="595" class="step-title">Boosting vs Bagging: Key Differences</text>
  
  <!-- Comparison table -->
  <rect x="70" y="610" width="250" height="70" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="3"/>
  <text x="195" y="630" class="step-title" font-size="12px">Boosting</text>
  <text x="80" y="650" class="label-text">• Sequential training</text>
  <text x="80" y="665" class="label-text">• Focus on errors (bias reduction)</text>
  
  <rect x="340" y="610" width="250" height="70" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="3"/>
  <text x="465" y="630" class="step-title" font-size="12px">Bagging (Random Forest)</text>
  <text x="350" y="650" class="label-text">• Parallel training</text>
  <text x="350" y="665" class="label-text">• Variance reduction</text>
  
  <rect x="610" y="610" width="220" height="70" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="3"/>
  <text x="720" y="630" class="step-title" font-size="12px">Shared Properties</text>
  <text x="620" y="650" class="label-text">• Ensemble methods</text>
  <text x="620" y="665" class="label-text">• Combine weak learners</text>
  
  <!-- Mathematical Formula at bottom -->
  <rect x="50" y="710" width="800" height="30" fill="#2c3e50" stroke="#34495e" stroke-width="2" rx="5"/>
  <text x="450" y="730" class="formula-text" fill="white">Final Boosting Model: ĝ_boost(Z) = Σⱼ₌₁ᴶ λĝⱼ(Z)</text>
  
</svg>