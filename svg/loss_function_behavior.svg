<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="perfectGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#66BB6A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="wrongGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F44336;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EF5350;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="uncertainGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF9800;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFB74D;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <dropShadow dx="2" dy="2" stdDeviation="2" flood-color="#00000030"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="700" fill="#fafafa"/>
  
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1a1a1a">Cross-Entropy Loss Behavior Analysis</text>
  
  <!-- Scenario Headers -->
  <g transform="translate(0, 70)">
    <!-- Perfect Prediction Section -->
    <g transform="translate(50, 0)">
      <rect x="0" y="0" width="240" height="250" rx="15" fill="url(#perfectGradient)" filter="url(#shadow)"/>
      
      <!-- Title -->
      <text x="120" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">Perfect Prediction ✅</text>
      
      <!-- Scenario -->
      <rect x="20" y="45" width="200" height="40" rx="5" fill="#ffffff30"/>
      <text x="120" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">True Label: y = 1</text>
      <text x="120" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">Predicted: p = 1.0</text>
      
      <!-- Loss Calculation -->
      <text x="20" y="105" font-family="Arial, sans-serif" font-size="11" fill="white" font-weight="bold">Loss Calculation:</text>
      <text x="20" y="125" font-family="Arial, sans-serif" font-size="10" fill="white">L = -[y × log(p) + (1-y) × log(1-p)]</text>
      <text x="20" y="140" font-family="Arial, sans-serif" font-size="10" fill="white">L = -[1 × log(1.0) + 0 × log(0)]</text>
      <text x="20" y="155" font-family="Arial, sans-serif" font-size="10" fill="white">L = -[1 × 0 + 0 × (-∞)]</text>
      <text x="20" y="170" font-family="Arial, sans-serif" font-size="10" fill="white">L = -[0 + 0] = 0</text>
      
      <!-- Visual representation -->
      <circle cx="120" cy="200" r="25" fill="white" stroke="#4CAF50" stroke-width="4"/>
      <text x="120" y="207" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#4CAF50">0</text>
      <text x="120" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">MINIMUM LOSS</text>
    </g>
    
    <!-- Wrong Prediction Section -->
    <g transform="translate(330, 0)">
      <rect x="0" y="0" width="240" height="250" rx="15" fill="url(#wrongGradient)" filter="url(#shadow)"/>
      
      <!-- Title -->
      <text x="120" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">Wrong Prediction ❌</text>
      
      <!-- Scenario -->
      <rect x="20" y="45" width="200" height="40" rx="5" fill="#ffffff30"/>
      <text x="120" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">True Label: y = 1</text>
      <text x="120" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">Predicted: p = 0.01</text>
      
      <!-- Loss Calculation -->
      <text x="20" y="105" font-family="Arial, sans-serif" font-size="11" fill="white" font-weight="bold">Loss Calculation:</text>
      <text x="20" y="125" font-family="Arial, sans-serif" font-size="10" fill="white">L = -[y × log(p) + (1-y) × log(1-p)]</text>
      <text x="20" y="140" font-family="Arial, sans-serif" font-size="10" fill="white">L = -[1 × log(0.01) + 0 × log(0.99)]</text>
      <text x="20" y="155" font-family="Arial, sans-serif" font-size="10" fill="white">L = -[1 × (-4.6) + 0 × (-0.01)]</text>
      <text x="20" y="170" font-family="Arial, sans-serif" font-size="10" fill="white">L = -[-4.6 + 0] = 4.6</text>
      
      <!-- Visual representation -->
      <circle cx="120" cy="200" r="25" fill="white" stroke="#F44336" stroke-width="4"/>
      <text x="120" y="207" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#F44336">4.6</text>
      <text x="120" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">HIGH LOSS</text>
    </g>
    
    <!-- Uncertain Prediction Section -->
    <g transform="translate(610, 0)">
      <rect x="0" y="0" width="240" height="250" rx="15" fill="url(#uncertainGradient)" filter="url(#shadow)"/>
      
      <!-- Title -->
      <text x="120" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">Uncertain Prediction ⚠️</text>
      
      <!-- Scenario -->
      <rect x="20" y="45" width="200" height="40" rx="5" fill="#ffffff30"/>
      <text x="120" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">True Label: y = 1</text>
      <text x="120" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">Predicted: p = 0.5</text>
      
      <!-- Loss Calculation -->
      <text x="20" y="105" font-family="Arial, sans-serif" font-size="11" fill="white" font-weight="bold">Loss Calculation:</text>
      <text x="20" y="125" font-family="Arial, sans-serif" font-size="10" fill="white">L = -[y × log(p) + (1-y) × log(1-p)]</text>
      <text x="20" y="140" font-family="Arial, sans-serif" font-size="10" fill="white">L = -[1 × log(0.5) + 0 × log(0.5)]</text>
      <text x="20" y="155" font-family="Arial, sans-serif" font-size="10" fill="white">L = -[1 × (-0.69) + 0 × (-0.69)]</text>
      <text x="20" y="170" font-family="Arial, sans-serif" font-size="10" fill="white">L = -[-0.69 + 0] = 0.69</text>
      
      <!-- Visual representation -->
      <circle cx="120" cy="200" r="25" fill="white" stroke="#FF9800" stroke-width="4"/>
      <text x="120" y="207" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FF9800">0.69</text>
      <text x="120" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">MODERATE LOSS</text>
    </g>
  </g>
  
  <!-- Loss Curve Visualization -->
  <g transform="translate(50, 350)">
    <rect x="0" y="0" width="800" height="250" rx="10" fill="white" stroke="#ddd" stroke-width="1"/>
    
    <text x="400" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#333">Loss as Function of Predicted Probability</text>
    
    <!-- Plot area -->
    <g transform="translate(100, 50)">
      <!-- Axes -->
      <line x1="0" y1="160" x2="600" y2="160" stroke="#333" stroke-width="2"/>
      <line x1="0" y1="0" x2="0" y2="160" stroke="#333" stroke-width="2"/>
      
      <!-- Axis labels -->
      <text x="300" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#555">Predicted Probability (p)</text>
      <text x="-40" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#555" transform="rotate(-90, -40, 80)">Loss</text>
      
      <!-- Tick marks -->
      <g font-family="Arial, sans-serif" font-size="10" fill="#666">
        <line x1="120" y1="160" x2="120" y2="165" stroke="#666"/>
        <text x="120" y="178" text-anchor="middle">0.2</text>
        <line x1="240" y1="160" x2="240" y2="165" stroke="#666"/>
        <text x="240" y="178" text-anchor="middle">0.4</text>
        <line x1="360" y1="160" x2="360" y2="165" stroke="#666"/>
        <text x="360" y="178" text-anchor="middle">0.6</text>
        <line x1="480" y1="160" x2="480" y2="165" stroke="#666"/>
        <text x="480" y="178" text-anchor="middle">0.8</text>
        <line x1="600" y1="160" x2="600" y2="165" stroke="#666"/>
        <text x="600" y="178" text-anchor="middle">1.0</text>
        
        <line x1="-5" y1="120" x2="0" y2="120" stroke="#666"/>
        <text x="-10" y="125" text-anchor="end">1</text>
        <line x1="-5" y1="80" x2="0" y2="80" stroke="#666"/>
        <text x="-10" y="85" text-anchor="end">2</text>
        <line x1="-5" y1="40" x2="0" y2="40" stroke="#666"/>
        <text x="-10" y="45" text-anchor="end">3</text>
      </g>
      
      <!-- Loss curve for y=1 case -->
      <path d="M 12 155 Q 60 140 120 110 Q 180 80 240 65 Q 300 55 360 50 Q 420 47 480 45 Q 540 44 588 43" 
            stroke="#2196F3" stroke-width="4" fill="none"/>
      
      <!-- Highlight key points -->
      <circle cx="60" cy="133" r="5" fill="#F44336"/> <!-- p=0.1, high loss -->
      <circle cx="360" cy="90" r="5" fill="#FF9800"/> <!-- p=0.6, moderate loss -->
      <circle cx="588" cy="43" r="5" fill="#4CAF50"/> <!-- p≈1, low loss -->
      
      <!-- Point labels -->
      <text x="60" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#F44336">High</text>
      <text x="360" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#FF9800">Moderate</text>
      <text x="588" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#4CAF50">Low</text>
      
      <!-- Curve label -->
      <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2196F3" font-weight="bold">L = -log(p) for y=1</text>
    </g>
  </g>
  
  <!-- Key Insights -->
  <g transform="translate(50, 620)">
    <rect x="0" y="0" width="800" height="65" rx="8" fill="#e8f5e8" stroke="#4caf50" stroke-width="1"/>
    
    <text x="20" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2e7d32">🎯 Key Insights</text>
    <text x="20" y="40" font-family="Arial, sans-serif" font-size="12" fill="#2e7d32">• <strong>Exponential Penalty:</strong> Loss grows exponentially as predicted probability moves away from true label</text>
    <text x="20" y="55" font-family="Arial, sans-serif" font-size="12" fill="#2e7d32">• <strong>Gradient Magnitude:</strong> Larger errors produce larger gradients, enabling faster correction during training</text>
  </g>
</svg>