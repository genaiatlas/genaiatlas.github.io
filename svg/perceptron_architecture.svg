<svg width="700" height="400" viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="700" height="400" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">Perceptron Architecture</text>
  
  <!-- Input nodes -->
  <circle cx="80" cy="80" r="20" fill="#3498db" stroke="#2c3e50" stroke-width="2"/>
  <text x="80" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">x₁</text>
  <text x="45" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">10</text>
  
  <circle cx="80" cy="140" r="20" fill="#3498db" stroke="#2c3e50" stroke-width="2"/>
  <text x="80" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">x₂</text>
  <text x="45" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">24</text>
  
  <circle cx="80" cy="200" r="20" fill="#3498db" stroke="#2c3e50" stroke-width="2"/>
  <text x="80" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">x₃</text>
  <text x="45" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">15</text>
  
  <text x="80" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#7f8c8d">⋮</text>
  
  <circle cx="80" cy="260" r="20" fill="#3498db" stroke="#2c3e50" stroke-width="2"/>
  <text x="80" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">xₙ</text>
  <text x="45" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">20</text>
  
  <!-- Weights on connections -->
  <line x1="100" y1="80" x2="280" y2="170" stroke="#e74c3c" stroke-width="3"/>
  <text x="160" y="110" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e74c3c">w₁</text>
  
  <line x1="100" y1="140" x2="280" y2="170" stroke="#e74c3c" stroke-width="3"/>
  <text x="170" y="145" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e74c3c">w₂</text>
  
  <line x1="100" y1="200" x2="280" y2="170" stroke="#e74c3c" stroke-width="3"/>
  <text x="170" y="190" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e74c3c">w₃</text>
  
  <line x1="100" y1="260" x2="280" y2="170" stroke="#e74c3c" stroke-width="3"/>
  <text x="170" y="240" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e74c3c">wₙ</text>
  
  <!-- Summation node -->
  <circle cx="300" cy="170" r="30" fill="#f39c12" stroke="#2c3e50" stroke-width="3"/>
  <text x="300" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white">Σ</text>
  
  <!-- Step 1 label -->
  <text x="300" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Step 1:</text>
  <text x="300" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Linear Combination</text>
  
  <!-- Mathematical equation -->
  <text x="300" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">z = Σwᵢxᵢ</text>
  
  <!-- Connection to activation function -->
  <line x1="330" y1="170" x2="430" y2="170" stroke="#2c3e50" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="380" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">z = 15.55</text>
  
  <!-- Activation function (threshold) -->
  <rect x="450" y="140" width="80" height="60" fill="#27ae60" stroke="#2c3e50" stroke-width="2" rx="10"/>
  <text x="490" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">f(z)</text>
  <text x="490" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Threshold</text>
  <text x="490" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">τ = 10</text>
  
  <!-- Step 2 label -->
  <text x="490" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Step 2:</text>
  <text x="490" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Non-linear Activation</text>
  
  <!-- Threshold function definition -->
  <text x="490" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">+1 if z > τ</text>
  <text x="490" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">-1 if z ≤ τ</text>
  
  <!-- Connection to output -->
  <line x1="530" y1="170" x2="580" y2="170" stroke="#2c3e50" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Output -->
  <circle cx="600" cy="170" r="25" fill="#e74c3c" stroke="#2c3e50" stroke-width="2"/>
  <text x="600" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">+1</text>
  
  <!-- Output label -->
  <text x="600" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Output</text>
  <text x="600" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">(Classification)</text>
  
  <!-- Parameter count -->
  <rect x="50" y="320" width="600" height="60" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" rx="5"/>
  <text x="350" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Parameters Required</text>
  <text x="350" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">n weights + 1 threshold = n + 1 parameters</text>
  <text x="350" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">Example: 6 inputs → 7 parameters total</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/>
    </marker>
  </defs>
</svg>