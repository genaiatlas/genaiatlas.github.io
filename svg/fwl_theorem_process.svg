<svg viewBox="0 0 900 750" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="step1Gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="step2Gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="step3Gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0.8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
     refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="750" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1e293b">
    Frisch-Waugh-Lovell (FWL) Theorem: Partialling-Out Process
  </text>
  
  <!-- Initial Setup -->
  <rect x="50" y="70" width="800" height="60" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
  <text x="450" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#334155">
    Initial Problem: Y = β₁D + β₂'W + ε
  </text>
  <text x="450" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">
    Goal: Find β₁ (effect of target variable D on Y, controlling for W)
  </text>
  
  <!-- Step 1: Partial out Y -->
  <rect x="50" y="160" width="250" height="140" rx="8" fill="url(#step1Gradient)" filter="url(#shadow)"/>
  <text x="175" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
    Step 1: Partial out Y
  </text>
  <text x="175" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">
    Regress Y on W only
  </text>
  <text x="175" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="white">
    Y = γ_YW W + residuals
  </text>
  <text x="175" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="white">
    Ỹ = Y - γ_YW W
  </text>
  <text x="175" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
    (Remove W's effect on Y)
  </text>
  
  <!-- Step 2: Partial out D -->
  <rect x="325" y="160" width="250" height="140" rx="8" fill="url(#step2Gradient)" filter="url(#shadow)"/>
  <text x="450" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
    Step 2: Partial out D
  </text>
  <text x="450" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">
    Regress D on W only
  </text>
  <text x="450" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="white">
    D = γ_DW W + residuals
  </text>
  <text x="450" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="white">
    D̃ = D - γ_DW W
  </text>
  <text x="450" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
    (Remove W's effect on D)
  </text>
  
  <!-- Step 3: Final regression -->
  <rect x="600" y="160" width="250" height="140" rx="8" fill="url(#step3Gradient)" filter="url(#shadow)"/>
  <text x="725" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
    Step 3: Final Regression
  </text>
  <text x="725" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">
    Regress Ỹ on D̃
  </text>
  <text x="725" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="white">
    Ỹ = β₁ D̃ + error
  </text>
  <text x="725" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="white">
    β₁ = (E[D̃²])⁻¹ E[D̃Ỹ]
  </text>
  <text x="725" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
    (Pure effect of D on Y)
  </text>
  
  <!-- Arrows between steps -->
  <line x1="300" y1="230" x2="325" y2="230" stroke="#64748b" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line x1="575" y1="230" x2="600" y2="230" stroke="#64748b" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Mathematical Framework -->
  <text x="450" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">
    Mathematical Framework
  </text>
  
  <!-- Partialling-out operation definition -->
  <rect x="100" y="380" width="700" height="80" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1"/>
  <text x="450" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#334155">
    Partialling-out Operation:
  </text>
  <text x="450" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#334155">
    Ṽ = V - γᵥw W,    where γᵥw = arg min E[(V - γ'W)²]
  </text>
  <text x="450" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">
    Creates "residual" by subtracting the part linearly predicted by W
  </text>
  
  <!-- FWL Theorem Statement -->
  <rect x="50" y="480" width="800" height="100" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#92400e">
    FWL Theorem Statement
  </text>
  <text x="450" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#92400e">
    β₁ = arg min E[(Ỹ - b₁ D̃)²] = (E[D̃²])⁻¹ E[D̃Ỹ]
  </text>
  <text x="450" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#92400e">
    The coefficient β₁ from the full regression Y = β₁D + β₂'W + ε is identical to
  </text>
  <text x="450" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#92400e">
    the coefficient from the univariate regression of residualized Y on residualized D
  </text>
  
  <!-- Key Insights -->
  <text x="450" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">
    Key Insights & Applications
  </text>
  
  <!-- Insight boxes -->
  <rect x="50" y="640" width="250" height="80" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="175" y="665" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#047857">
    Conceptual Understanding
  </text>
  <text x="175" y="685" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#047857">
    β₁ measures the pure effect of D
  </text>
  <text x="175" y="700" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#047857">
    after controlling for all W variables
  </text>
  
  <rect x="325" y="640" width="250" height="80" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="450" y="665" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1d4ed8">
    Computational Efficiency
  </text>
  <text x="450" y="685" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1d4ed8">
    Useful when W has many variables
  </text>
  <text x="450" y="700" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1d4ed8">
    (panel data, fixed effects)
  </text>
  
  <rect x="600" y="640" width="250" height="80" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="725" y="665" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">
    Condition Required
  </text>
  <text x="725" y="685" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#dc2626">
    D cannot be perfectly predicted
  </text>
  <text x="725" y="700" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#dc2626">
    by W (i.e., E[D̃²] > 0)
  </text>
</svg>