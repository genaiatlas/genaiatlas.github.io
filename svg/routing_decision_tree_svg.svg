<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <rect width="1000" height="700" fill="#f8f9fa"/>
  <text x="500" y="35" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle">Hybrid Routing Decision Tree</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" fill="#495057"/></marker></defs>
  
  <ellipse cx="500" cy="80" rx="120" ry="35" fill="#fff3bf" stroke="#f59f00" stroke-width="2"/>
  <text x="500" y="88" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">User Query</text>
  
  <line x1="500" y1="115" x2="500" y2="145" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
  
  <rect x="380" y="155" width="240" height="50" rx="8" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
  <text x="500" y="185" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">Apply Logical Rules</text>
  
  <line x1="420" y1="205" x2="250" y2="245" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="320" y="230" font-family="Arial" font-size="9">No match</text>
  
  <line x1="580" y1="205" x2="750" y2="245" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="680" y="230" font-family="Arial" font-size="9">Match found</text>
  
  <rect x="130" y="255" width="240" height="50" rx="8" fill="#d0bfff" stroke="#7950f2" stroke-width="2"/>
  <text x="250" y="285" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">Use Semantic Routing</text>
  
  <rect x="630" y="255" width="240" height="50" rx="8" fill="#d3f9d8" stroke="#37b24d" stroke-width="2"/>
  <text x="750" y="285" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">Check Confidence</text>
  
  <line x1="250" y1="305" x2="250" y2="345" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
  
  <rect x="130" y="355" width="240" height="50" rx="8" fill="#9333ea" stroke="#7950f2" stroke-width="2"/>
  <text x="250" y="385" font-family="Arial" font-size="10" text-anchor="middle" fill="white">Similarity Score</text>
  
  <line x1="210" y1="405" x2="150" y2="445" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="165" y="430" font-family="Arial" font-size="8">&lt;0.6</text>
  
  <line x1="290" y1="405" x2="350" y2="445" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="330" y="430" font-family="Arial" font-size="8">&gt;0.6</text>
  
  <ellipse cx="120" cy="480" rx="90" ry="35" fill="#ffc9c9" stroke="#f03e3e" stroke-width="2"/>
  <text x="120" y="478" font-family="Arial" font-size="9" text-anchor="middle">Multi-Source</text>
  <text x="120" y="492" font-family="Arial" font-size="9" text-anchor="middle">or Default</text>
  
  <ellipse cx="380" cy="480" rx="90" ry="35" fill="#51cf66" stroke="#2f9e44" stroke-width="2"/>
  <text x="380" y="478" font-family="Arial" font-size="9" text-anchor="middle">Route to</text>
  <text x="380" y="492" font-family="Arial" font-size="9" text-anchor="middle">Best Source</text>
  
  <line x1="710" y1="305" x2="650" y2="345" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="665" y="330" font-family="Arial" font-size="8">Low</text>
  
  <line x1="790" y1="305" x2="850" y2="345" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="835" y="330" font-family="Arial" font-size="8">High</text>
  
  <ellipse cx="620" cy="380" rx="90" ry="35" fill="#fff9db" stroke="#fab005" stroke-width="2"/>
  <text x="620" y="378" font-family="Arial" font-size="9" text-anchor="middle">Consider</text>
  <text x="620" y="392" font-family="Arial" font-size="9" text-anchor="middle">Top 2 Sources</text>
  
  <ellipse cx="880" cy="380" rx="90" ry="35" fill="#51cf66" stroke="#2f9e44" stroke-width="2"/>
  <text x="880" y="378" font-family="Arial" font-size="9" text-anchor="middle">Route to</text>
  <text x="880" y="392" font-family="Arial" font-size="9" text-anchor="middle">Single Source</text>
  
  <rect x="50" y="570" width="900" height="110" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
  <text x="500" y="595" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">Decision Logic Summary</text>
  <text x="70" y="620" font-family="Arial" font-size="10">1. Try logical rules first (fast, deterministic)</text>
  <text x="70" y="640" font-family="Arial" font-size="10">2. If no rule matches, use semantic similarity</text>
  <text x="70" y="660" font-family="Arial" font-size="10">3. High confidence (&gt;0.8) → single source | Medium (0.6-0.8) → top 2 | Low (&lt;0.6) → multiple/default</text>
</svg>