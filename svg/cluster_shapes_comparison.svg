<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">Cluster Shapes: When K-Means Assumptions Fail</text>
  
  <!-- Spherical Clusters (K-Means works well) -->
  <g transform="translate(50, 70)">
    <text x="150" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#27ae60">✓ Spherical Clusters</text>
    <text x="150" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#27ae60">K-Means Works Well</text>
    
    <!-- Coordinate system -->
    <g transform="translate(20, 40)">
      <rect x="0" y="0" width="260" height="180" fill="#ffffff" stroke="#ecf0f1" stroke-width="1"/>
      
      <!-- Cluster 1 -->
      <circle cx="80" cy="60" r="25" fill="none" stroke="#3498db" stroke-width="2" stroke-dasharray="3,3"/>
      <circle cx="75" cy="55" r="3" fill="#3498db"/>
      <circle cx="85" cy="65" r="3" fill="#3498db"/>
      <circle cx="70" cy="70" r="3" fill="#3498db"/>
      <circle cx="90" cy="50" r="3" fill="#3498db"/>
      <circle cx="80" cy="45" r="3" fill="#3498db"/>
      <circle cx="85" cy="75" r="3" fill="#3498db"/>
      <text x="80" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#3498db">C1</text>
      
      <!-- Cluster 2 -->
      <circle cx="180" cy="140" r="25" fill="none" stroke="#e74c3c" stroke-width="2" stroke-dasharray="3,3"/>
      <circle cx="175" cy="135" r="3" fill="#e74c3c"/>
      <circle cx="185" cy="145" r="3" fill="#e74c3c"/>
      <circle cx="170" cy="150" r="3" fill="#e74c3c"/>
      <circle cx="190" cy="130" r="3" fill="#e74c3c"/>
      <circle cx="180" cy="125" r="3" fill="#e74c3c"/>
      <circle cx="185" cy="155" r="3" fill="#e74c3c"/>
      <text x="180" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c">C2</text>
      
      <!-- K-Means decision boundary -->
      <line x1="0" y1="100" x2="260" y2="160" stroke="#2c3e50" stroke-width="1" stroke-dasharray="2,2"/>
      <text x="130" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">Decision Boundary</text>
    </g>
    
    <text x="150" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#27ae60">Equal variance, similar sizes</text>
  </g>
  
  <!-- Elongated Clusters -->
  <g transform="translate(350, 70)">
    <text x="150" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f39c12">⚠ Elongated Clusters</text>
    <text x="150" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#f39c12">K-Means Struggles</text>
    
    <!-- Coordinate system -->
    <g transform="translate(20, 40)">
      <rect x="0" y="0" width="260" height="180" fill="#ffffff" stroke="#ecf0f1" stroke-width="1"/>
      
      <!-- Elongated cluster 1 -->
      <ellipse cx="80" cy="60" rx="40" ry="15" fill="none" stroke="#3498db" stroke-width="2" stroke-dasharray="3,3"/>
      <circle cx="65" cy="55" r="3" fill="#3498db"/>
      <circle cx="75" cy="65" r="3" fill="#3498db"/>
      <circle cx="85" cy="55" r="3" fill="#3498db"/>
      <circle cx="95" cy="65" r="3" fill="#3498db"/>
      <circle cx="70" cy="60" r="3" fill="#3498db"/>
      <circle cx="90" cy="60" r="3" fill="#3498db"/>
      
      <!-- Elongated cluster 2 -->
      <ellipse cx="180" cy="140" rx="40" ry="15" fill="none" stroke="#e74c3c" stroke-width="2" stroke-dasharray="3,3"/>
      <circle cx="165" cy="135" r="3" fill="#e74c3c"/>
      <circle cx="175" cy="145" r="3" fill="#e74c3c"/>
      <circle cx="185" cy="135" r="3" fill="#e74c3c"/>
      <circle cx="195" cy="145" r="3" fill="#e74c3c"/>
      <circle cx="170" cy="140" r="3" fill="#e74c3c"/>
      <circle cx="190" cy="140" r="3" fill="#e74c3c"/>
      
      <!-- Poor K-Means boundary -->
      <line x1="0" y1="100" x2="260" y2="160" stroke="#f39c12" stroke-width="2"/>
      <text x="130" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#f39c12">Poor Boundary</text>
    </g>
    
    <text x="150" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#f39c12">Use Gaussian Mixture Models</text>
  </g>
  
  <!-- Concentric Circles -->
  <g transform="translate(50, 330)">
    <text x="150" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e74c3c">✗ Concentric Clusters</text>
    <text x="150" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#e74c3c">K-Means Fails</text>
    
    <!-- Coordinate system -->
    <g transform="translate(20, 40)">
      <rect x="0" y="0" width="260" height="180" fill="#ffffff" stroke="#ecf0f1" stroke-width="1"/>
      
      <!-- Inner circle -->
      <circle cx="130" cy="90" r="25" fill="none" stroke="#3498db" stroke-width="2" stroke-dasharray="3,3"/>
      <circle cx="125" cy="85" r="3" fill="#3498db"/>
      <circle cx="135" cy="95" r="3" fill="#3498db"/>
      <circle cx="120" cy="95" r="3" fill="#3498db"/>
      <circle cx="140" cy="85" r="3" fill="#3498db"/>
      <circle cx="130" cy="75" r="3" fill="#3498db"/>
      <circle cx="130" cy="105" r="3" fill="#3498db"/>
      
      <!-- Outer ring -->
      <circle cx="130" cy="90" r="50" fill="none" stroke="#e74c3c" stroke-width="2" stroke-dasharray="3,3"/>
      <circle cx="95" cy="90" r="3" fill="#e74c3c"/>
      <circle cx="165" cy="90" r="3" fill="#e74c3c"/>
      <circle cx="110" cy="65" r="3" fill="#e74c3c"/>
      <circle cx="150" cy="115" r="3" fill="#e74c3c"/>
      <circle cx="110" cy="115" r="3" fill="#e74c3c"/>
      <circle cx="150" cy="65" r="3" fill="#e74c3c"/>
      
      <!-- K-Means attempts linear boundary -->
      <line x1="130" y1="0" x2="130" y2="180" stroke="#e74c3c" stroke-width="2"/>
      <text x="140" y="15" font-family="Arial, sans-serif" font-size="9" fill="#e74c3c">Linear boundary fails</text>
    </g>
    
    <text x="150" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#e74c3c">Use Spectral Clustering</text>
  </g>
  
  <!-- Irregular Shapes -->
  <g transform="translate(350, 330)">
    <text x="150" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#9b59b6">✗ Irregular Shapes</text>
    <text x="150" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#9b59b6">K-Means Fails</text>
    
    <!-- Coordinate system -->
    <g transform="translate(20, 40)">
      <rect x="0" y="0" width="260" height="180" fill="#ffffff" stroke="#ecf0f1" stroke-width="1"/>
      
      <!-- S-shaped cluster 1 -->
      <path d="M 50 50 Q 80 30 110 50 Q 140 70 170 50" stroke="#3498db" stroke-width="2" fill="none" stroke-dasharray="3,3"/>
      <circle cx="55" cy="50" r="3" fill="#3498db"/>
      <circle cx="75" cy="40" r="3" fill="#3498db"/>
      <circle cx="95" cy="55" r="3" fill="#3498db"/>
      <circle cx="115" cy="45" r="3" fill="#3498db"/>
      <circle cx="135" cy="60" r="3" fill="#3498db"/>
      <circle cx="155" cy="50" r="3" fill="#3498db"/>
      
      <!-- Irregular cluster 2 -->
      <path d="M 70 130 Q 100 110 130 130 Q 160 150 190 130" stroke="#e74c3c" stroke-width="2" fill="none" stroke-dasharray="3,3"/>
      <circle cx="75" cy="130" r="3" fill="#e74c3c"/>
      <circle cx="95" cy="120" r="3" fill="#e74c3c"/>
      <circle cx="115" cy="135" r="3" fill="#e74c3c"/>
      <circle cx="135" cy="125" r="3" fill="#e74c3c"/>
      <circle cx="155" cy="140" r="3" fill="#e74c3c"/>
      <circle cx="175" cy="130" r="3" fill="#e74c3c"/>
      
      <!-- K-Means linear boundary -->
      <line x1="0" y1="90" x2="260" y2="90" stroke="#9b59b6" stroke-width="2"/>
      <text x="130" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#9b59b6">Linear boundary inadequate</text>
    </g>
    
    <text x="150" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#9b59b6">Use DBSCAN or Agglomerative</text>
  </g>
  
  <!-- Algorithm Recommendations -->
  <g transform="translate(50, 550)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#34495e">Alternative Clustering Methods:</text>
    
    <g transform="translate(150, 0)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" fill="#27ae60">• Gaussian Mixture Models (GMM)</text>
      <text x="250" y="0" font-family="Arial, sans-serif" font-size="12" fill="#e67e22">• Spectral Clustering</text>
      <text x="450" y="0" font-family="Arial, sans-serif" font-size="12" fill="#9b59b6">• DBSCAN</text>
    </g>
    
    <g transform="translate(0, 20)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">For varying sizes and covariances</text>
      <text x="250" y="0" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">For non-convex shapes</text>
      <text x="450" y="0" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">For arbitrary shapes + noise</text>
    </g>
  </g>
</svg>