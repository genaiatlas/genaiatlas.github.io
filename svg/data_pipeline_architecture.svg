<svg width="900" height="650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sourceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0.3" />
    </linearGradient>
    <linearGradient id="processGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dbeafe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.3" />
    </linearGradient>
    <linearGradient id="storageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f3e8ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0.3" />
    </linearGradient>
    <linearGradient id="qualityGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fecaca;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:0.3" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="650" fill="#f8fafc"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="900" height="60" fill="url(#headerGrad)"/>
  <text x="450" y="30" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="22" font-weight="bold" dy="0.35em">Data Pipeline Architecture</text>
  
  <!-- Data Sources Section -->
  <text x="50" y="90" fill="#1f2937" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Data Sources</text>
  
  <!-- Source boxes -->
  <rect x="50" y="100" width="120" height="80" fill="url(#sourceGrad)" stroke="#f59e0b" stroke-width="2" rx="8" filter="url(#shadow)"/>
  <text x="110" y="120" text-anchor="middle" fill="#92400e" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Internal DBs</text>
  <text x="110" y="135" text-anchor="middle" fill="#92400e" font-family="Arial, sans-serif" font-size="10">• OLTP Systems</text>
  <text x="110" y="148" text-anchor="middle" fill="#92400e" font-family="Arial, sans-serif" font-size="10">• Data Warehouses</text>
  <text x="110" y="161" text-anchor="middle" fill="#92400e" font-family="Arial, sans-serif" font-size="10">• CRM/ERP</text>
  
  <rect x="190" y="100" width="120" height="80" fill="url(#sourceGrad)" stroke="#f59e0b" stroke-width="2" rx="8" filter="url(#shadow)"/>
  <text x="250" y="120" text-anchor="middle" fill="#92400e" font-family="Arial, sans-serif" font-size="12" font-weight="bold">External APIs</text>
  <text x="250" y="135" text-anchor="middle" fill="#92400e" font-family="Arial, sans-serif" font-size="10">• REST/GraphQL</text>
  <text x="250" y="148" text-anchor="middle" fill="#92400e" font-family="Arial, sans-serif" font-size="10">• Third-party Data</text>
  <text x="250" y="161" text-anchor="middle" fill="#92400e" font-family="Arial, sans-serif" font-size="10">• Public Datasets</text>
  
  <rect x="330" y="100" width="120" height="80" fill="url(#sourceGrad)" stroke="#f59e0b" stroke-width="2" rx="8" filter="url(#shadow)"/>
  <text x="390" y="120" text-anchor="middle" fill="#92400e" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Streaming Data</text>
  <text x="390" y="135" text-anchor="middle" fill="#92400e" font-family="Arial, sans-serif" font-size="10">• Event Streams</text>
  <text x="390" y="148" text-anchor="middle" fill="#92400e" font-family="Arial, sans-serif" font-size="10">• IoT Sensors</text>
  <text x="390" y="161" text-anchor="middle" fill="#92400e" font-family="Arial, sans-serif" font-size="10">• Real-time Feeds</text>
  
  <rect x="470" y="100" width="120" height="80" fill="url(#sourceGrad)" stroke="#f59e0b" stroke-width="2" rx="8" filter="url(#shadow)"/>
  <text x="530" y="120" text-anchor="middle" fill="#92400e" font-family="Arial, sans-serif" font-size="12" font-weight="bold">File Systems</text>
  <text x="530" y="135" text-anchor="middle" fill="#92400e" font-family="Arial, sans-serif" font-size="10">• CSV/JSON/XML</text>
  <text x="530" y="148" text-anchor="middle" fill="#92400e" font-family="Arial, sans-serif" font-size="10">• Images/Videos</text>
  <text x="530" y="161" text-anchor="middle" fill="#92400e" font-family="Arial, sans-serif" font-size="10">• Documents</text>
  
  <!-- Ingestion Layer -->
  <text x="50" y="220" fill="#1f2937" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Data Ingestion &amp; Collection</text>
  
  <rect x="50" y="230" width="540" height="60" fill="url(#processGrad)" stroke="#3b82f6" stroke-width="2" rx="8" filter="url(#shadow)"/>
  <text x="320" y="250" text-anchor="middle" fill="#1e40af" font-family="Arial, sans-serif" font-size="14" font-weight="bold">ETL/ELT Processes</text>
  <text x="150" y="270" text-anchor="middle" fill="#1e40af" font-family="Arial, sans-serif" font-size="11">Batch Processing</text>
  <text x="270" y="270" text-anchor="middle" fill="#1e40af" font-family="Arial, sans-serif" font-size="11">Stream Processing</text>
  <text x="390" y="270" text-anchor="middle" fill="#1e40af" font-family="Arial, sans-serif" font-size="11">Data Validation</text>
  <text x="490" y="270" text-anchor="middle" fill="#1e40af" font-family="Arial, sans-serif" font-size="11">Schema Evolution</text>
  
  <!-- Data Quality Assessment -->
  <rect x="620" y="100" width="220" height="190" fill="url(#qualityGrad)" stroke="#ef4444" stroke-width="2" rx="8" filter="url(#shadow)"/>
  <text x="730" y="120" text-anchor="middle" fill="#b91c1c" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Data Quality Assessment</text>
  
  <!-- Quality metrics -->
  <text x="640" y="145" fill="#b91c1c" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Completeness:</text>
  <text x="640" y="158" fill="#b91c1c" font-family="Arial, sans-serif" font-size="10">Missing values analysis</text>
  
  <text x="640" y="175" fill="#b91c1c" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Accuracy:</text>
  <text x="640" y="188" fill="#b91c1c" font-family="Arial, sans-serif" font-size="10">Outlier detection</text>
  
  <text x="640" y="205" fill="#b91c1c" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Consistency:</text>
  <text x="640" y="218" fill="#b91c1c" font-family="Arial, sans-serif" font-size="10">Format validation</text>
  
  <text x="640" y="235" fill="#b91c1c" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Timeliness:</text>
  <text x="640" y="248" fill="#b91c1c" font-family="Arial, sans-serif" font-size="10">Data freshness check</text>
  
  <text x="730" y="270" text-anchor="middle" fill="#b91c1c" font-family="Arial, sans-serif" font-size="10" font-style="italic">Quality Score = Sum(w × Metric)</text>
  
  <!-- Processing & Transformation -->
  <text x="50" y="320" fill="#1f2937" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Data Processing &amp; Transformation</text>
  
  <rect x="50" y="330" width="160" height="100" fill="url(#processGrad)" stroke="#3b82f6" stroke-width="2" rx="8" filter="url(#shadow)"/>
  <text x="130" y="350" text-anchor="middle" fill="#1e40af" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Data Cleaning</text>
  <text x="130" y="365" text-anchor="middle" fill="#1e40af" font-family="Arial, sans-serif" font-size="10">• Missing value imputation</text>
  <text x="130" y="378" text-anchor="middle" fill="#1e40af" font-family="Arial, sans-serif" font-size="10">• Outlier treatment</text>
  <text x="130" y="391" text-anchor="middle" fill="#1e40af" font-family="Arial, sans-serif" font-size="10">• Duplicate removal</text>
  <text x="130" y="404" text-anchor="middle" fill="#1e40af" font-family="Arial, sans-serif" font-size="10">• Format standardization</text>
  <text x="130" y="417" text-anchor="middle" fill="#1e40af" font-family="Arial, sans-serif" font-size="10">• Data type conversion</text>
  
  <rect x="230" y="330" width="160" height="100" fill="url(#processGrad)" stroke="#3b82f6" stroke-width="2" rx="8" filter="url(#shadow)"/>
  <text x="310" y="350" text-anchor="middle" fill="#1e40af" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Feature Engineering</text>
  <text x="310" y="365" text-anchor="middle" fill="#1e40af" font-family="Arial, sans-serif" font-size="10">• Normalization/Scaling</text>
  <text x="310" y="378" text-anchor="middle" fill="#1e40af" font-family="Arial, sans-serif" font-size="10">• Encoding categorical</text>
  <text x="310" y="391" text-anchor="middle" fill="#1e40af" font-family="Arial, sans-serif" font-size="10">• Feature creation</text>
  <text x="310" y="404" text-anchor="middle" fill="#1e40af" font-family="Arial, sans-serif" font-size="10">• Dimensionality reduction</text>
  <text x="310" y="417" text-anchor="middle" fill="#1e40af" font-family="Arial, sans-serif" font-size="10">• Time series features</text>
  
  <rect x="410" y="330" width="160" height="100" fill="url(#processGrad)" stroke="#3b82f6" stroke-width="2" rx="8" filter="url(#shadow)"/>
  <text x="490" y="350" text-anchor="middle" fill="#1e40af" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Data Integration</text>
  <text x="490" y="365" text-anchor="middle" fill="#1e40af" font-family="Arial, sans-serif" font-size="10">• Schema mapping</text>
  <text x="490" y="378" text-anchor="middle" fill="#1e40af" font-family="Arial, sans-serif" font-size="10">• Entity resolution</text>
  <text x="490" y="391" text-anchor="middle" fill="#1e40af" font-family="Arial, sans-serif" font-size="10">• Data joining</text>
  <text x="490" y="404" text-anchor="middle" fill="#1e40af" font-family="Arial, sans-serif" font-size="10">• Conflict resolution</text>
  <text x="490" y="417" text-anchor="middle" fill="#1e40af" font-family="Arial, sans-serif" font-size="10">• Lineage tracking</text>
  
  <rect x="590" y="330" width="160" height="100" fill="url(#processGrad)" stroke="#3b82f6" stroke-width="2" rx="8" filter="url(#shadow)"/>
  <text x="670" y="350" text-anchor="middle" fill="#1e40af" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Quality Control</text>
  <text x="670" y="365" text-anchor="middle" fill="#1e40af" font-family="Arial, sans-serif" font-size="10">• Statistical profiling</text>
  <text x="670" y="378" text-anchor="middle" fill="#1e40af" font-family="Arial, sans-serif" font-size="10">• Business rule validation</text>
  <text x="670" y="391" text-anchor="middle" fill="#1e40af" font-family="Arial, sans-serif" font-size="10">• Automated testing</text>
  <text x="670" y="404" text-anchor="middle" fill="#1e40af" font-family="Arial, sans-serif" font-size="10">• Exception handling</text>
  <text x="670" y="417" text-anchor="middle" fill="#1e40af" font-family="Arial, sans-serif" font-size="10">• Alert generation</text>
  
  <!-- Storage & Access -->
  <text x="50" y="470" fill="#1f2937" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Storage &amp; Access Layer</text>
  
  <rect x="50" y="480" width="180" height="90" fill="url(#storageGrad)" stroke="#8b5cf6" stroke-width="2" rx="8" filter="url(#shadow)"/>
  <text x="140" y="500" text-anchor="middle" fill="#6b21a8" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Data Lake</text>
  <text x="140" y="515" text-anchor="middle" fill="#6b21a8" font-family="Arial, sans-serif" font-size="10">• Raw data storage</text>
  <text x="140" y="528" text-anchor="middle" fill="#6b21a8" font-family="Arial, sans-serif" font-size="10">• Schema-on-read</text>
  <text x="140" y="541" text-anchor="middle" fill="#6b21a8" font-family="Arial, sans-serif" font-size="10">• Scalable architecture</text>
  <text x="140" y="554" text-anchor="middle" fill="#6b21a8" font-family="Arial, sans-serif" font-size="10">• Multi-format support</text>
  
  <rect x="250" y="480" width="180" height="90" fill="url(#storageGrad)" stroke="#8b5cf6" stroke-width="2" rx="8" filter="url(#shadow)"/>
  <text x="340" y="500" text-anchor="middle" fill="#6b21a8" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Data Warehouse</text>
  <text x="340" y="515" text-anchor="middle" fill="#6b21a8" font-family="Arial, sans-serif" font-size="10">• Structured storage</text>
  <text x="340" y="528" text-anchor="middle" fill="#6b21a8" font-family="Arial, sans-serif" font-size="10">• OLAP optimization</text>
  <text x="340" y="541" text-anchor="middle" fill="#6b21a8" font-family="Arial, sans-serif" font-size="10">• Star/Snowflake schema</text>
  <text x="340" y="554" text-anchor="middle" fill="#6b21a8" font-family="Arial, sans-serif" font-size="10">• Query performance</text>
  
  <rect x="450" y="480" width="180" height="90" fill="url(#storageGrad)" stroke="#8b5cf6" stroke-width="2" rx="8" filter="url(#shadow)"/>
  <text x="540" y="500" text-anchor="middle" fill="#6b21a8" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Feature Store</text>
  <text x="540" y="515" text-anchor="middle" fill="#6b21a8" font-family="Arial, sans-serif" font-size="10">• ML-ready features</text>
  <text x="540" y="528" text-anchor="middle" fill="#6b21a8" font-family="Arial, sans-serif" font-size="10">• Version control</text>
  <text x="540" y="541" text-anchor="middle" fill="#6b21a8" font-family="Arial, sans-serif" font-size="10">• Metadata management</text>
  <text x="540" y="554" text-anchor="middle" fill="#6b21a8" font-family="Arial, sans-serif" font-size="10">• Real-time serving</text>
  
  <rect x="650" y="480" width="180" height="90" fill="url(#storageGrad)" stroke="#8b5cf6" stroke-width="2" rx="8" filter="url(#shadow)"/>
  <text x="740" y="500" text-anchor="middle" fill="#6b21a8" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Data Catalog</text>
  <text x="740" y="515" text-anchor="middle" fill="#6b21a8" font-family="Arial, sans-serif" font-size="10">• Metadata repository</text>
  <text x="740" y="528" text-anchor="middle" fill="#6b21a8" font-family="Arial, sans-serif" font-size="10">• Data discovery</text>
  <text x="740" y="541" text-anchor="middle" fill="#6b21a8" font-family="Arial, sans-serif" font-size="10">• Lineage tracking</text>
  <text x="740" y="554" text-anchor="middle" fill="#6b21a8" font-family="Arial, sans-serif" font-size="10">• Access control</text>
  
  <!-- Flow Arrows -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#374151"/>
    </marker>
  </defs>
  
  <!-- Vertical flow arrows -->
  <path d="M 110 180 L 110 220" stroke="#374151" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 250 180 L 250 220" stroke="#374151" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 390 180 L 390 220" stroke="#374151" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 530 180 L 530 220" stroke="#374151" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <path d="M 320 290 L 320 320" stroke="#374151" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 420 430 L 420 470" stroke="#374151" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Horizontal arrows to quality assessment -->
  <path d="M 590 200 L 620 200" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Footer -->
  <text x="450" y="620" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="11" font-style="italic">End-to-end data pipeline ensuring quality, scalability, and accessibility</text>
</svg>