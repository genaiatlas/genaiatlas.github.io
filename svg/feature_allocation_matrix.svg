<svg viewBox="0 0 900 650" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="900" height="650" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">Feature Allocation Matrix Representation</text>
  
  <!-- Clustering Matrix Section -->
  <rect x="50" y="60" width="380" height="250" fill="#ffe6e6" stroke="#e74c3c" stroke-width="2" rx="5"/>
  <text x="240" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#c0392b">Traditional Clustering Matrix</text>
  <text x="240" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#e74c3c">Each row sums to 1 (exclusive membership)</text>
  
  <!-- Clustering matrix visualization -->
  <g transform="translate(80, 120)">
    <!-- Matrix headers -->
    <text x="20" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">Images</text>
    <text x="90" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">CAT</text>
    <text x="140" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">DOG</text>
    <text x="190" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">LIZARD</text>
    <text x="250" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">Sum</text>
    
    <!-- Matrix grid -->
    <rect x="60" y="45" width="210" height="120" fill="white" stroke="#bdc3c7" stroke-width="1"/>
    
    <!-- Vertical lines -->
    <line x1="110" y1="45" x2="110" y2="165" stroke="#bdc3c7" stroke-width="1"/>
    <line x1="160" y1="45" x2="160" y2="165" stroke="#bdc3c7" stroke-width="1"/>
    <line x1="210" y1="45" x2="210" y2="165" stroke="#bdc3c7" stroke-width="1"/>
    
    <!-- Horizontal lines -->
    <line x1="60" y1="65" x2="270" y2="65" stroke="#bdc3c7" stroke-width="1"/>
    <line x1="60" y1="85" x2="270" y2="85" stroke="#bdc3c7" stroke-width="1"/>
    <line x1="60" y1="105" x2="270" y2="105" stroke="#bdc3c7" stroke-width="1"/>
    <line x1="60" y1="125" x2="270" y2="125" stroke="#bdc3c7" stroke-width="1"/>
    <line x1="60" y1="145" x2="270" y2="145" stroke="#bdc3c7" stroke-width="1"/>
    
    <!-- Row labels -->
    <text x="35" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Img1</text>
    <text x="35" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Img2</text>
    <text x="35" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Img3</text>
    <text x="35" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Img4</text>
    <text x="35" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Img5</text>
    <text x="35" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Img6</text>
    
    <!-- Matrix values -->
    <g font-family="Arial, sans-serif" font-size="12" font-weight="bold">
      <!-- Row 1: Cat image -->
      <text x="85" y="60" text-anchor="middle" fill="#e74c3c">1</text>
      <text x="135" y="60" text-anchor="middle" fill="#3498db">0</text>
      <text x="185" y="60" text-anchor="middle" fill="#3498db">0</text>
      <text x="240" y="60" text-anchor="middle" fill="#27ae60">1</text>
      
      <!-- Row 2: Cat image -->
      <text x="85" y="80" text-anchor="middle" fill="#e74c3c">1</text>
      <text x="135" y="80" text-anchor="middle" fill="#3498db">0</text>
      <text x="185" y="80" text-anchor="middle" fill="#3498db">0</text>
      <text x="240" y="80" text-anchor="middle" fill="#27ae60">1</text>
      
      <!-- Row 3: Dog image -->
      <text x="85" y="100" text-anchor="middle" fill="#3498db">0</text>
      <text x="135" y="100" text-anchor="middle" fill="#e74c3c">1</text>
      <text x="185" y="100" text-anchor="middle" fill="#3498db">0</text>
      <text x="240" y="100" text-anchor="middle" fill="#27ae60">1</text>
      
      <!-- Row 4: Lizard image -->
      <text x="85" y="120" text-anchor="middle" fill="#3498db">0</text>
      <text x="135" y="120" text-anchor="middle" fill="#3498db">0</text>
      <text x="185" y="120" text-anchor="middle" fill="#e74c3c">1</text>
      <text x="240" y="120" text-anchor="middle" fill="#27ae60">1</text>
      
      <!-- Row 5: Dog image -->
      <text x="85" y="140" text-anchor="middle" fill="#3498db">0</text>
      <text x="135" y="140" text-anchor="middle" fill="#e74c3c">1</text>
      <text x="185" y="140" text-anchor="middle" fill="#3498db">0</text>
      <text x="240" y="140" text-anchor="middle" fill="#27ae60">1</text>
      
      <!-- Row 6: Problem case - forced into one cluster -->
      <rect x="60" y="150" width="150" height="15" fill="#ffebee"/>
      <text x="85" y="160" text-anchor="middle" fill="#e74c3c">1</text>
      <text x="135" y="160" text-anchor="middle" fill="#3498db">0</text>
      <text x="185" y="160" text-anchor="middle" fill="#3498db">0</text>
      <text x="240" y="160" text-anchor="middle" fill="#27ae60">1</text>
    </g>
    
    <!-- Problem annotation -->
    <text x="300" y="160" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c">← Cat+Dog forced into CAT</text>
  </g>
  
  <!-- Constraint equation -->
  <text x="240" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#c0392b">Constraint: Σₖ zᵢₖ = 1 ∀i</text>
  <text x="240" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">Every row must sum to exactly 1</text>
  
  <!-- Feature Allocation Matrix Section -->
  <rect x="470" y="60" width="380" height="250" fill="#e6f7ff" stroke="#3498db" stroke-width="2" rx="5"/>
  <text x="660" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2980b9">Feature Allocation Matrix</text>
  <text x="660" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#3498db">Flexible membership (rows can sum to any value)</text>
  
  <!-- Feature allocation matrix visualization -->
  <g transform="translate(500, 120)">
    <!-- Matrix headers -->
    <text x="20" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">Images</text>
    <text x="90" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">CAT</text>
    <text x="140" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">DOG</text>
    <text x="190" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">LIZARD</text>
    <text x="250" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">Sum</text>
    
    <!-- Matrix grid -->
    <rect x="60" y="45" width="210" height="140" fill="white" stroke="#bdc3c7" stroke-width="1"/>
    
    <!-- Vertical lines -->
    <line x1="110" y1="45" x2="110" y2="185" stroke="#bdc3c7" stroke-width="1"/>
    <line x1="160" y1="45" x2="160" y2="185" stroke="#bdc3c7" stroke-width="1"/>
    <line x1="210" y1="45" x2="210" y2="185" stroke="#bdc3c7" stroke-width="1"/>
    
    <!-- Horizontal lines -->
    <line x1="60" y1="65" x2="270" y2="65" stroke="#bdc3c7" stroke-width="1"/>
    <line x1="60" y1="85" x2="270" y2="85" stroke="#bdc3c7" stroke-width="1"/>
    <line x1="60" y1="105" x2="270" y2="105" stroke="#bdc3c7" stroke-width="1"/>
    <line x1="60" y1="125" x2="270" y2="125" stroke="#bdc3c7" stroke-width="1"/>
    <line x1="60" y1="145" x2="270" y2="145" stroke="#bdc3c7" stroke-width="1"/>
    <line x1="60" y1="165" x2="270" y2="165" stroke="#bdc3c7" stroke-width="1"/>
    
    <!-- Row labels -->
    <text x="35" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Img1</text>
    <text x="35" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Img2</text>
    <text x="35" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Img3</text>
    <text x="35" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Img4</text>
    <text x="35" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Img5</text>
    <text x="35" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Img6</text>
    <text x="35" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Img7</text>
    
    <!-- Matrix values -->
    <g font-family="Arial, sans-serif" font-size="12" font-weight="bold">
      <!-- Row 1: Cat only -->
      <text x="85" y="60" text-anchor="middle" fill="#e74c3c">1</text>
      <text x="135" y="60" text-anchor="middle" fill="#3498db">0</text>
      <text x="185" y="60" text-anchor="middle" fill="#3498db">0</text>
      <text x="240" y="60" text-anchor="middle" fill="#27ae60">1</text>
      
      <!-- Row 2: Cat + Dog -->
      <rect x="60" y="70" width="150" height="15" fill="#e8f5e8"/>
      <text x="85" y="80" text-anchor="middle" fill="#e74c3c">1</text>
      <text x="135" y="80" text-anchor="middle" fill="#e74c3c">1</text>
      <text x="185" y="80" text-anchor="middle" fill="#3498db">0</text>
      <text x="240" y="80" text-anchor="middle" fill="#f39c12">2</text>
      
      <!-- Row 3: Dog only -->
      <text x="85" y="100" text-anchor="middle" fill="#3498db">0</text>
      <text x="135" y="100" text-anchor="middle" fill="#e74c3c">1</text>
      <text x="185" y="100" text-anchor="middle" fill="#3498db">0</text>
      <text x="240" y="100" text-anchor="middle" fill="#27ae60">1</text>
      
      <!-- Row 4: Lizard only -->
      <text x="85" y="120" text-anchor="middle" fill="#3498db">0</text>
      <text x="135" y="120" text-anchor="middle" fill="#3498db">0</text>
      <text x="185" y="120" text-anchor="middle" fill="#e74c3c">1</text>
      <text x="240" y="120" text-anchor="middle" fill="#27ae60">1</text>
      
      <!-- Row 5: Cat + Lizard -->
      <rect x="60" y="130" width="150" height="15" fill="#e8f5e8"/>
      <text x="85" y="140" text-anchor="middle" fill="#e74c3c">1</text>
      <text x="135" y="140" text-anchor="middle" fill="#3498db">0</text>
      <text x="185" y="140" text-anchor="middle" fill="#e74c3c">1</text>
      <text x="240" y="140" text-anchor="middle" fill="#f39c12">2</text>
      
      <!-- Row 6: All three -->
      <rect x="60" y="150" width="150" height="15" fill="#fff3cd"/>
      <text x="85" y="160" text-anchor="middle" fill="#e74c3c">1</text>
      <text x="135" y="160" text-anchor="middle" fill="#e74c3c">1</text>
      <text x="185" y="160" text-anchor="middle" fill="#e74c3c">1</text>
      <text x="240" y="160" text-anchor="middle" fill="#d68910">3</text>
      
      <!-- Row 7: No animals -->
      <rect x="60" y="170" width="150" height="15" fill="#f8f9fa"/>
      <text x="85" y="180" text-anchor="middle" fill="#3498db">0</text>
      <text x="135" y="180" text-anchor="middle" fill="#3498db">0</text>
      <text x="185" y="180" text-anchor="middle" fill="#3498db">0</text>
      <text x="240" y="180" text-anchor="middle" fill="#95a5a6">0</text>
    </g>
    
    <!-- Annotations -->
    <text x="700" y="80" font-family="Arial, sans-serif" font-size="9" fill="#27ae60">← Multiple features</text>
    <text x="700" y="120" font-family="Arial, sans-serif" font-size="9" fill="#27ae60">← Multiple features</text>
    <text x="700" y="140" font-family="Arial, sans-serif" font-size="9" fill="#f39c12">← All features</text>
    <text x="700" y="160" font-family="Arial, sans-serif" font-size="9" fill="#95a5a6">← No features</text>
  </g>
  
  <!-- Constraint equation -->
  <text x="660" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2980b9">Constraint: zᵢₖ ∈ {0,1}</text>
  <text x="660" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">No constraint on row sums - natural flexibility</text>
  
  <!-- Mathematical Formulation -->
  <rect x="50" y="340" width="800" height="120" fill="#f5f5f5" stroke="#95a5a6" stroke-width="2" rx="5"/>
  <text x="450" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Mathematical Formulation</text>
  
  <!-- Clustering formulation -->
  <g transform="translate(80, 380)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e74c3c">Traditional Clustering:</text>
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Z ∈ {0,1}ᴺˣᴷ subject to Σₖ zᵢₖ = 1 ∀i</text>
    <text x="0" y="35" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">Each data point belongs to exactly one cluster</text>
    <text x="0" y="50" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">N = number of data points, K = number of clusters</text>
  </g>
  
  <!-- Feature allocation formulation -->
  <g transform="translate(480, 380)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#3498db">Feature Allocation:</text>
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Z ∈ {0,1}ᴺˣᴷ with no row sum constraint</text>
    <text x="0" y="35" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">Data points can have multiple features</text>
    <text x="0" y="50" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">N = number of data points, K = number of features</text>
  </g>
  
  <!-- Real-world Applications -->
  <rect x="50" y="490" width="800" height="130" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2" rx="5"/>
  <text x="450" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Real-World Applications</text>
  
  <g font-family="Arial, sans-serif" font-size="12">
    <!-- Document modeling -->
    <text x="80" y="540" font-weight="bold" fill="#e74c3c">Document Topic Modeling:</text>
    <text x="80" y="555" fill="#2c3e50">• Movie review: [Arts=1, Sports=1, Economics=1]</text>
    <text x="80" y="570" fill="#2c3e50">• Academic paper: [AI=1, Statistics=1, Medicine=1]</text>
    
    <!-- Genomics -->
    <text x="480" y="540" font-weight="bold" fill="#3498db">Genomics Research:</text>
    <text x="480" y="555" fill="#2c3e50">• Individual DNA: [European=1, African=1, Asian=0]</text>
    <text x="480" y="570" fill="#2c3e50">• Population admixture analysis</text>
    
    <!-- Social networks -->
    <text x="80" y="590" font-weight="bold" fill="#27ae60">Social Network Analysis:</text>
    <text x="80" y="605" fill="#2c3e50">• User identities: [Work=1, Family=1, Hobby=1]</text>
    
    <!-- Medical -->
    <text x="480" y="590" font-weight="bold" fill="#9b59b6">Medical Diagnosis:</text>
    <text x="480" y="605" fill="#2c3e50">• Patient conditions: [Diabetes=1, Hypertension=1]</text>
  </g>
</svg>