<svg width="800" height="700" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="700" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    Data Visualization Types & Use Cases
  </text>
  
  <!-- Comparison Section -->
  <rect x="50" y="60" width="150" height="180" fill="#3498db" stroke="#2980b9" stroke-width="2" rx="10"/>
  <text x="125" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    Comparison
  </text>
  
  <!-- Bar Chart -->
  <rect x="70" y="100" width="110" height="60" fill="#2980b9" stroke="#21618c" stroke-width="1" rx="5"/>
  <text x="125" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">
    Bar Chart
  </text>
  <!-- Mini bar chart visualization -->
  <rect x="80" y="125" width="8" height="20" fill="white"/>
  <rect x="95" y="130" width="8" height="15" fill="white"/>
  <rect x="110" y="120" width="8" height="25" fill="white"/>
  <rect x="125" y="135" width="8" height="10" fill="white"/>
  <rect x="140" y="128" width="8" height="17" fill="white"/>
  <rect x="155" y="122" width="8" height="23" fill="white"/>
  
  <!-- Column Chart -->
  <rect x="70" y="170" width="110" height="60" fill="#2980b9" stroke="#21618c" stroke-width="1" rx="5"/>
  <text x="125" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">
    Column Chart
  </text>
  <!-- Mini column chart -->
  <rect x="85" y="195" width="12" height="25" fill="white"/>
  <rect x="105" y="200" width="12" height="20" fill="white"/>
  <rect x="125" y="190" width="12" height="30" fill="white"/>
  <rect x="145" y="205" width="12" height="15" fill="white"/>
  
  <!-- Distribution Section -->
  <rect x="220" y="60" width="150" height="180" fill="#e74c3c" stroke="#c0392b" stroke-width="2" rx="10"/>
  <text x="295" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    Distribution
  </text>
  
  <!-- Histogram -->
  <rect x="240" y="100" width="110" height="60" fill="#c0392b" stroke="#a93226" stroke-width="1" rx="5"/>
  <text x="295" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">
    Histogram
  </text>
  <!-- Mini histogram -->
  <rect x="250" y="125" width="10" height="15" fill="white"/>
  <rect x="265" y="120" width="10" height="20" fill="white"/>
  <rect x="280" y="115" width="10" height="25" fill="white"/>
  <rect x="295" y="118" width="10" height="22" fill="white"/>
  <rect x="310" y="125" width="10" height="15" fill="white"/>
  <rect x="325" y="130" width="10" height="10" fill="white"/>
  
  <!-- Box Plot -->
  <rect x="240" y="170" width="110" height="60" fill="#c0392b" stroke="#a93226" stroke-width="1" rx="5"/>
  <text x="295" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">
    Box Plot
  </text>
  <!-- Mini box plot -->
  <rect x="275" y="195" width="40" height="15" fill="none" stroke="white" stroke-width="2"/>
  <line x1="285" y1="195" x2="285" y2="210" stroke="white" stroke-width="2"/>
  <line x1="305" y1="195" x2="305" y2="210" stroke="white" stroke-width="2"/>
  <line x1="295" y1="195" x2="295" y2="210" stroke="white" stroke-width="3"/>
  <line x1="265" y1="202" x2="275" y2="202" stroke="white" stroke-width="1"/>
  <line x1="315" y1="202" x2="325" y2="202" stroke="white" stroke-width="1"/>
  
  <!-- Relationship Section -->
  <rect x="390" y="60" width="150" height="180" fill="#27ae60" stroke="#229954" stroke-width="2" rx="10"/>
  <text x="465" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    Relationship
  </text>
  
  <!-- Scatter Plot -->
  <rect x="410" y="100" width="110" height="60" fill="#229954" stroke="#1e8449" stroke-width="1" rx="5"/>
  <text x="465" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">
    Scatter Plot
  </text>
  <!-- Mini scatter plot -->
  <circle cx="430" cy="135" r="2" fill="white"/>
  <circle cx="445" cy="130" r="2" fill="white"/>
  <circle cx="460" cy="140" r="2" fill="white"/>
  <circle cx="475" cy="125" r="2" fill="white"/>
  <circle cx="490" cy="145" r="2" fill="white"/>
  <circle cx="435" cy="150" r="2" fill="white"/>
  <circle cx="470" cy="155" r="2" fill="white"/>
  <circle cx="485" cy="135" r="2" fill="white"/>
  
  <!-- Correlation Matrix -->
  <rect x="410" y="170" width="110" height="60" fill="#229954" stroke="#1e8449" stroke-width="1" rx="5"/>
  <text x="465" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">
    Correlation Matrix
  </text>
  <!-- Mini correlation matrix -->
  <rect x="430" y="195" width="15" height="15" fill="#ff4757"/>
  <rect x="450" y="195" width="15" height="15" fill="#ffa502"/>
  <rect x="470" y="195" width="15" height="15" fill="#2ed573"/>
  <rect x="430" y="215" width="15" height="15" fill="#ffa502"/>
  <rect x="450" y="215" width="15" height="15" fill="#ff4757"/>
  <rect x="470" y="215" width="15" height="15" fill="#70a1ff"/>
  
  <!-- Time Series Section -->
  <rect x="560" y="60" width="150" height="180" fill="#9b59b6" stroke="#8e44ad" stroke-width="2" rx="10"/>
  <text x="635" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    Time Series
  </text>
  
  <!-- Line Chart -->
  <rect x="580" y="100" width="110" height="60" fill="#8e44ad" stroke="#7d3c98" stroke-width="1" rx="5"/>
  <text x="635" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">
    Line Chart
  </text>
  <!-- Mini line chart -->
  <path d="M 590 140 L 605 135 L 620 145 L 635 130 L 650 150 L 665 125 L 680 140" 
        fill="none" stroke="white" stroke-width="2"/>
  <circle cx="590" cy="140" r="2" fill="white"/>
  <circle cx="605" cy="135" r="2" fill="white"/>
  <circle cx="620" cy="145" r="2" fill="white"/>
  <circle cx="635" cy="130" r="2" fill="white"/>
  <circle cx="650" cy="150" r="2" fill="white"/>
  <circle cx="665" cy="125" r="2" fill="white"/>
  <circle cx="680" cy="140" r="2" fill="white"/>
  
  <!-- Area Chart -->
  <rect x="580" y="170" width="110" height="60" fill="#8e44ad" stroke="#7d3c98" stroke-width="1" rx="5"/>
  <text x="635" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">
    Area Chart
  </text>
  <!-- Mini area chart -->
  <path d="M 590 220 L 605 200 L 620 210 L 635 195 L 650 215 L 665 190 L 680 205 L 680 220 Z" 
        fill="white" fill-opacity="0.7"/>
  <path d="M 590 220 L 605 200 L 620 210 L 635 195 L 650 215 L 665 190 L 680 205" 
        fill="none" stroke="white" stroke-width="2"/>
  
  <!-- Composition Section -->
  <rect x="50" y="260" width="150" height="180" fill="#f39c12" stroke="#e67e22" stroke-width="2" rx="10"/>
  <text x="125" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    Composition
  </text>
  
  <!-- Pie Chart -->
  <rect x="70" y="300" width="110" height="60" fill="#e67e22" stroke="#d35400" stroke-width="1" rx="5"/>
  <text x="125" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">
    Pie Chart
  </text>
  <!-- Mini pie chart -->
  <circle cx="125" cy="340" r="15" fill="white"/>
  <path d="M 125 325 A 15 15 0 0 1 140 340 L 125 340 Z" fill="#e74c3c"/>
  <path d="M 140 340 A 15 15 0 0 1 120 350 L 125 340 Z" fill="#3498db"/>
  <path d="M 120 350 A 15 15 0 1 1 125 325 L 125 340 Z" fill="#27ae60"/>
  
  <!-- Stacked Bar -->
  <rect x="70" y="370" width="110" height="60" fill="#e67e22" stroke="#d35400" stroke-width="1" rx="5"/>
  <text x="125" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">
    Stacked Bar
  </text>
  <!-- Mini stacked bar -->
  <rect x="85" y="395" width="15" height="8" fill="#e74c3c"/>
  <rect x="85" y="403" width="15" height="12" fill="#3498db"/>
  <rect x="85" y="415" width="15" height="10" fill="#27ae60"/>
  <rect x="110" y="395" width="15" height="15" fill="#e74c3c"/>
  <rect x="110" y="410" width="15" height="8" fill="#3498db"/>
  <rect x="110" y="418" width="15" height="7" fill="#27ae60"/>
  <rect x="135" y="395" width="15" height="20" fill="#e74c3c"/>
  <rect x="135" y="415" width="15" height="6" fill="#3498db"/>
  <rect x="135" y="421" width="15" height="4" fill="#27ae60"/>
  
  <!-- Hierarchy Section -->
  <rect x="220" y="260" width="150" height="180" fill="#1abc9c" stroke="#16a085" stroke-width="2" rx="10"/>
  <text x="295" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    Hierarchy
  </text>
  
  <!-- Tree Diagram -->
  <rect x="240" y="300" width="110" height="60" fill="#16a085" stroke="#138d75" stroke-width="1" rx="5"/>
  <text x="295" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">
    Tree Diagram
  </text>
  <!-- Mini tree -->
  <circle cx="295" cy="325" r="3" fill="white"/>
  <circle cx="280" cy="340" r="2" fill="white"/>
  <circle cx="310" cy="340" r="2" fill="white"/>
  <circle cx="270" cy="350" r="2" fill="white"/>
  <circle cx="290" cy="350" r="2" fill="white"/>
  <circle cx="300" cy="350" r="2" fill="white"/>
  <circle cx="320" cy="350" r="2" fill="white"/>
  <line x1="295" y1="328" x2="280" y2="337" stroke="white" stroke-width="1"/>
  <line x1="295" y1="328" x2="310" y2="337" stroke="white" stroke-width="1"/>
  <line x1="280" y1="342" x2="270" y2="347" stroke="white" stroke-width="1"/>
  <line x1="280" y1="342" x2="290" y2="347" stroke="white" stroke-width="1"/>
  <line x1="310" y1="342" x2="300" y2="347" stroke="white" stroke-width="1"/>
  <line x1="310" y1="342" x2="320" y2="347" stroke="white" stroke-width="1"/>
  
  <!-- Sunburst -->
  <rect x="240" y="370" width="110" height="60" fill="#16a085" stroke="#138d75" stroke-width="1" rx="5"/>
  <text x="295" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">
    Sunburst
  </text>
  <!-- Mini sunburst -->
  <circle cx="295" cy="405" r="12" fill="none" stroke="white" stroke-width="2"/>
  <circle cx="295" cy="405" r="8" fill="none" stroke="white" stroke-width="1"/>
  <line x1="295" y1="393" x2="295" y2="417" stroke="white" stroke-width="1"/>
  <line x1="283" y1="405" x2="307" y2="405" stroke="white" stroke-width="1"/>
  
  <!-- Geographic Section -->
  <rect x="390" y="260" width="150" height="180" fill="#34495e" stroke="#2c3e50" stroke-width="2" rx="10"/>
  <text x="465" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    Geographic
  </text>
  
  <!-- Map -->
  <rect x="410" y="300" width="110" height="60" fill="#2c3e50" stroke="#1b2631" stroke-width="1" rx="5"/>
  <text x="465" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">
    Choropleth Map
  </text>
  <!-- Mini map -->
  <path d="M 430 325 L 450 330 L 470 325 L 480 335 L 475 345 L 455 350 L 435 345 L 425 335 Z" 
        fill="white" fill-opacity="0.7" stroke="white" stroke-width="1"/>
  <circle cx="450" cy="340" r="2" fill="#e74c3c"/>
  <circle cx="460" cy="335" r="2" fill="#f39c12"/>
  
  <!-- Heat Map -->
  <rect x="410" y="370" width="110" height="60" fill="#2c3e50" stroke="#1b2631" stroke-width="1" rx="5"/>
  <text x="465" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">
    Heat Map
  </text>
  <!-- Mini heat map -->
  <rect x="430" y="395" width="12" height="12" fill="#ff4757"/>
  <rect x="446" y="395" width="12" height="12" fill="#ffa502"/>
  <rect x="462" y="395" width="12" height="12" fill="#2ed573"/>
  <rect x="430" y="411" width="12" height="12" fill="#ffa502"/>
  <rect x="446" y="411" width="12" height="12" fill="#ff4757"/>
  <rect x="462" y="411" width="12" height="12" fill="#70a1ff"/>
  
  <!-- Statistical Section -->
  <rect x="560" y="260" width="150" height="180" fill="#e91e63" stroke="#c2185b" stroke-width="2" rx="10"/>
  <text x="635" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    Statistical
  </text>
  
  <!-- Violin Plot -->
  <rect x="580" y="300" width="110" height="60" fill="#c2185b" stroke="#ad1457" stroke-width="1" rx="5"/>
  <text x="635" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">
    Violin Plot
  </text>
  <!-- Mini violin plot -->
  <path d="M 620 325 Q 610 340 620 355 Q 630 340 620 325" fill="white" fill-opacity="0.7"/>
  <path d="M 650 325 Q 640 340 650 355 Q 660 340 650 325" fill="white" fill-opacity="0.7"/>
  <line x1="620" y1="325" x2="620" y2="355" stroke="white" stroke-width="1"/>
  <line x1="650" y1="325" x2="650" y2="355" stroke="white" stroke-width="1"/>
  
  <!-- Q-Q Plot -->
  <rect x="580" y="370" width="110" height="60" fill="#c2185b" stroke="#ad1457" stroke-width="1" rx="5"/>
  <text x="635" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">
    Q-Q Plot
  </text>
  <!-- Mini Q-Q plot -->
  <path d="M 590 420 L 680 395" stroke="white" stroke-width="1" stroke-dasharray="2,2"/>
  <circle cx="600" cy="415" r="1.5" fill="white"/>
  <circle cx="620" cy="410" r="1.5" fill="white"/>
  <circle cx="640" cy="405" r="1.5" fill="white"/>
  <circle cx="660" cy="400" r="1.5" fill="white"/>
  
  <!-- Use Case Guidelines -->
  <rect x="50" y="470" width="700" height="200" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2" rx="15"/>
  <text x="400" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">
    When to Use Each Visualization Type
  </text>
  
  <!-- Guidelines Grid -->
  <rect x="70" y="510" width="160" height="70" fill="#3498db" stroke="#2980b9" stroke-width="1" rx="5"/>
  <text x="150" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Comparison Charts
  </text>
  <text x="80" y="540" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Compare values across categories
  </text>
  <text x="80" y="555" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Show rankings or differences
  </text>
  <text x="80" y="570" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Best for: categorical data
  </text>
  
  <rect x="250" y="510" width="160" height="70" fill="#e74c3c" stroke="#c0392b" stroke-width="1" rx="5"/>
  <text x="330" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Distribution Charts
  </text>
  <text x="260" y="540" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Show data spread and outliers
  </text>
  <text x="260" y="555" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Understand data shape
  </text>
  <text x="260" y="570" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Best for: continuous data
  </text>
  
  <rect x="430" y="510" width="160" height="70" fill="#27ae60" stroke="#229954" stroke-width="1" rx="5"/>
  <text x="510" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Relationship Charts
  </text>
  <text x="440" y="540" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Show correlations
  </text>
  <text x="440" y="555" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Identify patterns and trends
  </text>
  <text x="440" y="570" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Best for: 2+ variables
  </text>
  
  <rect x="610" y="510" width="120" height="70" fill="#9b59b6" stroke="#8e44ad" stroke-width="1" rx="5"/>
  <text x="670" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Time Series
  </text>
  <text x="620" y="540" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Show trends over time
  </text>
  <text x="620" y="555" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Identify seasonality
  </text>
  <text x="620" y="570" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Best for: temporal data
  </text>
  
  <rect x="200" y="590" width="160" height="70" fill="#f39c12" stroke="#e67e22" stroke-width="1" rx="5"/>
  <text x="280" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Composition Charts
  </text>
  <text x="210" y="620" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Show parts of a whole
  </text>
  <text x="210" y="635" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Compare proportions
  </text>
  <text x="210" y="650" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Best for: percentage data
  </text>
  
  <rect x="380" y="590" width="160" height="70" fill="#1abc9c" stroke="#16a085" stroke-width="1" rx="5"/>
  <text x="460" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Geographic Charts
  </text>
  <text x="390" y="620" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Show spatial patterns
  </text>
  <text x="390" y="635" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Location-based insights
  </text>
  <text x="390" y="650" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Best for: geographic data
  </text>
</svg>