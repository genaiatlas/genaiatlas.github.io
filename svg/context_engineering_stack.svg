<svg viewBox="0 0 1200 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f9ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0f2fe;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="1200" height="1000" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="600" y="50" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#0f172a" text-anchor="middle">The Portable Context Stack</text>
  <text x="600" y="85" font-family="Arial, sans-serif" font-size="16" fill="#64748b" text-anchor="middle">Four Layers of AI Context Management</text>
  
  <!-- Central AI -->
  <g transform="translate(450, 450)">
    <circle r="80" fill="#6366f1" opacity="0.1"/>
    <circle r="60" fill="#6366f1"/>
    <text y="-5" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">AI Assistant</text>
    <text y="20" font-family="Arial, sans-serif" font-size="14" fill="#e0e7ff" text-anchor="middle">with Complete</text>
    <text y="38" font-family="Arial, sans-serif" font-size="14" fill="#e0e7ff" text-anchor="middle">Context</text>
  </g>
  
  <!-- Layer 1: Global Rules (Top) -->
  <g transform="translate(200, 140)" filter="url(#shadow)">
    <rect width="500" height="140" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="3"/>
    
    <circle cx="35" cy="35" r="20" fill="#3b82f6"/>
    <text x="35" y="42" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">1</text>
    
    <text x="70" y="42" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1e40af">Layer 1: Global Rules</text>
    
    <text x="30" y="75" font-family="Arial, sans-serif" font-size="13" fill="#334155">• Personal or org-wide coding style and patterns</text>
    <text x="30" y="95" font-family="Arial, sans-serif" font-size="13" fill="#334155">• Development process instructions</text>
    <text x="30" y="115" font-family="Arial, sans-serif" font-size="13" fill="#334155">• Tooling preferences and conventions</text>
  </g>
  
  <!-- Connection line -->
  <line x1="450" y1="290" x2="450" y2="360" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Layer 2: Repository Level (Left) -->
  <g transform="translate(50, 380)" filter="url(#shadow)">
    <rect width="300" height="160" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="3"/>
    
    <circle cx="35" cy="35" r="20" fill="#22c55e"/>
    <text x="35" y="42" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">2</text>
    
    <text x="70" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#15803d">Layer 2:</text>
    <text x="70" y="50" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#15803d">Repository Context</text>
    
    <text x="25" y="80" font-family="Arial, sans-serif" font-size="12" fill="#334155">• AGENTS.md files</text>
    <text x="25" y="100" font-family="Arial, sans-serif" font-size="12" fill="#334155">• Project goals and priorities</text>
    <text x="25" y="120" font-family="Arial, sans-serif" font-size="12" fill="#334155">• Architecture patterns</text>
    <text x="25" y="140" font-family="Arial, sans-serif" font-size="12" fill="#334155">• Team conventions</text>
  </g>
  
  <!-- Connection line -->
  <line x1="360" y1="460" x2="410" y2="460" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Layer 3: External Docs (Right) -->
  <g transform="translate(550, 380)" filter="url(#shadow)">
    <rect width="300" height="160" rx="12" fill="#fce7f3" stroke="#ec4899" stroke-width="3"/>
    
    <circle cx="35" cy="35" r="20" fill="#ec4899"/>
    <text x="35" y="42" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">3</text>
    
    <text x="70" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#be185d">Layer 3:</text>
    <text x="70" y="50" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#be185d">External Docs</text>
    
    <text x="25" y="80" font-family="Arial, sans-serif" font-size="12" fill="#334155">• Library documentation</text>
    <text x="25" y="100" font-family="Arial, sans-serif" font-size="12" fill="#334155">• Framework references</text>
    <text x="25" y="120" font-family="Arial, sans-serif" font-size="12" fill="#334155">• llms.txt files</text>
    <text x="25" y="140" font-family="Arial, sans-serif" font-size="12" fill="#334155">• MCP servers</text>
  </g>
  
  <!-- Connection line -->
  <line x1="540" y1="460" x2="490" y2="460" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Layer 4: Living Documentation (Bottom) -->
  <g transform="translate(200, 600)" filter="url(#shadow)">
    <rect width="500" height="140" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
    
    <circle cx="35" cy="35" r="20" fill="#f59e0b"/>
    <text x="35" y="42" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">4</text>
    
    <text x="70" y="42" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#b45309">Layer 4: Living Documentation</text>
    
    <text x="30" y="75" font-family="Arial, sans-serif" font-size="13" fill="#334155">• Architecture Decision Records (ADRs)</text>
    <text x="30" y="95" font-family="Arial, sans-serif" font-size="13" fill="#334155">• Current plans and priorities</text>
    <text x="30" y="115" font-family="Arial, sans-serif" font-size="13" fill="#334155">• Evolving specifications and data access</text>
  </g>
  
  <!-- Connection line -->
  <line x1="450" y1="550" x2="450" y2="590" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Flow indicators -->
  <g transform="translate(900, 200)">
    <rect width="250" height="180" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
    <text x="125" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#5b21b6" text-anchor="middle">Context Flow</text>
    
    <text x="20" y="60" font-family="Arial, sans-serif" font-size="13" fill="#6d28d9">↓ Increasing Specificity</text>
    <text x="20" y="85" font-family="Arial, sans-serif" font-size="12" fill="#334155">Global → Project →</text>
    <text x="20" y="105" font-family="Arial, sans-serif" font-size="12" fill="#334155">External → Living</text>
    
    <text x="20" y="135" font-family="Arial, sans-serif" font-size="13" fill="#6d28d9">💡 Management Tips:</text>
    <text x="20" y="155" font-family="Arial, sans-serif" font-size="11" fill="#334155">• Version control all layers</text>
    <text x="20" y="170" font-family="Arial, sans-serif" font-size="11" fill="#334155">• Keep living docs current</text>
  </g>
  
  <!-- Bottom note -->
  <g transform="translate(250, 860)">
    <rect width="700" height="60" rx="8" fill="#6366f1" opacity="0.9"/>
    <text x="350" y="28" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="white" text-anchor="middle">Each Layer Builds on the Previous</text>
    <text x="350" y="48" font-family="Arial, sans-serif" font-size="13" fill="#e0e7ff" text-anchor="middle">Create a comprehensive context stack that works across tools and projects</text>
  </g>
</svg>