<svg viewBox="0 0 900 650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; text-anchor: middle; }
      .subtitle { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; }
      .label { font-family: Arial, sans-serif; font-size: 12px; text-anchor: middle; }
      .small-label { font-family: Arial, sans-serif; font-size: 10px; text-anchor: middle; }
      .axis-label { font-family: Arial, sans-serif; font-size: 10px; text-anchor: middle; }
      .red-dot { fill: #E74C3C; stroke: #C0392B; stroke-width: 1.5; }
      .blue-dot { fill: #3498DB; stroke: #2980B9; stroke-width: 1.5; }
      .test-dot-red { fill: #FFB3BA; stroke: #FF7F7F; stroke-width: 1.5; }
      .test-dot-blue { fill: #B3D4FF; stroke: #7FB3FF; stroke-width: 1.5; }
      .boundary-100 { stroke: #F39C12; stroke-width: 3; fill: none; }
      .boundary-500 { stroke: #E74C3C; stroke-width: 3; fill: none; }
      .grid-line { stroke: #ECF0F1; stroke-width: 0.8; }
      .background { fill: #FAFBFC; stroke: #D5DBDB; stroke-width: 1; }
      .good-region { fill: #D5EDDA; opacity: 0.3; }
      .bad-region { fill: #F8D7DA; opacity: 0.3; }
    </style>
  </defs>
  
  <!-- Title -->
  <text x="450" y="25" class="title">Overfitting Comparison: 100 vs 500 Hidden Neurons</text>
  
  <!-- 100 Neurons Network -->
  <g id="network-100">
    <text x="200" y="60" class="subtitle">100 Hidden Neurons</text>
    <text x="200" y="80" class="small-label">(Moderate Overfitting)</text>
    <rect x="50" y="100" width="300" height="200" class="background"/>
    
    <!-- Grid -->
    <line x1="50" y1="140" x2="350" y2="140" class="grid-line"/>
    <line x1="50" y1="180" x2="350" y2="180" class="grid-line"/>
    <line x1="50" y1="220" x2="350" y2="220" class="grid-line"/>
    <line x1="50" y1="260" x2="350" y2="260" class="grid-line"/>
    <line x1="100" y1="100" x2="100" y2="300" class="grid-line"/>
    <line x1="150" y1="100" x2="150" y2="300" class="grid-line"/>
    <line x1="200" y1="100" x2="200" y2="300" class="grid-line"/>
    <line x1="250" y1="100" x2="250" y2="300" class="grid-line"/>
    <line x1="300" y1="100" x2="300" y2="300" class="grid-line"/>
    
    <!-- Axes -->
    <line x1="50" y1="300" x2="350" y2="300" stroke="#2C3E50" stroke-width="2"/>
    <line x1="50" y1="100" x2="50" y2="300" stroke="#2C3E50" stroke-width="2"/>
    
    <!-- Training data - Red -->
    <circle cx="80" cy="120" r="3" class="red-dot"/>
    <circle cx="95" cy="130" r="3" class="red-dot"/>
    <circle cx="120" cy="115" r="3" class="red-dot"/>
    <circle cx="140" cy="135" r="3" class="red-dot"/>
    <circle cx="180" cy="125" r="3" class="red-dot"/>
    <circle cx="220" cy="140" r="3" class="red-dot"/>
    <circle cx="260" cy="120" r="3" class="red-dot"/>
    <circle cx="300" cy="130" r="3" class="red-dot"/>
    <circle cx="320" cy="125" r="3" class="red-dot"/>
    
    <!-- Training data - Blue -->
    <circle cx="70" cy="250" r="3" class="blue-dot"/>
    <circle cx="90" cy="270" r="3" class="blue-dot"/>
    <circle cx="110" cy="240" r="3" class="blue-dot"/>
    <circle cx="135" cy="265" r="3" class="blue-dot"/>
    <circle cx="160" cy="235" r="3" class="blue-dot"/>
    <circle cx="190" cy="280" r="3" class="blue-dot"/>
    <circle cx="230" cy="250" r="3" class="blue-dot"/>
    <circle cx="270" cy="275" r="3" class="blue-dot"/>
    <circle cx="310" cy="245" r="3" class="blue-dot"/>
    <circle cx="330" cy="260" r="3" class="blue-dot"/>
    
    <!-- Test data points (lighter colors) -->
    <circle cx="85" cy="145" r="2.5" class="test-dot-red"/>
    <circle cx="165" cy="155" r="2.5" class="test-dot-red"/>
    <circle cx="285" cy="145" r="2.5" class="test-dot-red"/>
    <circle cx="105" cy="225" r="2.5" class="test-dot-blue"/>
    <circle cx="175" cy="255" r="2.5" class="test-dot-blue"/>
    <circle cx="255" cy="235" r="2.5" class="test-dot-blue"/>
    
    <!-- Decision boundary for 100 neurons (somewhat smooth) -->
    <path d="M 60,180 Q 100,160 140,175 Q 180,190 220,180 Q 260,170 300,185 Q 330,195 340,190" class="boundary-100"/>
    
    <!-- Classification regions -->
    <path d="M 50,100 L 350,100 Q 340,190 330,195 Q 300,185 260,170 Q 220,180 180,190 Q 140,175 100,160 Q 60,180 50,180 Z" class="good-region"/>
    <path d="M 50,180 Q 60,180 100,160 Q 140,175 180,190 Q 220,180 260,170 Q 300,185 330,195 Q 340,190 350,195 L 350,300 L 50,300 Z" class="good-region"/>
    
    <!-- Performance metrics -->
    <text x="200" y="325" class="small-label">Training: 95% | Validation: 78%</text>
    <text x="200" y="340" class="small-label">Generalization Gap: 17%</text>
  </g>
  
  <!-- 500 Neurons Network -->
  <g id="network-500">
    <text x="650" y="60" class="subtitle">500 Hidden Neurons</text>
    <text x="650" y="80" class="small-label">(Severe Overfitting)</text>
    <rect x="500" y="100" width="300" height="200" class="background"/>
    
    <!-- Grid -->
    <line x1="500" y1="140" x2="800" y2="140" class="grid-line"/>
    <line x1="500" y1="180" x2="800" y2="180" class="grid-line"/>
    <line x1="500" y1="220" x2="800" y2="220" class="grid-line"/>
    <line x1="500" y1="260" x2="800" y2="260" class="grid-line"/>
    <line x1="550" y1="100" x2="550" y2="300" class="grid-line"/>
    <line x1="600" y1="100" x2="600" y2="300" class="grid-line"/>
    <line x1="650" y1="100" x2="650" y2="300" class="grid-line"/>
    <line x1="700" y1="100" x2="700" y2="300" class="grid-line"/>
    <line x1="750" y1="100" x2="750" y2="300" class="grid-line"/>
    
    <!-- Axes -->
    <line x1="500" y1="300" x2="800" y2="300" stroke="#2C3E50" stroke-width="2"/>
    <line x1="500" y1="100" x2="500" y2="300" stroke="#2C3E50" stroke-width="2"/>
    
    <!-- Same training data - Red -->
    <circle cx="530" cy="120" r="3" class="red-dot"/>
    <circle cx="545" cy="130" r="3" class="red-dot"/>
    <circle cx="570" cy="115" r="3" class="red-dot"/>
    <circle cx="590" cy="135" r="3" class="red-dot"/>
    <circle cx="630" cy="125" r="3" class="red-dot"/>
    <circle cx="670" cy="140" r="3" class="red-dot"/>
    <circle cx="710" cy="120" r="3" class="red-dot"/>
    <circle cx="750" cy="130" r="3" class="red-dot"/>
    <circle cx="770" cy="125" r="3" class="red-dot"/>
    
    <!-- Same training data - Blue -->
    <circle cx="520" cy="250" r="3" class="blue-dot"/>
    <circle cx="540" cy="270" r="3" class="blue-dot"/>
    <circle cx="560" cy="240" r="3" class="blue-dot"/>
    <circle cx="585" cy="265" r="3" class="blue-dot"/>
    <circle cx="610" cy="235" r="3" class="blue-dot"/>
    <circle cx="640" cy="280" r="3" class="blue-dot"/>
    <circle cx="680" cy="250" r="3" class="blue-dot"/>
    <circle cx="720" cy="275" r="3" class="blue-dot"/>
    <circle cx="760" cy="245" r="3" class="blue-dot"/>
    <circle cx="780" cy="260" r="3" class="blue-dot"/>
    
    <!-- Test data points (many misclassified) -->
    <circle cx="535" cy="145" r="2.5" class="test-dot-red"/>
    <circle cx="615" cy="155" r="2.5" class="test-dot-red"/>
    <circle cx="735" cy="145" r="2.5" class="test-dot-red"/>
    <circle cx="555" cy="225" r="2.5" class="test-dot-blue"/>
    <circle cx="625" cy="255" r="2.5" class="test-dot-blue"/>
    <circle cx="705" cy="235" r="2.5" class="test-dot-blue"/>
    
    <!-- Overly complex decision boundary for 500 neurons -->
    <path d="M 510,170 Q 525,150 540,175 Q 555,195 570,165 Q 585,140 600,180 Q 615,220 630,160 Q 645,120 660,185 Q 675,240 690,170 Q 705,130 720,190 Q 735,250 750,175 Q 765,140 780,185" class="boundary-500"/>
    
    <!-- Misclassification indicators (X marks for wrongly classified test points) -->
    <g stroke="#E74C3C" stroke-width="2">
      <line x1="530" y1="140" x2="540" y2="150"/>
      <line x1="540" y1="140" x2="530" y2="150"/>
      <line x1="620" y1="250" x2="630" y2="260"/>
      <line x1="630" y1="250" x2="620" y2="260"/>
      <line x1="700" y1="230" x2="710" y2="240"/>
      <line x1="710" y1="230" x2="700" y2="240"/>
    </g>
    
    <!-- Performance metrics -->
    <text x="650" y="325" class="small-label">Training: 98% | Validation: 72%</text>
    <text x="650" y="340" class="small-label">Generalization Gap: 26%</text>
  </g>
  
  <!-- Learning Curve Comparison -->
  <g id="learning-curves">
    <text x="450" y="390" class="subtitle">Learning Curves: Training vs Validation Performance</text>
    <rect x="50" y="410" width="800" height="180" class="background"/>
    
    <!-- Axes -->
    <line x1="100" y1="570" x2="800" y2="570" stroke="#2C3E50" stroke-width="2"/>
    <line x1="100" y1="420" x2="100" y2="570" stroke="#2C3E50" stroke-width="2"/>
    
    <!-- Grid lines -->
    <line x1="100" y1="530" x2="800" y2="530" class="grid-line"/>
    <line x1="100" y1="490" x2="800" y2="490" class="grid-line"/>
    <line x1="100" y1="450" x2="800" y2="450" class="grid-line"/>
    <line x1="200" y1="420" x2="200" y2="570" class="grid-line"/>
    <line x1="300" y1="420" x2="300" y2="570" class="grid-line"/>
    <line x1="400" y1="420" x2="400" y2="570" class="grid-line"/>
    <line x1="500" y1="420" x2="500" y2="570" class="grid-line"/>
    <line x1="600" y1="420" x2="600" y2="570" class="grid-line"/>
    <line x1="700" y1="420" x2="700" y2="570" class="grid-line"/>
    
    <!-- 100 Neurons - Training curve -->
    <path d="M 120,550 Q 200,520 300,480 Q 400,460 500,450 Q 600,445 700,440" 
          stroke="#F39C12" stroke-width="3" fill="none" stroke-dasharray="none"/>
    
    <!-- 100 Neurons - Validation curve -->
    <path d="M 120,560 Q 200,540 300,510 Q 400,500 500,505 Q 600,510 700,515" 
          stroke="#F39C12" stroke-width="3" fill="none" stroke-dasharray="5,5"/>
    
    <!-- 500 Neurons - Training curve -->
    <path d="M 120,550 Q 200,510 300,460 Q 400,430 500,415 Q 600,405 700,395" 
          stroke="#E74C3C" stroke-width="3" fill="none" stroke-dasharray="none"/>
    
    <!-- 500 Neurons - Validation curve -->
    <path d="M 120,560 Q 200,550 300,530 Q 400,540 500,550 Q 600,560 700,570" 
          stroke="#E74C3C" stroke-width="3" fill="none" stroke-dasharray="5,5"/>
    
    <!-- Labels -->
    <text x="80" y="495" class="axis-label" transform="rotate(-90, 80, 495)">Accuracy (%)</text>
    <text x="450" y="595" class="axis-label">Training Epochs</text>
    
    <!-- Accuracy scale -->
    <text x="90" y="575" class="small-label">60</text>
    <text x="90" y="535" class="small-label">70</text>
    <text x="90" y="495" class="small-label">80</text>
    <text x="90" y="455" class="small-label">90</text>
    <text x="90" y="425" class="small-label">100</text>
    
    <!-- Epoch scale -->
    <text x="200" y="585" class="small-label">20</text>
    <text x="300" y="585" class="small-label">40</text>
    <text x="400" y="585" class="small-label">60</text>
    <text x="500" y="585" class="small-label">80</text>
    <text x="600" y="585" class="small-label">100</text>
    
    <!-- Legend -->
    <rect x="520" y="430" width="260" height="80" fill="white" stroke="#BDC3C7" stroke-width="1" rx="3"/>
    <text x="640" y="445" class="small-label" font-weight="bold">Legend</text>
    <line x1="540" y1="455" x2="570" y2="455" stroke="#F39C12" stroke-width="3"/>
    <text x="580" y="460" class="small-label">100 Neurons - Training</text>
    <line x1="540" y1="470" x2="570" y2="470" stroke="#F39C12" stroke-width="3" stroke-dasharray="5,5"/>
    <text x="580" y="475" class="small-label">100 Neurons - Validation</text>
    <line x1="540" y1="485" x2="570" y2="485" stroke="#E74C3C" stroke-width="3"/>
    <text x="580" y="490" class="small-label">500 Neurons - Training</text>
    <line x1="540" y1="500" x2="570" y2="500" stroke="#E74C3C" stroke-width="3" stroke-dasharray="5,5"/>
    <text x="580" y="505" class="small-label">500 Neurons - Validation</text>
  </g>
  
  <!-- Summary -->
  <rect x="50" y="605" width="800" height="35" fill="#FFF3CD" stroke="#FFEAA7" stroke-width="1" rx="3"/>
  <text x="450" y="625" class="label" font-weight="bold">Overfitting Indicators:</text>
  <text x="450" y="640" class="small-label">
    Large training-validation gap • Complex boundaries • Poor generalization • Memorization instead of learning
  </text>
</svg>