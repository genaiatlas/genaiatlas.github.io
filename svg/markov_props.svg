<svg viewBox="0 0 800 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#2c3e50">
    Properties of Markov Chains
  </text>
  
  <!-- Define arrow markers -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth" fill="#3498db">
      <path d="M0,0 L0,6 L9,3 z"/>
    </marker>
  </defs>
  
  <!-- Irreducibility Example -->
  <g transform="translate(100, 100)">
    <text x="100" y="0" text-anchor="middle" font-size="18" font-weight="bold" fill="#34495e">Irreducible Chain</text>
    
    <!-- States -->
    <circle cx="50" cy="50" r="25" fill="#3498db" opacity="0.8"/>
    <text x="50" y="55" text-anchor="middle" font-size="14" fill="white" font-weight="bold">S₁</text>
    
    <circle cx="150" cy="50" r="25" fill="#3498db" opacity="0.8"/>
    <text x="150" y="55" text-anchor="middle" font-size="14" fill="white" font-weight="bold">S₂</text>
    
    <circle cx="100" cy="130" r="25" fill="#3498db" opacity="0.8"/>
    <text x="100" y="135" text-anchor="middle" font-size="14" fill="white" font-weight="bold">S₃</text>
    
    <!-- Transitions showing all states communicate -->
    <path d="M 75 45 L 125 45" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 125 55 L 75 55" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 60 70 L 90 110" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 90 110 L 60 70" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="3,3"/>
    <path d="M 140 70 L 110 110" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 110 110 L 140 70" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="3,3"/>
    
    <text x="100" y="170" text-anchor="middle" font-size="12" fill="#7f8c8d">All states communicate</text>
  </g>
  
  <!-- Reducible Example -->
  <g transform="translate(400, 100)">
    <text x="100" y="0" text-anchor="middle" font-size="18" font-weight="bold" fill="#34495e">Reducible Chain</text>
    
    <!-- First communicating class -->
    <circle cx="50" cy="50" r="25" fill="#e74c3c" opacity="0.8"/>
    <text x="50" y="55" text-anchor="middle" font-size="14" fill="white" font-weight="bold">S₁</text>
    
    <circle cx="120" cy="50" r="25" fill="#e74c3c" opacity="0.8"/>
    <text x="120" y="55" text-anchor="middle" font-size="14" fill="white" font-weight="bold">S₂</text>
    
    <!-- Second communicating class -->
    <circle cx="80" cy="120" r="25" fill="#2ecc71" opacity="0.8"/>
    <text x="80" y="125" text-anchor="middle" font-size="14" fill="white" font-weight="bold">S₃</text>
    
    <circle cx="150" cy="120" r="25" fill="#2ecc71" opacity="0.8"/>
    <text x="150" y="125" text-anchor="middle" font-size="14" fill="white" font-weight="bold">S₄</text>
    
    <!-- Transitions within classes -->
    <path d="M 70 45 L 100 45" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 100 55 L 70 55" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
    
    <path d="M 100 115 L 130 115" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 130 125 L 100 125" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
    
    <text x="100" y="170" text-anchor="middle" font-size="12" fill="#7f8c8d">Two separate classes</text>
  </g>
  
  <!-- Periodicity Example -->
  <g transform="translate(100, 300)">
    <text x="100" y="0" text-anchor="middle" font-size="18" font-weight="bold" fill="#34495e">Periodic Chain (Period = 2)</text>
    
    <!-- States arranged to show periodicity -->
    <circle cx="50" cy="50" r="25" fill="#9b59b6" opacity="0.8"/>
    <text x="50" y="55" text-anchor="middle" font-size="14" fill="white" font-weight="bold">A</text>
    
    <circle cx="150" cy="50" r="25" fill="#f39c12" opacity="0.8"/>
    <text x="150" y="55" text-anchor="middle" font-size="14" fill="white" font-weight="bold">B</text>
    
    <circle cx="50" cy="120" r="25" fill="#f39c12" opacity="0.8"/>
    <text x="50" y="125" text-anchor="middle" font-size="14" fill="white" font-weight="bold">C</text>
    
    <circle cx="150" cy="120" r="25" fill="#9b59b6" opacity="0.8"/>
    <text x="150" y="125" text-anchor="middle" font-size="14" fill="white" font-weight="bold">D</text>
    
    <!-- Transitions showing period 2 -->
    <path d="M 75 50 L 125 50" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 150 75 L 150 95" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 125 120 L 75 120" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 50 95 L 50 75" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
    
    <text x="100" y="170" text-anchor="middle" font-size="12" fill="#7f8c8d">Returns only at even steps</text>
  </g>
  
  <!-- Aperiodic Example -->
  <g transform="translate(400, 300)">
    <text x="100" y="0" text-anchor="middle" font-size="18" font-weight="bold" fill="#34495e">Aperiodic Chain</text>
    
    <!-- States with self-loop -->
    <circle cx="50" cy="60" r="25" fill="#27ae60" opacity="0.8"/>
    <text x="50" y="65" text-anchor="middle" font-size="14" fill="white" font-weight="bold">X</text>
    
    <circle cx="150" cy="60" r="25" fill="#27ae60" opacity="0.8"/>
    <text x="150" y="65" text-anchor="middle" font-size="14" fill="white" font-weight="bold">Y</text>
    
    <circle cx="100" cy="120" r="25" fill="#27ae60" opacity="0.8"/>
    <text x="100" y="125" text-anchor="middle" font-size="14" fill="white" font-weight="bold">Z</text>
    
    <!-- Transitions including self-loop -->
    <path d="M 75 55 L 125 55" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 125 65 L 75 65" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 140 80 L 110 100" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 90 100 L 60 80" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
    
    <!-- Self-loop on Z -->
    <circle cx="100" cy="150" r="20" stroke="#34495e" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    
    <text x="100" y="190" text-anchor="middle" font-size="12" fill="#7f8c8d">Can return at any time</text>
  </g>
  
  <!-- Absorbing State Example -->
  <g transform="translate(100, 500)">
    <text x="100" y="0" text-anchor="middle" font-size="18" font-weight="bold" fill="#34495e">Absorbing State</text>
    
    <!-- Regular states -->
    <circle cx="30" cy="60" r="25" fill="#95a5a6" opacity="0.8"/>
    <text x="30" y="65" text-anchor="middle" font-size="14" fill="white" font-weight="bold">T₁</text>
    
    <circle cx="100" cy="60" r="25" fill="#95a5a6" opacity="0.8"/>
    <text x="100" y="65" text-anchor="middle" font-size="14" fill="white" font-weight="bold">T₂</text>
    
    <!-- Absorbing state -->
    <circle cx="170" cy="60" r="30" fill="#c0392b" opacity="0.9" stroke="#8b0000" stroke-width="3"/>
    <text x="170" y="65" text-anchor="middle" font-size="14" fill="white" font-weight="bold">ABS</text>
    
    <!-- Transitions -->
    <path d="M 55 60 L 75 60" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 125 60 L 140 60" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
    
    <!-- Self-loop on absorbing state -->
    <circle cx="170" cy="95" r="20" stroke="#c0392b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <text x="170" y="125" text-anchor="middle" font-size="10" fill="#c0392b">p = 1.0</text>
    
    <text x="100" y="150" text-anchor="middle" font-size="12" fill="#7f8c8d">Cannot escape once entered</text>
  </g>
  
  <!-- Recurrent vs Transient -->
  <g transform="translate(400, 500)">
    <text x="100" y="0" text-anchor="middle" font-size="18" font-weight="bold" fill="#34495e">Recurrent vs Transient</text>
    
    <!-- Recurrent states -->
    <circle cx="50" cy="60" r="25" fill="#16a085" opacity="0.8"/>
    <text x="50" y="65" text-anchor="middle" font-size="14" fill="white" font-weight="bold">R₁</text>
    
    <circle cx="120" cy="60" r="25" fill="#16a085" opacity="0.8"/>
    <text x="120" y="65" text-anchor="middle" font-size="14" fill="white" font-weight="bold">R₂</text>
    
    <!-- Transient state -->
    <circle cx="180" cy="120" r="25" fill="#e67e22" opacity="0.6" stroke-dasharray="5,5" stroke="#e67e22" stroke-width="2"/>
    <text x="180" y="125" text-anchor="middle" font-size="14" fill="white" font-weight="bold">T</text>
    
    <!-- Transitions -->
    <path d="M 75 60 L 95 60" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 95 60 L 75 60" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)" y="5"/>
    
    <path d="M 130 80 L 170 100" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- One-way from transient -->
    <path d="M 155 120 L 130 80" stroke="#34495e" stroke-width="2" stroke-dasharray="5,5" opacity="0.3"/>
    
    <text x="50" y="35" font-size="10" fill="#16a085">Recurrent</text>
    <text x="120" y="35" font-size="10" fill="#16a085">Recurrent</text>
    <text x="180" y="155" font-size="10" fill="#e67e22">Transient</text>
    
    <text x="100" y="175" text-anchor="middle" font-size="12" fill="#7f8c8d">May never return to T</text>
  </g>
  
  <!-- Legend Box -->
  <rect x="50" y="640" width="700" height="40" fill="#ecf0f1" stroke="#34495e" stroke-width="1" rx="5"/>
  <text x="60" y="660" font-size="12" fill="#34495e">
    Key Properties: Irreducibility (all states communicate) | Periodicity (return timing) | Recurrence (return probability) | Absorbing (terminal states)
  </text>
  <text x="60" y="675" font-size="11" fill="#7f8c8d">
    These properties determine the long-term behavior and convergence characteristics of Markov chains
  </text>
</svg>