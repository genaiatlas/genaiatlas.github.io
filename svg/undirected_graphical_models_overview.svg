<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="700" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="600" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Undirected Graphical Models Overview
  </text>
  
  <!-- Left Section: Graph Structure -->
  <g id="graph-structure">
    <rect x="50" y="80" width="500" height="560" fill="#e8f4f8" stroke="#3498db" stroke-width="2" rx="10"/>
    <text x="300" y="115" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Graph Structure
    </text>
    
    <!-- Graph G = (V, E) -->
    <text x="80" y="155" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#34495e">
      G = (V, E)
    </text>
    
    <!-- Nodes -->
    <circle cx="200" cy="230" r="35" fill="#3498db" stroke="#2c3e50" stroke-width="2"/>
    <text x="200" y="238" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">X₁</text>
    
    <circle cx="350" cy="230" r="35" fill="#3498db" stroke="#2c3e50" stroke-width="2"/>
    <text x="350" y="238" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">X₂</text>
    
    <circle cx="200" cy="360" r="35" fill="#3498db" stroke="#2c3e50" stroke-width="2"/>
    <text x="200" y="368" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">X₃</text>
    
    <circle cx="350" cy="360" r="35" fill="#3498db" stroke="#2c3e50" stroke-width="2"/>
    <text x="350" y="368" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">X₄</text>
    
    <circle cx="275" cy="470" r="35" fill="#3498db" stroke="#2c3e50" stroke-width="2"/>
    <text x="275" y="478" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">X₅</text>
    
    <!-- Edges -->
    <line x1="223" y1="253" x2="327" y2="253" stroke="#2c3e50" stroke-width="3"/>
    <line x1="200" y1="265" x2="200" y2="325" stroke="#2c3e50" stroke-width="3"/>
    <line x1="350" y1="265" x2="350" y2="325" stroke="#2c3e50" stroke-width="3"/>
    <line x1="218" y1="381" x2="257" y2="451" stroke="#2c3e50" stroke-width="3"/>
    <line x1="332" y1="381" x2="293" y2="451" stroke="#2c3e50" stroke-width="3"/>
    <line x1="223" y1="360" x2="327" y2="360" stroke="#2c3e50" stroke-width="3"/>
    
    <!-- Labels -->
    <text x="100" y="560" font-family="Arial, sans-serif" font-size="15" fill="#34495e">
      • Nodes (V): Random variables
    </text>
    <text x="100" y="590" font-family="Arial, sans-serif" font-size="15" fill="#34495e">
      • Edges (E): Direct dependencies
    </text>
    <text x="100" y="620" font-family="Arial, sans-serif" font-size="15" fill="#34495e">
      • No edge: Potential conditional independence
    </text>
  </g>
  
  <!-- Right Section: Properties -->
  <g id="properties">
    <rect x="650" y="80" width="500" height="560" fill="#f0e8f8" stroke="#9b59b6" stroke-width="2" rx="10"/>
    <text x="900" y="115" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Key Properties
    </text>
    
    <!-- Markov Property -->
    <rect x="680" y="140" width="440" height="90" fill="#ffffff" stroke="#9b59b6" stroke-width="2" rx="5"/>
    <text x="900" y="165" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#8e44ad">
      Markov Property
    </text>
    <text x="690" y="190" font-family="Arial, sans-serif" font-size="14" fill="#34495e">
      A node is conditionally independent of all
    </text>
    <text x="690" y="210" font-family="Arial, sans-serif" font-size="14" fill="#34495e">
      other nodes given its neighbors
    </text>
    
    <!-- Joint Distribution -->
    <rect x="680" y="250" width="440" height="110" fill="#ffffff" stroke="#9b59b6" stroke-width="2" rx="5"/>
    <text x="900" y="275" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#8e44ad">
      Joint Distribution
    </text>
    <text x="900" y="305" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#2c3e50">
      P(X) = (1/Z) ∏ ψ_c(X_c)
    </text>
    <text x="690" y="335" font-family="Arial, sans-serif" font-size="13" fill="#34495e">
      ψ_c: potential functions over cliques
    </text>
    <text x="690" y="352" font-family="Arial, sans-serif" font-size="13" fill="#34495e">
      Z: partition function (normalization)
    </text>
    
    <!-- Symmetric Relations -->
    <rect x="680" y="380" width="440" height="70" fill="#ffffff" stroke="#9b59b6" stroke-width="2" rx="5"/>
    <text x="900" y="405" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#8e44ad">
      Symmetric Relationships
    </text>
    <text x="690" y="430" font-family="Arial, sans-serif" font-size="14" fill="#34495e">
      No causal direction between variables
    </text>
    
    <!-- Applications -->
    <rect x="680" y="470" width="440" height="150" fill="#ffffff" stroke="#9b59b6" stroke-width="2" rx="5"/>
    <text x="900" y="495" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#8e44ad">
      Common Applications
    </text>
    <text x="690" y="520" font-family="Arial, sans-serif" font-size="14" fill="#34495e">
      • Image segmentation and denoising
    </text>
    <text x="690" y="545" font-family="Arial, sans-serif" font-size="14" fill="#34495e">
      • Social network modeling
    </text>
    <text x="690" y="570" font-family="Arial, sans-serif" font-size="14" fill="#34495e">
      • Spatial statistics
    </text>
    <text x="690" y="595" font-family="Arial, sans-serif" font-size="14" fill="#34495e">
      • Natural language processing
    </text>
  </g>
  
  <!-- Arrow connecting sections -->
  <path d="M 570 320 L 630 320" stroke="#e74c3c" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#e74c3c"/>
    </marker>
  </defs>
  
  <!-- Footer -->
  <text x="600" y="680" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#7f8c8d" font-style="italic">
    Also known as: Markov Random Fields (MRF) or Markov Networks
  </text>
</svg>