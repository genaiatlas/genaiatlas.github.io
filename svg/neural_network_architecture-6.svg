<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="neuronGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e3f2fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1976d2;stop-opacity:0.8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1565c0">
    Deep Neural Network Architecture
  </text>
  
  <!-- Input Layer -->
  <g id="input-layer">
    <text x="100" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1976d2">Input Layer</text>
    
    <circle cx="100" cy="120" r="20" fill="url(#neuronGradient)" stroke="#1976d2" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="100" cy="180" r="20" fill="url(#neuronGradient)" stroke="#1976d2" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="100" cy="240" r="20" fill="url(#neuronGradient)" stroke="#1976d2" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="100" cy="300" r="20" fill="url(#neuronGradient)" stroke="#1976d2" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="100" cy="360" r="20" fill="url(#neuronGradient)" stroke="#1976d2" stroke-width="2" filter="url(#shadow)"/>
    
    <text x="100" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">n inputs</text>
  </g>
  
  <!-- Hidden Layer 1 -->
  <g id="hidden1">
    <text x="250" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ff9800">Hidden Layer 1</text>
    
    <circle cx="250" cy="100" r="20" fill="#fff3e0" stroke="#ff9800" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="250" cy="150" r="20" fill="#fff3e0" stroke="#ff9800" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="250" cy="200" r="20" fill="#fff3e0" stroke="#ff9800" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="250" cy="250" r="20" fill="#fff3e0" stroke="#ff9800" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="250" cy="300" r="20" fill="#fff3e0" stroke="#ff9800" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="250" cy="350" r="20" fill="#fff3e0" stroke="#ff9800" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="250" cy="400" r="20" fill="#fff3e0" stroke="#ff9800" stroke-width="2" filter="url(#shadow)"/>
    
    <text x="190" y="455" font-family="Arial, sans-serif" font-size="10" fill="#ff9800">σ(Wx + b)</text>
  </g>
  
  <!-- Hidden Layer 2 -->
  <g id="hidden2">
    <text x="400" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#e91e63">Hidden Layer 2</text>
    
    <circle cx="400" cy="120" r="20" fill="#fce4ec" stroke="#e91e63" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="400" cy="180" r="20" fill="#fce4ec" stroke="#e91e63" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="400" cy="240" r="20" fill="#fce4ec" stroke="#e91e63" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="400" cy="300" r="20" fill="#fce4ec" stroke="#e91e63" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="400" cy="360" r="20" fill="#fce4ec" stroke="#e91e63" stroke-width="2" filter="url(#shadow)"/>
    
    <text x="340" y="455" font-family="Arial, sans-serif" font-size="10" fill="#e91e63">σ(Wx + b)</text>
  </g>
  
  <!-- Hidden Layer 3 -->
  <g id="hidden3">
    <text x="550" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#9c27b0">Hidden Layer 3</text>
    
    <circle cx="550" cy="150" r="20" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="550" cy="210" r="20" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="550" cy="270" r="20" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="550" cy="330" r="20" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2" filter="url(#shadow)"/>
    
    <text x="490" y="455" font-family="Arial, sans-serif" font-size="10" fill="#9c27b0">σ(Wx + b)</text>
  </g>
  
  <!-- Output Layer -->
  <g id="output">
    <text x="700" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#4caf50">Output Layer</text>
    
    <circle cx="700" cy="180" r="20" fill="#e8f5e8" stroke="#4caf50" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="700" cy="240" r="20" fill="#e8f5e8" stroke="#4caf50" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="700" cy="300" r="20" fill="#e8f5e8" stroke="#4caf50" stroke-width="2" filter="url(#shadow)"/>
    
    <text x="700" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">m outputs</text>
    <text x="640" y="455" font-family="Arial, sans-serif" font-size="10" fill="#4caf50">σ(Wx + b)</text>
  </g>
  
  <!-- Connection weights visualization -->
  <g stroke="#666" stroke-width="1" opacity="0.6">
    <!-- Input to Hidden 1 connections -->
    <line x1="120" y1="120" x2="230" y2="100"/>
    <line x1="120" y1="120" x2="230" y2="150"/>
    <line x1="120" y1="180" x2="230" y2="200"/>
    <line x1="120" y1="240" x2="230" y2="250"/>
    <line x1="120" y1="300" x2="230" y2="300"/>
    <line x1="120" y1="360" x2="230" y2="350"/>
    
    <!-- Hidden 1 to Hidden 2 connections (sample) -->
    <line x1="270" y1="150" x2="380" y2="120"/>
    <line x1="270" y1="200" x2="380" y2="180"/>
    <line x1="270" y1="250" x2="380" y2="240"/>
    <line x1="270" y1="300" x2="380" y2="300"/>
    <line x1="270" y1="350" x2="380" y2="360"/>
    
    <!-- Hidden 2 to Hidden 3 connections -->
    <line x1="420" y1="180" x2="530" y2="150"/>
    <line x1="420" y1="240" x2="530" y2="210"/>
    <line x1="420" y1="300" x2="530" y2="270"/>
    <line x1="420" y1="360" x2="530" y2="330"/>
    
    <!-- Hidden 3 to Output connections -->
    <line x1="570" y1="210" x2="680" y2="180"/>
    <line x1="570" y1="270" x2="680" y2="240"/>
    <line x1="570" y1="330" x2="680" y2="300"/>
  </g>
  
  <!-- Bias nodes -->
  <g fill="#ffeb3b" stroke="#f57f17" stroke-width="2">
    <circle cx="180" cy="450" r="12"/>
    <circle cx="330" cy="450" r="12"/>
    <circle cx="480" cy="450" r="12"/>
    <circle cx="630" cy="450" r="12"/>
    <text x="450" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#f57f17">Bias Terms (b)</text>
  </g>
  
  <!-- Mathematical representation box -->
  <rect x="50" y="520" width="800" height="150" rx="10" fill="#f8f9fa" stroke="#666" stroke-width="2"/>
  <text x="450" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#333">
    Layer Computations
  </text>
  
  <g font-family="Arial, sans-serif" font-size="13" fill="#333">
    <text x="70" y="575">Each neuron computes: <tspan font-weight="bold" fill="#1976d2">a = σ(z)</tspan> where <tspan font-weight="bold" fill="#1976d2">z = Wx + b</tspan></text>
    <text x="70" y="600">• <tspan font-weight="bold">W:</tspan> Weight matrix connecting layers</text>
    <text x="70" y="620">• <tspan font-weight="bold">x:</tspan> Input vector from previous layer</text>
    <text x="70" y="640">• <tspan font-weight="bold">b:</tspan> Bias vector (learnable offset)</text>
    <text x="70" y="660">• <tspan font-weight="bold">σ:</tspan> Activation function (sigmoid, ReLU, etc.)</text>
    
    <text x="450" y="600">Network depth enables hierarchical feature learning:</text>
    <text x="450" y="620">• Early layers: Low-level features</text>
    <text x="450" y="640">• Middle layers: Mid-level combinations</text>
    <text x="450" y="660">• Final layers: High-level abstractions</text>
  </g>
  
  <!-- Arrow showing information flow -->
  <defs>
    <marker id="flowArrow" markerWidth="12" markerHeight="8" 
            refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#1976d2" />
    </marker>
  </defs>
  <path d="M 50 280 Q 200 250 350 280 Q 500 250 650 280 Q 750 250 850 280" 
        stroke="#1976d2" stroke-width="3" fill="none" marker-end="url(#flowArrow)" opacity="0.7"/>
  <text x="450" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1976d2">
    Information Flow Direction
  </text>
</svg>