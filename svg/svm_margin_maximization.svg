<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">Support Vector Machine: Maximum Margin Classification</text>
  
  <!-- Coordinate axes -->
  <g>
    <!-- X-axis -->
    <line x1="80" y1="500" x2="720" y2="500" stroke="#666" stroke-width="1"/>
    <text x="740" y="505" font-family="Arial, sans-serif" font-size="12" fill="#666">x₁</text>
    
    <!-- Y-axis -->
    <line x1="80" y1="80" x2="80" y2="500" stroke="#666" stroke-width="1"/>
    <text x="75" y="70" font-family="Arial, sans-serif" font-size="12" fill="#666">x₂</text>
  </g>
  
  <!-- Positive class points (circles) -->
  <g>
    <circle cx="150" cy="150" r="6" fill="#4caf50" stroke="#2e7d32" stroke-width="2"/>
    <circle cx="200" cy="120" r="6" fill="#4caf50" stroke="#2e7d32" stroke-width="2"/>
    <circle cx="180" cy="180" r="6" fill="#4caf50" stroke="#2e7d32" stroke-width="2"/>
    <circle cx="220" cy="140" r="6" fill="#4caf50" stroke="#2e7d32" stroke-width="2"/>
    <circle cx="160" cy="200" r="6" fill="#4caf50" stroke="#2e7d32" stroke-width="2"/>
    <circle cx="240" cy="160" r="6" fill="#4caf50" stroke="#2e7d32" stroke-width="2"/>
    <circle cx="190" cy="220" r="6" fill="#4caf50" stroke="#2e7d32" stroke-width="2"/>
  </g>
  
  <!-- Negative class points (squares) -->
  <g>
    <rect x="344" y="264" width="12" height="12" fill="#f44336" stroke="#c62828" stroke-width="2"/>
    <rect x="384" y="244" width="12" height="12" fill="#f44336" stroke="#c62828" stroke-width="2"/>
    <rect x="404" y="284" width="12" height="12" fill="#f44336" stroke="#c62828" stroke-width="2"/>
    <rect x="434" y="264" width="12" height="12" fill="#f44336" stroke="#c62828" stroke-width="2"/>
    <rect x="364" y="314" width="12" height="12" fill="#f44336" stroke="#c62828" stroke-width="2"/>
    <rect x="414" y="314" width="12" height="12" fill="#f44336" stroke="#c62828" stroke-width="2"/>
    <rect x="454" y="294" width="12" height="12" fill="#f44336" stroke="#c62828" stroke-width="2"/>
  </g>
  
  <!-- Decision boundary (main hyperplane) -->
  <line x1="300" y1="100" x2="300" y2="400" stroke="#1976d2" stroke-width="4"/>
  
  <!-- Margin boundaries -->
  <line x1="250" y1="100" x2="250" y2="400" stroke="#ff9800" stroke-width="2" stroke-dasharray="8,4"/>
  <line x1="350" y1="100" x2="350" y2="400" stroke="#ff9800" stroke-width="2" stroke-dasharray="8,4"/>
  
  <!-- Support vectors (highlighted) -->
  <g>
    <!-- Positive support vector -->
    <circle cx="240" cy="160" r="10" fill="none" stroke="#ff9800" stroke-width="3"/>
    
    <!-- Negative support vector -->
    <rect x="344" y="264" width="12" height="12" fill="none" stroke="#ff9800" stroke-width="3"/>
  </g>
  
  <!-- Margin annotation -->
  <g>
    <!-- Margin lines -->
    <line x1="250" y1="250" x2="350" y2="250" stroke="#9c27b0" stroke-width="2"/>
    <path d="M 245 250 L 255 245 L 255 255 Z" fill="#9c27b0"/>
    <path d="M 355 250 L 345 245 L 345 255 Z" fill="#9c27b0"/>
    
    <!-- Margin label -->
    <text x="300" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#9c27b0">Margin = 2/||w||</text>
  </g>
  
  <!-- Weight vector -->
  <g>
    <!-- Vector arrow -->
    <line x1="300" y1="350" x2="350" y2="330" stroke="#e91e63" stroke-width="3" marker-end="url(#arrowhead)"/>
    <text x="360" y="325" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e91e63">w</text>
    
    <!-- Perpendicular symbol -->
    <rect x="330" y="335" width="8" height="8" fill="none" stroke="#e91e63" stroke-width="1"/>
  </g>
  
  <!-- Mathematical formulation box -->
  <g>
    <rect x="500" y="100" width="280" height="140" rx="10" fill="#e8f5e8" stroke="#388e3c" stroke-width="2"/>
    <text x="640" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#388e3c">SVM Optimization</text>
    
    <text x="520" y="150" font-family="Arial, sans-serif" font-size="12" fill="#388e3c">Maximize: margin = 2/||w||</text>
    <text x="520" y="170" font-family="Arial, sans-serif" font-size="12" fill="#388e3c">⟺ Minimize: ½||w||²</text>
    
    <text x="520" y="195" font-family="Arial, sans-serif" font-size="11" fill="#388e3c">Subject to:</text>
    <text x="520" y="210" font-family="Arial, sans-serif" font-size="11" fill="#388e3c">yᵢ(w·xᵢ + b) ≥ 1 ∀i</text>
    
    <text x="520" y="230" font-family="Arial, sans-serif" font-size="10" fill="#388e3c">where yᵢ ∈ {-1, +1}</text>
  </g>
  
  <!-- Decision regions -->
  <g>
    <rect x="100" y="380" width="140" height="30" rx="5" fill="#c8e6c9" stroke="#4caf50" stroke-width="1"/>
    <text x="170" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2e7d32">Positive Region</text>
    
    <rect x="460" y="380" width="140" height="30" rx="5" fill="#ffcdd2" stroke="#f44336" stroke-width="1"/>
    <text x="530" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#c62828">Negative Region</text>
  </g>
  
  <!-- Key concepts box -->
  <g>
    <rect x="500" y="280" width="280" height="100" rx="10" fill="#fff3e0" stroke="#f57c00" stroke-width="2"/>
    <text x="640" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f57c00">Key Concepts</text>
    
    <text x="520" y="325" font-family="Arial, sans-serif" font-size="11" fill="#f57c00">• Support Vectors: Points on margin</text>
    <text x="520" y="340" font-family="Arial, sans-serif" font-size="11" fill="#f57c00">• Margin: Distance between classes</text>
    <text x="520" y="355" font-family="Arial, sans-serif" font-size="11" fill="#f57c00">• Decision Boundary: w·x + b = 0</text>
    <text x="520" y="370" font-family="Arial, sans-serif" font-size="11" fill="#f57c00">• Optimal: Maximum margin</text>
  </g>
  
  <!-- Labels for classes -->
  <text x="180" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4caf50">Class +1</text>
  <text x="420" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f44336">Class -1</text>
  
  <!-- Hyperplane equation -->
  <text x="300" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1976d2">w·x + b = 0</text>
  
  <!-- Distance annotations -->
  <g>
    <text x="275" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#ff9800">w·x + b = -1</text>
    <text x="325" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#ff9800">w·x + b = +1</text>
  </g>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e91e63"/>
    </marker>
  </defs>
</svg>