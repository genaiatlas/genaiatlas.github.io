<svg viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1400" height="900" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="700" y="50" font-size="32" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Interactive Development Spectrum
  </text>
  <text x="700" y="85" font-size="16" text-anchor="middle" fill="#666">
    From Basic Completion to Advanced Agentic Coding
  </text>
  
  <!-- Spectrum Line -->
  <defs>
    <linearGradient id="spectrumGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#9b59b6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27ae60;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect x="150" y="130" width="1100" height="20" fill="url(#spectrumGradient)" rx="10"/>
  
  <!-- Modality 1: Completion -->
  <g transform="translate(200, 200)">
    <rect x="-75" y="0" width="150" height="120" fill="#3498db" rx="8" opacity="0.9"/>
    <text x="0" y="30" font-size="18" font-weight="bold" text-anchor="middle" fill="white">
      Completion
    </text>
    <text x="0" y="55" font-size="12" text-anchor="middle" fill="white">
      Inline suggestions
    </text>
    <text x="0" y="75" font-size="12" text-anchor="middle" fill="white">
      Boilerplate code
    </text>
    <text x="0" y="95" font-size="12" text-anchor="middle" fill="white">
      Flow maintenance
    </text>
  </g>
  <line x1="200" y1="160" x2="200" y2="200" stroke="#3498db" stroke-width="3"/>
  
  <!-- Modality 2: Inline Editing -->
  <g transform="translate(400, 360)">
    <rect x="-75" y="0" width="150" height="120" fill="#9b59b6" rx="8" opacity="0.9"/>
    <text x="0" y="30" font-size="18" font-weight="bold" text-anchor="middle" fill="white">
      Inline Editing
    </text>
    <text x="0" y="55" font-size="12" text-anchor="middle" fill="white">
      Selected region
    </text>
    <text x="0" y="75" font-size="12" text-anchor="middle" fill="white">
      Direct prompts
    </text>
    <text x="0" y="95" font-size="12" text-anchor="middle" fill="white">
      Local refactors
    </text>
  </g>
  <line x1="400" y1="160" x2="400" y2="360" stroke="#9b59b6" stroke-width="3"/>
  
  <!-- Modality 3: Chat Q&A -->
  <g transform="translate(700, 200)">
    <rect x="-75" y="0" width="150" height="120" fill="#e74c3c" rx="8" opacity="0.9"/>
    <text x="0" y="30" font-size="18" font-weight="bold" text-anchor="middle" fill="white">
      Chat Q&amp;A
    </text>
    <text x="0" y="55" font-size="12" text-anchor="middle" fill="white">
      Conversational
    </text>
    <text x="0" y="75" font-size="12" text-anchor="middle" fill="white">
      Discovery &amp; learning
    </text>
    <text x="0" y="95" font-size="12" text-anchor="middle" fill="white">
      Debugging
    </text>
  </g>
  <line x1="700" y1="160" x2="700" y2="200" stroke="#e74c3c" stroke-width="3"/>
  
  <!-- Modality 4: Chat-Driven Editing -->
  <g transform="translate(1000, 360)">
    <rect x="-75" y="0" width="150" height="120" fill="#f39c12" rx="8" opacity="0.9"/>
    <text x="0" y="30" font-size="18" font-weight="bold" text-anchor="middle" fill="white">
      Chat-Driven
    </text>
    <text x="0" y="50" font-size="18" font-weight="bold" text-anchor="middle" fill="white">
      Editing
    </text>
    <text x="0" y="75" font-size="12" text-anchor="middle" fill="white">
      Multi-file changes
    </text>
    <text x="0" y="95" font-size="12" text-anchor="middle" fill="white">
      Precise control
    </text>
  </g>
  <line x1="1000" y1="160" x2="1000" y2="360" stroke="#f39c12" stroke-width="3"/>
  
  <!-- Modality 5: Agentic Coding -->
  <g transform="translate(1200, 200)">
    <rect x="-75" y="0" width="150" height="140" fill="#27ae60" rx="8" opacity="0.9"/>
    <text x="0" y="30" font-size="18" font-weight="bold" text-anchor="middle" fill="white">
      Agentic
    </text>
    <text x="0" y="50" font-size="18" font-weight="bold" text-anchor="middle" fill="white">
      Coding
    </text>
    <text x="0" y="75" font-size="12" text-anchor="middle" fill="white">
      Multi-step tasks
    </text>
    <text x="0" y="95" font-size="12" text-anchor="middle" fill="white">
      Tool usage
    </text>
    <text x="0" y="115" font-size="12" text-anchor="middle" fill="white">
      Autonomous
    </text>
  </g>
  <line x1="1200" y1="160" x2="1200" y2="200" stroke="#27ae60" stroke-width="3"/>
  
  <!-- Complexity Arrow -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#555" />
    </marker>
  </defs>
  <line x1="150" y1="580" x2="1230" y2="580" stroke="#555" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="700" y="620" font-size="18" font-weight="bold" text-anchor="middle" fill="#555">
    Increasing Complexity &amp; Autonomy →
  </text>
  
  <!-- Characteristics boxes -->
  <g transform="translate(150, 680)">
    <rect x="0" y="0" width="330" height="180" fill="#ecf0f1" rx="8" stroke="#bdc3c7" stroke-width="2"/>
    <text x="165" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Low Autonomy
    </text>
    <text x="20" y="60" font-size="13" fill="#34495e">• Immediate feedback</text>
    <text x="20" y="85" font-size="13" fill="#34495e">• Manual control</text>
    <text x="20" y="110" font-size="13" fill="#34495e">• Limited scope</text>
    <text x="20" y="135" font-size="13" fill="#34495e">• Fast iteration</text>
    <text x="20" y="160" font-size="13" fill="#34495e">• Developer-driven</text>
  </g>
  
  <g transform="translate(920, 680)">
    <rect x="0" y="0" width="330" height="180" fill="#d5f4e6" rx="8" stroke="#27ae60" stroke-width="2"/>
    <text x="165" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#27ae60">
      High Autonomy
    </text>
    <text x="20" y="60" font-size="13" fill="#229954">• Multi-step execution</text>
    <text x="20" y="85" font-size="13" fill="#229954">• Tool integration</text>
    <text x="20" y="110" font-size="13" fill="#229954">• Complex planning</text>
    <text x="20" y="135" font-size="13" fill="#229954">• Self-correction</text>
    <text x="20" y="160" font-size="13" fill="#229954">• Agent-driven</text>
  </g>
  
  <!-- T-shaped strategy note -->
  <g transform="translate(520, 720)">
    <rect x="0" y="0" width="360" height="100" fill="#fff3cd" rx="8" stroke="#ffc107" stroke-width="2"/>
    <text x="180" y="30" font-size="15" font-weight="bold" text-anchor="middle" fill="#856404">
      🎓 T-Shaped Mastery Strategy
    </text>
    <text x="180" y="55" font-size="12" text-anchor="middle" fill="#856404">
      Deep expertise in one primary mode
    </text>
    <text x="180" y="75" font-size="12" text-anchor="middle" fill="#856404">
      + Broad proficiency across all others
    </text>
  </g>
</svg>