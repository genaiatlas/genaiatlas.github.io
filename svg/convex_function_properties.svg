<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .axis { stroke: #333; stroke-width: 2; fill: none; }
      .curve { stroke: #2196f3; stroke-width: 3; fill: none; }
      .line { stroke: #e91e63; stroke-width: 2; fill: none; stroke-dasharray: 5,5; }
      .point { fill: #e91e63; stroke: #c2185b; stroke-width: 2; }
      .text { font-family: 'Segoe UI', sans-serif; font-size: 14px; fill: #333; }
      .title { font-family: 'Segoe UI', sans-serif; font-size: 18px; font-weight: bold; fill: #1976d2; }
      .label { font-family: 'Segoe UI', sans-serif; font-size: 12px; fill: #666; }
      .formula { font-family: 'Segoe UI', sans-serif; font-size: 16px; fill: #1976d2; font-weight: bold; }
      .gradient-arrow { stroke: #ff9800; stroke-width: 3; fill: #ff9800; }
    </style>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" class="title" text-anchor="middle">Convex Function Properties: f(x) = x²</text>
  
  <!-- Left diagram: Convex curve with line test -->
  <g id="convex-diagram">
    <!-- Axes -->
    <line x1="50" y1="320" x2="350" y2="320" class="axis"/>
    <line x1="200" y1="150" x2="200" y2="370" class="axis"/>
    
    <!-- Axis labels -->
    <text x="360" y="325" class="label">x</text>
    <text x="185" y="140" class="label">y</text>
    <text x="190" y="340" class="label">0</text>
    
    <!-- Convex curve (parabola) -->
    <path d="M 80 300 Q 200 160 320 300" class="curve"/>
    
    <!-- Function label -->
    <text x="250" y="180" class="formula">f(x) = x²</text>
    
    <!-- Two points on curve -->
    <circle cx="120" cy="260" r="4" class="point"/>
    <circle cx="280" cy="260" r="4" class="point"/>
    
    <!-- Line between points -->
    <line x1="120" y1="260" x2="280" y2="260" class="line"/>
    
    <!-- Property annotation -->
    <text x="50" y="400" class="text">Line lies above curve</text>
    <text x="50" y="415" class="text">(Convexity property)</text>
  </g>
  
  <!-- Right diagram: Gradient descent visualization -->
  <g id="gradient-descent">
    <!-- Axes -->
    <line x1="450" y1="320" x2="750" y2="320" class="axis"/>
    <line x1="600" y1="150" x2="600" y2="370" class="axis"/>
    
    <!-- Axis labels -->
    <text x="760" y="325" class="label">x</text>
    <text x="585" y="140" class="label">y</text>
    <text x="590" y="340" class="label">0</text>
    
    <!-- Convex curve -->
    <path d="M 480 300 Q 600 160 720 300" class="curve"/>
    
    <!-- Gradient descent points -->
    <circle cx="520" cy="280" r="4" class="point"/>
    <circle cx="560" cy="220" r="4" class="point"/>
    <circle cx="580" cy="190" r="4" class="point"/>
    <circle cx="600" cy="160" r="4" class="point"/>
    
    <!-- Gradient arrows -->
    <defs>
      <marker id="orange-arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#ff9800"/>
      </marker>
    </defs>
    
    <line x1="520" y1="280" x2="545" y2="240" class="gradient-arrow" marker-end="url(#orange-arrow)"/>
    <line x1="560" y1="220" x2="575" y2="200" class="gradient-arrow" marker-end="url(#orange-arrow)"/>
    <line x1="580" y1="190" x2="590" y2="175" class="gradient-arrow" marker-end="url(#orange-arrow)"/>
    
    <!-- Global minimum indicator -->
    <text x="580" y="145" class="text" text-anchor="middle">Global</text>
    <text x="580" y="158" class="text" text-anchor="middle">Minimum</text>
  </g>
  
  <!-- Mathematical properties box -->
  <rect x="50" y="430" width="700" height="80" fill="#f8f9fa" stroke="#dee2e6" rx="5"/>
  <text x="60" y="450" class="title">Mathematical Properties:</text>
  <text x="60" y="470" class="text">1. Geometric: Line between any two points lies above the curve</text>
  <text x="60" y="485" class="text">2. Calculus: Second derivative f''(x) ≥ 0 for all x</text>
  <text x="60" y="500" class="text">3. Optimization: Local minimum = Global minimum (Guaranteed convergence)</text>
  
  <!-- Derivative calculations -->
  <rect x="420" y="360" width="330" height="60" fill="#e3f2fd" stroke="#2196f3" rx="5"/>
  <text x="430" y="380" class="text">For f(x) = x²:</text>
  <text x="430" y="395" class="text">f'(x) = 2x</text>
  <text x="430" y="410" class="text">f''(x) = 2 > 0 ✓ (Always positive)</text>
</svg>