<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="700" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="500" y="40" font-size="24" font-weight="bold" text-anchor="middle" fill="#1a1a2e">
    Software Development Lifecycle with AI Integration
  </text>
  
  <!-- Central Circle - AI Assistant -->
  <circle cx="500" cy="350" r="80" fill="#4a90e2" opacity="0.2"/>
  <circle cx="500" cy="350" r="60" fill="#4a90e2"/>
  <text x="500" y="345" font-size="18" font-weight="bold" text-anchor="middle" fill="white">AI</text>
  <text x="500" y="365" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Assistant</text>
  
  <!-- Phase 1: Planning & Design -->
  <g transform="translate(200, 120)">
    <rect x="0" y="0" width="180" height="100" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
    <text x="90" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a1a2e">Planning &amp; Design</text>
    <text x="90" y="55" font-size="12" text-anchor="middle" fill="#555">• Architecture Review</text>
    <text x="90" y="75" font-size="12" text-anchor="middle" fill="#555">• Design Validation</text>
    <text x="90" y="95" font-size="12" text-anchor="middle" fill="#555">• Pattern Suggestions</text>
  </g>
  
  <!-- Phase 2: Development -->
  <g transform="translate(620, 120)">
    <rect x="0" y="0" width="180" height="100" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
    <text x="90" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a1a2e">Development</text>
    <text x="90" y="55" font-size="12" text-anchor="middle" fill="#555">• Code Generation</text>
    <text x="90" y="75" font-size="12" text-anchor="middle" fill="#555">• Refactoring</text>
    <text x="90" y="95" font-size="12" text-anchor="middle" fill="#555">• Documentation</text>
  </g>
  
  <!-- Phase 3: Code Review -->
  <g transform="translate(750, 400)">
    <rect x="0" y="0" width="180" height="100" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
    <text x="90" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a1a2e">Code Review</text>
    <text x="90" y="55" font-size="12" text-anchor="middle" fill="#555">• Automated Review</text>
    <text x="90" y="75" font-size="12" text-anchor="middle" fill="#555">• Bug Detection</text>
    <text x="90" y="95" font-size="12" text-anchor="middle" fill="#555">• Style Checking</text>
  </g>
  
  <!-- Phase 4: Testing -->
  <g transform="translate(620, 550)">
    <rect x="0" y="0" width="180" height="100" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
    <text x="90" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a1a2e">Testing</text>
    <text x="90" y="55" font-size="12" text-anchor="middle" fill="#555">• Test Generation</text>
    <text x="90" y="75" font-size="12" text-anchor="middle" fill="#555">• Test Analysis</text>
    <text x="90" y="95" font-size="12" text-anchor="middle" fill="#555">• Coverage Review</text>
  </g>
  
  <!-- Phase 5: CI/CD -->
  <g transform="translate(200, 550)">
    <rect x="0" y="0" width="180" height="100" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
    <text x="90" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a1a2e">CI/CD</text>
    <text x="90" y="55" font-size="12" text-anchor="middle" fill="#555">• Build Debugging</text>
    <text x="90" y="75" font-size="12" text-anchor="middle" fill="#555">• Log Analysis</text>
    <text x="90" y="95" font-size="12" text-anchor="middle" fill="#555">• Auto-fixing</text>
  </g>
  
  <!-- Phase 6: Git Operations -->
  <g transform="translate(70, 400)">
    <rect x="0" y="0" width="180" height="100" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
    <text x="90" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a1a2e">Git Operations</text>
    <text x="90" y="55" font-size="12" text-anchor="middle" fill="#555">• Branch Management</text>
    <text x="90" y="75" font-size="12" text-anchor="middle" fill="#555">• PR Creation</text>
    <text x="90" y="95" font-size="12" text-anchor="middle" fill="#555">• Commit Messages</text>
  </g>
  
  <!-- Arrows from AI to each phase -->
  <!-- To Planning -->
  <path d="M 440 300 L 350 200" stroke="#4a90e2" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <!-- To Development -->
  <path d="M 560 300 L 650 220" stroke="#4a90e2" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <!-- To Code Review -->
  <path d="M 570 360 L 750 440" stroke="#4a90e2" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <!-- To Testing -->
  <path d="M 540 400 L 640 570" stroke="#4a90e2" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <!-- To CI/CD -->
  <path d="M 460 400 L 360 570" stroke="#4a90e2" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <!-- To Git Operations -->
  <path d="M 430 360 L 250 460" stroke="#4a90e2" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#4a90e2"/>
    </marker>
  </defs>
  
  <!-- Time Savings Label -->
  <rect x="350" y="680" width="300" height="15" rx="3" fill="#27ae60"/>
  <text x="500" y="692" font-size="12" font-weight="bold" text-anchor="middle" fill="white">
    30-60% Time Savings Across SDLC Phases
  </text>
</svg>