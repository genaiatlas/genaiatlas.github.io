<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', sans-serif; font-size: 18px; font-weight: bold; fill: #2c3e50; }
      .header { font-family: 'Segoe UI', sans-serif; font-size: 14px; font-weight: bold; fill: #34495e; }
      .text { font-family: 'Segoe UI', sans-serif; font-size: 11px; fill: #2c3e50; }
      .small-text { font-family: 'Segoe UI', sans-serif; font-size: 9px; fill: #7f8c8d; }
      .math { font-family: 'Times New Roman', serif; font-size: 12px; fill: #8e44ad; }
      .box { fill: #ecf0f1; stroke: #34495e; stroke-width: 2; }
      .formula-box { fill: #fff2cc; stroke: #d6b656; stroke-width: 2; }
      .example-box { fill: #d5e8d4; stroke: #82b366; stroke-width: 2; }
      .assumption-box { fill: #ffe6cc; stroke: #d79b00; stroke-width: 2; }
      .decision-box { fill: #f8cecc; stroke: #b85450; stroke-width: 2; }
    </style>
  </defs>

  <!-- Title -->
  <text x="400" y="25" class="title" text-anchor="middle">Test for One Population Mean</text>

  <!-- Purpose -->
  <rect x="50" y="40" width="700" height="40" class="box" rx="8"/>
  <text x="400" y="60" class="header" text-anchor="middle">Purpose: Test whether a population mean equals a specific value</text>

  <!-- Hypotheses -->
  <rect x="50" y="100" width="220" height="120" class="formula-box" rx="8"/>
  <text x="160" y="120" class="header" text-anchor="middle">Hypotheses</text>
  <text x="70" y="140" class="math">H₀: μ = μ₀</text>
  <text x="70" y="160" class="text">Two-tailed:</text>
  <text x="90" y="175" class="math">H₁: μ ≠ μ₀</text>
  <text x="70" y="195" class="text">One-tailed:</text>
  <text x="90" y="210" class="math">H₁: μ &gt; μ₀  or  H₁: μ &lt; μ₀</text>

  <!-- Test Statistics -->
  <rect x="290" y="100" width="460" height="120" class="formula-box" rx="8"/>
  <text x="520" y="120" class="header" text-anchor="middle">Test Statistics</text>
  
  <text x="310" y="140" class="text">When population standard deviation σ is known (Z-test):</text>
  <text x="330" y="155" class="math">Z = (X̄ - μ₀)/(σ/√n)</text>
  
  <text x="310" y="175" class="text">When population standard deviation σ is unknown (t-test):</text>
  <text x="330" y="190" class="math">t = (X̄ - μ₀)/(s/√n)     with df = n - 1</text>
  
  <text x="310" y="210" class="small-text">X̄ = sample mean, s = sample standard deviation, n = sample size</text>

  <!-- Assumptions -->
  <rect x="50" y="240" width="350" height="100" class="assumption-box" rx="8"/>
  <text x="225" y="260" class="header" text-anchor="middle">Assumptions</text>
  <text x="70" y="280" class="text">✓ Random sampling from population</text>
  <text x="70" y="295" class="text">✓ Independent observations</text>
  <text x="70" y="310" class="text">✓ Normal population distribution OR</text>
  <text x="70" y="325" class="text">✓ Large sample size (n ≥ 30) by CLT</text>

  <!-- Decision Rules -->
  <rect x="420" y="240" width="330" height="100" class="decision-box" rx="8"/>
  <text x="585" y="260" class="header" text-anchor="middle">Decision Rules</text>
  <text x="440" y="280" class="text">Two-tailed test (α = 0.05):</text>
  <text x="440" y="295" class="small-text">Reject H₀ if |test stat| &gt; critical value</text>
  <text x="440" y="310" class="text">One-tailed test:</text>
  <text x="440" y="325" class="small-text">Reject H₀ if test stat &gt; critical (right) or &lt; -critical (left)</text>

  <!-- Example -->
  <rect x="50" y="360" width="700" height="120" class="example-box" rx="8"/>
  <text x="400" y="380" class="header" text-anchor="middle">Example: Testing Average Height</text>
  
  <text x="70" y="400" class="text">Question: Is the average height of college students different from 170 cm?</text>
  <text x="70" y="415" class="text">Data: Sample of n = 25 students, X̄ = 172.5 cm, s = 8.2 cm</text>
  
  <text x="70" y="435" class="text">Step 1: H₀: μ = 170 vs H₁: μ ≠ 170 (two-tailed), α = 0.05</text>
  <text x="70" y="450" class="text">Step 2: t = (172.5 - 170)/(8.2/√25) = 2.5/1.64 = 1.524</text>
  <text x="70" y="465" class="text">Step 3: Critical value t₀.₀₂₅,₂₄ = ±2.064, |1.524| &lt; 2.064 → Fail to reject H₀</text>

</svg>