<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="600" y="40" font-size="28" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Undirected Graphical Model: Social Network Example
  </text>
  
  <!-- Background -->
  <rect x="50" y="70" width="1100" height="600" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2" rx="10"/>
  
  <!-- Legend -->
  <g transform="translate(80, 100)">
    <text x="0" y="0" font-size="20" font-weight="bold" fill="#495057">Legend:</text>
    <circle cx="15" cy="30" r="12" fill="#3498db"/>
    <text x="35" y="37" font-size="16" fill="#495057">Person (Node)</text>
    <line x1="15" y1="60" x2="80" y2="60" stroke="#2ecc71" stroke-width="4"/>
    <text x="90" y="67" font-size="16" fill="#495057">Positive Influence (Edge)</text>
    <line x1="15" y1="90" x2="80" y2="90" stroke="#e74c3c" stroke-width="4" stroke-dasharray="5,5"/>
    <text x="90" y="97" font-size="16" fill="#495057">Negative Influence (Edge)</text>
  </g>
  
  <!-- Main Graph -->
  <g transform="translate(600, 400)">
    <!-- Justin (center node) -->
    <circle cx="0" cy="0" r="40" fill="#e74c3c" stroke="#c0392b" stroke-width="3"/>
    <text x="0" y="7" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Justin</text>
    <text x="0" y="-55" font-size="14" text-anchor="middle" fill="#e74c3c" font-weight="bold">High Degree Node</text>
    
    <!-- Friend 1 (plays Halo) -->
    <circle cx="-180" cy="-150" r="35" fill="#3498db" stroke="#2980b9" stroke-width="3"/>
    <text x="-180" y="-143" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Friend 1</text>
    <text x="-180" y="-125" font-size="12" text-anchor="middle" fill="white">Halo</text>
    
    <!-- Friend 2 (plays Halo) -->
    <circle cx="180" cy="-150" r="35" fill="#3498db" stroke="#2980b9" stroke-width="3"/>
    <text x="180" y="-143" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Friend 2</text>
    <text x="180" y="-125" font-size="12" text-anchor="middle" fill="white">Halo</text>
    
    <!-- Friend 3 (plays Halo) -->
    <circle cx="-180" cy="150" r="35" fill="#3498db" stroke="#2980b9" stroke-width="3"/>
    <text x="-180" y="157" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Friend 3</text>
    <text x="-180" y="175" font-size="12" text-anchor="middle" fill="white">Halo</text>
    
    <!-- John (different preferences) -->
    <circle cx="180" cy="150" r="35" fill="#95a5a6" stroke="#7f8c8d" stroke-width="3"/>
    <text x="180" y="157" font-size="14" font-weight="bold" text-anchor="middle" fill="white">John</text>
    <text x="180" y="175" font-size="12" text-anchor="middle" fill="white">Settlers</text>
    
    <!-- Edges from Justin to Friends (positive influence) -->
    <line x1="-30" y1="-28" x2="-150" y2="-122" stroke="#2ecc71" stroke-width="5" opacity="0.8"/>
    <line x1="30" y1="-28" x2="150" y2="-122" stroke="#2ecc71" stroke-width="5" opacity="0.8"/>
    <line x1="-30" y1="28" x2="-150" y2="122" stroke="#2ecc71" stroke-width="5" opacity="0.8"/>
    
    <!-- Edge from Justin to John (weak/no influence) -->
    <line x1="30" y1="28" x2="150" y2="122" stroke="#e74c3c" stroke-width="3" opacity="0.4" stroke-dasharray="8,4"/>
    
    <!-- Three-way interaction indicator -->
    <path d="M -120,-100 L -60,-40 L 0,-10 L 60,-40 L 120,-100" fill="none" stroke="#9b59b6" stroke-width="3" stroke-dasharray="5,5" opacity="0.6"/>
    <text x="0" y="-110" font-size="14" text-anchor="middle" fill="#9b59b6" font-weight="bold">3-way Interaction</text>
    
    <!-- Edges between friends -->
    <line x1="-155" y1="-130" x2="155" y2="-130" stroke="#3498db" stroke-width="3" opacity="0.5"/>
    <line x1="-160" y1="-120" x2="-160" y2="120" stroke="#3498db" stroke-width="3" opacity="0.5"/>
    
    <!-- Edge weights labels -->
    <g transform="translate(-95, -75)">
      <rect x="-25" y="-12" width="50" height="24" fill="white" stroke="#2ecc71" stroke-width="2" rx="5"/>
      <text x="0" y="5" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">w = 0.8</text>
    </g>
    
    <g transform="translate(95, -75)">
      <rect x="-25" y="-12" width="50" height="24" fill="white" stroke="#2ecc71" stroke-width="2" rx="5"/>
      <text x="0" y="5" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">w = 0.9</text>
    </g>
    
    <g transform="translate(95, 85)">
      <rect x="-25" y="-12" width="50" height="24" fill="white" stroke="#e74c3c" stroke-width="2" rx="5"/>
      <text x="0" y="5" font-size="12" font-weight="bold" text-anchor="middle" fill="#c0392b">w = -0.2</text>
    </g>
  </g>
  
  <!-- Annotation boxes -->
  <g transform="translate(900, 250)">
    <rect x="0" y="0" width="250" height="120" fill="#fff3cd" stroke="#ffc107" stroke-width="2" rx="8"/>
    <text x="125" y="25" font-size="16" font-weight="bold" text-anchor="middle" fill="#856404">Key Insights</text>
    <text x="10" y="50" font-size="13" fill="#856404">• Nodes = Random Variables</text>
    <text x="10" y="72" font-size="13" fill="#856404">• Edges = Dependencies</text>
    <text x="10" y="94" font-size="13" fill="#856404">• Weights = Strength</text>
    <text x="10" y="116" font-size="13" fill="#856404">• Undirected = Symmetric</text>
  </g>
  
  <!-- Binary vector representation -->
  <g transform="translate(100, 520)">
    <text x="0" y="0" font-size="18" font-weight="bold" fill="#2c3e50">Binary Vector Example (Justin's preferences):</text>
    <rect x="0" y="10" width="850" height="60" fill="white" stroke="#95a5a6" stroke-width="2" rx="5"/>
    <text x="20" y="35" font-size="14" fill="#7f8c8d">Games:</text>
    <text x="90" y="35" font-size="14" font-weight="bold" fill="#2c3e50">Halo</text>
    <text x="170" y="35" font-size="14" font-weight="bold" fill="#2c3e50">Settlers</text>
    <text x="270" y="35" font-size="14" font-weight="bold" fill="#2c3e50">FIFA</text>
    <text x="350" y="35" font-size="14" font-weight="bold" fill="#2c3e50">Minecraft</text>
    <text x="470" y="35" font-size="14" font-weight="bold" fill="#2c3e50">CoD</text>
    <text x="550" y="35" font-size="14" font-weight="bold" fill="#2c3e50">Fortnite</text>
    <text x="660" y="35" font-size="14" font-weight="bold" fill="#2c3e50">...</text>
    
    <text x="20" y="58" font-size="14" fill="#7f8c8d">Values:</text>
    <circle cx="110" cy="53" r="8" fill="#27ae60"/>
    <text x="110" y="57" font-size="12" font-weight="bold" text-anchor="middle" fill="white">1</text>
    
    <circle cx="200" cy="53" r="8" fill="#e74c3c"/>
    <text x="200" y="57" font-size="12" font-weight="bold" text-anchor="middle" fill="white">0</text>
    
    <circle cx="290" cy="53" r="8" fill="#27ae60"/>
    <text x="290" y="57" font-size="12" font-weight="bold" text-anchor="middle" fill="white">1</text>
    
    <circle cx="390" cy="53" r="8" fill="#27ae60"/>
    <text x="390" y="57" font-size="12" font-weight="bold" text-anchor="middle" fill="white">1</text>
    
    <circle cx="475" cy="53" r="8" fill="#27ae60"/>
    <text x="475" y="57" font-size="12" font-weight="bold" text-anchor="middle" fill="white">1</text>
    
    <circle cx="580" cy="53" r="8" fill="#e74c3c"/>
    <text x="580" y="57" font-size="12" font-weight="bold" text-anchor="middle" fill="white">0</text>
    
    <text x="660" y="57" font-size="14" fill="#7f8c8d">...</text>
  </g>
</svg>