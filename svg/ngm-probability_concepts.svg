<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5CB85C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#449D44;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0AD4E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC971F;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Probability Theory: Core Concepts
  </text>
  
  <!-- Random Experiment Box -->
  <g transform="translate(100, 80)">
    <rect x="0" y="0" width="250" height="150" rx="10" fill="url(#blueGrad)" filter="url(#shadow)"/>
    <text x="125" y="35" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="white">
      Random Experiment
    </text>
    <text x="125" y="65" font-family="Arial" font-size="14" text-anchor="middle" fill="white">
      Unpredictable physical
    </text>
    <text x="125" y="85" font-family="Arial" font-size="14" text-anchor="middle" fill="white">
      situation until observed
    </text>
    
    <!-- Coin Example -->
    <circle cx="125" cy="125" r="25" fill="#FFD700" stroke="#B8860B" stroke-width="2"/>
    <text x="125" y="130" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">
      H/T
    </text>
    <text x="125" y="180" font-family="Arial" font-size="12" text-anchor="middle" fill="#555">
      Example: Coin Toss
    </text>
  </g>
  
  <!-- Sample Space Box -->
  <g transform="translate(450, 80)">
    <rect x="0" y="0" width="250" height="150" rx="10" fill="url(#greenGrad)" filter="url(#shadow)"/>
    <text x="125" y="35" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="white">
      Sample Space (S)
    </text>
    <text x="125" y="65" font-family="Arial" font-size="14" text-anchor="middle" fill="white">
      Set of all possible
    </text>
    <text x="125" y="85" font-family="Arial" font-size="14" text-anchor="middle" fill="white">
      outcomes
    </text>
    
    <!-- Sample Space Visualization -->
    <ellipse cx="125" cy="125" rx="80" ry="30" fill="white" fill-opacity="0.3" stroke="white" stroke-width="2"/>
    <text x="80" y="130" font-family="Arial" font-size="14" fill="white">H</text>
    <text x="165" y="130" font-family="Arial" font-size="14" fill="white">T</text>
    <text x="125" y="180" font-family="Arial" font-size="12" text-anchor="middle" fill="#555">
      S = {H, T}
    </text>
  </g>
  
  <!-- Random Variable Box -->
  <g transform="translate(275, 280)">
    <rect x="0" y="0" width="250" height="150" rx="10" fill="url(#orangeGrad)" filter="url(#shadow)"/>
    <text x="125" y="35" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="white">
      Random Variable (X)
    </text>
    <text x="125" y="65" font-family="Arial" font-size="14" text-anchor="middle" fill="white">
      Numerical outcomes of
    </text>
    <text x="125" y="85" font-family="Arial" font-size="14" text-anchor="middle" fill="white">
      random experiment
    </text>
    
    <!-- Types -->
    <rect x="20" y="100" width="95" height="35" rx="5" fill="white" fill-opacity="0.9"/>
    <text x="67" y="120" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#EC971F">
      Discrete
    </text>
    <text x="67" y="132" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">
      {0, 1, 2, ...}
    </text>
    
    <rect x="135" y="100" width="95" height="35" rx="5" fill="white" fill-opacity="0.9"/>
    <text x="182" y="120" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#EC971F">
      Continuous
    </text>
    <text x="182" y="132" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">
      [a, b]
    </text>
  </g>
  
  <!-- Probability Box -->
  <g transform="translate(100, 450)">
    <rect x="0" y="0" width="600" height="100" rx="10" fill="#e8f4f8" stroke="#4A90E2" stroke-width="2" filter="url(#shadow)"/>
    <text x="300" y="30" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Probability: P(A) ∈ [0, 1]
    </text>
    
    <!-- Probability Scale -->
    <line x1="50" y1="60" x2="550" y2="60" stroke="#4A90E2" stroke-width="3"/>
    
    <circle cx="50" cy="60" r="5" fill="#d9534f"/>
    <text x="50" y="85" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">
      0
    </text>
    <text x="50" y="98" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">
      Impossible
    </text>
    
    <circle cx="300" cy="60" r="5" fill="#f0ad4e"/>
    <text x="300" y="85" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">
      0.5
    </text>
    <text x="300" y="98" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">
      Fair Coin
    </text>
    
    <circle cx="550" cy="60" r="5" fill="#5cb85c"/>
    <text x="550" y="85" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">
      1
    </text>
    <text x="550" y="98" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">
      Certain
    </text>
  </g>
  
  <!-- Connecting Arrows -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  
  <path d="M 225 230 L 275 280" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)" stroke-dasharray="5,5"/>
  <path d="M 575 230 L 525 280" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)" stroke-dasharray="5,5"/>
  <path d="M 400 430 L 400 450" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)" stroke-dasharray="5,5"/>
</svg>