<svg viewBox="0 0 900 650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="bagPattern" patternUnits="userSpaceOnUse" width="8" height="8">
      <rect width="8" height="8" fill="#f8f9fa"/>
      <circle cx="4" cy="4" r="1" fill="#6c757d"/>
    </pattern>
    <pattern id="rfPattern" patternUnits="userSpaceOnUse" width="8" height="8">
      <rect width="8" height="8" fill="#fff3cd"/>
      <rect x="2" y="2" width="4" height="4" fill="#ffc107"/>
    </pattern>
    <filter id="cardShadow">
      <feDropShadow dx="3" dy="3" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#212529">Bagging vs Random Forest</text>
  
  <!-- Bagging Section -->
  <g id="bagging-section">
    <!-- Section Title -->
    <rect x="50" y="60" width="350" height="40" fill="#6c757d" stroke="#495057" stroke-width="2"/>
    <text x="225" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">Traditional Bagging</text>
    
    <!-- Original Dataset -->
    <rect x="175" y="120" width="100" height="60" fill="#007bff" stroke="#0056b3" stroke-width="2" filter="url(#cardShadow)"/>
    <text x="225" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Training Set</text>
    <text x="225" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">All Features</text>
    <text x="225" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">{f₁, f₂, ..., fₚ}</text>
    
    <!-- Bootstrap Datasets -->
    <rect x="70" y="220" width="80" height="50" fill="url(#bagPattern)" stroke="#28a745" stroke-width="2"/>
    <text x="110" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#155724">Sample 1</text>
    <text x="110" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#155724">All features</text>
    
    <rect x="190" y="220" width="80" height="50" fill="url(#bagPattern)" stroke="#28a745" stroke-width="2"/>
    <text x="230" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#155724">Sample 2</text>
    <text x="230" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#155724">All features</text>
    
    <rect x="310" y="220" width="80" height="50" fill="url(#bagPattern)" stroke="#28a745" stroke-width="2"/>
    <text x="350" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#155724">Sample B</text>
    <text x="350" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#155724">All features</text>
    
    <!-- Trees for Bagging -->
    <g transform="translate(90,290)">
      <circle cx="0" cy="0" r="15" fill="#6f42c1" stroke="#563d7c" stroke-width="2"/>
      <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">T₁</text>
    </g>
    <g transform="translate(210,290)">
      <circle cx="0" cy="0" r="15" fill="#6f42c1" stroke="#563d7c" stroke-width="2"/>
      <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">T₂</text>
    </g>
    <g transform="translate(330,290)">
      <circle cx="0" cy="0" r="15" fill="#6f42c1" stroke="#563d7c" stroke-width="2"/>
      <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">Tᵦ</text>
    </g>
    
    <!-- Problem indicators -->
    <text x="225" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#dc3545">High Correlation Between Trees</text>
    <text x="225" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">Similar features → Similar splits → Correlated predictions</text>
  </g>
  
  <!-- Random Forest Section -->
  <g id="rf-section">
    <!-- Section Title -->
    <rect x="500" y="60" width="350" height="40" fill="#fd7e14" stroke="#e55a00" stroke-width="2"/>
    <text x="675" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">Random Forest</text>
    
    <!-- Original Dataset -->
    <rect x="625" y="120" width="100" height="60" fill="#007bff" stroke="#0056b3" stroke-width="2" filter="url(#cardShadow)"/>
    <text x="675" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Training Set</text>
    <text x="675" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">All Features</text>
    <text x="675" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">{f₁, f₂, ..., fₚ}</text>
    
    <!-- Bootstrap + Feature Sampling -->
    <rect x="520" y="220" width="80" height="70" fill="url(#rfPattern)" stroke="#28a745" stroke-width="2"/>
    <text x="560" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#155724">Sample 1</text>
    <text x="560" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#155724">Features:</text>
    <text x="560" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#155724">{f₁, f₃, f₇}</text>
    <text x="560" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#856404">√p subset</text>
    
    <rect x="640" y="220" width="80" height="70" fill="url(#rfPattern)" stroke="#28a745" stroke-width="2"/>
    <text x="680" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#155724">Sample 2</text>
    <text x="680" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#155724">Features:</text>
    <text x="680" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#155724">{f₂, f₅, f₉}</text>
    <text x="680" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#856404">√p subset</text>
    
    <rect x="760" y="220" width="80" height="70" fill="url(#rfPattern)" stroke="#28a745" stroke-width="2"/>
    <text x="800" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#155724">Sample B</text>
    <text x="800" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#155724">Features:</text>
    <text x="800" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#155724">{f₄, f₆, f₈}</text>
    <text x="800" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#856404">√p subset</text>
    
    <!-- Trees for Random Forest -->
    <g transform="translate(540,310)">
      <circle cx="0" cy="0" r="15" fill="#20c997" stroke="#17a2b8" stroke-width="2"/>
      <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">T₁</text>
    </g>
    <g transform="translate(660,310)">
      <circle cx="0" cy="0" r="15" fill="#20c997" stroke="#17a2b8" stroke-width="2"/>
      <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">T₂</text>
    </g>
    <g transform="translate(780,310)">
      <circle cx="0" cy="0" r="15" fill="#20c997" stroke="#17a2b8" stroke-width="2"/>
      <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">Tᵦ</text>
    </g>
    
    <!-- Benefit indicators -->
    <text x="675" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#28a745">Low Correlation Between Trees</text>
    <text x="675" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">Different features → Different splits → Diverse predictions</text>
  </g>
  
  <!-- Comparison Arrow -->
  <path d="M 420 250 L 480 250" stroke="#fd7e14" stroke-width="4" marker-end="url(#orangeArrow)"/>
  <text x="450" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fd7e14">Feature</text>
  <text x="450" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fd7e14">Sampling</text>
  
  <!-- Key Differences Box -->
  <rect x="150" y="400" width="600" height="220" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2" filter="url(#cardShadow)"/>
  <text x="450" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#495057">Key Differences</text>
  
  <!-- Comparison Table -->
  <line x1="170" y1="450" x2="730" y2="450" stroke="#dee2e6" stroke-width="1"/>
  
  <!-- Headers -->
  <text x="200" y="470" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#495057">Aspect</text>
  <text x="350" y="470" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#6c757d">Bagging</text>
  <text x="550" y="470" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fd7e14">Random Forest</text>
  
  <!-- Vertical lines -->
  <line x1="320" y1="450" x2="320" y2="610" stroke="#dee2e6" stroke-width="1"/>
  <line x1="500" y1="450" x2="500" y2="610" stroke="#dee2e6" stroke-width="1"/>
  
  <!-- Row separators -->
  <line x1="170" y1="485" x2="730" y2="485" stroke="#e9ecef" stroke-width="1"/>
  <line x1="170" y1="520" x2="730" y2="520" stroke="#e9ecef" stroke-width="1"/>
  <line x1="170" y1="555" x2="730" y2="555" stroke="#e9ecef" stroke-width="1"/>
  <line x1="170" y1="590" x2="730" y2="590" stroke="#e9ecef" stroke-width="1"/>
  
  <!-- Data Sampling -->
  <text x="180" y="505" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#495057">Data Sampling</text>
  <text x="330" y="505" font-family="Arial, sans-serif" font-size="11" fill="#6c757d">Bootstrap samples</text>
  <text x="510" y="505" font-family="Arial, sans-serif" font-size="11" fill="#fd7e14">Bootstrap samples</text>
  
  <!-- Feature Sampling -->
  <text x="180" y="540" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#495057">Feature Sampling</text>
  <text x="330" y="540" font-family="Arial, sans-serif" font-size="11" fill="#6c757d">All features (p)</text>
  <text x="510" y="540" font-family="Arial, sans-serif" font-size="11" fill="#fd7e14">Subset (√p or log p)</text>
  
  <!-- Tree Correlation -->
  <text x="180" y="575" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#495057">Tree Correlation</text>
  <text x="330" y="575" font-family="Arial, sans-serif" font-size="11" fill="#dc3545">High</text>
  <text x="510" y="575" font-family="Arial, sans-serif" font-size="11" fill="#28a745">Low</text>
  
  <!-- Generalization -->
  <text x="180" y="610" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#495057">Generalization</text>
  <text x="330" y="610" font-family="Arial, sans-serif" font-size="11" fill="#ffc107">Moderate</text>
  <text x="510" y="610" font-family="Arial, sans-serif" font-size="11" fill="#28a745">Superior</text>
  
  <!-- Arrows -->
  <defs>
    <marker id="orangeArrow" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 12 4, 0 8" fill="#fd7e14"/>
    </marker>
    <marker id="greyArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6c757d"/>
    </marker>
  </defs>
  
  <!-- Connection arrows for bagging -->
  <path d="M 225 180 L 110 220" stroke="#6c757d" stroke-width="2" marker-end="url(#greyArrow)"/>
  <path d="M 225 180 L 230 220" stroke="#6c757d" stroke-width="2" marker-end="url(#greyArrow)"/>
  <path d="M 225 180 L 350 220" stroke="#6c757d" stroke-width="2" marker-end="url(#greyArrow)"/>
  
  <!-- Connection arrows for random forest -->
  <path d="M 675 180 L 560 220" stroke="#fd7e14" stroke-width="2" marker-end="url(#orangeArrow)"/>
  <path d="M 675 180 L 680 220" stroke="#fd7e14" stroke-width="2" marker-end="url(#orangeArrow)"/>
  <path d="M 675 180 L 800 220" stroke="#fd7e14" stroke-width="2" marker-end="url(#orangeArrow)"/>
</svg>