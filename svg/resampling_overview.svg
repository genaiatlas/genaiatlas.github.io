<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="problemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="solutionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bootstrapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="permutationGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="jackknifeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cvGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <dropShadow dx="2" dy="3" stdDeviation="2" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="700" fill="#fafafa"/>
  
  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1f2937">
    Resampling Methods: A Complete Guide
  </text>

  <!-- Step 1: The Problem -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="420" height="100" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" filter="url(#shadow)"/>
    
    <text x="210" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2937">
      1. The Statistical Challenge
    </text>
    
    <rect x="20" y="35" width="180" height="50" rx="4" fill="url(#problemGrad)"/>
    <text x="110" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
      Traditional Methods
    </text>
    <text x="110" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
      Need distributional assumptions
    </text>
    
    <text x="320" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#374151">
      What if our data doesn't
    </text>
    <text x="320" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#374151">
      follow normal distributions?
    </text>
  </g>

  <!-- Step 2: The Solution -->
  <g transform="translate(530, 80)">
    <rect x="0" y="0" width="420" height="100" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" filter="url(#shadow)"/>
    
    <text x="210" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2937">
      2. The Resampling Solution
    </text>
    
    <rect x="220" y="35" width="180" height="50" rx="4" fill="url(#solutionGrad)"/>
    <text x="310" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
      Resampling Methods
    </text>
    <text x="310" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
      Use the data itself!
    </text>
    
    <text x="100" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#374151">
      Let the data tell us about
    </text>
    <text x="100" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#374151">
      its own uncertainty
    </text>
  </g>

  <!-- Step 3: The Four Methods -->
  <g transform="translate(50, 220)">
    <text x="450" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1f2937">
      3. Four Powerful Resampling Methods
    </text>
    
    <!-- Bootstrap -->
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="220" height="120" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" filter="url(#shadow)"/>
      <rect x="10" y="10" width="200" height="30" rx="4" fill="url(#bootstrapGrad)"/>
      <text x="110" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
        Bootstrap
      </text>
      
      <text x="110" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#374151">
        Sample WITH replacement
      </text>
      <text x="110" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">
        • Estimate uncertainty
      </text>
      <text x="110" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">
        • Confidence intervals
      </text>
      <text x="110" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">
        • Standard errors
      </text>
    </g>
    
    <!-- Permutation -->
    <g transform="translate(240, 20)">
      <rect x="0" y="0" width="220" height="120" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" filter="url(#shadow)"/>
      <rect x="10" y="10" width="200" height="30" rx="4" fill="url(#permutationGrad)"/>
      <text x="110" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
        Permutation Tests
      </text>
      
      <text x="110" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#374151">
        Shuffle group labels
      </text>
      <text x="110" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">
        • Hypothesis testing
      </text>
      <text x="110" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">
        • Exact p-values
      </text>
      <text x="110" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">
        • No assumptions
      </text>
    </g>
    
    <!-- Jackknife -->
    <g transform="translate(480, 20)">
      <rect x="0" y="0" width="220" height="120" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" filter="url(#shadow)"/>
      <rect x="10" y="10" width="200" height="30" rx="4" fill="url(#jackknifeGrad)"/>
      <text x="110" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
        Jackknife
      </text>
      
      <text x="110" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#374151">
        Leave-one-out sampling
      </text>
      <text x="110" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">
        • Bias correction
      </text>
      <text x="110" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">
        • Influence diagnostics
      </text>
      <text x="110" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">
        • Outlier detection
      </text>
    </g>
    
    <!-- Cross-Validation -->
    <g transform="translate(720, 20)">
      <rect x="0" y="0" width="220" height="120" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" filter="url(#shadow)"/>
      <rect x="10" y="10" width="200" height="30" rx="4" fill="url(#cvGrad)"/>
      <text x="110" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
        Cross-Validation
      </text>
      
      <text x="110" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#374151">
        Train/test splits
      </text>
      <text x="110" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">
        • Model selection
      </text>
      <text x="110" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">
        • Performance estimation
      </text>
      <text x="110" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">
        • Hyperparameter tuning
      </text>
    </g>
  </g>

  <!-- Step 4: When to Use Each -->
  <g transform="translate(50, 400)">
    <text x="450" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1f2937">
      4. When to Use Each Method
    </text>
    
    <rect x="0" y="20" width="900" height="80" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" filter="url(#shadow)"/>
    
    <g transform="translate(20, 40)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#10b981">Bootstrap:</text>
      <text x="80" y="0" font-family="Arial, sans-serif" font-size="11" fill="#374151">When you need uncertainty estimates (CI, SE)</text>
      
      <text x="0" y="20" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#8b5cf6">Permutation:</text>
      <text x="100" y="20" font-family="Arial, sans-serif" font-size="11" fill="#374151">When testing if groups differ</text>
      
      <text x="0" y="40" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f59e0b">Jackknife:</text>
      <text x="80" y="40" font-family="Arial, sans-serif" font-size="11" fill="#374151">When checking for outliers or bias</text>
      
      <text x="0" y="60" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#06b6d4">Cross-Validation:</text>
      <text x="130" y="60" font-family="Arial, sans-serif" font-size="11" fill="#374151">When building predictive models</text>
    </g>
  </g>

  <!-- Step 5: Key Benefits -->
  <g transform="translate(50, 520)">
    <text x="450" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1f2937">
      5. Why Resampling Methods Are Powerful
    </text>
    
    <rect x="0" y="20" width="900" height="120" rx="8" fill="#f8fafc" stroke="#6366f1" stroke-width="2" filter="url(#shadow)"/>
    
    <g transform="translate(50, 45)">
      <text x="400" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#4338ca">
        Core Advantages
      </text>
      
      <text x="0" y="25" font-family="Arial, sans-serif" font-size="13" fill="#374151">
        ✓ <tspan font-weight="bold">No assumptions</tspan> about data distribution
      </text>
      <text x="0" y="45" font-family="Arial, sans-serif" font-size="13" fill="#374151">
        ✓ <tspan font-weight="bold">Robust</tspan> to outliers and non-normal data
      </text>
      <text x="0" y="65" font-family="Arial, sans-serif" font-size="13" fill="#374151">
        ✓ <tspan font-weight="bold">Flexible</tspan> - works with any statistic
      </text>
      <text x="0" y="85" font-family="Arial, sans-serif" font-size="13" fill="#374151">
        ✓ <tspan font-weight="bold">Intuitive</tspan> - easy to understand and explain
      </text>
      
      <text x="450" y="25" font-family="Arial, sans-serif" font-size="13" fill="#374151">
        ✓ <tspan font-weight="bold">Exact results</tspan> rather than approximations
      </text>
      <text x="450" y="45" font-family="Arial, sans-serif" font-size="13" fill="#374151">
        ✓ <tspan font-weight="bold">Computational</tspan> - leverages modern computing
      </text>
      <text x="450" y="65" font-family="Arial, sans-serif" font-size="13" fill="#374151">
        ✓ <tspan font-weight="bold">Practical</tspan> - handles real-world messy data
      </text>
      <text x="450" y="85" font-family="Arial, sans-serif" font-size="13" fill="#374151">
        ✓ <tspan font-weight="bold">Widely applicable</tspan> across many fields
      </text>
    </g>
  </g>

  <!-- Flow arrows -->
  <path d="M 470 180 L 500 220" stroke="#6b7280" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 500 370 L 500 400" stroke="#6b7280" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 500 500 L 500 520" stroke="#6b7280" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
  </defs>

</svg>