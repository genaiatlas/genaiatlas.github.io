<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="500" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#2C3E50">
    Comparison Data Overview
  </text>
  
  <!-- Traditional Ratings Section -->
  <rect x="50" y="60" width="400" height="220" fill="#E8F4F8" stroke="#3498DB" stroke-width="2" rx="10"/>
  <text x="250" y="90" font-size="18" font-weight="bold" text-anchor="middle" fill="#2C3E50">
    Traditional Rating System
  </text>
  
  <!-- User ratings table -->
  <rect x="80" y="110" width="340" height="150" fill="white" stroke="#3498DB" stroke-width="1"/>
  
  <!-- Table headers -->
  <text x="100" y="135" font-size="14" font-weight="bold" fill="#2C3E50">User</text>
  <text x="200" y="135" font-size="14" font-weight="bold" fill="#2C3E50">Movie A</text>
  <text x="300" y="135" font-size="14" font-weight="bold" fill="#2C3E50">Movie B</text>
  
  <!-- Table rows -->
  <line x1="80" y1="145" x2="420" y2="145" stroke="#BDC3C7" stroke-width="1"/>
  
  <text x="100" y="170" font-size="13" fill="#34495E">User 1</text>
  <text x="200" y="170" font-size="13" fill="#27AE60">★★★★★ (5)</text>
  <text x="300" y="170" font-size="13" fill="#F39C12">★★★★☆ (4)</text>
  
  <text x="100" y="200" font-size="13" fill="#34495E">User 2</text>
  <text x="200" y="200" font-size="13" fill="#E74C3C">★★☆☆☆ (2)</text>
  <text x="300" y="200" font-size="13" fill="#27AE60">★★★★★ (5)</text>
  
  <text x="100" y="230" font-size="13" fill="#34495E">User 3</text>
  <text x="200" y="230" font-size="13" fill="#95A5A6">? (missing)</text>
  <text x="300" y="230" font-size="13" fill="#F39C12">★★★☆☆ (3)</text>
  
  <!-- Arrow -->
  <path d="M 250 300 L 250 340" stroke="#E67E22" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="280" y="325" font-size="14" font-weight="bold" fill="#E67E22">Transform</text>
  
  <!-- Comparison Data Section -->
  <rect x="50" y="360" width="400" height="220" fill="#FEF5E7" stroke="#E67E22" stroke-width="2" rx="10"/>
  <text x="250" y="390" font-size="18" font-weight="bold" text-anchor="middle" fill="#2C3E50">
    Comparison Data System
  </text>
  
  <!-- Comparison table -->
  <rect x="80" y="410" width="340" height="150" fill="white" stroke="#E67E22" stroke-width="1"/>
  
  <!-- Table headers -->
  <text x="100" y="435" font-size="14" font-weight="bold" fill="#2C3E50">User</text>
  <text x="220" y="435" font-size="14" font-weight="bold" fill="#2C3E50">A vs B</text>
  <text x="340" y="435" font-size="14" font-weight="bold" fill="#2C3E50">Interpretation</text>
  
  <!-- Table rows -->
  <line x1="80" y1="445" x2="420" y2="445" stroke="#BDC3C7" stroke-width="1"/>
  
  <text x="100" y="470" font-size="13" fill="#34495E">User 1</text>
  <text x="220" y="470" font-size="14" font-weight="bold" fill="#27AE60">+1</text>
  <text x="290" y="470" font-size="11" fill="#7F8C8D">A &gt; B</text>
  
  <text x="100" y="500" font-size="13" fill="#34495E">User 2</text>
  <text x="220" y="500" font-size="14" font-weight="bold" fill="#E74C3C">-1</text>
  <text x="290" y="500" font-size="11" fill="#7F8C8D">B &gt; A</text>
  
  <text x="100" y="530" font-size="13" fill="#34495E">User 3</text>
  <text x="220" y="530" font-size="13" fill="#95A5A6">?</text>
  <text x="290" y="530" font-size="11" fill="#7F8C8D">Unknown</text>
  
  <!-- Key Features Box -->
  <rect x="520" y="120" width="430" height="400" fill="#ECF0F1" stroke="#34495E" stroke-width="2" rx="10"/>
  <text x="735" y="155" font-size="18" font-weight="bold" text-anchor="middle" fill="#2C3E50">
    Key Features of Comparison Data
  </text>
  
  <!-- Feature 1 -->
  <circle cx="550" cy="200" r="15" fill="#3498DB"/>
  <text x="550" y="206" font-size="16" font-weight="bold" text-anchor="middle" fill="white">1</text>
  <text x="580" y="205" font-size="14" fill="#2C3E50" font-weight="bold">Binary Values</text>
  <text x="580" y="225" font-size="12" fill="#34495E">Only +1 (prefer) or -1 (not prefer)</text>
  
  <!-- Feature 2 -->
  <circle cx="550" cy="270" r="15" fill="#27AE60"/>
  <text x="550" y="276" font-size="16" font-weight="bold" text-anchor="middle" fill="white">2</text>
  <text x="580" y="275" font-size="14" fill="#2C3E50" font-weight="bold">Natural Expression</text>
  <text x="580" y="295" font-size="12" fill="#34495E">Easier for users to compare than rate</text>
  
  <!-- Feature 3 -->
  <circle cx="550" cy="340" r="15" fill="#E67E22"/>
  <text x="550" y="346" font-size="16" font-weight="bold" text-anchor="middle" fill="white">3</text>
  <text x="580" y="345" font-size="14" fill="#2C3E50" font-weight="bold">Implicit Collection</text>
  <text x="580" y="365" font-size="12" fill="#34495E">Can derive from existing ratings</text>
  
  <!-- Feature 4 -->
  <circle cx="550" cy="410" r="15" fill="#9B59B6"/>
  <text x="550" y="416" font-size="16" font-weight="bold" text-anchor="middle" fill="white">4</text>
  <text x="580" y="415" font-size="14" fill="#2C3E50" font-weight="bold">Scale Invariant</text>
  <text x="580" y="435" font-size="12" fill="#34495E">No rating scale interpretation issues</text>
  
  <!-- Feature 5 -->
  <circle cx="550" cy="480" r="15" fill="#E74C3C"/>
  <text x="550" y="486" font-size="16" font-weight="bold" text-anchor="middle" fill="white">5</text>
  <text x="580" y="485" font-size="14" fill="#2C3E50" font-weight="bold">Quadratic Growth</text>
  <text x="580" y="505" font-size="12" fill="#34495E">N items → N(N-1)/2 comparisons</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#E67E22"/>
    </marker>
  </defs>
</svg>