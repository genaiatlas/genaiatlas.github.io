<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="35" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Graph Theory Fundamentals
  </text>
  
  <!-- Definition Box -->
  <g transform="translate(200, 60)">
    <rect x="0" y="0" width="400" height="50" rx="8" fill="#ecf0f1" stroke="#95a5a6" stroke-width="2"/>
    <text x="200" y="25" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Graph G = (V, E)
    </text>
    <text x="200" y="45" font-family="Arial" font-size="12" text-anchor="middle" fill="#555">
      V = vertices (nodes), E = edges (connections)
    </text>
  </g>
  
  <!-- Undirected Graph -->
  <g transform="translate(50, 130)">
    <rect x="0" y="0" width="350" height="200" rx="10" fill="white" stroke="#3498db" stroke-width="2" filter="url(#shadow)"/>
    
    <text x="175" y="25" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#2980b9">
      Undirected Graph
    </text>
    
    <text x="175" y="45" font-family="Arial" font-size="11" text-anchor="middle" fill="#7f8c8d">
      Bidirectional connections (e.g., friendship)
    </text>
    
    <!-- Graph visualization -->
    <g transform="translate(75, 70)">
      <!-- Edges (drawn first so nodes appear on top) -->
      <line x1="50" y1="50" x2="150" y2="50" stroke="#666" stroke-width="2"/>
      <line x1="150" y1="50" x2="200" y2="100" stroke="#666" stroke-width="2"/>
      <line x1="50" y1="50" x2="100" y2="100" stroke="#666" stroke-width="2"/>
      <line x1="100" y1="100" x2="200" y2="100" stroke="#666" stroke-width="2"/>
      <line x1="100" y1="100" x2="150" y2="50" stroke="#666" stroke-width="2"/>
      
      <!-- Nodes -->
      <circle cx="50" cy="50" r="20" fill="url(#nodeGrad)" stroke="#2471a3" stroke-width="2"/>
      <text x="50" y="55" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">1</text>
      
      <circle cx="150" cy="50" r="20" fill="url(#nodeGrad)" stroke="#2471a3" stroke-width="2"/>
      <text x="150" y="55" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">2</text>
      
      <circle cx="100" cy="100" r="20" fill="url(#nodeGrad)" stroke="#2471a3" stroke-width="2"/>
      <text x="100" y="105" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">3</text>
      
      <circle cx="200" cy="100" r="20" fill="url(#nodeGrad)" stroke="#2471a3" stroke-width="2"/>
      <text x="200" y="105" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">4</text>
    </g>
    
    <text x="175" y="190" font-family="Arial" font-size="11" text-anchor="middle" fill="#666">
      Edge (u,v) = Edge (v,u)
    </text>
  </g>
  
  <!-- Directed Graph -->
  <g transform="translate(420, 130)">
    <rect x="0" y="0" width="350" height="200" rx="10" fill="white" stroke="#e74c3c" stroke-width="2" filter="url(#shadow)"/>
    
    <text x="175" y="25" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#c0392b">
      Directed Graph
    </text>
    
    <text x="175" y="45" font-family="Arial" font-size="11" text-anchor="middle" fill="#7f8c8d">
      Unidirectional connections (e.g., followers)
    </text>
    
    <!-- Graph visualization -->
    <g transform="translate(75, 70)">
      <!-- Directed Edges with arrows -->
      <line x1="50" y1="50" x2="130" y2="50" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
      <line x1="150" y1="50" x2="180" y2="85" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
      <line x1="70" y1="60" x2="90" y2="85" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
      <line x1="100" y1="100" x2="180" y2="100" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
      <line x1="150" y1="60" x2="110" y2="90" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
      
      <!-- Nodes -->
      <circle cx="50" cy="50" r="20" fill="#e74c3c" fill-opacity="0.8" stroke="#c0392b" stroke-width="2"/>
      <text x="50" y="55" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">A</text>
      
      <circle cx="150" cy="50" r="20" fill="#e74c3c" fill-opacity="0.8" stroke="#c0392b" stroke-width="2"/>
      <text x="150" y="55" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">B</text>
      
      <circle cx="100" cy="100" r="20" fill="#e74c3c" fill-opacity="0.8" stroke="#c0392b" stroke-width="2"/>
      <text x="100" y="105" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">C</text>
      
      <circle cx="200" cy="100" r="20" fill="#e74c3c" fill-opacity="0.8" stroke="#c0392b" stroke-width="2"/>
      <text x="200" y="105" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">D</text>
    </g>
    
    <text x="175" y="190" font-family="Arial" font-size="11" text-anchor="middle" fill="#666">
      Edge (u,v) ≠ Edge (v,u)
    </text>
  </g>
  
  <!-- Adjacency Matrix Section -->
  <g transform="translate(50, 350)">
    <text x="0" y="0" font-family="Arial" font-size="20" font-weight="bold" fill="#34495e">
      Graph Representation: Adjacency Matrix
    </text>
    
    <!-- Small Example Graph -->
    <g transform="translate(0, 30)">
      <text x="0" y="0" font-family="Arial" font-size="14" font-weight="bold" fill="#2c3e50">
        Example Graph:
      </text>
      
      <g transform="translate(0, 20)">
        <!-- Edges -->
        <line x1="30" y1="30" x2="90" y2="30" stroke="#666" stroke-width="2"/>
        <line x1="30" y1="30" x2="60" y2="70" stroke="#666" stroke-width="2"/>
        <line x1="90" y1="30" x2="60" y2="70" stroke="#666" stroke-width="2"/>
        
        <!-- Nodes -->
        <circle cx="30" cy="30" r="15" fill="#27ae60" stroke="#229954" stroke-width="2"/>
        <text x="30" y="35" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="white">1</text>
        
        <circle cx="90" cy="30" r="15" fill="#27ae60" stroke="#229954" stroke-width="2"/>
        <text x="90" y="35" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="white">2</text>
        
        <circle cx="60" cy="70" r="15" fill="#27ae60" stroke="#229954" stroke-width="2"/>
        <text x="60" y="75" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="white">3</text>
      </g>
    </g>
    
    <!-- Matrix Representation -->
    <g transform="translate(200, 30)">
      <text x="0" y="0" font-family="Arial" font-size="14" font-weight="bold" fill="#2c3e50">
        Adjacency Matrix A:
      </text>
      
      <g transform="translate(0, 20)">
        <!-- Matrix -->
        <rect x="0" y="0" width="120" height="90" fill="white" stroke="#333" stroke-width="2"/>
        
        <!-- Grid lines -->
        <line x1="40" y1="0" x2="40" y2="90" stroke="#ccc" stroke-width="1"/>
        <line x1="80" y1="0" x2="80" y2="90" stroke="#ccc" stroke-width="1"/>
        <line x1="0" y1="30" x2="120" y2="30" stroke="#ccc" stroke-width="1"/>
        <line x1="0" y1="60" x2="120" y2="60" stroke="#ccc" stroke-width="1"/>
        
        <!-- Headers -->
        <text x="20" y="-5" font-family="Arial" font-size="11" text-anchor="middle" fill="#666">1</text>
        <text x="60" y="-5" font-family="Arial" font-size="11" text-anchor="middle" fill="#666">2</text>
        <text x="100" y="-5" font-family="Arial" font-size="11" text-anchor="middle" fill="#666">3</text>
        
        <text x="-10" y="20" font-family="Arial" font-size="11" text-anchor="middle" fill="#666">1</text>
        <text x="-10" y="50" font-family="Arial" font-size="11" text-anchor="middle" fill="#666">2</text>
        <text x="-10" y="80" font-family="Arial" font-size="11" text-anchor="middle" fill="#666">3</text>
        
        <!-- Matrix values -->
        <text x="20" y="20" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">0</text>
        <text x="60" y="20" font-family="Arial" font-size="14" text-anchor="middle" fill="#27ae60" font-weight="bold">1</text>
        <text x="100" y="20" font-family="Arial" font-size="14" text-anchor="middle" fill="#27ae60" font-weight="bold">1</text>
        
        <text x="20" y="50" font-family="Arial" font-size="14" text-anchor="middle" fill="#27ae60" font-weight="bold">1</text>
        <text x="60" y="50" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">0</text>
        <text x="100" y="50" font-family="Arial" font-size="14" text-anchor="middle" fill="#27ae60" font-weight="bold">1</text>
        
        <text x="20" y="80" font-family="Arial" font-size="14" text-anchor="middle" fill="#27ae60" font-weight="bold">1</text>
        <text x="60" y="80" font-family="Arial" font-size="14" text-anchor="middle" fill="#27ae60" font-weight="bold">1</text>
        <text x="100" y="80" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">0</text>
      </g>
    </g>
    
    <!-- Properties -->
    <g transform="translate(350, 30)">
      <rect x="0" y="0" width="350" height="120" rx="8" fill="#fff5e6" stroke="#f39c12" stroke-width="2"/>
      
      <text x="10" y="20" font-family="Arial" font-size="14" font-weight="bold" fill="#e67e22">
        Properties:
      </text>
      
      <text x="20" y="40" font-family="Arial" font-size="12" fill="#555">
        • Aᵢⱼ = 1 if edge exists between nodes i and j
      </text>
      <text x="20" y="60" font-family="Arial" font-size="12" fill="#555">
        • Aᵢⱼ = 0 otherwise
      </text>
      <text x="20" y="80" font-family="Arial" font-size="12" fill="#555">
        • Diagonal = 0 (no self-loops)
      </text>
      <text x="20" y="100" font-family="Arial" font-size="12" fill="#555">
        • Symmetric for undirected graphs
      </text>
    </g>
  </g>
  
  <!-- Applications -->
  <g transform="translate(50, 510)">
    <text x="0" y="0" font-family="Arial" font-size="18" font-weight="bold" fill="#34495e">
      ML Applications:
    </text>
    
    <g transform="translate(150, -10)">
      <rect x="0" y="0" width="120" height="40" rx="5" fill="#3498db" fill-opacity="0.2" stroke="#3498db" stroke-width="1"/>
      <text x="60" y="25" font-family="Arial" font-size="12" text-anchor="middle" fill="#2980b9" font-weight="bold">
        Clustering
      </text>
      
      <rect x="130" y="0" width="120" height="40" rx="5" fill="#e74c3c" fill-opacity="0.2" stroke="#e74c3c" stroke-width="1"/>
      <text x="190" y="25" font-family="Arial" font-size="12" text-anchor="middle" fill="#c0392b" font-weight="bold">
        GNNs
      </text>
      
      <rect x="260" y="0" width="120" height="40" rx="5" fill="#27ae60" fill-opacity="0.2" stroke="#27ae60" stroke-width="1"/>
      <text x="320" y="25" font-family="Arial" font-size="12" text-anchor="middle" fill="#229954" font-weight="bold">
        Recommendations
      </text>
      
      <rect x="390" y="0" width="120" height="40" rx="5" fill="#9b59b6" fill-opacity="0.2" stroke="#9b59b6" stroke-width="1"/>
      <text x="450" y="25" font-family="Arial" font-size="12" text-anchor="middle" fill="#8e44ad" font-weight="bold">
        Embeddings
      </text>
    </g>
  </g>
</svg>