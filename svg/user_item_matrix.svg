<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ratingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E74C3C;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F39C12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27AE60;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#2C3E50">
    User-Item Rating Matrix
  </text>

  <!-- Subtitle -->
  <text x="400" y="65" text-anchor="middle" font-size="14" fill="#7F8C8D">
    Netflix Example: 500,000 users × 17,000 movies (98.8% sparse)
  </text>

  <!-- Main Matrix -->
  <g transform="translate(150, 100)">
    <!-- Matrix Border -->
    <rect x="0" y="0" width="500" height="350" fill="white" stroke="#2C3E50" stroke-width="2" />
    
    <!-- Column Headers (Movies) -->
    <text x="70" y="-10" text-anchor="middle" font-size="12" fill="#34495E" font-weight="bold">Titanic</text>
    <text x="140" y="-10" text-anchor="middle" font-size="12" fill="#34495E" font-weight="bold">Pulp Fiction</text>
    <text x="210" y="-10" text-anchor="middle" font-size="12" fill="#34495E" font-weight="bold">Dirty Dancing</text>
    <text x="280" y="-10" text-anchor="middle" font-size="12" fill="#34495E" font-weight="bold">Bourne Identity</text>
    <text x="350" y="-10" text-anchor="middle" font-size="12" fill="#34495E" font-weight="bold">Die Hard</text>
    <text x="440" y="-10" text-anchor="middle" font-size="12" fill="#34495E" font-weight="bold">...</text>
    
    <!-- Row Headers (Users) -->
    <text x="-50" y="40" text-anchor="middle" font-size="12" fill="#34495E" font-weight="bold">Frank</text>
    <text x="-50" y="90" text-anchor="middle" font-size="12" fill="#34495E" font-weight="bold">User_2</text>
    <text x="-50" y="140" text-anchor="middle" font-size="12" fill="#34495E" font-weight="bold">User_3</text>
    <text x="-50" y="190" text-anchor="middle" font-size="12" fill="#34495E" font-weight="bold">Me</text>
    <text x="-50" y="240" text-anchor="middle" font-size="12" fill="#34495E" font-weight="bold">User_5</text>
    <text x="-50" y="290" text-anchor="middle" font-size="12" fill="#34495E" font-weight="bold">...</text>
    
    <!-- Grid Lines -->
    <g stroke="#D5DBDB" stroke-width="1" opacity="0.5">
      <line x1="35" y1="0" x2="35" y2="350" />
      <line x1="105" y1="0" x2="105" y2="350" />
      <line x1="175" y1="0" x2="175" y2="350" />
      <line x1="245" y1="0" x2="245" y2="350" />
      <line x1="315" y1="0" x2="315" y2="350" />
      <line x1="385" y1="0" x2="385" y2="350" />
      
      <line x1="0" y1="60" x2="500" y2="60" />
      <line x1="0" y1="110" x2="500" y2="110" />
      <line x1="0" y1="160" x2="500" y2="160" />
      <line x1="0" y1="210" x2="500" y2="210" />
      <line x1="0" y1="260" x2="500" y2="260" />
      <line x1="0" y1="310" x2="500" y2="310" />
    </g>
    
    <!-- Rating Values -->
    <!-- Row 1 (Frank - likes chick flicks) -->
    <rect x="40" y="20" width="30" height="30" fill="#3498DB" opacity="0.8" rx="3" />
    <text x="55" y="40" text-anchor="middle" fill="white" font-size="14" font-weight="bold">4</text>
    
    <rect x="110" y="20" width="30" height="30" fill="#E74C3C" opacity="0.8" rx="3" />
    <text x="125" y="40" text-anchor="middle" fill="white" font-size="14" font-weight="bold">1</text>
    
    <rect x="180" y="20" width="30" height="30" fill="#27AE60" opacity="0.8" rx="3" />
    <text x="195" y="40" text-anchor="middle" fill="white" font-size="14" font-weight="bold">5</text>
    
    <rect x="250" y="20" width="30" height="30" fill="#BDC3C7" opacity="0.5" rx="3" />
    <text x="265" y="40" text-anchor="middle" fill="#7F8C8D" font-size="14" font-weight="bold">?</text>
    
    <rect x="320" y="20" width="30" height="30" fill="#E74C3C" opacity="0.8" rx="3" />
    <text x="335" y="40" text-anchor="middle" fill="white" font-size="14" font-weight="bold">2</text>
    
    <!-- Row 2 -->
    <rect x="40" y="70" width="30" height="30" fill="#BDC3C7" opacity="0.5" rx="3" />
    <text x="55" y="90" text-anchor="middle" fill="#7F8C8D" font-size="14" font-weight="bold">?</text>
    
    <rect x="110" y="70" width="30" height="30" fill="#F39C12" opacity="0.8" rx="3" />
    <text x="125" y="90" text-anchor="middle" fill="white" font-size="14" font-weight="bold">3</text>
    
    <rect x="180" y="70" width="30" height="30" fill="#3498DB" opacity="0.8" rx="3" />
    <text x="195" y="90" text-anchor="middle" fill="white" font-size="14" font-weight="bold">4</text>
    
    <rect x="250" y="70" width="30" height="30" fill="#BDC3C7" opacity="0.5" rx="3" />
    <text x="265" y="90" text-anchor="middle" fill="#7F8C8D" font-size="14" font-weight="bold">?</text>
    
    <rect x="320" y="70" width="30" height="30" fill="#BDC3C7" opacity="0.5" rx="3" />
    <text x="335" y="90" text-anchor="middle" fill="#7F8C8D" font-size="14" font-weight="bold">?</text>
    
    <!-- Row 3 -->
    <rect x="40" y="120" width="30" height="30" fill="#27AE60" opacity="0.8" rx="3" />
    <text x="55" y="140" text-anchor="middle" fill="white" font-size="14" font-weight="bold">5</text>
    
    <rect x="110" y="120" width="30" height="30" fill="#BDC3C7" opacity="0.5" rx="3" />
    <text x="125" y="140" text-anchor="middle" fill="#7F8C8D" font-size="14" font-weight="bold">?</text>
    
    <rect x="180" y="120" width="30" height="30" fill="#BDC3C7" opacity="0.5" rx="3" />
    <text x="195" y="140" text-anchor="middle" fill="#7F8C8D" font-size="14" font-weight="bold">?</text>
    
    <rect x="250" y="120" width="30" height="30" fill="#3498DB" opacity="0.8" rx="3" />
    <text x="265" y="140" text-anchor="middle" fill="white" font-size="14" font-weight="bold">4</text>
    
    <rect x="320" y="120" width="30" height="30" fill="#BDC3C7" opacity="0.5" rx="3" />
    <text x="335" y="140" text-anchor="middle" fill="#7F8C8D" font-size="14" font-weight="bold">?</text>
    
    <!-- Row 4 (Me - likes action movies) -->
    <rect x="40" y="170" width="30" height="30" fill="#E74C3C" opacity="0.8" rx="3" />
    <text x="55" y="190" text-anchor="middle" fill="white" font-size="14" font-weight="bold">2</text>
    
    <rect x="110" y="170" width="30" height="30" fill="#27AE60" opacity="0.8" rx="3" />
    <text x="125" y="190" text-anchor="middle" fill="white" font-size="14" font-weight="bold">5</text>
    
    <rect x="180" y="170" width="30" height="30" fill="#BDC3C7" opacity="0.5" rx="3" />
    <text x="195" y="190" text-anchor="middle" fill="#7F8C8D" font-size="14" font-weight="bold">?</text>
    
    <rect x="250" y="170" width="30" height="30" fill="#27AE60" opacity="0.8" rx="3" />
    <text x="265" y="190" text-anchor="middle" fill="white" font-size="14" font-weight="bold">5</text>
    
    <rect x="320" y="170" width="30" height="30" fill="#3498DB" opacity="0.8" rx="3" />
    <text x="335" y="190" text-anchor="middle" fill="white" font-size="14" font-weight="bold">4</text>
    
    <!-- Row 5 -->
    <rect x="40" y="220" width="30" height="30" fill="#BDC3C7" opacity="0.5" rx="3" />
    <text x="55" y="240" text-anchor="middle" fill="#7F8C8D" font-size="14" font-weight="bold">?</text>
    
    <rect x="110" y="220" width="30" height="30" fill="#BDC3C7" opacity="0.5" rx="3" />
    <text x="125" y="240" text-anchor="middle" fill="#7F8C8D" font-size="14" font-weight="bold">?</text>
    
    <rect x="180" y="220" width="30" height="30" fill="#F39C12" opacity="0.8" rx="3" />
    <text x="195" y="240" text-anchor="middle" fill="white" font-size="14" font-weight="bold">3</text>
    
    <rect x="250" y="220" width="30" height="30" fill="#BDC3C7" opacity="0.5" rx="3" />
    <text x="265" y="240" text-anchor="middle" fill="#7F8C8D" font-size="14" font-weight="bold">?</text>
    
    <rect x="320" y="220" width="30" height="30" fill="#27AE60" opacity="0.8" rx="3" />
    <text x="335" y="240" text-anchor="middle" fill="white" font-size="14" font-weight="bold">5</text>
    
    <!-- More dots for continuation -->
    <text x="250" y="290" text-anchor="middle" fill="#7F8C8D" font-size="20">...</text>
    <text x="440" y="175" text-anchor="middle" fill="#7F8C8D" font-size="20">...</text>
  </g>
  
  <!-- Legend -->
  <g transform="translate(100, 480)">
    <text x="0" y="0" font-size="14" font-weight="bold" fill="#2C3E50">Rating Legend:</text>
    
    <rect x="100" y="-15" width="25" height="20" fill="#27AE60" opacity="0.8" rx="2" />
    <text x="130" y="0" font-size="12" fill="#2C3E50">5 - Love it</text>
    
    <rect x="200" y="-15" width="25" height="20" fill="#3498DB" opacity="0.8" rx="2" />
    <text x="230" y="0" font-size="12" fill="#2C3E50">4 - Like it</text>
    
    <rect x="300" y="-15" width="25" height="20" fill="#F39C12" opacity="0.8" rx="2" />
    <text x="330" y="0" font-size="12" fill="#2C3E50">3 - Neutral</text>
    
    <rect x="400" y="-15" width="25" height="20" fill="#E74C3C" opacity="0.8" rx="2" />
    <text x="430" y="0" font-size="12" fill="#2C3E50">1-2 - Dislike</text>
    
    <rect x="520" y="-15" width="25" height="20" fill="#BDC3C7" opacity="0.5" rx="2" />
    <text x="550" y="0" font-size="12" fill="#2C3E50">? - Missing</text>
  </g>
  
  <!-- Statistics Box -->
  <g transform="translate(100, 520)">
    <rect x="0" y="0" width="600" height="50" rx="5" fill="#ECF0F1" stroke="#BDC3C7" />
    <text x="300" y="20" text-anchor="middle" font-size="12" fill="#2C3E50" font-weight="bold">
      Matrix Statistics
    </text>
    <text x="100" y="40" text-anchor="middle" font-size="11" fill="#34495E">
      Total Entries: 8.5B
    </text>
    <text x="250" y="40" text-anchor="middle" font-size="11" fill="#34495E">
      Observed: 100M (1.2%)
    </text>
    <text x="400" y="40" text-anchor="middle" font-size="11" fill="#34495E">
      Missing: 8.4B (98.8%)
    </text>
    <text x="520" y="40" text-anchor="middle" font-size="11" fill="#34495E">
      Avg Rating: 3.5
    </text>
  </g>
</svg>