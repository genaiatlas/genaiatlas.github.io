<svg viewBox="0 0 800 550" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="posteriorFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34a853;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#34a853;stop-opacity:0.3"/>
    </linearGradient>
    <linearGradient id="priorFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4285f4;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#4285f4;stop-opacity:0.2"/>
    </linearGradient>
    <linearGradient id="likelihoodFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ea4335;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#ea4335;stop-opacity:0.2"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="550" fill="#fafafa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1a1a1a">
    Maximum a Posteriori (MAP) Estimation
  </text>
  
  <!-- Main Chart Area -->
  <rect x="80" y="60" width="640" height="280" fill="white" stroke="#ddd" stroke-width="1"/>
  
  <!-- Axes -->
  <line x1="100" y1="320" x2="700" y2="320" stroke="#333" stroke-width="2"/>
  <line x1="100" y1="320" x2="100" y2="80" stroke="#333" stroke-width="2"/>
  
  <!-- X-axis labels -->
  <text x="200" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">θ₁</text>
  <text x="350" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">θ₂</text>
  <text x="500" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">θ₃</text>
  <text x="650" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">θ₄</text>
  
  <!-- Y-axis label -->
  <text x="50" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333" transform="rotate(-90 50 200)">
    Probability Density
  </text>
  <text x="400" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">
    Parameter θ
  </text>
  
  <!-- Prior Distribution -->
  <path d="M 120 300 Q 200 250 300 240 Q 400 235 500 240 Q 600 250 680 300" 
        fill="url(#priorFill)" stroke="#4285f4" stroke-width="2"/>
  <text x="150" y="225" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#4285f4">
    Prior P(θ)
  </text>
  
  <!-- Likelihood (scaled and shifted) -->
  <path d="M 120 310 Q 250 200 350 150 Q 450 120 550 140 Q 650 180 680 280" 
        fill="url(#likelihoodFill)" stroke="#ea4335" stroke-width="2" opacity="0.8"/>
  <text x="400" y="110" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ea4335">
    Likelihood P(D|θ)
  </text>
  
  <!-- Posterior Distribution -->
  <path d="M 120 310 Q 250 180 350 130 Q 450 100 500 105 Q 550 115 600 150 Q 650 200 680 280" 
        fill="url(#posteriorFill)" stroke="#34a853" stroke-width="3"/>
  <text x="480" y="95" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#34a853">
    Posterior P(θ|D)
  </text>
  
  <!-- MAP Estimate -->
  <line x1="480" y1="85" x2="480" y2="320" stroke="#d63031" stroke-width="3" stroke-dasharray="5,5"/>
  <circle cx="480" cy="105" r="5" fill="#d63031"/>
  <text x="485" y="80" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#d63031">
    θ_MAP
  </text>
  
  <!-- MLE for comparison -->
  <line x1="450" y1="85" x2="450" y2="320" stroke="#ff6b35" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="455" y="75" font-family="Arial, sans-serif" font-size="11" fill="#ff6b35">
    θ_MLE
  </text>
  
  <!-- Formula Box -->
  <rect x="100" y="390" width="280" height="130" rx="5" fill="#e3f2fd" stroke="#1976d2" stroke-width="1"/>
  <text x="240" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1a1a1a">
    MAP Estimation
  </text>
  <text x="240" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">
    θ_MAP = argmax P(θ|D)
  </text>
  <text x="240" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">
    = argmax [P(D|θ) × P(θ)]
  </text>
  <text x="240" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">
    = argmax [log P(D|θ) + log P(θ)]
  </text>
  <text x="120" y="495" font-family="Arial, sans-serif" font-size="11" fill="#555">
    • Point estimate balancing data and prior
  </text>
  <text x="120" y="510" font-family="Arial, sans-serif" font-size="11" fill="#555">
    • Equivalent to regularized MLE
  </text>
  
  <!-- Comparison Table -->
  <rect x="420" y="390" width="320" height="130" rx="5" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="580" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1a1a1a">
    MAP vs MLE vs Full Bayesian
  </text>
  
  <!-- Table Headers -->
  <text x="440" y="430" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">Method</text>
  <text x="520" y="430" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">Objective</text>
  <text x="650" y="430" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">Output</text>
  
  <line x1="430" y1="435" x2="720" y2="435" stroke="#dee2e6" stroke-width="1"/>
  
  <!-- Table Rows -->
  <text x="440" y="450" font-family="Arial, sans-serif" font-size="10" fill="#ff6b35" font-weight="bold">MLE</text>
  <text x="520" y="450" font-family="Arial, sans-serif" font-size="10" fill="#333">max P(D|θ)</text>
  <text x="650" y="450" font-family="Arial, sans-serif" font-size="10" fill="#333">Point estimate</text>
  
  <text x="440" y="465" font-family="Arial, sans-serif" font-size="10" fill="#d63031" font-weight="bold">MAP</text>
  <text x="520" y="465" font-family="Arial, sans-serif" font-size="10" fill="#333">max P(θ|D)</text>
  <text x="650" y="465" font-family="Arial, sans-serif" font-size="10" fill="#333">Point estimate</text>
  
  <text x="440" y="480" font-family="Arial, sans-serif" font-size="10" fill="#34a853" font-weight="bold">Bayesian</text>
  <text x="520" y="480" font-family="Arial, sans-serif" font-size="10" fill="#333">Full P(θ|D)</text>
  <text x="650" y="480" font-family="Arial, sans-serif" font-size="10" fill="#333">Distribution</text>
  
  <text x="440" y="500" font-family="Arial, sans-serif" font-size="10" font-style="italic" fill="#666">
    MAP provides regularization through prior while remaining computationally tractable
  </text>
</svg>