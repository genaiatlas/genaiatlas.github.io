<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    Dropout Mechanism: Training vs Testing
  </text>
  
  <!-- Training Phase -->
  <g id="training-phase">
    <text x="200" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#e74c3c">
      Training Phase (Dropout = 0.5)
    </text>
    
    <!-- Input Layer -->
    <g id="input-layer-train" transform="translate(50, 100)">
      <text x="50" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
        Input Layer
      </text>
      
      <circle cx="50" cy="30" r="15" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
      <text x="50" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" font-weight="bold">1</text>
      
      <circle cx="50" cy="70" r="15" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
      <text x="50" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" font-weight="bold">1</text>
      
      <circle cx="50" cy="110" r="15" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
      <text x="50" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" font-weight="bold">1</text>
      
      <circle cx="50" cy="150" r="15" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
      <text x="50" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" font-weight="bold">1</text>
    </g>
    
    <!-- Hidden Layer 1 (with dropout) -->
    <g id="hidden1-layer-train" transform="translate(200, 100)">
      <text x="50" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
        Hidden Layer 1
      </text>
      
      <!-- Active neurons -->
      <circle cx="50" cy="30" r="15" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
      <text x="50" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" font-weight="bold">A</text>
      
      <!-- Dropped neuron -->
      <circle cx="50" cy="70" r="15" fill="#95a5a6" stroke="#7f8c8d" stroke-width="2" stroke-dasharray="3,3"/>
      <text x="50" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#e74c3c" font-weight="bold">×</text>
      
      <!-- Active neurons -->
      <circle cx="50" cy="110" r="15" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
      <text x="50" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" font-weight="bold">A</text>
      
      <!-- Dropped neuron -->
      <circle cx="50" cy="150" r="15" fill="#95a5a6" stroke="#7f8c8d" stroke-width="2" stroke-dasharray="3,3"/>
      <text x="50" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#e74c3c" font-weight="bold">×</text>
      
      <circle cx="50" cy="190" r="15" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
      <text x="50" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" font-weight="bold">A</text>
    </g>
    
    <!-- Hidden Layer 2 (with dropout) -->
    <g id="hidden2-layer-train" transform="translate(350, 100)">
      <text x="50" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
        Hidden Layer 2
      </text>
      
      <!-- Dropped neuron -->
      <circle cx="50" cy="50" r="15" fill="#95a5a6" stroke="#7f8c8d" stroke-width="2" stroke-dasharray="3,3"/>
      <text x="50" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#e74c3c" font-weight="bold">×</text>
      
      <!-- Active neurons -->
      <circle cx="50" cy="90" r="15" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
      <text x="50" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" font-weight="bold">A</text>
      
      <circle cx="50" cy="130" r="15" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
      <text x="50" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" font-weight="bold">A</text>
      
      <!-- Dropped neuron -->
      <circle cx="50" cy="170" r="15" fill="#95a5a6" stroke="#7f8c8d" stroke-width="2" stroke-dasharray="3,3"/>
      <text x="50" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#e74c3c" font-weight="bold">×</text>
    </g>
    
    <!-- Connections for training -->
    <g stroke="#34495e" stroke-width="2" opacity="0.8">
      <!-- From input to hidden1 (only to active neurons) -->
      <line x1="65" y1="130" x2="185" y2="130"/>
      <line x1="65" y1="130" x2="185" y2="210"/>
      <line x1="65" y1="170" x2="185" y2="130"/>
      <line x1="65" y1="170" x2="185" y2="210"/>
      
      <!-- From hidden1 to hidden2 (only from/to active neurons) -->
      <line x1="265" y1="130" x2="335" y2="190"/>
      <line x1="265" y1="130" x2="335" y2="230"/>
      <line x1="265" y1="210" x2="335" y2="190"/>
      <line x1="265" y1="210" x2="335" y2="230"/>
    </g>
    
    <!-- Disabled connections (dashed) -->
    <g stroke="#95a5a6" stroke-width="1" stroke-dasharray="3,3" opacity="0.4">
      <line x1="65" y1="130" x2="185" y2="170"/>
      <line x1="65" y1="170" x2="185" y2="170"/>
      <line x1="265" y1="130" x2="335" y2="150"/>
      <line x1="265" y1="210" x2="335" y2="150"/>
      <line x1="265" y1="130" x2="335" y2="270"/>
      <line x1="265" y1="210" x2="335" y2="270"/>
    </g>
  </g>
  
  <!-- Testing Phase -->
  <g id="testing-phase" transform="translate(450, 0)">
    <text x="200" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#27ae60">
      Testing Phase (No Dropout)
    </text>
    
    <!-- Input Layer -->
    <g id="input-layer-test" transform="translate(50, 100)">
      <text x="50" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
        Input Layer
      </text>
      
      <circle cx="50" cy="30" r="15" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
      <text x="50" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" font-weight="bold">1</text>
      
      <circle cx="50" cy="70" r="15" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
      <text x="50" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" font-weight="bold">1</text>
      
      <circle cx="50" cy="110" r="15" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
      <text x="50" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" font-weight="bold">1</text>
      
      <circle cx="50" cy="150" r="15" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
      <text x="50" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" font-weight="bold">1</text>
    </g>
    
    <!-- Hidden Layer 1 (all active, scaled weights) -->
    <g id="hidden1-layer-test" transform="translate(200, 100)">
      <text x="50" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
        Hidden Layer 1
      </text>
      
      <circle cx="50" cy="30" r="15" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
      <text x="50" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white" font-weight="bold">0.5</text>
      
      <circle cx="50" cy="70" r="15" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
      <text x="50" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white" font-weight="bold">0.5</text>
      
      <circle cx="50" cy="110" r="15" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
      <text x="50" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white" font-weight="bold">0.5</text>
      
      <circle cx="50" cy="150" r="15" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
      <text x="50" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white" font-weight="bold">0.5</text>
      
      <circle cx="50" cy="190" r="15" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
      <text x="50" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white" font-weight="bold">0.5</text>
    </g>
    
    <!-- Hidden Layer 2 (all active, scaled weights) -->
    <g id="hidden2-layer-test" transform="translate(350, 100)">
      <text x="50" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
        Hidden Layer 2
      </text>
      
      <circle cx="50" cy="50" r="15" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
      <text x="50" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white" font-weight="bold">0.5</text>
      
      <circle cx="50" cy="90" r="15" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
      <text x="50" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white" font-weight="bold">0.5</text>
      
      <circle cx="50" cy="130" r="15" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
      <text x="50" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white" font-weight="bold">0.5</text>
      
      <circle cx="50" cy="170" r="15" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
      <text x="50" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white" font-weight="bold">0.5</text>
    </g>
    
    <!-- All connections active (scaled) -->
    <g stroke="#27ae60" stroke-width="1" opacity="0.6">
      <!-- From input to hidden1 -->
      <line x1="65" y1="130" x2="185" y2="130"/>
      <line x1="65" y1="130" x2="185" y2="170"/>
      <line x1="65" y1="130" x2="185" y2="210"/>
      <line x1="65" y1="170" x2="185" y2="130"/>
      <line x1="65" y1="170" x2="185" y2="170"/>
      <line x1="65" y1="170" x2="185" y2="210"/>
      
      <!-- From hidden1 to hidden2 -->
      <line x1="265" y1="130" x2="335" y2="150"/>
      <line x1="265" y1="130" x2="335" y2="190"/>
      <line x1="265" y1="170" x2="335" y2="150"/>
      <line x1="265" y1="170" x2="335" y2="190"/>
      <line x1="265" y1="210" x2="335" y2="150"/>
      <line x1="265" y1="210" x2="335" y2="190"/>
    </g>
  </g>
  
  <!-- Explanation Boxes -->
  
  <!-- Dropout Benefits -->
  <g id="benefits" transform="translate(50, 380)">
    <rect width="350" height="140" rx="8" fill="#e8f5e8" stroke="#27ae60" stroke-width="2"/>
    <text x="175" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#229954">
      Benefits of Dropout
    </text>
    
    <text x="20" y="50" font-family="Arial, sans-serif" font-size="12" fill="#34495e">
      <tspan font-weight="bold">• Prevents Co-dependency:</tspan> Neurons cannot rely on specific other neurons
    </text>
    
    <text x="20" y="70" font-family="Arial, sans-serif" font-size="12" fill="#34495e">
      <tspan font-weight="bold">• Reduces Overfitting:</tspan> Network learns more robust representations
    </text>
    
    <text x="20" y="90" font-family="Arial, sans-serif" font-size="12" fill="#34495e">
      <tspan font-weight="bold">• Ensemble Effect:</tspan> Training multiple sub-networks simultaneously
    </text>
    
    <text x="20" y="110" font-family="Arial, sans-serif" font-size="12" fill="#34495e">
      <tspan font-weight="bold">• Better Generalization:</tspan> Improved performance on unseen data
    </text>
  </g>
  
  <!-- Implementation Details -->
  <g id="implementation" transform="translate(450, 380)">
    <rect width="300" height="140" rx="8" fill="#fff3e0" stroke="#f39c12" stroke-width="2"/>
    <text x="150" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#d35400">
      Implementation Details
    </text>
    
    <text x="20" y="50" font-family="Arial, sans-serif" font-size="12" fill="#34495e">
      <tspan font-weight="bold">Training:</tspan> Randomly drop neurons with probability p
    </text>
    
    <text x="20" y="70" font-family="Arial, sans-serif" font-size="12" fill="#34495e">
      <tspan font-weight="bold">Testing:</tspan> Use all neurons, multiply weights by (1-p)
    </text>
    
    <text x="20" y="90" font-family="Arial, sans-serif" font-size="12" fill="#34495e">
      <tspan font-weight="bold">Common Rate:</tspan> p = 0.5 for hidden layers, 0.2 for input
    </text>
    
    <text x="20" y="110" font-family="Arial, sans-serif" font-size="12" fill="#34495e">
      <tspan font-weight="bold">Scaling:</tspan> Maintains expected activation magnitude
    </text>
  </g>
  
  <!-- Mathematical Formula -->
  <g id="formula" transform="translate(200, 540)">
    <rect width="400" height="40" rx="8" fill="#f1f2f6" stroke="#57606f" stroke-width="1"/>
    <text x="200" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">
      Dropout Formula:
    </text>
    <text x="200" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#34495e">
      y<tspan dy="3" font-size="10">i</tspan> = <tspan dy="-3">{ 0 with probability p, x</tspan><tspan dy="3" font-size="10">i</tspan><tspan dy="-3">/(1-p) with probability (1-p) }</tspan>
    </text>
  </g>
  
  <!-- Legend -->
  <g id="legend" transform="translate(50, 320)">
    <circle cx="20" cy="10" r="8" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
    <text x="35" y="15" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Active Neuron</text>
    
    <circle cx="150" cy="10" r="8" fill="#95a5a6" stroke="#7f8c8d" stroke-width="2" stroke-dasharray="2,2"/>
    <text x="165" y="15" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Dropped Neuron</text>
    
    <line x1="280" y1="10" x2="310" y2="10" stroke="#34495e" stroke-width="2"/>
    <text x="320" y="15" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Active Connection</text>
    
    <line x1="450" y1="10" x2="480" y2="10" stroke="#95a5a6" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="490" y="15" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Disabled Connection</text>
  </g>
</svg>