<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mountainCluster" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ECC71;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#27AE60;stop-opacity:0.7" />
    </linearGradient>
    <linearGradient id="adventureCluster" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E74C3C;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#C0392B;stop-opacity:0.7" />
    </linearGradient>
    <linearGradient id="balancedCluster" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498DB;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#2980B9;stop-opacity:0.7" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="600" fill="#F8F9FA"/>
  
  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2C3E50">
    PCA Results: Natural Clustering in 2D Space
  </text>
  
  <!-- Plot Area -->
  <rect x="150" y="80" width="500" height="400" fill="white" stroke="#BDC3C7" stroke-width="2" rx="5"/>
  
  <!-- Grid Lines -->
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#ECF0F1" stroke-width="1"/>
    </pattern>
  </defs>
  <rect x="150" y="80" width="500" height="400" fill="url(#grid)"/>
  
  <!-- Axes -->
  <line x1="150" y1="280" x2="650" y2="280" stroke="#2C3E50" stroke-width="2"/>
  <line x1="400" y1="80" x2="400" y2="480" stroke="#2C3E50" stroke-width="2"/>
  
  <!-- Axis Labels -->
  <text x="400" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2C3E50">
    PC1: Adventure Component
  </text>
  <text x="120" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2C3E50" transform="rotate(-90 120 285)">
    PC2: Mountain Component
  </text>
  
  <!-- Scale markers -->
  <text x="250" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7F8C8D">-10</text>
  <text x="325" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7F8C8D">-5</text>
  <text x="395" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7F8C8D">0</text>
  <text x="475" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7F8C8D">5</text>
  <text x="550" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7F8C8D">10</text>
  
  <text x="385" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7F8C8D">10</text>
  <text x="385" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7F8C8D">5</text>
  <text x="385" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7F8C8D">0</text>
  <text x="385" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7F8C8D">-5</text>
  <text x="385" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7F8C8D">-10</text>
  
  <!-- Mountain Lovers Cluster -->
  <ellipse cx="320" cy="190" rx="60" ry="40" fill="url(#mountainCluster)" stroke="#27AE60" stroke-width="2"/>
  
  <!-- Anne (Mountain lover) -->
  <circle cx="310" cy="180" r="8" fill="#2ECC71" stroke="#27AE60" stroke-width="2"/>
  <text x="310" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#27AE60">ANNE</text>
  
  <!-- Joe (Mountain lover) -->
  <circle cx="330" cy="200" r="8" fill="#2ECC71" stroke="#27AE60" stroke-width="2"/>
  <text x="330" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#27AE60">JOE</text>
  
  <!-- Adventure Seekers Cluster -->
  <ellipse cx="520" cy="360" rx="65" ry="45" fill="url(#adventureCluster)" stroke="#C0392B" stroke-width="2"/>
  
  <!-- Jen (Adventure seeker) -->
  <circle cx="530" cy="350" r="8" fill="#E74C3C" stroke="#C0392B" stroke-width="2"/>
  <text x="530" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#C0392B">JEN</text>
  
  <!-- Maggie (Adventure seeker) -->
  <circle cx="510" cy="370" r="8" fill="#E74C3C" stroke="#C0392B" stroke-width="2"/>
  <text x="510" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#C0392B">MAGGIE</text>
  
  <!-- Balanced Preferences Cluster -->
  <ellipse cx="350" cy="340" rx="55" ry="35" fill="url(#balancedCluster)" stroke="#2980B9" stroke-width="2"/>
  
  <!-- Bill (Balanced) -->
  <circle cx="340" cy="330" r="8" fill="#3498DB" stroke="#2980B9" stroke-width="2"/>
  <text x="340" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2980B9">BILL</text>
  
  <!-- Chris (Balanced) -->
  <circle cx="360" cy="350" r="8" fill="#3498DB" stroke="#2980B9" stroke-width="2"/>
  <text x="360" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2980B9">CHRIS</text>
  
  <!-- Legend -->
  <rect x="680" y="120" width="180" height="200" fill="#ECF0F1" stroke="#BDC3C7" stroke-width="2" rx="10"/>
  <text x="770" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2C3E50">
    Cluster Analysis
  </text>
  
  <!-- Mountain Lovers Legend -->
  <circle cx="700" cy="170" r="8" fill="#2ECC71" stroke="#27AE60" stroke-width="2"/>
  <text x="720" y="175" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#27AE60">Mountain Lovers</text>
  <text x="720" y="190" font-family="Arial, sans-serif" font-size="10" fill="#2C3E50">High PC2 scores</text>
  <text x="720" y="202" font-family="Arial, sans-serif" font-size="10" fill="#2C3E50">Prefer Alpine/Himalayas</text>
  
  <!-- Adventure Seekers Legend -->
  <circle cx="700" cy="220" r="8" fill="#E74C3C" stroke="#C0392B" stroke-width="2"/>
  <text x="720" y="225" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#C0392B">Adventure Seekers</text>
  <text x="720" y="240" font-family="Arial, sans-serif" font-size="10" fill="#2C3E50">High PC1 scores</text>
  <text x="720" y="252" font-family="Arial, sans-serif" font-size="10" fill="#2C3E50">Prefer Himalayas/Scuba</text>
  
  <!-- Balanced Preferences Legend -->
  <circle cx="700" cy="270" r="8" fill="#3498DB" stroke="#2980B9" stroke-width="2"/>
  <text x="720" y="275" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2980B9">Balanced</text>
  <text x="720" y="290" font-family="Arial, sans-serif" font-size="10" fill="#2C3E50">Moderate scores</text>
  <text x="720" y="302" font-family="Arial, sans-serif" font-size="10" fill="#2C3E50">Varied preferences</text>
  
  <!-- Insight Box -->
  <rect x="50" y="500" width="800" height="85" fill="#34495E" rx="10"/>
  <text x="450" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
    Key Insights from PCA Visualization
  </text>
  <text x="450" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="white">
    🎯 Natural clusters emerge without supervised learning
  </text>
  <text x="450" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="white">
    📊 Two dimensions capture essential preference patterns from four original features
  </text>
  <text x="450" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="white">
    💡 Clear separation enables targeted marketing and recommendation systems
  </text>
</svg>