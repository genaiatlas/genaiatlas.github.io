<svg viewBox="0 0 1200 1100" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="1100" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="600" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    RAG Workflow: From Query to Answer
  </text>
  
  <!-- Stage 1: Query Processing -->
  <g id="stage1">
    <rect x="50" y="100" width="300" height="120" rx="10" fill="#fff3bf" stroke="#f59f00" stroke-width="3"/>
    <text x="200" y="130" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Stage 1: Query Processing
    </text>
    <text x="200" y="155" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#495057">
      Input: Natural language question
    </text>
    <text x="200" y="177" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#495057">
      Process: Parse intent &amp; entities
    </text>
    <text x="200" y="199" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#495057">
      Output: Structured query
    </text>
  </g>
  
  <!-- Arrow 1 -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#495057"/>
    </marker>
  </defs>
  <line x1="200" y1="220" x2="200" y2="260" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  
  <!-- Stage 2: Query Optimization -->
  <g id="stage2">
    <rect x="50" y="270" width="300" height="120" rx="10" fill="#ffdeeb" stroke="#e64980" stroke-width="3"/>
    <text x="200" y="300" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Stage 2: Query Optimization
    </text>
    <text x="200" y="325" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#495057">
      Input: Structured query
    </text>
    <text x="200" y="347" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#495057">
      Process: Decompose/rephrase
    </text>
    <text x="200" y="369" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#495057">
      Output: Optimized query variants
    </text>
  </g>
  
  <!-- Arrow 2 -->
  <line x1="200" y1="390" x2="200" y2="430" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  
  <!-- Stage 3: Source Selection -->
  <g id="stage3">
    <rect x="50" y="440" width="300" height="120" rx="10" fill="#ffd8a8" stroke="#fd7e14" stroke-width="3"/>
    <text x="200" y="470" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Stage 3: Source Selection
    </text>
    <text x="200" y="495" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#495057">
      Input: Optimized queries
    </text>
    <text x="200" y="517" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#495057">
      Process: Route to best sources
    </text>
    <text x="200" y="539" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#495057">
      Output: Routing decisions
    </text>
  </g>
  
  <!-- Arrow 3 -->
  <line x1="200" y1="560" x2="200" y2="600" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  
  <!-- Stage 4: Information Retrieval -->
  <g id="stage4">
    <rect x="50" y="610" width="300" height="120" rx="10" fill="#d3f9d8" stroke="#37b24d" stroke-width="3"/>
    <text x="200" y="640" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Stage 4: Information Retrieval
    </text>
    <text x="200" y="665" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#495057">
      Input: Routing + queries
    </text>
    <text x="200" y="687" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#495057">
      Process: Search selected sources
    </text>
    <text x="200" y="709" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#495057">
      Output: Ranked documents
    </text>
  </g>
  
  <!-- Arrow 4 -->
  <line x1="200" y1="730" x2="200" y2="770" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  
  <!-- Stage 5: Context Preparation -->
  <g id="stage5">
    <rect x="50" y="780" width="300" height="120" rx="10" fill="#d0ebff" stroke="#1c7ed6" stroke-width="3"/>
    <text x="200" y="810" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Stage 5: Context Preparation
    </text>
    <text x="200" y="835" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#495057">
      Input: Retrieved documents
    </text>
    <text x="200" y="857" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#495057">
      Process: Rank, filter, organize
    </text>
    <text x="200" y="879" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#495057">
      Output: Curated context
    </text>
  </g>
  
  <!-- Arrow 5 -->
  <line x1="200" y1="900" x2="200" y2="940" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  
  <!-- Stage 6: Response Generation -->
  <g id="stage6">
    <rect x="50" y="950" width="300" height="120" rx="10" fill="#e9d5ff" stroke="#9333ea" stroke-width="3"/>
    <text x="200" y="980" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Stage 6: Response Generation
    </text>
    <text x="200" y="1005" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#495057">
      Input: Query + context
    </text>
    <text x="200" y="1027" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#495057">
      Process: LLM generates answer
    </text>
    <text x="200" y="1049" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#495057">
      Output: Answer with citations
    </text>
  </g>
  
  <!-- Right Side: Detailed Techniques -->
  <g id="techniques-header">
    <text x="750" y="120" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Techniques &amp; Methods
    </text>
  </g>
  
  <!-- Techniques for Stage 1 -->
  <g id="tech1">
    <rect x="500" y="150" width="500" height="60" rx="8" fill="#fff" stroke="#f59f00" stroke-width="2"/>
    <text x="520" y="175" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#495057">
      Query Processing Techniques:
    </text>
    <text x="520" y="195" font-family="Arial, sans-serif" font-size="13" fill="#495057">
      NLP Parsing • Intent Classification • Entity Extraction • Query Understanding
    </text>
  </g>
  
  <!-- Techniques for Stage 2 -->
  <g id="tech2">
    <rect x="500" y="320" width="500" height="60" rx="8" fill="#fff" stroke="#e64980" stroke-width="2"/>
    <text x="520" y="345" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#495057">
      Query Optimization Techniques:
    </text>
    <text x="520" y="365" font-family="Arial, sans-serif" font-size="13" fill="#495057">
      Multi-Query • Step-Back • RAG-Fusion • Decomposition • HyDE
    </text>
  </g>
  
  <!-- Techniques for Stage 3 -->
  <g id="tech3">
    <rect x="500" y="490" width="500" height="60" rx="8" fill="#fff" stroke="#fd7e14" stroke-width="2"/>
    <text x="520" y="515" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#495057">
      Source Selection Techniques:
    </text>
    <text x="520" y="535" font-family="Arial, sans-serif" font-size="13" fill="#495057">
      Logical Routing • Semantic Routing • Rule-Based • Embedding Similarity
    </text>
  </g>
  
  <!-- Techniques for Stage 4 -->
  <g id="tech4">
    <rect x="500" y="660" width="500" height="60" rx="8" fill="#fff" stroke="#37b24d" stroke-width="2"/>
    <text x="520" y="685" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#495057">
      Retrieval Techniques:
    </text>
    <text x="520" y="705" font-family="Arial, sans-serif" font-size="13" fill="#495057">
      Vector Search • Keyword Search • Hybrid Search • Dense Retrieval
    </text>
  </g>
  
  <!-- Techniques for Stage 5 -->
  <g id="tech5">
    <rect x="500" y="830" width="500" height="60" rx="8" fill="#fff" stroke="#1c7ed6" stroke-width="2"/>
    <text x="520" y="855" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#495057">
      Context Preparation Techniques:
    </text>
    <text x="520" y="875" font-family="Arial, sans-serif" font-size="13" fill="#495057">
      Re-Ranking • RankGPT • Compression • Filtering • Diversity Optimization
    </text>
  </g>
  
  <!-- Techniques for Stage 6 -->
  <g id="tech6">
    <rect x="500" y="1000" width="500" height="60" rx="8" fill="#fff" stroke="#9333ea" stroke-width="2"/>
    <text x="520" y="1025" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#495057">
      Generation Techniques:
    </text>
    <text x="520" y="1045" font-family="Arial, sans-serif" font-size="13" fill="#495057">
      Self-RAG • Active Retrieval • HRR • Prompt Engineering • Citation
    </text>
  </g>
  
  <!-- Connecting Lines -->
  <line x1="350" y1="160" x2="490" y2="180" stroke="#f59f00" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <line x1="350" y1="330" x2="490" y2="350" stroke="#e64980" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <line x1="350" y1="500" x2="490" y2="520" stroke="#fd7e14" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <line x1="350" y1="670" x2="490" y2="690" stroke="#37b24d" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <line x1="350" y1="840" x2="490" y2="860" stroke="#1c7ed6" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <line x1="350" y1="1010" x2="490" y2="1030" stroke="#9333ea" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  
  <!-- Feedback Loop Arrow -->
  <path d="M 350 1020 Q 420 1080 200 1080 Q 20 1080 20 900 Q 20 400 20 160 Q 20 80 50 140" 
        stroke="#9333ea" stroke-width="3" fill="none" stroke-dasharray="8,8" marker-end="url(#arrow)"/>
  
  <text x="25" y="620" font-family="Arial, sans-serif" font-size="14" fill="#9333ea" font-weight="bold" transform="rotate(-90 25 620)">
    Active Retrieval Feedback Loop
  </text>
  
  <!-- Quality Check Box -->
  <g id="quality-check">
    <rect x="450" y="250" width="700" height="50" rx="8" fill="#fff9db" stroke="#fab005" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="800" y="272" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#e67700">
      ⚡ Stage 7: Quality Assurance (Continuous)
    </text>
    <text x="800" y="292" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#495057">
      Validate accuracy • Check relevance • Confidence scoring • Retry if needed
    </text>
  </g>
</svg>