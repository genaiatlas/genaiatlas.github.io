<svg viewBox="0 0 1000 650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="vectorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dbeafe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bfdbfe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="graphGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ecfdf5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dcfce7;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="nodeGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e5e7eb;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1f2937">
    Similarity Computation and Graph Construction
  </text>
  
  <!-- Step 1: TF-IDF Vectors -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="200" height="160" rx="8" fill="url(#vectorGrad)" stroke="#3b82f6" stroke-width="2"/>
    <text x="100" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e40af">TF-IDF Vectors</text>
    
    <!-- Article 1 Vector -->
    <text x="10" y="50" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e40af">Article 1:</text>
    <rect x="10" y="55" width="180" height="15" rx="2" fill="white" stroke="#3b82f6" stroke-width="1"/>
    <text x="15" y="66" font-family="monospace" font-size="9" fill="#374151">[0.003, 0, 0.025, 0.087, ...]</text>
    
    <!-- Article 2 Vector -->
    <text x="10" y="85" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e40af">Article 2:</text>
    <rect x="10" y="90" width="180" height="15" rx="2" fill="white" stroke="#3b82f6" stroke-width="1"/>
    <text x="15" y="101" font-family="monospace" font-size="9" fill="#374151">[0.001, 0.042, 0.019, 0.105, ...]</text>
    
    <!-- Dimensions info -->
    <text x="100" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1e40af">1,063 dimensions</text>
    <text x="100" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1e40af">60 total articles</text>
  </g>
  
  <!-- Arrow -->
  <path d="M 270 160 L 310 160" stroke="#3b82f6" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Step 2: Pairwise Distance Calculation -->
  <g transform="translate(330, 80)">
    <rect x="0" y="0" width="220" height="160" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="110" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#92400e">Distance Calculation</text>
    
    <!-- Formula -->
    <rect x="20" y="40" width="180" height="35" rx="3" fill="white" stroke="#f59e0b" stroke-width="1"/>
    <text x="110" y="55" text-anchor="middle" font-family="monospace" font-size="12" fill="#92400e">d(A₁,A₂) = Σ(x₁ⱼ - x₂ⱼ)²</text>
    <text x="110" y="67" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#92400e">Euclidean distance</text>
    
    <!-- Example calculation -->
    <text x="20" y="95" font-family="Arial, sans-serif" font-size="11" fill="#92400e">Example:</text>
    <text x="20" y="110" font-family="monospace" font-size="10" fill="#374151">d = (0.003-0.001)² + (0-0.042)²</text>
    <text x="20" y="125" font-family="monospace" font-size="10" fill="#374151">  + (0.025-0.019)² + ...</text>
    <text x="20" y="140" font-family="monospace" font-size="10" fill="#374151">= 0.0000004 + 0.001764 + ...</text>
    <text x="20" y="155" font-family="monospace" font-size="10" fill="#374151">= 0.234</text>
  </g>
  
  <!-- Arrow -->
  <path d="M 570 160 L 610 160" stroke="#3b82f6" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Step 3: Similarity Transformation -->
  <g transform="translate(630, 80)">
    <rect x="0" y="0" width="200" height="160" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="100" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#166534">Similarity Score</text>
    
    <!-- Formula -->
    <rect x="20" y="40" width="160" height="35" rx="3" fill="white" stroke="#22c55e" stroke-width="1"/>
    <text x="100" y="55" text-anchor="middle" font-family="monospace" font-size="12" fill="#166534">sim = exp(-d²)</text>
    <text x="100" y="67" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#166534">Range: [0, 1]</text>
    
    <!-- Example -->
    <text x="20" y="95" font-family="Arial, sans-serif" font-size="11" fill="#166534">For d = 0.234:</text>
    <text x="20" y="110" font-family="monospace" font-size="10" fill="#374151">sim = exp(-(0.234)²)</text>
    <text x="20" y="125" font-family="monospace" font-size="10" fill="#374151">    = exp(-0.055)</text>
    <text x="20" y="140" font-family="monospace" font-size="10" fill="#374151">    = 0.947</text>
    <text x="20" y="155" font-family="Arial, sans-serif" font-size="10" fill="#166534">High similarity!</text>
  </g>
  
  <!-- Arrow down -->
  <path d="M 500 260 L 500 300" stroke="#3b82f6" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Step 4: k-NN Graph Construction -->
  <g transform="translate(280, 320)">
    <rect x="0" y="0" width="440" height="280" rx="8" fill="url(#graphGrad)" stroke="#22c55e" stroke-width="2"/>
    <text x="220" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#166534">k-Nearest Neighbors Graph (k=10)</text>
    
    <!-- Graph visualization -->
    <g transform="translate(40, 50)">
      <!-- Nodes representing articles -->
      <!-- Brexit cluster (bottom left) -->
      <circle cx="60" cy="180" r="12" fill="url(#nodeGrad)" stroke="#dc2626" stroke-width="2"/>
      <text x="60" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#374151">B1</text>
      <text x="60" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#dc2626">Brexit</text>
      
      <circle cx="100" cy="200" r="12" fill="url(#nodeGrad)" stroke="#dc2626" stroke-width="2"/>
      <text x="100" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#374151">B2</text>
      
      <circle cx="80" cy="160" r="12" fill="url(#nodeGrad)" stroke="#dc2626" stroke-width="2"/>
      <text x="80" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#374151">B3</text>
      
      <!-- USA cluster (top right) -->
      <circle cx="280" cy="60" r="12" fill="url(#nodeGrad)" stroke="#3b82f6" stroke-width="2"/>
      <text x="280" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#374151">U1</text>
      <text x="280" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#3b82f6">USA</text>
      
      <circle cx="320" cy="80" r="12" fill="url(#nodeGrad)" stroke="#3b82f6" stroke-width="2"/>
      <text x="320" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#374151">U2</text>
      
      <circle cx="300" cy="100" r="12" fill="url(#nodeGrad)" stroke="#3b82f6" stroke-width="2"/>
      <text x="300" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#374151">U3</text>
      
      <!-- Middle East cluster (right center) -->
      <circle cx="340" cy="160" r="12" fill="url(#nodeGrad)" stroke="#9333ea" stroke-width="2"/>
      <text x="340" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#374151">M1</text>
      <text x="340" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#9333ea">M.East</text>
      
      <circle cx="360" cy="140" r="12" fill="url(#nodeGrad)" stroke="#9333ea" stroke-width="2"/>
      <text x="360" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#374151">M2</text>
      
      <!-- Cross-topic article (center) -->
      <circle cx="200" cy="140" r="12" fill="url(#nodeGrad)" stroke="#f59e0b" stroke-width="2"/>
      <text x="200" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#374151">X1</text>
      <text x="200" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#f59e0b">Mixed</text>
      
      <!-- Euro2016 cluster (top left) -->
      <circle cx="120" cy="80" r="12" fill="url(#nodeGrad)" stroke="#059669" stroke-width="2"/>
      <text x="120" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#374151">E1</text>
      <text x="120" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#059669">Euro16</text>
      
      <circle cx="140" cy="100" r="12" fill="url(#nodeGrad)" stroke="#059669" stroke-width="2"/>
      <text x="140" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#374151">E2</text>
      
      <!-- Edges within clusters (thick lines) -->
      <!-- Brexit cluster edges -->
      <line x1="60" y1="180" x2="100" y2="200" stroke="#dc2626" stroke-width="3" opacity="0.8"/>
      <line x1="60" y1="180" x2="80" y2="160" stroke="#dc2626" stroke-width="3" opacity="0.8"/>
      <line x1="100" y1="200" x2="80" y2="160" stroke="#dc2626" stroke-width="3" opacity="0.8"/>
      
      <!-- USA cluster edges -->
      <line x1="280" y1="60" x2="320" y2="80" stroke="#3b82f6" stroke-width="3" opacity="0.8"/>
      <line x1="280" y1="60" x2="300" y2="100" stroke="#3b82f6" stroke-width="3" opacity="0.8"/>
      <line x1="320" y1="80" x2="300" y2="100" stroke="#3b82f6" stroke-width="3" opacity="0.8"/>
      
      <!-- Middle East edges -->
      <line x1="340" y1="160" x2="360" y2="140" stroke="#9333ea" stroke-width="3" opacity="0.8"/>
      
      <!-- Euro2016 edges -->
      <line x1="120" y1="80" x2="140" y2="100" stroke="#059669" stroke-width="3" opacity="0.8"/>
      
      <!-- Cross-cluster edges (thinner) -->
      <line x1="200" y1="140" x2="280" y2="60" stroke="#6b7280" stroke-width="1.5" opacity="0.6"/>
      <line x1="200" y1="140" x2="100" y2="200" stroke="#6b7280" stroke-width="1.5" opacity="0.6"/>
      <line x1="200" y1="140" x2="340" y2="160" stroke="#6b7280" stroke-width="1.5" opacity="0.6"/>
    </g>
    
    <!-- Legend -->
    <g transform="translate(20, 220)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#166534">Graph Properties:</text>
      <text x="0" y="20" font-family="Arial, sans-serif" font-size="11" fill="#374151">• Each article connected to 10 most similar articles</text>
      <text x="0" y="35" font-family="Arial, sans-serif" font-size="11" fill="#374151">• Edge weights = similarity scores</text>
      <text x="0" y="50" font-family="Arial, sans-serif" font-size="11" fill="#374151">• Sparse graph: ~600 edges from 3,540 possible</text>
    </g>
    
    <!-- Similarity matrix representation -->
    <g transform="translate(250, 220)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#166534">Similarity Matrix:</text>
      
      <!-- Small matrix visualization -->
      <g transform="translate(0, 10)">
        <rect x="0" y="0" width="120" height="20" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
        <text x="10" y="13" font-family="monospace" font-size="9" fill="#374151">[1.0  0.87 0.23 ...]</text>
        
        <rect x="0" y="20" width="120" height="20" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
        <text x="10" y="33" font-family="monospace" font-size="9" fill="#374151">[0.87 1.0  0.45 ...]</text>
        
        <rect x="0" y="40" width="120" height="20" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
        <text x="10" y="53" font-family="monospace" font-size="9" fill="#374151">[0.23 0.45 1.0  ...]</text>
        
        <text x="60" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">60×60 matrix</text>
      </g>
    </g>
  </g>
  
  <!-- Mathematical Formula -->
  <g transform="translate(50, 620)">
    <rect x="0" y="0" width="900" height="25" rx="5" fill="#1f2937" stroke="#374151" stroke-width="2"/>
    <text x="450" y="17" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="white">
      similarity(A₁, A₂) = exp(-Σⱼ₌₁¹⁰⁶³(x₁ⱼ - x₂ⱼ)²)    where xᵢⱼ = TF-IDF value for entity j in article i
    </text>
  </g>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
     refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6" />
    </marker>
  </defs>
</svg>