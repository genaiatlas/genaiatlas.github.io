<svg width="900" height="650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#00000030"/>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#495057"/>
    </marker>
    <linearGradient id="surfaceGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d6efd;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#6610f2;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#dc3545;stop-opacity:0.4" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="650" fill="url(#backgroundGradient)"/>
  
  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#212529">Concave Function Optimization in Logistic Regression</text>
  <text x="450" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6c757d">Log-likelihood maximization guarantees global optimum</text>
  
  <!-- Main concave function plot -->
  <rect x="50" y="80" width="550" height="350" fill="white" stroke="#495057" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="325" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#212529">Concave Log-Likelihood Function</text>
  
  <!-- Coordinate system -->
  <g transform="translate(100, 130)">
    <!-- Axes -->
    <line x1="0" y1="250" x2="450" y2="250" stroke="#495057" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="50" y1="280" x2="50" y2="20" stroke="#495057" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Grid -->
    <g stroke="#e9ecef" stroke-width="1" opacity="0.7">
      <line x1="50" y1="50" x2="400" y2="50"/>
      <line x1="50" y1="100" x2="400" y2="100"/>
      <line x1="50" y1="150" x2="400" y2="150"/>
      <line x1="50" y1="200" x2="400" y2="200"/>
      
      <line x1="100" y1="250" x2="100" y2="50"/>
      <line x1="150" y1="250" x2="150" y2="50"/>
      <line x1="200" y1="250" x2="200" y2="50"/>
      <line x1="250" y1="250" x2="250" y2="50"/>
      <line x1="300" y1="250" x2="300" y2="50"/>
      <line x1="350" y1="250" x2="350" y2="50"/>
      <line x1="400" y1="250" x2="400" y2="50"/>
    </g>
    
    <!-- Concave curve (log-likelihood) -->
    <path d="M 60,240 Q 80,220 100,180 Q 140,120 180,80 Q 220,60 260,65 Q 300,75 340,120 Q 370,160 390,220" 
          fill="none" stroke="#0d6efd" stroke-width="4"/>
    
    <!-- Fill under curve for better visualization -->
    <path d="M 60,240 Q 80,220 100,180 Q 140,120 180,80 Q 220,60 260,65 Q 300,75 340,120 Q 370,160 390,220 L 390,250 L 60,250 Z" 
          fill="url(#surfaceGradient)" opacity="0.3"/>
    
    <!-- Maximum point -->
    <circle cx="260" cy="65" r="8" fill="#dc3545" stroke="white" stroke-width="3"/>
    <text x="270" y="55" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#dc3545">Global Maximum</text>
    <text x="270" y="70" font-family="Arial, sans-serif" font-size="10" fill="#dc3545">θ* = (β₀*, β*)</text>
    
    <!-- Optimization path -->
    <g stroke="#28a745" stroke-width="2" fill="#28a745" opacity="0.8">
      <!-- Starting point -->
      <circle cx="120" cy="200" r="5"/>
      <text x="130" y="195" font-family="Arial, sans-serif" font-size="10" fill="#28a745">Start</text>
      
      <!-- Gradient steps -->
      <line x1="120" y1="200" x2="160" y2="150" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>
      <circle cx="160" cy="150" r="4"/>
      
      <line x1="160" y1="150" x2="200" y2="110" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>
      <circle cx="200" cy="110" r="4"/>
      
      <line x1="200" y1="110" x2="235" y2="80" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>
      <circle cx="235" cy="80" r="4"/>
      
      <line x1="235" y1="80" x2="255" y2="67" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>
      <circle cx="255" cy="67" r="4"/>
      
      <text x="180" y="240" font-family="Arial, sans-serif" font-size="10" fill="#28a745" font-weight="bold">Gradient Ascent Path</text>
    </g>
    
    <!-- Tangent lines showing concavity -->
    <g stroke="#ffc107" stroke-width="2" opacity="0.7">
      <line x1="130" y1="100" x2="190" y2="140"/>
      <line x1="280" y1="100" x2="340" y2="140"/>
      <text x="160" y="95" font-family="Arial, sans-serif" font-size="9" fill="#ffc107">Tangent lines</text>
      <text x="160" y="105" font-family="Arial, sans-serif" font-size="9" fill="#ffc107">stay above curve</text>
    </g>
    
    <!-- Axis labels -->
    <text x="225" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#495057">Parameter Values (β₀, β)</text>
    <text x="25" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#495057" transform="rotate(-90, 25, 150)">Log-Likelihood ℓ(β₀, β)</text>
    
    <!-- Scale markers -->
    <g font-family="Arial, sans-serif" font-size="10" fill="#6c757d">
      <text x="45" y="255" text-anchor="end">Low</text>
      <text x="45" y="55" text-anchor="end">High</text>
    </g>
  </g>
  
  <!-- Comparison section -->
  <rect x="620" y="80" width="250" height="350" fill="white" stroke="#495057" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="745" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#212529">Concave vs Convex</text>
  
  <!-- Concave function -->
  <g transform="translate(640, 120)">
    <text x="105" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0d6efd">Concave (Maximization)</text>
    <rect x="10" y="25" width="190" height="70" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1" rx="3"/>
    
    <path d="M 20,85 Q 60,45 105,40 Q 150,45 190,85" fill="none" stroke="#0d6efd" stroke-width="3"/>
    <circle cx="105" cy="40" r="4" fill="#dc3545"/>
    <text x="105" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#dc3545">Max</text>
    
    <!-- Gradient arrows pointing toward maximum -->
    <g stroke="#28a745" stroke-width="2" marker-end="url(#arrowhead)">
      <line x1="40" y1="75" x2="70" y2="55"/>
      <line x1="170" y1="75" x2="140" y2="55"/>
    </g>
  </g>
  
  <!-- Convex function -->
  <g transform="translate(640, 220)">
    <text x="105" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#dc3545">Convex (Minimization)</text>
    <rect x="10" y="25" width="190" height="70" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1" rx="3"/>
    
    <path d="M 20,45 Q 60,85 105,90 Q 150,85 190,45" fill="none" stroke="#dc3545" stroke-width="3"/>
    <circle cx="105" cy="90" r="4" fill="#0d6efd"/>
    <text x="105" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#0d6efd">Min</text>
    
    <!-- Gradient arrows pointing toward minimum -->
    <g stroke="#28a745" stroke-width="2" marker-end="url(#arrowhead)">
      <line x1="40" y1="55" x2="70" y2="75"/>
      <line x1="170" y1="55" x2="140" y2="75"/>
    </g>
  </g>
  
  <!-- Properties table -->
  <rect x="640" y="320" width="210" height="100" fill="#fff3cd" stroke="#856404" stroke-width="1" rx="5"/>
  <text x="745" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#856404">Concave Function Properties</text>
  
  <g font-family="Arial, sans-serif" font-size="10" fill="#495057">
    <text x="650" y="360">✓ Unique global maximum</text>
    <text x="650" y="375">✓ No local maxima</text>
    <text x="650" y="390">✓ Gradient methods converge</text>
    <text x="650" y="405">✓ Second derivative ≤ 0</text>
  </g>
  
  <!-- Algorithm comparison -->
  <rect x="50" y="450" width="820" height="180" fill="white" stroke="#495057" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="460" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#212529">Optimization Algorithms for Logistic Regression</text>
  
  <!-- Algorithm boxes -->
  <g transform="translate(70, 490)">
    <!-- Newton-Raphson -->
    <rect x="0" y="0" width="240" height="120" fill="#d1ecf1" stroke="#0c5460" stroke-width="2" rx="8"/>
    <text x="120" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0c5460">Newton-Raphson Method</text>
    
    <g font-family="Arial, sans-serif" font-size="11" fill="#495057">
      <text x="10" y="40" font-weight="bold">Advantages:</text>
      <text x="15" y="55">• Quadratic convergence</text>
      <text x="15" y="70">• Fast near optimum</text>
      
      <text x="10" y="90" font-weight="bold">Formula:</text>
      <text x="15" y="105">θ⁽ⁿ⁺¹⁾ = θ⁽ⁿ⁾ - H⁻¹∇ℓ</text>
    </g>
    
    <!-- Gradient Ascent -->
    <rect x="260" y="0" width="240" height="120" fill="#d4edda" stroke="#155724" stroke-width="2" rx="8"/>
    <text x="380" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#155724">Gradient Ascent</text>
    
    <g font-family="Arial, sans-serif" font-size="11" fill="#495057">
      <text x="270" y="40" font-weight="bold">Advantages:</text>
      <text x="275" y="55">• Simple implementation</text>
      <text x="275" y="70">• Stable convergence</text>
      
      <text x="270" y="90" font-weight="bold">Formula:</text>
      <text x="275" y="105">θ⁽ⁿ⁺¹⁾ = θ⁽ⁿ⁾ + α∇ℓ</text>
    </g>
    
    <!-- BFGS -->
    <rect x="520" y="0" width="240" height="120" fill="#f8d7da" stroke="#721c24" stroke-width="2" rx="8"/>
    <text x="640" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#721c24">BFGS (Quasi-Newton)</text>
    
    <g font-family="Arial, sans-serif" font-size="11" fill="#495057">
      <text x="530" y="40" font-weight="bold">Advantages:</text>
      <text x="535" y="55">• No Hessian computation</text>
      <text x="535" y="70">• Super-linear convergence</text>
      
      <text x="530" y="90" font-weight="bold">Method:</text>
      <text x="535" y="105">Approximate H⁻¹ iteratively</text>
    </g>
  </g>
</svg>