<svg viewBox="0 0 1000 650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title-text { font-family: 'Arial', sans-serif; font-size: 26px; font-weight: bold; fill: #2c3e50; }
      .section-text { font-family: 'Arial', sans-serif; font-size: 18px; font-weight: bold; fill: #34495e; }
      .formula-text { font-family: 'Times New Roman', serif; font-size: 22px; font-weight: bold; fill: #e74c3c; }
      .label-text { font-family: 'Arial', sans-serif; font-size: 14px; fill: #2c3e50; }
      .highlight-text { font-family: 'Arial', sans-serif; font-size: 16px; font-weight: bold; fill: #8e44ad; }
      .number-text { font-family: 'Arial', sans-serif; font-size: 12px; font-weight: bold; fill: #2c3e50; }
      .original-node { fill: #3498db; stroke: #2980b9; stroke-width: 2; }
      .baseline-node { fill: #95a5a6; stroke: #7f8c8d; stroke-width: 2; }
      .original-edge { stroke: #2c3e50; stroke-width: 3; }
      .baseline-edge { stroke: #f39c12; stroke-width: 2; stroke-dasharray: 6,3; }
      .calculation-box { fill: #ecf0f1; stroke: #34495e; stroke-width: 2; }
      .step-box { fill: none; stroke: #9b59b6; stroke-width: 2; }
      .arrow { fill: none; stroke: #2c3e50; stroke-width: 3; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="500" y="35" text-anchor="middle" class="title-text">Baseline Graph Calculation Process</text>
  
  <!-- Original Graph -->
  <text x="200" y="80" text-anchor="middle" class="section-text">1. Original Graph</text>
  
  <rect x="50" y="90" width="300" height="180" fill="none" stroke="#34495e" stroke-width="2"/>
  
  <!-- Original network -->
  <circle cx="120" cy="140" r="15" class="original-node"/>
  <circle cx="200" cy="120" r="15" class="original-node"/>
  <circle cx="280" cy="140" r="15" class="original-node"/>
  <circle cx="160" cy="200" r="15" class="original-node"/>
  <circle cx="240" cy="200" r="15" class="original-node"/>
  
  <!-- Node labels -->
  <text x="120" y="115" text-anchor="middle" class="number-text">A</text>
  <text x="200" y="95" text-anchor="middle" class="number-text">B</text>
  <text x="280" y="115" text-anchor="middle" class="number-text">C</text>
  <text x="160" y="225" text-anchor="middle" class="number-text">D</text>
  <text x="240" y="225" text-anchor="middle" class="number-text">E</text>
  
  <!-- Original edges -->
  <line x1="120" y1="140" x2="200" y2="120" class="original-edge"/>
  <line x1="200" y1="120" x2="280" y2="140" class="original-edge"/>
  <line x1="120" y1="140" x2="160" y2="200" class="original-edge"/>
  <line x1="200" y1="120" x2="160" y2="200" class="original-edge"/>
  <line x1="280" y1="140" x2="240" y2="200" class="original-edge"/>
  <line x1="160" y1="200" x2="240" y2="200" class="original-edge"/>
  
  <!-- Degree labels -->
  <text x="70" y="155" class="label-text">deg(A)=2</text>
  <text x="220" y="105" class="label-text">deg(B)=3</text>
  <text x="300" y="155" class="label-text">deg(C)=2</text>
  <text x="110" y="215" class="label-text">deg(D)=3</text>
  <text x="270" y="215" class="label-text">deg(E)=2</text>
  
  <text x="200" y="290" text-anchor="middle" class="label-text">Total edges m = 6</text>
  
  <!-- Arrow -->
  <path d="M 380 180 L 450 180" class="arrow"/>
  
  <!-- Baseline Calculation -->
  <text x="700" y="80" text-anchor="middle" class="section-text">2. Baseline Probability</text>
  
  <rect x="550" y="90" width="300" height="180" class="calculation-box"/>
  <text x="700" y="110" text-anchor="middle" class="highlight-text">Expected Edge Formula</text>
  <text x="700" y="140" text-anchor="middle" class="formula-text">P_ij = (k_i × k_j) / (2m)</text>
  
  <text x="570" y="170" class="label-text">Example: Probability of edge A-C</text>
  <text x="570" y="190" class="formula-text">P_AC = (2 × 2) / (2 × 6) = 4/12 = 0.33</text>
  
  <text x="570" y="220" class="label-text">Example: Probability of edge B-D</text>
  <text x="570" y="240" class="formula-text">P_BD = (3 × 3) / (2 × 6) = 9/12 = 0.75</text>
  
  <text x="700" y="265" text-anchor="middle" class="label-text">Higher degree nodes → Higher connection probability</text>
  
  <!-- Probability Matrix -->
  <text x="250" y="340" text-anchor="middle" class="section-text">3. Expected Edge Probability Matrix</text>
  
  <rect x="50" y="360" width="400" height="200" class="step-box"/>
  
  <!-- Matrix header -->
  <text x="120" y="380" text-anchor="middle" class="highlight-text">P_ij</text>
  <text x="170" y="395" text-anchor="middle" class="number-text">A</text>
  <text x="210" y="395" text-anchor="middle" class="number-text">B</text>
  <text x="250" y="395" text-anchor="middle" class="number-text">C</text>
  <text x="290" y="395" text-anchor="middle" class="number-text">D</text>
  <text x="330" y="395" text-anchor="middle" class="number-text">E</text>
  
  <!-- Matrix rows -->
  <text x="140" y="415" class="number-text">A</text>
  <text x="170" y="415" text-anchor="middle" class="number-text">-</text>
  <text x="210" y="415" text-anchor="middle" class="number-text">0.50</text>
  <text x="250" y="415" text-anchor="middle" class="number-text">0.33</text>
  <text x="290" y="415" text-anchor="middle" class="number-text">0.50</text>
  <text x="330" y="415" text-anchor="middle" class="number-text">0.33</text>
  
  <text x="140" y="435" class="number-text">B</text>
  <text x="170" y="435" text-anchor="middle" class="number-text">0.50</text>
  <text x="210" y="435" text-anchor="middle" class="number-text">-</text>
  <text x="250" y="435" text-anchor="middle" class="number-text">0.50</text>
  <text x="290" y="435" text-anchor="middle" class="number-text">0.75</text>
  <text x="330" y="435" text-anchor="middle" class="number-text">0.50</text>
  
  <text x="140" y="455" class="number-text">C</text>
  <text x="170" y="455" text-anchor="middle" class="number-text">0.33</text>
  <text x="210" y="455" text-anchor="middle" class="number-text">0.50</text>
  <text x="250" y="455" text-anchor="middle" class="number-text">-</text>
  <text x="290" y="455" text-anchor="middle" class="number-text">0.50</text>
  <text x="330" y="455" text-anchor="middle" class="number-text">0.33</text>
  
  <text x="140" y="475" class="number-text">D</text>
  <text x="170" y="475" text-anchor="middle" class="number-text">0.50</text>
  <text x="210" y="475" text-anchor="middle" class="number-text">0.75</text>
  <text x="250" y="475" text-anchor="middle" class="number-text">0.50</text>
  <text x="290" y="475" text-anchor="middle" class="number-text">-</text>
  <text x="330" y="475" text-anchor="middle" class="number-text">0.50</text>
  
  <text x="140" y="495" class="number-text">E</text>
  <text x="170" y="495" text-anchor="middle" class="number-text">0.33</text>
  <text x="210" y="495" text-anchor="middle" class="number-text">0.50</text>
  <text x="250" y="495" text-anchor="middle" class="number-text">0.33</text>
  <text x="290" y="495" text-anchor="middle" class="number-text">0.50</text>
  <text x="330" y="495" text-anchor="middle" class="number-text">-</text>
  
  <text x="250" y="520" text-anchor="middle" class="label-text">Each entry = Expected probability of edge</text>
  <text x="250" y="540" text-anchor="middle" class="label-text">Higher values for high-degree node pairs</text>
  
  <!-- Baseline Graph Visualization -->
  <text x="700" y="340" text-anchor="middle" class="section-text">4. Baseline Graph (Random)</text>
  
  <rect x="550" y="360" width="300" height="200" class="step-box"/>
  
  <!-- Baseline network (same positions) -->
  <circle cx="620" cy="420" r="12" class="baseline-node"/>
  <circle cx="700" cy="400" r="12" class="baseline-node"/>
  <circle cx="780" cy="420" r="12" class="baseline-node"/>
  <circle cx="660" cy="480" r="12" class="baseline-node"/>
  <circle cx="740" cy="480" r="12" class="baseline-node"/>
  
  <!-- Baseline edges (different pattern) -->
  <line x1="620" y1="420" x2="700" y2="400" class="baseline-edge"/>
  <line x1="700" y1="400" x2="660" y2="480" class="baseline-edge"/>
  <line x1="700" y1="400" x2="740" y2="480" class="baseline-edge"/>
  <line x1="620" y1="420" x2="660" y2="480" class="baseline-edge"/>
  <line x1="780" y1="420" x2="740" y2="480" class="baseline-edge"/>
  <line x1="660" y1="480" x2="740" y2="480" class="baseline-edge"/>
  
  <text x="700" y="520" text-anchor="middle" class="label-text">Same degree sequence</text>
  <text x="700" y="535" text-anchor="middle" class="label-text">Different edge arrangement</text>
  <text x="700" y="550" text-anchor="middle" class="label-text">Preserves local properties</text>
  
  <!-- Key Insight -->
  <rect x="100" y="580" width="800" height="50" fill="#d5dbdb" stroke="#34495e" stroke-width="1"/>
  <text x="500" y="600" text-anchor="middle" class="section-text">Key Insight</text>
  <text x="500" y="620" text-anchor="middle" class="label-text">Baseline model: Random rewiring preserving node degrees - Expected edges based on structural properties alone</text>
  
</svg>