<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title-text { font-family: 'Arial', sans-serif; font-size: 20px; font-weight: bold; text-anchor: middle; }
      .label-text { font-family: 'Arial', sans-serif; font-size: 15px; font-weight: bold; text-anchor: middle; }
      .desc-text { font-family: 'Arial', sans-serif; font-size: 12px; text-anchor: middle; }
      .small-text { font-family: 'Arial', sans-serif; font-size: 11px; text-anchor: middle; }
      .target-ring { fill: none; stroke: #333; stroke-width: 2; }
      .prediction-point { fill: #e74c3c; stroke: #c0392b; stroke-width: 1; }
      .center-point { fill: #2c3e50; stroke: #fff; stroke-width: 2; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#fafafa"/>
  
  <!-- Title -->
  <text x="400" y="35" class="title-text">Bias-Variance Visualization: Target Analysis</text>
  
  <!-- Target 1: Low Bias, Low Variance (Ideal) -->
  <g transform="translate(120, 90)">
    <text x="80" y="-15" class="label-text" fill="#27ae60">Low Bias, Low Variance</text>
    <text x="80" y="5" class="desc-text" fill="#27ae60">(Ideal Scenario)</text>
    
    <!-- Target rings -->
    <circle cx="80" cy="80" r="70" class="target-ring"/>
    <circle cx="80" cy="80" r="50" class="target-ring"/>
    <circle cx="80" cy="80" r="30" class="target-ring"/>
    <circle cx="80" cy="80" r="10" class="target-ring"/>
    
    <!-- Center point (true value) -->
    <circle cx="80" cy="80" r="3" class="center-point"/>
    
    <!-- Prediction points (clustered near center) -->
    <circle cx="76" cy="78" r="3" class="prediction-point"/>
    <circle cx="84" cy="82" r="3" class="prediction-point"/>
    <circle cx="78" cy="85" r="3" class="prediction-point"/>
    <circle cx="83" cy="77" r="3" class="prediction-point"/>
    <circle cx="81" cy="83" r="3" class="prediction-point"/>
    <circle cx="77" cy="81" r="3" class="prediction-point"/>
    <circle cx="82" cy="79" r="3" class="prediction-point"/>
    <circle cx="79" cy="76" r="3" class="prediction-point"/>
    
    <text x="80" y="170" class="desc-text">Accurate &amp; Consistent</text>
  </g>
  
  <!-- Target 2: Low Bias, High Variance -->
  <g transform="translate(480, 90)">
    <text x="80" y="-15" class="label-text" fill="#f39c12">Low Bias, High Variance</text>
    <text x="80" y="5" class="desc-text" fill="#f39c12">(Overfitting)</text>
    
    <!-- Target rings -->
    <circle cx="80" cy="80" r="70" class="target-ring"/>
    <circle cx="80" cy="80" r="50" class="target-ring"/>
    <circle cx="80" cy="80" r="30" class="target-ring"/>
    <circle cx="80" cy="80" r="10" class="target-ring"/>
    
    <!-- Center point -->
    <circle cx="80" cy="80" r="3" class="center-point"/>
    
    <!-- Prediction points (scattered around center) -->
    <circle cx="65" cy="70" r="3" class="prediction-point"/>
    <circle cx="95" cy="90" r="3" class="prediction-point"/>
    <circle cx="70" cy="95" r="3" class="prediction-point"/>
    <circle cx="90" cy="65" r="3" class="prediction-point"/>
    <circle cx="85" cy="100" r="3" class="prediction-point"/>
    <circle cx="75" cy="60" r="3" class="prediction-point"/>
    <circle cx="100" cy="75" r="3" class="prediction-point"/>
    <circle cx="60" cy="85" r="3" class="prediction-point"/>
    
    <text x="80" y="170" class="desc-text">Accurate on Average</text>
    <text x="80" y="185" class="desc-text">but Inconsistent</text>
  </g>
  
  <!-- Target 3: High Bias, Low Variance -->
  <g transform="translate(120, 320)">
    <text x="80" y="-15" class="label-text" fill="#e67e22">High Bias, Low Variance</text>
    <text x="80" y="5" class="desc-text" fill="#e67e22">(Underfitting)</text>
    
    <!-- Target rings -->
    <circle cx="80" cy="80" r="70" class="target-ring"/>
    <circle cx="80" cy="80" r="50" class="target-ring"/>
    <circle cx="80" cy="80" r="30" class="target-ring"/>
    <circle cx="80" cy="80" r="10" class="target-ring"/>
    
    <!-- Center point -->
    <circle cx="80" cy="80" r="3" class="center-point"/>
    
    <!-- Prediction points (clustered away from center) -->
    <circle cx="56" cy="56" r="3" class="prediction-point"/>
    <circle cx="62" cy="58" r="3" class="prediction-point"/>
    <circle cx="54" cy="62" r="3" class="prediction-point"/>
    <circle cx="60" cy="54" r="3" class="prediction-point"/>
    <circle cx="58" cy="60" r="3" class="prediction-point"/>
    <circle cx="52" cy="58" r="3" class="prediction-point"/>
    <circle cx="64" cy="56" r="3" class="prediction-point"/>
    <circle cx="58" cy="64" r="3" class="prediction-point"/>
    
    <text x="80" y="170" class="desc-text">Consistent but</text>
    <text x="80" y="185" class="desc-text">Systematically Wrong</text>
  </g>
  
  <!-- Target 4: High Bias, High Variance (Worst) -->
  <g transform="translate(480, 320)">
    <text x="80" y="-15" class="label-text" fill="#e74c3c">High Bias, High Variance</text>
    <text x="80" y="5" class="desc-text" fill="#e74c3c">(Worst Case)</text>
    
    <!-- Target rings -->
    <circle cx="80" cy="80" r="70" class="target-ring"/>
    <circle cx="80" cy="80" r="50" class="target-ring"/>
    <circle cx="80" cy="80" r="30" class="target-ring"/>
    <circle cx="80" cy="80" r="10" class="target-ring"/>
    
    <!-- Center point -->
    <circle cx="80" cy="80" r="3" class="center-point"/>
    
    <!-- Prediction points (scattered and away from center) -->
    <circle cx="45" cy="45" r="3" class="prediction-point"/>
    <circle cx="115" cy="115" r="3" class="prediction-point"/>
    <circle cx="50" cy="110" r="3" class="prediction-point"/>
    <circle cx="110" cy="50" r="3" class="prediction-point"/>
    <circle cx="40" cy="90" r="3" class="prediction-point"/>
    <circle cx="120" cy="70" r="3" class="prediction-point"/>
    <circle cx="60" cy="40" r="3" class="prediction-point"/>
    <circle cx="100" cy="120" r="3" class="prediction-point"/>
    
    <text x="80" y="170" class="desc-text">Inaccurate &amp;</text>
    <text x="80" y="185" class="desc-text">Inconsistent</text>
  </g>
  
  <!-- Legend - moved to bottom with more space -->
  <g transform="translate(300, 530)">
    <rect x="0" y="0" width="200" height="55" fill="white" stroke="#ccc" stroke-width="1" rx="5"/>
    <circle cx="15" cy="20" r="3" class="center-point"/>
    <text x="25" y="25" class="small-text">True Value (Bull's Eye)</text>
    <circle cx="15" cy="40" r="3" class="prediction-point"/>
    <text x="25" y="45" class="small-text">Model Predictions</text>
  </g>
  
  <!-- Key Insights - repositioned to avoid overlap -->
  <g transform="translate(30, 220)">
    <rect x="0" y="0" width="140" height="75" fill="rgba(39, 174, 96, 0.1)" stroke="#27ae60" stroke-width="1" rx="5"/>
    <text x="70" y="18" class="desc-text" fill="#27ae60" font-weight="bold">GOAL</text>
    <text x="70" y="35" class="small-text" fill="#27ae60">Close to target</text>
    <text x="70" y="50" class="small-text" fill="#27ae60">Consistent results</text>
    <text x="70" y="65" class="small-text" fill="#27ae60">Low bias &amp; variance</text>
  </g>
  
  <g transform="translate(630, 220)">
    <rect x="0" y="0" width="140" height="75" fill="rgba(231, 76, 60, 0.1)" stroke="#e74c3c" stroke-width="1" rx="5"/>
    <text x="70" y="18" class="desc-text" fill="#e74c3c" font-weight="bold">AVOID</text>
    <text x="70" y="35" class="small-text" fill="#e74c3c">Far from target</text>
    <text x="70" y="50" class="small-text" fill="#e74c3c">Inconsistent results</text>
    <text x="70" y="65" class="small-text" fill="#e74c3c">High bias &amp; variance</text>
  </g>
</svg>