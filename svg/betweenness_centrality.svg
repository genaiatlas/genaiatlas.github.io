<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="700" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="500" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Betweenness Centrality: Identifying Network Bottlenecks
  </text>
  
  <!-- Subtitle -->
  <text x="500" y="70" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#7f8c8d">
    Node through which the most geodesic paths pass
  </text>
  
  <!-- Left Side: Network WITHOUT bottleneck -->
  <g id="without-bottleneck">
    <rect x="50" y="100" width="420" height="280" fill="#e8f8f5" stroke="#27ae60" stroke-width="2" rx="10"/>
    <text x="260" y="130" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#27ae60">
      Normal Network Flow
    </text>
    
    <!-- Left cluster -->
    <circle cx="120" cy="200" r="25" fill="#3498db" stroke="#2980b9" stroke-width="3"/>
    <text x="120" y="207" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">1</text>
    
    <circle cx="120" cy="280" r="25" fill="#3498db" stroke="#2980b9" stroke-width="3"/>
    <text x="120" y="287" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">2</text>
    
    <circle cx="120" cy="360" r="25" fill="#3498db" stroke="#2980b9" stroke-width="3"/>
    <text x="120" y="367" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">3</text>
    
    <!-- Center node (Bridge) -->
    <circle cx="260" cy="280" r="30" fill="#27ae60" stroke="#229954" stroke-width="4"/>
    <text x="260" y="287" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">B</text>
    <text x="260" y="240" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">Bridge</text>
    
    <!-- Right cluster -->
    <circle cx="400" cy="200" r="25" fill="#e74c3c" stroke="#c0392b" stroke-width="3"/>
    <text x="400" y="207" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">4</text>
    
    <circle cx="400" cy="280" r="25" fill="#e74c3c" stroke="#c0392b" stroke-width="3"/>
    <text x="400" y="287" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">5</text>
    
    <circle cx="400" cy="360" r="25" fill="#e74c3c" stroke="#c0392b" stroke-width="3"/>
    <text x="400" y="367" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">6</text>
    
    <!-- Edges within left cluster -->
    <line x1="120" y1="225" x2="120" y2="255" stroke="#95a5a6" stroke-width="2"/>
    <line x1="120" y1="305" x2="120" y2="335" stroke="#95a5a6" stroke-width="2"/>
    
    <!-- Edges to bridge -->
    <line x1="145" y1="200" x2="230" y2="265" stroke="#34495e" stroke-width="3"/>
    <line x1="145" y1="280" x2="230" y2="280" stroke="#34495e" stroke-width="3"/>
    <line x1="145" y1="360" x2="230" y2="295" stroke="#34495e" stroke-width="3"/>
    
    <!-- Edges from bridge to right -->
    <line x1="290" y1="265" x2="375" y2="200" stroke="#34495e" stroke-width="3"/>
    <line x1="290" y1="280" x2="375" y2="280" stroke="#34495e" stroke-width="3"/>
    <line x1="290" y1="295" x2="375" y2="360" stroke="#34495e" stroke-width="3"/>
    
    <!-- Edges within right cluster -->
    <line x1="400" y1="225" x2="400" y2="255" stroke="#95a5a6" stroke-width="2"/>
    <line x1="400" y1="305" x2="400" y2="335" stroke="#95a5a6" stroke-width="2"/>
    
    <!-- Flow arrows -->
    <defs>
      <marker id="flow-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
        <polygon points="0 0, 10 3, 0 6" fill="#e74c3c"/>
      </marker>
    </defs>
    <path d="M 145 240 Q 260 260, 375 240" stroke="#e74c3c" stroke-width="2" fill="none" marker-end="url(#flow-arrow)" stroke-dasharray="5,5"/>
    <path d="M 145 320 Q 260 300, 375 320" stroke="#e74c3c" stroke-width="2" fill="none" marker-end="url(#flow-arrow)" stroke-dasharray="5,5"/>
  </g>
  
  <!-- Right Side: Network WITH bottleneck removed -->
  <g id="with-bottleneck">
    <rect x="530" y="100" width="420" height="280" fill="#ffeaea" stroke="#e74c3c" stroke-width="2" rx="10"/>
    <text x="740" y="130" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#e74c3c">
      After Bottleneck Removal
    </text>
    
    <!-- Left cluster -->
    <circle cx="600" cy="200" r="25" fill="#3498db" stroke="#2980b9" stroke-width="3"/>
    <text x="600" y="207" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">1</text>
    
    <circle cx="600" cy="280" r="25" fill="#3498db" stroke="#2980b9" stroke-width="3"/>
    <text x="600" y="287" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">2</text>
    
    <circle cx="600" cy="360" r="25" fill="#3498db" stroke="#2980b9" stroke-width="3"/>
    <text x="600" y="367" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">3</text>
    
    <!-- Center node REMOVED (shown as dashed circle) -->
    <circle cx="740" cy="280" r="30" fill="none" stroke="#e74c3c" stroke-width="3" stroke-dasharray="5,5" opacity="0.5"/>
    <text x="740" y="287" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#e74c3c" opacity="0.5">B</text>
    <line x1="720" y1="260" x2="760" y2="300" stroke="#e74c3c" stroke-width="4"/>
    <line x1="760" y1="260" x2="720" y2="300" stroke="#e74c3c" stroke-width="4"/>
    
    <!-- Right cluster -->
    <circle cx="880" cy="200" r="25" fill="#e74c3c" stroke="#c0392b" stroke-width="3"/>
    <text x="880" y="207" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">4</text>
    
    <circle cx="880" cy="280" r="25" fill="#e74c3c" stroke="#c0392b" stroke-width="3"/>
    <text x="880" y="287" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">5</text>
    
    <circle cx="880" cy="360" r="25" fill="#e74c3c" stroke="#c0392b" stroke-width="3"/>
    <text x="880" y="367" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">6</text>
    
    <!-- Edges within clusters (still exist) -->
    <line x1="600" y1="225" x2="600" y2="255" stroke="#95a5a6" stroke-width="2"/>
    <line x1="600" y1="305" x2="600" y2="335" stroke="#95a5a6" stroke-width="2"/>
    <line x1="880" y1="225" x2="880" y2="255" stroke="#95a5a6" stroke-width="2"/>
    <line x1="880" y1="305" x2="880" y2="335" stroke="#95a5a6" stroke-width="2"/>
    
    <!-- Broken connections (dashed) -->
    <line x1="625" y1="200" x2="710" y2="265" stroke="#e74c3c" stroke-width="2" stroke-dasharray="5,5" opacity="0.3"/>
    <line x1="625" y1="280" x2="710" y2="280" stroke="#e74c3c" stroke-width="2" stroke-dasharray="5,5" opacity="0.3"/>
    <line x1="625" y1="360" x2="710" y2="295" stroke="#e74c3c" stroke-width="2" stroke-dasharray="5,5" opacity="0.3"/>
    
    <line x1="770" y1="265" x2="855" y2="200" stroke="#e74c3c" stroke-width="2" stroke-dasharray="5,5" opacity="0.3"/>
    <line x1="770" y1="280" x2="855" y2="280" stroke="#e74c3c" stroke-width="2" stroke-dasharray="5,5" opacity="0.3"/>
    <line x1="770" y1="295" x2="855" y2="360" stroke="#e74c3c" stroke-width="2" stroke-dasharray="5,5" opacity="0.3"/>
    
    <!-- Disconnected indicator -->
    <text x="740" y="350" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#e74c3c">
      DISCONNECTED
    </text>
  </g>
  
  <!-- Bottom: Formula and Calculation -->
  <g id="formula">
    <rect x="50" y="410" width="900" height="250" fill="white" stroke="#bdc3c7" stroke-width="2" rx="10"/>
    <text x="500" y="445" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Betweenness Centrality Formula
    </text>
    
    <!-- Formula box -->
    <rect x="200" y="460" width="600" height="60" fill="#ecf0f1" rx="5"/>
    <text x="500" y="495" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#e74c3c">
      C_betweenness(v) = Σ (σ_st(v) / σ_st)
    </text>
    
    <!-- Variable definitions -->
    <g transform="translate(100, 540)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="15" fill="#2c3e50">
        <tspan font-weight="bold">Where:</tspan>
      </text>
      <text x="20" y="25" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">
        • σ_st = total number of shortest paths from node s to node t
      </text>
      <text x="20" y="50" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">
        • σ_st(v) = number of those paths passing through node v
      </text>
      <text x="20" y="75" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">
        • Sum taken over all pairs s ≠ v ≠ t
      </text>
    </g>
    
    <!-- Example calculation for bridge node -->
    <rect x="550" y="540" width="350" height="100" fill="#d5f4e6" stroke="#27ae60" stroke-width="2" rx="5"/>
    <text x="725" y="565" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#27ae60">
      Bridge Node B Calculation:
    </text>
    <text x="725" y="590" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#2c3e50">
      All paths between left and right clusters
    </text>
    <text x="725" y="610" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#2c3e50">
      pass through B: 3 × 3 = 9 paths
    </text>
    <text x="725" y="630" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#e74c3c">
      C_betweenness(B) = 9.0 (highest!)
    </text>
  </g>
  
  <!-- Footer Note -->
  <text x="500" y="685" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d" font-style="italic">
    High betweenness centrality indicates bottleneck nodes critical for network connectivity
  </text>
</svg>