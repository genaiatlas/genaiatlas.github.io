<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="powerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#f39c12;stop-opacity:0.4" />
    </linearGradient>
    <linearGradient id="normalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:0.2" />
      <stop offset="50%" style="stop-color:#3498db;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#3498db;stop-opacity:0.2" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="35" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Power Law Distribution in Networks
  </text>
  
  <!-- Power Law vs Normal Comparison -->
  <g transform="translate(50, 70)">
    <text x="0" y="0" font-family="Arial" font-size="18" font-weight="bold" fill="#34495e">
      Power Law vs Normal Distribution
    </text>
    
    <!-- Power Law Distribution -->
    <g transform="translate(0, 30)">
      <rect x="0" y="0" width="350" height="200" rx="10" fill="white" stroke="#e74c3c" stroke-width="2" filter="url(#shadow)"/>
      
      <text x="175" y="25" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#c0392b">
        Power Law: P(k) ~ k⁻ᵞ
      </text>
      
      <text x="175" y="45" font-family="Arial" font-size="11" text-anchor="middle" fill="#7f8c8d">
        "Heavy tail" - Few hubs, many low-degree nodes
      </text>
      
      <!-- Power law curve -->
      <g transform="translate(30, 60)">
        <line x1="20" y1="120" x2="300" y2="120" stroke="#333" stroke-width="2"/>
        <line x1="20" y1="120" x2="20" y2="20" stroke="#333" stroke-width="2"/>
        
        <!-- Power law curve path -->
        <path d="M 30 30 Q 40 50, 50 70 T 80 95 T 120 108 T 180 115 T 250 118 L 290 119"
              fill="none" stroke="#e74c3c" stroke-width="3"/>
        
        <!-- Area under curve -->
        <path d="M 30 120 L 30 30 Q 40 50, 50 70 T 80 95 T 120 108 T 180 115 T 250 118 L 290 119 L 290 120 Z"
              fill="url(#powerGrad)" fill-opacity="0.5"/>
        
        <!-- Labels -->
        <text x="10" y="15" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">P(k)</text>
        <text x="150" y="135" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">Degree (k)</text>
        
        <!-- Annotations -->
        <circle cx="35" cy="35" r="3" fill="#e74c3c"/>
        <text x="50" y="30" font-family="Arial" font-size="9" fill="#666">Hubs</text>
        
        <circle cx="250" cy="118" r="3" fill="#f39c12"/>
        <text x="250" y="110" font-family="Arial" font-size="9" text-anchor="middle" fill="#666">Long tail</text>
      </g>
    </g>
    
    <!-- Normal Distribution -->
    <g transform="translate(400, 30)">
      <rect x="0" y="0" width="350" height="200" rx="10" fill="white" stroke="#3498db" stroke-width="2" filter="url(#shadow)"/>
      
      <text x="175" y="25" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#2980b9">
        Normal Distribution
      </text>
      
      <text x="175" y="45" font-family="Arial" font-size="11" text-anchor="middle" fill="#7f8c8d">
        Bell curve - Most nodes have average degree
      </text>
      
      <!-- Normal distribution curve -->
      <g transform="translate(30, 60)">
        <line x1="20" y1="120" x2="300" y2="120" stroke="#333" stroke-width="2"/>
        <line x1="20" y1="120" x2="20" y2="20" stroke="#333" stroke-width="2"/>
        
        <!-- Bell curve path -->
        <path d="M 50 115 Q 80 110, 110 85 T 160 30 T 210 85 Q 240 110, 270 115"
              fill="none" stroke="#3498db" stroke-width="3"/>
        
        <!-- Area under curve -->
        <path d="M 50 120 L 50 115 Q 80 110, 110 85 T 160 30 T 210 85 Q 240 110, 270 115 L 270 120 Z"
              fill="url(#normalGrad)" fill-opacity="0.5"/>
        
        <!-- Labels -->
        <text x="10" y="15" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">P(k)</text>
        <text x="150" y="135" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">Degree (k)</text>
        
        <!-- Mean line -->
        <line x1="160" y1="30" x2="160" y2="120" stroke="#3498db" stroke-width="1" stroke-dasharray="5,5" opacity="0.7"/>
        <text x="160" y="25" font-family="Arial" font-size="9" text-anchor="middle" fill="#666">Mean</text>
      </g>
    </g>
  </g>
  
  <!-- Scale-Free Network Visualization -->
  <g transform="translate(50, 300)">
    <text x="0" y="0" font-family="Arial" font-size="18" font-weight="bold" fill="#34495e">
      Scale-Free Network Structure
    </text>
    
    <!-- Network diagram showing hubs -->
    <g transform="translate(100, 40)">
      <rect x="-50" y="-10" width="600" height="180" rx="10" fill="#ffffff" stroke="#9b59b6" stroke-width="2" filter="url(#shadow)"/>
      
      <!-- Hub nodes (highly connected) -->
      <circle cx="150" cy="80" r="25" fill="#e74c3c" stroke="#c0392b" stroke-width="3"/>
      <text x="150" y="85" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Hub</text>
      
      <circle cx="350" cy="80" r="25" fill="#e74c3c" stroke="#c0392b" stroke-width="3"/>
      <text x="350" y="85" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Hub</text>
      
      <!-- Regular nodes -->
      <circle cx="80" cy="40" r="8" fill="#3498db" stroke="#2980b9" stroke-width="1"/>
      <circle cx="80" cy="120" r="8" fill="#3498db" stroke="#2980b9" stroke-width="1"/>
      <circle cx="220" cy="40" r="8" fill="#3498db" stroke="#2980b9" stroke-width="1"/>
      <circle cx="220" cy="120" r="8" fill="#3498db" stroke="#2980b9" stroke-width="1"/>
      <circle cx="280" cy="40" r="8" fill="#3498db" stroke="#2980b9" stroke-width="1"/>
      <circle cx="280" cy="120" r="8" fill="#3498db" stroke="#2980b9" stroke-width="1"/>
      <circle cx="420" cy="40" r="8" fill="#3498db" stroke="#2980b9" stroke-width="1"/>
      <circle cx="420" cy="120" r="8" fill="#3498db" stroke="#2980b9" stroke-width="1"/>
      
      <!-- Small peripheral nodes -->
      <circle cx="30" cy="60" r="5" fill="#95a5a6" stroke="#7f8c8d" stroke-width="1"/>
      <circle cx="30" cy="100" r="5" fill="#95a5a6" stroke="#7f8c8d" stroke-width="1"/>
      <circle cx="470" cy="60" r="5" fill="#95a5a6" stroke="#7f8c8d" stroke-width="1"/>
      <circle cx="470" cy="100" r="5" fill="#95a5a6" stroke="#7f8c8d" stroke-width="1"/>
      
      <!-- Connections (edges) -->
      <!-- Hub 1 connections -->
      <line x1="150" y1="80" x2="80" y2="40" stroke="#666" stroke-width="1" opacity="0.6"/>
      <line x1="150" y1="80" x2="80" y2="120" stroke="#666" stroke-width="1" opacity="0.6"/>
      <line x1="150" y1="80" x2="220" y2="40" stroke="#666" stroke-width="1" opacity="0.6"/>
      <line x1="150" y1="80" x2="220" y2="120" stroke="#666" stroke-width="1" opacity="0.6"/>
      <line x1="150" y1="80" x2="30" y2="60" stroke="#666" stroke-width="1" opacity="0.6"/>
      <line x1="150" y1="80" x2="30" y2="100" stroke="#666" stroke-width="1" opacity="0.6"/>
      <line x1="150" y1="80" x2="350" y2="80" stroke="#666" stroke-width="2" opacity="0.8"/>
      
      <!-- Hub 2 connections -->
      <line x1="350" y1="80" x2="280" y2="40" stroke="#666" stroke-width="1" opacity="0.6"/>
      <line x1="350" y1="80" x2="280" y2="120" stroke="#666" stroke-width="1" opacity="0.6"/>
      <line x1="350" y1="80" x2="420" y2="40" stroke="#666" stroke-width="1" opacity="0.6"/>
      <line x1="350" y1="80" x2="420" y2="120" stroke="#666" stroke-width="1" opacity="0.6"/>
      <line x1="350" y1="80" x2="470" y2="60" stroke="#666" stroke-width="1" opacity="0.6"/>
      <line x1="350" y1="80" x2="470" y2="100" stroke="#666" stroke-width="1" opacity="0.6"/>
      
      <!-- Legend -->
      <text x="0" y="-20" font-family="Arial" font-size="14" font-weight="bold" fill="#8e44ad">
        Preferential Attachment: "Rich get richer"
      </text>
    </g>
  </g>
  
  <!-- Real-World Examples -->
  <g transform="translate(50, 510)">
    <text x="0" y="0" font-family="Arial" font-size="18" font-weight="bold" fill="#34495e">
      Real-World Power Law Networks:
    </text>
    
    <g transform="translate(150, 10)">
      <!-- Social -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="100" height="50" rx="5" fill="#3498db" fill-opacity="0.2" stroke="#3498db" stroke-width="2"/>
        <text x="50" y="20" font-family="Arial" font-size="20" text-anchor="middle">👥</text>
        <text x="50" y="40" font-family="Arial" font-size="11" text-anchor="middle" fill="#2980b9" font-weight="bold">
          Social
        </text>
      </g>
      
      <!-- Internet -->
      <g transform="translate(110, 0)">
        <rect x="0" y="0" width="100" height="50" rx="5" fill="#e74c3c" fill-opacity="0.2" stroke="#e74c3c" stroke-width="2"/>
        <text x="50" y="20" font-family="Arial" font-size="20" text-anchor="middle">🌐</text>
        <text x="50" y="40" font-family="Arial" font-size="11" text-anchor="middle" fill="#c0392b" font-weight="bold">
          Internet
        </text>
      </g>
      
      <!-- Biology -->
      <g transform="translate(220, 0)">
        <rect x="0" y="0" width="100" height="50" rx="5" fill="#27ae60" fill-opacity="0.2" stroke="#27ae60" stroke-width="2"/>
        <text x="50" y="20" font-family="Arial" font-size="20" text-anchor="middle">🧬</text>
        <text x="50" y="40" font-family="Arial" font-size="11" text-anchor="middle" fill="#229954" font-weight="bold">
          Biology
        </text>
      </g>
      
      <!-- Economics -->
      <g transform="translate(330, 0)">
        <rect x="0" y="0" width="100" height="50" rx="5" fill="#f39c12" fill-opacity="0.2" stroke="#f39c12" stroke-width="2"/>
        <text x="50" y="20" font-family="Arial" font-size="20" text-anchor="middle">💹</text>
        <text x="50" y="40" font-family="Arial" font-size="11" text-anchor="middle" fill="#e67e22" font-weight="bold">
          Economics
        </text>
      </g>
      
      <!-- Citations -->
      <g transform="translate(440, 0)">
        <rect x="0" y="0" width="100" height="50" rx="5" fill="#9b59b6" fill-opacity="0.2" stroke="#9b59b6" stroke-width="2"/>
        <text x="50" y="20" font-family="Arial" font-size="20" text-anchor="middle">📚</text>
        <text x="50" y="40" font-family="Arial" font-size="11" text-anchor="middle" fill="#8e44ad" font-weight="bold">
          Citations
        </text>
      </g>
    </g>
  </g>
</svg>