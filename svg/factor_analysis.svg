<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="factorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E74C3C;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#C0392B;stop-opacity:0.5"/>
    </linearGradient>
    <linearGradient id="observedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498DB;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#2980B9;stop-opacity:0.5"/>
    </linearGradient>
    <linearGradient id="errorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#95A5A6;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#7F8C8D;stop-opacity:0.5"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="700" fill="#FAFAFA"/>
  
  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2C3E50">
    Factor Analysis: Modeling Latent Structure in Multivariate Data
  </text>
  
  <!-- Factor model diagram -->
  <g transform="translate(100, 80)">
    <text x="350" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2C3E50">
      Factor Analysis Model: X = ΛF + ε
    </text>
    
    <!-- Latent factors -->
    <g transform="translate(50, 50)">
      <text x="60" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#E74C3C">
        Latent Factors (F)
      </text>
      
      <!-- Factor 1 -->
      <circle cx="40" cy="40" r="25" fill="url(#factorGrad)" stroke="#E74C3C" stroke-width="2"/>
      <text x="40" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#C0392B">F₁</text>
      
      <!-- Factor 2 -->
      <circle cx="40" cy="100" r="25" fill="url(#factorGrad)" stroke="#E74C3C" stroke-width="2"/>
      <text x="40" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#C0392B">F₂</text>
      
      <!-- Factor k -->
      <circle cx="40" cy="160" r="25" fill="url(#factorGrad)" stroke="#E74C3C" stroke-width="2"/>
      <text x="40" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#C0392B">Fₖ</text>
      
      <text x="40" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">
        Common Factors
      </text>
    </g>
    
    <!-- Loading matrix -->
    <g transform="translate(200, 50)">
      <text x="50" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#F39C12">
        Factor Loadings (Λ)
      </text>
      
      <!-- Loading arrows -->
      <g stroke="#F39C12" stroke-width="2" fill="none">
        <!-- From F1 to observed variables -->
        <path d="M -50 40 L 50 20" marker-end="url(#orangeArrow)"/>
        <path d="M -50 40 L 50 50" marker-end="url(#orangeArrow)"/>
        <path d="M -50 40 L 50 80" marker-end="url(#orangeArrow)"/>
        <path d="M -50 40 L 50 110" marker-end="url(#orangeArrow)"/>
        <path d="M -50 40 L 50 140" marker-end="url(#orangeArrow)"/>
        
        <!-- From F2 to observed variables -->
        <path d="M -50 100 L 50 20" marker-end="url(#orangeArrow)"/>
        <path d="M -50 100 L 50 50" marker-end="url(#orangeArrow)"/>
        <path d="M -50 100 L 50 80" marker-end="url(#orangeArrow)"/>
        <path d="M -50 100 L 50 110" marker-end="url(#orangeArrow)"/>
        <path d="M -50 100 L 50 140" marker-end="url(#orangeArrow)"/>
        
        <!-- From Fk to observed variables -->
        <path d="M -50 160 L 50 20" marker-end="url(#orangeArrow)"/>
        <path d="M -50 160 L 50 50" marker-end="url(#orangeArrow)"/>
        <path d="M -50 160 L 50 80" marker-end="url(#orangeArrow)"/>
        <path d="M -50 160 L 50 110" marker-end="url(#orangeArrow)"/>
        <path d="M -50 160 L 50 140" marker-end="url(#orangeArrow)"/>
      </g>
      
      <!-- Loading values -->
      <text x="0" y="35" font-family="Arial, sans-serif" font-size="9" fill="#D68910">λ₁₁</text>
      <text x="0" y="65" font-family="Arial, sans-serif" font-size="9" fill="#D68910">λ₂₁</text>
      <text x="0" y="95" font-family="Arial, sans-serif" font-size="9" fill="#D68910">λ₃₁</text>
      <text x="0" y="125" font-family="Arial, sans-serif" font-size="9" fill="#D68910">λ₄₁</text>
      <text x="0" y="155" font-family="Arial, sans-serif" font-size="9" fill="#D68910">λ₅₁</text>
    </g>
    
    <!-- Observed variables -->
    <g transform="translate(350, 50)">
      <text x="50" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#3498DB">
        Observed Variables (X)
      </text>
      
      <!-- Variable 1 -->
      <rect x="20" y="10" width="60" height="20" fill="url(#observedGrad)" stroke="#3498DB" stroke-width="2" rx="3"/>
      <text x="50" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2980B9">X₁</text>
      
      <!-- Variable 2 -->
      <rect x="20" y="40" width="60" height="20" fill="url(#observedGrad)" stroke="#3498DB" stroke-width="2" rx="3"/>
      <text x="50" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2980B9">X₂</text>
      
      <!-- Variable 3 -->
      <rect x="20" y="70" width="60" height="20" fill="url(#observedGrad)" stroke="#3498DB" stroke-width="2" rx="3"/>
      <text x="50" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2980B9">X₃</text>
      
      <!-- Variable 4 -->
      <rect x="20" y="100" width="60" height="20" fill="url(#observedGrad)" stroke="#3498DB" stroke-width="2" rx="3"/>
      <text x="50" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2980B9">X₄</text>
      
      <!-- Variable 5 -->
      <rect x="20" y="130" width="60" height="20" fill="url(#observedGrad)" stroke="#3498DB" stroke-width="2" rx="3"/>
      <text x="50" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2980B9">X₅</text>
    </g>
    
    <!-- Error terms -->
    <g transform="translate(500, 50)">
      <text x="40" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#7F8C8D">
        Error Terms (ε)
      </text>
      
      <!-- Plus signs -->
      <text x="10" y="25" font-family="Arial, sans-serif" font-size="16" fill="#34495E">+</text>
      <text x="10" y="55" font-family="Arial, sans-serif" font-size="16" fill="#34495E">+</text>
      <text x="10" y="85" font-family="Arial, sans-serif" font-size="16" fill="#34495E">+</text>
      <text x="10" y="115" font-family="Arial, sans-serif" font-size="16" fill="#34495E">+</text>
      <text x="10" y="145" font-family="Arial, sans-serif" font-size="16" fill="#34495E">+</text>
      
      <!-- Error terms -->
      <circle cx="40" cy="20" r="12" fill="url(#errorGrad)" stroke="#7F8C8D" stroke-width="1"/>
      <text x="40" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#5D6D7E">ε₁</text>
      
      <circle cx="40" cy="50" r="12" fill="url(#errorGrad)" stroke="#7F8C8D" stroke-width="1"/>
      <text x="40" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#5D6D7E">ε₂</text>
      
      <circle cx="40" cy="80" r="12" fill="url(#errorGrad)" stroke="#7F8C8D" stroke-width="1"/>
      <text x="40" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#5D6D7E">ε₃</text>
      
      <circle cx="40" cy="110" r="12" fill="url(#errorGrad)" stroke="#7F8C8D" stroke-width="1"/>
      <text x="40" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#5D6D7E">ε₄</text>
      
      <circle cx="40" cy="140" r="12" fill="url(#errorGrad)" stroke="#7F8C8D" stroke-width="1"/>
      <text x="40" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#5D6D7E">ε₅</text>
      
      <text x="40" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">
        Specific Factors
      </text>
    </g>
  </g>
  
  <!-- Mathematical details and interpretation -->
  <g transform="translate(50, 350)">
    <rect x="0" y="0" width="900" height="320" fill="#F8F9FA" stroke="#DDD" stroke-width="1" rx="8" filter="url(#shadow)"/>
    
    <text x="20" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2C3E50">Factor Analysis: Mathematical Framework and Interpretation</text>
    
    <!-- Left column: Model and assumptions -->
    <g transform="translate(30, 60)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#E74C3C">Factor Model:</text>
      <text x="0" y="25" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50">X = ΛF + ε</text>
      <text x="0" y="45" font-family="Arial, sans-serif" font-size="12" fill="#666">where X ∈ ℝᵖ, F ∈ ℝᵏ, Λ ∈ ℝᵖˣᵏ, ε ∈ ℝᵖ</text>
      
      <text x="0" y="80" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#3498DB">Model Assumptions:</text>
      <text x="0" y="105" font-family="Arial, sans-serif" font-size="12" fill="#333">• E[F] = 0, Cov(F) = I (standardized factors)</text>
      <text x="0" y="120" font-family="Arial, sans-serif" font-size="12" fill="#333">• E[ε] = 0, Cov(ε) = Ψ (diagonal)</text>
      <text x="0" y="135" font-family="Arial, sans-serif" font-size="12" fill="#333">• Cov(F, ε) = 0 (independence)</text>
      
      <text x="0" y="170" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#27AE60">Covariance Structure:</text>
      <text x="0" y="195" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50">Σ = ΛΛᵀ + Ψ</text>
      <text x="0" y="215" font-family="Arial, sans-serif" font-size="12" fill="#666">Common variance + Specific variance</text>
      
      <text x="0" y="245" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8E44AD">Communality and Specificity:</text>
      <text x="0" y="270" font-family="Arial, sans-serif" font-size="12" fill="#333">• h²ᵢ = sum of λ²ᵢⱼ (communality of variable i)</text>
      <text x="0" y="285" font-family="Arial, sans-serif" font-size="12" fill="#333">• ψᵢ = Var(Xᵢ) - h²ᵢ (specific variance)</text>
    </g>
    
    <!-- Right column: Estimation and rotation -->
    <g transform="translate(450, 60)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#D35400">Estimation Methods:</text>
      <text x="0" y="25" font-family="Arial, sans-serif" font-size="12" fill="#333">• Maximum Likelihood (ML)</text>
      <text x="0" y="40" font-family="Arial, sans-serif" font-size="12" fill="#333">• Principal Axis Factoring (PAF)</text>
      <text x="0" y="55" font-family="Arial, sans-serif" font-size="12" fill="#333">• Minimum Residual (MinRes)</text>
      <text x="0" y="70" font-family="Arial, sans-serif" font-size="12" fill="#333">• Weighted Least Squares (WLS)</text>
      
      <text x="0" y="105" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#C0392B">Factor Rotation:</text>
      <text x="0" y="130" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#E74C3C">Orthogonal:</text>
      <text x="0" y="145" font-family="Arial, sans-serif" font-size="12" fill="#333">• Varimax: simplifies factors</text>
      <text x="0" y="160" font-family="Arial, sans-serif" font-size="12" fill="#333">• Quartimax: simplifies variables</text>
      <text x="0" y="175" font-family="Arial, sans-serif" font-size="12" fill="#333">• Equamax: balance of both</text>
      
      <text x="0" y="195" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#E74C3C">Oblique:</text>
      <text x="0" y="210" font-family="Arial, sans-serif" font-size="12" fill="#333">• Promax: allows factor correlation</text>
      <text x="0" y="225" font-family="Arial, sans-serif" font-size="12" fill="#333">• Direct Oblimin: controls correlation</text>
      
      <text x="0" y="255" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#16A085">Model Selection:</text>
      <text x="0" y="280" font-family="Arial, sans-serif" font-size="12" fill="#333">• Kaiser criterion: eigenvalues > 1</text>
      <text x="0" y="295" font-family="Arial, sans-serif" font-size="12" fill="#333">• Scree plot: elbow method</text>
    </g>
  </g>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="orangeArrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#F39C12"/>
    </marker>
  </defs>
</svg>