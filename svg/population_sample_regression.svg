<svg viewBox="0 0 900 650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="popGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="sampleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:0.8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
     refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="650" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1e293b">
    Population vs Sample Regression
  </text>
  
  <!-- Population Side -->
  <text x="225" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1e40af">
    Population Regression
  </text>
  
  <!-- Population box -->
  <rect x="50" y="100" width="350" height="200" rx="10" fill="url(#popGradient)" filter="url(#shadow)"/>
  
  <text x="225" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
    Complete Dataset Available
  </text>
  
  <text x="80" y="160" font-family="Arial, sans-serif" font-size="14" fill="white">
    • Access to entire population
  </text>
  <text x="80" y="180" font-family="Arial, sans-serif" font-size="14" fill="white">
    • True parameters β*
  </text>
  <text x="80" y="200" font-family="Arial, sans-serif" font-size="14" fill="white">
    • Known error distribution
  </text>
  
  <text x="225" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
    Y = β*X + ε*
  </text>
  
  <text x="225" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
    E[(Y - β*X)X] = 0
  </text>
  <text x="225" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
    min E[(Y - βX)²]
  </text>
  
  <!-- Sample Side -->
  <text x="675" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#dc2626">
    Sample Regression
  </text>
  
  <!-- Sample box -->
  <rect x="500" y="100" width="350" height="200" rx="10" fill="url(#sampleGradient)" filter="url(#shadow)"/>
  
  <text x="675" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
    Random Sample of Size n
  </text>
  
  <text x="530" y="160" font-family="Arial, sans-serif" font-size="14" fill="white">
    • Limited observations (X₁,Y₁)...(Xₙ,Yₙ)
  </text>
  <text x="530" y="180" font-family="Arial, sans-serif" font-size="14" fill="white">
    • Estimated parameters β̂
  </text>
  <text x="530" y="200" font-family="Arial, sans-serif" font-size="14" fill="white">
    • Empirical error distribution
  </text>
  
  <text x="675" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
    Y = β̂X + ε̂
  </text>
  
  <text x="675" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
    (1/n)Σ(Yᵢ - β̂Xᵢ)Xᵢ = 0
  </text>
  <text x="675" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
    min (1/n)Σ(Yᵢ - βXᵢ)²
  </text>
  
  <!-- Convergence Arrow -->
  <line x1="400" y1="200" x2="500" y2="200" stroke="#64748b" stroke-width="4" marker-end="url(#arrowhead)"/>
  <text x="450" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#64748b">
    As n→∞
  </text>
  <text x="450" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b">
    β̂ → β*
  </text>
  
  <!-- Key Differences Section -->
  <text x="450" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">
    Key Relationship: p/n Ratio
  </text>
  
  <!-- Small p/n scenario -->
  <rect x="100" y="390" width="250" height="120" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="225" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#15803d">
    Small p/n Ratio
  </text>
  <text x="225" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#15803d">
    (p ≪ n)
  </text>
  <text x="120" y="460" font-family="Arial, sans-serif" font-size="11" fill="#15803d">
    ✓ β̂ ≈ β* (good approximation)
  </text>
  <text x="120" y="475" font-family="Arial, sans-serif" font-size="11" fill="#15803d">
    ✓ Sample R² ≈ Population R²
  </text>
  <text x="120" y="490" font-family="Arial, sans-serif" font-size="11" fill="#15803d">
    ✓ Reliable inference
  </text>
  
  <!-- Large p/n scenario -->
  <rect x="550" y="390" width="250" height="120" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="675" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">
    Large p/n Ratio
  </text>
  <text x="675" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#dc2626">
    (p → n)
  </text>
  <text x="570" y="460" font-family="Arial, sans-serif" font-size="11" fill="#dc2626">
    ✗ β̂ ≠ β* (poor approximation)
  </text>
  <text x="570" y="475" font-family="Arial, sans-serif" font-size="11" fill="#dc2626">
    ✗ Overfitting (R² → 1)
  </text>
  <text x="570" y="490" font-family="Arial, sans-serif" font-size="11" fill="#dc2626">
    ✗ Unreliable inference
  </text>
  
  <!-- Theoretical Bound -->
  <rect x="200" y="540" width="500" height="80" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="450" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#334155">
    Theoretical Bound (Convergence Rate)
  </text>
  <text x="450" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#334155">
    √E[(β*X - β̂X)²] ≤ const · √(Eε²) · √(p/n)
  </text>
  <text x="450" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#64748b">
    Estimation error bounded by noise level times √(p/n)
  </text>
</svg>