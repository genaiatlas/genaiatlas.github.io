<svg viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="500" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Complete Clustering Workflow for Recommendation Systems
  </text>
  
  <!-- Step 1: Input Data -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="200" height="100" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" rx="10"/>
    <text x="100" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2e7d32">
      Step 1: Input Data
    </text>
    <text x="100" y="55" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">
      User-Item Rating Matrix
    </text>
    <text x="100" y="75" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">
      (n users × m items)
    </text>
  </g>
  
  <!-- Arrow 1 -->
  <g>
    <line x1="250" y1="130" x2="300" y2="130" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
  
  <!-- Step 2: Similarity Computation -->
  <g transform="translate(300, 80)">
    <rect x="0" y="0" width="200" height="100" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="10"/>
    <text x="100" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#e65100">
      Step 2: Similarity
    </text>
    <text x="100" y="55" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">
      Compute N×N Matrix
    </text>
    <text x="100" y="75" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">
      (Cosine/Euclidean)
    </text>
  </g>
  
  <!-- Arrow 2 -->
  <g>
    <line x1="500" y1="130" x2="550" y2="130" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
  
  <!-- Step 3: Dimensionality Reduction -->
  <g transform="translate(550, 80)">
    <rect x="0" y="0" width="200" height="100" fill="#e3f2fd" stroke="#2196f3" stroke-width="2" rx="10"/>
    <text x="100" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1565c0">
      Step 3: Reduction
    </text>
    <text x="100" y="55" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">
      SVD/PCA
    </text>
    <text x="100" y="75" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">
      (Keep top d components)
    </text>
  </g>
  
  <!-- Arrow 3 -->
  <g>
    <line x1="750" y1="130" x2="800" y2="130" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
  
  <!-- Step 4: Clustering -->
  <g transform="translate(800, 80)">
    <rect x="0" y="0" width="150" height="100" fill="#ffebee" stroke="#f44336" stroke-width="2" rx="10"/>
    <text x="75" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#c62828">
      Step 4: K-Means
    </text>
    <text x="75" y="55" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">
      Form k Clusters
    </text>
    <text x="75" y="75" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">
      (Iterative)
    </text>
  </g>
  
  <!-- Downward arrow from Step 4 -->
  <g>
    <line x1="875" y1="180" x2="875" y2="230" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
  
  <!-- Step 5: Prediction -->
  <g transform="translate(775, 230)">
    <rect x="0" y="0" width="200" height="100" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2" rx="10"/>
    <text x="100" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#6a1b9a">
      Step 5: Prediction
    </text>
    <text x="100" y="55" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">
      Average within cluster
    </text>
    <text x="100" y="75" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">
      for target user/item
    </text>
  </g>
  
  <!-- Detailed boxes for each step -->
  
  <!-- Details for Step 1 -->
  <g transform="translate(50, 220)">
    <rect x="0" y="0" width="180" height="140" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1" rx="5"/>
    <text x="90" y="20" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#424242">
      Data Structure
    </text>
    <text x="10" y="40" font-family="Arial, sans-serif" font-size="11" fill="#333">• Sparse matrix format</text>
    <text x="10" y="60" font-family="Arial, sans-serif" font-size="11" fill="#333">• Missing values handled</text>
    <text x="10" y="80" font-family="Arial, sans-serif" font-size="11" fill="#333">• Scale: 1-5 ratings</text>
    <text x="10" y="100" font-family="Arial, sans-serif" font-size="11" fill="#333">• Implicit/Explicit feedback</text>
    <text x="10" y="120" font-family="Arial, sans-serif" font-size="11" fill="#333">• Time stamps optional</text>
  </g>
  
  <!-- Details for Step 2 -->
  <g transform="translate(260, 220)">
    <rect x="0" y="0" width="180" height="140" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1" rx="5"/>
    <text x="90" y="20" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#424242">
      Similarity Options
    </text>
    <text x="10" y="40" font-family="Arial, sans-serif" font-size="11" fill="#333">• Cosine: cos(θ)</text>
    <text x="10" y="60" font-family="Arial, sans-serif" font-size="11" fill="#333">• Euclidean: √Σ(x-y)²</text>
    <text x="10" y="80" font-family="Arial, sans-serif" font-size="11" fill="#333">• Pearson correlation</text>
    <text x="10" y="100" font-family="Arial, sans-serif" font-size="11" fill="#333">• Mean-centered variant</text>
    <text x="10" y="120" font-family="Arial, sans-serif" font-size="11" fill="#333">• Handle sparse regions</text>
  </g>
  
  <!-- Details for Step 3 -->
  <g transform="translate(470, 220)">
    <rect x="0" y="0" width="180" height="140" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1" rx="5"/>
    <text x="90" y="20" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#424242">
      Dimension Selection
    </text>
    <text x="10" y="40" font-family="Arial, sans-serif" font-size="11" fill="#333">• Elbow method</text>
    <text x="10" y="60" font-family="Arial, sans-serif" font-size="11" fill="#333">• Variance threshold</text>
    <text x="10" y="80" font-family="Arial, sans-serif" font-size="11" fill="#333">• Typically d &lt;&lt; N</text>
    <text x="10" y="100" font-family="Arial, sans-serif" font-size="11" fill="#333">• 80-90% variance</text>
    <text x="10" y="120" font-family="Arial, sans-serif" font-size="11" fill="#333">• Computational limits</text>
  </g>
  
  <!-- K-Means Algorithm Box -->
  <g transform="translate(50, 400)">
    <rect x="0" y="0" width="500" height="180" fill="#fff8e1" stroke="#ffc107" stroke-width="2" rx="10"/>
    <text x="250" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#f57c00">
      K-Means Clustering Algorithm
    </text>
    
    <g transform="translate(20, 50)">
      <text x="0" y="20" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#e65100">1. Initialize:</text>
      <text x="15" y="40" font-family="Arial, sans-serif" font-size="12" fill="#333">Select k random centroids from data points</text>
      
      <text x="0" y="65" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#e65100">2. Assign:</text>
      <text x="15" y="85" font-family="Arial, sans-serif" font-size="12" fill="#333">Each point to nearest centroid (min distance)</text>
      
      <text x="0" y="110" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#e65100">3. Update:</text>
      <text x="15" y="130" font-family="Arial, sans-serif" font-size="12" fill="#333">Recompute centroids as mean of assigned points</text>
      
      <text x="250" y="20" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#e65100">4. Check:</text>
      <text x="265" y="40" font-family="Arial, sans-serif" font-size="12" fill="#333">If centroids changed, go to step 2</text>
      
      <text x="250" y="65" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#e65100">5. Converge:</text>
      <text x="265" y="85" font-family="Arial, sans-serif" font-size="12" fill="#333">When centroids stable or max iterations</text>
    </g>
  </g>
  
  <!-- Optimization Techniques -->
  <g transform="translate(570, 400)">
    <rect x="0" y="0" width="400" height="180" fill="#e8eaf6" stroke="#3f51b5" stroke-width="2" rx="10"/>
    <text x="200" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#283593">
      Optimization Techniques
    </text>
    
    <g transform="translate(20, 50)">
      <rect x="0" y="0" width="170" height="100" fill="white" stroke="#9fa8da" stroke-width="1" rx="3"/>
      <text x="85" y="20" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#3949ab">
        Performance
      </text>
      <text x="10" y="40" font-family="Arial, sans-serif" font-size="11" fill="#333">• Sparse matrices</text>
      <text x="10" y="60" font-family="Arial, sans-serif" font-size="11" fill="#333">• Mini-batch K-means</text>
      <text x="10" y="80" font-family="Arial, sans-serif" font-size="11" fill="#333">• Parallel processing</text>
      
      <rect x="190" y="0" width="170" height="100" fill="white" stroke="#9fa8da" stroke-width="1" rx="3"/>
      <text x="275" y="20" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#3949ab">
        Quality
      </text>
      <text x="200" y="40" font-family="Arial, sans-serif" font-size="11" fill="#333">• Multiple runs</text>
      <text x="200" y="60" font-family="Arial, sans-serif" font-size="11" fill="#333">• Smart initialization</text>
      <text x="200" y="80" font-family="Arial, sans-serif" font-size="11" fill="#333">• Silhouette score</text>
    </g>
  </g>
  
  <!-- Metrics Box -->
  <g transform="translate(200, 620)">
    <rect x="0" y="0" width="600" height="120" fill="#fce4ec" stroke="#e91e63" stroke-width="2" rx="10"/>
    <text x="300" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#880e4f">
      Evaluation Metrics
    </text>
    
    <g transform="translate(30, 50)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" fill="#333">
        • <tspan font-weight="bold">Within-Cluster RMSE:</tspan> √(Σ(predicted - actual)² / n)
      </text>
      <text x="0" y="25" font-family="Arial, sans-serif" font-size="12" fill="#333">
        • <tspan font-weight="bold">Silhouette Coefficient:</tspan> (b - a) / max(a, b) where a=intra, b=inter distance
      </text>
      <text x="0" y="50" font-family="Arial, sans-serif" font-size="12" fill="#333">
        • <tspan font-weight="bold">Coverage:</tspan> % of users/items with sufficient cluster data for prediction
      </text>
    </g>
  </g>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#666"/>
    </marker>
  </defs>
</svg>