<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="600" y="40" font-size="28" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Three Markov Properties for Undirected Graphical Models
  </text>
  
  <!-- Background -->
  <rect x="20" y="70" width="1160" height="810" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2" rx="10"/>
  
  <!-- Property 1: Global Markov Property -->
  <g transform="translate(60, 110)">
    <rect x="0" y="0" width="350" height="230" fill="#e8f5e9" stroke="#4caf50" stroke-width="3" rx="8"/>
    <text x="175" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#2e7d32">1. Global Markov Property</text>
    
    <!-- Graph illustration -->
    <g transform="translate(175, 120)">
      <!-- Set A nodes -->
      <circle cx="-100" cy="-30" r="18" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
      <text x="-100" y="-25" font-size="14" font-weight="bold" text-anchor="middle" fill="white">A₁</text>
      <circle cx="-100" cy="30" r="18" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
      <text x="-100" y="35" font-size="14" font-weight="bold" text-anchor="middle" fill="white">A₂</text>
      
      <!-- Set C nodes (separator) -->
      <circle cx="0" cy="-30" r="18" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
      <text x="0" y="-25" font-size="14" font-weight="bold" text-anchor="middle" fill="white">C₁</text>
      <circle cx="0" cy="30" r="18" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
      <text x="0" y="35" font-size="14" font-weight="bold" text-anchor="middle" fill="white">C₂</text>
      
      <!-- Set B nodes -->
      <circle cx="100" cy="-30" r="18" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
      <text x="100" y="-25" font-size="14" font-weight="bold" text-anchor="middle" fill="white">B₁</text>
      <circle cx="100" cy="30" r="18" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
      <text x="100" y="35" font-size="14" font-weight="bold" text-anchor="middle" fill="white">B₂</text>
      
      <!-- Edges -->
      <line x1="-82" y1="-30" x2="-18" y2="-30" stroke="#7f8c8d" stroke-width="2"/>
      <line x1="-82" y1="30" x2="-18" y2="30" stroke="#7f8c8d" stroke-width="2"/>
      <line x1="18" y1="-30" x2="82" y2="-30" stroke="#7f8c8d" stroke-width="2"/>
      <line x1="18" y1="30" x2="82" y2="30" stroke="#7f8c8d" stroke-width="2"/>
      <line x1="0" y1="-12" x2="0" y2="12" stroke="#7f8c8d" stroke-width="2"/>
    </g>
    
    <text x="175" y="195" font-size="14" font-weight="bold" text-anchor="middle" fill="#2e7d32">X_A ⊥⊥ X_B | X_C</text>
    <text x="175" y="215" font-size="12" text-anchor="middle" fill="#2e7d32">C separates A and B</text>
  </g>
  
  <!-- Property 2: Local Markov Property -->
  <g transform="translate(450, 110)">
    <rect x="0" y="0" width="350" height="230" fill="#e3f2fd" stroke="#2196f3" stroke-width="3" rx="8"/>
    <text x="175" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#1565c0">2. Local Markov Property</text>
    
    <!-- Graph illustration -->
    <g transform="translate(175, 130)">
      <!-- Central node i -->
      <circle cx="0" cy="0" r="22" fill="#e74c3c" stroke="#c0392b" stroke-width="3"/>
      <text x="0" y="6" font-size="16" font-weight="bold" text-anchor="middle" fill="white">i</text>
      
      <!-- Neighbors N_i -->
      <circle cx="-60" cy="-50" r="18" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
      <text x="-60" y="-44" font-size="13" font-weight="bold" text-anchor="middle" fill="white">N₁</text>
      <circle cx="60" cy="-50" r="18" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
      <text x="60" y="-44" font-size="13" font-weight="bold" text-anchor="middle" fill="white">N₂</text>
      <circle cx="-60" cy="50" r="18" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
      <text x="-60" y="56" font-size="13" font-weight="bold" text-anchor="middle" fill="white">N₃</text>
      <circle cx="60" cy="50" r="18" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
      <text x="60" y="56" font-size="13" font-weight="bold" text-anchor="middle" fill="white">N₄</text>
      
      <!-- Non-neighbors -->
      <circle cx="-110" cy="0" r="16" fill="#95a5a6" stroke="#7f8c8d" stroke-width="2"/>
      <text x="-110" y="5" font-size="12" text-anchor="middle" fill="white">V₁</text>
      <circle cx="110" cy="0" r="16" fill="#95a5a6" stroke="#7f8c8d" stroke-width="2"/>
      <text x="110" y="5" font-size="12" text-anchor="middle" fill="white">V₂</text>
      
      <!-- Edges from i to neighbors -->
      <line x1="-15" y1="-15" x2="-48" y2="-40" stroke="#27ae60" stroke-width="3"/>
      <line x1="15" y1="-15" x2="48" y2="-40" stroke="#27ae60" stroke-width="3"/>
      <line x1="-15" y1="15" x2="-48" y2="40" stroke="#27ae60" stroke-width="3"/>
      <line x1="15" y1="15" x2="48" y2="40" stroke="#27ae60" stroke-width="3"/>
      
      <!-- Edges from neighbors to non-neighbors -->
      <line x1="-78" y1="-45" x2="-96" y2="-10" stroke="#7f8c8d" stroke-width="2"/>
      <line x1="78" y1="-45" x2="96" y2="-10" stroke="#7f8c8d" stroke-width="2"/>
    </g>
    
    <text x="175" y="205" font-size="14" font-weight="bold" text-anchor="middle" fill="#1565c0">X_i ⊥⊥ X_V\{i,N_i} | X_N_i</text>
    <text x="175" y="225" font-size="12" text-anchor="middle" fill="#1565c0">Node independent of rest given neighbors</text>
  </g>
  
  <!-- Property 3: Pairwise Markov Property -->
  <g transform="translate(840, 110)">
    <rect x="0" y="0" width="300" height="230" fill="#fce4ec" stroke="#e91e63" stroke-width="3" rx="8"/>
    <text x="150" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#880e4f">3. Pairwise Markov</text>
    
    <!-- Graph illustration -->
    <g transform="translate(150, 125)">
      <!-- Nodes s and t (non-adjacent) -->
      <circle cx="-70" cy="0" r="20" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
      <text x="-70" y="6" font-size="15" font-weight="bold" text-anchor="middle" fill="white">s</text>
      <circle cx="70" cy="0" r="20" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
      <text x="70" y="6" font-size="15" font-weight="bold" text-anchor="middle" fill="white">t</text>
      
      <!-- Other nodes -->
      <circle cx="0" cy="-50" r="16" fill="#95a5a6" stroke="#7f8c8d" stroke-width="2"/>
      <text x="0" y="-44" font-size="13" text-anchor="middle" fill="white">v₁</text>
      <circle cx="0" cy="50" r="16" fill="#95a5a6" stroke="#7f8c8d" stroke-width="2"/>
      <text x="0" y="56" font-size="13" text-anchor="middle" fill="white">v₂</text>
      
      <!-- Edges (note: NO edge between s and t) -->
      <line x1="-55" y1="-12" x2="-10" y2="-42" stroke="#7f8c8d" stroke-width="2"/>
      <line x1="55" y1="-12" x2="10" y2="-42" stroke="#7f8c8d" stroke-width="2"/>
      <line x1="-55" y1="12" x2="-10" y2="42" stroke="#7f8c8d" stroke-width="2"/>
      <line x1="55" y1="12" x2="10" y2="42" stroke="#7f8c8d" stroke-width="2"/>
      
      <!-- No edge indicator -->
      <line x1="-50" y1="0" x2="50" y2="0" stroke="#e74c3c" stroke-width="3" stroke-dasharray="8,4" opacity="0.5"/>
      <text x="0" y="-25" font-size="11" font-weight="bold" text-anchor="middle" fill="#e74c3c">No Edge</text>
    </g>
    
    <text x="150" y="205" font-size="14" font-weight="bold" text-anchor="middle" fill="#880e4f">X_s ⊥⊥ X_t | X_V\{s,t}</text>
    <text x="150" y="225" font-size="11" text-anchor="middle" fill="#880e4f">Non-adjacent nodes independent</text>
  </g>
  
  <!-- Equivalence Statement -->
  <g transform="translate(600, 380)">
    <rect x="-280" y="-40" width="560" height="80" fill="#fff3cd" stroke="#ffc107" stroke-width="3" rx="10"/>
    <text x="0" y="-10" font-size="20" font-weight="bold" text-anchor="middle" fill="#856404">Equivalence for Positive Distributions</text>
    <text x="0" y="20" font-size="18" text-anchor="middle" fill="#856404">Global ⟺ Local ⟺ Pairwise</text>
  </g>
  
  <!-- Detailed Examples -->
  <g transform="translate(60, 480)">
    <rect x="0" y="0" width="540" height="350" fill="white" stroke="#3498db" stroke-width="2" rx="8"/>
    <text x="270" y="30" font-size="18" font-weight="bold" text-anchor="middle" fill="#2c3e50">Example: Weather Station Network</text>
    
    <!-- Simplified weather network -->
    <g transform="translate(270, 190)">
      <!-- Cities -->
      <circle cx="-120" cy="0" r="25" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
      <text x="-120" y="-15" font-size="11" font-weight="bold" text-anchor="middle" fill="white">Boston</text>
      <text x="-120" y="5" font-size="9" text-anchor="middle" fill="white">(A)</text>
      
      <circle cx="0" cy="0" r="25" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
      <text x="0" y="-15" font-size="11" font-weight="bold" text-anchor="middle" fill="white">NY</text>
      <text x="0" y="5" font-size="9" text-anchor="middle" fill="white">(C)</text>
      
      <circle cx="120" cy="0" r="25" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
      <text x="120" y="-15" font-size="11" font-weight="bold" text-anchor="middle" fill="white">DC</text>
      <text x="120" y="5" font-size="9" text-anchor="middle" fill="white">(B)</text>
      
      <!-- Edges -->
      <line x1="-95" y1="0" x2="-25" y2="0" stroke="#27ae60" stroke-width="3"/>
      <line x1="25" y1="0" x2="95" y2="0" stroke="#27ae60" stroke-width="3"/>
      
      <!-- No direct edge Boston-DC -->
      <path d="M -120,30 Q 0,80 120,30" stroke="#e74c3c" stroke-width="2" stroke-dasharray="5,3" fill="none" opacity="0.5"/>
      <text x="0" y="90" font-size="11" font-weight="bold" text-anchor="middle" fill="#e74c3c">No Direct Edge</text>
    </g>
    
    <text x="270" y="295" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">Global Markov Property:</text>
    <text x="270" y="315" font-size="13" text-anchor="middle" fill="#495057">Boston ⊥⊥ DC | NY</text>
    <text x="270" y="335" font-size="12" text-anchor="middle" fill="#7f8c8d">NY separates Boston and DC</text>
  </g>
  
  <!-- Practical Implications -->
  <g transform="translate(640, 480)">
    <rect x="0" y="0" width="500" height="350" fill="white" stroke="#27ae60" stroke-width="2" rx="8"/>
    <text x="250" y="30" font-size="18" font-weight="bold" text-anchor="middle" fill="#2c3e50">Practical Implications</text>
    
    <g transform="translate(20, 60)">
      <text x="0" y="0" font-size="15" font-weight="bold" fill="#27ae60">🎯 Graph Structure Learning:</text>
      <text x="10" y="25" font-size="13" fill="#495057">• Test any Markov property to identify edges</text>
      <text x="10" y="48" font-size="13" fill="#495057">• Choose computationally convenient form</text>
      <text x="10" y="71" font-size="13" fill="#495057">• Pairwise: Test all node pairs</text>
      <text x="10" y="94" font-size="13" fill="#495057">• Local: Test neighborhood structure</text>
      
      <text x="0" y="130" font-size="15" font-weight="bold" fill="#3498db">⚡ Computational Efficiency:</text>
      <text x="10" y="155" font-size="13" fill="#495057">• Reduce search space using properties</text>
      <text x="10" y="178" font-size="13" fill="#495057">• Local property: O(|N_i|) tests per node</text>
      <text x="10" y="201" font-size="13" fill="#495057">• Pairwise: O(P²) total tests</text>
      
      <text x="0" y="237" font-size="15" font-weight="bold" fill="#e74c3c">📊 Statistical Testing:</text>
      <text x="10" y="262" font-size="13" fill="#495057">• Use conditional independence tests</text>
      <text x="10" y="285" font-size="13" fill="#495057">• Account for estimation errors</text>
      <text x="10" y="308" font-size="13" fill="#495057">• Control false discovery rate</text>
    </g>
  </g>
</svg>