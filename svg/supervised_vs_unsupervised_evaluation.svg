<svg width="900" height="550" viewBox="0 0 900 550" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="550" fill="url(#bgGradient)"/>
  
  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    Supervised vs Unsupervised Learning Evaluation
  </text>
  
  <!-- Supervised Learning Section -->
  <rect x="50" y="80" width="380" height="400" rx="15" fill="#3498db" stroke="#2980b9" stroke-width="3" filter="url(#shadow)" opacity="0.1"/>
  <text x="240" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2980b9">
    Supervised Learning (Classification)
  </text>
  
  <!-- Training Data -->
  <rect x="80" y="140" width="120" height="60" rx="8" fill="#27ae60" stroke="#229954" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Training Data
  </text>
  <text x="140" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
    (Features + Labels)
  </text>
  
  <!-- Test Data -->
  <rect x="280" y="140" width="120" height="60" rx="8" fill="#e74c3c" stroke="#c0392b" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Test Data
  </text>
  <text x="340" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
    (Features + Labels)
  </text>
  
  <!-- Algorithm -->
  <ellipse cx="240" cy="260" rx="80" ry="30" fill="#9b59b6" stroke="#8e44ad" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Classification Algorithm
  </text>
  
  <!-- Evaluation -->
  <rect x="160" y="320" width="160" height="40" rx="8" fill="#f39c12" stroke="#e67e22" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Compare Predictions vs True Labels
  </text>
  
  <!-- Accuracy Formula -->
  <rect x="100" y="380" width="280" height="80" rx="8" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
    Accuracy = Correct Predictions / Total Predictions
  </text>
  <text x="240" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">
    ✓ Clear evaluation metric
  </text>
  <text x="240" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">
    ✓ Universal comparison scale
  </text>
  <text x="240" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">
    ✓ Absolute quality assessment
  </text>
  
  <!-- Unsupervised Learning Section -->
  <rect x="470" y="80" width="380" height="400" rx="15" fill="#e74c3c" stroke="#c0392b" stroke-width="3" filter="url(#shadow)" opacity="0.1"/>
  <text x="660" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#c0392b">
    Unsupervised Learning (Clustering)
  </text>
  
  <!-- Unlabeled Data -->
  <rect x="580" y="140" width="160" height="60" rx="8" fill="#95a5a6" stroke="#7f8c8d" stroke-width="2" filter="url(#shadow)"/>
  <text x="660" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Unlabeled Data
  </text>
  <text x="660" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
    (Features Only)
  </text>
  
  <!-- Clustering Algorithm -->
  <ellipse cx="660" cy="240" rx="80" ry="30" fill="#9b59b6" stroke="#8e44ad" stroke-width="2" filter="url(#shadow)"/>
  <text x="660" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Clustering Algorithm
  </text>
  
  <!-- Multiple Evaluation Methods -->
  <rect x="500" y="280" width="100" height="30" rx="5" fill="#f39c12" stroke="#e67e22" stroke-width="1"/>
  <text x="550" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">
    Internal Metrics
  </text>
  
  <rect x="620" y="280" width="100" height="30" rx="5" fill="#16a085" stroke="#138d75" stroke-width="1"/>
  <text x="670" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">
    Visualization
  </text>
  
  <rect x="740" y="280" width="100" height="30" rx="5" fill="#d35400" stroke="#ba4a00" stroke-width="1"/>
  <text x="790" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">
    External Metrics
  </text>
  
  <!-- Challenges -->
  <rect x="520" y="330" width="280" height="130" rx="8" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2" filter="url(#shadow)"/>
  <text x="660" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
    Evaluation Challenges
  </text>
  <text x="660" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#e74c3c">
    ✗ No universal ground truth
  </text>
  <text x="660" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#e74c3c">
    ✗ Label permutations are equivalent
  </text>
  <text x="660" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#e74c3c">
    ✗ Multiple valid solutions exist
  </text>
  <text x="660" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#e74c3c">
    ✗ Domain-specific interpretation needed
  </text>
  <text x="660" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#f39c12">
    → Multi-method evaluation required
  </text>
  <text x="660" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#f39c12">
    → Focus on point relationships
  </text>
  
  <!-- Arrows -->
  <path d="M 140 210 L 140 230 L 180 250" stroke="#34495e" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 340 210 L 340 230 L 300 250" stroke="#34495e" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 240 290 L 240 310" stroke="#34495e" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <path d="M 660 210 L 660 220" stroke="#34495e" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 660 270 L 660 275" stroke="#34495e" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Divider line -->
  <line x1="450" y1="60" x2="450" y2="520" stroke="#bdc3c7" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Key insight box -->
  <rect x="200" y="500" width="500" height="40" rx="5" fill="#fff" stroke="#34495e" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">
    Key Difference: Clustering evaluation focuses on relationships between data points,
  </text>
  <text x="450" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">
    not absolute label accuracy
  </text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e"/>
    </marker>
  </defs>
</svg>