<svg width="900" height="650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #333; }
      .subtitle { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #333; }
      .label { font-family: Arial, sans-serif; font-size: 12px; fill: #333; }
      .small-label { font-family: Arial, sans-serif; font-size: 10px; fill: #333; }
      .node-text { font-family: Arial, sans-serif; font-size: 11px; fill: #333; text-anchor: middle; }
      .root-node { fill: #ffeb3b; stroke: #f57f17; stroke-width: 3; }
      .internal-node { fill: #2196f3; stroke: #0d47a1; stroke-width: 2; }
      .leaf-node { fill: #4caf50; stroke: #1b5e20; stroke-width: 2; }
      .edge { stroke: #666; stroke-width: 2; }
      .condition-text { font-family: Arial, sans-serif; font-size: 10px; fill: #666; }
      .legend-box { fill: #f8f9fa; stroke: #dee2e6; stroke-width: 1; rx: 5; }
    </style>
  </defs>
  
  <!-- Title -->
  <text x="450" y="25" text-anchor="middle" class="title">Decision Tree Structure and Terminology</text>
  
  <!-- Tree Structure -->
  <g transform="translate(50, 60)">
    
    <!-- Root Node -->
    <circle cx="350" cy="50" r="28" class="root-node" />
    <text x="350" y="46" class="node-text">House Size</text>
    <text x="350" y="56" class="node-text">&lt; 2000 sq ft?</text>
    <text x="350" y="85" class="small-label" text-anchor="middle">Root Node</text>
    
    <!-- Edges from root -->
    <line x1="325" y1="70" x2="200" y2="130" class="edge" />
    <line x1="375" y1="70" x2="500" y2="130" class="edge" />
    
    <!-- Edge labels -->
    <text x="260" y="95" class="condition-text">Yes</text>
    <text x="440" y="95" class="condition-text">No</text>
    
    <!-- Left Branch - Internal Node -->
    <ellipse cx="200" cy="160" rx="35" ry="22" class="internal-node" />
    <text x="200" y="157" class="node-text">Bedrooms</text>
    <text x="200" y="167" class="node-text">&lt; 3?</text>
    <text x="200" y="195" class="small-label" text-anchor="middle">Internal Node</text>
    
    <!-- Right Branch - Internal Node -->
    <ellipse cx="500" cy="160" rx="35" ry="22" class="internal-node" />
    <text x="500" y="157" class="node-text">Location</text>
    <text x="500" y="167" class="node-text">= Urban?</text>
    <text x="500" y="195" class="small-label" text-anchor="middle">Internal Node</text>
    
    <!-- Edges from internal nodes -->
    <line x1="175" y1="180" x2="120" y2="235" class="edge" />
    <line x1="225" y1="180" x2="280" y2="235" class="edge" />
    <line x1="475" y1="180" x2="420" y2="235" class="edge" />
    <line x1="525" y1="180" x2="580" y2="235" class="edge" />
    
    <!-- Edge labels for second level -->
    <text x="145" y="210" class="condition-text">Yes</text>
    <text x="255" y="210" class="condition-text">No</text>
    <text x="445" y="210" class="condition-text">Yes</text>
    <text x="555" y="210" class="condition-text">No</text>
    
    <!-- Leaf Nodes -->
    <rect x="95" y="250" width="50" height="25" class="leaf-node" rx="5" />
    <text x="120" y="265" class="node-text">$180K</text>
    <text x="120" y="290" class="small-label" text-anchor="middle">Leaf Node</text>
    
    <rect x="255" y="250" width="50" height="25" class="leaf-node" rx="5" />
    <text x="280" y="265" class="node-text">$220K</text>
    <text x="280" y="290" class="small-label" text-anchor="middle">Leaf Node</text>
    
    <rect x="395" y="250" width="50" height="25" class="leaf-node" rx="5" />
    <text x="420" y="265" class="node-text">$350K</text>
    <text x="420" y="290" class="small-label" text-anchor="middle">Leaf Node</text>
    
    <rect x="555" y="250" width="50" height="25" class="leaf-node" rx="5" />
    <text x="580" y="265" class="node-text">$280K</text>
    <text x="580" y="290" class="small-label" text-anchor="middle">Leaf Node</text>
    
    <!-- Tree depth indicator -->
    <g transform="translate(680, 50)">
      <text x="0" y="0" class="label" font-weight="bold">Tree Depth = 2</text>
      <line x1="0" y1="8" x2="0" y2="230" stroke="#ff5722" stroke-width="2" stroke-dasharray="4,4" />
      <text x="5" y="55" class="small-label">Level 0</text>
      <text x="5" y="165" class="small-label">Level 1</text>
      <text x="5" y="265" class="small-label">Level 2</text>
    </g>
  </g>
  
  <!-- Splitting Process Illustration -->
  <g transform="translate(50, 400)">
    <text x="300" y="0" text-anchor="middle" class="subtitle">Recursive Binary Splitting Process</text>
    
    <!-- Step 1 -->
    <g transform="translate(0, 30)">
      <rect x="0" y="0" width="150" height="80" class="legend-box" />
      <text x="75" y="15" text-anchor="middle" class="label" font-weight="bold">Step 1: Initial Split</text>
      <text x="10" y="35" class="small-label">• Evaluate all features</text>
      <text x="10" y="50" class="small-label">• Find best split point</text>
      <text x="10" y="65" class="small-label">• Minimize RSS/Gini</text>
    </g>
    
    <!-- Arrow -->
    <line x1="160" y1="70" x2="200" y2="70" class="edge" />
    <polygon points="200,70 190,65 190,75" fill="#666" />
    
    <!-- Step 2 -->
    <g transform="translate(210, 30)">
      <rect x="0" y="0" width="150" height="80" class="legend-box" />
      <text x="75" y="15" text-anchor="middle" class="label" font-weight="bold">Step 2: Recursive Split</text>
      <text x="10" y="35" class="small-label">• Split each subset</text>
      <text x="10" y="50" class="small-label">• Continue until criteria</text>
      <text x="10" y="65" class="small-label">• Stop at pure nodes</text>
    </g>
    
    <!-- Arrow -->
    <line x1="370" y1="70" x2="410" y2="70" class="edge" />
    <polygon points="410,70 400,65 400,75" fill="#666" />
    
    <!-- Step 3 -->
    <g transform="translate(420, 30)">
      <rect x="0" y="0" width="150" height="80" class="legend-box" />
      <text x="75" y="15" text-anchor="middle" class="label" font-weight="bold">Step 3: Prediction</text>
      <text x="10" y="35" class="small-label">• Traverse tree path</text>
      <text x="10" y="50" class="small-label">• Reach leaf node</text>
      <text x="10" y="65" class="small-label">• Return prediction</text>
    </g>
  </g>
  
  <!-- Mathematical Foundation -->
  <g transform="translate(600, 400)">
    <rect x="0" y="0" width="250" height="120" class="legend-box" />
    <text x="125" y="20" text-anchor="middle" class="label" font-weight="bold">Split Selection Criteria</text>
    
    <text x="20" y="40" class="small-label" font-weight="bold">For Regression (RSS):</text>
    <text x="20" y="55" class="small-label">RSS = Σ(yᵢ - ŷᵢ)²</text>
    
    <text x="20" y="75" class="small-label" font-weight="bold">For Classification (Gini):</text>
    <text x="20" y="90" class="small-label">Gini = 1 - Σpₖ²</text>
    
    <text x="20" y="110" class="small-label">Choose split that minimizes impurity</text>
  </g>
  
  <!-- Legend -->
  <g transform="translate(50, 550)">
    <text x="0" y="0" class="subtitle">Node Types and Properties</text>
    
    <!-- Root node legend -->
    <circle cx="25" cy="25" r="15" class="root-node" />
    <text x="50" y="30" class="label"><tspan font-weight="bold">Root Node:</tspan> Starting point, contains all data</text>
    
    <!-- Internal node legend -->
    <ellipse cx="25" cy="55" rx="20" ry="12" class="internal-node" />
    <text x="50" y="60" class="label"><tspan font-weight="bold">Internal Node:</tspan> Decision point with splitting condition</text>
    
    <!-- Leaf node legend -->
    <rect x="10" y="75" width="30" height="15" class="leaf-node" rx="3" />
    <text x="50" y="85" class="label"><tspan font-weight="bold">Leaf Node:</tspan> Terminal node with final prediction</text>
    
    <!-- Advantages and Disadvantages -->
    <g transform="translate(400, 0)">
      <text x="0" y="0" class="label" font-weight="bold">Advantages:</text>
      <text x="0" y="15" class="small-label">• Easy to interpret and visualize</text>
      <text x="0" y="30" class="small-label">• Handles non-linear relationships</text>
      <text x="0" y="45" class="small-label">• No assumptions about data distribution</text>
      <text x="0" y="60" class="small-label">• Automatic feature selection</text>
      
      <text x="0" y="85" class="label" font-weight="bold">Disadvantages:</text>
      <text x="0" y="100" class="small-label">• Prone to overfitting</text>
      <text x="0" y="115" class="small-label">• Unstable (sensitive to data changes)</text>
    </g>
  </g>
</svg>