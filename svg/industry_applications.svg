<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="healthGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fd79a8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e84393;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="manufGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00cec9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00b894;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="financeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#74b9ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0984e3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="adGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fdcb6e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e17055;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="700" fill="#f8f9fa"/>
  
  <!-- Title -->
  <rect x="50" y="20" width="800" height="40" fill="url(#titleGrad)" rx="8"/>
  <text x="450" y="45" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold">
    Universal Framework: HIP Study Methodology Across Industries
  </text>
  
  <!-- Central Framework -->
  <ellipse cx="450" cy="130" rx="200" ry="50" fill="#fff3cd" stroke="#ffeaa7" stroke-width="3"/>
  <text x="450" y="120" text-anchor="middle" fill="#6c5700" font-family="Arial, sans-serif" font-size="14" font-weight="bold">
    Universal Question Format:
  </text>
  <text x="450" y="140" text-anchor="middle" fill="#6c5700" font-family="Arial, sans-serif" font-size="14" font-weight="bold">
    "Does X improve Y enough to matter?"
  </text>
  
  <!-- Connecting lines to industries -->
  <line x1="300" y1="180" x2="200" y2="230" stroke="#636e72" stroke-width="3"/>
  <line x1="400" y1="180" x2="350" y2="230" stroke="#636e72" stroke-width="3"/>
  <line x1="500" y1="180" x2="550" y2="230" stroke="#636e72" stroke-width="3"/>
  <line x1="600" y1="180" x2="700" y2="230" stroke="#636e72" stroke-width="3"/>
  
  <!-- Healthcare (Original HIP Study) -->
  <rect x="80" y="250" width="200" height="180" fill="url(#healthGrad)" rx="10"/>
  <text x="180" y="275" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">
    HEALTHCARE
  </text>
  <text x="180" y="295" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11" font-weight="bold">
    HIP Study (Original)
  </text>
  
  <text x="180" y="320" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11" font-weight="bold">
    Question:
  </text>
  <text x="180" y="335" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
    Does mammography reduce
  </text>
  <text x="180" y="350" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
    breast cancer deaths?
  </text>
  
  <text x="180" y="370" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11" font-weight="bold">
    Method:
  </text>
  <text x="180" y="385" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
    Control: Standard care
  </text>
  <text x="180" y="400" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
    Treatment: Mammography
  </text>
  <text x="180" y="415" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
    Outcome: Mortality rates
  </text>
  
  <!-- Manufacturing -->
  <rect x="310" y="250" width="200" height="180" fill="url(#manufGrad)" rx="10"/>
  <text x="410" y="275" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">
    MANUFACTURING
  </text>
  
  <text x="410" y="305" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11" font-weight="bold">
    Question:
  </text>
  <text x="410" y="320" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
    Does new process reduce
  </text>
  <text x="410" y="335" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
    defective products?
  </text>
  
  <text x="410" y="355" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11" font-weight="bold">
    Method:
  </text>
  <text x="410" y="370" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
    Control: Current process
  </text>
  <text x="410" y="385" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
    Treatment: New process
  </text>
  <text x="410" y="400" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
    Randomize: Production runs
  </text>
  <text x="410" y="415" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
    Outcome: Defect rates
  </text>
  
  <!-- Finance -->
  <rect x="540" y="250" width="200" height="180" fill="url(#financeGrad)" rx="10"/>
  <text x="640" y="275" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">
    FINANCE
  </text>
  
  <text x="640" y="305" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11" font-weight="bold">
    Question:
  </text>
  <text x="640" y="320" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
    Does new strategy
  </text>
  <text x="640" y="335" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
    enhance returns?
  </text>
  
  <text x="640" y="355" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11" font-weight="bold">
    Method:
  </text>
  <text x="640" y="370" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
    Control: Current portfolio
  </text>
  <text x="640" y="385" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
    Treatment: New strategy
  </text>
  <text x="640" y="400" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
    Randomize: Time periods
  </text>
  <text x="640" y="415" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
    Outcome: ROI metrics
  </text>
  
  <!-- Advertising -->
  <rect x="195" y="450" width="200" height="180" fill="url(#adGrad)" rx="10"/>
  <text x="295" y="475" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">
    ADVERTISING
  </text>
  
  <text x="295" y="505" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11" font-weight="bold">
    Question:
  </text>
  <text x="295" y="520" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
    Does new campaign
  </text>
  <text x="295" y="535" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
    increase sales?
  </text>
  
  <text x="295" y="555" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11" font-weight="bold">
    Method:
  </text>
  <text x="295" y="570" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
    Control: No ad/Current ad
  </text>
  <text x="295" y="585" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
    Treatment: New campaign
  </text>
  <text x="295" y="600" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
    Randomize: Geographic regions
  </text>
  <text x="295" y="615" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
    Outcome: Conversion rates
  </text>
  
  <!-- Statistical Framework -->
  <rect x="425" y="450" width="320" height="180" fill="#e8f4fd" stroke="#74b9ff" stroke-width="2" rx="10"/>
  <text x="585" y="475" text-anchor="middle" fill="#2d3436" font-family="Arial, sans-serif" font-size="14" font-weight="bold">
    Common Statistical Framework
  </text>
  
  <text x="445" y="500" fill="#2d3436" font-family="Arial, sans-serif" font-size="11" font-weight="bold">
    1. Randomized Assignment
  </text>
  <text x="455" y="515" fill="#2d3436" font-family="Arial, sans-serif" font-size="10">
    Eliminate confounding variables
  </text>
  
  <text x="445" y="535" fill="#2d3436" font-family="Arial, sans-serif" font-size="11" font-weight="bold">
    2. Control vs Treatment Groups
  </text>
  <text x="455" y="550" fill="#2d3436" font-family="Arial, sans-serif" font-size="10">
    Enable causal inference
  </text>
  
  <text x="445" y="570" fill="#2d3436" font-family="Arial, sans-serif" font-size="11" font-weight="bold">
    3. Hypothesis Testing
  </text>
  <text x="455" y="585" fill="#2d3436" font-family="Arial, sans-serif" font-size="10">
    H₀: No effect vs H₁: Significant effect
  </text>
  
  <text x="445" y="605" fill="#2d3436" font-family="Arial, sans-serif" font-size="11" font-weight="bold">
    4. P-value Analysis
  </text>
  <text x="455" y="620" fill="#2d3436" font-family="Arial, sans-serif" font-size="10">
    Quantify statistical significance
  </text>
  
  <!-- Bottom Key Insight -->
  <rect x="100" y="650" width="700" height="40" fill="#fff3cd" stroke="#ffeaa7" stroke-width="2" rx="8"/>
  <text x="450" y="675" text-anchor="middle" fill="#6c5700" font-family="Arial, sans-serif" font-size="14" font-weight="bold">
    Key Insight: Same methodology applies across all industries - only context and metrics change
  </text>
</svg>