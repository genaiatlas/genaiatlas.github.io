<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900">
  <defs>
    <linearGradient id="inputFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4285f4;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#1a73e8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="processingFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#34a853;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#137333;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="outputFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ea4335;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#d33b2c;stop-opacity:1" />
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="4" flood-color="rgba(0,0,0,0.2)"/>
    </filter>
    <pattern id="gridPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e0e0e0" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background with subtle grid -->
  <rect width="1400" height="900" fill="#f8f9fa"/>
  <rect width="1400" height="900" fill="url(#gridPattern)" opacity="0.5"/>

  <!-- Title -->
  <text x="700" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#202124">
    Complete Neural Network Workflow: Hierarchical Feature Learning
  </text>

  <!-- Input Stage -->
  <rect x="50" y="100" width="200" height="150" fill="url(#inputFlow)" stroke="#1565c0" stroke-width="3" rx="12" filter="url(#shadow)"/>
  <text x="150" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">
    INPUT STAGE
  </text>
  <text x="150" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">
    Raw Image Data
  </text>

  <!-- Sample car image representation -->
  <rect x="80" y="170" width="60" height="40" fill="none" stroke="white" stroke-width="2" rx="6"/>
  <circle cx="90" cy="220" r="8" fill="none" stroke="white" stroke-width="2"/>
  <circle cx="130" cy="220" r="8" fill="none" stroke="white" stroke-width="2"/>
  <rect x="90" y="175" width="15" height="10" fill="none" stroke="white" stroke-width="1"/>
  <rect x="115" y="175" width="15" height="10" fill="none" stroke="white" stroke-width="1"/>

  <text x="150" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white" font-weight="bold">
    28×28×3 pixels
  </text>

  <!-- Arrow 1 -->
  <path d="M 260 175 L 320 175" stroke="#5f6368" stroke-width="4" fill="none" marker-end="url(#arrowhead)"/>
  <text x="290" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5f6368" font-weight="bold">Forward Pass</text>

  <!-- Layer 1: Edge Detection -->
  <rect x="340" y="100" width="220" height="150" fill="url(#processingFlow)" stroke="#2e7d32" stroke-width="3" rx="12" filter="url(#shadow)"/>
  <text x="450" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">
    LAYER 1: EDGES
  </text>
  <text x="450" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">
    h¹ = σ(W¹x + b¹)
  </text>

  <!-- Edge detection neurons -->
  <g fill="white" stroke="white" stroke-width="2">
    <circle cx="380" cy="180" r="8"/>
    <text x="380" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#34a853">│</text>
    
    <circle cx="420" cy="180" r="8"/>
    <text x="420" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#34a853">─</text>
    
    <circle cx="460" cy="180" r="8"/>
    <text x="460" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#34a853">\</text>
    
    <circle cx="500" cy="180" r="8"/>
    <text x="500" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#34a853">○</text>
  </g>

  <text x="450" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
    512 edge detectors
  </text>
  <text x="450" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Horizontal | Vertical | Diagonal | Curved
  </text>

  <!-- Arrow 2 -->
  <path d="M 570 175 L 630 175" stroke="#5f6368" stroke-width="4" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Layer 2: Parts -->
  <rect x="650" y="100" width="220" height="150" fill="url(#processingFlow)" stroke="#2e7d32" stroke-width="3" rx="12" filter="url(#shadow)"/>
  <text x="760" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">
    LAYER 2: PARTS
  </text>
  <text x="760" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">
    h² = σ(W²h¹ + b²)
  </text>

  <!-- Part detection representations -->
  <g fill="none" stroke="white" stroke-width="2">
    <circle cx="690" cy="185" r="12"/>
    <circle cx="690" cy="185" r="7"/>
    <text x="690" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Wheel</text>
    
    <rect x="720" y="175" width="25" height="15" rx="4"/>
    <text x="732" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Body</text>
    
    <rect x="760" y="180" width="15" height="10" rx="2"/>
    <text x="767" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Window</text>
    
    <ellipse cx="810" cy="185" rx="12" ry="8"/>
    <text x="810" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Light</text>
  </g>

  <text x="760" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
    256 part detectors
  </text>

  <!-- Arrow 3 -->
  <path d="M 880 175 L 940 175" stroke="#5f6368" stroke-width="4" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Layer 3: Objects -->
  <rect x="960" y="100" width="200" height="150" fill="url(#outputFlow)" stroke="#c62828" stroke-width="3" rx="12" filter="url(#shadow)"/>
  <text x="1060" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">
    LAYER 3: OBJECTS
  </text>
  <text x="1060" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">
    h³ = σ(W³h² + b³)
  </text>

  <!-- Complete car representation -->
  <g fill="none" stroke="white" stroke-width="2">
    <rect x="1030" y="170" width="40" height="25" rx="6"/>
    <circle cx="1040" cy="200" r="6"/>
    <circle cx="1060" cy="200" r="6"/>
    <rect x="1035" y="175" width="8" height="6" rx="1"/>
    <rect x="1047" y="175" width="8" height="6" rx="1"/>
    <ellipse cx="1075" cy="180" rx="5" ry="6"/>
  </g>

  <text x="1060" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white" font-weight="bold">
    Complete Car
  </text>

  <!-- Arrow 4 -->
  <path d="M 1170 175 L 1220 175" stroke="#5f6368" stroke-width="4" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Output Classification -->
  <rect x="1240" y="100" width="120" height="150" fill="url(#outputFlow)" stroke="#c62828" stroke-width="3" rx="12" filter="url(#shadow)"/>
  <text x="1300" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
    OUTPUT
  </text>
  <text x="1300" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">
    Classification
  </text>

  <!-- Classification scores -->
  <rect x="1255" y="170" width="90" height="60" fill="rgba(255,255,255,0.2)" rx="5"/>
  <text x="1300" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white" font-weight="bold">Car: 92%</text>
  <text x="1300" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Truck: 5%</text>
  <text x="1300" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Bike: 2%</text>
  <text x="1300" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Other: 1%</text>

  <!-- Mathematical Detail Section -->
  <rect x="50" y="300" width="1300" height="200" fill="#ffffff" stroke="#dadce0" stroke-width="2" rx="15" filter="url(#shadow)"/>
  <text x="700" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#202124">
    Mathematical Foundation of Hierarchical Learning
  </text>

  <!-- Forward propagation equations -->
  <text x="200" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1976d2">
    Forward Propagation
  </text>

  <g font-family="Arial, sans-serif" font-size="14" fill="#202124">
    <text x="100" y="400">Layer 1 (Edges):</text>
    <text x="100" y="420" font-weight="bold" fill="#4285f4">z¹ = W¹ · x + b¹</text>
    <text x="100" y="440" font-weight="bold" fill="#4285f4">h¹ = σ(z¹)</text>
    
    <text x="100" y="470">Layer 2 (Parts):</text>
    <text x="100" y="490" font-weight="bold" fill="#34a853">z² = W² · h¹ + b²</text>
    
    <text x="320" y="400">Layer 3 (Objects):</text>
    <text x="320" y="420" font-weight="bold" fill="#ea4335">z³ = W³ · h² + b³</text>
    <text x="320" y="440" font-weight="bold" fill="#ea4335">h³ = σ(z³)</text>
    
    <text x="320" y="470">Output:</text>
    <text x="320" y="490" font-weight="bold" fill="#f57c00">ŷ = softmax(h³)</text>
  </g>

  <!-- Ensemble learning explanation -->
  <rect x="550" y="350" width="300" height="130" fill="#e8f5e8" stroke="#4caf50" stroke-width="2" rx="8"/>
  <text x="700" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2e7d32">
    Ensemble Decision Making
  </text>
  
  <text x="700" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#2e7d32">
    Decision = Weighted_Vote(Neuron₁, Neuron₂, ..., Neuronₙ)
  </text>
  
  <text x="700" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5f6368">
    • Each neuron acts as a simple linear classifier
  </text>
  <text x="700" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5f6368">
    • Multiple neurons vote on complex decisions
  </text>
  <text x="700" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5f6368">
    • Ensemble creates robust, accurate predictions
  </text>
  <text x="700" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5f6368">
    • Non-linear combinations solve complex problems
  </text>

  <!-- Activation functions -->
  <rect x="900" y="350" width="400" height="130" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="8"/>
  <text x="1100" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#e65100">
    Common Activation Functions
  </text>
  
  <g font-family="Arial, sans-serif" font-size="12" fill="#e65100">
    <text x="920" y="400">ReLU: f(x) = max(0, x)</text>
    <text x="920" y="420">Sigmoid: f(x) = 1/(1 + e⁻ˣ)</text>
    <text x="920" y="440">Tanh: f(x) = (eˣ - e⁻ˣ)/(eˣ + e⁻ˣ)</text>
    <text x="920" y="460">Softmax: f(xᵢ) = eˣⁱ/Σⱼeˣʲ</text>
    
    <text x="1150" y="400">• Introduces non-linearity</text>
    <text x="1150" y="420">• Enables complex boundaries</text>
    <text x="1150" y="440">• Controls information flow</text>
    <text x="1150" y="460">• Probabilistic outputs</text>
  </g>

  <!-- Learning Process Section -->
  <rect x="50" y="530" width="1300" height="320" fill="#f1f3f4" stroke="#dadce0" stroke-width="2" rx="15" filter="url(#shadow)"/>
  <text x="700" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#202124">
    Training Process: Learning Hierarchical Representations
  </text>

  <!-- Training steps -->
  <rect x="100" y="580" width="250" height="120" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="8"/>
  <text x="225" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1976d2">
    1. Forward Pass
  </text>
  <text x="225" y="625" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5f6368">
    • Input flows through network
  </text>
  <text x="225" y="640" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5f6368">
    • Each layer transforms features
  </text>
  <text x="225" y="655" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5f6368">
    • Produces prediction
  </text>
  <text x="225" y="670" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5f6368">
    • Calculate loss: L = -log(p_true)
  </text>
  <text x="225" y="685" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5f6368">
    • Compare to ground truth
  </text>

  <!-- Arrow -->
  <path d="M 360 640 L 400 640" stroke="#5f6368" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>

  <rect x="420" y="580" width="250" height="120" fill="#e8f5e8" stroke="#4caf50" stroke-width="2" rx="8"/>
  <text x="545" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2e7d32">
    2. Backpropagation
  </text>
  <text x="545" y="625" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5f6368">
    • Compute gradients backwards
  </text>
  <text x="545" y="640" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5f6368">
    • ∂L/∂W = ∂L/∂z · ∂z/∂W
  </text>
  <text x="545" y="655" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5f6368">
    • Chain rule through layers
  </text>
  <text x="545" y="670" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5f6368">
    • Error signal propagates
  </text>
  <text x="545" y="685" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5f6368">
    • Updates all parameters
  </text>

  <!-- Arrow -->
  <path d="M 680 640 L 720 640" stroke="#5f6368" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>

  <rect x="740" y="580" width="250" height="120" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="8"/>
  <text x="865" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#e65100">
    3. Parameter Update
  </text>
  <text x="865" y="625" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5f6368">
    • W ← W - α∇W
  </text>
  <text x="865" y="640" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5f6368">
    • Gradient descent optimization
  </text>
  <text x="865" y="655" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5f6368">
    • Learning rate α controls step size
  </text>
  <text x="865" y="670" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5f6368">
    • Weights adapted to reduce error
  </text>
  <text x="865" y="685" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5f6368">
    • Features become specialized
  </text>

  <!-- Arrow -->
  <path d="M 1000 640 L 1040 640" stroke="#5f6368" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>

  <rect x="1060" y="580" width="250" height="120" fill="#fce4ec" stroke="#e91e63" stroke-width="2" rx="8"/>
  <text x="1185" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#c2185b">
    4. Iteration
  </text>
  <text x="1185" y="625" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5f6368">
    • Repeat for many epochs
  </text>
  <text x="1185" y="640" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5f6368">
    • Network learns incrementally
  </text>
  <text x="1185" y="655" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5f6368">
    • Hierarchical features emerge
  </text>
  <text x="1185" y="670" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5f6368">
    • Convergence to solution
  </text>
  <text x="1185" y="685" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5f6368">
    • Generalizes to new data
  </text>

  <!-- Key insights -->
  <rect x="100" y="730" width="1200" height="100" fill="#ffffff" stroke="#4caf50" stroke-width="3" rx="12" filter="url(#shadow)"/>
  <text x="700" y="760" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2e7d32">
    🔑 Key Insights: Why Hierarchical Representations Work
  </text>
  
  <g font-family="Arial, sans-serif" font-size="14" fill="#5f6368">
    <text x="200" y="785">• <tspan font-weight="bold" fill="#1976d2">Compositionality:</tspan> Complex features built from simple ones</text>
    <text x="200" y="805">• <tspan font-weight="bold" fill="#2e7d32">Reusability:</tspan> Lower-level features shared across tasks</text>
    
    <text x="700" y="785">• <tspan font-weight="bold" fill="#e65100">Abstraction:</tspan> Each layer removes irrelevant details</text>
    <text x="700" y="805">• <tspan font-weight="bold" fill="#c2185b">Specialization:</tspan> Neurons become domain experts</text>
  </g>

  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <polygon points="0 0, 12 4.5, 0 9" fill="#5f6368" />
    </marker>
  </defs>
</svg>