<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title-text { font-family: 'Arial', sans-serif; font-size: 24px; font-weight: bold; fill: #2c3e50; }
      .subtitle-text { font-family: 'Arial', sans-serif; font-size: 18px; font-weight: bold; fill: #34495e; }
      .label-text { font-family: 'Arial', sans-serif; font-size: 14px; fill: #34495e; }
      .small-text { font-family: 'Arial', sans-serif; font-size: 12px; fill: #7f8c8d; }
      .equation-text { font-family: 'Times New Roman', serif; font-size: 16px; fill: #2c3e50; }
      .question-box { fill: #fff3cd; stroke: #ffc107; stroke-width: 2; rx: 10; }
      .concept-box { fill: #e3f2fd; stroke: #2196f3; stroke-width: 2; rx: 10; }
      .method-box { fill: #e8f5e8; stroke: #28a745; stroke-width: 2; rx: 10; }
      .result-box { fill: #f8f9fa; stroke: #6c757d; stroke-width: 1; rx: 5; }
      .arrow { stroke: #6c757d; stroke-width: 2; fill: #6c757d; }
    </style>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title-text">Coefficient Reliability Assessment Framework</text>
  
  <!-- Central Question -->
  <g transform="translate(200, 70)">
    <rect x="0" y="0" width="400" height="80" class="question-box"/>
    <text x="200" y="30" text-anchor="middle" class="subtitle-text" fill="#856404">Central Question</text>
    <text x="200" y="55" text-anchor="middle" class="label-text" fill="#856404">How noisy/reliable are my estimates of θ*?</text>
    <text x="200" y="75" text-anchor="middle" class="small-text">Only meaningful if true θ* exists to estimate</text>
  </g>
  
  <!-- Key Concepts -->
  <g transform="translate(50, 180)">
    <!-- Sample Variability -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="220" height="120" class="concept-box"/>
      <text x="110" y="25" text-anchor="middle" class="subtitle-text" fill="#1976d2">Sample Variability</text>
      <text x="20" y="50" class="small-text">Different samples →</text>
      <text x="20" y="65" class="small-text">Different θ̂ estimates</text>
      <text x="20" y="85" class="equation-text">θ̂ = (X^T X)^{-1} X^T Y</text>
      <text x="20" y="105" class="small-text">Y contains noise → θ̂ is random</text>
    </g>
    
    <!-- Bias-Variance -->
    <g transform="translate(290, 0)">
      <rect x="0" y="0" width="220" height="120" class="concept-box"/>
      <text x="110" y="25" text-anchor="middle" class="subtitle-text" fill="#1976d2">Bias-Variance Trade-off</text>
      <text x="20" y="50" class="equation-text">MSE = Bias² + Variance</text>
      <text x="20" y="75" class="small-text">Linear regression: Unbiased</text>
      <text x="20" y="90" class="small-text">Focus on Var(θ̂ⱼ)</text>
      <text x="20" y="105" class="small-text">Smaller variance = more reliable</text>
    </g>
    
    <!-- Normal Distribution -->
    <g transform="translate(580, 0)">
      <rect x="0" y="0" width="170" height="120" class="concept-box"/>
      <text x="85" y="25" text-anchor="middle" class="subtitle-text" fill="#1976d2">Normal Distribution</text>
      <text x="20" y="50" class="equation-text">θ̂ⱼ ~ N(θ*ⱼ, σ²ⱼ)</text>
      <text x="20" y="75" class="small-text">Central Limit Theorem</text>
      <text x="20" y="90" class="small-text">Enables confidence intervals</text>
      <text x="20" y="105" class="small-text">and hypothesis testing</text>
    </g>
  </g>
  
  <!-- Arrows from central question -->
  <g transform="translate(400, 150)">
    <!-- Left arrow -->
    <path d="M -240 0 L -220 20 L -225 15 M -220 20 L -215 15" class="arrow"/>
    <!-- Center arrow -->
    <path d="M 0 0 L 0 20 L -5 15 M 0 20 L 5 15" class="arrow"/>
    <!-- Right arrow -->
    <path d="M 240 0 L 220 20 L 225 15 M 220 20 L 215 15" class="arrow"/>
  </g>
  
  <!-- Methods and Applications -->
  <g transform="translate(50, 340)">
    <text x="350" y="0" text-anchor="middle" class="subtitle-text">Assessment Methods</text>
    
    <!-- Standard Error -->
    <g transform="translate(0, 30)">
      <rect x="0" y="0" width="160" height="120" class="method-box"/>
      <text x="80" y="25" text-anchor="middle" class="label-text" fill="#155724">Standard Error</text>
      <text x="80" y="50" text-anchor="middle" class="equation-text">se(θ̂ⱼ) = √Var(θ̂ⱼ)</text>
      <text x="20" y="75" class="small-text">• Measures precision</text>
      <text x="20" y="90" class="small-text">• Foundation for CI</text>
      <text x="20" y="105" class="small-text">• Hypothesis testing</text>
    </g>
    
    <!-- Confidence Intervals -->
    <g transform="translate(180, 30)">
      <rect x="0" y="0" width="160" height="120" class="method-box"/>
      <text x="80" y="25" text-anchor="middle" class="label-text" fill="#155724">Confidence Intervals</text>
      <text x="80" y="50" text-anchor="middle" class="equation-text">θ̂ⱼ ± 1.96 × se(θ̂ⱼ)</text>
      <text x="20" y="75" class="small-text">• 95% coverage</text>
      <text x="20" y="90" class="small-text">• Uncertainty bounds</text>
      <text x="20" y="105" class="small-text">• Parameter inference</text>
    </g>
    
    <!-- Hypothesis Testing -->
    <g transform="translate(360, 30)">
      <rect x="0" y="0" width="160" height="120" class="method-box"/>
      <text x="80" y="25" text-anchor="middle" class="label-text" fill="#155724">Hypothesis Testing</text>
      <text x="80" y="50" text-anchor="middle" class="equation-text">t = θ̂ⱼ / se(θ̂ⱼ)</text>
      <text x="20" y="75" class="small-text">• Significance testing</text>
      <text x="20" y="90" class="small-text">• p-values</text>
      <text x="20" y="105" class="small-text">• Effect assessment</text>
    </g>
    
    <!-- Bootstrap Methods -->
    <g transform="translate(540, 30)">
      <rect x="0" y="0" width="160" height="120" class="method-box"/>
      <text x="80" y="25" text-anchor="middle" class="label-text" fill="#155724">Bootstrap Methods</text>
      <text x="80" y="50" text-anchor="middle" class="equation-text">Resampling</text>
      <text x="20" y="75" class="small-text">• Non-parametric</text>
      <text x="20" y="90" class="small-text">• Robust to assumptions</text>
      <text x="20" y="105" class="small-text">• Empirical distribution</text>
    </g>
  </g>
  
  <!-- Key Insights -->
  <g transform="translate(50, 520)">
    <rect x="0" y="0" width="700" height="60" class="result-box"/>
    <text x="350" y="25" text-anchor="middle" class="subtitle-text">Key Insights</text>
    <text x="50" y="45" class="small-text">✓ Coefficient estimates are random variables with known distributions</text>
    <text x="450" y="45" class="small-text">✓ Standard errors quantify estimation uncertainty</text>
    <text x="50" y="55" class="small-text">✓ Normal distribution enables precise statistical inference</text>
    <text x="450" y="55" class="small-text">✓ Reliability assessment guides model interpretation</text>
  </g>
</svg>