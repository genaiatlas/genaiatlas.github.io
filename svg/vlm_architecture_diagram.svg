<svg viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="800" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="500" y="35" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    VLM Architecture (Vision-Language Model)
  </text>
  
  <text x="500" y="60" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d" font-style="italic">
    Multimodal Understanding: Vision + Language
  </text>
  
  <!-- Inputs -->
  <g transform="translate(100, 100)">
    <!-- Visual Input -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="200" height="150" fill="#3498db" stroke="#2980b9" stroke-width="2" rx="5"/>
      <text x="100" y="25" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">
        Visual Input
      </text>
      <!-- Image representation -->
      <rect x="30" y="40" width="140" height="90" fill="#2980b9" rx="3"/>
      <circle cx="70" cy="70" r="15" fill="#f39c12"/>
      <rect x="90" y="85" width="50" height="30" fill="#27ae60" rx="2"/>
      <text x="100" y="142" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
        Images/Video
      </text>
    </g>
    
    <!-- Text Input -->
    <g transform="translate(600, 0)">
      <rect x="0" y="0" width="200" height="150" fill="#e74c3c" stroke="#c0392b" stroke-width="2" rx="5"/>
      <text x="100" y="25" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">
        Language Input
      </text>
      <text x="100" y="70" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
        "What objects"
      </text>
      <text x="100" y="90" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
        "are in this"
      </text>
      <text x="100" y="110" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
        "image?"
      </text>
      <text x="100" y="142" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
        Text/Instructions
      </text>
    </g>
  </g>
  
  <!-- Arrows down -->
  <line x1="200" y1="250" x2="200" y2="300" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="800" y1="250" x2="800" y2="300" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Encoders -->
  <g transform="translate(100, 300)">
    <!-- Vision Encoder -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="200" height="100" fill="#5dade2" stroke="#3498db" stroke-width="2" rx="5"/>
      <text x="100" y="25" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">
        Vision Encoder
      </text>
      <text x="100" y="45" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
        Vision Transformer (ViT)
      </text>
      <text x="100" y="65" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">
        Patch embeddings
      </text>
      <text x="100" y="80" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">
        fᵥ(v) → visual features
      </text>
    </g>
    
    <!-- Language Encoder -->
    <g transform="translate(600, 0)">
      <rect x="0" y="0" width="200" height="100" fill="#ec7063" stroke="#e74c3c" stroke-width="2" rx="5"/>
      <text x="100" y="25" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">
        Language Encoder
      </text>
      <text x="100" y="45" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
        Text Transformer
      </text>
      <text x="100" y="65" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">
        Token embeddings
      </text>
      <text x="100" y="80" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">
        fₜ(t) → text features
      </text>
    </g>
  </g>
  
  <!-- Arrows to fusion -->
  <line x1="200" y1="400" x2="400" y2="480" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="800" y1="400" x2="600" y2="480" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Cross-Modal Attention/Fusion -->
  <g transform="translate(300, 480)">
    <rect x="0" y="0" width="400" height="110" fill="#9b59b6" stroke="#8e44ad" stroke-width="3" rx="8"/>
    <text x="200" y="25" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">
      Cross-Modal Attention &amp; Fusion
    </text>
    <text x="200" y="50" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
      Align visual and textual representations
    </text>
    <text x="200" y="72" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
      Similarity(v,t) = (fᵥ(v) · fₜ(t)) / (||fᵥ(v)|| · ||fₜ(t)||)
    </text>
    <text x="200" y="95" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">
      Multimodal feature integration
    </text>
  </g>
  
  <line x1="500" y1="590" x2="500" y2="630" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Output -->
  <g transform="translate(300, 630)">
    <rect x="0" y="0" width="400" height="60" fill="#27ae60" stroke="#229954" stroke-width="2" rx="5"/>
    <text x="200" y="25" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">
      Unified Multimodal Understanding
    </text>
    <text x="200" y="45" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
      Visual QA | Image Captioning | Scene Understanding
    </text>
  </g>
  
  <!-- Capabilities Panel -->
  <g transform="translate(50, 720)">
    <rect x="0" y="0" width="900" height="60" fill="#fff3cd" stroke="#f39c12" stroke-width="2" rx="5"/>
    <text x="450" y="20" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#856404">
      💡 Key Capabilities
    </text>
    <text x="450" y="38" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">
      🤖 Robotics Navigation | 🚗 Autonomous Vehicles | 🏥 Medical Imaging | 🎨 Content Moderation
    </text>
    <text x="450" y="52" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">
      👁️ Object Detection | 💬 Visual Q&amp;A | 📝 Image Captioning | 🧭 Visual Instruction Following
    </text>
  </g>
  
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#34495e"/>
    </marker>
  </defs>
</svg>