<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradVision" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradLanguage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradFusion" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6D28D9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradCrossModal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#DC2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B91C1C;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="4" flood-color="#00000025"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#fafafa"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="bold" fill="#111827">Vision-Language Model (VLM)</text>
  <text x="400" y="60" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#6b7280">Multimodal Understanding &amp; Generation</text>
  
  <!-- Dual Input Layer -->
  <g id="dual-inputs">
    <rect x="150" y="520" width="180" height="50" fill="#dbeafe" stroke="#2563EB" stroke-width="2" rx="12" filter="url(#shadow)"/>
    <text x="240" y="540" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#1e40af">👁️ Visual Input</text>
    <text x="240" y="555" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#3730a3">Images • Video • Scenes</text>
    
    <rect x="470" y="520" width="180" height="50" fill="#d1fae5" stroke="#059669" stroke-width="2" rx="12" filter="url(#shadow)"/>
    <text x="560" y="540" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#065f46">💬 Text Input</text>
    <text x="560" y="555" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#064e3b">Questions • Instructions</text>
  </g>
  
  <!-- Encoder Layer -->
  <g id="encoders">
    <rect x="150" y="420" width="180" height="80" fill="url(#gradVision)" stroke="#1D4ED8" stroke-width="2" rx="12" filter="url(#shadow)"/>
    <text x="240" y="445" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="bold" fill="white">Vision Encoder</text>
    <text x="240" y="465" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#dbeafe">Vision Transformer (ViT)</text>
    <text x="240" y="485" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" fill="#bfdbfe">Patch → Embedding → Features</text>
    
    <rect x="470" y="420" width="180" height="80" fill="url(#gradLanguage)" stroke="#047857" stroke-width="2" rx="12" filter="url(#shadow)"/>
    <text x="560" y="445" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="bold" fill="white">Language Encoder</text>
    <text x="560" y="465" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#d1fae5">Transformer Architecture</text>
    <text x="560" y="485" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" fill="#a7f3d0">Token → Embedding → Features</text>
  </g>
  
  <!-- Cross-Modal Attention (Center) -->
  <rect x="300" y="300" width="200" height="100" fill="url(#gradCrossModal)" stroke="#B91C1C" stroke-width="3" rx="15" filter="url(#shadow)"/>
  <text x="400" y="330" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold" fill="white">Cross-Modal</text>
  <text x="400" y="350" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold" fill="white">Attention</text>
  <text x="400" y="375" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#fecaca">Vision ↔ Language Alignment</text>
  <text x="400" y="390" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#fecaca">Feature Correspondence</text>
  
  <!-- Multimodal Fusion -->
  <rect x="300" y="180" width="200" height="100" fill="url(#gradFusion)" stroke="#6D28D9" stroke-width="3" rx="15" filter="url(#shadow)"/>
  <text x="400" y="210" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="bold" fill="white">Multimodal Fusion</text>
  <text x="400" y="235" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#e9d5ff">Joint Representation</text>
  <text x="400" y="255" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#e9d5ff">Unified Understanding</text>
  <text x="400" y="270" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" fill="#ddd6fe">Feature Integration Layer</text>
  
  <!-- Output -->
  <rect x="275" y="80" width="250" height="80" fill="#ecfdf5" stroke="#059669" stroke-width="3" rx="15" filter="url(#shadow)"/>
  <text x="400" y="110" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="bold" fill="#047857">🎯 Multimodal Output</text>
  <text x="400" y="135" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#065f46">Image Captions • Visual Q&amp;A</text>
  <text x="400" y="150" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#065f46">Scene Analysis • Action Plans</text>
  
  <!-- Side Information Boxes -->
  <g id="side-info">
    <!-- Similarity Formula -->
    <rect x="50" y="250" width="200" height="90" fill="#f0f9ff" stroke="#0284c7" stroke-width="2" rx="10" opacity="0.95"/>
    <text x="150" y="275" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0c4a6e">📐 Similarity Metric</text>
    <text x="150" y="295" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#0369a1">sim(v,t) = </text>
    <text x="150" y="310" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#0369a1">f_v(v) · f_t(t)</text>
    <text x="150" y="325" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#0369a1">||f_v(v)|| ||f_t(t)||</text>
    
    <!-- Applications -->
    <rect x="550" y="200" width="200" height="180" fill="#fffbeb" stroke="#d97706" stroke-width="2" rx="10" opacity="0.95"/>
    <text x="650" y="225" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="bold" fill="#92400e">🚀 Applications</text>
    
    <text x="570" y="250" font-family="Inter, Arial, sans-serif" font-size="12" fill="#78350f">🖼️ Image Captioning</text>
    <text x="570" y="268" font-family="Inter, Arial, sans-serif" font-size="12" fill="#78350f">❓ Visual Q&amp;A</text>
    <text x="570" y="286" font-family="Inter, Arial, sans-serif" font-size="12" fill="#78350f">🎯 Object Detection</text>
    <text x="570" y="304" font-family="Inter, Arial, sans-serif" font-size="12" fill="#78350f">🌍 Scene Understanding</text>
    <text x="570" y="322" font-family="Inter, Arial, sans-serif" font-size="12" fill="#78350f">🤖 Robot Navigation</text>
    <text x="570" y="340" font-family="Inter, Arial, sans-serif" font-size="12" fill="#78350f">🏥 Medical Imaging</text>
    <text x="570" y="358" font-family="Inter, Arial, sans-serif" font-size="12" fill="#78350f">🚗 Autonomous Driving</text>
  </g>
  
  <!-- Patch Visualization -->
  <g id="patch-demo">
    <text x="370" y="445" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6b7280">Image Patches:</text>
    <rect x="370" y="450" width="12" height="12" fill="#fbbf24" stroke="#f59e0b" stroke-width="1" rx="1"/>
    <rect x="384" y="450" width="12" height="12" fill="#fbbf24" stroke="#f59e0b" stroke-width="1" rx="1"/>
    <rect x="398" y="450" width="12" height="12" fill="#fbbf24" stroke="#f59e0b" stroke-width="1" rx="1"/>
    <rect x="370" y="464" width="12" height="12" fill="#fbbf24" stroke="#f59e0b" stroke-width="1" rx="1"/>
    <rect x="384" y="464" width="12" height="12" fill="#fbbf24" stroke="#f59e0b" stroke-width="1" rx="1"/>
    <rect x="398" y="464" width="12" height="12" fill="#fbbf24" stroke="#f59e0b" stroke-width="1" rx="1"/>
  </g>
  
  <!-- Clean Flow Arrows -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#374151"/>
    </marker>
  </defs>
  
  <!-- Main vertical flow -->
  <path d="M 240 520 L 240 500" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 560 520 L 560 500" stroke="#059669" stroke-width="3" marker-end="url(#arrow)"/>
  
  <path d="M 240 420 L 320 400" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 560 420 L 480 400" stroke="#059669" stroke-width="3" marker-end="url(#arrow)"/>
  
  <path d="M 400 300 L 400 280" stroke="#374151" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 400 180 L 400 160" stroke="#374151" stroke-width="4" marker-end="url(#arrow)"/>
  
  <!-- Flow Stage Labels -->
  <text x="100" y="540" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#6b7280">1. Input</text>
  <text x="100" y="460" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#6b7280">2. Encode</text>
  <text x="100" y="350" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#6b7280">3. Align</text>
  <text x="100" y="230" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#6b7280">4. Fuse</text>
  <text x="100" y="120" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#6b7280">5. Output</text>
</svg>