<svg width="900" height="750" viewBox="0 0 900 750" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'Arial', sans-serif; font-size: 24px; font-weight: bold; fill: #1a365d; }
      .subtitle { font-family: 'Arial', sans-serif; font-size: 18px; fill: #2d3748; font-weight: bold; }
      .section-title { font-family: 'Arial', sans-serif; font-size: 14px; fill: #2d3748; font-weight: bold; }
      .description { font-family: 'Arial', sans-serif; font-size: 12px; fill: #4a5568; }
      .table-header { font-family: 'Arial', sans-serif; font-size: 13px; fill: #1a365d; font-weight: bold; }
      .table-cell { font-family: 'Arial', sans-serif; font-size: 11px; fill: #4a5568; }
      .method-name { font-family: 'Arial', sans-serif; font-size: 14px; fill: #1a365d; font-weight: bold; }
      .box { fill: #f7fafc; stroke: #e2e8f0; stroke-width: 2; rx: 10; }
      .simple-box { fill: #fed7d7; stroke: #e53e3e; stroke-width: 2; rx: 10; }
      .loocv-box { fill: #bee3f8; stroke: #3182ce; stroke-width: 2; rx: 10; }
      .kfold-box { fill: #c6f6d5; stroke: #38a169; stroke-width: 2; rx: 10; }
      .excellent { fill: #38a169; color: white; }
      .good { fill: #d69e2e; }
      .poor { fill: #e53e3e; color: white; }
      .comparison-box { fill: #faf5ff; stroke: #805ad5; stroke-width: 2; rx: 10; }
      .recommendation-box { fill: #fffbeb; stroke: #d69e2e; stroke-width: 2; rx: 10; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="750" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" class="title">Cross-Validation Methods Comparison</text>
  
  <!-- Method Overview -->
  <text x="50" y="65" class="subtitle">CV Method Characteristics</text>
  
  <!-- Simple Validation -->
  <rect x="50" y="80" width="250" height="140" class="simple-box"/>
  <text x="175" y="105" text-anchor="middle" class="section-title" fill="#c53030">Simple Train-Test Split</text>
  
  <text x="70" y="125" class="description">• Single random split (e.g., 80/20)</text>
  <text x="70" y="142" class="description">• Only 1 model fit required</text>
  <text x="70" y="159" class="description">• Fast computation</text>
  <text x="70" y="176" class="description">• High variance in estimates</text>
  <text x="70" y="193" class="description">• Results depend on split choice</text>
  <text x="70" y="210" class="description">• Risk of overfitting assessment</text>
  
  <!-- LOOCV -->
  <rect x="325" y="80" width="250" height="140" class="loocv-box"/>
  <text x="450" y="105" text-anchor="middle" class="section-title" fill="#2b6cb0">Leave-One-Out CV (LOOCV)</text>
  
  <text x="345" y="125" class="description">• n model fits (computationally expensive)</text>
  <text x="345" y="142" class="description">• Maximum training data usage</text>
  <text x="345" y="159" class="description">• Deterministic, reproducible results</text>
  <text x="345" y="176" class="description">• High correlation between errors</text>
  <text x="345" y="193" class="description">• Ideal for very small datasets</text>
  <text x="345" y="210" class="description">• Nearly unbiased estimator</text>
  
  <!-- K-Fold CV -->
  <rect x="600" y="80" width="250" height="140" class="kfold-box"/>
  <text x="725" y="105" text-anchor="middle" class="section-title" fill="#2f855a">K-Fold Cross-Validation</text>
  
  <text x="620" y="125" class="description">• K model fits (moderate cost)</text>
  <text x="620" y="142" class="description">• Good training data efficiency</text>
  <text x="620" y="159" class="description">• Lower error correlation than LOOCV</text>
  <text x="620" y="176" class="description">• Balanced bias-variance tradeoff</text>
  <text x="620" y="193" class="description">• Most practical general choice</text>
  <text x="620" y="210" class="description">• Standard: K = 5 or 10</text>
  
  <!-- Detailed Comparison Table -->
  <rect x="50" y="240" width="800" height="320" class="comparison-box"/>
  <text x="450" y="265" text-anchor="middle" class="subtitle" fill="#553c9a">Detailed Comparison Matrix</text>
  
  <!-- Table headers -->
  <rect x="70" y="275" width="140" height="25" fill="#e2e8f0" stroke="#a0aec0"/>
  <text x="140" y="292" text-anchor="middle" class="table-header">Evaluation Aspect</text>
  
  <rect x="210" y="275" width="140" height="25" fill="#fed7d7" stroke="#e53e3e"/>
  <text x="280" y="292" text-anchor="middle" class="table-header">Simple Split</text>
  
  <rect x="350" y="275" width="140" height="25" fill="#bee3f8" stroke="#3182ce"/>
  <text x="420" y="292" text-anchor="middle" class="table-header">LOOCV</text>
  
  <rect x="490" y="275" width="140" height="25" fill="#c6f6d5" stroke="#38a169"/>
  <text x="560" y="292" text-anchor="middle" class="table-header">K-Fold CV</text>
  
  <rect x="630" y="275" width="140" height="25" fill="#d6f5d6" stroke="#38a169"/>
  <text x="700" y="292" text-anchor="middle" class="table-header">Stratified K-Fold</text>
  
  <!-- Table rows -->
  <!-- Row 1: Training Data Usage -->
  <rect x="70" y="300" width="140" height="20" fill="#f7fafc" stroke="#e2e8f0"/>
  <text x="75" y="313" class="table-cell" font-weight="bold">Training Data Usage</text>
  <rect x="210" y="300" width="140" height="20" fill="#ffe5e5" stroke="#e2e8f0"/>
  <text x="280" y="313" text-anchor="middle" class="table-cell">60-80%</text>
  <rect x="350" y="300" width="140" height="20" fill="#e8f4f8" stroke="#e2e8f0"/>
  <text x="420" y="313" text-anchor="middle" class="table-cell" fill="#38a169" font-weight="bold">(n-1)/n ≈ 100%</text>
  <rect x="490" y="300" width="140" height="20" fill="#f0f8f0" stroke="#e2e8f0"/>
  <text x="560" y="313" text-anchor="middle" class="table-cell" fill="#d69e2e" font-weight="bold">(K-1)/K</text>
  <rect x="630" y="300" width="140" height="20" fill="#f0f8f0" stroke="#e2e8f0"/>
  <text x="700" y="313" text-anchor="middle" class="table-cell" fill="#d69e2e" font-weight="bold">(K-1)/K</text>
  
  <!-- Row 2: Number of Models -->
  <rect x="70" y="320" width="140" height="20" fill="#f7fafc" stroke="#e2e8f0"/>
  <text x="75" y="333" class="table-cell" font-weight="bold">Model Fits Required</text>
  <rect x="210" y="320" width="140" height="20" fill="#ffe5e5" stroke="#e2e8f0"/>
  <text x="280" y="333" text-anchor="middle" class="table-cell" fill="#38a169" font-weight="bold">1</text>
  <rect x="350" y="320" width="140" height="20" fill="#e8f4f8" stroke="#e2e8f0"/>
  <text x="420" y="333" text-anchor="middle" class="table-cell" fill="#e53e3e" font-weight="bold">n</text>
  <rect x="490" y="320" width="140" height="20" fill="#f0f8f0" stroke="#e2e8f0"/>
  <text x="560" y="333" text-anchor="middle" class="table-cell" fill="#d69e2e" font-weight="bold">K</text>
  <rect x="630" y="320" width="140" height="20" fill="#f0f8f0" stroke="#e2e8f0"/>
  <text x="700" y="333" text-anchor="middle" class="table-cell" fill="#d69e2e" font-weight="bold">K</text>
  
  <!-- Row 3: Computational Cost -->
  <rect x="70" y="340" width="140" height="20" fill="#f7fafc" stroke="#e2e8f0"/>
  <text x="75" y="353" class="table-cell" font-weight="bold">Computational Cost</text>
  <rect x="210" y="340" width="140" height="20" fill="#ffe5e5" stroke="#e2e8f0"/>
  <text x="280" y="353" text-anchor="middle" class="table-cell" fill="#38a169" font-weight="bold">Very Low</text>
  <rect x="350" y="340" width="140" height="20" fill="#e8f4f8" stroke="#e2e8f0"/>
  <text x="420" y="353" text-anchor="middle" class="table-cell" fill="#e53e3e" font-weight="bold">Very High</text>
  <rect x="490" y="340" width="140" height="20" fill="#f0f8f0" stroke="#e2e8f0"/>
  <text x="560" y="353" text-anchor="middle" class="table-cell" fill="#d69e2e" font-weight="bold">Moderate</text>
  <rect x="630" y="340" width="140" height="20" fill="#f0f8f0" stroke="#e2e8f0"/>
  <text x="700" y="353" text-anchor="middle" class="table-cell" fill="#d69e2e" font-weight="bold">Moderate</text>
  
  <!-- Row 4: Error Variance -->
  <rect x="70" y="360" width="140" height="20" fill="#f7fafc" stroke="#e2e8f0"/>
  <text x="75" y="373" class="table-cell" font-weight="bold">Error Variance</text>
  <rect x="210" y="360" width="140" height="20" fill="#ffe5e5" stroke="#e2e8f0"/>
  <text x="280" y="373" text-anchor="middle" class="table-cell" fill="#e53e3e" font-weight="bold">High</text>
  <rect x="350" y="360" width="140" height="20" fill="#e8f4f8" stroke="#e2e8f0"/>
  <text x="420" y="373" text-anchor="middle" class="table-cell" fill="#d69e2e" font-weight="bold">Medium</text>
  <rect x="490" y="360" width="140" height="20" fill="#f0f8f0" stroke="#e2e8f0"/>
  <text x="560" y="373" text-anchor="middle" class="table-cell" fill="#38a169" font-weight="bold">Low</text>
  <rect x="630" y="360" width="140" height="20" fill="#f0f8f0" stroke="#e2e8f0"/>
  <text x="700" y="373" text-anchor="middle" class="table-cell" fill="#38a169" font-weight="bold">Very Low</text>
  
  <!-- Row 5: Bias Level -->
  <rect x="70" y="380" width="140" height="20" fill="#f7fafc" stroke="#e2e8f0"/>
  <text x="75" y="393" class="table-cell" font-weight="bold">Bias Level</text>
  <rect x="210" y="380" width="140" height="20" fill="#ffe5e5" stroke="#e2e8f0"/>
  <text x="280" y="393" text-anchor="middle" class="table-cell" fill="#e53e3e" font-weight="bold">Variable</text>
  <rect x="350" y="380" width="140" height="20" fill="#e8f4f8" stroke="#e2e8f0"/>
  <text x="420" y="393" text-anchor="middle" class="table-cell" fill="#38a169" font-weight="bold">Very Low</text>
  <rect x="490" y="380" width="140" height="20" fill="#f0f8f0" stroke="#e2e8f0"/>
  <text x="560" y="393" text-anchor="middle" class="table-cell" fill="#d69e2e" font-weight="bold">Low-Medium</text>
  <rect x="630" y="380" width="140" height="20" fill="#f0f8f0" stroke="#e2e8f0"/>
  <text x="700" y="393" text-anchor="middle" class="table-cell" fill="#38a169" font-weight="bold">Low</text>
  
  <!-- Row 6: Best Use Case -->
  <rect x="70" y="400" width="140" height="20" fill="#f7fafc" stroke="#e2e8f0"/>
  <text x="75" y="413" class="table-cell" font-weight="bold">Best Use Case</text>
  <rect x="210" y="400" width="140" height="20" fill="#ffe5e5" stroke="#e2e8f0"/>
  <text x="280" y="413" text-anchor="middle" class="table-cell">Large datasets</text>
  <rect x="350" y="400" width="140" height="20" fill="#e8f4f8" stroke="#e2e8f0"/>
  <text x="420" y="413" text-anchor="middle" class="table-cell">Small datasets</text>
  <rect x="490" y="400" width="140" height="20" fill="#f0f8f0" stroke="#e2e8f0"/>
  <text x="560" y="413" text-anchor="middle" class="table-cell">General purpose</text>
  <rect x="630" y="400" width="140" height="20" fill="#f0f8f0" stroke="#e2e8f0"/>
  <text x="700" y="413" text-anchor="middle" class="table-cell">Classification</text>
  
  <!-- Row 7: Robustness -->
  <rect x="70" y="420" width="140" height="20" fill="#f7fafc" stroke="#e2e8f0"/>
  <text x="75" y="433" class="table-cell" font-weight="bold">Robustness</text>
  <rect x="210" y="420" width="140" height="20" fill="#ffe5e5" stroke="#e2e8f0"/>
  <text x="280" y="433" text-anchor="middle" class="table-cell" fill="#e53e3e" font-weight="bold">Low</text>
  <rect x="350" y="420" width="140" height="20" fill="#e8f4f8" stroke="#e2e8f0"/>
  <text x="420" y="433" text-anchor="middle" class="table-cell" fill="#d69e2e" font-weight="bold">Medium</text>
  <rect x="490" y="420" width="140" height="20" fill="#f0f8f0" stroke="#e2e8f0"/>
  <text x="560" y="433" text-anchor="middle" class="table-cell" fill="#38a169" font-weight="bold">High</text>
  <rect x="630" y="420" width="140" height="20" fill="#f0f8f0" stroke="#e2e8f0"/>
  <text x="700" y="433" text-anchor="middle" class="table-cell" fill="#38a169" font-weight="bold">Very High</text>
  
  <!-- Row 8: Typical Parameters -->
  <rect x="70" y="440" width="140" height="20" fill="#f7fafc" stroke="#e2e8f0"/>
  <text x="75" y="453" class="table-cell" font-weight="bold">Typical Parameters</text>
  <rect x="210" y="440" width="140" height="20" fill="#ffe5e5" stroke="#e2e8f0"/>
  <text x="280" y="453" text-anchor="middle" class="table-cell">80/20 or 70/30</text>
  <rect x="350" y="440" width="140" height="20" fill="#e8f4f8" stroke="#e2e8f0"/>
  <text x="420" y="453" text-anchor="middle" class="table-cell">n folds</text>
  <rect x="490" y="440" width="140" height="20" fill="#f0f8f0" stroke="#e2e8f0"/>
  <text x="560" y="453" text-anchor="middle" class="table-cell">K = 5 or 10</text>
  <rect x="630" y="440" width="140" height="20" fill="#f0f8f0" stroke="#e2e8f0"/>
  <text x="700" y="453" text-anchor="middle" class="table-cell">K = 5 or 10</text>
  
  <!-- Row 9: Class Balance -->
  <rect x="70" y="460" width="140" height="20" fill="#f7fafc" stroke="#e2e8f0"/>
  <text x="75" y="473" class="table-cell" font-weight="bold">Class Balance</text>
  <rect x="210" y="460" width="140" height="20" fill="#ffe5e5" stroke="#e2e8f0"/>
  <text x="280" y="473" text-anchor="middle" class="table-cell" fill="#e53e3e" font-weight="bold">Not guaranteed</text>
  <rect x="350" y="460" width="140" height="20" fill="#e8f4f8" stroke="#e2e8f0"/>
  <text x="420" y="473" text-anchor="middle" class="table-cell" fill="#e53e3e" font-weight="bold">Not guaranteed</text>
  <rect x="490" y="460" width="140" height="20" fill="#f0f8f0" stroke="#e2e8f0"/>
  <text x="560" y="473" text-anchor="middle" class="table-cell" fill="#d69e2e" font-weight="bold">Approximately</text>
  <rect x="630" y="460" width="140" height="20" fill="#f0f8f0" stroke="#e2e8f0"/>
  <text x="700" y="473" text-anchor="middle" class="table-cell" fill="#38a169" font-weight="bold">Preserved</text>
  
  <!-- Row 10: Reproducibility -->
  <rect x="70" y="480" width="140" height="20" fill="#f7fafc" stroke="#e2e8f0"/>
  <text x="75" y="493" class="table-cell" font-weight="bold">Reproducibility</text>
  <rect x="210" y="480" width="140" height="20" fill="#ffe5e5" stroke="#e2e8f0"/>
  <text x="280" y="493" text-anchor="middle" class="table-cell" fill="#d69e2e" font-weight="bold">Seed-dependent</text>
  <rect x="350" y="480" width="140" height="20" fill="#e8f4f8" stroke="#e2e8f0"/>
  <text x="420" y="493" text-anchor="middle" class="table-cell" fill="#38a169" font-weight="bold">Deterministic</text>
  <rect x="490" y="480" width="140" height="20" fill="#f0f8f0" stroke="#e2e8f0"/>
  <text x="560" y="493" text-anchor="middle" class="table-cell" fill="#d69e2e" font-weight="bold">Seed-dependent</text>
  <rect x="630" y="480" width="140" height="20" fill="#f0f8f0" stroke="#e2e8f0"/>
  <text x="700" y="493" text-anchor="middle" class="table-cell" fill="#d69e2e" font-weight="bold">Seed-dependent</text>
  
  <!-- Recommendations Section -->
  <rect x="50" y="580" width="800" height="130" class="recommendation-box"/>
  <text x="450" y="605" text-anchor="middle" class="subtitle" fill="#744210">Practical Selection Guidelines</text>
  
  <!-- Dataset size recommendations -->
  <text x="70" y="630" class="description" fill="#744210" font-weight="bold">Dataset Size Recommendations:</text>
  <text x="70" y="647" class="description" fill="#744210">• n &lt; 100: Use LOOCV or 5-fold CV for maximum data utilization</text>
  <text x="70" y="664" class="description" fill="#744210">• 100 ≤ n &lt; 1000: Use 5-fold or 10-fold CV (industry standard)</text>
  <text x="70" y="681" class="description" fill="#744210">• n ≥ 1000: Use 3-fold, 5-fold CV, or train-test split for efficiency</text>
  <text x="70" y="698" class="description" fill="#744210">• Classification: Always prefer Stratified K-Fold to maintain class proportions</text>
  
  <!-- Performance Summary -->
  <rect x="50" y="730" width="800" height="40" class="box"/>
  <text x="450" y="745" text-anchor="middle" class="section-title">Key Takeaway</text>
  <text x="450" y="762" text-anchor="middle" class="description">Stratified K-Fold CV (K=5-10) provides optimal balance of bias, variance, and efficiency for most real-world applications</text>
</svg>