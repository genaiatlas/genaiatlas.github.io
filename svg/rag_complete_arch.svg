<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1400" height="1000" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="700" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Complete RAG Architecture
  </text>
  
  <!-- User Query Input -->
  <g id="user-input">
    <circle cx="700" cy="120" r="35" fill="#ff6b6b" stroke="#c92a2a" stroke-width="2"/>
    <text x="700" y="128" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
      User
    </text>
    <text x="700" y="170" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#495057">
      Natural Language Query
    </text>
  </g>
  
  <!-- Query Construction -->
  <g id="query-construction">
    <rect x="50" y="220" width="300" height="140" rx="10" fill="#fff3bf" stroke="#f59f00" stroke-width="3"/>
    <text x="200" y="250" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      1. Query Construction
    </text>
    <text x="200" y="280" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#495057">
      • Relational DBs (Text-to-SQL)
    </text>
    <text x="200" y="305" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#495057">
      • Graph DBs (Text-to-Cypher)
    </text>
    <text x="200" y="330" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#495057">
      • Vector DBs (Metadata Filters)
    </text>
    <text x="200" y="355" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#495057">
      • Self-Query Retriever
    </text>
  </g>
  
  <!-- Query Translation -->
  <g id="query-translation">
    <rect x="400" y="220" width="300" height="140" rx="10" fill="#ffdeeb" stroke="#e64980" stroke-width="3"/>
    <text x="550" y="250" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      2. Query Translation
    </text>
    <text x="550" y="280" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#495057">
      • Multi-Query
    </text>
    <text x="550" y="305" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#495057">
      • Step-Back Prompting
    </text>
    <text x="550" y="330" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#495057">
      • RAG-Fusion
    </text>
    <text x="550" y="355" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#495057">
      • Query Decomposition
    </text>
  </g>
  
  <!-- Routing -->
  <g id="routing">
    <rect x="750" y="220" width="300" height="140" rx="10" fill="#ffd8a8" stroke="#fd7e14" stroke-width="3"/>
    <text x="900" y="250" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      3. Routing
    </text>
    <text x="900" y="280" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#495057">
      • Logical Routing
    </text>
    <text x="900" y="305" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#495057">
      • Semantic Routing
    </text>
    <text x="900" y="330" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#495057">
      • Prompt Selection
    </text>
    <text x="900" y="355" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#495057">
      • Multi-Source Routing
    </text>
  </g>
  
  <!-- Knowledge Sources -->
  <g id="knowledge-sources">
    <rect x="50" y="420" width="450" height="120" rx="10" fill="#d3f9d8" stroke="#37b24d" stroke-width="3"/>
    <text x="275" y="450" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Knowledge Sources
    </text>
    <rect x="70" y="465" width="120" height="60" rx="5" fill="#fff" stroke="#37b24d" stroke-width="2"/>
    <text x="130" y="490" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#495057" font-weight="bold">
      Relational DB
    </text>
    <text x="130" y="510" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#868e96">
      SQL Data
    </text>
    
    <rect x="210" y="465" width="120" height="60" rx="5" fill="#fff" stroke="#37b24d" stroke-width="2"/>
    <text x="270" y="490" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#495057" font-weight="bold">
      Graph DB
    </text>
    <text x="270" y="510" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#868e96">
      Neo4j/Cypher
    </text>
    
    <rect x="350" y="465" width="120" height="60" rx="5" fill="#fff" stroke="#37b24d" stroke-width="2"/>
    <text x="410" y="490" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#495057" font-weight="bold">
      Vector DB
    </text>
    <text x="410" y="510" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#868e96">
      Embeddings
    </text>
  </g>
  
  <!-- Indexing -->
  <g id="indexing">
    <rect x="550" y="420" width="300" height="120" rx="10" fill="#d0ebff" stroke="#1c7ed6" stroke-width="3"/>
    <text x="700" y="450" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      4. Indexing
    </text>
    <text x="700" y="475" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#495057">
      • Chunk Optimization
    </text>
    <text x="700" y="498" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#495057">
      • Multi-Representation
    </text>
    <text x="700" y="521" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#495057">
      • Hierarchical Indexing
    </text>
  </g>
  
  <!-- Retrieval -->
  <g id="retrieval">
    <rect x="900" y="420" width="450" height="120" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="3"/>
    <text x="1125" y="450" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      5. Retrieval
    </text>
    <rect x="920" y="465" width="130" height="60" rx="5" fill="#fff" stroke="#1971c2" stroke-width="2"/>
    <text x="985" y="485" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#495057" font-weight="bold">
      Ranking
    </text>
    <text x="985" y="505" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#868e96">
      Re-Rank, RankGPT
    </text>
    <text x="985" y="520" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#868e96">
      RAG-Fusion
    </text>
    
    <rect x="1070" y="465" width="130" height="60" rx="5" fill="#fff" stroke="#1971c2" stroke-width="2"/>
    <text x="1135" y="485" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#495057" font-weight="bold">
      Refinement
    </text>
    <text x="1135" y="505" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#868e96">
      CRAG, Filtering
    </text>
    <text x="1135" y="520" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#868e96">
      Compression
    </text>
    
    <rect x="1220" y="465" width="110" height="60" rx="5" fill="#fff" stroke="#1971c2" stroke-width="2"/>
    <text x="1275" y="490" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#495057" font-weight="bold">
      Documents
    </text>
    <text x="1275" y="510" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#868e96">
      Retrieved
    </text>
  </g>
  
  <!-- Generation -->
  <g id="generation">
    <rect x="550" y="600" width="300" height="140" rx="10" fill="#e9d5ff" stroke="#9333ea" stroke-width="3"/>
    <text x="700" y="630" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      6. Generation
    </text>
    <text x="700" y="660" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#495057">
      • Active Retrieval
    </text>
    <text x="700" y="685" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#495057">
      • Self-RAG
    </text>
    <text x="700" y="710" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#495057">
      • Hypothetical Response (HRR)
    </text>
    <text x="700" y="735" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#495057">
      • LLM with Context
    </text>
  </g>
  
  <!-- Response Output -->
  <g id="response">
    <rect x="600" y="800" width="200" height="80" rx="10" fill="#51cf66" stroke="#2f9e44" stroke-width="3"/>
    <text x="700" y="835" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">
      Generated Answer
    </text>
    <text x="700" y="860" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">
      with Citations
    </text>
  </g>
  
  <!-- Arrows -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#495057"/>
    </marker>
  </defs>
  
  <line x1="700" y1="170" x2="200" y2="210" stroke="#495057" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="700" y1="170" x2="550" y2="210" stroke="#495057" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="700" y1="170" x2="900" y2="210" stroke="#495057" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Query Construction to Knowledge Sources -->
  <line x1="200" y1="360" x2="200" y2="410" stroke="#495057" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Query Translation to Indexing -->
  <line x1="550" y1="360" x2="650" y2="410" stroke="#495057" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Routing to Retrieval -->
  <line x1="950" y1="360" x2="1050" y2="410" stroke="#495057" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Knowledge Sources to Retrieval -->
  <line x1="500" y1="480" x2="900" y2="480" stroke="#495057" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Indexing to Retrieval -->
  <line x1="850" y1="480" x2="890" y2="480" stroke="#495057" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Retrieval to Generation -->
  <line x1="1050" y1="540" x2="750" y2="590" stroke="#495057" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Generation to Response -->
  <line x1="700" y1="740" x2="700" y2="790" stroke="#495057" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Feedback Loop -->
  <path d="M 550 670 Q 450 720 500 800 Q 550 880 600 870" stroke="#9333ea" stroke-width="2" fill="none" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <text x="480" y="770" font-family="Arial, sans-serif" font-size="12" fill="#9333ea" font-weight="bold">
    Active Retrieval
  </text>
  
  <!-- Legend -->
  <g id="legend">
    <rect x="1100" y="780" width="280" height="190" rx="8" fill="#fff" stroke="#dee2e6" stroke-width="2"/>
    <text x="1240" y="805" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Component Flow
    </text>
    
    <circle cx="1120" cy="830" r="5" fill="#f59f00"/>
    <text x="1135" y="835" font-family="Arial, sans-serif" font-size="12" fill="#495057">
      Query Processing
    </text>
    
    <circle cx="1120" cy="855" r="5" fill="#37b24d"/>
    <text x="1135" y="860" font-family="Arial, sans-serif" font-size="12" fill="#495057">
      Data Sources
    </text>
    
    <circle cx="1120" cy="880" r="5" fill="#1971c2"/>
    <text x="1135" y="885" font-family="Arial, sans-serif" font-size="12" fill="#495057">
      Retrieval &amp; Indexing
    </text>
    
    <circle cx="1120" cy="905" r="5" fill="#9333ea"/>
    <text x="1135" y="910" font-family="Arial, sans-serif" font-size="12" fill="#495057">
      Generation
    </text>
    
    <circle cx="1120" cy="930" r="5" fill="#2f9e44"/>
    <text x="1135" y="935" font-family="Arial, sans-serif" font-size="12" fill="#495057">
      Final Output
    </text>
    
    <line x1="1120" y1="950" x2="1160" y2="950" stroke="#9333ea" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="1170" y="955" font-family="Arial, sans-serif" font-size="12" fill="#495057">
      Feedback Loop
    </text>
  </g>
</svg>