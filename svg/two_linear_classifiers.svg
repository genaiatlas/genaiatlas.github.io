<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <dropShadow dx="2" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="600" fill="#f8f9fa"/>
  
  <!-- Left side: Original data with classifiers -->
  <rect x="50" y="80" width="400" height="300" fill="white" stroke="#ccc" stroke-width="2" rx="5" filter="url(#shadow)"/>
  
  <!-- Grid for left plot -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e8eaf6" stroke-width="1"/>
    </pattern>
  </defs>
  <rect x="60" y="90" width="380" height="280" fill="url(#grid)" opacity="0.5"/>
  
  <!-- Left plot axes -->
  <line x1="60" y1="370" x2="440" y2="370" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="370" x2="60" y2="90" stroke="#333" stroke-width="2"/>
  
  <!-- Left plot data points -->
  <!-- Red clusters -->
  <circle cx="120" cy="340" r="5" fill="#f44336" stroke="#d32f2f" stroke-width="2"/>
  <circle cx="110" cy="350" r="5" fill="#f44336" stroke="#d32f2f" stroke-width="2"/>
  <circle cx="130" cy="350" r="5" fill="#f44336" stroke="#d32f2f" stroke-width="2"/>
  <circle cx="115" cy="330" r="5" fill="#f44336" stroke="#d32f2f" stroke-width="2"/>
  <circle cx="125" cy="330" r="5" fill="#f44336" stroke="#d32f2f" stroke-width="2"/>
  
  <circle cx="380" cy="120" r="5" fill="#f44336" stroke="#d32f2f" stroke-width="2"/>
  <circle cx="370" cy="110" r="5" fill="#f44336" stroke="#d32f2f" stroke-width="2"/>
  <circle cx="390" cy="110" r="5" fill="#f44336" stroke="#d32f2f" stroke-width="2"/>
  <circle cx="375" cy="130" r="5" fill="#f44336" stroke="#d32f2f" stroke-width="2"/>
  <circle cx="385" cy="130" r="5" fill="#f44336" stroke="#d32f2f" stroke-width="2"/>
  
  <!-- Blue center cluster -->
  <circle cx="250" cy="230" r="5" fill="#2196f3" stroke="#1976d2" stroke-width="2"/>
  <circle cx="240" cy="220" r="5" fill="#2196f3" stroke="#1976d2" stroke-width="2"/>
  <circle cx="260" cy="220" r="5" fill="#2196f3" stroke="#1976d2" stroke-width="2"/>
  <circle cx="245" cy="240" r="5" fill="#2196f3" stroke="#1976d2" stroke-width="2"/>
  <circle cx="255" cy="240" r="5" fill="#2196f3" stroke="#1976d2" stroke-width="2"/>
  <circle cx="235" cy="235" r="5" fill="#2196f3" stroke="#1976d2" stroke-width="2"/>
  <circle cx="265" cy="235" r="5" fill="#2196f3" stroke="#1976d2" stroke-width="2"/>
  
  <!-- Special marked points -->
  <circle cx="120" cy="340" r="8" fill="none" stroke="#ff9800" stroke-width="3"/>
  <text x="130" y="355" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ff9800">m₁</text>
  
  <circle cx="250" cy="230" r="8" fill="none" stroke="#ff9800" stroke-width="3"/>
  <text x="260" y="225" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ff9800">m₂</text>
  
  <circle cx="380" cy="120" r="8" fill="none" stroke="#ff9800" stroke-width="3"/>
  <text x="390" y="115" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ff9800">m₃</text>
  
  <!-- Two linear classifiers -->
  <!-- Classifier 1 (green line) -->
  <line x1="80" y1="160" x2="420" y2="300" stroke="#4caf50" stroke-width="4"/>
  <text x="220" y="210" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4caf50">Classifier 1</text>
  
  <!-- Arrow showing positive direction for classifier 1 -->
  <line x1="350" y1="270" x2="380" y2="250" stroke="#4caf50" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="385" y="245" font-family="Arial, sans-serif" font-size="10" fill="#4caf50">+1</text>
  
  <!-- Classifier 2 (purple line) -->
  <line x1="180" y1="90" x2="320" y2="370" stroke="#9c27b0" stroke-width="4"/>
  <text x="280" y="150" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#9c27b0">Classifier 2</text>
  
  <!-- Arrow showing positive direction for classifier 2 -->
  <line x1="280" y1="200" x2="320" y2="180" stroke="#9c27b0" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="325" y="175" font-family="Arial, sans-serif" font-size="10" fill="#9c27b0">+1</text>
  
  <!-- Labels and axes for left plot -->
  <text x="250" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">x₁</text>
  <text x="30" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333" transform="rotate(-90, 30, 230)">x₂</text>
  
  <!-- Right side: Network architecture -->
  <rect x="550" y="80" width="350" height="150" fill="white" stroke="#ccc" stroke-width="2" rx="5" filter="url(#shadow)"/>
  
  <!-- Input nodes -->
  <circle cx="580" cy="125" r="15" fill="#2196f3" stroke="#1976d2" stroke-width="2"/>
  <text x="580" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">x₁</text>
  
  <circle cx="580" cy="185" r="15" fill="#2196f3" stroke="#1976d2" stroke-width="2"/>
  <text x="580" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">x₂</text>
  
  <!-- Hidden nodes -->
  <circle cx="720" cy="125" r="20" fill="#4caf50" stroke="#2e7d32" stroke-width="2"/>
  <text x="710" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">z₁</text>
  <text x="730" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">f₁(z₁)</text>
  
  <circle cx="720" cy="185" r="20" fill="#9c27b0" stroke="#7b1fa2" stroke-width="2"/>
  <text x="710" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">z₂</text>
  <text x="730" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">f₂(z₂)</text>
  
  <!-- Output -->
  <circle cx="860" cy="155" r="20" fill="#ff9800" stroke="#f57c00" stroke-width="2"/>
  <text x="860" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">a₁</text>
  
  <circle cx="860" cy="185" r="20" fill="#ff9800" stroke="#f57c00" stroke-width="2"/>
  <text x="860" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">a₂</text>
  
  <!-- Connections -->
  <line x1="595" y1="125" x2="700" y2="125" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="595" y1="125" x2="700" y2="185" stroke="#666" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="595" y1="185" x2="700" y2="125" stroke="#666" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="595" y1="185" x2="700" y2="185" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  
  <line x1="740" y1="125" x2="840" y2="155" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="740" y1="185" x2="840" y2="185" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Right side: Output representation -->
  <rect x="550" y="280" width="350" height="250" fill="white" stroke="#ccc" stroke-width="2" rx="5" filter="url(#shadow)"/>
  
  <!-- Coordinate system -->
  <line x1="620" y1="500" x2="820" y2="500" stroke="#333" stroke-width="2"/>
  <line x1="620" y1="500" x2="620" y2="300" stroke="#333" stroke-width="2"/>
  
  <!-- Grid marks -->
  <line x1="720" y1="495" x2="720" y2="505" stroke="#333" stroke-width="2"/>
  <text x="720" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">1</text>
  
  <line x1="615" y1="400" x2="625" y2="400" stroke="#333" stroke-width="2"/>
  <text x="605" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">1</text>
  
  <!-- Axis labels -->
  <text x="720" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">a₁</text>
  <text x="580" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333" transform="rotate(-90, 580, 400)">a₂</text>
  
  <!-- Output points -->
  <!-- m1: (0,1) - Red -->
  <circle cx="620" cy="400" r="8" fill="#f44336" stroke="#d32f2f" stroke-width="2"/>
  <text x="635" y="395" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f44336">m₁ (0,1)</text>
  
  <!-- m2: (1,1) - Blue -->
  <circle cx="720" cy="400" r="8" fill="#2196f3" stroke="#1976d2" stroke-width="2"/>
  <text x="735" y="395" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2196f3">m₂ (1,1)</text>
  
  <!-- m3: (1,0) - Red -->
  <circle cx="720" cy="500" r="8" fill="#f44336" stroke="#d32f2f" stroke-width="2"/>
  <text x="735" y="520" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f44336">m₃ (1,0)</text>
  
  <!-- Separating line -->
  <line x1="670" y1="320" x2="770" y2="480" stroke="#4caf50" stroke-width="3"/>
  <text x="750" y="340" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#4caf50">Linear Separator</text>
  
  <!-- Titles -->
  <text x="250" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">Original Feature Space</text>
  <text x="725" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">Neural Network</text>
  <text x="725" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">New Representation Space</text>
  
  <!-- Main title -->
  <text x="500" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#333">Two Linear Classifiers Create New Data Encoding</text>
</svg>