<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="targetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFC107;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF9800;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="neighborGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#27AE60;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#229954;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#2C3E50">
    K-Nearest Neighbors for Recommendation
  </text>

  <!-- Step 1: Target User -->
  <g transform="translate(50, 80)">
    <text x="0" y="0" font-size="16" font-weight="bold" fill="#2C3E50">Step 1: Identify Target User (Frank)</text>
    
    <g transform="translate(50, 30)">
      <!-- Central target user -->
      <circle cx="150" cy="100" r="80" fill="none" stroke="#FFC107" stroke-width="2" stroke-dasharray="5,5" opacity="0.5" />
      <circle cx="150" cy="100" r="15" fill="url(#targetGrad)" />
      <text x="150" y="105" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Frank</text>
      
      <!-- Surrounding users with similarities -->
      <!-- High similarity users (same type) -->
      <circle cx="110" cy="80" r="10" fill="#27AE60" opacity="0.9" />
      <text x="110" y="84" text-anchor="middle" fill="white" font-size="9">U1</text>
      <text x="110" y="65" text-anchor="middle" fill="#27AE60" font-size="10">0.85</text>
      
      <circle cx="180" cy="85" r="10" fill="#27AE60" opacity="0.9" />
      <text x="180" y="89" text-anchor="middle" fill="white" font-size="9">U2</text>
      <text x="180" y="70" text-anchor="middle" fill="#27AE60" font-size="10">0.82</text>
      
      <circle cx="140" cy="130" r="10" fill="#27AE60" opacity="0.9" />
      <text x="140" y="134" text-anchor="middle" fill="white" font-size="9">U3</text>
      <text x="140" y="150" text-anchor="middle" fill="#27AE60" font-size="10">0.79</text>
      
      <circle cx="190" cy="115" r="10" fill="#27AE60" opacity="0.9" />
      <text x="190" y="119" text-anchor="middle" fill="white" font-size="9">U4</text>
      <text x="215" y="115" text-anchor="start" fill="#27AE60" font-size="10">0.75</text>
      
      <circle cx="120" cy="115" r="10" fill="#27AE60" opacity="0.9" />
      <text x="120" y="119" text-anchor="middle" fill="white" font-size="9">U5</text>
      <text x="95" y="115" text-anchor="end" fill="#27AE60" font-size="10">0.71</text>
      
      <!-- Medium similarity users -->
      <circle cx="80" cy="100" r="8" fill="#F39C12" opacity="0.7" />
      <text x="80" y="103" text-anchor="middle" fill="white" font-size="8">U6</text>
      <text x="55" y="100" text-anchor="end" fill="#F39C12" font-size="9">0.45</text>
      
      <circle cx="220" cy="100" r="8" fill="#F39C12" opacity="0.7" />
      <text x="220" y="103" text-anchor="middle" fill="white" font-size="8">U7</text>
      <text x="245" y="100" text-anchor="start" fill="#F39C12" font-size="9">0.42</text>
      
      <!-- Low similarity users (different type) -->
      <circle cx="60" cy="140" r="6" fill="#E74C3C" opacity="0.5" />
      <text x="60" y="143" text-anchor="middle" fill="white" font-size="7">U8</text>
      
      <circle cx="240" cy="140" r="6" fill="#E74C3C" opacity="0.5" />
      <text x="240" y="143" text-anchor="middle" fill="white" font-size="7">U9</text>
      
      <circle cx="150" cy="40" r="6" fill="#E74C3C" opacity="0.5" />
      <text x="150" y="43" text-anchor="middle" fill="white" font-size="7">U10</text>
    </g>
  </g>

  <!-- Step 2: Select K Neighbors -->
  <g transform="translate(400, 80)">
    <text x="0" y="0" font-size="16" font-weight="bold" fill="#2C3E50">Step 2: Select K=5 Nearest Neighbors</text>
    
    <g transform="translate(20, 30)">
      <rect x="0" y="0" width="330" height="180" fill="#F8F9FA" stroke="#D5DBDB" stroke-width="1" rx="5" />
      
      <!-- Neighbor list -->
      <text x="165" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#34495E">
        Selected Neighbors (K=5)
      </text>
      
      <!-- Headers -->
      <text x="30" y="50" font-size="12" fill="#7F8C8D" font-weight="bold">User</text>
      <text x="100" y="50" font-size="12" fill="#7F8C8D" font-weight="bold">Similarity</text>
      <text x="200" y="50" font-size="12" fill="#7F8C8D" font-weight="bold">Movie Rating</text>
      
      <!-- Row 1 -->
      <rect x="10" y="60" width="310" height="22" fill="#27AE60" opacity="0.1" />
      <text x="30" y="76" font-size="11" fill="#2C3E50">User_1</text>
      <text x="110" y="76" font-size="11" fill="#27AE60" font-weight="bold">0.85</text>
      <text x="220" y="76" font-size="11" fill="#2C3E50">4</text>
      
      <!-- Row 2 -->
      <rect x="10" y="85" width="310" height="22" fill="#27AE60" opacity="0.1" />
      <text x="30" y="101" font-size="11" fill="#2C3E50">User_2</text>
      <text x="110" y="101" font-size="11" fill="#27AE60" font-weight="bold">0.82</text>
      <text x="220" y="101" font-size="11" fill="#2C3E50">5</text>
      
      <!-- Row 3 -->
      <rect x="10" y="110" width="310" height="22" fill="#27AE60" opacity="0.1" />
      <text x="30" y="126" font-size="11" fill="#2C3E50">User_3</text>
      <text x="110" y="126" font-size="11" fill="#27AE60" font-weight="bold">0.79</text>
      <text x="220" y="126" font-size="11" fill="#2C3E50">4</text>
      
      <!-- Row 4 -->
      <rect x="10" y="135" width="310" height="22" fill="#27AE60" opacity="0.1" />
      <text x="30" y="151" font-size="11" fill="#2C3E50">User_4</text>
      <text x="110" y="151" font-size="11" fill="#27AE60" font-weight="bold">0.75</text>
      <text x="220" y="151" font-size="11" fill="#2C3E50">5</text>
      
      <!-- Row 5 -->
      <rect x="10" y="160" width="310" height="22" fill="#27AE60" opacity="0.1" />
      <text x="30" y="176" font-size="11" fill="#2C3E50">User_5</text>
      <text x="110" y="176" font-size="11" fill="#27AE60" font-weight="bold">0.71</text>
      <text x="220" y="176" font-size="11" fill="#2C3E50">3</text>
    </g>
  </g>

  <!-- Step 3: Calculate Weighted Average -->
  <g transform="translate(100, 320)">
    <text x="0" y="0" font-size="16" font-weight="bold" fill="#2C3E50">Step 3: Calculate Weighted Average Prediction</text>
    
    <g transform="translate(0, 30)">
      <rect x="0" y="0" width="600" height="120" fill="#2C3E50" opacity="0.05" stroke="#2C3E50" stroke-width="1" rx="5" />
      
      <!-- Calculation -->
      <text x="300" y="25" text-anchor="middle" font-size="12" fill="#34495E">
        Weighted Sum = (0.85×4) + (0.82×5) + (0.79×4) + (0.75×5) + (0.71×3)
      </text>
      <text x="300" y="45" text-anchor="middle" font-size="12" fill="#34495E">
        = 3.40 + 4.10 + 3.16 + 3.75 + 2.13 = 16.54
      </text>
      
      <line x1="50" y1="55" x2="550" y2="55" stroke="#BDC3C7" stroke-width="1" />
      
      <text x="300" y="75" text-anchor="middle" font-size="12" fill="#34495E">
        Sum of Similarities = 0.85 + 0.82 + 0.79 + 0.75 + 0.71 = 3.92
      </text>
      
      <!-- Result -->
      <rect x="200" y="85" width="200" height="25" fill="#E74C3C" rx="3" />
      <text x="300" y="102" text-anchor="middle" fill="white" font-size="14" font-weight="bold">
        Predicted Rating = 16.54 / 3.92 = 4.22
      </text>
    </g>
  </g>

  <!-- Visualization of Process -->
  <g transform="translate(100, 470)">
    <text x="0" y="0" font-size="16" font-weight="bold" fill="#2C3E50">Complete Process Flow</text>
    
    <g transform="translate(0, 25)">
      <!-- Step boxes -->
      <rect x="0" y="0" width="120" height="50" fill="#3498DB" rx="5" />
      <text x="60" y="20" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Input:</text>
      <text x="60" y="35" text-anchor="middle" fill="white" font-size="10">Target User</text>
      
      <path d="M 120 25 L 145 25" stroke="#34495E" stroke-width="2" marker-end="url(#arrow)" />
      
      <rect x="145" y="0" width="120" height="50" fill="#27AE60" rx="5" />
      <text x="205" y="20" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Find:</text>
      <text x="205" y="35" text-anchor="middle" fill="white" font-size="10">K Neighbors</text>
      
      <path d="M 265 25 L 290 25" stroke="#34495E" stroke-width="2" marker-end="url(#arrow)" />
      
      <rect x="290" y="0" width="120" height="50" fill="#F39C12" rx="5" />
      <text x="350" y="20" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Compute:</text>
      <text x="350" y="35" text-anchor="middle" fill="white" font-size="10">Weighted Avg</text>
      
      <path d="M 410 25 L 435 25" stroke="#34495E" stroke-width="2" marker-end="url(#arrow)" />
      
      <rect x="435" y="0" width="120" height="50" fill="#E74C3C" rx="5" />
      <text x="495" y="20" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Output:</text>
      <text x="495" y="35" text-anchor="middle" fill="white" font-size="10">Prediction</text>
    </g>
  </g>

  <!-- Key Parameters Box -->
  <g transform="translate(100, 550)">
    <rect x="0" y="0" width="600" height="35" rx="5" fill="#ECF0F1" stroke="#BDC3C7" />
    <text x="10" y="23" font-size="11" fill="#2C3E50" font-weight="bold">Key Parameters:</text>
    <text x="120" y="23" font-size="10" fill="#34495E">K=50 (typical) | Min common items=5 | Similarity metric: Pearson/Cosine</text>
  </g>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495E" />
    </marker>
  </defs>
</svg>