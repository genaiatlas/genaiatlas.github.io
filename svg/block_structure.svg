<svg viewBox="0 0 1100 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="550" y="35" font-size="24" font-weight="bold" text-anchor="middle" fill="#2C3E50">
    Matrix Block Structure and Decomposition
  </text>
  
  <!-- Left Side: Original Matrix with Blocks -->
  <g id="original-matrix">
    <text x="200" y="75" font-size="16" font-weight="bold" text-anchor="middle" fill="#34495E">
      Original Rating Matrix
    </text>
    
    <!-- Main matrix background -->
    <rect x="50" y="90" width="300" height="300" fill="#ECF0F1" stroke="#2C3E50" stroke-width="2"/>
    
    <!-- Base matrix (blue - central cluster) -->
    <rect x="50" y="90" width="300" height="300" fill="#AED6F1" opacity="0.6"/>
    
    <!-- Block 1: Bikers + Dance movies (top-left, red) -->
    <rect x="50" y="90" width="120" height="100" fill="#E74C3C" opacity="0.7"/>
    <text x="110" y="145" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Bikers</text>
    <text x="110" y="160" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Dance Movies</text>
    
    <!-- Block 2: Teens + Pop concerts (middle-right, purple) -->
    <rect x="200" y="190" width="150" height="120" fill="#9B59B6" opacity="0.7"/>
    <text x="275" y="245" font-size="11" font-weight="bold" text-anchor="middle" fill="white">Teenage Girls</text>
    <text x="275" y="260" font-size="11" font-weight="bold" text-anchor="middle" fill="white">Pop Concerts</text>
    
    <!-- Block 3: Action fans (bottom-left, green) -->
    <rect x="50" y="280" width="100" height="110" fill="#27AE60" opacity="0.7"/>
    <text x="100" y="330" font-size="11" font-weight="bold" text-anchor="middle" fill="white">Action Fans</text>
    <text x="100" y="345" font-size="11" font-weight="bold" text-anchor="middle" fill="white">Thrillers</text>
    
    <!-- Labels -->
    <text x="25" y="240" font-size="12" font-weight="bold" text-anchor="middle" fill="#E74C3C" transform="rotate(-90 25 240)">Users</text>
    <text x="200" y="410" font-size="12" font-weight="bold" text-anchor="middle" fill="#2980B9">Movies</text>
  </g>
  
  <!-- Equals sign -->
  <text x="400" y="250" font-size="36" font-weight="bold" text-anchor="middle" fill="#34495E">=</text>
  
  <!-- Right Side: Decomposition -->
  <g id="decomposition">
    <text x="750" y="75" font-size="16" font-weight="bold" text-anchor="middle" fill="#34495E">
      Sum of Simple Matrices
    </text>
    
    <!-- Base Matrix (B) -->
    <g id="base-matrix">
      <rect x="450" y="90" width="120" height="120" fill="#AED6F1" opacity="0.8" stroke="#2980B9" stroke-width="2"/>
      <text x="510" y="160" font-size="14" font-weight="bold" text-anchor="middle" fill="#2C3E50">B</text>
      <text x="510" y="220" font-size="10" text-anchor="middle" fill="#555">Base</text>
      <text x="510" y="232" font-size="10" text-anchor="middle" fill="#555">(central)</text>
    </g>
    
    <!-- Plus sign 1 -->
    <text x="590" y="155" font-size="24" font-weight="bold" text-anchor="middle" fill="#34495E">+</text>
    
    <!-- Pattern 1: U1 ⊗ V1 -->
    <g id="pattern1">
      <rect x="620" y="90" width="120" height="120" fill="#E74C3C" opacity="0.6" stroke="#C0392B" stroke-width="2"/>
      <text x="680" y="145" font-size="13" font-weight="bold" text-anchor="middle" fill="#2C3E50">U₁ ⊗ V₁</text>
      <text x="680" y="165" font-size="9" text-anchor="middle" fill="#555">Bikers ×</text>
      <text x="680" y="177" font-size="9" text-anchor="middle" fill="#555">Dance</text>
      <text x="680" y="220" font-size="10" text-anchor="middle" fill="#C0392B">Pattern 1</text>
    </g>
    
    <!-- Plus sign 2 -->
    <text x="760" y="155" font-size="24" font-weight="bold" text-anchor="middle" fill="#34495E">+</text>
    
    <!-- Pattern 2: U2 ⊗ V2 -->
    <g id="pattern2">
      <rect x="790" y="90" width="120" height="120" fill="#9B59B6" opacity="0.6" stroke="#8E44AD" stroke-width="2"/>
      <text x="850" y="145" font-size="13" font-weight="bold" text-anchor="middle" fill="#2C3E50">U₂ ⊗ V₂</text>
      <text x="850" y="165" font-size="9" text-anchor="middle" fill="#555">Teens ×</text>
      <text x="850" y="177" font-size="9" text-anchor="middle" fill="#555">Pop</text>
      <text x="850" y="220" font-size="10" text-anchor="middle" fill="#8E44AD">Pattern 2</text>
    </g>
    
    <!-- Plus sign 3 -->
    <text x="930" y="155" font-size="24" font-weight="bold" text-anchor="middle" fill="#34495E">+</text>
    
    <!-- More patterns indicator -->
    <text x="980" y="155" font-size="28" font-weight="bold" text-anchor="middle" fill="#7F8C8D">...</text>
  </g>
  
  <!-- Detailed Block Example -->
  <g id="detailed-example">
    <text x="550" y="280" font-size="16" font-weight="bold" text-anchor="middle" fill="#34495E">
      Detailed Example: Bikers + Dance Movies Block
    </text>
    
    <!-- User vector U -->
    <g id="user-vector">
      <rect x="100" y="310" width="60" height="200" fill="#FFE5E5" stroke="#E74C3C" stroke-width="2"/>
      <text x="130" y="300" font-size="13" font-weight="bold" text-anchor="middle" fill="#E74C3C">U</text>
      
      <!-- Vector entries -->
      <rect x="110" y="320" width="40" height="30" fill="white" stroke="#BDC3C7" stroke-width="1"/>
      <text x="130" y="340" font-size="11" text-anchor="middle" fill="#555">0</text>
      
      <rect x="110" y="355" width="40" height="30" fill="white" stroke="#BDC3C7" stroke-width="1"/>
      <text x="130" y="375" font-size="11" text-anchor="middle" fill="#555">0</text>
      
      <rect x="110" y="390" width="40" height="30" fill="#E74C3C" stroke="#C0392B" stroke-width="2"/>
      <text x="130" y="410" font-size="12" font-weight="bold" text-anchor="middle" fill="white">1</text>
      
      <rect x="110" y="425" width="40" height="30" fill="#E74C3C" stroke="#C0392B" stroke-width="2"/>
      <text x="130" y="445" font-size="12" font-weight="bold" text-anchor="middle" fill="white">1</text>
      
      <rect x="110" y="460" width="40" height="30" fill="white" stroke="#BDC3C7" stroke-width="1"/>
      <text x="130" y="480" font-size="11" text-anchor="middle" fill="#555">0</text>
      
      <text x="130" y="525" font-size="10" text-anchor="middle" fill="#E74C3C">Bikers</text>
    </g>
    
    <!-- Outer product symbol -->
    <text x="185" y="420" font-size="24" font-weight="bold" text-anchor="middle" fill="#34495E">⊗</text>
    
    <!-- Movie vector V -->
    <g id="movie-vector">
      <rect x="220" y="380" width="280" height="60" fill="#E5F4FF" stroke="#2980B9" stroke-width="2"/>
      <text x="360" y="370" font-size="13" font-weight="bold" text-anchor="middle" fill="#2980B9">V</text>
      
      <!-- Vector entries -->
      <rect x="230" y="390" width="40" height="40" fill="white" stroke="#BDC3C7" stroke-width="1"/>
      <text x="250" y="415" font-size="11" text-anchor="middle" fill="#555">0</text>
      
      <rect x="275" y="390" width="40" height="40" fill="#2980B9" stroke="#1F6391" stroke-width="2"/>
      <text x="295" y="415" font-size="12" font-weight="bold" text-anchor="middle" fill="white">1</text>
      
      <rect x="320" y="390" width="40" height="40" fill="#2980B9" stroke="#1F6391" stroke-width="2"/>
      <text x="340" y="415" font-size="12" font-weight="bold" text-anchor="middle" fill="white">1</text>
      
      <rect x="365" y="390" width="40" height="40" fill="#2980B9" stroke="#1F6391" stroke-width="2"/>
      <text x="385" y="415" font-size="12" font-weight="bold" text-anchor="middle" fill="white">1</text>
      
      <rect x="410" y="390" width="40" height="40" fill="white" stroke="#BDC3C7" stroke-width="1"/>
      <text x="430" y="415" font-size="11" text-anchor="middle" fill="#555">0</text>
      
      <rect x="455" y="390" width="40" height="40" fill="white" stroke="#BDC3C7" stroke-width="1"/>
      <text x="475" y="415" font-size="11" text-anchor="middle" fill="#555">0</text>
      
      <text x="360" y="460" font-size="10" text-anchor="middle" fill="#2980B9">Dance Movies</text>
    </g>
    
    <!-- Equals sign -->
    <text x="530" y="420" font-size="24" font-weight="bold" text-anchor="middle" fill="#34495E">=</text>
    
    <!-- Result matrix -->
    <g id="result-matrix">
      <rect x="570" y="320" width="280" height="200" fill="#FADBD8" stroke="#E74C3C" stroke-width="2"/>
      <text x="710" y="310" font-size="13" font-weight="bold" text-anchor="middle" fill="#E74C3C">U ⊗ V</text>
      
      <!-- Top-left block (the pattern) -->
      <rect x="620" y="380" width="130" height="70" fill="#E74C3C" opacity="0.8"/>
      <text x="685" y="420" font-size="13" font-weight="bold" text-anchor="middle" fill="white">Block of 1's</text>
      
      <!-- Rest is zeros -->
      <text x="600" y="375" font-size="10" text-anchor="middle" fill="#7F8C8D">0's</text>
      <text x="780" y="375" font-size="10" text-anchor="middle" fill="#7F8C8D">0's</text>
      <text x="600" y="490" font-size="10" text-anchor="middle" fill="#7F8C8D">0's</text>
      <text x="780" y="490" font-size="10" text-anchor="middle" fill="#7F8C8D">0's</text>
      
      <text x="710" y="540" font-size="10" text-anchor="middle" fill="#555">Pattern captures preference structure</text>
    </g>
  </g>
  
  <!-- Information Box -->
  <g id="info-box">
    <rect x="100" y="560" width="900" height="110" fill="#ECF0F1" stroke="#34495E" stroke-width="2" rx="8"/>
    
    <text x="550" y="590" font-size="15" font-weight="bold" text-anchor="middle" fill="#2C3E50">
      Key Insights
    </text>
    
    <text x="120" y="615" font-size="12" text-anchor="start" fill="#555">
      • Each block represents a homogeneous group of users × movies with specific preferences
    </text>
    
    <text x="120" y="635" font-size="12" text-anchor="start" fill="#555">
      • Blocks can overlap: Users may belong to multiple preference groups
    </text>
    
    <text x="120" y="655" font-size="12" text-anchor="start" fill="#555">
      • SVD recovers these blocks even from partial observations (missing ratings)
    </text>
    
    <text x="550" y="695" font-size="11" font-style="italic" text-anchor="middle" fill="#7F8C8D">
      M ≈ B + σ₁(U₁ ⊗ V₁) + σ₂(U₂ ⊗ V₂) + ... + σₖ(Uₖ ⊗ Vₖ)
    </text>
  </g>
  
  <!-- Legend -->
  <g id="legend">
    <rect x="50" y="700" width="140" height="70" fill="white" stroke="#BDC3C7" stroke-width="1" rx="5"/>
    <text x="120" y="720" font-size="11" font-weight="bold" text-anchor="middle" fill="#2C3E50">Legend</text>
    
    <rect x="60" y="730" width="15" height="15" fill="#AED6F1"/>
    <text x="82" y="742" font-size="10" text-anchor="start" fill="#555">Central Cluster</text>
    
    <rect x="60" y="750" width="15" height="15" fill="#E74C3C"/>
    <text x="82" y="762" font-size="10" text-anchor="start" fill="#555">Specific Pattern</text>
  </g>
</svg>