<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="900" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">The Wikipedia Phenomenon: Growing Clusters with Streaming Data</text>
  
  <!-- Stage 1: Small Dataset -->
  <rect x="50" y="60" width="240" height="200" fill="#e8f4fd" stroke="#3498db" stroke-width="2" rx="5"/>
  <text x="170" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Small Dataset (100 articles)</text>
  <text x="170" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">K = 3 clusters</text>
  
  <!-- Cluster 1: Arts -->
  <circle cx="120" cy="140" r="25" fill="#e74c3c" opacity="0.7"/>
  <text x="120" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">ARTS</text>
  <g fill="#c0392b" opacity="0.8">
    <circle cx="110" cy="130" r="3"/>
    <circle cx="130" cy="135" r="3"/>
    <circle cx="115" cy="150" r="3"/>
    <circle cx="125" cy="125" r="3"/>
    <circle cx="135" cy="145" r="3"/>
  </g>
  
  <!-- Cluster 2: Sports -->
  <circle cx="220" cy="140" r="25" fill="#3498db" opacity="0.7"/>
  <text x="220" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">SPORTS</text>
  <g fill="#2980b9" opacity="0.8">
    <circle cx="210" cy="130" r="3"/>
    <circle cx="230" cy="135" r="3"/>
    <circle cx="215" cy="150" r="3"/>
    <circle cx="225" cy="125" r="3"/>
    <circle cx="235" cy="145" r="3"/>
  </g>
  
  <!-- Cluster 3: Science -->
  <circle cx="170" cy="200" r="25" fill="#27ae60" opacity="0.7"/>
  <text x="170" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">SCIENCE</text>
  <g fill="#229954" opacity="0.8">
    <circle cx="160" cy="190" r="3"/>
    <circle cx="180" cy="195" r="3"/>
    <circle cx="165" cy="210" r="3"/>
    <circle cx="175" cy="185" r="3"/>
    <circle cx="185" cy="205" r="3"/>
  </g>
  
  <!-- Arrow 1 -->
  <path d="M 300 160 L 340 160" stroke="#34495e" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="320" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#34495e">More data</text>
  
  <!-- Stage 2: Medium Dataset -->
  <rect x="370" y="60" width="240" height="200" fill="#f0f8f0" stroke="#27ae60" stroke-width="2" rx="5"/>
  <text x="490" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Medium Dataset (1,000 articles)</text>
  <text x="490" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">K = 5 clusters</text>
  
  <!-- Original clusters (smaller) -->
  <circle cx="420" cy="130" r="18" fill="#e74c3c" opacity="0.7"/>
  <text x="420" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="white">ARTS</text>
  
  <circle cx="520" cy="130" r="18" fill="#3498db" opacity="0.7"/>
  <text x="520" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="white">SPORTS</text>
  
  <circle cx="470" cy="170" r="18" fill="#27ae60" opacity="0.7"/>
  <text x="470" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="white">SCIENCE</text>
  
  <!-- New clusters -->
  <circle cx="560" cy="170" r="18" fill="#9b59b6" opacity="0.7"/>
  <text x="560" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="white">POLITICS</text>
  
  <circle cx="420" cy="210" r="18" fill="#f39c12" opacity="0.7"/>
  <text x="420" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="white">MEDICINE</text>
  
  <!-- Data points -->
  <g fill="#2c3e50" opacity="0.6">
    <circle cx="410" cy="120" r="2"/>
    <circle cx="430" cy="125" r="2"/>
    <circle cx="425" cy="140" r="2"/>
    <circle cx="510" cy="120" r="2"/>
    <circle cx="530" cy="125" r="2"/>
    <circle cx="525" cy="140" r="2"/>
    <circle cx="460" cy="160" r="2"/>
    <circle cx="480" cy="165" r="2"/>
    <circle cx="475" cy="180" r="2"/>
    <circle cx="550" cy="160" r="2"/>
    <circle cx="570" cy="165" r="2"/>
    <circle cx="565" cy="180" r="2"/>
    <circle cx="410" cy="200" r="2"/>
    <circle cx="430" cy="205" r="2"/>
    <circle cx="425" cy="220" r="2"/>
  </g>
  
  <!-- Arrow 2 -->
  <path d="M 620 160 L 660 160" stroke="#34495e" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="640" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#34495e">Even more data</text>
  
  <!-- Stage 3: Large Dataset -->
  <rect x="690" y="60" width="180" height="200" fill="#fff3cd" stroke="#f39c12" stroke-width="2" rx="5"/>
  <text x="780" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Large Dataset</text>
  <text x="780" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">(1M+ articles)</text>
  <text x="780" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">K = 15+ clusters</text>
  
  <!-- Many small clusters -->
  <g>
    <circle cx="720" cy="130" r="12" fill="#e74c3c" opacity="0.7"/>
    <circle cx="750" cy="130" r="12" fill="#3498db" opacity="0.7"/>
    <circle cx="780" cy="130" r="12" fill="#27ae60" opacity="0.7"/>
    <circle cx="810" cy="130" r="12" fill="#9b59b6" opacity="0.7"/>
    <circle cx="840" cy="130" r="12" fill="#f39c12" opacity="0.7"/>
    
    <circle cx="720" cy="160" r="12" fill="#e67e22" opacity="0.7"/>
    <circle cx="750" cy="160" r="12" fill="#1abc9c" opacity="0.7"/>
    <circle cx="780" cy="160" r="12" fill="#34495e" opacity="0.7"/>
    <circle cx="810" cy="160" r="12" fill="#e91e63" opacity="0.7"/>
    <circle cx="840" cy="160" r="12" fill="#795548" opacity="0.7"/>
    
    <circle cx="720" cy="190" r="12" fill="#ff5722" opacity="0.7"/>
    <circle cx="750" cy="190" r="12" fill="#607d8b" opacity="0.7"/>
    <circle cx="780" cy="190" r="12" fill="#4caf50" opacity="0.7"/>
    <circle cx="810" cy="190" r="12" fill="#ff9800" opacity="0.7"/>
    <circle cx="840" cy="190" r="12" fill="#673ab7" opacity="0.7"/>
  </g>
  
  <!-- Data points for large dataset -->
  <g fill="#2c3e50" opacity="0.4">
    <circle cx="715" cy="125" r="1.5"/>
    <circle cx="725" cy="135" r="1.5"/>
    <circle cx="745" cy="125" r="1.5"/>
    <circle cx="755" cy="135" r="1.5"/>
    <circle cx="775" cy="125" r="1.5"/>
    <circle cx="785" cy="135" r="1.5"/>
    <circle cx="805" cy="125" r="1.5"/>
    <circle cx="815" cy="135" r="1.5"/>
    <circle cx="835" cy="125" r="1.5"/>
    <circle cx="845" cy="135" r="1.5"/>
  </g>
  
  <!-- Mathematical Relationship -->
  <rect x="50" y="300" width="800" height="120" fill="#f5f5f5" stroke="#95a5a6" stroke-width="2" rx="5"/>
  <text x="450" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Mathematical Relationship: K = f(N)</text>
  
  <!-- Equation -->
  <text x="450" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">Number of clusters grows with data size</text>
  <text x="450" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#e74c3c">K ∝ log(N) or K ∝ √N</text>
  <text x="450" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">Where K = number of clusters, N = number of data points</text>
  <text x="450" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">This violates K-Means assumption of fixed K</text>
  
  <!-- Real-world Examples -->
  <rect x="50" y="450" width="800" height="130" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2" rx="5"/>
  <text x="450" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Real-World Examples of Growing Clusters</text>
  
  <g font-family="Arial, sans-serif" font-size="12">
    <!-- Column 1 -->
    <text x="80" y="490" font-weight="bold" fill="#e74c3c">Species Discovery:</text>
    <text x="80" y="505" fill="#2c3e50">• ~18,000 new species/year</text>
    <text x="80" y="520" fill="#2c3e50">• Clusters grow with exploration</text>
    
    <!-- Column 2 -->
    <text x="280" y="490" font-weight="bold" fill="#3498db">Social Networks:</text>
    <text x="280" y="505" fill="#2c3e50">• New communities form</text>
    <text x="280" y="520" fill="#2c3e50">• Interest groups multiply</text>
    
    <!-- Column 3 -->
    <text x="480" y="490" font-weight="bold" fill="#27ae60">Fitness Apps:</text>
    <text x="480" y="505" fill="#2c3e50">• New exercise routines</text>
    <text x="480" y="520" fill="#2c3e50">• Behavior patterns evolve</text>
    
    <!-- Column 4 -->
    <text x="680" y="490" font-weight="bold" fill="#9b59b6">Genomics:</text>
    <text x="680" y="505" fill="#2c3e50">• Ancestral populations</text>
    <text x="680" y="520" fill="#2c3e50">• Health conditions</text>
    
    <!-- Solution -->
    <text x="450" y="550" text-anchor="middle" font-weight="bold" fill="#f39c12">Solution: Non-Parametric Bayesian Methods</text>
    <text x="450" y="565" text-anchor="middle" fill="#7f8c8d">Allow K to grow automatically with data size</text>
  </g>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e"/>
    </marker>
  </defs>
</svg>