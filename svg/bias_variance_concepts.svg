<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#00000020"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="700" fill="url(#bgGradient)"/>
  
  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#2c3e50">
    Bias, Variance and Representativeness
  </text>
  
  <!-- Bias vs Variance Visual -->
  <g transform="translate(50, 80)">
    <text x="200" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">
      Bias vs Variance Trade-off
    </text>
    
    <!-- Low Bias, Low Variance -->
    <g transform="translate(20, 40)">
      <circle cx="75" cy="75" r="70" fill="none" stroke="#ddd" stroke-width="2"/>
      <circle cx="75" cy="75" r="50" fill="none" stroke="#ddd" stroke-width="2"/>
      <circle cx="75" cy="75" r="30" fill="none" stroke="#ddd" stroke-width="2"/>
      <circle cx="75" cy="75" r="10" fill="none" stroke="#ddd" stroke-width="2"/>
      <circle cx="75" cy="75" r="3" fill="#FF0000"/>
      
      <circle cx="70" cy="70" r="3" fill="#2196F3"/>
      <circle cx="80" cy="75" r="3" fill="#2196F3"/>
      <circle cx="75" cy="80" r="3" fill="#2196F3"/>
      <circle cx="73" cy="72" r="3" fill="#2196F3"/>
      <circle cx="77" cy="78" r="3" fill="#2196F3"/>
      
      <text x="75" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Low Bias</text>
      <text x="75" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Low Variance</text>
      <text x="75" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#4CAF50">Ideal</text>
    </g>
    
    <!-- Low Bias, High Variance -->
    <g transform="translate(200, 40)">
      <circle cx="75" cy="75" r="70" fill="none" stroke="#ddd" stroke-width="2"/>
      <circle cx="75" cy="75" r="50" fill="none" stroke="#ddd" stroke-width="2"/>
      <circle cx="75" cy="75" r="30" fill="none" stroke="#ddd" stroke-width="2"/>
      <circle cx="75" cy="75" r="10" fill="none" stroke="#ddd" stroke-width="2"/>
      <circle cx="75" cy="75" r="3" fill="#FF0000"/>
      
      <circle cx="55" cy="60" r="3" fill="#2196F3"/>
      <circle cx="90" cy="85" r="3" fill="#2196F3"/>
      <circle cx="65" cy="95" r="3" fill="#2196F3"/>
      <circle cx="85" cy="55" r="3" fill="#2196F3"/>
      <circle cx="75" cy="105" r="3" fill="#2196F3"/>
      
      <text x="75" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Low Bias</text>
      <text x="75" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">High Variance</text>
      <text x="75" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#FF9800">Overfitting</text>
    </g>
    
    <!-- High Bias, Low Variance -->
    <g transform="translate(380, 40)">
      <circle cx="75" cy="75" r="70" fill="none" stroke="#ddd" stroke-width="2"/>
      <circle cx="75" cy="75" r="50" fill="none" stroke="#ddd" stroke-width="2"/>
      <circle cx="75" cy="75" r="30" fill="none" stroke="#ddd" stroke-width="2"/>
      <circle cx="75" cy="75" r="10" fill="none" stroke="#ddd" stroke-width="2"/>
      <circle cx="75" cy="75" r="3" fill="#FF0000"/>
      
      <circle cx="100" cy="50" r="3" fill="#2196F3"/>
      <circle cx="105" cy="55" r="3" fill="#2196F3"/>
      <circle cx="95" cy="45" r="3" fill="#2196F3"/>
      <circle cx="102" cy="48" r="3" fill="#2196F3"/>
      <circle cx="98" cy="52" r="3" fill="#2196F3"/>
      
      <text x="75" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">High Bias</text>
      <text x="75" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Low Variance</text>
      <text x="75" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#FF9800">Underfitting</text>
    </g>
  </g>
  
  <!-- Types of Bias -->
  <g transform="translate(550, 80)">
    <rect x="0" y="0" width="400" height="250" rx="10" fill="#FFF3E0" stroke="#FF9800" stroke-width="2" filter="url(#shadow)"/>
    <text x="200" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">
      Types of Bias in Sampling
    </text>
    
    <!-- Selection Bias -->
    <g transform="translate(20, 40)">
      <text x="0" y="15" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#E65100">Selection Bias</text>
      <circle cx="60" cy="35" r="25" fill="#FF9800" opacity="0.3" stroke="#FF9800"/>
      <text x="60" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Target</text>
      <text x="60" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Population</text>
      
      <circle cx="120" cy="35" r="20" fill="#FF5722" opacity="0.3" stroke="#FF5722"/>
      <text x="120" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Actual</text>
      <text x="120" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Sample</text>
      
      <text x="0" y="75" font-family="Arial, sans-serif" font-size="11" fill="#666">Volunteer bias</text>
      <text x="0" y="88" font-family="Arial, sans-serif" font-size="11" fill="#666">Survivorship bias</text>
      <text x="0" y="101" font-family="Arial, sans-serif" font-size="11" fill="#666">Convenience sampling</text>
    </g>
    
    <!-- Response Bias -->
    <g transform="translate(200, 40)">
      <text x="0" y="15" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#7B1FA2">Response Bias</text>
      
      <rect x="40" y="25" width="40" height="30" fill="#E1BEE7" stroke="#9C27B0"/>
      <line x1="45" y1="32" x2="70" y2="32" stroke="#9C27B0" stroke-width="2"/>
      <line x1="45" y1="38" x2="75" y2="38" stroke="#9C27B0" stroke-width="2"/>
      <line x1="45" y1="44" x2="65" y2="44" stroke="#9C27B0" stroke-width="2"/>
      
      <path d="M 90 40 Q 100 30 110 40 Q 100 50 90 40" fill="#9C27B0" opacity="0.5"/>
      
      <text x="0" y="75" font-family="Arial, sans-serif" font-size="11" fill="#666">Social desirability</text>
      <text x="0" y="88" font-family="Arial, sans-serif" font-size="11" fill="#666">Leading questions</text>
      <text x="0" y="101" font-family="Arial, sans-serif" font-size="11" fill="#666">Non-response bias</text>
    </g>
    
    <!-- Measurement Bias -->
    <g transform="translate(20, 140)">
      <text x="0" y="15" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#388E3C">Measurement Bias</text>
      
      <rect x="40" y="25" width="50" height="8" fill="#C8E6C9" stroke="#4CAF50"/>
      <line x1="65" y1="33" x2="65" y2="45" stroke="#4CAF50" stroke-width="3"/>
      <polygon points="65,45 60,50 70,50" fill="#4CAF50"/>
      
      <path d="M 100 35 L 110 30 L 120 40 L 110 45 Z" fill="#4CAF50" opacity="0.5"/>
      
      <text x="0" y="75" font-family="Arial, sans-serif" font-size="11" fill="#666">Observer bias</text>
      <text x="0" y="88" font-family="Arial, sans-serif" font-size="11" fill="#666">Instrument error</text>
      <text x="0" y="101" font-family="Arial, sans-serif" font-size="11" fill="#666">Confirmation bias</text>
    </g>
    
    <!-- Cognitive Bias -->
    <g transform="translate(200, 140)">
      <text x="0" y="15" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#D32F2F">Cognitive Bias</text>
      
      <ellipse cx="65" cy="40" rx="25" ry="18" fill="#FFCDD2" stroke="#F44336"/>
      <path d="M 50 35 Q 65 30 80 35" fill="none" stroke="#F44336" stroke-width="2"/>
      <path d="M 50 45 Q 65 40 80 45" fill="none" stroke="#F44336" stroke-width="2"/>
      
      <text x="0" y="75" font-family="Arial, sans-serif" font-size="11" fill="#666">Anchoring bias</text>
      <text x="0" y="88" font-family="Arial, sans-serif" font-size="11" fill="#666">Availability heuristic</text>
      <text x="0" y="101" font-family="Arial, sans-serif" font-size="11" fill="#666">Recency effect</text>
    </g>
  </g>
  
  <!-- Variance Formula -->
  <g transform="translate(50, 350)">
    <rect x="0" y="0" width="400" height="180" rx="10" fill="#E3F2FD" stroke="#2196F3" stroke-width="2" filter="url(#shadow)"/>
    <text x="200" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">
      Sources of Variance
    </text>
    
    <g transform="translate(20, 40)">
      <text x="0" y="15" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1976D2">Sampling Variance</text>
      <text x="0" y="35" font-family="Arial, sans-serif" font-size="12" fill="#666">Var(X̄) = σ²/n</text>
      
      <g transform="translate(0, 45)">
        <text x="0" y="15" font-family="Arial, sans-serif" font-size="11" fill="#666">n = 10</text>
        <rect x="40" y="5" width="60" height="15" fill="#2196F3" opacity="0.7"/>
        
        <text x="0" y="35" font-family="Arial, sans-serif" font-size="11" fill="#666">n = 50</text>
        <rect x="40" y="25" width="30" height="15" fill="#2196F3" opacity="0.7"/>
        
        <text x="0" y="55" font-family="Arial, sans-serif" font-size="11" fill="#666">n = 200</text>
        <rect x="40" y="45" width="15" height="15" fill="#2196F3" opacity="0.7"/>
        
        <text x="120" y="35" font-family="Arial, sans-serif" font-size="11" fill="#666">Variance ∝ 1/n</text>
      </g>
    </g>
    
    <g transform="translate(200, 40)">
      <text x="0" y="15" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1976D2">Population Variance</text>
      <text x="0" y="35" font-family="Arial, sans-serif" font-size="12" fill="#666">σ² = E[(X - μ)²]</text>
      
      <g transform="translate(0, 45)">
        <text x="0" y="15" font-family="Arial, sans-serif" font-size="11" fill="#666">Low σ²</text>
        <path d="M 40 10 Q 70 5 100 10" stroke="#4CAF50" stroke-width="3" fill="none"/>
        
        <text x="0" y="35" font-family="Arial, sans-serif" font-size="11" fill="#666">Medium σ²</text>
        <path d="M 40 30 Q 70 20 100 30" stroke="#FF9800" stroke-width="3" fill="none"/>
        
        <text x="0" y="55" font-family="Arial, sans-serif" font-size="11" fill="#666">High σ²</text>
        <path d="M 40 50 Q 70 35 100 50" stroke="#F44336" stroke-width="3" fill="none"/>
        
        <text x="120" y="35" font-family="Arial, sans-serif" font-size="11" fill="#666">More spread = Higher variance</text>
      </g>
    </g>
  </g>
  
  <!-- Total Survey Error -->
  <g transform="translate(50, 560)">
    <rect x="0" y="0" width="900" height="100" rx="10" fill="#FFEBEE" stroke="#F44336" stroke-width="2" filter="url(#shadow)"/>
    <text x="450" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">
      Total Survey Error Framework
    </text>
    
    <g transform="translate(50, 40)">
      <text x="0" y="15" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#D32F2F">Total Error = </text>
      
      <rect x="100" y="0" width="80" height="25" fill="#FFCDD2" stroke="#F44336"/>
      <text x="140" y="16" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Bias²</text>
      
      <text x="190" y="15" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50"> + </text>
      
      <rect x="210" y="0" width="80" height="25" fill="#E1BEE7" stroke="#9C27B0"/>
      <text x="250" y="16" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Variance</text>
      
      <text x="300" y="15" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50"> + </text>
      
      <rect x="320" y="0" width="80" height="25" fill="#C8E6C9" stroke="#4CAF50"/>
      <text x="360" y="16" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Processing</text>
      
      <text x="450" y="15" font-family="Arial, sans-serif" font-size="12" fill="#666">Minimize all components</text>
    </g>
    
    <g transform="translate(50, 70)">
      <text x="0" y="15" font-family="Arial, sans-serif" font-size="12" fill="#666">Strategies: Proper randomization, adequate sample size, careful measurement, quality control</text>
    </g>
  </g>
</svg>