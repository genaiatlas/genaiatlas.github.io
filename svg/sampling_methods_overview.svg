<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="popPattern" patternUnits="userSpaceOnUse" width="6" height="6">
      <circle cx="3" cy="3" r="1.5" fill="#4CAF50" opacity="0.3"/>
    </pattern>
    <pattern id="samplePattern" patternUnits="userSpaceOnUse" width="8" height="8">
      <circle cx="4" cy="4" r="2" fill="#2196F3"/>
    </pattern>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#00000020"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="700" fill="url(#bgGradient)"/>
  
  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#2c3e50">
    Sampling Methods Overview
  </text>
  
  <!-- Population Section -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="280" height="200" rx="10" fill="#4CAF50" opacity="0.1" stroke="#4CAF50" stroke-width="2" filter="url(#shadow)"/>
    <text x="140" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">Population</text>
    <text x="140" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#666">N = Total Population Size</text>
    
    <!-- Population dots -->
    <g transform="translate(20, 60)">
      <circle cx="30" cy="20" r="6" fill="#4CAF50"/>
      <circle cx="60" cy="20" r="6" fill="#4CAF50"/>
      <circle cx="90" cy="20" r="6" fill="#4CAF50"/>
      <circle cx="120" cy="20" r="6" fill="#4CAF50"/>
      <circle cx="150" cy="20" r="6" fill="#4CAF50"/>
      <circle cx="180" cy="20" r="6" fill="#4CAF50"/>
      <circle cx="210" cy="20" r="6" fill="#4CAF50"/>
      <circle cx="240" cy="20" r="6" fill="#4CAF50"/>
      
      <circle cx="15" cy="50" r="6" fill="#4CAF50"/>
      <circle cx="45" cy="50" r="6" fill="#4CAF50"/>
      <circle cx="75" cy="50" r="6" fill="#4CAF50"/>
      <circle cx="105" cy="50" r="6" fill="#4CAF50"/>
      <circle cx="135" cy="50" r="6" fill="#4CAF50"/>
      <circle cx="165" cy="50" r="6" fill="#4CAF50"/>
      <circle cx="195" cy="50" r="6" fill="#4CAF50"/>
      <circle cx="225" cy="50" r="6" fill="#4CAF50"/>
      
      <circle cx="30" cy="80" r="6" fill="#4CAF50"/>
      <circle cx="60" cy="80" r="6" fill="#4CAF50"/>
      <circle cx="90" cy="80" r="6" fill="#4CAF50"/>
      <circle cx="120" cy="80" r="6" fill="#4CAF50"/>
      <circle cx="150" cy="80" r="6" fill="#4CAF50"/>
      <circle cx="180" cy="80" r="6" fill="#4CAF50"/>
      <circle cx="210" cy="80" r="6" fill="#4CAF50"/>
      <circle cx="240" cy="80" r="6" fill="#4CAF50"/>
      
      <circle cx="15" cy="110" r="6" fill="#4CAF50"/>
      <circle cx="45" cy="110" r="6" fill="#4CAF50"/>
      <circle cx="75" cy="110" r="6" fill="#4CAF50"/>
      <circle cx="105" cy="110" r="6" fill="#4CAF50"/>
      <circle cx="135" cy="110" r="6" fill="#4CAF50"/>
      <circle cx="165" cy="110" r="6" fill="#4CAF50"/>
      <circle cx="195" cy="110" r="6" fill="#4CAF50"/>
      <circle cx="225" cy="110" r="6" fill="#4CAF50"/>
    </g>
    
    <text x="10" y="180" font-family="Arial, sans-serif" font-size="12" fill="#666">• Parameter: μ, σ² (unknown)</text>
    <text x="10" y="195" font-family="Arial, sans-serif" font-size="12" fill="#666">• Complete enumeration impossible</text>
  </g>
  
  <!-- Simple Random Sampling -->
  <g transform="translate(380, 80)">
    <rect x="0" y="0" width="280" height="180" rx="10" fill="#2196F3" opacity="0.1" stroke="#2196F3" stroke-width="2" filter="url(#shadow)"/>
    <text x="140" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Simple Random Sampling</text>
    
    <!-- Selected sample dots -->
    <g transform="translate(20, 40)">
      <circle cx="60" cy="20" r="8" fill="#2196F3" stroke="#fff" stroke-width="2"/>
      <circle cx="120" cy="20" r="8" fill="#2196F3" stroke="#fff" stroke-width="2"/>
      <circle cx="180" cy="20" r="8" fill="#2196F3" stroke="#fff" stroke-width="2"/>
      <circle cx="45" cy="60" r="8" fill="#2196F3" stroke="#fff" stroke-width="2"/>
      <circle cx="135" cy="60" r="8" fill="#2196F3" stroke="#fff" stroke-width="2"/>
      <circle cx="195" cy="60" r="8" fill="#2196F3" stroke="#fff" stroke-width="2"/>
      <circle cx="90" cy="100" r="8" fill="#2196F3" stroke="#fff" stroke-width="2"/>
      <circle cx="150" cy="100" r="8" fill="#2196F3" stroke="#fff" stroke-width="2"/>
    </g>
    
    <text x="10" y="150" font-family="Arial, sans-serif" font-size="12" fill="#666">• Equal selection probability</text>
    <text x="10" y="165" font-family="Arial, sans-serif" font-size="12" fill="#666">• Statistic: x̄, s² (observed)</text>
  </g>
  
  <!-- Stratified Sampling -->
  <g transform="translate(720, 80)">
    <rect x="0" y="0" width="250" height="180" rx="10" fill="#FF9800" opacity="0.1" stroke="#FF9800" stroke-width="2" filter="url(#shadow)"/>
    <text x="125" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Stratified Sampling</text>
    
    <!-- Strata -->
    <rect x="20" y="40" width="60" height="50" fill="#FF5722" opacity="0.3" stroke="#FF5722"/>
    <text x="50" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Stratum 1</text>
    <circle cx="35" cy="70" r="4" fill="#FF5722"/>
    <circle cx="50" cy="70" r="4" fill="#FF5722"/>
    <circle cx="65" cy="70" r="4" fill="#FF5722"/>
    
    <rect x="95" y="40" width="60" height="50" fill="#9C27B0" opacity="0.3" stroke="#9C27B0"/>
    <text x="125" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Stratum 2</text>
    <circle cx="110" cy="70" r="4" fill="#9C27B0"/>
    <circle cx="125" cy="70" r="4" fill="#9C27B0"/>
    <circle cx="140" cy="70" r="4" fill="#9C27B0"/>
    
    <rect x="170" y="40" width="60" height="50" fill="#795548" opacity="0.3" stroke="#795548"/>
    <text x="200" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Stratum 3</text>
    <circle cx="185" cy="70" r="4" fill="#795548"/>
    <circle cx="200" cy="70" r="4" fill="#795548"/>
    <circle cx="215" cy="70" r="4" fill="#795548"/>
    
    <!-- Selected samples -->
    <g transform="translate(0, 100)">
      <circle cx="50" cy="20" r="6" fill="#FF5722" stroke="#fff" stroke-width="2"/>
      <circle cx="125" cy="20" r="6" fill="#9C27B0" stroke="#fff" stroke-width="2"/>
      <circle cx="200" cy="20" r="6" fill="#795548" stroke="#fff" stroke-width="2"/>
    </g>
    
    <text x="10" y="150" font-family="Arial, sans-serif" font-size="12" fill="#666">• Sample from each stratum</text>
    <text x="10" y="165" font-family="Arial, sans-serif" font-size="12" fill="#666">• Ensures representation</text>
  </g>
  
  <!-- Cluster Sampling -->
  <g transform="translate(50, 320)">
    <rect x="0" y="0" width="280" height="200" rx="10" fill="#9C27B0" opacity="0.1" stroke="#9C27B0" stroke-width="2" filter="url(#shadow)"/>
    <text x="140" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Cluster Sampling</text>
    
    <!-- Clusters -->
    <g transform="translate(20, 40)">
      <!-- Cluster 1 (selected) -->
      <rect x="0" y="0" width="70" height="60" fill="#9C27B0" opacity="0.3" stroke="#9C27B0" stroke-width="3"/>
      <text x="35" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Cluster 1</text>
      <circle cx="20" cy="30" r="4" fill="#9C27B0"/>
      <circle cx="35" cy="30" r="4" fill="#9C27B0"/>
      <circle cx="50" cy="30" r="4" fill="#9C27B0"/>
      <circle cx="20" cy="45" r="4" fill="#9C27B0"/>
      <circle cx="35" cy="45" r="4" fill="#9C27B0"/>
      <circle cx="50" cy="45" r="4" fill="#9C27B0"/>
      
      <!-- Cluster 2 (not selected) -->
      <rect x="85" y="0" width="70" height="60" fill="#e0e0e0" opacity="0.3" stroke="#999"/>
      <text x="120" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Cluster 2</text>
      <circle cx="105" cy="30" r="4" fill="#999"/>
      <circle cx="120" cy="30" r="4" fill="#999"/>
      <circle cx="135" cy="30" r="4" fill="#999"/>
      <circle cx="105" cy="45" r="4" fill="#999"/>
      <circle cx="120" cy="45" r="4" fill="#999"/>
      <circle cx="135" cy="45" r="4" fill="#999"/>
      
      <!-- Cluster 3 (selected) -->
      <rect x="170" y="0" width="70" height="60" fill="#9C27B0" opacity="0.3" stroke="#9C27B0" stroke-width="3"/>
      <text x="205" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Cluster 3</text>
      <circle cx="190" cy="30" r="4" fill="#9C27B0"/>
      <circle cx="205" cy="30" r="4" fill="#9C27B0"/>
      <circle cx="220" cy="30" r="4" fill="#9C27B0"/>
      <circle cx="190" cy="45" r="4" fill="#9C27B0"/>
      <circle cx="205" cy="45" r="4" fill="#9C27B0"/>
      <circle cx="220" cy="45" r="4" fill="#9C27B0"/>
      
      <!-- Cluster 4 (not selected) -->
      <rect x="0" y="80" width="70" height="60" fill="#e0e0e0" opacity="0.3" stroke="#999"/>
      <text x="35" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Cluster 4</text>
      <circle cx="20" cy="110" r="4" fill="#999"/>
      <circle cx="35" cy="110" r="4" fill="#999"/>
      <circle cx="50" cy="110" r="4" fill="#999"/>
      <circle cx="20" cy="125" r="4" fill="#999"/>
      <circle cx="35" cy="125" r="4" fill="#999"/>
      <circle cx="50" cy="125" r="4" fill="#999"/>
      
      <!-- Cluster 5 (not selected) -->
      <rect x="85" y="80" width="70" height="60" fill="#e0e0e0" opacity="0.3" stroke="#999"/>
      <text x="120" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Cluster 5</text>
      <circle cx="105" cy="110" r="4" fill="#999"/>
      <circle cx="120" cy="110" r="4" fill="#999"/>
      <circle cx="135" cy="110" r="4" fill="#999"/>
      <circle cx="105" cy="125" r="4" fill="#999"/>
      <circle cx="120" cy="125" r="4" fill="#999"/>
      <circle cx="135" cy="125" r="4" fill="#999"/>
      
      <!-- Cluster 6 (selected) -->
      <rect x="170" y="80" width="70" height="60" fill="#9C27B0" opacity="0.3" stroke="#9C27B0" stroke-width="3"/>
      <text x="205" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Cluster 6</text>
      <circle cx="190" cy="110" r="4" fill="#9C27B0"/>
      <circle cx="205" cy="110" r="4" fill="#9C27B0"/>
      <circle cx="220" cy="110" r="4" fill="#9C27B0"/>
      <circle cx="190" cy="125" r="4" fill="#9C27B0"/>
      <circle cx="205" cy="125" r="4" fill="#9C27B0"/>
      <circle cx="220" cy="125" r="4" fill="#9C27B0"/>
    </g>
    
    <text x="10" y="170" font-family="Arial, sans-serif" font-size="12" fill="#666">• Sample entire clusters</text>
    <text x="10" y="185" font-family="Arial, sans-serif" font-size="12" fill="#666">• Cost-effective for geography</text>
  </g>
  
  <!-- Central Limit Theorem -->
  <g transform="translate(380, 320)">
    <rect x="0" y="0" width="300" height="200" rx="10" fill="#FF5722" opacity="0.1" stroke="#FF5722" stroke-width="2" filter="url(#shadow)"/>
    <text x="150" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Central Limit Theorem</text>
    
    <!-- Population distribution (skewed) -->
    <text x="20" y="50" font-family="Arial, sans-serif" font-size="12" fill="#666">Population (any distribution)</text>
    <path d="M 30 70 Q 50 55 80 60 Q 120 65 150 80 Q 180 90 210 100" stroke="#FF5722" stroke-width="2" fill="none"/>
    <path d="M 30 70 L 30 100 L 210 100 L 210 100 Z" fill="#FF5722" opacity="0.2"/>
    
    <!-- Sample means distribution (normal) -->
    <text x="20" y="130" font-family="Arial, sans-serif" font-size="12" fill="#666">Sample Means (n ≥ 30)</text>
    <path d="M 30 150 Q 120 135 210 150" stroke="#2196F3" stroke-width="3" fill="none"/>
    <path d="M 30 150 Q 60 145 90 148 Q 120 135 150 148 Q 180 145 210 150 L 210 170 L 30 170 Z" fill="#2196F3" opacity="0.3"/>
    
    <!-- Formula -->
    <text x="20" y="190" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">X̄ ~ N(μ, σ²/n)</text>
    
    <!-- Arrow -->
    <path d="M 120 110 L 120 125" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- Comparison Table -->
  <g transform="translate(720, 320)">
    <rect x="0" y="0" width="250" height="200" rx="10" fill="#607D8B" opacity="0.1" stroke="#607D8B" stroke-width="2" filter="url(#shadow)"/>
    <text x="125" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Method Comparison</text>
    
    <!-- Table -->
    <line x1="20" y1="45" x2="230" y2="45" stroke="#333" stroke-width="1"/>
    <text x="30" y="40" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Method</text>
    <text x="120" y="40" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Precision</text>
    <text x="180" y="40" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Cost</text>
    
    <line x1="20" y1="55" x2="230" y2="55" stroke="#666" stroke-width="0.5"/>
    <text x="30" y="70" font-family="Arial, sans-serif" font-size="11" fill="#666">Simple Random</text>
    <text x="120" y="70" font-family="Arial, sans-serif" font-size="11" fill="#666">Medium</text>
    <text x="180" y="70" font-family="Arial, sans-serif" font-size="11" fill="#666">Medium</text>
    
    <line x1="20" y1="80" x2="230" y2="80" stroke="#666" stroke-width="0.5"/>
    <text x="30" y="95" font-family="Arial, sans-serif" font-size="11" fill="#666">Stratified</text>
    <text x="120" y="95" font-family="Arial, sans-serif" font-size="11" fill="#666">High</text>
    <text x="180" y="95" font-family="Arial, sans-serif" font-size="11" fill="#666">High</text>
    
    <line x1="20" y1="105" x2="230" y2="105" stroke="#666" stroke-width="0.5"/>
    <text x="30" y="120" font-family="Arial, sans-serif" font-size="11" fill="#666">Cluster</text>
    <text x="120" y="120" font-family="Arial, sans-serif" font-size="11" fill="#666">Lower</text>
    <text x="180" y="120" font-family="Arial, sans-serif" font-size="11" fill="#666">Low</text>
    
    <line x1="20" y1="130" x2="230" y2="130" stroke="#666" stroke-width="0.5"/>
    <text x="30" y="145" font-family="Arial, sans-serif" font-size="11" fill="#666">Systematic</text>
    <text x="120" y="145" font-family="Arial, sans-serif" font-size="11" fill="#666">Medium</text>
    <text x="180" y="145" font-family="Arial, sans-serif" font-size="11" fill="#666">Low</text>
    
    <text x="30" y="170" font-family="Arial, sans-serif" font-size="10" fill="#666">Choose based on:</text>
    <text x="30" y="185" font-family="Arial, sans-serif" font-size="10" fill="#666">• Budget constraints</text>
    <text x="30" y="195" font-family="Arial, sans-serif" font-size="10" fill="#666">• Required precision</text>
  </g>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Key Takeaways -->
  <g transform="translate(50, 580)">
    <rect x="0" y="0" width="900" height="80" rx="10" fill="#E8F5E8" stroke="#4CAF50" stroke-width="2" filter="url(#shadow)"/>
    <text x="20" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Key Takeaways</text>
    <text x="20" y="45" font-family="Arial, sans-serif" font-size="13" fill="#666">• Sampling method choice depends on population structure, budget, and precision requirements</text>
    <text x="20" y="60" font-family="Arial, sans-serif" font-size="13" fill="#666">• Central Limit Theorem enables inference regardless of population distribution (n ≥ 30)</text>
    <text x="20" y="75" font-family="Arial, sans-serif" font-size="13" fill="#666">• Stratified sampling increases precision when strata are homogeneous within but heterogeneous between</text>
  </g>
</svg>