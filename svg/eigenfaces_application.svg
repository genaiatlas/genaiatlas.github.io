<svg viewBox="0 0 900 650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F7DC6F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F4D03F;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="eigenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8E44AD;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6C3483;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="vectorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498DB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980B9;stop-opacity:1" />
    </linearGradient>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
     refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2C3E50"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="650" fill="#F8F9FA"/>
  
  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2C3E50">
    PCA Application: Eigenfaces for Facial Recognition
  </text>
  
  <!-- Face Image Representation -->
  <rect x="50" y="80" width="200" height="220" fill="url(#faceGrad)" stroke="#F39C12" stroke-width="3" rx="10"/>
  <text x="150" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2C3E50">
    Original Face Image
  </text>
  
  <!-- Simulated face using simple shapes -->
  <ellipse cx="150" cy="160" rx="50" ry="60" fill="#FADBD8" stroke="#E74C3C" stroke-width="2"/>
  <circle cx="135" cy="145" r="5" fill="#2C3E50"/>
  <circle cx="165" cy="145" r="5" fill="#2C3E50"/>
  <ellipse cx="150" cy="165" rx="3" ry="5" fill="#2C3E50"/>
  <path d="M 135 180 Q 150 190 165 180" stroke="#2C3E50" stroke-width="2" fill="none"/>
  
  <text x="150" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">
    64 × 64 pixels
  </text>
  <text x="150" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">
    = 4,096 dimensions
  </text>
  <text x="150" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#E74C3C">
    High Dimensional!
  </text>
  
  <!-- Arrow 1 -->
  <path d="M 270 190 L 330 190" stroke="#2C3E50" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="300" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">Convert</text>
  <text x="300" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">to Vector</text>
  
  <!-- Vector Representation -->
  <rect x="350" y="80" width="150" height="220" fill="url(#vectorGrad)" stroke="#3498DB" stroke-width="3" rx="10"/>
  <text x="425" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    Pixel Vector
  </text>
  
  <!-- Simulated vector elements -->
  <rect x="365" y="120" width="120" height="15" fill="#ECF0F1" rx="2"/>
  <text x="425" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2C3E50">pixel₁, pixel₂, ...</text>
  
  <rect x="365" y="140" width="120" height="15" fill="#ECF0F1" rx="2"/>
  <text x="425" y="152" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2C3E50">pixel₆₅, pixel₆₆, ...</text>
  
  <text x="425" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">⋮</text>
  
  <rect x="365" y="185" width="120" height="15" fill="#ECF0F1" rx="2"/>
  <text x="425" y="197" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2C3E50">pixel₄₀₉₅, pixel₄₀₉₆</text>
  
  <text x="425" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
    X = [x₁, x₂, ..., x₄₀₉₆]ᵀ
  </text>
  
  <text x="425" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#D6EAF8">
    Each face = one vector
  </text>
  <text x="425" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#D6EAF8">
    in 4,096D space
  </text>
  
  <!-- Arrow 2 -->
  <path d="M 520 190 L 580 190" stroke="#2C3E50" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="550" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">Apply</text>
  <text x="550" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">PCA</text>
  
  <!-- Eigenfaces -->
  <rect x="600" y="80" width="250" height="220" fill="url(#eigenGrad)" stroke="#8E44AD" stroke-width="3" rx="10"/>
  <text x="725" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
    Eigenfaces (Principal Components)
  </text>
  
  <!-- Eigenface 1 -->
  <rect x="620" y="120" width="50" height="60" fill="#D5DBDB" stroke="#85929E" stroke-width="1" rx="3"/>
  <text x="645" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2C3E50">EF₁</text>
  <text x="645" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">λ₁=45%</text>
  
  <!-- Eigenface 2 -->
  <rect x="680" y="120" width="50" height="60" fill="#D5DBDB" stroke="#85929E" stroke-width="1" rx="3"/>
  <text x="705" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2C3E50">EF₂</text>
  <text x="705" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">λ₂=23%</text>
  
  <!-- Eigenface 3 -->
  <rect x="740" y="120" width="50" height="60" fill="#D5DBDB" stroke="#85929E" stroke-width="1" rx="3"/>
  <text x="765" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2C3E50">EF₃</text>
  <text x="765" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">λ₃=12%</text>
  
  <!-- Eigenface 4 -->
  <rect x="800" y="120" width="40" height="60" fill="#D5DBDB" stroke="#85929E" stroke-width="1" rx="3"/>
  <text x="820" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2C3E50">EF₄</text>
  <text x="820" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">λ₄=8%</text>
  
  <text x="725" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Ghostly face patterns capturing key facial variations
  </text>
  <text x="725" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#D2B4DE">
    50-100 eigenfaces capture ~95% of facial information
  </text>
  <text x="725" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#D2B4DE">
    Massive dimensionality reduction: 4,096 → 50-100
  </text>
  
  <!-- Reconstruction Formula -->
  <rect x="100" y="340" width="700" height="100" fill="#34495E" rx="10"/>
  <text x="450" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">
    Face Reconstruction Formula
  </text>
  <text x="450" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="white">
    Face ≈ μ + w₁×EF₁ + w₂×EF₂ + w₃×EF₃ + ... + wₖ×EFₖ
  </text>
  <text x="450" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#BDC3C7">
    Mean Face + Linear combination of top k eigenfaces
  </text>
  <text x="450" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#BDC3C7">
    Weights (w₁, w₂, ..., wₖ) uniquely identify each person
  </text>
  
  <!-- Benefits -->
  <rect x="50" y="470" width="380" height="150" fill="#ECF0F1" stroke="#BDC3C7" stroke-width="2" rx="10"/>
  <text x="240" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2C3E50">
    Key Benefits
  </text>
  
  <circle cx="70" cy="520" r="5" fill="#E74C3C"/>
  <text x="85" y="525" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">
    <tspan font-weight="bold">Compression:</tspan> 4,096 → 50-100 dimensions
  </text>
  
  <circle cx="70" cy="545" r="5" fill="#2ECC71"/>
  <text x="85" y="550" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">
    <tspan font-weight="bold">Speed:</tspan> Faster recognition in lower dimensions
  </text>
  
  <circle cx="70" cy="570" r="5" fill="#3498DB"/>
  <text x="85" y="575" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">
    <tspan font-weight="bold">Noise Reduction:</tspan> Filters out irrelevant details
  </text>
  
  <circle cx="70" cy="595" r="5" fill="#F39C12"/>
  <text x="85" y="600" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">
    <tspan font-weight="bold">Generalization:</tspan> Works across lighting/angles
  </text>
  
  <!-- Applications -->
  <rect x="470" y="470" width="380" height="150" fill="#ECF0F1" stroke="#BDC3C7" stroke-width="2" rx="10"/>
  <text x="660" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2C3E50">
    Real-World Applications
  </text>
  
  <circle cx="490" cy="520" r="5" fill="#9B59B6"/>
  <text x="505" y="525" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">
    <tspan font-weight="bold">Security Systems:</tspan> Access control
  </text>
  
  <circle cx="490" cy="545" r="5" fill="#E67E22"/>
  <text x="505" y="550" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">
    <tspan font-weight="bold">Photo Tagging:</tspan> Automatic face identification
  </text>
  
  <circle cx="490" cy="570" r="5" fill="#1ABC9C"/>
  <text x="505" y="575" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">
    <tspan font-weight="bold">Surveillance:</tspan> Person tracking &amp; recognition
  </text>
  
  <circle cx="490" cy="595" r="5" fill="#E74C3C"/>
  <text x="505" y="600" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">
    <tspan font-weight="bold">Authentication:</tspan> Biometric login systems
  </text>
</svg>