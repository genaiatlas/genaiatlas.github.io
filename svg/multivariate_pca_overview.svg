<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dataGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#7B68EE;stop-opacity:0.3"/>
    </linearGradient>
    <linearGradient id="pcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#FF8E8E;stop-opacity:0.3"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="600" fill="#FAFAFA"/>
  
  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2C3E50">
    Multivariate PCA Overview: From Raw Data to Principal Components
  </text>
  
  <!-- Original Data Cloud -->
  <g transform="translate(120, 120)">
    <text x="80" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2C3E50">Original Data (X)</text>
    <ellipse cx="80" cy="80" rx="60" ry="30" fill="url(#dataGrad)" stroke="#4A90E2" stroke-width="2"/>
    
    <!-- Data points -->
    <circle cx="50" cy="70" r="3" fill="#4A90E2"/>
    <circle cx="65" cy="85" r="3" fill="#4A90E2"/>
    <circle cx="95" cy="75" r="3" fill="#4A90E2"/>
    <circle cx="75" cy="90" r="3" fill="#4A90E2"/>
    <circle cx="85" cy="65" r="3" fill="#4A90E2"/>
    <circle cx="60" cy="80" r="3" fill="#4A90E2"/>
    <circle cx="100" cy="85" r="3" fill="#4A90E2"/>
    <circle cx="70" cy="70" r="3" fill="#4A90E2"/>
    
    <!-- Axes -->
    <line x1="20" y1="120" x2="140" y2="120" stroke="#666" stroke-width="1" marker-end="url(#arrowhead)"/>
    <line x1="20" y1="120" x2="20" y2="40" stroke="#666" stroke-width="1" marker-end="url(#arrowhead)"/>
    <text x="145" y="125" font-family="Arial, sans-serif" font-size="12" fill="#666">X₁</text>
    <text x="15" y="35" font-family="Arial, sans-serif" font-size="12" fill="#666">X₂</text>
  </g>
  
  <!-- Arrow 1 -->
  <g transform="translate(280, 200)">
    <path d="M 0 0 L 50 0" stroke="#E74C3C" stroke-width="3" fill="none" marker-end="url(#redArrow)"/>
    <text x="25" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#E74C3C">Center Data</text>
  </g>
  
  <!-- Centered Data -->
  <g transform="translate(360, 120)">
    <text x="80" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2C3E50">Centered Data</text>
    <ellipse cx="80" cy="80" rx="60" ry="30" fill="url(#dataGrad)" stroke="#4A90E2" stroke-width="2"/>
    
    <!-- Centered data points -->
    <circle cx="50" cy="70" r="3" fill="#4A90E2"/>
    <circle cx="65" cy="85" r="3" fill="#4A90E2"/>
    <circle cx="95" cy="75" r="3" fill="#4A90E2"/>
    <circle cx="75" cy="90" r="3" fill="#4A90E2"/>
    <circle cx="85" cy="65" r="3" fill="#4A90E2"/>
    <circle cx="60" cy="80" r="3" fill="#4A90E2"/>
    <circle cx="100" cy="85" r="3" fill="#4A90E2"/>
    <circle cx="70" cy="70" r="3" fill="#4A90E2"/>
    
    <!-- Mean point -->
    <circle cx="80" cy="80" r="4" fill="#E74C3C"/>
    <text x="85" y="85" font-family="Arial, sans-serif" font-size="10" fill="#E74C3C">μ</text>
    
    <!-- Axes -->
    <line x1="20" y1="80" x2="140" y2="80" stroke="#666" stroke-width="1" marker-end="url(#arrowhead)"/>
    <line x1="80" y1="120" x2="80" y2="40" stroke="#666" stroke-width="1" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- Arrow 2 -->
  <g transform="translate(520, 200)">
    <path d="M 0 0 L 50 0" stroke="#E74C3C" stroke-width="3" fill="none" marker-end="url(#redArrow)"/>
    <text x="25" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#E74C3C">Covariance</text>
    <text x="25" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#E74C3C">Matrix</text>
  </g>
  
  <!-- PCA Transformation -->
  <g transform="translate(600, 120)">
    <text x="80" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2C3E50">Principal Components</text>
    <ellipse cx="80" cy="80" rx="80" ry="20" fill="url(#pcGrad)" stroke="#FF6B6B" stroke-width="2"/>
    
    <!-- PC data points -->
    <circle cx="40" cy="80" r="3" fill="#FF6B6B"/>
    <circle cx="55" cy="75" r="3" fill="#FF6B6B"/>
    <circle cx="105" cy="85" r="3" fill="#FF6B6B"/>
    <circle cx="75" cy="80" r="3" fill="#FF6B6B"/>
    <circle cx="95" cy="75" r="3" fill="#FF6B6B"/>
    <circle cx="60" cy="85" r="3" fill="#FF6B6B"/>
    <circle cx="120" cy="80" r="3" fill="#FF6B6B"/>
    <circle cx="80" cy="75" r="3" fill="#FF6B6B"/>
    
    <!-- PC axes -->
    <line x1="10" y1="80" x2="150" y2="80" stroke="#FF6B6B" stroke-width="2" marker-end="url(#redArrow)"/>
    <line x1="80" y1="110" x2="80" y2="50" stroke="#FF6B6B" stroke-width="2" marker-end="url(#redArrow)"/>
    <text x="155" y="85" font-family="Arial, sans-serif" font-size="12" fill="#FF6B6B" font-weight="bold">PC₁</text>
    <text x="75" y="45" font-family="Arial, sans-serif" font-size="12" fill="#FF6B6B" font-weight="bold">PC₂</text>
  </g>
  
  <!-- Mathematical formulas -->
  <g transform="translate(50, 320)">
    <rect x="0" y="0" width="900" height="250" fill="#F8F9FA" stroke="#DDD" stroke-width="1" rx="5" filter="url(#shadow)"/>
    
    <text x="20" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2C3E50">Key Mathematical Relationships:</text>
    
    <!-- Covariance Matrix -->
    <text x="30" y="50" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4A90E2">1. Covariance Matrix:</text>
    <text x="50" y="70" font-family="Arial, sans-serif" font-size="13" fill="#333">C = (1/(n-1)) X^T X</text>
    
    <!-- Eigendecomposition -->
    <text x="30" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4A90E2">2. Eigendecomposition:</text>
    <text x="50" y="120" font-family="Arial, sans-serif" font-size="13" fill="#333">C = V Λ V^T</text>
    <text x="50" y="140" font-family="Arial, sans-serif" font-size="12" fill="#666">where V = eigenvectors, Λ = eigenvalues</text>
    
    <!-- Principal Components -->
    <text x="30" y="170" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FF6B6B">3. Principal Components:</text>
    <text x="50" y="190" font-family="Arial, sans-serif" font-size="13" fill="#333">PC = V^T X</text>
    <text x="50" y="210" font-family="Arial, sans-serif" font-size="12" fill="#666">Ordered by decreasing eigenvalues (variance explained)</text>
    
    <!-- Variance Explained -->
    <text x="450" y="50" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#27AE60">4. Variance Explained:</text>
    <text x="470" y="70" font-family="Arial, sans-serif" font-size="13" fill="#333">Variance(PC_i) = λ_i / Σλ_j</text>
    
    <!-- Applications -->
    <text x="450" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#8E44AD">5. Key Applications:</text>
    <text x="470" y="120" font-family="Arial, sans-serif" font-size="12" fill="#333">• Dimensionality reduction</text>
    <text x="470" y="135" font-family="Arial, sans-serif" font-size="12" fill="#333">• Data visualization</text>
    <text x="470" y="150" font-family="Arial, sans-serif" font-size="12" fill="#333">• Feature engineering</text>
    <text x="470" y="165" font-family="Arial, sans-serif" font-size="12" fill="#333">• Noise reduction</text>
    <text x="470" y="180" font-family="Arial, sans-serif" font-size="12" fill="#333">• Exploratory data analysis</text>
  </g>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
    <marker id="redArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#E74C3C"/>
    </marker>
  </defs>
</svg>