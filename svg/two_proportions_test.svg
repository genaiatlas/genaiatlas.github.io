<svg viewBox="0 0 800 550" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', sans-serif; font-size: 18px; font-weight: bold; fill: #2c3e50; }
      .header { font-family: 'Segoe UI', sans-serif; font-size: 14px; font-weight: bold; fill: #34495e; }
      .text { font-family: 'Segoe UI', sans-serif; font-size: 11px; fill: #2c3e50; }
      .small-text { font-family: 'Segoe UI', sans-serif; font-size: 9px; fill: #7f8c8d; }
      .math { font-family: 'Times New Roman', serif; font-size: 12px; fill: #8e44ad; }
      .box { fill: #ecf0f1; stroke: #34495e; stroke-width: 2; }
      .formula-box { fill: #fff2cc; stroke: #d6b656; stroke-width: 2; }
      .example-box { fill: #d5e8d4; stroke: #82b366; stroke-width: 2; }
      .effect-box { fill: #e1d5e7; stroke: #9673a6; stroke-width: 2; }
      .table-line { stroke: #7f8c8d; stroke-width: 1; }
    </style>
  </defs>

  <!-- Title -->
  <text x="400" y="25" class="title" text-anchor="middle">Test for Two Population Proportions</text>

  <!-- Purpose -->
  <rect x="50" y="40" width="700" height="50" class="box" rx="8"/>
  <text x="400" y="60" class="header" text-anchor="middle">Purpose: Compare proportions between two independent populations</text>
  <text x="400" y="80" class="text" text-anchor="middle">Tests whether the difference between two population proportions equals zero</text>

  <!-- Hypotheses -->
  <rect x="50" y="110" width="350" height="100" class="formula-box" rx="8"/>
  <text x="225" y="130" class="header" text-anchor="middle">Hypotheses</text>
  
  <text x="70" y="150" class="math">H₀: p₁ = p₂  (or p₁ - p₂ = 0)</text>
  <text x="70" y="170" class="text">Two-tailed:</text>
  <text x="90" y="185" class="math">H₁: p₁ ≠ p₂</text>
  <text x="70" y="200" class="text">One-tailed: H₁: p₁ &gt; p₂ or H₁: p₁ &lt; p₂</text>

  <!-- Test Statistic -->
  <rect x="420" y="110" width="330" height="100" class="formula-box" rx="8"/>
  <text x="585" y="130" class="header" text-anchor="middle">Test Statistic</text>
  
  <text x="440" y="150" class="math">Z = (p̂₁ - p̂₂)/√(p̂(1-p̂)(1/n₁ + 1/n₂))</text>
  
  <text x="440" y="175" class="text">Pooled proportion:</text>
  <text x="440" y="190" class="math">p̂ = (x₁ + x₂)/(n₁ + n₂)</text>

  <!-- Variables Definition -->
  <rect x="50" y="230" width="700" height="80" class="box" rx="8"/>
  <text x="400" y="250" class="header" text-anchor="middle">Variable Definitions</text>
  
  <text x="70" y="270" class="text">p̂₁ = x₁/n₁ (sample proportion from population 1)</text>
  <text x="400" y="270" class="text">p̂₂ = x₂/n₂ (sample proportion from population 2)</text>
  
  <text x="70" y="285" class="text">x₁, x₂ = number of successes in each sample</text>
  <text x="400" y="285" class="text">n₁, n₂ = sample sizes</text>
  
  <text x="70" y="300" class="text">p̂ = pooled sample proportion (used under H₀: p₁ = p₂)</text>

  <!-- Example -->
  <rect x="50" y="330" width="450" height="140" class="example-box" rx="8"/>
  <text x="275" y="350" class="header" text-anchor="middle">Example: Drug Effectiveness</text>
  
  <text x="70" y="370" class="text">Compare effectiveness of two pain medications:</text>
  
  <!-- Data table -->
  <rect x="70" y="380" width="180" height="80" fill="white" stroke="#82b366" stroke-width="1"/>
  
  <text x="90" y="395" class="small-text">Group</text>
  <text x="140" y="395" class="small-text">Success</text>
  <text x="190" y="395" class="small-text">Total</text>
  <text x="220" y="395" class="small-text">p̂</text>
  
  <line x1="70" y1="400" x2="250" y2="400" class="table-line"/>
  
  <text x="90" y="415" class="small-text">Drug A</text>
  <text x="140" y="415" class="small-text">85</text>
  <text x="190" y="415" class="small-text">100</text>
  <text x="220" y="415" class="small-text">0.85</text>
  
  <text x="90" y="430" class="small-text">Drug B</text>
  <text x="140" y="430" class="small-text">70</text>
  <text x="190" y="430" class="small-text">100</text>
  <text x="220" y="430" class="small-text">0.70</text>
  
  <text x="90" y="445" class="small-text">Total</text>
  <text x="140" y="445" class="small-text">155</text>
  <text x="190" y="445" class="small-text">200</text>
  <text x="220" y="445" class="small-text">0.775</text>
  
  <line x1="125" y1="385" x2="125" y2="455" class="table-line"/>
  <line x1="165" y1="385" x2="165" y2="455" class="table-line"/>
  <line x1="205" y1="385" x2="205" y2="455" class="table-line"/>
  
  <text x="270" y="390" class="text">Calculation:</text>
  <text x="270" y="405" class="text">p̂ = 155/200 = 0.775</text>
  <text x="270" y="420" class="math">Z = (0.85-0.70)/√(0.775×0.225×(1/100+1/100))</text>
  <text x="270" y="435" class="math">  = 0.15/0.059 = 2.54</text>
  <text x="270" y="450" class="text">p-value = 0.011 &lt; 0.05 → Reject H₀</text>

  <!-- Effect Size Measures -->
  <rect x="520" y="330" width="230" height="140" class="effect-box" rx="8"/>
  <text x="635" y="350" class="header" text-anchor="middle">Effect Size Measures</text>
  
  <text x="540" y="370" class="text">Risk Difference:</text>
  <text x="540" y="385" class="math">RD = p₁ - p₂</text>
  
  <text x="540" y="405" class="text">Risk Ratio:</text>
  <text x="540" y="420" class="math">RR = p₁/p₂</text>
  
  <text x="540" y="440" class="text">Odds Ratio:</text>
  <text x="540" y="455" class="math">OR = (p₁/(1-p₁))/(p₂/(1-p₂))</text>

  <!-- Assumptions and CI -->
  <rect x="50" y="490" width="700" height="50" class="box" rx="8"/>
  <text x="400" y="510" class="header" text-anchor="middle">Assumptions and Confidence Interval</text>
  
  <text x="70" y="525" class="text">Assumptions: Independent random samples, large sample sizes (all np̂ ≥ 5 and n(1-p̂) ≥ 5)</text>
  <text x="70" y="535" class="math">CI for difference: (p̂₁ - p̂₂) ± Z_{α/2} × √(p̂₁(1-p̂₁)/n₁ + p̂₂(1-p̂₂)/n₂)</text>

</svg>