<svg viewBox="0 0 800 550" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', sans-serif; font-size: 18px; font-weight: bold; fill: #2c3e50; }
      .header { font-family: 'Segoe UI', sans-serif; font-size: 14px; font-weight: bold; fill: #34495e; }
      .text { font-family: 'Segoe UI', sans-serif; font-size: 11px; fill: #2c3e50; }
      .small-text { font-family: 'Segoe UI', sans-serif; font-size: 9px; fill: #7f8c8d; }
      .math { font-family: 'Times New Roman', serif; font-size: 12px; fill: #8e44ad; }
      .box { fill: #ecf0f1; stroke: #34495e; stroke-width: 2; }
      .formula-box { fill: #fff2cc; stroke: #d6b656; stroke-width: 2; }
      .example-box { fill: #d5e8d4; stroke: #82b366; stroke-width: 2; }
      .when-box { fill: #f8cecc; stroke: #b85450; stroke-width: 2; }
      .advantage-box { fill: #e1d5e7; stroke: #9673a6; stroke-width: 2; }
      .table-line { stroke: #7f8c8d; stroke-width: 1; }
    </style>
  </defs>

  <!-- Title -->
  <text x="400" y="25" class="title" text-anchor="middle">Paired t-Test for Dependent Samples</text>

  <!-- Purpose -->
  <rect x="50" y="40" width="700" height="50" class="box" rx="8"/>
  <text x="400" y="60" class="header" text-anchor="middle">Purpose: Compare means for related/paired observations</text>
  <text x="400" y="80" class="text" text-anchor="middle">Tests whether the mean difference between pairs equals zero</text>

  <!-- When to Use -->
  <rect x="50" y="110" width="350" height="120" class="when-box" rx="8"/>
  <text x="225" y="130" class="header" text-anchor="middle">When to Use Paired t-Test</text>
  <text x="70" y="150" class="text">✓ Before/after measurements on same subjects</text>
  <text x="70" y="165" class="text">✓ Matched pairs of subjects (twins, siblings)</text>
  <text x="70" y="180" class="text">✓ Two measurements on same experimental units</text>
  <text x="70" y="195" class="text">✓ Pre-test/post-test designs</text>
  <text x="70" y="210" class="text">✓ Crossover studies with washout periods</text>

  <!-- Methodology -->
  <rect x="420" y="110" width="330" height="120" class="formula-box" rx="8"/>
  <text x="585" y="130" class="header" text-anchor="middle">Methodology</text>
  
  <text x="440" y="150" class="text">Step 1: Calculate differences for each pair</text>
  <text x="460" y="165" class="math">dᵢ = x₁ᵢ - x₂ᵢ</text>
  
  <text x="440" y="185" class="text">Step 2: Test hypotheses about mean difference</text>
  <text x="460" y="200" class="math">H₀: μd = 0  vs  H₁: μd ≠ 0</text>
  
  <text x="440" y="220" class="text">Step 3: Use one-sample t-test on differences</text>

  <!-- Test Statistic and Formula -->
  <rect x="50" y="250" width="700" height="80" class="formula-box" rx="8"/>
  <text x="400" y="270" class="header" text-anchor="middle">Test Statistic</text>
  
  <text x="300" y="290" class="math">t = (d̄ - 0)/(sd/√n) = d̄/(sd/√n)</text>
  
  <text x="70" y="310" class="text">Where: d̄ = mean of differences, sd = standard deviation of differences, n = number of pairs</text>
  <text x="70" y="325" class="text">Degrees of freedom: df = n - 1</text>

  <!-- Example with Data Table -->
  <rect x="50" y="350" width="700" height="150" class="example-box" rx="8"/>
  <text x="400" y="370" class="header" text-anchor="middle">Example: Weight Loss Study</text>
  
  <text x="70" y="390" class="text">Research Question: Does a new diet program result in significant weight loss?</text>
  
  <!-- Data table -->
  <rect x="70" y="400" width="300" height="90" fill="white" stroke="#82b366" stroke-width="1"/>
  
  <!-- Table headers -->
  <text x="85" y="415" class="small-text">Subject</text>
  <text x="140" y="415" class="small-text">Before</text>
  <text x="190" y="415" class="small-text">After</text>
  <text x="240" y="415" class="small-text">Difference</text>
  <text x="320" y="415" class="small-text">dᵢ = Before - After</text>
  
  <line x1="70" y1="420" x2="370" y2="420" class="table-line"/>
  
  <!-- Data rows -->
  <text x="85" y="435" class="small-text">1</text>
  <text x="140" y="435" class="small-text">180</text>
  <text x="190" y="435" class="small-text">175</text>
  <text x="240" y="435" class="small-text">5</text>
  
  <text x="85" y="450" class="small-text">2</text>
  <text x="140" y="450" class="small-text">165</text>
  <text x="190" y="450" class="small-text">162</text>
  <text x="240" y="450" class="small-text">3</text>
  
  <text x="85" y="465" class="small-text">3</text>
  <text x="140" y="465" class="small-text">200</text>
  <text x="190" y="465" class="small-text">195</text>
  <text x="240" y="465" class="small-text">5</text>
  
  <text x="85" y="480" class="small-text">⋮</text>
  <text x="140" y="480" class="small-text">⋮</text>
  <text x="190" y="480" class="small-text">⋮</text>
  <text x="240" y="480" class="small-text">⋮</text>
  
  <!-- Table lines -->
  <line x1="120" y1="405" x2="120" y2="485" class="table-line"/>
  <line x1="165" y1="405" x2="165" y2="485" class="table-line"/>
  <line x1="215" y1="405" x2="215" y2="485" class="table-line"/>
  <line x1="265" y1="405" x2="265" y2="485" class="table-line"/>
  
  <!-- Analysis -->
  <text x="400" y="415" class="text">Analysis (n = 20 subjects):</text>
  <text x="400" y="430" class="text">d̄ = 4.2 kg, sd = 2.1 kg</text>
  <text x="400" y="445" class="math">t = 4.2/(2.1/√20) = 4.2/0.469 = 8.95</text>
  <text x="400" y="460" class="text">df = 19, t₀.₀₂₅,₁₉ = 2.093</text>
  <text x="400" y="475" class="text">Since |8.95| > 2.093 → Reject H₀</text>
  <text x="400" y="490" class="text">Conclusion: Significant weight loss</text>

  <!-- Advantages -->
  <rect x="50" y="520" width="700" height="60" class="advantage-box" rx="8"/>
  <text x="400" y="540" class="header" text-anchor="middle">Advantages of Paired Design</text>
  <text x="70" y="560" class="text">✓ Controls for individual variation between subjects ✓ More powerful than independent samples test</text>
  <text x="70" y="575" class="text">✓ Reduces confounding variables ✓ Requires smaller sample sizes for same statistical power</text>

</svg>