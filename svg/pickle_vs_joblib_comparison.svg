<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="900" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="600" y="40" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Pickle vs Joblib: Comprehensive Comparison
  </text>
  
  <!-- Comparison Table -->
  <g transform="translate(100, 80)">
    <!-- Header Row -->
    <rect x="0" y="0" width="250" height="50" fill="#34495e" rx="5 0 0 0"/>
    <rect x="250" y="0" width="400" height="50" fill="#3498db"/>
    <rect x="650" y="0" width="400" height="50" fill="#27ae60" rx="0 5 0 0"/>
    
    <text x="125" y="32" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
      Aspect
    </text>
    <text x="450" y="32" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
      🥒 Pickle
    </text>
    <text x="850" y="32" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
      ⚡ Joblib
    </text>
    
    <!-- Row 1: Installation -->
    <rect x="0" y="50" width="250" height="60" fill="#ecf0f1"/>
    <rect x="250" y="50" width="400" height="60" fill="white"/>
    <rect x="650" y="50" width="400" height="60" fill="white"/>
    
    <text x="125" y="75" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#34495e">
      Installation
    </text>
    <text x="450" y="82" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#27ae60">
      ✓ Built-in (Standard Library)
    </text>
    <text x="450" y="98" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">
      No installation required
    </text>
    
    <text x="850" y="82" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">
      External Package
    </text>
    <text x="850" y="98" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">
      pip install joblib
    </text>
    
    <!-- Row 2: Primary Use Case -->
    <rect x="0" y="110" width="250" height="60" fill="#ecf0f1"/>
    <rect x="250" y="110" width="400" height="60" fill="white"/>
    <rect x="650" y="110" width="400" height="60" fill="white"/>
    
    <text x="125" y="135" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#34495e">
      Primary Use Case
    </text>
    <text x="450" y="142" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">
      General Python object
    </text>
    <text x="450" y="158" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">
      serialization
    </text>
    
    <text x="850" y="137" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#27ae60">
      ✓ ML models with large
    </text>
    <text x="850" y="153" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#27ae60">
      NumPy arrays
    </text>
    
    <!-- Row 3: Performance -->
    <rect x="0" y="170" width="250" height="60" fill="#ecf0f1"/>
    <rect x="250" y="170" width="400" height="60" fill="white"/>
    <rect x="650" y="170" width="400" height="60" fill="white"/>
    
    <text x="125" y="195" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#34495e">
      Performance
    </text>
    <text x="450" y="202" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">
      Good for general objects
    </text>
    <text x="450" y="218" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">
      Standard speed
    </text>
    
    <text x="850" y="197" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#27ae60">
      ✓ Optimized for NumPy arrays
    </text>
    <text x="850" y="213" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#27ae60">
      Significantly faster for ML models
    </text>
    
    <!-- Row 4: File Size -->
    <rect x="0" y="230" width="250" height="60" fill="#ecf0f1"/>
    <rect x="250" y="230" width="400" height="60" fill="white"/>
    <rect x="650" y="230" width="400" height="60" fill="white"/>
    
    <text x="125" y="255" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#34495e">
      File Size
    </text>
    <text x="450" y="262" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">
      Standard compression
    </text>
    <text x="450" y="278" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">
      ~100 MB (example)
    </text>
    
    <text x="850" y="257" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#27ae60">
      ✓ Better compression for arrays
    </text>
    <text x="850" y="273" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#27ae60">
      ~75 MB (25% smaller)
    </text>
    
    <!-- Row 5: Loading Speed -->
    <rect x="0" y="290" width="250" height="60" fill="#ecf0f1"/>
    <rect x="250" y="290" width="400" height="60" fill="white"/>
    <rect x="650" y="290" width="400" height="60" fill="white"/>
    
    <text x="125" y="315" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#34495e">
      Loading Speed
    </text>
    <text x="450" y="322" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">
      Standard
    </text>
    <text x="450" y="338" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">
      ~2.5 seconds (example)
    </text>
    
    <text x="850" y="317" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#27ae60">
      ✓ Faster for large ML models
    </text>
    <text x="850" y="333" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#27ae60">
      ~1.2 seconds (50% faster)
    </text>
    
    <!-- Row 6: Memory Usage -->
    <rect x="0" y="350" width="250" height="60" fill="#ecf0f1"/>
    <rect x="250" y="350" width="400" height="60" fill="white"/>
    <rect x="650" y="350" width="400" height="60" fill="white"/>
    
    <text x="125" y="375" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#34495e">
      Memory Usage
    </text>
    <text x="450" y="382" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">
      Standard
    </text>
    <text x="450" y="398" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">
      May use more RAM
    </text>
    
    <text x="850" y="377" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#27ae60">
      ✓ More memory efficient
    </text>
    <text x="850" y="393" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#27ae60">
      Uses memory mapping (mmap)
    </text>
    
    <!-- Row 7: Scikit-learn Integration -->
    <rect x="0" y="410" width="250" height="60" fill="#ecf0f1"/>
    <rect x="250" y="410" width="400" height="60" fill="white"/>
    <rect x="650" y="410" width="400" height="60" fill="white"/>
    
    <text x="125" y="435" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#34495e">
      Scikit-learn
    </text>
    <text x="450" y="442" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">
      Basic support
    </text>
    <text x="450" y="458" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">
      Works but not optimized
    </text>
    
    <text x="850" y="437" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#27ae60">
      ✓ Native integration
    </text>
    <text x="850" y="453" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#27ae60">
      Recommended by scikit-learn
    </text>
    
    <!-- Row 8: Parallel Processing -->
    <rect x="0" y="470" width="250" height="60" fill="#ecf0f1"/>
    <rect x="250" y="470" width="400" height="60" fill="white"/>
    <rect x="650" y="470" width="400" height="60" fill="white"/>
    
    <text x="125" y="495" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#34495e">
      Parallel Processing
    </text>
    <text x="450" y="502" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#e74c3c">
      ✗ No
    </text>
    <text x="450" y="518" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">
      Single-threaded only
    </text>
    
    <text x="850" y="497" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#27ae60">
      ✓ Yes
    </text>
    <text x="850" y="513" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#27ae60">
      Multi-core support built-in
    </text>
    
    <!-- Row 9: Learning Curve -->
    <rect x="0" y="530" width="250" height="60" fill="#ecf0f1"/>
    <rect x="250" y="530" width="400" height="60" fill="white"/>
    <rect x="650" y="530" width="400" height="60" fill="white"/>
    
    <text x="125" y="555" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#34495e">
      Learning Curve
    </text>
    <text x="450" y="557" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#27ae60">
      ✓ Very simple
    </text>
    <text x="450" y="573" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#27ae60">
      dump() and load()
    </text>
    
    <text x="850" y="557" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#27ae60">
      ✓ Very simple
    </text>
    <text x="850" y="573" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#27ae60">
      dump() and load()
    </text>
    
    <!-- Row 10: Best For -->
    <rect x="0" y="590" width="250" height="80" fill="#ecf0f1" rx="0 0 0 5"/>
    <rect x="250" y="590" width="400" height="80" fill="white"/>
    <rect x="650" y="590" width="400" height="80" fill="white" rx="0 0 5 0"/>
    
    <text x="125" y="620" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#34495e">
      Best For
    </text>
    <text x="450" y="620" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">
      • General Python objects
    </text>
    <text x="450" y="638" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">
      • Custom classes/functions
    </text>
    <text x="450" y="656" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">
      • No dependencies required
    </text>
    
    <text x="850" y="620" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#27ae60">
      ✓ Machine learning models
    </text>
    <text x="850" y="638" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#27ae60">
      ✓ Large NumPy arrays
    </text>
    <text x="850" y="656" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#27ae60">
      ✓ Production ML systems
    </text>
  </g>
  
  <!-- Bottom: Recommendations -->
  <g transform="translate(100, 760)">
    <text x="500" y="0" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      When to Use Each
    </text>
    
    <!-- Use Pickle -->
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="480" height="100" fill="#ebf5fb" stroke="#3498db" stroke-width="2" rx="8"/>
      <text x="240" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#3498db">
        Choose Pickle When:
      </text>
      
      <circle cx="20" cy="48" r="4" fill="#3498db"/>
      <text x="35" y="52" font-family="Arial, sans-serif" font-size="11" fill="#34495e">
        Working with general Python objects
      </text>
      
      <circle cx="20" cy="68" r="4" fill="#3498db"/>
      <text x="35" y="72" font-family="Arial, sans-serif" font-size="11" fill="#34495e">
        Need built-in solution (no external dependencies)
      </text>
      
      <circle cx="20" cy="88" r="4" fill="#3498db"/>
      <text x="35" y="92" font-family="Arial, sans-serif" font-size="11" fill="#34495e">
        Strict dependency requirements in your project
      </text>
    </g>
    
    <!-- Use Joblib -->
    <g transform="translate(520, 20)">
      <rect x="0" y="0" width="480" height="100" fill="#d5f4e6" stroke="#27ae60" stroke-width="2" rx="8"/>
      <text x="240" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#27ae60">
        Choose Joblib When:
      </text>
      
      <circle cx="20" cy="48" r="4" fill="#27ae60"/>
      <text x="35" y="52" font-family="Arial, sans-serif" font-size="11" fill="#34495e">
        Working with ML models (especially scikit-learn)
      </text>
      
      <circle cx="20" cy="68" r="4" fill="#27ae60"/>
      <text x="35" y="72" font-family="Arial, sans-serif" font-size="11" fill="#34495e">
        Dealing with large NumPy arrays or datasets
      </text>
      
      <circle cx="20" cy="88" r="4" fill="#27ae60"/>
      <text x="35" y="92" font-family="Arial, sans-serif" font-size="11" fill="#34495e">
        Performance and memory efficiency are priorities
      </text>
    </g>
  </g>
</svg>