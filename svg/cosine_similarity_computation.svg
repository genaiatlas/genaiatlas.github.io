<svg viewBox="0 0 1000 750" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="500" y="35" font-size="24" font-weight="bold" text-anchor="middle" fill="#2C3E50">
    Cosine Similarity Computation
  </text>
  
  <!-- Formula box -->
  <rect x="200" y="60" width="600" height="80" fill="#E8F4F8" stroke="#3498DB" stroke-width="2" rx="10"/>
  <text x="500" y="90" font-size="16" font-weight="bold" text-anchor="middle" fill="#2C3E50">
    Cosine Similarity Formula
  </text>
  <text x="500" y="120" font-size="20" text-anchor="middle" fill="#3498DB" font-weight="bold">
    Sim(u₁, u₂) = (v₁ · v₂) / (||v₁|| × ||v₂||)
  </text>
  
  <!-- Example 1: Prof vs Philip -->
  <rect x="50" y="170" width="440" height="540" fill="#FADBD8" stroke="#E74C3C" stroke-width="3" rx="10"/>
  <text x="270" y="200" font-size="18" font-weight="bold" text-anchor="middle" fill="#2C3E50">
    Example 1: Prof vs Philip
  </text>
  
  <!-- Vectors -->
  <g transform="translate(80, 220)">
    <rect x="0" y="0" width="380" height="100" fill="white" stroke="#BDC3C7" stroke-width="1" rx="5"/>
    <text x="15" y="25" font-size="14" font-weight="bold" fill="#2C3E50">Comparison Vectors:</text>
    <text x="15" y="50" font-size="13" fill="#34495E">v_Prof = [+1, +1, -1]</text>
    <text x="15" y="75" font-size="13" fill="#34495E">v_Philip = [-1, +1, +1]</text>
  </g>
  
  <!-- Step 1: Dot Product -->
  <g transform="translate(80, 340)">
    <rect x="0" y="0" width="380" height="100" fill="#FEF5E7" stroke="#E67E22" stroke-width="2" rx="5"/>
    <text x="15" y="25" font-size="14" font-weight="bold" fill="#E67E22">Step 1: Compute Dot Product</text>
    <text x="15" y="50" font-size="12" fill="#34495E">v_Prof · v_Philip = (1)(-1) + (1)(1) + (-1)(1)</text>
    <text x="15" y="70" font-size="12" fill="#34495E">= -1 + 1 - 1</text>
    <text x="15" y="90" font-size="14" font-weight="bold" fill="#E67E22">= -1</text>
  </g>
  
  <!-- Step 2: Norms -->
  <g transform="translate(80, 460)">
    <rect x="0" y="0" width="380" height="120" fill="#E8F8F5" stroke="#27AE60" stroke-width="2" rx="5"/>
    <text x="15" y="25" font-size="14" font-weight="bold" fill="#27AE60">Step 2: Compute L2 Norms</text>
    <text x="15" y="50" font-size="12" fill="#34495E">||v_Prof|| = √(1² + 1² + (-1)²) = √3</text>
    <text x="15" y="75" font-size="12" fill="#34495E">||v_Philip|| = √((-1)² + 1² + 1²) = √3</text>
    <text x="15" y="100" font-size="14" font-weight="bold" fill="#27AE60">Product: √3 × √3 = 3</text>
  </g>
  
  <!-- Step 3: Result -->
  <g transform="translate(80, 600)">
    <rect x="0" y="0" width="380" height="90" fill="#E74C3C" stroke="#E74C3C" stroke-width="2" rx="5"/>
    <text x="15" y="30" font-size="14" font-weight="bold" fill="white">Step 3: Calculate Similarity</text>
    <text x="15" y="55" font-size="13" fill="white">Sim(Prof, Philip) = -1 / 3</text>
    <text x="15" y="78" font-size="16" font-weight="bold" fill="white">= -0.333 (Opposite preferences)</text>
  </g>
  
  <!-- Example 2: Prof vs You -->
  <rect x="510" y="170" width="440" height="540" fill="#E8F8F5" stroke="#27AE60" stroke-width="3" rx="10"/>
  <text x="730" y="200" font-size="18" font-weight="bold" text-anchor="middle" fill="#2C3E50">
    Example 2: Prof vs You
  </text>
  
  <!-- Vectors -->
  <g transform="translate(540, 220)">
    <rect x="0" y="0" width="380" height="100" fill="white" stroke="#BDC3C7" stroke-width="1" rx="5"/>
    <text x="15" y="25" font-size="14" font-weight="bold" fill="#2C3E50">Comparison Vectors:</text>
    <text x="15" y="50" font-size="13" fill="#34495E">v_Prof = [+1, +1, -1]</text>
    <text x="15" y="75" font-size="13" fill="#34495E">v_You = [+1, -1, -1]</text>
  </g>
  
  <!-- Step 1: Dot Product -->
  <g transform="translate(540, 340)">
    <rect x="0" y="0" width="380" height="100" fill="#FEF5E7" stroke="#E67E22" stroke-width="2" rx="5"/>
    <text x="15" y="25" font-size="14" font-weight="bold" fill="#E67E22">Step 1: Compute Dot Product</text>
    <text x="15" y="50" font-size="12" fill="#34495E">v_Prof · v_You = (1)(1) + (1)(-1) + (-1)(-1)</text>
    <text x="15" y="70" font-size="12" fill="#34495E">= 1 - 1 + 1</text>
    <text x="15" y="90" font-size="14" font-weight="bold" fill="#E67E22">= 1</text>
  </g>
  
  <!-- Step 2: Norms -->
  <g transform="translate(540, 460)">
    <rect x="0" y="0" width="380" height="120" fill="#E8F8F5" stroke="#27AE60" stroke-width="2" rx="5"/>
    <text x="15" y="25" font-size="14" font-weight="bold" fill="#27AE60">Step 2: Compute L2 Norms</text>
    <text x="15" y="50" font-size="12" fill="#34495E">||v_Prof|| = √(1² + 1² + (-1)²) = √3</text>
    <text x="15" y="75" font-size="12" fill="#34495E">||v_You|| = √(1² + (-1)² + (-1)²) = √3</text>
    <text x="15" y="100" font-size="14" font-weight="bold" fill="#27AE60">Product: √3 × √3 = 3</text>
  </g>
  
  <!-- Step 3: Result -->
  <g transform="translate(540, 600)">
    <rect x="0" y="0" width="380" height="90" fill="#27AE60" stroke="#27AE60" stroke-width="2" rx="5"/>
    <text x="15" y="30" font-size="14" font-weight="bold" fill="white">Step 3: Calculate Similarity</text>
    <text x="15" y="55" font-size="13" fill="white">Sim(Prof, You) = 1 / 3</text>
    <text x="15" y="78" font-size="16" font-weight="bold" fill="white">= 0.333 (Similar preferences)</text>
  </g>
</svg>