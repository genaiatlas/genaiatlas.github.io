<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Sample-to-Sample Variability
  </text>
  
  <!-- Population -->
  <g transform="translate(50, 60)">
    <text x="100" y="0" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#34495e">
      Population (μ = true parameter)
    </text>
    
    <!-- Population distribution -->
    <ellipse cx="100" cy="100" rx="80" ry="60" fill="#3498db" opacity="0.2" stroke="#2980b9" stroke-width="2"/>
    
    <!-- Many dots representing population -->
    <circle cx="60" cy="80" r="2" fill="#2980b9"/>
    <circle cx="80" cy="90" r="2" fill="#2980b9"/>
    <circle cx="100" cy="85" r="2" fill="#2980b9"/>
    <circle cx="120" cy="95" r="2" fill="#2980b9"/>
    <circle cx="140" cy="88" r="2" fill="#2980b9"/>
    <circle cx="70" cy="110" r="2" fill="#2980b9"/>
    <circle cx="90" cy="115" r="2" fill="#2980b9"/>
    <circle cx="110" cy="108" r="2" fill="#2980b9"/>
    <circle cx="130" cy="112" r="2" fill="#2980b9"/>
    <circle cx="75" cy="100" r="2" fill="#2980b9"/>
    <circle cx="95" cy="105" r="2" fill="#2980b9"/>
    <circle cx="115" cy="98" r="2" fill="#2980b9"/>
    <circle cx="125" cy="103" r="2" fill="#2980b9"/>
    
    <!-- True parameter line -->
    <line x1="100" y1="140" x2="100" y2="160" stroke="#e74c3c" stroke-width="3"/>
    <text x="100" y="175" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#e74c3c" font-weight="bold">μ</text>
  </g>
  
  <!-- Sampling arrows -->
  <g>
    <path d="M 150 160 Q 150 200 120 240" fill="none" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrowhead)"/>
    <path d="M 150 160 Q 200 200 270 240" fill="none" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrowhead)"/>
    <path d="M 150 160 Q 300 200 420 240" fill="none" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrowhead)"/>
    <path d="M 150 160 Q 450 200 570 240" fill="none" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <text x="180" y="210" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d" font-style="italic">
      Random sampling
    </text>
  </g>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7f8c8d"/>
    </marker>
  </defs>
  
  <!-- Sample 1 -->
  <g transform="translate(50, 260)">
    <rect x="0" y="0" width="120" height="100" fill="white" stroke="#27ae60" stroke-width="2" rx="5"/>
    <text x="60" y="20" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">
      Sample 1
    </text>
    <circle cx="30" cy="45" r="2" fill="#27ae60"/>
    <circle cx="50" cy="50" r="2" fill="#27ae60"/>
    <circle cx="70" cy="48" r="2" fill="#27ae60"/>
    <circle cx="90" cy="52" r="2" fill="#27ae60"/>
    <circle cx="40" cy="65" r="2" fill="#27ae60"/>
    <circle cx="60" cy="68" r="2" fill="#27ae60"/>
    <circle cx="80" cy="63" r="2" fill="#27ae60"/>
    
    <text x="60" y="90" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#27ae60">
      β̂₁ = 2.8
    </text>
  </g>
  
  <!-- Sample 2 -->
  <g transform="translate(200, 260)">
    <rect x="0" y="0" width="120" height="100" fill="white" stroke="#f39c12" stroke-width="2" rx="5"/>
    <text x="60" y="20" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#f39c12">
      Sample 2
    </text>
    <circle cx="25" cy="42" r="2" fill="#f39c12"/>
    <circle cx="45" cy="55" r="2" fill="#f39c12"/>
    <circle cx="65" cy="50" r="2" fill="#f39c12"/>
    <circle cx="85" cy="48" r="2" fill="#f39c12"/>
    <circle cx="35" cy="68" r="2" fill="#f39c12"/>
    <circle cx="55" cy="62" r="2" fill="#f39c12"/>
    <circle cx="75" cy="70" r="2" fill="#f39c12"/>
    
    <text x="60" y="90" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#f39c12">
      β̂₂ = 3.2
    </text>
  </g>
  
  <!-- Sample 3 -->
  <g transform="translate(350, 260)">
    <rect x="0" y="0" width="120" height="100" fill="white" stroke="#9b59b6" stroke-width="2" rx="5"/>
    <text x="60" y="20" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#9b59b6">
      Sample 3
    </text>
    <circle cx="35" cy="50" r="2" fill="#9b59b6"/>
    <circle cx="55" cy="45" r="2" fill="#9b59b6"/>
    <circle cx="75" cy="52" r="2" fill="#9b59b6"/>
    <circle cx="95" cy="55" r="2" fill="#9b59b6"/>
    <circle cx="45" cy="67" r="2" fill="#9b59b6"/>
    <circle cx="65" cy="63" r="2" fill="#9b59b6"/>
    <circle cx="85" cy="68" r="2" fill="#9b59b6"/>
    
    <text x="60" y="90" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#9b59b6">
      β̂₃ = 2.9
    </text>
  </g>
  
  <!-- Sample 4 -->
  <g transform="translate(500, 260)">
    <rect x="0" y="0" width="120" height="100" fill="white" stroke="#e67e22" stroke-width="2" rx="5"/>
    <text x="60" y="20" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#e67e22">
      Sample 4
    </text>
    <circle cx="30" cy="48" r="2" fill="#e67e22"/>
    <circle cx="50" cy="52" r="2" fill="#e67e22"/>
    <circle cx="70" cy="50" r="2" fill="#e67e22"/>
    <circle cx="90" cy="58" r="2" fill="#e67e22"/>
    <circle cx="40" cy="64" r="2" fill="#e67e22"/>
    <circle cx="60" cy="70" r="2" fill="#e67e22"/>
    <circle cx="80" cy="66" r="2" fill="#e67e22"/>
    
    <text x="60" y="90" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#e67e22">
      β̂₄ = 3.1
    </text>
  </g>
  
  <!-- Sampling Distribution -->
  <g transform="translate(200, 420)">
    <text x="200" y="0" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#34495e">
      Sampling Distribution of β̂
    </text>
    
    <!-- Distribution curve -->
    <path d="M 50 80 Q 100 20 150 50 T 250 80" fill="none" stroke="#3498db" stroke-width="2"/>
    <path d="M 50 80 Q 100 20 150 50 T 250 80 L 250 100 L 50 100 Z" fill="#3498db" opacity="0.2"/>
    
    <!-- Sample estimates marked on distribution -->
    <line x1="80" y1="70" x2="80" y2="100" stroke="#27ae60" stroke-width="2"/>
    <line x1="180" y1="55" x2="180" y2="100" stroke="#f39c12" stroke-width="2"/>
    <line x1="120" y1="60" x2="120" y2="100" stroke="#9b59b6" stroke-width="2"/>
    <line x1="160" y1="58" x2="160" y2="100" stroke="#e67e22" stroke-width="2"/>
    
    <!-- True parameter -->
    <line x1="150" y1="50" x2="150" y2="110" stroke="#e74c3c" stroke-width="3" stroke-dasharray="5,5"/>
    <text x="150" y="125" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#e74c3c" font-weight="bold">
      μ (true value)
    </text>
    
    <!-- X-axis -->
    <line x1="40" y1="100" x2="260" y2="100" stroke="#34495e" stroke-width="1"/>
    <text x="150" y="145" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d" font-style="italic">
      Different samples yield different estimates
    </text>
  </g>
</svg>