<svg width="950" height="700" viewBox="0 0 950 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 24px; font-weight: bold; fill: #1a365d; }
      .subtitle { font-family: Arial, sans-serif; font-size: 18px; fill: #2d3748; font-weight: bold; }
      .section-title { font-family: Arial, sans-serif; font-size: 14px; fill: #2d3748; font-weight: bold; }
      .description { font-family: Arial, sans-serif; font-size: 12px; fill: #4a5568; }
      .small-text { font-family: Arial, sans-serif; font-size: 11px; fill: #4a5568; }
      .table-header { font-family: Arial, sans-serif; font-size: 13px; fill: #1a365d; font-weight: bold; }
      .table-cell { font-family: Arial, sans-serif; font-size: 11px; fill: #4a5568; }
      .axis-label { font-family: Arial, sans-serif; font-size: 13px; fill: #1a365d; font-weight: bold; }
      .box { fill: #f7fafc; stroke: #cbd5e0; stroke-width: 2; rx: 10; }
      .complexity-box { fill: #fffbeb; stroke: #d69e2e; stroke-width: 2; rx: 10; }
      .optimization-box { fill: #ebf8ff; stroke: #2b6cb0; stroke-width: 2; rx: 10; }
      .performance-box { fill: #f0fff4; stroke: #38a169; stroke-width: 2; rx: 10; }
      .simple-bar { fill: #38a169; stroke: #2f855a; stroke-width: 2; }
      .kfold-bar { fill: #3182ce; stroke: #2c5282; stroke-width: 2; }
      .loocv-bar { fill: #d69e2e; stroke: #b7791f; stroke-width: 2; }
      .nested-bar { fill: #e53e3e; stroke: #c53030; stroke-width: 2; }
      .axis-line { stroke: #2d3748; stroke-width: 2; }
      .grid-line { stroke: #e2e8f0; stroke-width: 1; }
      .excellent { fill: #38a169; font-weight: bold; }
      .good { fill: #3182ce; font-weight: bold; }
      .moderate { fill: #d69e2e; font-weight: bold; }
      .poor { fill: #e53e3e; font-weight: bold; }
      .table-row-even { fill: #f8f9fa; stroke: #e2e8f0; stroke-width: 1; }
      .table-row-odd { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="950" height="700" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="475" y="30" text-anchor="middle" class="title">Cross-Validation Computational Analysis</text>
  <text x="475" y="50" text-anchor="middle" class="description">Performance, Complexity, and Optimization Strategies</text>
  
  <!-- Complexity Comparison Chart -->
  <rect x="50" y="70" width="850" height="220" class="complexity-box"/>
  <text x="475" y="95" text-anchor="middle" class="subtitle" fill="#744210">Computational Complexity Comparison</text>
  
  <!-- Bar chart showing computational costs -->
  <g transform="translate(120, 120)">
    <!-- Chart background -->
    <rect x="-10" y="-10" width="660" height="150" fill="white" stroke="#e2e8f0" stroke-width="1" rx="5"/>
    
    <!-- Grid lines -->
    <g class="grid-line">
      <line x1="0" y1="20" x2="600" y2="20"/>
      <line x1="0" y1="40" x2="600" y2="40"/>
      <line x1="0" y1="60" x2="600" y2="60"/>
      <line x1="0" y1="80" x2="600" y2="80"/>
      <line x1="0" y1="100" x2="600" y2="100"/>
    </g>
    
    <!-- Axes -->
    <line x1="0" y1="120" x2="600" y2="120" class="axis-line"/>
    <line x1="0" y1="0" x2="0" y2="125" class="axis-line"/>
    
    <!-- Bars with proper scaling -->
    <!-- Simple Split - O(1) -->
    <rect x="50" y="110" width="80" height="10" class="simple-bar"/>
    <text x="90" y="105" text-anchor="middle" class="table-cell excellent">O(1)</text>
    <text x="90" y="95" text-anchor="middle" class="table-cell">1 model</text>
    <text x="90" y="140" text-anchor="middle" class="table-cell" font-weight="bold">Simple Split</text>
    
    <!-- K-Fold - O(K) -->
    <rect x="180" y="80" width="80" height="40" class="kfold-bar"/>
    <text x="220" y="75" text-anchor="middle" class="table-cell good">O(K)</text>
    <text x="220" y="65" text-anchor="middle" class="table-cell">K models</text>
    <text x="220" y="140" text-anchor="middle" class="table-cell" font-weight="bold">K-Fold CV</text>
    
    <!-- LOOCV - O(n) -->
    <rect x="310" y="20" width="80" height="100" class="loocv-bar"/>
    <text x="350" y="15" text-anchor="middle" class="table-cell moderate">O(n)</text>
    <text x="350" y="5" text-anchor="middle" class="table-cell">n models</text>
    <text x="350" y="140" text-anchor="middle" class="table-cell" font-weight="bold">LOOCV</text>
    
    <!-- Nested CV -->
    <rect x="440" y="0" width="80" height="120" class="nested-bar"/>
    <text x="480" y="-5" text-anchor="middle" class="table-cell poor">O(K1×K2)</text>
    <text x="480" y="-15" text-anchor="middle" class="table-cell">K1×K2 models</text>
    <text x="480" y="140" text-anchor="middle" class="table-cell" font-weight="bold">Nested CV</text>
    
    <!-- Y-axis labels -->
    <text x="-15" y="125" text-anchor="end" class="axis-label">0</text>
    <text x="-15" y="105" text-anchor="end" class="description">Very Low</text>
    <text x="-15" y="85" text-anchor="end" class="description">Low</text>
    <text x="-15" y="65" text-anchor="end" class="description">Moderate</text>
    <text x="-15" y="45" text-anchor="end" class="description">High</text>
    <text x="-15" y="25" text-anchor="end" class="description">Very High</text>
    <text x="-15" y="5" text-anchor="end" class="description">Extreme</text>
    
    <!-- Axis labels -->
    <text x="300" y="165" text-anchor="middle" class="axis-label">Cross-Validation Method</text>
    <text x="-50" y="60" text-anchor="middle" class="axis-label" transform="rotate(-90 -50 60)">Computational Cost</text>
    
    <!-- Performance indicators legend -->
    <g transform="translate(550, 20)">
      <rect x="0" y="0" width="120" height="100" fill="white" stroke="#cbd5e0" stroke-width="1" rx="5"/>
      <text x="60" y="15" text-anchor="middle" class="section-title">Scaling</text>
      <text x="10" y="30" class="description excellent">Excellent: O(1)</text>
      <text x="10" y="45" class="description good">Good: O(K)</text>
      <text x="10" y="60" class="description moderate">Moderate: O(n)</text>
      <text x="10" y="75" class="description poor">Poor: O(K1×K2)</text>
    </g>
  </g>
  
  <!-- Detailed Complexity Table -->
  <rect x="50" y="310" width="850" height="180" class="box"/>
  <text x="475" y="335" text-anchor="middle" class="subtitle">Detailed Complexity Analysis</text>
  
  <!-- Table structure with proper cells -->
  <!-- Headers -->
  <rect x="70" y="350" width="110" height="25" fill="#e2e8f0" stroke="#a0aec0"/>
  <text x="125" y="367" text-anchor="middle" class="table-header">Method</text>
  
  <rect x="180" y="350" width="110" height="25" fill="#e2e8f0" stroke="#a0aec0"/>
  <text x="235" y="367" text-anchor="middle" class="table-header">Model Fits</text>
  
  <rect x="290" y="350" width="130" height="25" fill="#e2e8f0" stroke="#a0aec0"/>
  <text x="355" y="367" text-anchor="middle" class="table-header">Time Complexity</text>
  
  <rect x="420" y="350" width="110" height="25" fill="#e2e8f0" stroke="#a0aec0"/>
  <text x="475" y="367" text-anchor="middle" class="table-header">Memory Usage</text>
  
  <rect x="530" y="350" width="110" height="25" fill="#e2e8f0" stroke="#a0aec0"/>
  <text x="585" y="367" text-anchor="middle" class="table-header">Parallelizable</text>
  
  <rect x="640" y="350" width="140" height="25" fill="#e2e8f0" stroke="#a0aec0"/>
  <text x="710" y="367" text-anchor="middle" class="table-header">Best Use Case</text>
  
  <rect x="780" y="350" width="100" height="25" fill="#e2e8f0" stroke="#a0aec0"/>
  <text x="830" y="367" text-anchor="middle" class="table-header">Runtime</text>
  
  <!-- Row 1: Simple Split -->
  <rect x="70" y="375" width="110" height="22" class="table-row-odd"/>
  <text x="125" y="389" text-anchor="middle" class="table-cell">Simple Split</text>
  <rect x="180" y="375" width="110" height="22" class="table-row-odd"/>
  <text x="235" y="389" text-anchor="middle" class="table-cell excellent">1</text>
  <rect x="290" y="375" width="130" height="22" class="table-row-odd"/>
  <text x="355" y="389" text-anchor="middle" class="table-cell excellent">O(T)</text>
  <rect x="420" y="375" width="110" height="22" class="table-row-odd"/>
  <text x="475" y="389" text-anchor="middle" class="table-cell excellent">O(n)</text>
  <rect x="530" y="375" width="110" height="22" class="table-row-odd"/>
  <text x="585" y="389" text-anchor="middle" class="table-cell">N/A</text>
  <rect x="640" y="375" width="140" height="22" class="table-row-odd"/>
  <text x="710" y="389" text-anchor="middle" class="table-cell">Large datasets</text>
  <rect x="780" y="375" width="100" height="22" class="table-row-odd"/>
  <text x="830" y="389" text-anchor="middle" class="table-cell excellent">Fastest</text>
  
  <!-- Row 2: K-Fold -->
  <rect x="70" y="397" width="110" height="22" class="table-row-even"/>
  <text x="125" y="411" text-anchor="middle" class="table-cell">K-Fold CV</text>
  <rect x="180" y="397" width="110" height="22" class="table-row-even"/>
  <text x="235" y="411" text-anchor="middle" class="table-cell good">K (5-10)</text>
  <rect x="290" y="397" width="130" height="22" class="table-row-even"/>
  <text x="355" y="411" text-anchor="middle" class="table-cell good">O(K×T)</text>
  <rect x="420" y="397" width="110" height="22" class="table-row-even"/>
  <text x="475" y="411" text-anchor="middle" class="table-cell excellent">O(n)</text>
  <rect x="530" y="397" width="110" height="22" class="table-row-even"/>
  <text x="585" y="411" text-anchor="middle" class="table-cell excellent">Excellent</text>
  <rect x="640" y="397" width="140" height="22" class="table-row-even"/>
  <text x="710" y="411" text-anchor="middle" class="table-cell">General purpose</text>
  <rect x="780" y="397" width="100" height="22" class="table-row-even"/>
  <text x="830" y="411" text-anchor="middle" class="table-cell good">Fast</text>
  
  <!-- Row 3: LOOCV -->
  <rect x="70" y="419" width="110" height="22" class="table-row-odd"/>
  <text x="125" y="433" text-anchor="middle" class="table-cell">LOOCV</text>
  <rect x="180" y="419" width="110" height="22" class="table-row-odd"/>
  <text x="235" y="433" text-anchor="middle" class="table-cell poor">n</text>
  <rect x="290" y="419" width="130" height="22" class="table-row-odd"/>
  <text x="355" y="433" text-anchor="middle" class="table-cell poor">O(n×T)</text>
  <rect x="420" y="419" width="110" height="22" class="table-row-odd"/>
  <text x="475" y="433" text-anchor="middle" class="table-cell excellent">O(n)</text>
  <rect x="530" y="419" width="110" height="22" class="table-row-odd"/>
  <text x="585" y="433" text-anchor="middle" class="table-cell good">Limited</text>
  <rect x="640" y="419" width="140" height="22" class="table-row-odd"/>
  <text x="710" y="433" text-anchor="middle" class="table-cell">Small datasets</text>
  <rect x="780" y="419" width="100" height="22" class="table-row-odd"/>
  <text x="830" y="433" text-anchor="middle" class="table-cell moderate">Slow</text>
  
  <!-- Row 4: Nested CV -->
  <rect x="70" y="441" width="110" height="22" class="table-row-even"/>
  <text x="125" y="455" text-anchor="middle" class="table-cell">Nested CV</text>
  <rect x="180" y="441" width="110" height="22" class="table-row-even"/>
  <text x="235" y="455" text-anchor="middle" class="table-cell poor">K1×K2×H</text>
  <rect x="290" y="441" width="130" height="22" class="table-row-even"/>
  <text x="355" y="455" text-anchor="middle" class="table-cell poor">O(K1×K2×H×T)</text>
  <rect x="420" y="441" width="110" height="22" class="table-row-even"/>
  <text x="475" y="455" text-anchor="middle" class="table-cell excellent">O(n)</text>
  <rect x="530" y="441" width="110" height="22" class="table-row-even"/>
  <text x="585" y="455" text-anchor="middle" class="table-cell excellent">Excellent</text>
  <rect x="640" y="441" width="140" height="22" class="table-row-even"/>
  <text x="710" y="455" text-anchor="middle" class="table-cell">Hyperparameter tuning</text>
  <rect x="780" y="441" width="100" height="22" class="table-row-even"/>
  <text x="830" y="455" text-anchor="middle" class="table-cell poor">Very Slow</text>
  
  <!-- Note -->
  <text x="475" y="480" text-anchor="middle" class="small-text">T = Time to train single model, H = Number of hyperparameter combinations</text>
  
  <!-- Optimization Strategies -->
  <rect x="50" y="510" width="420" height="160" class="optimization-box"/>
  <text x="260" y="535" text-anchor="middle" class="subtitle" fill="#1e4a72">Optimization Strategies</text>
  
  <text x="70" y="560" class="description" fill="#1e4a72" font-weight="bold">Parallel Processing:</text>
  <text x="90" y="577" class="description" fill="#1e4a72">• K-Fold: Train K models simultaneously</text>
  <text x="90" y="594" class="description" fill="#1e4a72">• LOOCV: Batch processing in chunks</text>
  <text x="90" y="611" class="description" fill="#1e4a72">• Nested CV: Parallelize both loops</text>
  
  <text x="70" y="635" class="description" fill="#1e4a72" font-weight="bold">Efficiency Techniques:</text>
  <text x="90" y="652" class="description" fill="#1e4a72">• Early stopping for large datasets</text>
  <text x="90" y="669" class="description" fill="#1e4a72">• Incremental learning for online models</text>
  
  <!-- Performance Guidelines -->
  <rect x="490" y="510" width="410" height="160" class="performance-box"/>
  <text x="695" y="535" text-anchor="middle" class="subtitle" fill="#155724">Performance Guidelines</text>
  
  <text x="510" y="560" class="description" fill="#155724" font-weight="bold">Dataset Size Recommendations:</text>
  <text x="530" y="577" class="description" fill="#155724">• n less than 100: LOOCV acceptable (low cost)</text>
  <text x="530" y="594" class="description" fill="#155724">• 100 to 10K: K-Fold optimal balance</text>
  <text x="530" y="611" class="description" fill="#155724">• n greater than 10K: Simple split often sufficient</text>
  
  <text x="510" y="635" class="description" fill="#155724" font-weight="bold">Computational Budget:</text>
  <text x="530" y="652" class="description" fill="#155724">• Limited time: K=3 or simple split</text>
  <text x="530" y="669" class="description" fill="#155724">• Unlimited resources: Nested CV with K=5</text>
  
  <!-- Bottom Summary -->
  <rect x="50" y="690" width="850" height="50" class="box"/>
  <text x="475" y="710" text-anchor="middle" class="section-title">Key Takeaway</text>
  <text x="475" y="728" text-anchor="middle" class="description">K-Fold CV with K=5 provides optimal balance: 5x computational cost but excellent statistical reliability and full parallelization</text>
</svg>