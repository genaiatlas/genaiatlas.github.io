<svg width="1200" height="675" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="675" fill="#f8f9fa"/>
  
  <!-- Fast Track Ribbon -->
  <polygon points="1050,0 1200,0 1200,150" fill="#e74c3c"/>
  <text x="1125" y="75" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" transform="rotate(45 1125 75)">FAST TRACK</text>
  
  <!-- Title -->
  <text x="600" y="50" fill="#2c3e50" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle">Statistical Distributions in Python</text>
  
  <!-- Distribution Types -->
  <rect x="50" y="100" width="270" height="120" fill="#3498db" stroke="#2c3e50" stroke-width="2" rx="10"/>
  <text x="185" y="130" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Normal Distribution</text>
  <text x="185" y="150" fill="white" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">scipy.stats.norm</text>
  <text x="185" y="170" fill="white" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Parameters: loc, scale</text>
  <text x="185" y="190" fill="white" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Bell curve shape</text>
  <text x="185" y="210" fill="white" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Continuous data</text>
  
  <rect x="340" y="100" width="270" height="120" fill="#27ae60" stroke="#2c3e50" stroke-width="2" rx="10"/>
  <text x="475" y="130" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Binomial Distribution</text>
  <text x="475" y="150" fill="white" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">scipy.stats.binom</text>
  <text x="475" y="170" fill="white" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Parameters: n, p</text>
  <text x="475" y="190" fill="white" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Success/failure trials</text>
  <text x="475" y="210" fill="white" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Discrete data</text>
  
  <rect x="630" y="100" width="270" height="120" fill="#f39c12" stroke="#2c3e50" stroke-width="2" rx="10"/>
  <text x="765" y="130" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Poisson Distribution</text>
  <text x="765" y="150" fill="white" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">scipy.stats.poisson</text>
  <text x="765" y="170" fill="white" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Parameter: mu (λ)</text>
  <text x="765" y="190" fill="white" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Count/rate data</text>
  <text x="765" y="210" fill="white" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Rare events</text>
  
  <rect x="920" y="100" width="270" height="120" fill="#9b59b6" stroke="#2c3e50" stroke-width="2" rx="10"/>
  <text x="1055" y="130" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Beta Distribution</text>
  <text x="1055" y="150" fill="white" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">scipy.stats.beta</text>
  <text x="1055" y="170" fill="white" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Parameters: a, b</text>
  <text x="1055" y="190" fill="white" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Probabilities [0,1]</text>
  <text x="1055" y="210" fill="white" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Bayesian analysis</text>
  
  <!-- Common Methods -->
  <text x="100" y="270" fill="#2c3e50" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Common Methods:</text>
  
  <rect x="50" y="290" width="220" height="80" fill="#ecf0f1" stroke="#34495e" stroke-width="1" rx="5"/>
  <text x="160" y="315" fill="#2c3e50" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">.rvs()</text>
  <text x="160" y="335" fill="#7f8c8d" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Random samples</text>
  <text x="160" y="355" fill="#7f8c8d" font-family="monospace" font-size="11" text-anchor="middle">norm.rvs(size=1000)</text>
  
  <rect x="290" y="290" width="220" height="80" fill="#ecf0f1" stroke="#34495e" stroke-width="1" rx="5"/>
  <text x="400" y="315" fill="#2c3e50" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">.pdf()</text>
  <text x="400" y="335" fill="#7f8c8d" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Probability density</text>
  <text x="400" y="355" fill="#7f8c8d" font-family="monospace" font-size="11" text-anchor="middle">norm.pdf(x)</text>
  
  <rect x="530" y="290" width="220" height="80" fill="#ecf0f1" stroke="#34495e" stroke-width="1" rx="5"/>
  <text x="640" y="315" fill="#2c3e50" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">.cdf()</text>
  <text x="640" y="335" fill="#7f8c8d" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Cumulative prob.</text>
  <text x="640" y="355" fill="#7f8c8d" font-family="monospace" font-size="11" text-anchor="middle">norm.cdf(x)</text>
  
  <rect x="770" y="290" width="220" height="80" fill="#ecf0f1" stroke="#34495e" stroke-width="1" rx="5"/>
  <text x="880" y="315" fill="#2c3e50" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">.fit()</text>
  <text x="880" y="335" fill="#7f8c8d" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Parameter estimation</text>
  <text x="880" y="355" fill="#7f8c8d" font-family="monospace" font-size="11" text-anchor="middle">norm.fit(data)</text>
  
  <!-- Code Example -->
  <rect x="50" y="400" width="1100" height="140" fill="#2c3e50" stroke="#34495e" stroke-width="2" rx="5"/>
  <text x="70" y="430" fill="#f39c12" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Example Code:</text>
  <text x="70" y="460" fill="#ecf0f1" font-family="monospace" font-size="14">import scipy.stats as stats</text>
  <text x="70" y="480" fill="#ecf0f1" font-family="monospace" font-size="14">import numpy as np</text>
  <text x="70" y="500" fill="#ecf0f1" font-family="monospace" font-size="14"># Generate random samples from normal distribution</text>
  <text x="70" y="520" fill="#ecf0f1" font-family="monospace" font-size="14">samples = stats.norm.rvs(loc=0, scale=1, size=1000)</text>
  
  <!-- Applications -->
  <rect x="50" y="570" width="520" height="80" fill="#e8f8f5" stroke="#27ae60" stroke-width="2" rx="5"/>
  <text x="70" y="600" fill="#27ae60" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Applications:</text>
  <text x="70" y="620" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12">• Model real-world phenomena</text>
  <text x="70" y="640" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12">• Generate synthetic data for testing</text>
  <text x="280" y="620" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12">• Calculate probabilities</text>
  <text x="280" y="640" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12">• Statistical inference</text>
  
  <!-- Tips -->
  <rect x="600" y="570" width="550" height="80" fill="#fef9e7" stroke="#f39c12" stroke-width="2" rx="5"/>
  <text x="620" y="600" fill="#f39c12" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Tips:</text>
  <text x="620" y="620" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12">• Use Q-Q plots to check distribution fit</text>
  <text x="620" y="640" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12">• Central Limit Theorem → Normal for large samples</text>
</svg>