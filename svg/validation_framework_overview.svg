<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'Arial', sans-serif; font-size: 20px; font-weight: bold; fill: #2c3e50; }
      .subtitle { font-family: 'Arial', sans-serif; font-size: 16px; fill: #34495e; font-weight: bold; }
      .section-title { font-family: 'Arial', sans-serif; font-size: 14px; fill: #34495e; font-weight: bold; }
      .description { font-family: 'Arial', sans-serif; font-size: 12px; fill: #34495e; }
      .small-text { font-family: 'Arial', sans-serif; font-size: 10px; fill: #34495e; }
      .box { fill: #f8f9fa; stroke: #dee2e6; stroke-width: 2; rx: 8; }
      .train-box { fill: #e3f2fd; stroke: #1976d2; stroke-width: 2; rx: 8; }
      .val-box { fill: #fff3e0; stroke: #f57c00; stroke-width: 2; rx: 8; }
      .traditional-box { fill: #ffebee; stroke: #d32f2f; stroke-width: 2; rx: 8; }
      .validation-box { fill: #e8f5e8; stroke: #388e3c; stroke-width: 2; rx: 8; }
      .arrow { stroke: #34495e; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .curved-arrow { stroke: #e74c3c; stroke-width: 3; fill: none; marker-end: url(#redarrowhead); }
      .data-rect { fill: #3498db; stroke: #2980b9; stroke-width: 1; }
      .split-line { stroke: #e74c3c; stroke-width: 3; stroke-dasharray: 5,5; }
      .traditional-color { fill: #d32f2f; font-weight: bold; }
      .validation-color { fill: #388e3c; font-weight: bold; }
      .warning { fill: #e74c3c; font-weight: bold; }
      .good { fill: #27ae60; font-weight: bold; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e" />
    </marker>
    <marker id="redarrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c" />
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="400" y="25" text-anchor="middle" class="title">Validation Framework: Traditional vs Modern Approach</text>
  
  <!-- Traditional Approach Section -->
  <rect x="50" y="50" width="320" height="200" class="traditional-box"/>
  <text x="210" y="75" text-anchor="middle" class="subtitle traditional-color">Traditional Approach</text>
  
  <!-- Full dataset visualization -->
  <g transform="translate(80, 100)">
    <text x="130" y="15" text-anchor="middle" class="section-title">Complete Dataset</text>
    <!-- Dataset rectangle -->
    <rect x="20" y="20" width="220" height="40" class="data-rect"/>
    <text x="130" y="45" text-anchor="middle" class="description" fill="white">All Data Used for Training</text>
    
    <!-- Arrow to model -->
    <path d="M 130 70 L 130 100" class="arrow"/>
    
    <!-- Model box -->
    <rect x="80" y="105" width="100" height="30" fill="#9b59b6" stroke="#8e44ad" stroke-width="2" rx="4"/>
    <text x="130" y="125" text-anchor="middle" class="description" fill="white">Train Model</text>
    
    <!-- Arrow to evaluation -->
    <path d="M 130 140 L 130 160" class="arrow"/>
    
    <!-- Evaluation -->
    <rect x="60" y="165" width="140" height="25" fill="#e74c3c" stroke="#c0392b" stroke-width="2" rx="4"/>
    <text x="130" y="180" text-anchor="middle" class="description" fill="white">Evaluate on Same Data</text>
  </g>
  
  <!-- Problems with traditional approach -->
  <text x="70" y="220" class="description traditional-color" font-weight="bold">Problems:</text>
  <text x="70" y="235" class="description">• Overly optimistic performance</text>
  <text x="70" y="248" class="description">• No generalization assessment</text>
  <text x="70" y="261" class="description">• High risk of overfitting</text>
  
  <!-- Validation Approach Section -->
  <rect x="430" y="50" width="320" height="200" class="validation-box"/>
  <text x="590" y="75" text-anchor="middle" class="subtitle validation-color">Validation Approach</text>
  
  <!-- Data splitting visualization -->
  <g transform="translate(460, 100)">
    <text x="130" y="15" text-anchor="middle" class="section-title">Dataset Split</text>
    
    <!-- Training data -->
    <rect x="20" y="20" width="160" height="25" class="train-box"/>
    <text x="100" y="37" text-anchor="middle" class="description">Training Set (80%)</text>
    
    <!-- Validation data -->
    <rect x="180" y="20" width="60" height="25" class="val-box"/>
    <text x="210" y="37" text-anchor="middle" class="description">Val (20%)</text>
    
    <!-- Split line -->
    <line x1="180" y1="15" x2="180" y2="50" class="split-line"/>
    
    <!-- Training arrow -->
    <path d="M 100 50 L 100 75" class="arrow"/>
    <rect x="60" y="80" width="80" height="25" fill="#9b59b6" stroke="#8e44ad" stroke-width="2" rx="4"/>
    <text x="100" y="97" text-anchor="middle" class="description" fill="white">Train Model</text>
    
    <!-- Validation arrow -->
    <path d="M 210 50 Q 190 65 170 80" class="curved-arrow"/>
    <rect x="160" y="115" width="100" height="25" fill="#27ae60" stroke="#2ecc71" stroke-width="2" rx="4"/>
    <text x="210" y="132" text-anchor="middle" class="description" fill="white">Test on Val Set</text>
  </g>
  
  <!-- Benefits of validation approach -->
  <text x="450" y="210" class="description validation-color" font-weight="bold">Benefits:</text>
  <text x="450" y="225" class="description">• Unbiased performance estimate</text>
  <text x="450" y="238" class="description">• Detects overfitting</text>
  <text x="450" y="251" class="description">• Enables model comparison</text>
  
  <!-- Comparison Table -->
  <rect x="50" y="280" width="700" height="140" class="box"/>
  <text x="400" y="305" text-anchor="middle" class="subtitle">Approach Comparison</text>
  
  <!-- Table headers -->
  <text x="100" y="330" text-anchor="middle" class="section-title">Aspect</text>
  <text x="300" y="330" text-anchor="middle" class="section-title traditional-color">Traditional</text>
  <text x="600" y="330" text-anchor="middle" class="section-title validation-color">Validation</text>
  
  <!-- Horizontal line -->
  <line x1="70" y1="335" x2="730" y2="335" stroke="#bdc3c7" stroke-width="1"/>
  
  <!-- Row 1: Data Usage -->
  <text x="70" y="355" class="description" font-weight="bold">Data Usage</text>
  <text x="300" y="355" text-anchor="middle" class="description">100% for training</text>
  <text x="600" y="355" text-anchor="middle" class="description">80% train, 20% validate</text>
  
  <!-- Row 2: Performance Metric -->
  <text x="70" y="375" class="description" font-weight="bold">Evaluation</text>
  <text x="300" y="375" text-anchor="middle" class="description">Training error/R²</text>
  <text x="600" y="375" text-anchor="middle" class="description">Validation error</text>
  
  <!-- Row 3: Bias -->
  <text x="70" y="395" class="description" font-weight="bold">Bias Level</text>
  <text x="300" y="395" text-anchor="middle" class="warning">High (optimistic)</text>
  <text x="600" y="395" text-anchor="middle" class="good">Low (realistic)</text>
  
  <!-- Row 4: Generalization -->
  <text x="70" y="415" class="description" font-weight="bold">Generalization</text>
  <text x="300" y="415" text-anchor="middle" class="warning">Unknown</text>
  <text x="600" y="415" text-anchor="middle" class="good">Estimated</text>
  
  <!-- Key Principle Box -->
  <rect x="50" y="440" width="700" height="80" fill="#fff3cd" stroke="#ffc107" stroke-width="2" rx="8"/>
  <text x="400" y="465" text-anchor="middle" class="subtitle" fill="#856404">Core Validation Principle</text>
  
  <text x="70" y="485" class="description" fill="#856404">Models should be evaluated on data they have never seen during training.</text>
  <text x="70" y="500" class="description" fill="#856404">This simulates real-world deployment where the model encounters new, unseen examples.</text>
  
  <!-- Bottom Statistics -->
  <rect x="50" y="540" width="700" height="50" class="box"/>
  <text x="400" y="560" text-anchor="middle" class="section-title">Typical Performance Gap</text>
  <text x="70" y="580" class="description">Training Error: Often 10-30% lower than true generalization error</text>
  <text x="450" y="580" class="description">Validation Error: Realistic estimate of true performance</text>
</svg>