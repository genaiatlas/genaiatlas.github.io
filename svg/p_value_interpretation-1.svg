<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    P-Value Interpretation Under H₀
  </text>
  
  <!-- Normal distribution curve -->
  <path d="M 50 300 Q 150 200 250 250 Q 350 150 400 140 Q 450 150 550 250 Q 650 200 750 300" 
        stroke="#2196f3" stroke-width="3" fill="none"/>
  
  <!-- Critical regions (two-tailed, α = 0.05) -->
  <!-- Left tail -->
  <path d="M 50 300 Q 100 270 150 280 Q 180 285 200 290" 
        stroke="#f44336" stroke-width="2" fill="rgba(244, 67, 54, 0.3)"/>
  <line x1="200" y1="140" x2="200" y2="290" stroke="#f44336" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="125" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#f44336">α/2 = 0.025</text>
  
  <!-- Right tail -->
  <path d="M 600 290 Q 620 285 650 280 Q 700 270 750 300" 
        stroke="#f44336" stroke-width="2" fill="rgba(244, 67, 54, 0.3)"/>
  <line x1="600" y1="140" x2="600" y2="290" stroke="#f44336" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="675" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#f44336">α/2 = 0.025</text>
  
  <!-- Observed test statistic -->
  <line x1="550" y1="130" x2="550" y2="250" stroke="#ff9800" stroke-width="4"/>
  <text x="555" y="125" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ff9800">Observed</text>
  <text x="555" y="140" font-family="Arial, sans-serif" font-size="12" fill="#ff9800">test statistic</text>
  
  <!-- P-value area -->
  <path d="M 550 250 Q 575 265 600 290 Q 650 280 700 270 Q 725 275 750 300" 
        stroke="#9c27b0" stroke-width="3" fill="rgba(156, 39, 176, 0.4)"/>
  <text x="650" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#9c27b0">
    p-value
  </text>
  <text x="650" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#9c27b0">
    (one tail)
  </text>
  
  <!-- Center line (H₀) -->
  <line x1="400" y1="130" x2="400" y2="310" stroke="#666" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="405" y="125" font-family="Arial, sans-serif" font-size="12" fill="#666">H₀ true</text>
  
  <!-- Interpretation boxes -->
  <!-- Correct interpretation -->
  <rect x="50" y="370" width="340" height="120" fill="#e8f5e8" stroke="#4caf50" stroke-width="2" rx="8"/>
  <text x="220" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2e7d32">
    ✅ Correct Interpretation
  </text>
  <text x="70" y="415" font-family="Arial, sans-serif" font-size="12" fill="#333">
    "If H₀ were true, the probability of observing
  </text>
  <text x="70" y="430" font-family="Arial, sans-serif" font-size="12" fill="#333">
    a test statistic this extreme or more extreme
  </text>
  <text x="70" y="445" font-family="Arial, sans-serif" font-size="12" fill="#333">
    is p = 0.032"
  </text>
  <text x="70" y="465" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2e7d32">
    Key points:
  </text>
  <text x="70" y="478" font-family="Arial, sans-serif" font-size="10" fill="#333">
    • Conditional on H₀ being true • About the data, not H₀
  </text>
  
  <!-- Wrong interpretation -->
  <rect x="410" y="370" width="340" height="120" fill="#ffebee" stroke="#f44336" stroke-width="2" rx="8"/>
  <text x="580" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#d32f2f">
    ❌ Common Mistakes
  </text>
  <text x="430" y="415" font-family="Arial, sans-serif" font-size="12" fill="#333">
    "The probability that H₀ is true is 0.032"
  </text>
  <text x="430" y="430" font-family="Arial, sans-serif" font-size="12" fill="#333">
    "The probability of making an error is 0.032"
  </text>
  <text x="430" y="445" font-family="Arial, sans-serif" font-size="12" fill="#333">
    "There's a 96.8% chance H₁ is true"
  </text>
  <text x="430" y="465" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#d32f2f">
    Why wrong:
  </text>
  <text x="430" y="478" font-family="Arial, sans-serif" font-size="10" fill="#333">
    • P(data|H₀) ≠ P(H₀|data) • Frequentist, not Bayesian
  </text>
  
  <!-- P-value scale -->
  <rect x="150" y="510" width="500" height="70" fill="#f5f5f5" stroke="#757575" stroke-width="1" rx="5"/>
  <text x="400" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#424242">
    P-Value Decision Rules (α = 0.05)
  </text>
  
  <!-- Scale line -->
  <line x1="170" y1="550" x2="630" y2="550" stroke="#333" stroke-width="2"/>
  
  <!-- Scale markers -->
  <line x1="170" y1="545" x2="170" y2="555" stroke="#333" stroke-width="2"/>
  <text x="170" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">0.00</text>
  
  <line x1="285" y1="545" x2="285" y2="555" stroke="#f44336" stroke-width="3"/>
  <text x="285" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#f44336">0.05</text>
  
  <line x1="400" y1="545" x2="400" y2="555" stroke="#333" stroke-width="2"/>
  <text x="400" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">0.50</text>
  
  <line x1="630" y1="545" x2="630" y2="555" stroke="#333" stroke-width="2"/>
  <text x="630" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">1.00</text>
  
  <!-- Decision regions -->
  <rect x="170" y="535" width="115" height="10" fill="rgba(76, 175, 80, 0.6)"/>
  <text x="227" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2e7d32">Reject H₀</text>
  
  <rect x="285" y="535" width="345" height="10" fill="rgba(158, 158, 158, 0.6)"/>
  <text x="457" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#424242">Fail to reject H₀</text>
  
  <!-- Example p-value marker -->
  <circle cx="250" cy="550" r="4" fill="#ff9800"/>
  <text x="250" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ff9800">
    p = 0.032
  </text>
  
  <!-- Mathematical definition -->
  <rect x="250" y="60" width="300" height="60" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="5"/>
  <text x="400" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f57c00">
    Mathematical Definition
  </text>
  <text x="400" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">
    p-value = P(|Test Statistic| ≥ |Observed| | H₀ true)
  </text>
</svg>