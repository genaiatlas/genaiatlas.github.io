<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f6f0"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">Archaeological Site Clustering</text>
  
  <!-- Coordinate System -->
  <line x1="100" y1="550" x2="700" y2="550" stroke="#34495e" stroke-width="2"/>
  <line x1="100" y1="550" x2="100" y2="80" stroke="#34495e" stroke-width="2"/>
  
  <!-- Axis Labels -->
  <text x="400" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#34495e">Distance East (meters)</text>
  <text x="50" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#34495e" transform="rotate(-90, 50, 320)">Distance North (meters)</text>
  
  <!-- Family 1 Cluster (Bottom Left) - Lannister -->
  <g id="family1">
    <ellipse cx="200" cy="450" rx="80" ry="60" fill="#e74c3c" opacity="0.2" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="200" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#c0392b">Family 1</text>
    
    <!-- Artifacts -->
    <circle cx="180" cy="430" r="4" fill="#c0392b"/>
    <circle cx="200" cy="440" r="4" fill="#c0392b"/>
    <circle cx="220" cy="435" r="4" fill="#c0392b"/>
    <circle cx="190" cy="460" r="4" fill="#c0392b"/>
    <circle cx="210" cy="465" r="4" fill="#c0392b"/>
    <circle cx="175" cy="445" r="4" fill="#c0392b"/>
    <circle cx="225" cy="450" r="4" fill="#c0392b"/>
    <circle cx="195" cy="420" r="4" fill="#c0392b"/>
  </g>
  
  <!-- Family 2 Cluster (Top Left) - Stark -->
  <g id="family2">
    <ellipse cx="250" cy="200" rx="70" ry="55" fill="#3498db" opacity="0.2" stroke="#2980b9" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="250" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2980b9">Family 2</text>
    
    <!-- Artifacts -->
    <circle cx="230" cy="180" r="4" fill="#2980b9"/>
    <circle cx="250" cy="190" r="4" fill="#2980b9"/>
    <circle cx="270" cy="185" r="4" fill="#2980b9"/>
    <circle cx="240" cy="210" r="4" fill="#2980b9"/>
    <circle cx="260" cy="215" r="4" fill="#2980b9"/>
    <circle cx="225" cy="195" r="4" fill="#2980b9"/>
    <circle cx="275" cy="200" r="4" fill="#2980b9"/>
  </g>
  
  <!-- Family 3 Cluster (Right) - Targaryen -->
  <g id="family3">
    <ellipse cx="550" cy="300" rx="75" ry="65" fill="#27ae60" opacity="0.2" stroke="#229954" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="550" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#229954">Family 3</text>
    
    <!-- Artifacts -->
    <circle cx="530" cy="280" r="4" fill="#229954"/>
    <circle cx="550" cy="290" r="4" fill="#229954"/>
    <circle cx="570" cy="285" r="4" fill="#229954"/>
    <circle cx="540" cy="310" r="4" fill="#229954"/>
    <circle cx="560" cy="315" r="4" fill="#229954"/>
    <circle cx="525" cy="295" r="4" fill="#229954"/>
    <circle cx="575" cy="300" r="4" fill="#229954"/>
    <circle cx="545" cy="270" r="4" fill="#229954"/>
    <circle cx="565" cy="275" r="4" fill="#229954"/>
  </g>
  
  <!-- Legend -->
  <g id="legend">
    <rect x="520" y="420" width="250" height="110" fill="white" stroke="#34495e" stroke-width="1" rx="5"/>
    <text x="535" y="440" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#34495e">Legend</text>
    
    <circle cx="540" cy="460" r="4" fill="#c0392b"/>
    <text x="555" y="465" font-family="Arial, sans-serif" font-size="12" fill="#34495e">Family 1 Artifacts</text>
    
    <circle cx="540" cy="480" r="4" fill="#2980b9"/>
    <text x="555" y="485" font-family="Arial, sans-serif" font-size="12" fill="#34495e">Family 2 Artifacts</text>
    
    <circle cx="540" cy="500" r="4" fill="#229954"/>
    <text x="555" y="505" font-family="Arial, sans-serif" font-size="12" fill="#34495e">Family 3 Artifacts</text>
    
    <ellipse cx="540" cy="520" rx="15" ry="8" fill="none" stroke="#34495e" stroke-dasharray="3,3"/>
    <text x="565" y="525" font-family="Arial, sans-serif" font-size="12" fill="#34495e">Cluster Boundary</text>
  </g>
  
  <!-- Scale markers -->
  <g id="scale">
    <line x1="100" y1="545" x2="100" y2="555" stroke="#34495e" stroke-width="1"/>
    <text x="100" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#34495e">0</text>
    
    <line x1="200" y1="545" x2="200" y2="555" stroke="#34495e" stroke-width="1"/>
    <text x="200" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#34495e">50</text>
    
    <line x1="300" y1="545" x2="300" y2="555" stroke="#34495e" stroke-width="1"/>
    <text x="300" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#34495e">100</text>
    
    <line x1="95" y1="550" x2="105" y2="550" stroke="#34495e" stroke-width="1"/>
    <text x="90" y="555" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#34495e">0</text>
    
    <line x1="95" y1="450" x2="105" y2="450" stroke="#34495e" stroke-width="1"/>
    <text x="90" y="455" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#34495e">50</text>
    
    <line x1="95" y1="350" x2="105" y2="350" stroke="#34495e" stroke-width="1"/>
    <text x="90" y="355" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#34495e">100</text>
  </g>
  
  <!-- Reference marker -->
  <g id="marker">
    <polygon points="100,550 110,540 110,545 120,545 120,555 110,555 110,560" fill="#e67e22"/>
    <text x="130" y="555" font-family="Arial, sans-serif" font-size="10" fill="#e67e22">Reference Marker</text>
  </g>
</svg>