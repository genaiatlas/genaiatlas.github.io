<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1e293b">
    AI Applications Framework
  </text>
  
  <!-- Central AI Core -->
  <circle cx="400" cy="300" r="80" fill="#3b82f6" stroke="#1e40af" stroke-width="3"/>
  <text x="400" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
    Artificial
  </text>
  <text x="400" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
    Intelligence
  </text>
  
  <!-- Retail Sector -->
  <rect x="100" y="120" width="140" height="100" rx="10" fill="#10b981" stroke="#047857" stroke-width="2"/>
  <text x="170" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    RETAIL
  </text>
  <text x="170" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Demand Forecasting
  </text>
  <text x="170" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Inventory Management
  </text>
  <text x="170" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Personalization
  </text>
  <text x="170" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Supply Chain
  </text>
  
  <!-- Healthcare Sector -->
  <rect x="560" y="120" width="140" height="100" rx="10" fill="#ef4444" stroke="#dc2626" stroke-width="2"/>
  <text x="630" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    HEALTHCARE
  </text>
  <text x="630" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Medical Diagnosis
  </text>
  <text x="630" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Image Analysis
  </text>
  <text x="630" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Treatment Planning
  </text>
  <text x="630" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Patient Monitoring
  </text>
  
  <!-- Banking Sector -->
  <rect x="560" y="480" width="140" height="100" rx="10" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
  <text x="630" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    BANKING
  </text>
  <text x="630" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Fraud Detection
  </text>
  <text x="630" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Risk Assessment
  </text>
  <text x="630" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Algorithmic Trading
  </text>
  <text x="630" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Customer Service
  </text>
  
  <!-- Data Science -->
  <rect x="100" y="480" width="140" height="100" rx="10" fill="#8b5cf6" stroke="#7c3aed" stroke-width="2"/>
  <text x="170" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    DATA SCIENCE
  </text>
  <text x="170" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Data Processing
  </text>
  <text x="170" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Model Training
  </text>
  <text x="170" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Deployment
  </text>
  <text x="170" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Monitoring
  </text>
  
  <!-- Connection Lines -->
  <line x1="240" y1="170" x2="340" y2="250" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="560" y1="170" x2="460" y2="250" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="560" y1="530" x2="460" y2="350" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="240" y1="530" x2="340" y2="350" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Core Technologies -->
  <rect x="300" y="60" width="200" height="60" rx="5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="400" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#334155">
    Core Technologies
  </text>
  <text x="400" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#475569">
    Machine Learning • NLP • Computer Vision
  </text>
  <text x="400" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#475569">
    Predictive Analytics • Deep Learning
  </text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>
  
  <!-- Key Benefits Box -->
  <rect x="50" y="300" width="180" height="120" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="140" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#334155">
    Key Benefits
  </text>
  <text x="60" y="340" font-family="Arial, sans-serif" font-size="10" fill="#475569">
    • Operational Efficiency
  </text>
  <text x="60" y="355" font-family="Arial, sans-serif" font-size="10" fill="#475569">
    • Predictive Analytics
  </text>
  <text x="60" y="370" font-family="Arial, sans-serif" font-size="10" fill="#475569">
    • Personalization
  </text>
  <text x="60" y="385" font-family="Arial, sans-serif" font-size="10" fill="#475569">
    • Risk Management
  </text>
  <text x="60" y="400" font-family="Arial, sans-serif" font-size="10" fill="#475569">
    • Cost Reduction
  </text>
</svg>