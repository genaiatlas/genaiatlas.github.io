<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">Double Machine Learning (DML) Algorithm</text>
  
  <!-- Data splitting illustration -->
  <rect x="50" y="50" width="300" height="80" fill="#e3f2fd" stroke="#2196f3" stroke-width="2" rx="10"/>
  <text x="200" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Step 0: Random Sample Splitting</text>
  
  <!-- Sample A -->
  <rect x="70" y="90" width="100" height="30" fill="#81c784" stroke="#4caf50" stroke-width="2" rx="5"/>
  <text x="120" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Sample A</text>
  <text x="120" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#4caf50">Auxiliary</text>
  
  <!-- Sample M -->
  <rect x="230" y="90" width="100" height="30" fill="#ffb74d" stroke="#ff9800" stroke-width="2" rx="5"/>
  <text x="280" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Sample M</text>
  <text x="280" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#ff9800">Main</text>
  
  <!-- First Round -->
  <rect x="450" y="50" width="300" height="180" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="10"/>
  <text x="600" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Round 1: A → M</text>
  
  <!-- Step 1.1 -->
  <circle cx="480" cy="105" r="15" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="480" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">1</text>
  <text x="505" y="110" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Train ℓ̂(Z) and m̂(Z) on Sample A</text>
  
  <!-- ML Methods -->
  <rect x="520" y="120" width="200" height="40" fill="#e8f5e8" stroke="#4caf50" stroke-width="1" rx="5"/>
  <text x="620" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">ML Methods: Random Forest, Neural Nets,</text>
  <text x="620" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">Lasso, Ridge, Boosting, etc.</text>
  
  <!-- Step 1.2 -->
  <circle cx="480" cy="175" r="15" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <text x="480" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">2</text>
  <text x="505" y="180" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Apply to Sample M: Ỹᵢ = Yᵢ - ℓ̂(Zᵢ), D̃ᵢ = Dᵢ - m̂(Zᵢ)</text>
  
  <!-- Step 1.3 -->
  <circle cx="480" cy="205" r="15" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
  <text x="480" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">3</text>
  <text x="505" y="210" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Estimate β̂¹ = arg min Σᵢ∈M (Ỹᵢ - bD̃ᵢ)²</text>
  
  <!-- Second Round -->
  <rect x="450" y="250" width="300" height="180" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2" rx="10"/>
  <text x="600" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Round 2: M → A</text>
  
  <!-- Step 2.1 -->
  <circle cx="480" cy="305" r="15" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="480" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">1</text>
  <text x="505" y="310" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Train ℓ̂(Z) and m̂(Z) on Sample M</text>
  
  <!-- Step 2.2 -->
  <circle cx="480" cy="335" r="15" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <text x="480" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">2</text>
  <text x="505" y="340" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Apply to Sample A: Ỹᵢ = Yᵢ - ℓ̂(Zᵢ), D̃ᵢ = Dᵢ - m̂(Zᵢ)</text>
  
  <!-- Step 2.3 -->
  <circle cx="480" cy="365" r="15" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
  <text x="480" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">3</text>
  <text x="505" y="370" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Estimate β̂² = arg min Σᵢ∈A (Ỹᵢ - bD̃ᵢ)²</text>
  
  <!-- Role Reversal -->
  <text x="620" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-style="italic" fill="#7f8c8d">Roles reversed to avoid overfitting</text>
  
  <!-- Final Step -->
  <rect x="250" y="450" width="300" height="100" fill="#e8f5e8" stroke="#27ae60" stroke-width="3" rx="10"/>
  <text x="400" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Final Estimate</text>
  
  <text x="400" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#27ae60">β̂ = ½β̂¹ + ½β̂²</text>
  
  <text x="400" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">Average of both estimates reduces overfitting bias</text>
  
  <!-- Sample splitting diagram -->
  <rect x="50" y="150" width="300" height="250" fill="#f5f5f5" stroke="#95a5a6" stroke-width="2" rx="10"/>
  <text x="200" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Cross-Fitting Process</text>
  
  <!-- Round 1 visual -->
  <text x="70" y="200" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ff9800">Round 1:</text>
  <rect x="70" y="210" width="60" height="20" fill="#81c784" stroke="#4caf50" stroke-width="1"/>
  <text x="100" y="223" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">Train</text>
  
  <path d="M 135 220 L 155 220" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  
  <rect x="170" y="210" width="60" height="20" fill="#ffb74d" stroke="#ff9800" stroke-width="1"/>
  <text x="200" y="223" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">Predict</text>
  
  <path d="M 235 220 L 255 220" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  
  <circle cx="280" cy="220" r="15" fill="#f39c12" stroke="#e67e22" stroke-width="1"/>
  <text x="280" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">β̂¹</text>
  
  <!-- Round 2 visual -->
  <text x="70" y="260" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#9c27b0">Round 2:</text>
  <rect x="70" y="270" width="60" height="20" fill="#ffb74d" stroke="#ff9800" stroke-width="1"/>
  <text x="100" y="283" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">Train</text>
  
  <path d="M 135 280 L 155 280" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  
  <rect x="170" y="270" width="60" height="20" fill="#81c784" stroke="#4caf50" stroke-width="1"/>
  <text x="200" y="283" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">Predict</text>
  
  <path d="M 235 280 L 255 280" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  
  <circle cx="280" cy="280" r="15" fill="#f39c12" stroke="#e67e22" stroke-width="1"/>
  <text x="280" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">β̂²</text>
  
  <!-- Benefits box -->
  <rect x="70" y="310" width="260" height="80" fill="#d4edda" stroke="#c3e6cb" stroke-width="1" rx="5"/>
  <text x="200" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#155724">Benefits of Cross-Fitting</text>
  <text x="80" y="345" font-family="Arial, sans-serif" font-size="9" fill="#155724">• Avoids overfitting bias from using same data</text>
  <text x="80" y="358" font-family="Arial, sans-serif" font-size="9" fill="#155724">• Provides valid statistical inference</text>
  <text x="80" y="371" font-family="Arial, sans-serif" font-size="9" fill="#155724">• Enables use of flexible ML methods</text>
  <text x="80" y="384" font-family="Arial, sans-serif" font-size="9" fill="#155724">• Maintains √n convergence rate</text>
  
  <!-- Statistical properties -->
  <rect x="50" y="570" width="700" height="25" fill="#e9ecef" stroke="#dee2e6" stroke-width="1" rx="5"/>
  <text x="400" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#495057">
    <tspan font-weight="bold">Asymptotic Property:</tspan> β̂ ~ N(β, V/n) where V = (ED̃²)⁻¹E(D̃²ε²)(ED̃²)⁻¹
  </text>
  
  <!-- Arrow definitions -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2c3e50"/>
    </marker>
  </defs>
  
</svg>