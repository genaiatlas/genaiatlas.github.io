<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="900" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">Neural Networks: Predictions from "Everything"</text>
  
  <!-- Central Neural Network -->
  <g id="central-network">
    <circle cx="450" cy="300" r="80" fill="#34495e" stroke="#2c3e50" stroke-width="3"/>
    <text x="450" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff">Neural</text>
    <text x="450" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff">Networks</text>
    <text x="450" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#ecf0f1">Universal Function</text>
    <text x="450" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#ecf0f1">Approximators</text>
  </g>
  
  <!-- Computer Vision Applications -->
  <g id="computer-vision">
    <rect x="50" y="80" width="200" height="120" fill="#e8f6f3" stroke="#16a085" stroke-width="2" rx="10"/>
    <text x="150" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#16a085">🖼️ Computer Vision</text>
    
    <!-- Image representation -->
    <rect x="80" y="120" width="40" height="30" fill="#3498db" opacity="0.8"/>
    <rect x="125" y="120" width="40" height="30" fill="#e74c3c" opacity="0.8"/>
    <rect x="170" y="120" width="40" height="30" fill="#f39c12" opacity="0.8"/>
    
    <text x="70" y="170" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Object Detection</text>
    <text x="70" y="185" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Medical Imaging</text>
    
    <!-- Arrow to center -->
    <line x1="250" y1="140" x2="380" y2="260" stroke="#16a085" stroke-width="2" marker-end="url(#arrow-green)"/>
  </g>
  
  <!-- Medical Applications -->
  <g id="medical">
    <rect x="650" y="80" width="200" height="120" fill="#fdf2e9" stroke="#e67e22" stroke-width="2" rx="10"/>
    <text x="750" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e67e22">🏥 Medical Diagnosis</text>
    
    <!-- Medical scan representation -->
    <circle cx="700" cy="135" r="15" fill="#95a5a6"/>
    <circle cx="720" cy="135" r="8" fill="#e74c3c"/>
    <circle cx="780" cy="135" r="12" fill="#2ecc71"/>
    <rect x="730" y="125" width="25" height="20" fill="#34495e" opacity="0.3"/>
    
    <text x="670" y="170" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Disease Recognition</text>
    <text x="670" y="185" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Diagnostic Imaging</text>
    
    <!-- Arrow to center -->
    <line x1="650" y1="140" x2="520" y2="260" stroke="#e67e22" stroke-width="2" marker-end="url(#arrow-orange)"/>
  </g>
  
  <!-- Drug Discovery -->
  <g id="drug-discovery">
    <rect x="650" y="400" width="200" height="120" fill="#eaf2ff" stroke="#3498db" stroke-width="2" rx="10"/>
    <text x="750" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#3498db">🧬 Drug Discovery</text>
    
    <!-- Molecular structure -->
    <g id="molecule">
      <circle cx="700" cy="460" r="6" fill="#e74c3c"/>
      <circle cx="720" cy="450" r="6" fill="#3498db"/>
      <circle cx="740" cy="465" r="6" fill="#2ecc71"/>
      <circle cx="760" cy="445" r="6" fill="#f39c12"/>
      <circle cx="780" cy="470" r="6" fill="#9b59b6"/>
      
      <!-- Bonds -->
      <line x1="700" y1="460" x2="720" y2="450" stroke="#34495e" stroke-width="2"/>
      <line x1="720" y1="450" x2="740" y2="465" stroke="#34495e" stroke-width="2"/>
      <line x1="740" y1="465" x2="760" y2="445" stroke="#34495e" stroke-width="2"/>
      <line x1="760" y1="445" x2="780" y2="470" stroke="#34495e" stroke-width="2"/>
    </g>
    
    <text x="670" y="495" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Molecular Properties</text>
    <text x="670" y="510" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Drug Design</text>
    
    <!-- Arrow to center -->
    <line x1="650" y1="460" x2="520" y2="340" stroke="#3498db" stroke-width="2" marker-end="url(#arrow-blue)"/>
  </g>
  
  <!-- Natural Language Processing -->
  <g id="nlp">
    <rect x="50" y="400" width="200" height="120" fill="#f4ecf7" stroke="#8e44ad" stroke-width="2" rx="10"/>
    <text x="150" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#8e44ad">📝 Language Processing</text>
    
    <!-- Text representation -->
    <rect x="80" y="445" width="140" height="5" fill="#8e44ad" opacity="0.6"/>
    <rect x="80" y="460" width="120" height="5" fill="#8e44ad" opacity="0.4"/>
    <rect x="80" y="475" width="110" height="5" fill="#8e44ad" opacity="0.3"/>
    
    <text x="70" y="500" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Sentiment Analysis</text>
    <text x="70" y="515" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Text Classification</text>
    
    <!-- Arrow to center -->
    <line x1="250" y1="460" x2="380" y2="340" stroke="#8e44ad" stroke-width="2" marker-end="url(#arrow-purple)"/>
  </g>
  
  <!-- Time Series / Finance -->
  <g id="finance">
    <rect x="350" y="80" width="200" height="100" fill="#e8f8f5" stroke="#27ae60" stroke-width="2" rx="10"/>
    <text x="450" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#27ae60">📈 Financial Prediction</text>
    
    <!-- Chart representation -->
    <polyline points="380,140 400,130 420,145 440,125 460,135 480,120 500,140 520,125" 
              fill="none" stroke="#27ae60" stroke-width="3"/>
    
    <text x="370" y="160" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Stock Price Prediction</text>
    <text x="370" y="175" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Risk Assessment</text>
    
    <!-- Arrow to center -->
    <line x1="450" y1="180" x2="450" y2="220" stroke="#27ae60" stroke-width="2" marker-end="url(#arrow-green)"/>
  </g>
  
  <!-- Autonomous Systems -->
  <g id="autonomous">
    <rect x="350" y="450" width="200" height="100" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="10"/>
    <text x="450" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ff9800">🚗 Autonomous Systems</text>
    
    <!-- Car representation -->
    <rect x="420" y="490" width="60" height="25" fill="#ff9800" opacity="0.7" rx="5"/>
    <circle cx="435" cy="520" r="8" fill="#2c3e50"/>
    <circle cx="465" cy="520" r="8" fill="#2c3e50"/>
    
    <text x="370" y="535" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Self-driving Cars</text>
    <text x="370" y="545" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Robotics Control</text>
    
    <!-- Arrow to center -->
    <line x1="450" y1="450" x2="450" y2="380" stroke="#ff9800" stroke-width="2" marker-end="url(#arrow-orange)"/>
  </g>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a085" />
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e67e22" />
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3498db" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8e44ad" />
    </marker>
  </defs>
  
  <!-- Big Data annotation -->
  <g id="big-data-annotation">
    <ellipse cx="150" cy="250" rx="60" ry="30" fill="none" stroke="#e74c3c" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="150" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e74c3c">BIG DATA</text>
    <text x="150" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c">Drives Success</text>
  </g>
  
  <!-- GPU Power annotation -->
  <g id="gpu-annotation">
    <ellipse cx="750" cy="250" rx="70" ry="30" fill="none" stroke="#9b59b6" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="750" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#9b59b6">GPU POWER</text>
    <text x="750" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#9b59b6">Computational</text>
    <text x="750" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#9b59b6">Resources</text>
  </g>
  
  <!-- Data flow indicators -->
  <text x="300" y="200" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d" transform="rotate(-30 300,200)">Raw Data</text>
  <text x="600" y="200" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d" transform="rotate(30 600,200)">Predictions</text>
  <text x="300" y="400" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d" transform="rotate(30 300,400)">Features</text>
  <text x="600" y="400" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d" transform="rotate(-30 600,400)">Insights</text>
  
  <!-- Bottom text -->
  <text x="450" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Neural Networks: Learning Patterns Across All Domains</text>
</svg>