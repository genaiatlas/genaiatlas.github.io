<svg width="700" height="550" viewBox="0 0 700 550" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="correctGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ecc71" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#27ae60" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="incorrectGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e74c3c" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c0392b" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#00000030"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="350" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#2c3e50">
    Confusion Matrix Structure
  </text>

  <!-- Main Matrix -->
  <g transform="translate(150, 80)">
    <!-- Predicted labels header -->
    <text x="200" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">
      PREDICTED
    </text>
    
    <!-- Predicted column headers -->
    <text x="100" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">
      Positive
    </text>
    <text x="300" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">
      Negative
    </text>

    <!-- Actual labels header (rotated) -->
    <g transform="rotate(-90, -60, 150)">
      <text x="-60" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">
        ACTUAL
      </text>
    </g>
    
    <!-- Actual row headers -->
    <text x="-30" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">
      Positive
    </text>
    <text x="-30" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">
      Negative
    </text>

    <!-- True Positive (TP) -->
    <rect x="20" y="40" width="160" height="100" rx="8" fill="url(#correctGradient)" stroke="#27ae60" stroke-width="3" filter="url(#shadow)"/>
    <text x="100" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">
      TRUE POSITIVE
    </text>
    <text x="100" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#27ae60">
      (TP)
    </text>
    <text x="100" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">
      ✓ Correctly detected
    </text>
    <text x="100" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">
      positive case
    </text>

    <!-- False Negative (FN) -->
    <rect x="220" y="40" width="160" height="100" rx="8" fill="url(#incorrectGradient)" stroke="#c0392b" stroke-width="3" filter="url(#shadow)"/>
    <text x="300" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">
      FALSE NEGATIVE
    </text>
    <text x="300" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#c0392b">
      (FN)
    </text>
    <text x="300" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">
      ✗ TYPE 2 ERROR
    </text>
    <text x="300" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">
      Missed positive
    </text>

    <!-- False Positive (FP) -->
    <rect x="20" y="160" width="160" height="100" rx="8" fill="url(#incorrectGradient)" stroke="#c0392b" stroke-width="3" filter="url(#shadow)"/>
    <text x="100" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">
      FALSE POSITIVE
    </text>
    <text x="100" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#c0392b">
      (FP)
    </text>
    <text x="100" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">
      ✗ TYPE 1 ERROR
    </text>
    <text x="100" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">
      False alarm
    </text>

    <!-- True Negative (TN) -->
    <rect x="220" y="160" width="160" height="100" rx="8" fill="url(#correctGradient)" stroke="#27ae60" stroke-width="3" filter="url(#shadow)"/>
    <text x="300" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">
      TRUE NEGATIVE
    </text>
    <text x="300" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#27ae60">
      (TN)
    </text>
    <text x="300" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">
      ✓ Correctly identified
    </text>
    <text x="300" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">
      negative case
    </text>
  </g>

  <!-- Example with numbers -->
  <g transform="translate(50, 380)">
    <text x="300" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">
      Example: Fraud Detection Results
    </text>
    
    <!-- Mini confusion matrix with numbers -->
    <g transform="translate(200, 40)">
      <rect x="0" y="0" width="200" height="80" fill="#ecf0f1" stroke="#95a5a6" stroke-width="2" rx="5"/>
      
      <line x1="100" y1="0" x2="100" y2="80" stroke="#95a5a6" stroke-width="2"/>
      <line x1="0" y1="40" x2="200" y2="40" stroke="#95a5a6" stroke-width="2"/>
      
      <text x="50" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#27ae60">2</text>
      <text x="150" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#c0392b">4</text>
      <text x="50" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#c0392b">8</text>
      <text x="150" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#27ae60">86</text>
      
      <text x="100" y="-15" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Predicted</text>
      <text x="-25" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50" transform="rotate(-90, -25, 45)">Actual</text>
    </g>
    
    <!-- Analysis -->
    <g transform="translate(0, 140)">
      <text x="50" y="0" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">• Total cases: 100 (6 fraudulent, 94 legitimate)</text>
      <text x="50" y="20" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">• Correctly identified fraud: 2 out of 6 (33% recall)</text>
      <text x="50" y="40" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">• False fraud alerts: 8 out of 94 legitimate transactions</text>
      <text x="50" y="60" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">• Overall accuracy: (2+86)/100 = 88%</text>
    </g>
  </g>
</svg>