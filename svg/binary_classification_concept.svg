<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="500" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">Binary Classification: Two-Class Decision Making</text>
  
  <!-- Input Data Cloud -->
  <g transform="translate(100, 80)">
    <ellipse cx="0" cy="0" rx="80" ry="50" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
    <text x="0" y="-15" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1976d2">Input Data</text>
    <text x="0" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1976d2">Features (x₁, x₂, ..., xₙ)</text>
    <text x="0" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Transactions, Images, Text</text>
  </g>
  
  <!-- Arrow 1 -->
  <path d="M 200 130 L 280 130" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="240" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">Process</text>
  
  <!-- Classification Algorithm Box -->
  <g transform="translate(320, 80)">
    <rect x="-80" y="-40" width="160" height="80" fill="#fff3e0" stroke="#f57c00" stroke-width="2" rx="10"/>
    <text x="0" y="-20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f57c00">Binary Classifier</text>
    <text x="0" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#f57c00">f: ℝⁿ → {0, 1}</text>
    <text x="0" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Neural Network, SVM</text>
    <text x="0" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Logistic Regression, etc.</text>
  </g>
  
  <!-- Arrow 2 -->
  <path d="M 420 130 L 500 130" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="460" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">Classify</text>
  
  <!-- Output Classes -->
  <g transform="translate(600, 80)">
    <!-- Class 0 -->
    <rect x="-60" y="-30" width="120" height="25" fill="#ffebee" stroke="#d32f2f" stroke-width="2" rx="5"/>
    <text x="0" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#d32f2f">Class 0 (Negative)</text>
    
    <!-- Class 1 -->
    <rect x="-60" y="10" width="120" height="25" fill="#e8f5e8" stroke="#388e3c" stroke-width="2" rx="5"/>
    <text x="0" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#388e3c">Class 1 (Positive)</text>
  </g>
  
  <!-- Decision Boundary Visualization -->
  <g transform="translate(50, 200)">
    <text x="350" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">Decision Boundary Example</text>
    
    <!-- Coordinate system -->
    <line x1="50" y1="200" x2="650" y2="200" stroke="#666" stroke-width="1"/>
    <line x1="50" y1="50" x2="50" y2="200" stroke="#666" stroke-width="1"/>
    
    <!-- Axis labels -->
    <text x="650" y="215" font-family="Arial, sans-serif" font-size="12" fill="#666">Feature 1 (x₁)</text>
    <text x="25" y="50" font-family="Arial, sans-serif" font-size="12" fill="#666">Feature 2 (x₂)</text>
    
    <!-- Class 0 points (red circles) -->
    <circle cx="100" cy="80" r="6" fill="#d32f2f" opacity="0.8"/>
    <circle cx="150" cy="70" r="6" fill="#d32f2f" opacity="0.8"/>
    <circle cx="120" cy="110" r="6" fill="#d32f2f" opacity="0.8"/>
    <circle cx="180" cy="90" r="6" fill="#d32f2f" opacity="0.8"/>
    <circle cx="130" cy="60" r="6" fill="#d32f2f" opacity="0.8"/>
    <circle cx="160" cy="120" r="6" fill="#d32f2f" opacity="0.8"/>
    
    <!-- Class 1 points (green squares) -->
    <rect x="440" y="115" width="12" height="12" fill="#388e3c" opacity="0.8"/>
    <rect x="480" y="130" width="12" height="12" fill="#388e3c" opacity="0.8"/>
    <rect x="500" y="100" width="12" height="12" fill="#388e3c" opacity="0.8"/>
    <rect x="520" y="140" width="12" height="12" fill="#388e3c" opacity="0.8"/>
    <rect x="460" y="160" width="12" height="12" fill="#388e3c" opacity="0.8"/>
    <rect x="540" y="120" width="12" height="12" fill="#388e3c" opacity="0.8"/>
    
    <!-- Decision boundary line -->
    <line x1="280" y1="60" x2="380" y2="180" stroke="#1976d2" stroke-width="3" stroke-dasharray="5,5"/>
    <text x="290" y="50" font-family="Arial, sans-serif" font-size="12" fill="#1976d2" font-weight="bold">Decision Boundary</text>
    
    <!-- Legend -->
    <g transform="translate(500, 60)">
      <circle cx="0" cy="0" r="6" fill="#d32f2f"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="12" fill="#666">Class 0 (e.g., Not Fraud)</text>
      <rect x="-6" y="20" width="12" height="12" fill="#388e3c"/>
      <text x="15" y="30" font-family="Arial, sans-serif" font-size="12" fill="#666">Class 1 (e.g., Fraud)</text>
    </g>
  </g>
  
  <!-- Mathematical Formula -->
  <g transform="translate(400, 420)">
    <rect x="-200" y="-40" width="400" height="60" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="10"/>
    <text x="0" y="-15" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Classification Rule</text>
    <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">f(x) = 1 if P(y=1|x) > 0.5, else f(x) = 0</text>
    <text x="0" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">where P(y=1|x) is the probability of positive class given features x</text>
  </g>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
            refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
</svg>