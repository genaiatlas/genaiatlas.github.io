<svg viewBox="0 0 1000 650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="posCorr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E74C3C;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#C0392B;stop-opacity:0.9"/>
    </linearGradient>
    <linearGradient id="negCorr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498DB;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#2980B9;stop-opacity:0.9"/>
    </linearGradient>
    <linearGradient id="noCorr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#95A5A6;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#7F8C8D;stop-opacity:0.9"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="650" fill="#FAFAFA"/>
  
  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2C3E50">
    Covariance Matrices: Understanding Variable Relationships
  </text>
  
  <!-- Covariance Matrix Structure -->
  <g transform="translate(80, 70)">
    <text x="100" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2C3E50">
      Sample Covariance Matrix
    </text>
    
    <!-- Matrix visualization -->
    <rect x="20" y="10" width="160" height="120" fill="#F8F9FA" stroke="#34495E" stroke-width="2" rx="5"/>
    
    <!-- Diagonal elements (variances) -->
    <rect x="30" y="20" width="35" height="25" fill="#E8F5E8" stroke="#27AE60" stroke-width="1"/>
    <rect x="135" y="90" width="35" height="25" fill="#E8F5E8" stroke="#27AE60" stroke-width="1"/>
    
    <!-- Off-diagonal elements (covariances) -->
    <rect x="70" y="20" width="35" height="25" fill="#FFE8E8" stroke="#E74C3C" stroke-width="1"/>
    <rect x="110" y="20" width="35" height="25" fill="#FFE8E8" stroke="#E74C3C" stroke-width="1"/>
    <rect x="30" y="50" width="35" height="25" fill="#FFE8E8" stroke="#E74C3C" stroke-width="1"/>
    <rect x="70" y="50" width="35" height="25" fill="#E8F5E8" stroke="#27AE60" stroke-width="1"/>
    <rect x="110" y="50" width="35" height="25" fill="#FFE8E8" stroke="#E74C3C" stroke-width="1"/>
    <rect x="30" y="80" width="35" height="25" fill="#FFE8E8" stroke="#E74C3C" stroke-width="1"/>
    <rect x="70" y="80" width="35" height="25" fill="#FFE8E8" stroke="#E74C3C" stroke-width="1"/>
    
    <!-- Matrix labels -->
    <text x="47" y="37" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#27AE60" font-weight="bold">σ₁²</text>
    <text x="87" y="37" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#E74C3C">σ₁₂</text>
    <text x="127" y="37" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#E74C3C">σ₁₃</text>
    <text x="47" y="67" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#E74C3C">σ₂₁</text>
    <text x="87" y="67" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#27AE60" font-weight="bold">σ₂²</text>
    <text x="127" y="67" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#E74C3C">σ₂₃</text>
    <text x="47" y="97" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#E74C3C">σ₃₁</text>
    <text x="87" y="97" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#E74C3C">σ₃₂</text>
    <text x="152" y="107" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#27AE60" font-weight="bold">σ₃²</text>
    
    <!-- Labels -->
    <text x="47" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#27AE60" font-weight="bold">Variances</text>
    <text x="47" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#27AE60">(Diagonal)</text>
    
    <text x="127" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#E74C3C" font-weight="bold">Covariances</text>
    <text x="127" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#E74C3C">(Off-diagonal)</text>
  </g>
  
  <!-- Correlation patterns -->
  <g transform="translate(320, 70)">
    <text x="180" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2C3E50">
      Correlation Patterns
    </text>
    
    <!-- Positive correlation -->
    <g transform="translate(20, 20)">
      <text x="50" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#E74C3C">
        Positive Correlation
      </text>
      <ellipse cx="50" cy="40" rx="40" ry="15" fill="url(#posCorr)" opacity="0.6" transform="rotate(30 50 40)"/>
      <!-- Data points -->
      <circle cx="35" cy="35" r="2" fill="#C0392B"/>
      <circle cx="45" cy="40" r="2" fill="#C0392B"/>
      <circle cx="55" cy="45" r="2" fill="#C0392B"/>
      <circle cx="40" cy="38" r="2" fill="#C0392B"/>
      <circle cx="60" cy="42" r="2" fill="#C0392B"/>
      <circle cx="50" cy="43" r="2" fill="#C0392B"/>
      
      <text x="50" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#E74C3C">ρ &gt; 0</text>
    </g>
    
    <!-- Negative correlation -->
    <g transform="translate(140, 20)">
      <text x="50" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#3498DB">
        Negative Correlation
      </text>
      <ellipse cx="50" cy="40" rx="40" ry="15" fill="url(#negCorr)" opacity="0.6" transform="rotate(-30 50 40)"/>
      <!-- Data points -->
      <circle cx="35" cy="45" r="2" fill="#2980B9"/>
      <circle cx="45" cy="40" r="2" fill="#2980B9"/>
      <circle cx="55" cy="35" r="2" fill="#2980B9"/>
      <circle cx="40" cy="42" r="2" fill="#2980B9"/>
      <circle cx="60" cy="38" r="2" fill="#2980B9"/>
      <circle cx="50" cy="37" r="2" fill="#2980B9"/>
      
      <text x="50" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#3498DB">ρ &lt; 0</text>
    </g>
    
    <!-- No correlation -->
    <g transform="translate(260, 20)">
      <text x="50" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#7F8C8D">
        No Correlation
      </text>
      <circle cx="50" cy="40" r="30" fill="url(#noCorr)" opacity="0.6"/>
      <!-- Data points -->
      <circle cx="35" cy="35" r="2" fill="#7F8C8D"/>
      <circle cx="55" cy="30" r="2" fill="#7F8C8D"/>
      <circle cx="45" cy="50" r="2" fill="#7F8C8D"/>
      <circle cx="65" cy="45" r="2" fill="#7F8C8D"/>
      <circle cx="40" cy="25" r="2" fill="#7F8C8D"/>
      <circle cx="50" cy="40" r="2" fill="#7F8C8D"/>
      
      <text x="50" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7F8C8D">ρ ≈ 0</text>
    </g>
  </g>
  
  <!-- Mathematical formulas and properties -->
  <g transform="translate(50, 220)">
    <rect x="0" y="0" width="900" height="400" fill="#F8F9FA" stroke="#DDD" stroke-width="1" rx="8" filter="url(#shadow)"/>
    
    <text x="20" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2C3E50">Covariance Matrix: Mathematical Properties</text>
    
    <!-- Left column: Definitions -->
    <g transform="translate(30, 60)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#3498DB">Sample Covariance Matrix:</text>
      <text x="0" y="25" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50">S = (1/(n-1)) Σᵢ (xᵢ - x̄)(xᵢ - x̄)ᵀ</text>
      
      <text x="0" y="60" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#E74C3C">Individual Elements:</text>
      <text x="0" y="85" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50">s²ⱼ = (1/(n-1)) Σᵢ (xᵢⱼ - x̄ⱼ)² (variance)</text>
      <text x="0" y="105" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50">sⱼₖ = (1/(n-1)) Σᵢ (xᵢⱼ - x̄ⱼ)(xᵢₖ - x̄ₖ) (covariance)</text>
      
      <text x="0" y="140" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#27AE60">Matrix Properties:</text>
      <text x="0" y="165" font-family="Arial, sans-serif" font-size="13" fill="#333">• Symmetric: S = Sᵀ</text>
      <text x="0" y="180" font-family="Arial, sans-serif" font-size="13" fill="#333">• Positive semi-definite: vᵀSv ≥ 0</text>
      <text x="0" y="195" font-family="Arial, sans-serif" font-size="13" fill="#333">• Diagonal elements: variances (≥ 0)</text>
      <text x="0" y="210" font-family="Arial, sans-serif" font-size="13" fill="#333">• Off-diagonal: covariances (any real value)</text>
      
      <text x="0" y="245" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8E44AD">Correlation Matrix:</text>
      <text x="0" y="270" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50">R = D⁻¹/² S D⁻¹/²</text>
      <text x="0" y="290" font-family="Arial, sans-serif" font-size="12" fill="#666">where D = diag(s₁₁, s₂₂, ..., sₚₚ)</text>
      <text x="0" y="310" font-family="Arial, sans-serif" font-size="13" fill="#333">• Diagonal elements = 1</text>
      <text x="0" y="325" font-family="Arial, sans-serif" font-size="13" fill="#333">• Off-diagonal: -1 ≤ rⱼₖ ≤ 1</text>
    </g>
    
    <!-- Right column: Applications -->
    <g transform="translate(450, 60)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#D35400">Eigendecomposition:</text>
      <text x="0" y="25" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50">S = V Λ Vᵀ</text>
      <text x="0" y="45" font-family="Arial, sans-serif" font-size="12" fill="#666">• V: eigenvectors (principal directions)</text>
      <text x="0" y="60" font-family="Arial, sans-serif" font-size="12" fill="#666">• Λ: eigenvalues (principal variances)</text>
      
      <text x="0" y="95" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#C0392B">Geometric Interpretation:</text>
      <text x="0" y="120" font-family="Arial, sans-serif" font-size="13" fill="#333">• Data ellipsoid orientation</text>
      <text x="0" y="135" font-family="Arial, sans-serif" font-size="13" fill="#333">• Principal axes = eigenvectors</text>
      <text x="0" y="150" font-family="Arial, sans-serif" font-size="13" fill="#333">• Axis lengths ∝ √eigenvalues</text>
      <text x="0" y="165" font-family="Arial, sans-serif" font-size="13" fill="#333">• Confidence ellipses for MVN data</text>
      
      <text x="0" y="200" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#16A085">Applications in Statistics:</text>
      <text x="0" y="225" font-family="Arial, sans-serif" font-size="13" fill="#333">• Principal Component Analysis</text>
      <text x="0" y="240" font-family="Arial, sans-serif" font-size="13" fill="#333">• Mahalanobis distance</text>
      <text x="0" y="255" font-family="Arial, sans-serif" font-size="13" fill="#333">• Multivariate hypothesis testing</text>
      <text x="0" y="270" font-family="Arial, sans-serif" font-size="13" fill="#333">• Portfolio optimization</text>
      <text x="0" y="285" font-family="Arial, sans-serif" font-size="13" fill="#333">• Factor analysis</text>
      <text x="0" y="300" font-family="Arial, sans-serif" font-size="13" fill="#333">• Outlier detection</text>
      <text x="0" y="315" font-family="Arial, sans-serif" font-size="13" fill="#333">• Dimensionality reduction</text>
    </g>
  </g>
</svg>