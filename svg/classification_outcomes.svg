<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title-text { font-family: 'Arial', sans-serif; font-size: 24px; font-weight: bold; fill: #2c3e50; }
      .header-text { font-family: 'Arial', sans-serif; font-size: 18px; font-weight: bold; fill: #34495e; }
      .label-text { font-family: 'Arial', sans-serif; font-size: 16px; font-weight: bold; fill: white; }
      .desc-text { font-family: 'Arial', sans-serif; font-size: 14px; fill: #2c3e50; }
      .example-text { font-family: 'Arial', sans-serif; font-size: 12px; fill: #7f8c8d; font-style: italic; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title-text">Binary Classification Outcomes</text>
  
  <!-- Main sections -->
  <!-- Actual Class Headers -->
  <text x="200" y="80" text-anchor="middle" class="header-text">Actual Class = 1 (Positive)</text>
  <text x="600" y="80" text-anchor="middle" class="header-text">Actual Class = 0 (Negative)</text>
  
  <!-- True Positive (TP) -->
  <rect x="50" y="100" width="300" height="80" fill="#27ae60" stroke="#1e8449" stroke-width="2" rx="5"/>
  <text x="200" y="125" text-anchor="middle" class="label-text">TRUE POSITIVE (TP)</text>
  <text x="200" y="145" text-anchor="middle" class="desc-text">Predicted: Positive ✓</text>
  <text x="200" y="165" text-anchor="middle" class="example-text">Fraud detected correctly</text>
  
  <!-- False Negative (FN) -->
  <rect x="50" y="200" width="300" height="80" fill="#e74c3c" stroke="#c0392b" stroke-width="2" rx="5"/>
  <text x="200" y="225" text-anchor="middle" class="label-text">FALSE NEGATIVE (FN)</text>
  <text x="200" y="245" text-anchor="middle" class="desc-text">Predicted: Negative ✗</text>
  <text x="200" y="265" text-anchor="middle" class="example-text">Fraud missed (Type II Error)</text>
  
  <!-- False Positive (FP) -->
  <rect x="450" y="100" width="300" height="80" fill="#e67e22" stroke="#d35400" stroke-width="2" rx="5"/>
  <text x="600" y="125" text-anchor="middle" class="label-text">FALSE POSITIVE (FP)</text>
  <text x="600" y="145" text-anchor="middle" class="desc-text">Predicted: Positive ✗</text>
  <text x="600" y="165" text-anchor="middle" class="example-text">Genuine flagged as fraud (Type I Error)</text>
  
  <!-- True Negative (TN) -->
  <rect x="450" y="200" width="300" height="80" fill="#3498db" stroke="#2980b9" stroke-width="2" rx="5"/>
  <text x="600" y="225" text-anchor="middle" class="label-text">TRUE NEGATIVE (TN)</text>
  <text x="600" y="245" text-anchor="middle" class="desc-text">Predicted: Negative ✓</text>
  <text x="600" y="265" text-anchor="middle" class="example-text">Genuine transaction correctly identified</text>
  
  <!-- Bottom section: Key insights -->
  <rect x="50" y="320" width="700" height="150" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" rx="5"/>
  <text x="400" y="345" text-anchor="middle" class="header-text">Key Insights</text>
  
  <text x="70" y="370" class="desc-text">• <tspan fill="#27ae60" font-weight="bold">True Positive (TP)</tspan>: Correct positive prediction - what we want to maximize</text>
  <text x="70" y="390" class="desc-text">• <tspan fill="#3498db" font-weight="bold">True Negative (TN)</tspan>: Correct negative prediction - also desirable</text>
  <text x="70" y="410" class="desc-text">• <tspan fill="#e67e22" font-weight="bold">False Positive (FP)</tspan>: Incorrect positive prediction - Type I Error</text>
  <text x="70" y="430" class="desc-text">• <tspan fill="#e74c3c" font-weight="bold">False Negative (FN)</tspan>: Incorrect negative prediction - Type II Error</text>
  <text x="70" y="455" class="desc-text" font-style="italic">Goal: Maximize TP and TN while minimizing FP and FN based on business requirements</text>
</svg>