<svg viewBox="0 0 900 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .axis { stroke: #333; stroke-width: 2; fill: none; }
      .curve { stroke: #2196f3; stroke-width: 3; fill: none; }
      .step-point { fill: #ff5722; stroke: #d84315; stroke-width: 2; }
      .final-point { fill: #4caf50; stroke: #388e3c; stroke-width: 3; }
      .gradient-arrow { stroke: #ff9800; stroke-width: 3; }
      .step-arrow { stroke: #9c27b0; stroke-width: 2; }
      .tangent-line { stroke: #e91e63; stroke-width: 2; stroke-dasharray: 3,3; }
      .text { font-family: Arial, sans-serif; font-size: 12px; fill: #333; }
      .title { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #1976d2; }
      .step-text { font-family: Arial, sans-serif; font-size: 11px; fill: #ff5722; font-weight: bold; }
      .formula { font-family: Arial, sans-serif; font-size: 14px; fill: #1976d2; }
      .algorithm-text { font-family: Arial, sans-serif; font-size: 13px; fill: #333; }
    </style>
    
    <marker id="gradient-arrow-marker" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ff9800"/>
    </marker>
    <marker id="step-arrow-marker" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#9c27b0"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="450" y="25" class="title" text-anchor="middle">Gradient Descent Algorithm: Step-by-Step Process</text>
  
  <!-- Main function graph -->
  <g id="main-graph">
    <!-- Axes -->
    <line x1="80" y1="300" x2="520" y2="300" class="axis"/>
    <line x1="300" y1="120" x2="300" y2="350" class="axis"/>
    
    <!-- Axis labels -->
    <text x="530" y="305" class="formula">x</text>
    <text x="285" y="110" class="formula">f(x)</text>
    <text x="290" y="320" class="text">0</text>
    
    <!-- Convex curve -->
    <path d="M 120 280 Q 300 140 480 280" class="curve"/>
    
    <!-- Function label -->
    <text x="350" y="160" class="formula">f(x) = x²</text>
    
    <!-- Step points -->
    <circle cx="150" cy="260" r="4" class="step-point"/>
    <circle cx="200" cy="210" r="4" class="step-point"/>
    <circle cx="240" cy="170" r="4" class="step-point"/>
    <circle cx="270" cy="150" r="4" class="step-point"/>
    <circle cx="300" cy="140" r="5" class="final-point"/>
    
    <!-- Step numbers -->
    <text x="140" y="245" class="step-text">1</text>
    <text x="190" y="195" class="step-text">2</text>
    <text x="230" y="155" class="step-text">3</text>
    <text x="260" y="135" class="step-text">4</text>
    <text x="305" y="125" class="step-text">MIN</text>
    
    <!-- Tangent lines showing gradients -->
    <line x1="120" y1="260" x2="180" y2="240" class="tangent-line"/>
    <line x1="170" y1="210" x2="230" y2="190" class="tangent-line"/>
    <line x1="210" y1="170" x2="270" y2="150" class="tangent-line"/>
    
    <!-- Gradient direction arrows -->
    <line x1="150" y1="240" x2="170" y2="220" class="gradient-arrow" marker-end="url(#gradient-arrow-marker)"/>
    <line x1="200" y1="190" x2="220" y2="170" class="gradient-arrow" marker-end="url(#gradient-arrow-marker)"/>
    <line x1="240" y1="150" x2="260" y2="130" class="gradient-arrow" marker-end="url(#gradient-arrow-marker)"/>
    
    <!-- Step arrows -->
    <line x1="150" y1="260" x2="190" y2="215" class="step-arrow" marker-end="url(#step-arrow-marker)"/>
    <line x1="200" y1="210" x2="230" y2="175" class="step-arrow" marker-end="url(#step-arrow-marker)"/>
    <line x1="240" y1="170" x2="265" y2="155" class="step-arrow" marker-end="url(#step-arrow-marker)"/>
  </g>
  
  <!-- Algorithm box -->
  <rect x="550" y="50" width="320" height="180" fill="#f8f9fa" stroke="#2196f3" stroke-width="2" rx="5"/>
  <text x="560" y="75" class="title">Gradient Descent Algorithm</text>
  
  <text x="560" y="100" class="algorithm-text">1. Calculate derivative f'(x) at current x</text>
  <text x="560" y="115" class="algorithm-text">2. If f'(x) &lt; 0: move right (increase x)</text>
  <text x="560" y="130" class="algorithm-text">3. If f'(x) &gt; 0: move left (decrease x)</text>
  <text x="560" y="145" class="algorithm-text">4. Update: x_new = x - α × f'(x)</text>
  <text x="560" y="160" class="algorithm-text">5. Repeat until f'(x) ≈ 0</text>
  
  <text x="560" y="185" class="text">α = learning rate (step size)</text>
  <text x="560" y="200" class="text">Controls how big steps to take</text>
  <text x="560" y="215" class="text">Too large: overshoot minimum</text>
  <text x="560" y="225" class="text">Too small: slow convergence</text>
  
  <!-- Step size demonstration -->
  <rect x="550" y="250" width="320" height="120" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="5"/>
  <text x="560" y="275" class="title">Step Size Matters</text>
  
  <!-- Large steps -->
  <line x1="560" y1="290" x2="610" y2="290" class="step-arrow" marker-end="url(#step-arrow-marker)"/>
  <text x="620" y="295" class="text">Large α: Fast but may overshoot</text>
  
  <!-- Small steps -->
  <line x1="560" y1="310" x2="580" y2="310" class="step-arrow" marker-end="url(#step-arrow-marker)"/>
  <line x1="585" y1="310" x2="605" y2="310" class="step-arrow" marker-end="url(#step-arrow-marker)"/>
  <text x="620" y="315" class="text">Small α: Stable but slow</text>
  
  <!-- Adaptive -->
  <line x1="560" y1="330" x2="590" y2="330" class="step-arrow" marker-end="url(#step-arrow-marker)"/>
  <line x1="595" y1="330" x2="615" y2="330" class="step-arrow" marker-end="url(#step-arrow-marker)"/>
  <line x1="620" y1="330" x2="630" y2="330" class="step-arrow" marker-end="url(#step-arrow-marker)"/>
  <text x="640" y="335" class="text">Adaptive: Decrease α as approach minimum</text>
  
  <text x="560" y="355" class="algorithm-text">Optimal: Start large, reduce as gradient approaches 0</text>
  
  <!-- Convergence guarantee -->
  <rect x="80" y="370" width="440" height="60" fill="#e8f5e8" stroke="#4caf50" stroke-width="2" rx="5"/>
  <text x="90" y="390" class="title">Convex Function Guarantee</text>
  <text x="90" y="405" class="text">With proper step size, guaranteed convergence to global minimum</text>
  <text x="90" y="420" class="text">No local minima to get trapped - every point leads to optimum</text>
</svg>