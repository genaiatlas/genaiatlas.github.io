<svg viewBox="0 0 800 650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="stepGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4285f4;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#4285f4;stop-opacity:0.4"/>
    </linearGradient>
    <linearGradient id="stepGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ea4335;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#ea4335;stop-opacity:0.4"/>
    </linearGradient>
    <linearGradient id="stepGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fbbc04;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#fbbc04;stop-opacity:0.4"/>
    </linearGradient>
    <linearGradient id="stepGrad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#34a853;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#34a853;stop-opacity:0.4"/>
    </linearGradient>
    <linearGradient id="stepGrad5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9c27b0;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#9c27b0;stop-opacity:0.4"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="650" fill="#fafafa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1a1a1a">
    Bayesian Inference Workflow
  </text>
  
  <!-- Step 1: Problem Definition -->
  <rect x="50" y="70" width="160" height="100" rx="8" fill="url(#stepGrad1)" stroke="#4285f4" stroke-width="2"/>
  <text x="130" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1a1a1a">
    1. Problem Setup
  </text>
  <text x="130" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">
    Define parameter θ
  </text>
  <text x="130" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">
    Specify model
  </text>
  <text x="130" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">
    Collect data D
  </text>
  
  <!-- Arrow 1 -->
  <polygon points="220,120 250,115 250,125" fill="#666"/>
  <line x1="220" y1="120" x2="250" y2="120" stroke="#666" stroke-width="2"/>
  
  <!-- Step 2: Prior Selection -->
  <rect x="270" y="70" width="160" height="100" rx="8" fill="url(#stepGrad2)" stroke="#ea4335" stroke-width="2"/>
  <text x="350" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1a1a1a">
    2. Prior P(θ)
  </text>
  <text x="350" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">
    Encode beliefs
  </text>
  <text x="350" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">
    Choose distribution
  </text>
  <text x="350" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">
    Set hyperparameters
  </text>
  
  <!-- Arrow 2 -->
  <polygon points="440,120 470,115 470,125" fill="#666"/>
  <line x1="440" y1="120" x2="470" y2="120" stroke="#666" stroke-width="2"/>
  
  <!-- Step 3: Likelihood -->
  <rect x="490" y="70" width="160" height="100" rx="8" fill="url(#stepGrad3)" stroke="#fbbc04" stroke-width="2"/>
  <text x="570" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1a1a1a">
    3. Likelihood P(D|θ)
  </text>
  <text x="570" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">
    Model data
  </text>
  <text x="570" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">
    generation process
  </text>
  <text x="570" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">
    Compute P(D|θ)
  </text>
  
  <!-- Arrow down -->
  <polygon points="570,180 565,210 575,210" fill="#666"/>
  <line x1="570" y1="180" x2="570" y2="210" stroke="#666" stroke-width="2"/>
  
  <!-- Step 4: Posterior Computation -->
  <rect x="490" y="230" width="160" height="100" rx="8" fill="url(#stepGrad4)" stroke="#34a853" stroke-width="2"/>
  <text x="570" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1a1a1a">
    4. Posterior P(θ|D)
  </text>
  <text x="570" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">
    Apply Bayes' rule
  </text>
  <text x="570" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">
    Compute/approximate
  </text>
  <text x="570" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">
    posterior distribution
  </text>
  
  <!-- Arrow left -->
  <polygon points="480,280 450,275 450,285" fill="#666"/>
  <line x1="480" y1="280" x2="450" y2="280" stroke="#666" stroke-width="2"/>
  
  <!-- Step 5: Inference -->
  <rect x="270" y="230" width="160" height="100" rx="8" fill="url(#stepGrad5)" stroke="#9c27b0" stroke-width="2"/>
  <text x="350" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1a1a1a">
    5. Inference
  </text>
  <text x="350" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">
    Point estimates
  </text>
  <text x="350" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">
    Credible intervals
  </text>
  <text x="350" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">
    Predictions
  </text>
  
  <!-- Arrow left -->
  <polygon points="260,280 230,275 230,285" fill="#666"/>
  <line x1="260" y1="280" x2="230" y2="280" stroke="#666" stroke-width="2"/>
  
  <!-- Final Step: Decision Making -->
  <rect x="50" y="230" width="160" height="100" rx="8" fill="#e8f5e8" stroke="#388e3c" stroke-width="2"/>
  <text x="130" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1a1a1a">
    6. Decision Making
  </text>
  <text x="130" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">
    Risk assessment
  </text>
  <text x="130" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">
    Action selection
  </text>
  <text x="130" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">
    Model comparison
  </text>
  
  <!-- Computation Methods Box -->
  <rect x="50" y="370" width="700" height="120" rx="8" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="400" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1a1a1a">
    Posterior Computation Methods
  </text>
  
  <!-- Analytical -->
  <rect x="80" y="410" width="150" height="60" rx="5" fill="#e3f2fd" stroke="#1976d2" stroke-width="1"/>
  <text x="155" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a1a1a">
    Analytical
  </text>
  <text x="155" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">
    Conjugate priors
  </text>
  <text x="155" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">
    Closed-form solutions
  </text>
  
  <!-- Variational -->
  <rect x="250" y="410" width="150" height="60" rx="5" fill="#fff3e0" stroke="#f57c00" stroke-width="1"/>
  <text x="325" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a1a1a">
    Variational
  </text>
  <text x="325" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">
    Approximate inference
  </text>
  <text x="325" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">
    Mean field, flows
  </text>
  
  <!-- MCMC -->
  <rect x="420" y="410" width="150" height="60" rx="5" fill="#e8f5e8" stroke="#388e3c" stroke-width="1"/>
  <text x="495" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a1a1a">
    MCMC
  </text>
  <text x="495" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">
    Sampling methods
  </text>
  <text x="495" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">
    HMC, NUTS
  </text>
  
  <!-- Approximation -->
  <rect x="590" y="410" width="150" height="60" rx="5" fill="#fce4ec" stroke="#c2185b" stroke-width="1"/>
  <text x="665" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a1a1a">
    Approximation
  </text>
  <text x="665" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">
    Laplace, EP
  </text>
  <text x="665" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">
    Grid methods
  </text>
  
  <!-- Key Considerations -->
  <rect x="50" y="520" width="700" height="100" rx="8" fill="#f0f8ff" stroke="#4682b4" stroke-width="1"/>
  <text x="400" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1a1a1a">
    Key Considerations Throughout Process
  </text>
  
  <!-- Two columns of considerations -->
  <text x="80" y="570" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">Prior Selection:</text>
  <text x="80" y="585" font-family="Arial, sans-serif" font-size="11" fill="#333">• Match prior strength to confidence level</text>
  <text x="80" y="600" font-family="Arial, sans-serif" font-size="11" fill="#333">• Consider computational tractability</text>
  
  <text x="420" y="570" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">Model Validation:</text>
  <text x="420" y="585" font-family="Arial, sans-serif" font-size="11" fill="#333">• Posterior predictive checks</text>
  <text x="420" y="600" font-family="Arial, sans-serif" font-size="11" fill="#333">• Sensitivity analysis to prior choice</text>
</svg>