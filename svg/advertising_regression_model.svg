<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'Arial', sans-serif; font-size: 20px; font-weight: bold; fill: #2c3e50; }
      .subtitle { font-family: 'Arial', sans-serif; font-size: 16px; fill: #34495e; }
      .equation { font-family: 'Times New Roman', serif; font-size: 14px; fill: #2c3e50; }
      .coefficient { font-family: 'Times New Roman', serif; font-size: 12px; fill: #e74c3c; font-weight: bold; }
      .variable { font-family: 'Times New Roman', serif; font-size: 12px; fill: #3498db; }
      .box { fill: #ecf0f1; stroke: #bdc3c7; stroke-width: 2; rx: 8; }
      .improvement { fill: #27ae60; font-weight: bold; }
      .arrow { stroke: #e74c3c; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c" />
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title">Advertising Budget Regression Analysis</text>
  
  <!-- Basic Model Section -->
  <rect x="50" y="60" width="320" height="180" class="box"/>
  <text x="210" y="85" text-anchor="middle" class="subtitle">Basic Linear Model</text>
  
  <text x="70" y="110" class="equation">Sales = β₀ + β₁(TV) + β₂(Radio) + β₃(Newspaper)</text>
  
  <text x="70" y="140" class="equation">Sales = </text>
  <text x="125" y="140" class="coefficient">2.94</text>
  <text x="160" y="140" class="equation"> + </text>
  <text x="180" y="140" class="coefficient">0.046</text>
  <text x="220" y="140" class="variable">·(TV)</text>
  <text x="260" y="140" class="equation"> + </text>
  <text x="280" y="140" class="coefficient">0.19</text>
  <text x="310" y="140" class="variable">·(Radio)</text>
  
  <text x="70" y="160" class="equation">        - </text>
  <text x="110" y="160" class="coefficient">0.001</text>
  <text x="150" y="160" class="variable">·(Newspaper)</text>
  
  <rect x="70" y="180" width="120" height="30" fill="#f39c12" rx="4"/>
  <text x="130" y="200" text-anchor="middle" class="equation" fill="white">R² = 0.897</text>
  
  <!-- Enhanced Model Section -->
  <rect x="430" y="60" width="320" height="180" class="box"/>
  <text x="590" y="85" text-anchor="middle" class="subtitle">Enhanced Model with Interaction</text>
  
  <text x="450" y="110" class="equation">Sales = β₀ + β₁(TV) + β₂(Radio) + β₃(TV × Radio)</text>
  
  <text x="450" y="140" class="equation">Sales = </text>
  <text x="505" y="140" class="coefficient">6.57</text>
  <text x="540" y="140" class="equation"> + </text>
  <text x="560" y="140" class="coefficient">0.019</text>
  <text x="600" y="140" class="variable">·(TV)</text>
  <text x="640" y="140" class="equation"> + </text>
  <text x="660" y="140" class="coefficient">0.029</text>
  <text x="700" y="140" class="variable">·(Radio)</text>
  
  <text x="450" y="160" class="equation">        + </text>
  <text x="490" y="160" class="coefficient">0.001</text>
  <text x="530" y="160" class="variable">·(TV × Radio)</text>
  <text x="640" y="160" class="equation" fill="#e74c3c">← New Feature</text>
  
  <rect x="450" y="180" width="120" height="30" fill="#27ae60" rx="4"/>
  <text x="510" y="200" text-anchor="middle" class="equation" fill="white">R² = 0.968</text>
  
  <!-- Arrow showing improvement -->
  <path d="M 380 200 Q 400 180 420 200" class="arrow"/>
  <text x="400" y="175" text-anchor="middle" class="improvement" font-size="12px">+7.1% improvement</text>
  
  <!-- Key Insights Section -->
  <text x="50" y="280" class="subtitle">Key Insights:</text>
  
  <circle cx="70" cy="300" r="4" fill="#3498db"/>
  <text x="85" y="305" class="equation">Interaction Effect: TV and Radio advertising amplify each other's impact</text>
  
  <circle cx="70" cy="325" r="4" fill="#3498db"/>
  <text x="85" y="330" class="equation">Coefficient Scale: Small coefficient (0.001) × Large values (thousands) = Significant impact</text>
  
  <circle cx="70" cy="350" r="4" fill="#3498db"/>
  <text x="85" y="355" class="equation">Model Performance: R² improved from 89.7% to 96.8% explained variance</text>
  
  <circle cx="70" cy="375" r="4" fill="#3498db"/>
  <text x="85" y="380" class="equation">Feature Engineering: Strategic variable creation can dramatically improve predictions</text>
  
  <!-- Mathematical Interpretation Box -->
  <rect x="50" y="410" width="700" height="70" fill="#e8f6f3" stroke="#16a085" stroke-width="2" rx="8"/>
  <text x="400" y="430" text-anchor="middle" class="subtitle" fill="#16a085">Mathematical Interpretation</text>
  <text x="70" y="450" class="equation">When TV = $100k and Radio = $50k:</text>
  <text x="70" y="470" class="equation">Sales boost from interaction = 0.001 × 100,000 × 50,000 = $5,000 additional sales</text>
</svg>