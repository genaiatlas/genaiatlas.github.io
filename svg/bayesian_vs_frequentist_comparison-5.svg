<svg width="900" height="650" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="900" height="650" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    Bayesian vs Frequentist Statistical Paradigms
  </text>
  
  <!-- Frequentist Column -->
  <rect x="50" y="70" width="380" height="500" fill="#e3f2fd" stroke="#1976d2" stroke-width="3" rx="15"/>
  <text x="240" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1976d2">
    🔬 Frequentist Approach
  </text>
  
  <!-- Frequentist Philosophy -->
  <rect x="70" y="120" width="340" height="80" fill="white" stroke="#1976d2" stroke-width="1" rx="5"/>
  <text x="240" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1976d2">
    Core Philosophy
  </text>
  <text x="85" y="160" font-family="Arial, sans-serif" font-size="12" fill="#333">
    📊 <tspan font-weight="bold">Probability:</tspan> Long-run frequency
  </text>
  <text x="85" y="175" font-family="Arial, sans-serif" font-size="12" fill="#333">
    🎯 <tspan font-weight="bold">Parameters:</tspan> Fixed but unknown constants
  </text>
  <text x="85" y="190" font-family="Arial, sans-serif" font-size="12" fill="#333">
    📈 <tspan font-weight="bold">Data:</tspan> Random samples from population
  </text>
  
  <!-- Frequentist Methods -->
  <rect x="70" y="210" width="340" height="120" fill="white" stroke="#1976d2" stroke-width="1" rx="5"/>
  <text x="240" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1976d2">
    Key Methods
  </text>
  <text x="85" y="250" font-family="Arial, sans-serif" font-size="12" fill="#333">
    🧪 <tspan font-weight="bold">Hypothesis Testing:</tspan> p-values, α levels
  </text>
  <text x="85" y="265" font-family="Arial, sans-serif" font-size="12" fill="#333">
    📏 <tspan font-weight="bold">Confidence Intervals:</tspan> 95% CI coverage
  </text>
  <text x="85" y="280" font-family="Arial, sans-serif" font-size="12" fill="#333">
    📊 <tspan font-weight="bold">Maximum Likelihood:</tspan> Point estimates
  </text>
  <text x="85" y="295" font-family="Arial, sans-serif" font-size="12" fill="#333">
    ⚖️ <tspan font-weight="bold">ANOVA, t-tests:</tspan> Classical tests
  </text>
  <text x="85" y="310" font-family="Arial, sans-serif" font-size="12" fill="#333">
    🎲 <tspan font-weight="bold">Bootstrap:</tspan> Resampling methods
  </text>
  
  <!-- Frequentist Mathematical Framework -->
  <rect x="70" y="340" width="340" height="60" fill="white" stroke="#1976d2" stroke-width="1" rx="5"/>
  <text x="240" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1976d2">
    Mathematical Framework
  </text>
  <text x="240" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">
    P(Data | Parameter) → Inferences about Parameter
  </text>
  <text x="240" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">
    Likelihood-based reasoning
  </text>
  
  <!-- Frequentist Pros/Cons -->
  <rect x="70" y="410" width="340" height="140" fill="white" stroke="#1976d2" stroke-width="1" rx="5"/>
  <text x="240" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1976d2">
    Advantages &amp; Limitations
  </text>
  <text x="85" y="450" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#4caf50">
    ✅ Advantages:
  </text>
  <text x="85" y="465" font-family="Arial, sans-serif" font-size="10" fill="#333">
    • Objective, no subjective priors
  </text>
  <text x="85" y="478" font-family="Arial, sans-serif" font-size="10" fill="#333">
    • Well-established, widely accepted
  </text>
  <text x="85" y="491" font-family="Arial, sans-serif" font-size="10" fill="#333">
    • Regulatory standard (FDA, clinical trials)
  </text>
  <text x="85" y="509" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#f44336">
    ❌ Limitations:
  </text>
  <text x="85" y="524" font-family="Arial, sans-serif" font-size="10" fill="#333">
    • p-values often misinterpreted
  </text>
  <text x="85" y="537" font-family="Arial, sans-serif" font-size="10" fill="#333">
    • Can't make probability statements about parameters
  </text>
  
  <!-- Bayesian Column -->
  <rect x="470" y="70" width="380" height="500" fill="#fff3e0" stroke="#f57c00" stroke-width="3" rx="15"/>
  <text x="660" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#f57c00">
    🧠 Bayesian Approach
  </text>
  
  <!-- Bayesian Philosophy -->
  <rect x="490" y="120" width="340" height="80" fill="white" stroke="#f57c00" stroke-width="1" rx="5"/>
  <text x="660" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f57c00">
    Core Philosophy
  </text>
  <text x="505" y="160" font-family="Arial, sans-serif" font-size="12" fill="#333">
    🎯 <tspan font-weight="bold">Probability:</tspan> Degree of belief/uncertainty
  </text>
  <text x="505" y="175" font-family="Arial, sans-serif" font-size="12" fill="#333">
    📊 <tspan font-weight="bold">Parameters:</tspan> Random variables with distributions
  </text>
  <text x="505" y="190" font-family="Arial, sans-serif" font-size="12" fill="#333">
    📈 <tspan font-weight="bold">Data:</tspan> Evidence to update beliefs
  </text>
  
  <!-- Bayesian Methods -->
  <rect x="490" y="210" width="340" height="120" fill="white" stroke="#f57c00" stroke-width="1" rx="5"/>
  <text x="660" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f57c00">
    Key Methods
  </text>
  <text x="505" y="250" font-family="Arial, sans-serif" font-size="12" fill="#333">
    🔄 <tspan font-weight="bold">Prior → Posterior:</tspan> Belief updating
  </text>
  <text x="505" y="265" font-family="Arial, sans-serif" font-size="12" fill="#333">
    📏 <tspan font-weight="bold">Credible Intervals:</tspan> 95% probability ranges
  </text>
  <text x="505" y="280" font-family="Arial, sans-serif" font-size="12" fill="#333">
    🎲 <tspan font-weight="bold">MCMC:</tspan> Monte Carlo sampling
  </text>
  <text x="505" y="295" font-family="Arial, sans-serif" font-size="12" fill="#333">
    🏗️ <tspan font-weight="bold">Hierarchical Models:</tspan> Complex structures
  </text>
  <text x="505" y="310" font-family="Arial, sans-serif" font-size="12" fill="#333">
    🤖 <tspan font-weight="bold">Machine Learning:</tspan> Bayesian neural nets
  </text>
  
  <!-- Bayesian Mathematical Framework -->
  <rect x="490" y="340" width="340" height="60" fill="white" stroke="#f57c00" stroke-width="1" rx="5"/>
  <text x="660" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f57c00">
    Mathematical Framework
  </text>
  <text x="660" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">
    P(Parameter | Data) ∝ P(Data | Parameter) × P(Parameter)
  </text>
  <text x="660" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">
    Bayes' theorem: Posterior ∝ Likelihood × Prior
  </text>
  
  <!-- Bayesian Pros/Cons -->
  <rect x="490" y="410" width="340" height="140" fill="white" stroke="#f57c00" stroke-width="1" rx="5"/>
  <text x="660" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f57c00">
    Advantages &amp; Limitations
  </text>
  <text x="505" y="450" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#4caf50">
    ✅ Advantages:
  </text>
  <text x="505" y="465" font-family="Arial, sans-serif" font-size="10" fill="#333">
    • Intuitive probability statements about parameters
  </text>
  <text x="505" y="478" font-family="Arial, sans-serif" font-size="10" fill="#333">
    • Incorporates prior knowledge naturally
  </text>
  <text x="505" y="491" font-family="Arial, sans-serif" font-size="10" fill="#333">
    • Flexible for complex models
  </text>
  <text x="505" y="509" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#f44336">
    ❌ Limitations:
  </text>
  <text x="505" y="524" font-family="Arial, sans-serif" font-size="10" fill="#333">
    • Subjective prior specification
  </text>
  <text x="505" y="537" font-family="Arial, sans-serif" font-size="10" fill="#333">
    • Computationally intensive (MCMC)
  </text>
  
  <!-- Comparison Examples -->
  <rect x="100" y="590" width="700" height="50" fill="#f5f5f5" stroke="#757575" stroke-width="1" rx="5"/>
  <text x="450" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#424242">
    Example Interpretation Differences
  </text>
  <text x="120" y="625" font-family="Arial, sans-serif" font-size="11" fill="#1976d2">
    <tspan font-weight="bold">Frequentist:</tspan> "95% of such intervals contain the true parameter"
  </text>
  <text x="500" y="625" font-family="Arial, sans-serif" font-size="11" fill="#f57c00">
    <tspan font-weight="bold">Bayesian:</tspan> "95% probability the parameter is in this interval"
  </text>
  
  <!-- Decision flowchart -->
  <circle cx="450" cy="50" r="8" fill="#9c27b0"/>
  <text x="460" y="45" font-family="Arial, sans-serif" font-size="10" fill="#9c27b0">
    Choose based on:
  </text>
  <text x="460" y="57" font-family="Arial, sans-serif" font-size="10" fill="#9c27b0">
    context, data, goals
  </text>
</svg>