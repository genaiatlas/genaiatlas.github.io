<svg viewBox="0 0 1000 650" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="500" y="35" font-size="24" font-weight="bold" text-anchor="middle" fill="#2C3E50">
    Comparison Data Matrix Structure
  </text>
  
  <!-- Items visualization -->
  <rect x="50" y="70" width="280" height="120" fill="#E8F4F8" stroke="#3498DB" stroke-width="2" rx="8"/>
  <text x="190" y="95" font-size="16" font-weight="bold" text-anchor="middle" fill="#2C3E50">
    Items (Movies)
  </text>
  
  <!-- Movie icons -->
  <circle cx="110" cy="130" r="25" fill="#3498DB"/>
  <text x="110" y="138" font-size="16" font-weight="bold" text-anchor="middle" fill="white">A</text>
  <text x="110" y="165" font-size="11" text-anchor="middle" fill="#34495E">Casablanca</text>
  
  <circle cx="190" cy="130" r="25" fill="#27AE60"/>
  <text x="190" y="138" font-size="16" font-weight="bold" text-anchor="middle" fill="white">B</text>
  <text x="190" y="165" font-size="11" text-anchor="middle" fill="#34495E">Iron Man</text>
  
  <circle cx="270" cy="130" r="25" fill="#E67E22"/>
  <text x="270" y="138" font-size="16" font-weight="bold" text-anchor="middle" fill="white">C</text>
  <text x="270" y="165" font-size="11" text-anchor="middle" fill="#34495E">Superman</text>
  
  <!-- Pairwise combinations -->
  <rect x="380" y="70" width="320" height="120" fill="#FEF5E7" stroke="#E67E22" stroke-width="2" rx="8"/>
  <text x="540" y="95" font-size="16" font-weight="bold" text-anchor="middle" fill="#2C3E50">
    Pairwise Comparisons (Columns)
  </text>
  
  <!-- Comparison pairs -->
  <g transform="translate(410, 115)">
    <rect x="0" y="0" width="70" height="50" fill="#FADBD8" stroke="#E74C3C" stroke-width="1" rx="4"/>
    <text x="35" y="25" font-size="13" font-weight="bold" text-anchor="middle" fill="#C0392B">A vs B</text>
    <text x="35" y="40" font-size="10" text-anchor="middle" fill="#7F8C8D">Column 1</text>
  </g>
  
  <g transform="translate(500, 115)">
    <rect x="0" y="0" width="70" height="50" fill="#D5F4E6" stroke="#27AE60" stroke-width="1" rx="4"/>
    <text x="35" y="25" font-size="13" font-weight="bold" text-anchor="middle" fill="#186A3B">B vs C</text>
    <text x="35" y="40" font-size="10" text-anchor="middle" fill="#7F8C8D">Column 2</text>
  </g>
  
  <g transform="translate(590, 115)">
    <rect x="0" y="0" width="70" height="50" fill="#D6EAF8" stroke="#3498DB" stroke-width="1" rx="4"/>
    <text x="35" y="25" font-size="13" font-weight="bold" text-anchor="middle" fill="#1F618D">A vs C</text>
    <text x="35" y="40" font-size="10" text-anchor="middle" fill="#7F8C8D">Column 3</text>
  </g>
  
  <!-- Arrow down -->
  <path d="M 370 220 L 370 260" stroke="#7F8C8D" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  
  <!-- Comparison Matrix -->
  <text x="500" y="250" font-size="18" font-weight="bold" text-anchor="middle" fill="#2C3E50">
    Comparison Matrix
  </text>
  
  <!-- Matrix visualization -->
  <g transform="translate(150, 280)">
    <!-- Header -->
    <rect x="0" y="0" width="700" height="40" fill="#34495E"/>
    <text x="70" y="25" font-size="13" font-weight="bold" fill="white">User</text>
    <text x="230" y="25" font-size="13" font-weight="bold" fill="white">A vs B</text>
    <text x="380" y="25" font-size="13" font-weight="bold" fill="white">B vs C</text>
    <text x="530" y="25" font-size="13" font-weight="bold" fill="white">A vs C</text>
    
    <!-- Row 1 -->
    <rect x="0" y="40" width="700" height="50" fill="#ECF0F1" stroke="#BDC3C7" stroke-width="1"/>
    <text x="70" y="68" font-size="13" fill="#2C3E50">Prof. Devavrat</text>
    
    <circle cx="230" cy="65" r="18" fill="#27AE60"/>
    <text x="230" y="71" font-size="16" font-weight="bold" fill="white">+1</text>
    
    <circle cx="380" cy="65" r="18" fill="#27AE60"/>
    <text x="380" y="71" font-size="16" font-weight="bold" fill="white">+1</text>
    
    <circle cx="530" cy="65" r="18" fill="#E74C3C"/>
    <text x="530" y="71" font-size="16" font-weight="bold" fill="white">-1</text>
    
    <!-- Row 2 -->
    <rect x="0" y="90" width="700" height="50" fill="white" stroke="#BDC3C7" stroke-width="1"/>
    <text x="70" y="118" font-size="13" fill="#2C3E50">You</text>
    
    <circle cx="230" cy="115" r="18" fill="#27AE60"/>
    <text x="230" y="121" font-size="16" font-weight="bold" fill="white">+1</text>
    
    <circle cx="380" cy="115" r="18" fill="#E74C3C"/>
    <text x="380" y="121" font-size="16" font-weight="bold" fill="white">-1</text>
    
    <circle cx="530" cy="115" r="18" fill="#E74C3C"/>
    <text x="530" y="121" font-size="16" font-weight="bold" fill="white">-1</text>
    
    <!-- Row 3 -->
    <rect x="0" y="140" width="700" height="50" fill="#ECF0F1" stroke="#BDC3C7" stroke-width="1"/>
    <text x="70" y="168" font-size="13" fill="#2C3E50">Philip</text>
    
    <circle cx="230" cy="165" r="18" fill="#E74C3C"/>
    <text x="230" y="171" font-size="16" font-weight="bold" fill="white">-1</text>
    
    <circle cx="380" cy="165" r="18" fill="#27AE60"/>
    <text x="380" y="171" font-size="16" font-weight="bold" fill="white">+1</text>
    
    <circle cx="530" cy="165" r="18" fill="#27AE60"/>
    <text x="530" y="171" font-size="16" font-weight="bold" fill="white">+1</text>
    
    <!-- Row 4 - Missing data -->
    <rect x="0" y="190" width="700" height="50" fill="white" stroke="#BDC3C7" stroke-width="1"/>
    <text x="70" y="218" font-size="13" fill="#2C3E50">New User</text>
    
    <rect x="212" y="202" width="36" height="36" fill="#F8F9F9" stroke="#95A5A6" stroke-width="2" stroke-dasharray="4,4" rx="4"/>
    <text x="230" y="224" font-size="14" fill="#95A5A6">?</text>
    
    <rect x="362" y="202" width="36" height="36" fill="#F8F9F9" stroke="#95A5A6" stroke-width="2" stroke-dasharray="4,4" rx="4"/>
    <text x="380" y="224" font-size="14" fill="#95A5A6">?</text>
    
    <rect x="512" y="202" width="36" height="36" fill="#F8F9F9" stroke="#95A5A6" stroke-width="2" stroke-dasharray="4,4" rx="4"/>
    <text x="530" y="224" font-size="14" fill="#95A5A6">?</text>
  </g>
  
  <!-- Legend -->
  <rect x="50" y="540" width="900" height="90" fill="#F8F9F9" stroke="#BDC3C7" stroke-width="1" rx="8"/>
  <text x="500" y="565" font-size="16" font-weight="bold" text-anchor="middle" fill="#2C3E50">
    Matrix Properties
  </text>
  
  <circle cx="120" cy="595" r="12" fill="#27AE60"/>
  <text x="138" y="600" font-size="12" fill="#2C3E50">+1 = First item preferred (e.g., A &gt; B)</text>
  
  <circle cx="420" cy="595" r="12" fill="#E74C3C"/>
  <text x="438" y="600" font-size="12" fill="#2C3E50">-1 = Second item preferred (e.g., B &gt; A)</text>
  
  <text x="735" y="600" font-size="12" fill="#95A5A6">? = Unknown preference (to be predicted)</text>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#7F8C8D"/>
    </marker>
  </defs>
</svg>