<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="stepGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9a9e;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#fecfef;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="stepGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a8edea;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#fed6e3;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="stepGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d299c2;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#fef9d7;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="stepGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#89f7fe;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#66a6ff;stop-opacity:0.8" />
    </linearGradient>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="700" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#2c3e50">
    Spectral Clustering Workflow
  </text>
  
  <!-- Step 1: Input Graph -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="180" height="140" fill="url(#stepGrad1)" stroke="#2c3e50" stroke-width="2" rx="10"/>
    <text x="90" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
      Step 1: Input Graph
    </text>
    
    <!-- Sample graph -->
    <g transform="translate(40, 40)">
      <!-- Nodes -->
      <circle cx="20" cy="20" r="6" fill="#e74c3c" stroke="#2c3e50" stroke-width="2"/>
      <circle cx="60" cy="15" r="6" fill="#e74c3c" stroke="#2c3e50" stroke-width="2"/>
      <circle cx="80" cy="40" r="6" fill="#3498db" stroke="#2c3e50" stroke-width="2"/>
      <circle cx="40" cy="50" r="6" fill="#e74c3c" stroke="#2c3e50" stroke-width="2"/>
      <circle cx="80" cy="80" r="6" fill="#3498db" stroke="#2c3e50" stroke-width="2"/>
      <circle cx="20" cy="70" r="6" fill="#3498db" stroke="#2c3e50" stroke-width="2"/>
      
      <!-- Edges -->
      <line x1="20" y1="20" x2="60" y2="15" stroke="#2c3e50" stroke-width="2"/>
      <line x1="60" y1="15" x2="40" y2="50" stroke="#2c3e50" stroke-width="2"/>
      <line x1="40" y1="50" x2="20" y2="70" stroke="#2c3e50" stroke-width="2"/>
      <line x1="80" y1="40" x2="80" y2="80" stroke="#2c3e50" stroke-width="2"/>
      <line x1="20" y1="70" x2="80" y2="80" stroke="#2c3e50" stroke-width="2"/>
      
      <!-- Node labels -->
      <text x="10" y="15" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">1</text>
      <text x="65" y="10" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">2</text>
      <text x="85" y="35" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">3</text>
      <text x="30" y="45" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">4</text>
      <text x="85" y="85" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">5</text>
      <text x="10" y="75" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">6</text>
    </g>
    
    <text x="90" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
      Network with nodes and edges
    </text>
  </g>
  
  <!-- Arrow 1 -->
  <path d="M 250 150 L 320 150 L 305 140 M 320 150 L 305 160" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Step 2: Build Laplacian -->
  <g transform="translate(350, 80)">
    <rect x="0" y="0" width="180" height="140" fill="url(#stepGrad2)" stroke="#2c3e50" stroke-width="2" rx="10"/>
    <text x="90" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
      Step 2: Laplacian Matrix
    </text>
    
    <!-- Formula -->
    <text x="90" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">
      L = D - A
    </text>
    
    <!-- Laplacian matrix representation -->
    <g transform="translate(45, 60)">
      <!-- Matrix border -->
      <rect x="0" y="0" width="90" height="90" fill="#ffffff" stroke="#2c3e50" stroke-width="1"/>
      
      <!-- Diagonal elements (degrees) -->
      <rect x="0" y="0" width="15" height="15" fill="#3498db" stroke="#2c3e50" stroke-width="1"/>
      <text x="7" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">2</text>
      
      <rect x="15" y="15" width="15" height="15" fill="#3498db" stroke="#2c3e50" stroke-width="1"/>
      <text x="22" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">2</text>
      
      <rect x="30" y="30" width="15" height="15" fill="#3498db" stroke="#2c3e50" stroke-width="1"/>
      <text x="37" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">1</text>
      
      <!-- Off-diagonal elements (-1 for edges) -->
      <rect x="15" y="0" width="15" height="15" fill="#e74c3c" stroke="#2c3e50" stroke-width="1"/>
      <text x="22" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">-1</text>
      
      <rect x="0" y="15" width="15" height="15" fill="#e74c3c" stroke="#2c3e50" stroke-width="1"/>
      <text x="7" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">-1</text>
      
      <!-- Zero elements -->
      <rect x="30" y="0" width="15" height="15" fill="#95a5a6" stroke="#2c3e50" stroke-width="1"/>
      <text x="37" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">0</text>
    </g>
    
    <text x="90" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
      L = Degree - Adjacency
    </text>
  </g>
  
  <!-- Arrow 2 -->
  <path d="M 550 150 L 620 150 L 605 140 M 620 150 L 605 160" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Step 3: Eigendecomposition -->
  <g transform="translate(650, 80)">
    <rect x="0" y="0" width="180" height="140" fill="url(#stepGrad3)" stroke="#2c3e50" stroke-width="2" rx="10"/>
    <text x="90" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
      Step 3: Eigendecomposition
    </text>
    
    <!-- Formula -->
    <text x="90" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">
      L v = λ v
    </text>
    
    <!-- Eigenvalues visualization -->
    <g transform="translate(30, 65)">
      <text x="60" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#2c3e50">
        Eigenvalues (sorted)
      </text>
      
      <rect x="0" y="10" width="8" height="12" fill="#2ecc71"/>
      <text x="15" y="20" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">λ₁ = 0.0</text>
      
      <rect x="0" y="25" width="15" height="12" fill="#f39c12"/>
      <text x="20" y="35" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">λ₂ = 0.4</text>
      
      <rect x="0" y="40" width="25" height="12" fill="#e74c3c"/>
      <text x="30" y="50" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">λ₃ = 1.2</text>
    </g>
    
    <text x="90" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
      Smallest eigenvalues first
    </text>
  </g>
  
  <!-- Vertical Arrow -->
  <path d="M 740 240 L 740 290 L 730 275 M 740 290 L 750 275" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Step 4: Create Embeddings -->
  <g transform="translate(650, 310)">
    <rect x="0" y="0" width="180" height="140" fill="url(#stepGrad4)" stroke="#2c3e50" stroke-width="2" rx="10"/>
    <text x="90" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
      Step 4: Node Embeddings
    </text>
    
    <!-- Embedding visualization -->
    <g transform="translate(30, 40)">
      <text x="60" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
        Eigenvector Features
      </text>
      
      <!-- Feature matrix -->
      <rect x="20" y="15" width="80" height="60" fill="#ffffff" stroke="#2c3e50" stroke-width="1"/>
      
      <!-- Column headers -->
      <text x="35" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">v₂</text>
      <text x="60" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">v₃</text>
      
      <!-- Node features -->
      <text x="10" y="25" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">N1</text>
      <text x="35" y="25" font-family="Arial, sans-serif" font-size="7" fill="#2c3e50">0.5</text>
      <text x="60" y="25" font-family="Arial, sans-serif" font-size="7" fill="#2c3e50">-0.2</text>
      
      <text x="10" y="35" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">N2</text>
      <text x="35" y="35" font-family="Arial, sans-serif" font-size="7" fill="#2c3e50">0.3</text>
      <text x="60" y="35" font-family="Arial, sans-serif" font-size="7" fill="#2c3e50">-0.1</text>
      
      <text x="10" y="45" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">N3</text>
      <text x="35" y="45" font-family="Arial, sans-serif" font-size="7" fill="#2c3e50">-0.4</text>
      <text x="60" y="45" font-family="Arial, sans-serif" font-size="7" fill="#2c3e50">0.8</text>
    </g>
    
    <text x="90" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
      Each node → feature vector
    </text>
  </g>
  
  <!-- Left Arrow -->
  <path d="M 630 380 L 560 380 L 575 370 M 560 380 L 575 390" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Step 5: K-Means on Embeddings -->
  <g transform="translate(350, 310)">
    <rect x="0" y="0" width="180" height="140" fill="url(#stepGrad1)" stroke="#2c3e50" stroke-width="2" rx="10"/>
    <text x="90" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
      Step 5: K-Means Clustering
    </text>
    
    <!-- Embedding space visualization -->
    <g transform="translate(40, 45)">
      <!-- Coordinate system -->
      <line x1="0" y1="60" x2="100" y2="60" stroke="#bdc3c7" stroke-width="1" marker-end="url(#arrowhead)"/>
      <line x1="50" y1="0" x2="50" y2="80" stroke="#bdc3c7" stroke-width="1" marker-end="url(#arrowhead)"/>
      
      <!-- Clustered points -->
      <circle cx="30" cy="40" r="4" fill="#e74c3c"/>
      <circle cx="35" cy="45" r="4" fill="#e74c3c"/>
      <circle cx="25" cy="50" r="4" fill="#e74c3c"/>
      
      <circle cx="70" cy="35" r="4" fill="#3498db"/>
      <circle cx="75" cy="40" r="4" fill="#3498db"/>
      <circle cx="80" cy="30" r="4" fill="#3498db"/>
      
      <!-- Cluster centers -->
      <circle cx="30" cy="45" r="2" fill="#2c3e50"/>
      <circle cx="75" cy="35" r="2" fill="#2c3e50"/>
      
      <!-- Axis labels -->
      <text x="105" y="65" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">v₂</text>
      <text x="45" y="-5" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">v₃</text>
    </g>
    
    <text x="90" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
      Cluster in embedding space
    </text>
  </g>
  
  <!-- Left Arrow -->
  <path d="M 330 380 L 260 380 L 275 370 M 260 380 L 275 390" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Step 6: Final Clustering -->
  <g transform="translate(50, 310)">
    <rect x="0" y="0" width="180" height="140" fill="url(#stepGrad2)" stroke="#2c3e50" stroke-width="2" rx="10"/>
    <text x="90" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
      Step 6: Graph Clusters
    </text>
    
    <!-- Final clustered graph -->
    <g transform="translate(40, 40)">
      <!-- Cluster 1 (Red) -->
      <ellipse cx="40" cy="35" rx="30" ry="20" fill="#ffebee" stroke="#e74c3c" stroke-width="2" stroke-dasharray="3,3"/>
      
      <!-- Cluster 2 (Blue) -->
      <ellipse cx="70" cy="65" rx="25" ry="15" fill="#e3f2fd" stroke="#3498db" stroke-width="2" stroke-dasharray="3,3"/>
      
      <!-- Nodes with cluster colors -->
      <circle cx="25" cy="25" r="5" fill="#e74c3c" stroke="#2c3e50" stroke-width="1"/>
      <circle cx="55" cy="30" r="5" fill="#e74c3c" stroke="#2c3e50" stroke-width="1"/>
      <circle cx="35" cy="45" r="5" fill="#e74c3c" stroke="#2c3e50" stroke-width="1"/>
      
      <circle cx="70" cy="55" r="5" fill="#3498db" stroke="#2c3e50" stroke-width="1"/>
      <circle cx="80" cy="70" r="5" fill="#3498db" stroke="#2c3e50" stroke-width="1"/>
      <circle cx="60" cy="75" r="5" fill="#3498db" stroke="#2c3e50" stroke-width="1"/>
      
      <!-- Edges -->
      <line x1="25" y1="25" x2="55" y2="30" stroke="#2c3e50" stroke-width="1"/>
      <line x1="55" y1="30" x2="35" y2="45" stroke="#2c3e50" stroke-width="1"/>
      <line x1="70" y1="55" x2="80" y2="70" stroke="#2c3e50" stroke-width="1"/>
      <line x1="35" y1="45" x2="60" y2="75" stroke="#95a5a6" stroke-width="1" stroke-dasharray="2,2"/>
    </g>
    
    <text x="90" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
      Communities detected
    </text>
  </g>
  
  <!-- Key insights box -->
  <g transform="translate(50, 500)">
    <rect x="0" y="0" width="800" height="160" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2" rx="10"/>
    <text x="400" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">
      Key Insights: Why Spectral Clustering Works
    </text>
    
    <!-- Left column -->
    <text x="30" y="50" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2c3e50">
      🔑 Eigenvalue Properties:
    </text>
    <text x="50" y="70" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
      • Number of zero eigenvalues = Number of connected components
    </text>
    <text x="50" y="85" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
      • Small eigenvalues → eigenvectors minimize edge cuts
    </text>
    <text x="50" y="100" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
      • Connected nodes get similar eigenvector values
    </text>
    <text x="50" y="115" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
      • Large eigenvalues → maximize differences between nodes
    </text>
    
    <!-- Right column -->
    <text x="450" y="50" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2c3e50">
      ⚡ Spectral vs Traditional Clustering:
    </text>
    <text x="470" y="70" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
      • Handles non-convex cluster shapes
    </text>
    <text x="470" y="85" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
      • Uses global graph structure (not just local distances)
    </text>
    <text x="470" y="100" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
      • Embeds nodes in space where clusters are separable
    </text>
    <text x="470" y="115" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
      • Works with any data that can be represented as a graph
    </text>
    
    <!-- Mathematical summary -->
    <text x="30" y="140" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">
      Mathematical Summary:
    </text>
    <text x="200" y="140" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
      L = D - A  →  L·v = λ·v  →  Embedding Matrix E = [v₂, v₃, ..., vₖ]  →  K-Means(E) = Clusters
    </text>
  </g>
</svg>