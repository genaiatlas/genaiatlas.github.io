<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#64748b" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="varianceGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#10b981;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0.3" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGradient)"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1e293b">Goodness-of-Fit Metrics &amp; Model Evaluation</text>
  
  <!-- Main content area -->
  <rect x="40" y="50" width="720" height="530" fill="white" stroke="#cbd5e1" stroke-width="2" rx="10" filter="url(#shadow)"/>
  
  <!-- R-squared visualization -->
  <g transform="translate(70, 80)">
    <text x="150" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">R² Decomposition</text>
    
    <!-- Plot area -->
    <rect x="20" y="30" width="280" height="180" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    
    <!-- Grid lines -->
    <g stroke="#e2e8f0" stroke-width="0.5">
      <line x1="60" y1="30" x2="60" y2="210"/>
      <line x1="100" y1="30" x2="100" y2="210"/>
      <line x1="140" y1="30" x2="140" y2="210"/>
      <line x1="180" y1="30" x2="180" y2="210"/>
      <line x1="220" y1="30" x2="220" y2="210"/>
      <line x1="260" y1="30" x2="260" y2="210"/>
      <line x1="20" y1="70" x2="300" y2="70"/>
      <line x1="20" y1="110" x2="300" y2="110"/>
      <line x1="20" y1="150" x2="300" y2="150"/>
      <line x1="20" y1="190" x2="300" y2="190"/>
    </g>
    
    <!-- Axes -->
    <line x1="20" y1="210" x2="300" y2="210" stroke="#475569" stroke-width="2"/>
    <line x1="20" y1="30" x2="20" y2="210" stroke="#475569" stroke-width="2"/>
    
    <!-- Mean line -->
    <line x1="20" y1="140" x2="300" y2="140" stroke="#64748b" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="310" y="145" font-family="Arial, sans-serif" font-size="10" fill="#64748b">ȳ (mean)</text>
    
    <!-- Regression line -->
    <line x1="40" y1="190" x2="280" y2="60" stroke="#dc2626" stroke-width="3"/>
    
    <!-- Data points -->
    <g fill="#3b82f6">
      <circle cx="60" cy="180" r="3"/>
      <circle cx="80" cy="165" r="3"/>
      <circle cx="100" cy="155" r="3"/>
      <circle cx="120" cy="130" r="3"/>
      <circle cx="140" cy="120" r="3"/>
      <circle cx="160" cy="105" r="3"/>
      <circle cx="180" cy="95" r="3"/>
      <circle cx="200" cy="85" r="3"/>
      <circle cx="220" cy="75" r="3"/>
      <circle cx="240" cy="70" r="3"/>
      <circle cx="260" cy="65" r="3"/>
    </g>
    
    <!-- Variance components visualization -->
    <g stroke="#10b981" stroke-width="1" opacity="0.7">
      <!-- Total variation (from mean) -->
      <line x1="100" y1="155" x2="100" y2="140"/>
      <line x1="160" y1="105" x2="160" y2="140"/>
      <line x1="220" y1="75" x2="220" y2="140"/>
    </g>
    
    <g stroke="#f59e0b" stroke-width="1" opacity="0.7">
      <!-- Explained variation (from regression line to mean) -->
      <line x1="100" y1="135" x2="100" y2="140"/>
      <line x1="160" y1="115" x2="160" y2="140"/>
      <line x1="220" y1="95" x2="220" y2="140"/>
    </g>
    
    <g stroke="#dc2626" stroke-width="1" opacity="0.7">
      <!-- Residual variation -->
      <line x1="100" y1="155" x2="100" y2="135"/>
      <line x1="160" y1="105" x2="160" y2="115"/>
      <line x1="220" y1="75" x2="220" y2="95"/>
    </g>
    
    <!-- Labels -->
    <text x="15" y="25" font-family="Arial, sans-serif" font-size="12" fill="#475569">Y</text>
    <text x="305" y="215" font-family="Arial, sans-serif" font-size="12" fill="#475569">X</text>
  </g>
  
  <!-- R-squared formula and components -->
  <g transform="translate(370, 80)">
    <text x="150" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">R² Formula &amp; Components</text>
    
    <rect x="20" y="30" width="280" height="180" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="5"/>
    
    <g font-family="Arial, sans-serif" fill="#1e293b">
      <!-- Main R² formula -->
      <text x="160" y="55" text-anchor="middle" font-size="14" font-weight="bold">R² = 1 - (SSE/SST) = SSR/SST</text>
      
      <!-- Component breakdown -->
      <text x="40" y="85" font-size="12" font-weight="bold" fill="#10b981">SST (Total Sum of Squares):</text>
      <text x="40" y="100" font-size="11" fill="#475569">SST = Σ(yᵢ - ȳ)²</text>
      <text x="40" y="115" font-size="10" fill="#64748b">Total variation in Y</text>
      
      <text x="40" y="140" font-size="12" font-weight="bold" fill="#f59e0b">SSR (Regression Sum of Squares):</text>
      <text x="40" y="155" font-size="11" fill="#475569">SSR = Σ(ŷᵢ - ȳ)²</text>
      <text x="40" y="170" font-size="10" fill="#64748b">Variation explained by model</text>
      
      <text x="40" y="195" font-size="12" font-weight="bold" fill="#dc2626">SSE (Sum of Squared Errors):</text>
      <text x="40" y="210" font-size="11" fill="#475569">SSE = Σ(yᵢ - ŷᵢ)²</text>
      <text x="40" y="225" font-size="10" fill="#64748b">Unexplained variation (residuals)</text>
    </g>
    
    <!-- Relationship equation -->
    <rect x="40" y="235" width="240" height="25" fill="#eff6ff" stroke="#3b82f6" stroke-width="1" rx="3"/>
    <text x="160" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1d4ed8">SST = SSR + SSE</text>
  </g>
  
  <!-- Adjusted R-squared comparison -->
  <g transform="translate(70, 280)">
    <text x="300" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">R² vs Adjusted R² Comparison</text>
    
    <!-- Comparison table -->
    <rect x="20" y="30" width="580" height="140" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    
    <!-- Headers -->
    <g font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">
      <text x="40" y="50">Metric</text>
      <text x="140" y="50">Formula</text>
      <text x="320" y="50">Purpose</text>
      <text x="480" y="50">Interpretation</text>
    </g>
    
    <!-- Separator line -->
    <line x1="30" y1="55" x2="590" y2="55" stroke="#cbd5e1" stroke-width="1"/>
    
    <!-- R-squared row -->
    <rect x="30" y="60" width="560" height="25" fill="#dcfce7" opacity="0.3"/>
    <g font-family="Arial, sans-serif" font-size="11" fill="#475569">
      <text x="40" y="77" font-weight="bold">R²</text>
      <text x="140" y="77">1 - (SSE/SST)</text>
      <text x="320" y="77">Proportion of variance explained</text>
      <text x="480" y="77">0-1, higher = better fit</text>
    </g>
    
    <!-- Adjusted R-squared row -->
    <rect x="30" y="85" width="560" height="25" fill="#fef3c7" opacity="0.3"/>
    <g font-family="Arial, sans-serif" font-size="11" fill="#475569">
      <text x="40" y="102" font-weight="bold">Adj. R²</text>
      <text x="140" y="102">1 - [(1-R²)(n-1)/(n-k-1)]</text>
      <text x="320" y="102">Penalizes overfitting</text>
      <text x="480" y="102">Can decrease with more vars</text>
    </g>
    
    <!-- Key differences -->
    <g transform="translate(40, 130)" font-family="Arial, sans-serif" font-size="10" fill="#64748b">
      <text x="0" y="0" font-weight="bold">Key Differences:</text>
      <text x="0" y="15">• R² always increases when adding variables, Adjusted R² may decrease</text>
      <text x="0" y="30">• Use Adjusted R² for model comparison with different numbers of predictors</text>
      <text x="0" y="45">• Adjusted R² provides more conservative estimate of model performance</text>
    </g>
  </g>
  
  <!-- Residual analysis -->
  <g transform="translate(70, 450)">
    <text x="300" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">Residual Analysis &amp; Diagnostic Plots</text>
    
    <!-- Four diagnostic plots -->
    <g transform="translate(0, 30)">
      <!-- Plot 1: Residuals vs Fitted -->
      <rect x="0" y="0" width="140" height="90" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="70" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1e293b">Residuals vs Fitted</text>
      
      <!-- Random scatter pattern (good) -->
      <g fill="#3b82f6" opacity="0.7">
        <circle cx="20" cy="45" r="1.5"/>
        <circle cx="35" cy="35" r="1.5"/>
        <circle cx="50" cy="55" r="1.5"/>
        <circle cx="65" cy="40" r="1.5"/>
        <circle cx="80" cy="50" r="1.5"/>
        <circle cx="95" cy="45" r="1.5"/>
        <circle cx="110" cy="35" r="1.5"/>
        <circle cx="125" cy="60" r="1.5"/>
      </g>
      <line x1="10" y1="47" x2="130" y2="47" stroke="#dc2626" stroke-width="1" stroke-dasharray="2,2"/>
      <text x="70" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#16a34a">✓ Good (random)</text>
      
      <!-- Plot 2: Normal Q-Q -->
      <rect x="150" y="0" width="140" height="90" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="220" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1e293b">Normal Q-Q Plot</text>
      
      <!-- Diagonal line (good normality) -->
      <line x1="160" y1="75" x2="280" y2="25" stroke="#dc2626" stroke-width="1"/>
      <g fill="#3b82f6" opacity="0.7">
        <circle cx="165" cy="70" r="1.5"/>
        <circle cx="180" cy="62" r="1.5"/>
        <circle cx="195" cy="55" r="1.5"/>
        <circle cx="210" cy="47" r="1.5"/>
        <circle cx="225" cy="40" r="1.5"/>
        <circle cx="240" cy="33" r="1.5"/>
        <circle cx="255" cy="28" r="1.5"/>
        <circle cx="270" cy="22" r="1.5"/>
      </g>
      <text x="220" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#16a34a">✓ Normal residuals</text>
      
      <!-- Plot 3: Scale-Location -->
      <rect x="300" y="0" width="140" height="90" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="370" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1e293b">Scale-Location</text>
      
      <!-- Horizontal band (good homoscedasticity) -->
      <g fill="#3b82f6" opacity="0.7">
        <circle cx="315" cy="50" r="1.5"/>
        <circle cx="330" cy="45" r="1.5"/>
        <circle cx="345" cy="55" r="1.5"/>
        <circle cx="360" cy="48" r="1.5"/>
        <circle cx="375" cy="52" r="1.5"/>
        <circle cx="390" cy="47" r="1.5"/>
        <circle cx="405" cy="50" r="1.5"/>
        <circle cx="420" cy="53" r="1.5"/>
      </g>
      <line x1="310" y1="50" x2="430" y2="50" stroke="#dc2626" stroke-width="1" stroke-dasharray="2,2"/>
      <text x="370" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#16a34a">✓ Homoscedastic</text>
      
      <!-- Plot 4: Cook's Distance -->
      <rect x="450" y="0" width="140" height="90" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="520" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1e293b">Cook's Distance</text>
      
      <!-- Bar chart showing influence -->
      <g fill="#3b82f6" opacity="0.7">
        <rect x="460" y="60" width="8" height="15"/>
        <rect x="475" y="65" width="8" height="10"/>
        <rect x="490" y="55" width="8" height="20"/>
        <rect x="505" y="70" width="8" height="5"/>
        <rect x="520" y="40" width="8" height="35"/>
        <rect x="535" y="68" width="8" height="7"/>
        <rect x="550" y="62" width="8" height="13"/>
        <rect x="565" y="72" width="8" height="3"/>
      </g>
      <line x1="460" y1="35" x2="580" y2="35" stroke="#dc2626" stroke-width="1" stroke-dasharray="2,2"/>
      <text x="585" y="40" font-family="Arial, sans-serif" font-size="7" fill="#dc2626">0.5</text>
      <text x="520" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#f59e0b">⚠ Check outliers</text>
    </g>
  </g>
</svg>