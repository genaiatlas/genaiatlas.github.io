<svg viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1400" height="900" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="700" y="50" font-size="32" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Control vs Autonomy Spectrum
  </text>
  <text x="700" y="85" font-size="16" text-anchor="middle" fill="#666">
    Balancing Oversight and Delegation in AI-Assisted Development
  </text>
  
  <!-- Main Spectrum Visual -->
  <defs>
    <linearGradient id="controlGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#f39c12;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#27ae60;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- Spectrum bar -->
  <rect x="150" y="150" width="1100" height="60" fill="url(#controlGradient)" rx="30"/>
  
  <!-- Control side label -->
  <text x="150" y="135" font-size="18" font-weight="bold" fill="#e74c3c">
    High Control
  </text>
  <text x="150" y="245" font-size="14" fill="#c0392b">
    Low Autonomy
  </text>
  
  <!-- Balance label -->
  <text x="700" y="135" font-size="18" font-weight="bold" text-anchor="middle" fill="#f39c12">
    Balanced
  </text>
  <text x="700" y="245" font-size="14" text-anchor="middle" fill="#d68910">
    Moderate Autonomy
  </text>
  
  <!-- Autonomy side label -->
  <text x="1250" y="135" font-size="18" font-weight="bold" text-anchor="end" fill="#27ae60">
    Low Control
  </text>
  <text x="1250" y="245" font-size="14" text-anchor="end" fill="#229954">
    High Autonomy
  </text>
  
  <!-- Three approach boxes -->
  
  <!-- High Control Box -->
  <g transform="translate(150, 300)">
    <rect x="0" y="0" width="320" height="500" fill="#fadbd8" rx="12" stroke="#e74c3c" stroke-width="3"/>
    
    <text x="160" y="40" font-size="20" font-weight="bold" text-anchor="middle" fill="#c0392b">
      High Control /
    </text>
    <text x="160" y="65" font-size="20" font-weight="bold" text-anchor="middle" fill="#c0392b">
      Low Autonomy
    </text>
    
    <text x="160" y="105" font-size="14" font-weight="bold" text-anchor="middle" fill="#922b21">
      🎮 Approach
    </text>
    <text x="20" y="135" font-size="12" fill="#5d3127">• Guide every step explicitly</text>
    <text x="20" y="160" font-size="12" fill="#5d3127">• Review incrementally</text>
    <text x="20" y="185" font-size="12" fill="#5d3127">• Approve before proceeding</text>
    
    <text x="160" y="225" font-size="14" font-weight="bold" text-anchor="middle" fill="#922b21">
      ✅ Best For
    </text>
    <text x="20" y="255" font-size="12" fill="#5d3127">• Complex, high-stakes work</text>
    <text x="20" y="280" font-size="12" fill="#5d3127">• Unfamiliar territory</text>
    <text x="20" y="305" font-size="12" fill="#5d3127">• Critical system changes</text>
    <text x="20" y="330" font-size="12" fill="#5d3127">• Learning new patterns</text>
    
    <text x="160" y="370" font-size="14" font-weight="bold" text-anchor="middle" fill="#922b21">
      ⚖️ Trade-offs
    </text>
    <text x="20" y="400" font-size="12" fill="#5d3127">• Maximum precision</text>
    <text x="20" y="425" font-size="12" fill="#5d3127">• Full understanding</text>
    <text x="20" y="450" font-size="12" fill="#5d3127">• Requires more manual work</text>
    <text x="20" y="475" font-size="12" fill="#5d3127">• Slower iteration</text>
  </g>
  
  <!-- Moderate Control Box -->
  <g transform="translate(540, 300)">
    <rect x="0" y="0" width="320" height="500" fill="#fef5e7" rx="12" stroke="#f39c12" stroke-width="3"/>
    
    <text x="160" y="40" font-size="20" font-weight="bold" text-anchor="middle" fill="#d68910">
      Moderate Control /
    </text>
    <text x="160" y="65" font-size="20" font-weight="bold" text-anchor="middle" fill="#d68910">
      Balanced Autonomy
    </text>
    
    <text x="160" y="105" font-size="14" font-weight="bold" text-anchor="middle" fill="#9c640c">
      🎮 Approach
    </text>
    <text x="20" y="135" font-size="12" fill="#7d6608">• Provide clear direction</text>
    <text x="20" y="160" font-size="12" fill="#7d6608">• Allow implementation freedom</text>
    <text x="20" y="185" font-size="12" fill="#7d6608">• Verify at checkpoints</text>
    
    <text x="160" y="225" font-size="14" font-weight="bold" text-anchor="middle" fill="#9c640c">
      ✅ Best For
    </text>
    <text x="20" y="255" font-size="12" fill="#7d6608">• Well-scoped tasks</text>
    <text x="20" y="280" font-size="12" fill="#7d6608">• Good specifications</text>
    <text x="20" y="305" font-size="12" fill="#7d6608">• Familiar patterns</text>
    <text x="20" y="330" font-size="12" fill="#7d6608">• Standard refactors</text>
    
    <text x="160" y="370" font-size="14" font-weight="bold" text-anchor="middle" fill="#9c640c">
      ⚖️ Trade-offs
    </text>
    <text x="20" y="400" font-size="12" fill="#7d6608">• Balanced efficiency</text>
    <text x="20" y="425" font-size="12" fill="#7d6608">• Appropriate oversight</text>
    <text x="20" y="450" font-size="12" fill="#7d6608">• Reasonable speed</text>
    <text x="20" y="475" font-size="12" fill="#7d6608">• Good quality assurance</text>
  </g>
  
  <!-- Low Control Box -->
  <g transform="translate(930, 300)">
    <rect x="0" y="0" width="320" height="500" fill="#d5f4e6" rx="12" stroke="#27ae60" stroke-width="3"/>
    
    <text x="160" y="40" font-size="20" font-weight="bold" text-anchor="middle" fill="#229954">
      Low Control /
    </text>
    <text x="160" y="65" font-size="20" font-weight="bold" text-anchor="middle" fill="#229954">
      High Autonomy
    </text>
    
    <text x="160" y="105" font-size="14" font-weight="bold" text-anchor="middle" fill="#186a3b">
      🎮 Approach
    </text>
    <text x="20" y="135" font-size="12" fill="#145a32">• Give goal and let run</text>
    <text x="20" y="160" font-size="12" fill="#145a32">• Agent self-directs</text>
    <text x="20" y="185" font-size="12" fill="#145a32">• Review after completion</text>
    
    <text x="160" y="225" font-size="14" font-weight="bold" text-anchor="middle" fill="#186a3b">
      ✅ Best For
    </text>
    <text x="20" y="255" font-size="12" fill="#145a32">• Well-understood tasks</text>
    <text x="20" y="280" font-size="12" fill="#145a32">• Low-risk changes</text>
    <text x="20" y="305" font-size="12" fill="#145a32">• Repetitive work</text>
    <text x="20" y="330" font-size="12" fill="#145a32">• Boilerplate generation</text>
    
    <text x="160" y="370" font-size="14" font-weight="bold" text-anchor="middle" fill="#186a3b">
      ⚖️ Trade-offs
    </text>
    <text x="20" y="400" font-size="12" fill="#145a32">• Maximum efficiency</text>
    <text x="20" y="425" font-size="12" fill="#145a32">• Fast completion</text>
    <text x="20" y="450" font-size="12" fill="#145a32">• May need iteration</text>
    <text x="20" y="475" font-size="12" fill="#145a32">• Requires trust in specs</text>
  </g>
  
  <!-- Key principle box -->
  <g transform="translate(350, 820)">
    <rect x="0" y="0" width="700" height="60" fill="#e8f4f8" rx="8" stroke="#3498db" stroke-width="2"/>
    <text x="350" y="28" font-size="15" font-weight="bold" text-anchor="middle" fill="#1f618d">
      🎯 Key Principle
    </text>
    <text x="350" y="50" font-size="13" text-anchor="middle" fill="#1f618d">
      Goal: Maximize effective delegation while maintaining appropriate oversight
    </text>
  </g>
</svg>