<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#faf5ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f3e8ff;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow2">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="1200" height="900" fill="url(#bgGrad2)"/>
  
  <!-- Title -->
  <text x="600" y="50" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#0f172a" text-anchor="middle">Context Sourcing Strategy</text>
  <text x="600" y="85" font-family="Arial, sans-serif" font-size="16" fill="#64748b" text-anchor="middle">Three-Tier Approach to Context Quality</text>
  
  <!-- Tier 1: Generic Context -->
  <g transform="translate(100, 140)" filter="url(#shadow2)">
    <rect width="320" height="560" rx="15" fill="#dbeafe" stroke="#3b82f6" stroke-width="3"/>
    
    <rect width="320" height="60" rx="15" fill="#3b82f6"/>
    <circle cx="40" cy="30" r="18" fill="white" opacity="0.3"/>
    <text x="40" y="37" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#3b82f6" text-anchor="middle">1</text>
    <text x="160" y="38" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">Tier 1: Generic</text>
    
    <g transform="translate(25, 90)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e40af">Sources:</text>
      <text x="0" y="25" font-family="Arial, sans-serif" font-size="13" fill="#334155">• Library llms.txt files</text>
      <text x="0" y="45" font-family="Arial, sans-serif" font-size="13" fill="#334155">• Web search results</text>
      <text x="0" y="65" font-family="Arial, sans-serif" font-size="13" fill="#334155">• Public documentation</text>
      <text x="0" y="85" font-family="Arial, sans-serif" font-size="13" fill="#334155">• Community resources</text>
      
      <text x="0" y="125" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e40af">Advantages:</text>
      <circle cx="5" cy="145" r="3" fill="#22c55e"/>
      <text x="15" y="150" font-family="Arial, sans-serif" font-size="12" fill="#334155">Quick setup</text>
      <circle cx="5" cy="165" r="3" fill="#22c55e"/>
      <text x="15" y="170" font-family="Arial, sans-serif" font-size="12" fill="#334155">No maintenance</text>
      <circle cx="5" cy="185" r="3" fill="#22c55e"/>
      <text x="15" y="190" font-family="Arial, sans-serif" font-size="12" fill="#334155">Works out of the box</text>
      
      <text x="0" y="220" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e40af">Disadvantages:</text>
      <circle cx="5" cy="240" r="3" fill="#ef4444"/>
      <text x="15" y="245" font-family="Arial, sans-serif" font-size="12" fill="#334155">Less precise</text>
      <circle cx="5" cy="260" r="3" fill="#ef4444"/>
      <text x="15" y="265" font-family="Arial, sans-serif" font-size="12" fill="#334155">More error-prone</text>
      <circle cx="5" cy="280" r="3" fill="#ef4444"/>
      <text x="15" y="285" font-family="Arial, sans-serif" font-size="12" fill="#334155">Generic results</text>
      
      <rect x="-15" y="310" width="300" height="60" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
      <text x="135" y="330" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e40af" text-anchor="middle">When to Use:</text>
      <text x="135" y="350" font-family="Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle">Quick starts, exploration,</text>
      <text x="135" y="365" font-family="Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle">one-off tasks</text>
    </g>
  </g>
  
  <!-- Tier 2: Curated Context -->
  <g transform="translate(440, 140)" filter="url(#shadow2)">
    <rect width="320" height="560" rx="15" fill="#ddd6fe" stroke="#8b5cf6" stroke-width="3"/>
    
    <rect width="320" height="60" rx="15" fill="#8b5cf6"/>
    <circle cx="40" cy="30" r="18" fill="white" opacity="0.3"/>
    <text x="40" y="37" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#8b5cf6" text-anchor="middle">2</text>
    <text x="160" y="38" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">Tier 2: Curated</text>
    
    <g transform="translate(25, 90)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#5b21b6">Approach:</text>
      <text x="0" y="25" font-family="Arial, sans-serif" font-size="13" fill="#334155">• Select best sources</text>
      <text x="0" y="45" font-family="Arial, sans-serif" font-size="13" fill="#334155">• Copy essential docs</text>
      <text x="0" y="65" font-family="Arial, sans-serif" font-size="13" fill="#334155">• Edit to fit needs</text>
      <text x="0" y="85" font-family="Arial, sans-serif" font-size="13" fill="#334155">• Organize by relevance</text>
      
      <text x="0" y="125" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#5b21b6">Advantages:</text>
      <circle cx="5" cy="145" r="3" fill="#22c55e"/>
      <text x="15" y="150" font-family="Arial, sans-serif" font-size="12" fill="#334155">Greater specificity</text>
      <circle cx="5" cy="165" r="3" fill="#22c55e"/>
      <text x="15" y="170" font-family="Arial, sans-serif" font-size="12" fill="#334155">More precise results</text>
      <circle cx="5" cy="185" r="3" fill="#22c55e"/>
      <text x="15" y="190" font-family="Arial, sans-serif" font-size="12" fill="#334155">Tailored to needs</text>
      
      <text x="0" y="220" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#5b21b6">Disadvantages:</text>
      <circle cx="5" cy="240" r="3" fill="#ef4444"/>
      <text x="15" y="245" font-family="Arial, sans-serif" font-size="12" fill="#334155">Setup time required</text>
      <circle cx="5" cy="260" r="3" fill="#ef4444"/>
      <text x="15" y="265" font-family="Arial, sans-serif" font-size="12" fill="#334155">Ongoing updates</text>
      <circle cx="5" cy="280" r="3" fill="#ef4444"/>
      <text x="15" y="285" font-family="Arial, sans-serif" font-size="12" fill="#334155">Can become stale</text>
      
      <rect x="-15" y="310" width="300" height="60" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
      <text x="135" y="330" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#5b21b6" text-anchor="middle">When to Use:</text>
      <text x="135" y="350" font-family="Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle">Established projects,</text>
      <text x="135" y="365" font-family="Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle">team environments</text>
    </g>
  </g>
  
  <!-- Tier 3: Personalized Context -->
  <g transform="translate(780, 140)" filter="url(#shadow2)">
    <rect width="320" height="560" rx="15" fill="#fce7f3" stroke="#ec4899" stroke-width="3"/>
    
    <rect width="320" height="60" rx="15" fill="#ec4899"/>
    <circle cx="40" cy="30" r="18" fill="white" opacity="0.3"/>
    <text x="40" y="37" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ec4899" text-anchor="middle">3</text>
    <text x="160" y="38" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="white" text-anchor="middle">Tier 3: Personalized</text>
    
    <g transform="translate(25, 90)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#be185d">Create:</text>
      <text x="0" y="25" font-family="Arial, sans-serif" font-size="13" fill="#334155">• Custom guidelines</text>
      <text x="0" y="45" font-family="Arial, sans-serif" font-size="13" fill="#334155">• Project-specific examples</text>
      <text x="0" y="65" font-family="Arial, sans-serif" font-size="13" fill="#334155">• Tailored instructions</text>
      <text x="0" y="85" font-family="Arial, sans-serif" font-size="13" fill="#334155">• Personal preferences</text>
      
      <text x="0" y="125" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#be185d">Advantages:</text>
      <circle cx="5" cy="145" r="3" fill="#22c55e"/>
      <text x="15" y="150" font-family="Arial, sans-serif" font-size="12" fill="#334155">Maximum precision</text>
      <circle cx="5" cy="165" r="3" fill="#22c55e"/>
      <text x="15" y="170" font-family="Arial, sans-serif" font-size="12" fill="#334155">Optimally adapted</text>
      <circle cx="5" cy="185" r="3" fill="#22c55e"/>
      <text x="15" y="190" font-family="Arial, sans-serif" font-size="12" fill="#334155">Highest quality</text>
      
      <text x="0" y="220" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#be185d">Disadvantages:</text>
      <circle cx="5" cy="240" r="3" fill="#ef4444"/>
      <text x="15" y="245" font-family="Arial, sans-serif" font-size="12" fill="#334155">Time-intensive</text>
      <circle cx="5" cy="260" r="3" fill="#ef4444"/>
      <text x="15" y="265" font-family="Arial, sans-serif" font-size="12" fill="#334155">Ongoing authoring</text>
      <circle cx="5" cy="280" r="3" fill="#ef4444"/>
      <text x="15" y="285" font-family="Arial, sans-serif" font-size="12" fill="#334155">Initial investment</text>
      
      <rect x="-15" y="310" width="300" height="60" rx="8" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
      <text x="135" y="330" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#be185d" text-anchor="middle">When to Use:</text>
      <text x="135" y="350" font-family="Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle">Long-term projects,</text>
      <text x="135" y="365" font-family="Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle">critical precision needs</text>
    </g>
  </g>
  
  <!-- Bottom Flow -->
  <g transform="translate(100, 730)">
    <rect width="1000" height="120" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
    
    <text x="500" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#78350f" text-anchor="middle">💡 Progressive Strategy</text>
    
    <g transform="translate(50, 60)">
      <circle cx="15" cy="0" r="8" fill="#f59e0b"/>
      <text x="30" y="5" font-family="Arial, sans-serif" font-size="14" fill="#92400e">Start Generic: Get up and running quickly</text>
      
      <text x="460" y="5" font-family="Arial, sans-serif" font-size="18" fill="#f59e0b" font-weight="bold">→</text>
      
      <circle cx="515" cy="0" r="8" fill="#f59e0b"/>
      <text x="530" y="5" font-family="Arial, sans-serif" font-size="14" fill="#92400e">Progress to Curated: Add frequently-used</text>
      
      <circle cx="15" cy="35" r="8" fill="#f59e0b"/>
      <text x="30" y="40" font-family="Arial, sans-serif" font-size="14" fill="#92400e">Invest in Personalized: For core project aspects</text>
      
      <text x="460" y="40" font-family="Arial, sans-serif" font-size="18" fill="#f59e0b" font-weight="bold">→</text>
      
      <circle cx="515" cy="35" r="8" fill="#f59e0b"/>
      <text x="530" y="40" font-family="Arial, sans-serif" font-size="14" fill="#92400e">Mix and Match: Use all tiers together</text>
    </g>
  </g>
</svg>