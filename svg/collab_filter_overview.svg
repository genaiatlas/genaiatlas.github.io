<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5CB85C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#449D44;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F0AD4E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC971F;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#2C3E50">
    User-User Collaborative Filtering Overview
  </text>

  <!-- Step 1: Users with Ratings -->
  <g transform="translate(100, 80)">
    <rect width="150" height="100" rx="10" fill="url(#blueGrad)" />
    <text x="75" y="50" text-anchor="middle" fill="white" font-size="16" font-weight="bold">Users</text>
    <text x="75" y="70" text-anchor="middle" fill="white" font-size="14">with Ratings</text>
  </g>

  <!-- User Icons -->
  <circle cx="60" cy="130" r="15" fill="#FDB813" />
  <circle cx="60" cy="130" r="10" fill="white" />
  <circle cx="100" cy="130" r="15" fill="#FDB813" />
  <circle cx="100" cy="130" r="10" fill="white" />
  <circle cx="140" cy="130" r="15" fill="#FDB813" />
  <circle cx="140" cy="130" r="10" fill="white" />

  <!-- Arrow 1 -->
  <path d="M 250 130 L 320 130" stroke="#34495E" stroke-width="3" marker-end="url(#arrowhead)" />
  
  <!-- Step 2: Similarity Computation -->
  <g transform="translate(330, 80)">
    <rect width="150" height="100" rx="10" fill="url(#greenGrad)" />
    <text x="75" y="45" text-anchor="middle" fill="white" font-size="16" font-weight="bold">Calculate</text>
    <text x="75" y="65" text-anchor="middle" fill="white" font-size="14">User</text>
    <text x="75" y="85" text-anchor="middle" fill="white" font-size="14">Similarities</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 480 130 L 550 130" stroke="#34495E" stroke-width="3" marker-end="url(#arrowhead)" />

  <!-- Step 3: Neighborhood -->
  <g transform="translate(560, 80)">
    <rect width="150" height="100" rx="10" fill="url(#orangeGrad)" />
    <text x="75" y="45" text-anchor="middle" fill="white" font-size="16" font-weight="bold">Find</text>
    <text x="75" y="65" text-anchor="middle" fill="white" font-size="14">Nearest</text>
    <text x="75" y="85" text-anchor="middle" fill="white" font-size="14">Neighbors</text>
  </g>

  <!-- Process Flow -->
  <g transform="translate(50, 220)">
    <!-- Matrix Representation -->
    <rect x="0" y="0" width="200" height="150" rx="5" fill="#ECF0F1" stroke="#95A5A6" stroke-width="2" />
    <text x="100" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C3E50">User-Item Matrix</text>
    
    <!-- Matrix cells -->
    <g transform="translate(20, 40)">
      <rect x="0" y="0" width="30" height="25" fill="#3498DB" opacity="0.7" />
      <text x="15" y="17" text-anchor="middle" fill="white" font-size="12">5</text>
      <rect x="35" y="0" width="30" height="25" fill="#E74C3C" opacity="0.7" />
      <text x="50" y="17" text-anchor="middle" fill="white" font-size="12">?</text>
      <rect x="70" y="0" width="30" height="25" fill="#3498DB" opacity="0.7" />
      <text x="85" y="17" text-anchor="middle" fill="white" font-size="12">4</text>
      <rect x="105" y="0" width="30" height="25" fill="#E74C3C" opacity="0.7" />
      <text x="120" y="17" text-anchor="middle" fill="white" font-size="12">?</text>
      <rect x="140" y="0" width="30" height="25" fill="#3498DB" opacity="0.7" />
      <text x="155" y="17" text-anchor="middle" fill="white" font-size="12">3</text>
    </g>
    
    <g transform="translate(20, 70)">
      <rect x="0" y="0" width="30" height="25" fill="#E74C3C" opacity="0.7" />
      <text x="15" y="17" text-anchor="middle" fill="white" font-size="12">?</text>
      <rect x="35" y="0" width="30" height="25" fill="#3498DB" opacity="0.7" />
      <text x="50" y="17" text-anchor="middle" fill="white" font-size="12">4</text>
      <rect x="70" y="0" width="30" height="25" fill="#E74C3C" opacity="0.7" />
      <text x="85" y="17" text-anchor="middle" fill="white" font-size="12">?</text>
      <rect x="105" y="0" width="30" height="25" fill="#3498DB" opacity="0.7" />
      <text x="120" y="17" text-anchor="middle" fill="white" font-size="12">5</text>
      <rect x="140" y="0" width="30" height="25" fill="#E74C3C" opacity="0.7" />
      <text x="155" y="17" text-anchor="middle" fill="white" font-size="12">?</text>
    </g>
    
    <g transform="translate(20, 100)">
      <rect x="0" y="0" width="30" height="25" fill="#3498DB" opacity="0.7" />
      <text x="15" y="17" text-anchor="middle" fill="white" font-size="12">3</text>
      <rect x="35" y="0" width="30" height="25" fill="#E74C3C" opacity="0.7" />
      <text x="50" y="17" text-anchor="middle" fill="white" font-size="12">?</text>
      <rect x="70" y="0" width="30" height="25" fill="#3498DB" opacity="0.7" />
      <text x="85" y="17" text-anchor="middle" fill="white" font-size="12">5</text>
      <rect x="105" y="0" width="30" height="25" fill="#E74C3C" opacity="0.7" />
      <text x="120" y="17" text-anchor="middle" fill="white" font-size="12">?</text>
      <rect x="140" y="0" width="30" height="25" fill="#3498DB" opacity="0.7" />
      <text x="155" y="17" text-anchor="middle" fill="white" font-size="12">4</text>
    </g>
  </g>

  <!-- Similarity Computation Visualization -->
  <g transform="translate(300, 220)">
    <rect x="0" y="0" width="200" height="150" rx="5" fill="#ECF0F1" stroke="#95A5A6" stroke-width="2" />
    <text x="100" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C3E50">Similarity Matrix</text>
    
    <!-- Similarity values -->
    <g transform="translate(30, 45)">
      <text x="40" y="0" text-anchor="middle" font-size="12" fill="#7F8C8D">U1</text>
      <text x="70" y="0" text-anchor="middle" font-size="12" fill="#7F8C8D">U2</text>
      <text x="100" y="0" text-anchor="middle" font-size="12" fill="#7F8C8D">U3</text>
      
      <text x="10" y="30" text-anchor="middle" font-size="12" fill="#7F8C8D">U1</text>
      <rect x="25" y="15" width="30" height="25" fill="#27AE60" opacity="0.9" />
      <text x="40" y="32" text-anchor="middle" fill="white" font-size="11">1.0</text>
      <rect x="55" y="15" width="30" height="25" fill="#F39C12" opacity="0.9" />
      <text x="70" y="32" text-anchor="middle" fill="white" font-size="11">0.8</text>
      <rect x="85" y="15" width="30" height="25" fill="#E67E22" opacity="0.9" />
      <text x="100" y="32" text-anchor="middle" fill="white" font-size="11">0.3</text>
      
      <text x="10" y="60" text-anchor="middle" font-size="12" fill="#7F8C8D">U2</text>
      <rect x="25" y="45" width="30" height="25" fill="#F39C12" opacity="0.9" />
      <text x="40" y="62" text-anchor="middle" fill="white" font-size="11">0.8</text>
      <rect x="55" y="45" width="30" height="25" fill="#27AE60" opacity="0.9" />
      <text x="70" y="62" text-anchor="middle" fill="white" font-size="11">1.0</text>
      <rect x="85" y="45" width="30" height="25" fill="#E74C3C" opacity="0.9" />
      <text x="100" y="62" text-anchor="middle" fill="white" font-size="11">0.2</text>
      
      <text x="10" y="90" text-anchor="middle" font-size="12" fill="#7F8C8D">U3</text>
      <rect x="25" y="75" width="30" height="25" fill="#E67E22" opacity="0.9" />
      <text x="40" y="92" text-anchor="middle" fill="white" font-size="11">0.3</text>
      <rect x="55" y="75" width="30" height="25" fill="#E74C3C" opacity="0.9" />
      <text x="70" y="92" text-anchor="middle" fill="white" font-size="11">0.2</text>
      <rect x="85" y="75" width="30" height="25" fill="#27AE60" opacity="0.9" />
      <text x="100" y="92" text-anchor="middle" fill="white" font-size="11">1.0</text>
    </g>
  </g>

  <!-- Recommendation Generation -->
  <g transform="translate(550, 220)">
    <rect x="0" y="0" width="200" height="150" rx="5" fill="#ECF0F1" stroke="#95A5A6" stroke-width="2" />
    <text x="100" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C3E50">Recommendations</text>
    
    <!-- Recommendation list -->
    <g transform="translate(20, 45)">
      <rect x="0" y="0" width="160" height="25" rx="3" fill="#2ECC71" opacity="0.8" />
      <text x="10" y="17" fill="white" font-size="12">1. Movie A (pred: 4.5)</text>
      
      <rect x="0" y="30" width="160" height="25" rx="3" fill="#3498DB" opacity="0.8" />
      <text x="10" y="47" fill="white" font-size="12">2. Movie B (pred: 4.2)</text>
      
      <rect x="0" y="60" width="160" height="25" rx="3" fill="#9B59B6" opacity="0.8" />
      <text x="10" y="77" fill="white" font-size="12">3. Movie C (pred: 4.0)</text>
    </g>
  </g>

  <!-- Formula Box -->
  <g transform="translate(200, 400)">
    <rect x="0" y="0" width="400" height="120" rx="8" fill="#2C3E50" opacity="0.05" stroke="#2C3E50" stroke-width="2" />
    <text x="200" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#2C3E50">Prediction Formula</text>
    
    <text x="200" y="60" text-anchor="middle" font-size="14" fill="#34495E" font-family="monospace">
      r̂(u,i) = Σ sim(u,v) × r(v,i)
    </text>
    <text x="200" y="80" text-anchor="middle" font-size="14" fill="#34495E" font-family="monospace">
      ─────────────────────
    </text>
    <text x="200" y="100" text-anchor="middle" font-size="14" fill="#34495E" font-family="monospace">
      Σ |sim(u,v)|
    </text>
  </g>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495E" />
    </marker>
  </defs>
</svg>