<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'Arial', sans-serif; font-size: 20px; font-weight: bold; fill: #2c3e50; }
      .subtitle { font-family: 'Arial', sans-serif; font-size: 16px; fill: #34495e; font-weight: bold; }
      .axis-label { font-family: 'Arial', sans-serif; font-size: 12px; fill: #2c3e50; }
      .region-label { font-family: 'Arial', sans-serif; font-size: 14px; font-weight: bold; }
      .description { font-family: 'Arial', sans-serif; font-size: 11px; fill: #34495e; }
      .small-text { font-family: 'Arial', sans-serif; font-size: 10px; fill: #34495e; }
      .training-curve { stroke: #3498db; stroke-width: 4; fill: none; }
      .validation-curve { stroke: #e74c3c; stroke-width: 4; fill: none; }
      .optimal-line { stroke: #27ae60; stroke-width: 3; stroke-dasharray: 8,4; }
      .grid-line { stroke: #ecf0f1; stroke-width: 1; }
      .axis-line { stroke: #34495e; stroke-width: 2; }
      .box { fill: #f8f9fa; stroke: #dee2e6; stroke-width: 2; rx: 8; }
      .legend-box { fill: #ffffff; stroke: #bdc3c7; stroke-width: 1; rx: 4; }
      .underfitting { fill: #f39c12; opacity: 0.2; }
      .optimal { fill: #27ae60; opacity: 0.2; }
      .overfitting { fill: #e74c3c; opacity: 0.2; }
      .underfitting-text { fill: #d68910; font-weight: bold; }
      .optimal-text { fill: #229954; font-weight: bold; }
      .overfitting-text { fill: #cb4335; font-weight: bold; }
      .interpretation-box { fill: #fff3cd; stroke: #ffc107; stroke-width: 2; rx: 8; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="400" y="25" text-anchor="middle" class="title">Training vs Validation Error: The Learning Curve</text>
  
  <!-- Main plot area -->
  <g transform="translate(100, 60)">
    
    <!-- Grid lines -->
    <g class="grid-line">
      <!-- Vertical grid lines -->
      <line x1="60" y1="0" x2="60" y2="280"/>
      <line x1="120" y1="0" x2="120" y2="280"/>
      <line x1="180" y1="0" x2="180" y2="280"/>
      <line x1="240" y1="0" x2="240" y2="280"/>
      <line x1="300" y1="0" x2="300" y2="280"/>
      <line x1="360" y1="0" x2="360" y2="280"/>
      <line x1="420" y1="0" x2="420" y2="280"/>
      <line x1="480" y1="0" x2="480" y2="280"/>
      
      <!-- Horizontal grid lines -->
      <line x1="0" y1="40" x2="480" y2="40"/>
      <line x1="0" y1="80" x2="480" y2="80"/>
      <line x1="0" y1="120" x2="480" y2="120"/>
      <line x1="0" y1="160" x2="480" y2="160"/>
      <line x1="0" y1="200" x2="480" y2="200"/>
      <line x1="0" y1="240" x2="480" y2="240"/>
    </g>
    
    <!-- Region backgrounds -->
    <rect x="0" y="0" width="160" height="280" class="underfitting"/>
    <rect x="160" y="0" width="120" height="280" class="optimal"/>
    <rect x="280" y="0" width="200" height="280" class="overfitting"/>
    
    <!-- Axes -->
    <line x1="0" y1="0" x2="0" y2="290" class="axis-line"/>
    <line x1="-10" y1="280" x2="490" y2="280" class="axis-line"/>
    
    <!-- Axis labels -->
    <text x="240" y="315" text-anchor="middle" class="axis-label">Model Complexity (Number of Features)</text>
    <text x="-35" y="140" text-anchor="middle" class="axis-label" transform="rotate(-90 -35 140)">Prediction Error</text>
    
    <!-- X-axis tick marks and labels -->
    <g class="axis-label">
      <line x1="60" y1="280" x2="60" y2="285" stroke="#34495e" stroke-width="1"/>
      <text x="60" y="300" text-anchor="middle">2</text>
      
      <line x1="120" y1="280" x2="120" y2="285" stroke="#34495e" stroke-width="1"/>
      <text x="120" y="300" text-anchor="middle">4</text>
      
      <line x1="180" y1="280" x2="180" y2="285" stroke="#34495e" stroke-width="1"/>
      <text x="180" y="300" text-anchor="middle">6</text>
      
      <line x1="240" y1="280" x2="240" y2="285" stroke="#34495e" stroke-width="1"/>
      <text x="240" y="300" text-anchor="middle">8</text>
      
      <line x1="300" y1="280" x2="300" y2="285" stroke="#34495e" stroke-width="1"/>
      <text x="300" y="300" text-anchor="middle">10</text>
      
      <line x1="360" y1="280" x2="360" y2="285" stroke="#34495e" stroke-width="1"/>
      <text x="360" y="300" text-anchor="middle">12</text>
      
      <line x1="420" y1="280" x2="420" y2="285" stroke="#34495e" stroke-width="1"/>
      <text x="420" y="300" text-anchor="middle">14</text>
      
      <line x1="480" y1="280" x2="480" y2="285" stroke="#34495e" stroke-width="1"/>
      <text x="480" y="300" text-anchor="middle">16</text>
    </g>
    
    <!-- Y-axis tick marks and labels -->
    <g class="axis-label">
      <line x1="-5" y1="240" x2="0" y2="240" stroke="#34495e" stroke-width="1"/>
      <text x="-15" y="245" text-anchor="end">0.5</text>
      
      <line x1="-5" y1="200" x2="0" y2="200" stroke="#34495e" stroke-width="1"/>
      <text x="-15" y="205" text-anchor="end">1.0</text>
      
      <line x1="-5" y1="160" x2="0" y2="160" stroke="#34495e" stroke-width="1"/>
      <text x="-15" y="165" text-anchor="end">1.5</text>
      
      <line x1="-5" y1="120" x2="0" y2="120" stroke="#34495e" stroke-width="1"/>
      <text x="-15" y="125" text-anchor="end">2.0</text>
      
      <line x1="-5" y1="80" x2="0" y2="80" stroke="#34495e" stroke-width="1"/>
      <text x="-15" y="85" text-anchor="end">2.5</text>
      
      <line x1="-5" y1="40" x2="0" y2="40" stroke="#34495e" stroke-width="1"/>
      <text x="-15" y="45" text-anchor="end">3.0</text>
    </g>
    
    <!-- Training error curve (monotonically decreasing) -->
    <path d="M 20 200 C 80 180 140 160 200 140 C 280 115 360 90 420 70 C 440 65 460 60 480 55" class="training-curve"/>
    
    <!-- Validation error curve (U-shaped) -->
    <path d="M 20 240 C 80 220 140 180 200 160 C 220 155 240 150 260 155 C 320 170 380 190 440 220 C 460 230 470 235 480 240" class="validation-curve"/>
    
    <!-- Optimal complexity line -->
    <line x1="220" y1="0" x2="220" y2="280" class="optimal-line"/>
    
    <!-- Region labels -->
    <text x="80" y="25" text-anchor="middle" class="region-label underfitting-text">UNDERFITTING</text>
    <text x="80" y="40" text-anchor="middle" class="description underfitting-text">High Bias</text>
    
    <text x="220" y="25" text-anchor="middle" class="region-label optimal-text">OPTIMAL</text>
    <text x="220" y="40" text-anchor="middle" class="description optimal-text">Sweet Spot</text>
    
    <text x="380" y="25" text-anchor="middle" class="region-label overfitting-text">OVERFITTING</text>
    <text x="380" y="40" text-anchor="middle" class="description overfitting-text">High Variance</text>
    
    <!-- Optimal point marker -->
    <circle cx="220" cy="155" r="6" fill="#27ae60" stroke="white" stroke-width="3"/>
    <text x="220" y="145" text-anchor="middle" class="small-text optimal-text">Best Model</text>
  </g>
  
  <!-- Legend -->
  <rect x="520" y="80" width="180" height="100" class="legend-box"/>
  <text x="610" y="105" text-anchor="middle" class="subtitle">Error Types</text>
  
  <line x1="535" y1="125" x2="565" y2="125" class="training-curve"/>
  <text x="575" y="130" class="description">Training Error</text>
  
  <line x1="535" y1="145" x2="565" y2="145" class="validation-curve"/>
  <text x="575" y="150" class="description">Validation Error</text>
  
  <line x1="535" y1="165" x2="565" y2="165" class="optimal-line"/>
  <text x="575" y="170" class="description">Optimal Choice</text>
  
  <!-- Key observations -->
  <rect x="520" y="210" width="250" height="120" class="box"/>
  <text x="645" y="235" text-anchor="middle" class="subtitle">Key Observations</text>
  
  <text x="535" y="255" class="description">• Training error always decreases</text>
  <text x="535" y="270" class="description">• Validation error is U-shaped</text>
  <text x="535" y="285" class="description">• Gap indicates overfitting severity</text>
  <text x="535" y="300" class="description">• Choose model at validation minimum</text>
  <text x="535" y="315" class="description">• Beyond optimum: worse generalization</text>
  
  <!-- Mathematical interpretation -->
  <rect x="100" y="420" width="600" height="120" class="interpretation-box"/>
  <text x="400" y="445" text-anchor="middle" class="subtitle" fill="#856404">Mathematical Interpretation</text>
  
  <text x="120" y="470" class="description" fill="#856404">Training Error Components:</text>
  <text x="140" y="485" class="description" fill="#856404">• Always decreases as model fits training data better</text>
  <text x="140" y="500" class="description" fill="#856404">• Can reach zero with enough parameters (perfect memorization)</text>
  
  <text x="120" y="520" class="description" fill="#856404">Validation Error = Bias² + Variance + Irreducible Error:</text>
  <text x="140" y="535" class="description" fill="#856404">• Bias² decreases with complexity | Variance increases with complexity | Sweet spot minimizes total</text>
  
  <!-- Bottom note -->
  <rect x="100" y="560" width="600" height="30" class="box"/>
  <text x="400" y="580" text-anchor="middle" class="description">The validation curve guides model selection by revealing the optimal complexity for generalization.</text>
</svg>