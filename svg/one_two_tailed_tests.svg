<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', sans-serif; font-size: 18px; font-weight: bold; fill: #2c3e50; }
      .header { font-family: 'Segoe UI', sans-serif; font-size: 14px; font-weight: bold; fill: #34495e; }
      .text { font-family: 'Segoe UI', sans-serif; font-size: 11px; fill: #2c3e50; }
      .small-text { font-family: 'Segoe UI', sans-serif; font-size: 9px; fill: #7f8c8d; }
      .math { font-family: 'Times New Roman', serif; font-size: 12px; fill: #8e44ad; }
      .curve { fill: none; stroke: #3498db; stroke-width: 2; }
      .critical-area { fill: #e74c3c; fill-opacity: 0.3; }
      .non-critical-area { fill: #27ae60; fill-opacity: 0.2; }
      .vertical-line { stroke: #2c3e50; stroke-width: 1; stroke-dasharray: 3,3; }
      .box { fill: #ecf0f1; stroke: #34495e; stroke-width: 2; }
    </style>
  </defs>

  <!-- Title -->
  <text x="400" y="25" class="title" text-anchor="middle">One-Tailed vs Two-Tailed Hypothesis Tests</text>

  <!-- Two-Tailed Test -->
  <text x="200" y="60" class="header" text-anchor="middle">Two-Tailed Test</text>
  
  <!-- Normal curve for two-tailed -->
  <path d="M 50 120 Q 200 80 350 120" class="curve"/>
  <path d="M 50 120 Q 100 100 150 110 Q 200 80 250 110 Q 300 100 350 120" class="curve"/>
  
  <!-- Critical regions for two-tailed -->
  <path d="M 50 120 Q 80 105 110 115 L 110 140 L 50 140 Z" class="critical-area"/>
  <path d="M 290 115 Q 320 105 350 120 L 350 140 L 290 140 Z" class="critical-area"/>
  <path d="M 110 115 Q 200 80 290 115 L 290 140 L 110 140 Z" class="non-critical-area"/>
  
  <!-- Critical values -->
  <line x1="110" y1="80" x2="110" y2="140" class="vertical-line"/>
  <line x1="290" y1="80" x2="290" y2="140" class="vertical-line"/>
  <text x="110" y="155" class="small-text" text-anchor="middle">-z α/2</text>
  <text x="290" y="155" class="small-text" text-anchor="middle">+z α/2</text>
  <text x="200" y="155" class="small-text" text-anchor="middle">0</text>
  
  <!-- Labels -->
  <text x="80" y="175" class="small-text" text-anchor="middle">α/2</text>
  <text x="320" y="175" class="small-text" text-anchor="middle">α/2</text>
  <text x="200" y="175" class="small-text" text-anchor="middle">1-α</text>

  <!-- Hypotheses for two-tailed -->
  <text x="50" y="195" class="math">H₀: μ = μ₀</text>
  <text x="50" y="210" class="math">H₁: μ ≠ μ₀</text>

  <!-- Left-Tailed Test -->
  <text x="600" y="60" class="header" text-anchor="middle">Left-Tailed Test</text>
  
  <!-- Normal curve for left-tailed -->
  <path d="M 450 120 Q 600 80 750 120" class="curve"/>
  <path d="M 450 120 Q 500 100 550 110 Q 600 80 650 110 Q 700 100 750 120" class="curve"/>
  
  <!-- Critical region for left-tailed -->
  <path d="M 450 120 Q 480 105 510 115 L 510 140 L 450 140 Z" class="critical-area"/>
  <path d="M 510 115 Q 600 80 750 120 L 750 140 L 510 140 Z" class="non-critical-area"/>
  
  <!-- Critical value -->
  <line x1="510" y1="80" x2="510" y2="140" class="vertical-line"/>
  <text x="510" y="155" class="small-text" text-anchor="middle">-z α</text>
  <text x="600" y="155" class="small-text" text-anchor="middle">0</text>
  
  <!-- Labels -->
  <text x="480" y="175" class="small-text" text-anchor="middle">α</text>
  <text x="630" y="175" class="small-text" text-anchor="middle">1-α</text>

  <!-- Hypotheses for left-tailed -->
  <text x="450" y="195" class="math">H₀: μ ≥ μ₀</text>
  <text x="450" y="210" class="math">H₁: μ &lt; μ₀</text>

  <!-- Right-Tailed Test -->
  <text x="200" y="280" class="header" text-anchor="middle">Right-Tailed Test</text>
  
  <!-- Normal curve for right-tailed -->
  <path d="M 50 340 Q 200 300 350 340" class="curve"/>
  <path d="M 50 340 Q 100 320 150 330 Q 200 300 250 330 Q 300 320 350 340" class="curve"/>
  
  <!-- Critical region for right-tailed -->
  <path d="M 290 335 Q 320 325 350 340 L 350 360 L 290 360 Z" class="critical-area"/>
  <path d="M 50 340 Q 200 300 290 335 L 290 360 L 50 360 Z" class="non-critical-area"/>
  
  <!-- Critical value -->
  <line x1="290" y1="300" x2="290" y2="360" class="vertical-line"/>
  <text x="290" y="375" class="small-text" text-anchor="middle">+z α</text>
  <text x="200" y="375" class="small-text" text-anchor="middle">0</text>
  
  <!-- Labels -->
  <text x="320" y="395" class="small-text" text-anchor="middle">α</text>
  <text x="170" y="395" class="small-text" text-anchor="middle">1-α</text>

  <!-- Hypotheses for right-tailed -->
  <text x="50" y="415" class="math">H₀: μ ≤ μ₀</text>
  <text x="50" y="430" class="math">H₁: μ &gt; μ₀</text>

  <!-- Comparison Table -->
  <rect x="400" y="280" width="350" height="160" class="box" rx="8"/>
  <text x="575" y="300" class="header" text-anchor="middle">Comparison Summary</text>
  
  <text x="420" y="320" class="text">Test Type:</text>
  <text x="420" y="335" class="small-text">• Two-tailed: Tests for difference in either direction</text>
  <text x="420" y="350" class="small-text">• One-tailed: Tests for specific directional effect</text>
  
  <text x="420" y="370" class="text">When to Use:</text>
  <text x="420" y="385" class="small-text">• Two-tailed: No prior expectation of direction</text>
  <text x="420" y="400" class="small-text">• One-tailed: Strong theoretical justification</text>
  
  <text x="420" y="420" class="text">Power:</text>
  <text x="420" y="435" class="small-text">• One-tailed has higher power in predicted direction</text>

  <!-- Decision Guidelines -->
  <rect x="50" y="460" width="700" height="120" class="box" rx="8"/>
  <text x="400" y="480" class="header" text-anchor="middle">Decision Guidelines</text>
  
  <text x="70" y="500" class="text">Choose Two-Tailed When:</text>
  <text x="90" y="515" class="small-text">• Research question asks "Is there a difference?"</text>
  <text x="90" y="525" class="small-text">• No strong theoretical reason to expect specific direction</text>
  <text x="90" y="535" class="small-text">• Want to be conservative and detect effects in either direction</text>
  
  <text x="400" y="500" class="text">Choose One-Tailed When:</text>
  <text x="420" y="515" class="small-text">• Strong theoretical prediction of direction</text>
  <text x="420" y="525" class="small-text">• Previous research consistently shows effect in one direction</text>
  <text x="420" y="535" class="small-text">• Cost/safety considerations make one direction critical</text>
  
  <text x="70" y="560" class="text">⚠️ Note: Always specify the type of test before collecting data. One-tailed tests require strong justification.</text>

</svg>