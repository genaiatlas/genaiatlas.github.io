<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg">
  <rect width="1400" height="1000" fill="#f8f9fa"/>
  <text x="700" y="40" font-family="Arial" font-size="28" font-weight="bold" text-anchor="middle">Query Translation Techniques Comparison</text>
  
  <g id="table">
    <rect x="50" y="80" width="1300" height="60" rx="5" fill="#9333ea" stroke="#7950f2" stroke-width="2"/>
    <text x="200" y="117" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle" fill="white">Technique</text>
    <text x="400" y="117" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle" fill="white">Best For</text>
    <text x="650" y="117" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle" fill="white">Complexity</text>
    <text x="850" y="117" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle" fill="white">Cost</text>
    <text x="1050" y="117" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle" fill="white">Pros</text>
    <text x="1250" y="117" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle" fill="white">Cons</text>
    
    <rect x="50" y="140" width="1300" height="140" rx="5" fill="#fff3bf" stroke="#f59f00" stroke-width="2"/>
    <text x="200" y="170" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Multi-Query</text>
    <text x="400" y="165" font-family="Arial" font-size="9" text-anchor="middle">Ambiguous queries</text>
    <text x="400" y="180" font-family="Arial" font-size="9" text-anchor="middle">Exploratory search</text>
    <text x="400" y="195" font-family="Arial" font-size="9" text-anchor="middle">Broad topics</text>
    <text x="650" y="180" font-family="Arial" font-size="11" text-anchor="middle" fill="#37b24d" font-weight="bold">Low</text>
    <text x="850" y="180" font-family="Arial" font-size="11" text-anchor="middle" fill="#fd7e14" font-weight="bold">Medium</text>
    <text x="1050" y="165" font-family="Arial" font-size="8" text-anchor="middle">✓ Simple</text>
    <text x="1050" y="180" font-family="Arial" font-size="8" text-anchor="middle">✓ Comprehensive</text>
    <text x="1050" y="195" font-family="Arial" font-size="8" text-anchor="middle">✓ Robust</text>
    <text x="1250" y="165" font-family="Arial" font-size="8" text-anchor="middle">Higher latency</text>
    <text x="1250" y="180" font-family="Arial" font-size="8" text-anchor="middle">More cost</text>
    <text x="1250" y="195" font-family="Arial" font-size="8" text-anchor="middle">Potential noise</text>
    <text x="200" y="220" font-family="Arial" font-size="9" text-anchor="middle" fill="#868e96">3-5x retrievals</text>
    <text x="400" y="225" font-family="Arial" font-size="8" text-anchor="middle" fill="#868e96">Use when: Query unclear or could</text>
    <text x="400" y="237" font-family="Arial" font-size="8" text-anchor="middle" fill="#868e96">mean multiple things</text>
    <text x="650" y="210" font-family="Arial" font-size="8" text-anchor="middle" fill="#868e96">Easy to</text>
    <text x="650" y="222" font-family="Arial" font-size="8" text-anchor="middle" fill="#868e96">implement</text>
    <text x="850" y="210" font-family="Arial" font-size="8" text-anchor="middle" fill="#868e96">3-5 queries</text>
    <text x="850" y="222" font-family="Arial" font-size="8" text-anchor="middle" fill="#868e96">+ retrievals</text>
    
    <rect x="50" y="280" width="1300" height="140" rx="5" fill="#d0bfff" stroke="#7950f2" stroke-width="2"/>
    <text x="200" y="310" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Step-Back</text>
    <text x="400" y="305" font-family="Arial" font-size="9" text-anchor="middle">Complex questions</text>
    <text x="400" y="320" font-family="Arial" font-size="9" text-anchor="middle">Needing background</text>
    <text x="400" y="335" font-family="Arial" font-size="9" text-anchor="middle">Technical topics</text>
    <text x="650" y="320" font-family="Arial" font-size="11" text-anchor="middle" fill="#37b24d" font-weight="bold">Low</text>
    <text x="850" y="320" font-family="Arial" font-size="11" text-anchor="middle" fill="#51cf66" font-weight="bold">Low</text>
    <text x="1050" y="305" font-family="Arial" font-size="8" text-anchor="middle">✓ Better context</text>
    <text x="1050" y="320" font-family="Arial" font-size="8" text-anchor="middle">✓ Educational</text>
    <text x="1050" y="335" font-family="Arial" font-size="8" text-anchor="middle">✓ Reduces hallucination</text>
    <text x="1250" y="305" font-family="Arial" font-size="8" text-anchor="middle">May retrieve</text>
    <text x="1250" y="320" font-family="Arial" font-size="8" text-anchor="middle">too broad info</text>
    <text x="200" y="360" font-family="Arial" font-size="9" text-anchor="middle" fill="#868e96">2x retrievals</text>
    <text x="400" y="365" font-family="Arial" font-size="8" text-anchor="middle" fill="#868e96">Use when: Need foundational</text>
    <text x="400" y="377" font-family="Arial" font-size="8" text-anchor="middle" fill="#868e96">knowledge first</text>
    <text x="650" y="350" font-family="Arial" font-size="8" text-anchor="middle" fill="#868e96">Simple</text>
    <text x="650" y="362" font-family="Arial" font-size="8" text-anchor="middle" fill="#868e96">prompt</text>
    <text x="850" y="350" font-family="Arial" font-size="8" text-anchor="middle" fill="#868e96">Just 2</text>
    <text x="850" y="362" font-family="Arial" font-size="8" text-anchor="middle" fill="#868e96">retrievals</text>
    
    <rect x="50" y="420" width="1300" height="140" rx="5" fill="#d3f9d8" stroke="#37b24d" stroke-width="2"/>
    <text x="200" y="450" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">RAG-Fusion</text>
    <text x="400" y="445" font-family="Arial" font-size="9" text-anchor="middle">Research tasks</text>
    <text x="400" y="460" font-family="Arial" font-size="9" text-anchor="middle">Comprehensive info</text>
    <text x="400" y="475" font-family="Arial" font-size="9" text-anchor="middle">High coverage needs</text>
    <text x="650" y="460" font-family="Arial" font-size="11" text-anchor="middle" fill="#fd7e14" font-weight="bold">Medium</text>
    <text x="850" y="460" font-family="Arial" font-size="11" text-anchor="middle" fill="#f03e3e" font-weight="bold">High</text>
    <text x="1050" y="445" font-family="Arial" font-size="8" text-anchor="middle">✓ Proven algorithm</text>
    <text x="1050" y="460" font-family="Arial" font-size="8" text-anchor="middle">✓ Balanced ranking</text>
    <text x="1050" y="475" font-family="Arial" font-size="8" text-anchor="middle">✓ Best coverage</text>
    <text x="1250" y="445" font-family="Arial" font-size="8" text-anchor="middle">Higher complexity</text>
    <text x="1250" y="460" font-family="Arial" font-size="8" text-anchor="middle">More compute</text>
    <text x="1250" y="475" font-family="Arial" font-size="8" text-anchor="middle">Requires RRF</text>
    <text x="200" y="500" font-family="Arial" font-size="9" text-anchor="middle" fill="#868e96">3-5x + RRF</text>
    <text x="400" y="505" font-family="Arial" font-size="8" text-anchor="middle" fill="#868e96">Use when: Need most comprehensive</text>
    <text x="400" y="517" font-family="Arial" font-size="8" text-anchor="middle" fill="#868e96">results possible</text>
    <text x="650" y="490" font-family="Arial" font-size="8" text-anchor="middle" fill="#868e96">Need RRF</text>
    <text x="650" y="502" font-family="Arial" font-size="8" text-anchor="middle" fill="#868e96">algorithm</text>
    <text x="850" y="490" font-family="Arial" font-size="8" text-anchor="middle" fill="#868e96">Multiple</text>
    <text x="850" y="502" font-family="Arial" font-size="8" text-anchor="middle" fill="#868e96">queries + fusion</text>
    
    <rect x="50" y="560" width="1300" height="140" rx="5" fill="#ffc9c9" stroke="#f03e3e" stroke-width="2"/>
    <text x="200" y="590" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Decomposition</text>
    <text x="400" y="585" font-family="Arial" font-size="9" text-anchor="middle">Multi-step reasoning</text>
    <text x="400" y="600" font-family="Arial" font-size="9" text-anchor="middle">Complex analysis</text>
    <text x="400" y="615" font-family="Arial" font-size="9" text-anchor="middle">Comparison queries</text>
    <text x="650" y="600" font-family="Arial" font-size="11" text-anchor="middle" fill="#f03e3e" font-weight="bold">High</text>
    <text x="850" y="600" font-family="Arial" font-size="11" text-anchor="middle" fill="#c92a2a" font-weight="bold">Very High</text>
    <text x="1050" y="585" font-family="Arial" font-size="8" text-anchor="middle">✓ Handles complexity</text>
    <text x="1050" y="600" font-family="Arial" font-size="8" text-anchor="middle">✓ Transparent reasoning</text>
    <text x="1050" y="615" font-family="Arial" font-size="8" text-anchor="middle">✓ Modular</text>
    <text x="1250" y="585" font-family="Arial" font-size="8" text-anchor="middle">High latency</text>
    <text x="1250" y="600" font-family="Arial" font-size="8" text-anchor="middle">Expensive</text>
    <text x="1250" y="615" font-family="Arial" font-size="8" text-anchor="middle">Dependencies</text>
    <text x="200" y="640" font-family="Arial" font-size="9" text-anchor="middle" fill="#868e96">N x retrievals</text>
    <text x="400" y="645" font-family="Arial" font-size="8" text-anchor="middle" fill="#868e96">Use when: Single query cannot</text>
    <text x="400" y="657" font-family="Arial" font-size="8" text-anchor="middle" fill="#868e96">handle question complexity</text>
    <text x="650" y="630" font-family="Arial" font-size="8" text-anchor="middle" fill="#868e96">Complex</text>
    <text x="650" y="642" font-family="Arial" font-size="8" text-anchor="middle" fill="#868e96">orchestration</text>
    <text x="850" y="630" font-family="Arial" font-size="8" text-anchor="middle" fill="#868e96">N queries</text>
    <text x="850" y="642" font-family="Arial" font-size="8" text-anchor="middle" fill="#868e96">+ N LLM calls</text>
    
    <rect x="50" y="700" width="1300" height="140" rx="5" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
    <text x="200" y="730" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">HyDE</text>
    <text x="400" y="725" font-family="Arial" font-size="9" text-anchor="middle">Query-doc mismatch</text>
    <text x="400" y="740" font-family="Arial" font-size="9" text-anchor="middle">Abstract queries</text>
    <text x="400" y="755" font-family="Arial" font-size="9" text-anchor="middle">Style differences</text>
    <text x="650" y="740" font-family="Arial" font-size="11" text-anchor="middle" fill="#37b24d" font-weight="bold">Low</text>
    <text x="850" y="740" font-family="Arial" font-size="11" text-anchor="middle" fill="#fd7e14" font-weight="bold">Medium</text>
    <text x="1050" y="725" font-family="Arial" font-size="8" text-anchor="middle">✓ Better matching</text>
    <text x="1050" y="740" font-family="Arial" font-size="8" text-anchor="middle">✓ No training needed</text>
    <text x="1050" y="755" font-family="Arial" font-size="8" text-anchor="middle">✓ Works with existing DB</text>
    <text x="1250" y="725" font-family="Arial" font-size="8" text-anchor="middle">Hallucination risk</text>
    <text x="1250" y="740" font-family="Arial" font-size="8" text-anchor="middle">Potential bias</text>
    <text x="1250" y="755" font-family="Arial" font-size="8" text-anchor="middle">Extra LLM call</text>
    <text x="200" y="780" font-family="Arial" font-size="9" text-anchor="middle" fill="#868e96">1x + generation</text>
    <text x="400" y="785" font-family="Arial" font-size="8" text-anchor="middle" fill="#868e96">Use when: Query style differs</text>
    <text x="400" y="797" font-family="Arial" font-size="8" text-anchor="middle" fill="#868e96">from document style</text>
    <text x="650" y="770" font-family="Arial" font-size="8" text-anchor="middle" fill="#868e96">Simple</text>
    <text x="650" y="782" font-family="Arial" font-size="8" text-anchor="middle" fill="#868e96">implementation</text>
    <text x="850" y="770" font-family="Arial" font-size="8" text-anchor="middle" fill="#868e96">1 generation</text>
    <text x="850" y="782" font-family="Arial" font-size="8" text-anchor="middle" fill="#868e96">+ 1 retrieval</text>
  </g>
  
  <rect x="50" y="870" width="1300" height="100" rx="10" fill="#fff9db" stroke="#fab005" stroke-width="3"/>
  <text x="700" y="900" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">💡 Selection Tips</text>
  <text x="70" y="925" font-family="Arial" font-size="10">Start with <tspan font-weight="bold">Multi-Query</tspan> (easiest) → Add <tspan font-weight="bold">Step-Back</tspan> if need context → Use <tspan font-weight="bold">RAG-Fusion</tspan> for research → Apply <tspan font-weight="bold">Decomposition</tspan> for complexity</text>
  <text x="70" y="945" font-family="Arial" font-size="10">Consider <tspan font-weight="bold">HyDE</tspan> when documents use different vocabulary than queries | Combine techniques for best results</text>
</svg>