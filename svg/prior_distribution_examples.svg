<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="informativeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#ff6b6b;stop-opacity:0.3"/>
    </linearGradient>
    <linearGradient id="weaklyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4ecdc4;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#4ecdc4;stop-opacity:0.3"/>
    </linearGradient>
    <linearGradient id="flatGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#45b7d1;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#45b7d1;stop-opacity:0.3"/>
    </linearGradient>
    <linearGradient id="conjugateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#96ceb4;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#96ceb4;stop-opacity:0.3"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#fafafa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1a1a1a">
    Prior Distribution Examples
  </text>
  
  <!-- Informative Prior -->
  <g>
    <rect x="50" y="70" width="320" height="120" rx="8" fill="url(#informativeGrad)" stroke="#ff6b6b" stroke-width="2"/>
    <text x="210" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a1a1a">
      Informative Prior
    </text>
    <text x="210" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">
      Strong domain knowledge
    </text>
    
    <!-- Beta distribution curve -->
    <path d="M 70 160 Q 120 120 170 130 Q 220 140 270 130 Q 320 120 350 160" 
          fill="none" stroke="#d63031" stroke-width="3"/>
    <text x="210" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">
      Example: Beta(8, 2) for click rates
    </text>
  </g>
  
  <!-- Weakly Informative Prior -->
  <g>
    <rect x="430" y="70" width="320" height="120" rx="8" fill="url(#weaklyGrad)" stroke="#4ecdc4" stroke-width="2"/>
    <text x="590" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a1a1a">
      Weakly Informative Prior
    </text>
    <text x="590" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">
      Gentle regularization
    </text>
    
    <!-- Normal distribution curve -->
    <path d="M 450 160 Q 500 130 550 125 Q 600 125 650 130 Q 700 135 730 160" 
          fill="none" stroke="#00b894" stroke-width="3"/>
    <text x="590" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">
      Example: Normal(0, 1) for coefficients
    </text>
  </g>
  
  <!-- Non-informative Prior -->
  <g>
    <rect x="50" y="220" width="320" height="120" rx="8" fill="url(#flatGrad)" stroke="#45b7d1" stroke-width="2"/>
    <text x="210" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a1a1a">
      Non-informative (Flat) Prior
    </text>
    <text x="210" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">
      Minimal assumptions
    </text>
    
    <!-- Uniform distribution -->
    <rect x="120" y="285" width="180" height="20" fill="none" stroke="#0984e3" stroke-width="3"/>
    <line x1="120" y1="285" x2="120" y2="305" stroke="#0984e3" stroke-width="3"/>
    <line x1="300" y1="285" x2="300" y2="305" stroke="#0984e3" stroke-width="3"/>
    <text x="210" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">
      Example: Uniform(0, 1) for probabilities
    </text>
  </g>
  
  <!-- Conjugate Prior -->
  <g>
    <rect x="430" y="220" width="320" height="120" rx="8" fill="url(#conjugateGrad)" stroke="#96ceb4" stroke-width="2"/>
    <text x="590" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a1a1a">
      Conjugate Prior
    </text>
    <text x="590" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">
      Mathematical convenience
    </text>
    
    <!-- Beta distribution for conjugate -->
    <path d="M 450 310 Q 500 280 550 285 Q 600 290 650 285 Q 700 280 730 310" 
          fill="none" stroke="#00b894" stroke-width="3"/>
    <text x="590" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">
      Example: Beta prior + Binomial likelihood
    </text>
  </g>
  
  <!-- Comparison Table -->
  <rect x="50" y="370" width="700" height="180" rx="8" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="400" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1a1a1a">
    Prior Selection Guidelines
  </text>
  
  <!-- Table Headers -->
  <text x="80" y="425" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">Prior Type</text>
  <text x="220" y="425" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">When to Use</text>
  <text x="420" y="425" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">Advantages</text>
  <text x="620" y="425" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">Considerations</text>
  
  <!-- Table Content -->
  <line x1="60" y1="435" x2="740" y2="435" stroke="#dee2e6" stroke-width="1"/>
  
  <!-- Informative -->
  <text x="80" y="455" font-family="Arial, sans-serif" font-size="11" fill="#d63031" font-weight="bold">Informative</text>
  <text x="220" y="455" font-family="Arial, sans-serif" font-size="11" fill="#333">Strong domain knowledge</text>
  <text x="420" y="455" font-family="Arial, sans-serif" font-size="11" fill="#333">Efficient learning</text>
  <text x="620" y="455" font-family="Arial, sans-serif" font-size="11" fill="#333">Prior specification critical</text>
  
  <!-- Weakly Informative -->
  <text x="80" y="475" font-family="Arial, sans-serif" font-size="11" fill="#00b894" font-weight="bold">Weakly Info.</text>
  <text x="220" y="475" font-family="Arial, sans-serif" font-size="11" fill="#333">Some constraints reasonable</text>
  <text x="420" y="475" font-family="Arial, sans-serif" font-size="11" fill="#333">Gentle regularization</text>
  <text x="620" y="475" font-family="Arial, sans-serif" font-size="11" fill="#333">Balanced approach</text>
  
  <!-- Non-informative -->
  <text x="80" y="495" font-family="Arial, sans-serif" font-size="11" fill="#0984e3" font-weight="bold">Flat</text>
  <text x="220" y="495" font-family="Arial, sans-serif" font-size="11" fill="#333">Limited prior knowledge</text>
  <text x="420" y="495" font-family="Arial, sans-serif" font-size="11" fill="#333">Objective analysis</text>
  <text x="620" y="495" font-family="Arial, sans-serif" font-size="11" fill="#333">May lead to overfitting</text>
  
  <!-- Conjugate -->
  <text x="80" y="515" font-family="Arial, sans-serif" font-size="11" fill="#00b894" font-weight="bold">Conjugate</text>
  <text x="220" y="515" font-family="Arial, sans-serif" font-size="11" fill="#333">Computational efficiency needed</text>
  <text x="420" y="515" font-family="Arial, sans-serif" font-size="11" fill="#333">Closed-form updates</text>
  <text x="620" y="515" font-family="Arial, sans-serif" font-size="11" fill="#333">Limited distributional forms</text>
  
  <!-- Bottom Notes -->
  <text x="60" y="570" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1a1a1a">
    Key Principle: Match prior strength to available domain knowledge and data size
  </text>
</svg>