<svg viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="800" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="500" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Network Density: Sparse vs Dense
  </text>
  
  <!-- Sparse Network Section -->
  <g transform="translate(100, 100)">
    <rect x="0" y="0" width="350" height="280" fill="white" stroke="#3498db" stroke-width="3" rx="5"/>
    
    <text x="175" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#3498db">
      Sparse Network
    </text>
    
    <!-- Sparse network visualization -->
    <g transform="translate(175, 160)">
      <!-- Center node -->
      <circle cx="0" cy="0" r="12" fill="#3498db" stroke="white" stroke-width="2"/>
      
      <!-- Connected nodes -->
      <line x1="0" y1="0" x2="-80" y2="-40" stroke="#3498db" stroke-width="2"/>
      <circle cx="-80" cy="-40" r="10" fill="#3498db" stroke="white" stroke-width="2"/>
      
      <line x1="0" y1="0" x2="0" y2="-70" stroke="#3498db" stroke-width="2"/>
      <circle cx="0" cy="-70" r="10" fill="#3498db" stroke="white" stroke-width="2"/>
      
      <line x1="0" y1="0" x2="80" y2="-40" stroke="#3498db" stroke-width="2"/>
      <circle cx="80" cy="-40" r="10" fill="#3498db" stroke="white" stroke-width="2"/>
      
      <line x1="0" y1="0" x2="70" y2="40" stroke="#3498db" stroke-width="2"/>
      <circle cx="70" cy="40" r="10" fill="#3498db" stroke="white" stroke-width="2"/>
      
      <!-- Isolated nodes -->
      <circle cx="-120" cy="50" r="8" fill="#95a5a6"/>
      <circle cx="-140" cy="-20" r="8" fill="#95a5a6"/>
      <circle cx="120" cy="50" r="8" fill="#95a5a6"/>
    </g>
    
    <text x="175" y="260" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#34495e">
      Few connections relative to possible
    </text>
  </g>
  
  <!-- Dense Network Section -->
  <g transform="translate(550, 100)">
    <rect x="0" y="0" width="350" height="280" fill="white" stroke="#e74c3c" stroke-width="3" rx="5"/>
    
    <text x="175" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#e74c3c">
      Dense Network
    </text>
    
    <!-- Dense network visualization -->
    <g transform="translate(175, 150)">
      <!-- Fully connected subgraph -->
      <circle cx="0" cy="-40" r="10" fill="#e74c3c" stroke="white" stroke-width="2"/>
      <circle cx="-60" cy="20" r="10" fill="#e74c3c" stroke="white" stroke-width="2"/>
      <circle cx="60" cy="20" r="10" fill="#e74c3c" stroke="white" stroke-width="2"/>
      <circle cx="0" cy="50" r="10" fill="#e74c3c" stroke="white" stroke-width="2"/>
      
      <!-- All-to-all connections -->
      <line x1="0" y1="-40" x2="-60" y2="20" stroke="#e74c3c" stroke-width="2"/>
      <line x1="0" y1="-40" x2="60" y2="20" stroke="#e74c3c" stroke-width="2"/>
      <line x1="0" y1="-40" x2="0" y2="50" stroke="#e74c3c" stroke-width="2"/>
      <line x1="-60" y1="20" x2="60" y2="20" stroke="#e74c3c" stroke-width="2"/>
      <line x1="-60" y1="20" x2="0" y2="50" stroke="#e74c3c" stroke-width="2"/>
      <line x1="60" y1="20" x2="0" y2="50" stroke="#e74c3c" stroke-width="2"/>
      
      <!-- Additional nodes with many connections -->
      <circle cx="-90" cy="-10" r="8" fill="#e74c3c" stroke="white" stroke-width="2"/>
      <circle cx="90" cy="-10" r="8" fill="#e74c3c" stroke="white" stroke-width="2"/>
      
      <line x1="-90" y1="-10" x2="0" y2="-40" stroke="#e74c3c" stroke-width="1.5"/>
      <line x1="-90" y1="-10" x2="-60" y2="20" stroke="#e74c3c" stroke-width="1.5"/>
      <line x1="90" y1="-10" x2="0" y2="-40" stroke="#e74c3c" stroke-width="1.5"/>
      <line x1="90" y1="-10" x2="60" y2="20" stroke="#e74c3c" stroke-width="1.5"/>
    </g>
    
    <text x="175" y="260" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#34495e">
      Many connections relative to possible
    </text>
  </g>
  
  <!-- Comparison table -->
  <g transform="translate(100, 420)">
    <rect x="0" y="0" width="800" height="330" fill="white" stroke="#34495e" stroke-width="2" rx="5"/>
    
    <text x="400" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Comparison
    </text>
    
    <!-- Headers -->
    <rect x="20" y="50" width="250" height="40" fill="#ecf0f1"/>
    <text x="145" y="75" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Sparse Networks
    </text>
    
    <rect x="530" y="50" width="250" height="40" fill="#ecf0f1"/>
    <text x="655" y="75" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Dense Networks
    </text>
    
    <!-- Row 1: Definition -->
    <text x="40" y="120" font-family="Arial, sans-serif" font-size="13" fill="#34495e" font-weight="bold">
      Definition:
    </text>
    <text x="40" y="140" font-family="Arial, sans-serif" font-size="12" fill="#34495e">
      Edges grow slower than
    </text>
    <text x="40" y="155" font-family="Arial, sans-serif" font-size="12" fill="#34495e">
      number of possible edges
    </text>
    
    <text x="550" y="140" font-family="Arial, sans-serif" font-size="12" fill="#34495e">
      Edges scale proportionally
    </text>
    <text x="550" y="155" font-family="Arial, sans-serif" font-size="12" fill="#34495e">
      with possible edges
    </text>
    
    <!-- Row 2: Examples -->
    <text x="40" y="195" font-family="Arial, sans-serif" font-size="13" fill="#34495e" font-weight="bold">
      Examples:
    </text>
    <text x="40" y="215" font-family="Arial, sans-serif" font-size="12" fill="#3498db">
      • Social Networks
    </text>
    <text x="40" y="235" font-family="Arial, sans-serif" font-size="12" fill="#3498db">
      • World Wide Web
    </text>
    <text x="40" y="255" font-family="Arial, sans-serif" font-size="12" fill="#3498db">
      • Citation Networks
    </text>
    <text x="40" y="275" font-family="Arial, sans-serif" font-size="12" fill="#3498db">
      • Internet Infrastructure
    </text>
    
    <text x="550" y="215" font-family="Arial, sans-serif" font-size="12" fill="#e74c3c">
      • Food Webs
    </text>
    <text x="550" y="235" font-family="Arial, sans-serif" font-size="12" fill="#e74c3c">
      • Ecological Networks
    </text>
    <text x="550" y="255" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">
      (Rare in practice)
    </text>
    
    <!-- Row 3: Characteristics -->
    <text x="40" y="305" font-family="Arial, sans-serif" font-size="13" fill="#34495e" font-weight="bold">
      Key Feature:
    </text>
    <text x="40" y="325" font-family="Arial, sans-serif" font-size="11" fill="#34495e" font-style="italic">
      "Connections per node stays constant
    </text>
    <text x="40" y="340" font-family="Arial, sans-serif" font-size="11" fill="#34495e" font-style="italic">
      as network grows"
    </text>
    
    <text x="550" y="325" font-family="Arial, sans-serif" font-size="11" fill="#34495e" font-style="italic">
      "Connections scale with
    </text>
    <text x="550" y="340" font-family="Arial, sans-serif" font-size="11" fill="#34495e" font-style="italic">
      network size"
    </text>
  </g>
  
  <!-- Formula -->
  <g transform="translate(150, 770)">
    <text x="350" y="0" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50" font-weight="bold">
      Density Formula: D = (Actual Edges) / (N × (N-1) / 2)
    </text>
  </g>
</svg>