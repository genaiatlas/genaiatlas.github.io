<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="highDimDistGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:0.6" />
    </linearGradient>
    <linearGradient id="lowDimDistGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:0.6" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="600" fill="#f1f5f9"/>
  
  <!-- Title -->
  <text x="500" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1e293b">
    Distribution Matching with Kullback-Leibler Divergence
  </text>
  
  <!-- High-dimensional distribution -->
  <g transform="translate(80,80)">
    <text x="180" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1e40af">
      High-Dimensional Distribution P
    </text>
    
    <!-- Distribution curve -->
    <path d="M 20 180 Q 60 100 100 110 Q 140 90 180 100 Q 220 110 260 120 Q 300 130 340 180" 
          fill="url(#highDimDistGrad)" opacity="0.6"/>
    <path d="M 20 180 Q 60 100 100 110 Q 140 90 180 100 Q 220 110 260 120 Q 300 130 340 180" 
          fill="none" stroke="#1d4ed8" stroke-width="3"/>
    
    <!-- Data points -->
    <circle cx="80" cy="110" r="4" fill="#fbbf24"/>
    <circle cx="140" cy="95" r="4" fill="#fbbf24"/>
    <circle cx="200" cy="105" r="4" fill="#fbbf24"/>
    <circle cx="260" cy="125" r="4" fill="#fbbf24"/>
    
    <!-- Axes -->
    <path d="M 15 185 L 345 185" stroke="#64748b" stroke-width="1"/>
    <path d="M 15 185 L 15 80" stroke="#64748b" stroke-width="1"/>
    
    <!-- Axis labels -->
    <text x="180" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">
      Pairwise Similarities
    </text>
    <text x="8" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569" transform="rotate(-90,8,130)">
      Probability
    </text>
    
    <!-- Mathematical notation -->
    <text x="180" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1e40af">
      p(j|i) = exp(-||xi - xj||²/2σi²) / Σk exp(-||xi - xk||²/2σi²)
    </text>
  </g>
  
  <!-- Low-dimensional distribution -->
  <g transform="translate(540,80)">
    <text x="180" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#047857">
      Low-Dimensional Distribution Q
    </text>
    
    <!-- Distribution curve -->
    <path d="M 20 180 Q 60 120 100 130 Q 140 125 180 130 Q 220 135 260 140 Q 300 150 340 180" 
          fill="url(#lowDimDistGrad)" opacity="0.6"/>
    <path d="M 20 180 Q 60 120 100 130 Q 140 125 180 130 Q 220 135 260 140 Q 300 150 340 180" 
          fill="none" stroke="#047857" stroke-width="3"/>
    
    <!-- Data points -->
    <circle cx="80" cy="135" r="4" fill="#fbbf24"/>
    <circle cx="140" cy="128" r="4" fill="#fbbf24"/>
    <circle cx="200" cy="132" r="4" fill="#fbbf24"/>
    <circle cx="260" cy="142" r="4" fill="#fbbf24"/>
    
    <!-- Axes -->
    <path d="M 15 185 L 345 185" stroke="#64748b" stroke-width="1"/>
    <path d="M 15 185 L 15 80" stroke="#64748b" stroke-width="1"/>
    
    <!-- Axis labels -->
    <text x="180" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">
      Embedding Similarities
    </text>
    <text x="8" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569" transform="rotate(-90,8,130)">
      Probability
    </text>
    
    <!-- Mathematical notation -->
    <text x="180" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#047857">
      q(j|i) = (1 + ||yi - yj||²)⁻¹ / Σk (1 + ||yi - yk||²)⁻¹
    </text>
  </g>
  
  <!-- Central KL Divergence box -->
  <g transform="translate(300,320)">
    <rect x="0" y="0" width="400" height="80" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
    
    <text x="200" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#dc2626">
      Optimization Objective: Minimize KL Divergence
    </text>
    
    <text x="200" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#7f1d1d">
      KL(P||Q) = Σi Σj p(j|i) log(p(j|i)/q(j|i))
    </text>
    
    <text x="20" y="65" font-family="Arial, sans-serif" font-size="12" fill="#7f1d1d">
      • Measures difference between probability distributions P and Q
    </text>
    <text x="20" y="78" font-family="Arial, sans-serif" font-size="11" fill="#7f1d1d">
      • t-SNE adjusts low-dimensional coordinates to minimize this objective • Goal: Make Q as similar as possible to P
    </text>
  </g>
  
  <!-- Minimize arrow -->
  <g transform="translate(400,285)">
    <path d="M 50 0 Q 100 -15 150 0" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text x="100" y="-20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#dc2626" font-weight="bold">
      Minimize
    </text>
  </g>
  
  <!-- Optimization Process box -->
  <g transform="translate(80,420)">
    <rect x="0" y="0" width="300" height="120" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1"/>
    
    <text x="15" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#374151">
      Optimization Process:
    </text>
    <text x="15" y="40" font-family="Arial, sans-serif" font-size="12" fill="#4b5563">
      1. Initialize embedding (often with PCA)
    </text>
    <text x="15" y="55" font-family="Arial, sans-serif" font-size="12" fill="#4b5563">
      2. Compute gradients ∂KL/∂yi for each point
    </text>
    <text x="15" y="70" font-family="Arial, sans-serif" font-size="12" fill="#4b5563">
      3. Update positions: yi ← yi - η∇KL + momentum
    </text>
    <text x="15" y="85" font-family="Arial, sans-serif" font-size="12" fill="#4b5563">
      4. Repeat until convergence
    </text>
  </g>
  
  <!-- Why t-Distribution box -->
  <g transform="translate(620,420)">
    <rect x="0" y="0" width="280" height="120" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    
    <text x="140" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#047857">
      Why t-Distribution?
    </text>
    <text x="15" y="40" font-family="Arial, sans-serif" font-size="12" fill="#047857">
      • Heavier tails than Gaussian
    </text>
    <text x="15" y="55" font-family="Arial, sans-serif" font-size="12" fill="#047857">
      • Better cluster separation
    </text>
    <text x="15" y="70" font-family="Arial, sans-serif" font-size="12" fill="#047857">
      • Reduces crowding problem
    </text>
    <text x="15" y="85" font-family="Arial, sans-serif" font-size="12" fill="#047857">
      • Allows distant points to repel
    </text>
  </g>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
  </defs>
</svg>