<svg width="900" height="700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title-text { font-family: 'Arial', sans-serif; font-size: 18px; font-weight: bold; text-anchor: middle; fill: #34495e; }
      .step-title { font-family: 'Arial', sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; fill: #2c3e50; }
      .node-text { font-family: 'Arial', sans-serif; font-size: 12px; text-anchor: middle; fill: white; }
      .value-text { font-family: 'Arial', sans-serif; font-size: 11px; text-anchor: middle; fill: #2c3e50; }
      .arrow-text { font-family: 'Arial', sans-serif; font-size: 12px; text-anchor: middle; fill: #e74c3c; }
      .label-text { font-family: 'Arial', sans-serif; font-size: 10px; text-anchor: middle; fill: #7f8c8d; }
    </style>
    
    <!-- Arrow marker -->
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" 
       refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c" />
      </marker>
    </defs>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="700" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="450" y="30" class="title-text">Recursive Binary Partitioning: Tree Growing Process</text>
  
  <!-- Step 1: Initial Data -->
  <text x="150" y="65" class="step-title">Step 1: Initial Dataset</text>
  <rect x="50" y="80" width="200" height="80" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2" rx="5"/>
  <text x="150" y="105" class="value-text">College Graduates: Avg $20</text>
  <text x="150" y="125" class="value-text">Non-Graduates: Avg $13</text>
  <text x="150" y="145" class="value-text">Overall MSE: 15.2</text>
  
  <!-- Arrow 1 -->
  <line x1="250" y1="120" x2="320" y2="120" stroke="#e74c3c" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="285" y="110" class="arrow-text">Split on</text>
  <text x="285" y="130" class="arrow-text">College</text>
  
  <!-- Step 2: First Split -->
  <text x="450" y="65" class="step-title">Step 2: Split on College (Depth 1)</text>
  
  <!-- Root node -->
  <rect x="400" y="85" width="100" height="30" rx="5" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="450" y="103" class="node-text">College &lt; 0.5</text>
  
  <!-- Level 1 children -->
  <circle cx="380" cy="150" r="25" fill="#27ae60" stroke="#229954" stroke-width="2"/>
  <text x="380" y="155" class="node-text">$13</text>
  
  <circle cx="520" cy="150" r="25" fill="#27ae60" stroke="#229954" stroke-width="2"/>
  <text x="520" y="155" class="node-text">$20</text>
  
  <!-- Connections -->
  <line x1="425" y1="115" x2="395" y2="125" stroke="#34495e" stroke-width="2"/>
  <line x1="475" y1="115" x2="505" y2="125" stroke="#34495e" stroke-width="2"/>
  
  <!-- Labels -->
  <text x="410" y="135" class="label-text">Yes</text>
  <text x="490" y="135" class="label-text">No</text>
  
  <!-- Arrow 2 -->
  <line x1="580" y1="120" x2="650" y2="120" stroke="#e74c3c" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="615" y="110" class="arrow-text">Further</text>
  <text x="615" y="130" class="arrow-text">Split</text>
  
  <!-- Step 3: Second Split -->
  <text x="750" y="65" class="step-title">Step 3: Split on Experience (Depth 2)</text>
  
  <!-- Root node -->
  <rect x="700" y="85" width="100" height="30" rx="5" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="750" y="103" class="node-text">College &lt; 0.5</text>
  
  <!-- Level 1 nodes -->
  <rect x="620" y="130" width="80" height="25" rx="3" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="660" y="145" class="node-text" font-size="10px">Exp &lt; 14</text>
  
  <rect x="780" y="130" width="80" height="25" rx="3" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="820" y="145" class="node-text" font-size="10px">Exp &lt; 9.5</text>
  
  <!-- Level 2 children -->
  <circle cx="620" cy="190" r="18" fill="#27ae60" stroke="#229954" stroke-width="2"/>
  <text x="620" y="195" class="node-text" font-size="10px">$12</text>
  
  <circle cx="700" cy="190" r="18" fill="#27ae60" stroke="#229954" stroke-width="2"/>
  <text x="700" y="195" class="node-text" font-size="10px">$14</text>
  
  <circle cx="780" cy="190" r="18" fill="#27ae60" stroke="#229954" stroke-width="2"/>
  <text x="780" y="195" class="node-text" font-size="10px">$17</text>
  
  <circle cx="860" cy="190" r="18" fill="#27ae60" stroke="#229954" stroke-width="2"/>
  <text x="860" y="195" class="node-text" font-size="10px">$24</text>
  
  <!-- Connections Level 1 -->
  <line x1="725" y1="115" x2="675" y2="130" stroke="#34495e" stroke-width="2"/>
  <line x1="775" y1="115" x2="805" y2="130" stroke="#34495e" stroke-width="2"/>
  
  <!-- Connections Level 2 -->
  <line x1="645" y1="155" x2="630" y2="172" stroke="#34495e" stroke-width="2"/>
  <line x1="675" y1="155" x2="690" y2="172" stroke="#34495e" stroke-width="2"/>
  <line x1="805" y1="155" x2="790" y2="172" stroke="#34495e" stroke-width="2"/>
  <line x1="835" y1="155" x2="850" y2="172" stroke="#34495e" stroke-width="2"/>
  
  <!-- MSE Reduction Analysis -->
  <rect x="50" y="250" width="800" height="160" fill="#ffffff" stroke="#bdc3c7" stroke-width="2" rx="10"/>
  <text x="450" y="275" class="step-title">MSE Reduction at Each Split</text>
  
  <!-- Split Analysis Table -->
  <rect x="70" y="290" width="250" height="110" fill="#ecf0f1" stroke="#95a5a6" stroke-width="1"/>
  <text x="195" y="310" class="step-title" font-size="12px">Split Selection Criteria</text>
  
  <text x="80" y="330" class="value-text">Variable: College Degree</text>
  <text x="80" y="345" class="value-text">Split Point: 0.5</text>
  <text x="80" y="360" class="value-text">MSE Before: 15.2</text>
  <text x="80" y="375" class="value-text">MSE After: 8.7</text>
  <text x="80" y="390" class="value-text">Reduction: 6.5</text>
  
  <!-- Best Split Calculation -->
  <rect x="350" y="290" width="250" height="110" fill="#ecf0f1" stroke="#95a5a6" stroke-width="1"/>
  <text x="475" y="310" class="step-title" font-size="12px">Experience Split (College=1)</text>
  
  <text x="360" y="330" class="value-text">Variable: Experience</text>
  <text x="360" y="345" class="value-text">Split Point: 9.5 years</text>
  <text x="360" y="360" class="value-text">MSE Before: 5.8</text>
  <text x="360" y="375" class="value-text">MSE After: 3.2</text>
  <text x="360" y="390" class="value-text">Reduction: 2.6</text>
  
  <!-- Algorithm Steps -->
  <rect x="630" y="290" width="200" height="110" fill="#ecf0f1" stroke="#95a5a6" stroke-width="1"/>
  <text x="730" y="310" class="step-title" font-size="12px">Algorithm Steps</text>
  
  <text x="640" y="330" class="value-text">1. Try all variables</text>
  <text x="640" y="345" class="value-text">2. Try all split points</text>
  <text x="640" y="360" class="value-text">3. Select best MSE reduction</text>
  <text x="640" y="375" class="value-text">4. Repeat for each node</text>
  <text x="640" y="390" class="value-text">5. Stop at max depth</text>
  
  <!-- Stopping Criteria -->
  <rect x="50" y="440" width="800" height="120" fill="#fdfefe" stroke="#d5dbdb" stroke-width="2" rx="5"/>
  <text x="450" y="465" class="step-title">Stopping Criteria and Pruning</text>
  
  <!-- Criteria boxes -->
  <rect x="70" y="480" width="200" height="70" fill="#fff3cd" stroke="#ffc107" stroke-width="1" rx="3"/>
  <text x="170" y="500" class="step-title" font-size="12px">Depth Control</text>
  <text x="80" y="520" class="value-text">• Maximum depth reached</text>
  <text x="80" y="535" class="value-text">• Minimum samples per leaf</text>
  
  <rect x="290" y="480" width="200" height="70" fill="#d1ecf1" stroke="#17a2b8" stroke-width="1" rx="3"/>
  <text x="390" y="500" class="step-title" font-size="12px">MSE Improvement</text>
  <text x="300" y="520" class="value-text">• No significant MSE reduction</text>
  <text x="300" y="535" class="value-text">• Cross-validation error increases</text>
  
  <rect x="510" y="480" width="200" height="70" fill="#f8d7da" stroke="#dc3545" stroke-width="1" rx="3"/>
  <text x="610" y="500" class="step-title" font-size="12px">Pruning</text>
  <text x="520" y="520" class="value-text">• Remove overfitting branches</text>
  <text x="520" y="535" class="value-text">• Use validation data</text>
  
  <rect x="730" y="480" width="110" height="70" fill="#d4edda" stroke="#28a745" stroke-width="1" rx="3"/>
  <text x="785" y="500" class="step-title" font-size="12px">Final Tree</text>
  <text x="740" y="520" class="value-text">• Optimal depth: 2</text>
  <text x="740" y="535" class="value-text">• 4 leaf nodes</text>
  
  <!-- Mathematical Formula -->
  <rect x="50" y="580" width="800" height="80" fill="#e8f4f8" stroke="#5dade2" stroke-width="2" rx="5"/>
  <text x="450" y="605" class="step-title">MSE Calculation for Split Selection</text>
  
  <text x="450" y="630" class="value-text">MSE_split = Σ (n_left/n_total) × MSE_left + (n_right/n_total) × MSE_right</text>
  <text x="450" y="650" class="value-text">Best Split = argmin(MSE_split) over all variables and split points</text>
  
</svg>