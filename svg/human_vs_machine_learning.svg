<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="900" height="500" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">Human vs Machine Learning Comparison</text>
  
  <!-- Dividing Line -->
  <line x1="450" y1="50" x2="450" y2="460" stroke="#bdc3c7" stroke-width="2" stroke-dasharray="10,5"/>
  
  <!-- Human Learning Side -->
  <rect x="50" y="60" width="350" height="380" rx="10" fill="#e8f8fd" stroke="#3498db" stroke-width="2"/>
  <text x="225" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2980b9">Human Learning 🧠</text>
  
  <!-- Human Learning Characteristics -->
  <rect x="80" y="110" width="290" height="50" rx="5" fill="#ffffff" stroke="#3498db" stroke-width="1"/>
  <text x="225" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Few-Shot Learning</text>
  <text x="225" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#34495e">Learns from 1-3 examples</text>
  
  <rect x="80" y="180" width="290" height="50" rx="5" fill="#ffffff" stroke="#3498db" stroke-width="1"/>
  <text x="225" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Pattern Recognition</text>
  <text x="225" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#34495e">Excellent at visual patterns</text>
  
  <rect x="80" y="250" width="290" height="50" rx="5" fill="#ffffff" stroke="#3498db" stroke-width="1"/>
  <text x="225" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Generalization</text>
  <text x="225" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#34495e">Applies to unseen scenarios</text>
  
  <!-- Example: Child Learning Animals -->
  <rect x="80" y="320" width="290" height="100" rx="5" fill="#d5e8fc" stroke="#3498db" stroke-width="1"/>
  <text x="225" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">Example: Child Learning Animals</text>
  
  <text x="90" y="355" font-family="Arial, sans-serif" font-size="9" fill="#34495e">1. Initial confusion (elephant → "dog")</text>
  <text x="90" y="370" font-family="Arial, sans-serif" font-size="9" fill="#34495e">2. Show 2-3 examples of each</text>
  <text x="90" y="385" font-family="Arial, sans-serif" font-size="9" fill="#34495e">3. Point out features (trunk, ears, tusks)</text>
  <text x="90" y="400" font-family="Arial, sans-serif" font-size="9" fill="#34495e">4. Perfect classification of new images</text>
  
  <!-- Machine Learning Side -->
  <rect x="500" y="60" width="350" height="380" rx="10" fill="#fef2e8" stroke="#f39c12" stroke-width="2"/>
  <text x="675" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#e67e22">Machine Learning 🤖</text>
  
  <!-- Machine Learning Characteristics -->
  <rect x="530" y="110" width="290" height="50" rx="5" fill="#ffffff" stroke="#f39c12" stroke-width="1"/>
  <text x="675" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Large Data Requirements</text>
  <text x="675" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#34495e">Needs thousands/millions of examples</text>
  
  <rect x="530" y="180" width="290" height="50" rx="5" fill="#ffffff" stroke="#f39c12" stroke-width="1"/>
  <text x="675" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Computational Power</text>
  <text x="675" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#34495e">Excels at mathematical operations</text>
  
  <rect x="530" y="250" width="290" height="50" rx="5" fill="#ffffff" stroke="#f39c12" stroke-width="1"/>
  <text x="675" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Consistency</text>
  <text x="675" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#34495e">Never gets tired or distracted</text>
  
  <!-- Example: Traditional ML Training -->
  <rect x="530" y="320" width="290" height="100" rx="5" fill="#fce4b6" stroke="#f39c12" stroke-width="1"/>
  <text x="675" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">Example: Traditional ML Training</text>
  
  <text x="540" y="355" font-family="Arial, sans-serif" font-size="9" fill="#34495e">1. Collect 100,000+ labeled images</text>
  <text x="540" y="370" font-family="Arial, sans-serif" font-size="9" fill="#34495e">2. Extract hand-crafted features</text>
  <text x="540" y="385" font-family="Arial, sans-serif" font-size="9" fill="#34495e">3. Train for hours/days on GPUs</text>
  <text x="540" y="400" font-family="Arial, sans-serif" font-size="9" fill="#34495e">4. Achieve good but limited performance</text>
  
  <!-- Performance Comparison Chart -->
  <rect x="150" y="450" width="600" height="40" rx="5" fill="#ffffff" stroke="#34495e" stroke-width="1"/>
  <text x="450" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Learning Efficiency Comparison</text>
  
  <!-- Human efficiency bar -->
  <rect x="170" y="475" width="200" height="8" rx="4" fill="#3498db"/>
  <text x="270" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">Human: High efficiency, few examples</text>
  
  <!-- Machine efficiency bar -->
  <rect x="530" y="475" width="80" height="8" rx="4" fill="#f39c12"/>
  <text x="570" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">Traditional ML: Low efficiency</text>
  
  <!-- Deep Learning Bridge -->
  <ellipse cx="450" cy="300" rx="80" ry="40" fill="#e8e4fd" stroke="#9b59b6" stroke-width="2"/>
  <text x="450" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#8e44ad">Deep Learning</text>
  <text x="450" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#8e44ad">Bridging the Gap</text>
  
  <!-- Arrows showing the bridge concept -->
  <path d="M 380 280 L 420 290" stroke="#9b59b6" stroke-width="2" marker-end="url(#arrowhead)" fill="none"/>
  <path d="M 480 290 L 520 280" stroke="#9b59b6" stroke-width="2" marker-end="url(#arrowhead)" fill="none"/>
  
  <!-- Modern ML developments -->
  <rect x="380" y="350" width="140" height="60" rx="5" fill="#f4e8fd" stroke="#9b59b6" stroke-width="1"/>
  <text x="450" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#8e44ad">Few-Shot Deep Learning</text>
  <text x="450" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#8e44ad">• Transfer Learning</text>
  <text x="450" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#8e44ad">• Meta Learning</text>
  <text x="450" y="404" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#8e44ad">• One-Shot Learning</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9b59b6"/>
    </marker>
  </defs>
</svg>