<svg viewBox="0 0 900 650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rootGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#667EEA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764BA2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="nodeGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4FACFE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00F2FE;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="waitGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#68D391;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38A169;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="leaveGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FC8181;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E53E3E;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#00000020"/>
    </filter>
  </defs>
  
  <!-- Title -->
  <text x="450" y="25" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#333">
    Restaurant Decision Tree: Wait Estimation Example
  </text>
  
  <!-- Root Node: Wait Estimate -->
  <ellipse cx="450" cy="80" rx="90" ry="35" fill="url(#rootGradient)" stroke="#5A67D8" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="75" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">
    Wait Estimate
  </text>
  <text x="450" y="90" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    (Root Node)
  </text>
  
  <!-- Branch Lines from Root -->
  <line x1="380" y1="105" x2="150" y2="160" stroke="#666" stroke-width="2"/>
  <line x1="420" y1="110" x2="300" y2="160" stroke="#666" stroke-width="2"/>
  <line x1="480" y1="110" x2="600" y2="160" stroke="#666" stroke-width="2"/>
  <line x1="520" y1="105" x2="750" y2="160" stroke="#666" stroke-width="2"/>
  
  <!-- Branch Labels -->
  <text x="250" y="135" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#666">0-10 min</text>
  <text x="350" y="135" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#666">10-30 min</text>
  <text x="540" y="135" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#666">30-60 min</text>
  <text x="650" y="135" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#666">&gt;60 min</text>
  
  <!-- Level 2 Nodes -->
  
  <!-- Patrons Node (0-10 min) -->
  <ellipse cx="150" cy="180" rx="60" ry="30" fill="url(#nodeGradient)" stroke="#0987A0" stroke-width="2"/>
  <text x="150" y="175" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">
    Patrons
  </text>
  <text x="150" y="188" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
    (Occupancy)
  </text>
  
  <!-- Hungry Node (10-30 min) -->
  <ellipse cx="300" cy="180" rx="60" ry="30" fill="url(#nodeGradient)" stroke="#0987A0" stroke-width="2"/>
  <text x="300" y="175" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">
    Hungry
  </text>
  <text x="300" y="188" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
    (Customer)
  </text>
  
  <!-- Hungry Node (30-60 min) -->
  <ellipse cx="600" cy="180" rx="60" ry="30" fill="url(#nodeGradient)" stroke="#0987A0" stroke-width="2"/>
  <text x="600" y="175" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">
    Hungry
  </text>
  <text x="600" y="188" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
    (Customer)
  </text>
  
  <!-- Direct Leaf for >60 min -->
  <rect x="720" y="160" width="60" height="40" rx="6" fill="url(#leaveGradient)" stroke="#E53E3E" stroke-width="2"/>
  <text x="750" y="175" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">
    LEAVE
  </text>
  <text x="750" y="188" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">
    (Too long)
  </text>
  
  <!-- Level 3 Branches and Leaves -->
  
  <!-- From Patrons Node -->
  <line x1="120" y1="200" x2="80" y2="240" stroke="#666" stroke-width="2"/>
  <line x1="150" y1="210" x2="150" y2="240" stroke="#666" stroke-width="2"/>
  <line x1="180" y1="200" x2="220" y2="240" stroke="#666" stroke-width="2"/>
  
  <text x="90" y="225" font-family="Arial, sans-serif" font-size="10" fill="#666">None</text>
  <text x="140" y="225" font-family="Arial, sans-serif" font-size="10" fill="#666">Some</text>
  <text x="210" y="225" font-family="Arial, sans-serif" font-size="10" fill="#666">Full</text>
  
  <!-- Patrons Leaves -->
  <rect x="50" y="250" width="60" height="35" rx="5" fill="url(#leaveGradient)" stroke="#E53E3E" stroke-width="2"/>
  <text x="80" y="270" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">LEAVE</text>
  
  <rect x="120" y="250" width="60" height="35" rx="5" fill="url(#waitGradient)" stroke="#38A169" stroke-width="2"/>
  <text x="150" y="270" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">WAIT</text>
  
  <rect x="190" y="250" width="60" height="35" rx="5" fill="url(#leaveGradient)" stroke="#E53E3E" stroke-width="2"/>
  <text x="220" y="270" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">LEAVE</text>
  
  <!-- From Hungry Node (10-30 min) -->
  <line x1="270" y1="200" x2="250" y2="240" stroke="#666" stroke-width="2"/>
  <line x1="330" y1="200" x2="410" y2="240" stroke="#666" stroke-width="2"/>
  
  <text x="240" y="225" font-family="Arial, sans-serif" font-size="10" fill="#666">Yes</text>
  <text x="400" y="225" font-family="Arial, sans-serif" font-size="10" fill="#666">No</text>
  
  <!-- Hungry Leaves (10-30 min) -->
  <rect x="220" y="250" width="60" height="35" rx="5" fill="url(#waitGradient)" stroke="#38A169" stroke-width="2"/>
  <text x="250" y="270" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">WAIT</text>
  
  <!-- Alternative Node (10-30 min, Not Hungry) -->
  <ellipse cx="410" cy="260" rx="50" ry="25" fill="url(#nodeGradient)" stroke="#0987A0" stroke-width="1"/>
  <text x="410" y="255" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="white">
    Alternative
  </text>
  <text x="410" y="268" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">
    (Nearby?)
  </text>
  
  <!-- From Alternative Node -->
  <line x1="380" y1="280" x2="360" y2="310" stroke="#666" stroke-width="1"/>
  <line x1="440" y1="280" x2="460" y2="310" stroke="#666" stroke-width="1"/>
  
  <text x="350" y="300" font-family="Arial, sans-serif" font-size="9" fill="#666">Yes</text>
  <text x="470" y="300" font-family="Arial, sans-serif" font-size="9" fill="#666">No</text>
  
  <!-- Alternative Leaves -->
  <rect x="330" y="315" width="50" height="30" rx="4" fill="url(#leaveGradient)" stroke="#E53E3E" stroke-width="1"/>
  <text x="355" y="333" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="white">LEAVE</text>
  
  <rect x="440" y="315" width="50" height="30" rx="4" fill="url(#waitGradient)" stroke="#38A169" stroke-width="1"/>
  <text x="465" y="333" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="white">WAIT</text>
  
  <!-- From Hungry Node (30-60 min) -->
  <line x1="570" y1="200" x2="550" y2="240" stroke="#666" stroke-width="2"/>
  <line x1="630" y1="200" x2="650" y2="240" stroke="#666" stroke-width="2"/>
  
  <text x="540" y="225" font-family="Arial, sans-serif" font-size="10" fill="#666">Yes</text>
  <text x="660" y="225" font-family="Arial, sans-serif" font-size="10" fill="#666">No</text>
  
  <!-- Hungry Leaves (30-60 min) -->
  <rect x="520" y="250" width="60" height="35" rx="5" fill="url(#leaveGradient)" stroke="#E53E3E" stroke-width="2"/>
  <text x="550" y="270" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">LEAVE</text>
  
  <rect x="620" y="250" width="60" height="35" rx="5" fill="url(#waitGradient)" stroke="#38A169" stroke-width="2"/>
  <text x="650" y="270" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">WAIT</text>
  
  <!-- Performance Metrics -->
  <rect x="50" y="370" width="800" height="130" rx="10" fill="#f8f9fa" stroke="#ddd" stroke-width="1"/>
  <text x="450" y="395" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">
    Model Performance Analysis
  </text>
  
  <!-- Performance Table -->
  <rect x="80" y="410" width="350" height="80" rx="5" fill="white" stroke="#ccc" stroke-width="1"/>
  <text x="255" y="430" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">
    Classification Results
  </text>
  
  <text x="90" y="450" font-family="Arial, sans-serif" font-size="11" fill="#333">
    <tspan font-weight="bold">Total Samples:</tspan> 12 customers
  </text>
  <text x="90" y="465" font-family="Arial, sans-serif" font-size="11" fill="#333">
    <tspan font-weight="bold">Correctly Classified:</tspan> 10 samples
  </text>
  <text x="90" y="480" font-family="Arial, sans-serif" font-size="11" fill="#333">
    <tspan font-weight="bold">Misclassified:</tspan> 2 samples
  </text>
  
  <!-- Error Rate -->
  <rect x="470" y="410" width="350" height="80" rx="5" fill="white" stroke="#ccc" stroke-width="1"/>
  <text x="645" y="430" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">
    Model Accuracy
  </text>
  
  <text x="480" y="450" font-family="Arial, sans-serif" font-size="11" fill="#333">
    <tspan font-weight="bold">Accuracy:</tspan> 83.3% (10/12)
  </text>
  <text x="480" y="465" font-family="Arial, sans-serif" font-size="11" fill="#333">
    <tspan font-weight="bold">Error Rate:</tspan> 16.7% (2/12)
  </text>
  <text x="480" y="480" font-family="Arial, sans-serif" font-size="11" fill="#555">
    Significant improvement over random tree
  </text>
  
  <!-- Feature Importance -->
  <rect x="80" y="520" width="740" height="100" rx="8" fill="#EDF2F7" stroke="#A0AEC0" stroke-width="1"/>
  <text x="450" y="545" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">
    Feature Selection Strategy
  </text>
  
  <text x="100" y="565" font-family="Arial, sans-serif" font-size="12" fill="#333">
    <tspan font-weight="bold">1. Wait Estimate (Root):</tspan> Most informative feature - directly relates to customer patience
  </text>
  <text x="100" y="580" font-family="Arial, sans-serif" font-size="12" fill="#333">
    <tspan font-weight="bold">2. Patrons/Hungry (Level 2):</tspan> Context-dependent splits based on wait time ranges
  </text>
  <text x="100" y="595" font-family="Arial, sans-serif" font-size="12" fill="#333">
    <tspan font-weight="bold">3. Alternative (Level 3):</tspan> Fine-grained decision for edge cases
  </text>
  <text x="100" y="610" font-family="Arial, sans-serif" font-size="11" fill="#666">
    Tree depth = 3, uses entropy-based information gain for optimal feature selection
  </text>
</svg>