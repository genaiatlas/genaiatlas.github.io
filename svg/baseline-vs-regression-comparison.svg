<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title-text { font-family: 'Arial', sans-serif; font-size: 24px; font-weight: bold; fill: #2c3e50; }
      .subtitle-text { font-family: 'Arial', sans-serif; font-size: 18px; font-weight: bold; fill: #34495e; }
      .label-text { font-family: 'Arial', sans-serif; font-size: 14px; fill: #34495e; }
      .small-text { font-family: 'Arial', sans-serif; font-size: 12px; fill: #7f8c8d; }
      .equation-text { font-family: 'Times New Roman', serif; font-size: 14px; fill: #2c3e50; }
      .axis-line { stroke: #2c3e50; stroke-width: 2; }
      .grid-line { stroke: #ecf0f1; stroke-width: 1; }
      .data-point { fill: #3498db; stroke: #2980b9; stroke-width: 1; }
      .baseline-line { stroke: #dc3545; stroke-width: 3; stroke-dasharray: 5,5; }
      .regression-line { stroke: #28a745; stroke-width: 3; }
      .residual-baseline { stroke: #dc3545; stroke-width: 1; stroke-dasharray: 2,2; opacity: 0.7; }
      .residual-regression { stroke: #28a745; stroke-width: 1; stroke-dasharray: 2,2; opacity: 0.7; }
      .highlight-box { fill: #f8f9fa; stroke: #6c757d; stroke-width: 1; rx: 5; }
    </style>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title-text">Baseline vs Regression Model Comparison</text>
  
  <!-- Left plot: Baseline Model -->
  <g transform="translate(50, 70)">
    <text x="150" y="0" text-anchor="middle" class="subtitle-text" fill="#c82333">Baseline Model (Mean Prediction)</text>
    
    <!-- Coordinate system -->
    <g transform="translate(30, 30)">
      <!-- Grid -->
      <line x1="0" y1="50" x2="240" y2="50" class="grid-line"/>
      <line x1="0" y1="100" x2="240" y2="100" class="grid-line"/>
      <line x1="0" y1="150" x2="240" y2="150" class="grid-line"/>
      <line x1="0" y1="200" x2="240" y2="200" class="grid-line"/>
      <line x1="0" y1="250" x2="240" y2="250" class="grid-line"/>
      
      <line x1="60" y1="0" x2="60" y2="280" class="grid-line"/>
      <line x1="120" y1="0" x2="120" y2="280" class="grid-line"/>
      <line x1="180" y1="0" x2="180" y2="280" class="grid-line"/>
      
      <!-- Axes -->
      <line x1="0" y1="280" x2="240" y2="280" class="axis-line"/>
      <line x1="0" y1="0" x2="0" y2="280" class="axis-line"/>
      
      <!-- Baseline line (horizontal at mean) -->
      <line x1="20" y1="140" x2="220" y2="140" class="baseline-line"/>
      
      <!-- Data points -->
      <circle cx="40" cy="200" r="3" class="data-point"/>
      <circle cx="60" cy="180" r="3" class="data-point"/>
      <circle cx="80" cy="160" r="3" class="data-point"/>
      <circle cx="100" cy="120" r="3" class="data-point"/>
      <circle cx="120" cy="100" r="3" class="data-point"/>
      <circle cx="140" cy="130" r="3" class="data-point"/>
      <circle cx="160" cy="110" r="3" class="data-point"/>
      <circle cx="180" cy="90" r="3" class="data-point"/>
      <circle cx="200" cy="80" r="3" class="data-point"/>
      
      <!-- Residuals to baseline -->
      <line x1="40" y1="200" x2="40" y2="140" class="residual-baseline"/>
      <line x1="60" y1="180" x2="60" y2="140" class="residual-baseline"/>
      <line x1="80" y1="160" x2="80" y2="140" class="residual-baseline"/>
      <line x1="100" y1="120" x2="100" y2="140" class="residual-baseline"/>
      <line x1="120" y1="100" x2="120" y2="140" class="residual-baseline"/>
      <line x1="140" y1="130" x2="140" y2="140" class="residual-baseline"/>
      <line x1="160" y1="110" x2="160" y2="140" class="residual-baseline"/>
      <line x1="180" y1="90" x2="180" y2="140" class="residual-baseline"/>
      <line x1="200" y1="80" x2="200" y2="140" class="residual-baseline"/>
      
      <!-- Labels -->
      <text x="120" y="300" text-anchor="middle" class="small-text">X</text>
      <text x="-15" y="140" text-anchor="middle" class="small-text" transform="rotate(-90, -15, 140)">Y</text>
      
      <!-- Mean line label -->
      <text x="230" y="135" class="small-text" fill="#c82333">Ȳ</text>
    </g>
    
    <!-- TSS explanation -->
    <g transform="translate(0, 350)">
      <rect x="0" y="0" width="300" height="60" class="highlight-box"/>
      <text x="10" y="20" class="label-text" fill="#c82333">TSS = Σ(Yᵢ - Ȳ)²</text>
      <text x="10" y="35" class="small-text">Total Sum of Squares</text>
      <text x="10" y="50" class="small-text">Large residuals from mean</text>
    </g>
  </g>
  
  <!-- Right plot: Regression Model -->
  <g transform="translate(450, 70)">
    <text x="150" y="0" text-anchor="middle" class="subtitle-text" fill="#1e7e34">Regression Model (Best Fit Line)</text>
    
    <!-- Coordinate system -->
    <g transform="translate(30, 30)">
      <!-- Grid -->
      <line x1="0" y1="50" x2="240" y2="50" class="grid-line"/>
      <line x1="0" y1="100" x2="240" y2="100" class="grid-line"/>
      <line x1="0" y1="150" x2="240" y2="150" class="grid-line"/>
      <line x1="0" y1="200" x2="240" y2="200" class="grid-line"/>
      <line x1="0" y1="250" x2="240" y2="250" class="grid-line"/>
      
      <line x1="60" y1="0" x2="60" y2="280" class="grid-line"/>
      <line x1="120" y1="0" x2="120" y2="280" class="grid-line"/>
      <line x1="180" y1="0" x2="180" y2="280" class="grid-line"/>
      
      <!-- Axes -->
      <line x1="0" y1="280" x2="240" y2="280" class="axis-line"/>
      <line x1="0" y1="0" x2="0" y2="280" class="axis-line"/>
      
      <!-- Regression line -->
      <line x1="20" y1="220" x2="220" y2="60" class="regression-line"/>
      
      <!-- Same data points -->
      <circle cx="40" cy="200" r="3" class="data-point"/>
      <circle cx="60" cy="180" r="3" class="data-point"/>
      <circle cx="80" cy="160" r="3" class="data-point"/>
      <circle cx="100" cy="120" r="3" class="data-point"/>
      <circle cx="120" cy="100" r="3" class="data-point"/>
      <circle cx="140" cy="130" r="3" class="data-point"/>
      <circle cx="160" cy="110" r="3" class="data-point"/>
      <circle cx="180" cy="90" r="3" class="data-point"/>
      <circle cx="200" cy="80" r="3" class="data-point"/>
      
      <!-- Residuals to regression line -->
      <line x1="40" y1="200" x2="40" y2="200" class="residual-regression"/>
      <line x1="60" y1="180" x2="60" y2="178" class="residual-regression"/>
      <line x1="80" y1="160" x2="80" y2="156" class="residual-regression"/>
      <line x1="100" y1="120" x2="100" y2="134" class="residual-regression"/>
      <line x1="120" y1="100" x2="120" y2="112" class="residual-regression"/>
      <line x1="140" y1="130" x2="140" y2="132" class="residual-regression"/>
      <line x1="160" y1="110" x2="160" y2="110" class="residual-regression"/>
      <line x1="180" y1="90" x2="180" y2="88" class="residual-regression"/>
      <line x1="200" y1="80" x2="200" y2="66" class="residual-regression"/>
      
      <!-- Labels -->
      <text x="120" y="300" text-anchor="middle" class="small-text">X</text>
      <text x="-15" y="140" text-anchor="middle" class="small-text" transform="rotate(-90, -15, 140)">Y</text>
      
      <!-- Regression line label -->
      <text x="230" y="55" class="small-text" fill="#1e7e34">θᵀX</text>
    </g>
    
    <!-- RSS explanation -->
    <g transform="translate(0, 350)">
      <rect x="0" y="0" width="300" height="60" class="highlight-box"/>
      <text x="10" y="20" class="label-text" fill="#1e7e34">RSS = Σ(Yᵢ - Ŷᵢ)²</text>
      <text x="10" y="35" class="small-text">Residual Sum of Squares</text>
      <text x="10" y="50" class="small-text">Smaller residuals from line</text>
    </g>
  </g>
  
  <!-- Comparison arrow and R² formula -->
  <g transform="translate(350, 250)">
    <path d="M 0 0 L 50 0 L 45 -5 M 50 0 L 45 5" stroke="#6c757d" stroke-width="3" fill="#6c757d"/>
    <text x="25" y="-15" text-anchor="middle" class="label-text">Improvement</text>
  </g>
  
  <!-- R² calculation -->
  <g transform="translate(250, 450)">
    <rect x="0" y="0" width="300" height="40" fill="#e8f5e8" stroke="#28a745" stroke-width="2" rx="5"/>
    <text x="150" y="25" text-anchor="middle" class="equation-text">R² = 1 - RSS/TSS = (TSS - RSS)/TSS</text>
  </g>
</svg>