<svg viewBox="0 0 1000 650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="x1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#66BB6A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="x2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF9800;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFB74D;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dataGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2196F3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#42A5F5;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="1" flood-color="#00000040"/>
    </filter>
  </defs>
  
  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#333">
    Feature Selection Comparison: X₁ vs X₂
  </text>
  
  <!-- Original Dataset -->
  <g transform="translate(400, 60)">
    <rect x="0" y="0" width="200" height="100" rx="10" fill="url(#dataGrad)" stroke="#333" stroke-width="2" filter="url(#shadow)"/>
    <text x="100" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
      Original Dataset
    </text>
    
    <!-- Data table representation -->
    <rect x="20" y="35" width="160" height="50" fill="white" rx="5"/>
    
    <!-- Mini table -->
    <text x="50" y="50" font-family="Arial, sans-serif" font-size="10" font-weight="bold">X₁</text>
    <text x="80" y="50" font-family="Arial, sans-serif" font-size="10" font-weight="bold">X₂</text>
    <text x="110" y="50" font-family="Arial, sans-serif" font-size="10" font-weight="bold">Y</text>
    <text x="140" y="50" font-family="Arial, sans-serif" font-size="10" font-weight="bold">Count</text>
    
    <text x="50" y="63" font-family="Arial, sans-serif" font-size="9">T,F</text>
    <text x="80" y="63" font-family="Arial, sans-serif" font-size="9">T,F</text>
    <text x="110" y="63" font-family="Arial, sans-serif" font-size="9">5T,3F</text>
    <text x="140" y="63" font-family="Arial, sans-serif" font-size="9">n=8</text>
    
    <text x="100" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
      H(Y) = 0.954
    </text>
  </g>
  
  <!-- Split by X₁ -->
  <g transform="translate(100, 200)">
    <rect x="0" y="0" width="350" height="180" rx="12" fill="url(#x1Grad)" stroke="#333" stroke-width="2" filter="url(#shadow)"/>
    <text x="175" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">
      Split by Feature X₁
    </text>
    
    <!-- Tree structure for X₁ -->
    <circle cx="175" cy="60" r="25" fill="white" stroke="#2E7D32" stroke-width="3"/>
    <text x="175" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2E7D32">X₁</text>
    
    <!-- Left branch (X₁ = True) -->
    <line x1="150" y1="80" x2="100" y2="120" stroke="#333" stroke-width="2"/>
    <text x="115" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">T</text>
    
    <rect x="40" y="130" width="120" height="40" fill="white" rx="5" stroke="#2E7D32" stroke-width="2"/>
    <text x="100" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Y = True: 4</text>
    <text x="100" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Y = False: 0</text>
    
    <!-- Right branch (X₁ = False) -->
    <line x1="200" y1="80" x2="250" y2="120" stroke="#333" stroke-width="2"/>
    <text x="235" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">F</text>
    
    <rect x="190" y="130" width="120" height="40" fill="white" rx="5" stroke="#2E7D32" stroke-width="2"/>
    <text x="250" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Y = True: 1</text>
    <text x="250" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Y = False: 3</text>
  </g>
  
  <!-- X₁ Calculation -->
  <g transform="translate(460, 220)">
    <rect x="0" y="0" width="180" height="140" rx="8" fill="#E8F5E8" stroke="#4CAF50" stroke-width="2"/>
    <text x="90" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2E7D32">
      X₁ Calculations
    </text>
    
    <text x="90" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">
      Left (X₁=T): H = 0
    </text>
    <text x="90" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">
      (Pure: all True)
    </text>
    
    <text x="90" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">
      Right (X₁=F): H = 0.811
    </text>
    <text x="90" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">
      (1T, 3F mixed)
    </text>
    
    <text x="90" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">
      Weighted: 4/8×0 + 4/8×0.811
    </text>
    <text x="90" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2E7D32">
      IG = 0.954 - 0.405 = 0.549
    </text>
  </g>
  
  <!-- Split by X₂ -->
  <g transform="translate(100, 420)">
    <rect x="0" y="0" width="350" height="180" rx="12" fill="url(#x2Grad)" stroke="#333" stroke-width="2" filter="url(#shadow)"/>
    <text x="175" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">
      Split by Feature X₂
    </text>
    
    <!-- Tree structure for X₂ -->
    <circle cx="175" cy="60" r="25" fill="white" stroke="#E65100" stroke-width="3"/>
    <text x="175" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#E65100">X₂</text>
    
    <!-- Left branch (X₂ = True) -->
    <line x1="150" y1="80" x2="100" y2="120" stroke="#333" stroke-width="2"/>
    <text x="115" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">T</text>
    
    <rect x="40" y="130" width="120" height="40" fill="white" rx="5" stroke="#E65100" stroke-width="2"/>
    <text x="100" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Y = True: 3</text>
    <text x="100" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Y = False: 1</text>
    
    <!-- Right branch (X₂ = False) -->
    <line x1="200" y1="80" x2="250" y2="120" stroke="#333" stroke-width="2"/>
    <text x="235" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">F</text>
    
    <rect x="190" y="130" width="120" height="40" fill="white" rx="5" stroke="#E65100" stroke-width="2"/>
    <text x="250" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Y = True: 2</text>
    <text x="250" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Y = False: 2</text>
  </g>
  
  <!-- X₂ Calculation -->
  <g transform="translate(460, 440)">
    <rect x="0" y="0" width="180" height="140" rx="8" fill="#FFF3E0" stroke="#FF9800" stroke-width="2"/>
    <text x="90" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#E65100">
      X₂ Calculations
    </text>
    
    <text x="90" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">
      Left (X₂=T): H = 0.811
    </text>
    <text x="90" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">
      (3T, 1F mixed)
    </text>
    
    <text x="90" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">
      Right (X₂=F): H = 1.0
    </text>
    <text x="90" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">
      (2T, 2F balanced)
    </text>
    
    <text x="90" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">
      Weighted: 4/8×0.811 + 4/8×1.0
    </text>
    <text x="90" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#E65100">
      IG = 0.954 - 0.905 = 0.049
    </text>
  </g>
  
  <!-- Comparison Result -->
  <g transform="translate(680, 300)">
    <rect x="0" y="0" width="280" height="200" rx="15" fill="#E8F5E8" stroke="#4CAF50" stroke-width="3" filter="url(#shadow)"/>
    <text x="140" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2E7D32">
      Comparison Result
    </text>
    
    <!-- Winner announcement -->
    <rect x="20" y="50" width="240" height="40" fill="#4CAF50" rx="8"/>
    <text x="140" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
      🏆 WINNER: Feature X₁
    </text>
    
    <!-- Detailed comparison -->
    <text x="140" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">
      Information Gain Comparison:
    </text>
    
    <text x="140" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">
      X₁: IG = 0.549 (Excellent)
    </text>
    <text x="140" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">
      X₂: IG = 0.049 (Poor)
    </text>
    
    <text x="140" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">
      X₁ provides 11× more information
    </text>
    <text x="140" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">
      about the target class!
    </text>
  </g>
  
  <!-- Data Table Reference -->
  <g transform="translate(50, 60)">
    <rect x="0" y="0" width="300" height="120" rx="8" fill="#F5F5F5" stroke="#666" stroke-width="1"/>
    <text x="150" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">
      Sample Data (n=8)
    </text>
    
    <!-- Table headers -->
    <rect x="20" y="30" width="260" height="20" fill="#E0E0E0"/>
    <text x="50" y="43" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold">X₁</text>
    <text x="100" y="43" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold">X₂</text>
    <text x="150" y="43" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold">Y</text>
    <text x="220" y="43" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold">Row</text>
    
    <!-- Data rows -->
    <line x1="75" y1="30" x2="75" y2="110" stroke="#333" stroke-width="1"/>
    <line x1="125" y1="30" x2="125" y2="110" stroke="#333" stroke-width="1"/>
    <line x1="175" y1="30" x2="175" y2="110" stroke="#333" stroke-width="1"/>
    
    <!-- Sample data points -->
    <text x="50" y="63" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">T</text>
    <text x="100" y="63" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">T</text>
    <circle cx="150" cy="58" r="4" fill="#4CAF50"/>
    <text x="220" y="63" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">1-4</text>
    
    <text x="50" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">F</text>
    <text x="100" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">T</text>
    <circle cx="150" cy="73" r="4" fill="#4CAF50"/>
    <text x="220" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">5</text>
    
    <text x="50" y="93" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">F</text>
    <text x="100" y="93" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">F</text>
    <circle cx="150" cy="88" r="4" fill="#F44336"/>
    <text x="220" y="93" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">6-8</text>
    
    <text x="150" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">
      5 Positive, 3 Negative
    </text>
  </g>
</svg>