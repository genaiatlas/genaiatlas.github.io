<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rootGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2196F3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#42A5F5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF9800;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFB74D;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#66BB6A;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#00000040"/>
    </filter>
  </defs>
  
  <!-- Title -->
  <text x="600" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#333">
    Restaurant Waiting Decision Tree
  </text>
  <text x="600" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#666">
    Built using Information Gain for optimal feature selection
  </text>
  
  <!-- Root Node: Estimated Time -->
  <g transform="translate(550, 80)">
    <circle cx="50" cy="40" r="35" fill="url(#rootGrad)" stroke="#333" stroke-width="3" filter="url(#shadow)"/>
    <text x="50" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
      Est. Time
    </text>
    <text x="50" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
      IG = 0.70
    </text>
  </g>
  
  <!-- Branch Lines from Root -->
  <line x1="550" y1="140" x2="200" y2="200" stroke="#333" stroke-width="2"/>
  <line x1="575" y1="140" x2="450" y2="200" stroke="#333" stroke-width="2"/>
  <line x1="625" y1="140" x2="750" y2="200" stroke="#333" stroke-width="2"/>
  <line x1="650" y1="140" x2="1000" y2="200" stroke="#333" stroke-width="2"/>
  
  <!-- Branch Labels -->
  <text x="375" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">0-10</text>
  <text x="512" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">10-30</text>
  <text x="688" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">30-60</text>
  <text x="825" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">>60</text>
  
  <!-- Level 2: 0-10 minutes - Pure Leaf -->
  <g transform="translate(150, 200)">
    <rect x="0" y="0" width="100" height="60" rx="10" fill="url(#leafGrad)" stroke="#333" stroke-width="2" filter="url(#shadow)"/>
    <text x="50" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
      WAIT
    </text>
    <text x="50" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
      4 Wait, 0 Leave
    </text>
    <text x="50" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">
      H = 0.0 (Pure)
    </text>
  </g>
  
  <!-- Level 2: 10-30 minutes - Split on Bar -->
  <g transform="translate(425, 200)">
    <circle cx="25" cy="30" r="25" fill="url(#nodeGrad)" stroke="#333" stroke-width="2" filter="url(#shadow)"/>
    <text x="25" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">
      Bar
    </text>
    <text x="25" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">
      1W,2L
    </text>
  </g>
  
  <!-- Bar branches -->
  <line x1="415" y1="260" x2="380" y2="300" stroke="#333" stroke-width="2"/>
  <line x1="435" y1="260" x2="470" y2="300" stroke="#333" stroke-width="2"/>
  
  <text x="392" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">Yes</text>
  <text x="458" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">No</text>
  
  <!-- Bar = Yes -->
  <g transform="translate(330, 300)">
    <rect x="0" y="0" width="80" height="50" rx="8" fill="#FFCDD2" stroke="#333" stroke-width="1"/>
    <text x="40" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#333">
      LEAVE
    </text>
    <text x="40" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">
      0W, 2L
    </text>
    <text x="40" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#333">
      H = 0.0
    </text>
  </g>
  
  <!-- Bar = No -->
  <g transform="translate(440, 300)">
    <rect x="0" y="0" width="80" height="50" rx="8" fill="url(#leafGrad)" stroke="#333" stroke-width="1"/>
    <text x="40" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">
      WAIT
    </text>
    <text x="40" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">
      1W, 0L
    </text>
    <text x="40" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="white">
      H = 0.0
    </text>
  </g>
  
  <!-- Level 2: 30-60 minutes - Split on Friday -->
  <g transform="translate(725, 200)">
    <circle cx="25" cy="30" r="25" fill="url(#nodeGrad)" stroke="#333" stroke-width="2" filter="url(#shadow)"/>
    <text x="25" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">
      Friday
    </text>
    <text x="25" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">
      1W,1L
    </text>
  </g>
  
  <!-- Friday branches -->
  <line x1="715" y1="260" x2="680" y2="300" stroke="#333" stroke-width="2"/>
  <line x1="735" y1="260" x2="770" y2="300" stroke="#333" stroke-width="2"/>
  
  <text x="692" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">Yes</text>
  <text x="758" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">No</text>
  
  <!-- Friday = Yes -->
  <g transform="translate(630, 300)">
    <rect x="0" y="0" width="80" height="50" rx="8" fill="url(#leafGrad)" stroke="#333" stroke-width="1"/>
    <text x="40" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">
      WAIT
    </text>
    <text x="40" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">
      1W, 0L
    </text>
    <text x="40" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="white">
      H = 0.0
    </text>
  </g>
  
  <!-- Friday = No -->
  <g transform="translate(740, 300)">
    <rect x="0" y="0" width="80" height="50" rx="8" fill="#FFCDD2" stroke="#333" stroke-width="1"/>
    <text x="40" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#333">
      LEAVE
    </text>
    <text x="40" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">
      0W, 1L
    </text>
    <text x="40" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#333">
      H = 0.0
    </text>
  </g>
  
  <!-- Level 2: >60 minutes - Pure Leaf -->
  <g transform="translate(950, 200)">
    <rect x="0" y="0" width="100" height="60" rx="10" fill="#FFCDD2" stroke="#333" stroke-width="2" filter="url(#shadow)"/>
    <text x="50" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">
      LEAVE
    </text>
    <text x="50" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">
      0 Wait, 3 Leave
    </text>
    <text x="50" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">
      H = 0.0 (Pure)
    </text>
  </g>
  
  <!-- Feature Information Gain Table -->
  <g transform="translate(50, 420)">
    <rect x="0" y="0" width="500" height="220" rx="10" fill="#F5F5F5" stroke="#333" stroke-width="2"/>
    <text x="250" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">
      Feature Selection Analysis
    </text>
    
    <!-- Table Header -->
    <rect x="20" y="40" width="460" height="25" fill="#E0E0E0" stroke="#333" stroke-width="1"/>
    <text x="80" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Feature</text>
    <text x="180" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Info Gain</text>
    <text x="280" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Entropy Reduction</text>
    <text x="400" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Quality</text>
    
    <!-- Table Rows -->
    <rect x="20" y="65" width="460" height="25" fill="white" stroke="#333" stroke-width="1"/>
    <text x="80" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Alternative</text>
    <text x="180" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">0.000</text>
    <text x="280" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">None</text>
    <text x="400" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#F44336">Poor</text>
    
    <rect x="20" y="90" width="460" height="25" fill="#FFF9C4" stroke="#333" stroke-width="1"/>
    <text x="80" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Friday</text>
    <text x="180" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">0.021</text>
    <text x="280" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Minimal</text>
    <text x="400" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#FF9800">Weak</text>
    
    <rect x="20" y="115" width="460" height="25" fill="#C8E6C9" stroke="#333" stroke-width="1"/>
    <text x="80" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Est. Time</text>
    <text x="180" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold">0.700</text>
    <text x="280" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Significant</text>
    <text x="400" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#4CAF50">Excellent ⭐</text>
    
    <rect x="20" y="140" width="460" height="25" fill="white" stroke="#333" stroke-width="1"/>
    <text x="80" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Patterns</text>
    <text x="180" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">0.210</text>
    <text x="280" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Moderate</text>
    <text x="400" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2196F3">Good</text>
    
    <rect x="20" y="165" width="460" height="25" fill="white" stroke="#333" stroke-width="1"/>
    <text x="80" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Bar</text>
    <text x="180" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">0.300</text>
    <text x="280" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Moderate</text>
    <text x="400" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2196F3">Good</text>
    
    <!-- Key Insights -->
    <text x="250" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">
      Key Insight: Estimated Time provides maximum information gain
    </text>
    <text x="250" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">
      Creating the most homogeneous subsets and efficient tree structure
    </text>
  </g>
  
  <!-- Tree Statistics -->
  <g transform="translate(600, 420)">
    <rect x="0" y="0" width="350" height="160" rx="10" fill="#E3F2FD" stroke="#2196F3" stroke-width="2"/>
    <text x="175" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1976D2">
      Decision Tree Statistics
    </text>
    
    <text x="20" y="50" font-family="Arial, sans-serif" font-size="12" fill="#333">
      📊 <tspan font-weight="bold">Total Training Samples:</tspan> 12
    </text>
    <text x="20" y="70" font-family="Arial, sans-serif" font-size="12" fill="#333">
      🌳 <tspan font-weight="bold">Tree Depth:</tspan> 3 levels
    </text>
    <text x="20" y="90" font-family="Arial, sans-serif" font-size="12" fill="#333">
      🍃 <tspan font-weight="bold">Leaf Nodes:</tspan> 6 (all pure)
    </text>
    <text x="20" y="110" font-family="Arial, sans-serif" font-size="12" fill="#333">
      ⚡ <tspan font-weight="bold">Final Entropy:</tspan> 0.0 (perfect classification)
    </text>
    <text x="20" y="130" font-family="Arial, sans-serif" font-size="12" fill="#333">
      🎯 <tspan font-weight="bold">Training Accuracy:</tspan> 100%
    </text>
    <text x="20" y="150" font-family="Arial, sans-serif" font-size="12" fill="#333">
      🔄 <tspan font-weight="bold">Construction Method:</tspan> Greedy Information Gain
    </text>
  </g>
  
  <!-- Legend -->
  <g transform="translate(600, 600)">
    <rect x="0" y="0" width="350" height="120" rx="8" fill="#FFFDE7" stroke="#FFC107" stroke-width="2"/>
    <text x="175" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#F57C00">
      Legend
    </text>
    
    <circle cx="30" cy="40" r="12" fill="url(#rootGrad)"/>
    <text x="55" y="45" font-family="Arial, sans-serif" font-size="11" fill="#333">Root Node (Best feature)</text>
    
    <circle cx="30" cy="60" r="12" fill="url(#nodeGrad)"/>
    <text x="55" y="65" font-family="Arial, sans-serif" font-size="11" fill="#333">Internal Node (Secondary features)</text>
    
    <rect x="20" y="75" width="20" height="15" fill="url(#leafGrad)" rx="3"/>
    <text x="55" y="85" font-family="Arial, sans-serif" font-size="11" fill="#333">Leaf Node - WAIT decision</text>
    
    <rect x="20" y="95" width="20" height="15" fill="#FFCDD2" rx="3"/>
    <text x="55" y="105" font-family="Arial, sans-serif" font-size="11" fill="#333">Leaf Node - LEAVE decision</text>
  </g>
  
  <!-- Process Flow -->
  <g transform="translate(50, 600)">
    <rect x="0" y="0" width="500" height="120" rx="8" fill="#F3E5F5" stroke="#9C27B0" stroke-width="2"/>
    <text x="250" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#7B1FA2">
      Construction Process
    </text>
    
    <text x="20" y="40" font-family="Arial, sans-serif" font-size="11" fill="#333">
      <tspan font-weight="bold">1.</tspan> Start with complete dataset (H = 1.0, high uncertainty)
    </text>
    <text x="20" y="55" font-family="Arial, sans-serif" font-size="11" fill="#333">
      <tspan font-weight="bold">2.</tspan> Evaluate all features using Information Gain metric
    </text>
    <text x="20" y="70" font-family="Arial, sans-serif" font-size="11" fill="#333">
      <tspan font-weight="bold">3.</tspan> Select "Estimated Time" (IG = 0.70) as root split
    </text>
    <text x="20" y="85" font-family="Arial, sans-serif" font-size="11" fill="#333">
      <tspan font-weight="bold">4.</tspan> Recursively apply process to non-pure subsets
    </text>
    <text x="20" y="100" font-family="Arial, sans-serif" font-size="11" fill="#333">
      <tspan font-weight="bold">5.</tspan> Result: Perfect classification tree with H = 0.0
    </text>
  </g>
</svg>