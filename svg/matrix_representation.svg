<svg viewBox="0 0 1100 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1100" height="700" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="550" y="40" font-size="28" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    User-Movie Rating Matrix: Sparsity Challenge
  </text>
  
  <!-- Matrix Structure -->
  <g>
    <!-- Border -->
    <rect x="150" y="100" width="800" height="450" rx="5" fill="white" stroke="#333" stroke-width="2"/>
    
    <!-- Column headers (Movies) -->
    <text x="270" y="90" font-size="13" font-weight="bold" text-anchor="middle" fill="#c2185b">Goodfellas</text>
    <text x="390" y="90" font-size="13" font-weight="bold" text-anchor="middle" fill="#c2185b">Titanic</text>
    <text x="510" y="90" font-size="13" font-weight="bold" text-anchor="middle" fill="#c2185b">Dirty Dancing</text>
    <text x="630" y="90" font-size="13" font-weight="bold" text-anchor="middle" fill="#c2185b">Rio Grande</text>
    <text x="750" y="90" font-size="13" font-weight="bold" text-anchor="middle" fill="#c2185b">...</text>
    <text x="870" y="90" font-size="13" font-weight="bold" text-anchor="middle" fill="#c2185b">17,000 Movies</text>
    
    <!-- Row headers (Users) -->
    <text x="130" y="170" font-size="14" font-weight="bold" text-anchor="end" fill="#1976d2">Bob</text>
    <text x="130" y="240" font-size="14" font-weight="bold" text-anchor="end" fill="#1976d2">Emily</text>
    <text x="130" y="310" font-size="14" font-weight="bold" text-anchor="end" fill="#1976d2">Frank</text>
    <text x="130" y="380" font-size="14" font-weight="bold" text-anchor="end" fill="#1976d2">Ted</text>
    <text x="130" y="450" font-size="14" font-weight="bold" text-anchor="end" fill="#1976d2">Soledad</text>
    <text x="130" y="520" font-size="14" font-weight="bold" text-anchor="end" fill="#1976d2">⋮</text>
    <text x="90" y="560" font-size="12" text-anchor="end" fill="#1976d2">500K Users</text>
    
    <!-- Grid lines -->
    <line x1="150" y1="190" x2="950" y2="190" stroke="#ddd" stroke-width="1"/>
    <line x1="150" y1="260" x2="950" y2="260" stroke="#ddd" stroke-width="1"/>
    <line x1="150" y1="330" x2="950" y2="330" stroke="#ddd" stroke-width="1"/>
    <line x1="150" y1="400" x2="950" y2="400" stroke="#ddd" stroke-width="1"/>
    <line x1="150" y1="470" x2="950" y2="470" stroke="#ddd" stroke-width="1"/>
    
    <line x1="230" y1="100" x2="230" y2="550" stroke="#ddd" stroke-width="1"/>
    <line x1="350" y1="100" x2="350" y2="550" stroke="#ddd" stroke-width="1"/>
    <line x1="470" y1="100" x2="470" y2="550" stroke="#ddd" stroke-width="1"/>
    <line x1="590" y1="100" x2="590" y2="550" stroke="#ddd" stroke-width="1"/>
    <line x1="710" y1="100" x2="710" y2="550" stroke="#ddd" stroke-width="1"/>
    <line x1="830" y1="100" x2="830" y2="550" stroke="#ddd" stroke-width="1"/>
    
    <!-- Known ratings (filled circles) -->
    <circle cx="270" cy="165" r="18" fill="#4caf50" stroke="#2e7d32" stroke-width="2"/>
    <text x="270" y="172" font-size="16" font-weight="bold" text-anchor="middle" fill="white">4</text>
    
    <circle cx="390" cy="235" r="18" fill="#4caf50" stroke="#2e7d32" stroke-width="2"/>
    <text x="390" y="242" font-size="16" font-weight="bold" text-anchor="middle" fill="white">3</text>
    
    <circle cx="510" cy="305" r="18" fill="#4caf50" stroke="#2e7d32" stroke-width="2"/>
    <text x="510" y="312" font-size="16" font-weight="bold" text-anchor="middle" fill="white">5</text>
    
    <!-- Unknown ratings (question marks) -->
    <text x="390" y="172" font-size="20" font-weight="bold" text-anchor="middle" fill="#bbb">?</text>
    <text x="510" y="172" font-size="20" font-weight="bold" text-anchor="middle" fill="#bbb">?</text>
    <text x="630" y="172" font-size="20" font-weight="bold" text-anchor="middle" fill="#bbb">?</text>
    <text x="750" y="172" font-size="20" font-weight="bold" text-anchor="middle" fill="#bbb">?</text>
    <text x="870" y="172" font-size="20" font-weight="bold" text-anchor="middle" fill="#bbb">?</text>
    
    <text x="270" y="242" font-size="20" font-weight="bold" text-anchor="middle" fill="#bbb">?</text>
    <text x="510" y="242" font-size="20" font-weight="bold" text-anchor="middle" fill="#bbb">?</text>
    <text x="630" y="242" font-size="20" font-weight="bold" text-anchor="middle" fill="#bbb">?</text>
    <text x="750" y="242" font-size="20" font-weight="bold" text-anchor="middle" fill="#bbb">?</text>
    <text x="870" y="242" font-size="20" font-weight="bold" text-anchor="middle" fill="#bbb">?</text>
    
    <text x="270" y="312" font-size="20" font-weight="bold" text-anchor="middle" fill="#bbb">?</text>
    <text x="390" y="312" font-size="20" font-weight="bold" text-anchor="middle" fill="#bbb">?</text>
    <text x="630" y="312" font-size="20" font-weight="bold" text-anchor="middle" fill="#bbb">?</text>
    <text x="750" y="312" font-size="20" font-weight="bold" text-anchor="middle" fill="#bbb">?</text>
    <text x="870" y="312" font-size="20" font-weight="bold" text-anchor="middle" fill="#bbb">?</text>
    
    <text x="270" y="382" font-size="20" font-weight="bold" text-anchor="middle" fill="#bbb">?</text>
    <text x="390" y="382" font-size="20" font-weight="bold" text-anchor="middle" fill="#bbb">?</text>
    <text x="510" y="382" font-size="20" font-weight="bold" text-anchor="middle" fill="#bbb">?</text>
    <text x="630" y="382" font-size="20" font-weight="bold" text-anchor="middle" fill="#bbb">?</text>
    <text x="750" y="382" font-size="20" font-weight="bold" text-anchor="middle" fill="#bbb">?</text>
    <text x="870" y="382" font-size="20" font-weight="bold" text-anchor="middle" fill="#bbb">?</text>
    
    <text x="270" y="452" font-size="20" font-weight="bold" text-anchor="middle" fill="#bbb">?</text>
    <text x="390" y="452" font-size="20" font-weight="bold" text-anchor="middle" fill="#bbb">?</text>
    <text x="510" y="452" font-size="20" font-weight="bold" text-anchor="middle" fill="#bbb">?</text>
    <text x="630" y="452" font-size="20" font-weight="bold" text-anchor="middle" fill="#bbb">?</text>
    <text x="750" y="452" font-size="20" font-weight="bold" text-anchor="middle" fill="#bbb">?</text>
    <text x="870" y="452" font-size="20" font-weight="bold" text-anchor="middle" fill="#bbb">?</text>
    
    <!-- Scattered dots to represent more sparse data -->
    <circle cx="870" cy="165" r="3" fill="#999"/>
    <circle cx="750" cy="235" r="3" fill="#999"/>
    <circle cx="630" cy="305" r="3" fill="#999"/>
    <circle cx="270" cy="375" r="3" fill="#999"/>
    <circle cx="390" cy="445" r="3" fill="#999"/>
    <circle cx="510" cy="515" r="3" fill="#999"/>
  </g>
  
  <!-- Statistics Box -->
  <g>
    <rect x="150" y="590" width="800" height="90" rx="5" fill="#fff3e0" stroke="#f57c00" stroke-width="2"/>
    
    <text x="550" y="615" font-size="18" font-weight="bold" text-anchor="middle" fill="#e65100">
      Sparsity Statistics
    </text>
    
    <text x="280" y="645" font-size="15" text-anchor="middle" fill="#424242">
      <tspan font-weight="bold" fill="#4caf50">Known:</tspan> 100M ratings (1.2%)
    </text>
    
    <text x="550" y="645" font-size="15" text-anchor="middle" fill="#424242">
      <tspan font-weight="bold" fill="#999">Unknown:</tspan> 8.4B ratings (98.8%)
    </text>
    
    <text x="820" y="645" font-size="15" text-anchor="middle" fill="#424242">
      <tspan font-weight="bold" fill="#1976d2">Total:</tspan> 8.5B entries
    </text>
    
    <text x="550" y="670" font-size="14" text-anchor="middle" fill="#666" font-style="italic">
      Challenge: Predict the vast unknown space from sparse observations
    </text>
  </g>
  
  <!-- Legend -->
  <g>
    <circle cx="1020" cy="120" r="12" fill="#4caf50" stroke="#2e7d32" stroke-width="2"/>
    <text x="1040" y="127" font-size="13" fill="#424242">Known Rating</text>
    
    <text x="1015" y="157" font-size="16" font-weight="bold" fill="#bbb">?</text>
    <text x="1040" y="157" font-size="13" fill="#424242">Unknown Rating</text>
    
    <circle cx="1020" cy="180" r="3" fill="#999"/>
    <text x="1040" y="187" font-size="13" fill="#424242">Sparse Data Point</text>
  </g>
</svg>