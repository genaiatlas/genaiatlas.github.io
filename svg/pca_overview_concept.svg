<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E5C8A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="orangeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5A623;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D68910;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7ED321;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5BA016;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#F8F9FA"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2C3E50">
    Principal Component Analysis (PCA) Overview
  </text>
  
  <!-- High Dimensional Data -->
  <rect x="50" y="80" width="200" height="150" fill="url(#blueGradient)" rx="10"/>
  <text x="150" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
    High-Dimensional Data
  </text>
  <text x="150" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
    Many Features
  </text>
  <text x="150" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
    Correlated Variables
  </text>
  <text x="150" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
    Redundant Information
  </text>
  <text x="150" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
    Complex Patterns
  </text>
  
  <!-- Arrow 1 -->
  <path d="M 270 155 L 330 155" stroke="#2C3E50" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="300" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">PCA</text>
  
  <!-- PCA Process -->
  <rect x="350" y="80" width="200" height="150" fill="url(#orangeGradient)" rx="10"/>
  <text x="450" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
    PCA Transformation
  </text>
  <text x="450" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
    Find Correlations
  </text>
  <text x="450" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
    Extract Patterns
  </text>
  <text x="450" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
    Compute Eigenvectors
  </text>
  <text x="450" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
    Rank by Importance
  </text>
  
  <!-- Arrow 2 -->
  <path d="M 570 155 L 630 155" stroke="#2C3E50" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Low Dimensional Representation -->
  <rect x="650" y="80" width="120" height="150" fill="url(#greenGradient)" rx="10"/>
  <text x="710" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    Principal
  </text>
  <text x="710" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    Components
  </text>
  <text x="710" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Fewer Dimensions
  </text>
  <text x="710" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Key Patterns
  </text>
  <text x="710" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Maximum Variance
  </text>
  
  <!-- Benefits Box -->
  <rect x="100" y="280" width="600" height="120" fill="#ECF0F1" stroke="#BDC3C7" stroke-width="2" rx="10"/>
  <text x="400" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2C3E50">
    Key Benefits of PCA
  </text>
  
  <!-- Benefit 1 -->
  <circle cx="130" cy="335" r="6" fill="#E74C3C"/>
  <text x="145" y="340" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">
    Dimensionality Reduction: Simplify complex datasets
  </text>
  
  <!-- Benefit 2 -->
  <circle cx="130" cy="355" r="6" fill="#3498DB"/>
  <text x="145" y="360" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">
    Pattern Discovery: Uncover hidden relationships
  </text>
  
  <!-- Benefit 3 -->
  <circle cx="130" cy="375" r="6" fill="#2ECC71"/>
  <text x="145" y="380" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">
    Data Visualization: Enable 2D/3D plotting
  </text>
  
  <!-- Benefit 4 -->
  <circle cx="430" cy="355" r="6" fill="#F39C12"/>
  <text x="445" y="360" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">
    Noise Reduction: Filter out irrelevant information
  </text>
  
  <!-- Mathematical Foundation -->
  <rect x="150" y="450" width="500" height="80" fill="#34495E" rx="10"/>
  <text x="400" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
    Mathematical Foundation
  </text>
  <text x="400" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">
    X = Σ(αᵢ × PCᵢ) + μ
  </text>
  <text x="400" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#BDC3C7">
    Data = Linear combination of Principal Components + Mean
  </text>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
     refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2C3E50"/>
    </marker>
  </defs>
</svg>