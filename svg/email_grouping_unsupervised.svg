<svg viewBox="0 0 900 650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="emailBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f5f5;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#eeeeee;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="group1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f5e8;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#c8e6c9;stop-opacity:0.8"/>
    </linearGradient>
    <linearGradient id="group2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff3e0;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#ffcc02;stop-opacity:0.3"/>
    </linearGradient>
    <linearGradient id="group3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e3f2fd;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#bbdefb;stop-opacity:0.8"/>
    </linearGradient>
    <linearGradient id="group4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fce4ec;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#f8bbd9;stop-opacity:0.8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="650" fill="#fafafa"/>
  
  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#2c3e50">
    Unsupervised Learning: Email Topic Grouping
  </text>
  
  <!-- Input Data Section -->
  <rect x="50" y="70" width="380" height="250" rx="10" fill="#ffffff" stroke="#34495e" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">
    Unlabeled Email Inbox
  </text>
  
  <text x="70" y="120" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#34495e">
    Thousands of emails - No labels or categories:
  </text>
  
  <!-- Random emails in inbox -->
  <rect x="70" y="135" width="340" height="25" rx="3" fill="url(#emailBg)" stroke="#bdbdbd" stroke-width="1"/>
  <text x="80" y="150" font-family="Arial, sans-serif" font-size="10" fill="#424242">
    "Homework assignment due tomorrow - Math problems"
  </text>
  
  <rect x="70" y="165" width="340" height="25" rx="3" fill="url(#emailBg)" stroke="#bdbdbd" stroke-width="1"/>
  <text x="80" y="180" font-family="Arial, sans-serif" font-size="10" fill="#424242">
    "Mountain hiking this weekend - trail recommendations"
  </text>
  
  <rect x="70" y="195" width="340" height="25" rx="3" fill="url(#emailBg)" stroke="#bdbdbd" stroke-width="1"/>
  <text x="80" y="210" font-family="Arial, sans-serif" font-size="10" fill="#424242">
    "Project meeting notes - Q3 deliverables"
  </text>
  
  <rect x="70" y="225" width="340" height="25" rx="3" fill="url(#emailBg)" stroke="#bdbdbd" stroke-width="1"/>
  <text x="80" y="240" font-family="Arial, sans-serif" font-size="10" fill="#424242">
    "Class schedule change - Biology lecture moved"
  </text>
  
  <rect x="70" y="255" width="340" height="25" rx="3" fill="url(#emailBg)" stroke="#bdbdbd" stroke-width="1"/>
  <text x="80" y="270" font-family="Arial, sans-serif" font-size="10" fill="#424242">
    "Adventure photography tips for outdoor enthusiasts"
  </text>
  
  <rect x="70" y="285" width="340" height="25" rx="3" fill="url(#emailBg)" stroke="#bdbdbd" stroke-width="1"/>
  <text x="80" y="300" font-family="Arial, sans-serif" font-size="10" fill="#424242">
    "Work report submission deadline reminder"
  </text>
  
  <!-- Dots indicating more emails -->
  <text x="240" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d" font-style="italic">
    ... and thousands more emails ...</text>
  
  <!-- Algorithm Processing Arrow -->
  <path d="M 450 195 L 520 195" stroke="#9c27b0" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="485" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#9c27b0">
    Clustering
  </text>
  <text x="485" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#9c27b0">
    Algorithm
  </text>
  
  <!-- Algorithm Box -->
  <rect x="540" y="150" width="120" height="90" rx="8" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#7b1fa2">
    Unsupervised
  </text>
  <text x="600" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#7b1fa2">
    ML Algorithm
  </text>
  <text x="600" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7b1fa2">
    (e.g., K-Means,
  </text>
  <text x="600" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7b1fa2">
    Hierarchical,
  </text>
  <text x="600" y="234" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7b1fa2">
    Topic Modeling)
  </text>
  
  <!-- Discovered Groups Section -->
  <rect x="50" y="350" width="800" height="250" rx="10" fill="#ffffff" stroke="#34495e" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">
    Discovered Email Groups (No Predefined Labels!)
  </text>
  
  <!-- Group 1: Homework & Classes -->
  <rect x="70" y="390" width="180" height="120" rx="8" fill="url(#group1Grad)" stroke="#4caf50" stroke-width="2"/>
  <text x="160" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2e7d32">
    📚 Homework &amp; Classes
  </text>
  <text x="80" y="430" font-family="Arial, sans-serif" font-size="9" fill="#1b5e20">
    • Math assignment reminder
  </text>
  <text x="80" y="445" font-family="Arial, sans-serif" font-size="9" fill="#1b5e20">
    • Biology lecture update
  </text>
  <text x="80" y="460" font-family="Arial, sans-serif" font-size="9" fill="#1b5e20">
    • Course schedule changes
  </text>
  <text x="80" y="475" font-family="Arial, sans-serif" font-size="9" fill="#1b5e20">
    • Study group formation
  </text>
  <text x="80" y="490" font-family="Arial, sans-serif" font-size="9" fill="#1b5e20">
    • Exam preparation tips
  </text>
  
  <!-- Group 2: Work Projects -->
  <rect x="270" y="390" width="180" height="120" rx="8" fill="url(#group2Grad)" stroke="#ff9800" stroke-width="2"/>
  <text x="360" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e65100">
    💼 Work Projects
  </text>
  <text x="280" y="430" font-family="Arial, sans-serif" font-size="9" fill="#bf360c">
    • Q3 deliverables meeting
  </text>
  <text x="280" y="445" font-family="Arial, sans-serif" font-size="9" fill="#bf360c">
    • Report submission deadline
  </text>
  <text x="280" y="460" font-family="Arial, sans-serif" font-size="9" fill="#bf360c">
    • Project status updates
  </text>
  <text x="280" y="475" font-family="Arial, sans-serif" font-size="9" fill="#bf360c">
    • Team collaboration
  </text>
  <text x="280" y="490" font-family="Arial, sans-serif" font-size="9" fill="#bf360c">
    • Budget planning
  </text>
  
  <!-- Group 3: Hiking & Adventures -->
  <rect x="470" y="390" width="180" height="120" rx="8" fill="url(#group3Grad)" stroke="#2196f3" stroke-width="2"/>
  <text x="560" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1565c0">
    🏔️ Hiking &amp; Adventures
  </text>
  <text x="480" y="430" font-family="Arial, sans-serif" font-size="9" fill="#0d47a1">
    • Mountain trail recommendations
  </text>
  <text x="480" y="445" font-family="Arial, sans-serif" font-size="9" fill="#0d47a1">
    • Photography tips
  </text>
  <text x="480" y="460" font-family="Arial, sans-serif" font-size="9" fill="#0d47a1">
    • Weekend hiking plans
  </text>
  <text x="480" y="475" font-family="Arial, sans-serif" font-size="9" fill="#0d47a1">
    • Gear recommendations
  </text>
  <text x="480" y="490" font-family="Arial, sans-serif" font-size="9" fill="#0d47a1">
    • Weather conditions
  </text>
  
  <!-- Group 4: Family & Personal -->
  <rect x="670" y="390" width="160" height="120" rx="8" fill="url(#group4Grad)" stroke="#e91e63" stroke-width="2"/>
  <text x="750" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ad1457">
    👨‍👩‍👧‍👦 Family &amp; Personal
  </text>
  <text x="680" y="430" font-family="Arial, sans-serif" font-size="9" fill="#880e4f">
    • Family dinner plans
  </text>
  <text x="680" y="445" font-family="Arial, sans-serif" font-size="9" fill="#880e4f">
    • Birthday reminders
  </text>
  <text x="680" y="460" font-family="Arial, sans-serif" font-size="9" fill="#880e4f">
    • Personal appointments
  </text>
  <text x="680" y="475" font-family="Arial, sans-serif" font-size="9" fill="#880e4f">
    • Health check-ups
  </text>
  <text x="680" y="490" font-family="Arial, sans-serif" font-size="9" fill="#880e4f">
    • Social gatherings
  </text>
  
  <!-- Algorithm insights -->
  <text x="450" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#34495e">
    Algorithm Discovery Process:
  </text>
  <text x="450" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">
    • Analyzed word patterns and semantic similarities
  </text>
  <text x="450" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">
    • Identified clusters based on content themes and vocabulary
  </text>
  <text x="450" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">
    • No human-provided labels - groups emerged naturally from data
  </text>
  
  <!-- Key Features -->
  <text x="450" y="625" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#34495e">
    Key Characteristics: Pattern discovery • No predefined categories • Exploratory insights • Subjective evaluation
  </text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
     refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9c27b0" />
    </marker>
  </defs>
</svg>