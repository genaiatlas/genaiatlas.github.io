<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="chatgptGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10a37f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#15d399;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="geminiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4285f4;stop-opacity:1" />
      <stop offset="33%" style="stop-color:#34a853;stop-opacity:1" />
      <stop offset="66%" style="stop-color:#fbbc04;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ea4335;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="claudeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d97706;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grokGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1d1d1d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#404040;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="deepseekGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="800" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="600" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#1e293b">
    AI Models Overview Comparison
  </text>
  
  <!-- ChatGPT -->
  <g id="chatgpt">
    <circle cx="180" cy="150" r="60" fill="url(#chatgptGrad)" stroke="#059669" stroke-width="3"/>
    <text x="180" y="155" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">ChatGPT</text>
    <text x="180" y="240" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1e293b">ChatGPT</text>
    <text x="180" y="260" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#64748b">OpenAI</text>
    <text x="180" y="280" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#64748b">Versatile AI Platform</text>
    <text x="180" y="295" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#64748b">Multimodal Capabilities</text>
  </g>
  
  <!-- Gemini -->
  <g id="gemini">
    <polygon points="420,90 480,150 420,210 360,150" fill="url(#geminiGrad)" stroke="#1f2937" stroke-width="3"/>
    <text x="420" y="155" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Gemini</text>
    <text x="420" y="240" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1e293b">Gemini</text>
    <text x="420" y="260" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#64748b">Google</text>
    <text x="420" y="280" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#64748b">Google Ecosystem</text>
    <text x="420" y="295" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#64748b">Collaborative AI</text>
  </g>
  
  <!-- Claude -->
  <g id="claude">
    <g transform="translate(600, 150)">
      <circle r="60" fill="url(#claudeGrad)" stroke="#d97706" stroke-width="3"/>
      <g stroke="white" stroke-width="2" fill="none">
        <line x1="-30" y1="0" x2="30" y2="0"/>
        <line x1="0" y1="-30" x2="0" y2="30"/>
        <line x1="-21" y1="-21" x2="21" y2="21"/>
        <line x1="21" y1="-21" x2="-21" y2="21"/>
      </g>
    </g>
    <text x="600" y="155" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Claude</text>
    <text x="600" y="240" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1e293b">Claude</text>
    <text x="600" y="260" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#64748b">Anthropic</text>
    <text x="600" y="280" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#64748b">Deep Analysis</text>
    <text x="600" y="295" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#64748b">Safety-Focused</text>
  </g>
  
  <!-- Grok -->
  <g id="grok">
    <circle cx="840" cy="150" r="60" fill="url(#grokGrad)" stroke="#374151" stroke-width="3"/>
    <circle cx="840" cy="150" r="30" fill="none" stroke="white" stroke-width="3"/>
    <line x1="810" y1="120" x2="870" y2="180" stroke="white" stroke-width="3"/>
    <text x="840" y="240" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1e293b">Grok</text>
    <text x="840" y="260" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#64748b">X (Twitter)</text>
    <text x="840" y="280" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#64748b">Real-time Social</text>
    <text x="840" y="295" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#64748b"> Conversations</text>
  </g>
  
  <!-- DeepSeek -->
  <g id="deepseek">
    <ellipse cx="1020" cy="150" rx="70" ry="45" fill="url(#deepseekGrad)" stroke="#1e40af" stroke-width="3"/>
    <ellipse cx="1020" cy="140" rx="30" ry="15" fill="none" stroke="white" stroke-width="2"/>
    <circle cx="1005" cy="135" r="3" fill="white"/>
    <path d="M 990 160 Q 1020 170 1050 160" stroke="white" stroke-width="2" fill="none"/>
    <text x="1020" y="240" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1e293b">DeepSeek</text>
    <text x="1020" y="260" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#64748b">DeepSeek AI</text>
    <text x="1020" y="280" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#64748b">Cost-Effective</text>
    <text x="1020" y="295" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#64748b">Technical Excellence</text>
  </g>
  
  <!-- Connection Lines -->
  <g stroke="#e2e8f0" stroke-width="2" stroke-dasharray="5,5" fill="none">
    <line x1="240" y1="150" x2="360" y2="150"/>
    <line x1="480" y1="150" x2="540" y2="150"/>
    <line x1="660" y1="150" x2="780" y2="150"/>
    <line x1="900" y1="150" x2="950" y2="150"/>
  </g>
  
  <!-- Key Features Comparison -->
  <rect x="50" y="350" width="1100" height="400" fill="white" stroke="#e2e8f0" stroke-width="2" rx="10"/>
  <text x="600" y="380" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1e293b">
    Key Capabilities Comparison
  </text>
  
  <!-- Feature Grid -->
  <g font-family="Arial, sans-serif" font-size="12">
    <!-- Headers -->
    <text x="80" y="420" font-weight="bold" fill="#1e293b">Feature</text>
    <text x="250" y="420" font-weight="bold" fill="#059669">ChatGPT</text>
    <text x="350" y="420" font-weight="bold" fill="#4285f4">Gemini</text>
    <text x="450" y="420" font-weight="bold" fill="#d97706">Claude</text>
    <text x="550" y="420" font-weight="bold" fill="#374151">Grok</text>
    <text x="650" y="420" font-weight="bold" fill="#1e40af">DeepSeek</text>
    
    <!-- Row 1: Multimodal -->
    <text x="80" y="450" fill="#64748b">Multimodal</text>
    <text x="250" y="450" fill="#059669">✓ Full</text>
    <text x="350" y="450" fill="#4285f4">✓ Full</text>
    <text x="450" y="450" fill="#dc2626">✗ Text Only</text>
    <text x="550" y="450" fill="#f59e0b">△ Limited</text>
    <text x="650" y="450" fill="#f59e0b">△ Limited</text>
    
    <!-- Row 2: Real-time Data -->
    <text x="80" y="480" fill="#64748b">Real-time Data</text>
    <text x="250" y="480" fill="#f59e0b">△ Plugins</text>
    <text x="350" y="480" fill="#f59e0b">△ Limited</text>
    <text x="450" y="480" fill="#dc2626">✗ No</text>
    <text x="550" y="480" fill="#059669">✓ X Platform</text>
    <text x="650" y="480" fill="#dc2626">✗ No</text>
    
    <!-- Row 3: Code Generation -->
    <text x="80" y="510" fill="#64748b">Code Generation</text>
    <text x="250" y="510" fill="#059669">✓ Strong</text>
    <text x="350" y="510" fill="#059669">✓ Good</text>
    <text x="450" y="510" fill="#059669">✓ Excellent</text>
    <text x="550" y="510" fill="#f59e0b">△ Basic</text>
    <text x="650" y="510" fill="#059669">✓ Excellent</text>
    
    <!-- Row 4: Context Length -->
    <text x="80" y="540" fill="#64748b">Context Length</text>
    <text x="250" y="540" fill="#f59e0b">Medium</text>
    <text x="350" y="540" fill="#f59e0b">Medium</text>
    <text x="450" y="540" fill="#059669">Very Long</text>
    <text x="550" y="540" fill="#dc2626">Short</text>
    <text x="650" y="540" fill="#f59e0b">Medium</text>
    
    <!-- Row 5: Best Use Case -->
    <text x="80" y="570" fill="#64748b">Best Use Case</text>
    <text x="250" y="570" fill="#064e3b" font-size="10">General Productivity</text>
    <text x="350" y="570" fill="#1e3a8a" font-size="10">Google Ecosystem</text>
    <text x="450" y="570" fill="#92400e" font-size="10">Research &amp; Analysis</text>
    <text x="550" y="570" fill="#1f2937" font-size="10">Social Media</text>
    <text x="650" y="570" fill="#1e3a8a" font-size="10">Technical Tasks</text>
    
    <!-- Row 6: Pricing -->
    <text x="80" y="600" fill="#64748b">Pricing</text>
    <text x="250" y="600" fill="#f59e0b">Premium</text>
    <text x="350" y="600" fill="#059669">Freemium</text>
    <text x="450" y="600" fill="#f59e0b">Subscription</text>
    <text x="550" y="600" fill="#f59e0b">X Premium</text>
    <text x="650" y="600" fill="#059669">Low Cost</text>
    
    <!-- Row 7: Integration -->
    <text x="80" y="630" fill="#64748b">Integration</text>
    <text x="250" y="630" fill="#059669" font-size="10">Extensive Plugins</text>
    <text x="350" y="630" fill="#059669" font-size="10">Google Native</text>
    <text x="450" y="630" fill="#f59e0b" font-size="10">API Only</text>
    <text x="550" y="630" fill="#dc2626" font-size="10">X Platform Only</text>
    <text x="650" y="630" fill="#f59e0b" font-size="10">API Available</text>
  </g>
  
  <!-- Legend -->
  <g font-family="Arial, sans-serif" font-size="10" fill="#64748b">
    <text x="800" y="420" font-weight="bold">Legend:</text>
    <text x="800" y="440">✓ = Full Support</text>
    <text x="800" y="455">△ = Partial Support</text>
    <text x="800" y="470">✗ = Not Available</text>
  </g>
</svg>