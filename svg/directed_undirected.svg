<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 28px; font-weight: bold; fill: #2c3e50; }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 20px; font-weight: 600; fill: #34495e; }
      .label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #2c3e50; }
      .small-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #555; }
      .node-undirected { fill: #3498db; stroke: #2c3e50; stroke-width: 2; }
      .node-directed { fill: #e74c3c; stroke: #c0392b; stroke-width: 2; }
      .edge-undirected { stroke: #3498db; stroke-width: 3; fill: none; }
      .edge-directed { stroke: #e74c3c; stroke-width: 3; fill: none; }
      .box { fill: #ecf0f1; stroke: #34495e; stroke-width: 2; rx: 10; }
      .example-box { fill: #fff; stroke: #7f8c8d; stroke-width: 1.5; rx: 8; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#e74c3c"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="600" y="40" class="title" text-anchor="middle">Directed vs Undirected Networks</text>
  
  <!-- Left Side: Undirected Network -->
  <rect x="50" y="80" width="520" height="320" class="box"/>
  <text x="310" y="115" class="subtitle" text-anchor="middle">Undirected Network</text>
  <text x="310" y="140" class="small-label" text-anchor="middle">Symmetric Relationships (No Direction)</text>
  
  <!-- Undirected Network Diagram -->
  <circle cx="200" cy="200" r="25" class="node-undirected"/>
  <text x="200" y="207" class="label" text-anchor="middle" fill="white">A</text>
  
  <circle cx="350" cy="200" r="25" class="node-undirected"/>
  <text x="350" y="207" class="label" text-anchor="middle" fill="white">B</text>
  
  <circle cx="420" cy="280" r="25" class="node-undirected"/>
  <text x="420" y="287" class="label" text-anchor="middle" fill="white">C</text>
  
  <circle cx="280" cy="320" r="25" class="node-undirected"/>
  <text x="280" y="327" class="label" text-anchor="middle" fill="white">D</text>
  
  <circle cx="150" cy="280" r="25" class="node-undirected"/>
  <text x="150" y="287" class="label" text-anchor="middle" fill="white">E</text>
  
  <!-- Undirected Edges -->
  <line x1="225" y1="200" x2="325" y2="200" class="edge-undirected"/>
  <line x1="370" y1="220" x2="400" y2="260" class="edge-undirected"/>
  <line x1="400" y1="295" x2="305" y2="320" class="edge-undirected"/>
  <line x1="255" y1="320" x2="175" y2="295" class="edge-undirected"/>
  <line x1="170" y1="265" x2="185" y2="215" class="edge-undirected"/>
  <line x1="225" y1="220" x2="260" y2="300" class="edge-undirected"/>
  
  <!-- Undirected Examples -->
  <rect x="70" y="350" width="220" height="35" class="example-box"/>
  <text x="180" y="372" class="small-label" text-anchor="middle" font-weight="bold">Examples:</text>
  
  <text x="100" y="400" class="small-label">• Facebook: Friendship (mutual)</text>
  <text x="100" y="418" class="small-label">• Internet: Bidirectional channels</text>
  <text x="100" y="436" class="small-label">• Power Grids: Electricity flow</text>
  <text x="100" y="454" class="small-label">• Roads: Two-way streets</text>
  
  <!-- Right Side: Directed Network -->
  <rect x="630" y="80" width="520" height="320" class="box"/>
  <text x="890" y="115" class="subtitle" text-anchor="middle">Directed Network</text>
  <text x="890" y="140" class="small-label" text-anchor="middle">Asymmetric Relationships (Has Direction)</text>
  
  <!-- Directed Network Diagram -->
  <circle cx="780" cy="200" r="25" class="node-directed"/>
  <text x="780" y="207" class="label" text-anchor="middle" fill="white">A</text>
  
  <circle cx="930" cy="200" r="25" class="node-directed"/>
  <text x="930" y="207" class="label" text-anchor="middle" fill="white">B</text>
  
  <circle cx="1000" cy="280" r="25" class="node-directed"/>
  <text x="1000" y="287" class="label" text-anchor="middle" fill="white">C</text>
  
  <circle cx="860" cy="320" r="25" class="node-directed"/>
  <text x="860" y="327" class="label" text-anchor="middle" fill="white">D</text>
  
  <circle cx="730" cy="280" r="25" class="node-directed"/>
  <text x="730" y="287" class="label" text-anchor="middle" fill="white">E</text>
  
  <!-- Directed Edges with arrows -->
  <path d="M 805 200 L 905 200" class="edge-directed" marker-end="url(#arrowhead)"/>
  <path d="M 950 220 L 980 260" class="edge-directed" marker-end="url(#arrowhead)"/>
  <path d="M 980 295 L 885 320" class="edge-directed" marker-end="url(#arrowhead)"/>
  <path d="M 835 320 L 755 295" class="edge-directed" marker-end="url(#arrowhead)"/>
  <path d="M 750 265 L 765 215" class="edge-directed" marker-end="url(#arrowhead)"/>
  <path d="M 805 220 L 840 300" class="edge-directed" marker-end="url(#arrowhead)"/>
  
  <!-- Directed Examples -->
  <rect x="650" y="350" width="220" height="35" class="example-box"/>
  <text x="760" y="372" class="small-label" text-anchor="middle" font-weight="bold">Examples:</text>
  
  <text x="680" y="400" class="small-label">• Twitter: Following (one-way)</text>
  <text x="680" y="418" class="small-label">• Web: Hyperlinks (A→B ≠ B→A)</text>
  <text x="680" y="436" class="small-label">• Food Webs: Predator→Prey</text>
  <text x="680" y="454" class="small-label">• Citations: Paper→Earlier Paper</text>
  
  <!-- Bottom Comparison Table -->
  <rect x="50" y="500" width="1100" height="260" class="box"/>
  <text x="600" y="535" class="subtitle" text-anchor="middle">Key Differences</text>
  
  <!-- Table Headers -->
  <rect x="100" y="560" width="450" height="40" fill="#3498db" rx="5"/>
  <rect x="650" y="560" width="450" height="40" fill="#e74c3c" rx="5"/>
  
  <text x="325" y="585" class="label" text-anchor="middle" fill="white" font-weight="bold">UNDIRECTED</text>
  <text x="875" y="585" class="label" text-anchor="middle" fill="white" font-weight="bold">DIRECTED</text>
  
  <!-- Row 1 -->
  <rect x="100" y="610" width="450" height="35" class="example-box"/>
  <rect x="650" y="610" width="450" height="35" class="example-box"/>
  <text x="120" y="632" class="small-label">Edge: {A, B} - no direction</text>
  <text x="670" y="632" class="small-label">Edge: (A, B) - from A to B</text>
  
  <!-- Row 2 -->
  <rect x="100" y="650" width="450" height="35" class="example-box"/>
  <rect x="650" y="650" width="450" height="35" class="example-box"/>
  <text x="120" y="672" class="small-label">Symmetric: if A-B, then B-A</text>
  <text x="670" y="672" class="small-label">Asymmetric: A→B does not imply B→A</text>
  
  <!-- Row 3 -->
  <rect x="100" y="690" width="450" height="35" class="example-box"/>
  <rect x="650" y="690" width="450" height="35" class="example-box"/>
  <text x="120" y="712" class="small-label">Degree: Total connections</text>
  <text x="670" y="712" class="small-label">In-degree &amp; Out-degree</text>
  
  <!-- Row 4 -->
  <rect x="100" y="730" width="450" height="35" class="example-box"/>
  <rect x="650" y="730" width="450" height="35" class="example-box"/>
  <text x="120" y="752" class="small-label">Use: Mutual relationships</text>
  <text x="670" y="752" class="small-label">Use: Hierarchies, flows, dependencies</text>
</svg>