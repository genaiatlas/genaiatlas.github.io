<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <linearGradient id="secondaryGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f093fb"/>
      <stop offset="100%" stop-color="#f5576c"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000015"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#fafbfc"/>

  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="32" font-weight="700" fill="#1a202c">
    F1 Score
  </text>
  <text x="400" y="75" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="16" fill="#718096">
    The balanced metric for precision and recall
  </text>

  <!-- Main Formula Card -->
  <g transform="translate(200, 110)">
    <rect x="0" y="0" width="400" height="120" rx="16" fill="white" stroke="#e2e8f0" stroke-width="1" filter="url(#softShadow)"/>
    
    <!-- Formula -->
    <g transform="translate(200, 60)">
      <text x="0" y="-15" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#2d3748">
        F1 =
      </text>
      
      <rect x="-120" y="-10" width="240" height="50" fill="url(#primaryGradient)" rx="8" opacity="0.1"/>
      <line x1="-100" y1="15" x2="100" y2="15" stroke="url(#primaryGradient)" stroke-width="2"/>
      
      <text x="0" y="5" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#4a5568">
        2 × Precision × Recall
      </text>
      <text x="0" y="25" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#4a5568">
        Precision + Recall
      </text>
    </g>
  </g>

  <!-- Why Harmonic Mean Section -->
  <g transform="translate(80, 270)">
    <text x="320" y="0" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="24" font-weight="600" fill="#2d3748">
      Why Harmonic Mean?
    </text>
    
    <!-- Three Key Points -->
    <g transform="translate(0, 40)">
      <!-- Point 1 -->
      <g>
        <circle cx="12" cy="12" r="12" fill="url(#primaryGradient)"/>
        <text x="12" y="17" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="700" fill="white">1</text>
        <text x="40" y="17" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#2d3748">
          Penalizes extreme imbalances
        </text>
        <text x="40" y="35" font-family="Inter, -apple-system, sans-serif" font-size="14" fill="#718096">
          If either metric is very low, F1 will also be low
        </text>
      </g>
      
      <!-- Point 2 -->
      <g transform="translate(0, 70)">
        <circle cx="12" cy="12" r="12" fill="url(#secondaryGradient)"/>
        <text x="12" y="17" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="700" fill="white">2</text>
        <text x="40" y="17" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#2d3748">
          Requires balanced performance
        </text>
        <text x="40" y="35" font-family="Inter, -apple-system, sans-serif" font-size="14" fill="#718096">
          Both precision and recall must be reasonably high
        </text>
      </g>
      
      <!-- Point 3 -->
      <g transform="translate(0, 140)">
        <circle cx="12" cy="12" r="12" fill="url(#accentGradient)"/>
        <text x="12" y="17" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="700" fill="white">3</text>
        <text x="40" y="17" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#2d3748">
          Single comprehensive score
        </text>
        <text x="40" y="35" font-family="Inter, -apple-system, sans-serif" font-size="14" fill="#718096">
          Combines both metrics into one interpretable value
        </text>
      </g>
    </g>

    <!-- Example Calculation -->
    <g transform="translate(400, 40)">
      <rect x="0" y="0" width="240" height="160" rx="12" fill="white" stroke="#e2e8f0" stroke-width="1" filter="url(#softShadow)"/>
      
      <text x="120" y="25" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#2d3748">
        Example Calculation
      </text>
      
      <line x1="20" y1="35" x2="220" y2="35" stroke="#e2e8f0" stroke-width="1"/>
      
      <!-- Values -->
      <g transform="translate(20, 55)">
        <text x="0" y="0" font-family="Inter, -apple-system, sans-serif" font-size="14" fill="#4a5568">Precision: </text>
        <text x="80" y="0" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#667eea">0.20</text>
        
        <text x="0" y="25" font-family="Inter, -apple-system, sans-serif" font-size="14" fill="#4a5568">Recall: </text>
        <text x="80" y="25" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#f5576c">0.33</text>
      </g>
      
      <!-- Calculation Steps -->
      <g transform="translate(20, 95)">
        <text x="0" y="0" font-family="JetBrains Mono, monospace" font-size="12" fill="#718096">F1 = 2×(0.20×0.33)/(0.20+0.33)</text>
        <text x="0" y="18" font-family="JetBrains Mono, monospace" font-size="12" fill="#718096">F1 = 2×0.066/0.53</text>
        <text x="0" y="36" font-family="JetBrains Mono, monospace" font-size="12" fill="#718096">F1 = 0.132/0.53</text>
      </g>
      
      <!-- Result -->
      <g transform="translate(120, 135)">
        <circle cx="0" cy="0" r="20" fill="url(#primaryGradient)"/>
        <text x="0" y="-5" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="700" fill="white">F1</text>
        <text x="0" y="8" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="700" fill="white">0.25</text>
      </g>
    </g>
  </g>

  <!-- Key Insight -->
  <g transform="translate(100, 520)">
    <rect x="0" y="0" width="600" height="60" rx="12" fill="#edf2f7" stroke="#cbd5e0" stroke-width="1"/>
    
    <circle cx="25" cy="30" r="8" fill="#48bb78"/>
    <text x="25" y="34" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="700" fill="white">✓</text>
    
    <text x="50" y="25" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#2d3748">
      Key Insight
    </text>
    <text x="50" y="45" font-family="Inter, -apple-system, sans-serif" font-size="14" fill="#4a5568">
      F1 = 0.25 is closer to the lower score (Precision = 0.20), showing room for improvement
    </text>
  </g>
</svg>