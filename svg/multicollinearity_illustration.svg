<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">
    Multicollinearity: When Predictors Are Highly Correlated
  </text>
  
  <!-- Good case: Independent predictors -->
  <g transform="translate(80, 80)">
    <rect width="280" height="200" fill="#e8f5e8" stroke="#388e3c" stroke-width="2" rx="10"/>
    <text x="140" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#388e3c">
      Good: Independent Predictors
    </text>
    
    <!-- 2D scatter plot -->
    <g transform="translate(40, 40)">
      <!-- Axes -->
      <line x1="0" y1="120" x2="200" y2="120" stroke="#333" stroke-width="2"/>
      <line x1="0" y1="0" x2="0" y2="120" stroke="#333" stroke-width="2"/>
      
      <!-- Data points spread in 2D -->
      <circle cx="20" cy="100" r="3" fill="#1976d2" opacity="0.7"/>
      <circle cx="40" cy="80" r="3" fill="#1976d2" opacity="0.7"/>
      <circle cx="60" cy="90" r="3" fill="#1976d2" opacity="0.7"/>
      <circle cx="80" cy="60" r="3" fill="#1976d2" opacity="0.7"/>
      <circle cx="100" cy="70" r="3" fill="#1976d2" opacity="0.7"/>
      <circle cx="120" cy="50" r="3" fill="#1976d2" opacity="0.7"/>
      <circle cx="140" cy="40" r="3" fill="#1976d2" opacity="0.7"/>
      <circle cx="160" cy="30" r="3" fill="#1976d2" opacity="0.7"/>
      <circle cx="180" cy="20" r="3" fill="#1976d2" opacity="0.7"/>
      <circle cx="30" cy="110" r="3" fill="#1976d2" opacity="0.7"/>
      <circle cx="50" cy="85" r="3" fill="#1976d2" opacity="0.7"/>
      <circle cx="70" cy="75" r="3" fill="#1976d2" opacity="0.7"/>
      <circle cx="90" cy="65" r="3" fill="#1976d2" opacity="0.7"/>
      <circle cx="110" cy="55" r="3" fill="#1976d2" opacity="0.7"/>
      <circle cx="130" cy="45" r="3" fill="#1976d2" opacity="0.7"/>
      <circle cx="150" cy="35" r="3" fill="#1976d2" opacity="0.7"/>
      <circle cx="170" cy="25" r="3" fill="#1976d2" opacity="0.7"/>
      <circle cx="190" cy="15" r="3" fill="#1976d2" opacity="0.7"/>
      
      <!-- Grid lines to show both directions are informative -->
      <line x1="100" y1="0" x2="100" y2="120" stroke="#388e3c" stroke-width="1" stroke-dasharray="5,5" opacity="0.5"/>
      <line x1="0" y1="60" x2="200" y2="60" stroke="#388e3c" stroke-width="1" stroke-dasharray="5,5" opacity="0.5"/>
      
      <!-- Labels -->
      <text x="100" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">X₁ (TV Ads)</text>
      <text x="-15" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666" transform="rotate(-90, -15, 60)">X₂ (Radio)</text>
    </g>
    
    <text x="140" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">
      ✓ Can determine individual effects
    </text>
  </g>
  
  <!-- Problem case: Multicollinear predictors -->
  <g transform="translate(440, 80)">
    <rect width="280" height="200" fill="#ffebee" stroke="#d32f2f" stroke-width="2" rx="10"/>
    <text x="140" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#d32f2f">
      Problem: Multicollinear Predictors
    </text>
    
    <!-- 2D scatter plot -->
    <g transform="translate(40, 40)">
      <!-- Axes -->
      <line x1="0" y1="120" x2="200" y2="120" stroke="#333" stroke-width="2"/>
      <line x1="0" y1="0" x2="0" y2="120" stroke="#333" stroke-width="2"/>
      
      <!-- Data points along a line (highly correlated) -->
      <circle cx="20" cy="100" r="3" fill="#1976d2" opacity="0.7"/>
      <circle cx="40" cy="85" r="3" fill="#1976d2" opacity="0.7"/>
      <circle cx="60" cy="70" r="3" fill="#1976d2" opacity="0.7"/>
      <circle cx="80" cy="55" r="3" fill="#1976d2" opacity="0.7"/>
      <circle cx="100" cy="40" r="3" fill="#1976d2" opacity="0.7"/>
      <circle cx="120" cy="25" r="3" fill="#1976d2" opacity="0.7"/>
      <circle cx="140" cy="10" r="3" fill="#1976d2" opacity="0.7"/>
      <circle cx="30" cy="92" r="3" fill="#1976d2" opacity="0.7"/>
      <circle cx="50" cy="77" r="3" fill="#1976d2" opacity="0.7"/>
      <circle cx="70" cy="62" r="3" fill="#1976d2" opacity="0.7"/>
      <circle cx="90" cy="47" r="3" fill="#1976d2" opacity="0.7"/>
      <circle cx="110" cy="32" r="3" fill="#1976d2" opacity="0.7"/>
      <circle cx="130" cy="17" r="3" fill="#1976d2" opacity="0.7"/>
      <circle cx="160" cy="8" r="3" fill="#1976d2" opacity="0.7"/>
      <circle cx="180" cy="5" r="3" fill="#1976d2" opacity="0.7"/>
      
      <!-- Correlation line -->
      <line x1="10" y1="110" x2="190" y2="0" stroke="#d32f2f" stroke-width="2"/>
      
      <!-- Arrow showing direction of data variation -->
      <path d="M 50 80 L 120 20" stroke="#ff9800" stroke-width="3" marker-end="url(#arrowhead)"/>
      <text x="85" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#ff9800" transform="rotate(-45, 85, 45)">
        Data variation
      </text>
      
      <!-- Arrow showing missing direction -->
      <path d="M 50 80 L 120 80" stroke="#666" stroke-width="2" stroke-dasharray="5,5"/>
      <text x="85" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">
        No data here
      </text>
      
      <!-- Labels -->
      <text x="100" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">X₁ (TV Ads)</text>
      <text x="-15" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666" transform="rotate(-90, -15, 60)">X₂ (Radio)</text>
    </g>
    
    <text x="140" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">
      ✗ Cannot separate individual effects
    </text>
  </g>
  
  <!-- The attribution problem -->
  <g transform="translate(100, 320)">
    <rect width="600" height="100" fill="#fff3e0" stroke="#f57c00" stroke-width="2" rx="10"/>
    <text x="300" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#f57c00">
      The Attribution Problem
    </text>
    <text x="300" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">
      When X₁ and X₂ are highly correlated: Y = β₁X₁ + β₂X₂ + ε
    </text>
    <text x="150" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">
      "Sales increased along the correlation"
    </text>
    <text x="450" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">
      "But was it due to TV or Radio?"
    </text>
  </g>
  
  <!-- Mathematical consequences -->
  <g transform="translate(80, 450)">
    <!-- High standard errors -->
    <rect x="0" y="0" width="280" height="120" fill="#ffebee" stroke="#d32f2f" stroke-width="1" rx="5"/>
    <text x="140" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#d32f2f">
      Mathematical Consequences
    </text>
    <text x="20" y="50" font-family="Arial, sans-serif" font-size="11" fill="#333">
      • Standard errors → ∞
    </text>
    <text x="20" y="70" font-family="Arial, sans-serif" font-size="11" fill="#333">
      • (X'X)⁻¹ becomes unstable
    </text>
    <text x="20" y="90" font-family="Arial, sans-serif" font-size="11" fill="#333">
      • Confidence intervals very wide
    </text>
    <text x="20" y="110" font-family="Arial, sans-serif" font-size="11" fill="#333">
      • Coefficient estimates unreliable
    </text>
    
    <!-- Solutions -->
    <rect x="320" y="0" width="280" height="120" fill="#e8f5e8" stroke="#388e3c" stroke-width="1" rx="5"/>
    <text x="460" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#388e3c">
      Potential Solutions
    </text>
    <text x="340" y="50" font-family="Arial, sans-serif" font-size="11" fill="#333">
      • Remove redundant variables
    </text>
    <text x="340" y="70" font-family="Arial, sans-serif" font-size="11" fill="#333">
      • Principal Component Analysis
    </text>
    <text x="340" y="90" font-family="Arial, sans-serif" font-size="11" fill="#333">
      • Ridge regression (regularization)
    </text>
    <text x="340" y="110" font-family="Arial, sans-serif" font-size="11" fill="#333">
      • Collect more varied data
    </text>
  </g>
  
  <!-- Detection box -->
  <rect x="650" y="450" width="130" height="120" fill="#e3f2fd" stroke="#1976d2" stroke-width="1" rx="5"/>
  <text x="715" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1976d2">
    Detection
  </text>
  <text x="665" y="495" font-family="Arial, sans-serif" font-size="10" fill="#333">
    VIF > 10
  </text>
  <text x="665" y="510" font-family="Arial, sans-serif" font-size="10" fill="#333">
    |r| > 0.8
  </text>
  <text x="665" y="525" font-family="Arial, sans-serif" font-size="10" fill="#333">
    κ > 30
  </text>
  <text x="665" y="545" font-family="Arial, sans-serif" font-size="9" fill="#666">
    (condition
  </text>
  <text x="665" y="557" font-family="Arial, sans-serif" font-size="9" fill="#666">
    number)
  </text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff9800"/>
    </marker>
  </defs>
</svg>