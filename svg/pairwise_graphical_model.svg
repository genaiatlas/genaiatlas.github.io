<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="600" y="40" font-size="28" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Pairwise Graphical Model Parameterization
  </text>
  
  <!-- Left: Graph with Parameters -->
  <g id="graph-params">
    <text x="300" y="90" font-size="20" font-weight="bold" text-anchor="middle" fill="#34495e">
      Graph with Parameters
    </text>
    
    <!-- Node 1: Casablanca -->
    <circle cx="200" cy="200" r="50" fill="#3498db" stroke="#2c3e50" stroke-width="3"/>
    <text x="200" y="200" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
      Casablanca
    </text>
    <text x="200" y="220" font-size="13" text-anchor="middle" fill="white">
      σ₁
    </text>
    
    <!-- Node parameter label -->
    <rect x="170" y="130" width="60" height="30" fill="#e74c3c" stroke="#c0392b" stroke-width="2" rx="5"/>
    <text x="200" y="150" font-size="13" font-weight="bold" text-anchor="middle" fill="white">
      θ₁
    </text>
    
    <!-- Node 2: Godfather -->
    <circle cx="400" cy="200" r="50" fill="#3498db" stroke="#2c3e50" stroke-width="3"/>
    <text x="400" y="200" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
      Godfather
    </text>
    <text x="400" y="220" font-size="13" text-anchor="middle" fill="white">
      σ₂
    </text>
    
    <!-- Node parameter label -->
    <rect x="370" y="130" width="60" height="30" fill="#e74c3c" stroke="#c0392b" stroke-width="2" rx="5"/>
    <text x="400" y="150" font-size="13" font-weight="bold" text-anchor="middle" fill="white">
      θ₂
    </text>
    
    <!-- Edge parameter between 1 and 2 -->
    <line x1="250" y1="200" x2="350" y2="200" stroke="#9b59b6" stroke-width="4"/>
    <rect x="275" y="170" width="50" height="28" fill="#9b59b6" stroke="#8e44ad" stroke-width="2" rx="5"/>
    <text x="300" y="189" font-size="12" font-weight="bold" text-anchor="middle" fill="white">
      θ₁₂
    </text>
    
    <!-- Node 3: Iron Man -->
    <circle cx="200" cy="380" r="50" fill="#3498db" stroke="#2c3e50" stroke-width="3"/>
    <text x="200" y="380" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
      Iron Man
    </text>
    <text x="200" y="400" font-size="13" text-anchor="middle" fill="white">
      σ₃
    </text>
    
    <!-- Node parameter label -->
    <rect x="170" y="440" width="60" height="30" fill="#e74c3c" stroke="#c0392b" stroke-width="2" rx="5"/>
    <text x="200" y="460" font-size="13" font-weight="bold" text-anchor="middle" fill="white">
      θ₃
    </text>
    
    <!-- Node 4: Batman -->
    <circle cx="400" cy="380" r="50" fill="#3498db" stroke="#2c3e50" stroke-width="3"/>
    <text x="400" y="380" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
      Batman
    </text>
    <text x="400" y="400" font-size="13" text-anchor="middle" fill="white">
      σ₄
    </text>
    
    <!-- Node parameter label -->
    <rect x="370" y="440" width="60" height="30" fill="#e74c3c" stroke="#c0392b" stroke-width="2" rx="5"/>
    <text x="400" y="460" font-size="13" font-weight="bold" text-anchor="middle" fill="white">
      θ₄
    </text>
    
    <!-- More edges -->
    <line x1="225" y1="245" x2="225" y2="335" stroke="#9b59b6" stroke-width="4"/>
    <rect x="235" y="275" width="50" height="28" fill="#9b59b6" stroke="#8e44ad" stroke-width="2" rx="5"/>
    <text x="260" y="294" font-size="12" font-weight="bold" text-anchor="middle" fill="white">
      θ₁₃
    </text>
    
    <line x1="375" y1="245" x2="375" y2="335" stroke="#9b59b6" stroke-width="4"/>
    <rect x="315" y="275" width="50" height="28" fill="#9b59b6" stroke="#8e44ad" stroke-width="2" rx="5"/>
    <text x="340" y="294" font-size="12" font-weight="bold" text-anchor="middle" fill="white">
      θ₂₄
    </text>
    
    <line x1="250" y1="380" x2="350" y2="380" stroke="#9b59b6" stroke-width="4"/>
    <rect x="275" y="390" width="50" height="28" fill="#9b59b6" stroke="#8e44ad" stroke-width="2" rx="5"/>
    <text x="300" y="409" font-size="12" font-weight="bold" text-anchor="middle" fill="white">
      θ₃₄
    </text>
    
    <line x1="245" y1="220" x2="355" y2="360" stroke="#9b59b6" stroke-width="3" stroke-dasharray="5,5"/>
    <rect x="275" y="275" width="50" height="28" fill="#9b59b6" stroke="#8e44ad" stroke-width="2" rx="5"/>
    <text x="300" y="294" font-size="12" font-weight="bold" text-anchor="middle" fill="white">
      θ₁₄
    </text>
    
    <line x1="245" y1="360" x2="355" y2="220" stroke="#9b59b6" stroke-width="3" stroke-dasharray="5,5"/>
    <rect x="275" y="305" width="50" height="28" fill="#9b59b6" stroke="#8e44ad" stroke-width="2" rx="5"/>
    <text x="300" y="324" font-size="12" font-weight="bold" text-anchor="middle" fill="white">
      θ₂₃
    </text>
    
    <!-- Legend -->
    <rect x="80" y="510" width="380" height="110" fill="#ecf0f1" stroke="#34495e" stroke-width="2" rx="5"/>
    <text x="270" y="535" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Parameter Types
    </text>
    <circle cx="110" cy="560" r="8" fill="#e74c3c"/>
    <text x="130" y="565" font-size="12" fill="#2c3e50">
      Node Parameters (θᵢ) - Individual item popularity
    </text>
    <rect x="102" y="580" width="16" height="16" fill="#9b59b6" rx="3"/>
    <text x="130" y="593" font-size="12" fill="#2c3e50">
      Edge Parameters (θᵢⱼ) - Pairwise correlations
    </text>
  </g>
  
  <!-- Right: Probability Formula -->
  <g id="probability-formula">
    <text x="850" y="90" font-size="20" font-weight="bold" text-anchor="middle" fill="#34495e">
      Probability Distribution
    </text>
    
    <!-- Formula box -->
    <rect x="600" y="120" width="500" height="220" fill="#e8f5e9" stroke="#27ae60" stroke-width="3" rx="8"/>
    <text x="850" y="160" font-size="16" font-weight="bold" text-anchor="middle" fill="#27ae60">
      P(σ₁, σ₂, σ₃, σ₄) ∝ exp(...)
    </text>
    
    <!-- First term -->
    <text x="850" y="200" font-size="14" text-anchor="middle" fill="#2c3e50">
      exp( Σᵢ θᵢσᵢ  +  Σᵢⱼ θᵢⱼσᵢσⱼ )
    </text>
    
    <!-- Expanded -->
    <text x="850" y="240" font-size="13" text-anchor="middle" fill="#2c3e50">
      = exp( θ₁σ₁ + θ₂σ₂ + θ₃σ₃ + θ₄σ₄
    </text>
    <text x="850" y="265" font-size="13" text-anchor="middle" fill="#2c3e50">
      + θ₁₂σ₁σ₂ + θ₁₃σ₁σ₃ + θ₁₄σ₁σ₄
    </text>
    <text x="850" y="290" font-size="13" text-anchor="middle" fill="#2c3e50">
      + θ₂₃σ₂σ₃ + θ₂₄σ₂σ₄ + θ₃₄σ₃σ₄ )
    </text>
    
    <text x="850" y="320" font-size="12" text-anchor="middle" fill="#7f8c8d" font-style="italic">
      where σᵢ ∈ {+1, -1}
    </text>
  </g>
  
  <!-- Parameter interpretation -->
  <g id="interpretation">
    <rect x="600" y="370" width="500" height="250" fill="#fff3e0" stroke="#f39c12" stroke-width="2" rx="8"/>
    <text x="850" y="400" font-size="16" font-weight="bold" text-anchor="middle" fill="#f39c12">
      Parameter Interpretation
    </text>
    
    <!-- Node parameters -->
    <text x="630" y="435" font-size="14" font-weight="bold" fill="#e74c3c">
      Node Parameters (θᵢ):
    </text>
    <text x="650" y="460" font-size="12" fill="#2c3e50">
      • θᵢ &gt; 0: Item i is generally popular
    </text>
    <text x="650" y="480" font-size="12" fill="#2c3e50">
      • θᵢ &lt; 0: Item i is generally unpopular
    </text>
    <text x="650" y="500" font-size="12" fill="#2c3e50">
      • θᵢ ≈ 0: Neutral popularity
    </text>
    
    <!-- Edge parameters -->
    <text x="630" y="535" font-size="14" font-weight="bold" fill="#9b59b6">
      Edge Parameters (θᵢⱼ):
    </text>
    <text x="650" y="560" font-size="12" fill="#2c3e50">
      • θᵢⱼ &gt; 0: Positive correlation (like both or dislike both)
    </text>
    <text x="650" y="580" font-size="12" fill="#2c3e50">
      • θᵢⱼ &lt; 0: Negative correlation (like one, dislike other)
    </text>
    <text x="650" y="600" font-size="12" fill="#2c3e50">
      • θᵢⱼ ≈ 0: Preferences are independent
    </text>
  </g>
  
  <!-- Bottom: Example -->
  <rect x="100" y="660" width="1000" height="200" fill="#e3f2fd" stroke="#2196f3" stroke-width="3" rx="8"/>
  <text x="600" y="695" font-size="18" font-weight="bold" text-anchor="middle" fill="#2196f3">
    Example: All Users Like All Movies
  </text>
  <text x="600" y="730" font-size="14" text-anchor="middle" fill="#2c3e50">
    If population always likes all movies:
  </text>
  <text x="600" y="760" font-size="14" text-anchor="middle" fill="#2c3e50">
    θᵢ → ∞ for all nodes (strong individual popularity)
  </text>
  <text x="600" y="790" font-size="14" text-anchor="middle" fill="#2c3e50">
    θᵢⱼ = 0 for all edges (no additional correlation needed)
  </text>
  <text x="600" y="820" font-size="13" text-anchor="middle" fill="#7f8c8d" font-style="italic">
    Result: Graph with nodes but no edges captures this pattern
  </text>
</svg>