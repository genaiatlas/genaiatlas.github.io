<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">Binary Classification in Animal Survival</text>
  
  <!-- Predator Detection Scenario -->
  <g transform="translate(50, 70)">
    <text x="200" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#8b4513">🦌 Predator vs Non-Predator Detection</text>
  </g>
  
  <!-- Deer (Prey Animal) -->
  <g transform="translate(80, 140)">
    <circle cx="0" cy="0" r="35" fill="#deb887" stroke="#8b4513" stroke-width="2"/>
    <text x="0" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="24">🦌</text>
    <text x="0" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#8b4513">Alert Deer</text>
    <text x="0" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">Processing sensory</text>
    <text x="0" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">information</text>
  </g>
  
  <!-- Sensory Input -->
  <g transform="translate(200, 120)">
    <rect x="-60" y="-30" width="120" height="60" fill="#e8f5e8" stroke="#4caf50" stroke-width="2" rx="10"/>
    <text x="0" y="-15" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2e7d32">👁️ Sensory Input</text>
    <text x="0" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2e7d32">Visual: Movement, size</text>
    <text x="0" y="12" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2e7d32">Auditory: Footsteps, growls</text>
    <text x="0" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2e7d32">Olfactory: Scent markers</text>
  </g>
  
  <!-- Arrow -->
  <path d="M 280 140 L 340 140" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="310" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Process</text>
  
  <!-- Brain Processing -->
  <g transform="translate(400, 140)">
    <circle cx="0" cy="0" r="40" fill="#fce4ec" stroke="#e91e63" stroke-width="2"/>
    <text x="0" y="-15" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#c2185b">🧠 Brain</text>
    <text x="0" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#c2185b">Processing</text>
    <text x="0" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#c2185b">Pattern matching</text>
    <text x="0" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#c2185b">Memory recall</text>
  </g>
  
  <!-- Decision Point -->
  <g transform="translate(520, 140)">
    <polygon points="0,-25 25,0 0,25 -25,0" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
    <text x="0" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#f57c00">Decision</text>
    <text x="0" y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#f57c00">Point</text>
  </g>
  
  <!-- Split to two outcomes -->
  <path d="M 545 125 L 600 80" stroke="#d32f2f" stroke-width="3" fill="none" marker-end="url(#arrowhead_red)"/>
  <text x="580" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#d32f2f" font-weight="bold" transform="rotate(-30 580 95)">PREDATOR</text>
  
  <path d="M 545 155 L 600 200" stroke="#388e3c" stroke-width="3" fill="none" marker-end="url(#arrowhead_green)"/>
  <text x="580" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#388e3c" font-weight="bold" transform="rotate(30 580 185)">SAFE</text>
  
  <!-- Predator Response -->
  <g transform="translate(650, 60)">
    <rect x="-50" y="-20" width="100" height="40" fill="#ffebee" stroke="#d32f2f" stroke-width="2" rx="5"/>
    <text x="0" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#d32f2f">🏃‍♀️ FLEE!</text>
    <text x="0" y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#d32f2f">Fight or flight</text>
  </g>
  
  <!-- Safe Response -->
  <g transform="translate(650, 220)">
    <rect x="-50" y="-20" width="100" height="40" fill="#e8f5e8" stroke="#388e3c" stroke-width="2" rx="5"/>
    <text x="0" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#388e3c">🌿 Continue</text>
    <text x="0" y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#388e3c">Normal behavior</text>
  </g>
  
  <!-- Actual Threats -->
  <g transform="translate(800, 40)">
    <text x="50" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Actual Threats:</text>
    <g transform="translate(20, 20)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="20">🐺</text>
      <text x="0" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#d32f2f">Wolf</text>
    </g>
    <g transform="translate(80, 20)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="20">🐻</text>
      <text x="0" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#d32f2f">Bear</text>
    </g>
  </g>
  
  <!-- Non-threats -->
  <g transform="translate(800, 180)">
    <text x="50" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Non-threats:</text>
    <g transform="translate(20, 20)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="20">🐰</text>
      <text x="0" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#388e3c">Rabbit</text>
    </g>
    <g transform="translate(80, 20)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="20">🌳</text>
      <text x="0" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#388e3c">Tree</text>
    </g>
  </g>
  
  <!-- Food Classification Scenario -->
  <g transform="translate(50, 320)">
    <text x="200" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#9c27b0">🍄 Food vs Poison Classification</text>
  </g>
  
  <!-- Animal approaching food -->
  <g transform="translate(80, 380)">
    <circle cx="0" cy="0" r="30" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20">🐭</text>
    <text x="0" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#f57c00">Hungry Mouse</text>
  </g>
  
  <!-- Food Item -->
  <g transform="translate(200, 380)">
    <circle cx="0" cy="0" r="25" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18">🍄</text>
    <text x="0" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#9c27b0">Unknown</text>
    <text x="0" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#9c27b0">Mushroom</text>
  </g>
  
  <!-- Arrow -->
  <path d="M 125 380 L 165 380" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="145" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">Investigate</text>
  
  <!-- Sensory Analysis -->
  <g transform="translate(320, 380)">
    <rect x="-60" y="-40" width="120" height="80" fill="#e1f5fe" stroke="#0277bd" stroke-width="2" rx="10"/>
    <text x="0" y="-25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0277bd">👃 Analysis</text>
    <text x="0" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#0277bd">Color: Dark red</text>
    <text x="0" y="2" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#0277bd">Smell: Unusual</text>
    <text x="0" y="14" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#0277bd">Texture: Slimy</text>
    <text x="0" y="26" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#0277bd">Memory: Similar = BAD</text>
  </g>
  
  <!-- Arrow -->
  <path d="M 400 380 L 460 380" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Decision -->
  <g transform="translate(520, 380)">
    <polygon points="0,-25 25,0 0,25 -25,0" fill="#fff8e1" stroke="#fbc02d" stroke-width="2"/>
    <text x="0" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#f57c00">Risk</text>
    <text x="0" y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#f57c00">Assessment</text>
  </g>
  
  <!-- Decision outcomes -->
  <path d="M 545 365 L 600 320" stroke="#d32f2f" stroke-width="3" fill="none" marker-end="url(#arrowhead_red)"/>
  <text x="580" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#d32f2f" font-weight="bold" transform="rotate(-30 580 335)">AVOID</text>
  
  <path d="M 545 395 L 600 440" stroke="#388e3c" stroke-width="3" fill="none" marker-end="url(#arrowhead_green)"/>
  <text x="580" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#388e3c" font-weight="bold" transform="rotate(30 580 425)">EAT</text>
  
  <!-- Avoid outcome -->
  <g transform="translate(650, 300)">
    <rect x="-40" y="-15" width="80" height="30" fill="#ffebee" stroke="#d32f2f" stroke-width="2" rx="5"/>
    <text x="0" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#d32f2f">🚫 Avoid</text>
    <text x="0" y="12" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#d32f2f">Stay safe</text>
  </g>
  
  <!-- Eat outcome -->
  <g transform="translate(650, 460)">
    <rect x="-40" y="-15" width="80" height="30" fill="#e8f5e8" stroke="#388e3c" stroke-width="2" rx="5"/>
    <text x="0" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#388e3c">🍽️ Consume</text>
    <text x="0" y="12" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#388e3c">Gain energy</text>
  </g>
  
  <!-- Evolutionary Advantage Box -->
  <g transform="translate(750, 320)">
    <rect x="0" y="0" width="220" height="140" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="10"/>
    <text x="110" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">🧬 Evolutionary Advantage</text>
    
    <text x="10" y="35" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1976d2">Fast Classification →</text>
    <text x="10" y="48" font-family="Arial, sans-serif" font-size="10" fill="#666">• Quick threat response</text>
    <text x="10" y="61" font-family="Arial, sans-serif" font-size="10" fill="#666">• Better survival rates</text>
    
    <text x="10" y="80" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#388e3c">Accurate Classification →</text>
    <text x="10" y="93" font-family="Arial, sans-serif" font-size="10" fill="#666">• Avoid false alarms</text>
    <text x="10" y="106" font-family="Arial, sans-serif" font-size="10" fill="#666">• Efficient energy use</text>
    
    <text x="10" y="125" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#e91e63">Learning →</text>
    <text x="70" y="125" font-family="Arial, sans-serif" font-size="10" fill="#666">Improve over time</text>
  </g>
  
  <!-- Error Consequences -->
  <g transform="translate(50, 520)">
    <rect x="0" y="0" width="900" height="70" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="10"/>
    <text x="450" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">⚠️ Classification Errors in Nature</text>
    
    <!-- False Positive -->
    <g transform="translate(50, 25)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ff9800">False Positive (Cry Wolf):</text>
      <text x="0" y="15" font-family="Arial, sans-serif" font-size="10" fill="#666">• Flee from harmless stimulus</text>
      <text x="0" y="28" font-family="Arial, sans-serif" font-size="10" fill="#666">• Energy waste, missed opportunities</text>
      <text x="0" y="41" font-family="Arial, sans-serif" font-size="10" fill="#666">• Better safe than sorry strategy</text>
    </g>
    
    <!-- False Negative -->
    <g transform="translate(350, 25)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#d32f2f">False Negative (Missed Threat):</text>
      <text x="0" y="15" font-family="Arial, sans-serif" font-size="10" fill="#666">• Fail to recognize real danger</text>
      <text x="0" y="28" font-family="Arial, sans-serif" font-size="10" fill="#666">• Potential injury or death</text>
      <text x="0" y="41" font-family="Arial, sans-serif" font-size="10" fill="#666">• Evolutionary pressure against</text>
    </g>
    
    <!-- Speed vs Accuracy -->
    <g transform="translate(650, 25)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#9c27b0">Speed vs Accuracy Trade-off:</text>
      <text x="0" y="15" font-family="Arial, sans-serif" font-size="10" fill="#666">• Millisecond decisions required</text>
      <text x="0" y="28" font-family="Arial, sans-serif" font-size="10" fill="#666">• Bias toward false positives</text>
      <text x="0" y="41" font-family="Arial, sans-serif" font-size="10" fill="#666">• "Better safe than sorry" heuristic</text>
    </g>
  </g>
  
  <!-- Arrow marker definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
            refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowhead_red" markerWidth="10" markerHeight="7" 
            refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d32f2f"/>
    </marker>
    <marker id="arrowhead_green" markerWidth="10" markerHeight="7" 
            refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#388e3c"/>
    </marker>
  </defs>
</svg>