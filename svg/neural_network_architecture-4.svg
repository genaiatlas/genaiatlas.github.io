<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
      .label { font-family: Arial, sans-serif; font-size: 12px; text-anchor: middle; }
      .small-label { font-family: Arial, sans-serif; font-size: 10px; text-anchor: middle; }
      .neuron { fill: #4A90E2; stroke: #2E5C8A; stroke-width: 2; }
      .connection { stroke: #666; stroke-width: 1.5; opacity: 0.7; }
      .layer-label { font-family: Arial, sans-serif; font-size: 14px; text-anchor: middle; font-weight: bold; }
    </style>
  </defs>
  
  <!-- Title -->
  <text x="400" y="25" class="title">Neural Network Architecture: Effect of Hidden Layer Size</text>
  
  <!-- Network with 2 Hidden Neurons -->
  <g id="network-2">
    <text x="120" y="65" class="layer-label">2 Hidden Neurons</text>
    
    <!-- Input Layer -->
    <circle cx="50" cy="100" r="15" class="neuron"/>
    <circle cx="50" cy="140" r="15" class="neuron"/>
    <text x="50" y="170" class="small-label">Input</text>
    
    <!-- Hidden Layer (2 neurons) -->
    <circle cx="150" cy="110" r="15" class="neuron"/>
    <circle cx="150" cy="130" r="15" class="neuron"/>
    <text x="150" y="160" class="small-label">Hidden</text>
    
    <!-- Output Layer -->
    <circle cx="250" cy="120" r="15" class="neuron"/>
    <text x="250" y="150" class="small-label">Output</text>
    
    <!-- Connections for 2-neuron network -->
    <line x1="65" y1="100" x2="135" y2="110" class="connection"/>
    <line x1="65" y1="100" x2="135" y2="130" class="connection"/>
    <line x1="65" y1="140" x2="135" y2="110" class="connection"/>
    <line x1="65" y1="140" x2="135" y2="130" class="connection"/>
    <line x1="165" y1="110" x2="235" y2="120" class="connection"/>
    <line x1="165" y1="130" x2="235" y2="120" class="connection"/>
    
    <!-- Decision Boundary Representation -->
    <rect x="30" y="190" width="240" height="120" fill="none" stroke="#333" stroke-width="1"/>
    <path d="M 50,280 Q 150,200 250,270" stroke="#E74C3C" stroke-width="3" fill="none"/>
    <text x="150" y="330" class="small-label">Simple Decision Boundary</text>
  </g>
  
  <!-- Network with 10 Hidden Neurons -->
  <g id="network-10">
    <text x="450" y="65" class="layer-label">10 Hidden Neurons</text>
    
    <!-- Input Layer -->
    <circle cx="350" cy="100" r="15" class="neuron"/>
    <circle cx="350" cy="140" r="15" class="neuron"/>
    <text x="350" y="170" class="small-label">Input</text>
    
    <!-- Hidden Layer (10 neurons) -->
    <circle cx="450" cy="85" r="12" class="neuron"/>
    <circle cx="450" cy="105" r="12" class="neuron"/>
    <circle cx="450" cy="125" r="12" class="neuron"/>
    <circle cx="450" cy="145" r="12" class="neuron"/>
    <circle cx="450" cy="165" r="12" class="neuron"/>
    <circle cx="470" cy="85" r="12" class="neuron"/>
    <circle cx="470" cy="105" r="12" class="neuron"/>
    <circle cx="470" cy="125" r="12" class="neuron"/>
    <circle cx="470" cy="145" r="12" class="neuron"/>
    <circle cx="470" cy="165" r="12" class="neuron"/>
    <text x="460" y="185" class="small-label">Hidden (10)</text>
    
    <!-- Output Layer -->
    <circle cx="550" cy="120" r="15" class="neuron"/>
    <text x="550" y="150" class="small-label">Output</text>
    
    <!-- Sample connections (showing complexity) -->
    <line x1="365" y1="100" x2="438" y2="85" class="connection"/>
    <line x1="365" y1="100" x2="438" y2="125" class="connection"/>
    <line x1="365" y1="100" x2="458" y2="145" class="connection"/>
    <line x1="365" y1="140" x2="438" y2="105" class="connection"/>
    <line x1="365" y1="140" x2="458" y2="165" class="connection"/>
    <line x1="462" y1="105" x2="535" y2="120" class="connection"/>
    <line x1="482" y1="125" x2="535" y2="120" class="connection"/>
    <line x1="462" y1="145" x2="535" y2="120" class="connection"/>
    
    <!-- Decision Boundary Representation -->
    <rect x="330" y="190" width="240" height="120" fill="none" stroke="#333" stroke-width="1"/>
    <path d="M 350,280 Q 400,220 430,250 Q 470,230 500,260 Q 530,240 570,275" stroke="#E74C3C" stroke-width="3" fill="none"/>
    <text x="450" y="330" class="small-label">Complex Decision Boundary</text>
  </g>
  
  <!-- Legend -->
  <g id="legend">
    <rect x="30" y="360" width="740" height="120" fill="#F8F9FA" stroke="#DEE2E6" stroke-width="1" rx="5"/>
    <text x="400" y="385" class="layer-label">Key Insights</text>
    
    <text x="50" y="410" class="small-label">• 2 neurons: Creates basic linear separations with simple boundaries</text>
    <text x="50" y="430" class="small-label">• 10 neurons: Each contributes a hyperplane, resulting in smoother but piecewise-linear boundaries</text>
    <text x="50" y="450" class="small-label">• More neurons ≠ Better performance (risk of overfitting)</text>
    <text x="50" y="470" class="small-label">• Decision boundary appears as "straight-line pieces" rather than smooth curves</text>
  </g>
</svg>