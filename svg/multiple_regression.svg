<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#64748b" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="planeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:0.1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGradient)"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1e293b">Multiple Regression Analysis</text>
  
  <!-- Main visualization area -->
  <rect x="60" y="60" width="680" height="360" fill="white" stroke="#cbd5e1" stroke-width="2" rx="10" filter="url(#shadow)"/>
  
  <!-- Left panel: 3D visualization representation -->
  <g transform="translate(80, 80)">
    <text x="150" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">3D Regression Plane</text>
    
    <!-- 3D axes -->
    <line x1="50" y1="250" x2="200" y2="250" stroke="#475569" stroke-width="2"/>
    <line x1="50" y1="250" x2="50" y2="100" stroke="#475569" stroke-width="2"/>
    <line x1="50" y1="250" x2="20" y2="300" stroke="#475569" stroke-width="2"/>
    
    <!-- Axis labels -->
    <text x="225" y="255" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#475569">X₁</text>
    <text x="45" y="90" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#475569">Y</text>
    <text x="10" y="315" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#475569">X₂</text>
    
    <!-- Regression plane -->
    <polygon points="70,180 180,160 160,280 50,300" fill="url(#planeGradient)" stroke="#3b82f6" stroke-width="1" opacity="0.7"/>
    
    <!-- Data points -->
    <g fill="#dc2626">
      <circle cx="80" cy="200" r="3"/>
      <circle cx="100" cy="190" r="3"/>
      <circle cx="120" cy="180" r="3"/>
      <circle cx="140" cy="170" r="3"/>
      <circle cx="160" cy="165" r="3"/>
      <circle cx="90" cy="230" r="3"/>
      <circle cx="110" cy="220" r="3"/>
      <circle cx="130" cy="210" r="3"/>
      <circle cx="150" cy="200" r="3"/>
      <circle cx="170" cy="195" r="3"/>
    </g>
    
    <!-- Grid lines on plane -->
    <g stroke="#64748b" stroke-width="0.5" opacity="0.4">
      <line x1="70" y1="180" x2="160" y2="280"/>
      <line x1="100" y1="170" x2="140" y2="270"/>
      <line x1="130" y1="160" x2="120" y2="260"/>
      <line x1="80" y1="200" x2="170" y2="190"/>
      <line x1="75" y1="220" x2="165" y2="210"/>
      <line x1="70" y1="240" x2="160" y2="230"/>
    </g>
  </g>
  
  <!-- Right panel: Matrix representation -->
  <g transform="translate(400, 80)">
    <text x="150" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">Matrix Form: Y = Xβ + ε</text>
    
    <!-- Matrix X -->
    <rect x="20" y="40" width="80" height="120" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="60" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">X</text>
    <g font-family="Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle">
      <text x="35" y="55">1</text>
      <text x="50" y="55">x₁₁</text>
      <text x="65" y="55">x₁₂</text>
      <text x="80" y="55">x₁₃</text>
      <text x="35" y="75">1</text>
      <text x="50" y="75">x₂₁</text>
      <text x="65" y="75">x₂₂</text>
      <text x="80" y="75">x₂₃</text>
      <text x="35" y="95">1</text>
      <text x="50" y="95">x₃₁</text>
      <text x="65" y="95">x₃₂</text>
      <text x="80" y="95">x₃₃</text>
      <text x="50" y="125">⋮</text>
      <text x="65" y="125">⋮</text>
      <text x="80" y="125">⋮</text>
      <text x="35" y="145">1</text>
      <text x="50" y="145">xₙ₁</text>
      <text x="65" y="145">xₙ₂</text>
      <text x="80" y="145">xₙ₃</text>
    </g>
    
    <!-- Matrix β -->
    <rect x="120" y="70" width="30" height="80" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="135" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">β</text>
    <g font-family="Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle">
      <text x="135" y="85">β₀</text>
      <text x="135" y="105">β₁</text>
      <text x="135" y="125">β₂</text>
      <text x="135" y="145">β₃</text>
    </g>
    
    <!-- Equals sign -->
    <text x="170" y="110" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">=</text>
    
    <!-- Matrix Y -->
    <rect x="190" y="70" width="25" height="80" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="202" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">Y</text>
    <g font-family="Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle">
      <text x="202" y="85">y₁</text>
      <text x="202" y="105">y₂</text>
      <text x="202" y="125">y₃</text>
      <text x="202" y="135">⋮</text>
      <text x="202" y="145">yₙ</text>
    </g>
    
    <!-- Plus sign -->
    <text x="230" y="110" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">+</text>
    
    <!-- Matrix ε -->
    <rect x="250" y="70" width="25" height="80" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="262" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">ε</text>
    <g font-family="Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle">
      <text x="262" y="85">ε₁</text>
      <text x="262" y="105">ε₂</text>
      <text x="262" y="125">ε₃</text>
      <text x="262" y="135">⋮</text>
      <text x="262" y="145">εₙ</text>
    </g>
    
    <!-- Solution formula -->
    <rect x="20" y="180" width="260" height="40" fill="#eff6ff" stroke="#3b82f6" stroke-width="1" rx="5"/>
    <text x="150" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">OLS Solution</text>
    <text x="150" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#1d4ed8">β̂ = (X'X)⁻¹X'Y</text>
  </g>
  
  <!-- Model comparison section -->
  <rect x="80" y="440" width="640" height="140" fill="white" stroke="#cbd5e1" stroke-width="1" rx="5" filter="url(#shadow)"/>
  <text x="400" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">Model Comparison and Selection</text>
  
  <!-- Table header -->
  <g font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">
    <text x="120" y="485">Model</text>
    <text x="220" y="485">Variables</text>
    <text x="320" y="485">R²</text>
    <text x="380" y="485">Adj. R²</text>
    <text x="460" y="485">AIC</text>
    <text x="520" y="485">BIC</text>
    <text x="580" y="485">MSE</text>
    <text x="640" y="485">F-stat</text>
  </g>
  
  <!-- Table rows -->
  <line x1="100" y1="490" x2="700" y2="490" stroke="#cbd5e1" stroke-width="1"/>
  
  <g font-family="Arial, sans-serif" font-size="11" fill="#475569">
    <!-- Model 1 -->
    <text x="120" y="505">Model 1</text>
    <text x="220" y="505">X₁</text>
    <text x="320" y="505">0.652</text>
    <text x="380" y="505">0.647</text>
    <text x="460" y="505">245.3</text>
    <text x="520" y="505">251.7</text>
    <text x="580" y="505">2.84</text>
    <text x="640" y="505">187.5</text>
    
    <!-- Model 2 -->
    <text x="120" y="520">Model 2</text>
    <text x="220" y="520">X₁, X₂</text>
    <text x="320" y="520">0.743</text>
    <text x="380" y="520">0.735</text>
    <text x="460" y="520">228.6</text>
    <text x="520" y="520">237.2</text>
    <text x="580" y="520">2.12</text>
    <text x="640" y="520">144.8</text>
    
    <!-- Model 3 -->
    <rect x="110" y="527" width="580" height="18" fill="#dcfce7" rx="2"/>
    <text x="120" y="540" font-weight="bold">Model 3</text>
    <text x="220" y="540">X₁, X₂, X₃</text>
    <text x="320" y="540" font-weight="bold">0.821</text>
    <text x="380" y="540" font-weight="bold">0.809</text>
    <text x="460" y="540" font-weight="bold">214.2</text>
    <text x="520" y="540" font-weight="bold">225.1</text>
    <text x="580" y="540" font-weight="bold">1.73</text>
    <text x="640" y="540" font-weight="bold">152.3</text>
    
    <!-- Model 4 -->
    <text x="120" y="560">Model 4</text>
    <text x="220" y="560">X₁, X₂, X₃, X₄</text>
    <text x="320" y="560">0.827</text>
    <text x="380" y="560">0.807</text>
    <text x="460" y="560">216.8</text>
    <text x="520" y="560">230.0</text>
    <text x="580" y="560">1.71</text>
    <text x="640" y="560">127.4</text>
  </g>
  
  <!-- Best model indicator -->
  <text x="710" y="540" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#16a34a">← Best</text>
  
  <!-- Key insights -->
  <g font-family="Arial, sans-serif" font-size="11" fill="#64748b">
    <text x="100" y="575">• Model 3 selected: Highest Adj. R², Lowest AIC/BIC balance, Good MSE reduction</text>
    <text x="100" y="590">• Diminishing returns: Model 4 shows overfitting (lower Adj. R² despite higher R²)</text>
  </g>
</svg>