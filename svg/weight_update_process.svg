<svg viewBox="0 0 1100 650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="processGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="positiveGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="negativeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27ae60;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="updateGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1abc9c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a085;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/>
    </marker>
    <marker id="redarrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
    <marker id="greenarrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#27ae60"/>
    </marker>
    <marker id="tealarrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1abc9c"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="550" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#2c3e50">
    Weight Update Process Flow
  </text>
  
  <!-- Step 1: Current Weight -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="150" height="70" fill="#ecf0f1" stroke="#95a5a6" stroke-width="2" rx="10" filter="url(#shadow)"/>
    <text x="75" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Current Weight</text>
    <text x="75" y="45" text-anchor="middle" font-family="monospace" font-size="18" fill="#e74c3c">w_ij^(t)</text>
    <text x="75" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">at iteration t</text>
  </g>
  
  <!-- Step 2: Compute Gradient -->
  <g transform="translate(250, 80)">
    <rect x="0" y="0" width="150" height="70" fill="#e8f6f3" stroke="#1abc9c" stroke-width="2" rx="10" filter="url(#shadow)"/>
    <text x="75" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Compute Gradient</text>
    <text x="75" y="45" text-anchor="middle" font-family="monospace" font-size="18" fill="#16a085">∂L/∂w_ij</text>
    <text x="75" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">partial derivative</text>
  </g>
  
  <!-- Step 3: Decision Point -->
  <g transform="translate(450, 80)">
    <rect x="0" y="0" width="150" height="70" fill="#fff3cd" stroke="#f39c12" stroke-width="2" rx="10" filter="url(#shadow)"/>
    <text x="75" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Gradient Sign</text>
    <text x="75" y="43" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Analysis</text>
    <text x="75" y="60" text-anchor="middle" font-family="monospace" font-size="12" fill="#8e44ad">∂L/∂w_ij ?</text>
  </g>
  
  <!-- Negative Gradient Path -->
  <g transform="translate(200, 200)">
    <rect x="0" y="0" width="200" height="70" fill="#d5f4e6" stroke="#27ae60" stroke-width="2" rx="10" filter="url(#shadow)"/>
    <text x="100" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e8449">Negative Gradient (∂L/∂w &lt; 0)</text>
    <text x="100" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e8449">→ INCREASE Weight</text>
    <text x="100" y="55" text-anchor="middle" font-family="monospace" font-size="13" fill="#27ae60">w_new = w + α|∂L/∂w|</text>
  </g>
  
  <!-- Positive Gradient Path -->
  <g transform="translate(500, 200)">
    <rect x="0" y="0" width="200" height="70" fill="#fadbd8" stroke="#e74c3c" stroke-width="2" rx="10" filter="url(#shadow)"/>
    <text x="100" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#c0392b">Positive Gradient (∂L/∂w &gt; 0)</text>
    <text x="100" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#c0392b">→ DECREASE Weight</text>
    <text x="100" y="55" text-anchor="middle" font-family="monospace" font-size="13" fill="#e74c3c">w_new = w - α|∂L/∂w|</text>
  </g>
  
  <!-- Updated Weight -->
  <g transform="translate(350, 320)">
    <rect x="0" y="0" width="200" height="70" fill="#e8f8f5" stroke="#1abc9c" stroke-width="3" rx="15" filter="url(#shadow)"/>
    <text x="100" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#16a085">Updated Weight</text>
    <text x="100" y="48" text-anchor="middle" font-family="monospace" font-size="20" fill="#1abc9c">w_ij^(t+1)</text>
    <text x="100" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">for next iteration</text>
  </g>
  
  <!-- Horizontal flow arrows -->
  <g stroke="#2c3e50" stroke-width="2" fill="#2c3e50">
    <path d="M 200 115 L 250 115" marker-end="url(#arrowhead)"/>
    <path d="M 400 115 L 450 115" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- Decision branch arrows -->
  <g stroke="#27ae60" stroke-width="3" fill="none">
    <path d="M 500 150 L 350 200" marker-end="url(#greenarrow)"/>
    <text x="400" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#27ae60" font-weight="bold">Negative</text>
  </g>
  
  <g stroke="#e74c3c" stroke-width="3" fill="none">
    <path d="M 550 150 L 650 200" marker-end="url(#redarrow)"/>
    <text x="625" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#e74c3c" font-weight="bold">Positive</text>
  </g>
  
  <!-- Convergence arrows -->
  <g stroke="#1abc9c" stroke-width="3" fill="none">
    <path d="M 350 270 L 420 320" marker-end="url(#tealarrow)"/>
    <path d="M 650 270 L 480 320" marker-end="url(#tealarrow)"/>
  </g>
  
  <!-- Mathematical Visualization Panel -->
  <g transform="translate(750, 80)">
    <rect x="0" y="0" width="300" height="210" fill="#f4f4f4" stroke="#95a5a6" stroke-width="2" rx="10" filter="url(#shadow)"/>
    <text x="150" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Update Rule Visualization</text>
    
    <text x="150" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50" font-weight="bold">General Update Rule:</text>
    <text x="150" y="80" text-anchor="middle" font-family="monospace" font-size="16" fill="#8e44ad">w_new = w_old - α × ∂L/∂w</text>
    
    <text x="150" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">If ∂L/∂w &gt; 0: decrease weight (move left)</text>
    <text x="150" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">If ∂L/∂w &lt; 0: increase weight (move right)</text>
    
    <text x="150" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#e74c3c" font-weight="bold">Goal: Minimize Loss</text>
    <text x="150" y="185" text-anchor="middle" font-family="monospace" font-size="14" fill="#16a085">L(w_new) &lt; L(w_old)</text>
  </g>
  
  <!-- Key Insight Box -->
  <g transform="translate(50, 430)">
    <rect x="0" y="0" width="1000" height="100" fill="#f8f9fa" stroke="#6c757d" stroke-width="2" rx="15" filter="url(#shadow)"/>
    <text x="500" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#495057">Key Insight</text>
    
    <text x="500" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#495057">
      Always move in the <tspan font-weight="bold" fill="#e74c3c">opposite direction</tspan> of the gradient to minimize loss
    </text>
    
    <text x="500" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#495057">
      Learning rate α controls <tspan font-weight="bold" fill="#3498db">step size</tspan>: 
      <tspan fill="#8e44ad" font-family="monospace">ΔL = -α × (∂L/∂w)² &lt; 0</tspan> when α &gt; 0
    </text>
  </g>
  
  <!-- Learning Rate Impact Section -->
  <g transform="translate(50, 560)">
    <rect x="0" y="0" width="1000" height="70" fill="#fff3cd" stroke="#f39c12" stroke-width="2" rx="10" filter="url(#shadow)"/>
    <text x="500" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#d68910">Learning Rate Impact on Training</text>
    
    <text x="150" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#e74c3c" font-weight="bold">α too large → overshooting</text>
    <text x="500" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#27ae60" font-weight="bold">α optimal → smooth convergence</text>
    <text x="850" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#3498db" font-weight="bold">α too small → slow training</text>
  </g>
</svg>