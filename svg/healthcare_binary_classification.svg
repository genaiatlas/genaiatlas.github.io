<svg viewBox="0 0 1000 680" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="680" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">Healthcare Binary Classification Systems</text>
  
  <!-- Emergency Diagnosis Flow -->
  <g transform="translate(50, 70)">
    <text x="400" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#d32f2f">🚨 Emergency Heart Attack Diagnosis</text>
  </g>
  
  <!-- Patient Symptoms -->
  <g transform="translate(80, 120)">
    <rect x="-40" y="-40" width="80" height="80" fill="#ffebee" stroke="#d32f2f" stroke-width="2" rx="10"/>
    <text x="0" y="-25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#d32f2f">🤕 Patient</text>
    <text x="0" y="-8" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#d32f2f">Chest pain</text>
    <text x="0" y="4" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#d32f2f">Shortness of breath</text>
    <text x="0" y="16" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#d32f2f">Heart palpitations</text>
    <text x="0" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#d32f2f">Sweating/nausea</text>
  </g>
  
  <!-- Arrow 1 -->
  <path d="M 140 150 L 200 150" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="170" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">&lt; 5 min</text>
  
  <!-- Clinical Assessment -->
  <g transform="translate(260, 120)">
    <rect x="-60" y="-40" width="120" height="80" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="10"/>
    <text x="0" y="-25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1976d2">🩺 Clinical Data</text>
    <text x="0" y="-8" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#1976d2">ECG readings</text>
    <text x="0" y="4" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#1976d2">Blood pressure</text>
    <text x="0" y="16" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#1976d2">Troponin levels</text>
    <text x="0" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#1976d2">Patient history</text>
  </g>
  
  <!-- Arrow 2 -->
  <path d="M 340 150 L 400 150" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="370" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">~2 min</text>
  
  <!-- Diagnostic Model -->
  <g transform="translate(480, 120)">
    <rect x="-60" y="-50" width="120" height="100" fill="#e8f5e8" stroke="#4caf50" stroke-width="2" rx="10"/>
    <text x="0" y="-35" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2e7d32">🧠 AI Diagnosis</text>
    <text x="0" y="-20" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2e7d32">Support System</text>
    
    <!-- Decision tree visualization -->
    <g transform="translate(0, -5)">
      <rect x="-40" y="0" width="80" height="15" fill="#c8e6c9" stroke="#4caf50" stroke-width="1" rx="3"/>
      <text x="0" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2e7d32">Troponin &gt; 0.04?</text>
      
      <!-- Decision branches -->
      <line x1="-20" y1="15" x2="-32" y2="25" stroke="#4caf50" stroke-width="1"/>
      <line x1="20" y1="15" x2="32" y2="25" stroke="#4caf50" stroke-width="1"/>
      
      <rect x="-50" y="25" width="35" height="12" fill="#ffcdd2" stroke="#f44336" stroke-width="1" rx="2"/>
      <text x="-32" y="33" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#c62828">High: 0.8</text>
      
      <rect x="15" y="25" width="35" height="12" fill="#c8e6c9" stroke="#4caf50" stroke-width="1" rx="2"/>
      <text x="32" y="33" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#2e7d32">Low: 0.2</text>
    </g>
    
    <text x="0" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Risk Probability: 0.85</text>
  </g>
  
  <!-- Arrow 3 -->
  <path d="M 560 150 L 620 150" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="590" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">&lt; 1 min</text>
  
  <!-- Medical Decision -->
  <g transform="translate(700, 120)">
    <rect x="-60" y="-40" width="120" height="80" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="10"/>
    <text x="0" y="-20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f57c00">👨‍⚕️ Doctor</text>
    <text x="0" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f57c00">Decision</text>
    <text x="0" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">AI Risk: 85%</text>
    <text x="0" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#f57c00">→ HEART ATTACK</text>
  </g>
  
  <!-- Decision Split Arrow -->
  <path d="M 780 150 L 820 150" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Treatment Actions -->
  <g transform="translate(850, 150)">
    <circle cx="0" cy="0" r="15" fill="#666"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">?</text>
  </g>
  
  <!-- Emergency Treatment -->
  <g transform="translate(920, 100)">
    <rect x="-40" y="-25" width="80" height="50" fill="#ffebee" stroke="#d32f2f" stroke-width="2" rx="5"/>
    <text x="0" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#d32f2f">🚑 Emergency</text>
    <text x="0" y="3" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#d32f2f">Treatment</text>
    <text x="0" y="16" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#d32f2f">Immediate intervention</text>
  </g>
  
  <!-- Regular Care -->
  <g transform="translate(920, 200)">
    <rect x="-40" y="-25" width="80" height="50" fill="#e8f5e8" stroke="#388e3c" stroke-width="2" rx="5"/>
    <text x="0" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#388e3c">🏥 Regular</text>
    <text x="0" y="3" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#388e3c">Monitoring</text>
    <text x="0" y="16" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#388e3c">Continued observation</text>
  </g>
  
  <!-- Arrows to treatments -->
  <path d="M 860 140 L 890 115" stroke="#d32f2f" stroke-width="3" fill="none" marker-end="url(#arrowhead_red)"/>
  <text x="875" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#d32f2f" transform="rotate(-30 875 125)">HIGH RISK</text>
  
  <path d="M 860 160 L 890 185" stroke="#388e3c" stroke-width="2" fill="none" marker-end="url(#arrowhead_green)"/>
  <text x="875" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#388e3c" transform="rotate(30 875 175)">LOW RISK</text>
  
  <!-- Medical Fraud Detection Section -->
  <g transform="translate(50, 290)">
    <text x="400" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#9c27b0">💰 Medical Fraud Detection</text>
  </g>
  
  <!-- Insurance Claim -->
  <g transform="translate(80, 340)">
    <rect x="-50" y="-30" width="100" height="60" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2" rx="10"/>
    <text x="0" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#9c27b0">📄 Insurance</text>
    <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#9c27b0">Claim</text>
    <text x="0" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#9c27b0">$5,000 surgery</text>
  </g>
  
  <!-- Arrow -->
  <path d="M 150 370 L 220 370" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="185" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Instant</text>
  
  <!-- Claim Analysis -->
  <g transform="translate(300, 340)">
    <rect x="-60" y="-40" width="120" height="80" fill="#fff8e1" stroke="#fbc02d" stroke-width="2" rx="10"/>
    <text x="0" y="-25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f57c00">🔍 Claim</text>
    <text x="0" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f57c00">Analysis</text>
    <text x="0" y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">• Provider history</text>
    <text x="0" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">• Patient records</text>
    <text x="0" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">• Billing patterns</text>
  </g>
  
  <!-- Arrow -->
  <path d="M 380 370 L 450 370" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="415" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">~30 sec</text>
  
  <!-- Fraud Detection Model -->
  <g transform="translate(530, 340)">
    <rect x="-60" y="-50" width="120" height="100" fill="#fce4ec" stroke="#e91e63" stroke-width="2" rx="10"/>
    <text x="0" y="-35" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#c2185b">🤖 Fraud</text>
    <text x="0" y="-20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#c2185b">Detection AI</text>
    
    <!-- Anomaly detection visualization -->
    <g transform="translate(0, -5)">
      <!-- Normal pattern cluster -->
      <circle cx="-20" cy="5" r="3" fill="#4caf50" opacity="0.7"/>
      <circle cx="-15" cy="8" r="3" fill="#4caf50" opacity="0.7"/>
      <circle cx="-10" cy="6" r="3" fill="#4caf50" opacity="0.7"/>
      <circle cx="-5" cy="7" r="3" fill="#4caf50" opacity="0.7"/>
      <circle cx="0" cy="5" r="3" fill="#4caf50" opacity="0.7"/>
      
      <!-- Anomalous point -->
      <circle cx="20" cy="20" r="5" fill="#f44336" opacity="0.9" stroke="#d32f2f" stroke-width="1"/>
      <text x="20" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#f44336">Anomaly</text>
    </g>
    
    <text x="0" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Fraud Score: 0.92</text>
  </g>
  
  <!-- Arrow -->
  <path d="M 610 370 L 680 370" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="645" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">&lt; 1 sec</text>
  
  <!-- Fraud Decision -->
  <g transform="translate(760, 340)">
    <rect x="-60" y="-40" width="120" height="80" fill="#e8f5e8" stroke="#4caf50" stroke-width="2" rx="10"/>
    <text x="0" y="-20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2e7d32">⚖️ Decision</text>
    <text x="0" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2e7d32">Engine</text>
    <text x="0" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Score: 0.92 &gt; 0.7</text>
    <text x="0" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#d32f2f">→ FLAG FOR REVIEW</text>
  </g>
  
  <!-- Investigation outcome -->
  <g transform="translate(900, 370)">
    <rect x="-40" y="-20" width="80" height="40" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="5"/>
    <text x="0" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#f57c00">🔎 Investigation</text>
    <text x="0" y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#f57c00">Human review</text>
  </g>
  
  <!-- Arrow to investigation -->
  <path d="M 840 370 L 870 370" stroke="#ff9800" stroke-width="2" fill="none" marker-end="url(#arrowhead_orange)"/>
  
  <!-- Key Metrics Comparison -->
  <g transform="translate(50, 460)">
    <rect x="0" y="0" width="900" height="160" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="10"/>
    <text x="450" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">Healthcare Classification: Key Considerations</text>
    
    <!-- Emergency Diagnosis -->
    <g transform="translate(30, 35)">
      <rect x="0" y="0" width="200" height="105" fill="#ffebee" stroke="#d32f2f" stroke-width="1" rx="5"/>
      <text x="100" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#d32f2f">Emergency Diagnosis</text>
      <text x="10" y="30" font-family="Arial, sans-serif" font-size="10" fill="#666">⏱️ Speed: Critical (&lt; 5 minutes)</text>
      <text x="10" y="45" font-family="Arial, sans-serif" font-size="10" fill="#666">🎯 Accuracy: 99%+ required</text>
      <text x="10" y="60" font-family="Arial, sans-serif" font-size="10" fill="#666">⚠️ Cost of error: Life threatening</text>
      <text x="10" y="75" font-family="Arial, sans-serif" font-size="10" fill="#666">👨‍⚕️ Interpretability: High (doctor oversight)</text>
      <text x="10" y="90" font-family="Arial, sans-serif" font-size="10" fill="#666">📋 Regulation: FDA/medical standards</text>
    </g>
    
    <!-- Medical Imaging -->
    <g transform="translate(250, 35)">
      <rect x="0" y="0" width="200" height="105" fill="#e3f2fd" stroke="#1976d2" stroke-width="1" rx="5"/>
      <text x="100" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1976d2">Medical Imaging (CAD)</text>
      <text x="10" y="30" font-family="Arial, sans-serif" font-size="10" fill="#666">⏱️ Speed: Minutes to hours</text>
      <text x="10" y="45" font-family="Arial, sans-serif" font-size="10" fill="#666">🎯 Accuracy: 99.5%+ required</text>
      <text x="10" y="60" font-family="Arial, sans-serif" font-size="10" fill="#666">⚠️ Cost of error: Misdiagnosis</text>
      <text x="10" y="75" font-family="Arial, sans-serif" font-size="10" fill="#666">👨‍⚕️ Interpretability: Medium (CAD assist)</text>
      <text x="10" y="90" font-family="Arial, sans-serif" font-size="10" fill="#666">📋 Regulation: FDA Class II device</text>
    </g>
    
    <!-- Drug Discovery -->
    <g transform="translate(470, 35)">
      <rect x="0" y="0" width="200" height="105" fill="#e8f5e8" stroke="#388e3c" stroke-width="1" rx="5"/>
      <text x="100" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#388e3c">Drug Effectiveness</text>
      <text x="10" y="30" font-family="Arial, sans-serif" font-size="10" fill="#666">⏱️ Speed: Months to years</text>
      <text x="10" y="45" font-family="Arial, sans-serif" font-size="10" fill="#666">🎯 Accuracy: Statistical significance</text>
      <text x="10" y="60" font-family="Arial, sans-serif" font-size="10" fill="#666">⚠️ Cost of error: Failed trials ($M)</text>
      <text x="10" y="75" font-family="Arial, sans-serif" font-size="10" fill="#666">👨‍⚕️ Interpretability: Very high (explainable)</text>
      <text x="10" y="90" font-family="Arial, sans-serif" font-size="10" fill="#666">📋 Regulation: FDA clinical trials</text>
    </g>
    
    <!-- Fraud Detection -->
    <g transform="translate(690, 35)">
      <rect x="0" y="0" width="180" height="105" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1" rx="5"/>
      <text x="90" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#9c27b0">Medical Fraud</text>
      <text x="10" y="30" font-family="Arial, sans-serif" font-size="10" fill="#666">⏱️ Speed: Real-time to batch</text>
      <text x="10" y="45" font-family="Arial, sans-serif" font-size="10" fill="#666">🎯 Accuracy: 90-95% acceptable</text>
      <text x="10" y="60" font-family="Arial, sans-serif" font-size="10" fill="#666">⚠️ Cost of error: Financial loss</text>
      <text x="10" y="75" font-family="Arial, sans-serif" font-size="10" fill="#666">👨‍⚕️ Interpretability: Medium</text>
      <text x="10" y="90" font-family="Arial, sans-serif" font-size="10" fill="#666">📋 Regulation: Insurance compliance</text>
    </g>
  </g>
  
  <!-- Ethical Considerations -->
  <g transform="translate(50, 640)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#d32f2f">⚕️ Critical Ethical Considerations:</text>
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="12" fill="#666">🔒 Patient Privacy (HIPAA) • ⚖️ Algorithmic Bias &amp; Fairness • 👨‍⚕️ Human Oversight Requirements • 📋 Regulatory Compliance (FDA/CMS)</text>
  </g>
  
  <!-- Arrow marker definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
            refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowhead_red" markerWidth="10" markerHeight="7" 
            refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d32f2f"/>
    </marker>
    <marker id="arrowhead_green" markerWidth="10" markerHeight="7" 
            refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#388e3c"/>
    </marker>
    <marker id="arrowhead_orange" markerWidth="10" markerHeight="7" 
            refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff9800"/>
    </marker>
  </defs>
</svg>