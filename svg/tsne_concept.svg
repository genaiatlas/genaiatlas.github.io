<svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="highDimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0.6" />
    </linearGradient>
    <linearGradient id="lowDimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:0.6" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="400" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1e293b">
    t-SNE: High-Dimensional to Low-Dimensional Embedding
  </text>
  
  <!-- High-dimensional space -->
  <g transform="translate(80,80)">
    <rect x="0" y="0" width="200" height="180" rx="10" fill="url(#highDimGrad)" stroke="#4338ca" stroke-width="2" filter="url(#shadow)"/>
    <text x="100" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
      High-Dimensional Space
    </text>
    <text x="100" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
      (e.g., 64D for MNIST)
    </text>
    
    <!-- Data points in 3D representation -->
    <g transform="translate(20,60)">
      <!-- Cluster 1 -->
      <circle cx="40" cy="30" r="4" fill="#fbbf24" opacity="0.9"/>
      <circle cx="45" cy="35" r="4" fill="#fbbf24" opacity="0.9"/>
      <circle cx="35" cy="38" r="4" fill="#fbbf24" opacity="0.9"/>
      <circle cx="42" cy="25" r="4" fill="#fbbf24" opacity="0.9"/>
      
      <!-- Cluster 2 -->
      <circle cx="120" cy="40" r="4" fill="#f87171" opacity="0.9"/>
      <circle cx="125" cy="45" r="4" fill="#f87171" opacity="0.9"/>
      <circle cx="115" cy="48" r="4" fill="#f87171" opacity="0.9"/>
      <circle cx="122" cy="35" r="4" fill="#f87171" opacity="0.9"/>
      
      <!-- Cluster 3 -->
      <circle cx="80" cy="80" r="4" fill="#a78bfa" opacity="0.9"/>
      <circle cx="85" cy="85" r="4" fill="#a78bfa" opacity="0.9"/>
      <circle cx="75" cy="88" r="4" fill="#a78bfa" opacity="0.9"/>
      <circle cx="82" cy="75" r="4" fill="#a78bfa" opacity="0.9"/>
    </g>
    
    <!-- Axes labels -->
    <text x="10" y="190" font-family="Arial, sans-serif" font-size="10" fill="white">X₁</text>
    <text x="185" y="190" font-family="Arial, sans-serif" font-size="10" fill="white">X₆₄</text>
    <text x="100" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">... many dimensions ...</text>
  </g>
  
  <!-- Arrow -->
  <g transform="translate(350,160)">
    <path d="M 0 0 L 120 0" stroke="#374151" stroke-width="3" marker-end="url(#arrowhead)"/>
    <text x="60" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#374151">
      t-SNE
    </text>
    <text x="60" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">
      Minimize KL Divergence
    </text>
  </g>
  
  <!-- Low-dimensional space -->
  <g transform="translate(520,80)">
    <rect x="0" y="0" width="200" height="180" rx="10" fill="url(#lowDimGrad)" stroke="#047857" stroke-width="2" filter="url(#shadow)"/>
    <text x="100" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
      Low-Dimensional Space
    </text>
    <text x="100" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
      (2D for visualization)
    </text>
    
    <!-- Preserved clusters in 2D -->
    <g transform="translate(20,60)">
      <!-- Cluster 1 - preserved -->
      <circle cx="40" cy="30" r="5" fill="#fbbf24" opacity="0.9"/>
      <circle cx="45" cy="35" r="5" fill="#fbbf24" opacity="0.9"/>
      <circle cx="35" cy="38" r="5" fill="#fbbf24" opacity="0.9"/>
      <circle cx="42" cy="25" r="5" fill="#fbbf24" opacity="0.9"/>
      
      <!-- Cluster 2 - preserved -->
      <circle cx="140" cy="40" r="5" fill="#f87171" opacity="0.9"/>
      <circle cx="145" cy="45" r="5" fill="#f87171" opacity="0.9"/>
      <circle cx="135" cy="48" r="5" fill="#f87171" opacity="0.9"/>
      <circle cx="142" cy="35" r="5" fill="#f87171" opacity="0.9"/>
      
      <!-- Cluster 3 - preserved -->
      <circle cx="90" cy="90" r="5" fill="#a78bfa" opacity="0.9"/>
      <circle cx="95" cy="95" r="5" fill="#a78bfa" opacity="0.9"/>
      <circle cx="85" cy="98" r="5" fill="#a78bfa" opacity="0.9"/>
      <circle cx="92" cy="85" r="5" fill="#a78bfa" opacity="0.9"/>
      
      <!-- Cluster boundaries -->
      <ellipse cx="40" cy="32" rx="15" ry="12" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="3,3" opacity="0.7"/>
      <ellipse cx="141" cy="42" rx="15" ry="12" fill="none" stroke="#f87171" stroke-width="2" stroke-dasharray="3,3" opacity="0.7"/>
      <ellipse cx="90" cy="92" rx="15" ry="12" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="3,3" opacity="0.7"/>
    </g>
    
    <!-- Axes -->
    <path d="M 25 150 L 175 150" stroke="white" stroke-width="1"/>
    <path d="M 25 150 L 25 70" stroke="white" stroke-width="1"/>
    <text x="175" y="165" font-family="Arial, sans-serif" font-size="10" fill="white">Y₁</text>
    <text x="15" y="70" font-family="Arial, sans-serif" font-size="10" fill="white">Y₂</text>
  </g>
  
  <!-- Key insight box -->
  <g transform="translate(780,100)">
    <rect x="0" y="0" width="200" height="140" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="100" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#92400e">
      Key Insight
    </text>
    <text x="10" y="40" font-family="Arial, sans-serif" font-size="11" fill="#92400e">
      • Preserves local neighborhoods
    </text>
    <text x="10" y="55" font-family="Arial, sans-serif" font-size="11" fill="#92400e">
      • Separates distinct clusters
    </text>
    <text x="10" y="70" font-family="Arial, sans-serif" font-size="11" fill="#92400e">
      • Non-linear transformation
    </text>
    <text x="10" y="85" font-family="Arial, sans-serif" font-size="11" fill="#92400e">
      • Probabilistic approach
    </text>
    <text x="10" y="100" font-family="Arial, sans-serif" font-size="11" fill="#92400e">
      • Uses t-distribution
    </text>
    <text x="10" y="120" font-family="Arial, sans-serif" font-size="10" fill="#92400e">
      Result: Clear cluster visualization
    </text>
  </g>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#374151"/>
    </marker>
  </defs>
</svg>