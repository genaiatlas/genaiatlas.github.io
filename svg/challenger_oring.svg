<svg width="900" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#00000030"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="600" fill="url(#backgroundGradient)"/>
  
  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#212529">Challenger Disaster: O-Ring Failure Analysis</text>
  <text x="450" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6c757d">January 28, 1986 - Temperature: 31°F (-0.6°C)</text>
  
  <!-- Temperature Scale -->
  <rect x="50" y="90" width="800" height="60" fill="white" stroke="#495057" stroke-width="2" rx="5" filter="url(#shadow)"/>
  <text x="450" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#212529">Temperature Scale (°F)</text>
  
  <!-- Temperature gradient bar -->
  <defs>
    <linearGradient id="tempGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d6efd;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#20c997;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#ffc107;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dc3545;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect x="80" y="120" width="740" height="20" fill="url(#tempGradient)" rx="3"/>
  
  <!-- Temperature markers -->
  <g font-family="Arial, sans-serif" font-size="12" fill="#495057">
    <line x1="80" y1="115" x2="80" y2="145" stroke="#495057" stroke-width="2"/>
    <text x="80" y="160" text-anchor="middle">20°F</text>
    
    <line x1="265" y1="115" x2="265" y2="145" stroke="#495057" stroke-width="2"/>
    <text x="265" y="160" text-anchor="middle">40°F</text>
    
    <line x1="450" y1="115" x2="450" y2="145" stroke="#495057" stroke-width="2"/>
    <text x="450" y="160" text-anchor="middle">60°F</text>
    
    <line x1="635" y1="115" x2="635" y2="145" stroke="#495057" stroke-width="2"/>
    <text x="635" y="160" text-anchor="middle">80°F</text>
    
    <line x1="820" y1="115" x2="820" y2="145" stroke="#495057" stroke-width="2"/>
    <text x="820" y="160" text-anchor="middle">100°F</text>
  </g>
  
  <!-- Launch day temperature marker -->
  <line x1="140" y1="105" x2="140" y2="155" stroke="#dc3545" stroke-width="4" filter="url(#glow)"/>
  <polygon points="140,100 135,110 145,110" fill="#dc3545"/>
  <text x="140" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#dc3545">Launch Day: 31°F</text>
  
  <!-- O-Ring System Diagram -->
  <rect x="50" y="200" width="400" height="300" fill="white" stroke="#495057" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="250" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#212529">Solid Rocket Booster O-Ring System</text>
  
  <!-- Simplified rocket segment -->
  <rect x="80" y="250" width="340" height="200" fill="#f8f9fa" stroke="#6c757d" stroke-width="2" rx="5"/>
  
  <!-- O-ring positions -->
  <g stroke="#dc3545" stroke-width="3" fill="none">
    <circle cx="120" cy="280" r="8"/>
    <circle cx="200" cy="280" r="8"/>
    <circle cx="280" cy="280" r="8"/>
    <circle cx="360" cy="280" r="8"/>
    <circle cx="240" cy="350" r="8"/>
  </g>
  
  <!-- O-ring labels -->
  <g font-family="Arial, sans-serif" font-size="11" fill="#dc3545" font-weight="bold">
    <text x="120" y="270" text-anchor="middle">O1</text>
    <text x="200" y="270" text-anchor="middle">O2</text>
    <text x="280" y="270" text-anchor="middle">O3</text>
    <text x="360" y="270" text-anchor="middle">O4</text>
    <text x="240" y="340" text-anchor="middle">O5</text>
  </g>
  
  <!-- Joint details -->
  <rect x="90" y="320" width="300" height="80" fill="#fff3cd" stroke="#856404" stroke-width="1" rx="5"/>
  <text x="240" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#856404">Critical Joint</text>
  <text x="240" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#856404">All 5 O-rings must function</text>
  <text x="240" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#856404">for mission success</text>
  <text x="240" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#dc3545">Single point of failure!</text>
  
  <!-- Probability Analysis Box -->
  <rect x="480" y="200" width="370" height="300" fill="white" stroke="#495057" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="665" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#212529">Failure Probability Analysis</text>
  
  <!-- Temperature effect chart -->
  <rect x="500" y="250" width="330" height="150" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1" rx="5"/>
  <text x="665" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#495057">P(O-ring Failure) vs Temperature</text>
  
  <!-- Simple scatter plot showing temperature vs failure -->
  <g>
    <!-- Axes -->
    <line x1="520" y1="380" x2="810" y2="380" stroke="#495057" stroke-width="1"/>
    <line x1="520" y1="290" x2="520" y2="380" stroke="#495057" stroke-width="1"/>
    
    <!-- Data points -->
    <circle cx="540" cy="310" r="4" fill="#dc3545" opacity="0.8"/>
    <circle cx="560" cy="320" r="4" fill="#dc3545" opacity="0.8"/>
    <circle cx="580" cy="340" r="4" fill="#ffc107" opacity="0.8"/>
    <circle cx="620" cy="355" r="4" fill="#28a745" opacity="0.8"/>
    <circle cx="660" cy="365" r="4" fill="#28a745" opacity="0.8"/>
    <circle cx="700" cy="370" r="4" fill="#28a745" opacity="0.8"/>
    <circle cx="740" cy="372" r="4" fill="#28a745" opacity="0.8"/>
    <circle cx="780" cy="374" r="4" fill="#28a745" opacity="0.8"/>
    
    <!-- Trend line -->
    <line x1="530" y1="300" x2="790" y2="375" stroke="#0d6efd" stroke-width="2" stroke-dasharray="5,3"/>
    
    <!-- Launch day indicator -->
    <line x1="545" y1="290" x2="545" y2="380" stroke="#dc3545" stroke-width="3" opacity="0.7"/>
    <text x="545" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#dc3545">31°F</text>
  </g>
  
  <!-- Legend -->
  <g font-family="Arial, sans-serif" font-size="10" fill="#495057">
    <text x="525" y="395" text-anchor="start">Low Temp</text>
    <text x="795" y="395" text-anchor="end">High Temp</text>
  </g>
  
  <!-- Key Statistics -->
  <rect x="500" y="420" width="330" height="70" fill="#fff3cd" stroke="#856404" stroke-width="1" rx="5"/>
  <text x="665" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#856404">Key Statistical Insights</text>
  <text x="510" y="455" font-family="Arial, sans-serif" font-size="11" fill="#495057">• Previous O-ring incidents occurred at higher temperatures</text>
  <text x="510" y="470" font-family="Arial, sans-serif" font-size="11" fill="#495057">• No data points existed below 53°F before launch</text>
  <text x="510" y="485" font-family="Arial, sans-serif" font-size="11" fill="#dc3545" font-weight="bold">• Launch temperature 22°F below previous minimum!</text>
  
  <!-- Bottom Timeline -->
  <rect x="50" y="520" width="800" height="60" fill="white" stroke="#495057" stroke-width="2" rx="5" filter="url(#shadow)"/>
  <text x="450" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#212529">Decision Timeline</text>
  
  <g font-family="Arial, sans-serif" font-size="11" fill="#495057">
    <circle cx="150" cy="555" r="6" fill="#ffc107"/>
    <text x="150" y="570" text-anchor="middle">Engineers warn</text>
    
    <circle cx="350" cy="555" r="6" fill="#fd7e14"/>
    <text x="350" y="570" text-anchor="middle">Management override</text>
    
    <circle cx="550" cy="555" r="6" fill="#28a745"/>
    <text x="550" y="570" text-anchor="middle">Launch approved</text>
    
    <circle cx="750" cy="555" r="6" fill="#dc3545"/>
    <text x="750" y="570" text-anchor="middle">Disaster occurs</text>
    
    <!-- Timeline line -->
    <line x1="150" y1="555" x2="750" y2="555" stroke="#6c757d" stroke-width="2"/>
  </g>
</svg>