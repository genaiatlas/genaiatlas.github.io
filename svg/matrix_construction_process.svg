<svg viewBox="0 0 1100 750" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title-text { font-family: 'Arial', sans-serif; font-size: 26px; font-weight: bold; fill: #2c3e50; }
      .section-text { font-family: 'Arial', sans-serif; font-size: 18px; font-weight: bold; fill: #34495e; }
      .matrix-text { font-family: 'Courier New', monospace; font-size: 16px; fill: #2c3e50; }
      .formula-text { font-family: 'Times New Roman', serif; font-size: 20px; font-weight: bold; fill: #e74c3c; }
      .label-text { font-family: 'Arial', sans-serif; font-size: 14px; fill: #2c3e50; }
      .highlight-text { font-family: 'Arial', sans-serif; font-size: 16px; font-weight: bold; fill: #8e44ad; }
      .positive-cell { fill: #2ecc71; stroke: #27ae60; stroke-width: 1; opacity: 0.7; }
      .negative-cell { fill: #e74c3c; stroke: #c0392b; stroke-width: 1; opacity: 0.7; }
      .zero-cell { fill: #ecf0f1; stroke: #bdc3c7; stroke-width: 1; }
      .matrix-border { fill: none; stroke: #34495e; stroke-width: 3; }
      .step-box { fill: none; stroke: #9b59b6; stroke-width: 2; stroke-dasharray: 5,3; }
      .node1 { fill: #3498db; stroke: #2980b9; stroke-width: 2; }
      .node2 { fill: #e74c3c; stroke: #c0392b; stroke-width: 2; }
      .edge-line { stroke: #2c3e50; stroke-width: 3; }
      .arrow { fill: none; stroke: #2c3e50; stroke-width: 2; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="550" y="35" text-anchor="middle" class="title-text">Modularity Matrix Construction Process</text>
  
  <!-- Step 1: Original Graph -->
  <text x="150" y="75" text-anchor="middle" class="section-text">Step 1: Original Graph</text>
  
  <rect x="50" y="85" width="200" height="150" class="step-box"/>
  
  <!-- Small example graph -->
  <circle cx="100" cy="130" r="12" class="node1"/>
  <circle cx="150" cy="110" r="12" class="node1"/>
  <circle cx="200" cy="130" r="12" class="node1"/>
  <circle cx="125" cy="180" r="12" class="node2"/>
  <circle cx="175" cy="180" r="12" class="node2"/>
  
  <!-- Node labels -->
  <text x="85" y="125" class="label-text">1</text>
  <text x="135" y="105" class="label-text">2</text>
  <text x="215" y="125" class="label-text">3</text>
  <text x="110" y="175" class="label-text">4</text>
  <text x="190" y="175" class="label-text">5</text>
  
  <!-- Edges -->
  <line x1="100" y1="130" x2="150" y2="110" class="edge-line"/>
  <line x1="150" y1="110" x2="200" y2="130" class="edge-line"/>
  <line x1="125" y1="180" x2="175" y2="180" class="edge-line"/>
  <line x1="150" y1="110" x2="125" y2="180" class="edge-line"/>
  
  <text x="70" y="210" class="label-text">Community 1: {1,2,3}</text>
  <text x="70" y="225" class="label-text">Community 2: {4,5}</text>
  
  <!-- Arrow -->
  <path d="M 270 160 L 320 160" class="arrow"/>
  
  <!-- Step 2: Adjacency Matrix -->
  <text x="450" y="75" text-anchor="middle" class="section-text">Step 2: Adjacency Matrix A</text>
  
  <rect x="350" y="85" width="200" height="150" class="step-box"/>
  
  <!-- Adjacency matrix -->
  <rect x="370" y="100" width="160" height="120" class="matrix-border"/>
  
  <!-- Matrix labels -->
  <text x="390" y="95" text-anchor="middle" class="matrix-text">1</text>
  <text x="420" y="95" text-anchor="middle" class="matrix-text">2</text>
  <text x="450" y="95" text-anchor="middle" class="matrix-text">3</text>
  <text x="480" y="95" text-anchor="middle" class="matrix-text">4</text>
  <text x="510" y="95" text-anchor="middle" class="matrix-text">5</text>
  
  <text x="360" y="115" class="matrix-text">1</text>
  <text x="360" y="135" class="matrix-text">2</text>
  <text x="360" y="155" class="matrix-text">3</text>
  <text x="360" y="175" class="matrix-text">4</text>
  <text x="360" y="195" class="matrix-text">5</text>
  
  <!-- Matrix entries -->
  <rect x="380" y="105" width="20" height="15" class="zero-cell"/>
  <text x="390" y="117" text-anchor="middle" class="matrix-text">0</text>
  <rect x="410" y="105" width="20" height="15" class="positive-cell"/>
  <text x="420" y="117" text-anchor="middle" class="matrix-text">1</text>
  <rect x="440" y="105" width="20" height="15" class="zero-cell"/>
  <text x="450" y="117" text-anchor="middle" class="matrix-text">0</text>
  <rect x="470" y="105" width="20" height="15" class="zero-cell"/>
  <text x="480" y="117" text-anchor="middle" class="matrix-text">0</text>
  <rect x="500" y="105" width="20" height="15" class="zero-cell"/>
  <text x="510" y="117" text-anchor="middle" class="matrix-text">0</text>
  
  <rect x="380" y="125" width="20" height="15" class="positive-cell"/>
  <text x="390" y="137" text-anchor="middle" class="matrix-text">1</text>
  <rect x="410" y="125" width="20" height="15" class="zero-cell"/>
  <text x="420" y="137" text-anchor="middle" class="matrix-text">0</text>
  <rect x="440" y="125" width="20" height="15" class="positive-cell"/>
  <text x="450" y="137" text-anchor="middle" class="matrix-text">1</text>
  <rect x="470" y="125" width="20" height="15" class="positive-cell"/>
  <text x="480" y="137" text-anchor="middle" class="matrix-text">1</text>
  <rect x="500" y="125" width="20" height="15" class="zero-cell"/>
  <text x="510" y="137" text-anchor="middle" class="matrix-text">0</text>
  
  <rect x="380" y="145" width="20" height="15" class="zero-cell"/>
  <text x="390" y="157" text-anchor="middle" class="matrix-text">0</text>
  <rect x="410" y="145" width="20" height="15" class="positive-cell"/>
  <text x="420" y="157" text-anchor="middle" class="matrix-text">1</text>
  <rect x="440" y="145" width="20" height="15" class="zero-cell"/>
  <text x="450" y="157" text-anchor="middle" class="matrix-text">0</text>
  <rect x="470" y="145" width="20" height="15" class="zero-cell"/>
  <text x="480" y="157" text-anchor="middle" class="matrix-text">0</text>
  <rect x="500" y="145" width="20" height="15" class="zero-cell"/>
  <text x="510" y="157" text-anchor="middle" class="matrix-text">0</text>
  
  <rect x="380" y="165" width="20" height="15" class="zero-cell"/>
  <text x="390" y="177" text-anchor="middle" class="matrix-text">0</text>
  <rect x="410" y="165" width="20" height="15" class="positive-cell"/>
  <text x="420" y="177" text-anchor="middle" class="matrix-text">1</text>
  <rect x="440" y="165" width="20" height="15" class="zero-cell"/>
  <text x="450" y="177" text-anchor="middle" class="matrix-text">0</text>
  <rect x="470" y="165" width="20" height="15" class="zero-cell"/>
  <text x="480" y="177" text-anchor="middle" class="matrix-text">0</text>
  <rect x="500" y="165" width="20" height="15" class="positive-cell"/>
  <text x="510" y="177" text-anchor="middle" class="matrix-text">1</text>
  
  <rect x="380" y="185" width="20" height="15" class="zero-cell"/>
  <text x="390" y="197" text-anchor="middle" class="matrix-text">0</text>
  <rect x="410" y="185" width="20" height="15" class="zero-cell"/>
  <text x="420" y="197" text-anchor="middle" class="matrix-text">0</text>
  <rect x="440" y="185" width="20" height="15" class="zero-cell"/>
  <text x="450" y="197" text-anchor="middle" class="matrix-text">0</text>
  <rect x="500" y="185" width="20" height="15" class="positive-cell"/>
  <text x="510" y="197" text-anchor="middle" class="matrix-text">1</text>
  <rect x="470" y="185" width="20" height="15" class="zero-cell"/>
  <text x="480" y="197" text-anchor="middle" class="matrix-text">0</text>
  
  <!-- Arrow -->
  <path d="M 570 160 L 620 160" class="arrow"/>
  
  <!-- Step 3: Expected Matrix -->
  <text x="750" y="75" text-anchor="middle" class="section-text">Step 3: Expected Matrix P</text>
  
  <rect x="650" y="85" width="200" height="150" class="step-box"/>
  
  <text x="750" y="105" text-anchor="middle" class="formula-text">P_ij = (k_i × k_j)/(2m)</text>
  <text x="680" y="125" class="label-text">k₁=1, k₂=3, k₃=1</text>
  <text x="680" y="140" class="label-text">k₄=2, k₅=1, m=4</text>
  
  <!-- Example calculations -->
  <text x="680" y="165" class="label-text">P₁₂ = (1×3)/(2×4) = 0.375</text>
  <text x="680" y="180" class="label-text">P₂₃ = (3×1)/(2×4) = 0.375</text>
  <text x="680" y="195" class="label-text">P₄₅ = (2×1)/(2×4) = 0.25</text>
  <text x="680" y="210" class="label-text">P₂₄ = (3×2)/(2×4) = 0.75</text>
  
  <!-- Step 4: Modularity Matrix -->
  <text x="300" y="280" text-anchor="middle" class="section-text">Step 4: Modularity Matrix B = A - P</text>
  
  <rect x="150" y="290" width="300" height="200" class="step-box"/>
  
  <!-- Modularity matrix -->
  <rect x="180" y="320" width="240" height="150" class="matrix-border"/>
  
  <!-- Matrix labels -->
  <text x="210" y="315" text-anchor="middle" class="matrix-text">1</text>
  <text x="240" y="315" text-anchor="middle" class="matrix-text">2</text>
  <text x="270" y="315" text-anchor="middle" class="matrix-text">3</text>
  <text x="300" y="315" text-anchor="middle" class="matrix-text">4</text>
  <text x="330" y="315" text-anchor="middle" class="matrix-text">5</text>
  
  <text x="170" y="335" class="matrix-text">1</text>
  <text x="170" y="355" class="matrix-text">2</text>
  <text x="170" y="375" class="matrix-text">3</text>
  <text x="170" y="395" class="matrix-text">4</text>
  <text x="170" y="415" class="matrix-text">5</text>
  
  <!-- Modularity matrix entries -->
  <rect x="200" y="325" width="30" height="15" class="zero-cell"/>
  <text x="215" y="337" text-anchor="middle" class="matrix-text">0</text>
  
  <rect x="230" y="325" width="30" height="15" class="positive-cell"/>
  <text x="245" y="337" text-anchor="middle" class="matrix-text">0.63</text>
  
  <rect x="260" y="325" width="30" height="15" class="negative-cell"/>
  <text x="275" y="337" text-anchor="middle" class="matrix-text">-0.13</text>
  
  <rect x="290" y="325" width="30" height="15" class="negative-cell"/>
  <text x="305" y="337" text-anchor="middle" class="matrix-text">-0.25</text>
  
  <rect x="320" y="325" width="30" height="15" class="negative-cell"/>
  <text x="335" y="337" text-anchor="middle" class="matrix-text">-0.13</text>
  
  <!-- Row 2 -->
  <rect x="200" y="345" width="30" height="15" class="positive-cell"/>
  <text x="215" y="357" text-anchor="middle" class="matrix-text">0.63</text>
  
  <rect x="230" y="345" width="30" height="15" class="zero-cell"/>
  <text x="245" y="357" text-anchor="middle" class="matrix-text">0</text>
  
  <rect x="260" y="345" width="30" height="15" class="positive-cell"/>
  <text x="275" y="357" text-anchor="middle" class="matrix-text">0.63</text>
  
  <rect x="290" y="345" width="30" height="15" class="positive-cell"/>
  <text x="305" y="357" text-anchor="middle" class="matrix-text">0.25</text>
  
  <rect x="320" y="345" width="30" height="15" class="negative-cell"/>
  <text x="335" y="357" text-anchor="middle" class="matrix-text">-0.38</text>
  
  <!-- Continue with remaining entries... -->
  <text x="300" y="485" text-anchor="middle" class="label-text">Green: Positive values (more edges than expected)</text>
  
  <!-- Arrow -->
  <path d="M 470 390 L 520 390" class="arrow"/>
  
  <!-- Step 5: Eigenvectors -->
  <text x="700" y="280" text-anchor="middle" class="section-text">Step 5: Find Eigenvectors</text>
  
  <rect x="550" y="290" width="300" height="200" class="step-box"/>
  
  <text x="700" y="320" text-anchor="middle" class="formula-text">B × v = λ × v</text>
  
  <text x="570" y="350" class="label-text">Leading eigenvector (largest λ):</text>
  <text x="570" y="370" class="matrix-text">v₁ = [+0.45, +0.60, +0.35, -0.55, -0.25]</text>
  
  <text x="570" y="400" class="label-text">Community assignment:</text>
  <text x="570" y="420" class="matrix-text">Positive values → Community 1: {1,2,3}</text>
  <text x="570" y="440" class="matrix-text">Negative values → Community 2: {4,5}</text>
  
  <text x="700" y="470" text-anchor="middle" class="highlight-text">Eigenvector sign determines community!</text>
  
  <!-- Bottom summary -->
  <rect x="100" y="520" width="900" height="80" fill="#ecf0f1" stroke="#34495e" stroke-width="2"/>
  <text x="550" y="545" text-anchor="middle" class="section-text">Matrix Construction Summary</text>
  <text x="200" y="570" class="label-text">1. A_ij: Adjacency (0/1)</text>
  <text x="400" y="570" class="label-text">2. P_ij: Expected probability</text>
  <text x="650" y="570" class="label-text">3. B_ij = A_ij - P_ij</text>
  <text x="850" y="570" class="label-text">4. Eigenvector partitioning</text>
  
  <text x="550" y="590" text-anchor="middle" class="highlight-text">Modularity matrix captures deviation from random baseline</text>
  
  <!-- Legend -->
  <rect x="50" y="630" width="250" height="80" fill="none" stroke="#34495e" stroke-width="1"/>
  <text x="175" y="650" text-anchor="middle" class="section-text">Legend</text>
  <rect x="70" y="660" width="20" height="15" class="positive-cell"/>
  <text x="100" y="672" class="label-text">More edges than expected</text>
  <rect x="70" y="680" width="20" height="15" class="negative-cell"/>
  <text x="100" y="692" class="label-text">Fewer edges than expected</text>
  
</svg>