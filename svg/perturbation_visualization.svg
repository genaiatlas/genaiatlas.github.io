<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: bold; }
      .label-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: 600; }
      .desc-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; }
      .math-text { font-family: 'Times New Roman', serif; font-size: 13px; font-style: italic; }
      .small-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10px; }
      .gradient-bg { fill: url(#bgGradient); }
      .card { fill: white; stroke: #e0e0e0; stroke-width: 2; rx: 8; ry: 8; }
      .arrow { stroke: #2196F3; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    </style>
    <defs>
      <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
      </linearGradient>
      <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#2196F3" />
      </marker>
      
      <!-- Gradient for perturbation strength -->
      <linearGradient id="perturbGradient" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
        <stop offset="50%" style="stop-color:#FF9800;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#F44336;stop-opacity:1" />
      </linearGradient>
      
      <!-- Dog pattern -->
      <pattern id="dogPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
        <rect width="20" height="20" fill="#8BC34A"/>
        <circle cx="6" cy="8" r="2" fill="#654321"/>
        <circle cx="14" cy="8" r="2" fill="#654321"/>
        <circle cx="10" cy="12" r="1" fill="#2E2E2E"/>
      </pattern>
    </defs>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" class="gradient-bg"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title-text" fill="#1565C0">The Perturbation Process: From Clean to Adversarial</text>
  
  <!-- Step 1: Original Image -->
  <rect x="50" y="60" width="120" height="120" class="card"/>
  <rect x="60" y="70" width="100" height="80" fill="#4CAF50" stroke="#388E3C" stroke-width="2"/>
  <text x="110" y="85" text-anchor="middle" class="small-text" fill="white">Golden</text>
  <text x="110" y="100" text-anchor="middle" class="small-text" fill="white">Retriever</text>
  <text x="110" y="130" text-anchor="middle" class="small-text" fill="white">🐕</text>
  <text x="110" y="195" text-anchor="middle" class="label-text" fill="#2E7D32">Step 1: Original</text>
  <text x="110" y="210" text-anchor="middle" class="desc-text" fill="#4CAF50">Confidence: 97.3%</text>
  <text x="110" y="225" text-anchor="middle" class="desc-text" fill="#4CAF50">Label: Dog</text>

  <!-- Arrow 1 -->
  <path d="M180 120 L220 120" class="arrow"/>
  <text x="200" y="115" text-anchor="middle" class="desc-text" fill="#2196F3">Add noise</text>

  <!-- Step 2: Small Perturbation -->
  <rect x="240" y="60" width="120" height="120" class="card"/>
  <rect x="250" y="70" width="100" height="80" fill="#4CAF50" stroke="#388E3C" stroke-width="2"/>
  <!-- Noise overlay -->
  <g opacity="0.3">
    <circle cx="265" cy="85" r="1" fill="#FF5722"/>
    <circle cx="275" cy="90" r="1" fill="#2196F3"/>
    <circle cx="285" cy="80" r="1" fill="#FF9800"/>
    <circle cx="295" cy="95" r="1" fill="#9C27B0"/>
    <circle cx="305" cy="85" r="1" fill="#607D8B"/>
    <circle cx="315" cy="105" r="1" fill="#795548"/>
    <circle cx="325" cy="95" r="1" fill="#E91E63"/>
    <circle cx="335" cy="115" r="1" fill="#00BCD4"/>
  </g>
  <text x="300" y="85" text-anchor="middle" class="small-text" fill="white">Golden</text>
  <text x="300" y="100" text-anchor="middle" class="small-text" fill="white">Retriever</text>
  <text x="300" y="130" text-anchor="middle" class="small-text" fill="white">🐕</text>
  <text x="300" y="195" text-anchor="middle" class="label-text" fill="#2E7D32">Step 2: ε = 0.01</text>
  <text x="300" y="210" text-anchor="middle" class="desc-text" fill="#4CAF50">Confidence: 95.7%</text>
  <text x="300" y="225" text-anchor="middle" class="desc-text" fill="#4CAF50">Still: Dog</text>

  <!-- Arrow 2 -->
  <path d="M370 120 L410 120" class="arrow"/>
  <text x="390" y="115" text-anchor="middle" class="desc-text" fill="#2196F3">Increase</text>

  <!-- Step 3: Medium Perturbation -->
  <rect x="430" y="60" width="120" height="120" class="card"/>
  <rect x="440" y="70" width="100" height="80" fill="#FF9800" stroke="#F57C00" stroke-width="2"/>
  <!-- More visible noise -->
  <g opacity="0.5">
    <circle cx="455" cy="85" r="1.5" fill="#FF5722"/>
    <circle cx="465" cy="90" r="1.5" fill="#2196F3"/>
    <circle cx="475" cy="80" r="1.5" fill="#FF9800"/>
    <circle cx="485" cy="95" r="1.5" fill="#9C27B0"/>
    <circle cx="495" cy="85" r="1.5" fill="#607D8B"/>
    <circle cx="505" cy="105" r="1.5" fill="#795548"/>
    <circle cx="515" cy="95" r="1.5" fill="#E91E63"/>
    <circle cx="525" cy="115" r="1.5" fill="#00BCD4"/>
    <!-- More noise points -->
    <circle cx="450" cy="110" r="1" fill="#CDDC39"/>
    <circle cx="460" cy="115" r="1" fill="#3F51B5"/>
    <circle cx="470" cy="120" r="1" fill="#FF5722"/>
    <circle cx="480" cy="125" r="1" fill="#009688"/>
    <circle cx="490" cy="130" r="1" fill="#8BC34A"/>
    <circle cx="500" cy="135" r="1" fill="#FFC107"/>
  </g>
  <text x="490" y="85" text-anchor="middle" class="small-text" fill="white">Uncertain</text>
  <text x="490" y="100" text-anchor="middle" class="small-text" fill="white">Image</text>
  <text x="490" y="130" text-anchor="middle" class="small-text" fill="white">❓</text>
  <text x="490" y="195" text-anchor="middle" class="label-text" fill="#E65100">Step 3: ε = 0.05</text>
  <text x="490" y="210" text-anchor="middle" class="desc-text" fill="#FF9800">Confidence: 67.2%</text>
  <text x="490" y="225" text-anchor="middle" class="desc-text" fill="#FF9800">Uncertain</text>

  <!-- Arrow 3 -->
  <path d="M560 120 L600 120" class="arrow"/>
  <text x="580" y="115" text-anchor="middle" class="desc-text" fill="#2196F3">Critical</text>

  <!-- Step 4: Adversarial Example -->
  <rect x="620" y="60" width="120" height="120" class="card"/>
  <rect x="630" y="70" width="100" height="80" fill="#F44336" stroke="#D32F2F" stroke-width="2"/>
  <!-- Heavy noise overlay -->
  <g opacity="0.7">
    <circle cx="645" cy="85" r="2" fill="#FF5722"/>
    <circle cx="655" cy="90" r="2" fill="#2196F3"/>
    <circle cx="665" cy="80" r="2" fill="#FF9800"/>
    <circle cx="675" cy="95" r="2" fill="#9C27B0"/>
    <circle cx="685" cy="85" r="2" fill="#607D8B"/>
    <circle cx="695" cy="105" r="2" fill="#795548"/>
    <circle cx="705" cy="95" r="2" fill="#E91E63"/>
    <circle cx="715" cy="115" r="2" fill="#00BCD4"/>
    <!-- Additional noise -->
    <circle cx="640" cy="110" r="1.5" fill="#CDDC39"/>
    <circle cx="650" cy="115" r="1.5" fill="#3F51B5"/>
    <circle cx="660" cy="120" r="1.5" fill="#FF5722"/>
    <circle cx="670" cy="125" r="1.5" fill="#009688"/>
    <circle cx="680" cy="130" r="1.5" fill="#8BC34A"/>
    <circle cx="690" cy="135" r="1.5" fill="#FFC107"/>
    <circle cx="700" cy="140" r="1.5" fill="#673AB7"/>
    <circle cx="710" cy="125" r="1.5" fill="#795548"/>
  </g>
  <text x="680" y="85" text-anchor="middle" class="small-text" fill="white">Ostrich</text>
  <text x="680" y="100" text-anchor="middle" class="small-text" fill="white">Detection</text>
  <text x="680" y="130" text-anchor="middle" class="small-text" fill="white">🦆</text>
  <text x="680" y="195" text-anchor="middle" class="label-text" fill="#C62828">Step 4: ε = 0.08</text>
  <text x="680" y="210" text-anchor="middle" class="desc-text" fill="#F44336">Confidence: 89.4%</text>
  <text x="680" y="225" text-anchor="middle" class="desc-text" fill="#F44336">Label: Ostrich!</text>

  <!-- Perturbation Strength Scale -->
  <rect x="50" y="260" width="690" height="60" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1" rx="8"/>
  <text x="395" y="280" text-anchor="middle" class="label-text" fill="#495057">Perturbation Strength (ε) vs Network Response</text>
  
  <!-- Scale bar -->
  <rect x="100" y="290" width="600" height="15" fill="url(#perturbGradient)" stroke="#666" rx="7"/>
  
  <!-- Scale labels -->
  <text x="100" y="315" text-anchor="start" class="small-text" fill="#4CAF50">ε = 0.0 (Original)</text>
  <text x="250" y="315" text-anchor="middle" class="small-text" fill="#4CAF50">ε = 0.01 (Imperceptible)</text>
  <text x="450" y="315" text-anchor="middle" class="small-text" fill="#FF9800">ε = 0.05 (Barely Visible)</text>
  <text x="700" y="315" text-anchor="end" class="small-text" fill="#F44336">ε = 0.08 (Adversarial)</text>

  <!-- Mathematical Formulation -->
  <rect x="50" y="340" width="690" height="140" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1" rx="8"/>
  <text x="395" y="365" text-anchor="middle" class="label-text" fill="#495057">Mathematical Attack Formulation</text>
  
  <!-- Objective -->
  <text x="70" y="390" class="math-text" fill="#212529">Objective: minimize ||R||∞ subject to:</text>
  
  <!-- Constraints -->
  <text x="100" y="415" class="math-text" fill="#212529">1. f(X + R) = target_label</text>
  <text x="350" y="415" class="desc-text" fill="#6c757d">(Network produces wrong classification)</text>
  
  <text x="100" y="435" class="math-text" fill="#212529">2. ||R||∞ ≤ ε</text>
  <text x="350" y="435" class="desc-text" fill="#6c757d">(Perturbation remains imperceptible)</text>
  
  <text x="100" y="455" class="math-text" fill="#212529">3. X + R ∈ [0,1]ⁿ</text>
  <text x="350" y="455" class="desc-text" fill="#6c757d">(Result is valid image)</text>

  <!-- Success Metrics Box -->
  <rect x="520" y="385" width="200" height="85" fill="#e8f5e8" stroke="#4CAF50" stroke-width="1" rx="6"/>
  <text x="620" y="405" text-anchor="middle" class="label-text" fill="#2E7D32">Attack Success Metrics</text>
  <text x="535" y="425" class="desc-text" fill="#388E3C">• Misclassification Rate: 94.7%</text>
  <text x="535" y="440" class="desc-text" fill="#388E3C">• Average ε needed: 0.067</text>
  <text x="535" y="455" class="desc-text" fill="#388E3C">• Human detection: 3.2%</text>
</svg>