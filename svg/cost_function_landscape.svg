<svg viewBox="0 0 900 650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="landscapeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffcdd2;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#f8bbd9;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#e1bee7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c8e6c9;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="localMinimum" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#4caf50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#81c784;stop-opacity:0.8" />
    </radialGradient>
    <radialGradient id="globalMinimum" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#2e7d32;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4caf50;stop-opacity:1" />
    </radialGradient>
    <marker id="pathArrow" markerWidth="8" markerHeight="6" 
            refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#d32f2f" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1565c0">
    High-Dimensional Non-Convex Cost Function Landscape
  </text>
  
  <!-- Main landscape (3D-like representation) -->
  <g id="landscape">
    <!-- Background hills/valleys -->
    <ellipse cx="200" cy="200" rx="80" ry="40" fill="url(#landscapeGradient)" opacity="0.7" transform="rotate(-30 200 200)"/>
    <ellipse cx="350" cy="180" rx="60" ry="30" fill="url(#landscapeGradient)" opacity="0.6" transform="rotate(20 350 180)"/>
    <ellipse cx="500" cy="220" rx="90" ry="45" fill="url(#landscapeGradient)" opacity="0.8" transform="rotate(-10 500 220)"/>
    <ellipse cx="650" cy="190" rx="70" ry="35" fill="url(#landscapeGradient)" opacity="0.7" transform="rotate(45 650 190)"/>
    
    <!-- Additional terrain features -->
    <path d="M 150 250 Q 250 150 350 200 Q 450 250 550 180 Q 650 220 750 200" 
          stroke="#9575cd" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M 100 300 Q 200 250 300 280 Q 400 320 500 270 Q 600 240 700 280" 
          stroke="#7986cb" stroke-width="2" fill="none" opacity="0.6"/>
  </g>
  
  <!-- Local minima -->
  <circle cx="180" cy="220" r="12" fill="url(#localMinimum)"/>
  <text x="180" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2e7d32">Local Min</text>
  
  <circle cx="320" cy="200" r="12" fill="url(#localMinimum)"/>
  <text x="320" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2e7d32">Local Min</text>
  
  <circle cx="620" cy="210" r="12" fill="url(#localMinimum)"/>
  <text x="620" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2e7d32">Local Min</text>
  
  <!-- Global minimum -->
  <circle cx="480" cy="240" r="15" fill="url(#globalMinimum)"/>
  <text x="480" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1b5e20">Global Min</text>
  
  <!-- Gradient descent paths -->
  <g stroke="#d32f2f" stroke-width="3" fill="none" marker-end="url(#pathArrow)">
    <!-- Path 1: Gets stuck in local minimum -->
    <path d="M 120 180 Q 140 190 160 200 Q 170 210 180 220" stroke-dasharray="5,3"/>
    <text x="120" y="170" font-family="Arial, sans-serif" font-size="10" fill="#d32f2f">Path 1</text>
    
    <!-- Path 2: Escapes to global -->
    <path d="M 280 150 Q 320 160 360 180 Q 420 200 480 240" stroke-dasharray="8,4"/>
    <text x="280" y="140" font-family="Arial, sans-serif" font-size="10" fill="#d32f2f">Path 2</text>
    
    <!-- Path 3: Different route to global -->
    <path d="M 680 160 Q 640 170 600 180 Q 540 200 480 240" stroke-dasharray="10,5"/>
    <text x="680" y="150" font-family="Arial, sans-serif" font-size="10" fill="#d32f2f">Path 3</text>
  </g>
  
  <!-- Starting points -->
  <circle cx="120" cy="180" r="6" fill="#f44336"/>
  <circle cx="280" cy="150" r="6" fill="#f44336"/>
  <circle cx="680" cy="160" r="6" fill="#f44336"/>
  <text x="450" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#f44336">Different Starting Points</text>
  
  <!-- Dimension comparison -->
  <g id="dimension-comparison">
    <rect x="50" y="320" width="800" height="300" rx="10" fill="#f8f9fa" stroke="#666" stroke-width="2"/>
    <text x="450" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#333">
      Why Gradient Descent Works in High Dimensions
    </text>
    
    <!-- Low dimension illustration -->
    <rect x="80" y="370" width="350" height="220" rx="5" fill="#ffebee" stroke="#f44336" stroke-width="1"/>
    <text x="255" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f44336">
      Low Dimensions (2D-3D)
    </text>
    
    <!-- Simple 2D cost surface -->
    <ellipse cx="200" cy="450" rx="60" ry="25" fill="#ffcdd2" opacity="0.8"/>
    <ellipse cx="300" cy="460" rx="40" ry="20" fill="#ffcdd2" opacity="0.8"/>
    <circle cx="180" cy="455" r="8" fill="#f44336"/>
    <circle cx="320" cy="465" r="8" fill="#f44336"/>
    <text x="250" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">
      Many apparent local minima
    </text>
    
    <g font-family="Arial, sans-serif" font-size="11" fill="#333">
      <text x="90" y="530">• Easy to visualize</text>
      <text x="90" y="545">• Obvious local minima</text>
      <text x="90" y="560">• Limited escape routes</text>
      <text x="90" y="575">• Gradient descent gets trapped</text>
    </g>
    
    <!-- High dimension illustration -->
    <rect x="470" y="370" width="350" height="220" rx="5" fill="#e8f5e8" stroke="#4caf50" stroke-width="1"/>
    <text x="645" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4caf50">
      High Dimensions (1000s)
    </text>
    
    <!-- Complex high-D representation -->
    <g opacity="0.7">
      <circle cx="580" cy="430" r="15" fill="#c8e6c9"/>
      <circle cx="620" cy="440" r="12" fill="#c8e6c9"/>
      <circle cx="660" cy="425" r="18" fill="#c8e6c9"/>
      <circle cx="700" cy="450" r="10" fill="#c8e6c9"/>
      <circle cx="720" cy="420" r="14" fill="#c8e6c9"/>
    </g>
    
    <text x="645" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">
      Saddle points dominate
    </text>
    
    <g font-family="Arial, sans-serif" font-size="11" fill="#333">
      <text x="480" y="530">• Exponentially harder to be</text>
      <text x="485" y="545">a true local minimum</text>
      <text x="480" y="560">• Many escape directions</text>
      <text x="480" y="575">• Saddle points are common</text>
    </g>
  </g>
  
  <!-- Mathematical insight box -->
  <rect x="100" y="100" width="300" height="80" rx="5" fill="#fff3e0" stroke="#ff9800" stroke-width="2" opacity="0.9"/>
  <text x="250" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ff9800">
    Mathematical Insight
  </text>
  <g font-family="Arial, sans-serif" font-size="11" fill="#333">
    <text x="110" y="140">For a point to be a local minimum in</text>
    <text x="110" y="155">n dimensions, the function must increase</text>
    <text x="110" y="170">in ALL n directions simultaneously.</text>
  </g>
  
  <!-- Key insights -->
  <g font-family="Arial, sans-serif" font-size="12" fill="#666">
    <text x="450" y="290" text-anchor="middle">🔑 Key: High-dimensional spaces favor saddle points over local minima</text>
  </g>
</svg>