<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="700" y="40" font-size="28" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Rating Distribution Analysis: Users vs Items
  </text>
  
  <!-- User Rating Distribution -->
  <g transform="translate(100, 80)">
    <rect x="0" y="0" width="600" height="400" fill="#fff8f0" stroke="#ff9933" stroke-width="3" rx="10"/>
    <text x="300" y="35" font-size="20" font-weight="bold" text-anchor="middle" fill="#ff6600">
      User Rating Distribution (Long Tail)
    </text>
    
    <!-- Axes -->
    <g transform="translate(50, 350)">
      <line x1="0" y1="0" x2="500" y2="0" stroke="#333" stroke-width="2"/>
      <line x1="0" y1="0" x2="0" y2="-280" stroke="#333" stroke-width="2"/>
      
      <!-- X-axis labels -->
      <text x="250" y="35" font-size="13" text-anchor="middle" fill="#333" font-weight="bold">
        Number of Movies Rated
      </text>
      <text x="0" y="20" font-size="11" text-anchor="middle" fill="#666">0</text>
      <text x="100" y="20" font-size="11" text-anchor="middle" fill="#666">100</text>
      <text x="200" y="20" font-size="11" text-anchor="middle" fill="#666">1,000</text>
      <text x="300" y="20" font-size="11" text-anchor="middle" fill="#666">10,000</text>
      <text x="400" y="20" font-size="11" text-anchor="middle" fill="#666">20,000</text>
      <text x="480" y="20" font-size="11" text-anchor="middle" fill="#666">40,000+</text>
      
      <!-- Y-axis labels -->
      <text x="-35" y="-140" font-size="13" text-anchor="middle" fill="#333" font-weight="bold" transform="rotate(-90, -35, -140)">
        Number of Users
      </text>
      <text x="-15" y="5" font-size="11" text-anchor="end" fill="#666">0</text>
      <text x="-15" y="-70" font-size="11" text-anchor="end" fill="#666">50k</text>
      <text x="-15" y="-140" font-size="11" text-anchor="end" fill="#666">100k</text>
      <text x="-15" y="-210" font-size="11" text-anchor="end" fill="#666">150k</text>
      <text x="-15" y="-270" font-size="11" text-anchor="end" fill="#666">200k</text>
      
      <!-- Long tail distribution -->
      <path d="M 10,-260 L 20,-240 L 30,-220 L 40,-200 L 50,-180 L 60,-160 L 70,-140 L 80,-120 L 90,-100 L 100,-85 L 120,-70 L 140,-60 L 160,-50 L 180,-42 L 200,-35 L 240,-25 L 280,-18 L 320,-12 L 360,-8 L 400,-5 L 440,-3 L 480,-2" 
            fill="none" stroke="#ff6600" stroke-width="4"/>
      
      <!-- Bars for emphasis -->
      <rect x="10" y="-260" width="8" height="260" fill="#ff6600" opacity="0.6"/>
      <rect x="30" y="-220" width="8" height="220" fill="#ff6600" opacity="0.6"/>
      <rect x="50" y="-180" width="8" height="180" fill="#ff6600" opacity="0.6"/>
      <rect x="70" y="-140" width="8" height="140" fill="#ff9933" opacity="0.5"/>
      <rect x="100" y="-85" width="8" height="85" fill="#ff9933" opacity="0.4"/>
      <rect x="150" y="-55" width="8" height="55" fill="#ffb366" opacity="0.4"/>
      <rect x="200" y="-35" width="8" height="35" fill="#ffcc99" opacity="0.3"/>
      <rect x="300" y="-18" width="8" height="18" fill="#ffe0cc" opacity="0.3"/>
      <rect x="400" y="-8" width="8" height="8" fill="#fff0e6" opacity="0.3"/>
      <rect x="470" y="-2" width="8" height="2" fill="#fff5f0" opacity="0.3"/>
    </g>
    
    <!-- Statistics box -->
    <g transform="translate(30, 60)">
      <rect x="0" y="0" width="540" height="90" fill="#fff" stroke="#ff9933" stroke-width="2" rx="5" opacity="0.95"/>
      <text x="270" y="22" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">
        User Rating Statistics
      </text>
      <text x="20" y="45" font-size="12" fill="#555">• Median user: ~50 ratings</text>
      <text x="20" y="63" font-size="12" fill="#555">• Mean user: ~600 ratings (1.2% of 50,000 movies)</text>
      <text x="20" y="81" font-size="12" fill="#555">• Power users: Up to 40,000+ ratings (rare)</text>
    </g>
  </g>
  
  <!-- Movie Rating Distribution -->
  <g transform="translate(750, 80)">
    <rect x="0" y="0" width="600" height="400" fill="#f0f8ff" stroke="#0066ff" stroke-width="3" rx="10"/>
    <text x="300" y="35" font-size="20" font-weight="bold" text-anchor="middle" fill="#0044cc">
      Movie Rating Distribution (Power Law)
    </text>
    
    <!-- Axes -->
    <g transform="translate(50, 350)">
      <line x1="0" y1="0" x2="500" y2="0" stroke="#333" stroke-width="2"/>
      <line x1="0" y1="0" x2="0" y2="-280" stroke="#333" stroke-width="2"/>
      
      <!-- X-axis labels -->
      <text x="250" y="35" font-size="13" text-anchor="middle" fill="#333" font-weight="bold">
        Number of Ratings Received
      </text>
      <text x="0" y="20" font-size="11" text-anchor="middle" fill="#666">0</text>
      <text x="80" y="20" font-size="11" text-anchor="middle" fill="#666">1k</text>
      <text x="160" y="20" font-size="11" text-anchor="middle" fill="#666">10k</text>
      <text x="240" y="20" font-size="11" text-anchor="middle" fill="#666">50k</text>
      <text x="320" y="20" font-size="11" text-anchor="middle" fill="#666">100k</text>
      <text x="400" y="20" font-size="11" text-anchor="middle" fill="#666">150k</text>
      <text x="480" y="20" font-size="11" text-anchor="middle" fill="#666">250k</text>
      
      <!-- Y-axis labels -->
      <text x="-35" y="-140" font-size="13" text-anchor="middle" fill="#333" font-weight="bold" transform="rotate(-90, -35, -140)">
        Number of Movies
      </text>
      <text x="-15" y="5" font-size="11" text-anchor="end" fill="#666">0</text>
      <text x="-15" y="-60" font-size="11" text-anchor="end" fill="#666">2k</text>
      <text x="-15" y="-120" font-size="11" text-anchor="end" fill="#666">4k</text>
      <text x="-15" y="-180" font-size="11" text-anchor="end" fill="#666">6k</text>
      <text x="-15" y="-240" font-size="11" text-anchor="end" fill="#666">8k</text>
      <text x="-15" y="-275" font-size="11" text-anchor="end" fill="#666">10k</text>
      
      <!-- Power law distribution -->
      <path d="M 5,-270 L 10,-260 L 15,-248 L 20,-235 L 25,-220 L 30,-205 L 35,-190 L 40,-175 L 50,-150 L 60,-130 L 80,-100 L 100,-80 L 130,-60 L 160,-45 L 200,-32 L 250,-22 L 300,-15 L 360,-10 L 420,-6 L 480,-3" 
            fill="none" stroke="#0066ff" stroke-width="4"/>
      
      <!-- Bars for emphasis -->
      <rect x="5" y="-270" width="8" height="270" fill="#0066ff" opacity="0.7"/>
      <rect x="15" y="-248" width="8" height="248" fill="#0066ff" opacity="0.6"/>
      <rect x="25" y="-220" width="8" height="220" fill="#0066ff" opacity="0.6"/>
      <rect x="35" y="-190" width="8" height="190" fill="#3385ff" opacity="0.5"/>
      <rect x="50" y="-150" width="8" height="150" fill="#4d94ff" opacity="0.5"/>
      <rect x="80" y="-100" width="8" height="100" fill="#66a3ff" opacity="0.4"/>
      <rect x="130" y="-60" width="8" height="60" fill="#80b3ff" opacity="0.4"/>
      <rect x="200" y="-32" width="8" height="32" fill="#99c2ff" opacity="0.3"/>
      <rect x="300" y="-15" width="8" height="15" fill="#b3d1ff" opacity="0.3"/>
      <rect x="420" y="-6" width="8" height="6" fill="#cce0ff" opacity="0.3"/>
      <rect x="475" y="-3" width="8" height="3" fill="#e6f0ff" opacity="0.2"/>
      
      <!-- Highlight popular movies -->
      <circle cx="480" cy="-3" r="8" fill="none" stroke="#00b894" stroke-width="3"/>
      <text x="480" y="-15" font-size="10" text-anchor="middle" fill="#00b894" font-weight="bold">
        Popular
      </text>
    </g>
    
    <!-- Statistics box -->
    <g transform="translate(30, 60)">
      <rect x="0" y="0" width="540" height="110" fill="#fff" stroke="#0066ff" stroke-width="2" rx="5" opacity="0.95"/>
      <text x="270" y="22" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">
        Movie Rating Statistics
      </text>
      <text x="20" y="45" font-size="12" fill="#555">• Median movie: ~1,000 ratings</text>
      <text x="20" y="63" font-size="12" fill="#555">• Popular movies: 100,000-250,000 ratings</text>
      <text x="20" y="81" font-size="12" fill="#555">• Top examples: Miss Congeniality, Independence Day</text>
      <text x="20" y="99" font-size="12" fill="#00b894" font-weight="bold">• Popular movies: 50% fill rate (250k/500k users)</text>
    </g>
  </g>
  
  <!-- Comparison and Mathematical Model -->
  <g transform="translate(100, 520)">
    <rect x="0" y="0" width="1200" height="420" fill="#f9f9f9" stroke="#666" stroke-width="2" rx="10"/>
    <text x="600" y="40" font-size="22" font-weight="bold" text-anchor="middle" fill="#2d3436">
      Statistical Models and Implications
    </text>
    
    <!-- Left: User Model -->
    <g transform="translate(50, 70)">
      <rect x="0" y="0" width="520" height="320" fill="#fff" stroke="#ff9933" stroke-width="2" rx="5"/>
      <text x="260" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#ff6600">
        User Rating Model (Poisson)
      </text>
      
      <!-- Equation -->
      <g transform="translate(20, 50)">
        <text x="0" y="0" font-size="14" font-weight="bold" fill="#333">Probability Distribution:</text>
        <text x="20" y="30" font-size="13" fill="#555" font-family="monospace">
          P(user rates k items) ≈ (λᵏ × e⁻ᵏ) / k!
        </text>
        
        <text x="0" y="65" font-size="14" font-weight="bold" fill="#333">Where:</text>
        <text x="20" y="90" font-size="12" fill="#555">• λ = 0.012 (1.2% rating rate)</text>
        <text x="20" y="110" font-size="12" fill="#555">• k = number of items rated</text>
        <text x="20" y="130" font-size="12" fill="#555">• e = Euler's constant (2.718...)</text>
        
        <text x="0" y="160" font-size="14" font-weight="bold" fill="#333">Key Characteristics:</text>
        <text x="20" y="185" font-size="12" fill="#555">• Independent rating behavior</text>
        <text x="20" y="205" font-size="12" fill="#555">• Each movie has ~1.2% chance</text>
        <text x="20" y="225" font-size="12" fill="#555">• Memoryless process</text>
        <text x="20" y="245" font-size="12" fill="#555">• High variance across users</text>
        
        <text x="0" y="275" font-size="13" font-weight="bold" fill="#d63031">
          → Sparse, unpredictable patterns
        </text>
      </g>
    </g>
    
    <!-- Right: Item Model -->
    <g transform="translate(630, 70)">
      <rect x="0" y="0" width="520" height="320" fill="#fff" stroke="#0066ff" stroke-width="2" rx="5"/>
      <text x="260" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#0066ff">
        Movie Rating Model (Power Law)
      </text>
      
      <!-- Equation -->
      <g transform="translate(20, 50)">
        <text x="0" y="0" font-size="14" font-weight="bold" fill="#333">Probability Distribution:</text>
        <text x="20" y="30" font-size="13" fill="#555" font-family="monospace">
          P(movie gets n ratings) ∝ n⁻ᵅ
        </text>
        
        <text x="0" y="65" font-size="14" font-weight="bold" fill="#333">Where:</text>
        <text x="20" y="90" font-size="12" fill="#555">• α ≈ 2-3 (power law exponent)</text>
        <text x="20" y="110" font-size="12" fill="#555">• n = number of ratings received</text>
        <text x="20" y="130" font-size="12" fill="#555">• ∝ means "proportional to"</text>
        
        <text x="0" y="160" font-size="14" font-weight="bold" fill="#333">Key Characteristics:</text>
        <text x="20" y="185" font-size="12" fill="#555">• Popularity-driven behavior</text>
        <text x="20" y="205" font-size="12" fill="#555">• Rich-get-richer dynamics</text>
        <text x="20" y="225" font-size="12" fill="#555">• Few extremely popular items</text>
        <text x="20" y="245" font-size="12" fill="#555">• Concentrated rating density</text>
        
        <text x="0" y="275" font-size="13" font-weight="bold" fill="#00b894">
          → Dense, predictable patterns for top items
        </text>
      </g>
    </g>
  </g>
  
  <!-- Bottom Insight Box -->
  <g transform="translate(150, 945)">
    <rect x="0" y="0" width="1100" height="45" fill="#fff3cd" stroke="#ffc107" stroke-width="3" rx="8"/>
    <text x="550" y="29" font-size="15" font-weight="bold" text-anchor="middle" fill="#856404">
      💡 Critical Insight: Popular movies have ~400× more ratings than average users, enabling reliable item-item similarity
    </text>
  </g>
</svg>