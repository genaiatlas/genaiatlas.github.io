<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradPlanning" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196F3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1976D2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradExecution" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#388E3C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradMonitoring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9800;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F57C00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradEnvironment" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9C27B0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7B1FA2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#333">Large Action Model (LAM)</text>
  <text x="400" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#666">Language to Action Translation</text>
  
  <!-- Goal Input -->
  <rect x="50" y="520" width="700" height="40" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="5"/>
  <text x="400" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1976d2">Natural Language Goal / Instruction</text>
  
  <!-- Task Decomposition -->
  <rect x="250" y="420" width="300" height="80" fill="url(#gradPlanning)" stroke="#333" stroke-width="2" rx="10"/>
  <text x="400" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">Task Decomposition</text>
  <text x="400" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#E3F2FD">Goal → Subtasks</text>
  <text x="400" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#E3F2FD">Hierarchical Planning</text>
  
  <!-- Action Planning Steps -->
  <g id="planning-steps">
    <rect x="80" y="340" width="120" height="50" fill="#E3F2FD" stroke="#2196F3" stroke-width="2" rx="5"/>
    <text x="140" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1976D2">Step 1</text>
    <text x="140" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1976D2">Analyze Goal</text>
    
    <rect x="220" y="340" width="120" height="50" fill="#E3F2FD" stroke="#2196F3" stroke-width="2" rx="5"/>
    <text x="280" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1976D2">Step 2</text>
    <text x="280" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1976D2">Plan Actions</text>
    
    <rect x="360" y="340" width="120" height="50" fill="#E3F2FD" stroke="#2196F3" stroke-width="2" rx="5"/>
    <text x="420" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1976D2">Step 3</text>
    <text x="420" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1976D2">Sequence</text>
    
    <rect x="500" y="340" width="120" height="50" fill="#E3F2FD" stroke="#2196F3" stroke-width="2" rx="5"/>
    <text x="560" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1976D2">Step N</text>
    <text x="560" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1976D2">Execute</text>
  </g>
  
  <!-- Environment Model -->
  <rect x="50" y="230" width="180" height="80" fill="url(#gradEnvironment)" stroke="#333" stroke-width="2" rx="8"/>
  <text x="140" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Environment</text>
  <text x="140" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Model</text>
  <text x="140" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#F3E5F5">State Representation</text>
  
  <!-- Action Space Mapping -->
  <rect x="310" y="230" width="180" height="80" fill="url(#gradExecution)" stroke="#333" stroke-width="2" rx="8"/>
  <text x="400" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Action Space</text>
  <text x="400" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Mapping</text>
  <text x="400" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#E8F5E8">Intent → Execution</text>
  
  <!-- Execution Monitor -->
  <rect x="570" y="230" width="180" height="80" fill="url(#gradMonitoring)" stroke="#333" stroke-width="2" rx="8"/>
  <text x="660" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Execution</text>
  <text x="660" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Monitor</text>
  <text x="660" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#FFF3E0">Progress Tracking</text>
  
  <!-- Action Types -->
  <g id="action-types">
    <rect x="100" y="120" width="140" height="80" fill="#E8F5E8" stroke="#4CAF50" stroke-width="2" rx="6"/>
    <text x="170" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#4CAF50">Physical Actions</text>
    <text x="170" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">• Movement</text>
    <text x="170" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">• Manipulation</text>
    <text x="170" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">• Navigation</text>
    
    <rect x="260" y="120" width="140" height="80" fill="#E3F2FD" stroke="#2196F3" stroke-width="2" rx="6"/>
    <text x="330" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2196F3">Digital Actions</text>
    <text x="330" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">• API Calls</text>
    <text x="330" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">• File Operations</text>
    <text x="330" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">• Commands</text>
    
    <rect x="420" y="120" width="140" height="80" fill="#FFF3E0" stroke="#FF9800" stroke-width="2" rx="6"/>
    <text x="490" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#FF9800">Communication</text>
    <text x="490" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">• Messages</text>
    <text x="490" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">• Notifications</text>
    <text x="490" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">• Reports</text>
    
    <rect x="580" y="120" width="140" height="80" fill="#F3E5F5" stroke="#9C27B0" stroke-width="2" rx="6"/>
    <text x="650" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#9C27B0">Cognitive Actions</text>
    <text x="650" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">• Analysis</text>
    <text x="650" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">• Planning</text>
    <text x="650" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">• Decision</text>
  </g>
  
  <!-- Output Actions -->
  <rect x="300" y="60" width="200" height="40" fill="#e8f5e8" stroke="#4caf50" stroke-width="2" rx="5"/>
  <text x="400" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4caf50">Executable Actions</text>
  
  <!-- Arrows -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2196F3" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4CAF50" />
    </marker>
    <marker id="arrowhead-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#FF9800" />
    </marker>
    <marker id="arrowhead-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9C27B0" />
    </marker>
  </defs>
  
  <!-- Main flow -->
  <path d="M 400 520 L 400 500" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)"/>
  <path d="M 400 420 L 400 390" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Planning steps flow -->
  <path d="M 200 365 L 220 365" stroke="#2196F3" stroke-width="2" marker-end="url(#arrowhead-blue)"/>
  <path d="M 340 365 L 360 365" stroke="#2196F3" stroke-width="2" marker-end="url(#arrowhead-blue)"/>
  <path d="M 480 365 L 500 365" stroke="#2196F3" stroke-width="2" marker-end="url(#arrowhead-blue)"/>
  
  <!-- To components -->
  <path d="M 320 340 L 180 310" stroke="#9C27B0" stroke-width="2" marker-end="url(#arrowhead-purple)"/>
  <path d="M 400 340 L 400 310" stroke="#4CAF50" stroke-width="2" marker-end="url(#arrowhead-green)"/>
  <path d="M 480 340 L 620 310" stroke="#FF9800" stroke-width="2" marker-end="url(#arrowhead-orange)"/>
  
  <!-- To action types -->
  <path d="M 200 230 L 170 200" stroke="#4CAF50" stroke-width="2" marker-end="url(#arrowhead-green)"/>
  <path d="M 350 230 L 330 200" stroke="#2196F3" stroke-width="2" marker-end="url(#arrowhead-blue)"/>
  <path d="M 450 230 L 490 200" stroke="#FF9800" stroke-width="2" marker-end="url(#arrowhead-orange)"/>
  <path d="M 620 230 L 650 200" stroke="#9C27B0" stroke-width="2" marker-end="url(#arrowhead-purple)"/>
  
  <!-- To output -->
  <path d="M 400 120 L 400 100" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Policy Function Formula -->
  <g id="policy-formula">
    <rect x="20" y="400" width="200" height="80" fill="#f0f8ff" stroke="#2196F3" stroke-width="1" rx="5" opacity="0.9"/>
    <text x="120" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1976D2">Policy Function</text>
    <text x="120" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">π(a_t|s_t, g) = LAM(</text>
    <text x="120" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">state, goal, history)</text>
    <text x="120" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">Action selection policy</text>
  </g>
  
  <!-- Feedback Loop -->
  <g id="feedback-loop">
    <path d="M 660 310 Q 750 350 700 450" stroke="#FF9800" stroke-width="2" stroke-dasharray="5,5" fill="none"/>
    <path d="M 700 450 L 550 470" stroke="#FF9800" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead-orange)"/>
    <text x="720" y="390" font-family="Arial, sans-serif" font-size="10" fill="#FF9800">Feedback</text>
    <text x="720" y="405" font-family="Arial, sans-serif" font-size="10" fill="#FF9800">Loop</text>
  </g>
  
  <!-- Example Use Cases -->
  <g id="use-cases">
    <rect x="580" y="400" width="200" height="100" fill="#fff8e1" stroke="#FFC107" stroke-width="1" rx="5" opacity="0.9"/>
    <text x="680" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#F57C00">LAM Applications</text>
    
    <text x="590" y="440" font-family="Arial, sans-serif" font-size="10" fill="#333">• Robotic Control</text>
    <text x="590" y="455" font-family="Arial, sans-serif" font-size="10" fill="#333">• Workflow Automation</text>
    <text x="590" y="470" font-family="Arial, sans-serif" font-size="10" fill="#333">• Smart Home Control</text>
    <text x="590" y="485" font-family="Arial, sans-serif" font-size="10" fill="#333">• Game Playing</text>
  </g>
</svg>