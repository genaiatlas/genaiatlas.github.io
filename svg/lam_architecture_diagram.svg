<svg viewBox="0 0 900 850" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="900" height="850" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="450" y="35" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    LAM Architecture (Large Action Model)
  </text>
  
  <text x="450" y="60" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d" font-style="italic">
    From Natural Language to Executable Actions
  </text>
  
  <!-- Input Goal -->
  <g transform="translate(300, 100)">
    <rect x="0" y="0" width="300" height="60" fill="#3498db" stroke="#2980b9" stroke-width="2" rx="5"/>
    <text x="150" y="25" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">
      Natural Language Goal
    </text>
    <text x="150" y="45" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
      "Make me a cup of coffee"
    </text>
  </g>
  
  <line x1="450" y1="160" x2="450" y2="190" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Task Decomposition -->
  <g transform="translate(200, 190)">
    <rect x="0" y="0" width="500" height="70" fill="#f39c12" stroke="#d68910" stroke-width="2" rx="5"/>
    <text x="250" y="25" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">
      Task Decomposition
    </text>
    <text x="250" y="45" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
      Break down complex goal into actionable steps
    </text>
    <text x="250" y="60" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
      π(aₜ | sₜ, g) = LAM(state, goal, history)
    </text>
  </g>
  
  <line x1="450" y1="260" x2="450" y2="290" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Action Sequence -->
  <g transform="translate(100, 290)">
    <rect x="0" y="0" width="700" height="120" fill="white" stroke="#27ae60" stroke-width="3" rx="8"/>
    <text x="350" y="25" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#27ae60">
      Generated Action Sequence
    </text>
    
    <!-- Action 1 -->
    <g transform="translate(30, 40)">
      <rect x="0" y="0" width="140" height="60" fill="#d5f4e6" stroke="#27ae60" stroke-width="2" rx="3"/>
      <circle cx="20" cy="15" r="10" fill="#27ae60"/>
      <text x="20" y="19" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="white">1</text>
      <text x="70" y="25" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">
        Navigate to
      </text>
      <text x="70" y="40" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">
        kitchen
      </text>
    </g>
    
    <!-- Action 2 -->
    <g transform="translate(190, 40)">
      <rect x="0" y="0" width="140" height="60" fill="#d5f4e6" stroke="#27ae60" stroke-width="2" rx="3"/>
      <circle cx="20" cy="15" r="10" fill="#27ae60"/>
      <text x="20" y="19" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="white">2</text>
      <text x="70" y="25" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">
        Locate coffee
      </text>
      <text x="70" y="40" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">
        machine
      </text>
    </g>
    
    <!-- Action 3 -->
    <g transform="translate(350, 40)">
      <rect x="0" y="0" width="140" height="60" fill="#d5f4e6" stroke="#27ae60" stroke-width="2" rx="3"/>
      <circle cx="20" cy="15" r="10" fill="#27ae60"/>
      <text x="20" y="19" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="white">3</text>
      <text x="70" y="25" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">
        Add water &amp;
      </text>
      <text x="70" y="40" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">
        coffee
      </text>
    </g>
    
    <!-- Action N -->
    <g transform="translate(510, 40)">
      <rect x="0" y="0" width="140" height="60" fill="#d5f4e6" stroke="#27ae60" stroke-width="2" rx="3"/>
      <circle cx="20" cy="15" r="10" fill="#27ae60"/>
      <text x="20" y="19" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="white">N</text>
      <text x="70" y="25" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">
        Press start
      </text>
      <text x="70" y="40" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">
        button
      </text>
    </g>
  </g>
  
  <line x1="450" y1="410" x2="450" y2="440" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Action Categories -->
  <g transform="translate(50, 440)">
    <text x="400" y="0" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Action Categories
    </text>
    
    <g transform="translate(0, 20)">
      <!-- Physical Actions -->
      <rect x="0" y="0" width="190" height="100" fill="#ebf5fb" stroke="#3498db" stroke-width="2" rx="5"/>
      <text x="95" y="22" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#3498db">
        🦾 Physical Actions
      </text>
      <text x="95" y="42" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#34495e">
        • Movement
      </text>
      <text x="95" y="58" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#34495e">
        • Manipulation
      </text>
      <text x="95" y="74" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#34495e">
        • Environment
      </text>
      <text x="95" y="90" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#34495e">
        interaction
      </text>
      
      <!-- Digital Actions -->
      <rect x="210" y="0" width="190" height="100" fill="#fef5e7" stroke="#f39c12" stroke-width="2" rx="5"/>
      <text x="305" y="22" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#f39c12">
        💻 Digital Actions
      </text>
      <text x="305" y="42" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#34495e">
        • API calls
      </text>
      <text x="305" y="58" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#34495e">
        • File operations
      </text>
      <text x="305" y="74" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#34495e">
        • System
      </text>
      <text x="305" y="90" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#34495e">
        commands
      </text>
      
      <!-- Communication Actions -->
      <rect x="420" y="0" width="190" height="100" fill="#d5f4e6" stroke="#27ae60" stroke-width="2" rx="5"/>
      <text x="515" y="22" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#27ae60">
        💬 Communication
      </text>
      <text x="515" y="42" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#34495e">
        • Message sending
      </text>
      <text x="515" y="58" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#34495e">
        • Notifications
      </text>
      <text x="515" y="74" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#34495e">
        • Reporting
      </text>
      
      <!-- Cognitive Actions -->
      <rect x="630" y="0" width="190" height="100" fill="#f4ecf7" stroke="#9b59b6" stroke-width="2" rx="5"/>
      <text x="725" y="22" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#9b59b6">
        🧠 Cognitive
      </text>
      <text x="725" y="42" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#34495e">
        • Analysis
      </text>
      <text x="725" y="58" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#34495e">
        • Planning
      </text>
      <text x="725" y="74" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#34495e">
        • Decision
      </text>
      <text x="725" y="90" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#34495e">
        making
      </text>
    </g>
  </g>
  
  <!-- Execution Monitoring -->
  <g transform="translate(200, 600)">
    <rect x="0" y="0" width="500" height="70" fill="#9b59b6" stroke="#8e44ad" stroke-width="2" rx="5"/>
    <text x="250" y="25" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">
      Execution Monitoring &amp; Feedback
    </text>
    <text x="250" y="45" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
      Track progress | Handle failures | Adapt to environment
    </text>
    <text x="250" y="60" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
      Real-time replanning if actions fail
    </text>
  </g>
  
  <!-- Feedback loop -->
  <path d="M 700 635 Q 750 635 750 550 Q 750 465 700 465" fill="none" stroke="#9b59b6" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <text x="765" y="550" font-family="Arial, sans-serif" font-size="9" fill="#9b59b6">Replan</text>
  
  <!-- Applications Panel -->
  <g transform="translate(100, 710)">
    <rect x="0" y="0" width="700" height="110" fill="#ecf0f1" stroke="#95a5a6" stroke-width="2" rx="5"/>
    <text x="350" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      AI Agent Applications
    </text>
    
    <text x="350" y="48" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">
      🤖 Robotic Control: Direct motor command generation for physical robots
    </text>
    <text x="350" y="65" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">
      ⚙️ Workflow Automation: Business process execution and optimization
    </text>
    <text x="350" y="82" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">
      🎮 Game Playing: Strategic action selection in competitive environments
    </text>
    <text x="350" y="99" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">
      🏠 Smart Home Control: Device management and automation
    </text>
  </g>
  
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#34495e"/>
    </marker>
  </defs>
</svg>