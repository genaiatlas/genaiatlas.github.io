<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title-text { font-family: 'Arial', sans-serif; font-size: 24px; font-weight: bold; fill: #2c3e50; }
      .label-text { font-family: 'Arial', sans-serif; font-size: 16px; fill: #34495e; }
      .matrix-text { font-family: 'Arial', sans-serif; font-size: 14px; fill: #2c3e50; }
      .bracket { stroke: #2c3e50; stroke-width: 2; fill: none; }
      .matrix-bg { fill: #ecf0f1; stroke: #bdc3c7; stroke-width: 1; }
      .arrow { stroke: #e74c3c; stroke-width: 2; fill: #e74c3c; }
    </style>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title-text">Linear Regression Dataset Structure</text>
  
  <!-- Feature Matrix X -->
  <g transform="translate(50, 80)">
    <text x="0" y="-10" class="label-text">Feature Matrix X (n × m+1)</text>
    
    <!-- Matrix background -->
    <rect x="10" y="10" width="200" height="160" class="matrix-bg" rx="5"/>
    
    <!-- Left bracket -->
    <path d="M 10 10 L 0 10 L 0 170 L 10 170" class="bracket"/>
    <!-- Right bracket -->
    <path d="M 210 10 L 220 10 L 220 170 L 210 170" class="bracket"/>
    
    <!-- Matrix content -->
    <text x="30" y="35" class="matrix-text">1</text>
    <text x="60" y="35" class="matrix-text">X₁₁</text>
    <text x="100" y="35" class="matrix-text">X₁₂</text>
    <text x="140" y="35" class="matrix-text">...</text>
    <text x="180" y="35" class="matrix-text">X₁ₘ</text>
    
    <text x="30" y="60" class="matrix-text">1</text>
    <text x="60" y="60" class="matrix-text">X₂₁</text>
    <text x="100" y="60" class="matrix-text">X₂₂</text>
    <text x="140" y="60" class="matrix-text">...</text>
    <text x="180" y="60" class="matrix-text">X₂ₘ</text>
    
    <text x="110" y="85" class="matrix-text">⋮</text>
    
    <text x="30" y="150" class="matrix-text">1</text>
    <text x="60" y="150" class="matrix-text">Xₙ₁</text>
    <text x="100" y="150" class="matrix-text">Xₙ₂</text>
    <text x="140" y="150" class="matrix-text">...</text>
    <text x="180" y="150" class="matrix-text">Xₙₘ</text>
  </g>
  
  <!-- Target Vector Y -->
  <g transform="translate(350, 80)">
    <text x="0" y="-10" class="label-text">Target Vector Y (n × 1)</text>
    
    <!-- Matrix background -->
    <rect x="10" y="10" width="60" height="160" class="matrix-bg" rx="5"/>
    
    <!-- Left bracket -->
    <path d="M 10 10 L 0 10 L 0 170 L 10 170" class="bracket"/>
    <!-- Right bracket -->
    <path d="M 70 10 L 80 10 L 80 170 L 70 170" class="bracket"/>
    
    <!-- Vector content -->
    <text x="40" y="35" text-anchor="middle" class="matrix-text">Y₁</text>
    <text x="40" y="60" text-anchor="middle" class="matrix-text">Y₂</text>
    <text x="40" y="85" text-anchor="middle" class="matrix-text">⋮</text>
    <text x="40" y="150" text-anchor="middle" class="matrix-text">Yₙ</text>
  </g>
  
  <!-- Parameter Vector θ -->
  <g transform="translate(550, 80)">
    <text x="0" y="-10" class="label-text">Parameter Vector θ (m+1 × 1)</text>
    
    <!-- Matrix background -->
    <rect x="10" y="10" width="60" height="160" class="matrix-bg" rx="5"/>
    
    <!-- Left bracket -->
    <path d="M 10 10 L 0 10 L 0 170 L 10 170" class="bracket"/>
    <!-- Right bracket -->
    <path d="M 70 10 L 80 10 L 80 170 L 70 170" class="bracket"/>
    
    <!-- Vector content -->
    <text x="40" y="35" text-anchor="middle" class="matrix-text">θ₀</text>
    <text x="40" y="60" text-anchor="middle" class="matrix-text">θ₁</text>
    <text x="40" y="85" text-anchor="middle" class="matrix-text">⋮</text>
    <text x="40" y="150" text-anchor="middle" class="matrix-text">θₘ</text>
  </g>
  
  <!-- Arrows and equations -->
  <g transform="translate(0, 280)">
    <!-- Arrow from X to equation -->
    <path d="M 150 0 L 180 0" class="arrow" marker-end="url(#arrowhead)"/>
    
    <!-- Equation -->
    <text x="200" y="5" class="matrix-text">Ŷ = Xθ</text>
    
    <!-- Arrow to result -->
    <path d="M 280 0 L 310 0" class="arrow" marker-end="url(#arrowhead)"/>
    
    <!-- Prediction vector -->
    <g transform="translate(320, -80)">
      <text x="0" y="-10" class="label-text">Predictions Ŷ (n × 1)</text>
      
      <!-- Matrix background -->
      <rect x="10" y="10" width="60" height="160" class="matrix-bg" rx="5"/>
      
      <!-- Left bracket -->
      <path d="M 10 10 L 0 10 L 0 170 L 10 170" class="bracket"/>
      <!-- Right bracket -->
      <path d="M 70 10 L 80 10 L 80 170 L 70 170" class="bracket"/>
      
      <!-- Vector content -->
      <text x="40" y="35" text-anchor="middle" class="matrix-text">Ŷ₁</text>
      <text x="40" y="60" text-anchor="middle" class="matrix-text">Ŷ₂</text>
      <text x="40" y="85" text-anchor="middle" class="matrix-text">⋮</text>
      <text x="40" y="150" text-anchor="middle" class="matrix-text">Ŷₙ</text>
    </g>
  </g>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
  </defs>
  
  <!-- Dimensions annotation -->
  <g transform="translate(50, 350)">
    <text x="0" y="0" class="label-text">n = number of data points</text>
    <text x="250" y="0" class="label-text">m = number of features</text>
    <text x="450" y="0" class="label-text">m+1 = parameters (including intercept)</text>
  </g>
</svg>