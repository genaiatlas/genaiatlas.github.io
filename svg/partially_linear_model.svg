<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="500" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">Partially Linear Model Framework</text>
  
  <!-- Original Model -->
  <rect x="50" y="50" width="320" height="120" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2" rx="10"/>
  <text x="210" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Original Model</text>
  
  <text x="210" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#e74c3c">Y = βD + g(Z) + ε</text>
  
  <text x="70" y="130" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Y: Outcome variable</text>
  <text x="70" y="145" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">D: Treatment of interest</text>
  <text x="230" y="130" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">g(Z): Nonlinear control function</text>
  <text x="230" y="145" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">β: Causal parameter</text>
  
  <!-- Arrow down -->
  <path d="M 210 180 L 210 220" stroke="#34495e" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="230" y="205" font-family="Arial, sans-serif" font-size="10" fill="#34495e">Partialling Out</text>
  
  <!-- Partialled-Out Model -->
  <rect x="50" y="240" width="320" height="120" fill="#e8f5e8" stroke="#27ae60" stroke-width="2" rx="10"/>
  <text x="210" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Partialled-Out Form</text>
  
  <text x="210" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#27ae60">Ỹ = βD̃ + ε</text>
  
  <text x="70" y="320" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Ỹ = Y - ℓ(Z)</text>
  <text x="70" y="335" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">D̃ = D - m(Z)</text>
  <text x="230" y="320" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">ℓ(Z) = E[Y|Z]</text>
  <text x="230" y="335" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">m(Z) = E[D|Z]</text>
  
  <!-- Frisch-Waugh-Lovell Box -->
  <rect x="430" y="50" width="320" height="170" fill="#fff3cd" stroke="#ffc107" stroke-width="2" rx="10"/>
  <text x="590" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Frisch-Waugh-Lovell Theorem</text>
  
  <text x="590" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#856404">β can be recovered from the regression of Ỹ on D̃</text>
  
  <text x="590" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#e74c3c">β = (ED̃²)⁻¹ED̃Ỹ</text>
  
  <text x="450" y="160" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">• β uniquely defined if D̃ has non-zero variance</text>
  <text x="450" y="175" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">• Residualized Y regressed on residualized D</text>
  <text x="450" y="190" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">• Controls for confounding through Z</text>
  <text x="450" y="205" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">• Enables causal interpretation under assumptions</text>
  
  <!-- Estimation Process -->
  <rect x="430" y="240" width="320" height="220" fill="#f8f9fa" stroke="#6c757d" stroke-width="2" rx="10"/>
  <text x="590" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Estimation Process</text>
  
  <!-- Step 1 -->
  <circle cx="460" cy="290" r="12" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="460" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">1</text>
  <text x="480" y="295" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Estimate ℓ̂(Z) and m̂(Z) using ML methods</text>
  
  <!-- Step 2 -->
  <circle cx="460" cy="315" r="12" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <text x="460" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">2</text>
  <text x="480" y="320" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Compute residuals: Ỹᵢ = Yᵢ - ℓ̂(Zᵢ), D̃ᵢ = Dᵢ - m̂(Zᵢ)</text>
  
  <!-- Step 3 -->
  <circle cx="460" cy="340" r="12" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
  <text x="460" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">3</text>
  <text x="480" y="345" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Regress Ỹ on D̃ to obtain β̂</text>
  
  <!-- Step 4 -->
  <circle cx="460" cy="365" r="12" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
  <text x="460" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">4</text>
  <text x="480" y="370" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Cross-fit to avoid overfitting bias</text>
  
  <!-- Key insight box -->
  <rect x="450" y="385" width="280" height="60" fill="#d1ecf1" stroke="#bee5eb" stroke-width="1" rx="5"/>
  <text x="590" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0c5460">Key Insight</text>
  <text x="460" y="420" font-family="Arial, sans-serif" font-size="9" fill="#0c5460">By removing the predictable components (ℓ(Z) and m(Z)),</text>
  <text x="460" y="432" font-family="Arial, sans-serif" font-size="9" fill="#0c5460">we isolate the causal relationship between D and Y</text>
  
  <!-- Mathematical conditions -->
  <rect x="50" y="380" width="320" height="100" fill="#ffeaa7" stroke="#fdcb6e" stroke-width="2" rx="10"/>
  <text x="210" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Required Conditions</text>
  
  <text x="210" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#d63031">E[ε|D,Z] = 0</text>
  <text x="70" y="450" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Conditional exogeneity</text>
  <text x="70" y="465" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• No omitted variable bias</text>
  
  <text x="230" y="450" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• High-quality ML predictions</text>
  <text x="230" y="465" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Sufficient sample size</text>
  
  <!-- Arrow definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e"/>
    </marker>
  </defs>
  
</svg>