<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">ANOVA: Analysis of Variance</text>
  
  <!-- Main Concept Box -->
  <rect x="50" y="60" width="700" height="120" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="10"/>
  <text x="400" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1976d2">Core Principle</text>
  <text x="400" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#333">F = Between-Group Variation / Within-Group Variation</text>
  <text x="400" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#666">Tests if group means are significantly different</text>
  <text x="400" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#666">H₀: μ₁ = μ₂ = μ₃ = ... = μₖ</text>
  
  <!-- Sum of Squares Decomposition -->
  <text x="400" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">Sum of Squares Decomposition</text>
  
  <!-- SST Box -->
  <rect x="100" y="230" width="600" height="50" fill="#fff3e0" stroke="#f57c00" stroke-width="2" rx="5"/>
  <text x="400" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#f57c00">SST = SSB + SSW</text>
  <text x="400" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">Total Sum of Squares = Between + Within</text>
  
  <!-- SSB Box -->
  <rect x="80" y="300" width="250" height="80" fill="#e8f5e8" stroke="#4caf50" stroke-width="2" rx="5"/>
  <text x="205" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4caf50">SSB (Between Groups)</text>
  <text x="205" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">Variation due to</text>
  <text x="205" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">differences between</text>
  <text x="205" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">group means</text>
  
  <!-- SSW Box -->
  <rect x="470" y="300" width="250" height="80" fill="#ffebee" stroke="#f44336" stroke-width="2" rx="5"/>
  <text x="595" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f44336">SSW (Within Groups)</text>
  <text x="595" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">Variation within</text>
  <text x="595" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">each group</text>
  <text x="595" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">(Error variation)</text>
  
  <!-- F-Statistic Calculation -->
  <text x="400" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">F-Statistic Calculation</text>
  
  <rect x="200" y="430" width="400" height="60" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2" rx="5"/>
  <text x="400" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#9c27b0">F = MSB / MSW</text>
  <text x="400" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">Mean Square Between / Mean Square Within</text>
  
  <!-- Interpretation -->
  <text x="400" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Interpretation</text>
  
  <rect x="50" y="540" width="320" height="45" fill="#e8f5e8" stroke="#4caf50" stroke-width="1" rx="5"/>
  <text x="210" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#333">Large F → Groups differ significantly</text>
  <text x="210" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">Between-group > Within-group variation</text>
  
  <rect x="430" y="540" width="320" height="45" fill="#ffebee" stroke="#f44336" stroke-width="1" rx="5"/>
  <text x="590" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#333">Small F → Groups similar</text>
  <text x="590" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">Between-group ≈ Within-group variation</text>
  
  <!-- Arrows -->
  <path d="M 400 280 L 205 300" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 400 280 L 595 300" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
</svg>