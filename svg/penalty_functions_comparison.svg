<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title-text { font-family: 'Arial', sans-serif; font-size: 20px; font-weight: bold; fill: #2c3e50; }
      .subtitle-text { font-family: 'Arial', sans-serif; font-size: 14px; fill: #34495e; }
      .label-text { font-family: 'Arial', sans-serif; font-size: 12px; fill: #2c3e50; }
      .math-text { font-family: 'Times New Roman', serif; font-size: 14px; fill: #2c3e50; }
      .ridge-color { stroke: #e74c3c; fill: #e74c3c; }
      .lasso-color { stroke: #3498db; fill: #3498db; }
      .elastic-color { stroke: #27ae60; fill: #27ae60; }
      .axis-line { stroke: #7f8c8d; stroke-width: 2; fill: none; }
      .grid-line { stroke: #ecf0f1; stroke-width: 1; fill: none; }
      .penalty-curve { stroke-width: 3; fill: none; }
    </style>
  </defs>
  
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" class="title-text">Penalty Function Comparison in Regularized Regression</text>
  
  <!-- Ridge Regression Panel -->
  <g transform="translate(50, 80)">
    <text x="100" y="20" text-anchor="middle" class="subtitle-text">Ridge Regression (L2)</text>
    <text x="100" y="40" text-anchor="middle" class="math-text">Penalty = λΣβⱼ²</text>
    
    <!-- Axes -->
    <line x1="20" y1="150" x2="180" y2="150" class="axis-line"/>
    <line x1="100" y1="60" x2="100" y2="170" class="axis-line"/>
    
    <!-- Grid -->
    <line x1="60" y1="60" x2="60" y2="150" class="grid-line"/>
    <line x1="140" y1="60" x2="140" y2="150" class="grid-line"/>
    <line x1="20" y1="105" x2="180" y2="105" class="grid-line"/>
    
    <!-- Ridge penalty curve (parabola) -->
    <path d="M 20 150 Q 100 60 180 150" class="penalty-curve ridge-color"/>
    
    <!-- Labels -->
    <text x="190" y="155" class="label-text">β</text>
    <text x="105" y="55" class="label-text">Penalty</text>
    <text x="100" y="190" text-anchor="middle" class="label-text">Smooth shrinkage</text>
    <text x="100" y="205" text-anchor="middle" class="label-text">Never exactly zero</text>
  </g>
  
  <!-- Lasso Regression Panel -->
  <g transform="translate(300, 80)">
    <text x="100" y="20" text-anchor="middle" class="subtitle-text">Lasso Regression (L1)</text>
    <text x="100" y="40" text-anchor="middle" class="math-text">Penalty = λΣ|βⱼ|</text>
    
    <!-- Axes -->
    <line x1="20" y1="150" x2="180" y2="150" class="axis-line"/>
    <line x1="100" y1="60" x2="100" y2="170" class="axis-line"/>
    
    <!-- Grid -->
    <line x1="60" y1="60" x2="60" y2="150" class="grid-line"/>
    <line x1="140" y1="60" x2="140" y2="150" class="grid-line"/>
    <line x1="20" y1="105" x2="180" y2="105" class="grid-line"/>
    
    <!-- Lasso penalty curve (V-shape) -->
    <path d="M 20 90 L 100 150 L 180 90" class="penalty-curve lasso-color"/>
    
    <!-- Labels -->
    <text x="190" y="155" class="label-text">β</text>
    <text x="105" y="55" class="label-text">Penalty</text>
    <text x="100" y="190" text-anchor="middle" class="label-text">Sharp at zero</text>
    <text x="100" y="205" text-anchor="middle" class="label-text">Sets coefficients to zero</text>
  </g>
  
  <!-- Elastic Net Panel -->
  <g transform="translate(550, 80)">
    <text x="100" y="20" text-anchor="middle" class="subtitle-text">Elastic Net</text>
    <text x="100" y="40" text-anchor="middle" class="math-text">Penalty = λ₁Σβⱼ² + λ₂Σ|βⱼ|</text>
    
    <!-- Axes -->
    <line x1="20" y1="150" x2="180" y2="150" class="axis-line"/>
    <line x1="100" y1="60" x2="100" y2="170" class="axis-line"/>
    
    <!-- Grid -->
    <line x1="60" y1="60" x2="60" y2="150" class="grid-line"/>
    <line x1="140" y1="60" x2="140" y2="150" class="grid-line"/>
    <line x1="20" y1="105" x2="180" y2="105" class="grid-line"/>
    
    <!-- Elastic Net penalty curve (combination) -->
    <path d="M 20 100 Q 80 140 100 150 Q 120 140 180 100" class="penalty-curve elastic-color"/>
    
    <!-- Labels -->
    <text x="190" y="155" class="label-text">β</text>
    <text x="105" y="55" class="label-text">Penalty</text>
    <text x="100" y="190" text-anchor="middle" class="label-text">Balanced approach</text>
    <text x="100" y="205" text-anchor="middle" class="label-text">Combines L1 + L2</text>
  </g>
  
  <!-- Comparison Table -->
  <g transform="translate(50, 350)">
    <text x="400" y="20" text-anchor="middle" class="subtitle-text">Key Properties Comparison</text>
    
    <!-- Table headers -->
    <rect x="0" y="40" width="120" height="30" fill="#ecf0f1" stroke="#bdc3c7"/>
    <rect x="120" y="40" width="120" height="30" fill="#ecf0f1" stroke="#bdc3c7"/>
    <rect x="240" y="40" width="120" height="30" fill="#ecf0f1" stroke="#bdc3c7"/>
    <rect x="360" y="40" width="120" height="30" fill="#ecf0f1" stroke="#bdc3c7"/>
    <rect x="480" y="40" width="120" height="30" fill="#ecf0f1" stroke="#bdc3c7"/>
    <rect x="600" y="40" width="150" height="30" fill="#ecf0f1" stroke="#bdc3c7"/>
    
    <text x="60" y="60" text-anchor="middle" class="label-text">Property</text>
    <text x="180" y="60" text-anchor="middle" class="label-text">Ridge</text>
    <text x="300" y="60" text-anchor="middle" class="label-text">Lasso</text>
    <text x="420" y="60" text-anchor="middle" class="label-text">Elastic Net</text>
    <text x="540" y="60" text-anchor="middle" class="label-text">Lava</text>
    <text x="675" y="60" text-anchor="middle" class="label-text">Best Use Case</text>
    
    <!-- Table rows -->
    <rect x="0" y="70" width="120" height="25" fill="white" stroke="#bdc3c7"/>
    <rect x="120" y="70" width="120" height="25" fill="white" stroke="#bdc3c7"/>
    <rect x="240" y="70" width="120" height="25" fill="white" stroke="#bdc3c7"/>
    <rect x="360" y="70" width="120" height="25" fill="white" stroke="#bdc3c7"/>
    <rect x="480" y="70" width="120" height="25" fill="white" stroke="#bdc3c7"/>
    <rect x="600" y="70" width="150" height="25" fill="white" stroke="#bdc3c7"/>
    
    <text x="60" y="87" text-anchor="middle" class="label-text">Sparsity</text>
    <text x="180" y="87" text-anchor="middle" class="label-text">Dense</text>
    <text x="300" y="87" text-anchor="middle" class="label-text">Sparse</text>
    <text x="420" y="87" text-anchor="middle" class="label-text">Sparse</text>
    <text x="540" y="87" text-anchor="middle" class="label-text">Dense</text>
    <text x="675" y="87" text-anchor="middle" class="label-text">Dense models</text>
    
    <rect x="0" y="95" width="120" height="25" fill="white" stroke="#bdc3c7"/>
    <rect x="120" y="95" width="120" height="25" fill="white" stroke="#bdc3c7"/>
    <rect x="240" y="95" width="120" height="25" fill="white" stroke="#bdc3c7"/>
    <rect x="360" y="95" width="120" height="25" fill="white" stroke="#bdc3c7"/>
    <rect x="480" y="95" width="120" height="25" fill="white" stroke="#bdc3c7"/>
    <rect x="600" y="95" width="150" height="25" fill="white" stroke="#bdc3c7"/>
    
    <text x="60" y="112" text-anchor="middle" class="label-text">Selection</text>
    <text x="180" y="112" text-anchor="middle" class="label-text">No</text>
    <text x="300" y="112" text-anchor="middle" class="label-text">Yes</text>
    <text x="420" y="112" text-anchor="middle" class="label-text">Yes</text>
    <text x="540" y="112" text-anchor="middle" class="label-text">No</text>
    <text x="675" y="112" text-anchor="middle" class="label-text">Sparse models</text>
    
    <rect x="0" y="120" width="120" height="25" fill="white" stroke="#bdc3c7"/>
    <rect x="120" y="120" width="120" height="25" fill="white" stroke="#bdc3c7"/>
    <rect x="240" y="120" width="120" height="25" fill="white" stroke="#bdc3c7"/>
    <rect x="360" y="120" width="120" height="25" fill="white" stroke="#bdc3c7"/>
    <rect x="480" y="120" width="120" height="25" fill="white" stroke="#bdc3c7"/>
    <rect x="600" y="120" width="150" height="25" fill="white" stroke="#bdc3c7"/>
    
    <text x="60" y="137" text-anchor="middle" class="label-text">Stability</text>
    <text x="180" y="137" text-anchor="middle" class="label-text">High</text>
    <text x="300" y="137" text-anchor="middle" class="label-text">Medium</text>
    <text x="420" y="137" text-anchor="middle" class="label-text">High</text>
    <text x="540" y="137" text-anchor="middle" class="label-text">Very High</text>
    <text x="675" y="137" text-anchor="middle" class="label-text">Mixed patterns</text>
  </g>
</svg>