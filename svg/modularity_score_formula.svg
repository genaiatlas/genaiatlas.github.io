<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title-text { font-family: 'Arial', sans-serif; font-size: 26px; font-weight: bold; fill: #2c3e50; }
      .section-text { font-family: 'Arial', sans-serif; font-size: 18px; font-weight: bold; fill: #34495e; }
      .formula-large { font-family: 'Times New Roman', serif; font-size: 28px; font-weight: bold; fill: #e74c3c; }
      .formula-medium { font-family: 'Times New Roman', serif; font-size: 20px; fill: #2c3e50; }
      .label-text { font-family: 'Arial', sans-serif; font-size: 14px; fill: #2c3e50; }
      .highlight-text { font-family: 'Arial', sans-serif; font-size: 16px; font-weight: bold; fill: #8e44ad; }
      .community1 { fill: #3498db; stroke: #2980b9; stroke-width: 2; }
      .community2 { fill: #e74c3c; stroke: #c0392b; stroke-width: 2; }
      .edge-actual { stroke: #27ae60; stroke-width: 4; }
      .edge-expected { stroke: #f39c12; stroke-width: 3; stroke-dasharray: 8,4; }
      .formula-box { fill: #ecf0f1; stroke: #34495e; stroke-width: 2; }
      .component-box { fill: none; stroke: #9b59b6; stroke-width: 2; stroke-dasharray: 5,3; }
    </style>
  </defs>
  
  <!-- Title -->
  <text x="500" y="35" text-anchor="middle" class="title-text">Modularity Score Formula</text>
  
  <!-- Main Formula -->
  <rect x="150" y="60" width="700" height="80" class="formula-box"/>
  <text x="500" y="90" text-anchor="middle" class="section-text">Complete Modularity Formula</text>
  <text x="500" y="120" text-anchor="middle" class="formula-large">Q = (1/2m) Σ [A_ij - (k_i × k_j)/(2m)] δ(c_i, c_j)</text>
  
  <!-- Formula Components -->
  <text x="100" y="180" class="section-text">Formula Components:</text>
  
  <!-- Component explanations -->
  <rect x="50" y="200" width="180" height="120" class="component-box"/>
  <text x="140" y="220" text-anchor="middle" class="highlight-text">A_ij Component</text>
  <text x="70" y="240" class="label-text">A_ij = 1 if edge exists</text>
  <text x="70" y="255" class="label-text">A_ij = 0 if no edge</text>
  <circle cx="100" cy="280" r="8" class="community1"/>
  <circle cx="170" cy="280" r="8" class="community1"/>
  <line x1="100" y1="280" x2="170" y2="280" class="edge-actual"/>
  <text x="135" y="305" text-anchor="middle" class="label-text">A_ij = 1</text>
  
  <rect x="260" y="200" width="180" height="120" class="component-box"/>
  <text x="350" y="220" text-anchor="middle" class="highlight-text">Expected Term</text>
  <text x="270" y="240" class="formula-medium">(k_i × k_j)/(2m)</text>
  <text x="270" y="260" class="label-text">k_i = degree of node i</text>
  <text x="270" y="275" class="label-text">k_j = degree of node j</text>
  <text x="270" y="290" class="label-text">m = total edges</text>
  <text x="350" y="310" text-anchor="middle" class="label-text">Baseline probability</text>
  
  <rect x="470" y="200" width="180" height="120" class="component-box"/>
  <text x="560" y="220" text-anchor="middle" class="highlight-text">Community Indicator</text>
  <text x="490" y="240" class="formula-medium">δ(c_i, c_j)</text>
  <text x="490" y="260" class="label-text">δ = 1 if same community</text>
  <text x="490" y="275" class="label-text">δ = 0 if different community</text>
  <circle cx="520" cy="295" r="6" class="community1"/>
  <circle cx="540" cy="295" r="6" class="community1"/>
  <text x="530" y="315" text-anchor="middle" class="label-text">δ = 1</text>
  
  <rect x="680" y="200" width="180" height="120" class="component-box"/>
  <text x="770" y="220" text-anchor="middle" class="highlight-text">Normalization</text>
  <text x="700" y="240" class="formula-medium">1/(2m)</text>
  <text x="700" y="260" class="label-text">Scales by total edges</text>
  <text x="700" y="275" class="label-text">Ensures Q ∈ [-1, 1]</text>
  <text x="700" y="290" class="label-text">Enables comparison</text>
  <text x="770" y="310" text-anchor="middle" class="label-text">across networks</text>
  
  <!-- Example Calculation -->
  <text x="500" y="380" text-anchor="middle" class="section-text">Step-by-Step Example</text>
  
  <!-- Example graph -->
  <rect x="100" y="400" width="300" height="200" fill="none" stroke="#34495e" stroke-width="2"/>
  <text x="250" y="420" text-anchor="middle" class="highlight-text">Sample Network</text>
  
  <!-- Community 1 -->
  <circle cx="150" cy="460" r="12" class="community1"/>
  <circle cx="200" cy="460" r="12" class="community1"/>
  <circle cx="150" cy="510" r="12" class="community1"/>
  <text x="130" y="450" class="label-text">1</text>
  <text x="180" y="450" class="label-text">2</text>
  <text x="130" y="500" class="label-text">3</text>
  
  <!-- Community 2 -->
  <circle cx="300" cy="460" r="12" class="community2"/>
  <circle cx="350" cy="460" r="12" class="community2"/>
  <text x="320" y="450" class="label-text">4</text>
  <text x="370" y="450" class="label-text">5</text>
  
  <!-- Edges -->
  <line x1="150" y1="460" x2="200" y2="460" class="edge-actual"/>
  <line x1="150" y1="460" x2="150" y2="510" class="edge-actual"/>
  <line x1="200" y1="460" x2="150" y2="510" class="edge-actual"/>
  <line x1="300" y1="460" x2="350" y2="460" class="edge-actual"/>
  <line x1="200" y1="460" x2="300" y2="460" class="edge-expected"/>
  
  <text x="250" y="540" text-anchor="middle" class="label-text">Blue edges: within community</text>
  <text x="250" y="555" text-anchor="middle" class="label-text">Orange edge: between communities</text>
  <text x="250" y="580" text-anchor="middle" class="label-text">Total edges m = 5</text>
  
  <!-- Calculation steps -->
  <rect x="450" y="400" width="500" height="280" fill="none" stroke="#34495e" stroke-width="2"/>
  <text x="700" y="420" text-anchor="middle" class="highlight-text">Calculation Steps</text>
  
  <text x="470" y="450" class="label-text">Step 1: Calculate degrees</text>
  <text x="470" y="470" class="formula-medium">k₁ = 2, k₂ = 3, k₃ = 2, k₄ = 2, k₅ = 1</text>
  
  <text x="470" y="500" class="label-text">Step 2: For community 1 (nodes 1,2,3):</text>
  <text x="470" y="520" class="formula-medium">A₁₂ - k₁k₂/(2m) = 1 - (2×3)/(2×5) = 1 - 0.6 = 0.4</text>
  <text x="470" y="540" class="formula-medium">A₁₃ - k₁k₃/(2m) = 1 - (2×2)/(2×5) = 1 - 0.4 = 0.6</text>
  <text x="470" y="560" class="formula-medium">A₂₃ - k₂k₃/(2m) = 1 - (3×2)/(2×5) = 1 - 0.6 = 0.4</text>
  
  <text x="470" y="590" class="label-text">Step 3: For community 2 (nodes 4,5):</text>
  <text x="470" y="610" class="formula-medium">A₄₅ - k₄k₅/(2m) = 1 - (2×1)/(2×5) = 1 - 0.2 = 0.8</text>
  
  <text x="470" y="640" class="label-text">Step 4: Sum and normalize:</text>
  <text x="470" y="660" class="formula-medium">Q = (1/10) × (0.4 + 0.6 + 0.4 + 0.8) = 0.22</text>
  
  <!-- Interpretation -->
  <rect x="150" y="630" width="700" height="50" fill="#d5dbdb" stroke="#34495e" stroke-width="1"/>
  <text x="500" y="650" text-anchor="middle" class="section-text">Interpretation: Q = 0.22</text>
  <text x="500" y="670" text-anchor="middle" class="label-text">Moderate community structure - communities have more internal edges than expected by chance</text>
  
</svg>