<svg width="500" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 24px; font-weight: bold; fill: #2c3e50; }
      .section-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #34495e; }
      .label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #2c3e50; }
      .small-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #34495e; }
      .mini-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10px; fill: #7f8c8d; }
      
      .dataset-box { fill: #e8f4fd; stroke: #3498db; stroke-width: 2; rx: 8; }
      .sample-box { fill: #ebf3fd; stroke: #2980b9; stroke-width: 1.5; rx: 6; }
      .model-box { fill: #fef9e7; stroke: #f39c12; stroke-width: 2; rx: 6; }
      .prediction-box { fill: #eafaf1; stroke: #27ae60; stroke-width: 1.5; rx: 6; }
      .result-box { fill: #f4ecf7; stroke: #8e44ad; stroke-width: 3; rx: 8; }
      
      .arrow { stroke: #34495e; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .thick-arrow { stroke: #e74c3c; stroke-width: 3; fill: none; marker-end: url(#thick-arrowhead); }
      
      .data-cell { fill: #bdc3c7; stroke: #95a5a6; stroke-width: 0.5; }
      .tree-node { fill: #a9dfbf; stroke: #27ae60; stroke-width: 1; }
      .tree-leaf { fill: #f7dc6f; stroke: #f1c40f; stroke-width: 1; }
    </style>
    
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e" />
    </marker>
    
    <marker id="thick-arrowhead" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <polygon points="0 0, 12 4.5, 0 9" fill="#e74c3c" />
    </marker>
    
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#34495e" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="500" height="800" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="250" y="40" text-anchor="middle" class="title">Ensemble Workflow</text>
  
  <!-- Step 1: Original Dataset -->
  <g transform="translate(170, 80)">
    <rect x="0" y="0" width="160" height="100" class="dataset-box" filter="url(#shadow)"/>
    <text x="80" y="25" text-anchor="middle" class="section-title">Original Dataset</text>
    <text x="80" y="45" text-anchor="middle" class="label">1000 samples, 10 features</text>
    
    <!-- Data visualization -->
    <g transform="translate(20, 55)">
      <text x="60" y="0" text-anchor="middle" class="mini-label">Sample Data Rows:</text>
      <g transform="translate(0, 10)">
        <rect x="0" y="0" width="12" height="4" class="data-cell"/>
        <rect x="15" y="0" width="12" height="4" class="data-cell"/>
        <rect x="30" y="0" width="12" height="4" class="data-cell"/>
        <rect x="45" y="0" width="12" height="4" class="data-cell"/>
        <rect x="60" y="0" width="12" height="4" class="data-cell"/>
        <rect x="75" y="0" width="12" height="4" class="data-cell"/>
        <rect x="90" y="0" width="12" height="4" class="data-cell"/>
        <rect x="105" y="0" width="12" height="4" class="data-cell"/>
        
        <rect x="0" y="8" width="12" height="4" class="data-cell"/>
        <rect x="15" y="8" width="12" height="4" class="data-cell"/>
        <rect x="30" y="8" width="12" height="4" class="data-cell"/>
        <rect x="45" y="8" width="12" height="4" class="data-cell"/>
        <rect x="60" y="8" width="12" height="4" class="data-cell"/>
        <rect x="75" y="8" width="12" height="4" class="data-cell"/>
        <rect x="90" y="8" width="12" height="4" class="data-cell"/>
        <rect x="105" y="8" width="12" height="4" class="data-cell"/>
        
        <text x="60" y="24" text-anchor="middle" class="mini-label">...</text>
      </g>
    </g>
  </g>
  
  <!-- Step 2: Bootstrap Sampling -->
  <g transform="translate(50, 220)">
    <text x="200" y="0" text-anchor="middle" class="section-title">Step 1: Bootstrap Sampling</text>
    
    <!-- Bootstrap Sample 1 -->
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="100" height="70" class="sample-box" filter="url(#shadow)"/>
      <text x="50" y="20" text-anchor="middle" class="label">Bootstrap</text>
      <text x="50" y="35" text-anchor="middle" class="label">Sample 1</text>
      <text x="50" y="50" text-anchor="middle" class="small-label">800 samples</text>
      <text x="50" y="62" text-anchor="middle" class="mini-label">(with replacement)</text>
    </g>
    
    <!-- Bootstrap Sample 2 -->
    <g transform="translate(120, 20)">
      <rect x="0" y="0" width="100" height="70" class="sample-box" filter="url(#shadow)"/>
      <text x="50" y="20" text-anchor="middle" class="label">Bootstrap</text>
      <text x="50" y="35" text-anchor="middle" class="label">Sample 2</text>
      <text x="50" y="50" text-anchor="middle" class="small-label">800 samples</text>
      <text x="50" y="62" text-anchor="middle" class="mini-label">(with replacement)</text>
    </g>
    
    <!-- Bootstrap Sample 3 -->
    <g transform="translate(240, 20)">
      <rect x="0" y="0" width="100" height="70" class="sample-box" filter="url(#shadow)"/>
      <text x="50" y="20" text-anchor="middle" class="label">Bootstrap</text>
      <text x="50" y="35" text-anchor="middle" class="label">Sample 3</text>
      <text x="50" y="50" text-anchor="middle" class="small-label">800 samples</text>
      <text x="50" y="62" text-anchor="middle" class="mini-label">(with replacement)</text>
    </g>
    
    <g transform="translate(360, 45)">
      <text x="0" y="0" text-anchor="middle" class="section-title">... → 100</text>
    </g>
  </g>
  
  <!-- Arrows from dataset to samples -->
  <line x1="250" y1="180" x2="100" y2="240" class="arrow"/>
  <line x1="250" y1="180" x2="220" y2="240" class="arrow"/>
  <line x1="250" y1="180" x2="340" y2="240" class="arrow"/>
  
  <!-- Step 3: Model Training -->
  <g transform="translate(50, 350)">
    <text x="200" y="0" text-anchor="middle" class="section-title">Step 2: Train Individual Models</text>
    
    <!-- Decision Tree 1 -->
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="100" height="90" class="model-box" filter="url(#shadow)"/>
      <text x="50" y="20" text-anchor="middle" class="label">Decision Tree 1</text>
      <!-- Tree visualization -->
      <circle cx="50" cy="40" r="8" class="tree-node"/>
      <circle cx="35" cy="60" r="6" class="tree-node"/>
      <circle cx="65" cy="60" r="6" class="tree-node"/>
      <circle cx="27" cy="75" r="4" class="tree-leaf"/>
      <circle cx="43" cy="75" r="4" class="tree-leaf"/>
      <circle cx="57" cy="75" r="4" class="tree-leaf"/>
      <circle cx="73" cy="75" r="4" class="tree-leaf"/>
      
      <line x1="50" y1="48" x2="35" y2="52" stroke="#34495e" stroke-width="1"/>
      <line x1="50" y1="48" x2="65" y2="52" stroke="#34495e" stroke-width="1"/>
      <line x1="35" y1="66" x2="27" y2="71" stroke="#34495e" stroke-width="1"/>
      <line x1="35" y1="66" x2="43" y2="71" stroke="#34495e" stroke-width="1"/>
      <line x1="65" y1="66" x2="57" y2="71" stroke="#34495e" stroke-width="1"/>
      <line x1="65" y1="66" x2="73" y2="71" stroke="#34495e" stroke-width="1"/>
    </g>
    
    <!-- Decision Tree 2 -->
    <g transform="translate(120, 20)">
      <rect x="0" y="0" width="100" height="90" class="model-box" filter="url(#shadow)"/>
      <text x="50" y="20" text-anchor="middle" class="label">Decision Tree 2</text>
      <!-- Tree visualization -->
      <circle cx="50" cy="40" r="8" class="tree-node"/>
      <circle cx="35" cy="60" r="6" class="tree-node"/>
      <circle cx="65" cy="60" r="6" class="tree-node"/>
      <circle cx="27" cy="75" r="4" class="tree-leaf"/>
      <circle cx="43" cy="75" r="4" class="tree-leaf"/>
      <circle cx="57" cy="75" r="4" class="tree-leaf"/>
      <circle cx="73" cy="75" r="4" class="tree-leaf"/>
      
      <line x1="50" y1="48" x2="35" y2="52" stroke="#34495e" stroke-width="1"/>
      <line x1="50" y1="48" x2="65" y2="52" stroke="#34495e" stroke-width="1"/>
      <line x1="35" y1="66" x2="27" y2="71" stroke="#34495e" stroke-width="1"/>
      <line x1="35" y1="66" x2="43" y2="71" stroke="#34495e" stroke-width="1"/>
      <line x1="65" y1="66" x2="57" y2="71" stroke="#34495e" stroke-width="1"/>
      <line x1="65" y1="66" x2="73" y2="71" stroke="#34495e" stroke-width="1"/>
    </g>
    
    <!-- Decision Tree 3 -->
    <g transform="translate(240, 20)">
      <rect x="0" y="0" width="100" height="90" class="model-box" filter="url(#shadow)"/>
      <text x="50" y="20" text-anchor="middle" class="label">Decision Tree 3</text>
      <!-- Tree visualization -->
      <circle cx="50" cy="40" r="8" class="tree-node"/>
      <circle cx="35" cy="60" r="6" class="tree-node"/>
      <circle cx="65" cy="60" r="6" class="tree-node"/>
      <circle cx="27" cy="75" r="4" class="tree-leaf"/>
      <circle cx="43" cy="75" r="4" class="tree-leaf"/>
      <circle cx="57" cy="75" r="4" class="tree-leaf"/>
      <circle cx="73" cy="75" r="4" class="tree-leaf"/>
      
      <line x1="50" y1="48" x2="35" y2="52" stroke="#34495e" stroke-width="1"/>
      <line x1="50" y1="48" x2="65" y2="52" stroke="#34495e" stroke-width="1"/>
      <line x1="35" y1="66" x2="27" y2="71" stroke="#34495e" stroke-width="1"/>
      <line x1="35" y1="66" x2="43" y2="71" stroke="#34495e" stroke-width="1"/>
      <line x1="65" y1="66" x2="57" y2="71" stroke="#34495e" stroke-width="1"/>
      <line x1="65" y1="66" x2="73" y2="71" stroke="#34495e" stroke-width="1"/>
    </g>
    
    <g transform="translate(360, 55)">
      <text x="0" y="0" text-anchor="middle" class="section-title">... → 100</text>
    </g>
  </g>
  
  <!-- Arrows from samples to models -->
  <line x1="100" y1="310" x2="100" y2="370" class="arrow"/>
  <line x1="220" y1="310" x2="220" y2="370" class="arrow"/>
  <line x1="340" y1="310" x2="340" y2="370" class="arrow"/>
  
  <!-- Step 4: Predictions -->
  <g transform="translate(50, 480)">
    <text x="200" y="0" text-anchor="middle" class="section-title">Step 3: Individual Predictions</text>
    
    <!-- Prediction 1 -->
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="100" height="50" class="prediction-box" filter="url(#shadow)"/>
      <text x="50" y="20" text-anchor="middle" class="label">Prediction 1</text>
      <text x="50" y="35" text-anchor="middle" class="label" font-weight="bold">$250K</text>
    </g>
    
    <!-- Prediction 2 -->
    <g transform="translate(120, 20)">
      <rect x="0" y="0" width="100" height="50" class="prediction-box" filter="url(#shadow)"/>
      <text x="50" y="20" text-anchor="middle" class="label">Prediction 2</text>
      <text x="50" y="35" text-anchor="middle" class="label" font-weight="bold">$280K</text>
    </g>
    
    <!-- Prediction 3 -->
    <g transform="translate(240, 20)">
      <rect x="0" y="0" width="100" height="50" class="prediction-box" filter="url(#shadow)"/>
      <text x="50" y="20" text-anchor="middle" class="label">Prediction 3</text>
      <text x="50" y="35" text-anchor="middle" class="label" font-weight="bold">$240K</text>
    </g>
    
    <g transform="translate(360, 35)">
      <text x="0" y="0" text-anchor="middle" class="section-title">... → 100</text>
    </g>
  </g>
  
  <!-- Arrows from models to predictions -->
  <line x1="100" y1="460" x2="100" y2="500" class="arrow"/>
  <line x1="220" y1="460" x2="220" y2="500" class="arrow"/>
  <line x1="340" y1="460" x2="340" y2="500" class="arrow"/>
  
  <!-- Step 5: Final Result -->
  <g transform="translate(100, 580)">
    <text x="200" y="0" text-anchor="middle" class="section-title">Step 4: Aggregate Results</text>
    
    <g transform="translate(50, 20)">
      <rect x="0" y="0" width="300" height="80" class="result-box" filter="url(#shadow)"/>
      <text x="150" y="25" text-anchor="middle" class="section-title">Final Ensemble Prediction</text>
      <text x="150" y="45" text-anchor="middle" class="label">Average: (250K + 280K + 240K + ... + others) ÷ 100</text>
      <text x="150" y="65" text-anchor="middle" class="label" font-weight="bold" font-size="16px">Result: $265K</text>
    </g>
  </g>
  
  <!-- Beautiful curved convergence arrows -->
  <path d="M 125 555 Q 180 570 250 600" class="thick-arrow"/>
  <path d="M 275 550 Q 270 570 250 600" class="thick-arrow"/>
  <path d="M 415 560 Q 350 575 250 600" class="thick-arrow"/>
</svg>