<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="700" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="600" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">Decision Tree Construction from Bootstrap Samples</text>
  
  <!-- Entropy Formula Section -->
  <g transform="translate(50, 60)">
    <rect x="0" y="0" width="1100" height="70" fill="#fff" stroke="#3f51b5" stroke-width="2" rx="8"/>
    <text x="20" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#3f51b5">Entropy Minimization Algorithm</text>
    <text x="20" y="45" font-family="Arial, sans-serif" font-size="12" fill="#424242">Entropy(S) = -Σᵢ pᵢ log₂(pᵢ)     Information Gain = Entropy(S) - Σᵥ |Sᵥ|/|S| × Entropy(Sᵥ)</text>
    <text x="20" y="60" font-family="Arial, sans-serif" font-size="12" fill="#424242">Select feature with maximum information gain for optimal splits</text>
  </g>
  
  <!-- Tree 1 Construction -->
  <g transform="translate(50, 150)">
    <rect x="0" y="0" width="350" height="480" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="10"/>
    <text x="175" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1976d2">Tree 1: Bootstrap Sample B₁</text>
    <text x="175" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1976d2">Samples: X₁₁, X₁₂, X₇, X₂, X₁₂</text>
    
    <!-- Sample Data -->
    <g transform="translate(20, 60)">
      <text x="0" y="15" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#424242">Sample Data Analysis:</text>
      <text x="0" y="35" font-family="Arial, sans-serif" font-size="10" fill="#424242">X₁₁: Thai → Leave</text>
      <text x="0" y="50" font-family="Arial, sans-serif" font-size="10" fill="#424242">X₁₂: Burger → Wait</text>
      <text x="0" y="65" font-family="Arial, sans-serif" font-size="10" fill="#424242">X₇: Burger → Leave</text>
      <text x="0" y="80" font-family="Arial, sans-serif" font-size="10" fill="#424242">X₂: Thai → Leave</text>
      <text x="0" y="95" font-family="Arial, sans-serif" font-size="10" fill="#424242">X₁₂: Burger → Wait (duplicate)</text>
    </g>
    
    <!-- Feature Analysis -->
    <g transform="translate(20, 170)">
      <text x="0" y="15" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#424242">Feature Analysis:</text>
      <text x="0" y="35" font-family="Arial, sans-serif" font-size="10" fill="#424242">Type: Thai(2)→Leave, Burger(3)→Mixed</text>
      <text x="0" y="50" font-family="Arial, sans-serif" font-size="10" fill="#424242">Information Gain = 0.45</text>
      <text x="0" y="70" font-family="Arial, sans-serif" font-size="10" fill="#424242">Hungry: Mixed distribution</text>
      <text x="0" y="85" font-family="Arial, sans-serif" font-size="10" fill="#424242">Information Gain = 0.2</text>
      <text x="0" y="105" font-family="Arial, sans-serif" font-size="10" fill="#424242">Rain: Mixed distribution</text>
      <text x="0" y="120" font-family="Arial, sans-serif" font-size="10" fill="#424242">Information Gain = 0.1</text>
    </g>
    
    <!-- Tree Visualization -->
    <g transform="translate(100, 310)">
      <circle cx="75" cy="30" r="20" fill="#4caf50" stroke="#2e7d32" stroke-width="2"/>
      <text x="75" y="37" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Type</text>
      
      <!-- Branches -->
      <line x1="55" y1="45" x2="25" y2="80" stroke="#424242" stroke-width="2"/>
      <line x1="95" y1="45" x2="125" y2="80" stroke="#424242" stroke-width="2"/>
      
      <!-- Labels -->
      <text x="15" y="75" font-family="Arial, sans-serif" font-size="9" fill="#424242">Thai</text>
      <text x="130" y="75" font-family="Arial, sans-serif" font-size="9" fill="#424242">Burger</text>
      
      <!-- Leaf nodes -->
      <rect x="5" y="85" width="40" height="25" fill="#ff5722" rx="5"/>
      <text x="25" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Leave</text>
      
      <rect x="105" y="85" width="40" height="25" fill="#2196f3" rx="5"/>
      <text x="125" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Wait</text>
      
      <!-- Statistics -->
      <text x="75" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1976d2">Entropy Loss: 0.55</text>
      <text x="75" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1976d2">Depth: 1</text>
    </g>
  </g>
  
  <!-- Tree 2 Construction -->
  <g transform="translate(425, 150)">
    <rect x="0" y="0" width="350" height="480" fill="#fff3e0" stroke="#f57c00" stroke-width="2" rx="10"/>
    <text x="175" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#f57c00">Tree 2: Bootstrap Sample B₂</text>
    <text x="175" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#f57c00">Samples: X₅, X₄, X₆, X₈, X₇</text>
    
    <!-- Sample Data -->
    <g transform="translate(20, 60)">
      <text x="0" y="15" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#424242">Sample Data Analysis:</text>
      <text x="0" y="35" font-family="Arial, sans-serif" font-size="10" fill="#424242">X₅: French, Hungry=No → Leave</text>
      <text x="0" y="50" font-family="Arial, sans-serif" font-size="10" fill="#424242">X₄: Thai, Hungry=Yes → Wait</text>
      <text x="0" y="65" font-family="Arial, sans-serif" font-size="10" fill="#424242">X₆: Italian, Hungry=Yes → Wait</text>
      <text x="0" y="80" font-family="Arial, sans-serif" font-size="10" fill="#424242">X₈: Thai, Hungry=Yes → Wait</text>
      <text x="0" y="95" font-family="Arial, sans-serif" font-size="10" fill="#424242">X₇: Burger, Hungry=No → Leave</text>
    </g>
    
    <!-- Feature Analysis -->
    <g transform="translate(20, 170)">
      <text x="0" y="15" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#424242">Feature Analysis:</text>
      <text x="0" y="35" font-family="Arial, sans-serif" font-size="10" fill="#424242">Hungry: Yes(3)→Wait, No(2)→Leave</text>
      <text x="0" y="50" font-family="Arial, sans-serif" font-size="10" fill="#424242">Information Gain = 1.0 (Perfect!)</text>
      <text x="0" y="70" font-family="Arial, sans-serif" font-size="10" fill="#424242">Type: Mixed distribution</text>
      <text x="0" y="85" font-family="Arial, sans-serif" font-size="10" fill="#424242">Information Gain = 0.6</text>
      <text x="0" y="105" font-family="Arial, sans-serif" font-size="10" fill="#424242">Rain: Mixed distribution</text>
      <text x="0" y="120" font-family="Arial, sans-serif" font-size="10" fill="#424242">Information Gain = 0.3</text>
    </g>
    
    <!-- Tree Visualization -->
    <g transform="translate(100, 310)">
      <circle cx="75" cy="30" r="20" fill="#4caf50" stroke="#2e7d32" stroke-width="2"/>
      <text x="75" y="37" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Hungry</text>
      
      <!-- Branches -->
      <line x1="55" y1="45" x2="25" y2="80" stroke="#424242" stroke-width="2"/>
      <line x1="95" y1="45" x2="125" y2="80" stroke="#424242" stroke-width="2"/>
      
      <!-- Labels -->
      <text x="15" y="75" font-family="Arial, sans-serif" font-size="9" fill="#424242">Yes</text>
      <text x="135" y="75" font-family="Arial, sans-serif" font-size="9" fill="#424242">No</text>
      
      <!-- Leaf nodes -->
      <rect x="5" y="85" width="40" height="25" fill="#2196f3" rx="5"/>
      <text x="25" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Wait</text>
      
      <rect x="105" y="85" width="40" height="25" fill="#ff5722" rx="5"/>
      <text x="125" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Leave</text>
      
      <!-- Statistics -->
      <text x="75" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#f57c00">Entropy Loss: 0.0</text>
      <text x="75" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#f57c00">Perfect Split!</text>
    </g>
  </g>
  
  <!-- Tree 3 Construction -->
  <g transform="translate(800, 150)">
    <rect x="0" y="0" width="350" height="480" fill="#e8f5e8" stroke="#27ae60" stroke-width="2" rx="10"/>
    <text x="175" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#27ae60">Tree 3: Bootstrap Sample B₃</text>
    <text x="175" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#27ae60">Samples: X₉, X₁₀, X₄, X₂, X₁₀</text>
    
    <!-- Sample Data -->
    <g transform="translate(20, 60)">
      <text x="0" y="15" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#424242">Sample Data Analysis:</text>
      <text x="0" y="35" font-family="Arial, sans-serif" font-size="10" fill="#424242">X₉: Burger, Rain=No → Leave</text>
      <text x="0" y="50" font-family="Arial, sans-serif" font-size="10" fill="#424242">X₁₀: Italian, Rain=Yes → Leave</text>
      <text x="0" y="65" font-family="Arial, sans-serif" font-size="10" fill="#424242">X₄: Thai, Rain=No → Wait</text>
      <text x="0" y="80" font-family="Arial, sans-serif" font-size="10" fill="#424242">X₂: Thai, Rain=No → Leave</text>
      <text x="0" y="95" font-family="Arial, sans-serif" font-size="10" fill="#424242">X₁₀: Italian, Rain=Yes → Leave (dup.)</text>
    </g>
    
    <!-- Feature Analysis -->
    <g transform="translate(20, 170)">
      <text x="0" y="15" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#424242">Feature Analysis:</text>
      <text x="0" y="35" font-family="Arial, sans-serif" font-size="10" fill="#424242">Rain: Yes(2)→Leave, No(3)→Mixed</text>
      <text x="0" y="50" font-family="Arial, sans-serif" font-size="10" fill="#424242">Information Gain = 0.6</text>
      <text x="0" y="70" font-family="Arial, sans-serif" font-size="10" fill="#424242">Type: Mixed distribution</text>
      <text x="0" y="85" font-family="Arial, sans-serif" font-size="10" fill="#424242">Information Gain = 0.4</text>
      <text x="0" y="105" font-family="Arial, sans-serif" font-size="10" fill="#424242">Hungry: Mixed distribution</text>
      <text x="0" y="120" font-family="Arial, sans-serif" font-size="10" fill="#424242">Information Gain = 0.2</text>
    </g>
    
    <!-- Tree Visualization -->
    <g transform="translate(100, 310)">
      <circle cx="75" cy="30" r="20" fill="#4caf50" stroke="#2e7d32" stroke-width="2"/>
      <text x="75" y="37" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Rain</text>
      
      <!-- Branches -->
      <line x1="55" y1="45" x2="25" y2="80" stroke="#424242" stroke-width="2"/>
      <line x1="95" y1="45" x2="125" y2="80" stroke="#424242" stroke-width="2"/>
      
      <!-- Labels -->
      <text x="15" y="75" font-family="Arial, sans-serif" font-size="9" fill="#424242">Yes</text>
      <text x="135" y="75" font-family="Arial, sans-serif" font-size="9" fill="#424242">No</text>
      
      <!-- Leaf nodes -->
      <rect x="5" y="85" width="40" height="25" fill="#ff5722" rx="5"/>
      <text x="25" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Leave</text>
      
      <rect x="105" y="85" width="40" height="25" fill="#ff9800" rx="5"/>
      <text x="125" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">Mixed</text>
      
      <!-- Statistics -->
      <text x="75" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#27ae60">Entropy Loss: 0.4</text>
      <text x="75" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#27ae60">Moderate Split</text>
    </g>
  </g>
  
  <!-- Summary -->
  <g transform="translate(50, 650)">
    <rect x="0" y="0" width="1100" height="40" fill="#fff" stroke="#9e9e9e" stroke-width="1" rx="5" stroke-dasharray="5,5"/>
    <text x="20" y="20" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#424242">Key Insight: Different bootstrap samples lead to different optimal features</text>
    <text x="20" y="35" font-family="Arial, sans-serif" font-size="11" fill="#424242">This diversity is crucial for ensemble performance - each tree captures different aspects of the decision space</text>
  </g>
</svg>