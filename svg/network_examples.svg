<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="700" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="500" y="35" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Real-World Network Examples
  </text>
  
  <!-- Social Network -->
  <g id="social-network">
    <rect x="30" y="60" width="220" height="190" fill="white" stroke="#3498db" stroke-width="2" rx="10"/>
    <text x="140" y="85" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#3498db">
      Social Networks
    </text>
    <text x="140" y="105" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d">
      Facebook, Twitter, LinkedIn
    </text>
    
    <!-- Central influencer -->
    <circle cx="140" cy="150" r="18" fill="#3498db" stroke="#2c3e50" stroke-width="2"/>
    <text x="140" y="157" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="white">P</text>
    
    <!-- Connected users -->
    <circle cx="90" cy="120" r="12" fill="#3498db" stroke="#2c3e50" stroke-width="1.5"/>
    <circle cx="190" cy="120" r="12" fill="#3498db" stroke="#2c3e50" stroke-width="1.5"/>
    <circle cx="90" cy="180" r="12" fill="#3498db" stroke="#2c3e50" stroke-width="1.5"/>
    <circle cx="190" cy="180" r="12" fill="#3498db" stroke="#2c3e50" stroke-width="1.5"/>
    <circle cx="140" cy="200" r="12" fill="#3498db" stroke="#2c3e50" stroke-width="1.5"/>
    
    <!-- Connections -->
    <line x1="122" y1="150" x2="102" y2="130" stroke="#34495e" stroke-width="1.5"/>
    <line x1="158" y1="150" x2="178" y2="130" stroke="#34495e" stroke-width="1.5"/>
    <line x1="122" y1="150" x2="102" y2="170" stroke="#34495e" stroke-width="1.5"/>
    <line x1="158" y1="150" x2="178" y2="170" stroke="#34495e" stroke-width="1.5"/>
    <line x1="140" y1="168" x2="140" y2="188" stroke="#34495e" stroke-width="1.5"/>
    
    <text x="140" y="230" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">
      Nodes: People
    </text>
    <text x="140" y="243" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">
      Edges: Friendships or Follows
    </text>
  </g>
  
  <!-- Web Network -->
  <g id="web-network">
    <rect x="280" y="60" width="220" height="190" fill="white" stroke="#e74c3c" stroke-width="2" rx="10"/>
    <text x="390" y="85" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#e74c3c">
      World Wide Web
    </text>
    <text x="390" y="105" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d">
      Websites and Hyperlinks
    </text>
    
    <!-- Webpage nodes -->
    <rect x="330" y="120" width="35" height="30" fill="#e74c3c" stroke="#2c3e50" stroke-width="1.5" rx="3"/>
    <text x="347" y="139" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">P1</text>
    
    <rect x="415" y="120" width="35" height="30" fill="#e74c3c" stroke="#2c3e50" stroke-width="1.5" rx="3"/>
    <text x="432" y="139" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">P2</text>
    
    <rect x="330" y="180" width="35" height="30" fill="#e74c3c" stroke="#2c3e50" stroke-width="1.5" rx="3"/>
    <text x="347" y="199" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">P3</text>
    
    <rect x="415" y="180" width="35" height="30" fill="#e74c3c" stroke="#2c3e50" stroke-width="1.5" rx="3"/>
    <text x="432" y="199" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">P4</text>
    
    <!-- Directed hyperlinks -->
    <defs>
      <marker id="arrow1" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#34495e"/>
      </marker>
    </defs>
    
    <path d="M 365 135 L 408 135" stroke="#34495e" stroke-width="2" fill="none" marker-end="url(#arrow1)"/>
    <path d="M 347 150 L 347 173" stroke="#34495e" stroke-width="2" fill="none" marker-end="url(#arrow1)"/>
    <path d="M 432 150 L 432 173" stroke="#34495e" stroke-width="2" fill="none" marker-end="url(#arrow1)"/>
    <path d="M 365 195 L 408 195" stroke="#34495e" stroke-width="2" fill="none" marker-end="url(#arrow1)"/>
    
    <text x="390" y="230" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">
      Nodes: Web Pages
    </text>
    <text x="390" y="243" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">
      Edges: Hyperlinks directed
    </text>
  </g>
  
  <!-- Biological Network -->
  <g id="biological-network">
    <rect x="530" y="60" width="220" height="190" fill="white" stroke="#27ae60" stroke-width="2" rx="10"/>
    <text x="640" y="85" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#27ae60">
      Biological Networks
    </text>
    <text x="640" y="105" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d">
      Neurons, Genes, Proteins
    </text>
    
    <!-- Neuron nodes -->
    <circle cx="590" cy="145" r="15" fill="#27ae60" stroke="#2c3e50" stroke-width="1.5"/>
    <text x="590" y="150" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">N1</text>
    
    <circle cx="690" cy="145" r="15" fill="#27ae60" stroke="#2c3e50" stroke-width="1.5"/>
    <text x="690" y="150" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">N2</text>
    
    <circle cx="640" cy="195" r="15" fill="#27ae60" stroke="#2c3e50" stroke-width="1.5"/>
    <text x="640" y="200" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">N3</text>
    
    <!-- Synaptic connections -->
    <path d="M 604 150 L 625 188" stroke="#f39c12" stroke-width="2.5" fill="none"/>
    <path d="M 676 150 L 655 188" stroke="#f39c12" stroke-width="2.5" fill="none"/>
    <path d="M 605 145 L 675 145" stroke="#f39c12" stroke-width="2.5" fill="none"/>
    
    <text x="640" y="230" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">
      Nodes: Neurons or Genes
    </text>
    <text x="640" y="243" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">
      Edges: Synapses or Regulation
    </text>
  </g>
  
  <!-- Infrastructure Network -->
  <g id="infrastructure-network">
    <rect x="780" y="60" width="200" height="190" fill="white" stroke="#f39c12" stroke-width="2" rx="10"/>
    <text x="880" y="85" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#f39c12">
      Infrastructure
    </text>
    <text x="880" y="105" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d">
      Power Grids, Roads
    </text>
    
    <!-- Grid nodes -->
    <circle cx="830" cy="140" r="14" fill="#f39c12" stroke="#2c3e50" stroke-width="1.5"/>
    <circle cx="930" cy="140" r="14" fill="#f39c12" stroke="#2c3e50" stroke-width="1.5"/>
    <circle cx="830" cy="200" r="14" fill="#f39c12" stroke="#2c3e50" stroke-width="1.5"/>
    <circle cx="930" cy="200" r="14" fill="#f39c12" stroke="#2c3e50" stroke-width="1.5"/>
    
    <!-- Grid connections -->
    <line x1="844" y1="140" x2="916" y2="140" stroke="#34495e" stroke-width="3"/>
    <line x1="830" y1="154" x2="830" y2="186" stroke="#34495e" stroke-width="3"/>
    <line x1="930" y1="154" x2="930" y2="186" stroke="#34495e" stroke-width="3"/>
    <line x1="844" y1="200" x2="916" y2="200" stroke="#34495e" stroke-width="3"/>
    
    <text x="880" y="230" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">
      Nodes: Stations
    </text>
    <text x="880" y="243" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">
      Edges: Transmission Lines
    </text>
  </g>
  
  <!-- Food Web -->
  <g id="food-web">
    <rect x="30" y="280" width="220" height="190" fill="white" stroke="#c0392b" stroke-width="2" rx="10"/>
    <text x="140" y="305" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#c0392b">
      Food Web - DAG
    </text>
    <text x="140" y="325" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d">
      Predator-Prey Relationships
    </text>
    
    <!-- Top predator -->
    <circle cx="140" cy="350" r="16" fill="#c0392b" stroke="#2c3e50" stroke-width="2"/>
    <text x="140" y="356" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">Lion</text>
    
    <!-- Middle tier -->
    <circle cx="90" cy="395" r="14" fill="#e67e22" stroke="#2c3e50" stroke-width="1.5"/>
    <text x="90" y="400" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">Zebra</text>
    
    <circle cx="190" cy="395" r="14" fill="#e67e22" stroke="#2c3e50" stroke-width="1.5"/>
    <text x="190" y="400" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">Deer</text>
    
    <!-- Bottom tier -->
    <circle cx="140" cy="435" r="14" fill="#27ae60" stroke="#2c3e50" stroke-width="1.5"/>
    <text x="140" y="440" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">Grass</text>
    
    <!-- Predation arrows -->
    <path d="M 130 365 L 100 383" stroke="#34495e" stroke-width="2" fill="none" marker-end="url(#arrow1)"/>
    <path d="M 150 365 L 180 383" stroke="#34495e" stroke-width="2" fill="none" marker-end="url(#arrow1)"/>
    <path d="M 100 409 L 135 425" stroke="#34495e" stroke-width="2" fill="none" marker-end="url(#arrow1)"/>
    <path d="M 180 409 L 145 425" stroke="#34495e" stroke-width="2" fill="none" marker-end="url(#arrow1)"/>
    
    <text x="140" y="460" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">
      Hierarchy: No directed cycles
    </text>
  </g>
  
  <!-- Citation Network -->
  <g id="citation-network">
    <rect x="280" y="280" width="220" height="190" fill="white" stroke="#8e44ad" stroke-width="2" rx="10"/>
    <text x="390" y="305" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#8e44ad">
      Citation Network
    </text>
    <text x="390" y="325" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d">
      Papers cite earlier papers
    </text>
    
    <!-- Earlier paper -->
    <rect x="325" y="340" width="30" height="35" fill="#8e44ad" stroke="#2c3e50" stroke-width="1.5" rx="2"/>
    <text x="340" y="363" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Paper</text>
    <text x="340" y="390" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#34495e">2020</text>
    
    <!-- Middle papers -->
    <rect x="375" y="365" width="30" height="35" fill="#8e44ad" stroke="#2c3e50" stroke-width="1.5" rx="2"/>
    <text x="390" y="388" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Paper</text>
    <text x="390" y="415" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#34495e">2022</text>
    
    <!-- Recent paper -->
    <rect x="425" y="390" width="30" height="35" fill="#8e44ad" stroke="#2c3e50" stroke-width="1.5" rx="2"/>
    <text x="440" y="413" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Paper</text>
    <text x="440" y="440" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#34495e">2024</text>
    
    <!-- Citation arrows -->
    <path d="M 355 357 L 378 375" stroke="#34495e" stroke-width="2" fill="none" marker-end="url(#arrow1)"/>
    <path d="M 405 382 L 428 397" stroke="#34495e" stroke-width="2" fill="none" marker-end="url(#arrow1)"/>
    <path d="M 355 368 L 421 405" stroke="#34495e" stroke-width="1.5" fill="none" marker-end="url(#arrow1)" stroke-dasharray="3,3"/>
    
    <text x="390" y="460" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">
      Time flows forward - DAG
    </text>
  </g>
  
  <!-- Recommendation System -->
  <g id="recommendation-network">
    <rect x="530" y="280" width="220" height="190" fill="white" stroke="#16a085" stroke-width="2" rx="10"/>
    <text x="640" y="305" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#16a085">
      Recommendation
    </text>
    <text x="640" y="325" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d">
      Bipartite: Users - Movies
    </text>
    
    <!-- Users (left) -->
    <text x="580" y="345" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#16a085">Users</text>
    <circle cx="580" cy="365" r="12" fill="#16a085" stroke="#2c3e50" stroke-width="1.5"/>
    <circle cx="580" cy="395" r="12" fill="#16a085" stroke="#2c3e50" stroke-width="1.5"/>
    <circle cx="580" cy="425" r="12" fill="#16a085" stroke="#2c3e50" stroke-width="1.5"/>
    
    <!-- Movies (right) -->
    <text x="700" y="345" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#e67e22">Movies</text>
    <circle cx="700" cy="365" r="12" fill="#e67e22" stroke="#2c3e50" stroke-width="1.5"/>
    <circle cx="700" cy="395" r="12" fill="#e67e22" stroke="#2c3e50" stroke-width="1.5"/>
    <circle cx="700" cy="425" r="12" fill="#e67e22" stroke="#2c3e50" stroke-width="1.5"/>
    
    <!-- Rating edges -->
    <line x1="592" y1="365" x2="688" y2="365" stroke="#34495e" stroke-width="1.5"/>
    <line x1="592" y1="365" x2="688" y2="395" stroke="#34495e" stroke-width="1.5"/>
    <line x1="592" y1="395" x2="688" y2="395" stroke="#34495e" stroke-width="1.5"/>
    <line x1="592" y1="395" x2="688" y2="425" stroke="#34495e" stroke-width="1.5"/>
    <line x1="592" y1="425" x2="688" y2="365" stroke="#34495e" stroke-width="1.5"/>
    
    <text x="640" y="460" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">
      Two disjoint node sets
    </text>
  </g>
  
  <!-- Internet Infrastructure -->
  <g id="internet-network">
    <rect x="780" y="280" width="200" height="190" fill="white" stroke="#2980b9" stroke-width="2" rx="10"/>
    <text x="880" y="305" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#2980b9">
      Internet
    </text>
    <text x="880" y="325" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d">
      Computers and Routers
    </text>
    
    <!-- Computer nodes -->
    <circle cx="830" cy="370" r="16" fill="#2980b9" stroke="#2c3e50" stroke-width="1.5"/>
    <text x="830" y="376" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">PC1</text>
    
    <circle cx="930" cy="370" r="16" fill="#2980b9" stroke="#2c3e50" stroke-width="1.5"/>
    <text x="930" y="376" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">PC2</text>
    
    <circle cx="880" cy="420" r="16" fill="#2980b9" stroke="#2c3e50" stroke-width="1.5"/>
    <text x="880" y="426" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">SRV</text>
    
    <!-- Network connections -->
    <line x1="846" y1="370" x2="914" y2="370" stroke="#34495e" stroke-width="2.5"/>
    <line x1="843" y1="383" x2="870" y2="408" stroke="#34495e" stroke-width="2.5"/>
    <line x1="917" y1="383" x2="890" y2="408" stroke="#34495e" stroke-width="2.5"/>
    
    <text x="880" y="460" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">
      Bidirectional communication
    </text>
  </g>
  
  <!-- Bottom summary -->
  <rect x="50" y="500" width="900" height="180" fill="white" stroke="#34495e" stroke-width="2" rx="10"/>
  <text x="500" y="530" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Key Insights: Network Diversity
  </text>
  
  <text x="100" y="560" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#34495e">
    <tspan font-weight="bold">1. Different Domains:</tspan> Networks appear in technology, biology, society, and infrastructure
  </text>
  
  <text x="100" y="590" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#34495e">
    <tspan font-weight="bold">2. Varied Structures:</tspan> Directed vs undirected, simple vs complex, cyclic vs acyclic
  </text>
  
  <text x="100" y="620" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#34495e">
    <tspan font-weight="bold">3. Common Principles:</tspan> Despite differences, similar analysis techniques apply across domains
  </text>
  
  <text x="100" y="650" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#34495e">
    <tspan font-weight="bold">4. Real-World Impact:</tspan> Understanding networks helps optimize systems and predict behavior
  </text>
</svg>