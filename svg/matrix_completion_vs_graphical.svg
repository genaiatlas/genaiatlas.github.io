<svg viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="700" y="40" font-size="28" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Matrix Completion vs Graphical Models for Recommendations
  </text>
  
  <!-- Left Side: Matrix Completion -->
  <g id="matrix-completion">
    <rect x="50" y="80" width="600" height="750" fill="#fff9e6" stroke="#f39c12" stroke-width="3" rx="10"/>
    
    <text x="350" y="120" font-size="22" font-weight="bold" text-anchor="middle" fill="#f39c12">
      Matrix Completion Approach
    </text>
    
    <!-- User-Item Matrix Visualization -->
    <rect x="100" y="150" width="500" height="200" fill="white" stroke="#34495e" stroke-width="2" rx="5"/>
    <text x="350" y="175" font-size="14" font-weight="bold" text-anchor="middle" fill="#34495e">
      User-Item Matrix
    </text>
    
    <!-- Matrix grid -->
    <line x1="100" y1="200" x2="600" y2="200" stroke="#95a5a6" stroke-width="1"/>
    <line x1="200" y1="150" x2="200" y2="350" stroke="#95a5a6" stroke-width="1"/>
    <line x1="300" y1="150" x2="300" y2="350" stroke="#95a5a6" stroke-width="1"/>
    <line x1="400" y1="150" x2="400" y2="350" stroke="#95a5a6" stroke-width="1"/>
    <line x1="500" y1="150" x2="500" y2="350" stroke="#95a5a6" stroke-width="1"/>
    
    <!-- Column headers -->
    <text x="150" y="195" font-size="11" text-anchor="middle" fill="#34495e" font-weight="bold">Movie 1</text>
    <text x="250" y="195" font-size="11" text-anchor="middle" fill="#34495e" font-weight="bold">Movie 2</text>
    <text x="350" y="195" font-size="11" text-anchor="middle" fill="#34495e" font-weight="bold">Movie 3</text>
    <text x="450" y="195" font-size="11" text-anchor="middle" fill="#34495e" font-weight="bold">Movie 4</text>
    <text x="550" y="195" font-size="11" text-anchor="middle" fill="#34495e" font-weight="bold">Movie 5</text>
    
    <!-- Row labels -->
    <text x="85" y="235" font-size="11" text-anchor="end" fill="#34495e" font-weight="bold">User 1</text>
    <text x="85" y="270" font-size="11" text-anchor="end" fill="#34495e" font-weight="bold">User 2</text>
    <text x="85" y="305" font-size="11" text-anchor="end" fill="#34495e" font-weight="bold">User 3</text>
    <text x="85" y="340" font-size="11" text-anchor="end" fill="#34495e" font-weight="bold">User 4</text>
    
    <!-- Matrix entries -->
    <text x="150" y="235" font-size="12" text-anchor="middle" fill="#27ae60" font-weight="bold">5</text>
    <text x="250" y="235" font-size="12" text-anchor="middle" fill="#95a5a6">?</text>
    <text x="350" y="235" font-size="12" text-anchor="middle" fill="#e74c3c" font-weight="bold">2</text>
    <text x="450" y="235" font-size="12" text-anchor="middle" fill="#95a5a6">?</text>
    <text x="550" y="235" font-size="12" text-anchor="middle" fill="#27ae60" font-weight="bold">4</text>
    
    <text x="150" y="270" font-size="12" text-anchor="middle" fill="#95a5a6">?</text>
    <text x="250" y="270" font-size="12" text-anchor="middle" fill="#27ae60" font-weight="bold">4</text>
    <text x="350" y="270" font-size="12" text-anchor="middle" fill="#95a5a6">?</text>
    <text x="450" y="270" font-size="12" text-anchor="middle" fill="#27ae60" font-weight="bold">5</text>
    <text x="550" y="270" font-size="12" text-anchor="middle" fill="#95a5a6">?</text>
    
    <text x="150" y="305" font-size="12" text-anchor="middle" fill="#e74c3c" font-weight="bold">1</text>
    <text x="250" y="305" font-size="12" text-anchor="middle" fill="#95a5a6">?</text>
    <text x="350" y="305" font-size="12" text-anchor="middle" fill="#95a5a6">?</text>
    <text x="450" y="305" font-size="12" text-anchor="middle" fill="#e74c3c" font-weight="bold">2</text>
    <text x="550" y="305" font-size="12" text-anchor="middle" fill="#27ae60" font-weight="bold">5</text>
    
    <text x="150" y="340" font-size="12" text-anchor="middle" fill="#95a5a6">?</text>
    <text x="250" y="340" font-size="12" text-anchor="middle" fill="#95a5a6">?</text>
    <text x="350" y="340" font-size="12" text-anchor="middle" fill="#27ae60" font-weight="bold">4</text>
    <text x="450" y="340" font-size="12" text-anchor="middle" fill="#95a5a6">?</text>
    <text x="550" y="340" font-size="12" text-anchor="middle" fill="#e74c3c" font-weight="bold">2</text>
    
    <!-- Characteristics -->
    <text x="100" y="385" font-size="16" font-weight="bold" fill="#34495e">Key Characteristics:</text>
    
    <text x="110" y="415" font-size="13" fill="#2c3e50">✓ Linear/low-rank assumptions</text>
    <text x="110" y="440" font-size="13" fill="#2c3e50">✓ Fast computation for large matrices</text>
    <text x="110" y="465" font-size="13" fill="#2c3e50">✗ Simplistic relationship modeling</text>
    <text x="110" y="490" font-size="13" fill="#2c3e50">✗ No temporal awareness</text>
    <text x="110" y="515" font-size="13" fill="#2c3e50">✗ Static preference assumption</text>
    
    <!-- Use Cases -->
    <rect x="100" y="540" width="500" height="120" fill="#fef5e7" stroke="#f39c12" stroke-width="2" rx="5"/>
    <text x="350" y="565" font-size="14" font-weight="bold" text-anchor="middle" fill="#f39c12">
      Best For:
    </text>
    <text x="120" y="590" font-size="12" fill="#2c3e50">• Large-scale systems with dense data</text>
    <text x="120" y="610" font-size="12" fill="#2c3e50">• Real-time recommendations</text>
    <text x="120" y="630" font-size="12" fill="#2c3e50">• Simple preference patterns</text>
    <text x="120" y="650" font-size="12" fill="#2c3e50">• Order-independent content</text>
    
    <!-- Example -->
    <rect x="100" y="680" width="500" height="130" fill="#e8f5e9" stroke="#27ae60" stroke-width="2" rx="5"/>
    <text x="350" y="705" font-size="14" font-weight="bold" text-anchor="middle" fill="#27ae60">
      Example Output:
    </text>
    <text x="120" y="735" font-size="12" fill="#2c3e50">
      For User 1, predict missing values:
    </text>
    <text x="130" y="760" font-size="11" fill="#2c3e50">
      Movie 2: 4.2 (based on similar users)
    </text>
    <text x="130" y="780" font-size="11" fill="#2c3e50">
      Movie 4: 3.8 (collaborative filtering)
    </text>
  </g>
  
  <!-- Right Side: Graphical Models -->
  <g id="graphical-models">
    <rect x="750" y="80" width="600" height="750" fill="#e8f4f8" stroke="#2196f3" stroke-width="3" rx="10"/>
    
    <text x="1050" y="120" font-size="22" font-weight="bold" text-anchor="middle" fill="#2196f3">
      Graphical Models Approach
    </text>
    
    <!-- Graph Visualization -->
    <rect x="800" y="150" width="500" height="200" fill="white" stroke="#34495e" stroke-width="2" rx="5"/>
    <text x="1050" y="175" font-size="14" font-weight="bold" text-anchor="middle" fill="#34495e">
      Probabilistic Graph Structure
    </text>
    
    <!-- Nodes -->
    <circle cx="900" cy="240" r="30" fill="#3498db" stroke="#2c3e50" stroke-width="2"/>
    <text x="900" y="245" font-size="11" font-weight="bold" text-anchor="middle" fill="white">M1</text>
    
    <circle cx="1050" cy="240" r="30" fill="#3498db" stroke="#2c3e50" stroke-width="2"/>
    <text x="1050" y="245" font-size="11" font-weight="bold" text-anchor="middle" fill="white">M2</text>
    
    <circle cx="1200" cy="240" r="30" fill="#3498db" stroke="#2c3e50" stroke-width="2"/>
    <text x="1200" y="245" font-size="11" font-weight="bold" text-anchor="middle" fill="white">M3</text>
    
    <circle cx="975" cy="310" r="30" fill="#3498db" stroke="#2c3e50" stroke-width="2"/>
    <text x="975" y="315" font-size="11" font-weight="bold" text-anchor="middle" fill="white">M4</text>
    
    <circle cx="1125" cy="310" r="30" fill="#3498db" stroke="#2c3e50" stroke-width="2"/>
    <text x="1125" y="315" font-size="11" font-weight="bold" text-anchor="middle" fill="white">M5</text>
    
    <!-- Edges -->
    <line x1="930" y1="240" x2="1020" y2="240" stroke="#e74c3c" stroke-width="3"/>
    <line x1="1080" y1="240" x2="1170" y2="240" stroke="#e74c3c" stroke-width="3"/>
    <line x1="920" y1="265" x2="955" y2="290" stroke="#27ae60" stroke-width="3"/>
    <line x1="1070" y1="265" x2="1105" y2="290" stroke="#27ae60" stroke-width="3"/>
    <line x1="1005" y1="310" x2="1095" y2="310" stroke="#f39c12" stroke-width="3"/>
    
    <!-- Characteristics -->
    <text x="800" y="385" font-size="16" font-weight="bold" fill="#34495e">Key Characteristics:</text>
    
    <text x="810" y="415" font-size="13" fill="#2c3e50">✓ Captures complex dependencies</text>
    <text x="810" y="440" font-size="13" fill="#2c3e50">✓ Temporal dynamics with HMM</text>
    <text x="810" y="465" font-size="13" fill="#2c3e50">✓ Works with sparse pairwise data</text>
    <text x="810" y="490" font-size="13" fill="#2c3e50">✓ Interpretable parameters</text>
    <text x="810" y="515" font-size="13" fill="#2c3e50">✓ Sequence-aware recommendations</text>
    
    <!-- Use Cases -->
    <rect x="800" y="540" width="500" height="120" fill="#e3f2fd" stroke="#2196f3" stroke-width="2" rx="5"/>
    <text x="1050" y="565" font-size="14" font-weight="bold" text-anchor="middle" fill="#2196f3">
      Best For:
    </text>
    <text x="820" y="590" font-size="12" fill="#2c3e50">• Sequential content (series, courses)</text>
    <text x="820" y="610" font-size="12" fill="#2c3e50">• Complex correlation patterns</text>
    <text x="820" y="630" font-size="12" fill="#2c3e50">• Temporal preference evolution</text>
    <text x="820" y="650" font-size="12" fill="#2c3e50">• Interpretable recommendations</text>
    
    <!-- Example -->
    <rect x="800" y="680" width="500" height="130" fill="#f3e5f5" stroke="#9b59b6" stroke-width="2" rx="5"/>
    <text x="1050" y="705" font-size="14" font-weight="bold" text-anchor="middle" fill="#9b59b6">
      Example Output:
    </text>
    <text x="820" y="735" font-size="12" fill="#2c3e50">
      User liked Goodfellas, disliked Iron Man:
    </text>
    <text x="830" y="760" font-size="11" fill="#2c3e50">
      Godfather Part 1: 0.78 (watch order respected)
    </text>
    <text x="830" y="780" font-size="11" fill="#2c3e50">
      Godfather Part 2: 0.65 (sequel awareness)
    </text>
  </g>
  
  <!-- Bottom comparison -->
  <rect x="50" y="850" width="1300" height="1" fill="#95a5a6"/>
  <text x="700" y="885" font-size="14" text-anchor="middle" fill="#7f8c8d" font-style="italic">
    Hybrid approaches combine scalability of matrix methods with sophistication of graphical models
  </text>
</svg>