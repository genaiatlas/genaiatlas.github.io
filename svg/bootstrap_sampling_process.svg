<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #2c3e50; }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #34495e; }
      .label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #2c3e50; }
      .data-point { font-family: 'Courier New', monospace; font-size: 10px; fill: white; font-weight: bold; }
      .arrow { stroke: #3498db; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .dashed-arrow { stroke: #e74c3c; stroke-width: 2; fill: none; stroke-dasharray: 5,5; marker-end: url(#arrowhead2); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3498db"/>
    </marker>
    <marker id="arrowhead2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="400" y="25" text-anchor="middle" class="title">Bootstrap Sampling Process</text>
  
  <!-- Original Dataset -->
  <text x="400" y="55" text-anchor="middle" class="subtitle">Original Dataset (N=10)</text>
  
  <!-- Original data points -->
  <g transform="translate(250, 70)">
    <rect x="0" y="0" width="30" height="25" fill="#3498db" rx="3"/>
    <text x="15" y="16" text-anchor="middle" class="data-point">X₁</text>
    <rect x="35" y="0" width="30" height="25" fill="#3498db" rx="3"/>
    <text x="50" y="16" text-anchor="middle" class="data-point">X₂</text>
    <rect x="70" y="0" width="30" height="25" fill="#3498db" rx="3"/>
    <text x="85" y="16" text-anchor="middle" class="data-point">X₃</text>
    <rect x="105" y="0" width="30" height="25" fill="#3498db" rx="3"/>
    <text x="120" y="16" text-anchor="middle" class="data-point">X₄</text>
    <rect x="140" y="0" width="30" height="25" fill="#3498db" rx="3"/>
    <text x="155" y="16" text-anchor="middle" class="data-point">X₅</text>
    <rect x="175" y="0" width="30" height="25" fill="#3498db" rx="3"/>
    <text x="190" y="16" text-anchor="middle" class="data-point">X₆</text>
    <rect x="210" y="0" width="30" height="25" fill="#3498db" rx="3"/>
    <text x="225" y="16" text-anchor="middle" class="data-point">X₇</text>
    <rect x="245" y="0" width="30" height="25" fill="#3498db" rx="3"/>
    <text x="260" y="16" text-anchor="middle" class="data-point">X₈</text>
    <rect x="280" y="0" width="30" height="25" fill="#3498db" rx="3"/>
    <text x="295" y="16" text-anchor="middle" class="data-point">X₉</text>
    <rect x="315" y="0" width="30" height="25" fill="#3498db" rx="3"/>
    <text x="330" y="16" text-anchor="middle" class="data-point">X₁₀</text>
  </g>
  
  <!-- Sampling with replacement arrows -->
  <line x1="400" y1="110" x2="200" y2="160" class="arrow"/>
  <line x1="400" y1="110" x2="400" y2="160" class="arrow"/>
  <line x1="400" y1="110" x2="600" y2="160" class="arrow"/>
  
  <text x="300" y="140" text-anchor="middle" class="label">Sample with Replacement</text>
  
  <!-- Bootstrap Sample 1 -->
  <text x="200" y="185" text-anchor="middle" class="subtitle">Bootstrap Sample 1</text>
  <g transform="translate(90, 195)">
    <rect x="0" y="0" width="25" height="20" fill="#e67e22" rx="2"/>
    <text x="12.5" y="13" text-anchor="middle" class="data-point" style="font-size: 9px;">X₈</text>
    <rect x="28" y="0" width="25" height="20" fill="#e67e22" rx="2"/>
    <text x="40.5" y="13" text-anchor="middle" class="data-point" style="font-size: 9px;">X₆</text>
    <rect x="56" y="0" width="25" height="20" fill="#e67e22" rx="2"/>
    <text x="68.5" y="13" text-anchor="middle" class="data-point" style="font-size: 9px;">X₂</text>
    <rect x="84" y="0" width="25" height="20" fill="#e67e22" rx="2"/>
    <text x="96.5" y="13" text-anchor="middle" class="data-point" style="font-size: 9px;">X₉</text>
    <rect x="112" y="0" width="25" height="20" fill="#e67e22" rx="2"/>
    <text x="124.5" y="13" text-anchor="middle" class="data-point" style="font-size: 9px;">X₅</text>
    <rect x="140" y="0" width="25" height="20" fill="#e67e22" rx="2"/>
    <text x="152.5" y="13" text-anchor="middle" class="data-point" style="font-size: 9px;">X₃</text>
    <rect x="168" y="0" width="25" height="20" fill="#e67e22" rx="2"/>
    <text x="180.5" y="13" text-anchor="middle" class="data-point" style="font-size: 9px;">X₁</text>
    <rect x="196" y="0" width="25" height="20" fill="#e67e22" rx="2"/>
    <text x="208.5" y="13" text-anchor="middle" class="data-point" style="font-size: 9px;">X₄</text>
    <rect x="224" y="0" width="25" height="20" fill="#e67e22" rx="2"/>
    <text x="236.5" y="13" text-anchor="middle" class="data-point" style="font-size: 9px;">X₈</text>
    <rect x="252" y="0" width="25" height="20" fill="#e67e22" rx="2"/>
    <text x="264.5" y="13" text-anchor="middle" class="data-point" style="font-size: 9px;">X₂</text>
  </g>
  
  <!-- Out-of-bag for Sample 1 -->
  <text x="200" y="235" text-anchor="middle" class="label">Out-of-bag: X₇, X₁₀</text>
  <g transform="translate(160, 240)">
    <rect x="0" y="0" width="25" height="20" fill="#e74c3c" rx="2"/>
    <text x="12.5" y="13" text-anchor="middle" class="data-point" style="font-size: 9px;">X₇</text>
    <rect x="30" y="0" width="25" height="20" fill="#e74c3c" rx="2"/>
    <text x="42.5" y="13" text-anchor="middle" class="data-point" style="font-size: 9px;">X₁₀</text>
  </g>
  
  <!-- Bootstrap Sample 2 -->
  <text x="400" y="185" text-anchor="middle" class="subtitle">Bootstrap Sample 2</text>
  <g transform="translate(290, 195)">
    <rect x="0" y="0" width="25" height="20" fill="#27ae60" rx="2"/>
    <text x="12.5" y="13" text-anchor="middle" class="data-point" style="font-size: 9px;">X₁₀</text>
    <rect x="28" y="0" width="25" height="20" fill="#27ae60" rx="2"/>
    <text x="40.5" y="13" text-anchor="middle" class="data-point" style="font-size: 9px;">X₁</text>
    <rect x="56" y="0" width="25" height="20" fill="#27ae60" rx="2"/>
    <text x="68.5" y="13" text-anchor="middle" class="data-point" style="font-size: 9px;">X₅</text>
    <rect x="84" y="0" width="25" height="20" fill="#27ae60" rx="2"/>
    <text x="96.5" y="13" text-anchor="middle" class="data-point" style="font-size: 9px;">X₆</text>
    <rect x="112" y="0" width="25" height="20" fill="#27ae60" rx="2"/>
    <text x="124.5" y="13" text-anchor="middle" class="data-point" style="font-size: 9px;">X₁</text>
    <rect x="140" y="0" width="25" height="20" fill="#27ae60" rx="2"/>
    <text x="152.5" y="13" text-anchor="middle" class="data-point" style="font-size: 9px;">X₇</text>
    <rect x="168" y="0" width="25" height="20" fill="#27ae60" rx="2"/>
    <text x="180.5" y="13" text-anchor="middle" class="data-point" style="font-size: 9px;">X₅</text>
    <rect x="196" y="0" width="25" height="20" fill="#27ae60" rx="2"/>
    <text x="208.5" y="13" text-anchor="middle" class="data-point" style="font-size: 9px;">X₉</text>
    <rect x="224" y="0" width="25" height="20" fill="#27ae60" rx="2"/>
    <text x="236.5" y="13" text-anchor="middle" class="data-point" style="font-size: 9px;">X₁</text>
    <rect x="252" y="0" width="25" height="20" fill="#27ae60" rx="2"/>
    <text x="264.5" y="13" text-anchor="middle" class="data-point" style="font-size: 9px;">X₈</text>
  </g>
  
  <!-- Out-of-bag for Sample 2 -->
  <text x="400" y="235" text-anchor="middle" class="label">Out-of-bag: X₂, X₃, X₄</text>
  <g transform="translate(365, 240)">
    <rect x="0" y="0" width="25" height="20" fill="#e74c3c" rx="2"/>
    <text x="12.5" y="13" text-anchor="middle" class="data-point" style="font-size: 9px;">X₂</text>
    <rect x="30" y="0" width="25" height="20" fill="#e74c3c" rx="2"/>
    <text x="42.5" y="13" text-anchor="middle" class="data-point" style="font-size: 9px;">X₃</text>
    <rect x="60" y="0" width="25" height="20" fill="#e74c3c" rx="2"/>
    <text x="72.5" y="13" text-anchor="middle" class="data-point" style="font-size: 9px;">X₄</text>
  </g>
  
  <!-- Bootstrap Sample 3 -->
  <text x="600" y="185" text-anchor="middle" class="subtitle">Bootstrap Sample 3</text>
  <g transform="translate(490, 195)">
    <rect x="0" y="0" width="25" height="20" fill="#9b59b6" rx="2"/>
    <text x="12.5" y="13" text-anchor="middle" class="data-point" style="font-size: 9px;">X₅</text>
    <rect x="28" y="0" width="25" height="20" fill="#9b59b6" rx="2"/>
    <text x="40.5" y="13" text-anchor="middle" class="data-point" style="font-size: 9px;">X₅</text>
    <rect x="56" y="0" width="25" height="20" fill="#9b59b6" rx="2"/>
    <text x="68.5" y="13" text-anchor="middle" class="data-point" style="font-size: 9px;">X₄</text>
    <rect x="84" y="0" width="25" height="20" fill="#9b59b6" rx="2"/>
    <text x="96.5" y="13" text-anchor="middle" class="data-point" style="font-size: 9px;">X₁</text>
    <rect x="112" y="0" width="25" height="20" fill="#9b59b6" rx="2"/>
    <text x="124.5" y="13" text-anchor="middle" class="data-point" style="font-size: 9px;">X₂</text>
    <rect x="140" y="0" width="25" height="20" fill="#9b59b6" rx="2"/>
    <text x="152.5" y="13" text-anchor="middle" class="data-point" style="font-size: 9px;">X₄</text>
    <rect x="168" y="0" width="25" height="20" fill="#9b59b6" rx="2"/>
    <text x="180.5" y="13" text-anchor="middle" class="data-point" style="font-size: 9px;">X₅</text>
    <rect x="196" y="0" width="25" height="20" fill="#9b59b6" rx="2"/>
    <text x="208.5" y="13" text-anchor="middle" class="data-point" style="font-size: 9px;">X₈</text>
    <rect x="224" y="0" width="25" height="20" fill="#9b59b6" rx="2"/>
    <text x="236.5" y="13" text-anchor="middle" class="data-point" style="font-size: 9px;">X₉</text>
    <rect x="252" y="0" width="25" height="20" fill="#9b59b6" rx="2"/>
    <text x="264.5" y="13" text-anchor="middle" class="data-point" style="font-size: 9px;">X₂</text>
  </g>
  
  <!-- Out-of-bag for Sample 3 -->
  <text x="600" y="235" text-anchor="middle" class="label">Out-of-bag: X₃, X₆, X₇, X₁₀</text>
  <g transform="translate(545, 240)">
    <rect x="0" y="0" width="25" height="20" fill="#e74c3c" rx="2"/>
    <text x="12.5" y="13" text-anchor="middle" class="data-point" style="font-size: 9px;">X₃</text>
    <rect x="30" y="0" width="25" height="20" fill="#e74c3c" rx="2"/>
    <text x="42.5" y="13" text-anchor="middle" class="data-point" style="font-size: 9px;">X₆</text>
    <rect x="60" y="0" width="25" height="20" fill="#e74c3c" rx="2"/>
    <text x="72.5" y="13" text-anchor="middle" class="data-point" style="font-size: 9px;">X₇</text>
    <rect x="90" y="0" width="25" height="20" fill="#e74c3c" rx="2"/>
    <text x="102.5" y="13" text-anchor="middle" class="data-point" style="font-size: 9px;">X₁₀</text>
  </g>
  
  <!-- Training arrows -->
  <line x1="200" y1="270" x2="200" y2="320" class="arrow"/>
  <line x1="400" y1="270" x2="400" y2="320" class="arrow"/>
  <line x1="600" y1="270" x2="600" y2="320" class="arrow"/>
  
  <!-- Models -->
  <rect x="175" y="325" width="50" height="30" fill="#34495e" rx="5"/>
  <text x="200" y="343" text-anchor="middle" class="data-point">Model₁</text>
  
  <rect x="375" y="325" width="50" height="30" fill="#34495e" rx="5"/>
  <text x="400" y="343" text-anchor="middle" class="data-point">Model₂</text>
  
  <rect x="575" y="325" width="50" height="30" fill="#34495e" rx="5"/>
  <text x="600" y="343" text-anchor="middle" class="data-point">Model₃</text>
  
  <!-- Validation arrows -->
  <line x1="200" y1="260" x2="100" y2="350" class="dashed-arrow"/>
  <line x1="400" y1="260" x2="300" y2="350" class="dashed-arrow"/>
  <line x1="600" y1="260" x2="700" y2="350" class="dashed-arrow"/>
  
  <!-- Validation boxes -->
  <rect x="75" y="365" width="50" height="25" fill="#e74c3c" rx="3"/>
  <text x="100" y="380" text-anchor="middle" class="data-point" style="font-size: 9px;">Validate₁</text>
  
  <rect x="275" y="365" width="50" height="25" fill="#e74c3c" rx="3"/>
  <text x="300" y="380" text-anchor="middle" class="data-point" style="font-size: 9px;">Validate₂</text>
  
  <rect x="675" y="365" width="50" height="25" fill="#e74c3c" rx="3"/>
  <text x="700" y="380" text-anchor="middle" class="data-point" style="font-size: 9px;">Validate₃</text>
  
  <!-- Legend -->
  <g transform="translate(50, 420)">
    <text x="0" y="15" class="subtitle">Legend:</text>
    <rect x="0" y="25" width="15" height="15" fill="#3498db" rx="2"/>
    <text x="20" y="36" class="label">Original Data</text>
    <rect x="100" y="25" width="15" height="15" fill="#e67e22" rx="2"/>
    <text x="120" y="36" class="label">Bootstrap Sample</text>
    <rect x="230" y="25" width="15" height="15" fill="#e74c3c" rx="2"/>
    <text x="250" y="36" class="label">Out-of-Bag</text>
    <rect x="320" y="25" width="15" height="15" fill="#34495e" rx="2"/>
    <text x="340" y="36" class="label">Trained Model</text>
  </g>
  
</svg>