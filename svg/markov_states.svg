<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#2c3e50">
    Markov Chain State Transitions
  </text>
  
  <!-- Define arrow markers -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth" fill="#3498db">
      <path d="M0,0 L0,6 L9,3 z"/>
    </marker>
    <marker id="arrow-self" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth" fill="#e74c3c">
      <path d="M0,0 L0,6 L9,3 z"/>
    </marker>
  </defs>
  
  <!-- States as circles -->
  <!-- Playing State -->
  <circle cx="200" cy="200" r="60" fill="#3498db" opacity="0.8"/>
  <text x="200" y="205" text-anchor="middle" font-size="18" fill="white" font-weight="bold">Playing</text>
  <text x="200" y="225" text-anchor="middle" font-size="14" fill="white">(P)</text>
  
  <!-- Eating State -->
  <circle cx="600" cy="200" r="60" fill="#2ecc71" opacity="0.8"/>
  <text x="600" y="205" text-anchor="middle" font-size="18" fill="white" font-weight="bold">Eating</text>
  <text x="600" y="225" text-anchor="middle" font-size="14" fill="white">(E)</text>
  
  <!-- Sleeping State -->
  <circle cx="200" cy="450" r="60" fill="#9b59b6" opacity="0.8"/>
  <text x="200" y="455" text-anchor="middle" font-size="18" fill="white" font-weight="bold">Sleeping</text>
  <text x="200" y="475" text-anchor="middle" font-size="14" fill="white">(S)</text>
  
  <!-- Crying State -->
  <circle cx="600" cy="450" r="60" fill="#e74c3c" opacity="0.8"/>
  <text x="600" y="455" text-anchor="middle" font-size="18" fill="white" font-weight="bold">Crying</text>
  <text x="600" y="475" text-anchor="middle" font-size="14" fill="white">(C)</text>
  
  <!-- Transition Arrows -->
  <!-- P to E -->
  <path d="M 255 185 Q 400 120 545 185" stroke="#34495e" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="400" y="140" text-anchor="middle" font-size="14" fill="#34495e">0.30</text>
  
  <!-- E to P -->
  <path d="M 545 215 Q 400 280 255 215" stroke="#34495e" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="400" y="260" text-anchor="middle" font-size="14" fill="#34495e">0.25</text>
  
  <!-- P to S -->
  <path d="M 185 255 L 185 390" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="160" y="325" text-anchor="middle" font-size="14" fill="#34495e">0.20</text>
  
  <!-- S to P -->
  <path d="M 215 390 L 215 255" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="240" y="325" text-anchor="middle" font-size="14" fill="#34495e">0.15</text>
  
  <!-- P to C -->
  <path d="M 240 240 Q 400 340 560 410" stroke="#34495e" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="400" y="330" text-anchor="middle" font-size="14" fill="#34495e">0.30</text>
  
  <!-- C to P -->
  <path d="M 560 410 Q 400 310 240 240" stroke="#34495e" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="5,5"/>
  <text x="400" y="360" text-anchor="middle" font-size="14" fill="#34495e">0.10</text>
  
  <!-- E to S -->
  <path d="M 560 240 Q 460 340 240 410" stroke="#34495e" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="400" y="390" text-anchor="middle" font-size="14" fill="#34495e">0.35</text>
  
  <!-- S to E -->
  <path d="M 240 410 Q 340 310 560 240" stroke="#34495e" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="5,5"/>
  <text x="400" y="420" text-anchor="middle" font-size="14" fill="#34495e">0.25</text>
  
  <!-- E to C -->
  <path d="M 615 255 L 615 390" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="325" text-anchor="middle" font-size="14" fill="#34495e">0.15</text>
  
  <!-- C to E -->
  <path d="M 585 390 L 585 255" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="560" y="325" text-anchor="middle" font-size="14" fill="#34495e">0.20</text>
  
  <!-- S to C -->
  <path d="M 255 465 Q 400 530 545 465" stroke="#34495e" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="400" y="510" text-anchor="middle" font-size="14" fill="#34495e">0.30</text>
  
  <!-- C to S -->
  <path d="M 545 435 Q 400 370 255 435" stroke="#34495e" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="400" y="470" text-anchor="middle" font-size="14" fill="#34495e">0.40</text>
  
  <!-- Self loops -->
  <!-- P self -->
  <circle cx="200" cy="120" r="35" stroke="#e74c3c" stroke-width="2" fill="none" stroke-dasharray="5,5" marker-end="url(#arrow-self)"/>
  <text x="200" y="90" text-anchor="middle" font-size="14" fill="#e74c3c">0.20</text>
  
  <!-- E self -->
  <circle cx="600" cy="120" r="35" stroke="#e74c3c" stroke-width="2" fill="none" stroke-dasharray="5,5" marker-end="url(#arrow-self)"/>
  <text x="600" y="90" text-anchor="middle" font-size="14" fill="#e74c3c">0.25</text>
  
  <!-- S self -->
  <circle cx="120" cy="450" r="35" stroke="#e74c3c" stroke-width="2" fill="none" stroke-dasharray="5,5" marker-end="url(#arrow-self)"/>
  <text x="85" y="450" text-anchor="middle" font-size="14" fill="#e74c3c">0.30</text>
  
  <!-- C self -->
  <circle cx="680" cy="450" r="35" stroke="#e74c3c" stroke-width="2" fill="none" stroke-dasharray="5,5" marker-end="url(#arrow-self)"/>
  <text x="715" y="450" text-anchor="middle" font-size="14" fill="#e74c3c">0.30</text>
  
  <!-- Legend -->
  <rect x="30" y="530" width="740" height="50" fill="#ecf0f1" stroke="#34495e" stroke-width="1" rx="5"/>
  <text x="50" y="560" font-size="14" fill="#34495e">
    Legend: States represent baby behaviors. Arrows show transition probabilities between states.
  </text>
  <text x="50" y="575" font-size="12" fill="#7f8c8d">
    Self-loops indicate probability of remaining in the same state. Dashed lines represent less common transitions.
  </text>
</svg>