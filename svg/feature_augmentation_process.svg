<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">
    Feature Augmentation Process: From Simple to Enhanced Models
  </text>
  
  <!-- Original Model (Left) -->
  <g transform="translate(50, 80)">
    <rect width="300" height="200" fill="#ffebee" stroke="#d32f2f" stroke-width="2" rx="10"/>
    <text x="150" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#d32f2f">
      Original Model (Confounded)
    </text>
    
    <!-- Original features -->
    <rect x="30" y="50" width="240" height="120" fill="white" stroke="#ccc" stroke-width="1" rx="5"/>
    <text x="150" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">
      Sales = θ₀ + θ₁(TV) + θ₂(Radio) + θ₃(NewsP)
    </text>
    
    <!-- Feature list -->
    <text x="50" y="100" font-family="Arial, sans-serif" font-size="11" fill="#333">
      Features: [TV, Radio, NewsP]
    </text>
    <text x="50" y="120" font-family="Arial, sans-serif" font-size="11" fill="#666">
      • High R-squared
    </text>
    <text x="50" y="135" font-family="Arial, sans-serif" font-size="11" fill="#666">
      • Good predictions
    </text>
    <text x="50" y="150" font-family="Arial, sans-serif" font-size="11" fill="#d32f2f">
      • Poor causal inference
    </text>
    
    <text x="150" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="#666">
      Missing important confounders
    </text>
  </g>
  
  <!-- Arrow -->
  <path d="M 370 180 L 420 180" stroke="#666" stroke-width="4" marker-end="url(#arrowhead)"/>
  <text x="395" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#666">
    Add
  </text>
  <text x="395" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#666">
    Variables
  </text>
  
  <!-- Enhanced Model (Right) -->
  <g transform="translate(450, 80)">
    <rect width="300" height="200" fill="#e8f5e8" stroke="#388e3c" stroke-width="2" rx="10"/>
    <text x="150" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#388e3c">
      Enhanced Model (Less Confounded)
    </text>
    
    <!-- Enhanced features -->
    <rect x="30" y="50" width="240" height="120" fill="white" stroke="#ccc" stroke-width="1" rx="5"/>
    <text x="150" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#333">
      Sales = θ₀ + θ₁(TV) + θ₂(Radio) + θ₃(NewsP)
    </text>
    <text x="150" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#333">
      + θ₄(MarketSize) + θ₅(Competition) + θ₆(Urban)
    </text>
    
    <!-- Feature list -->
    <text x="50" y="105" font-family="Arial, sans-serif" font-size="11" fill="#333">
      Features: [TV, Radio, NewsP, MarketSize, 
    </text>
    <text x="82" y="118" font-family="Arial, sans-serif" font-size="11" fill="#333">
      Competition, Urban]
    </text>
    <text x="50" y="135" font-family="Arial, sans-serif" font-size="11" fill="#666">
      • Maintained R-squared
    </text>
    <text x="50" y="150" font-family="Arial, sans-serif" font-size="11" fill="#388e3c">
      • Better causal inference
    </text>
    
    <text x="150" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="#666">
      Controls for key confounders
    </text>
  </g>
  
  <!-- Implementation Details -->
  <g transform="translate(100, 320)">
    <rect width="600" height="140" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="10"/>
    <text x="300" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1976d2">
      Implementation: Dataset Structure Enhancement
    </text>
    
    <!-- Before -->
    <g transform="translate(50, 50)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">
        Before (Original Dataset)
      </text>
      <rect x="0" y="10" width="200" height="60" fill="#ffebee" stroke="#d32f2f" stroke-width="1" rx="3"/>
      <text x="100" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">
        TV | Radio | NewsP | Sales
      </text>
      <text x="100" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">
        100 | 50 | 25 | 200
      </text>
      <text x="100" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">
        150 | 75 | 30 | 250
      </text>
      <text x="100" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#d32f2f">
        4 columns → Confounded
      </text>
    </g>
    
    <!-- After -->
    <g transform="translate(350, 50)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">
        After (Enhanced Dataset)
      </text>
      <rect x="0" y="10" width="200" height="60" fill="#e8f5e8" stroke="#388e3c" stroke-width="1" rx="3"/>
      <text x="100" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">
        TV | Radio | NewsP | MktSize | Comp | Urban | Sales
      </text>
      <text x="100" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">
        100 | 50 | 25 | 1000 | 1 | 0 | 200
      </text>
      <text x="100" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">
        150 | 75 | 30 | 1500 | 0 | 1 | 250
      </text>
      <text x="100" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#388e3c">
        7 columns → Less confounded
      </text>
    </g>
    
    <!-- Arrow between datasets -->
    <path d="M 270 95 L 330 95" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="300" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">
      Add columns
    </text>
  </g>
  
  <!-- Benefits -->
  <g transform="translate(150, 490)">
    <rect width="500" height="80" fill="#fff3e0" stroke="#f57c00" stroke-width="2" rx="10"/>
    <text x="250" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f57c00">
      Key Benefits of Feature Augmentation
    </text>
    
    <g transform="translate(50, 35)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" fill="#333">
        ✓ Answers "what-if" questions more reliably
      </text>
      <text x="0" y="18" font-family="Arial, sans-serif" font-size="12" fill="#333">
        ✓ Reduces confounding bias in coefficient estimates
      </text>
      <text x="0" y="36" font-family="Arial, sans-serif" font-size="12" fill="#333">
        ✓ Improves validity of statistical inference (p-values, confidence intervals)
      </text>
    </g>
  </g>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
</svg>