<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#f8f9fa"/>
  <text x="600" y="40" font-family="Arial" font-size="28" font-weight="bold" text-anchor="middle">Routing Architecture Overview</text>
  
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" fill="#495057"/></marker></defs>
  
  <rect x="400" y="80" width="400" height="60" rx="10" fill="#fff3bf" stroke="#f59f00" stroke-width="3"/>
  <text x="600" y="118" font-family="Arial" font-size="13" text-anchor="middle">What was our Q4 revenue?</text>
  
  <line x1="600" y1="140" x2="600" y2="175" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  
  <rect x="300" y="185" width="600" height="100" rx="10" fill="#9333ea" stroke="#7950f2" stroke-width="3"/>
  <text x="600" y="220" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="white">Router</text>
  <text x="600" y="245" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Analyze query, Select sources, Route to destination</text>
  
  <g id="sources">
    <line x1="450" y1="285" x2="250" y2="335" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="600" y1="285" x2="600" y2="335" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="750" y1="285" x2="950" y2="335" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
    
    <rect x="50" y="345" width="350" height="120" rx="10" fill="#d3f9d8" stroke="#37b24d" stroke-width="2"/>
    <text x="225" y="375" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Financial Database</text>
    <text x="70" y="400" font-family="Arial" font-size="10">Revenue, expenses, budgets</text>
    <text x="70" y="418" font-family="Arial" font-size="10">Quarterly reports, forecasts</text>
    <text x="70" y="436" font-family="Arial" font-size="10">Financial metrics</text>
    
    <rect x="425" y="345" width="350" height="120" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
    <text x="600" y="375" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">CRM System</text>
    <text x="445" y="400" font-family="Arial" font-size="10">Customer data, tickets</text>
    <text x="445" y="418" font-family="Arial" font-size="10">Interactions, support history</text>
    <text x="445" y="436" font-family="Arial" font-size="10">Relationship management</text>
    
    <rect x="800" y="345" width="350" height="120" rx="10" fill="#ffc9c9" stroke="#f03e3e" stroke-width="2"/>
    <text x="975" y="375" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Knowledge Base</text>
    <text x="820" y="400" font-family="Arial" font-size="10">Documentation, FAQs</text>
    <text x="820" y="418" font-family="Arial" font-size="10">Policies, procedures</text>
    <text x="820" y="436" font-family="Arial" font-size="10">General information</text>
  </g>
  
  <rect x="50" y="500" width="1100" height="270" rx="10" fill="#fff9db" stroke="#fab005" stroke-width="3"/>
  <text x="600" y="530" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">Routing Strategies</text>
  
  <rect x="80" y="550" width="330" height="200" rx="8" fill="#fff" stroke="#fab005" stroke-width="2"/>
  <text x="245" y="575" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Logical Routing</text>
  <text x="100" y="600" font-family="Arial" font-size="10">Rule-based decision making</text>
  <text x="100" y="625" font-family="Arial" font-size="9" font-weight="bold">How:</text>
  <text x="100" y="642" font-family="Arial" font-size="9">IF keywords THEN source</text>
  <text x="100" y="665" font-family="Arial" font-size="9" font-weight="bold">Pros:</text>
  <text x="100" y="682" font-family="Arial" font-size="9">Fast, predictable, explainable</text>
  <text x="100" y="705" font-family="Arial" font-size="9" font-weight="bold">When:</text>
  <text x="100" y="722" font-family="Arial" font-size="9">Clear domain boundaries</text>
  
  <rect x="435" y="550" width="330" height="200" rx="8" fill="#fff" stroke="#fab005" stroke-width="2"/>
  <text x="600" y="575" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Semantic Routing</text>
  <text x="455" y="600" font-family="Arial" font-size="10">Embedding-based matching</text>
  <text x="455" y="625" font-family="Arial" font-size="9" font-weight="bold">How:</text>
  <text x="455" y="642" font-family="Arial" font-size="9">Compare query and source embeddings</text>
  <text x="455" y="665" font-family="Arial" font-size="9" font-weight="bold">Pros:</text>
  <text x="455" y="682" font-family="Arial" font-size="9">Flexible, handles ambiguity</text>
  <text x="455" y="705" font-family="Arial" font-size="9" font-weight="bold">When:</text>
  <text x="455" y="722" font-family="Arial" font-size="9">Fuzzy boundaries, varied queries</text>
  
  <rect x="790" y="550" width="330" height="200" rx="8" fill="#fff" stroke="#fab005" stroke-width="2"/>
  <text x="955" y="575" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Hybrid Routing</text>
  <text x="810" y="600" font-family="Arial" font-size="10">Rules + Semantic matching</text>
  <text x="810" y="625" font-family="Arial" font-size="9" font-weight="bold">How:</text>
  <text x="810" y="642" font-family="Arial" font-size="9">Rules filter, semantics rank</text>
  <text x="810" y="665" font-family="Arial" font-size="9" font-weight="bold">Pros:</text>
  <text x="810" y="682" font-family="Arial" font-size="9">Best of both approaches</text>
  <text x="810" y="705" font-family="Arial" font-size="9" font-weight="bold">When:</text>
  <text x="810" y="722" font-family="Arial" font-size="9">Complex multi-source systems</text>
</svg>