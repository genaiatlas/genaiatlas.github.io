<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="900" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="450" y="35" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Bias-Variance Decomposition
  </text>
  
  <!-- Formula -->
  <text x="450" y="65" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#34495e">
    MSE(β̂) = Bias²(β̂) + Var(β̂)
  </text>
  
  <!-- Target diagrams container -->
  <g transform="translate(0, 100)">
    
    <!-- Low Bias, Low Variance (Ideal) -->
    <g transform="translate(100, 50)">
      <text x="100" y="-10" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#27ae60">
        Low Bias, Low Variance
      </text>
      <text x="100" y="10" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d" font-style="italic">
        (Ideal - High Accuracy)
      </text>
      
      <!-- Target circles -->
      <circle cx="100" cy="100" r="80" fill="none" stroke="#ecf0f1" stroke-width="2"/>
      <circle cx="100" cy="100" r="60" fill="none" stroke="#ecf0f1" stroke-width="2"/>
      <circle cx="100" cy="100" r="40" fill="none" stroke="#ecf0f1" stroke-width="2"/>
      <circle cx="100" cy="100" r="20" fill="none" stroke="#ecf0f1" stroke-width="2"/>
      
      <!-- Bullseye -->
      <circle cx="100" cy="100" r="5" fill="#e74c3c"/>
      
      <!-- Shots - tightly clustered near center -->
      <circle cx="102" cy="98" r="3" fill="#27ae60" opacity="0.7"/>
      <circle cx="98" cy="103" r="3" fill="#27ae60" opacity="0.7"/>
      <circle cx="105" cy="100" r="3" fill="#27ae60" opacity="0.7"/>
      <circle cx="97" cy="97" r="3" fill="#27ae60" opacity="0.7"/>
      <circle cx="103" cy="105" r="3" fill="#27ae60" opacity="0.7"/>
      <circle cx="95" cy="100" r="3" fill="#27ae60" opacity="0.7"/>
      <circle cx="100" cy="95" r="3" fill="#27ae60" opacity="0.7"/>
      <circle cx="106" cy="103" r="3" fill="#27ae60" opacity="0.7"/>
      
      <!-- Labels -->
      <text x="100" y="200" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#27ae60">
        Bias² ≈ 0
      </text>
      <text x="100" y="215" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#27ae60">
        Variance ≈ 0
      </text>
    </g>
    
    <!-- Low Bias, High Variance -->
    <g transform="translate(350, 50)">
      <text x="100" y="-10" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#f39c12">
        Low Bias, High Variance
      </text>
      <text x="100" y="10" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d" font-style="italic">
        (Imprecise but Unbiased)
      </text>
      
      <!-- Target circles -->
      <circle cx="100" cy="100" r="80" fill="none" stroke="#ecf0f1" stroke-width="2"/>
      <circle cx="100" cy="100" r="60" fill="none" stroke="#ecf0f1" stroke-width="2"/>
      <circle cx="100" cy="100" r="40" fill="none" stroke="#ecf0f1" stroke-width="2"/>
      <circle cx="100" cy="100" r="20" fill="none" stroke="#ecf0f1" stroke-width="2"/>
      
      <!-- Bullseye -->
      <circle cx="100" cy="100" r="5" fill="#e74c3c"/>
      
      <!-- Shots - widely scattered around center -->
      <circle cx="85" cy="80" r="3" fill="#f39c12" opacity="0.7"/>
      <circle cx="120" cy="95" r="3" fill="#f39c12" opacity="0.7"/>
      <circle cx="95" cy="125" r="3" fill="#f39c12" opacity="0.7"/>
      <circle cx="130" cy="110" r="3" fill="#f39c12" opacity="0.7"/>
      <circle cx="75" cy="105" r="3" fill="#f39c12" opacity="0.7"/>
      <circle cx="110" cy="75" r="3" fill="#f39c12" opacity="0.7"/>
      <circle cx="90" cy="115" r="3" fill="#f39c12" opacity="0.7"/>
      <circle cx="115" cy="130" r="3" fill="#f39c12" opacity="0.7"/>
      <circle cx="70" cy="90" r="3" fill="#f39c12" opacity="0.7"/>
      
      <!-- Labels -->
      <text x="100" y="200" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#f39c12">
        Bias² ≈ 0
      </text>
      <text x="100" y="215" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#f39c12">
        Variance: High
      </text>
    </g>
    
    <!-- High Bias, Low Variance -->
    <g transform="translate(600, 50)">
      <text x="100" y="-10" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#9b59b6">
        High Bias, Low Variance
      </text>
      <text x="100" y="10" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d" font-style="italic">
        (Precise but Biased)
      </text>
      
      <!-- Target circles -->
      <circle cx="100" cy="100" r="80" fill="none" stroke="#ecf0f1" stroke-width="2"/>
      <circle cx="100" cy="100" r="60" fill="none" stroke="#ecf0f1" stroke-width="2"/>
      <circle cx="100" cy="100" r="40" fill="none" stroke="#ecf0f1" stroke-width="2"/>
      <circle cx="100" cy="100" r="20" fill="none" stroke="#ecf0f1" stroke-width="2"/>
      
      <!-- Bullseye -->
      <circle cx="100" cy="100" r="5" fill="#e74c3c"/>
      
      <!-- Shots - tightly clustered but off-center -->
      <circle cx="142" cy="128" r="3" fill="#9b59b6" opacity="0.7"/>
      <circle cx="138" cy="133" r="3" fill="#9b59b6" opacity="0.7"/>
      <circle cx="145" cy="130" r="3" fill="#9b59b6" opacity="0.7"/>
      <circle cx="137" cy="127" r="3" fill="#9b59b6" opacity="0.7"/>
      <circle cx="143" cy="135" r="3" fill="#9b59b6" opacity="0.7"/>
      <circle cx="135" cy="130" r="3" fill="#9b59b6" opacity="0.7"/>
      <circle cx="140" cy="125" r="3" fill="#9b59b6" opacity="0.7"/>
      <circle cx="146" cy="133" r="3" fill="#9b59b6" opacity="0.7"/>
      
      <!-- Bias arrow -->
      <line x1="100" y1="100" x2="140" y2="130" stroke="#e74c3c" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arrow-bias)"/>
      <text x="115" y="108" font-family="Arial, sans-serif" font-size="9" fill="#e74c3c">bias</text>
      
      <!-- Labels -->
      <text x="100" y="200" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#9b59b6">
        Bias²: High
      </text>
      <text x="100" y="215" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#9b59b6">
        Variance ≈ 0
      </text>
    </g>
    
  </g>
  
  <!-- Bottom section: Mathematical representation -->
  <g transform="translate(50, 380)">
    <rect x="0" y="0" width="800" height="150" fill="white" stroke="#bdc3c7" stroke-width="2" rx="5"/>
    
    <text x="400" y="30" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Mathematical Decomposition
    </text>
    
    <!-- Bias definition -->
    <g transform="translate(50, 50)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="13" fill="#34495e">
        <tspan font-weight="bold" fill="#9b59b6">Bias(β̂)</tspan> = E[β̂] - β
      </text>
      <text x="0" y="20" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">
        → Systematic deviation from true value
      </text>
      <text x="0" y="35" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">
        → Caused by model misspecification
      </text>
    </g>
    
    <!-- Variance definition -->
    <g transform="translate(350, 50)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="13" fill="#34495e">
        <tspan font-weight="bold" fill="#f39c12">Var(β̂)</tspan> = E[(β̂ - E[β̂])²]
      </text>
      <text x="0" y="20" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">
        → Variability across different samples
      </text>
      <text x="0" y="35" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">
        → Reduced by larger sample size
      </text>
    </g>
    
    <!-- Key insight -->
    <g transform="translate(50, 100)">
      <text x="350" y="0" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#e74c3c" font-weight="bold">
        Total Error = (How far we systematically miss)² + (How much we vary)
      </text>
    </g>
  </g>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrow-bias" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#e74c3c"/>
    </marker>
  </defs>
</svg>