<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="redArrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d32f2f"/>
    </marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4caf50"/>
    </marker>
    <radialGradient id="valleyGradient" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#4caf50;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#1976d2;stop-opacity:0.1"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#fafafa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1565c0">
    Step Size: Overshooting vs Optimal Behavior
  </text>
  
  <!-- Left Panel: Too Small Step Size -->
  <g id="leftPanel">
    <rect x="50" y="60" width="300" height="250" fill="white" stroke="#ddd" stroke-width="1" rx="5"/>
    <text x="200" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4caf50">
      Too Small: Very Slow Progress
    </text>
    
    <!-- Loss Surface -->
    <path d="M 80 250 Q 200 150 320 250" stroke="#1976d2" stroke-width="3" fill="none"/>
    
    <!-- Axes -->
    <line x1="70" y1="280" x2="330" y2="280" stroke="#666" stroke-width="1" marker-end="url(#arrowhead)"/>
    <line x1="80" y1="290" x2="80" y2="120" stroke="#666" stroke-width="1" marker-end="url(#arrowhead)"/>
    
    <!-- Labels -->
    <text x="335" y="285" font-family="Arial, sans-serif" font-size="12" fill="#666">w</text>
    <text x="65" y="115" font-family="Arial, sans-serif" font-size="12" fill="#666">L</text>
    
    <!-- Starting point -->
    <circle cx="120" cy="230" r="4" fill="#4caf50"/>
    <text x="110" y="220" font-family="Arial, sans-serif" font-size="10" fill="#4caf50">Start</text>
    
    <!-- Small steps -->
    <path d="M 120 230 L 135 215 L 150 202 L 165 190 L 180 180 L 195 172" 
          stroke="#4caf50" stroke-width="2" fill="none" stroke-dasharray="3,3"/>
    
    <!-- Step arrows -->
    <line x1="120" y1="230" x2="135" y2="215" stroke="#4caf50" stroke-width="1" marker-end="url(#greenArrow)"/>
    <line x1="135" y1="215" x2="150" y2="202" stroke="#4caf50" stroke-width="1" marker-end="url(#greenArrow)"/>
    <line x1="150" y1="202" x2="165" y2="190" stroke="#4caf50" stroke-width="1" marker-end="url(#greenArrow)"/>
    <line x1="165" y1="190" x2="180" y2="180" stroke="#4caf50" stroke-width="1" marker-end="url(#greenArrow)"/>
    
    <!-- Progress indicator -->
    <text x="200" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#4caf50">
      Many small steps needed
    </text>
  </g>
  
  <!-- Right Panel: Too Large Step Size -->
  <g id="rightPanel">
    <rect x="450" y="60" width="300" height="250" fill="white" stroke="#ddd" stroke-width="1" rx="5"/>
    <text x="600" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#d32f2f">
      Too Large: Overshooting
    </text>
    
    <!-- Loss Surface -->
    <path d="M 480 250 Q 600 150 720 250" stroke="#1976d2" stroke-width="3" fill="none"/>
    
    <!-- Axes -->
    <line x1="470" y1="280" x2="730" y2="280" stroke="#666" stroke-width="1" marker-end="url(#arrowhead)"/>
    <line x1="480" y1="290" x2="480" y2="120" stroke="#666" stroke-width="1" marker-end="url(#arrowhead)"/>
    
    <!-- Labels -->
    <text x="735" y="285" font-family="Arial, sans-serif" font-size="12" fill="#666">w</text>
    <text x="465" y="115" font-family="Arial, sans-serif" font-size="12" fill="#666">L</text>
    
    <!-- Starting point -->
    <circle cx="520" cy="230" r="4" fill="#d32f2f"/>
    <text x="510" y="220" font-family="Arial, sans-serif" font-size="10" fill="#d32f2f">Start</text>
    
    <!-- Overshooting steps -->
    <path d="M 520 230 L 650 190 L 500 210 L 680 180 L 480 220" 
          stroke="#d32f2f" stroke-width="2" fill="none" stroke-dasharray="5,2"/>
    
    <!-- Overshoot arrows -->
    <line x1="520" y1="230" x2="650" y2="190" stroke="#d32f2f" stroke-width="2" marker-end="url(#redArrow)"/>
    <line x1="650" y1="190" x2="500" y2="210" stroke="#d32f2f" stroke-width="2" marker-end="url(#redArrow)"/>
    <line x1="500" y1="210" x2="680" y2="180" stroke="#d32f2f" stroke-width="2" marker-end="url(#redArrow)"/>
    
    <!-- Valley indicator -->
    <circle cx="600" cy="150" r="3" fill="#4caf50"/>
    <text x="605" y="145" font-family="Arial, sans-serif" font-size="10" fill="#4caf50">Valley</text>
    
    <!-- Progress indicator -->
    <text x="600" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#d32f2f">
      Jumps across valley!
    </text>
  </g>
  
  <!-- Bottom Panel: Mathematical Explanation -->
  <rect x="50" y="340" width="700" height="220" fill="white" stroke="#ddd" stroke-width="1" rx="5"/>
  <text x="400" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1565c0">
    Mathematical Analysis of Step Size Effects
  </text>
  
  <!-- Update equation -->
  <text x="400" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#333">
    Parameter Update: w<tspan baseline-shift="sub" font-size="10">t+1</tspan> = w<tspan baseline-shift="sub" font-size="10">t</tspan> - η ∇L(w<tspan baseline-shift="sub" font-size="10">t</tspan>)
  </text>
  
  <!-- Three scenarios -->
  <g id="scenarios">
    <!-- Small Step Size -->
    <rect x="70" y="410" width="200" height="120" fill="#e8f5e8" stroke="#4caf50" stroke-width="1" rx="3"/>
    <text x="170" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#4caf50">
      Small Step Size (η &lt;&lt; 1)
    </text>
    <text x="80" y="450" font-family="Arial, sans-serif" font-size="11" fill="#333">
      • |η ∇L| is very small
    </text>
    <text x="80" y="465" font-family="Arial, sans-serif" font-size="11" fill="#333">
      • Stable but slow convergence
    </text>
    <text x="80" y="480" font-family="Arial, sans-serif" font-size="11" fill="#333">
      • Many iterations required
    </text>
    <text x="80" y="495" font-family="Arial, sans-serif" font-size="11" fill="#333">
      • Conservative approach
    </text>
    <text x="170" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#4caf50" font-weight="bold">
      Δw ≈ 0 (tiny updates)
    </text>
  </g>
  
  <!-- Optimal Step Size -->
  <rect x="300" y="410" width="200" height="120" fill="#fff8e1" stroke="#ff9800" stroke-width="1" rx="3"/>
  <text x="400" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ff9800">
    Optimal Step Size
  </text>
  <text x="310" y="450" font-family="Arial, sans-serif" font-size="11" fill="#333">
    • Balanced step magnitude
  </text>
  <text x="310" y="465" font-family="Arial, sans-serif" font-size="11" fill="#333">
    • Fast, stable convergence
  </text>
  <text x="310" y="480" font-family="Arial, sans-serif" font-size="11" fill="#333">
    • Efficient training
  </text>
  <text x="310" y="495" font-family="Arial, sans-serif" font-size="11" fill="#333">
    • Best performance
  </text>
  <text x="400" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#ff9800" font-weight="bold">
    Δw just right
  </text>
  
  <!-- Large Step Size -->
  <rect x="530" y="410" width="200" height="120" fill="#ffebee" stroke="#d32f2f" stroke-width="1" rx="3"/>
  <text x="630" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#d32f2f">
    Large Step Size (η &gt;&gt; 1)
  </text>
  <text x="540" y="450" font-family="Arial, sans-serif" font-size="11" fill="#333">
    • |η ∇L| is very large
  </text>
  <text x="540" y="465" font-family="Arial, sans-serif" font-size="11" fill="#333">
    • Overshoots minimum
  </text>
  <text x="540" y="480" font-family="Arial, sans-serif" font-size="11" fill="#333">
    • Oscillating behavior
  </text>
  <text x="540" y="495" font-family="Arial, sans-serif" font-size="11" fill="#333">
    • May not converge
  </text>
  <text x="630" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#d32f2f" font-weight="bold">
    Δw &gt;&gt; optimal
  </text>
  
  <!-- Key Insight -->
  <rect x="200" y="570" width="400" height="25" fill="#e3f2fd" stroke="#1976d2" stroke-width="1" rx="12"/>
  <text x="400" y="587" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1976d2">
    💡 Key Insight: Step size must balance speed and stability
  </text>
</svg>