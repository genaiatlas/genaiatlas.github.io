<svg width="850" height="700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5b21b6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="inputGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0.4" />
    </linearGradient>
    <linearGradient id="cleanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fecaca;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:0.4" />
    </linearGradient>
    <linearGradient id="transformGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dbeafe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.4" />
    </linearGradient>
    <linearGradient id="selectGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d1fae5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:0.4" />
    </linearGradient>
    <linearGradient id="validateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0e7ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0.4" />
    </linearGradient>
    <filter id="shadow">
      <dropshadow dx="2" dy="2" stddeviation="3" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="850" height="700" fill="#f9fafb"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="850" height="60" fill="url(#headerGrad)"/>
  <text x="425" y="30" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="22" font-weight="bold" dy="0.35em">Feature Engineering Process</text>
  
  <!-- Step 1: Raw Data Input -->
  <rect x="50" y="80" width="750" height="80" fill="url(#inputGrad)" stroke="#f59e0b" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="70" y="105" fill="#92400e" font-family="Arial, sans-serif" font-size="16" font-weight="bold">1. Raw Data Input</text>
  <text x="70" y="125" fill="#92400e" font-family="Arial, sans-serif" font-size="12">• Structured data (databases, CSV, JSON)</text>
  <text x="70" y="140" fill="#92400e" font-family="Arial, sans-serif" font-size="12">• Unstructured data (text, images, audio)</text>
  <text x="70" y="155" fill="#92400e" font-family="Arial, sans-serif" font-size="12">• Time series data (logs, sensors, transactions)</text>
  
  <text x="450" y="125" fill="#92400e" font-family="Arial, sans-serif" font-size="12">• Geographic data (coordinates, addresses)</text>
  <text x="450" y="140" fill="#92400e" font-family="Arial, sans-serif" font-size="12">• Multi-modal data (combining different types)</text>
  <text x="450" y="155" fill="#92400e" font-family="Arial, sans-serif" font-size="12">• Streaming/Real-time data</text>
  
  <!-- Step 2: Data Cleaning -->
  <rect x="50" y="180" width="750" height="100" fill="url(#cleanGrad)" stroke="#ef4444" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="70" y="205" fill="#b91c1c" font-family="Arial, sans-serif" font-size="16" font-weight="bold">2. Data Cleaning & Preprocessing</text>
  
  <!-- Cleaning sub-steps -->
  <rect x="80" y="220" width="160" height="50" fill="rgba(255,255,255,0.7)" stroke="#dc2626" stroke-width="1" rx="5"/>
  <text x="160" y="235" text-anchor="middle" fill="#b91c1c" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Missing Values</text>
  <text x="160" y="248" text-anchor="middle" fill="#b91c1c" font-family="Arial, sans-serif" font-size="9">Imputation, Deletion</text>
  <text x="160" y="259" text-anchor="middle" fill="#b91c1c" font-family="Arial, sans-serif" font-size="9">Indicator Variables</text>
  
  <rect x="260" y="220" width="160" height="50" fill="rgba(255,255,255,0.7)" stroke="#dc2626" stroke-width="1" rx="5"/>
  <text x="340" y="235" text-anchor="middle" fill="#b91c1c" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Outlier Treatment</text>
  <text x="340" y="248" text-anchor="middle" fill="#b91c1c" font-family="Arial, sans-serif" font-size="9">IQR: Q₁ - 1.5×IQR < x < Q₃ + 1.5×IQR</text>
  <text x="340" y="259" text-anchor="middle" fill="#b91c1c" font-family="Arial, sans-serif" font-size="9">Z-score: |z| = |x-μ|/σ < 3</text>
  
  <rect x="440" y="220" width="160" height="50" fill="rgba(255,255,255,0.7)" stroke="#dc2626" stroke-width="1" rx="5"/>
  <text x="520" y="235" text-anchor="middle" fill="#b91c1c" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Data Validation</text>
  <text x="520" y="248" text-anchor="middle" fill="#b91c1c" font-family="Arial, sans-serif" font-size="9">Type checking, Range validation</text>
  <text x="520" y="259" text-anchor="middle" fill="#b91c1c" font-family="Arial, sans-serif" font-size="9">Consistency checks</text>
  
  <rect x="620" y="220" width="160" height="50" fill="rgba(255,255,255,0.7)" stroke="#dc2626" stroke-width="1" rx="5"/>
  <text x="700" y="235" text-anchor="middle" fill="#b91c1c" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Deduplication</text>
  <text x="700" y="248" text-anchor="middle" fill="#b91c1c" font-family="Arial, sans-serif" font-size="9">Exact & fuzzy matching</text>
  <text x="700" y="259" text-anchor="middle" fill="#b91c1c" font-family="Arial, sans-serif" font-size="9">Entity resolution</text>
  
  <!-- Step 3: Feature Transformation -->
  <rect x="50" y="300" width="750" height="140" fill="url(#transformGrad)" stroke="#3b82f6" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="70" y="325" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="16" font-weight="bold">3. Feature Transformation</text>
  
  <!-- Numerical transformations -->
  <text x="70" y="345" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Numerical Features:</text>
  
  <rect x="80" y="355" width="120" height="75" fill="rgba(255,255,255,0.7)" stroke="#2563eb" stroke-width="1" rx="5"/>
  <text x="140" y="370" text-anchor="middle" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Scaling</text>
  <text x="140" y="383" text-anchor="middle" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="9">Min-Max: (x-min)/(max-min)</text>
  <text x="140" y="396" text-anchor="middle" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="9">Z-score: (x-μ)/σ</text>
  <text x="140" y="409" text-anchor="middle" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="9">Robust: (x-median)/IQR</text>
  <text x="140" y="422" text-anchor="middle" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="9">Unit Vector: x/||x||</text>
  
  <rect x="220" y="355" width="120" height="75" fill="rgba(255,255,255,0.7)" stroke="#2563eb" stroke-width="1" rx="5"/>
  <text x="280" y="370" text-anchor="middle" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Mathematical</text>
  <text x="280" y="383" text-anchor="middle" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="9">Log: log(x+1)</text>
  <text x="280" y="396" text-anchor="middle" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="9">Square root: √x</text>
  <text x="280" y="409" text-anchor="middle" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="9">Power: x^n</text>
  <text x="280" y="422" text-anchor="middle" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="9">Box-Cox: (x^λ-1)/λ</text>
  
  <!-- Categorical transformations -->
  <text x="350" y="345" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Categorical Features:</text>
  
  <rect x="360" y="355" width="120" height="75" fill="rgba(255,255,255,0.7)" stroke="#2563eb" stroke-width="1" rx="5"/>
  <text x="420" y="370" text-anchor="middle" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Encoding</text>
  <text x="420" y="383" text-anchor="middle" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="9">One-hot encoding</text>
  <text x="420" y="396" text-anchor="middle" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="9">Target encoding</text>
  <text x="420" y="409" text-anchor="middle" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="9">Ordinal encoding</text>
  <text x="420" y="422" text-anchor="middle" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="9">Binary encoding</text>
  
  <rect x="500" y="355" width="120" height="75" fill="rgba(255,255,255,0.7)" stroke="#2563eb" stroke-width="1" rx="5"/>
  <text x="560" y="370" text-anchor="middle" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Advanced</text>
  <text x="560" y="383" text-anchor="middle" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="9">Embeddings</text>
  <text x="560" y="396" text-anchor="middle" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="9">Hashing</text>
  <text x="560" y="409" text-anchor="middle" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="9">Count/Frequency</text>
  <text x="560" y="422" text-anchor="middle" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="9">Leave-one-out</text>
  
  <!-- Temporal transformations -->
  <text x="640" y="345" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Temporal:</text>
  
  <rect x="650" y="355" width="120" height="75" fill="rgba(255,255,255,0.7)" stroke="#2563eb" stroke-width="1" rx="5"/>
  <text x="710" y="370" text-anchor="middle" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Time Features</text>
  <text x="710" y="383" text-anchor="middle" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="9">Year, Month, Day</text>
  <text x="710" y="396" text-anchor="middle" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="9">Cyclical encoding</text>
  <text x="710" y="409" text-anchor="middle" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="9">Lag features</text>
  <text x="710" y="422" text-anchor="middle" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="9">Rolling statistics</text>
  
  <!-- Step 4: Feature Creation -->
  <rect x="50" y="460" width="750" height="80" fill="url(#selectGrad)" stroke="#10b981" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="70" y="485" fill="#047857" font-family="Arial, sans-serif" font-size="16" font-weight="bold">4. Feature Creation & Engineering</text>
  <text x="70" y="505" fill="#047857" font-family="Arial, sans-serif" font-size="12">• Interaction features: x₁ × x₂, polynomial features: x^n</text>
  <text x="70" y="520" fill="#047857" font-family="Arial, sans-serif" font-size="12">• Ratio features: x₁/x₂, aggregation features: mean, std, count by group</text>
  <text x="70" y="535" fill="#047857" font-family="Arial, sans-serif" font-size="12">• Domain-specific features: business logic, expert knowledge</text>
  
  <!-- Step 5: Feature Selection -->
  <rect x="50" y="560" width="350" height="100" fill="url(#validateGrad)" stroke="#6366f1" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="70" y="585" fill="#4f46e5" font-family="Arial, sans-serif" font-size="16" font-weight="bold">5. Feature Selection</text>
  <text x="70" y="605" fill="#4f46e5" font-family="Arial, sans-serif" font-size="12">• Statistical: Chi-square, ANOVA, correlation</text>
  <text x="70" y="620" fill="#4f46e5" font-family="Arial, sans-serif" font-size="12">• Model-based: L1/L2 regularization, tree-based</text>
  <text x="70" y="635" fill="#4f46e5" font-family="Arial, sans-serif" font-size="12">• Wrapper methods: RFE, forward/backward selection</text>
  <text x="70" y="650" fill="#4f46e5" font-family="Arial, sans-serif" font-size="12">Information Gain: H(Y) - H(Y|X)</text>
  
  <!-- Step 6: Validation -->
  <rect x="420" y="560" width="350" height="100" fill="url(#validateGrad)" stroke="#6366f1" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="440" y="585" fill="#4f46e5" font-family="Arial, sans-serif" font-size="16" font-weight="bold">6. Feature Validation</text>
  <text x="440" y="605" fill="#4f46e5" font-family="Arial, sans-serif" font-size="12">• Cross-validation performance</text>
  <text x="440" y="620" fill="#4f46e5" font-family="Arial, sans-serif" font-size="12">• Feature importance analysis</text>
  <text x="440" y="635" fill="#4f46e5" font-family="Arial, sans-serif" font-size="12">• Stability testing across time periods</text>
  <text x="440" y="650" fill="#4f46e5" font-family="Arial, sans-serif" font-size="12">• Business logic validation</text>
  
  <!-- Flow arrows -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#374151"/>
    </marker>
  </defs>
  
  <path d="M 425 160 L 425 180" stroke="#374151" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 425 280 L 425 300" stroke="#374151" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 425 440 L 425 460" stroke="#374151" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 425 540 L 425 560" stroke="#374151" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Feedback loop arrow -->
  <path d="M 775 610 Q 825 610 825 400 Q 825 190 775 190" stroke="#6b7280" stroke-width="2" fill="none" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <text x="830" y="400" fill="#6b7280" font-family="Arial, sans-serif" font-size="10" font-style="italic">Iterative</text>
  <text x="830" y="415" fill="#6b7280" font-family="Arial, sans-serif" font-size="10" font-style="italic">Refinement</text>
  
  <!-- Footer -->
  <text x="425" y="685" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="11" font-style="italic">Systematic feature engineering drives model performance and business value</text>
</svg>