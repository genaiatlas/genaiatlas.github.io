<svg width="1000" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#00000030"/>
    </filter>
    <linearGradient id="dangerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#dc3545;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#dc3545;stop-opacity:0.3" />
    </linearGradient>
    <linearGradient id="safeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#28a745;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#28a745;stop-opacity:0.3" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="800" fill="url(#backgroundGradient)"/>
  
  <!-- Title -->
  <text x="500" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#212529">The Multiple Testing Problem: Hypothesis Shopping</text>
  <text x="500" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#6c757d">How testing many hypotheses inflates false discovery rates</text>
  
  <!-- Scenario Setup -->
  <rect x="50" y="80" width="900" height="120" fill="white" stroke="#495057" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="500" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#212529">Scenario: Testing 100 Foods for Heart Disease Association</text>
  
  <rect x="70" y="120" width="860" height="70" fill="#fff3cd" stroke="#856404" stroke-width="1" rx="5"/>
  <g font-family="Arial, sans-serif" font-size="14" fill="#495057">
    <text x="500" y="140" text-anchor="middle" font-weight="bold">Assumption: None of the 100 foods actually affect heart disease</text>
    <text x="500" y="160" text-anchor="middle">Each test uses α = 0.05 (5% significance level)</text>
    <text x="500" y="180" text-anchor="middle">Expected false positives: 100 × 0.05 = 5 foods will show "significant" effects by chance alone</text>
  </g>
  
  <!-- Visual grid of tests -->
  <rect x="50" y="220" width="600" height="400" fill="white" stroke="#495057" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="350" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#212529">100 Independent Statistical Tests</text>
  
  <!-- Grid of 100 squares representing tests -->
  <g transform="translate(80, 260)">
    <!-- Create 10x10 grid -->
    <g>
      <!-- Row 1 -->
      <rect x="0" y="0" width="50" height="30" fill="#28a745" stroke="#fff" opacity="0.8"/>
      <rect x="55" y="0" width="50" height="30" fill="#28a745" stroke="#fff" opacity="0.8"/>
      <rect x="110" y="0" width="50" height="30" fill="#dc3545" stroke="#fff" opacity="0.8"/> <!-- False positive -->
      <rect x="165" y="0" width="50" height="30" fill="#28a745" stroke="#fff" opacity="0.8"/>
      <rect x="220" y="0" width="50" height="30" fill="#28a745" stroke="#fff" opacity="0.8"/>
      <rect x="275" y="0" width="50" height="30" fill="#28a745" stroke="#fff" opacity="0.8"/>
      <rect x="330" y="0" width="50" height="30" fill="#28a745" stroke="#fff" opacity="0.8"/>
      <rect x="385" y="0" width="50" height="30" fill="#28a745" stroke="#fff" opacity="0.8"/>
      <rect x="440" y="0" width="50" height="30" fill="#28a745" stroke="#fff" opacity="0.8"/>
      <rect x="495" y="0" width="50" height="30" fill="#28a745" stroke="#fff" opacity="0.8"/>
      
      <!-- Row 2 -->
      <rect x="0" y="35" width="50" height="30" fill="#28a745" stroke="#fff" opacity="0.8"/>
      <rect x="55" y="35" width="50" height="30" fill="#28a745" stroke="#fff" opacity="0.8"/>
      <rect x="110" y="35" width="50" height="30" fill="#28a745" stroke="#fff" opacity="0.8"/>
      <rect x="165" y="35" width="50" height="30" fill="#28a745" stroke="#fff" opacity="0.8"/>
      <rect x="220" y="35" width="50" height="30" fill="#dc3545" stroke="#fff" opacity="0.8"/> <!-- False positive -->
      <rect x="275" y="35" width="50" height="30" fill="#28a745" stroke="#fff" opacity="0.8"/>
      <rect x="330" y="35" width="50" height="30" fill="#28a745" stroke="#fff" opacity="0.8"/>
      <rect x="385" y="35" width="50" height="30" fill="#28a745" stroke="#fff" opacity="0.8"/>
      <rect x="440" y="35" width="50" height="30" fill="#28a745" stroke="#fff" opacity="0.8"/>
      <rect x="495" y="35" width="50" height="30" fill="#28a745" stroke="#fff" opacity="0.8"/>
      
      <!-- Continuing pattern for remaining rows with occasional red squares -->
      <!-- Row 3-10 (simplified pattern) -->
      <g fill="#28a745" stroke="#fff" opacity="0.8">
        <!-- Most squares are green (non-significant) -->
        <rect x="0" y="70" width="50" height="30"/>
        <rect x="55" y="70" width="50" height="30"/>
        <rect x="110" y="70" width="50" height="30"/>
        <rect x="165" y="70" width="50" height="30"/>
        <rect x="220" y="70" width="50" height="30"/>
        <rect x="275" y="70" width="50" height="30"/>
        <rect x="330" y="70" width="50" height="30"/>
        <rect x="385" y="70" width="50" height="30"/>
        <rect x="440" y="70" width="50" height="30"/>
        <rect x="495" y="70" width="50" height="30"/>
        
        <!-- Continue grid pattern -->
        <rect x="0" y="105" width="50" height="30"/>
        <rect x="55" y="105" width="50" height="30"/>
        <rect x="110" y="105" width="50" height="30"/>
        <rect x="165" y="105" width="50" height="30"/>
        <rect x="220" y="105" width="50" height="30"/>
        <rect x="275" y="105" width="50" height="30"/>
        <rect x="330" y="105" width="50" height="30"/>
        <rect x="385" y="105" width="50" height="30"/>
        <rect x="440" y="105" width="50" height="30"/>
        <rect x="495" y="105" width="50" height="30"/>
        
        <!-- Continue for remaining rows -->
        <rect x="0" y="140" width="50" height="30"/>
        <rect x="55" y="140" width="50" height="30"/>
        <rect x="110" y="140" width="50" height="30"/>
        <rect x="165" y="140" width="50" height="30"/>
        <rect x="220" y="140" width="50" height="30"/>
        <rect x="275" y="140" width="50" height="30"/>
        <rect x="330" y="140" width="50" height="30"/>
        <rect x="385" y="140" width="50" height="30"/>
        <rect x="440" y="140" width="50" height="30"/>
        <rect x="495" y="140" width="50" height="30"/>
        
        <rect x="0" y="175" width="50" height="30"/>
        <rect x="55" y="175" width="50" height="30"/>
        <rect x="110" y="175" width="50" height="30"/>
        <rect x="165" y="175" width="50" height="30"/>
        <rect x="220" y="175" width="50" height="30"/>
        <rect x="275" y="175" width="50" height="30"/>
        <rect x="330" y="175" width="50" height="30"/>
        <rect x="385" y="175" width="50" height="30"/>
        <rect x="440" y="175" width="50" height="30"/>
        <rect x="495" y="175" width="50" height="30"/>
        
        <rect x="0" y="210" width="50" height="30"/>
        <rect x="55" y="210" width="50" height="30"/>
        <rect x="110" y="210" width="50" height="30"/>
        <rect x="165" y="210" width="50" height="30"/>
        <rect x="220" y="210" width="50" height="30"/>
        <rect x="275" y="210" width="50" height="30"/>
        <rect x="330" y="210" width="50" height="30"/>
        <rect x="385" y="210" width="50" height="30"/>
        <rect x="440" y="210" width="50" height="30"/>
        <rect x="495" y="210" width="50" height="30"/>
        
        <rect x="0" y="245" width="50" height="30"/>
        <rect x="55" y="245" width="50" height="30"/>
        <rect x="110" y="245" width="50" height="30"/>
        <rect x="165" y="245" width="50" height="30"/>
        <rect x="220" y="245" width="50" height="30"/>
        <rect x="275" y="245" width="50" height="30"/>
        <rect x="330" y="245" width="50" height="30"/>
        <rect x="385" y="245" width="50" height="30"/>
        <rect x="440" y="245" width="50" height="30"/>
        <rect x="495" y="245" width="50" height="30"/>
        
        <rect x="0" y="280" width="50" height="30"/>
        <rect x="55" y="280" width="50" height="30"/>
        <rect x="110" y="280" width="50" height="30"/>
        <rect x="165" y="280" width="50" height="30"/>
        <rect x="220" y="280" width="50" height="30"/>
        <rect x="275" y="280" width="50" height="30"/>
        <rect x="330" y="280" width="50" height="30"/>
        <rect x="385" y="280" width="50" height="30"/>
        <rect x="440" y="280" width="50" height="30"/>
        <rect x="495" y="280" width="50" height="30"/>
        
        <rect x="0" y="315" width="50" height="30"/>
        <rect x="55" y="315" width="50" height="30"/>
        <rect x="110" y="315" width="50" height="30"/>
        <rect x="165" y="315" width="50" height="30"/>
        <rect x="220" y="315" width="50" height="30"/>
        <rect x="275" y="315" width="50" height="30"/>
        <rect x="330" y="315" width="50" height="30"/>
        <rect x="385" y="315" width="50" height="30"/>
        <rect x="440" y="315" width="50" height="30"/>
        <rect x="495" y="315" width="50" height="30"/>
      </g>
      
      <!-- Add a few more false positives strategically -->
      <rect x="440" y="140" width="50" height="30" fill="#dc3545" stroke="#fff" opacity="0.8"/>
      <rect x="55" y="210" width="50" height="30" fill="#dc3545" stroke="#fff" opacity="0.8"/>
      <rect x="385" y="280" width="50" height="30" fill="#dc3545" stroke="#fff" opacity="0.8"/>
    </g>
    
    <!-- Labels for some foods -->
    <g font-family="Arial, sans-serif" font-size="8" fill="#fff" text-anchor="middle" font-weight="bold">
      <text x="25" y="20">Apples</text>
      <text x="80" y="20">Bread</text>
      <text x="135" y="20">Coffee</text>
      <text x="190" y="20">Fish</text>
      <text x="245" y="20">Nuts</text>
      <text x="25" y="55">Milk</text>
      <text x="80" y="55">Rice</text>
      <text x="245" y="55">Wine</text>
    </g>
  </g>
  
  <!-- Legend -->
  <rect x="80" y="590" width="540" height="40" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1" rx="5"/>
  <rect x="100" y="605" width="20" height="10" fill="#28a745" opacity="0.8"/>
  <text x="130" y="615" font-family="Arial, sans-serif" font-size="12" fill="#495057">Non-significant result (p > 0.05) - 95 foods</text>
  <rect x="350" y="605" width="20" height="10" fill="#dc3545" opacity="0.8"/>
  <text x="380" y="615" font-family="Arial, sans-serif" font-size="12" fill="#495057">False positive (p ≤ 0.05) - 5 foods</text>
  
  <!-- Probability calculation -->
  <rect x="680" y="220" width="280" height="400" fill="white" stroke="#495057" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="820" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#212529">Statistical Analysis</text>
  
  <!-- Probability box -->
  <rect x="700" y="260" width="240" height="140" fill="#f8d7da" stroke="#721c24" stroke-width="1" rx="5"/>
  <text x="820" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#721c24">The Disturbing Reality</text>
  
  <g font-family="Arial, sans-serif" font-size="12" fill="#495057">
    <text x="720" y="305">Individual test false positive rate:</text>
    <text x="720" y="320" font-weight="bold">α = 0.05 (5%)</text>
    
    <text x="720" y="345">Expected false positives:</text>
    <text x="720" y="360" font-weight="bold">100 × 0.05 = 5 foods</text>
    
    <text x="720" y="385">Probability of at least one false positive:</text>
    <text x="720" y="400" font-weight="bold" fill="#dc3545">P = 1 - (0.95)¹⁰⁰ = 99.4%</text>
  </g>
  
  <!-- Real-world consequences -->
  <rect x="700" y="420" width="240" height="90" fill="#fff3cd" stroke="#856404" stroke-width="1" rx="5"/>
  <text x="820" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#856404">Real-World Consequences</text>
  
  <g font-family="Arial, sans-serif" font-size="11" fill="#495057">
    <text x="710" y="460">• Media reports "breakthrough findings"</text>
    <text x="710" y="475">• Public changes diet unnecessarily</text>
    <text x="710" y="490">• Follow-up studies fail to replicate</text>
    <text x="710" y="505">• Scientific credibility damaged</text>
  </g>
  
  <!-- Solutions -->
  <rect x="700" y="530" width="240" height="80" fill="#d4edda" stroke="#155724" stroke-width="1" rx="5"/>
  <text x="820" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#155724">Statistical Solutions</text>
  
  <g font-family="Arial, sans-serif" font-size="11" fill="#495057">
    <text x="710" y="570">• Bonferroni correction: α/n</text>
    <text x="710" y="585">• False Discovery Rate (FDR) control</text>
    <text x="710" y="600">• Pre-registered hypotheses</text>
  </g>
  
  <!-- Bottom warning -->
  <rect x="50" y="650" width="900" height="130" fill="white" stroke="#495057" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="500" y="675" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#dc3545">⚠️ Publication Bias Amplifies the Problem</text>
  
  <rect x="70" y="690" width="860" height="80" fill="#f8d7da" stroke="#721c24" stroke-width="1" rx="5"/>
  <g font-family="Arial, sans-serif" font-size="14" fill="#495057" text-anchor="middle">
    <text x="500" y="715" font-weight="bold">Scenario: 50 research groups independently test the same ineffective treatment</text>
    <text x="500" y="735">→ ~2-3 groups find "significant" effects by chance (5% false positive rate)</text>
    <text x="500" y="755">→ Only positive results get published, negative results are ignored</text>
    <text x="500" y="775" font-weight="bold" fill="#dc3545">→ Literature appears to support an ineffective treatment!</text>
  </g>
</svg>