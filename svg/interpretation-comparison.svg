<svg viewBox="0 0 800 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title-text { font-family: 'Arial', sans-serif; font-size: 24px; font-weight: bold; fill: #2c3e50; }
      .subtitle-text { font-family: 'Arial', sans-serif; font-size: 18px; font-weight: bold; fill: #34495e; }
      .label-text { font-family: 'Arial', sans-serif; font-size: 14px; fill: #34495e; }
      .small-text { font-family: 'Arial', sans-serif; font-size: 12px; fill: #7f8c8d; }
      .header-text { font-family: 'Arial', sans-serif; font-size: 13px; font-weight: bold; fill: #2c3e50; }
      .table-header { fill: #6c757d; stroke: #495057; stroke-width: 1; }
      .row-even { fill: #f8f9fa; stroke: #dee2e6; stroke-width: 1; }
      .row-odd { fill: #ffffff; stroke: #dee2e6; stroke-width: 1; }
      .linear-approx { fill: #e8f5e8; stroke: #28a745; stroke-width: 2; }
      .mle-approach { fill: #fff3cd; stroke: #ffc107; stroke-width: 2; }
      .common-math { fill: #e3f2fd; stroke: #2196f3; stroke-width: 2; }
    </style>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title-text">Interpretation Comparison</text>
  
  <!-- Side-by-side comparison boxes -->
  <!-- Linear Approximation -->
  <g transform="translate(50, 70)">
    <rect x="0" y="0" width="320" height="240" class="linear-approx" rx="10"/>
    <text x="160" y="25" text-anchor="middle" class="subtitle-text" fill="#155724">Linear Approximation</text>
    
    <text x="20" y="50" class="header-text" fill="#155724">Philosophy:</text>
    <text x="30" y="70" class="small-text">Find best linear predictor for</text>
    <text x="30" y="85" class="small-text">complex (possibly nonlinear) world</text>
    
    <text x="20" y="110" class="header-text" fill="#155724">Assumptions:</text>
    <text x="30" y="130" class="small-text">• Large population exists</text>
    <text x="30" y="145" class="small-text">• Representative random sampling</text>
    <text x="30" y="160" class="small-text">• Linear constraint by choice</text>
    
    <text x="20" y="185" class="header-text" fill="#155724">Goal:</text>
    <text x="30" y="205" class="small-text">Minimize prediction error</text>
    <text x="30" y="220" class="small-text">E[(θᵀX - Y)²]</text>
  </g>
  
  <!-- Maximum Likelihood -->
  <g transform="translate(430, 70)">
    <rect x="0" y="0" width="320" height="240" class="mle-approach" rx="10"/>
    <text x="160" y="25" text-anchor="middle" class="subtitle-text" fill="#856404">Maximum Likelihood</text>
    
    <text x="20" y="50" class="header-text" fill="#856404">Philosophy:</text>
    <text x="30" y="70" class="small-text">Learn true parameters of</text>
    <text x="30" y="85" class="small-text">fundamentally linear world</text>
    
    <text x="20" y="110" class="header-text" fill="#856404">Assumptions:</text>
    <text x="30" y="130" class="small-text">• World is Y = θ₀ + θ₁X + W</text>
    <text x="30" y="145" class="small-text">• W ~ N(0, σ²) independent</text>
    <text x="30" y="160" class="small-text">• Linear structure is true</text>
    
    <text x="20" y="185" class="header-text" fill="#856404">Goal:</text>
    <text x="30" y="205" class="small-text">Maximize likelihood</text>
    <text x="30" y="220" class="small-text">L(θ) = ∏ᵢ P(Yᵢ|Xᵢ,θ)</text>
  </g>
  
  <!-- Comparison Table -->
  <g transform="translate(50, 340)">
    <text x="350" y="0" text-anchor="middle" class="subtitle-text">Detailed Comparison</text>
    
    <!-- Table headers -->
    <rect x="0" y="20" width="150" height="30" class="table-header"/>
    <rect x="150" y="20" width="275" height="30" class="table-header"/>
    <rect x="425" y="20" width="275" height="30" class="table-header"/>
    
    <text x="75" y="40" text-anchor="middle" class="header-text" fill="white">Aspect</text>
    <text x="287" y="40" text-anchor="middle" class="header-text" fill="white">Linear Approximation</text>
    <text x="562" y="40" text-anchor="middle" class="header-text" fill="white">Maximum Likelihood</text>
    
    <!-- Row 1: Primary Goal -->
    <rect x="0" y="50" width="150" height="25" class="row-odd"/>
    <rect x="150" y="50" width="275" height="25" class="row-odd"/>
    <rect x="425" y="50" width="275" height="25" class="row-odd"/>
    <text x="20" y="67" class="small-text">Primary Goal</text>
    <text x="170" y="67" class="small-text">Optimal prediction accuracy</text>
    <text x="445" y="67" class="small-text">Parameter estimation &amp; inference</text>
    
    <!-- Row 2: World View -->
    <rect x="0" y="75" width="150" height="25" class="row-even"/>
    <rect x="150" y="75" width="275" height="25" class="row-even"/>
    <rect x="425" y="75" width="275" height="25" class="row-even"/>
    <text x="20" y="92" class="small-text">World View</text>
    <text x="170" y="92" class="small-text">Complex, possibly nonlinear</text>
    <text x="445" y="92" class="small-text">Fundamentally linear + noise</text>
    
    <!-- Row 3: Assumptions -->
    <rect x="0" y="100" width="150" height="25" class="row-odd"/>
    <rect x="150" y="100" width="275" height="25" class="row-odd"/>
    <rect x="425" y="100" width="275" height="25" class="row-odd"/>
    <text x="20" y="117" class="small-text">Assumptions</text>
    <text x="170" y="117" class="small-text">Weaker (sampling only)</text>
    <text x="445" y="117" class="small-text">Stronger (distributional)</text>
    
    <!-- Row 4: Robustness -->
    <rect x="0" y="125" width="150" height="25" class="row-even"/>
    <rect x="150" y="125" width="275" height="25" class="row-even"/>
    <rect x="425" y="125" width="275" height="25" class="row-even"/>
    <text x="20" y="142" class="small-text">Robustness</text>
    <text x="170" y="142" class="small-text">More robust to model violations</text>
    <text x="445" y="142" class="small-text">Sensitive to assumption violations</text>
    
    <!-- Row 5: Parameter Interpretation -->
    <rect x="0" y="150" width="150" height="25" class="row-odd"/>
    <rect x="150" y="150" width="275" height="25" class="row-odd"/>
    <rect x="425" y="150" width="275" height="25" class="row-odd"/>
    <text x="20" y="167" class="small-text">Parameter Meaning</text>
    <text x="170" y="167" class="small-text">Optimal linear weights</text>
    <text x="445" y="167" class="small-text">True causal parameters</text>
    
    <!-- Row 6: Uncertainty -->
    <rect x="0" y="175" width="150" height="25" class="row-even"/>
    <rect x="150" y="175" width="275" height="25" class="row-even"/>
    <rect x="425" y="175" width="275" height="25" class="row-even"/>
    <text x="20" y="192" class="small-text">Uncertainty</text>
    <text x="170" y="192" class="small-text">Bootstrap, cross-validation</text>
    <text x="445" y="192" class="small-text">Confidence intervals, p-values</text>
    
    <!-- Row 7: Best Use Cases -->
    <rect x="0" y="200" width="150" height="40" class="row-odd"/>
    <rect x="150" y="200" width="275" height="40" class="row-odd"/>
    <rect x="425" y="200" width="275" height="40" class="row-odd"/>
    <text x="20" y="217" class="small-text">Best Use Cases</text>
    <text x="170" y="212" class="small-text">• Prediction tasks</text>
    <text x="170" y="227" class="small-text">• Complex relationships</text>
    <text x="445" y="212" class="small-text">• Scientific modeling</text>
    <text x="445" y="227" class="small-text">• Causal inference</text>
  </g>
  
  <!-- Common Mathematical Result -->
  <g transform="translate(150, 590)">
    <rect x="0" y="0" width="500" height="80" class="common-math" rx="10"/>
    <text x="250" y="25" text-anchor="middle" class="subtitle-text" fill="#1976d2">Mathematical Equivalence</text>
    
    <text x="250" y="50" text-anchor="middle" class="label-text" fill="#1976d2">Both approaches lead to identical optimization:</text>
    <text x="250" y="70" text-anchor="middle" class="header-text" fill="#1976d2">min θ Σᵢ₌₁ⁿ (θᵀXᵢ - Yᵢ)²</text>
  </g>
</svg>