<svg viewBox="0 0 1000 650" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="650" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    PCA Application: DNA Mapping Reveals European Geography
  </text>
  
  <!-- Process flow -->
  <!-- Step 1: DNA Data -->
  <g transform="translate(50, 70)">
    <rect x="0" y="0" width="180" height="120" fill="#e8f4fd" stroke="#3498db" stroke-width="2" rx="5"/>
    <text x="90" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#3498db">
      Step 1: DNA Sequencing
    </text>
    
    <!-- DNA helix representation -->
    <g transform="translate(40, 30)">
      <path d="M 0 20 Q 25 10, 50 20 Q 75 30, 100 20" stroke="#e74c3c" stroke-width="3" fill="none"/>
      <path d="M 0 30 Q 25 40, 50 30 Q 75 20, 100 30" stroke="#27ae60" stroke-width="3" fill="none"/>
      
      <!-- Connecting lines -->
      <line x1="10" y1="22" x2="10" y2="28" stroke="#34495e" stroke-width="1"/>
      <line x1="30" y1="18" x2="30" y2="32" stroke="#34495e" stroke-width="1"/>
      <line x1="50" y1="20" x2="50" y2="30" stroke="#34495e" stroke-width="1"/>
      <line x1="70" y1="22" x2="70" y2="28" stroke="#34495e" stroke-width="1"/>
      <line x1="90" y1="20" x2="90" y2="30" stroke="#34495e" stroke-width="1"/>
    </g>
    
    <text x="90" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
      100,000 genetic variants
    </text>
    <text x="90" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
      per person
    </text>
    <text x="90" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
      (No geographic info used)
    </text>
  </g>
  
  <!-- Arrow 1 -->
  <g transform="translate(250, 120)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#2c3e50" stroke-width="3" marker-end="url(#arrowhead)"/>
    <text x="20" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">PCA</text>
  </g>
  
  <!-- Step 2: PCA Processing -->
  <g transform="translate(310, 70)">
    <rect x="0" y="0" width="180" height="120" fill="#fff3cd" stroke="#f39c12" stroke-width="2" rx="5"/>
    <text x="90" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f39c12">
      Step 2: PCA Analysis
    </text>
    
    <!-- Matrix representation -->
    <g transform="translate(30, 35)">
      <rect x="0" y="0" width="120" height="50" fill="white" stroke="#2c3e50" stroke-width="1"/>
      <text x="60" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Data Matrix</text>
      <text x="60" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">n people ×</text>
      <text x="60" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">100k variants</text>
      
      <text x="140" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#f39c12">→</text>
      
      <text x="180" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">PC1 vs PC2</text>
      <text x="180" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">projection</text>
    </g>
    
    <text x="90" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
      Find 2 main directions
    </text>
  </g>
  
  <!-- Arrow 2 -->
  <g transform="translate(510, 120)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#2c3e50" stroke-width="3" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- Step 3: Result -->
  <g transform="translate(570, 70)">
    <rect x="0" y="0" width="180" height="120" fill="#e8f5e8" stroke="#27ae60" stroke-width="2" rx="5"/>
    <text x="90" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#27ae60">
      Step 3: Amazing Result!
    </text>
    
    <!-- Mini Europe map -->
    <g transform="translate(40, 30)">
      <rect x="0" y="0" width="100" height="60" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
      <text x="50" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">PC2</text>
      <text x="-10" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50" transform="rotate(-90 -10 35)">PC1</text>
      
      <!-- Sample points representing European countries -->
      <circle cx="20" cy="15" r="3" fill="#e74c3c"/> <!-- Norway -->
      <circle cx="30" cy="25" r="3" fill="#3498db"/> <!-- Sweden -->
      <circle cx="25" cy="35" r="3" fill="#f39c12"/> <!-- Denmark -->
      <circle cx="35" cy="40" r="3" fill="#9b59b6"/> <!-- Germany -->
      <circle cx="15" cy="45" r="3" fill="#27ae60"/> <!-- France -->
      <circle cx="55" cy="35" r="3" fill="#e67e22"/> <!-- Poland -->
      <circle cx="65" cy="50" r="3" fill="#1abc9c"/> <!-- Italy -->
      <circle cx="75" cy="45" r="3" fill="#34495e"/> <!-- Greece -->
      
      <text x="50" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#27ae60" font-weight="bold">
        Matches European map!
      </text>
    </g>
  </g>
  
  <!-- Detailed visualization -->
  <g transform="translate(100, 220)">
    <rect x="0" y="0" width="800" height="350" fill="#ffffff" stroke="#2c3e50" stroke-width="2" rx="10"/>
    <text x="400" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">
      PCA Result: Genetic Data Recreates European Geography
    </text>
    
    <!-- Coordinate system -->
    <g transform="translate(50, 50)">
      <line x1="0" y1="250" x2="600" y2="250" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
      <line x1="0" y1="250" x2="0" y2="50" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
      
      <!-- Axis labels -->
      <text x="610" y="255" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
        First Principal Component (PC1)
      </text>
      <text x="-35" y="40" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50" transform="rotate(-90 -35 40)">
        Second Principal Component (PC2)
      </text>
      
      <!-- European countries as clusters -->
      
      <!-- Scandinavia (top-left) -->
      <g transform="translate(80, 80)">
        <circle cx="0" cy="0" r="4" fill="#3498db"/>
        <circle cx="10" cy="5" r="4" fill="#3498db"/>
        <circle cx="-5" cy="8" r="4" fill="#3498db"/>
        <circle cx="8" cy="-3" r="4" fill="#3498db"/>
        <text x="15" y="0" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#3498db">
          Scandinavia
        </text>
      </g>
      
      <!-- British Isles (left) -->
      <g transform="translate(60, 150)">
        <circle cx="0" cy="0" r="4" fill="#27ae60"/>
        <circle cx="8" cy="5" r="4" fill="#27ae60"/>
        <circle cx="-3" cy="7" r="4" fill="#27ae60"/>
        <text x="15" y="0" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#27ae60">
          British Isles
        </text>
      </g>
      
      <!-- France (lower-left) -->
      <g transform="translate(100, 190)">
        <circle cx="0" cy="0" r="4" fill="#e74c3c"/>
        <circle cx="12" cy="3" r="4" fill="#e74c3c"/>
        <circle cx="5" cy="8" r="4" fill="#e74c3c"/>
        <circle cx="-5" cy="5" r="4" fill="#e74c3c"/>
        <text x="20" y="0" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e74c3c">
          France
        </text>
      </g>
      
      <!-- Germany/Central Europe (center) -->
      <g transform="translate(200, 160)">
        <circle cx="0" cy="0" r="4" fill="#f39c12"/>
        <circle cx="10" cy="5" r="4" fill="#f39c12"/>
        <circle cx="-8" cy="3" r="4" fill="#f39c12"/>
        <circle cx="5" cy="-5" r="4" fill="#f39c12"/>
        <circle cx="-3" cy="8" r="4" fill="#f39c12"/>
        <text x="15" y="-10" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f39c12">
          Central Europe
        </text>
      </g>
      
      <!-- Eastern Europe (center-right) -->
      <g transform="translate(350, 140)">
        <circle cx="0" cy="0" r="4" fill="#9b59b6"/>
        <circle cx="15" cy="8" r="4" fill="#9b59b6"/>
        <circle cx="-5" cy="10" r="4" fill="#9b59b6"/>
        <circle cx="8" cy="-5" r="4" fill="#9b59b6"/>
        <text x="20" y="0" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#9b59b6">
          Eastern Europe
        </text>
      </g>
      
      <!-- Southern Europe (bottom-center) -->
      <g transform="translate(250, 210)">
        <circle cx="0" cy="0" r="4" fill="#1abc9c"/>
        <circle cx="12" cy="2" r="4" fill="#1abc9c"/>
        <circle cx="-8" cy="5" r="4" fill="#1abc9c"/>
        <circle cx="5" cy="8" r="4" fill="#1abc9c"/>
        <text x="20" y="15" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1abc9c">
          Southern Europe
        </text>
      </g>
      
      <!-- Balkans (bottom-right) -->
      <g transform="translate(420, 200)">
        <circle cx="0" cy="0" r="4" fill="#e67e22"/>
        <circle cx="8" cy="5" r="4" fill="#e67e22"/>
        <circle cx="-5" cy="3" r="4" fill="#e67e22"/>
        <text x="15" y="10" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e67e22">
          Balkans
        </text>
      </g>
      
      <!-- Variance explanation -->
      <g transform="translate(500, 80)">
        <rect x="0" y="0" width="140" height="120" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" rx="5"/>
        <text x="70" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">
          Variance Explained
        </text>
        
        <text x="10" y="35" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
          PC1: ~0.3% of total variance
        </text>
        <text x="10" y="50" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
          PC2: ~0.2% of total variance
        </text>
        
        <text x="10" y="75" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">
          Even tiny genetic differences
        </text>
        <text x="10" y="90" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">
          capture major geographic
        </text>
        <text x="10" y="105" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">
          patterns!
        </text>
      </g>
    </g>
  </g>
  
  <!-- Key insights -->
  <g transform="translate(50, 590)">
    <rect x="0" y="0" width="900" height="50" fill="#d4edda" stroke="#28a745" stroke-width="2" rx="5"/>
    <text x="450" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#155724">
      Key Insights from this PCA Application
    </text>
    
    <g transform="translate(20, 25)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">
        • <tspan font-weight="bold">No geographic data</tspan> was used - only genetic variants
      </text>
      <text x="280" y="0" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">
        • <tspan font-weight="bold">PCA automatically</tspan> discovered geographic structure
      </text>
      <text x="600" y="0" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">
        • <tspan font-weight="bold">Demonstrates</tspan> PCA's pattern detection power
      </text>
    </g>
  </g>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/>
    </marker>
  </defs>
</svg>