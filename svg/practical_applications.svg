<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0fdf4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dcfce7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="edaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="featureGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="modelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="businessGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0.8" />
    </linearGradient>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" fill="#065f46" font-family="Arial, sans-serif" font-size="28" font-weight="bold">Practical Applications</text>
  <text x="600" y="65" text-anchor="middle" fill="#065f46" font-family="Arial, sans-serif" font-size="16">From Statistics to Actionable Insights</text>
  
  <!-- Data Science Workflow -->
  <g transform="translate(50, 100)">
    <text x="550" y="20" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="20" font-weight="bold">Data Science Workflow with Descriptive Statistics</text>
    
    <!-- Step 1: EDA -->
    <g transform="translate(0, 50)">
      <rect x="0" y="0" width="200" height="120" rx="10" fill="white" stroke="#3b82f6" stroke-width="2"/>
      <rect x="0" y="0" width="200" height="35" rx="10" fill="url(#edaGrad)"/>
      <text x="100" y="22" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">1. EXPLORATORY ANALYSIS</text>
      
      <text x="10" y="55" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Key Statistics:</text>
      <text x="10" y="70" fill="#374151" font-family="Arial, sans-serif" font-size="11">• Summary statistics</text>
      <text x="10" y="85" fill="#374151" font-family="Arial, sans-serif" font-size="11">• Distribution shape</text>
      <text x="10" y="100" fill="#374151" font-family="Arial, sans-serif" font-size="11">• Missing values</text>
      <text x="10" y="115" fill="#374151" font-family="Arial, sans-serif" font-size="11">• Outlier detection</text>
    </g>
    
    <!-- Arrow 1 -->
    <path d="M 210 110 L 250 110" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Step 2: Feature Engineering -->
    <g transform="translate(260, 50)">
      <rect x="0" y="0" width="200" height="120" rx="10" fill="white" stroke="#10b981" stroke-width="2"/>
      <rect x="0" y="0" width="200" height="35" rx="10" fill="url(#featureGrad)"/>
      <text x="100" y="22" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">2. FEATURE ENGINEERING</text>
      
      <text x="10" y="55" fill="#059669" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Applications:</text>
      <text x="10" y="70" fill="#374151" font-family="Arial, sans-serif" font-size="11">• Scaling (std, min-max)</text>
      <text x="10" y="85" fill="#374151" font-family="Arial, sans-serif" font-size="11">• Outlier treatment</text>
      <text x="10" y="100" fill="#374151" font-family="Arial, sans-serif" font-size="11">• Binning/discretization</text>
      <text x="10" y="115" fill="#374151" font-family="Arial, sans-serif" font-size="11">• Feature selection</text>
    </g>
    
    <!-- Arrow 2 -->
    <path d="M 470 110 L 510 110" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Step 3: Model Selection -->
    <g transform="translate(520, 50)">
      <rect x="0" y="0" width="200" height="120" rx="10" fill="white" stroke="#f59e0b" stroke-width="2"/>
      <rect x="0" y="0" width="200" height="35" rx="10" fill="url(#modelGrad)"/>
      <text x="100" y="22" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">3. MODEL SELECTION</text>
      
      <text x="10" y="55" fill="#d97706" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Guided by:</text>
      <text x="10" y="70" fill="#374151" font-family="Arial, sans-serif" font-size="11">• Data distribution</text>
      <text x="10" y="85" fill="#374151" font-family="Arial, sans-serif" font-size="11">• Variable relationships</text>
      <text x="10" y="100" fill="#374151" font-family="Arial, sans-serif" font-size="11">• Sample size</text>
      <text x="10" y="115" fill="#374151" font-family="Arial, sans-serif" font-size="11">• Feature correlations</text>
    </g>
    
    <!-- Arrow 3 -->
    <path d="M 730 110 L 770 110" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Step 4: Business Impact -->
    <g transform="translate(780, 50)">
      <rect x="0" y="0" width="200" height="120" rx="10" fill="white" stroke="#8b5cf6" stroke-width="2"/>
      <rect x="0" y="0" width="200" height="35" rx="10" fill="url(#businessGrad)"/>
      <text x="100" y="22" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">4. BUSINESS INSIGHTS</text>
      
      <text x="10" y="55" fill="#7c3aed" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Deliverables:</text>
      <text x="10" y="70" fill="#374151" font-family="Arial, sans-serif" font-size="11">• KPI dashboards</text>
      <text x="10" y="85" fill="#374151" font-family="Arial, sans-serif" font-size="11">• Performance reports</text>
      <text x="10" y="100" fill="#374151" font-family="Arial, sans-serif" font-size="11">• Risk assessments</text>
      <text x="10" y="115" fill="#374151" font-family="Arial, sans-serif" font-size="11">• A/B test results</text>
    </g>
  </g>
  
  <!-- Industry Applications -->
  <g transform="translate(50, 320)">
    <text x="550" y="20" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="20" font-weight="bold">Industry Applications</text>
    
    <!-- Finance Card -->
    <g transform="translate(0, 40)">
      <rect x="0" y="0" width="280" height="180" rx="10" fill="white" stroke="#ef4444" stroke-width="2"/>
      <rect x="0" y="0" width="280" height="40" rx="10" fill="#ef4444" fill-opacity="0.8"/>
      <text x="140" y="25" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">FINANCE</text>
      
      <text x="15" y="65" fill="#dc2626" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Risk Assessment:</text>
      <text x="15" y="80" fill="#374151" font-family="Arial, sans-serif" font-size="11">• Portfolio volatility (std dev)</text>
      <text x="15" y="95" fill="#374151" font-family="Arial, sans-serif" font-size="11">• VaR calculations</text>
      
      <text x="15" y="120" fill="#dc2626" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Performance Metrics:</text>
      <text x="15" y="135" fill="#374151" font-family="Arial, sans-serif" font-size="11">• Return distributions</text>
      <text x="15" y="150" fill="#374151" font-family="Arial, sans-serif" font-size="11">• Sharpe ratios</text>
      <text x="15" y="165" fill="#374151" font-family="Arial, sans-serif" font-size="11">• Correlation analysis</text>
    </g>
    
    <!-- Healthcare Card -->
    <g transform="translate(300, 40)">
      <rect x="0" y="0" width="280" height="180" rx="10" fill="white" stroke="#10b981" stroke-width="2"/>
      <rect x="0" y="0" width="280" height="40" rx="10" fill="#10b981" fill-opacity="0.8"/>
      <text x="140" y="25" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">HEALTHCARE</text>
      
      <text x="15" y="65" fill="#059669" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Clinical Studies:</text>
      <text x="15" y="80" fill="#374151" font-family="Arial, sans-serif" font-size="11">• Patient demographics</text>
      <text x="15" y="95" fill="#374151" font-family="Arial, sans-serif" font-size="11">• Treatment efficacy</text>
      
      <text x="15" y="120" fill="#059669" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Quality Control:</text>
      <text x="15" y="135" fill="#374151" font-family="Arial, sans-serif" font-size="11">• Lab test ranges</text>
      <text x="15" y="150" fill="#374151" font-family="Arial, sans-serif" font-size="11">• Anomaly detection</text>
      <text x="15" y="165" fill="#374151" font-family="Arial, sans-serif" font-size="11">• Process monitoring</text>
    </g>
    
    <!-- E-commerce Card -->
    <g transform="translate(600, 40)">
      <rect x="0" y="0" width="280" height="180" rx="10" fill="white" stroke="#3b82f6" stroke-width="2"/>
      <rect x="0" y="0" width="280" height="40" rx="10" fill="#3b82f6" fill-opacity="0.8"/>
      <text x="140" y="25" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">E-COMMERCE</text>
      
      <text x="15" y="65" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Customer Analytics:</text>
      <text x="15" y="80" fill="#374151" font-family="Arial, sans-serif" font-size="11">• Purchase patterns</text>
      <text x="15" y="95" fill="#374151" font-family="Arial, sans-serif" font-size="11">• Customer segmentation</text>
      
      <text x="15" y="120" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="13" font-weight="bold">A/B Testing:</text>
      <text x="15" y="135" fill="#374151" font-family="Arial, sans-serif" font-size="11">• Conversion rates</text>
      <text x="15" y="150" fill="#374151" font-family="Arial, sans-serif" font-size="11">• Revenue impact</text>
      <text x="15" y="165" fill="#374151" font-family="Arial, sans-serif" font-size="11">• Feature effectiveness</text>
    </g>
    
    <!-- Manufacturing Card -->
    <g transform="translate(900, 40)">
      <rect x="0" y="0" width="280" height="180" rx="10" fill="white" stroke="#f59e0b" stroke-width="2"/>
      <rect x="0" y="0" width="280" height="40" rx="10" fill="#f59e0b" fill-opacity="0.8"/>
      <text x="140" y="25" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">MANUFACTURING</text>
      
      <text x="15" y="65" fill="#d97706" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Quality Control:</text>
      <text x="15" y="80" fill="#374151" font-family="Arial, sans-serif" font-size="11">• Control charts</text>
      <text x="15" y="95" fill="#374151" font-family="Arial, sans-serif" font-size="11">• Process capability</text>
      
      <text x="15" y="120" fill="#d97706" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Optimization:</text>
      <text x="15" y="135" fill="#374151" font-family="Arial, sans-serif" font-size="11">• Defect rates</text>
      <text x="15" y="150" fill="#374151" font-family="Arial, sans-serif" font-size="11">• Equipment efficiency</text>
      <text x="15" y="165" fill="#374151" font-family="Arial, sans-serif" font-size="11">• Maintenance scheduling</text>
    </g>
  </g>
  
  <!-- Key Use Cases -->
  <g transform="translate(50, 540)">
    <rect x="0" y="0" width="1100" height="200" rx="10" fill="white" stroke="#6b7280" stroke-width="2"/>
    <rect x="0" y="0" width="1100" height="40" rx="10" fill="#6b7280" fill-opacity="0.8"/>
    <text x="550" y="25" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Common Use Cases and Decision Framework</text>
    
    <g transform="translate(30, 60)">
      <!-- Data Quality -->
      <text x="0" y="20" fill="#374151" font-family="Arial, sans-serif" font-size="14" font-weight="bold">1. Data Quality Assessment</text>
      <text x="0" y="40" fill="#374151" font-family="Arial, sans-serif" font-size="12">• Missing value patterns → % missing per variable</text>
      <text x="350" y="40" fill="#374151" font-family="Arial, sans-serif" font-size="12">• Outlier detection → IQR method, z-scores</text>
      <text x="700" y="40" fill="#374151" font-family="Arial, sans-serif" font-size="12">• Data consistency → Range checks</text>
      
      <!-- Feature Selection -->
      <text x="0" y="70" fill="#374151" font-family="Arial, sans-serif" font-size="14" font-weight="bold">2. Feature Selection and Engineering</text>
      <text x="0" y="90" fill="#374151" font-family="Arial, sans-serif" font-size="12">• Multicollinearity → Correlation matrix</text>
      <text x="350" y="90" fill="#374151" font-family="Arial, sans-serif" font-size="12">• Normalization needs → Skewness, kurtosis</text>
      <text x="700" y="90" fill="#374151" font-family="Arial, sans-serif" font-size="12">• Binning strategies → Quantiles</text>
      
      <!-- Model Guidance -->
      <text x="0" y="120" fill="#374151" font-family="Arial, sans-serif" font-size="14" font-weight="bold">3. Model Selection Guidance</text>
      <text x="0" y="140" fill="#374151" font-family="Arial, sans-serif" font-size="12">• Algorithm choice → Distribution shape</text>
      <text x="350" y="140" fill="#374151" font-family="Arial, sans-serif" font-size="12">• Validation strategy → Sample size, variance</text>
      <text x="700" y="140" fill="#374151" font-family="Arial, sans-serif" font-size="12">• Performance baselines → Central tendency</text>
    </g>
  </g>
</svg>