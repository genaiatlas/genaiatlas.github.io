<svg viewBox="0 0 1200 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="1000" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="600" y="40" font-size="24" font-weight="bold" text-anchor="middle" fill="#1a1a2e">
    Practical Security Tools &amp; Techniques
  </text>
  
  <!-- Sandboxing Section -->
  <g transform="translate(50, 90)">
    <rect x="0" y="0" width="550" height="280" rx="10" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3"/>
    <text x="275" y="35" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a2e">
      🔒 Sandboxing Techniques
    </text>
    
    <!-- Docker -->
    <g transform="translate(20, 55)">
      <rect x="0" y="0" width="510" height="65" rx="6" fill="#fff" stroke="#4a90e2" stroke-width="1.5"/>
      <text x="10" y="22" font-size="14" font-weight="bold" fill="#1a1a2e">Docker Containers</text>
      <text x="10" y="42" font-size="11" fill="#555">✓ Isolated environment with resource limits</text>
      <text x="10" y="57" font-size="11" fill="#555">✓ Restricted network and file system access</text>
    </g>
    
    <!-- Codespaces -->
    <g transform="translate(20, 130)">
      <rect x="0" y="0" width="510" height="65" rx="6" fill="#fff" stroke="#4a90e2" stroke-width="1.5"/>
      <text x="10" y="22" font-size="14" font-weight="bold" fill="#1a1a2e">GitHub Codespaces</text>
      <text x="10" y="42" font-size="11" fill="#555">✓ Cloud-based development environments</text>
      <text x="10" y="57" font-size="11" fill="#555">✓ Pre-configured security controls</text>
    </g>
    
    <!-- Built-in Tools -->
    <g transform="translate(20, 205)">
      <rect x="0" y="0" width="510" height="50" rx="6" fill="#fff" stroke="#4a90e2" stroke-width="1.5"/>
      <text x="10" y="22" font-size="14" font-weight="bold" fill="#1a1a2e">Built-in Sandboxing</text>
      <text x="10" y="40" font-size="11" fill="#555">✓ Codex CLI, Cursor IDE with native sandbox support</text>
    </g>
  </g>
  
  <!-- Network Controls -->
  <g transform="translate(620, 90)">
    <rect x="0" y="0" width="530" height="280" rx="10" fill="#e8f8f0" stroke="#27ae60" stroke-width="3"/>
    <text x="265" y="35" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a2e">
      🌐 Network Access Controls
    </text>
    
    <!-- Allowlisting -->
    <g transform="translate(20, 55)">
      <rect x="0" y="0" width="490" height="65" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.5"/>
      <text x="10" y="22" font-size="14" font-weight="bold" fill="#1a1a2e">Domain Allowlisting</text>
      <text x="10" y="42" font-size="11" fill="#555">✓ Restrict to trusted documentation sites</text>
      <text x="10" y="57" font-size="11" fill="#555">✓ Block unknown/suspicious domains</text>
    </g>
    
    <!-- Read-only -->
    <g transform="translate(20, 130)">
      <rect x="0" y="0" width="490" height="65" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.5"/>
      <text x="10" y="22" font-size="14" font-weight="bold" fill="#1a1a2e">Read-Only HTTP</text>
      <text x="10" y="42" font-size="11" fill="#555">✓ Allow GET requests only</text>
      <text x="10" y="57" font-size="11" fill="#555">✓ Block POST/PUT/DELETE operations</text>
    </g>
    
    <!-- Air-gap -->
    <g transform="translate(20, 205)">
      <rect x="0" y="0" width="490" height="50" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.5"/>
      <text x="10" y="22" font-size="14" font-weight="bold" fill="#1a1a2e">Complete Isolation</text>
      <text x="10" y="40" font-size="11" fill="#555">✓ Air-gap for sensitive work (no internet)</text>
    </g>
  </g>
  
  <!-- File System Controls -->
  <g transform="translate(50, 400)">
    <rect x="0" y="0" width="550" height="250" rx="10" fill="#fff5e6" stroke="#ff9800" stroke-width="3"/>
    <text x="275" y="35" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a2e">
      📁 File System Protection
    </text>
    
    <!-- Project sandbox -->
    <g transform="translate(20, 55)">
      <rect x="0" y="0" width="510" height="50" rx="6" fill="#fff" stroke="#ff9800" stroke-width="1.5"/>
      <text x="10" y="22" font-size="14" font-weight="bold" fill="#1a1a2e">Project Directory Sandbox</text>
      <text x="10" y="40" font-size="11" fill="#555">✓ Restrict access to specific project path only</text>
    </g>
    
    <!-- Exclusions -->
    <g transform="translate(20, 115)">
      <rect x="0" y="0" width="510" height="50" rx="6" fill="#fff" stroke="#ff9800" stroke-width="1.5"/>
      <text x="10" y="22" font-size="14" font-weight="bold" fill="#1a1a2e">Explicit Exclusions</text>
      <text x="10" y="40" font-size="11" fill="#555">✓ Block .env, secrets/, .ssh/, credentials/</text>
    </g>
    
    <!-- Read-only -->
    <g transform="translate(20, 175)">
      <rect x="0" y="0" width="510" height="50" rx="6" fill="#fff" stroke="#ff9800" stroke-width="1.5"/>
      <text x="10" y="22" font-size="14" font-weight="bold" fill="#1a1a2e">Read-Only Mounts</text>
      <text x="10" y="40" font-size="11" fill="#555">✓ Prevent tampering with source files</text>
    </g>
  </g>
  
  <!-- Credential Management -->
  <g transform="translate(620, 400)">
    <rect x="0" y="0" width="530" height="250" rx="10" fill="#fff0f5" stroke="#e91e63" stroke-width="3"/>
    <text x="265" y="35" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a2e">
      🔑 Credential Management
    </text>
    
    <!-- Least privilege -->
    <g transform="translate(20, 55)">
      <rect x="0" y="0" width="490" height="50" rx="6" fill="#fff" stroke="#e91e63" stroke-width="1.5"/>
      <text x="10" y="22" font-size="14" font-weight="bold" fill="#1a1a2e">Least Privilege Tokens</text>
      <text x="10" y="40" font-size="11" fill="#555">✓ Minimum required permissions only</text>
    </g>
    
    <!-- Rotation -->
    <g transform="translate(20, 115)">
      <rect x="0" y="0" width="490" height="50" rx="6" fill="#fff" stroke="#e91e63" stroke-width="1.5"/>
      <text x="10" y="22" font-size="14" font-weight="bold" fill="#1a1a2e">Automatic Rotation</text>
      <text x="10" y="40" font-size="11" fill="#555">✓ Rotate credentials every 7-30 days</text>
    </g>
    
    <!-- Scoping -->
    <g transform="translate(20, 175)">
      <rect x="0" y="0" width="490" height="50" rx="6" fill="#fff" stroke="#e91e63" stroke-width="1.5"/>
      <text x="10" y="22" font-size="14" font-weight="bold" fill="#1a1a2e">Resource Scoping</text>
      <text x="10" y="40" font-size="11" fill="#555">✓ Limit to specific repos/services</text>
    </g>
  </g>
  
  <!-- Approval Workflows -->
  <g transform="translate(50, 680)">
    <rect x="0" y="0" width="550" height="230" rx="10" fill="#f3e5f5" stroke="#9c27b0" stroke-width="3"/>
    <text x="275" y="35" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a2e">
      ✋ Approval Workflows
    </text>
    
    <!-- Risky ops -->
    <g transform="translate(20, 55)">
      <rect x="0" y="0" width="510" height="65" rx="6" fill="#fff" stroke="#9c27b0" stroke-width="1.5"/>
      <text x="10" y="22" font-size="14" font-weight="bold" fill="#1a1a2e">Require Approval For:</text>
      <text x="10" y="42" font-size="11" fill="#555">✓ File writes, network calls, Git pushes</text>
      <text x="10" y="57" font-size="11" fill="#555">✓ Package installations, env changes</text>
    </g>
    
    <!-- Risk-based -->
    <g transform="translate(20, 130)">
      <rect x="0" y="0" width="510" height="50" rx="6" fill="#fff" stroke="#9c27b0" stroke-width="1.5"/>
      <text x="10" y="22" font-size="14" font-weight="bold" fill="#1a1a2e">Risk-Based Approval</text>
      <text x="10" y="40" font-size="11" fill="#555">✓ High-risk operations only to reduce fatigue</text>
    </g>
    
    <!-- Logging -->
    <g transform="translate(20, 190)">
      <rect x="0" y="0" width="510" height="25" rx="6" fill="#fff" stroke="#9c27b0" stroke-width="1.5"/>
      <text x="10" y="18" font-size="11" fill="#555">✓ Log all approvals with timestamps</text>
    </g>
  </g>
  
      <!-- Monitoring -->
  <g transform="translate(620, 680)">
    <rect x="0" y="0" width="530" height="230" rx="10" fill="#e8f5e9" stroke="#4caf50" stroke-width="3"/>
    <text x="265" y="35" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a2e">
      📊 Monitoring &amp; Logging
    </text>
    
    <!-- Comprehensive logs -->
    <g transform="translate(20, 55)">
      <rect x="0" y="0" width="490" height="65" rx="6" fill="#fff" stroke="#4caf50" stroke-width="1.5"/>
      <text x="10" y="22" font-size="14" font-weight="bold" fill="#1a1a2e">Comprehensive Logging</text>
      <text x="10" y="42" font-size="11" fill="#555">✓ Every tool call, file op, network request</text>
      <text x="10" y="57" font-size="11" fill="#555">✓ Agent reasoning and decision rationale</text>
    </g>
    
    <!-- Analysis -->
    <g transform="translate(20, 130)">
      <rect x="0" y="0" width="490" height="50" rx="6" fill="#fff" stroke="#4caf50" stroke-width="1.5"/>
      <text x="10" y="22" font-size="14" font-weight="bold" fill="#1a1a2e">Regular Analysis</text>
      <text x="10" y="40" font-size="11" fill="#555">✓ Daily reviews for anomalies and patterns</text>
    </g>
    
    <!-- Alerts -->
    <g transform="translate(20, 190)">
      <rect x="0" y="0" width="490" height="25" rx="6" fill="#fff" stroke="#4caf50" stroke-width="1.5"/>
      <text x="10" y="18" font-size="11" fill="#555">✓ Automated alerts for suspicious activity</text>
    </g>
  </g>
  
  <!-- Bottom principle -->
  <g transform="translate(200, 940)">
    <rect x="0" y="0" width="800" height="50" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
    <text x="400" y="25" font-size="14" font-weight="bold" text-anchor="middle" fill="#856404">
      🎯 Key Principle: Combine multiple techniques to create defense in depth
    </text>
    <text x="400" y="42" font-size="11" text-anchor="middle" fill="#856404">
      No single control is perfect — layered security provides robust protection
    </text>
  </g>
</svg>