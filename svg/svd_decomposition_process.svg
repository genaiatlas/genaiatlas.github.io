<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
     refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
    <linearGradient id="dataGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="uGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27ae60;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sigmaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e67e22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="vGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9b59b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8e44ad;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="2" flood-color="#00000030"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    Singular Value Decomposition (SVD) Process
  </text>
  
  <!-- SVD Equation -->
  <text x="500" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#7f8c8d">
    X = U Σ V^T
  </text>
  
  <!-- Data Matrix Section -->
  <g id="data-matrix">
    <rect x="50" y="80" width="120" height="100" fill="url(#dataGrad)" stroke="#2c3e50" stroke-width="2" rx="8" filter="url(#shadow)"/>
    
    <text x="110" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
      Data Matrix X
    </text>
    <text x="110" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
      n × d
    </text>
    <text x="110" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
      People × Places
    </text>
    
    <!-- Sample data visualization -->
    <rect x="60" y="150" width="100" height="20" fill="#2980b9" stroke="white" stroke-width="0.5"/>
    <text x="110" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">
      Rating Matrix
    </text>
  </g>
  
  <!-- Decomposition arrow -->
  <path d="M 180 130 L 220 130" stroke="#34495e" stroke-width="4" fill="none" marker-end="url(#arrowhead)"/>
  <text x="200" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
    SVD
  </text>
  <text x="200" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">
    Factorization
  </text>
  
  <!-- U Matrix -->
  <g id="u-matrix">
    <rect x="240" y="80" width="120" height="100" fill="url(#uGrad)" stroke="#2c3e50" stroke-width="2" rx="8" filter="url(#shadow)"/>
    
    <text x="300" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
      U Matrix
    </text>
    <text x="300" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
      n × r
    </text>
    <text x="300" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
      Left Singular
    </text>
    <text x="300" y="152" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
      Vectors
    </text>
    <text x="300" y="167" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">
      People's themes
    </text>
  </g>
  
  <!-- Multiplication symbol -->
  <text x="375" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">
    ×
  </text>
  
  <!-- Sigma Matrix -->
  <g id="sigma-matrix">
    <rect x="390" y="80" width="120" height="100" fill="url(#sigmaGrad)" stroke="#2c3e50" stroke-width="2" rx="8" filter="url(#shadow)"/>
    
    <text x="450" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
      Σ Matrix
    </text>
    <text x="450" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
      r × r
    </text>
    <text x="450" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
      Singular Values
    </text>
    <text x="450" y="152" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
      (diagonal)
    </text>
    
    <!-- Diagonal visualization -->
    <line x1="410" y1="160" x2="490" y2="170" stroke="white" stroke-width="3"/>
    <circle cx="420" cy="162" r="3" fill="white"/>
    <circle cx="440" cy="165" r="2" fill="white"/>
    <circle cx="460" cy="167" r="1" fill="white"/>
    <text x="450" y="167" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">
      σ₁ > σ₂ > σ₃
    </text>
  </g>
  
  <!-- Multiplication symbol -->
  <text x="525" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">
    ×
  </text>
  
  <!-- V^T Matrix -->
  <g id="vt-matrix">
    <rect x="540" y="80" width="120" height="100" fill="url(#vGrad)" stroke="#2c3e50" stroke-width="2" rx="8" filter="url(#shadow)"/>
    
    <text x="600" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
      V^T Matrix
    </text>
    <text x="600" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
      r × d
    </text>
    <text x="600" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
      Right Singular
    </text>
    <text x="600" y="152" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
      Vectors (Transposed)
    </text>
    <text x="600" y="167" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">
      Places' themes
    </text>
  </g>
  
  <!-- Detailed Interpretation Section -->
  <g id="interpretation">
    <rect x="50" y="210" width="900" height="200" fill="#ffffff" stroke="#2c3e50" stroke-width="2" rx="10" filter="url(#shadow)"/>
    
    <text x="500" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">
      Matrix Interpretation in Holiday Rating Example
    </text>
    
    <!-- U Matrix Details -->
    <g id="u-details">
      <rect x="70" y="250" width="200" height="140" fill="#e8f8f5" stroke="#2ecc71" stroke-width="2" rx="5"/>
      <text x="170" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#27ae60">
        U Matrix (People)
      </text>
      
      <text x="170" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
        Left Singular Vectors
      </text>
      <text x="80" y="310" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
        • Rows = People
      </text>
      <text x="80" y="325" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
        • Columns = Themes
      </text>
      <text x="80" y="340" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
        • Values = Person's preference
      </text>
      <text x="80" y="355" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
        • Example: Adventure lover
      </text>
      <text x="80" y="370" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
        • Coordinates for visualization
      </text>
      <text x="170" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">
        U × Σ = PCA coordinates
      </text>
    </g>
    
    <!-- Sigma Details -->
    <g id="sigma-details">
      <rect x="290" y="250" width="200" height="140" fill="#fef5e7" stroke="#f39c12" stroke-width="2" rx="5"/>
      <text x="390" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e67e22">
        Σ Matrix (Importance)
      </text>
      
      <text x="390" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
        Singular Values
      </text>
      <text x="300" y="310" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
        • Diagonal matrix only
      </text>
      <text x="300" y="325" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
        • σ₁ ≥ σ₂ ≥ ... ≥ σᵣ ≥ 0
      </text>
      <text x="300" y="340" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
        • Theme importance weights
      </text>
      <text x="300" y="355" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
        • σ₁²= largest eigenvalue
      </text>
      <text x="300" y="370" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
        • Rank = number of non-zero σᵢ
      </text>
      <text x="390" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">
        Controls theme strength
      </text>
    </g>
    
    <!-- V^T Details -->
    <g id="vt-details">
      <rect x="510" y="250" width="200" height="140" fill="#f4f1fb" stroke="#9b59b6" stroke-width="2" rx="5"/>
      <text x="610" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#8e44ad">
        V^T Matrix (Places)
      </text>
      
      <text x="610" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
        Right Singular Vectors
      </text>
      <text x="520" y="310" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
        • Rows = Themes
      </text>
      <text x="520" y="325" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
        • Columns = Places
      </text>
      <text x="520" y="340" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
        • Values = Place's association
      </text>
      <text x="520" y="355" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
        • Example: Scuba = Adventure
      </text>
      <text x="520" y="370" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
        • Same as PCA eigenvectors
      </text>
      <text x="610" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">
        Feature combinations
      </text>
    </g>
    
    <!-- Themes Visualization -->
    <g id="themes">
      <rect x="730" y="250" width="200" height="140" fill="#ecf0f1" stroke="#34495e" stroke-width="2" rx="5"/>
      <text x="830" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
        Example Themes
      </text>
      
      <text x="830" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
        Discovered Patterns
      </text>
      
      <!-- Theme 1: Adventure -->
      <rect x="740" y="300" width="80" height="25" fill="#e74c3c" rx="3"/>
      <text x="780" y="317" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">
        Theme 1
      </text>
      <text x="740" y="335" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">
        Adventure/Scuba
      </text>
      
      <!-- Theme 2: Mountains -->
      <rect x="840" y="300" width="80" height="25" fill="#3498db" rx="3"/>
      <text x="880" y="317" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">
        Theme 2
      </text>
      <text x="840" y="335" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">
        Mountains/Alps
      </text>
      
      <text x="780" y="350" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">
        σ₁ = 30 (strong)
      </text>
      <text x="880" y="350" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">
        σ₂ = 15 (moderate)
      </text>
      
      <text x="830" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">
        People cluster by
      </text>
      <text x="830" y="382" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">
        these preferences
      </text>
    </g>
  </g>
  
  <!-- Comparison with PCA -->
  <g id="pca-comparison">
    <rect x="50" y="430" width="900" height="140" fill="#f8f9fa" stroke="#85929e" stroke-width="1" rx="5"/>
    
    <text x="500" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">
      SVD vs PCA Relationship
    </text>
    
    <!-- PCA Side -->
    <g id="pca-side">
      <rect x="70" y="470" width="180" height="80" fill="#ebf3fd" stroke="#3498db" stroke-width="2" rx="5"/>
      <text x="160" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2980b9">
        PCA Approach
      </text>
      <text x="80" y="510" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
        1. Compute C = X^T X
      </text>
      <text x="80" y="525" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
        2. Find eigenvectors of C
      </text>
      <text x="80" y="540" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
        3. Project: Y = X × V
      </text>
    </g>
    
    <!-- Equivalence arrow -->
    <path d="M 260 510 L 320 510" stroke="#27ae60" stroke-width="4" fill="none" marker-end="url(#arrowhead)"/>
    <text x="290" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#27ae60">
      Equivalent
    </text>
    <text x="290" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">
      V same as PCA
    </text>
    <text x="290" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">
      eigenvectors
    </text>
    
    <!-- SVD Side -->
    <g id="svd-side">
      <rect x="330" y="470" width="180" height="80" fill="#fdf2f2" stroke="#e74c3c" stroke-width="2" rx="5"/>
      <text x="420" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#c0392b">
        SVD Approach
      </text>
      <text x="340" y="510" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
        1. Factorize X = UΣV^T
      </text>
      <text x="340" y="525" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
        2. V contains eigenvectors
      </text>
      <text x="340" y="540" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
        3. Bonus: U gives row patterns
      </text>
    </g>
    
    <!-- Advantages -->
    <g id="advantages">
      <rect x="530" y="470" width="180" height="80" fill="#e8f8f5" stroke="#2ecc71" stroke-width="2" rx="5"/>
      <text x="620" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#27ae60">
        SVD Advantages
      </text>
      <text x="540" y="510" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
        • Analyzes both dimensions
      </text>
      <text x="540" y="525" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
        • Numerically stable
      </text>
      <text x="540" y="540" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
        • Direct matrix factorization
      </text>
    </g>
    
    <!-- Applications -->
    <g id="svd-applications">
      <rect x="730" y="470" width="200" height="80" fill="#fef9e7" stroke="#f39c12" stroke-width="2" rx="5"/>
      <text x="830" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e67e22">
        SVD Applications
      </text>
      <text x="740" y="510" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
        • Recommendation systems
      </text>
      <text x="740" y="525" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
        • Image compression
      </text>
      <text x="740" y="540" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
        • Latent semantic analysis
      </text>
    </g>
  </g>
</svg>