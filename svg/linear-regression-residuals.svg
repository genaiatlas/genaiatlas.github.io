<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title-text { font-family: 'Arial', sans-serif; font-size: 24px; font-weight: bold; fill: #2c3e50; }
      .equation-text { font-family: 'Times New Roman', serif; font-size: 16px; fill: #2c3e50; }
      .label-text { font-family: 'Arial', sans-serif; font-size: 14px; fill: #34495e; }
      .small-text { font-family: 'Arial', sans-serif; font-size: 12px; fill: #7f8c8d; }
      .axis-line { stroke: #2c3e50; stroke-width: 2; }
      .grid-line { stroke: #ecf0f1; stroke-width: 1; }
      .data-point { fill: #3498db; stroke: #2980b9; stroke-width: 2; }
      .regression-line { stroke: #e74c3c; stroke-width: 3; fill: none; }
      .residual-line { stroke: #f39c12; stroke-width: 2; stroke-dasharray: 5,5; }
      .predicted-point { fill: #e74c3c; stroke: #c0392b; stroke-width: 2; }
      .highlight-box { fill: #fff3cd; stroke: #ffeaa7; stroke-width: 2; rx: 5; }
      .annotation-line { stroke: #6c757d; stroke-width: 1; stroke-dasharray: 2,2; }
    </style>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title-text">Linear Regression Residuals Analysis</text>
  
  <!-- Main scatter plot -->
  <g transform="translate(80, 80)">
    <text x="200" y="0" text-anchor="middle" class="label-text">Residuals = Observed - Predicted Values</text>
    
    <!-- Coordinate system -->
    <g transform="translate(50, 30)">
      <!-- Grid lines -->
      <line x1="0" y1="50" x2="350" y2="50" class="grid-line"/>
      <line x1="0" y1="100" x2="350" y2="100" class="grid-line"/>
      <line x1="0" y1="150" x2="350" y2="150" class="grid-line"/>
      <line x1="0" y1="200" x2="350" y2="200" class="grid-line"/>
      <line x1="0" y1="250" x2="350" y2="250" class="grid-line"/>
      <line x1="0" y1="300" x2="350" y2="300" class="grid-line"/>
      
      <line x1="70" y1="0" x2="70" y2="350" class="grid-line"/>
      <line x1="140" y1="0" x2="140" y2="350" class="grid-line"/>
      <line x1="210" y1="0" x2="210" y2="350" class="grid-line"/>
      <line x1="280" y1="0" x2="280" y2="350" class="grid-line"/>
      
      <!-- Axes -->
      <line x1="0" y1="350" x2="350" y2="350" class="axis-line"/>
      <line x1="0" y1="0" x2="0" y2="350" class="axis-line"/>
      
      <!-- Axis labels -->
      <text x="175" y="375" text-anchor="middle" class="label-text">X (Feature Value)</text>
      <text x="-25" y="175" text-anchor="middle" class="label-text" transform="rotate(-90, -25, 175)">Y (Target Value)</text>
      
      <!-- Regression line: y = 2 + 0.8x (scaled for visualization) -->
      <line x1="20" y1="300" x2="330" y2="50" class="regression-line"/>
      
      <!-- Data points with residuals -->
      <!-- Point 1 -->
      <circle cx="60" cy="240" r="5" class="data-point"/>
      <circle cx="60" cy="265" r="3" class="predicted-point"/>
      <line x1="60" y1="240" x2="60" y2="265" class="residual-line"/>
      <text x="70" y="235" class="small-text">r₁</text>
      
      <!-- Point 2 -->
      <circle cx="100" cy="190" r="5" class="data-point"/>
      <circle cx="100" cy="235" r="3" class="predicted-point"/>
      <line x1="100" y1="190" x2="100" y2="235" class="residual-line"/>
      <text x="110" y="185" class="small-text">r₂</text>
      
      <!-- Point 3 -->
      <circle cx="140" cy="200" r="5" class="data-point"/>
      <circle cx="140" cy="205" r="3" class="predicted-point"/>
      <line x1="140" y1="200" x2="140" y2="205" class="residual-line"/>
      <text x="150" y="195" class="small-text">r₃</text>
      
      <!-- Point 4 -->
      <circle cx="180" cy="150" r="5" class="data-point"/>
      <circle cx="180" cy="175" r="3" class="predicted-point"/>
      <line x1="180" y1="150" x2="180" y2="175" class="residual-line"/>
      <text x="190" y="145" class="small-text">r₄</text>
      
      <!-- Point 5 -->
      <circle cx="220" cy="120" r="5" class="data-point"/>
      <circle cx="220" cy="145" r="3" class="predicted-point"/>
      <line x1="220" y1="120" x2="220" y2="145" class="residual-line"/>
      <text x="230" y="115" class="small-text">r₅</text>
      
      <!-- Point 6 -->
      <circle cx="260" cy="140" r="5" class="data-point"/>
      <circle cx="260" cy="115" r="3" class="predicted-point"/>
      <line x1="260" y1="140" x2="260" y2="115" class="residual-line"/>
      <text x="270" y="135" class="small-text">r₆</text>
      
      <!-- Point 7 -->
      <circle cx="300" cy="80" r="5" class="data-point"/>
      <circle cx="300" cy="85" r="3" class="predicted-point"/>
      <line x1="300" y1="80" x2="300" y2="85" class="residual-line"/>
      <text x="310" y="75" class="small-text">r₇</text>
      
      <!-- Legend -->
      <g transform="translate(10, 10)">
        <circle cx="0" cy="0" r="4" class="data-point"/>
        <text x="10" y="4" class="small-text">Observed (yᵢ)</text>
        
        <circle cx="0" cy="20" r="3" class="predicted-point"/>
        <text x="10" y="24" class="small-text">Predicted (ŷᵢ)</text>
        
        <line x1="0" y1="35" x2="15" y2="35" class="regression-line"/>
        <text x="20" y="39" class="small-text">θᵀx</text>
        
        <line x1="0" y1="50" x2="15" y2="50" class="residual-line"/>
        <text x="20" y="54" class="small-text">Residual</text>
      </g>
    </g>
  </g>
  
  <!-- Mathematical formulation -->
  <g transform="translate(480, 120)">
    <text x="0" y="0" class="label-text">Mathematical Definition:</text>
    
    <g transform="translate(0, 30)">
      <rect x="-10" y="-15" width="280" height="130" class="highlight-box"/>
      
      <text x="10" y="5" class="equation-text">Residual for point i:</text>
      <text x="10" y="30" class="equation-text">rᵢ = yᵢ - ŷᵢ = yᵢ - θᵀxᵢ</text>
      
      <text x="10" y="60" class="equation-text">Sum of Squared Residuals:</text>
      <text x="10" y="85" class="equation-text">SSR = Σᵢ₌₁ⁿ rᵢ² = Σᵢ₌₁ⁿ (yᵢ - θᵀxᵢ)²</text>
      
      <text x="10" y="110" class="equation-text">Goal: min θ SSR</text>
    </g>
    
    <!-- Properties -->
    <g transform="translate(0, 180)">
      <text x="0" y="0" class="label-text">Residual Properties:</text>
      <text x="0" y="25" class="small-text">• Positive: Observed &gt; Predicted</text>
      <text x="0" y="45" class="small-text">• Negative: Observed &lt; Predicted</text>
      <text x="0" y="65" class="small-text">• Zero: Perfect prediction</text>
      <text x="0" y="85" class="small-text">• Sum of residuals = 0 (for linear regression)</text>
      <text x="0" y="105" class="small-text">• Variance indicates model quality</text>
    </g>
    
    <!-- Optimization insight -->
    <g transform="translate(0, 300)">
      <rect x="-10" y="-10" width="280" height="60" fill="#e8f5e8" stroke="#28a745" stroke-width="2" rx="5"/>
      <text x="10" y="10" class="label-text" fill="#155724">Optimization Insight:</text>
      <text x="10" y="30" class="small-text" fill="#155724">Linear regression finds θ that makes</text>
      <text x="10" y="45" class="small-text" fill="#155724">the sum of squared residuals minimal</text>
    </g>
  </g>
  
  <!-- Bottom summary -->
  <g transform="translate(400, 550)">
    <text x="0" y="0" text-anchor="middle" class="equation-text">
      Residual Analysis: Key to understanding prediction quality and model assumptions
    </text>
  </g>
</svg>