<svg viewBox="0 0 800 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title-text { font-family: 'Arial', sans-serif; font-size: 24px; font-weight: bold; fill: #2c3e50; }
      .subtitle-text { font-family: 'Arial', sans-serif; font-size: 18px; font-weight: bold; fill: #34495e; }
      .label-text { font-family: 'Arial', sans-serif; font-size: 14px; fill: #34495e; }
      .small-text { font-family: 'Arial', sans-serif; font-size: 12px; fill: #7f8c8d; }
      .equation-text { font-family: 'Times New Roman', serif; font-size: 16px; fill: #2c3e50; }
      .model-box { fill: #e8f5e8; stroke: #28a745; stroke-width: 2; rx: 8; }
      .assumption-box { fill: #fff3cd; stroke: #ffc107; stroke-width: 2; rx: 8; }
      .likelihood-box { fill: #f8d7da; stroke: #dc3545; stroke-width: 2; rx: 8; }
      .result-box { fill: #d1ecf1; stroke: #17a2b8; stroke-width: 2; rx: 8; }
      .axis-line { stroke: #2c3e50; stroke-width: 2; }
      .data-point { fill: #dc3545; stroke: #bd2130; stroke-width: 1; }
      .true-line { stroke: #28a745; stroke-width: 3; fill: none; }
      .noise-line { stroke: #ffc107; stroke-width: 1; stroke-dasharray: 3,3; }
      .arrow { stroke: #6c757d; stroke-width: 2; fill: #6c757d; }
    </style>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title-text">Maximum Likelihood Framework</text>
  
  <!-- Structural Model -->
  <g transform="translate(50, 70)">
    <rect x="0" y="0" width="350" height="120" class="model-box"/>
    <text x="175" y="25" text-anchor="middle" class="subtitle-text" fill="#155724">Structural Model</text>
    
    <text x="175" y="55" text-anchor="middle" class="equation-text">Y = θ₀ + θ₁X + W</text>
    
    <text x="20" y="80" class="label-text" fill="#155724">Components:</text>
    <text x="30" y="95" class="small-text">θ₀, θ₁: True parameters  |  W: Noise term</text>
    <text x="30" y="110" class="small-text">Linear structure is the true relationship</text>
  </g>
  
  <!-- Assumptions -->
  <g transform="translate(450, 70)">
    <rect x="0" y="0" width="300" height="120" class="assumption-box"/>
    <text x="150" y="25" text-anchor="middle" class="subtitle-text" fill="#856404">Noise Assumptions</text>
    
    <text x="20" y="50" class="equation-text" fill="#856404">Wᵢ ~ N(0, σ²)</text>
    
    <text x="20" y="75" class="small-text">• Independent: E[WᵢWⱼ] = 0 for i ≠ j</text>
    <text x="20" y="90" class="small-text">• Identical: Same variance σ² for all i</text>
    <text x="20" y="105" class="small-text">• Normal: Gaussian distribution</text>
  </g>
  
  <!-- Visual representation -->
  <g transform="translate(100, 220)">
    <text x="200" y="0" text-anchor="middle" class="label-text">Visual Representation: Y = θ₀ + θ₁X + W</text>
    
    <!-- Coordinate system -->
    <g transform="translate(50, 30)">
      <!-- Axes -->
      <line x1="0" y1="150" x2="300" y2="150" class="axis-line"/>
      <line x1="0" y1="0" x2="0" y2="150" class="axis-line"/>
      
      <!-- True line -->
      <line x1="20" y1="130" x2="280" y2="30" class="true-line"/>
      
      <!-- Data points with noise -->
      <circle cx="50" cy="115" r="3" class="data-point"/>
      <circle cx="80" cy="105" r="3" class="data-point"/>
      <circle cx="110" cy="85" r="3" class="data-point"/>
      <circle cx="140" cy="75" r="3" class="data-point"/>
      <circle cx="170" cy="65" r="3" class="data-point"/>
      <circle cx="200" cy="55" r="3" class="data-point"/>
      <circle cx="230" cy="45" r="3" class="data-point"/>
      <circle cx="260" cy="35" r="3" class="data-point"/>
      
      <!-- Noise arrows -->
      <line x1="50" y1="115" x2="50" y2="110" class="noise-line"/>
      <line x1="80" y1="105" x2="80" y2="95" class="noise-line"/>
      <line x1="110" y1="85" x2="110" y2="80" class="noise-line"/>
      <line x1="140" y1="75" x2="140" y2="70" class="noise-line"/>
      <line x1="170" y1="65" x2="170" y2="60" class="noise-line"/>
      <line x1="200" y1="55" x2="200" y2="50" class="noise-line"/>
      <line x1="230" y1="45" x2="230" y2="40" class="noise-line"/>
      <line x1="260" y1="35" x2="260" y2="40" class="noise-line"/>
      
      <!-- Labels -->
      <text x="150" y="170" text-anchor="middle" class="small-text">X</text>
      <text x="-20" y="75" text-anchor="middle" class="small-text" transform="rotate(-90, -20, 75)">Y</text>
      
      <!-- Legend -->
      <line x1="320" y1="20" x2="340" y2="20" class="true-line"/>
      <text x="345" y="24" class="small-text">θ₀ + θ₁X</text>
      
      <circle cx="330" cy="40" r="3" class="data-point"/>
      <text x="345" y="44" class="small-text">Observed Y</text>
      
      <line x1="320" y1="55" x2="340" y2="55" class="noise-line"/>
      <text x="345" y="59" class="small-text">Noise W</text>
    </g>
  </g>
  
  <!-- Likelihood Function -->
  <g transform="translate(50, 430)">
    <rect x="0" y="0" width="350" height="140" class="likelihood-box"/>
    <text x="175" y="25" text-anchor="middle" class="subtitle-text" fill="#721c24">Likelihood Function</text>
    
    <text x="20" y="50" class="equation-text" fill="#721c24">L(θ₀, θ₁) = ∏ᵢ₌₁ⁿ P(Yᵢ | Xᵢ, θ₀, θ₁)</text>
    
    <text x="20" y="75" class="small-text">Probability of observing data given parameters</text>
    
    <text x="20" y="100" class="equation-text" fill="#721c24">P(Yᵢ | Xᵢ, θ) = (1/√(2πσ²)) exp{-(Yᵢ - θ₀ - θ₁Xᵢ)²/(2σ²)}</text>
    
    <text x="20" y="125" class="small-text">Normal density with mean θ₀ + θ₁Xᵢ and variance σ²</text>
  </g>
  
  <!-- MLE Principle -->
  <g transform="translate(450, 430)">
    <rect x="0" y="0" width="300" height="140" class="result-box"/>
    <text x="150" y="25" text-anchor="middle" class="subtitle-text" fill="#0c5460">MLE Principle</text>
    
    <text x="20" y="50" class="equation-text" fill="#0c5460">θ̂ = argmax L(θ₀, θ₁)</text>
    <text x="150" y="50" text-anchor="middle" class="small-text">θ</text>
    
    <text x="20" y="75" class="small-text">Find parameters that maximize</text>
    <text x="20" y="90" class="small-text">the probability of observed data</text>
    
    <text x="20" y="115" class="small-text">"Which θ makes our data most likely?"</text>
  </g>
  
  <!-- Mathematical equivalence -->
  <g transform="translate(200, 600)">
    <rect x="0" y="0" width="400" height="80" fill="#f8f9fa" stroke="#6c757d" stroke-width="2" rx="8"/>
    <text x="200" y="25" text-anchor="middle" class="subtitle-text">Mathematical Equivalence</text>
    
    <text x="200" y="50" text-anchor="middle" class="equation-text">max L(θ) ≡ min Σᵢ(Yᵢ - θ₀ - θ₁Xᵢ)²</text>
    
    <text x="200" y="70" text-anchor="middle" class="small-text">MLE leads to least squares optimization</text>
  </g>
  
  <!-- Arrows showing flow -->
  <g transform="translate(225, 190)">
    <path d="M 0 0 L 0 30 L -5 25 M 0 30 L 5 25" class="arrow"/>
  </g>
  
  <g transform="translate(225, 380)">
    <path d="M 0 0 L 0 30 L -5 25 M 0 30 L 5 25" class="arrow"/>
  </g>
  
  <g transform="translate(400, 570)">
    <path d="M 0 0 L 0 30 L -5 25 M 0 30 L 5 25" class="arrow"/>
  </g>
</svg>