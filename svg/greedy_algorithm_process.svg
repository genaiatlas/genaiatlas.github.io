<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="900" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="600" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Greedy Algorithm for k-Node Selection
  </text>
  
  <!-- Iteration 1 -->
  <g id="iteration1">
    <rect x="50" y="80" width="320" height="220" fill="#ffffff" stroke="#3498db" stroke-width="3" rx="10"/>
    <text x="210" y="110" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Iteration 1: A = ∅
    </text>
    
    <!-- Network -->
    <g id="network1">
      <circle cx="120" cy="170" r="18" fill="#ecf0f1" stroke="#95a5a6" stroke-width="2"/>
      <text x="120" y="176" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">5.2</text>
      
      <circle cx="210" cy="150" r="18" fill="#e74c3c" stroke="#c0392b" stroke-width="3"/>
      <text x="210" y="156" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff">8.5</text>
      
      <circle cx="300" cy="170" r="18" fill="#ecf0f1" stroke="#95a5a6" stroke-width="2"/>
      <text x="300" y="176" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">4.1</text>
      
      <circle cx="160" cy="240" r="18" fill="#ecf0f1" stroke="#95a5a6" stroke-width="2"/>
      <text x="160" y="246" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">6.3</text>
      
      <circle cx="260" cy="240" r="18" fill="#ecf0f1" stroke="#95a5a6" stroke-width="2"/>
      <text x="260" y="246" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">5.8</text>
      
      <!-- Edges -->
      <line x1="120" y1="170" x2="200" y2="155" stroke="#95a5a6" stroke-width="1.5"/>
      <line x1="210" y1="150" x2="290" y2="165" stroke="#95a5a6" stroke-width="1.5"/>
      <line x1="120" y1="170" x2="155" y2="230" stroke="#95a5a6" stroke-width="1.5"/>
      <line x1="160" y1="240" x2="250" y2="240" stroke="#95a5a6" stroke-width="1.5"/>
      <line x1="260" y1="240" x2="295" y2="180" stroke="#95a5a6" stroke-width="1.5"/>
    </g>
    
    <text x="210" y="280" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#27ae60">
      Select v₁ (highest influence: 8.5)
    </text>
  </g>
  
  <!-- Arrow -->
  <line x1="380" y1="190" x2="430" y2="190" stroke="#2c3e50" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Iteration 2 -->
  <g id="iteration2">
    <rect x="440" y="80" width="320" height="220" fill="#ffffff" stroke="#3498db" stroke-width="3" rx="10"/>
    <text x="600" y="110" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Iteration 2: A = {v₁}
    </text>
    
    <!-- Network -->
    <g id="network2">
      <circle cx="510" cy="170" r="18" fill="#ecf0f1" stroke="#95a5a6" stroke-width="2"/>
      <text x="510" y="176" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">2.1</text>
      
      <circle cx="600" cy="150" r="18" fill="#e74c3c" stroke="#c0392b" stroke-width="3"/>
      <text x="600" y="156" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff">v₁</text>
      
      <circle cx="690" cy="170" r="18" fill="#ecf0f1" stroke="#95a5a6" stroke-width="2"/>
      <text x="690" y="176" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">1.8</text>
      
      <circle cx="550" cy="240" r="18" fill="#27ae60" stroke="#229954" stroke-width="3"/>
      <text x="550" y="246" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff">3.2</text>
      
      <circle cx="650" cy="240" r="18" fill="#ecf0f1" stroke="#95a5a6" stroke-width="2"/>
      <text x="650" y="246" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">2.5</text>
      
      <!-- Edges -->
      <line x1="510" y1="170" x2="590" y2="155" stroke="#95a5a6" stroke-width="1.5"/>
      <line x1="600" y1="150" x2="680" y2="165" stroke="#95a5a6" stroke-width="1.5"/>
      <line x1="510" y1="170" x2="545" y2="230" stroke="#95a5a6" stroke-width="1.5"/>
      <line x1="550" y1="240" x2="640" y2="240" stroke="#95a5a6" stroke-width="1.5"/>
      <line x1="650" y1="240" x2="685" y2="180" stroke="#95a5a6" stroke-width="1.5"/>
    </g>
    
    <text x="600" y="280" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#27ae60">
      Select v₂ (max marginal gain: 3.2)
    </text>
  </g>
  
  <!-- Arrow -->
  <line x1="770" y1="190" x2="820" y2="190" stroke="#2c3e50" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Iteration 3 -->
  <g id="iteration3">
    <rect x="830" y="80" width="320" height="220" fill="#ffffff" stroke="#3498db" stroke-width="3" rx="10"/>
    <text x="990" y="110" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Iteration 3: A = {v₁, v₂}
    </text>
    
    <!-- Network -->
    <g id="network3">
      <circle cx="900" cy="170" r="18" fill="#27ae60" stroke="#229954" stroke-width="3"/>
      <text x="900" y="176" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff">1.5</text>
      
      <circle cx="990" cy="150" r="18" fill="#e74c3c" stroke="#c0392b" stroke-width="3"/>
      <text x="990" y="156" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff">v₁</text>
      
      <circle cx="1080" cy="170" r="18" fill="#ecf0f1" stroke="#95a5a6" stroke-width="2"/>
      <text x="1080" y="176" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">0.9</text>
      
      <circle cx="940" cy="240" r="18" fill="#27ae60" stroke="#229954" stroke-width="3"/>
      <text x="940" y="246" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff">v₂</text>
      
      <circle cx="1040" cy="240" r="18" fill="#ecf0f1" stroke="#95a5a6" stroke-width="2"/>
      <text x="1040" y="246" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">1.2</text>
      
      <!-- Edges -->
      <line x1="900" y1="170" x2="980" y2="155" stroke="#95a5a6" stroke-width="1.5"/>
      <line x1="990" y1="150" x2="1070" y2="165" stroke="#95a5a6" stroke-width="1.5"/>
      <line x1="900" y1="170" x2="935" y2="230" stroke="#95a5a6" stroke-width="1.5"/>
      <line x1="940" y1="240" x2="1030" y2="240" stroke="#95a5a6" stroke-width="1.5"/>
      <line x1="1040" y1="240" x2="1075" y2="180" stroke="#95a5a6" stroke-width="1.5"/>
    </g>
    
    <text x="990" y="280" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#27ae60">
      Select v₃ (max marginal gain: 1.5)
    </text>
  </g>
  
  <!-- Algorithm Flow -->
  <g id="algorithm">
    <rect x="100" y="350" width="1000" height="500" fill="#ffffff" stroke="#e67e22" stroke-width="3" rx="10"/>
    <text x="600" y="390" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Greedy Algorithm Steps
    </text>
    
    <!-- Step boxes -->
    <rect x="150" y="420" width="900" height="70" fill="#3498db" stroke="#2980b9" stroke-width="2" rx="8"/>
    <text x="600" y="450" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">
      Step 1: Initialize A = ∅ (empty set)
    </text>
    <text x="600" y="475" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#ffffff">
      Start with no nodes selected
    </text>
    
    <rect x="150" y="510" width="900" height="90" fill="#27ae60" stroke="#229954" stroke-width="2" rx="8"/>
    <text x="600" y="540" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">
      Step 2: For iteration i = 1 to k
    </text>
    <text x="600" y="565" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#ffffff">
      2a. For each node v not in A, estimate influence of A ∪ {v}
    </text>
    <text x="600" y="587" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#ffffff">
      2b. Select node v* with maximum marginal gain: Δ(v|A) = σ(A ∪ {v}) - σ(A)
    </text>
    
    <rect x="150" y="620" width="900" height="70" fill="#e74c3c" stroke="#c0392b" stroke-width="2" rx="8"/>
    <text x="600" y="650" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">
      Step 3: Add v* to A
    </text>
    <text x="600" y="675" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#ffffff">
      Update selected set: A ← A ∪ {v*}
    </text>
    
    <rect x="150" y="710" width="900" height="70" fill="#9b59b6" stroke="#8e44ad" stroke-width="2" rx="8"/>
    <text x="600" y="740" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">
      Step 4: Repeat until |A| = k
    </text>
    <text x="600" y="765" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#ffffff">
      Continue until k nodes are selected
    </text>
    
    <!-- Key insight box -->
    <rect x="200" y="800" width="800" height="35" fill="#f39c12" rx="5"/>
    <text x="600" y="823" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">
      Key: Select node with maximum marginal gain at each step (greedy choice)
    </text>
  </g>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#2c3e50"/>
    </marker>
  </defs>
  
  <!-- Legend -->
  <g id="legend">
    <text x="210" y="325" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">
      <tspan font-weight="bold">Legend:</tspan>
    </text>
    <circle cx="310" cy="320" r="10" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
    <text x="330" y="325" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">
      Seed node from previous iteration
    </text>
    
    <circle cx="600" cy="320" r="10" fill="#27ae60" stroke="#229954" stroke-width="2"/>
    <text x="620" y="325" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">
      Newly selected node (best marginal gain)
    </text>
    
    <circle cx="920" cy="320" r="10" fill="#ecf0f1" stroke="#95a5a6" stroke-width="2"/>
    <text x="940" y="325" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">
      Candidate node (not yet selected)
    </text>
  </g>
</svg>