<svg viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1400" height="900" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="700" y="60" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#1e293b" text-anchor="middle">Two Core Principles</text>
  <text x="700" y="95" font-family="Arial, sans-serif" font-size="18" fill="#64748b" text-anchor="middle">Foundation for Effective AI-Assisted Development</text>
  
  <!-- Principle 1: Specificity -->
  <g transform="translate(100, 150)">
    <rect width="550" height="650" rx="15" fill="#dbeafe" stroke="#3b82f6" stroke-width="4"/>
    
    <!-- Icon and number -->
    <circle cx="275" cy="60" r="40" fill="#3b82f6"/>
    <text x="275" y="75" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="white" text-anchor="middle">1</text>
    
    <!-- Title -->
    <text x="275" y="140" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#1e40af" text-anchor="middle">The Value of Specificity</text>
    <text x="275" y="175" font-family="Arial, sans-serif" font-size="22" fill="#1e40af" text-anchor="middle">&quot;Use More Words&quot;</text>
    
    <!-- Key insight box -->
    <rect x="40" y="200" width="470" height="60" rx="8" fill="#93c5fd" opacity="0.3"/>
    <text x="275" y="230" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Vague prompts yield average guesses.</text>
    <text x="275" y="250" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Be explicit about everything.</text>
    
    <!-- Checklist -->
    <g transform="translate(50, 290)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">Specificity Checklist:</text>
      
      <rect x="0" y="20" width="450" height="50" rx="6" fill="white" stroke="#3b82f6" stroke-width="2"/>
      <text x="40" y="40" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e40af">What are we building, exactly?</text>
      <text x="40" y="58" font-family="Arial, sans-serif" font-size="12" fill="#475569">Clear description of features or changes</text>
      
      <rect x="0" y="85" width="450" height="50" rx="6" fill="white" stroke="#3b82f6" stroke-width="2"/>
      <text x="40" y="105" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e40af">What does &quot;good&quot; look like?</text>
      <text x="40" y="123" font-family="Arial, sans-serif" font-size="12" fill="#475569">Explicit acceptance criteria and success measures</text>
      
      <rect x="0" y="150" width="450" height="50" rx="6" fill="white" stroke="#3b82f6" stroke-width="2"/>
      <text x="40" y="170" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e40af">What must not change?</text>
      <text x="40" y="188" font-family="Arial, sans-serif" font-size="12" fill="#475569">Constraints, boundaries, and non-goals</text>
      
      <rect x="0" y="215" width="450" height="50" rx="6" fill="white" stroke="#3b82f6" stroke-width="2"/>
      <text x="40" y="235" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e40af">Style, conventions, integration points?</text>
      <text x="40" y="253" font-family="Arial, sans-serif" font-size="12" fill="#475569">Project standards and patterns to follow</text>
      
      <!-- Checkmark icons -->
      <circle cx="15" cy="45" r="8" fill="#22c55e"/>
      <path d="M 11 45 L 14 48 L 19 41" stroke="white" stroke-width="2" fill="none"/>
      
      <circle cx="15" cy="110" r="8" fill="#22c55e"/>
      <path d="M 11 110 L 14 113 L 19 106" stroke="white" stroke-width="2" fill="none"/>
      
      <circle cx="15" cy="175" r="8" fill="#22c55e"/>
      <path d="M 11 175 L 14 178 L 19 171" stroke="white" stroke-width="2" fill="none"/>
      
      <circle cx="15" cy="240" r="8" fill="#22c55e"/>
      <path d="M 11 240 L 14 243 L 19 236" stroke="white" stroke-width="2" fill="none"/>
    </g>
    
    <!-- Bottom note -->
    <rect x="40" y="580" width="470" height="50" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="275" y="602" font-family="Arial, sans-serif" font-size="13" fill="#78350f" text-anchor="middle">Specificity is not verbosity; it is clarity.</text>
    <text x="275" y="620" font-family="Arial, sans-serif" font-size="13" fill="#78350f" text-anchor="middle">Define the target and edges precisely.</text>
  </g>
  
  <!-- Principle 2: Context -->
  <g transform="translate(750, 150)">
    <rect width="550" height="650" rx="15" fill="#fce7f3" stroke="#ec4899" stroke-width="4"/>
    
    <!-- Icon and number -->
    <circle cx="275" cy="60" r="40" fill="#ec4899"/>
    <text x="275" y="75" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="white" text-anchor="middle">2</text>
    
    <!-- Title -->
    <text x="275" y="140" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#be185d" text-anchor="middle">Curating Context</text>
    <text x="275" y="175" font-family="Arial, sans-serif" font-size="22" fill="#be185d" text-anchor="middle">&quot;Prepare the Foundation&quot;</text>
    
    <!-- Key insight box -->
    <rect x="40" y="200" width="470" height="60" rx="8" fill="#f9a8d4" opacity="0.3"/>
    <text x="275" y="230" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#831843" text-anchor="middle">Generic models don&apos;t know your project.</text>
    <text x="275" y="250" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#831843" text-anchor="middle">Provide context to make them your teammate.</text>
    
    <!-- Context categories -->
    <g transform="translate(50, 290)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">Essential Context:</text>
      
      <rect x="0" y="20" width="450" height="55" rx="6" fill="white" stroke="#ec4899" stroke-width="2"/>
      <text x="40" y="40" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#be185d">Project Reality</text>
      <text x="40" y="57" font-family="Arial, sans-serif" font-size="12" fill="#475569">Structure, naming, coding style,</text>
      <text x="40" y="72" font-family="Arial, sans-serif" font-size="12" fill="#475569">technology stack</text>
      
      <rect x="0" y="90" width="450" height="55" rx="6" fill="white" stroke="#ec4899" stroke-width="2"/>
      <text x="40" y="110" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#be185d">Process &amp; Workflow</text>
      <text x="40" y="127" font-family="Arial, sans-serif" font-size="12" fill="#475569">Branching model, PR requirements,</text>
      <text x="40" y="142" font-family="Arial, sans-serif" font-size="12" fill="#475569">release and deployment steps</text>
      
      <rect x="0" y="160" width="450" height="55" rx="6" fill="white" stroke="#ec4899" stroke-width="2"/>
      <text x="40" y="180" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#be185d">References &amp; Documentation</text>
      <text x="40" y="197" font-family="Arial, sans-serif" font-size="12" fill="#475569">Library docs, APIs, goals,</text>
      <text x="40" y="212" font-family="Arial, sans-serif" font-size="12" fill="#475569">acceptance criteria</text>
      
      <rect x="0" y="230" width="450" height="55" rx="6" fill="white" stroke="#ec4899" stroke-width="2"/>
      <text x="40" y="250" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#be185d">Delivery Mechanisms</text>
      <text x="40" y="267" font-family="Arial, sans-serif" font-size="12" fill="#475569">Rule files (AGENTS.md, .ruler),</text>
      <text x="40" y="282" font-family="Arial, sans-serif" font-size="12" fill="#475569">MCP servers, CLI utilities</text>
      
      <!-- Icons -->
      <circle cx="15" cy="50" r="8" fill="#8b5cf6"/>
      <text x="15" y="54" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">📁</text>
      
      <circle cx="15" cy="120" r="8" fill="#8b5cf6"/>
      <text x="15" y="124" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">⚙️</text>
      
      <circle cx="15" cy="190" r="8" fill="#8b5cf6"/>
      <text x="15" y="194" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">📚</text>
      
      <circle cx="15" cy="260" r="8" fill="#8b5cf6"/>
      <text x="15" y="264" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">🔧</text>
    </g>
    
    <!-- Bottom note -->
    <rect x="40" y="580" width="470" height="50" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="275" y="602" font-family="Arial, sans-serif" font-size="13" fill="#78350f" text-anchor="middle">Treat context as part of the codebase.</text>
    <text x="275" y="620" font-family="Arial, sans-serif" font-size="13" fill="#78350f" text-anchor="middle">Keep it current as the project evolves.</text>
  </g>
  
  <!-- Bottom banner -->
  <g transform="translate(200, 840)">
    <rect width="1000" height="50" rx="10" fill="#6366f1" opacity="0.9"/>
    <text x="500" y="32" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">Specificity + Context = Reliable, High-Quality AI Assistance</text>
  </g>
</svg>