<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="675" fill="#f8fafc"/>
  
  <!-- Fast Track Ribbon -->
  <polygon points="1050,0 1200,0 1200,80 1050,60" fill="#3b82f6"/>
  <text x="1125" y="35" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">FAST TRACK</text>
  
  <!-- Title -->
  <text x="600" y="80" text-anchor="middle" fill="#1e293b" font-family="Arial, sans-serif" font-size="36" font-weight="bold">Object-Oriented Programming</text>
  
  <!-- Class Definition -->
  <rect x="60" y="130" width="270" height="180" fill="#f0f9ff" stroke="#0284c7" stroke-width="2" rx="8"/>
  <text x="195" y="160" text-anchor="middle" fill="#0284c7" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Class Definition</text>
  <rect x="100" y="180" width="190" height="120" fill="#ffffff" stroke="#d1d5db" stroke-width="1" rx="4"/>
  <text x="110" y="200" fill="#374151" font-family="Courier, monospace" font-size="12">class Car:</text>
  <text x="120" y="220" fill="#374151" font-family="Courier, monospace" font-size="12">def __init__(self, brand):</text>
  <text x="130" y="240" fill="#374151" font-family="Courier, monospace" font-size="12">self.brand = brand</text>
  <text x="120" y="270" fill="#374151" font-family="Courier, monospace" font-size="12">def start(self):</text>
  <text x="130" y="290" fill="#374151" font-family="Courier, monospace" font-size="12">return "Starting..."</text>
  
  <!-- Object Creation -->
  <rect x="350" y="130" width="270" height="180" fill="#ecfdf5" stroke="#059669" stroke-width="2" rx="8"/>
  <text x="485" y="160" text-anchor="middle" fill="#059669" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Object Creation</text>
  <rect x="390" y="180" width="190" height="120" fill="#ffffff" stroke="#d1d5db" stroke-width="1" rx="4"/>
  <text x="400" y="200" fill="#374151" font-family="Courier, monospace" font-size="12"># Create objects</text>
  <text x="400" y="220" fill="#374151" font-family="Courier, monospace" font-size="12">my_car = Car("Toyota")</text>
  <text x="400" y="250" fill="#374151" font-family="Courier, monospace" font-size="12"># Use methods</text>
  <text x="400" y="270" fill="#374151" font-family="Courier, monospace" font-size="12">my_car.start()</text>
  <text x="400" y="290" fill="#374151" font-family="Courier, monospace" font-size="12">print(my_car.brand)</text>
  
  <!-- Inheritance -->
  <rect x="640" y="130" width="270" height="180" fill="#fef3c7" stroke="#d97706" stroke-width="2" rx="8"/>
  <text x="775" y="160" text-anchor="middle" fill="#d97706" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Inheritance</text>
  <rect x="680" y="180" width="190" height="120" fill="#ffffff" stroke="#d1d5db" stroke-width="1" rx="4"/>
  <text x="690" y="200" fill="#374151" font-family="Courier, monospace" font-size="12">class ElectricCar(Car):</text>
  <text x="700" y="220" fill="#374151" font-family="Courier, monospace" font-size="12">def __init__(self, brand):</text>
  <text x="710" y="240" fill="#374151" font-family="Courier, monospace" font-size="12">super().__init__(brand)</text>
  <text x="700" y="270" fill="#374151" font-family="Courier, monospace" font-size="12">def charge(self):</text>
  <text x="710" y="290" fill="#374151" font-family="Courier, monospace" font-size="12">return "Charging..."</text>
  
  <!-- Encapsulation -->
  <rect x="930" y="130" width="250" height="180" fill="#fce7f3" stroke="#db2777" stroke-width="2" rx="8"/>
  <text x="1055" y="160" text-anchor="middle" fill="#db2777" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Encapsulation</text>
  <rect x="960" y="180" width="190" height="120" fill="#ffffff" stroke="#d1d5db" stroke-width="1" rx="4"/>
  <text x="970" y="200" fill="#374151" font-family="Courier, monospace" font-size="11">class BankAccount:</text>
  <text x="980" y="220" fill="#374151" font-family="Courier, monospace" font-size="11">def __init__(self):</text>
  <text x="990" y="240" fill="#374151" font-family="Courier, monospace" font-size="11">self._balance = 0</text>
  <text x="980" y="270" fill="#374151" font-family="Courier, monospace" font-size="11">def deposit(self, amt):</text>
  <text x="990" y="290" fill="#374151" font-family="Courier, monospace" font-size="11">self._balance += amt</text>
  
  <!-- OOP Concepts Diagram -->
  <rect x="100" y="340" width="1000" height="280" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="12"/>
  <text x="600" y="375" text-anchor="middle" fill="#1e293b" font-family="Arial, sans-serif" font-size="24" font-weight="bold">Core OOP Concepts</text>
  
  <!-- Class -->
  <rect x="150" y="400" width="180" height="80" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="8"/>
  <text x="240" y="425" text-anchor="middle" fill="#1e40af" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Class</text>
  <text x="240" y="445" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">Blueprint/Template</text>
  <text x="240" y="465" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">Defines attributes &amp; methods</text>
  
  <!-- Object -->
  <rect x="350" y="400" width="180" height="80" fill="#dcfce7" stroke="#16a34a" stroke-width="2" rx="8"/>
  <text x="440" y="425" text-anchor="middle" fill="#15803d" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Object</text>
  <text x="440" y="445" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">Instance of a class</text>
  <text x="440" y="465" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">Has actual data &amp; behavior</text>
  
  <!-- Inheritance -->
  <rect x="550" y="400" width="180" height="80" fill="#fef3c7" stroke="#d97706" stroke-width="2" rx="8"/>
  <text x="640" y="425" text-anchor="middle" fill="#b45309" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Inheritance</text>
  <text x="640" y="445" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">Child inherits from parent</text>
  <text x="640" y="465" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">Code reuse &amp; specialization</text>
  
  <!-- Encapsulation -->
  <rect x="750" y="400" width="180" height="80" fill="#fce7f3" stroke="#db2777" stroke-width="2" rx="8"/>
  <text x="840" y="425" text-anchor="middle" fill="#be185d" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Encapsulation</text>
  <text x="840" y="445" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">Data &amp; methods together</text>
  <text x="840" y="465" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">Hide internal details</text>
  
  <!-- Arrows showing relationships -->
  <path d="M 330 440 L 350 440" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="340" y="435" text-anchor="middle" fill="#6b7280" font-family="Arial, sans-serif" font-size="10">creates</text>
  
  <!-- Key Benefits -->
  <text x="200" y="520" fill="#374151" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Why Use OOP?</text>
  
  <circle cx="150" cy="545" r="3" fill="#16a34a"/>
  <text x="165" y="550" fill="#374151" font-family="Arial, sans-serif" font-size="13">Organize complex code into manageable pieces</text>
  
  <circle cx="150" cy="565" r="3" fill="#16a34a"/>
  <text x="165" y="570" fill="#374151" font-family="Arial, sans-serif" font-size="13">Reuse code through inheritance and composition</text>
  
  <circle cx="500" cy="545" r="3" fill="#16a34a"/>
  <text x="515" y="550" fill="#374151" font-family="Arial, sans-serif" font-size="13">Model real-world concepts more naturally</text>
  
  <circle cx="500" cy="565" r="3" fill="#16a34a"/>
  <text x="515" y="570" fill="#374151" font-family="Arial, sans-serif" font-size="13">Easier to maintain and extend large programs</text>
  
  <!-- Common Methods -->
  <text x="200" y="600" fill="#374151" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Common Special Methods:</text>
  <text x="200" y="620" fill="#6b7280" font-family="Arial, sans-serif" font-size="12">__init__(self) - Constructor, __str__(self) - String representation, __len__(self) - Length</text>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <polygon points="0,0 0,6 9,3" fill="#374151"/>
    </marker>
  </defs>
</svg>