<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    Early Stopping: Training vs Validation Error
  </text>
  
  <!-- Graph area -->
  <rect x="100" y="80" width="500" height="350" fill="white" stroke="#34495e" stroke-width="2"/>
  
  <!-- Grid lines -->
  <g stroke="#ecf0f1" stroke-width="1" opacity="0.7">
    <!-- Horizontal grid lines -->
    <line x1="100" y1="130" x2="600" y2="130"/>
    <line x1="100" y1="180" x2="600" y2="180"/>
    <line x1="100" y1="230" x2="600" y2="230"/>
    <line x1="100" y1="280" x2="600" y2="280"/>
    <line x1="100" y1="330" x2="600" y2="330"/>
    <line x1="100" y1="380" x2="600" y2="380"/>
    
    <!-- Vertical grid lines -->
    <line x1="150" y1="80" x2="150" y2="430"/>
    <line x1="200" y1="80" x2="200" y2="430"/>
    <line x1="250" y1="80" x2="250" y2="430"/>
    <line x1="300" y1="80" x2="300" y2="430"/>
    <line x1="350" y1="80" x2="350" y2="430"/>
    <line x1="400" y1="80" x2="400" y2="430"/>
    <line x1="450" y1="80" x2="450" y2="430"/>
    <line x1="500" y1="80" x2="500" y2="430"/>
    <line x1="550" y1="80" x2="550" y2="430"/>
  </g>
  
  <!-- Training Error Curve -->
  <path d="M 110 350 
           C 130 340, 150 320, 170 300
           C 190 280, 210 260, 230 245
           C 250 235, 270 225, 290 220
           C 310 215, 330 212, 350 210
           C 370 208, 390 206, 410 205
           C 430 204, 450 203, 470 202
           C 490 201, 510 200, 530 199
           C 550 198, 570 197, 590 196"
        stroke="#3498db" stroke-width="3" fill="none"/>
  
  <!-- Validation Error Curve -->
  <path d="M 110 360
           C 130 345, 150 325, 170 310
           C 190 295, 210 280, 230 265
           C 250 250, 270 240, 290 235
           C 310 232, 330 230, 350 229
           C 370 230, 390 232, 410 235
           C 430 240, 450 246, 470 253
           C 490 261, 510 270, 530 280
           C 550 291, 570 303, 590 316"
        stroke="#e74c3c" stroke-width="3" fill="none"/>
  
  <!-- Early Stopping Line -->
  <line x1="350" y1="80" x2="350" y2="430" stroke="#f39c12" stroke-width="3" stroke-dasharray="8,4"/>
  
  <!-- Optimal Point Circle -->
  <circle cx="350" cy="229" r="8" fill="#f39c12" stroke="white" stroke-width="2"/>
  
  <!-- Legend -->
  <g id="legend" transform="translate(650, 150)">
    <rect width="140" height="120" rx="8" fill="white" stroke="#34495e" stroke-width="2"/>
    
    <!-- Training Error Legend -->
    <line x1="15" y1="25" x2="35" y2="25" stroke="#3498db" stroke-width="3"/>
    <text x="45" y="30" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Training Error</text>
    
    <!-- Validation Error Legend -->
    <line x1="15" y1="45" x2="35" y2="45" stroke="#e74c3c" stroke-width="3"/>
    <text x="45" y="50" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Validation Error</text>
    
    <!-- Early Stopping Legend -->
    <line x1="15" y1="65" x2="35" y2="65" stroke="#f39c12" stroke-width="3" stroke-dasharray="4,2"/>
    <text x="45" y="70" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Early Stopping</text>
    
    <!-- Optimal Point Legend -->
    <circle cx="25" cy="85" r="4" fill="#f39c12" stroke="white" stroke-width="1"/>
    <text x="45" y="90" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Optimal Point</text>
  </g>
  
  <!-- Axes Labels -->
  
  <!-- Y-axis label -->
  <text x="40" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50" transform="rotate(-90, 40, 260)">
    Error
  </text>
  
  <!-- X-axis label -->
  <text x="350" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">
    Training Epochs
  </text>
  
  <!-- Y-axis ticks and labels -->
  <g font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">
    <text x="90" y="85" text-anchor="end">1.0</text>
    <text x="90" y="135" text-anchor="end">0.8</text>
    <text x="90" y="185" text-anchor="end">0.6</text>
    <text x="90" y="235" text-anchor="end">0.4</text>
    <text x="90" y="285" text-anchor="end">0.3</text>
    <text x="90" y="335" text-anchor="end">0.2</text>
    <text x="90" y="385" text-anchor="end">0.1</text>
    <text x="90" y="435" text-anchor="end">0.0</text>
  </g>
  
  <!-- X-axis ticks and labels -->
  <g font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d" text-anchor="middle">
    <text x="100" y="450">0</text>
    <text x="150" y="450">10</text>
    <text x="200" y="450">20</text>
    <text x="250" y="450">30</text>
    <text x="300" y="450">40</text>
    <text x="350" y="450">50</text>
    <text x="400" y="450">60</text>
    <text x="450" y="450">70</text>
    <text x="500" y="450">80</text>
    <text x="550" y="450">90</text>
    <text x="600" y="450">100</text>
  </g>
  
  <!-- Annotation boxes -->
  
  <!-- Underfitting region -->
  <g id="underfitting" transform="translate(120, 100)">
    <rect width="80" height="50" rx="5" fill="#ffe6e6" stroke="#e74c3c" stroke-width="1" opacity="0.8"/>
    <text x="40" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#c0392b">
      Underfitting
    </text>
    <text x="40" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c">
      High Bias
    </text>
  </g>
  
  <!-- Sweet Spot region -->
  <g id="sweet-spot" transform="translate(300, 100)">
    <rect width="100" height="50" rx="5" fill="#e6ffe6" stroke="#27ae60" stroke-width="1" opacity="0.8"/>
    <text x="50" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#229954">
      Optimal Region
    </text>
    <text x="50" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#27ae60">
      Best Generalization
    </text>
  </g>
  
  <!-- Overfitting region -->
  <g id="overfitting" transform="translate(480, 100)">
    <rect width="80" height="50" rx="5" fill="#fff0e6" stroke="#f39c12" stroke-width="1" opacity="0.8"/>
    <text x="40" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#d35400">
      Overfitting
    </text>
    <text x="40" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#f39c12">
      High Variance
    </text>
  </g>
  
  <!-- Key Insights Box -->
  <g id="insights" transform="translate(100, 500)">
    <rect width="600" height="80" rx="8" fill="#f1f2f6" stroke="#57606f" stroke-width="1"/>
    
    <text x="20" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
      Key Insights:
    </text>
    
    <text x="20" y="40" font-family="Arial, sans-serif" font-size="12" fill="#34495e">
      • Training error continues to decrease throughout training
    </text>
    
    <text x="20" y="55" font-family="Arial, sans-serif" font-size="12" fill="#34495e">
      • Validation error initially decreases, then increases when overfitting begins
    </text>
    
    <text x="20" y="70" font-family="Arial, sans-serif" font-size="12" fill="#34495e">
      • Early stopping prevents overfitting by halting training at the optimal point
    </text>
  </g>
</svg>