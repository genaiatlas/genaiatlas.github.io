<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="900" height="500" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="450" y="30" font-size="22" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Configuration Model: Stub Matching Process
  </text>
  
  <!-- Step 1: Nodes with Stubs -->
  <g id="step1">
    <text x="150" y="70" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Step 1: Assign Stubs
    </text>
    
    <!-- Node 1: degree 2 -->
    <circle cx="80" cy="150" r="20" fill="#3498db" stroke="#2c3e50" stroke-width="2"/>
    <text x="80" y="155" font-size="12" font-weight="bold" text-anchor="middle" fill="white">1</text>
    <line x1="100" y1="145" x2="125" y2="140" stroke="#e74c3c" stroke-width="3"/>
    <line x1="100" y1="155" x2="125" y2="160" stroke="#e74c3c" stroke-width="3"/>
    <circle cx="127" cy="140" r="4" fill="#e74c3c"/>
    <circle cx="127" cy="160" r="4" fill="#e74c3c"/>
    
    <!-- Node 2: degree 3 -->
    <circle cx="80" cy="210" r="20" fill="#3498db" stroke="#2c3e50" stroke-width="2"/>
    <text x="80" y="215" font-size="12" font-weight="bold" text-anchor="middle" fill="white">2</text>
    <line x1="100" y1="200" x2="125" y2="195" stroke="#e74c3c" stroke-width="3"/>
    <line x1="100" y1="210" x2="125" y2="210" stroke="#e74c3c" stroke-width="3"/>
    <line x1="100" y1="220" x2="125" y2="225" stroke="#e74c3c" stroke-width="3"/>
    <circle cx="127" cy="195" r="4" fill="#e74c3c"/>
    <circle cx="127" cy="210" r="4" fill="#e74c3c"/>
    <circle cx="127" cy="225" r="4" fill="#e74c3c"/>
    
    <!-- Node 3: degree 5 (hub) -->
    <circle cx="200" cy="180" r="25" fill="#9b59b6" stroke="#2c3e50" stroke-width="2"/>
    <text x="200" y="186" font-size="12" font-weight="bold" text-anchor="middle" fill="white">3</text>
    <line x1="225" y1="170" x2="250" y2="165" stroke="#e74c3c" stroke-width="3"/>
    <line x1="225" y1="175" x2="250" y2="175" stroke="#e74c3c" stroke-width="3"/>
    <line x1="225" y1="180" x2="250" y2="180" stroke="#e74c3c" stroke-width="3"/>
    <line x1="225" y1="185" x2="250" y2="185" stroke="#e74c3c" stroke-width="3"/>
    <line x1="225" y1="190" x2="250" y2="195" stroke="#e74c3c" stroke-width="3"/>
    <circle cx="252" cy="165" r="4" fill="#e74c3c"/>
    <circle cx="252" cy="175" r="4" fill="#e74c3c"/>
    <circle cx="252" cy="180" r="4" fill="#e74c3c"/>
    <circle cx="252" cy="185" r="4" fill="#e74c3c"/>
    <circle cx="252" cy="195" r="4" fill="#e74c3c"/>
    
    <!-- Node 4: degree 2 -->
    <circle cx="80" cy="270" r="20" fill="#3498db" stroke="#2c3e50" stroke-width="2"/>
    <text x="80" y="275" font-size="12" font-weight="bold" text-anchor="middle" fill="white">4</text>
    <line x1="100" y1="265" x2="125" y2="260" stroke="#e74c3c" stroke-width="3"/>
    <line x1="100" y1="275" x2="125" y2="280" stroke="#e74c3c" stroke-width="3"/>
    <circle cx="127" cy="260" r="4" fill="#e74c3c"/>
    <circle cx="127" cy="280" r="4" fill="#e74c3c"/>
    
    <!-- Annotation -->
    <text x="150" y="310" font-size="11" text-anchor="middle" fill="#7f8c8d" font-style="italic">
      Each node has d_i stubs
    </text>
    <text x="150" y="325" font-size="11" text-anchor="middle" fill="#7f8c8d" font-style="italic">
      (half-edges)
    </text>
  </g>
  
  <!-- Arrow -->
  <g id="arrow1">
    <line x1="290" y1="220" x2="330" y2="220" stroke="#34495e" stroke-width="3" marker-end="url(#arrowhead)"/>
    <text x="310" y="210" font-size="13" text-anchor="middle" fill="#34495e" font-weight="bold">Match</text>
  </g>
  
  <!-- Step 2: Random Matching -->
  <g id="step2">
    <text x="450" y="70" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Step 2: Random Matching
    </text>
    
    <!-- Nodes -->
    <circle cx="380" cy="150" r="20" fill="#3498db" stroke="#2c3e50" stroke-width="2"/>
    <text x="380" y="155" font-size="12" font-weight="bold" text-anchor="middle" fill="white">1</text>
    
    <circle cx="380" cy="210" r="20" fill="#3498db" stroke="#2c3e50" stroke-width="2"/>
    <text x="380" y="215" font-size="12" font-weight="bold" text-anchor="middle" fill="white">2</text>
    
    <circle cx="520" cy="180" r="25" fill="#9b59b6" stroke="#2c3e50" stroke-width="2"/>
    <text x="520" y="186" font-size="12" font-weight="bold" text-anchor="middle" fill="white">3</text>
    
    <circle cx="380" cy="270" r="20" fill="#3498db" stroke="#2c3e50" stroke-width="2"/>
    <text x="380" y="275" font-size="12" font-weight="bold" text-anchor="middle" fill="white">4</text>
    
    <!-- Edges from matching -->
    <line x1="400" y1="150" x2="495" y2="170" stroke="#27ae60" stroke-width="2.5"/>
    <line x1="400" y1="210" x2="495" y2="185" stroke="#27ae60" stroke-width="2.5"/>
    <line x1="380" y1="230" x2="380" y2="250" stroke="#27ae60" stroke-width="2.5"/>
    <line x1="500" y1="195" x2="390" y2="260" stroke="#27ae60" stroke-width="2.5"/>
    <line x1="395" y1="156" x2="365" y2="204" stroke="#27ae60" stroke-width="2.5"/>
    <line x1="520" y1="155" x2="520" y2="135" stroke="#27ae60" stroke-width="2.5"/>
    <circle cx="520" cy="133" r="3" fill="#27ae60"/>
    
    <!-- Self-loop indication -->
    <path d="M 535,165 Q 555,165 555,180 Q 555,195 535,195" 
          fill="none" stroke="#e67e22" stroke-width="2.5" stroke-dasharray="4,2"/>
    <text x="565" y="180" font-size="10" fill="#e67e22" font-weight="bold">Self-loop</text>
    
    <!-- Annotation -->
    <text x="450" y="310" font-size="11" text-anchor="middle" fill="#7f8c8d" font-style="italic">
      Pair stubs uniformly at random
    </text>
  </g>
  
  <!-- Arrow -->
  <g id="arrow2">
    <line x1="590" y1="220" x2="630" y2="220" stroke="#34495e" stroke-width="3" marker-end="url(#arrowhead)"/>
    <text x="610" y="210" font-size="13" text-anchor="middle" fill="#34495e" font-weight="bold">Result</text>
  </g>
  
  <!-- Step 3: Final Network -->
  <g id="step3">
    <text x="750" y="70" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Step 3: Final Network
    </text>
    
    <!-- Nodes -->
    <circle cx="680" cy="150" r="20" fill="#3498db" stroke="#2c3e50" stroke-width="2"/>
    <text x="680" y="155" font-size="12" font-weight="bold" text-anchor="middle" fill="white">1</text>
    
    <circle cx="680" cy="210" r="20" fill="#3498db" stroke="#2c3e50" stroke-width="2"/>
    <text x="680" y="215" font-size="12" font-weight="bold" text-anchor="middle" fill="white">2</text>
    
    <circle cx="820" cy="180" r="25" fill="#9b59b6" stroke="#2c3e50" stroke-width="2"/>
    <text x="820" y="186" font-size="12" font-weight="bold" text-anchor="middle" fill="white">3</text>
    
    <circle cx="680" cy="270" r="20" fill="#3498db" stroke="#2c3e50" stroke-width="2"/>
    <text x="680" y="275" font-size="12" font-weight="bold" text-anchor="middle" fill="white">4</text>
    
    <!-- Clean edges -->
    <line x1="700" y1="150" x2="795" y2="170" stroke="#2c3e50" stroke-width="2"/>
    <line x1="700" y1="210" x2="795" y2="185" stroke="#2c3e50" stroke-width="2"/>
    <line x1="680" y1="230" x2="680" y2="250" stroke="#2c3e50" stroke-width="2"/>
    <line x1="800" y1="195" x2="690" y2="260" stroke="#2c3e50" stroke-width="2"/>
    <line x1="695" y1="156" x2="665" y2="204" stroke="#2c3e50" stroke-width="2"/>
    
    <!-- Degree labels -->
    <text x="650" y="150" font-size="9" fill="#7f8c8d">d=2</text>
    <text x="650" y="210" font-size="9" fill="#7f8c8d">d=3</text>
    <text x="860" y="180" font-size="9" fill="#7f8c8d">d=5</text>
    <text x="650" y="270" font-size="9" fill="#7f8c8d">d=2</text>
    
    <!-- Annotation -->
    <text x="750" y="310" font-size="11" text-anchor="middle" fill="#27ae60" font-weight="bold">
      ✓ Preserves degree sequence
    </text>
  </g>
  
  <!-- Bottom Legend -->
  <g id="legend">
    <rect x="50" y="360" width="800" height="120" fill="#ecf0f1" stroke="#95a5a6" stroke-width="1" rx="8"/>
    
    <text x="450" y="385" font-size="15" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Configuration Model Properties
    </text>
    
    <text x="100" y="410" font-size="12" fill="#2c3e50">
      <tspan font-weight="bold">Advantages:</tspan> Can create any degree distribution (including power-law)
    </text>
    <text x="100" y="430" font-size="12" fill="#2c3e50">
      <tspan font-weight="bold">Limitations:</tspan> Low clustering, may contain self-loops and multi-edges
    </text>
    <text x="100" y="450" font-size="12" fill="#2c3e50">
      <tspan font-weight="bold">Solution:</tspan> For large networks, self-loops/multi-edges are rare and can be removed
    </text>
    <text x="100" y="470" font-size="12" fill="#7f8c8d" font-style="italic">
      Note: Nodes with high degree (like Node 3) become hubs with many connections
    </text>
  </g>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#34495e"/>
    </marker>
  </defs>
</svg>