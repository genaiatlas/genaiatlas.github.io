<svg viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1400" height="900" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="700" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Hybrid Indexing Architecture
  </text>
  <text x="700" y="70" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#495057">
    Combining Multiple Retrieval Methods for Optimal Results
  </text>
  
  <!-- Query Input -->
  <rect x="600" y="110" width="200" height="60" rx="8" fill="#4c6ef5" stroke="#364fc7" stroke-width="2"/>
  <text x="700" y="145" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">
    User Query
  </text>
  
  <!-- Arrow down from query -->
  <line x1="700" y1="170" x2="700" y2="220" stroke="#495057" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Three parallel retrieval paths -->
  
  <!-- Path 1: BM25 Keyword Search -->
  <g id="bm25-path">
    <rect x="80" y="220" width="300" height="280" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="3"/>
    <text x="230" y="255" font-family="Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#e03131">
      BM25 Keyword Index
    </text>
    
    <!-- Query processing -->
    <rect x="100" y="275" width="260" height="50" rx="5" fill="#fff" stroke="#e03131" stroke-width="2"/>
    <text x="230" y="297" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#495057">
      Tokenize Query
    </text>
    <text x="230" y="315" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#868e96">
      Extract keywords, remove stopwords
    </text>
    
    <!-- Index structure -->
    <rect x="100" y="340" width="260" height="70" rx="5" fill="#fff" stroke="#e03131" stroke-width="2"/>
    <text x="230" y="362" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#495057">
      Inverted Index
    </text>
    <text x="110" y="382" font-family="Arial, sans-serif" font-size="10" fill="#868e96">
      term1 → [doc1, doc3, doc5]
    </text>
    <text x="110" y="397" font-family="Arial, sans-serif" font-size="10" fill="#868e96">
      term2 → [doc2, doc5, doc8]
    </text>
    
    <!-- Results -->
    <rect x="100" y="425" width="260" height="60" rx="5" fill="#ffe3e3" stroke="#e03131" stroke-width="2"/>
    <text x="230" y="447" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#495057">
      Top-K Results
    </text>
    <text x="230" y="465" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#495057">
      Lexical matching scores
    </text>
  </g>
  
  <!-- Path 2: Dense Vector Search -->
  <g id="dense-vector-path">
    <rect x="420" y="220" width="300" height="280" rx="10" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="3"/>
    <text x="570" y="255" font-family="Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1c7ed6">
      Dense Vector Index
    </text>
    
    <!-- Query embedding -->
    <rect x="440" y="275" width="260" height="50" rx="5" fill="#fff" stroke="#1c7ed6" stroke-width="2"/>
    <text x="570" y="297" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#495057">
      Generate Embedding
    </text>
    <text x="570" y="315" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#868e96">
      768/1536-dim vector
    </text>
    
    <!-- Vector index -->
    <rect x="440" y="340" width="260" height="70" rx="5" fill="#fff" stroke="#1c7ed6" stroke-width="2"/>
    <text x="570" y="362" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#495057">
      Vector Database
    </text>
    <text x="450" y="382" font-family="Arial, sans-serif" font-size="10" fill="#868e96">
      HNSW / IVF index
    </text>
    <text x="450" y="397" font-family="Arial, sans-serif" font-size="10" fill="#868e96">
      Cosine similarity search
    </text>
    
    <!-- Results -->
    <rect x="440" y="425" width="260" height="60" rx="5" fill="#d0ebff" stroke="#1c7ed6" stroke-width="2"/>
    <text x="570" y="447" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#495057">
      Top-K Results
    </text>
    <text x="570" y="465" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#495057">
      Semantic similarity scores
    </text>
  </g>
  
  <!-- Path 3: Sparse Vector Search -->
  <g id="sparse-vector-path">
    <rect x="760" y="220" width="300" height="280" rx="10" fill="#fff9db" stroke="#fab005" stroke-width="3"/>
    <text x="910" y="255" font-family="Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#e67700">
      Sparse Vector Index
    </text>
    
    <!-- Query processing -->
    <rect x="780" y="275" width="260" height="50" rx="5" fill="#fff" stroke="#fab005" stroke-width="2"/>
    <text x="910" y="297" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#495057">
      Learned Sparse Encoder
    </text>
    <text x="910" y="315" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#868e96">
      SPLADE / ColBERT
    </text>
    
    <!-- Index structure -->
    <rect x="780" y="340" width="260" height="70" rx="5" fill="#fff" stroke="#fab005" stroke-width="2"/>
    <text x="910" y="362" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#495057">
      Sparse Vectors
    </text>
    <text x="790" y="382" font-family="Arial, sans-serif" font-size="10" fill="#868e96">
      High-dim sparse representation
    </text>
    <text x="790" y="397" font-family="Arial, sans-serif" font-size="10" fill="#868e96">
      Interpretable term weights
    </text>
    
    <!-- Results -->
    <rect x="780" y="425" width="260" height="60" rx="5" fill="#ffec99" stroke="#fab005" stroke-width="2"/>
    <text x="910" y="447" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#495057">
      Top-K Results
    </text>
    <text x="910" y="465" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#495057">
      Learned relevance scores
    </text>
  </g>
  
  <!-- Arrows from all three paths to fusion -->
  <line x1="230" y1="500" x2="570" y2="570" stroke="#495057" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="570" y1="500" x2="570" y2="570" stroke="#495057" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="910" y1="500" x2="650" y2="570" stroke="#495057" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Fusion / Re-ranking -->
  <rect x="420" y="570" width="360" height="140" rx="10" fill="#d3f9d8" stroke="#37b24d" stroke-width="3"/>
  <text x="600" y="605" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#2b8a3e">
    Result Fusion &amp; Re-ranking
  </text>
  
  <rect x="440" y="625" width="320" height="70" rx="5" fill="#fff" stroke="#37b24d" stroke-width="2"/>
  <text x="600" y="647" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#495057">
    Reciprocal Rank Fusion (RRF)
  </text>
  <text x="450" y="667" font-family="Arial, sans-serif" font-size="11" fill="#495057">
    • Combine rankings from all retrievers
  </text>
  <text x="450" y="684" font-family="Arial, sans-serif" font-size="11" fill="#495057">
    • Optional: Cross-encoder re-ranking
  </text>
  
  <!-- Arrow to final results -->
  <line x1="600" y1="710" x2="600" y2="750" stroke="#495057" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Final Results -->
  <rect x="420" y="750" width="360" height="100" rx="10" fill="#4c6ef5" stroke="#364fc7" stroke-width="3"/>
  <text x="600" y="785" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#fff">
    Final Ranked Results
  </text>
  <text x="600" y="810" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#fff">
    Best of all retrieval methods
  </text>
  <text x="600" y="833" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#d0ebff">
    Higher recall, better precision
  </text>
  
  <!-- Benefits box -->
  <rect x="1100" y="220" width="260" height="280" rx="10" fill="#e9ecef" stroke="#495057" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="1230" y="255" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    💡 Benefits
  </text>
  
  <text x="1120" y="285" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#37b24d">
    ✓ Improved Recall
  </text>
  <text x="1120" y="305" font-family="Arial, sans-serif" font-size="11" fill="#495057">
    Catch documents missed by
  </text>
  <text x="1120" y="320" font-family="Arial, sans-serif" font-size="11" fill="#495057">
    individual methods
  </text>
  
  <text x="1120" y="350" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#37b24d">
    ✓ Robust to Queries
  </text>
  <text x="1120" y="370" font-family="Arial, sans-serif" font-size="11" fill="#495057">
    Works for both keyword and
  </text>
  <text x="1120" y="385" font-family="Arial, sans-serif" font-size="11" fill="#495057">
    semantic queries
  </text>
  
  <text x="1120" y="415" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#37b24d">
    ✓ Vocabulary Mismatch
  </text>
  <text x="1120" y="435" font-family="Arial, sans-serif" font-size="11" fill="#495057">
    Dense vectors handle synonyms,
  </text>
  <text x="1120" y="450" font-family="Arial, sans-serif" font-size="11" fill="#495057">
    sparse handles exact terms
  </text>
  
  <text x="1120" y="480" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#37b24d">
    ✓ Best of Both Worlds
  </text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#495057"/>
    </marker>
  </defs>
</svg>