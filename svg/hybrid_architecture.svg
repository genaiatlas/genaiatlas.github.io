<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="800" fill="#fafafa"/>
  
  <!-- Title -->
  <text x="600" y="35" font-size="26" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Hybrid Recommendation System Architecture
  </text>
  
  <!-- Base Recommenders Section -->
  <g id="base-recommenders">
    <text x="150" y="75" font-size="16" font-weight="bold" fill="#333">Base Recommenders</text>
    
    <!-- Collaborative Filtering Module -->
    <rect x="50" y="90" width="250" height="150" rx="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
    <text x="175" y="115" font-size="14" font-weight="bold" text-anchor="middle" fill="#0d47a1">Collaborative Filtering</text>
    
    <rect x="70" y="130" width="100" height="30" rx="4" fill="#bbdefb"/>
    <text x="120" y="149" font-size="11" text-anchor="middle" fill="#0d47a1">User-Based CF</text>
    
    <rect x="180" y="130" width="100" height="30" rx="4" fill="#bbdefb"/>
    <text x="230" y="149" font-size="11" text-anchor="middle" fill="#0d47a1">Item-Based CF</text>
    
    <rect x="70" y="170" width="210" height="30" rx="4" fill="#bbdefb"/>
    <text x="175" y="189" font-size="11" text-anchor="middle" fill="#0d47a1">Matrix Factorization (SVD++)</text>
    
    <rect x="70" y="205" width="210" height="25" rx="4" fill="#90caf9"/>
    <text x="175" y="222" font-size="10" text-anchor="middle" fill="#0d47a1">Output: Top-K recommendations</text>
    
    <!-- Content-Based Module -->
    <rect x="50" y="260" width="250" height="150" rx="8" fill="#e8f5e9" stroke="#388e3c" stroke-width="2"/>
    <text x="175" y="285" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b5e20">Content-Based Filtering</text>
    
    <rect x="70" y="300" width="100" height="30" rx="4" fill="#c8e6c9"/>
    <text x="120" y="319" font-size="11" text-anchor="middle" fill="#1b5e20">TF-IDF</text>
    
    <rect x="180" y="300" width="100" height="30" rx="4" fill="#c8e6c9"/>
    <text x="230" y="319" font-size="11" text-anchor="middle" fill="#1b5e20">Embeddings</text>
    
    <rect x="70" y="340" width="210" height="30" rx="4" fill="#c8e6c9"/>
    <text x="175" y="359" font-size="11" text-anchor="middle" fill="#1b5e20">Feature Similarity Matching</text>
    
    <rect x="70" y="375" width="210" height="25" rx="4" fill="#a5d6a7"/>
    <text x="175" y="392" font-size="10" text-anchor="middle" fill="#1b5e20">Output: Similarity scores</text>
    
    <!-- Knowledge-Based Module -->
    <rect x="50" y="430" width="250" height="150" rx="8" fill="#fff3e0" stroke="#f57c00" stroke-width="2"/>
    <text x="175" y="455" font-size="14" font-weight="bold" text-anchor="middle" fill="#e65100">Knowledge-Based</text>
    
    <rect x="70" y="470" width="210" height="30" rx="4" fill="#ffe0b2"/>
    <text x="175" y="489" font-size="11" text-anchor="middle" fill="#e65100">Domain Rules &amp; Constraints</text>
    
    <rect x="70" y="510" width="210" height="30" rx="4" fill="#ffe0b2"/>
    <text x="175" y="529" font-size="11" text-anchor="middle" fill="#e65100">Expert Systems</text>
    
    <rect x="70" y="545" width="210" height="25" rx="4" fill="#ffcc80"/>
    <text x="175" y="562" font-size="10" text-anchor="middle" fill="#e65100">Output: Rule-based selections</text>
    
    <!-- Deep Learning Module -->
    <rect x="50" y="600" width="250" height="150" rx="8" fill="#fce4ec" stroke="#c2185b" stroke-width="2"/>
    <text x="175" y="625" font-size="14" font-weight="bold" text-anchor="middle" fill="#880e4f">Deep Learning</text>
    
    <rect x="70" y="640" width="100" height="30" rx="4" fill="#f8bbd0"/>
    <text x="120" y="659" font-size="11" text-anchor="middle" fill="#880e4f">Neural CF</text>
    
    <rect x="180" y="640" width="100" height="30" rx="4" fill="#f8bbd0"/>
    <text x="230" y="659" font-size="11" text-anchor="middle" fill="#880e4f">Autoencoders</text>
    
    <rect x="70" y="680" width="210" height="30" rx="4" fill="#f8bbd0"/>
    <text x="175" y="699" font-size="11" text-anchor="middle" fill="#880e4f">Wide &amp; Deep Networks</text>
    
    <rect x="70" y="715" width="210" height="25" rx="4" fill="#f48fb1"/>
    <text x="175" y="732" font-size="10" text-anchor="middle" fill="#880e4f">Output: Learned representations</text>
  </g>
  
  <!-- Hybrid Combination Strategies -->
  <g id="combination-strategies">
    <rect x="380" y="90" width="400" height="660" rx="10" fill="#f5f5f5" stroke="#616161" stroke-width="2"/>
    <text x="580" y="115" font-size="16" font-weight="bold" text-anchor="middle" fill="#212121">Hybrid Combination Strategies</text>
    
    <!-- Weighted Hybrid -->
    <rect x="400" y="140" width="360" height="120" rx="6" fill="white" stroke="#9575cd" stroke-width="2"/>
    <text x="580" y="165" font-size="14" font-weight="bold" text-anchor="middle" fill="#4527a0">Weighted Hybrid</text>
    
    <rect x="420" y="180" width="320" height="30" rx="4" fill="#ede7f6"/>
    <text x="580" y="199" font-size="11" font-family="monospace" text-anchor="middle" fill="#4527a0">
      Score = α×CF + β×CB + γ×KB + δ×DL
    </text>
    
    <text x="580" y="225" font-size="10" text-anchor="middle" fill="#616161">Weights learned via optimization</text>
    <text x="580" y="245" font-size="10" text-anchor="middle" fill="#616161">α=0.35, β=0.25, γ=0.15, δ=0.25</text>
    
    <!-- Switching Hybrid -->
    <rect x="400" y="280" width="360" height="120" rx="6" fill="white" stroke="#4db6ac" stroke-width="2"/>
    <text x="580" y="305" font-size="14" font-weight="bold" text-anchor="middle" fill="#00695c">Switching Hybrid</text>
    
    <rect x="420" y="320" width="150" height="30" rx="4" fill="#e0f2f1"/>
    <text x="495" y="339" font-size="10" text-anchor="middle" fill="#00695c">Cold Start → CB</text>
    
    <rect x="590" y="320" width="150" height="30" rx="4" fill="#e0f2f1"/>
    <text x="665" y="339" font-size="10" text-anchor="middle" fill="#00695c">Dense Data → CF</text>
    
    <rect x="420" y="360" width="320" height="30" rx="4" fill="#b2dfdb"/>
    <text x="580" y="379" font-size="10" text-anchor="middle" fill="#00695c">Context-aware algorithm selection</text>
    
    <!-- Mixed Hybrid -->
    <rect x="400" y="420" width="360" height="120" rx="6" fill="white" stroke="#ff7043" stroke-width="2"/>
    <text x="580" y="445" font-size="14" font-weight="bold" text-anchor="middle" fill="#bf360c">Mixed Hybrid</text>
    
    <text x="580" y="470" font-size="11" text-anchor="middle" fill="#424242">Present multiple recommendation lists:</text>
    
    <rect x="420" y="485" width="320" height="20" rx="3" fill="#ffccbc"/>
    <text x="580" y="498" font-size="10" text-anchor="middle" fill="#bf360c">• "Users like you also liked" (CF)</text>
    
    <rect x="420" y="510" width="320" height="20" rx="3" fill="#ffccbc"/>
    <text x="580" y="523" font-size="10" text-anchor="middle" fill="#bf360c">• "Because you liked X" (CB)</text>
    
    <!-- Feature Combination -->
    <rect x="400" y="560" width="360" height="120" rx="6" fill="white" stroke="#7e57c2" stroke-width="2"/>
    <text x="580" y="585" font-size="14" font-weight="bold" text-anchor="middle" fill="#311b92">Feature-Level Combination</text>
    
    <rect x="420" y="600" width="320" height="30" rx="4" fill="#e8eaf6"/>
    <text x="580" y="619" font-size="11" text-anchor="middle" fill="#311b92">Unified Feature Vector</text>
    
    <rect x="420" y="640" width="320" height="30" rx="4" fill="#d1c4e9"/>
    <text x="580" y="659" font-size="10" text-anchor="middle" fill="#311b92">[user_features, item_features, cf_scores, context]</text>
  </g>
  
  <!-- Meta-Learning Layer -->
  <g id="meta-learning">
    <rect x="860" y="90" width="290" height="250" rx="10" fill="#fff8e1" stroke="#ffa000" stroke-width="2"/>
    <text x="1005" y="115" font-size="16" font-weight="bold" text-anchor="middle" fill="#f57f17">Meta-Learning Layer</text>
    
    <!-- Ensemble Methods -->
    <text x="880" y="145" font-size="13" font-weight="bold" fill="#424242">Ensemble Methods:</text>
    
    <rect x="880" y="160" width="250" height="30" rx="4" fill="#fff3e0"/>
    <text x="1005" y="179" font-size="11" text-anchor="middle" fill="#e65100">Stacking: Meta-learner on base outputs</text>
    
    <rect x="880" y="200" width="250" height="30" rx="4" fill="#fff3e0"/>
    <text x="1005" y="219" font-size="11" text-anchor="middle" fill="#e65100">Boosting: Sequential error correction</text>
    
    <rect x="880" y="240" width="250" height="30" rx="4" fill="#fff3e0"/>
    <text x="1005" y="259" font-size="11" text-anchor="middle" fill="#e65100">Bagging: Bootstrap aggregation</text>
    
    <!-- Learning to Rank -->
    <text x="880" y="295" font-size="13" font-weight="bold" fill="#424242">Learning to Rank:</text>
    <rect x="880" y="305" width="250" height="25" rx="4" fill="#ffe082"/>
    <text x="1005" y="322" font-size="11" text-anchor="middle" fill="#f57f17">LambdaMART, RankNet, ListNet</text>
  </g>
  
  <!-- Final Output -->
  <g id="final-output">
    <rect x="860" y="370" width="290" height="380" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
    <text x="1005" y="395" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b5e20">Final Recommendations</text>
    
    <!-- Re-ranking -->
    <rect x="880" y="415" width="250" height="80" rx="6" fill="white" stroke="#66bb6a" stroke-width="1"/>
    <text x="1005" y="435" font-size="12" font-weight="bold" text-anchor="middle" fill="#2e7d32">Business Logic Re-ranking</text>
    <text x="1005" y="455" font-size="10" text-anchor="middle" fill="#424242">• Diversity constraints</text>
    <text x="1005" y="470" font-size="10" text-anchor="middle" fill="#424242">• Freshness requirements</text>
    <text x="1005" y="485" font-size="10" text-anchor="middle" fill="#424242">• Promotional items</text>
    
    <!-- Personalization -->
    <rect x="880" y="510" width="250" height="80" rx="6" fill="white" stroke="#66bb6a" stroke-width="1"/>
    <text x="1005" y="530" font-size="12" font-weight="bold" text-anchor="middle" fill="#2e7d32">Personalization Layer</text>
    <text x="1005" y="550" font-size="10" text-anchor="middle" fill="#424242">• User preference adaptation</text>
    <text x="1005" y="565" font-size="10" text-anchor="middle" fill="#424242">• Context-aware filtering</text>
    <text x="1005" y="580" font-size="10" text-anchor="middle" fill="#424242">• A/B testing integration</text>
    
    <!-- Output List -->
    <rect x="880" y="605" width="250" height="120" rx="6" fill="white" stroke="#66bb6a" stroke-width="1"/>
    <text x="1005" y="625" font-size="12" font-weight="bold" text-anchor="middle" fill="#2e7d32">Ranked Recommendations</text>
    
    <rect x="900" y="640" width="210" height="20" rx="3" fill="#4caf50"/>
    <text x="1005" y="654" font-size="10" text-anchor="middle" fill="white">1. Item_42 (score: 0.97)</text>
    
    <rect x="900" y="665" width="210" height="20" rx="3" fill="#66bb6a"/>
    <text x="1005" y="679" font-size="10" text-anchor="middle" fill="white">2. Item_18 (score: 0.94)</text>
    
    <rect x="900" y="690" width="210" height="20" rx="3" fill="#81c784"/>
    <text x="1005" y="704" font-size="10" text-anchor="middle" fill="white">3. Item_73 (score: 0.91)</text>
  </g>
  
  <!-- Flow Arrows -->
  <defs>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#616161"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#ff6f00"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#2e7d32"/>
    </marker>
  </defs>
  
  <!-- Base to Hybrid -->
  <path d="M 300 165 L 380 200" stroke="#616161" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <path d="M 300 335 L 380 350" stroke="#616161" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <path d="M 300 505 L 380 480" stroke="#616161" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <path d="M 300 675 L 380 620" stroke="#616161" stroke-width="2" marker-end="url(#arrow-gray)"/>
  
  <!-- Hybrid to Meta -->
  <path d="M 780 400 L 860 215" stroke="#ff6f00" stroke-width="2" marker-end="url(#arrow-orange)"/>
  
  <!-- Meta to Final -->
  <path d="M 1005 340 L 1005 370" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrow-green)"/>
  
  <!-- Labels on arrows -->
  <text x="340" y="260" font-size="10" text-anchor="middle" fill="#616161" transform="rotate(-20 340 260)">Outputs</text>
  <text x="820" y="310" font-size="10" text-anchor="middle" fill="#ff6f00" transform="rotate(-45 820 310)">Combined</text>
  <text x="1020" y="355" font-size="10" fill="#2e7d32">Optimized</text>
</svg>