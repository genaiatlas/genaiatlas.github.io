<svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="cluster1Grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0.3" />
    </radialGradient>
    <radialGradient id="cluster2Grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:0.3" />
    </radialGradient>
    <radialGradient id="cluster3Grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:0.3" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="500" fill="#f1f5f9"/>
  
  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1e293b">
    How t-SNE Preserves Neighborhood Structure and Clusters
  </text>
  
  <!-- High-dimensional space representation -->
  <g transform="translate(50,70)">
    <text x="200" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#4338ca">
      High-Dimensional Space
    </text>
    <text x="200" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6366f1">
      (Complex, hard to visualize)
    </text>
    
    <!-- 3D-like representation -->
    <g transform="translate(50,60)">
      <!-- Cluster 1 (Customer Segment A) -->
      <ellipse cx="80" cy="80" rx="40" ry="25" fill="url(#cluster1Grad)" opacity="0.7"/>
      <circle cx="70" cy="75" r="4" fill="#f59e0b"/>
      <circle cx="85" cy="80" r="4" fill="#f59e0b"/>
      <circle cx="80" cy="85" r="4" fill="#f59e0b"/>
      <circle cx="90" cy="75" r="4" fill="#f59e0b"/>
      <circle cx="75" cy="90" r="4" fill="#f59e0b"/>
      
      <!-- Cluster 2 (Customer Segment B) -->
      <ellipse cx="180" cy="120" rx="35" ry="30" fill="url(#cluster2Grad)" opacity="0.7"/>
      <circle cx="170" cy="115" r="4" fill="#1d4ed8"/>
      <circle cx="185" cy="120" r="4" fill="#1d4ed8"/>
      <circle cx="180" cy="125" r="4" fill="#1d4ed8"/>
      <circle cx="190" cy="115" r="4" fill="#1d4ed8"/>
      <circle cx="175" cy="130" r="4" fill="#1d4ed8"/>
      
      <!-- Cluster 3 (Customer Segment C) -->
      <ellipse cx="280" cy="90" rx="38" ry="28" fill="url(#cluster3Grad)" opacity="0.7"/>
      <circle cx="270" cy="85" r="4" fill="#047857"/>
      <circle cx="285" cy="90" r="4" fill="#047857"/>
      <circle cx="280" cy="95" r="4" fill="#047857"/>
      <circle cx="290" cy="85" r="4" fill="#047857"/>
      <circle cx="275" cy="100" r="4" fill="#047857"/>
      
      <!-- Neighborhood connections -->
      <path d="M 70 75 L 85 80" stroke="#f59e0b" stroke-width="1" opacity="0.5"/>
      <path d="M 85 80 L 80 85" stroke="#f59e0b" stroke-width="1" opacity="0.5"/>
      <path d="M 170 115 L 185 120" stroke="#1d4ed8" stroke-width="1" opacity="0.5"/>
      <path d="M 185 120 L 180 125" stroke="#1d4ed8" stroke-width="1" opacity="0.5"/>
      <path d="M 270 85 L 285 90" stroke="#047857" stroke-width="1" opacity="0.5"/>
      <path d="M 285 90 L 280 95" stroke="#047857" stroke-width="1" opacity="0.5"/>
    </g>
    
    <!-- Labels -->
    <text x="130" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#f59e0b" font-weight="bold">
      Segment A
    </text>
    <text x="230" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1d4ed8" font-weight="bold">
      Segment B
    </text>
    <text x="330" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#047857" font-weight="bold">
      Segment C
    </text>
  </g>
  
  <!-- Arrow -->
  <g transform="translate(440,200)">
    <path d="M 0 0 L 80 0" stroke="#374151" stroke-width="3" marker-end="url(#arrowhead)"/>
    <text x="40" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#374151">
      t-SNE
    </text>
    <text x="40" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">
      Preserves local
    </text>
    <text x="40" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">
      neighborhoods
    </text>
  </g>
  
  <!-- Low-dimensional embedding -->
  <g transform="translate(570,70)">
    <text x="200" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#047857">
      2D Embedding Space
    </text>
    <text x="200" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#059669">
      (Clear cluster visualization)
    </text>
    
    <!-- Well-separated clusters in 2D -->
    <g transform="translate(50,60)">
      <!-- Preserved Cluster 1 -->
      <ellipse cx="80" cy="70" rx="35" ry="25" fill="url(#cluster1Grad)" opacity="0.6" stroke="#f59e0b" stroke-width="2"/>
      <circle cx="70" cy="65" r="5" fill="#f59e0b" filter="url(#glow)"/>
      <circle cx="85" cy="70" r="5" fill="#f59e0b" filter="url(#glow)"/>
      <circle cx="80" cy="75" r="5" fill="#f59e0b" filter="url(#glow)"/>
      <circle cx="90" cy="65" r="5" fill="#f59e0b" filter="url(#glow)"/>
      <circle cx="75" cy="80" r="5" fill="#f59e0b" filter="url(#glow)"/>
      
      <!-- Preserved Cluster 2 -->
      <ellipse cx="220" cy="140" rx="32" ry="28" fill="url(#cluster2Grad)" opacity="0.6" stroke="#1d4ed8" stroke-width="2"/>
      <circle cx="210" cy="135" r="5" fill="#1d4ed8" filter="url(#glow)"/>
      <circle cx="225" cy="140" r="5" fill="#1d4ed8" filter="url(#glow)"/>
      <circle cx="220" cy="145" r="5" fill="#1d4ed8" filter="url(#glow)"/>
      <circle cx="230" cy="135" r="5" fill="#1d4ed8" filter="url(#glow)"/>
      <circle cx="215" cy="150" r="5" fill="#1d4ed8" filter="url(#glow)"/>
      
      <!-- Preserved Cluster 3 -->
      <ellipse cx="300" cy="80" rx="36" ry="26" fill="url(#cluster3Grad)" opacity="0.6" stroke="#047857" stroke-width="2"/>
      <circle cx="290" cy="75" r="5" fill="#047857" filter="url(#glow)"/>
      <circle cx="305" cy="80" r="5" fill="#047857" filter="url(#glow)"/>
      <circle cx="300" cy="85" r="5" fill="#047857" filter="url(#glow)"/>
      <circle cx="310" cy="75" r="5" fill="#047857" filter="url(#glow)"/>
      <circle cx="295" cy="90" r="5" fill="#047857" filter="url(#glow)"/>
      
      <!-- Preserved neighborhood connections -->
      <path d="M 70 65 L 85 70" stroke="#f59e0b" stroke-width="2" opacity="0.7"/>
      <path d="M 85 70 L 80 75" stroke="#f59e0b" stroke-width="2" opacity="0.7"/>
      <path d="M 210 135 L 225 140" stroke="#1d4ed8" stroke-width="2" opacity="0.7"/>
      <path d="M 225 140 L 220 145" stroke="#1d4ed8" stroke-width="2" opacity="0.7"/>
      <path d="M 290 75 L 305 80" stroke="#047857" stroke-width="2" opacity="0.7"/>
      <path d="M 305 80 L 300 85" stroke="#047857" stroke-width="2" opacity="0.7"/>
    </g>
    
    <!-- Labels -->
    <text x="130" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#f59e0b" font-weight="bold">
      Segment A
    </text>
    <text x="270" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1d4ed8" font-weight="bold">
      Segment B
    </text>
    <text x="350" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#047857" font-weight="bold">
      Segment C
    </text>
    
    <!-- Axes -->
    <path d="M 40 190 L 360 190" stroke="#64748b" stroke-width="1"/>
    <path d="M 40 190 L 40 50" stroke="#64748b" stroke-width="1"/>
    <text x="360" y="205" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#64748b">Y₁</text>
    <text x="25" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b" transform="rotate(-90,25,55)">Y₂</text>
  </g>
  
  <!-- Key principles -->
  <g transform="translate(50,350)">
    <rect x="0" y="0" width="900" height="130" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
    
    <text x="450" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#374151">
      Key Preservation Principles
    </text>
    
    <!-- Principle 1 -->
    <g transform="translate(30,45)">
      <circle cx="8" cy="8" r="6" fill="#10b981"/>
      <text x="8" y="13" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" font-weight="bold">1</text>
      <text x="25" y="8" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#047857">
        Local Neighborhood Preservation
      </text>
      <text x="25" y="24" font-family="Arial, sans-serif" font-size="12" fill="#4b5563">
        Points that are close in high-dimensional space remain close in the embedding
      </text>
    </g>
    
    <!-- Principle 2 -->
    <g transform="translate(30,75)">
      <circle cx="8" cy="8" r="6" fill="#3b82f6"/>
      <text x="8" y="13" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" font-weight="bold">2</text>
      <text x="25" y="8" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1d4ed8">
        Cluster Separation
      </text>
      <text x="25" y="24" font-family="Arial, sans-serif" font-size="12" fill="#4b5563">
        Distinct clusters in high-dimensional space become well-separated groups
      </text>
    </g>
    
    <!-- Principle 3 -->
    <g transform="translate(30,105)">
      <circle cx="8" cy="8" r="6" fill="#f59e0b"/>
      <text x="8" y="13" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" font-weight="bold">3</text>
      <text x="25" y="8" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#d97706">
        Non-linear Flexibility
      </text>
      <text x="25" y="24" font-family="Arial, sans-serif" font-size="12" fill="#4b5563">
        Can handle complex, curved manifolds that linear methods cannot capture
      </text>
    </g>
    
    <!-- Applications box -->
    <g transform="translate(500,45)">
      <rect x="0" y="0" width="370" height="70" rx="8" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1"/>
      <text x="185" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0c4a6e">
        Real-World Applications
      </text>
      <text x="15" y="35" font-family="Arial, sans-serif" font-size="11" fill="#0c4a6e">
        • Customer segmentation and behavior analysis
      </text>
      <text x="15" y="48" font-family="Arial, sans-serif" font-size="11" fill="#0c4a6e">
        • Gene expression data clustering in bioinformatics
      </text>
      <text x="15" y="61" font-family="Arial, sans-serif" font-size="11" fill="#0c4a6e">
        • Document clustering and topic discovery in NLP
      </text>
    </g>
  </g>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#374151"/>
    </marker>
  </defs>
</svg>