<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGradient)"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    Clustering Evaluation Challenges
  </text>
  
  <!-- Central problem -->
  <circle cx="400" cy="200" r="80" fill="#3498db" stroke="#2980b9" stroke-width="3" filter="url(#shadow)"/>
  <text x="400" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    Clustering
  </text>
  <text x="400" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    Evaluation
  </text>
  
  <!-- Challenge 1: No Ground Truth -->
  <rect x="50" y="80" width="150" height="80" rx="10" fill="#e74c3c" stroke="#c0392b" stroke-width="2" filter="url(#shadow)"/>
  <text x="125" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    No Universal
  </text>
  <text x="125" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Ground Truth
  </text>
  <text x="125" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Labels
  </text>
  
  <!-- Challenge 2: Multiple Solutions -->
  <rect x="600" y="80" width="150" height="80" rx="10" fill="#f39c12" stroke="#e67e22" stroke-width="2" filter="url(#shadow)"/>
  <text x="675" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Multiple Valid
  </text>
  <text x="675" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Clustering
  </text>
  <text x="675" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Solutions
  </text>
  
  <!-- Challenge 3: Domain Specific -->
  <rect x="50" y="340" width="150" height="80" rx="10" fill="#9b59b6" stroke="#8e44ad" stroke-width="2" filter="url(#shadow)"/>
  <text x="125" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Domain-Specific
  </text>
  <text x="125" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Interpretation
  </text>
  <text x="125" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Required
  </text>
  
  <!-- Challenge 4: Subjective Quality -->
  <rect x="600" y="340" width="150" height="80" rx="10" fill="#27ae60" stroke="#2ecc71" stroke-width="2" filter="url(#shadow)"/>
  <text x="675" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Balance Between
  </text>
  <text x="675" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Objective &amp;
  </text>
  <text x="675" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Subjective Quality
  </text>
  
  <!-- Arrows connecting challenges to central problem -->
  <path d="M 200 120 Q 300 120 320 170" stroke="#34495e" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 600 120 Q 500 120 480 170" stroke="#34495e" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 200 380 Q 300 380 320 230" stroke="#34495e" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 600 380 Q 500 380 480 230" stroke="#34495e" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Solution approaches -->
  <ellipse cx="400" cy="320" rx="120" ry="40" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">
    Multi-Method Evaluation
  </text>
  <text x="400" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">
    Approach Required
  </text>
  
  <!-- Arrow from central problem to solution -->
  <path d="M 400 280 L 400 290" stroke="#34495e" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Legend -->
  <rect x="280" y="450" width="240" height="40" rx="5" fill="#fff" stroke="#bdc3c7" stroke-width="1" filter="url(#shadow)"/>
  <text x="400" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">
    Key Insight: No single metric can capture clustering quality
  </text>
  <text x="400" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">
    Multiple evaluation strategies must be combined
  </text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e"/>
    </marker>
  </defs>
</svg>