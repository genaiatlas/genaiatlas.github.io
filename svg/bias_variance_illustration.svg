<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'Arial', sans-serif; font-size: 20px; font-weight: bold; fill: #2c3e50; }
      .subtitle { font-family: 'Arial', sans-serif; font-size: 14px; fill: #34495e; font-weight: bold; }
      .description { font-family: 'Arial', sans-serif; font-size: 12px; fill: #34495e; }
      .target-outer { fill: none; stroke: #34495e; stroke-width: 3; }
      .target-middle { fill: none; stroke: #34495e; stroke-width: 2; }
      .target-inner { fill: none; stroke: #34495e; stroke-width: 2; }
      .bullseye { fill: #e74c3c; stroke: #c0392b; stroke-width: 1; }
      .shot { fill: #3498db; stroke: #2980b9; stroke-width: 1; opacity: 0.8; }
      .center-cross { stroke: #e74c3c; stroke-width: 2; }
      .low-bias { fill: #27ae60; }
      .high-bias { fill: #e74c3c; }
      .low-variance { fill: #3498db; }
      .high-variance { fill: #f39c12; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title">Bias-Variance Tradeoff: Target Practice Analogy</text>
  
  <!-- Scenario 1: Low Bias, Low Variance (Ideal) -->
  <g transform="translate(150, 80)">
    <!-- Target circles -->
    <circle cx="0" cy="0" r="60" class="target-outer"/>
    <circle cx="0" cy="0" r="40" class="target-middle"/>
    <circle cx="0" cy="0" r="20" class="target-inner"/>
    <circle cx="0" cy="0" r="3" class="bullseye"/>
    
    <!-- Cross hairs -->
    <line x1="-8" y1="0" x2="8" y2="0" class="center-cross"/>
    <line x1="0" y1="-8" x2="0" y2="8" class="center-cross"/>
    
    <!-- Shots clustered near center -->
    <circle cx="2" cy="1" r="3" class="shot"/>
    <circle cx="-1" cy="3" r="3" class="shot"/>
    <circle cx="3" cy="-2" r="3" class="shot"/>
    <circle cx="-2" cy="-1" r="3" class="shot"/>
    <circle cx="1" cy="-3" r="3" class="shot"/>
    <circle cx="-3" cy="2" r="3" class="shot"/>
    <circle cx="0" cy="4" r="3" class="shot"/>
    <circle cx="4" cy="0" r="3" class="shot"/>
    
    <!-- Labels -->
    <text x="0" y="-85" text-anchor="middle" class="subtitle low-bias">Low Bias, Low Variance</text>
    <text x="0" y="-70" text-anchor="middle" class="description">(Ideal Scenario)</text>
    <text x="0" y="85" text-anchor="middle" class="description">Accurate & Precise</text>
    <text x="0" y="100" text-anchor="middle" class="description">Shots cluster near target</text>
  </g>
  
  <!-- Scenario 2: Low Bias, High Variance -->
  <g transform="translate(450, 80)">
    <!-- Target circles -->
    <circle cx="0" cy="0" r="60" class="target-outer"/>
    <circle cx="0" cy="0" r="40" class="target-middle"/>
    <circle cx="0" cy="0" r="20" class="target-inner"/>
    <circle cx="0" cy="0" r="3" class="bullseye"/>
    
    <!-- Cross hairs -->
    <line x1="-8" y1="0" x2="8" y2="0" class="center-cross"/>
    <line x1="0" y1="-8" x2="0" y2="8" class="center-cross"/>
    
    <!-- Shots scattered around center -->
    <circle cx="15" cy="10" r="3" class="shot"/>
    <circle cx="-20" cy="25" r="3" class="shot"/>
    <circle cx="30" cy="-15" r="3" class="shot"/>
    <circle cx="-25" cy="-30" r="3" class="shot"/>
    <circle cx="5" cy="-35" r="3" class="shot"/>
    <circle cx="-35" cy="5" r="3" class="shot"/>
    <circle cx="-5" cy="40" r="3" class="shot"/>
    <circle cx="40" cy="-5" r="3" class="shot"/>
    
    <!-- Labels -->
    <text x="0" y="-85" text-anchor="middle" class="subtitle low-bias">Low Bias, High Variance</text>
    <text x="0" y="-70" text-anchor="middle" class="description">(Overfitting)</text>
    <text x="0" y="85" text-anchor="middle" class="description">Accurate on Average but Inconsistent</text>
    <text x="0" y="100" text-anchor="middle" class="description">Scattered around target</text>
  </g>
  
  <!-- Scenario 3: High Bias, Low Variance -->
  <g transform="translate(150, 320)">
    <!-- Target circles -->
    <circle cx="0" cy="0" r="60" class="target-outer"/>
    <circle cx="0" cy="0" r="40" class="target-middle"/>
    <circle cx="0" cy="0" r="20" class="target-inner"/>
    <circle cx="0" cy="0" r="3" class="bullseye"/>
    
    <!-- Cross hairs -->
    <line x1="-8" y1="0" x2="8" y2="0" class="center-cross"/>
    <line x1="0" y1="-8" x2="0" y2="8" class="center-cross"/>
    
    <!-- Shots clustered away from center -->
    <circle cx="25" cy="20" r="3" class="shot"/>
    <circle cx="22" cy="23" r="3" class="shot"/>
    <circle cx="28" cy="18" r="3" class="shot"/>
    <circle cx="20" cy="25" r="3" class="shot"/>
    <circle cx="27" cy="22" r="3" class="shot"/>
    <circle cx="23" cy="19" r="3" class="shot"/>
    <circle cx="26" cy="25" r="3" class="shot"/>
    <circle cx="24" cy="17" r="3" class="shot"/>
    
    <!-- Labels -->
    <text x="0" y="-85" text-anchor="middle" class="subtitle high-bias">High Bias, Low Variance</text>
    <text x="0" y="-70" text-anchor="middle" class="description">(Underfitting)</text>
    <text x="0" y="85" text-anchor="middle" class="description">Consistent but Systematically Wrong</text>
    <text x="0" y="100" text-anchor="middle" class="description">Precise but inaccurate</text>
  </g>
  
  <!-- Scenario 4: High Bias, High Variance -->
  <g transform="translate(450, 320)">
    <!-- Target circles -->
    <circle cx="0" cy="0" r="60" class="target-outer"/>
    <circle cx="0" cy="0" r="40" class="target-middle"/>
    <circle cx="0" cy="0" r="20" class="target-inner"/>
    <circle cx="0" cy="0" r="3" class="bullseye"/>
    
    <!-- Cross hairs -->
    <line x1="-8" y1="0" x2="8" y2="0" class="center-cross"/>
    <line x1="0" y1="-8" x2="0" y2="8" class="center-cross"/>
    
    <!-- Shots scattered away from center -->
    <circle cx="30" cy="35" r="3" class="shot"/>
    <circle cx="20" cy="45" r="3" class="shot"/>
    <circle cx="40" cy="25" r="3" class="shot"/>
    <circle cx="15" cy="40" r="3" class="shot"/>
    <circle cx="35" cy="45" r="3" class="shot"/>
    <circle cx="45" cy="30" r="3" class="shot"/>
    <circle cx="25" cy="50" r="3" class="shot"/>
    <circle cx="50" cy="35" r="3" class="shot"/>
    
    <!-- Labels -->
    <text x="0" y="-85" text-anchor="middle" class="subtitle high-bias">High Bias, High Variance</text>
    <text x="0" y="-70" text-anchor="middle" class="description">(Worst Case)</text>
    <text x="0" y="85" text-anchor="middle" class="description">Inconsistent AND Wrong</text>
    <text x="0" y="100" text-anchor="middle" class="description">Neither accurate nor precise</text>
  </g>
  
  <!-- Mathematical Definitions -->
  <rect x="50" y="460" width="700" height="120" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2" rx="8"/>
  <text x="400" y="485" text-anchor="middle" class="subtitle">Mathematical Definitions</text>
  
  <text x="70" y="510" class="description" style="font-weight: bold;">Bias:</text>
  <text x="120" y="510" class="description">Systematic error from model assumptions. High bias = consistently missing the target.</text>
  <text x="120" y="525" class="description">Bias² = (E[ŷ] - y_true)² where E[ŷ] is expected prediction across different training sets.</text>
  
  <text x="70" y="545" class="description" style="font-weight: bold;">Variance:</text>
  <text x="140" y="545" class="description">Sensitivity to training data changes. High variance = inconsistent predictions.</text>
  <text x="140" y="560" class="description">Variance = E[(ŷ - E[ŷ])²] measuring spread of predictions across different training sets.</text>
  
  <!-- Legend for shots -->
  <circle cx="650" cy="50" r="3" class="shot"/>
  <text x="665" y="55" class="description">Model Predictions</text>
  <circle cx="650" cy="70" r="3" class="bullseye"/>
  <text x="665" y="75" class="description">True Target Value</text>
</svg>