<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3498db"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">
    Eigenvectors: Direction-Preserving Transformations
  </text>
  
  <!-- Left side: Regular vector transformation -->
  <g transform="translate(80, 80)">
    <text x="150" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">
      Regular Vector Transformation
    </text>
    
    <!-- Coordinate system -->
    <line x1="0" y1="150" x2="250" y2="150" stroke="#bdc3c7" stroke-width="1" marker-end="url(#arrowhead)"/>
    <line x1="125" y1="250" x2="125" y2="50" stroke="#bdc3c7" stroke-width="1" marker-end="url(#arrowhead)"/>
    
    <!-- Grid -->
    <defs>
      <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
        <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#ecf0f1" stroke-width="1"/>
      </pattern>
    </defs>
    <rect x="0" y="50" width="250" height="200" fill="url(#grid)"/>
    
    <!-- Original vector -->
    <line x1="125" y1="150" x2="175" y2="100" stroke="#3498db" stroke-width="4" marker-end="url(#arrowhead-blue)"/>
    <text x="185" y="95" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#3498db">v</text>
    
    <!-- Matrix transformation visualization -->
    <g transform="translate(60, 270)">
      <rect x="0" y="0" width="40" height="40" fill="#ecf0f1" stroke="#2c3e50" stroke-width="1"/>
      <text x="5" y="15" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">2</text>
      <text x="25" y="15" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">1</text>
      <text x="5" y="35" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">1</text>
      <text x="25" y="35" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">3</text>
      
      <text x="50" y="25" font-family="Arial, sans-serif" font-size="16" fill="#2c3e50">×</text>
      
      <rect x="70" y="10" width="20" height="20" fill="#ecf0f1" stroke="#2c3e50" stroke-width="1"/>
      <text x="75" y="25" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">2</text>
      <text x="75" y="35" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">-2</text>
      
      <text x="100" y="25" font-family="Arial, sans-serif" font-size="16" fill="#2c3e50">=</text>
      
      <rect x="120" y="10" width="20" height="20" fill="#e74c3c" stroke="#2c3e50" stroke-width="1"/>
      <text x="125" y="25" font-family="Arial, sans-serif" font-size="10" fill="white">2</text>
      <text x="125" y="35" font-family="Arial, sans-serif" font-size="10" fill="white">-4</text>
    </g>
    
    <!-- Transformed vector -->
    <line x1="125" y1="150" x2="175" y2="50" stroke="#e74c3c" stroke-width="4" marker-end="url(#arrowhead-red)"/>
    <text x="185" y="45" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e74c3c">Av</text>
    
    <!-- Direction change indication -->
    <path d="M 165 125 Q 175 115 185 105" stroke="#f39c12" stroke-width="2" fill="none" stroke-dasharray="3,3"/>
    <text x="150" y="115" font-family="Arial, sans-serif" font-size="11" fill="#f39c12">Direction changes</text>
  </g>
  
  <!-- Right side: Eigenvector transformation -->
  <g transform="translate(450, 80)">
    <text x="150" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">
      Eigenvector Transformation
    </text>
    
    <!-- Coordinate system -->
    <line x1="0" y1="150" x2="250" y2="150" stroke="#bdc3c7" stroke-width="1" marker-end="url(#arrowhead)"/>
    <line x1="125" y1="250" x2="125" y2="50" stroke="#bdc3c7" stroke-width="1" marker-end="url(#arrowhead)"/>
    
    <!-- Grid -->
    <rect x="0" y="50" width="250" height="200" fill="url(#grid)"/>
    
    <!-- Original eigenvector -->
    <line x1="125" y1="150" x2="200" y2="100" stroke="#27ae60" stroke-width="4" marker-end="url(#arrowhead)"/>
    <text x="210" y="95" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#27ae60">v (eigenvector)</text>
    
    <!-- Matrix transformation -->
    <g transform="translate(60, 270)">
      <rect x="0" y="0" width="40" height="40" fill="#ecf0f1" stroke="#2c3e50" stroke-width="1"/>
      <text x="5" y="15" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">2</text>
      <text x="25" y="15" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">1</text>
      <text x="5" y="35" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">1</text>
      <text x="25" y="35" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">3</text>
      
      <text x="50" y="25" font-family="Arial, sans-serif" font-size="16" fill="#2c3e50">×</text>
      
      <rect x="70" y="10" width="20" height="20" fill="#ecf0f1" stroke="#2c3e50" stroke-width="1"/>
      <text x="75" y="25" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">3</text>
      <text x="75" y="35" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">-2</text>
      
      <text x="100" y="25" font-family="Arial, sans-serif" font-size="16" fill="#2c3e50">=</text>
      
      <rect x="120" y="10" width="25" height="20" fill="#27ae60" stroke="#2c3e50" stroke-width="1"/>
      <text x="125" y="25" font-family="Arial, sans-serif" font-size="9" fill="white">2.5×3</text>
      <text x="125" y="35" font-family="Arial, sans-serif" font-size="9" fill="white">2.5×-2</text>
    </g>
    
    <!-- Transformed eigenvector (scaled, same direction) -->
    <line x1="125" y1="150" x2="225" y2="75" stroke="#27ae60" stroke-width="6" marker-end="url(#arrowhead)" opacity="0.7"/>
    <text x="235" y="70" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#27ae60">λv</text>
    
    <!-- Same direction indication -->
    <text x="130" y="115" font-family="Arial, sans-serif" font-size="11" fill="#27ae60">Same direction!</text>
    <text x="130" y="130" font-family="Arial, sans-serif" font-size="11" fill="#27ae60">Only magnitude changes</text>
  </g>
  
  <!-- Mathematical formula box -->
  <g transform="translate(150, 380)">
    <rect x="0" y="0" width="500" height="80" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2" rx="10"/>
    <text x="250" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">
      Eigenvector Definition
    </text>
    
    <text x="250" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#2c3e50">
      A v = λ v
    </text>
    
    <text x="50" y="65" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">
      Where: A = matrix, v = eigenvector, λ = eigenvalue (scaling factor)
    </text>
  </g>
  
  <!-- Key insight box -->
  <g transform="translate(50, 50)">
    <rect x="0" y="0" width="250" height="25" fill="#fff3cd" stroke="#ffc107" stroke-width="1" rx="5"/>
    <text x="125" y="17" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#856404">
      🔑 Key Insight: Eigenvectors preserve direction
    </text>
  </g>
  
  <!-- Legend -->
  <g transform="translate(580, 350)">
    <rect x="0" y="0" width="180" height="90" fill="#ffffff" stroke="#bdc3c7" stroke-width="1" rx="5"/>
    <text x="90" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">
      Legend
    </text>
    
    <line x1="10" y1="35" x2="30" y2="35" stroke="#3498db" stroke-width="3"/>
    <text x="35" y="39" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Original vector</text>
    
    <line x1="10" y1="50" x2="30" y2="50" stroke="#e74c3c" stroke-width="3"/>
    <text x="35" y="54" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Transformed vector</text>
    
    <line x1="10" y1="65" x2="30" y2="65" stroke="#27ae60" stroke-width="3"/>
    <text x="35" y="69" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Eigenvector</text>
    
    <text x="10" y="85" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">λ = eigenvalue</text>
  </g>
</svg>