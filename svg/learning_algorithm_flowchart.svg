<svg viewBox="0 0 1400 1100" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="700" y="40" font-size="28" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Learning Graphical Models: Methods and Algorithms
  </text>
  
  <!-- Background -->
  <rect x="30" y="70" width="1340" height="1000" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2" rx="10"/>
  
  <!-- Method 1: Inverse Covariance (Gaussian) -->
  <g transform="translate(80, 120)">
    <rect x="0" y="0" width="380" height="450" fill="#e8f5e9" stroke="#4caf50" stroke-width="3" rx="10"/>
    <text x="190" y="35" font-size="20" font-weight="bold" text-anchor="middle" fill="#2e7d32">Method 1: Inverse Covariance</text>
    <text x="190" y="55" font-size="14" text-anchor="middle" fill="#2e7d32">(Gaussian Graphical Models)</text>
    
    <!-- Flowchart steps -->
    <!-- Step 1 -->
    <g transform="translate(190, 90)">
      <rect x="-160" y="0" width="320" height="50" fill="#4caf50" stroke="#388e3c" stroke-width="2" rx="5"/>
      <text x="0" y="20" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Input: Data samples X</text>
      <text x="0" y="38" font-size="12" text-anchor="middle" fill="white">(n samples × p variables)</text>
    </g>
    
    <!-- Arrow -->
    <path d="M 190,150 L 190,170" fill="none" stroke="#2e7d32" stroke-width="3" marker-end="url(#arrowhead-green)"/>
    
    <!-- Step 2 -->
    <g transform="translate(190, 180)">
      <rect x="-160" y="0" width="320" height="50" fill="white" stroke="#4caf50" stroke-width="2" rx="5"/>
      <text x="0" y="20" font-size="13" font-weight="bold" text-anchor="middle" fill="#2e7d32">Estimate Covariance Matrix</text>
      <text x="0" y="38" font-size="12" text-anchor="middle" fill="#2e7d32">Σ = (1/n) X^T X</text>
    </g>
    
    <!-- Arrow -->
    <path d="M 190,240 L 190,260" fill="none" stroke="#2e7d32" stroke-width="3" marker-end="url(#arrowhead-green)"/>
    
    <!-- Step 3 -->
    <g transform="translate(190, 270)">
      <rect x="-160" y="0" width="320" height="50" fill="white" stroke="#4caf50" stroke-width="2" rx="5"/>
      <text x="0" y="20" font-size="13" font-weight="bold" text-anchor="middle" fill="#2e7d32">Compute Precision Matrix</text>
      <text x="0" y="38" font-size="12" text-anchor="middle" fill="#2e7d32">Θ = Σ⁻¹</text>
    </g>
    
    <!-- Arrow -->
    <path d="M 190,330 L 190,350" fill="none" stroke="#2e7d32" stroke-width="3" marker-end="url(#arrowhead-green)"/>
    
    <!-- Step 4 -->
    <g transform="translate(190, 360)">
      <rect x="-160" y="0" width="320" height="60" fill="white" stroke="#4caf50" stroke-width="2" rx="5"/>
      <text x="0" y="20" font-size="13" font-weight="bold" text-anchor="middle" fill="#2e7d32">Identify Edges</text>
      <text x="0" y="38" font-size="11" text-anchor="middle" fill="#2e7d32">If |Θᵢⱼ| > threshold → Add edge</text>
      <text x="0" y="52" font-size="11" text-anchor="middle" fill="#2e7d32">If |Θᵢⱼ| ≈ 0 → No edge</text>
    </g>
    
  </g>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#2e7d32"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#1565c0"/>
    </marker>
    <marker id="arrowhead-purple" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#6a1b9a"/>
    </marker>
  </defs>
  
  <!-- Method 2: Greedy Forward Selection -->
  <g transform="translate(510, 120)">
    <rect x="0" y="0" width="400" height="450" fill="#e3f2fd" stroke="#2196f3" stroke-width="3" rx="10"/>
    <text x="200" y="35" font-size="20" font-weight="bold" text-anchor="middle" fill="#1565c0">Method 2: Greedy Selection</text>
    <text x="200" y="55" font-size="14" text-anchor="middle" fill="#1565c0">(Ising &amp; Gaussian Models)</text>
    
    <!-- Step 1 -->
    <g transform="translate(200, 90)">
      <rect x="-170" y="0" width="340" height="40" fill="#2196f3" stroke="#1565c0" stroke-width="2" rx="5"/>
      <text x="0" y="27" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Initialize: S = ∅ for each node i</text>
    </g>
    
    <!-- Arrow -->
    <path d="M 200,140 L 200,160" fill="none" stroke="#1565c0" stroke-width="3" marker-end="url(#arrowhead-blue)"/>
    
    <!-- Step 2 -->
    <g transform="translate(200, 170)">
      <rect x="-170" y="0" width="340" height="55" fill="white" stroke="#2196f3" stroke-width="2" rx="5"/>
      <text x="0" y="20" font-size="13" font-weight="bold" text-anchor="middle" fill="#1565c0">Forward Selection</text>
      <text x="0" y="38" font-size="11" text-anchor="middle" fill="#1565c0">Add j with max I(Xᵢ; Xⱼ | X_S)</text>
      <text x="0" y="52" font-size="11" text-anchor="middle" fill="#1565c0">S ← S ∪ {j}</text>
    </g>
    
    <!-- Arrow -->
    <path d="M 200,235 L 200,255" fill="none" stroke="#1565c0" stroke-width="3" marker-end="url(#arrowhead-blue)"/>
    
    <!-- Decision diamond -->
    <g transform="translate(200, 285)">
      <path d="M 0,-35 L 80,0 L 0,35 L -80,0 Z" fill="#fff9c4" stroke="#fbc02d" stroke-width="2"/>
      <text x="0" y="-8" font-size="12" font-weight="bold" text-anchor="middle" fill="#f57f17">Stop</text>
      <text x="0" y="8" font-size="11" text-anchor="middle" fill="#f57f17">Criterion?</text>
    </g>
    
    <!-- Loop back arrow -->
    <path d="M 280,285 Q 340,285 340,205 L 340,205 Q 340,170 310,170" fill="none" stroke="#1565c0" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowhead-blue)"/>
    <text x="345" y="230" font-size="11" fill="#1565c0">No</text>
    
    <!-- Continue arrow -->
    <path d="M 200,320 L 200,345" fill="none" stroke="#1565c0" stroke-width="3" marker-end="url(#arrowhead-blue)"/>
    <text x="215" y="335" font-size="11" fill="#1565c0">Yes</text>
    
    <!-- Step 3 -->
    <g transform="translate(200, 355)">
      <rect x="-170" y="0" width="340" height="55" fill="white" stroke="#2196f3" stroke-width="2" rx="5"/>
      <text x="0" y="20" font-size="13" font-weight="bold" text-anchor="middle" fill="#1565c0">Backward Pruning</text>
      <text x="0" y="38" font-size="11" text-anchor="middle" fill="#1565c0">For j ∈ S: If Xᵢ ⊥⊥ Xⱼ | X_S\{j}</text>
      <text x="0" y="52" font-size="11" text-anchor="middle" fill="#1565c0">Remove j from S</text>
    </g>
  </g>
  
  <!-- Method 3: Graphical Lasso -->
  <g transform="translate(960, 120)">
    <rect x="0" y="0" width="380" height="450" fill="#f3e5f5" stroke="#9c27b0" stroke-width="3" rx="10"/>
    <text x="190" y="35" font-size="20" font-weight="bold" text-anchor="middle" fill="#6a1b9a">Method 3: Graphical Lasso</text>
    <text x="190" y="55" font-size="14" text-anchor="middle" fill="#6a1b9a">(ℓ₁-Regularized Estimation)</text>
    
    <!-- Step 1 -->
    <g transform="translate(190, 90)">
      <rect x="-160" y="0" width="320" height="50" fill="#9c27b0" stroke="#7b1fa2" stroke-width="2" rx="5"/>
      <text x="0" y="20" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Input: Data X, λ parameter</text>
      <text x="0" y="38" font-size="12" text-anchor="middle" fill="white">(λ controls sparsity)</text>
    </g>
    
    <!-- Arrow -->
    <path d="M 190,150 L 190,170" fill="none" stroke="#6a1b9a" stroke-width="3" marker-end="url(#arrowhead-purple)"/>
    
    <!-- Step 2 -->
    <g transform="translate(190, 180)">
      <rect x="-160" y="0" width="320" height="50" fill="white" stroke="#9c27b0" stroke-width="2" rx="5"/>
      <text x="0" y="20" font-size="13" font-weight="bold" text-anchor="middle" fill="#6a1b9a">Compute Sample Covariance</text>
      <text x="0" y="38" font-size="12" text-anchor="middle" fill="#6a1b9a">S = (1/n) X^T X</text>
    </g>
    
    <!-- Arrow -->
    <path d="M 190,240 L 190,260" fill="none" stroke="#6a1b9a" stroke-width="3" marker-end="url(#arrowhead-purple)"/>
    
    <!-- Step 3 -->
    <g transform="translate(190, 270)">
      <rect x="-160" y="0" width="320" height="70" fill="white" stroke="#9c27b0" stroke-width="2" rx="5"/>
      <text x="0" y="18" font-size="13" font-weight="bold" text-anchor="middle" fill="#6a1b9a">Solve Optimization</text>
      <text x="0" y="36" font-size="11" text-anchor="middle" fill="#6a1b9a">minimize:</text>
      <text x="0" y="52" font-size="11" text-anchor="middle" fill="#6a1b9a">-log det(Θ) + tr(SΘ) + λ||Θ||₁</text>
      <text x="0" y="66" font-size="10" text-anchor="middle" fill="#6a1b9a">(Coordinate descent algorithm)</text>
    </g>
    
    <!-- Arrow -->
    <path d="M 190,350 L 190,370" fill="none" stroke="#6a1b9a" stroke-width="3" marker-end="url(#arrowhead-purple)"/>
    
    <!-- Step 4 -->
    <g transform="translate(190, 380)">
      <rect x="-160" y="0" width="320" height="40" fill="white" stroke="#9c27b0" stroke-width="2" rx="5"/>
      <text x="0" y="18" font-size="13" font-weight="bold" text-anchor="middle" fill="#6a1b9a">Extract Graph Structure</text>
      <text x="0" y="34" font-size="11" text-anchor="middle" fill="#6a1b9a">Θᵢⱼ ≠ 0 → Edge (i,j) exists</text>
    </g>
  </g>
  
  <!-- Comparison Table -->
  <g transform="translate(80, 620)">
    <rect x="0" y="0" width="1260" height="420" fill="white" stroke="#34495e" stroke-width="3" rx="10"/>
    <text x="630" y="35" font-size="22" font-weight="bold" text-anchor="middle" fill="#2c3e50">Method Comparison</text>
    
    <!-- Table headers -->
    <g transform="translate(50, 60)">
      <rect x="0" y="0" width="250" height="40" fill="#34495e" stroke="#2c3e50" stroke-width="1"/>
      <text x="125" y="27" font-size="15" font-weight="bold" text-anchor="middle" fill="white">Method</text>
      
      <rect x="250" y="0" width="280" height="40" fill="#34495e" stroke="#2c3e50" stroke-width="1"/>
      <text x="390" y="27" font-size="15" font-weight="bold" text-anchor="middle" fill="white">Advantages</text>
      
      <rect x="530" y="0" width="280" height="40" fill="#34495e" stroke="#2c3e50" stroke-width="1"/>
      <text x="670" y="27" font-size="15" font-weight="bold" text-anchor="middle" fill="white">Disadvantages</text>
      
      <rect x="810" y="0" width="350" height="40" fill="#34495e" stroke="#2c3e50" stroke-width="1"/>
      <text x="985" y="27" font-size="15" font-weight="bold" text-anchor="middle" fill="white">Best For</text>
    </g>
    
    <!-- Row 1: Inverse Covariance -->
    <g transform="translate(50, 100)">
      <rect x="0" y="0" width="250" height="90" fill="#e8f5e9" stroke="#2c3e50" stroke-width="1"/>
      <text x="125" y="30" font-size="14" font-weight="bold" text-anchor="middle" fill="#2e7d32">Inverse</text>
      <text x="125" y="50" font-size="14" font-weight="bold" text-anchor="middle" fill="#2e7d32">Covariance</text>
      <text x="125" y="70" font-size="12" text-anchor="middle" fill="#2e7d32">(Gaussian)</text>
      
      <rect x="250" y="0" width="280" height="90" fill="#f1f8f4" stroke="#2c3e50" stroke-width="1"/>
      <text x="260" y="20" font-size="12" fill="#2e7d32">• Simple &amp; direct</text>
      <text x="260" y="40" font-size="12" fill="#2e7d32">• Exact solution</text>
      <text x="260" y="60" font-size="12" fill="#2e7d32">• Well-understood</text>
      <text x="260" y="80" font-size="12" fill="#2e7d32">• Fast computation</text>
      
      <rect x="530" y="0" width="280" height="90" fill="#f1f8f4" stroke="#2c3e50" stroke-width="1"/>
      <text x="540" y="20" font-size="12" fill="#c0392b">• Matrix inversion needed</text>
      <text x="540" y="40" font-size="12" fill="#c0392b">• Sensitive to n &lt; p</text>
      <text x="540" y="60" font-size="12" fill="#c0392b">• No automatic sparsity</text>
      <text x="540" y="80" font-size="12" fill="#c0392b">• Threshold selection</text>
      
      <rect x="810" y="0" width="350" height="90" fill="#f1f8f4" stroke="#2c3e50" stroke-width="1"/>
      <text x="820" y="25" font-size="12" fill="#2c3e50">• Small-medium Gaussian</text>
      <text x="820" y="45" font-size="12" fill="#2c3e50">• n &gt;&gt; p scenarios</text>
      <text x="820" y="65" font-size="12" fill="#2c3e50">• Exploratory analysis</text>
    </g>
    
    <!-- Row 2: Greedy Selection -->
    <g transform="translate(50, 190)">
      <rect x="0" y="0" width="250" height="90" fill="#e3f2fd" stroke="#2c3e50" stroke-width="1"/>
      <text x="125" y="30" font-size="14" font-weight="bold" text-anchor="middle" fill="#1565c0">Greedy</text>
      <text x="125" y="50" font-size="14" font-weight="bold" text-anchor="middle" fill="#1565c0">Forward</text>
      <text x="125" y="70" font-size="12" text-anchor="middle" fill="#1565c0">(Ising &amp; Gaussian)</text>
      
      <rect x="250" y="0" width="280" height="90" fill="#f5f9fc" stroke="#2c3e50" stroke-width="1"/>
      <text x="260" y="20" font-size="12" fill="#1565c0">• Very fast &amp; scalable</text>
      <text x="260" y="40" font-size="12" fill="#1565c0">• Large graphs (p large)</text>
      <text x="260" y="60" font-size="12" fill="#1565c0">• Works for Ising</text>
      <text x="260" y="80" font-size="12" fill="#1565c0">• Incorporates domain</text>
      
      <rect x="530" y="0" width="280" height="90" fill="#f5f9fc" stroke="#2c3e50" stroke-width="1"/>
      <text x="540" y="20" font-size="12" fill="#c0392b">• Heuristic approach</text>
      <text x="540" y="40" font-size="12" fill="#c0392b">• No optimality guarantee</text>
      <text x="540" y="60" font-size="12" fill="#c0392b">• Order-dependent</text>
      <text x="540" y="80" font-size="12" fill="#c0392b">• May miss edges</text>
      
      <rect x="810" y="0" width="350" height="90" fill="#f5f9fc" stroke="#2c3e50" stroke-width="1"/>
      <text x="820" y="25" font-size="12" fill="#2c3e50">• Large-scale networks</text>
      <text x="820" y="45" font-size="12" fill="#2c3e50">• Ising model learning</text>
      <text x="820" y="65" font-size="12" fill="#2c3e50">• Practical applications</text>
    </g>
    
    <!-- Row 3: Graphical Lasso -->
    <g transform="translate(50, 280)">
      <rect x="0" y="0" width="250" height="90" fill="#f3e5f5" stroke="#2c3e50" stroke-width="1"/>
      <text x="125" y="30" font-size="14" font-weight="bold" text-anchor="middle" fill="#6a1b9a">Graphical</text>
      <text x="125" y="50" font-size="14" font-weight="bold" text-anchor="middle" fill="#6a1b9a">Lasso</text>
      <text x="125" y="70" font-size="12" text-anchor="middle" fill="#6a1b9a">(ℓ₁-Regularized)</text>
      
      <rect x="250" y="0" width="280" height="90" fill="#faf7fb" stroke="#2c3e50" stroke-width="1"/>
      <text x="260" y="20" font-size="12" fill="#6a1b9a">• Principled approach</text>
      <text x="260" y="40" font-size="12" fill="#6a1b9a">• Automatic sparsity</text>
      <text x="260" y="60" font-size="12" fill="#6a1b9a">• Handles n &lt; p</text>
      <text x="260" y="80" font-size="12" fill="#6a1b9a">• Convex optimization</text>
      
      <rect x="530" y="0" width="280" height="90" fill="#faf7fb" stroke="#2c3e50" stroke-width="1"/>
      <text x="540" y="20" font-size="12" fill="#c0392b">• Computational cost</text>
      <text x="540" y="40" font-size="12" fill="#c0392b">• Tuning λ required</text>
      <text x="540" y="60" font-size="12" fill="#c0392b">• Only for Gaussian</text>
      <text x="540" y="80" font-size="12" fill="#c0392b">• Bias in estimates</text>
      
      <rect x="810" y="0" width="350" height="90" fill="#faf7fb" stroke="#2c3e50" stroke-width="1"/>
      <text x="820" y="25" font-size="12" fill="#2c3e50">• High-dim Gaussian (n&lt;p)</text>
      <text x="820" y="45" font-size="12" fill="#2c3e50">• Sparse networks</text>
      <text x="820" y="65" font-size="12" fill="#2c3e50">• Genomics, finance</text>
    </g>
  </g>
</svg>