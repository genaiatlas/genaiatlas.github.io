<svg viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1400" height="900" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="700" y="60" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#1e293b" text-anchor="middle">AI-Assisted Coding Modalities</text>
  <text x="700" y="95" font-family="Arial, sans-serif" font-size="18" fill="#64748b" text-anchor="middle">Three Complementary Approaches to AI-Enhanced Development</text>
  
  <!-- In-Editor Assistance -->
  <g transform="translate(100, 150)">
    <rect width="360" height="550" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="3"/>
    
    <!-- Icon -->
    <circle cx="180" cy="60" r="35" fill="#3b82f6"/>
    <text x="180" y="72" font-family="Arial, sans-serif" font-size="32" fill="white" text-anchor="middle">💻</text>
    
    <!-- Title -->
    <text x="180" y="135" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1e40af" text-anchor="middle">In-Editor</text>
    <text x="180" y="160" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1e40af" text-anchor="middle">Assistance</text>
    
    <!-- Features -->
    <g transform="translate(30, 200)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">Key Features:</text>
      
      <circle cx="10" cy="35" r="4" fill="#3b82f6"/>
      <text x="25" y="40" font-family="Arial, sans-serif" font-size="14" fill="#334155">Chat to plan &amp; understand</text>
      
      <circle cx="10" cy="75" r="4" fill="#3b82f6"/>
      <text x="25" y="80" font-family="Arial, sans-serif" font-size="14" fill="#334155">Real-time code completion</text>
      
      <circle cx="10" cy="115" r="4" fill="#3b82f6"/>
      <text x="25" y="120" font-family="Arial, sans-serif" font-size="14" fill="#334155">Request edits &amp; snippets</text>
      
      <circle cx="10" cy="155" r="4" fill="#3b82f6"/>
      <text x="25" y="160" font-family="Arial, sans-serif" font-size="14" fill="#334155">Developer control</text>
      
      <text x="0" y="210" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">Use Case:</text>
      <text x="0" y="240" font-family="Arial, sans-serif" font-size="14" fill="#475569">"Pair-programmer"</text>
      <text x="0" y="265" font-family="Arial, sans-serif" font-size="14" fill="#475569">experience for</text>
      <text x="0" y="290" font-family="Arial, sans-serif" font-size="14" fill="#475569">accelerating routine</text>
      <text x="0" y="315" font-family="Arial, sans-serif" font-size="14" fill="#475569">coding tasks</text>
    </g>
  </g>
  
  <!-- Analysis & Review -->
  <g transform="translate(520, 150)">
    <rect width="360" height="550" rx="12" fill="#ddd6fe" stroke="#8b5cf6" stroke-width="3"/>
    
    <!-- Icon -->
    <circle cx="180" cy="60" r="35" fill="#8b5cf6"/>
    <text x="180" y="72" font-family="Arial, sans-serif" font-size="32" fill="white" text-anchor="middle">🔍</text>
    
    <!-- Title -->
    <text x="180" y="135" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#5b21b6" text-anchor="middle">Analysis &amp;</text>
    <text x="180" y="160" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#5b21b6" text-anchor="middle">Review</text>
    
    <!-- Features -->
    <g transform="translate(30, 200)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">Key Features:</text>
      
      <circle cx="10" cy="35" r="4" fill="#8b5cf6"/>
      <text x="25" y="40" font-family="Arial, sans-serif" font-size="14" fill="#334155">Review PRs &amp; changesets</text>
      
      <circle cx="10" cy="75" r="4" fill="#8b5cf6"/>
      <text x="25" y="80" font-family="Arial, sans-serif" font-size="14" fill="#334155">Audit codebase sections</text>
      
      <circle cx="10" cy="115" r="4" fill="#8b5cf6"/>
      <text x="25" y="120" font-family="Arial, sans-serif" font-size="14" fill="#334155">Validate requirements</text>
      
      <circle cx="10" cy="155" r="4" fill="#8b5cf6"/>
      <text x="25" y="160" font-family="Arial, sans-serif" font-size="14" fill="#334155">Generate documentation</text>
      
      <text x="0" y="210" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">Use Case:</text>
      <text x="0" y="240" font-family="Arial, sans-serif" font-size="14" fill="#475569">Tireless teammate</text>
      <text x="0" y="265" font-family="Arial, sans-serif" font-size="14" fill="#475569">maintaining quality</text>
      <text x="0" y="290" font-family="Arial, sans-serif" font-size="14" fill="#475569">without slowing</text>
      <text x="0" y="315" font-family="Arial, sans-serif" font-size="14" fill="#475569">development</text>
    </g>
  </g>
  
  <!-- Agentic & Autonomous -->
  <g transform="translate(940, 150)">
    <rect width="360" height="550" rx="12" fill="#fce7f3" stroke="#ec4899" stroke-width="3"/>
    
    <!-- Icon -->
    <circle cx="180" cy="60" r="35" fill="#ec4899"/>
    <text x="180" y="72" font-family="Arial, sans-serif" font-size="32" fill="white" text-anchor="middle">🤖</text>
    
    <!-- Title -->
    <text x="180" y="135" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#9f1239" text-anchor="middle">Agentic &amp;</text>
    <text x="180" y="160" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#9f1239" text-anchor="middle">Autonomous</text>
    
    <!-- Features -->
    <g transform="translate(30, 200)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">Key Features:</text>
      
      <circle cx="10" cy="35" r="4" fill="#ec4899"/>
      <text x="25" y="40" font-family="Arial, sans-serif" font-size="14" fill="#334155">End-to-end features</text>
      
      <circle cx="10" cy="75" r="4" fill="#ec4899"/>
      <text x="25" y="80" font-family="Arial, sans-serif" font-size="14" fill="#334155">DevOps operations</text>
      
      <circle cx="10" cy="115" r="4" fill="#ec4899"/>
      <text x="25" y="120" font-family="Arial, sans-serif" font-size="14" fill="#334155">CI/CD integration</text>
      
      <circle cx="10" cy="155" r="4" fill="#ec4899"/>
      <text x="25" y="160" font-family="Arial, sans-serif" font-size="14" fill="#334155">Multi-file refactoring</text>
      
      <text x="0" y="210" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">Use Case:</text>
      <text x="0" y="240" font-family="Arial, sans-serif" font-size="14" fill="#475569">Delegate multi-step</text>
      <text x="0" y="265" font-family="Arial, sans-serif" font-size="14" fill="#475569">tasks spanning files</text>
      <text x="0" y="290" font-family="Arial, sans-serif" font-size="14" fill="#475569">and systems with</text>
      <text x="0" y="315" font-family="Arial, sans-serif" font-size="14" fill="#475569">minimal intervention</text>
    </g>
  </g>
  
  <!-- Bottom Arrow Flow -->
  <g transform="translate(100, 730)">
    <text x="600" y="20" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1e293b" text-anchor="middle">Modes are Additive and Complementary</text>
    
    <!-- Flow arrows -->
    <line x1="180" y1="50" x2="420" y2="50" stroke="#64748b" stroke-width="3" marker-end="url(#arrowhead)"/>
    <line x1="600" y1="50" x2="840" y2="50" stroke="#64748b" stroke-width="3" marker-end="url(#arrowhead)"/>
    <line x1="1020" y1="50" x2="1180" y2="50" stroke="#64748b" stroke-width="3" marker-end="url(#arrowhead)"/>
    
    <text x="180" y="45" font-family="Arial, sans-serif" font-size="14" fill="#475569" text-anchor="middle">Draft</text>
    <text x="600" y="45" font-family="Arial, sans-serif" font-size="14" fill="#475569" text-anchor="middle">Propagate</text>
    <text x="1020" y="45" font-family="Arial, sans-serif" font-size="14" fill="#475569" text-anchor="middle">Automate</text>
    
    <text x="300" y="85" font-family="Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">→ Agent refactors</text>
    <text x="720" y="85" font-family="Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">→ CI validates</text>
    <text x="1100" y="85" font-family="Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">→ Deploy</text>
  </g>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#64748b"/>
    </marker>
  </defs>
</svg>