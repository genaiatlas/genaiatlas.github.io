<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title-text { font-family: 'Arial', sans-serif; font-size: 24px; font-weight: bold; fill: #2c3e50; }
      .subtitle-text { font-family: 'Arial', sans-serif; font-size: 18px; font-weight: bold; fill: #34495e; }
      .label-text { font-family: 'Arial', sans-serif; font-size: 14px; fill: #34495e; }
      .small-text { font-family: 'Arial', sans-serif; font-size: 12px; fill: #7f8c8d; }
      .question-box { fill: #fff3cd; stroke: #ffc107; stroke-width: 2; rx: 10; }
      .method-box { fill: #e3f2fd; stroke: #2196f3; stroke-width: 2; rx: 10; }
      .metric-box { fill: #e8f5e8; stroke: #28a745; stroke-width: 2; rx: 10; }
      .flow-arrow { stroke: #6c757d; stroke-width: 2; fill: #6c757d; }
    </style>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title-text">Performance Assessment Framework</text>
  
  <!-- Three Key Questions -->
  <g transform="translate(50, 70)">
    <text x="350" y="0" text-anchor="middle" class="subtitle-text">Critical Questions for Model Evaluation</text>
    
    <!-- Question 1: Trust -->
    <g transform="translate(0, 30)">
      <rect x="0" y="0" width="220" height="100" class="question-box"/>
      <text x="110" y="25" text-anchor="middle" class="label-text" fill="#856404">❓ Trust &amp; Reliability</text>
      <text x="20" y="50" class="small-text">How much do we trust</text>
      <text x="20" y="65" class="small-text">our predictions?</text>
      <text x="20" y="85" class="small-text">→ Model confidence</text>
    </g>
    
    <!-- Question 2: Insights -->
    <g transform="translate(240, 30)">
      <rect x="0" y="0" width="220" height="100" class="question-box"/>
      <text x="110" y="25" text-anchor="middle" class="label-text" fill="#856404">❓ Model Insights</text>
      <text x="20" y="50" class="small-text">What can we learn</text>
      <text x="20" y="65" class="small-text">from the model?</text>
      <text x="20" y="85" class="small-text">→ Interpretability</text>
    </g>
    
    <!-- Question 3: Accuracy -->
    <g transform="translate(480, 30)">
      <rect x="0" y="0" width="220" height="100" class="question-box"/>
      <text x="110" y="25" text-anchor="middle" class="label-text" fill="#856404">❓ Parameter Accuracy</text>
      <text x="20" y="50" class="small-text">How accurate are</text>
      <text x="20" y="65" class="small-text">our estimates?</text>
      <text x="20" y="85" class="small-text">→ Statistical inference</text>
    </g>
  </g>
  
  <!-- Assessment Methods -->
  <g transform="translate(50, 210)">
    <text x="350" y="0" text-anchor="middle" class="subtitle-text">Assessment Methodology</text>
    
    <!-- Goodness of Fit -->
    <g transform="translate(0, 30)">
      <rect x="0" y="0" width="160" height="120" class="method-box"/>
      <text x="80" y="25" text-anchor="middle" class="label-text" fill="#1976d2">Goodness of Fit</text>
      <text x="20" y="50" class="small-text">• R-squared</text>
      <text x="20" y="65" class="small-text">• Adjusted R²</text>
      <text x="20" y="80" class="small-text">• F-statistic</text>
      <text x="20" y="95" class="small-text">• Model comparison</text>
      <text x="20" y="110" class="small-text">• Effect size</text>
    </g>
    
    <!-- Residual Analysis -->
    <g transform="translate(180, 30)">
      <rect x="0" y="0" width="160" height="120" class="method-box"/>
      <text x="80" y="25" text-anchor="middle" class="label-text" fill="#1976d2">Residual Analysis</text>
      <text x="20" y="50" class="small-text">• Error patterns</text>
      <text x="20" y="65" class="small-text">• Normality tests</text>
      <text x="20" y="80" class="small-text">• Homoscedasticity</text>
      <text x="20" y="95" class="small-text">• Independence</text>
      <text x="20" y="110" class="small-text">• Outlier detection</text>
    </g>
    
    <!-- Cross-Validation -->
    <g transform="translate(360, 30)">
      <rect x="0" y="0" width="160" height="120" class="method-box"/>
      <text x="80" y="25" text-anchor="middle" class="label-text" fill="#1976d2">Cross-Validation</text>
      <text x="20" y="50" class="small-text">• Out-of-sample R²</text>
      <text x="20" y="65" class="small-text">• K-fold validation</text>
      <text x="20" y="80" class="small-text">• Train/test split</text>
      <text x="20" y="95" class="small-text">• Generalization</text>
      <text x="20" y="110" class="small-text">• Overfitting check</text>
    </g>
    
    <!-- Statistical Inference -->
    <g transform="translate(540, 30)">
      <rect x="0" y="0" width="160" height="120" class="method-box"/>
      <text x="80" y="25" text-anchor="middle" class="label-text" fill="#1976d2">Statistical Inference</text>
      <text x="20" y="50" class="small-text">• Confidence intervals</text>
      <text x="20" y="65" class="small-text">• Hypothesis tests</text>
      <text x="20" y="80" class="small-text">• p-values</text>
      <text x="20" y="95" class="small-text">• Parameter significance</text>
      <text x="20" y="110" class="small-text">• Model assumptions</text>
    </g>
  </g>
  
  <!-- R² as Primary Metric -->
  <g transform="translate(200, 390)">
    <rect x="0" y="0" width="400" height="120" class="metric-box"/>
    <text x="200" y="25" text-anchor="middle" class="subtitle-text" fill="#155724">R² as Primary Performance Metric</text>
    
    <text x="50" y="55" class="label-text" fill="#155724">Key Properties:</text>
    <text x="60" y="75" class="small-text">• Single number summary of model quality</text>
    <text x="60" y="90" class="small-text">• Intuitive interpretation (% variance explained)</text>
    <text x="60" y="105" class="small-text">• Standardized scale (0 to 1)</text>
  </g>
  
  <!-- Assessment Flow -->
  <g transform="translate(400, 170)">
    <!-- Down arrow -->
    <path d="M 0 0 L 0 20 L -5 15 M 0 20 L 5 15" class="flow-arrow"/>
  </g>
  
  <g transform="translate(400, 350)">
    <!-- Down arrow -->
    <path d="M 0 0 L 0 20 L -5 15 M 0 20 L 5 15" class="flow-arrow"/>
  </g>
  
  <!-- Final Decision Framework -->
  <g transform="translate(50, 530)">
    <text x="350" y="0" text-anchor="middle" class="subtitle-text">Decision Framework</text>
    
    <text x="100" y="30" class="small-text">High R² + Good Diagnostics → Trust Model</text>
    <text x="100" y="45" class="small-text">High R² + Poor Diagnostics → Investigate Further</text>
    <text x="100" y="60" class="small-text">Low R² + Good Diagnostics → Consider More Variables</text>
  </g>
</svg>