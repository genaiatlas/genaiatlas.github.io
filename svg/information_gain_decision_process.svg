<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="processGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2196F3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#42A5F5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="featureGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF9800;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFB74D;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="resultGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#66BB6A;stop-opacity:1" />
    </linearGradient>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
     refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="2" flood-color="#00000030"/>
    </filter>
  </defs>
  
  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#333">
    Information Gain Decision Process
  </text>
  
  <!-- Original Dataset -->
  <g transform="translate(420, 60)">
    <rect x="0" y="0" width="160" height="100" rx="10" fill="url(#processGrad)" stroke="#333" stroke-width="2" filter="url(#shadow)"/>
    <text x="80" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
      Original Dataset
    </text>
    <text x="80" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
      n = 12 samples
    </text>
    <text x="80" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
      6 wait, 6 leave
    </text>
    <text x="80" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFE082">
      H(S) = 1.0
    </text>
  </g>
  
  <!-- Arrow down -->
  <line x1="500" y1="170" x2="500" y2="220" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Feature Evaluation Section -->
  <g transform="translate(50, 230)">
    <rect x="0" y="0" width="900" height="150" rx="15" fill="#F5F5F5" stroke="#666" stroke-width="2"/>
    <text x="450" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#333">
      Feature Evaluation Phase
    </text>
    
    <!-- Feature 1: Alternative -->
    <g transform="translate(50, 40)">
      <rect x="0" y="0" width="200" height="90" rx="8" fill="url(#featureGrad)" stroke="#333" stroke-width="1"/>
      <text x="100" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">
        Feature: Alternative
      </text>
      
      <!-- Split visualization -->
      <rect x="20" y="30" width="70" height="40" fill="white" rx="3"/>
      <text x="55" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">Yes: 6</text>
      <text x="55" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">3+, 3-</text>
      <text x="55" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="8">H=1.0</text>
      
      <rect x="110" y="30" width="70" height="40" fill="white" rx="3"/>
      <text x="145" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">No: 6</text>
      <text x="145" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">3+, 3-</text>
      <text x="145" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="8">H=1.0</text>
      
      <text x="100" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">
        IG = 0.00
      </text>
    </g>
    
    <!-- Feature 2: Friday -->
    <g transform="translate(280, 40)">
      <rect x="0" y="0" width="200" height="90" rx="8" fill="url(#featureGrad)" stroke="#333" stroke-width="1"/>
      <text x="100" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">
        Feature: Friday
      </text>
      
      <!-- Split visualization -->
      <rect x="20" y="30" width="70" height="40" fill="white" rx="3"/>
      <text x="55" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">Yes: 5</text>
      <text x="55" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">2+, 3-</text>
      <text x="55" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="8">H=0.97</text>
      
      <rect x="110" y="30" width="70" height="40" fill="white" rx="3"/>
      <text x="145" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">No: 7</text>
      <text x="145" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">4+, 3-</text>
      <text x="145" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="8">H=0.99</text>
      
      <text x="100" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">
        IG = 0.021
      </text>
    </g>
    
    <!-- Feature 3: Est. Time (WINNER) -->
    <g transform="translate(510, 40)">
      <rect x="0" y="0" width="200" height="90" rx="8" fill="url(#resultGrad)" stroke="#333" stroke-width="2"/>
      <text x="100" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">
        Feature: Est. Time ⭐
      </text>
      
      <!-- Split visualization -->
      <rect x="15" y="30" width="40" height="40" fill="white" rx="3"/>
      <text x="35" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="8">0-10</text>
      <text x="35" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="8">4+,0-</text>
      <text x="35" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="7">H=0</text>
      
      <rect x="60" y="30" width="40" height="40" fill="white" rx="3"/>
      <text x="80" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="8">10-30</text>
      <text x="80" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="8">1+,2-</text>
      <text x="80" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="7">H=0.9</text>
      
      <rect x="105" y="30" width="40" height="40" fill="white" rx="3"/>
      <text x="125" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="8">30-60</text>
      <text x="125" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="8">1+,1-</text>
      <text x="125" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="7">H=1.0</text>
      
      <rect x="150" y="30" width="40" height="40" fill="white" rx="3"/>
      <text x="170" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="8">>60</text>
      <text x="170" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="8">0+,3-</text>
      <text x="170" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="7">H=0</text>
      
      <text x="100" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">
        IG = 0.70
      </text>
    </g>
    
    <!-- Feature 4: Patterns -->
    <g transform="translate(740, 40)">
      <rect x="0" y="0" width="140" height="90" rx="8" fill="url(#featureGrad)" stroke="#333" stroke-width="1"/>
      <text x="70" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">
        Feature: Patterns
      </text>
      
      <!-- Split visualization -->
      <rect x="20" y="30" width="50" height="40" fill="white" rx="3"/>
      <text x="45" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">Some</text>
      <text x="45" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">5+, 2-</text>
      <text x="45" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="8">H=0.86</text>
      
      <rect x="80" y="30" width="50" height="40" fill="white" rx="3"/>
      <text x="105" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">None</text>
      <text x="105" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">1+, 4-</text>
      <text x="105" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="8">H=0.72</text>
      
      <text x="70" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">
        IG = 0.21
      </text>
    </g>
  </g>
  
  <!-- Arrow down -->
  <line x1="500" y1="390" x2="500" y2="440" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Selection Process -->
  <g transform="translate(300, 450)">
    <rect x="0" y="0" width="400" height="80" rx="12" fill="#E8F5E8" stroke="#4CAF50" stroke-width="2" filter="url(#shadow)"/>
    <text x="200" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2E7D32">
      Selection Decision
    </text>
    <text x="200" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#333">
      Choose feature with Maximum Information Gain
    </text>
    <text x="200" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2E7D32">
      Winner: Estimated Time (IG = 0.70)
    </text>
  </g>
  
  <!-- Arrow down -->
  <line x1="500" y1="540" x2="500" y2="580" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Result -->
  <g transform="translate(200, 590)">
    <rect x="0" y="0" width="600" height="80" rx="12" fill="#FFF3E0" stroke="#FF9800" stroke-width="2" filter="url(#shadow)"/>
    <text x="300" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#E65100">
      Result: Optimal Root Node Split
    </text>
    <text x="300" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">
      Split on "Estimated Time" creates most homogeneous subsets
    </text>
    <text x="300" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">
      Process repeats recursively for each subset until stopping criteria met
    </text>
  </g>
  
  <!-- Information Gain Formula Box -->
  <g transform="translate(50, 450)">
    <rect x="0" y="0" width="220" height="120" rx="8" fill="#E3F2FD" stroke="#2196F3" stroke-width="2"/>
    <text x="110" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1976D2">
      Information Gain Formula
    </text>
    <text x="110" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">
      IG(S,A) = H(S) - Σ(|Sᵥ|/|S|)H(Sᵥ)
    </text>
    <text x="110" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">
      Where:
    </text>
    <text x="110" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">
      S = original set
    </text>
    <text x="110" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">
      A = attribute/feature
    </text>
    <text x="110" y="101" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">
      Sᵥ = subset where A = v
    </text>
  </g>
  
  <!-- Greedy Algorithm Note -->
  <g transform="translate(750, 450)">
    <rect x="0" y="0" width="200" height="120" rx="8" fill="#FFEBEE" stroke="#F44336" stroke-width="2"/>
    <text x="100" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#C62828">
      Greedy Algorithm
    </text>
    <text x="100" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">
      • Locally optimal choice
    </text>
    <text x="100" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">
      • At each step, select best
    </text>
    <text x="100" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">
      • feature available
    </text>
    <text x="100" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">
      • No backtracking
    </text>
    <text x="100" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">
      • Computationally efficient
    </text>
  </g>
</svg>