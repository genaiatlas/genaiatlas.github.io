<svg width="900" height="700" viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.2"/>
    </filter>
    <pattern id="imagePattern" patternUnits="userSpaceOnUse" width="20" height="20">
      <rect width="20" height="20" fill="#ecf0f1"/>
      <rect x="5" y="5" width="10" height="10" fill="#bdc3c7"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="700" fill="url(#bgGradient)"/>
  
  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    Visualization-Based Clustering Evaluation
  </text>
  <text x="450" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#7f8c8d">
    Visual Assessment Methods for Different Data Types
  </text>
  
  <!-- 2D Data Visualization -->
  <rect x="50" y="90" width="250" height="200" rx="10" fill="#fff" stroke="#3498db" stroke-width="3" filter="url(#shadow)"/>
  <text x="175" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2980b9">
    2D/3D Data Visualization
  </text>
  
  <!-- 2D scatter plot simulation -->
  <g id="scatterPlot">
    <!-- Axes -->
    <line x1="80" y1="250" x2="270" y2="250" stroke="#34495e" stroke-width="1"/>
    <line x1="80" y1="130" x2="80" y2="250" stroke="#34495e" stroke-width="1"/>
    <text x="175" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Feature 1</text>
    <text x="65" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d" transform="rotate(-90 65 190)">Feature 2</text>
    
    <!-- Cluster 1 (Blue) -->
    <circle cx="120" cy="160" r="4" fill="#3498db"/>
    <circle cx="130" cy="170" r="4" fill="#3498db"/>
    <circle cx="110" cy="175" r="4" fill="#3498db"/>
    <circle cx="125" cy="185" r="4" fill="#3498db"/>
    
    <!-- Cluster 2 (Red) -->
    <circle cx="200" cy="150" r="4" fill="#e74c3c"/>
    <circle cx="210" cy="160" r="4" fill="#e74c3c"/>
    <circle cx="190" cy="165" r="4" fill="#e74c3c"/>
    <circle cx="205" cy="175" r="4" fill="#e74c3c"/>
    
    <!-- Cluster 3 (Green) -->
    <circle cx="150" cy="220" r="4" fill="#27ae60"/>
    <circle cx="160" cy="230" r="4" fill="#27ae60"/>
    <circle cx="140" cy="235" r="4" fill="#27ae60"/>
    <circle cx="155" cy="240" r="4" fill="#27ae60"/>
  </g>
  
  <!-- Image Segmentation -->
  <rect x="320" y="90" width="250" height="200" rx="10" fill="#fff" stroke="#e74c3c" stroke-width="3" filter="url(#shadow)"/>
  <text x="445" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#c0392b">
    Image Segmentation
  </text>
  
  <!-- Simulated image with regions -->
  <rect x="350" y="130" width="190" height="140" fill="url(#imagePattern)" stroke="#bdc3c7" stroke-width="1"/>
  
  <!-- Object regions -->
  <ellipse cx="400" cy="170" rx="30" ry="20" fill="#3498db" opacity="0.7" stroke="#2980b9" stroke-width="2"/>
  <rect x="470" y="150" width="40" height="25" fill="#e74c3c" opacity="0.7" stroke="#c0392b" stroke-width="2"/>
  <polygon points="370,220 390,240 350,245 340,225" fill="#27ae60" opacity="0.7" stroke="#229954" stroke-width="2"/>
  
  <text x="445" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">
    Object-based clustering evaluation
  </text>
  
  <!-- Topic Modeling -->
  <rect x="590" y="90" width="250" height="200" rx="10" fill="#fff" stroke="#f39c12" stroke-width="3" filter="url(#shadow)"/>
  <text x="715" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e67e22">
    Topic Modeling
  </text>
  
  <!-- Word clusters -->
  <g id="wordClusters">
    <!-- Tech cluster -->
    <ellipse cx="650" cy="160" rx="45" ry="25" fill="#9b59b6" opacity="0.2" stroke="#8e44ad" stroke-width="2"/>
    <text x="650" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#8e44ad" font-weight="bold">algorithm</text>
    <text x="650" y="167" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#8e44ad" font-weight="bold">model</text>
    
    <!-- Science cluster -->
    <ellipse cx="750" cy="160" rx="45" ry="25" fill="#16a085" opacity="0.2" stroke="#138d75" stroke-width="2"/>
    <text x="750" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#138d75" font-weight="bold">quantum</text>
    <text x="750" y="167" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#138d75" font-weight="bold">energy</text>
    
    <!-- Business cluster -->
    <ellipse cx="700" cy="220" rx="45" ry="25" fill="#d35400" opacity="0.2" stroke="#ba4a00" stroke-width="2"/>
    <text x="700" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#ba4a00" font-weight="bold">market</text>
    <text x="700" y="227" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#ba4a00" font-weight="bold">revenue</text>
  </g>
  
  <text x="715" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">
    Semantic coherence assessment
  </text>
  
  <!-- High-Dimensional Data Tools -->
  <rect x="100" y="320" width="700" height="200" rx="15" fill="#ecf0f1" stroke="#34495e" stroke-width="3" filter="url(#shadow)"/>
  <text x="450" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">
    High-Dimensional Data Visualization Tools
  </text>
  
  <!-- Tool 1: t-SNE/UMAP -->
  <rect x="130" y="360" width="150" height="120" rx="8" fill="#fff" stroke="#9b59b6" stroke-width="2"/>
  <text x="205" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#8e44ad">
    t-SNE / UMAP
  </text>
  
  <!-- Simulated dimensionality reduction -->
  <g id="tsne">
    <circle cx="180" cy="410" r="3" fill="#3498db"/>
    <circle cx="185" cy="415" r="3" fill="#3498db"/>
    <circle cx="175" cy="420" r="3" fill="#3498db"/>
    
    <circle cx="220" cy="400" r="3" fill="#e74c3c"/>
    <circle cx="225" cy="405" r="3" fill="#e74c3c"/>
    <circle cx="215" cy="410" r="3" fill="#e74c3c"/>
    
    <circle cx="200" cy="450" r="3" fill="#27ae60"/>
    <circle cx="205" cy="455" r="3" fill="#27ae60"/>
    <circle cx="195" cy="460" r="3" fill="#27ae60"/>
  </g>
  
  <text x="205" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">
    Nonlinear projection
  </text>
  
  <!-- Tool 2: PCA -->
  <rect x="300" y="360" width="150" height="120" rx="8" fill="#fff" stroke="#27ae60" stroke-width="2"/>
  <text x="375" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#229954">
    PCA Projection
  </text>
  
  <!-- PCA visualization -->
  <g id="pca">
    <line x1="330" y1="460" x2="420" y2="460" stroke="#34495e" stroke-width="1"/>
    <line x1="330" y1="400" x2="330" y2="460" stroke="#34495e" stroke-width="1"/>
    
    <ellipse cx="360" cy="430" rx="20" ry="10" fill="#3498db" opacity="0.3"/>
    <ellipse cx="390" cy="420" rx="15" ry="8" fill="#e74c3c" opacity="0.3"/>
  </g>
  
  <text x="375" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">
    Linear projection
  </text>
  
  <!-- Tool 3: GGOBI -->
  <rect x="470" y="360" width="150" height="120" rx="8" fill="#fff" stroke="#f39c12" stroke-width="2"/>
  <text x="545" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e67e22">
    GGOBI Tool
  </text>
  
  <!-- Interactive visualization concept -->
  <rect x="490" y="390" width="110" height="60" rx="5" fill="#f8f9fa" stroke="#bdc3c7" stroke-width="1"/>
  <text x="545" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#7f8c8d">Interactive</text>
  <text x="545" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#7f8c8d">Multiple views</text>
  <text x="545" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#7f8c8d">Linked brushing</text>
  <text x="545" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#7f8c8d">Grand tour</text>
  
  <text x="545" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">
    Interactive exploration
  </text>
  
  <!-- Tool 4: Parallel Coordinates -->
  <rect x="640" y="360" width="150" height="120" rx="8" fill="#fff" stroke="#16a085" stroke-width="2"/>
  <text x="715" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#138d75">
    Parallel Coordinates
  </text>
  
  <!-- Parallel coordinates visualization -->
  <g id="parallelCoords">
    <line x1="670" y1="390" x2="670" y2="450" stroke="#34495e" stroke-width="1"/>
    <line x1="690" y1="390" x2="690" y2="450" stroke="#34495e" stroke-width="1"/>
    <line x1="710" y1="390" x2="710" y2="450" stroke="#34495e" stroke-width="1"/>
    <line x1="730" y1="390" x2="730" y2="450" stroke="#34495e" stroke-width="1"/>
    <line x1="750" y1="390" x2="750" y2="450" stroke="#34495e" stroke-width="1"/>
    
    <!-- Sample data lines -->
    <polyline points="670,410 690,420 710,415 730,425 750,420" stroke="#3498db" stroke-width="2" fill="none"/>
    <polyline points="670,430 690,435 710,440 730,430 750,435" stroke="#e74c3c" stroke-width="2" fill="none"/>
  </g>
  
  <text x="715" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">
    Multi-dimensional view
  </text>
  
  <!-- Evaluation Criteria -->
  <rect x="150" y="540" width="600" height="120" rx="10" fill="#fff" stroke="#2c3e50" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">
    Visual Evaluation Criteria
  </text>
  
  <g id="criteria">
    <!-- Left column -->
    <text x="200" y="590" font-family="Arial, sans-serif" font-size="12" fill="#27ae60" font-weight="bold">✓ Clear cluster separation</text>
    <text x="200" y="610" font-family="Arial, sans-serif" font-size="12" fill="#27ae60" font-weight="bold">✓ Compact, well-defined groups</text>
    <text x="200" y="630" font-family="Arial, sans-serif" font-size="12" fill="#27ae60" font-weight="bold">✓ Meaningful patterns within clusters</text>
    
    <!-- Right column -->
    <text x="500" y="590" font-family="Arial, sans-serif" font-size="12" fill="#e74c3c" font-weight="bold">✗ Overlapping clusters</text>
    <text x="500" y="610" font-family="Arial, sans-serif" font-size="12" fill="#e74c3c" font-weight="bold">✗ Obvious outliers within clusters</text>
    <text x="500" y="630" font-family="Arial, sans-serif" font-size="12" fill="#e74c3c" font-weight="bold">✗ No interpretable structure</text>
  </g>
  
  <!-- Footer insight -->
  <rect x="200" y="670" width="500" height="25" rx="5" fill="#f8f9fa" stroke="#7f8c8d" stroke-width="1"/>
  <text x="450" y="687" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">
    Visualization provides intuitive understanding but requires domain expertise for interpretation
  </text>
</svg>