<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#0d9488;stop-opacity:0.8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1e293b">
    Linear Regression Framework
  </text>
  
  <!-- Input Variables Box -->
  <rect x="50" y="80" width="200" height="120" rx="8" fill="url(#blueGradient)" filter="url(#shadow)"/>
  <text x="150" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
    Input Variables (X)
  </text>
  <text x="150" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
    • Education Level
  </text>
  <text x="150" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
    • Experience
  </text>
  <text x="150" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
    • Gender
  </text>
  
  <!-- Regression Model Box -->
  <rect x="300" y="80" width="200" height="120" rx="8" fill="url(#greenGradient)" filter="url(#shadow)"/>
  <text x="400" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
    Regression Model
  </text>
  <text x="400" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">
    Y = β'X + ε
  </text>
  <text x="400" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
    Linear Transformation
  </text>
  <text x="400" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
    + Error Term
  </text>
  
  <!-- Output Variable Box -->
  <rect x="550" y="80" width="200" height="120" rx="8" fill="#dc2626" filter="url(#shadow)"/>
  <text x="650" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
    Output Variable (Y)
  </text>
  <text x="650" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">
    Hourly Wage
  </text>
  <text x="650" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
    Predicted Value
  </text>
  
  <!-- Arrows -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
     refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>
  
  <line x1="250" y1="140" x2="300" y2="140" stroke="#64748b" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line x1="500" y1="140" x2="550" y2="140" stroke="#64748b" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Mathematical Components Section -->
  <text x="400" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">
    Mathematical Components
  </text>
  
  <!-- Beta coefficients -->
  <rect x="100" y="320" width="150" height="80" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="175" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#92400e">
    Coefficients (β)
  </text>
  <text x="175" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#92400e">
    β₁, β₂, ..., βₚ
  </text>
  <text x="175" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#92400e">
    Effect sizes
  </text>
  
  <!-- Feature matrix -->
  <rect x="325" y="320" width="150" height="80" rx="6" fill="#ddd6fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="400" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#5b21b6">
    Feature Matrix (X)
  </text>
  <text x="400" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5b21b6">
    x₁, x₂, ..., xₚ
  </text>
  <text x="400" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5b21b6">
    Input data
  </text>
  
  <!-- Error term -->
  <rect x="550" y="320" width="150" height="80" rx="6" fill="#fecaca" stroke="#ef4444" stroke-width="2"/>
  <text x="625" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#991b1b">
    Error Term (ε)
  </text>
  <text x="625" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#991b1b">
    Residuals
  </text>
  <text x="625" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#991b1b">
    Unexplained
  </text>
  
  <!-- Objectives Section -->
  <text x="400" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">
    Two Primary Objectives
  </text>
  
  <!-- Prediction objective -->
  <rect x="150" y="500" width="200" height="70" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="250" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#047857">
    1. Prediction
  </text>
  <text x="250" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#047857">
    How well can we predict Y
  </text>
  <text x="250" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#047857">
    using the features X?
  </text>
  
  <!-- Inference objective -->
  <rect x="450" y="500" width="200" height="70" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="550" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1d4ed8">
    2. Inference
  </text>
  <text x="550" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1d4ed8">
    How does one feature affect Y
  </text>
  <text x="550" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1d4ed8">
    while controlling for others?
  </text>
</svg>