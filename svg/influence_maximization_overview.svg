<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="700" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="600" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Influence Maximization Overview
  </text>
  
  <!-- Left Side: Network Before -->
  <g id="before">
    <text x="250" y="90" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#34495e">
      Initial State
    </text>
    <text x="250" y="115" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#7f8c8d">
      Select k=3 seed nodes
    </text>
    
    <!-- Network nodes -->
    <circle cx="150" cy="200" r="20" fill="#e74c3c" stroke="#c0392b" stroke-width="3"/>
    <circle cx="250" cy="180" r="20" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    <circle cx="350" cy="200" r="20" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    <circle cx="200" cy="280" r="20" fill="#e74c3c" stroke="#c0392b" stroke-width="3"/>
    <circle cx="300" cy="280" r="20" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    <circle cx="250" cy="360" r="20" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    <circle cx="150" cy="340" r="20" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    <circle cx="350" cy="340" r="20" fill="#e74c3c" stroke="#c0392b" stroke-width="3"/>
    <circle cx="180" cy="420" r="20" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    <circle cx="320" cy="420" r="20" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    
    <!-- Edges -->
    <line x1="150" y1="200" x2="250" y2="180" stroke="#95a5a6" stroke-width="2"/>
    <line x1="250" y1="180" x2="350" y2="200" stroke="#95a5a6" stroke-width="2"/>
    <line x1="150" y1="200" x2="200" y2="280" stroke="#95a5a6" stroke-width="2"/>
    <line x1="200" y1="280" x2="300" y2="280" stroke="#95a5a6" stroke-width="2"/>
    <line x1="300" y1="280" x2="350" y2="200" stroke="#95a5a6" stroke-width="2"/>
    <line x1="200" y1="280" x2="250" y2="360" stroke="#95a5a6" stroke-width="2"/>
    <line x1="150" y1="200" x2="150" y2="340" stroke="#95a5a6" stroke-width="2"/>
    <line x1="150" y1="340" x2="250" y2="360" stroke="#95a5a6" stroke-width="2"/>
    <line x1="350" y1="200" x2="350" y2="340" stroke="#95a5a6" stroke-width="2"/>
    <line x1="250" y1="360" x2="180" y2="420" stroke="#95a5a6" stroke-width="2"/>
    <line x1="250" y1="360" x2="320" y2="420" stroke="#95a5a6" stroke-width="2"/>
    <line x1="350" y1="340" x2="320" y2="420" stroke="#95a5a6" stroke-width="2"/>
    <line x1="250" y1="180" x2="300" y2="280" stroke="#95a5a6" stroke-width="2"/>
  </g>
  
  <!-- Arrow -->
  <g id="arrow">
    <line x1="450" y1="310" x2="550" y2="310" stroke="#2c3e50" stroke-width="4" marker-end="url(#arrowhead)"/>
    <text x="500" y="290" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#2c3e50" font-weight="bold">
      Propagation
    </text>
  </g>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#2c3e50"/>
    </marker>
  </defs>
  
  <!-- Right Side: Network After -->
  <g id="after">
    <text x="850" y="90" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#34495e">
      Final State
    </text>
    <text x="850" y="115" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#7f8c8d">
      8 out of 10 nodes activated
    </text>
    
    <!-- Network nodes - most activated -->
    <circle cx="750" cy="200" r="20" fill="#e74c3c" stroke="#c0392b" stroke-width="3"/>
    <circle cx="850" cy="180" r="20" fill="#27ae60" stroke="#229954" stroke-width="3"/>
    <circle cx="950" cy="200" r="20" fill="#27ae60" stroke="#229954" stroke-width="3"/>
    <circle cx="800" cy="280" r="20" fill="#e74c3c" stroke="#c0392b" stroke-width="3"/>
    <circle cx="900" cy="280" r="20" fill="#27ae60" stroke="#229954" stroke-width="3"/>
    <circle cx="850" cy="360" r="20" fill="#27ae60" stroke="#229954" stroke-width="3"/>
    <circle cx="750" cy="340" r="20" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    <circle cx="950" cy="340" r="20" fill="#e74c3c" stroke="#c0392b" stroke-width="3"/>
    <circle cx="780" cy="420" r="20" fill="#27ae60" stroke="#229954" stroke-width="3"/>
    <circle cx="920" cy="420" r="20" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    
    <!-- Edges -->
    <line x1="750" y1="200" x2="850" y2="180" stroke="#95a5a6" stroke-width="2"/>
    <line x1="850" y1="180" x2="950" y2="200" stroke="#95a5a6" stroke-width="2"/>
    <line x1="750" y1="200" x2="800" y2="280" stroke="#95a5a6" stroke-width="2"/>
    <line x1="800" y1="280" x2="900" y2="280" stroke="#95a5a6" stroke-width="2"/>
    <line x1="900" y1="280" x2="950" y2="200" stroke="#95a5a6" stroke-width="2"/>
    <line x1="800" y1="280" x2="850" y2="360" stroke="#95a5a6" stroke-width="2"/>
    <line x1="750" y1="200" x2="750" y2="340" stroke="#95a5a6" stroke-width="2"/>
    <line x1="750" y1="340" x2="850" y2="360" stroke="#95a5a6" stroke-width="2"/>
    <line x1="950" y1="200" x2="950" y2="340" stroke="#95a5a6" stroke-width="2"/>
    <line x1="850" y1="360" x2="780" y2="420" stroke="#95a5a6" stroke-width="2"/>
    <line x1="850" y1="360" x2="920" y2="420" stroke="#95a5a6" stroke-width="2"/>
    <line x1="950" y1="340" x2="920" y2="420" stroke="#95a5a6" stroke-width="2"/>
    <line x1="850" y1="180" x2="900" y2="280" stroke="#95a5a6" stroke-width="2"/>
  </g>
  
  <!-- Legend -->
  <g id="legend">
    <rect x="100" y="520" width="1000" height="150" fill="#ffffff" stroke="#bdc3c7" stroke-width="2" rx="10"/>
    
    <text x="600" y="550" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Legend
    </text>
    
    <!-- Seed nodes -->
    <circle cx="250" cy="595" r="15" fill="#e74c3c" stroke="#c0392b" stroke-width="3"/>
    <text x="280" y="600" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">
      Seed Nodes (k=3 initial active nodes)
    </text>
    
    <!-- Activated nodes -->
    <circle cx="650" cy="595" r="15" fill="#27ae60" stroke="#229954" stroke-width="3"/>
    <text x="680" y="600" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">
      Activated Nodes (influenced by seeds)
    </text>
    
    <!-- Inactive nodes -->
    <circle cx="250" cy="640" r="15" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    <text x="280" y="645" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">
      Inactive Nodes (not reached by influence)
    </text>
  </g>
  
  <!-- Key metrics -->
  <rect x="420" y="460" width="360" height="40" fill="#3498db" rx="5"/>
  <text x="600" y="485" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">
    Influence Spread: 3 seeds → 8 active (80% reach)
  </text>
</svg>