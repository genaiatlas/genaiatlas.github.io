<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="500" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">
    How Prediction Error Variance Depends on X
  </text>
  
  <!-- Main plot area -->
  <rect x="80" y="80" width="400" height="250" fill="white" stroke="#ddd" stroke-width="1"/>
  
  <!-- Axes -->
  <line x1="80" y1="330" x2="480" y2="330" stroke="#333" stroke-width="2"/>
  <line x1="80" y1="80" x2="80" y2="330" stroke="#333" stroke-width="2"/>
  
  <!-- X-axis labels -->
  <text x="280" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">X values</text>
  <text x="130" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">X_min</text>
  <text x="280" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">X̄</text>
  <text x="430" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">X_max</text>
  
  <!-- Y-axis label -->
  <text x="65" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666" transform="rotate(-90, 65, 205)">Prediction Error Variance</text>
  
  <!-- Baseline variance (σ²) -->
  <line x1="80" y1="250" x2="480" y2="250" stroke="#388e3c" stroke-width="3" stroke-dasharray="5,5"/>
  <text x="490" y="255" font-family="Arial, sans-serif" font-size="11" fill="#388e3c">σ² (baseline)</text>
  
  <!-- Total variance curve (U-shaped) -->
  <path d="M 80 200 Q 130 180 180 170 Q 230 165 280 165 Q 330 165 380 170 Q 430 180 480 200" stroke="#d32f2f" stroke-width="3" fill="none"/>
  
  <!-- Annotation for minimum -->
  <circle cx="280" cy="165" r="4" fill="#d32f2f"/>
  <text x="285" y="160" font-family="Arial, sans-serif" font-size="10" fill="#d32f2f">Minimum at X̄</text>
  
  <!-- Variance components breakdown -->
  <rect x="520" y="80" width="250" height="200" fill="#f5f5f5" stroke="#666" stroke-width="1" rx="5"/>
  <text x="645" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">
    Variance Components
  </text>
  
  <!-- Component 1 -->
  <rect x="535" y="120" width="15" height="10" fill="#388e3c"/>
  <text x="560" y="130" font-family="Arial, sans-serif" font-size="11" fill="#333">σ² (Unavoidable noise)</text>
  <text x="560" y="145" font-family="Arial, sans-serif" font-size="10" fill="#666">• Constant for all X</text>
  <text x="560" y="157" font-family="Arial, sans-serif" font-size="10" fill="#666">• Cannot be reduced</text>
  
  <!-- Component 2 -->
  <rect x="535" y="175" width="15" height="10" fill="#1976d2"/>
  <text x="560" y="185" font-family="Arial, sans-serif" font-size="11" fill="#333">σ²Xᵀ(XᵀX)⁻¹X (Estimation)</text>
  <text x="560" y="200" font-family="Arial, sans-serif" font-size="10" fill="#666">• Depends on X values</text>
  <text x="560" y="212" font-family="Arial, sans-serif" font-size="10" fill="#666">• Larger for extreme X</text>
  <text x="560" y="224" font-family="Arial, sans-serif" font-size="10" fill="#666">• Minimum at center</text>
  
  <!-- Total formula -->
  <rect x="535" y="240" width="220" height="30" fill="#fff3e0" stroke="#f57c00" stroke-width="1" rx="3"/>
  <text x="645" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#f57c00">
    Total = σ² + σ²Xᵀ(XᵀX)⁻¹X
  </text>
  
  <!-- Visual explanation arrows -->
  <path d="M 280 200 L 320 220" stroke="#666" stroke-width="1" marker-end="url(#arrowhead)"/>
  <text x="325" y="225" font-family="Arial, sans-serif" font-size="9" fill="#666">Low variance</text>
  <text x="325" y="237" font-family="Arial, sans-serif" font-size="9" fill="#666">at center</text>
  
  <path d="M 150 185 L 110 160" stroke="#666" stroke-width="1" marker-end="url(#arrowhead)"/>
  <text x="50" y="155" font-family="Arial, sans-serif" font-size="9" fill="#666">High variance</text>
  <text x="50" y="167" font-family="Arial, sans-serif" font-size="9" fill="#666">at extremes</text>
  
  <path d="M 420 185 L 460 160" stroke="#666" stroke-width="1" marker-end="url(#arrowhead)"/>
  <text x="465" y="155" font-family="Arial, sans-serif" font-size="9" fill="#666">High variance</text>
  <text x="465" y="167" font-family="Arial, sans-serif" font-size="9" fill="#666">at extremes</text>
  
  <!-- Key insight box -->
  <rect x="80" y="380" width="640" height="80" fill="#e8f5e8" stroke="#388e3c" stroke-width="2" rx="10"/>
  <text x="400" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#388e3c">
    Why Does Variance Depend on X?
  </text>
  <text x="100" y="430" font-family="Arial, sans-serif" font-size="12" fill="#333">
    • Parameter estimates θ̂ have uncertainty (variance)
  </text>
  <text x="100" y="445" font-family="Arial, sans-serif" font-size="12" fill="#333">
    • When we multiply θ̂ by large X values, the uncertainty gets amplified: Var(θ̂ᵀX) ∝ |X|²
  </text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
</svg>