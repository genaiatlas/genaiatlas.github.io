<svg viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="750" fill="#f9fafb"/>
  
  <!-- Title -->
  <text x="600" y="40" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">
    Content-Based Filtering Pipeline
  </text>
  
  <!-- Feature Extraction Section -->
  <g id="feature-extraction">
    <rect x="50" y="80" width="300" height="600" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="200" y="110" font-size="18" font-weight="bold" text-anchor="middle" fill="#1e40af">Feature Extraction</text>
    
    <!-- Text Features -->
    <rect x="70" y="130" width="260" height="130" rx="5" fill="white" stroke="#60a5fa" stroke-width="1"/>
    <text x="200" y="155" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937">Text Features</text>
    
    <rect x="85" y="170" width="230" height="25" rx="3" fill="#dbeafe"/>
    <text x="200" y="187" font-size="11" text-anchor="middle" fill="#1e40af">TF-IDF: term frequency analysis</text>
    
    <rect x="85" y="200" width="230" height="25" rx="3" fill="#dbeafe"/>
    <text x="200" y="217" font-size="11" text-anchor="middle" fill="#1e40af">Word2Vec: semantic embeddings</text>
    
    <rect x="85" y="230" width="230" height="25" rx="3" fill="#dbeafe"/>
    <text x="200" y="247" font-size="11" text-anchor="middle" fill="#1e40af">BERT: contextual understanding</text>
    
    <!-- Image Features -->
    <rect x="70" y="280" width="260" height="130" rx="5" fill="white" stroke="#60a5fa" stroke-width="1"/>
    <text x="200" y="305" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937">Image Features</text>
    
    <rect x="85" y="320" width="230" height="25" rx="3" fill="#dcfce7"/>
    <text x="200" y="337" font-size="11" text-anchor="middle" fill="#16a34a">ResNet: deep visual features</text>
    
    <rect x="85" y="350" width="230" height="25" rx="3" fill="#dcfce7"/>
    <text x="200" y="367" font-size="11" text-anchor="middle" fill="#16a34a">Color Histogram: color distribution</text>
    
    <rect x="85" y="380" width="230" height="25" rx="3" fill="#dcfce7"/>
    <text x="200" y="397" font-size="11" text-anchor="middle" fill="#16a34a">YOLO: object detection</text>
    
    <!-- Metadata Features -->
    <rect x="70" y="430" width="260" height="130" rx="5" fill="white" stroke="#60a5fa" stroke-width="1"/>
    <text x="200" y="455" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937">Metadata Features</text>
    
    <rect x="85" y="470" width="230" height="25" rx="3" fill="#fef3c7"/>
    <text x="200" y="487" font-size="11" text-anchor="middle" fill="#d97706">Categories &amp; Tags</text>
    
    <rect x="85" y="500" width="230" height="25" rx="3" fill="#fef3c7"/>
    <text x="200" y="517" font-size="11" text-anchor="middle" fill="#d97706">Temporal Information</text>
    
    <rect x="85" y="530" width="230" height="25" rx="3" fill="#fef3c7"/>
    <text x="200" y="547" font-size="11" text-anchor="middle" fill="#d97706">Creator/Brand Attributes</text>
    
    <!-- Feature Vector Output -->
    <rect x="70" y="580" width="260" height="80" rx="5" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
    <text x="200" y="605" font-size="12" font-weight="bold" text-anchor="middle" fill="#1f2937">Combined Feature Vector</text>
    <text x="200" y="625" font-size="10" text-anchor="middle" fill="#4b5563">[0.3, 0.8, 0.1, ..., 0.5, 0.2]</text>
    <text x="200" y="645" font-size="10" text-anchor="middle" fill="#4b5563">d = 512 dimensions</text>
  </g>
  
  <!-- User Profile Building -->
  <g id="user-profile">
    <rect x="400" y="80" width="350" height="600" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="575" y="110" font-size="18" font-weight="bold" text-anchor="middle" fill="#14532d">User Profile Construction</text>
    
    <!-- Interaction History -->
    <rect x="420" y="130" width="310" height="150" rx="5" fill="white" stroke="#4ade80" stroke-width="1"/>
    <text x="575" y="155" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937">User Interaction History</text>
    
    <!-- Item representations -->
    <g id="items">
      <rect x="440" y="175" width="60" height="30" rx="3" fill="#86efac"/>
      <text x="470" y="194" font-size="10" text-anchor="middle" fill="#14532d">Item A</text>
      <text x="470" y="204" font-size="8" text-anchor="middle" fill="#14532d">Rating: 5</text>
      
      <rect x="520" y="175" width="60" height="30" rx="3" fill="#86efac"/>
      <text x="550" y="194" font-size="10" text-anchor="middle" fill="#14532d">Item B</text>
      <text x="550" y="204" font-size="8" text-anchor="middle" fill="#14532d">Rating: 4</text>
      
      <rect x="600" y="175" width="60" height="30" rx="3" fill="#fca5a5"/>
      <text x="630" y="194" font-size="10" text-anchor="middle" fill="#7f1d1d">Item C</text>
      <text x="630" y="204" font-size="8" text-anchor="middle" fill="#7f1d1d">Rating: 2</text>
      
      <rect x="440" y="220" width="60" height="30" rx="3" fill="#86efac"/>
      <text x="470" y="239" font-size="10" text-anchor="middle" fill="#14532d">Item D</text>
      <text x="470" y="249" font-size="8" text-anchor="middle" fill="#14532d">Rating: 5</text>
      
      <rect x="520" y="220" width="60" height="30" rx="3" fill="#fbbf24"/>
      <text x="550" y="239" font-size="10" text-anchor="middle" fill="#78350f">Item E</text>
      <text x="550" y="249" font-size="8" text-anchor="middle" fill="#78350f">Rating: 3</text>
      
      <rect x="600" y="220" width="60" height="30" rx="3" fill="#86efac"/>
      <text x="630" y="239" font-size="10" text-anchor="middle" fill="#14532d">Item F</text>
      <text x="630" y="249" font-size="8" text-anchor="middle" fill="#14532d">Rating: 4</text>
    </g>
    
    <!-- Profile Aggregation -->
    <rect x="420" y="300" width="310" height="120" rx="5" fill="white" stroke="#4ade80" stroke-width="1"/>
    <text x="575" y="325" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937">Profile Aggregation</text>
    
    <text x="575" y="350" font-size="12" text-anchor="middle" fill="#4b5563">Weighted Average Formula:</text>
    <text x="575" y="375" font-size="11" font-family="monospace" text-anchor="middle" fill="#1f2937">
      P_u = Σ(w_i × f_i) / Σw_i
    </text>
    <text x="575" y="400" font-size="10" text-anchor="middle" fill="#6b7280">
      w_i = rating × recency_weight
    </text>
    
    <!-- Learned Profile -->
    <rect x="420" y="440" width="310" height="100" rx="5" fill="white" stroke="#4ade80" stroke-width="1"/>
    <text x="575" y="465" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937">Learned User Profile</text>
    
    <!-- Profile visualization -->
    <g id="profile-vis">
      <rect x="440" y="480" width="270" height="40" rx="3" fill="#dcfce7"/>
      <text x="450" y="497" font-size="10" fill="#14532d">Genre: Action(0.8), Drama(0.6)</text>
      <text x="450" y="512" font-size="10" fill="#14532d">Style: Modern(0.9), Classic(0.3)</text>
    </g>
    
    <!-- Dynamic Update -->
    <rect x="420" y="560" width="310" height="100" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
    <text x="575" y="585" font-size="12" font-weight="bold" text-anchor="middle" fill="#1f2937">Dynamic Profile Update</text>
    <text x="575" y="605" font-size="10" text-anchor="middle" fill="#6b7280">• Sliding window (last 30 days)</text>
    <text x="575" y="620" font-size="10" text-anchor="middle" fill="#6b7280">• Exponential decay weighting</text>
    <text x="575" y="635" font-size="10" text-anchor="middle" fill="#6b7280">• Context-aware adjustments</text>
  </g>
  
  <!-- Similarity & Ranking -->
  <g id="similarity">
    <rect x="800" y="80" width="350" height="600" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="975" y="110" font-size="18" font-weight="bold" text-anchor="middle" fill="#7f1d1d">Similarity &amp; Ranking</text>
    
    <!-- Similarity Computation -->
    <rect x="820" y="130" width="310" height="180" rx="5" fill="white" stroke="#f87171" stroke-width="1"/>
    <text x="975" y="155" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937">Similarity Metrics</text>
    
    <!-- Cosine Similarity -->
    <rect x="835" y="170" width="280" height="50" rx="3" fill="#fee2e2"/>
    <text x="975" y="190" font-size="12" text-anchor="middle" fill="#1f2937">Cosine Similarity</text>
    <text x="975" y="210" font-size="10" font-family="monospace" text-anchor="middle" fill="#4b5563">
      cos(θ) = (P·I)/(||P||×||I||)
    </text>
    
    <!-- Other Metrics -->
    <rect x="835" y="230" width="130" height="30" rx="3" fill="#fee2e2"/>
    <text x="900" y="249" font-size="10" text-anchor="middle" fill="#1f2937">Euclidean</text>
    
    <rect x="985" y="230" width="130" height="30" rx="3" fill="#fee2e2"/>
    <text x="1050" y="249" font-size="10" text-anchor="middle" fill="#1f2937">Pearson</text>
    
    <rect x="835" y="270" width="130" height="30" rx="3" fill="#fee2e2"/>
    <text x="900" y="289" font-size="10" text-anchor="middle" fill="#1f2937">Jaccard</text>
    
    <rect x="985" y="270" width="130" height="30" rx="3" fill="#fee2e2"/>
    <text x="1050" y="289" font-size="10" text-anchor="middle" fill="#1f2937">Manhattan</text>
    
    <!-- Candidate Scoring -->
    <rect x="820" y="330" width="310" height="150" rx="5" fill="white" stroke="#f87171" stroke-width="1"/>
    <text x="975" y="355" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937">Candidate Scoring</text>
    
    <!-- Score bars -->
    <g id="scores">
      <text x="840" y="380" font-size="11" fill="#1f2937">Item X:</text>
      <rect x="900" y="370" width="180" height="15" rx="2" fill="#86efac"/>
      <text x="1090" y="380" font-size="10" fill="#14532d">0.95</text>
      
      <text x="840" y="405" font-size="11" fill="#1f2937">Item Y:</text>
      <rect x="900" y="395" width="160" height="15" rx="2" fill="#86efac"/>
      <text x="1090" y="405" font-size="10" fill="#14532d">0.87</text>
      
      <text x="840" y="430" font-size="11" fill="#1f2937">Item Z:</text>
      <rect x="900" y="420" width="140" height="15" rx="2" fill="#fbbf24"/>
      <text x="1090" y="430" font-size="10" fill="#78350f">0.76</text>
      
      <text x="840" y="455" font-size="11" fill="#1f2937">Item W:</text>
      <rect x="900" y="445" width="120" height="15" rx="2" fill="#fbbf24"/>
      <text x="1090" y="455" font-size="10" fill="#78350f">0.64</text>
    </g>
    
    <!-- Final Recommendations -->
    <rect x="820" y="500" width="310" height="160" rx="5" fill="white" stroke="#f87171" stroke-width="1"/>
    <text x="975" y="525" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937">Final Recommendations</text>
    
    <!-- Top recommendations -->
    <rect x="840" y="540" width="270" height="30" rx="3" fill="#10b981" stroke="#059669" stroke-width="1"/>
    <text x="975" y="559" font-size="12" text-anchor="middle" fill="white">1. Item X - Score: 0.95</text>
    
    <rect x="840" y="575" width="270" height="30" rx="3" fill="#10b981" stroke="#059669" stroke-width="1"/>
    <text x="975" y="594" font-size="12" text-anchor="middle" fill="white">2. Item Y - Score: 0.87</text>
    
    <rect x="840" y="610" width="270" height="30" rx="3" fill="#10b981" stroke="#059669" stroke-width="1"/>
    <text x="975" y="629" font-size="12" text-anchor="middle" fill="white">3. Item Z - Score: 0.76</text>
  </g>
  
  <!-- Flow arrows -->
  <defs>
    <marker id="arrowblue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#3b82f6"/>
    </marker>
    <marker id="arrowgreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#16a34a"/>
    </marker>
  </defs>
  
  <path d="M 350 380 L 400 380" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowblue)"/>
  <path d="M 750 380 L 800 380" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowgreen)"/>
  
  <!-- Process labels -->
  <text x="375" y="375" font-size="10" text-anchor="middle" fill="#3b82f6">Features</text>
  <text x="775" y="375" font-size="10" text-anchor="middle" fill="#16a34a">Profile</text>
</svg>