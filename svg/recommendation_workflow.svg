<svg viewBox="0 0 1200 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="600" y="40" font-size="28" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Graphical Model Recommendation Workflow
  </text>
  
  <!-- Step 1: User Profile -->
  <g id="step1">
    <rect x="100" y="80" width="300" height="140" fill="#e3f2fd" stroke="#2196f3" stroke-width="3" rx="8"/>
    <text x="250" y="110" font-size="18" font-weight="bold" text-anchor="middle" fill="#2196f3">
      Step 1: User Profile
    </text>
    <text x="120" y="145" font-size="13" fill="#2c3e50">
      User has expressed preferences:
    </text>
    <text x="130" y="170" font-size="12" fill="#27ae60" font-weight="bold">
      ✓ Casablanca: Liked (+1)
    </text>
    <text x="130" y="190" font-size="12" fill="#95a5a6">
      ? Godfather: Unknown
    </text>
    <text x="130" y="210" font-size="12" fill="#95a5a6">
      ? Iron Man: Unknown
    </text>
  </g>
  
  <!-- Arrow -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#34495e"/>
    </marker>
  </defs>
  <line x1="250" y1="230" x2="250" y2="280" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/>
  
  <!-- Step 2: Condition on Observation -->
  <g id="step2">
    <rect x="100" y="290" width="300" height="160" fill="#fff3e0" stroke="#f39c12" stroke-width="3" rx="8"/>
    <text x="250" y="320" font-size="18" font-weight="bold" text-anchor="middle" fill="#f39c12">
      Step 2: Condition Model
    </text>
    <text x="120" y="355" font-size="13" fill="#2c3e50">
      Fix observed nodes in graph:
    </text>
    
    <!-- Mini graph -->
    <circle cx="150" cy="395" r="20" fill="#27ae60" stroke="#229954" stroke-width="2"/>
    <text x="150" y="400" font-size="10" font-weight="bold" text-anchor="middle" fill="white">Casa</text>
    
    <circle cx="250" cy="395" r="20" fill="#95a5a6" stroke="#7f8c8d" stroke-width="2"/>
    <text x="250" y="400" font-size="10" font-weight="bold" text-anchor="middle" fill="white">God</text>
    
    <circle cx="350" cy="395" r="20" fill="#95a5a6" stroke="#7f8c8d" stroke-width="2"/>
    <text x="350" y="400" font-size="10" font-weight="bold" text-anchor="middle" fill="white">Iron</text>
    
    <line x1="170" y1="395" x2="230" y2="395" stroke="#34495e" stroke-width="2"/>
    <line x1="270" y1="395" x2="330" y2="395" stroke="#34495e" stroke-width="2"/>
    
    <text x="120" y="435" font-size="12" fill="#2c3e50">
      Condition: P(Other | Casablanca=+1)
    </text>
  </g>
  
  <!-- Arrow -->
  <line x1="250" y1="460" x2="250" y2="510" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/>
  
  <!-- Step 3: Belief Propagation -->
  <g id="step3">
    <rect x="100" y="520" width="300" height="180" fill="#e8f5e9" stroke="#27ae60" stroke-width="3" rx="8"/>
    <text x="250" y="550" font-size="18" font-weight="bold" text-anchor="middle" fill="#27ae60">
      Step 3: Belief Propagation
    </text>
    <text x="120" y="585" font-size="13" fill="#2c3e50">
      Compute conditional probabilities
    </text>
    <text x="120" y="610" font-size="13" fill="#2c3e50">
      efficiently using graph structure:
    </text>
    
    <!-- Messages -->
    <rect x="120" y="625" width="240" height="25" fill="#d5f4e6" stroke="#27ae60" stroke-width="1" rx="3"/>
    <text x="130" y="642" font-size="11" fill="#2c3e50">
      Messages propagate along edges
    </text>
    
    <rect x="120" y="655" width="240" height="25" fill="#d5f4e6" stroke="#27ae60" stroke-width="1" rx="3"/>
    <text x="130" y="672" font-size="11" fill="#2c3e50">
      Iterative refinement until convergence
    </text>
  </g>
  
  <!-- Arrow -->
  <line x1="250" y1="710" x2="250" y2="760" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/>
  
  <!-- Step 4: Compute Scores -->
  <g id="step4">
    <rect x="100" y="770" width="300" height="180" fill="#fce4ec" stroke="#e91e63" stroke-width="3" rx="8"/>
    <text x="250" y="800" font-size="18" font-weight="bold" text-anchor="middle" fill="#e91e63">
      Step 4: Score Items
    </text>
    <text x="120" y="835" font-size="13" fill="#2c3e50">
      Extract conditional probabilities:
    </text>
    
    <rect x="120" y="850" width="240" height="30" fill="#c8e6c9" stroke="#27ae60" stroke-width="2" rx="3"/>
    <text x="130" y="872" font-size="12" fill="#2c3e50" font-weight="bold">
      Godfather: P(+1|Casa=+1) = 0.85
    </text>
    
    <rect x="120" y="890" width="240" height="30" fill="#fff9c4" stroke="#fbc02d" stroke-width="2" rx="3"/>
    <text x="130" y="912" font-size="12" fill="#2c3e50" font-weight="bold">
      Iron Man: P(+1|Casa=+1) = 0.15
    </text>
  </g>
  
  <!-- Right side: Parallel HMM workflow -->
  <g id="hmm-workflow">
    <text x="850" y="110" font-size="20" font-weight="bold" text-anchor="middle" fill="#9b59b6">
      HMM-Based Workflow
    </text>
    
    <!-- HMM Step 1 -->
    <rect x="650" y="140" width="400" height="120" fill="#f3e5f5" stroke="#9b59b6" stroke-width="3" rx="8"/>
    <text x="850" y="170" font-size="16" font-weight="bold" text-anchor="middle" fill="#9b59b6">
      Step 1: Sequence of Observations
    </text>
    <text x="670" y="200" font-size="12" fill="#2c3e50">
      t=1: Liked Goodfellas
    </text>
    <text x="670" y="225" font-size="12" fill="#2c3e50">
      t=2: Disliked Iron Man
    </text>
    <text x="670" y="250" font-size="12" fill="#95a5a6" font-style="italic">
      t=3: Recommend next movie?
    </text>
    
    <!-- Arrow -->
    <line x1="850" y1="270" x2="850" y2="300" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/>
    
    <!-- HMM Step 2 -->
    <rect x="650" y="310" width="400" height="140" fill="#fff3e0" stroke="#f39c12" stroke-width="3" rx="8"/>
    <text x="850" y="340" font-size="16" font-weight="bold" text-anchor="middle" fill="#f39c12">
      Step 2: Forward Algorithm
    </text>
    <text x="670" y="370" font-size="12" fill="#2c3e50">
      Compute P(H₂ | O₁, O₂) efficiently:
    </text>
    <text x="670" y="395" font-size="11" fill="#2c3e50">
      α₂(i) = [Σⱼ α₁(j) P(H₂=i|H₁=j)] × P(O₂|H₂=i)
    </text>
    <text x="670" y="420" font-size="12" fill="#2c3e50">
      Filter hidden state distribution
    </text>
    
    <!-- Arrow -->
    <line x1="850" y1="460" x2="850" y2="490" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/>
    
    <!-- HMM Step 3 -->
    <rect x="650" y="500" width="400" height="160" fill="#e8f5e9" stroke="#27ae60" stroke-width="3" rx="8"/>
    <text x="850" y="530" font-size="16" font-weight="bold" text-anchor="middle" fill="#27ae60">
      Step 3: Predict Next Observation
    </text>
    <text x="670" y="560" font-size="12" fill="#2c3e50">
      For each movie m, compute:
    </text>
    <text x="670" y="585" font-size="11" fill="#2c3e50">
      P(O₃ = m liked | O₁, O₂)
    </text>
    <text x="670" y="610" font-size="12" fill="#2c3e50">
      Uses learned transition and emission
    </text>
    <text x="670" y="635" font-size="12" fill="#2c3e50">
      probabilities to predict future preference
    </text>
    
    <!-- Arrow -->
    <line x1="850" y1="670" x2="850" y2="700" stroke="#34495e" stroke-width="3" marker-end="url(#arrow)"/>
    
    <!-- HMM Step 4 -->
    <rect x="650" y="710" width="400" height="140" fill="#fce4ec" stroke="#e91e63" stroke-width="3" rx="8"/>
    <text x="850" y="740" font-size="16" font-weight="bold" text-anchor="middle" fill="#e91e63">
      Step 4: Temporal-Aware Ranking
    </text>
    <text x="670" y="770" font-size="12" fill="#2c3e50">
      Rank considering sequence:
    </text>
    
    <rect x="670" y="785" width="340" height="25" fill="#c8e6c9" stroke="#27ae60" stroke-width="2" rx="3"/>
    <text x="680" y="803" font-size="11" fill="#2c3e50" font-weight="bold">
      1. Godfather Part 1: 0.78 (respects order!)
    </text>
    
    <rect x="670" y="815" width="340" height="25" fill="#fff9c4" stroke="#fbc02d" stroke-width="2" rx="3"/>
    <text x="680" y="833" font-size="11" fill="#2c3e50" font-weight="bold">
      2. Godfather Part 2: 0.65 (sequence aware)
    </text>
  </g>
  
  <!-- Comparison box at bottom -->
  <rect x="100" y="970" width="1000" height="1" fill="#95a5a6"/>
</svg>