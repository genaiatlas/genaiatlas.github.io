<svg viewBox="0 0 1000 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f9ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0f2fe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="posGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="negGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="zeroGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6b7280;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#4b5563;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="900" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" fill="#0c4a6e" font-family="Arial, sans-serif" font-size="28" font-weight="bold">Correlation and Relationships</text>
  <text x="500" y="65" text-anchor="middle" fill="#0c4a6e" font-family="Arial, sans-serif" font-size="16">Understanding Variable Dependencies</text>
  
  <!-- Strong Positive Correlation -->
  <g transform="translate(50, 100)">
    <rect x="0" y="0" width="280" height="280" rx="10" fill="white" stroke="#10b981" stroke-width="2"/>
    <rect x="0" y="0" width="280" height="40" rx="10" fill="url(#posGrad)"/>
    <text x="140" y="25" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">STRONG POSITIVE</text>
    
    <!-- Scatter plot with strong positive correlation -->
    <g transform="translate(20, 60)">
      <!-- Axes -->
      <line x1="20" y1="180" x2="220" y2="180" stroke="#374151" stroke-width="2"/>
      <line x1="20" y1="40" x2="20" y2="180" stroke="#374151" stroke-width="2"/>
      
      <!-- Data points -->
      <circle cx="30" cy="170" r="4" fill="#10b981" opacity="0.7"/>
      <circle cx="40" cy="165" r="4" fill="#10b981" opacity="0.7"/>
      <circle cx="50" cy="160" r="4" fill="#10b981" opacity="0.7"/>
      <circle cx="60" cy="155" r="4" fill="#10b981" opacity="0.7"/>
      <circle cx="70" cy="150" r="4" fill="#10b981" opacity="0.7"/>
      <circle cx="80" cy="145" r="4" fill="#10b981" opacity="0.7"/>
      <circle cx="90" cy="140" r="4" fill="#10b981" opacity="0.7"/>
      <circle cx="100" cy="135" r="4" fill="#10b981" opacity="0.7"/>
      <circle cx="110" cy="130" r="4" fill="#10b981" opacity="0.7"/>
      <circle cx="120" cy="125" r="4" fill="#10b981" opacity="0.7"/>
      <circle cx="130" cy="120" r="4" fill="#10b981" opacity="0.7"/>
      <circle cx="140" cy="115" r="4" fill="#10b981" opacity="0.7"/>
      <circle cx="150" cy="110" r="4" fill="#10b981" opacity="0.7"/>
      <circle cx="160" cy="105" r="4" fill="#10b981" opacity="0.7"/>
      <circle cx="170" cy="100" r="4" fill="#10b981" opacity="0.7"/>
      <circle cx="180" cy="95" r="4" fill="#10b981" opacity="0.7"/>
      <circle cx="190" cy="90" r="4" fill="#10b981" opacity="0.7"/>
      <circle cx="200" cy="85" r="4" fill="#10b981" opacity="0.7"/>
      <circle cx="210" cy="80" r="4" fill="#10b981" opacity="0.7"/>
      
      <!-- Trend line -->
      <line x1="25" y1="175" x2="215" y2="75" stroke="#059669" stroke-width="3"/>
      
      <!-- Labels -->
      <text x="120" y="200" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">Variable X</text>
      <text x="5" y="110" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12" transform="rotate(-90, 5, 110)">Variable Y</text>
    </g>
    
    <text x="140" y="250" text-anchor="middle" fill="#059669" font-family="Arial, sans-serif" font-size="12" font-weight="bold">r ≈ +0.9</text>
    <text x="140" y="265" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="11">As X increases, Y increases</text>
  </g>
  
  <!-- Strong Negative Correlation -->
  <g transform="translate(360, 100)">
    <rect x="0" y="0" width="280" height="280" rx="10" fill="white" stroke="#ef4444" stroke-width="2"/>
    <rect x="0" y="0" width="280" height="40" rx="10" fill="url(#negGrad)"/>
    <text x="140" y="25" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">STRONG NEGATIVE</text>
    
    <!-- Scatter plot with strong negative correlation -->
    <g transform="translate(20, 60)">
      <!-- Axes -->
      <line x1="20" y1="180" x2="220" y2="180" stroke="#374151" stroke-width="2"/>
      <line x1="20" y1="40" x2="20" y2="180" stroke="#374151" stroke-width="2"/>
      
      <!-- Data points -->
      <circle cx="30" cy="80" r="4" fill="#ef4444" opacity="0.7"/>
      <circle cx="40" cy="85" r="4" fill="#ef4444" opacity="0.7"/>
      <circle cx="50" cy="90" r="4" fill="#ef4444" opacity="0.7"/>
      <circle cx="60" cy="95" r="4" fill="#ef4444" opacity="0.7"/>
      <circle cx="70" cy="100" r="4" fill="#ef4444" opacity="0.7"/>
      <circle cx="80" cy="105" r="4" fill="#ef4444" opacity="0.7"/>
      <circle cx="90" cy="110" r="4" fill="#ef4444" opacity="0.7"/>
      <circle cx="100" cy="115" r="4" fill="#ef4444" opacity="0.7"/>
      <circle cx="110" cy="120" r="4" fill="#ef4444" opacity="0.7"/>
      <circle cx="120" cy="125" r="4" fill="#ef4444" opacity="0.7"/>
      <circle cx="130" cy="130" r="4" fill="#ef4444" opacity="0.7"/>
      <circle cx="140" cy="135" r="4" fill="#ef4444" opacity="0.7"/>
      <circle cx="150" cy="140" r="4" fill="#ef4444" opacity="0.7"/>
      <circle cx="160" cy="145" r="4" fill="#ef4444" opacity="0.7"/>
      <circle cx="170" cy="150" r="4" fill="#ef4444" opacity="0.7"/>
      <circle cx="180" cy="155" r="4" fill="#ef4444" opacity="0.7"/>
      <circle cx="190" cy="160" r="4" fill="#ef4444" opacity="0.7"/>
      <circle cx="200" cy="165" r="4" fill="#ef4444" opacity="0.7"/>
      <circle cx="210" cy="170" r="4" fill="#ef4444" opacity="0.7"/>
      
      <!-- Trend line -->
      <line x1="25" y1="75" x2="215" y2="175" stroke="#dc2626" stroke-width="3"/>
      
      <!-- Labels -->
      <text x="120" y="200" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">Variable X</text>
      <text x="5" y="110" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12" transform="rotate(-90, 5, 110)">Variable Y</text>
    </g>
    
    <text x="140" y="250" text-anchor="middle" fill="#dc2626" font-family="Arial, sans-serif" font-size="12" font-weight="bold">r ≈ -0.9</text>
    <text x="140" y="265" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="11">As X increases, Y decreases</text>
  </g>
  
  <!-- No Correlation -->
  <g transform="translate(670, 100)">
    <rect x="0" y="0" width="280" height="280" rx="10" fill="white" stroke="#6b7280" stroke-width="2"/>
    <rect x="0" y="0" width="280" height="40" rx="10" fill="url(#zeroGrad)"/>
    <text x="140" y="25" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">NO CORRELATION</text>
    
    <!-- Scatter plot with no correlation -->
    <g transform="translate(20, 60)">
      <!-- Axes -->
      <line x1="20" y1="180" x2="220" y2="180" stroke="#374151" stroke-width="2"/>
      <line x1="20" y1="40" x2="20" y2="180" stroke="#374151" stroke-width="2"/>
      
      <!-- Random data points -->
      <circle cx="30" cy="120" r="4" fill="#6b7280" opacity="0.7"/>
      <circle cx="40" cy="95" r="4" fill="#6b7280" opacity="0.7"/>
      <circle cx="50" cy="140" r="4" fill="#6b7280" opacity="0.7"/>
      <circle cx="60" cy="85" r="4" fill="#6b7280" opacity="0.7"/>
      <circle cx="70" cy="160" r="4" fill="#6b7280" opacity="0.7"/>
      <circle cx="80" cy="110" r="4" fill="#6b7280" opacity="0.7"/>
      <circle cx="90" cy="130" r="4" fill="#6b7280" opacity="0.7"/>
      <circle cx="100" cy="75" r="4" fill="#6b7280" opacity="0.7"/>
      <circle cx="110" cy="150" r="4" fill="#6b7280" opacity="0.7"/>
      <circle cx="120" cy="100" r="4" fill="#6b7280" opacity="0.7"/>
      <circle cx="130" cy="170" r="4" fill="#6b7280" opacity="0.7"/>
      <circle cx="140" cy="90" r="4" fill="#6b7280" opacity="0.7"/>
      <circle cx="150" cy="125" r="4" fill="#6b7280" opacity="0.7"/>
      <circle cx="160" cy="105" r="4" fill="#6b7280" opacity="0.7"/>
      <circle cx="170" cy="155" r="4" fill="#6b7280" opacity="0.7"/>
      <circle cx="180" cy="80" r="4" fill="#6b7280" opacity="0.7"/>
      <circle cx="190" cy="135" r="4" fill="#6b7280" opacity="0.7"/>
      <circle cx="200" cy="115" r="4" fill="#6b7280" opacity="0.7"/>
      <circle cx="210" cy="145" r="4" fill="#6b7280" opacity="0.7"/>
      
      <!-- Flat trend line -->
      <line x1="25" y1="125" x2="215" y2="125" stroke="#4b5563" stroke-width="3" stroke-dasharray="5,5"/>
      
      <!-- Labels -->
      <text x="120" y="200" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">Variable X</text>
      <text x="5" y="110" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12" transform="rotate(-90, 5, 110)">Variable Y</text>
    </g>
    
    <text x="140" y="250" text-anchor="middle" fill="#4b5563" font-family="Arial, sans-serif" font-size="12" font-weight="bold">r ≈ 0</text>
    <text x="140" y="265" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="11">No linear relationship</text>
  </g>
  
  <!-- Non-linear Relationship -->
  <g transform="translate(50, 410)">
    <rect x="0" y="0" width="280" height="280" rx="10" fill="white" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="0" y="0" width="280" height="40" rx="10" fill="#8b5cf6" fill-opacity="0.8"/>
    <text x="140" y="25" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">NON-LINEAR</text>
    
    <!-- Scatter plot with non-linear relationship -->
    <g transform="translate(20, 60)">
      <!-- Axes -->
      <line x1="20" y1="180" x2="220" y2="180" stroke="#374151" stroke-width="2"/>
      <line x1="20" y1="40" x2="20" y2="180" stroke="#374151" stroke-width="2"/>
      
      <!-- Curved data points (quadratic) -->
      <circle cx="30" cy="160" r="4" fill="#8b5cf6" opacity="0.7"/>
      <circle cx="40" cy="140" r="4" fill="#8b5cf6" opacity="0.7"/>
      <circle cx="50" cy="125" r="4" fill="#8b5cf6" opacity="0.7"/>
      <circle cx="60" cy="115" r="4" fill="#8b5cf6" opacity="0.7"/>
      <circle cx="70" cy="110" r="4" fill="#8b5cf6" opacity="0.7"/>
      <circle cx="80" cy="105" r="4" fill="#8b5cf6" opacity="0.7"/>
      <circle cx="90" cy="95" r="4" fill="#8b5cf6" opacity="0.7"/>
      <circle cx="100" cy="85" r="4" fill="#8b5cf6" opacity="0.7"/>
      <circle cx="110" cy="80" r="4" fill="#8b5cf6" opacity="0.7"/>
      <circle cx="120" cy="75" r="4" fill="#8b5cf6" opacity="0.7"/>
      <circle cx="130" cy="80" r="4" fill="#8b5cf6" opacity="0.7"/>
      <circle cx="140" cy="85" r="4" fill="#8b5cf6" opacity="0.7"/>
      <circle cx="150" cy="95" r="4" fill="#8b5cf6" opacity="0.7"/>
      <circle cx="160" cy="105" r="4" fill="#8b5cf6" opacity="0.7"/>
      <circle cx="170" cy="110" r="4" fill="#8b5cf6" opacity="0.7"/>
      <circle cx="180" cy="115" r="4" fill="#8b5cf6" opacity="0.7"/>
      <circle cx="190" cy="125" r="4" fill="#8b5cf6" opacity="0.7"/>
      <circle cx="200" cy="140" r="4" fill="#8b5cf6" opacity="0.7"/>
      <circle cx="210" cy="160" r="4" fill="#8b5cf6" opacity="0.7"/>
      
      <!-- Curved trend line -->
      <path d="M 25 165 Q 120 70 215 165" fill="none" stroke="#7c3aed" stroke-width="3"/>
      
      <!-- Labels -->
      <text x="120" y="200" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">Variable X</text>
      <text x="5" y="110" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12" transform="rotate(-90, 5, 110)">Variable Y</text>
    </g>
    
    <text x="140" y="250" text-anchor="middle" fill="#7c3aed" font-family="Arial, sans-serif" font-size="12" font-weight="bold">r ≈ 0, but related</text>
    <text x="140" y="265" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="11">Non-linear pattern exists</text>
  </g>
  
  <!-- Correlation Types Table -->
  <g transform="translate(360, 410)">
    <rect x="0" y="0" width="590" height="280" rx="10" fill="white" stroke="#0891b2" stroke-width="2"/>
    <rect x="0" y="0" width="590" height="40" rx="10" fill="#0891b2" fill-opacity="0.8"/>
    <text x="295" y="25" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">CORRELATION MEASURES</text>
    
    <!-- Pearson vs Spearman vs Kendall -->
    <g transform="translate(20, 60)">
      <!-- Headers -->
      <text x="10" y="20" fill="#0c4a6e" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Measure</text>
      <text x="120" y="20" fill="#0c4a6e" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Type</text>
      <text x="220" y="20" fill="#0c4a6e" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Best For</text>
      <text x="380" y="20" fill="#0c4a6e" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Formula/Notes</text>
      
      <!-- Divider line -->
      <line x1="0" y1="30" x2="570" y2="30" stroke="#cbd5e1" stroke-width="1"/>
      
      <!-- Pearson -->
      <text x="10" y="50" fill="#374151" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Pearson (r)</text>
      <text x="120" y="50" fill="#374151" font-family="Arial, sans-serif" font-size="12">Linear</text>
      <text x="220" y="50" fill="#374151" font-family="Arial, sans-serif" font-size="12">Normal data, linear relationships</text>
      <text x="380" y="50" fill="#374151" font-family="Arial, sans-serif" font-size="11">Measures linear correlation</text>
      
      <!-- Spearman -->
      <text x="10" y="80" fill="#374151" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Spearman (ρ)</text>
      <text x="120" y="80" fill="#374151" font-family="Arial, sans-serif" font-size="12">Rank-based</text>
      <text x="220" y="80" fill="#374151" font-family="Arial, sans-serif" font-size="12">Monotonic relationships</text>
      <text x="380" y="80" fill="#374151" font-family="Arial, sans-serif" font-size="11">Uses ranks instead of raw values</text>
      
      <!-- Kendall -->
      <text x="10" y="110" fill="#374151" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Kendall (τ)</text>
      <text x="120" y="110" fill="#374151" font-family="Arial, sans-serif" font-size="12">Rank-based</text>
      <text x="220" y="110" fill="#374151" font-family="Arial, sans-serif" font-size="12">Small samples, robust</text>
      <text x="380" y="110" fill="#374151" font-family="Arial, sans-serif" font-size="11">Based on concordant pairs</text>
      
      <!-- Strength Guidelines -->
      <text x="10" y="150" fill="#0c4a6e" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Correlation Strength Guidelines:</text>
      
      <text x="10" y="175" fill="#374151" font-family="Arial, sans-serif" font-size="12">• |r| less than 0.3: Weak correlation</text>
      <text x="200" y="175" fill="#374151" font-family="Arial, sans-serif" font-size="12">• 0.3 to 0.7: Moderate correlation</text>
      <text x="420" y="175" fill="#374151" font-family="Arial, sans-serif" font-size="12">• |r| ≥ 0.7: Strong correlation</text>
      
      <!-- Important Notes -->
      <text x="10" y="210" fill="#dc2626" font-family="Arial, sans-serif" font-size="13" font-weight="bold">⚠ Important Considerations:</text>
      <text x="10" y="230" fill="#374151" font-family="Arial, sans-serif" font-size="11">• Correlation ≠ Causation</text>
      <text x="180" y="230" fill="#374151" font-family="Arial, sans-serif" font-size="11">• Check for outliers</text>
      <text x="320" y="230" fill="#374151" font-family="Arial, sans-serif" font-size="11">• Consider non-linear relationships</text>
    </g>
  </g>
  
  <!-- Applications Section -->
  <g transform="translate(50, 720)">
    <rect x="0" y="0" width="900" height="140" rx="10" fill="white" stroke="#059669" stroke-width="2"/>
    <rect x="0" y="0" width="900" height="35" rx="10" fill="#10b981" fill-opacity="0.8"/>
    <text x="450" y="22" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">PRACTICAL APPLICATIONS</text>
    
    <g transform="translate(20, 50)">
      <text x="10" y="20" fill="#065f46" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Feature Selection:</text>
      <text x="10" y="40" fill="#374151" font-family="Arial, sans-serif" font-size="12">Remove highly correlated features to avoid multicollinearity</text>
      
      <text x="300" y="20" fill="#065f46" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Model Validation:</text>
      <text x="300" y="40" fill="#374151" font-family="Arial, sans-serif" font-size="12">Compare predictions with actual values</text>
      
      <text x="580" y="20" fill="#065f46" font-family="Arial, sans-serif" font-size="14" font-weight="bold">EDA:</text>
      <text x="580" y="40" fill="#374151" font-family="Arial, sans-serif" font-size="12">Understand variable relationships</text>
      
      <text x="10" y="70" fill="#065f46" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Risk Assessment:</text>
      <text x="10" y="90" fill="#374151" font-family="Arial, sans-serif" font-size="12">Identify related risk factors in portfolios</text>
      
      <text x="300" y="70" fill="#065f46" font-family="Arial, sans-serif" font-size="14" font-weight="bold">A/B Testing:</text>
      <text x="300" y="90" fill="#374151" font-family="Arial, sans-serif" font-size="12">Measure relationships between metrics</text>
      
      <text x="580" y="70" fill="#065f46" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Dimensionality Reduction:</text>
      <text x="580" y="90" fill="#374151" font-family="Arial, sans-serif" font-size="12">Guide PCA and factor analysis</text>
    </g>
  </g>
</svg>