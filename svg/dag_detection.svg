<svg viewBox="0 0 1400 1100" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1400" height="1100" fill="#fafafa"/>
  
  <!-- Title -->
  <text x="700" y="45" font-size="30" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Detecting Directed Acyclic Graphs (DAGs)
  </text>
  
  <!-- Section 1: What is a DAG? -->
  <g id="dag-definition">
    <rect x="50" y="80" width="630" height="400" fill="#e8eaf6" stroke="#3f51b5" stroke-width="2" rx="10"/>
    
    <text x="365" y="120" font-size="22" font-weight="bold" text-anchor="middle" fill="#1a237e">
      Directed Acyclic Graph (DAG)
    </text>
    
    <!-- DAG Example -->
    <g transform="translate(100, 150)">
      <text x="230" y="-10" font-size="16" font-weight="bold" fill="#1a237e">✓ Valid DAG</text>
      
      <!-- Nodes -->
      <circle cx="100" cy="50" r="30" fill="#7986cb" stroke="#3f51b5" stroke-width="2"/>
      <text x="100" y="58" font-size="18" font-weight="bold" text-anchor="middle" fill="white">A</text>
      
      <circle cx="50" cy="150" r="30" fill="#7986cb" stroke="#3f51b5" stroke-width="2"/>
      <text x="50" y="158" font-size="18" font-weight="bold" text-anchor="middle" fill="white">B</text>
      
      <circle cx="150" cy="150" r="30" fill="#7986cb" stroke="#3f51b5" stroke-width="2"/>
      <text x="150" y="158" font-size="18" font-weight="bold" text-anchor="middle" fill="white">C</text>
      
      <circle cx="100" cy="250" r="30" fill="#7986cb" stroke="#3f51b5" stroke-width="2"/>
      <text x="100" y="258" font-size="18" font-weight="bold" text-anchor="middle" fill="white">D</text>
      
      <!-- Directed edges -->
      <defs>
        <marker id="arrowblue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
          <path d="M0,0 L0,6 L9,3 z" fill="#3f51b5"/>
        </marker>
      </defs>
      
      <line x1="85" y1="75" x2="65" y2="125" stroke="#3f51b5" stroke-width="3" marker-end="url(#arrowblue)"/>
      <line x1="115" y1="75" x2="135" y2="125" stroke="#3f51b5" stroke-width="3" marker-end="url(#arrowblue)"/>
      <line x1="60" y1="180" x2="90" y2="225" stroke="#3f51b5" stroke-width="3" marker-end="url(#arrowblue)"/>
      <line x1="140" y1="180" x2="110" y2="225" stroke="#3f51b5" stroke-width="3" marker-end="url(#arrowblue)"/>
    </g>
    
    <!-- Adjacency Matrix for DAG -->
    <g transform="translate(350, 180)">
      <text x="0" y="-20" font-size="14" font-weight="bold" fill="#333">Adjacency Matrix:</text>
      <rect x="0" y="0" width="200" height="200" fill="white" stroke="#3f51b5" stroke-width="2"/>
      
      <!-- Headers -->
      <text x="35" y="-10" font-size="12" font-weight="bold" fill="#666">A</text>
      <text x="85" y="-10" font-size="12" font-weight="bold" fill="#666">B</text>
      <text x="135" y="-10" font-size="12" font-weight="bold" fill="#666">C</text>
      <text x="185" y="-10" font-size="12" font-weight="bold" fill="#666">D</text>
      
      <text x="-10" y="30" font-size="12" font-weight="bold" fill="#666">A</text>
      <text x="-10" y="80" font-size="12" font-weight="bold" fill="#666">B</text>
      <text x="-10" y="130" font-size="12" font-weight="bold" fill="#666">C</text>
      <text x="-10" y="180" font-size="12" font-weight="bold" fill="#666">D</text>
      
      <!-- Diagonal highlight -->
      <rect x="0" y="0" width="50" height="50" fill="#c5cae9"/>
      <rect x="50" y="50" width="50" height="50" fill="#c5cae9"/>
      <rect x="100" y="100" width="50" height="50" fill="#c5cae9"/>
      <rect x="150" y="150" width="50" height="50" fill="#c5cae9"/>
      
      <!-- Matrix values -->
      <text x="25" y="30" font-size="16" text-anchor="middle" font-weight="bold" fill="#1a237e">0</text>
      <text x="75" y="30" font-size="16" text-anchor="middle">1</text>
      <text x="125" y="30" font-size="16" text-anchor="middle">1</text>
      <text x="175" y="30" font-size="16" text-anchor="middle">0</text>
      
      <text x="25" y="80" font-size="16" text-anchor="middle">0</text>
      <text x="75" y="80" font-size="16" text-anchor="middle" font-weight="bold" fill="#1a237e">0</text>
      <text x="125" y="80" font-size="16" text-anchor="middle">0</text>
      <text x="175" y="80" font-size="16" text-anchor="middle">1</text>
      
      <text x="25" y="130" font-size="16" text-anchor="middle">0</text>
      <text x="75" y="130" font-size="16" text-anchor="middle">0</text>
      <text x="125" y="130" font-size="16" text-anchor="middle" font-weight="bold" fill="#1a237e">0</text>
      <text x="175" y="130" font-size="16" text-anchor="middle">1</text>
      
      <text x="25" y="180" font-size="16" text-anchor="middle">0</text>
      <text x="75" y="180" font-size="16" text-anchor="middle">0</text>
      <text x="125" y="180" font-size="16" text-anchor="middle">0</text>
      <text x="175" y="180" font-size="16" text-anchor="middle" font-weight="bold" fill="#1a237e">0</text>
    </g>
    
    <text x="365" y="420" font-size="15" text-anchor="middle" fill="#333">
      <tspan font-weight="bold">No cycles:</tspan> Cannot return to any node following directed edges
    </text>
    
    <text x="365" y="445" font-size="15" text-anchor="middle" fill="#333">
      <tspan font-weight="bold">All diagonal entries are 0</tspan> (no self-loops)
    </text>
  </g>
  
  <!-- Section 2: NOT a DAG (Has Cycle) -->
  <g id="not-dag">
    <rect x="720" y="80" width="630" height="400" fill="#ffebee" stroke="#c62828" stroke-width="2" rx="10"/>
    
    <text x="1035" y="120" font-size="22" font-weight="bold" text-anchor="middle" fill="#b71c1c">
      Not a DAG (Contains Cycle)
    </text>
    
    <!-- Cyclic Graph Example -->
    <g transform="translate(770, 150)">
      <text x="230" y="-10" font-size="16" font-weight="bold" fill="#b71c1c">✗ Has Cycle</text>
      
      <!-- Nodes -->
      <circle cx="100" cy="50" r="30" fill="#ef5350" stroke="#c62828" stroke-width="2"/>
      <text x="100" y="58" font-size="18" font-weight="bold" text-anchor="middle" fill="white">A</text>
      
      <circle cx="50" cy="150" r="30" fill="#ef5350" stroke="#c62828" stroke-width="2"/>
      <text x="50" y="158" font-size="18" font-weight="bold" text-anchor="middle" fill="white">B</text>
      
      <circle cx="150" cy="150" r="30" fill="#ef5350" stroke="#c62828" stroke-width="2"/>
      <text x="150" y="158" font-size="18" font-weight="bold" text-anchor="middle" fill="white">C</text>
      
      <circle cx="100" cy="250" r="30" fill="#ef5350" stroke="#c62828" stroke-width="2"/>
      <text x="100" y="258" font-size="18" font-weight="bold" text-anchor="middle" fill="white">D</text>
      
      <!-- Directed edges with cycle -->
      <defs>
        <marker id="arrowred" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
          <path d="M0,0 L0,6 L9,3 z" fill="#c62828"/>
        </marker>
      </defs>
      
      <line x1="85" y1="75" x2="65" y2="125" stroke="#c62828" stroke-width="3" marker-end="url(#arrowred)"/>
      <line x1="115" y1="75" x2="135" y2="125" stroke="#c62828" stroke-width="3" marker-end="url(#arrowred)"/>
      <line x1="60" y1="180" x2="90" y2="225" stroke="#c62828" stroke-width="3" marker-end="url(#arrowred)"/>
      <line x1="110" y1="225" x2="140" y2="180" stroke="#c62828" stroke-width="3" marker-end="url(#arrowred)"/>
      
      <!-- Highlight the cycle -->
      <path d="M 150 150 Q 180 200 100 250 Q 20 200 50 150" fill="none" stroke="#ff9800" stroke-width="4" stroke-dasharray="5,5" opacity="0.7"/>
      <text x="100" y="195" font-size="14" font-weight="bold" fill="#ff6f00" text-anchor="middle">Cycle!</text>
    </g>
    
    <!-- Adjacency Matrix for Cyclic -->
    <g transform="translate(1020, 180)">
      <text x="0" y="-20" font-size="14" font-weight="bold" fill="#333">Adjacency Matrix:</text>
      <rect x="0" y="0" width="200" height="200" fill="white" stroke="#c62828" stroke-width="2"/>
      
      <!-- Headers -->
      <text x="35" y="-10" font-size="12" font-weight="bold" fill="#666">A</text>
      <text x="85" y="-10" font-size="12" font-weight="bold" fill="#666">B</text>
      <text x="135" y="-10" font-size="12" font-weight="bold" fill="#666">C</text>
      <text x="185" y="-10" font-size="12" font-weight="bold" fill="#666">D</text>
      
      <text x="-10" y="30" font-size="12" font-weight="bold" fill="#666">A</text>
      <text x="-10" y="80" font-size="12" font-weight="bold" fill="#666">B</text>
      <text x="-10" y="130" font-size="12" font-weight="bold" fill="#666">C</text>
      <text x="-10" y="180" font-size="12" font-weight="bold" fill="#666">D</text>
      
      <!-- Matrix values -->
      <text x="25" y="30" font-size="16" text-anchor="middle">0</text>
      <text x="75" y="30" font-size="16" text-anchor="middle">1</text>
      <text x="125" y="30" font-size="16" text-anchor="middle">1</text>
      <text x="175" y="30" font-size="16" text-anchor="middle">0</text>
      
      <text x="25" y="80" font-size="16" text-anchor="middle">0</text>
      <text x="75" y="80" font-size="16" text-anchor="middle">0</text>
      <text x="125" y="80" font-size="16" text-anchor="middle">0</text>
      <text x="175" y="80" font-size="16" text-anchor="middle">1</text>
      
      <text x="25" y="130" font-size="16" text-anchor="middle">0</text>
      <text x="75" y="130" font-size="16" text-anchor="middle">0</text>
      <text x="125" y="130" font-size="16" text-anchor="middle">0</text>
      <rect x="150" y="105" width="50" height="50" fill="#ffccbc"/>
      <text x="175" y="130" font-size="16" text-anchor="middle" font-weight="bold" fill="#b71c1c">1</text>
      
      <text x="25" y="180" font-size="16" text-anchor="middle">0</text>
      <text x="75" y="180" font-size="16" text-anchor="middle">0</text>
      <rect x="100" y="155" width="50" height="50" fill="#ffccbc"/>
      <text x="125" y="180" font-size="16" text-anchor="middle" font-weight="bold" fill="#b71c1c">1</text>
      <text x="175" y="180" font-size="16" text-anchor="middle">0</text>
    </g>
    
    <text x="1035" y="420" font-size="15" text-anchor="middle" fill="#333">
      <tspan font-weight="bold">Has cycle:</tspan> Can return to nodes following directed edges
    </text>
    
    <text x="1035" y="445" font-size="15" text-anchor="middle" fill="#333">
      <tspan font-weight="bold">Trace(A<tspan baseline-shift="super" font-size="11">k</tspan>) ≠ 0</tspan> for some k (cycle detected)
    </text>
  </g>
  
  <!-- Section 3: Detection Method -->
  <g id="detection-method">
    <rect x="50" y="500" width="1300" height="280" fill="#e0f2f1" stroke="#00796b" stroke-width="2" rx="10"/>
    
    <text x="700" y="540" font-size="24" font-weight="bold" text-anchor="middle" fill="#004d40">
      DAG Detection Using Matrix Powers and Eigenvalues
    </text>
    
    <!-- Mathematical approach -->
    <g transform="translate(100, 570)">
      <rect x="0" y="0" width="1200" height="180" fill="white" stroke="#00796b" stroke-width="1" rx="5"/>
      
      <text x="600" y="35" font-size="18" font-weight="bold" text-anchor="middle" fill="#004d40">
        Cycle Detection via Trace
      </text>
      
      <text x="600" y="70" font-size="16" text-anchor="middle" fill="#333">
        # of cycles of length k = Trace(A<tspan baseline-shift="super" font-size="12">k</tspan>) = Σ<tspan baseline-shift="sub" font-size="12">i</tspan> (A<tspan baseline-shift="super" font-size="12">k</tspan>)<tspan baseline-shift="sub" font-size="12">ii</tspan>
      </text>
      
      <text x="600" y="100" font-size="15" text-anchor="middle" fill="#666">
        A directed graph is a DAG ⟺ Trace(A<tspan baseline-shift="super" font-size="11">k</tspan>) = 0 for all k ≥ 1
      </text>
      
      <line x1="100" y1="120" x2="1100" y2="120" stroke="#00796b" stroke-width="1"/>
      
      <text x="600" y="150" font-size="16" font-weight="bold" text-anchor="middle" fill="#004d40">
        Practical Solution: Use Eigenvalues
      </text>
    </g>
  </g>
  
  <!-- Section 4: Eigenvalue Method -->
  <g id="eigenvalue-method">
    <rect x="50" y="800" width="1300" height="260" fill="#fff9c4" stroke="#f57f17" stroke-width="2" rx="10"/>
    
    <text x="700" y="840" font-size="24" font-weight="bold" text-anchor="middle" fill="#f57f00">
      Eigenvalue-Based DAG Detection Algorithm
    </text>
    
    <g transform="translate(100, 870)">
      <rect x="0" y="0" width="400" height="150" fill="white" stroke="#f57f17" stroke-width="1" rx="5"/>
      <text x="200" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#f57f00">Step 1: Mathematical Theorem</text>
      <text x="200" y="60" font-size="13" text-anchor="middle" fill="#666">Trace(A<tspan baseline-shift="super" font-size="10">k</tspan>) = 0 for all k</text>
      <text x="200" y="82" font-size="13" text-anchor="middle" fill="#666">⟺</text>
      <text x="200" y="104" font-size="13" text-anchor="middle" fill="#666">All eigenvalues of A are 0</text>
      <text x="200" y="130" font-size="12" text-anchor="middle" fill="#999">(λ₁ = λ₂ = ... = λₙ = 0)</text>
    </g>
    
    <text x="530" y="950" font-size="30" font-weight="bold" fill="#f57f00">→</text>
    
    <g transform="translate(580, 870)">
      <rect x="0" y="0" width="320" height="150" fill="white" stroke="#f57f17" stroke-width="1" rx="5"/>
      <text x="160" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#f57f00">Step 2: Compute</text>
      <text x="160" y="65" font-size="13" text-anchor="middle" fill="#666">Calculate eigenvalues</text>
      <text x="160" y="88" font-size="13" text-anchor="middle" fill="#666">λ₁, λ₂, ..., λₙ</text>
      <text x="160" y="111" font-size="13" text-anchor="middle" fill="#666">of adjacency matrix A</text>
      <text x="160" y="135" font-size="11" text-anchor="middle" fill="#999">O(n³) complexity</text>
    </g>
    
    <text x="930" y="950" font-size="30" font-weight="bold" fill="#f57f00">→</text>
    
    <g transform="translate(980, 870)">
      <rect x="0" y="0" width="320" height="150" fill="white" stroke="#f57f17" stroke-width="1" rx="5"/>
      <text x="160" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#f57f00">Step 3: Check</text>
      <text x="160" y="65" font-size="13" text-anchor="middle" fill="#666">If all λᵢ = 0:</text>
      <text x="160" y="90" font-size="13" font-weight="bold" text-anchor="middle" fill="#43a047">✓ Graph is a DAG</text>
      <text x="160" y="115" font-size="13" text-anchor="middle" fill="#666">Otherwise:</text>
      <text x="160" y="138" font-size="13" font-weight="bold" text-anchor="middle" fill="#e53935">✗ Contains cycles</text>
    </g>
  </g>
  
  <!-- Bottom Key Insight -->
  <g transform="translate(700, 1080)">
    <text x="0" y="0" font-size="16" font-weight="bold" text-anchor="middle" fill="#555">
      Key Insight: Eigenvalues eliminate the need to compute infinite matrix powers!
    </text>
  </g>
</svg>