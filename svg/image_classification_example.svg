<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="500" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">Image Classification Challenge</text>
  
  <!-- Input representation -->
  <text x="150" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">256×256×3 Image</text>
  
  <!-- Image grid representation -->
  <rect x="50" y="80" width="200" height="200" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2"/>
  
  <!-- Grid lines to show pixel structure -->
  <g stroke="#bdc3c7" stroke-width="0.5" opacity="0.5">
    <line x1="60" y1="80" x2="60" y2="280"/>
    <line x1="70" y1="80" x2="70" y2="280"/>
    <line x1="80" y1="80" x2="80" y2="280"/>
    <line x1="90" y1="80" x2="90" y2="280"/>
    <line x1="100" y1="80" x2="100" y2="280"/>
    
    <line x1="50" y1="90" x2="250" y2="90"/>
    <line x1="50" y1="100" x2="250" y2="100"/>
    <line x1="50" y1="110" x2="250" y2="110"/>
    <line x1="50" y1="120" x2="250" y2="120"/>
    <line x1="50" y1="130" x2="250" y2="130"/>
  </g>
  
  <!-- Sample pixel values -->
  <rect x="120" y="150" width="60" height="40" fill="#3498db" opacity="0.7"/>
  <text x="150" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">R: 124</text>
  <text x="150" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">G: 89</text>
  <text x="150" y="191" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">B: 201</text>
  
  <!-- Dimensions label -->
  <text x="150" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">Height: 256 pixels</text>
  <text x="270" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d" transform="rotate(90 270 180)">Width: 256 pixels</text>
  <text x="150" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">Channels: 3 (RGB)</text>
  <text x="150" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e74c3c">Total: 196,608 features</text>
  
  <!-- Arrow to perceptron -->
  <path d="M250 180 L320 180" stroke="#2c3e50" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="285" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Flatten</text>
  
  <!-- Single Perceptron -->
  <circle cx="350" cy="180" r="30" fill="#f39c12" stroke="#2c3e50" stroke-width="3"/>
  <text x="350" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">P</text>
  
  <!-- Linear function equation -->
  <text x="350" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Linear Function:</text>
  <text x="350" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">f(x) = w₁x₁ + w₂x₂ + ... + wₙxₙ</text>
  <text x="350" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">(196,608 weights)</text>
  
  <!-- Decision boundary illustration -->
  <text x="350" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e74c3c">Problem: Linear Decision Boundary</text>
  
  <!-- Simple decision boundary -->
  <rect x="280" y="310" width="140" height="100" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
  <line x1="280" y1="360" x2="420" y2="310" stroke="#e74c3c" stroke-width="2"/>
  <text x="300" y="330" font-family="Arial, sans-serif" font-size="10" fill="#27ae60">Dog</text>
  <text x="380" y="390" font-family="Arial, sans-serif" font-size="10" fill="#3498db">No Dog</text>
  
  <!-- Arrow to output -->
  <path d="M380 180 L450 180" stroke="#2c3e50" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Output options -->
  <rect x="470" y="150" width="80" height="60" fill="#27ae60" stroke="#2c3e50" stroke-width="2" rx="5"/>
  <text x="510" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">+1</text>
  <text x="510" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Dog Present</text>
  <text x="510" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">z > τ</text>
  
  <text x="510" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">OR</text>
  
  <rect x="470" y="240" width="80" height="60" fill="#e74c3c" stroke="#2c3e50" stroke-width="2" rx="5"/>
  <text x="510" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">-1</text>
  <text x="510" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">No Dog</text>
  <text x="510" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">z ≤ τ</text>
  
  <!-- Challenge illustration -->
  <text x="650" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Real-World Complexity</text>
  
  <!-- Complex pattern examples -->
  <rect x="580" y="90" width="140" height="120" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
  <text x="650" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Non-linear Patterns:</text>
  
  <!-- Curved decision boundary -->
  <path d="M590 130 Q620 150 650 130 Q680 110 710 130" stroke="#e74c3c" stroke-width="2" fill="none"/>
  <circle cx="610" cy="140" r="3" fill="#27ae60"/>
  <circle cx="630" cy="135" r="3" fill="#27ae60"/>
  <circle cx="670" cy="125" r="3" fill="#27ae60"/>
  <circle cx="690" cy="140" r="3" fill="#27ae60"/>
  
  <circle cx="600" cy="160" r="3" fill="#3498db"/>
  <circle cx="640" cy="165" r="3" fill="#3498db"/>
  <circle cx="660" cy="160" r="3" fill="#3498db"/>
  <circle cx="700" cy="165" r="3" fill="#3498db"/>
  
  <text x="590" y="185" font-family="Arial, sans-serif" font-size="10" fill="#27ae60">• Dog pixels</text>
  <text x="590" y="200" font-family="Arial, sans-serif" font-size="10" fill="#3498db">• Background pixels</text>
  
  <!-- Limitations box -->
  <rect x="580" y="230" width="140" height="120" fill="#fff5f5" stroke="#e74c3c" stroke-width="2"/>
  <text x="650" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e74c3c">Single Perceptron Limits</text>
  
  <text x="590" y="270" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Only linear boundaries</text>
  <text x="590" y="285" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Cannot handle complex</text>
  <text x="595" y="298" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">spatial relationships</text>
  <text x="590" y="313" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Poor for object</text>
  <text x="595" y="328" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">recognition</text>
  <text x="590" y="343" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c">• Needs non-linearity!</text>
  
  <!-- Solution hint -->
  <text x="400" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#27ae60">Solution: Multi-Layer Networks</text>
  <text x="400" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">Stack perceptrons to create non-linear decision boundaries</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/>
    </marker>
  </defs>
</svg>