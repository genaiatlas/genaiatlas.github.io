<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="400" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">Data Featurization Process for K-Means</text>
  
  <!-- Raw Data Section -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="180" height="120" fill="#ffebee" stroke="#e74c3c" stroke-width="2" rx="5"/>
    <text x="90" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#c0392b">Raw Data</text>
    
    <!-- Raw data examples -->
    <text x="10" y="40" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Name: "John Doe"</text>
    <text x="10" y="55" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Age: "45 years"</text>
    <text x="10" y="70" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Height: "5'7""</text>
    <text x="10" y="85" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Education: "Bachelor's"</text>
    <text x="10" y="100" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Posts: "High activity"</text>
  </g>
  
  <!-- Arrow 1 -->
  <g transform="translate(250, 130)">
    <path d="M 0 0 L 40 0" stroke="#34495e" stroke-width="3" marker-end="url(#arrowhead)"/>
    <text x="20" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#34495e">Extract &amp; Convert</text>
  </g>
  
  <!-- Feature Matrix Section -->
  <g transform="translate(310, 80)">
    <rect x="0" y="0" width="220" height="120" fill="#e8f5e8" stroke="#27ae60" stroke-width="2" rx="5"/>
    <text x="110" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e8449">Feature Matrix</text>
    
    <!-- Table headers -->
    <text x="10" y="40" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#2c3e50">User</text>
    <text x="50" y="40" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#2c3e50">Age</text>
    <text x="85" y="40" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#2c3e50">Height</text>
    <text x="130" y="40" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#2c3e50">Education</text>
    <text x="180" y="40" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#2c3e50">Posts</text>
    
    <!-- Horizontal line -->
    <line x1="10" y1="45" x2="210" y2="45" stroke="#2c3e50" stroke-width="1"/>
    
    <!-- Data rows -->
    <text x="10" y="60" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">1</text>
    <text x="50" y="60" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">45</text>
    <text x="85" y="60" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">67</text>
    <text x="130" y="60" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">16</text>
    <text x="180" y="60" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">8.2</text>
    
    <text x="10" y="75" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">2</text>
    <text x="50" y="75" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">32</text>
    <text x="85" y="75" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">64</text>
    <text x="130" y="75" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">12</text>
    <text x="180" y="75" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">5.1</text>
    
    <text x="10" y="90" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">3</text>
    <text x="50" y="90" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">28</text>
    <text x="85" y="90" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">70</text>
    <text x="130" y="90" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">18</text>
    <text x="180" y="90" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">12.7</text>
  </g>
  
  <!-- Arrow 2 -->
  <g transform="translate(550, 130)">
    <path d="M 0 0 L 40 0" stroke="#34495e" stroke-width="3" marker-end="url(#arrowhead)"/>
    <text x="20" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#34495e">Ready for K-Means</text>
  </g>
  
  <!-- K-Means Ready Section -->
  <g transform="translate(610, 80)">
    <rect x="0" y="0" width="140" height="120" fill="#e3f2fd" stroke="#2196f3" stroke-width="2" rx="5"/>
    <text x="70" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1976d2">K-Means Input</text>
    
    <!-- Mathematical notation -->
    <text x="70" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">X ∈ ℝⁿˣᵈ</text>
    <text x="10" y="65" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">n = samples</text>
    <text x="10" y="80" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">d = features</text>
    <text x="10" y="95" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">All numerical</text>
    <text x="10" y="110" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Same scale</text>
  </g>
  
  <!-- Conversion examples -->
  <g transform="translate(50, 250)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#34495e">Feature Conversion Examples:</text>
    
    <g transform="translate(0, 25)">
      <circle cx="8" cy="0" r="4" fill="#e74c3c"/>
      <text x="20" y="5" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Age: "45 years" → 45 (numerical)</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle cx="8" cy="0" r="4" fill="#e74c3c"/>
      <text x="20" y="5" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Height: "5'7"" → 67 inches (numerical)</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle cx="8" cy="0" r="4" fill="#e74c3c"/>
      <text x="20" y="5" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Education: "Bachelor's" → 16 years (ordinal encoding)</text>
    </g>
    
    <g transform="translate(0, 85)">
      <circle cx="8" cy="0" r="4" fill="#e74c3c"/>
      <text x="20" y="5" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Posts: "High activity" → 8.2 posts/week (quantified)</text>
    </g>
  </g>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e"/>
    </marker>
  </defs>
</svg>