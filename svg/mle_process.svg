<svg width="1000" height="700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="4" flood-color="#00000030"/>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#495057"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="700" fill="url(#backgroundGradient)"/>
  
  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#212529">Maximum Likelihood Estimation Process</text>
  <text x="500" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#6c757d">Finding Optimal Parameters β₀ and β for Logistic Regression</text>
  
  <!-- Step 1: Data -->
  <rect x="50" y="100" width="280" height="180" fill="white" stroke="#495057" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="190" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#212529">Step 1: Observed Data</text>
  
  <!-- Data table -->
  <rect x="70" y="140" width="240" height="120" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1" rx="5"/>
  <text x="190" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#495057">Sample Dataset</text>
  
  <g font-family="monospace" font-size="11" fill="#495057">
    <text x="80" y="180" font-weight="bold">Weight (X) | Diabetes (Y)</text>
    <line x1="80" y1="185" x2="300" y2="185" stroke="#dee2e6"/>
    <text x="80" y="200">   186     |     0</text>
    <text x="80" y="215">   156     |     1</text>
    <text x="80" y="230">   220     |     1</text>
    <text x="80" y="245">   146     |     0</text>
    <text x="80" y="260">   ...     |    ...</text>
  </g>
  
  <!-- Arrow 1 -->
  <line x1="330" y1="190" x2="380" y2="190" stroke="#495057" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Step 2: Likelihood Function -->
  <rect x="400" y="100" width="300" height="180" fill="white" stroke="#495057" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="550" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#212529">Step 2: Likelihood Function</text>
  
  <rect x="420" y="140" width="260" height="120" fill="#fff3cd" stroke="#856404" stroke-width="1" rx="5"/>
  <text x="550" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#856404">Probability of Observed Data</text>
  
  <!-- Mathematical formula -->
  <text x="550" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#495057">L(β₀, β) = ∏ᵢ P(Yᵢ | Xᵢ, β₀, β)</text>
  <text x="550" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6c757d">Product of individual probabilities</text>
  
  <text x="550" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#495057">For each observation:</text>
  <text x="550" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#495057">P(Y=1|X) = e^(β₀+βX) / (1 + e^(β₀+βX))</text>
  
  <!-- Arrow 2 -->
  <line x1="700" y1="190" x2="750" y2="190" stroke="#495057" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Step 3: Log-Likelihood -->
  <rect x="770" y="100" width="200" height="180" fill="white" stroke="#495057" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="870" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#212529">Step 3: Log Transform</text>
  
  <rect x="785" y="140" width="170" height="120" fill="#d1ecf1" stroke="#0c5460" stroke-width="1" rx="5"/>
  <text x="870" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0c5460">Log-Likelihood</text>
  
  <text x="870" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#495057">ℓ(β₀, β) = log L(β₀, β)</text>
  <text x="870" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#495057">= Σᵢ log P(Yᵢ | Xᵢ)</text>
  
  <text x="870" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#28a745" font-weight="bold">Easier to optimize!</text>
  <text x="870" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#6c757d">Converts products to sums</text>
  
  <!-- Step 4: 3D Surface -->
  <rect x="50" y="320" width="420" height="250" fill="white" stroke="#495057" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="260" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#212529">Step 4: Parameter Space Visualization</text>
  
  <!-- 3D-like likelihood surface -->
  <g transform="translate(80, 360)">
    <!-- Grid -->
    <g stroke="#dee2e6" stroke-width="0.5" fill="none">
      <line x1="0" y1="0" x2="360" y2="0"/>
      <line x1="0" y1="40" x2="360" y2="40"/>
      <line x1="0" y1="80" x2="360" y2="80"/>
      <line x1="0" y1="120" x2="360" y2="120"/>
      <line x1="0" y1="160" x2="360" y2="160"/>
      
      <line x1="0" y1="0" x2="0" y2="160"/>
      <line x1="90" y1="0" x2="90" y2="160"/>
      <line x1="180" y1="0" x2="180" y2="160"/>
      <line x1="270" y1="0" x2="270" y2="160"/>
      <line x1="360" y1="0" x2="360" y2="160"/>
    </g>
    
    <!-- Contour lines representing likelihood surface -->
    <ellipse cx="180" cy="80" rx="120" ry="60" fill="none" stroke="#0d6efd" stroke-width="2" opacity="0.3"/>
    <ellipse cx="180" cy="80" rx="80" ry="40" fill="none" stroke="#0d6efd" stroke-width="2" opacity="0.5"/>
    <ellipse cx="180" cy="80" rx="40" ry="20" fill="none" stroke="#0d6efd" stroke-width="2" opacity="0.7"/>
    <ellipse cx="180" cy="80" rx="20" ry="10" fill="none" stroke="#dc3545" stroke-width="3"/>
    
    <!-- Maximum point -->
    <circle cx="180" cy="80" r="8" fill="#dc3545" stroke="white" stroke-width="2"/>
    <text x="190" y="85" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#dc3545">Maximum</text>
    
    <!-- Axes labels -->
    <text x="180" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#495057">β (slope parameter)</text>
    <text x="10" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#495057" transform="rotate(-90, 10, 85)">β₀ (intercept)</text>
    
    <!-- Parameter values -->
    <text x="30" y="20" font-family="Arial, sans-serif" font-size="10" fill="#495057">High likelihood</text>
    <text x="30" y="140" font-family="Arial, sans-serif" font-size="10" fill="#495057">Low likelihood</text>
    
    <!-- Gradient arrows showing optimization direction -->
    <g stroke="#28a745" stroke-width="2" marker-end="url(#arrowhead)">
      <line x1="120" y1="120" x2="150" y2="100"/>
      <line x1="240" y1="40" x2="210" y2="60"/>
      <line x1="100" y1="50" x2="140" y2="70"/>
      <line x1="260" y1="110" x2="220" y2="90"/>
    </g>
    <text x="280" y="20" font-family="Arial, sans-serif" font-size="10" fill="#28a745" font-weight="bold">Gradient ascent</text>
  </g>
  
  <!-- Step 5: Optimization -->
  <rect x="500" y="320" width="220" height="250" fill="white" stroke="#495057" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="610" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#212529">Step 5: Optimization</text>
  
  <rect x="520" y="360" width="180" height="190" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1" rx="5"/>
  
  <!-- Algorithm steps -->
  <text x="610" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#495057">Newton-Raphson Method</text>
  
  <g font-family="Arial, sans-serif" font-size="11" fill="#495057">
    <text x="530" y="405">1. Start with initial guess</text>
    <text x="540" y="420">β₀⁽⁰⁾ = 0, β⁽⁰⁾ = 0</text>
    
    <text x="530" y="440">2. Compute gradient:</text>
    <text x="540" y="455">∇ℓ = [∂ℓ/∂β₀, ∂ℓ/∂β]</text>
    
    <text x="530" y="475">3. Compute Hessian:</text>
    <text x="540" y="490">H = [∂²ℓ/∂β₀², ∂²ℓ/∂β₀∂β]</text>
    <text x="545" y="505">[∂²ℓ/∂β∂β₀, ∂²ℓ/∂β²]</text>
    
    <text x="530" y="525">4. Update parameters:</text>
    <text x="540" y="540">β⁽ⁿ⁺¹⁾ = β⁽ⁿ⁾ - H⁻¹∇ℓ</text>
  </g>
  
  <!-- Step 6: Results -->
  <rect x="750" y="320" width="220" height="250" fill="white" stroke="#495057" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="860" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#212529">Step 6: Final Model</text>
  
  <rect x="770" y="360" width="180" height="190" fill="#d4edda" stroke="#155724" stroke-width="1" rx="5"/>
  
  <text x="860" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#155724">Estimated Parameters</text>
  
  <g font-family="Arial, sans-serif" font-size="12" fill="#495057">
    <text x="860" y="410" text-anchor="middle" font-weight="bold">β₀ = -3.6</text>
    <text x="860" y="430" text-anchor="middle" font-weight="bold">β = 0.02</text>
  </g>
  
  <text x="860" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#155724">Final Model:</text>
  <text x="860" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#495057">P(Diabetes | Weight) =</text>
  <text x="860" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#495057">e^(-3.6 + 0.02×Weight)</text>
  <text x="860" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#495057">÷ (1 + e^(-3.6 + 0.02×Weight))</text>
  
  <!-- Example prediction -->
  <rect x="775" y="520" width="170" height="25" fill="#fff3cd" stroke="#856404" stroke-width="1" rx="3"/>
  <text x="860" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#856404" font-weight="bold">Example: 200 lbs → P = 0.18</text>
  
  <!-- Flow arrows -->
  <g stroke="#6c757d" stroke-width="2" fill="none">
    <path d="M 260 300 Q 260 310 260 320" marker-end="url(#arrowhead)"/>
    <path d="M 470 440 Q 490 440 500 440" marker-end="url(#arrowhead)"/>
    <path d="M 720 440 Q 740 440 750 440" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- Bottom note -->
  <rect x="50" y="600" width="900" height="80" fill="white" stroke="#495057" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="500" y="625" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#212529">Key Advantages of Maximum Likelihood Estimation</text>
  
  <g font-family="Arial, sans-serif" font-size="12" fill="#495057">
    <text x="80" y="650">• <tspan font-weight="bold">Consistent:</tspan> Converges to true parameters as sample size increases</text>
    <text x="80" y="665">• <tspan font-weight="bold">Efficient:</tspan> Achieves minimum variance among unbiased estimators</text>
    
    <text x="520" y="650">• <tspan font-weight="bold">Asymptotically Normal:</tspan> Enables confidence intervals and hypothesis tests</text>
    <text x="520" y="665">• <tspan font-weight="bold">Invariant:</tspan> Parameter transformations preserve optimality properties</text>
  </g>
</svg>