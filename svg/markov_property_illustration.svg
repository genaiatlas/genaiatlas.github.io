<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="900" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="600" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Markov Property: Graph Separation and Conditional Independence
  </text>
  
  <!-- Top Section: Global Markov Property -->
  <g id="global-markov">
    <rect x="50" y="80" width="1100" height="350" fill="#e8f4f8" stroke="#3498db" stroke-width="2" rx="10"/>
    <text x="600" y="115" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Global Markov Property
    </text>
    
    <!-- Set A nodes (left, green) -->
    <circle cx="180" cy="220" r="35" fill="#27ae60" stroke="#1e8449" stroke-width="3"/>
    <text x="180" y="230" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">A₁</text>
    
    <circle cx="180" cy="320" r="35" fill="#27ae60" stroke="#1e8449" stroke-width="3"/>
    <text x="180" y="330" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">A₂</text>
    
    <!-- Set C nodes (middle, orange - separator) -->
    <circle cx="420" cy="200" r="40" fill="#e67e22" stroke="#d35400" stroke-width="3"/>
    <text x="420" y="210" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">C₁</text>
    
    <circle cx="420" cy="340" r="40" fill="#e67e22" stroke="#d35400" stroke-width="3"/>
    <text x="420" y="350" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">C₂</text>
    
    <!-- Set B nodes (right, blue) -->
    <circle cx="700" cy="220" r="35" fill="#3498db" stroke="#2980b9" stroke-width="3"/>
    <text x="700" y="230" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">B₁</text>
    
    <circle cx="700" cy="320" r="35" fill="#3498db" stroke="#2980b9" stroke-width="3"/>
    <text x="700" y="330" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">B₂</text>
    
    <circle cx="820" cy="270" r="35" fill="#3498db" stroke="#2980b9" stroke-width="3"/>
    <text x="820" y="280" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">B₃</text>
    
    <!-- Edges -->
    <line x1="180" y1="255" x2="180" y2="285" stroke="#34495e" stroke-width="3"/>
    <line x1="205" y1="238" x2="383" y2="215" stroke="#34495e" stroke-width="3"/>
    <line x1="205" y1="305" x2="383" y2="325" stroke="#34495e" stroke-width="3"/>
    <line x1="420" y1="240" x2="420" y2="300" stroke="#34495e" stroke-width="3"/>
    <line x1="457" y1="215" x2="665" y2="235" stroke="#34495e" stroke-width="3"/>
    <line x1="457" y1="325" x2="665" y2="305" stroke="#34495e" stroke-width="3"/>
    <line x1="727" y1="240" x2="793" y2="258" stroke="#34495e" stroke-width="3"/>
    <line x1="727" y1="305" x2="793" y2="280" stroke="#34495e" stroke-width="3"/>
    
    <!-- Set labels -->
    <text x="180" y="390" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#27ae60">
      Set A
    </text>
    <text x="420" y="410" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#e67e22">
      Set C (Separator)
    </text>
    <text x="760" y="390" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#3498db">
      Set B
    </text>
    
    <!-- Explanation box -->
    <rect x="900" y="150" width="230" height="230" fill="#ffffff" stroke="#3498db" stroke-width="2" rx="8"/>
    <text x="1015" y="180" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Global Property
    </text>
    <text x="910" y="210" font-family="Arial, sans-serif" font-size="14" fill="#34495e">
      Every path from A to B
    </text>
    <text x="910" y="235" font-family="Arial, sans-serif" font-size="14" fill="#34495e">
      passes through C
    </text>
    <text x="910" y="270" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#e67e22">
      Therefore:
    </text>
    <text x="1015" y="300" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#2c3e50">
      X_A ⊥ X_B | X_C
    </text>
    <text x="910" y="330" font-family="Arial, sans-serif" font-size="13" fill="#34495e">
      A and B are conditionally
    </text>
    <text x="910" y="350" font-family="Arial, sans-serif" font-size="13" fill="#34495e">
      independent given C
    </text>
  </g>
  
  <!-- Bottom Section: Local Markov Property -->
  <g id="local-markov">
    <rect x="50" y="460" width="550" height="380" fill="#f0e8f8" stroke="#9b59b6" stroke-width="2" rx="10"/>
    <text x="325" y="495" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Local Markov Property
    </text>
    
    <!-- Central node of interest -->
    <circle cx="325" cy="620" r="45" fill="#e74c3c" stroke="#c0392b" stroke-width="3"/>
    <text x="325" y="630" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">X_i</text>
    
    <!-- Neighbors (Markov blanket) -->
    <circle cx="200" cy="560" r="35" fill="#9b59b6" stroke="#8e44ad" stroke-width="3"/>
    <text x="200" y="570" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">N₁</text>
    
    <circle cx="450" cy="560" r="35" fill="#9b59b6" stroke="#8e44ad" stroke-width="3"/>
    <text x="450" y="570" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">N₂</text>
    
    <circle cx="200" cy="680" r="35" fill="#9b59b6" stroke="#8e44ad" stroke-width="3"/>
    <text x="200" y="690" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">N₃</text>
    
    <circle cx="450" cy="680" r="35" fill="#9b59b6" stroke="#8e44ad" stroke-width="3"/>
    <text x="450" y="690" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">N₄</text>
    
    <!-- Non-neighbors (rest) -->
    <circle cx="120" cy="750" r="25" fill="#95a5a6" stroke="#7f8c8d" stroke-width="2"/>
    <text x="120" y="757" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">R₁</text>
    
    <circle cx="530" cy="750" r="25" fill="#95a5a6" stroke="#7f8c8d" stroke-width="2"/>
    <text x="530" y="757" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">R₂</text>
    
    <!-- Edges to neighbors -->
    <line x1="225" y1="578" x2="295" y2="600" stroke="#34495e" stroke-width="3"/>
    <line x1="425" y1="578" x2="355" y2="600" stroke="#34495e" stroke-width="3"/>
    <line x1="225" y1="662" x2="295" y2="640" stroke="#34495e" stroke-width="3"/>
    <line x1="425" y1="662" x2="355" y2="640" stroke="#34495e" stroke-width="3"/>
    
    <!-- Dashed lines to rest (no direct connection) -->
    <line x1="145" y1="738" x2="217" y2="692" stroke="#95a5a6" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="505" y1="738" x2="433" y2="692" stroke="#95a5a6" stroke-width="2" stroke-dasharray="5,5"/>
    
    <!-- Labels -->
    <text x="325" y="540" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#9b59b6" font-weight="bold">
      Neighbors N(i)
    </text>
    <text x="325" y="810" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#95a5a6" font-weight="bold">
      Rest of graph
    </text>
  </g>
  
  <!-- Local Property Explanation -->
  <g id="local-explanation">
    <rect x="650" y="460" width="500" height="380" fill="#fff9e6" stroke="#f39c12" stroke-width="2" rx="10"/>
    <text x="900" y="495" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Local Property Formula
    </text>
    
    <text x="900" y="550" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#2c3e50">
      X_i ⊥ X_{rest} | X_{N(i)}
    </text>
    
    <text x="670" y="590" font-family="Arial, sans-serif" font-size="15" fill="#34495e">
      • X_i: Node of interest
    </text>
    <text x="670" y="620" font-family="Arial, sans-serif" font-size="15" fill="#34495e">
      • X_{N(i)}: Direct neighbors (Markov blanket)
    </text>
    <text x="670" y="650" font-family="Arial, sans-serif" font-size="15" fill="#34495e">
      • X_{rest}: All other nodes in the graph
    </text>
    
    <rect x="670" y="680" width="450" height="140" fill="#ffffff" stroke="#e67e22" stroke-width="2" rx="5"/>
    <text x="895" y="710" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#e67e22">
      Key Insight
    </text>
    <text x="680" y="740" font-family="Arial, sans-serif" font-size="14" fill="#34495e">
      To predict X_i, we only need to know the
    </text>
    <text x="680" y="765" font-family="Arial, sans-serif" font-size="14" fill="#34495e">
      values of its direct neighbors. Information
    </text>
    <text x="680" y="790" font-family="Arial, sans-serif" font-size="14" fill="#34495e">
      from distant nodes must pass through
    </text>
    <text x="680" y="810" font-family="Arial, sans-serif" font-size="14" fill="#34495e">
      neighbors to influence X_i.
    </text>
  </g>
  
  <!-- Footer: Equivalence -->
  <text x="600" y="880" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#2c3e50" font-weight="bold">
    Under positivity: Global Markov Property ⟷ Local Markov Property ⟷ Pairwise Markov Property
  </text>
</svg>