<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="675" fill="#f8fafc"/>
  
  <!-- Fast Track Ribbon -->
  <polygon points="1050,0 1200,0 1200,80 1050,60" fill="#3b82f6"/>
  <text x="1125" y="35" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">FAST TRACK</text>
  
  <!-- Title -->
  <text x="600" y="80" text-anchor="middle" fill="#1e293b" font-family="Arial, sans-serif" font-size="36" font-weight="bold">Data Visualization</text>
  
  <!-- Library Comparison -->
  <rect x="80" y="120" width="280" height="200" fill="#f0f9ff" stroke="#0284c7" stroke-width="2" rx="8"/>
  <text x="220" y="150" text-anchor="middle" fill="#0284c7" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Matplotlib</text>
  <text x="220" y="175" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="14">Foundation • Flexible</text>
  
  <!-- Mini chart representation -->
  <rect x="120" y="190" width="200" height="80" fill="#ffffff" stroke="#d1d5db" stroke-width="1" rx="4"/>
  <path d="M 140 250 L 160 230 L 180 240 L 200 220 L 220 210 L 240 200 L 260 190 L 280 180 L 300 170" stroke="#3b82f6" stroke-width="2" fill="none"/>
  <text x="220" y="285" text-anchor="middle" fill="#6b7280" font-family="Courier, monospace" font-size="12">plt.plot(x, y)</text>
  <text x="220" y="305" text-anchor="middle" fill="#6b7280" font-family="Arial, sans-serif" font-size="12">Best for: Publication-ready plots</text>
  
  <!-- Seaborn -->
  <rect x="380" y="120" width="280" height="200" fill="#ecfdf5" stroke="#059669" stroke-width="2" rx="8"/>
  <text x="520" y="150" text-anchor="middle" fill="#059669" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Seaborn</text>
  <text x="520" y="175" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="14">Statistical • Beautiful</text>
  
  <!-- Scatter plot representation -->
  <rect x="420" y="190" width="200" height="80" fill="#ffffff" stroke="#d1d5db" stroke-width="1" rx="4"/>
  <circle cx="450" cy="210" r="3" fill="#16a34a"/>
  <circle cx="480" cy="230" r="3" fill="#16a34a"/>
  <circle cx="510" cy="220" r="3" fill="#16a34a"/>
  <circle cx="540" cy="240" r="3" fill="#16a34a"/>
  <circle cx="570" cy="250" r="3" fill="#16a34a"/>
  <circle cx="590" cy="210" r="3" fill="#16a34a"/>
  <text x="520" y="285" text-anchor="middle" fill="#6b7280" font-family="Courier, monospace" font-size="12">sns.scatterplot()</text>
  <text x="520" y="305" text-anchor="middle" fill="#6b7280" font-family="Arial, sans-serif" font-size="12">Best for: Statistical analysis</text>
  
  <!-- Plotly -->
  <rect x="680" y="120" width="280" height="200" fill="#fef3c7" stroke="#d97706" stroke-width="2" rx="8"/>
  <text x="820" y="150" text-anchor="middle" fill="#d97706" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Plotly</text>
  <text x="820" y="175" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="14">Interactive • Web-ready</text>
  
  <!-- Bar chart representation -->
  <rect x="720" y="190" width="200" height="80" fill="#ffffff" stroke="#d1d5db" stroke-width="1" rx="4"/>
  <rect x="740" y="240" width="20" height="20" fill="#f59e0b"/>
  <rect x="770" y="220" width="20" height="40" fill="#f59e0b"/>
  <rect x="800" y="200" width="20" height="60" fill="#f59e0b"/>
  <rect x="830" y="230" width="20" height="30" fill="#f59e0b"/>
  <rect x="860" y="210" width="20" height="50" fill="#f59e0b"/>
  <text x="820" y="285" text-anchor="middle" fill="#6b7280" font-family="Courier, monospace" font-size="12">px.bar(df, x, y)</text>
  <text x="820" y="305" text-anchor="middle" fill="#6b7280" font-family="Arial, sans-serif" font-size="12">Best for: Interactive dashboards</text>
  
  <!-- Pandas Plotting -->
  <rect x="980" y="120" width="180" height="200" fill="#fce7f3" stroke="#db2777" stroke-width="2" rx="8"/>
  <text x="1070" y="150" text-anchor="middle" fill="#db2777" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Pandas</text>
  <text x="1070" y="175" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="14">Quick • Convenient</text>
  
  <!-- Simple line -->
  <rect x="1000" y="190" width="140" height="80" fill="#ffffff" stroke="#d1d5db" stroke-width="1" rx="4"/>
  <path d="M 1020 250 L 1040 240 L 1060 245 L 1080 235 L 1100 230 L 1120 225" stroke="#ec4899" stroke-width="2" fill="none"/>
  <text x="1070" y="285" text-anchor="middle" fill="#6b7280" font-family="Courier, monospace" font-size="11">df.plot()</text>
  <text x="1070" y="305" text-anchor="middle" fill="#6b7280" font-family="Arial, sans-serif" font-size="11">Best for: Quick exploration</text>
  
  <!-- Chart Types -->
  <rect x="100" y="350" width="1000" height="160" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="12"/>
  <text x="600" y="380" text-anchor="middle" fill="#1e293b" font-family="Arial, sans-serif" font-size="24" font-weight="bold">Common Chart Types</text>
  
  <!-- Line Chart -->
  <rect x="150" y="400" width="160" height="80" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1" rx="6"/>
  <text x="230" y="420" text-anchor="middle" fill="#0c4a6e" font-family="Arial, sans-serif" font-size="14" font-weight="bold">📈 Line Chart</text>
  <text x="230" y="440" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">Trends over time</text>
  <text x="230" y="455" text-anchor="middle" fill="#6b7280" font-family="Arial, sans-serif" font-size="11">Stock prices, sales</text>
  <text x="230" y="470" text-anchor="middle" fill="#6b7280" font-family="Courier, monospace" font-size="10">plt.plot()</text>
  
  <!-- Bar Chart -->
  <rect x="330" y="400" width="160" height="80" fill="#f0fdf4" stroke="#22c55e" stroke-width="1" rx="6"/>
  <text x="410" y="420" text-anchor="middle" fill="#166534" font-family="Arial, sans-serif" font-size="14" font-weight="bold">📊 Bar Chart</text>
  <text x="410" y="440" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">Compare categories</text>
  <text x="410" y="455" text-anchor="middle" fill="#6b7280" font-family="Arial, sans-serif" font-size="11">Sales by region</text>
  <text x="410" y="470" text-anchor="middle" fill="#6b7280" font-family="Courier, monospace" font-size="10">plt.bar()</text>
  
  <!-- Scatter Plot -->
  <rect x="510" y="400" width="160" height="80" fill="#fffbeb" stroke="#f59e0b" stroke-width="1" rx="6"/>
  <text x="590" y="420" text-anchor="middle" fill="#92400e" font-family="Arial, sans-serif" font-size="14" font-weight="bold">🎯 Scatter Plot</text>
  <text x="590" y="440" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">Relationships</text>
  <text x="590" y="455" text-anchor="middle" fill="#6b7280" font-family="Arial, sans-serif" font-size="11">Height vs weight</text>
  <text x="590" y="470" text-anchor="middle" fill="#6b7280" font-family="Courier, monospace" font-size="10">plt.scatter()</text>
  
  <!-- Histogram -->
  <rect x="690" y="400" width="160" height="80" fill="#fdf2f8" stroke="#ec4899" stroke-width="1" rx="6"/>
  <text x="770" y="420" text-anchor="middle" fill="#be185d" font-family="Arial, sans-serif" font-size="14" font-weight="bold">📊 Histogram</text>
  <text x="770" y="440" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">Data distribution</text>
  <text x="770" y="455" text-anchor="middle" fill="#6b7280" font-family="Arial, sans-serif" font-size="11">Age groups</text>
  <text x="770" y="470" text-anchor="middle" fill="#6b7280" font-family="Courier, monospace" font-size="10">plt.hist()</text>
  
  <!-- Heatmap -->
  <rect x="870" y="400" width="160" height="80" fill="#f3e8ff" stroke="#a855f7" stroke-width="1" rx="6"/>
  <text x="950" y="420" text-anchor="middle" fill="#7c2d12" font-family="Arial, sans-serif" font-size="14" font-weight="bold">🔥 Heatmap</text>
  <text x="950" y="440" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">Correlation matrix</text>
  <text x="950" y="455" text-anchor="middle" fill="#6b7280" font-family="Arial, sans-serif" font-size="11">Feature relationships</text>
  <text x="950" y="470" text-anchor="middle" fill="#6b7280" font-family="Courier, monospace" font-size="10">sns.heatmap()</text>
  
  <!-- Best Practices -->
  <rect x="150" y="540" width="900" height="100" fill="#f1f5f9" stroke="#64748b" stroke-width="1" rx="12"/>
  <text x="600" y="570" text-anchor="middle" fill="#1e293b" font-family="Arial, sans-serif" font-size="20" font-weight="bold">📋 Visualization Best Practices</text>
  
  <!-- Practice points -->
  <circle cx="200" cy="595" r="3" fill="#3b82f6"/>
  <text x="215" y="600" fill="#374151" font-family="Arial, sans-serif" font-size="13">Always label your axes and add meaningful titles</text>
  
  <circle cx="200" cy="615" r="3" fill="#3b82f6"/>
  <text x="215" y="620" fill="#374151" font-family="Arial, sans-serif" font-size="13">Choose colors that are accessible and meaningful</text>
  
  <circle cx="550" cy="595" r="3" fill="#3b82f6"/>
  <text x="565" y="600" fill="#374151" font-family="Arial, sans-serif" font-size="13">Keep it simple - avoid chart junk</text>
  
  <circle cx="550" cy="615" r="3" fill="#3b82f6"/>
  <text x="565" y="620" fill="#374151" font-family="Arial, sans-serif" font-size="13">Match chart type to data type and message</text>
</svg>