<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="500" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">Multi-Layer Perceptron Architecture</text>
  
  <!-- Layer labels -->
  <rect x="50" y="50" width="120" height="30" fill="#e8f4f8" stroke="#3498db" stroke-width="1" rx="15"/>
  <text x="110" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">INPUT LAYER</text>
  
  <rect x="280" y="50" width="120" height="30" fill="#e8f8e8" stroke="#27ae60" stroke-width="1" rx="15"/>
  <text x="340" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">HIDDEN LAYER</text>
  
  <rect x="520" y="50" width="120" height="30" fill="#f8e8e8" stroke="#e74c3c" stroke-width="1" rx="15"/>
  <text x="580" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">OUTPUT LAYER</text>
  
  <!-- Input layer nodes -->
  <circle cx="110" cy="120" r="18" fill="#3498db" stroke="#2c3e50" stroke-width="2"/>
  <text x="110" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">x₁</text>
  
  <circle cx="110" cy="170" r="18" fill="#3498db" stroke="#2c3e50" stroke-width="2"/>
  <text x="110" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">x₂</text>
  
  <circle cx="110" cy="220" r="18" fill="#3498db" stroke="#2c3e50" stroke-width="2"/>
  <text x="110" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">x₃</text>
  
  <text x="110" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#7f8c8d">⋮</text>
  
  <circle cx="110" cy="300" r="18" fill="#3498db" stroke="#2c3e50" stroke-width="2"/>
  <text x="110" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">xₙ</text>
  
  <!-- Hidden layer nodes -->
  <circle cx="340" cy="140" r="20" fill="#27ae60" stroke="#2c3e50" stroke-width="2"/>
  <text x="340" y="147" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Σ₁</text>
  
  <circle cx="340" cy="200" r="20" fill="#27ae60" stroke="#2c3e50" stroke-width="2"/>
  <text x="340" y="207" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Σ₂</text>
  
  <text x="340" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#7f8c8d">⋮</text>
  
  <circle cx="340" cy="280" r="20" fill="#27ae60" stroke="#2c3e50" stroke-width="2"/>
  <text x="340" y="287" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Σₘ</text>
  
  <!-- Hidden layer activation functions -->
  <rect x="380" y="130" width="25" height="20" fill="#f39c12" stroke="#2c3e50" stroke-width="1" rx="3"/>
  <text x="392" y="143" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">f</text>
  
  <rect x="380" y="190" width="25" height="20" fill="#f39c12" stroke="#2c3e50" stroke-width="1" rx="3"/>
  <text x="392" y="203" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">f</text>
  
  <rect x="380" y="270" width="25" height="20" fill="#f39c12" stroke="#2c3e50" stroke-width="1" rx="3"/>
  <text x="392" y="283" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">f</text>
  
  <!-- Output layer node -->
  <circle cx="580" cy="210" r="25" fill="#e74c3c" stroke="#2c3e50" stroke-width="2"/>
  <text x="580" y="217" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">Σ</text>
  
  <!-- Output activation function -->
  <rect x="620" y="200" width="30" height="20" fill="#f39c12" stroke="#2c3e50" stroke-width="1" rx="3"/>
  <text x="635" y="213" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">f</text>
  
  <!-- Final output -->
  <circle cx="680" cy="210" r="20" fill="#9b59b6" stroke="#2c3e50" stroke-width="2"/>
  <text x="680" y="217" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">y</text>
  
  <!-- Connections input to hidden -->
  <g stroke="#e74c3c" stroke-width="2" opacity="0.7">
    <!-- From x1 to all hidden nodes -->
    <line x1="128" y1="120" x2="320" y2="140"/>
    <line x1="128" y1="120" x2="320" y2="200"/>
    <line x1="128" y1="120" x2="320" y2="280"/>
    
    <!-- From x2 to all hidden nodes -->
    <line x1="128" y1="170" x2="320" y2="140"/>
    <line x1="128" y1="170" x2="320" y2="200"/>
    <line x1="128" y1="170" x2="320" y2="280"/>
    
    <!-- From x3 to all hidden nodes -->
    <line x1="128" y1="220" x2="320" y2="140"/>
    <line x1="128" y1="220" x2="320" y2="200"/>
    <line x1="128" y1="220" x2="320" y2="280"/>
    
    <!-- From xn to all hidden nodes -->
    <line x1="128" y1="300" x2="320" y2="140"/>
    <line x1="128" y1="300" x2="320" y2="200"/>
    <line x1="128" y1="300" x2="320" y2="280"/>
  </g>
  
  <!-- Weight labels -->
  <text x="200" y="115" font-family="Arial, sans-serif" font-size="9" fill="#e74c3c">w₁₁</text>
  <text x="200" y="150" font-family="Arial, sans-serif" font-size="9" fill="#e74c3c">w₁₂</text>
  <text x="200" y="190" font-family="Arial, sans-serif" font-size="9" fill="#e74c3c">w₁₃</text>
  
  <!-- Connections hidden to output -->
  <g stroke="#27ae60" stroke-width="3" opacity="0.8">
    <line x1="405" y1="140" x2="555" y2="210"/>
    <line x1="405" y1="200" x2="555" y2="210"/>
    <line x1="405" y1="280" x2="555" y2="210"/>
  </g>
  
  <!-- Hidden to output weight labels -->
  <text x="470" y="165" font-family="Arial, sans-serif" font-size="10" fill="#27ae60">w₁</text>
  <text x="470" y="205" font-family="Arial, sans-serif" font-size="10" fill="#27ae60">w₂</text>
  <text x="470" y="255" font-family="Arial, sans-serif" font-size="10" fill="#27ae60">wₘ</text>
  
  <!-- Final output connection -->
  <line x1="650" y1="210" x2="660" y2="210" stroke="#2c3e50" stroke-width="3"/>
  
  <!-- Parameter calculation -->
  <rect x="50" y="360" width="700" height="120" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" rx="10"/>
  <text x="400" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Parameter Calculation</text>
  
  <!-- Formula breakdown -->
  <text x="80" y="410" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">Hidden Layer Parameters:</text>
  <text x="80" y="425" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">Each hidden perceptron: (n + 1) parameters</text>
  <text x="80" y="440" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">Total hidden parameters: (n + 1) × m</text>
  
  <text x="420" y="410" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">Output Layer Parameters:</text>
  <text x="420" y="425" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">Output perceptron: (m + 1) parameters</text>
  <text x="420" y="440" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">Where m = number of hidden neurons</text>
  
  <!-- Total formula -->
  <rect x="150" y="450" width="500" height="25" fill="#3498db" rx="5"/>
  <text x="400" y="467" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Total Parameters = (n + 1) × m + (m + 1)</text>
  
  <!-- Example calculation -->
  <text x="400" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">Example: n=6 inputs, m=2 hidden neurons → (6+1)×2 + (2+1) = 17 parameters</text>
</svg>