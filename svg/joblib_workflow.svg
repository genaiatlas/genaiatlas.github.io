<svg viewBox="0 0 900 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mlModelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9C27B0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7B1FA2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="joblibFileGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF9800;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F57C00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="joblibLoadedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00BCD4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0097A7;stop-opacity:1" />
    </linearGradient>
    <marker id="joblibSaveArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#FF9800"/>
    </marker>
    <marker id="joblibLoadArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00BCD4"/>
    </marker>
  </defs>
  
  <text x="450" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#333">
    Joblib Workflow for Machine Learning Models
  </text>
  
  <text x="150" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FF9800">
    OPTIMIZED SAVING
  </text>
  
  <rect x="50" y="80" width="120" height="70" rx="8" fill="url(#mlModelGrad)" stroke="#333" stroke-width="2"/>
  <text x="110" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">
    Scikit-learn Model
  </text>
  <text x="110" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">
    + NumPy Arrays
  </text>
  <text x="110" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">
    (In Memory)
  </text>
  
  <path d="M 180 115 L 230 115" stroke="#FF9800" stroke-width="3" fill="none" marker-end="url(#joblibSaveArrow)"/>
  <text x="205" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#FF9800" font-weight="bold">
    joblib.dump()
  </text>
  <text x="205" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#FF9800">
    Optimized
  </text>
  
  <rect x="250" y="80" width="120" height="70" rx="8" fill="url(#joblibFileGrad)" stroke="#333" stroke-width="2"/>
  <text x="310" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">
    model.joblib
  </text>
  <text x="310" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">
    Compressed
  </text>
  <text x="310" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">
    (On Disk)
  </text>
  
  <rect x="400" y="70" width="450" height="90" rx="5" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="410" y="85" font-family="Monaco, monospace" font-size="10" fill="#666">
    # Saving with Joblib (Optimized)
  </text>
  <text x="410" y="100" font-family="Monaco, monospace" font-size="10" fill="#000">
    import joblib
  </text>
  <text x="410" y="115" font-family="Monaco, monospace" font-size="10" fill="#000">
    joblib.dump(model, 'model.joblib')
  </text>
  <text x="410" y="130" font-family="Monaco, monospace" font-size="10" fill="#666">
    # Optimized for NumPy arrays
  </text>
  <text x="410" y="145" font-family="Monaco, monospace" font-size="10" fill="#666">
    # Better compression and speed
  </text>
  <text x="410" y="160" font-family="Monaco, monospace" font-size="10" fill="#666">
    # Perfect for scikit-learn models
  </text>
  
  <rect x="50" y="170" width="320" height="40" rx="5" fill="#E8F5E8" stroke="#4CAF50" stroke-width="1"/>
  <text x="60" y="185" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#2E7D32">
    Performance Benefits:
  </text>
  <text x="60" y="200" font-family="Arial, sans-serif" font-size="9" fill="#2E7D32">
    3-10x faster for large arrays - Better compression - Parallel processing
  </text>
  
  <line x1="50" y1="230" x2="850" y2="230" stroke="#ddd" stroke-width="2"/>
  
  <text x="150" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#00BCD4">
    FAST LOADING
  </text>
  
  <rect x="50" y="280" width="120" height="70" rx="8" fill="url(#joblibFileGrad)" stroke="#333" stroke-width="2"/>
  <text x="110" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">
    model.joblib
  </text>
  <text x="110" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">
    Optimized File
  </text>
  <text x="110" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">
    (From Disk)
  </text>
  
  <path d="M 180 315 L 230 315" stroke="#00BCD4" stroke-width="3" fill="none" marker-end="url(#joblibLoadArrow)"/>
  <text x="205" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#00BCD4" font-weight="bold">
    joblib.load()
  </text>
  <text x="205" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#00BCD4">
    Fast Loading
  </text>
  
  <rect x="250" y="280" width="120" height="70" rx="8" fill="url(#joblibLoadedGrad)" stroke="#333" stroke-width="2"/>
  <text x="310" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">
    Loaded Model
  </text>
  <text x="310" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">
    High Performance
  </text>
  <text x="310" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">
    (Ready to Use)
  </text>
  
  <rect x="400" y="270" width="450" height="90" rx="5" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="410" y="285" font-family="Monaco, monospace" font-size="10" fill="#666">
    # Loading with Joblib (Fast)
  </text>
  <text x="410" y="300" font-family="Monaco, monospace" font-size="10" fill="#000">
    loaded_model = joblib.load('model.joblib')
  </text>
  <text x="410" y="315" font-family="Monaco, monospace" font-size="10" fill="#000">
    predictions = loaded_model.predict(X_test)
  </text>
  <text x="410" y="330" font-family="Monaco, monospace" font-size="10" fill="#666">
    # Fast loading of large models!
  </text>
  <text x="410" y="345" font-family="Monaco, monospace" font-size="10" fill="#000">
    score = loaded_model.score(X_test, y_test)
  </text>
  <text x="410" y="360" font-family="Monaco, monospace" font-size="10" fill="#666">
    # Production-ready performance
  </text>
  
  <rect x="50" y="380" width="800" height="30" rx="5" fill="#E3F2FD" stroke="#2196F3" stroke-width="1"/>
  <text x="60" y="400" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1565C0">
    NumPy Optimized - Faster than Pickle - Better Compression - Scikit-learn Native - Parallel Ready
  </text>
  
  <path d="M 310 360 L 310 370 L 110 370 L 110 280" stroke="#999" stroke-width="2" fill="none" stroke-dasharray="5,5"/>
  <text x="200" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#999">
    Optimized file format
  </text>
  
  <circle cx="380" cy="115" r="15" fill="#4CAF50" stroke="white" stroke-width="2"/>
  <text x="380" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">
    3x
  </text>
  <text x="380" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#4CAF50">
    FASTER
  </text>
</svg>