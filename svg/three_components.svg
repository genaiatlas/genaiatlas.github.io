<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="600" y="40" font-size="28" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Three Key Functional Components
  </text>
  <text x="600" y="70" font-size="18" text-anchor="middle" fill="#666">
    Real-Time Interactive Data-Driven System
  </text>
  
  <!-- Component 1: Sensing Platform -->
  <rect x="80" y="120" width="320" height="280" fill="#e3f2fd" stroke="#1976d2" stroke-width="3" rx="10"/>
  <circle cx="240" cy="160" r="25" fill="#1976d2"/>
  <text x="240" y="168" font-size="20" font-weight="bold" text-anchor="middle" fill="#fff">1</text>
  
  <text x="240" y="210" font-size="22" font-weight="bold" text-anchor="middle" fill="#1565c0">
    Sensing Platform
  </text>
  
  <text x="240" y="245" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">
    Real-Time User Interaction
  </text>
  
  <!-- Sensing Platform Details -->
  <rect x="100" y="260" width="280" height="35" fill="#bbdefb" stroke="#1976d2" stroke-width="1" rx="5"/>
  <text x="115" y="283" font-size="13" fill="#1a1a1a">📊 Collect user behavioral data</text>
  
  <rect x="100" y="300" width="280" height="35" fill="#bbdefb" stroke="#1976d2" stroke-width="1" rx="5"/>
  <text x="115" y="323" font-size="13" fill="#1a1a1a">📤 Deliver content &amp; recommendations</text>
  
  <rect x="100" y="340" width="280" height="35" fill="#bbdefb" stroke="#1976d2" stroke-width="1" rx="5"/>
  <text x="115" y="363" font-size="13" fill="#1a1a1a">⚡ Real-time API communication</text>
  
  <!-- Component 2: Storage & Computation -->
  <rect x="440" y="120" width="320" height="280" fill="#e8f5e9" stroke="#388e3c" stroke-width="3" rx="10"/>
  <circle cx="600" cy="160" r="25" fill="#388e3c"/>
  <text x="600" y="168" font-size="20" font-weight="bold" text-anchor="middle" fill="#fff">2</text>
  
  <text x="600" y="210" font-size="22" font-weight="bold" text-anchor="middle" fill="#2e7d32">
    Storage &amp; Computation
  </text>
  
  <text x="600" y="245" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">
    Infrastructure at Scale
  </text>
  
  <!-- Storage Details -->
  <rect x="460" y="260" width="280" height="35" fill="#c8e6c9" stroke="#388e3c" stroke-width="1" rx="5"/>
  <text x="475" y="283" font-size="13" fill="#1a1a1a">💾 Store massive data volumes</text>
  
  <rect x="460" y="300" width="280" height="35" fill="#c8e6c9" stroke="#388e3c" stroke-width="1" rx="5"/>
  <text x="475" y="323" font-size="13" fill="#1a1a1a">⚙️ Distributed parallel processing</text>
  
  <rect x="460" y="340" width="280" height="35" fill="#c8e6c9" stroke="#388e3c" stroke-width="1" rx="5"/>
  <text x="475" y="363" font-size="13" fill="#1a1a1a">🔄 Real-time &amp; batch computation</text>
  
  <!-- Component 3: Intelligence Processing -->
  <rect x="800" y="120" width="320" height="280" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="3" rx="10"/>
  <circle cx="960" cy="160" r="25" fill="#7b1fa2"/>
  <text x="960" y="168" font-size="20" font-weight="bold" text-anchor="middle" fill="#fff">3</text>
  
  <text x="960" y="210" font-size="22" font-weight="bold" text-anchor="middle" fill="#6a1b9a">
    Intelligence Processing
  </text>
  
  <text x="960" y="245" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">
    Algorithmic Decision Making
  </text>
  
  <!-- Intelligence Details -->
  <rect x="820" y="260" width="280" height="35" fill="#e1bee7" stroke="#7b1fa2" stroke-width="1" rx="5"/>
  <text x="835" y="283" font-size="13" fill="#1a1a1a">🧠 Machine learning algorithms</text>
  
  <rect x="820" y="300" width="280" height="35" fill="#e1bee7" stroke="#7b1fa2" stroke-width="1" rx="5"/>
  <text x="835" y="323" font-size="13" fill="#1a1a1a">📈 Statistical processing</text>
  
  <rect x="820" y="340" width="280" height="35" fill="#e1bee7" stroke="#7b1fa2" stroke-width="1" rx="5"/>
  <text x="835" y="363" font-size="13" fill="#1a1a1a">🎯 Generate recommendations</text>
  
  <!-- Interaction Flow Diagram -->
  <text x="600" y="450" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Component Interaction Flow
  </text>
  
  <!-- Central Flow Box -->
  <rect x="150" y="490" width="900" height="350" fill="#fff8e1" stroke="#f57c00" stroke-width="2" rx="10"/>
  
  <!-- Step 1: User Action -->
  <rect x="200" y="520" width="200" height="80" fill="#42a5f5" stroke="#1565c0" stroke-width="2" rx="5"/>
  <text x="300" y="545" font-size="15" font-weight="bold" text-anchor="middle" fill="#fff">Step 1: User Action</text>
  <text x="300" y="570" font-size="12" text-anchor="middle" fill="#fff">User clicks content,</text>
  <text x="300" y="587" font-size="12" text-anchor="middle" fill="#fff">performs search, etc.</text>
  
  <!-- Arrow 1 -->
  <path d="M 400,560 L 480,560" stroke="#f57c00" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="440" y="550" font-size="12" font-weight="bold" fill="#f57c00">Collect</text>
  
  <!-- Step 2: Data Logging -->
  <rect x="480" y="520" width="200" height="80" fill="#66bb6a" stroke="#2e7d32" stroke-width="2" rx="5"/>
  <text x="580" y="545" font-size="15" font-weight="bold" text-anchor="middle" fill="#fff">Step 2: Log Data</text>
  <text x="580" y="570" font-size="12" text-anchor="middle" fill="#fff">Store in Kafka,</text>
  <text x="580" y="587" font-size="12" text-anchor="middle" fill="#fff">HDFS, Cassandra</text>
  
  <!-- Arrow 2 -->
  <path d="M 680,560 L 760,560" stroke="#f57c00" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="720" y="550" font-size="12" font-weight="bold" fill="#f57c00">Process</text>
  
  <!-- Step 3: Algorithm Processing -->
  <rect x="760" y="520" width="200" height="80" fill="#ab47bc" stroke="#6a1b9a" stroke-width="2" rx="5"/>
  <text x="860" y="545" font-size="15" font-weight="bold" text-anchor="middle" fill="#fff">Step 3: Process</text>
  <text x="860" y="570" font-size="12" text-anchor="middle" fill="#fff">Apply ML algorithms,</text>
  <text x="860" y="587" font-size="12" text-anchor="middle" fill="#fff">compute recommendations</text>
  
  <!-- Arrow 3 down -->
  <path d="M 860,600 L 860,650" stroke="#f57c00" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="880" y="630" font-size="12" font-weight="bold" fill="#f57c00">Generate</text>
  
  <!-- Step 4: Recommendation Results -->
  <rect x="760" y="650" width="200" height="80" fill="#ab47bc" stroke="#6a1b9a" stroke-width="2" rx="5"/>
  <text x="860" y="675" font-size="15" font-weight="bold" text-anchor="middle" fill="#fff">Step 4: Results</text>
  <text x="860" y="700" font-size="12" text-anchor="middle" fill="#fff">Personalized content</text>
  <text x="860" y="717" font-size="12" text-anchor="middle" fill="#fff">&amp; recommendations</text>
  
  <!-- Arrow 4 left -->
  <path d="M 760,690 L 680,690" stroke="#f57c00" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="720" y="680" font-size="12" font-weight="bold" fill="#f57c00">Store</text>
  
  <!-- Step 5: Store Results -->
  <rect x="480" y="650" width="200" height="80" fill="#66bb6a" stroke="#2e7d32" stroke-width="2" rx="5"/>
  <text x="580" y="675" font-size="15" font-weight="bold" text-anchor="middle" fill="#fff">Step 5: Cache</text>
  <text x="580" y="700" font-size="12" text-anchor="middle" fill="#fff">Store results for</text>
  <text x="580" y="717" font-size="12" text-anchor="middle" fill="#fff">future quick access</text>
  
  <!-- Arrow 5 left -->
  <path d="M 480,690 L 400,690" stroke="#f57c00" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="440" y="680" font-size="12" font-weight="bold" fill="#f57c00">Deliver</text>
  
  <!-- Step 6: Deliver to User -->
  <rect x="200" y="650" width="200" height="80" fill="#42a5f5" stroke="#1565c0" stroke-width="2" rx="5"/>
  <text x="300" y="675" font-size="15" font-weight="bold" text-anchor="middle" fill="#fff">Step 6: Display</text>
  <text x="300" y="700" font-size="12" text-anchor="middle" fill="#fff">Show recommendations</text>
  <text x="300" y="717" font-size="12" text-anchor="middle" fill="#fff">to user via API/UI</text>
  
  <!-- Arrow 6 up (feedback loop) -->
  <path d="M 300,650 L 300,600" stroke="#f57c00" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="320" y="625" font-size="12" font-weight="bold" fill="#f57c00">Repeat</text>
  
  <!-- Continuous Loop Indicator -->
  <path d="M 200,785 Q 150,810 200,835" stroke="#d32f2f" stroke-width="3" fill="none" marker-end="url(#arrowhead-red)" stroke-dasharray="6,3"/>
  <text x="250" y="815" font-size="14" font-weight="bold" fill="#d32f2f">Continuous Feedback Loop</text>
  
  <!-- Key Characteristics -->
  <rect x="80" y="870" width="1040" height="20" fill="#fafafa" stroke="#999" stroke-width="1" rx="3"/>
  <text x="600" y="885" font-size="13" font-weight="bold" text-anchor="middle" fill="#333">
    ⚡ Real-Time • 📊 Data-Driven • 🔄 Interactive • 📈 Scalable • 🎯 Personalized
  </text>
  
  <!-- Arrow definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#f57c00"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#d32f2f"/>
    </marker>
  </defs>
</svg>