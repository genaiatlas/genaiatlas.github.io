<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="500" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    Inferential vs Descriptive Statistics
  </text>
  
  <!-- Descriptive Statistics Box -->
  <rect x="50" y="80" width="300" height="350" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="10"/>
  <text x="200" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1976d2">
    Descriptive Statistics
  </text>
  
  <!-- Descriptive content -->
  <text x="70" y="140" font-family="Arial, sans-serif" font-size="14" fill="#333">
    📊 What: Summarizes existing data
  </text>
  <text x="70" y="165" font-family="Arial, sans-serif" font-size="14" fill="#333">
    🎯 Purpose: Describe observed data
  </text>
  <text x="70" y="190" font-family="Arial, sans-serif" font-size="14" fill="#333">
    📈 Methods:
  </text>
  <text x="90" y="210" font-family="Arial, sans-serif" font-size="12" fill="#555">
    • Mean, Median, Mode
  </text>
  <text x="90" y="225" font-family="Arial, sans-serif" font-size="12" fill="#555">
    • Standard deviation
  </text>
  <text x="90" y="240" font-family="Arial, sans-serif" font-size="12" fill="#555">
    • Histograms, Box plots
  </text>
  <text x="90" y="255" font-family="Arial, sans-serif" font-size="12" fill="#555">
    • Correlation coefficients
  </text>
  
  <text x="70" y="285" font-family="Arial, sans-serif" font-size="14" fill="#333">
    📋 Example:
  </text>
  <text x="90" y="305" font-family="Arial, sans-serif" font-size="12" fill="#555">
    "The average height in our
  </text>
  <text x="90" y="320" font-family="Arial, sans-serif" font-size="12" fill="#555">
    sample of 100 students is
  </text>
  <text x="90" y="335" font-family="Arial, sans-serif" font-size="12" fill="#555">
    170 cm with SD = 8 cm"
  </text>
  
  <text x="70" y="365" font-family="Arial, sans-serif" font-size="14" fill="#333">
    ✅ Certainty: High (describes data)
  </text>
  <text x="70" y="390" font-family="Arial, sans-serif" font-size="14" fill="#333">
    🎯 Scope: Sample only
  </text>
  
  <!-- Inferential Statistics Box -->
  <rect x="450" y="80" width="300" height="350" fill="#fff3e0" stroke="#f57c00" stroke-width="2" rx="10"/>
  <text x="600" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#f57c00">
    Inferential Statistics
  </text>
  
  <!-- Inferential content -->
  <text x="470" y="140" font-family="Arial, sans-serif" font-size="14" fill="#333">
    🔮 What: Makes predictions
  </text>
  <text x="470" y="165" font-family="Arial, sans-serif" font-size="14" fill="#333">
    🎯 Purpose: Generalize to population
  </text>
  <text x="470" y="190" font-family="Arial, sans-serif" font-size="14" fill="#333">
    🧪 Methods:
  </text>
  <text x="490" y="210" font-family="Arial, sans-serif" font-size="12" fill="#555">
    • Hypothesis testing
  </text>
  <text x="490" y="225" font-family="Arial, sans-serif" font-size="12" fill="#555">
    • Confidence intervals
  </text>
  <text x="490" y="240" font-family="Arial, sans-serif" font-size="12" fill="#555">
    • Regression analysis
  </text>
  <text x="490" y="255" font-family="Arial, sans-serif" font-size="12" fill="#555">
    • ANOVA, t-tests
  </text>
  
  <text x="470" y="285" font-family="Arial, sans-serif" font-size="14" fill="#333">
    📋 Example:
  </text>
  <text x="490" y="305" font-family="Arial, sans-serif" font-size="12" fill="#555">
    "We are 95% confident that
  </text>
  <text x="490" y="320" font-family="Arial, sans-serif" font-size="12" fill="#555">
    the population mean height
  </text>
  <text x="490" y="335" font-family="Arial, sans-serif" font-size="12" fill="#555">
    is between 168-172 cm"
  </text>
  
  <text x="470" y="365" font-family="Arial, sans-serif" font-size="14" fill="#333">
    ⚠️ Uncertainty: Inherent
  </text>
  <text x="470" y="390" font-family="Arial, sans-serif" font-size="14" fill="#333">
    🌐 Scope: Population
  </text>
  
  <!-- Arrow -->
  <path d="M 360 255 L 440 255" stroke="#666" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="400" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">
    Generalize
  </text>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  
  <!-- Bottom note -->
  <text x="400" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-style="italic" fill="#666">
    Both approaches are essential for complete statistical analysis
  </text>
</svg>