<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="700" y="40" font-size="28" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Matrix Sparsity: User-Based vs Item-Based Analysis
  </text>
  
  <!-- User-Item Matrix Visualization -->
  <g transform="translate(100, 80)">
    <rect x="0" y="0" width="600" height="400" fill="#fff8f0" stroke="#ff9933" stroke-width="3" rx="10"/>
    <text x="300" y="35" font-size="20" font-weight="bold" text-anchor="middle" fill="#ff6600">
      User-Item Rating Matrix (Typical Reality)
    </text>
    
    <!-- Matrix grid with clearer visualization -->
    <g transform="translate(50, 60)">
      <text x="250" y="-5" font-size="12" text-anchor="middle" fill="#666" font-weight="bold">Movies (M₁, M₂, M₃, ... Mₖ)</text>
      
      <!-- Row labels -->
      <text x="-10" y="30" font-size="11" text-anchor="end" fill="#666">User 1</text>
      <text x="-10" y="60" font-size="11" text-anchor="end" fill="#666">User 2</text>
      <text x="-10" y="90" font-size="11" text-anchor="end" fill="#666">User 3</text>
      <text x="-10" y="120" font-size="11" text-anchor="end" fill="#666">User 4</text>
      <text x="-10" y="150" font-size="11" text-anchor="end" fill="#666">User 5</text>
      <text x="-10" y="195" font-size="13" text-anchor="end" fill="#666" font-weight="bold">...</text>
      <text x="-10" y="280" font-size="11" text-anchor="end" fill="#666">User N</text>
      
      <!-- Create a more realistic sparse matrix -->
      <!-- User 1 -->
      <circle cx="30" cy="30" r="5" fill="#333"/>
      <circle cx="60" cy="30" r="3" fill="#ffcccc" opacity="0.5"/>
      <circle cx="90" cy="30" r="3" fill="#ffcccc" opacity="0.5"/>
      <circle cx="120" cy="30" r="3" fill="#ffcccc" opacity="0.5"/>
      <circle cx="150" cy="30" r="5" fill="#333"/>
      <circle cx="180" cy="30" r="3" fill="#ffcccc" opacity="0.5"/>
      <circle cx="210" cy="30" r="3" fill="#ffcccc" opacity="0.5"/>
      <circle cx="240" cy="30" r="3" fill="#ffcccc" opacity="0.5"/>
      <circle cx="270" cy="30" r="3" fill="#ffcccc" opacity="0.5"/>
      <circle cx="300" cy="30" r="3" fill="#ffcccc" opacity="0.5"/>
      <circle cx="330" cy="30" r="3" fill="#ffcccc" opacity="0.5"/>
      <circle cx="360" cy="30" r="5" fill="#333"/>
      <circle cx="390" cy="30" r="3" fill="#ffcccc" opacity="0.5"/>
      <circle cx="420" cy="30" r="3" fill="#ffcccc" opacity="0.5"/>
      <circle cx="450" cy="30" r="3" fill="#ffcccc" opacity="0.5"/>
      <circle cx="480" cy="30" r="3" fill="#ffcccc" opacity="0.5"/>
      
      <!-- User 2 -->
      <circle cx="30" cy="60" r="3" fill="#ffcccc" opacity="0.5"/>
      <circle cx="60" cy="60" r="3" fill="#ffcccc" opacity="0.5"/>
      <circle cx="90" cy="60" r="5" fill="#333"/>
      <circle cx="120" cy="60" r="3" fill="#ffcccc" opacity="0.5"/>
      <circle cx="150" cy="60" r="3" fill="#ffcccc" opacity="0.5"/>
      <circle cx="180" cy="60" r="3" fill="#ffcccc" opacity="0.5"/>
      <circle cx="210" cy="60" r="3" fill="#ffcccc" opacity="0.5"/>
      <circle cx="240" cy="60" r="5" fill="#333"/>
      <circle cx="270" cy="60" r="3" fill="#ffcccc" opacity="0.5"/>
      <circle cx="300" cy="60" r="3" fill="#ffcccc" opacity="0.5"/>
      <circle cx="330" cy="60" r="3" fill="#ffcccc" opacity="0.5"/>
      <circle cx="360" cy="60" r="3" fill="#ffcccc" opacity="0.5"/>
      <circle cx="390" cy="60" r="3" fill="#ffcccc" opacity="0.5"/>
      <circle cx="420" cy="60" r="5" fill="#333"/>
      <circle cx="450" cy="60" r="3" fill="#ffcccc" opacity="0.5"/>
      <circle cx="480" cy="60" r="3" fill="#ffcccc" opacity="0.5"/>
      
      <!-- Additional sparse rows -->
      <circle cx="60" cy="90" r="5" fill="#333"/>
      <circle cx="210" cy="90" r="5" fill="#333"/>
      <circle cx="450" cy="90" r="5" fill="#333"/>
      
      <circle cx="120" cy="120" r="5" fill="#333"/>
      <circle cx="300" cy="120" r="5" fill="#333"/>
      
      <circle cx="30" cy="150" r="5" fill="#333"/>
      <circle cx="420" cy="150" r="5" fill="#333"/>
      
      <circle cx="180" cy="280" r="5" fill="#333"/>
      <circle cx="360" cy="280" r="5" fill="#333"/>
      <circle cx="480" cy="280" r="5" fill="#333"/>
    </g>
    
    <!-- Legend -->
    <g transform="translate(80, 320)">
      <circle cx="0" cy="0" r="5" fill="#333"/>
      <text x="15" y="5" font-size="13" fill="#333" font-weight="bold">Actual rating (black)</text>
      <circle cx="200" cy="0" r="4" fill="#ffcccc" opacity="0.5"/>
      <text x="215" y="5" font-size="13" fill="#666">Missing rating (red)</text>
    </g>
  </g>
  
  <!-- Overlap Analysis with Better Visualization -->
  <g transform="translate(750, 80)">
    <rect x="0" y="0" width="600" height="400" fill="#f0f8ff" stroke="#0066ff" stroke-width="3" rx="10"/>
    <text x="300" y="35" font-size="20" font-weight="bold" text-anchor="middle" fill="#0044cc">
      Row vs Column Overlap Comparison
    </text>
    
    <!-- User overlap (rows) - IMPROVED -->
    <g transform="translate(50, 70)">
      <text x="250" y="0" font-size="16" font-weight="bold" text-anchor="middle" fill="#ff6600">
        User-User Overlap (Rows)
      </text>
      
      <!-- Visual representation of two user vectors -->
      <g transform="translate(0, 25)">
        <text x="0" y="15" font-size="12" fill="#666" font-weight="bold">User A:</text>
        <rect x="60" y="0" width="420" height="25" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
        
        <!-- Sparse dots for User A -->
        <circle cx="80" cy="12" r="5" fill="#333"/>
        <circle cx="110" cy="12" r="3" fill="#ffcccc" opacity="0.4"/>
        <circle cx="140" cy="12" r="3" fill="#ffcccc" opacity="0.4"/>
        <circle cx="170" cy="12" r="3" fill="#ffcccc" opacity="0.4"/>
        <circle cx="200" cy="12" r="5" fill="#333"/>
        <circle cx="230" cy="12" r="3" fill="#ffcccc" opacity="0.4"/>
        <circle cx="260" cy="12" r="3" fill="#ffcccc" opacity="0.4"/>
        <circle cx="290" cy="12" r="3" fill="#ffcccc" opacity="0.4"/>
        <circle cx="320" cy="12" r="3" fill="#ffcccc" opacity="0.4"/>
        <circle cx="350" cy="12" r="3" fill="#ffcccc" opacity="0.4"/>
        <circle cx="380" cy="12" r="5" fill="#333"/>
        <circle cx="410" cy="12" r="3" fill="#ffcccc" opacity="0.4"/>
        <circle cx="440" cy="12" r="3" fill="#ffcccc" opacity="0.4"/>
        <circle cx="470" cy="12" r="3" fill="#ffcccc" opacity="0.4"/>
        
        <text x="0" y="55" font-size="12" fill="#666" font-weight="bold">User B:</text>
        <rect x="60" y="40" width="420" height="25" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
        
        <!-- Sparse dots for User B -->
        <circle cx="80" cy="52" r="3" fill="#ffcccc" opacity="0.4"/>
        <circle cx="110" cy="52" r="5" fill="#333"/>
        <circle cx="140" cy="52" r="3" fill="#ffcccc" opacity="0.4"/>
        <circle cx="170" cy="52" r="3" fill="#ffcccc" opacity="0.4"/>
        <circle cx="200" cy="52" r="3" fill="#ffcccc" opacity="0.4"/>
        <circle cx="230" cy="52" r="5" fill="#333"/>
        <circle cx="260" cy="52" r="3" fill="#ffcccc" opacity="0.4"/>
        <circle cx="290" cy="52" r="3" fill="#ffcccc" opacity="0.4"/>
        <circle cx="320" cy="52" r="3" fill="#ffcccc" opacity="0.4"/>
        <circle cx="350" cy="52" r="3" fill="#ffcccc" opacity="0.4"/>
        <circle cx="380" cy="52" r="5" fill="#333"/>
        <circle cx="410" cy="52" r="3" fill="#ffcccc" opacity="0.4"/>
        <circle cx="440" cy="52" r="3" fill="#ffcccc" opacity="0.4"/>
        <circle cx="470" cy="52" r="3" fill="#ffcccc" opacity="0.4"/>
        
        <!-- Highlight the ONE collision -->
        <rect x="370" y="-5" width="20" height="75" fill="#ff6600" opacity="0.2" stroke="#ff6600" stroke-width="2" stroke-dasharray="3,3"/>
        <text x="380" y="82" font-size="11" font-weight="bold" text-anchor="middle" fill="#d63031">
          Collision!
        </text>
      </g>
      
      <text x="250" y="130" font-size="14" font-weight="bold" text-anchor="middle" fill="#d63031">
        Result: ~3 collisions (0.014% overlap)
      </text>
    </g>
    
    <!-- Item overlap (columns) - IMPROVED -->
    <g transform="translate(50, 230)">
      <text x="250" y="0" font-size="16" font-weight="bold" text-anchor="middle" fill="#0066ff">
        Item-Item Overlap (Columns)
      </text>
      
      <!-- Two item columns side by side -->
      <g transform="translate(140, 25)">
        <!-- Item X column -->
        <text x="35" y="-5" font-size="11" text-anchor="middle" fill="#666" font-weight="bold">Item X</text>
        <rect x="10" y="5" width="50" height="110" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
        
        <!-- Dense ratings for Item X -->
        <circle cx="35" cy="15" r="4" fill="#0066ff"/>
        <circle cx="35" cy="28" r="4" fill="#0066ff"/>
        <circle cx="35" cy="41" r="4" fill="#0066ff"/>
        <circle cx="35" cy="54" r="4" fill="#0066ff"/>
        <circle cx="35" cy="67" r="4" fill="#0066ff"/>
        <circle cx="35" cy="80" r="4" fill="#0066ff"/>
        <circle cx="35" cy="93" r="4" fill="#0066ff"/>
        <circle cx="35" cy="106" r="4" fill="#0066ff"/>
        
        <!-- Item Y column -->
        <text x="115" y="-5" font-size="11" text-anchor="middle" fill="#666" font-weight="bold">Item Y</text>
        <rect x="90" y="5" width="50" height="110" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
        
        <!-- Dense ratings for Item Y -->
        <circle cx="115" cy="15" r="4" fill="#0066ff"/>
        <circle cx="115" cy="28" r="4" fill="#0066ff"/>
        <circle cx="115" cy="41" r="4" fill="#0066ff"/>
        <circle cx="115" cy="54" r="4" fill="#0066ff"/>
        <circle cx="115" cy="67" r="4" fill="#0066ff"/>
        <circle cx="115" cy="80" r="4" fill="#0066ff"/>
        <circle cx="115" cy="93" r="4" fill="#0066ff"/>
        <circle cx="115" cy="106" r="4" fill="#0066ff"/>
        
        <!-- Connection lines showing overlap -->
        <line x1="60" y1="15" x2="90" y2="15" stroke="#00b894" stroke-width="2.5" opacity="0.8"/>
        <line x1="60" y1="28" x2="90" y2="28" stroke="#00b894" stroke-width="2.5" opacity="0.8"/>
        <line x1="60" y1="41" x2="90" y2="41" stroke="#00b894" stroke-width="2.5" opacity="0.8"/>
        <line x1="60" y1="54" x2="90" y2="54" stroke="#00b894" stroke-width="2.5" opacity="0.8"/>
        <line x1="60" y1="67" x2="90" y2="67" stroke="#00b894" stroke-width="2.5" opacity="0.8"/>
        <line x1="60" y1="80" x2="90" y2="80" stroke="#00b894" stroke-width="2.5" opacity="0.8"/>
        <line x1="60" y1="93" x2="90" y2="93" stroke="#00b894" stroke-width="2.5" opacity="0.8"/>
        <line x1="60" y1="106" x2="90" y2="106" stroke="#00b894" stroke-width="2.5" opacity="0.8"/>
        
        <!-- Highlight overlap region -->
        <rect x="60" y="5" width="30" height="110" fill="#00b894" opacity="0.15"/>
        
        <text x="180" y="60" font-size="13" font-weight="bold" fill="#00b894">
          ← Many collisions!
        </text>
      </g>
      
      <text x="250" y="155" font-size="14" font-weight="bold" text-anchor="middle" fill="#00b894">
        Result: ~125,000 collisions (25% overlap)
      </text>
    </g>
  </g>
  
  <!-- Statistical Comparison -->
  <g transform="translate(100, 520)">
    <rect x="0" y="0" width="1200" height="420" fill="#f9f9f9" stroke="#666" stroke-width="2" rx="10"/>
    <text x="600" y="40" font-size="22" font-weight="bold" text-anchor="middle" fill="#2d3436">
      Quantitative Sparsity Analysis
    </text>
    
    <!-- Metrics Table -->
    <g transform="translate(50, 70)">
      <!-- Header -->
      <rect x="0" y="0" width="1100" height="40" fill="#34495e" rx="5"/>
      <text x="220" y="26" font-size="15" font-weight="bold" fill="#fff">Metric</text>
      <text x="550" y="26" font-size="15" font-weight="bold" fill="#fff">User-Based (Rows)</text>
      <text x="900" y="26" font-size="15" font-weight="bold" fill="#fff">Item-Based (Columns)</text>
      
      <!-- Row 1 -->
      <rect x="0" y="40" width="1100" height="50" fill="#fff"/>
      <text x="20" y="70" font-size="13" font-weight="bold" fill="#333">Typical Fill Rate</text>
      <text x="550" y="70" font-size="13" text-anchor="middle" fill="#555">1.2% (240/20,000)</text>
      <text x="900" y="70" font-size="13" text-anchor="middle" fill="#555">50% (250k/500k users)</text>
      
      <!-- Row 2 -->
      <rect x="0" y="90" width="1100" height="50" fill="#ecf0f1"/>
      <text x="20" y="120" font-size="13" font-weight="bold" fill="#333">Collision Probability</text>
      <text x="550" y="120" font-size="13" text-anchor="middle" fill="#555">1.2% × 1.2% = 0.014%</text>
      <text x="900" y="120" font-size="13" text-anchor="middle" fill="#555">50% × 50% = 25%</text>
      
      <!-- Row 3 -->
      <rect x="0" y="140" width="1100" height="50" fill="#fff"/>
      <text x="20" y="170" font-size="13" font-weight="bold" fill="#333">Expected Collisions</text>
      <text x="550" y="170" font-size="13" text-anchor="middle" fill="#555">~3 co-rated items</text>
      <text x="900" y="170" font-size="13" text-anchor="middle" fill="#555">~125,000 co-ratings</text>
      
      <!-- Row 4 -->
      <rect x="0" y="190" width="1100" height="50" fill="#ecf0f1"/>
      <text x="20" y="220" font-size="13" font-weight="bold" fill="#333">Similarity Reliability</text>
      <text x="550" y="220" font-size="13" text-anchor="middle" fill="#d63031">Low (high variance)</text>
      <text x="900" y="220" font-size="13" text-anchor="middle" fill="#00b894">High (low variance)</text>
      
      <!-- Row 5 -->
      <rect x="0" y="240" width="1100" height="50" fill="#fff"/>
      <text x="20" y="270" font-size="13" font-weight="bold" fill="#333">Standard Error</text>
      <text x="550" y="270" font-size="13" text-anchor="middle" fill="#555">SE = σ/√3 ≈ 0.58σ</text>
      <text x="900" y="270" font-size="13" text-anchor="middle" fill="#555">SE = σ/√125,000 ≈ 0.003σ</text>
      
      <!-- Row 6 -->
      <rect x="0" y="290" width="1100" height="50" fill="#ecf0f1"/>
      <text x="20" y="320" font-size="13" font-weight="bold" fill="#333">Performance Factor</text>
      <text x="550" y="320" font-size="13" text-anchor="middle" fill="#d63031">Baseline (1×)</text>
      <text x="900" y="320" font-size="13" text-anchor="middle" fill="#00b894">~41,667× better</text>
    </g>
    
    <!-- Key insight box -->
    <g transform="translate(100, 360)">
      <rect x="0" y="0" width="1000" height="40" fill="#fff3cd" stroke="#ffc107" stroke-width="2" rx="5"/>
      <text x="500" y="26" font-size="14" font-weight="bold" text-anchor="middle" fill="#856404">
        💡 Key Insight: Popular items have 1,785× more overlap probability than typical user pairs
      </text>
    </g>
  </g>
</svg>