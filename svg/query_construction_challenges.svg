<svg viewBox="0 0 1400 1100" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1400" height="1100" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="700" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Query Construction Challenges
  </text>
  <text x="700" y="70" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#495057">
    Common Issues and Solutions
  </text>
  
  <!-- Challenge 1: Ambiguity -->
  <g id="challenge1">
    <rect x="50" y="100" width="650" height="240" rx="10" fill="#fff3bf" stroke="#f59f00" stroke-width="3"/>
    <text x="375" y="130" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Challenge 1: Ambiguity Resolution
    </text>
    
    <!-- Lexical Ambiguity -->
    <rect x="80" y="150" width="280" height="175" rx="5" fill="#fff" stroke="#f59f00" stroke-width="2"/>
    <text x="220" y="172" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#495057">
      Lexical Ambiguity
    </text>
    <text x="95" y="192" font-family="Arial, sans-serif" font-size="10" fill="#f03e3e">
      Problem:
    </text>
    <text x="95" y="207" font-family="Arial, sans-serif" font-size="9" fill="#495057">
      bank = financial institution?
    </text>
    <text x="95" y="221" font-family="Arial, sans-serif" font-size="9" fill="#495057">
      or river bank?
    </text>
    <text x="95" y="242" font-family="Arial, sans-serif" font-size="10" fill="#37b24d">
      Solution:
    </text>
    <text x="95" y="257" font-family="Arial, sans-serif" font-size="9" fill="#495057">
      • Use schema context
    </text>
    <text x="95" y="271" font-family="Arial, sans-serif" font-size="9" fill="#495057">
      • Disambiguate with domain
    </text>
    <text x="95" y="285" font-family="Arial, sans-serif" font-size="9" fill="#495057">
      • Check available tables
    </text>
    <text x="95" y="304" font-family="Arial, sans-serif" font-size="9" font-style="italic" fill="#868e96">
      Example: In financial DB,
    </text>
    <text x="95" y="318" font-family="Arial, sans-serif" font-size="9" font-style="italic" fill="#868e96">
      bank maps to financial_institution
    </text>
    
    <!-- Structural Ambiguity -->
    <rect x="380" y="150" width="300" height="175" rx="5" fill="#fff" stroke="#f59f00" stroke-width="2"/>
    <text x="530" y="172" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#495057">
      Structural Ambiguity
    </text>
    <text x="395" y="192" font-family="Arial, sans-serif" font-size="10" fill="#f03e3e">
      Problem:
    </text>
    <text x="395" y="207" font-family="Arial, sans-serif" font-size="9" fill="#495057">
      Find customers who bought
    </text>
    <text x="395" y="221" font-family="Arial, sans-serif" font-size="9" fill="#495057">
      products in 2024 or 2025
    </text>
    <text x="395" y="238" font-family="Arial, sans-serif" font-size="8" fill="#868e96">
      Interpretation 1: bought in 2024
    </text>
    <text x="395" y="250" font-family="Arial, sans-serif" font-size="8" fill="#868e96">
      OR customers in 2025?
    </text>
    <text x="395" y="262" font-family="Arial, sans-serif" font-size="8" fill="#868e96">
      Interpretation 2: bought products
    </text>
    <text x="395" y="274" font-family="Arial, sans-serif" font-size="8" fill="#868e96">
      in 2024 OR 2025?
    </text>
    <text x="395" y="291" font-family="Arial, sans-serif" font-size="10" fill="#37b24d">
      Solution:
    </text>
    <text x="395" y="306" font-family="Arial, sans-serif" font-size="9" fill="#495057">
      • Use parentheses properly
    </text>
    <text x="395" y="320" font-family="Arial, sans-serif" font-size="9" fill="#495057">
      • Apply operator precedence
    </text>
  </g>
  
  <!-- Challenge 2: Schema Complexity -->
  <g id="challenge2">
    <rect x="730" y="100" width="620" height="240" rx="10" fill="#ffc9c9" stroke="#f03e3e" stroke-width="3"/>
    <text x="1040" y="130" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Challenge 2: Schema Complexity
    </text>
    
    <!-- Large Schemas -->
    <rect x="760" y="150" width="280" height="175" rx="5" fill="#fff" stroke="#f03e3e" stroke-width="2"/>
    <text x="900" y="172" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#495057">
      Large Schemas
    </text>
    <text x="775" y="192" font-family="Arial, sans-serif" font-size="10" fill="#f03e3e">
      Problem:
    </text>
    <text x="775" y="207" font-family="Arial, sans-serif" font-size="9" fill="#495057">
      • 100s of tables
    </text>
    <text x="775" y="221" font-family="Arial, sans-serif" font-size="9" fill="#495057">
      • 1000s of columns
    </text>
    <text x="775" y="235" font-family="Arial, sans-serif" font-size="9" fill="#495057">
      • Complex relationships
    </text>
    <text x="775" y="254" font-family="Arial, sans-serif" font-size="10" fill="#37b24d">
      Solution:
    </text>
    <text x="775" y="269" font-family="Arial, sans-serif" font-size="9" fill="#495057">
      • Schema indexing
    </text>
    <text x="775" y="283" font-family="Arial, sans-serif" font-size="9" fill="#495057">
      • Relevance ranking
    </text>
    <text x="775" y="297" font-family="Arial, sans-serif" font-size="9" fill="#495057">
      • Pre-filter most relevant
    </text>
    <text x="775" y="311" font-family="Arial, sans-serif" font-size="9" fill="#495057">
      • Semantic search on schema
    </text>
    
    <!-- Inconsistent Naming -->
    <rect x="1060" y="150" width="270" height="175" rx="5" fill="#fff" stroke="#f03e3e" stroke-width="2"/>
    <text x="1195" y="172" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#495057">
      Inconsistent Naming
    </text>
    <text x="1075" y="192" font-family="Arial, sans-serif" font-size="10" fill="#f03e3e">
      Problem:
    </text>
    <text x="1075" y="207" font-family="Arial, sans-serif" font-size="9" fill="#495057">
      customer_id vs customerId
    </text>
    <text x="1075" y="221" font-family="Arial, sans-serif" font-size="9" fill="#495057">
      vs cust_id vs CustomerID
    </text>
    <text x="1075" y="240" font-family="Arial, sans-serif" font-size="10" fill="#37b24d">
      Solution:
    </text>
    <text x="1075" y="255" font-family="Arial, sans-serif" font-size="9" fill="#495057">
      • Maintain naming map
    </text>
    <text x="1075" y="269" font-family="Arial, sans-serif" font-size="9" fill="#495057">
      • Use synonym dictionary
    </text>
    <text x="1075" y="283" font-family="Arial, sans-serif" font-size="9" fill="#495057">
      • Normalize conventions
    </text>
    <text x="1075" y="297" font-family="Arial, sans-serif" font-size="9" fill="#495057">
      • Schema documentation
    </text>
  </g>
  
  <!-- Challenge 3: Complex Logic -->
  <g id="challenge3">
    <rect x="50" y="370" width="650" height="240" rx="10" fill="#d3f9d8" stroke="#37b24d" stroke-width="3"/>
    <text x="375" y="400" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Challenge 3: Complex Logic
    </text>
    
    <!-- Multi-Hop Reasoning -->
    <rect x="80" y="420" width="280" height="175" rx="5" fill="#fff" stroke="#37b24d" stroke-width="2"/>
    <text x="220" y="442" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#495057">
      Multi-Hop Reasoning
    </text>
    <text x="95" y="462" font-family="Arial, sans-serif" font-size="10" fill="#f03e3e">
      Problem:
    </text>
    <text x="95" y="477" font-family="Arial, sans-serif" font-size="9" fill="#495057">
      Find customers who bought
    </text>
    <text x="95" y="491" font-family="Arial, sans-serif" font-size="9" fill="#495057">
      products from suppliers in CA
    </text>
    <text x="95" y="505" font-family="Arial, sans-serif" font-size="8" fill="#868e96">
      Requires: customers to orders
    </text>
    <text x="95" y="517" font-family="Arial, sans-serif" font-size="8" fill="#868e96">
      to products to suppliers
    </text>
    <text x="95" y="529" font-family="Arial, sans-serif" font-size="8" fill="#868e96">
      to locations (5 joins!)
    </text>
    <text x="95" y="546" font-family="Arial, sans-serif" font-size="10" fill="#37b24d">
      Solution:
    </text>
    <text x="95" y="561" font-family="Arial, sans-serif" font-size="9" fill="#495057">
      • Break into sub-queries
    </text>
    <text x="95" y="575" font-family="Arial, sans-serif" font-size="9" fill="#495057">
      • Use CTEs
    </text>
    <text x="95" y="589" font-family="Arial, sans-serif" font-size="9" fill="#495057">
      • Optimize join order
    </text>
    
    <!-- Temporal Reasoning -->
    <rect x="380" y="420" width="300" height="175" rx="5" fill="#fff" stroke="#37b24d" stroke-width="2"/>
    <text x="530" y="442" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#495057">
      Temporal Reasoning
    </text>
    <text x="395" y="462" font-family="Arial, sans-serif" font-size="10" fill="#f03e3e">
      Problem:
    </text>
    <text x="395" y="477" font-family="Arial, sans-serif" font-size="9" fill="#495057">
      Compare Q4 this year to Q4
    </text>
    <text x="395" y="491" font-family="Arial, sans-serif" font-size="9" fill="#495057">
      last year
    </text>
    <text x="395" y="508" font-family="Arial, sans-serif" font-size="8" fill="#868e96">
      Requires: complex date logic,
    </text>
    <text x="395" y="520" font-family="Arial, sans-serif" font-size="8" fill="#868e96">
      self-joins, CASE statements
    </text>
    <text x="395" y="537" font-family="Arial, sans-serif" font-size="10" fill="#37b24d">
      Solution:
    </text>
    <text x="395" y="552" font-family="Arial, sans-serif" font-size="9" fill="#495057">
      • Template library for
    </text>
    <text x="395" y="566" font-family="Arial, sans-serif" font-size="9" fill="#495057">
        common patterns
    </text>
    <text x="395" y="580" font-family="Arial, sans-serif" font-size="9" fill="#495057">
      • Date utility functions
    </text>
  </g>
  
  <!-- Challenge 4: Performance -->
  <g id="challenge4">
    <rect x="730" y="370" width="620" height="240" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="3"/>
    <text x="1040" y="400" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Challenge 4: Performance Issues
    </text>
    
    <!-- Expensive Queries -->
    <rect x="760" y="420" width="280" height="175" rx="5" fill="#fff" stroke="#1971c2" stroke-width="2"/>
    <text x="900" y="442" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#495057">
      Expensive Queries
    </text>
    <text x="775" y="462" font-family="Arial, sans-serif" font-size="10" fill="#f03e3e">
      Problem:
    </text>
    <text x="775" y="477" font-family="Arial, sans-serif" font-size="9" fill="#495057">
      • Full table scans
    </text>
    <text x="775" y="491" font-family="Arial, sans-serif" font-size="9" fill="#495057">
      • Missing indexes
    </text>
    <text x="775" y="505" font-family="Arial, sans-serif" font-size="9" fill="#495057">
      • Inefficient joins
    </text>
    <text x="775" y="524" font-family="Arial, sans-serif" font-size="10" fill="#37b24d">
      Solution:
    </text>
    <text x="775" y="539" font-family="Arial, sans-serif" font-size="9" fill="#495057">
      • EXPLAIN analysis
    </text>
    <text x="775" y="553" font-family="Arial, sans-serif" font-size="9" fill="#495057">
      • Suggest indexes
    </text>
    <text x="775" y="567" font-family="Arial, sans-serif" font-size="9" fill="#495057">
      • Query rewriting
    </text>
    <text x="775" y="581" font-family="Arial, sans-serif" font-size="9" fill="#495057">
      • Result set limits
    </text>
    
    <!-- Resource Limits -->
    <rect x="1060" y="420" width="270" height="175" rx="5" fill="#fff" stroke="#1971c2" stroke-width="2"/>
    <text x="1195" y="442" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#495057">
      Resource Limits
    </text>
    <text x="1075" y="462" font-family="Arial, sans-serif" font-size="10" fill="#f03e3e">
      Problem:
    </text>
    <text x="1075" y="477" font-family="Arial, sans-serif" font-size="9" fill="#495057">
      • Query timeout
    </text>
    <text x="1075" y="491" font-family="Arial, sans-serif" font-size="9" fill="#495057">
      • Memory limits
    </text>
    <text x="1075" y="505" font-family="Arial, sans-serif" font-size="9" fill="#495057">
      • Large result sets
    </text>
    <text x="1075" y="524" font-family="Arial, sans-serif" font-size="10" fill="#37b24d">
      Solution:
    </text>
    <text x="1075" y="539" font-family="Arial, sans-serif" font-size="9" fill="#495057">
      • Set execution timeout
    </text>
    <text x="1075" y="553" font-family="Arial, sans-serif" font-size="9" fill="#495057">
      • Implement pagination
    </text>
    <text x="1075" y="567" font-family="Arial, sans-serif" font-size="9" fill="#495057">
      • Warn users early
    </text>
    <text x="1075" y="581" font-family="Arial, sans-serif" font-size="9" fill="#495057">
      • Graceful degradation
    </text>
  </g>
  
  <!-- Challenge 5: Safety and Security -->
  <g id="challenge5">
    <rect x="50" y="640" width="1300" height="230" rx="10" fill="#ffe3e3" stroke="#c92a2a" stroke-width="3"/>
    <text x="700" y="670" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Challenge 5: Safety and Security
    </text>
    
    <!-- SQL Injection -->
    <rect x="80" y="690" width="380" height="165" rx="5" fill="#fff" stroke="#c92a2a" stroke-width="2"/>
    <text x="270" y="712" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#495057">
      SQL Injection Prevention
    </text>
    <text x="95" y="732" font-family="Arial, sans-serif" font-size="10" fill="#f03e3e">
      Problem:
    </text>
    <text x="95" y="747" font-family="Arial, sans-serif" font-size="9" fill="#495057">
      Malicious SQL in user input
    </text>
    <text x="95" y="761" font-family="Arial, sans-serif" font-size="8" fill="#868e96">
      Example: DROP TABLE users
    </text>
    <text x="95" y="778" font-family="Arial, sans-serif" font-size="10" fill="#37b24d">
      Solution:
    </text>
    <text x="95" y="793" font-family="Arial, sans-serif" font-size="9" fill="#495057">
      • Parameterized queries ONLY
    </text>
    <text x="95" y="807" font-family="Arial, sans-serif" font-size="9" fill="#495057">
      • Input validation and sanitization
    </text>
    <text x="95" y="821" font-family="Arial, sans-serif" font-size="9" fill="#495057">
      • Never concatenate user input
    </text>
    <text x="95" y="835" font-family="Arial, sans-serif" font-size="9" fill="#495057">
      • Whitelist allowed operations
    </text>
    
    <!-- Unauthorized Access -->
    <rect x="480" y="690" width="380" height="165" rx="5" fill="#fff" stroke="#c92a2a" stroke-width="2"/>
    <text x="670" y="712" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#495057">
      Unauthorized Access
    </text>
    <text x="495" y="732" font-family="Arial, sans-serif" font-size="10" fill="#f03e3e">
      Problem:
    </text>
    <text x="495" y="747" font-family="Arial, sans-serif" font-size="9" fill="#495057">
      Query requests restricted data
    </text>
    <text x="495" y="761" font-family="Arial, sans-serif" font-size="8" fill="#868e96">
      Example: User should not see salary data
    </text>
    <text x="495" y="778" font-family="Arial, sans-serif" font-size="10" fill="#37b24d">
      Solution:
    </text>
    <text x="495" y="793" font-family="Arial, sans-serif" font-size="9" fill="#495057">
      • Row-level security
    </text>
    <text x="495" y="807" font-family="Arial, sans-serif" font-size="9" fill="#495057">
      • Permission checks before execution
    </text>
    <text x="495" y="821" font-family="Arial, sans-serif" font-size="9" fill="#495057">
      • Column-level access control
    </text>
    <text x="495" y="835" font-family="Arial, sans-serif" font-size="9" fill="#495057">
      • Audit logging
    </text>
    
    <!-- Destructive Operations -->
    <rect x="880" y="690" width="450" height="165" rx="5" fill="#fff" stroke="#c92a2a" stroke-width="2"/>
    <text x="1105" y="712" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#495057">
      Destructive Operations
    </text>
    <text x="895" y="732" font-family="Arial, sans-serif" font-size="10" fill="#f03e3e">
      Problem:
    </text>
    <text x="895" y="747" font-family="Arial, sans-serif" font-size="9" fill="#495057">
      DELETE, UPDATE, DROP in generated queries
    </text>
    <text x="895" y="761" font-family="Arial, sans-serif" font-size="8" fill="#868e96">
      Risk: Accidental data loss or modification
    </text>
    <text x="895" y="778" font-family="Arial, sans-serif" font-size="10" fill="#37b24d">
      Solution:
    </text>
    <text x="895" y="793" font-family="Arial, sans-serif" font-size="9" fill="#495057">
      • Restrict to SELECT and WITH statements ONLY
    </text>
    <text x="895" y="807" font-family="Arial, sans-serif" font-size="9" fill="#495057">
      • Whitelist allowed operations
    </text>
    <text x="895" y="821" font-family="Arial, sans-serif" font-size="9" fill="#495057">
      • Read-only database connections
    </text>
    <text x="895" y="835" font-family="Arial, sans-serif" font-size="9" fill="#495057">
      • Query validation before execution
    </text>
  </g>
  
  <!-- Best Practices Summary -->
  <g id="summary">
    <rect x="50" y="900" width="1300" height="180" rx="10" fill="#d0bfff" stroke="#7950f2" stroke-width="3"/>
    <text x="700" y="930" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Mitigation Strategy Summary
    </text>
    
    <rect x="80" y="950" width="1240" height="115" rx="5" fill="#fff" stroke="#7950f2" stroke-width="2"/>
    <text x="100" y="975" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#495057">
      Key Principles for Robust Query Construction:
    </text>
    <text x="120" y="995" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      1. Always use context (schema, domain knowledge) to disambiguate queries
    </text>
    <text x="120" y="1012" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      2. Implement comprehensive validation: syntax, semantics, security, performance
    </text>
    <text x="120" y="1029" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      3. Use parameterized queries and never concatenate user input into SQL
    </text>
    <text x="120" y="1046" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      4. Set resource limits (timeouts, result size) and monitor query performance
    </text>
    <text x="120" y="1063" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      5. Maintain detailed error logging and graceful fallback mechanisms
    </text>
  </g>
</svg>