<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title-text { font-family: 'Arial', sans-serif; font-size: 24px; font-weight: bold; fill: #2C3E50; }
      .subtitle-text { font-family: 'Arial', sans-serif; font-size: 16px; fill: #555; }
      .node-circle { fill: #95A5A6; stroke: #7F8C8D; stroke-width: 2.5; }
      .node-active { fill: #E74C3C; stroke: #C0392B; stroke-width: 4; }
      .node-label { font-family: 'Arial', sans-serif; font-size: 13px; fill: white; font-weight: bold; text-anchor: middle; }
      .edge-line { stroke: #BDC3C7; stroke-width: 2; }
      .label-text { font-family: 'Arial', sans-serif; font-size: 13px; fill: #555; }
      .step-text { font-family: 'Arial', sans-serif; font-size: 14px; fill: #2C3E50; }
      .math-text { font-family: 'Courier New', monospace; font-size: 13px; fill: #333; }
    </style>
  </defs>
  
  <!-- Title -->
  <text x="450" y="30" class="title-text" text-anchor="middle">Gibbs Sampler (MCMC)</text>
  <text x="450" y="55" class="subtitle-text" text-anchor="middle">Markov Chain Monte Carlo for Graphical Models</text>
  
  <!-- Network Visualization -->
  <g transform="translate(50, 90)">
    <text x="200" y="0" class="subtitle-text" text-anchor="middle" font-weight="bold">Graphical Model Network</text>
    
    <!-- Edges -->
    <line x1="100" y1="60" x2="180" y2="60" class="edge-line"/>
    <line x1="220" y1="60" x2="300" y2="60" class="edge-line"/>
    <line x1="100" y1="60" x2="140" y2="130" class="edge-line"/>
    <line x1="180" y1="60" x2="200" y2="130" class="edge-line"/>
    <line x1="220" y1="60" x2="200" y2="130" class="edge-line"/>
    <line x1="300" y1="60" x2="260" y2="130" class="edge-line"/>
    <line x1="140" y1="130" x2="200" y2="130" class="edge-line"/>
    <line x1="200" y1="130" x2="260" y2="130" class="edge-line"/>
    <line x1="140" y1="130" x2="170" y2="200" class="edge-line"/>
    <line x1="200" y1="130" x2="200" y2="200" class="edge-line"/>
    <line x1="260" y1="130" x2="230" y2="200" class="edge-line"/>
    
    <!-- Nodes -->
    <circle cx="100" cy="60" r="20" class="node-circle"/>
    <text x="100" y="66" class="node-label">+1</text>
    
    <circle cx="180" cy="60" r="20" class="node-circle"/>
    <text x="180" y="66" class="node-label">-1</text>
    
    <circle cx="220" cy="60" r="20" class="node-circle"/>
    <text x="220" y="66" class="node-label">+1</text>
    
    <circle cx="300" cy="60" r="20" class="node-circle"/>
    <text x="300" y="66" class="node-label">+1</text>
    
    <circle cx="140" cy="130" r="20" class="node-circle"/>
    <text x="140" y="136" class="node-label">-1</text>
    
    <!-- Active node being updated -->
    <circle cx="200" cy="130" r="22" class="node-active"/>
    <text x="200" y="136" class="node-label" style="font-size: 14px;">?</text>
    <text x="200" y="170" class="label-text" text-anchor="middle" font-weight="bold" fill="#E74C3C">Currently updating</text>
    
    <circle cx="260" cy="130" r="20" class="node-circle"/>
    <text x="260" y="136" class="node-label">+1</text>
    
    <circle cx="170" cy="200" r="20" class="node-circle"/>
    <text x="170" y="206" class="node-label">-1</text>
    
    <circle cx="200" cy="200" r="20" class="node-circle"/>
    <text x="200" y="206" class="node-label">+1</text>
    
    <circle cx="230" cy="200" r="20" class="node-circle"/>
    <text x="230" y="206" class="node-label">-1</text>
  </g>
  
  <!-- Algorithm Steps -->
  <g transform="translate(450, 90)">
    <rect x="0" y="0" width="400" height="240" fill="#FFF9E6" stroke="#FFA500" stroke-width="2" rx="5"/>
    <text x="200" y="30" class="subtitle-text" text-anchor="middle" font-weight="bold">Gibbs Sampler Algorithm</text>
    
    <text x="20" y="60" class="step-text" font-weight="bold">1. Initialize Configuration</text>
    <text x="30" y="80" class="label-text">Set all nodes to random values (+1 or -1)</text>
    
    <text x="20" y="110" class="step-text" font-weight="bold">2. Select Node to Update</text>
    <text x="30" y="130" class="label-text">Pick node v randomly or systematically</text>
    
    <text x="20" y="160" class="step-text" font-weight="bold">3. Sample from Conditional</text>
    <text x="30" y="180" class="math-text">P(X_v | X_neighbors)</text>
    <text x="30" y="200" class="label-text">Based on current neighbor states</text>
    
    <text x="20" y="225" class="step-text" font-weight="bold">4. Repeat Until Convergence</text>
  </g>
  
  <!-- Conditional Probability Example -->
  <g transform="translate(50, 360)">
    <rect x="0" y="0" width="390" height="180" fill="#E8F4F8" stroke="#3498DB" stroke-width="2" rx="5"/>
    <text x="195" y="30" class="subtitle-text" text-anchor="middle" font-weight="bold">Update Rule Example</text>
    
    <text x="20" y="60" class="label-text" font-weight="bold">Given neighbor configuration:</text>
    <text x="30" y="82" class="math-text">N(v) = {+1, -1, +1, +1, -1}</text>
    
    <line x1="20" y1="92" x2="370" y2="92" stroke="#CCC" stroke-width="1"/>
    
    <text x="20" y="115" class="label-text" font-weight="bold">Compute conditional probability:</text>
    <text x="30" y="137" class="math-text">P(X_v = +1 | neighbors) = 0.65</text>
    <text x="30" y="157" class="math-text">P(X_v = -1 | neighbors) = 0.35</text>
  </g>
  
  <!-- Social Network Analogy -->
  <g transform="translate(460, 360)">
    <rect x="0" y="0" width="390" height="180" fill="#F0F8FF" stroke="#3498DB" stroke-width="2" rx="5"/>
    <text x="195" y="30" class="subtitle-text" text-anchor="middle" font-weight="bold">Social Network Analogy</text>
    
    <text x="30" y="60" class="label-text">• People randomly log into Facebook</text>
    <text x="30" y="85" class="label-text">• Decision to post depends on friends</text>
    <text x="30" y="110" class="label-text">• Randomness in posting behavior</text>
    <text x="30" y="135" class="label-text">• May post despite friends (or vice versa)</text>
    <text x="30" y="160" class="label-text">• State evolves over time via updates</text>
  </g>
  
  <!-- Key Properties -->
  <g transform="translate(50, 560)">
    <rect x="0" y="0" width="800" height="120" fill="#D5F4E6" stroke="#27AE60" stroke-width="2" rx="5"/>
    <text x="400" y="30" class="subtitle-text" text-anchor="middle" font-weight="bold">Key Properties and Convergence</text>
    
    <g transform="translate(20, 50)">
      <text x="0" y="0" class="label-text" font-weight="bold">Mixing Time:</text>
      <text x="10" y="20" class="label-text">Number of iterations needed for samples to approximate target distribution</text>
      
      <text x="400" y="0" class="label-text" font-weight="bold">Depends on:</text>
      <text x="410" y="20" class="label-text">• Network structure   • Interaction strength</text>
      
      <text x="0" y="50" class="label-text" font-weight="bold">Estimate Marginals:</text>
      <text x="10" y="70" class="math-text">P(X_v = +1) ≈ (1/N) × Σ[X_v = +1 in samples]</text>
    </g>
  </g>
</svg>