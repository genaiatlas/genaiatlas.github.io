<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title-text { font-family: 'Arial', sans-serif; font-size: 24px; font-weight: bold; fill: #2c3e50; }
      .subtitle-text { font-family: 'Arial', sans-serif; font-size: 18px; font-weight: bold; fill: #34495e; }
      .label-text { font-family: 'Arial', sans-serif; font-size: 14px; fill: #34495e; }
      .small-text { font-family: 'Arial', sans-serif; font-size: 12px; fill: #7f8c8d; }
      .equation-text { font-family: 'Times New Roman', serif; font-size: 16px; fill: #2c3e50; }
      .axis-line { stroke: #2c3e50; stroke-width: 2; }
      .grid-line { stroke: #ecf0f1; stroke-width: 1; }
      .normal-curve { stroke: #e74c3c; stroke-width: 3; fill: none; }
      .likelihood-area { fill: rgba(231, 76, 60, 0.2); stroke: #e74c3c; stroke-width: 1; }
      .data-point { fill: #3498db; stroke: #2980b9; stroke-width: 2; }
      .mean-line { stroke: #27ae60; stroke-width: 2; stroke-dasharray: 5,5; }
      .highlight-box { fill: #f8f9fa; stroke: #6c757d; stroke-width: 2; rx: 8; }
      .formula-box { fill: #fff3cd; stroke: #ffc107; stroke-width: 2; rx: 8; }
    </style>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title-text">Normal Distribution in Maximum Likelihood</text>
  
  <!-- Main normal distribution plot -->
  <g transform="translate(50, 70)">
    <text x="200" y="0" text-anchor="middle" class="subtitle-text">Normal Distribution for Single Observation</text>
    
    <!-- Coordinate system -->
    <g transform="translate(50, 30)">
      <!-- Grid -->
      <line x1="0" y1="200" x2="300" y2="200" class="axis-line"/>
      <line x1="150" y1="0" x2="150" y2="220" class="axis-line"/>
      
      <!-- Grid lines -->
      <line x1="0" y1="50" x2="300" y2="50" class="grid-line"/>
      <line x1="0" y1="100" x2="300" y2="100" class="grid-line"/>
      <line x1="0" y1="150" x2="300" y2="150" class="grid-line"/>
      
      <line x1="75" y1="0" x2="75" y2="200" class="grid-line"/>
      <line x1="225" y1="0" x2="225" y2="200" class="grid-line"/>
      
      <!-- Normal curve: centered at mean θ₀ + θ₁Xᵢ -->
      <path d="M 30 195 Q 50 180 70 150 Q 90 100 110 70 Q 130 40 150 30 Q 170 40 190 70 Q 210 100 230 150 Q 250 180 270 195" class="normal-curve"/>
      
      <!-- Mean line -->
      <line x1="150" y1="0" x2="150" y2="200" class="mean-line"/>
      
      <!-- Observed data point -->
      <circle cx="130" cy="200" r="4" class="data-point"/>
      <text x="130" y="215" text-anchor="middle" class="small-text">Yᵢ</text>
      
      <!-- Likelihood area -->
      <path d="M 125 200 Q 130 190 135 195 Q 140 185 145 190 Q 150 180 155 185 L 155 200 Z" class="likelihood-area"/>
      
      <!-- Labels -->
      <text x="150" y="240" text-anchor="middle" class="small-text">θ₀ + θ₁Xᵢ</text>
      <text x="310" y="105" class="small-text">P(Y)</text>
      <text x="150" y="-15" text-anchor="middle" class="small-text">Y</text>
      
      <!-- Annotations -->
      <text x="170" y="50" class="small-text">σ</text>
      <text x="80" y="180" class="small-text">P(Yᵢ|Xᵢ,θ)</text>
    </g>
  </g>
  
  <!-- Mathematical formula -->
  <g transform="translate(450, 70)">
    <rect x="0" y="0" width="300" height="160" class="formula-box"/>
    <text x="150" y="25" text-anchor="middle" class="subtitle-text" fill="#856404">Probability Density</text>
    
    <text x="150" y="55" text-anchor="middle" class="equation-text">P(Yᵢ | Xᵢ, θ₀, θ₁) =</text>
    
    <text x="150" y="85" text-anchor="middle" class="equation-text">(1/√(2πσ²)) exp{-(Yᵢ - θ₀ - θ₁Xᵢ)²/(2σ²)}</text>
    
    <text x="20" y="115" class="small-text">Where:</text>
    <text x="30" y="130" class="small-text">• Mean = θ₀ + θ₁Xᵢ (linear prediction)</text>
    <text x="30" y="145" class="small-text">• Variance = σ² (constant noise)</text>
  </g>
  
  <!-- Likelihood for multiple observations -->
  <g transform="translate(50, 350)">
    <text x="350" y="0" text-anchor="middle" class="subtitle-text">Likelihood for All Observations</text>
    
    <rect x="0" y="20" width="700" height="180" class="highlight-box"/>
    
    <text x="20" y="50" class="label-text">Independence Assumption:</text>
    <text x="350" y="75" text-anchor="middle" class="equation-text">L(θ₀, θ₁) = ∏ᵢ₌₁ⁿ P(Yᵢ | Xᵢ, θ₀, θ₁)</text>
    
    <text x="20" y="110" class="label-text">Expanded Form:</text>
    <text x="350" y="135" text-anchor="middle" class="equation-text">L(θ₀, θ₁) = ∏ᵢ₌₁ⁿ (1/√(2πσ²)) exp{-(Yᵢ - θ₀ - θ₁Xᵢ)²/(2σ²)}</text>
    
    <text x="20" y="170" class="label-text">Log-Likelihood (easier to work with):</text>
    <text x="350" y="190" text-anchor="middle" class="equation-text">log L(θ₀, θ₁) = -n/2 log(2πσ²) - (1/2σ²) Σᵢ₌₁ⁿ (Yᵢ - θ₀ - θ₁Xᵢ)²</text>
  </g>
  
  <!-- Key insight -->
  <g transform="translate(200, 560)">
    <rect x="0" y="0" width="400" height="30" fill="#d4edda" stroke="#28a745" stroke-width="2" rx="5"/>
    <text x="200" y="20" text-anchor="middle" class="label-text" fill="#155724">
      Maximizing log-likelihood ≡ Minimizing sum of squared errors
    </text>
  </g>
</svg>