<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="normalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:0.2" />
      <stop offset="50%" style="stop-color:#667eea;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#667eea;stop-opacity:0.2" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="35" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Central Limit Theorem (CLT)
  </text>
  
  <!-- Main Statement Box -->
  <g transform="translate(50, 70)">
    <rect x="0" y="0" width="700" height="80" rx="10" fill="#667eea" fill-opacity="0.1" stroke="#667eea" stroke-width="2" filter="url(#shadow)"/>
    
    <text x="350" y="30" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      As sample size increases (n → ∞), the sampling distribution of sample means
    </text>
    <text x="350" y="50" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      approaches a normal distribution, regardless of population distribution shape
    </text>
    
    <text x="350" y="70" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#667eea">
      X̄ ~ N(μ, σ²/n)
    </text>
  </g>
  
  <!-- Visual Demonstration -->
  <g transform="translate(50, 180)">
    <text x="0" y="0" font-family="Arial" font-size="18" font-weight="bold" fill="#34495e">
      Population → Sample → Sampling Distribution
    </text>
    
    <!-- Population Distribution (Skewed) -->
    <g transform="translate(0, 30)">
      <rect x="0" y="0" width="200" height="150" rx="8" fill="white" stroke="#e74c3c" stroke-width="2"/>
      <text x="100" y="20" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#c0392b">
        Population (Any Shape)
      </text>
      
      <!-- Skewed distribution -->
      <g transform="translate(20, 40)">
        <line x1="0" y1="90" x2="160" y2="90" stroke="#333" stroke-width="1"/>
        <line x1="0" y1="90" x2="0" y2="20" stroke="#333" stroke-width="1"/>
        
        <rect x="10" y="70" width="15" height="20" fill="#e74c3c" opacity="0.7"/>
        <rect x="30" y="50" width="15" height="40" fill="#e74c3c" opacity="0.7"/>
        <rect x="50" y="30" width="15" height="60" fill="#e74c3c" opacity="0.7"/>
        <rect x="70" y="40" width="15" height="50" fill="#e74c3c" opacity="0.7"/>
        <rect x="90" y="60" width="15" height="30" fill="#e74c3c" opacity="0.7"/>
        <rect x="110" y="75" width="15" height="15" fill="#e74c3c" opacity="0.7"/>
        <rect x="130" y="85" width="15" height="5" fill="#e74c3c" opacity="0.7"/>
      </g>
    </g>
    
    <!-- Arrow -->
    <g transform="translate(210, 90)">
      <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
          <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
        </marker>
      </defs>
      <line x1="0" y1="0" x2="40" y2="0" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
      <text x="20" y="-10" font-family="Arial" font-size="11" text-anchor="middle" fill="#666">
        Sample
      </text>
      <text x="20" y="15" font-family="Arial" font-size="11" text-anchor="middle" fill="#666">
        n times
      </text>
    </g>
    
    <!-- Sampling Process -->
    <g transform="translate(260, 30)">
      <rect x="0" y="0" width="200" height="150" rx="8" fill="white" stroke="#f39c12" stroke-width="2"/>
      <text x="100" y="20" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#e67e22">
        Many Samples (size n)
      </text>
      
      <!-- Multiple sample representations -->
      <g transform="translate(20, 35)">
        <rect x="0" y="5" width="160" height="8" rx="2" fill="#f39c12" opacity="0.3"/>
        <text x="165" y="12" font-family="Arial" font-size="10" fill="#666">x̄₁</text>
        
        <rect x="0" y="20" width="160" height="8" rx="2" fill="#f39c12" opacity="0.4"/>
        <text x="165" y="27" font-family="Arial" font-size="10" fill="#666">x̄₂</text>
        
        <rect x="0" y="35" width="160" height="8" rx="2" fill="#f39c12" opacity="0.5"/>
        <text x="165" y="42" font-family="Arial" font-size="10" fill="#666">x̄₃</text>
        
        <text x="80" y="60" font-family="Arial" font-size="20" text-anchor="middle" fill="#e67e22">⋮</text>
        
        <rect x="0" y="75" width="160" height="8" rx="2" fill="#f39c12" opacity="0.6"/>
        <text x="165" y="82" font-family="Arial" font-size="10" fill="#666">x̄ₙ</text>
      </g>
      
      <text x="100" y="140" font-family="Arial" font-size="11" text-anchor="middle" fill="#666">
        Calculate mean of each
      </text>
    </g>
    
    <!-- Arrow -->
    <g transform="translate(470, 90)">
      <line x1="0" y1="0" x2="40" y2="0" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
      <text x="20" y="-10" font-family="Arial" font-size="11" text-anchor="middle" fill="#666">
        Plot
      </text>
      <text x="20" y="15" font-family="Arial" font-size="11" text-anchor="middle" fill="#666">
        means
      </text>
    </g>
    
    <!-- Normal Distribution Result -->
    <g transform="translate(520, 30)">
      <rect x="0" y="0" width="200" height="150" rx="8" fill="white" stroke="#27ae60" stroke-width="2"/>
      <text x="100" y="20" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#229954">
        Sampling Distribution
      </text>
      
      <!-- Normal curve -->
      <g transform="translate(20, 40)">
        <line x1="0" y1="90" x2="160" y2="90" stroke="#333" stroke-width="1"/>
        <line x1="0" y1="90" x2="0" y2="20" stroke="#333" stroke-width="1"/>
        
        <!-- Bell curve path -->
        <path d="M 10 85 Q 30 80, 50 65 T 80 30 T 110 65 Q 130 80, 150 85"
              fill="none" stroke="#27ae60" stroke-width="2"/>
        <path d="M 10 90 L 10 85 Q 30 80, 50 65 T 80 30 T 110 65 Q 130 80, 150 85 L 150 90 Z"
              fill="#27ae60" fill-opacity="0.2"/>
        
        <text x="80" y="105" font-family="Arial" font-size="11" text-anchor="middle" fill="#333">μ</text>
      </g>
      
      <text x="100" y="140" font-family="Arial" font-size="11" text-anchor="middle" fill="#27ae60" font-weight="bold">
        Always Normal!
      </text>
    </g>
  </g>
  
  <!-- CLT Requirements -->
  <g transform="translate(50, 380)">
    <text x="0" y="0" font-family="Arial" font-size="18" font-weight="bold" fill="#34495e">
      CLT Assumptions &amp; Requirements
    </text>
    
    <g transform="translate(0, 25)">
      <!-- Requirement boxes -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="170" height="80" rx="6" fill="#3498db" fill-opacity="0.1" stroke="#3498db" stroke-width="2"/>
        <text x="85" y="25" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle" fill="#2980b9">
          🎲 Random Sampling
        </text>
        <text x="85" y="45" font-family="Arial" font-size="11" text-anchor="middle" fill="#555">
          Data must be
        </text>
        <text x="85" y="60" font-family="Arial" font-size="11" text-anchor="middle" fill="#555">
          randomly sampled
        </text>
      </g>
      
      <g transform="translate(180, 0)">
        <rect x="0" y="0" width="170" height="80" rx="6" fill="#e74c3c" fill-opacity="0.1" stroke="#e74c3c" stroke-width="2"/>
        <text x="85" y="25" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle" fill="#c0392b">
          🔗 Independence
        </text>
        <text x="85" y="45" font-family="Arial" font-size="11" text-anchor="middle" fill="#555">
          Samples independent
        </text>
        <text x="85" y="60" font-family="Arial" font-size="11" text-anchor="middle" fill="#555">
          of each other
        </text>
      </g>
      
      <g transform="translate(360, 0)">
        <rect x="0" y="0" width="170" height="80" rx="6" fill="#27ae60" fill-opacity="0.1" stroke="#27ae60" stroke-width="2"/>
        <text x="85" y="25" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle" fill="#229954">
          📊 Sample Size
        </text>
        <text x="85" y="45" font-family="Arial" font-size="11" text-anchor="middle" fill="#555">
          Generally n ≥ 30
        </text>
        <text x="85" y="60" font-family="Arial" font-size="11" text-anchor="middle" fill="#555">
          (more if skewed)
        </text>
      </g>
      
      <g transform="translate(540, 0)">
        <rect x="0" y="0" width="170" height="80" rx="6" fill="#9b59b6" fill-opacity="0.1" stroke="#9b59b6" stroke-width="2"/>
        <text x="85" y="25" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle" fill="#8e44ad">
          📈 10% Rule
        </text>
        <text x="85" y="45" font-family="Arial" font-size="11" text-anchor="middle" fill="#555">
          Sample ≤ 10% of
        </text>
        <text x="85" y="60" font-family="Arial" font-size="11" text-anchor="middle" fill="#555">
          population (w/o replace)
        </text>
      </g>
    </g>
  </g>
  
  <!-- Formula Breakdown -->
  <g transform="translate(200, 500)">
    <rect x="0" y="0" width="400" height="80" rx="10" fill="#fff5e6" stroke="#f39c12" stroke-width="2"/>
    
    <text x="200" y="25" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#e67e22">
      Sampling Distribution: X̄ ~ N(μ, σ²/n)
    </text>
    
    <text x="50" y="50" font-family="Arial" font-size="12" fill="#555">
      X̄ = sample mean
    </text>
    <text x="50" y="65" font-family="Arial" font-size="12" fill="#555">
      μ = population mean
    </text>
    
    <text x="220" y="50" font-family="Arial" font-size="12" fill="#555">
      σ² = population variance
    </text>
    <text x="220" y="65" font-family="Arial" font-size="12" fill="#555">
      n = sample size
    </text>
  </g>
</svg>