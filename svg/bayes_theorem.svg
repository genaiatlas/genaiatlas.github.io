<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="24" font-weight="bold" fill="#2c3e50">
    Bayes' Theorem
  </text>
  
  <!-- Main Formula Box -->
  <rect x="150" y="60" width="500" height="80" fill="#3498db" fill-opacity="0.1" stroke="#3498db" stroke-width="2" rx="10"/>
  <text x="400" y="90" text-anchor="middle" font-size="20" font-weight="bold" fill="#2c3e50">
    P(A|B) = P(B|A) × P(A) / P(B)
  </text>
  <text x="400" y="115" text-anchor="middle" font-size="14" fill="#7f8c8d">
    Posterior = Likelihood × Prior / Evidence
  </text>
  
  <!-- Visual Representation -->
  <text x="400" y="170" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">
    Visual Breakdown
  </text>
  
  <!-- Prior P(A) -->
  <rect x="50" y="190" width="150" height="100" fill="#e74c3c" fill-opacity="0.3" stroke="#e74c3c" stroke-width="2" rx="5"/>
  <text x="125" y="220" text-anchor="middle" font-size="16" font-weight="bold" fill="#e74c3c">Prior</text>
  <text x="125" y="240" text-anchor="middle" font-size="14" fill="#e74c3c">P(A)</text>
  <text x="125" y="260" text-anchor="middle" font-size="12" fill="#2c3e50">Initial belief</text>
  <text x="125" y="275" text-anchor="middle" font-size="12" fill="#2c3e50">about hypothesis</text>
  
  <!-- Likelihood P(B|A) -->
  <rect x="225" y="190" width="150" height="100" fill="#f39c12" fill-opacity="0.3" stroke="#f39c12" stroke-width="2" rx="5"/>
  <text x="300" y="220" text-anchor="middle" font-size="16" font-weight="bold" fill="#f39c12">Likelihood</text>
  <text x="300" y="240" text-anchor="middle" font-size="14" fill="#f39c12">P(B|A)</text>
  <text x="300" y="260" text-anchor="middle" font-size="12" fill="#2c3e50">Probability of</text>
  <text x="300" y="275" text-anchor="middle" font-size="12" fill="#2c3e50">evidence given hypothesis</text>
  
  <!-- Evidence P(B) -->
  <rect x="400" y="190" width="150" height="100" fill="#9b59b6" fill-opacity="0.3" stroke="#9b59b6" stroke-width="2" rx="5"/>
  <text x="475" y="220" text-anchor="middle" font-size="16" font-weight="bold" fill="#9b59b6">Evidence</text>
  <text x="475" y="240" text-anchor="middle" font-size="14" fill="#9b59b6">P(B)</text>
  <text x="475" y="260" text-anchor="middle" font-size="12" fill="#2c3e50">Total probability</text>
  <text x="475" y="275" text-anchor="middle" font-size="12" fill="#2c3e50">of evidence</text>
  
  <!-- Posterior P(A|B) -->
  <rect x="575" y="190" width="150" height="100" fill="#27ae60" fill-opacity="0.3" stroke="#27ae60" stroke-width="2" rx="5"/>
  <text x="650" y="220" text-anchor="middle" font-size="16" font-weight="bold" fill="#27ae60">Posterior</text>
  <text x="650" y="240" text-anchor="middle" font-size="14" fill="#27ae60">P(A|B)</text>
  <text x="650" y="260" text-anchor="middle" font-size="12" fill="#2c3e50">Updated belief</text>
  <text x="650" y="275" text-anchor="middle" font-size="12" fill="#2c3e50">after evidence</text>
  
  <!-- Arrows -->
  <path d="M 200 240 L 220 240" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 375 240 L 395 240" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 550 240 L 570 240" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/>
    </marker>
  </defs>
  
  <!-- Multiplication and Division symbols -->
  <text x="212" y="245" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50">×</text>
  <text x="387" y="245" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50">÷</text>
  <text x="562" y="245" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50">=</text>
  
  <!-- Example Application -->
  <rect x="50" y="320" width="700" height="250" fill="#ffffff" stroke="#bdc3c7" stroke-width="1" rx="5"/>
  <text x="400" y="345" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">
    Medical Diagnosis Example
  </text>
  
  <!-- Example setup -->
  <text x="70" y="370" font-size="14" font-weight="bold" fill="#2c3e50">Scenario:</text>
  <text x="70" y="390" font-size="12" fill="#2c3e50">• Disease prevalence: 1% of population</text>
  <text x="70" y="405" font-size="12" fill="#2c3e50">• Test accuracy: 95% (both sensitivity and specificity)</text>
  <text x="70" y="420" font-size="12" fill="#2c3e50">• Question: If test is positive, what's probability of having disease?</text>
  
  <!-- Example calculation -->
  <rect x="70" y="440" width="660" height="120" fill="#ecf0f1" stroke="#bdc3c7" rx="5"/>
  <text x="400" y="460" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">
    Calculation:
  </text>
  
  <text x="90" y="480" font-size="12" fill="#e74c3c">Prior P(Disease) = 0.01</text>
  <text x="90" y="495" font-size="12" fill="#f39c12">Likelihood P(+|Disease) = 0.95</text>
  <text x="90" y="510" font-size="12" fill="#9b59b6">Evidence P(+) = P(+|Disease)×P(Disease) + P(+|No Disease)×P(No Disease)</text>
  <text x="90" y="525" font-size="12" fill="#9b59b6">P(+) = 0.95 × 0.01 + 0.05 × 0.99 = 0.0095 + 0.0495 = 0.059</text>
  
  <text x="90" y="545" font-size="12" font-weight="bold" fill="#27ae60">
    Posterior P(Disease|+) = (0.95 × 0.01) / 0.059 ≈ 0.161 or 16.1%
  </text>
  
  <!-- Key insight -->
  <rect x="400" y="375" width="330" height="50" fill="#f1c40f" fill-opacity="0.2" stroke="#f1c40f" stroke-width="1" rx="5"/>
  <text x="565" y="395" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3e50">Key Insight:</text>
  <text x="565" y="410" text-anchor="middle" font-size="11" fill="#2c3e50">Even with 95% accuracy, positive test</text>
  <text x="565" y="420" text-anchor="middle" font-size="11" fill="#2c3e50">only indicates 16% chance of disease!</text>
</svg>