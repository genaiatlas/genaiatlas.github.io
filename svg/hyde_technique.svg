<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="900" fill="#f8f9fa"/>
  <text x="600" y="40" font-family="Arial" font-size="28" font-weight="bold" text-anchor="middle">HyDE: Hypothetical Document Embeddings</text>
  
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" fill="#495057"/></marker></defs>
  
  <rect x="300" y="80" width="600" height="70" rx="10" fill="#fff3bf" stroke="#f59f00" stroke-width="3"/>
  <text x="600" y="108" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">User Question (Short)</text>
  <text x="600" y="130" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">"What causes ocean acidification?"</text>
  
  <line x1="600" y1="150" x2="600" y2="185" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  
  <rect x="250" y="195" width="700" height="70" rx="10" fill="#9333ea" stroke="#7950f2" stroke-width="3"/>
  <text x="600" y="225" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">LLM Hypothesis Generator</text>
  <text x="600" y="245" font-family="Arial" font-size="11" text-anchor="middle" fill="white">Generate hypothetical answer (even if imperfect)</text>
  
  <line x1="600" y1="265" x2="600" y2="300" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  
  <rect x="100" y="310" width="1000" height="180" rx="10" fill="#e9d5ff" stroke="#9333ea" stroke-width="3"/>
  <text x="600" y="340" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Hypothetical Answer (Document-Style)</text>
  <rect x="130" y="355" width="940" height="120" rx="5" fill="#fff" stroke="#9333ea" stroke-width="2"/>
  <text x="150" y="375" font-family="Arial" font-size="10" fill="#495057">"Ocean acidification is primarily caused by the absorption of carbon dioxide (CO₂)</text>
  <text x="150" y="393" font-family="Arial" font-size="10" fill="#495057">from the atmosphere into ocean water. When CO₂ dissolves in seawater, it forms</text>
  <text x="150" y="411" font-family="Arial" font-size="10" fill="#495057">carbonic acid, which lowers the pH of the ocean. The main sources of atmospheric</text>
  <text x="150" y="429" font-family="Arial" font-size="10" fill="#495057">CO₂ include burning fossil fuels, deforestation, and industrial processes. This</text>
  <text x="150" y="447" font-family="Arial" font-size="10" fill="#495057">affects marine ecosystems, particularly organisms with calcium carbonate shells..."</text>
  <text x="600" y="468" font-family="Arial" font-size="9" text-anchor="middle" fill="#7950f2" font-style="italic">Note: Declarative, detailed, document-style text</text>
  
  <line x1="600" y1="490" x2="600" y2="525" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  
  <rect x="250" y="535" width="700" height="60" rx="10" fill="#1971c2" stroke="#1c7ed6" stroke-width="3"/>
  <text x="600" y="570" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Embed Hypothetical Answer (Not Question!)</text>
  
  <line x1="600" y1="595" x2="600" y2="630" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  
  <rect x="200" y="640" width="800" height="120" rx="10" fill="#d3f9d8" stroke="#37b24d" stroke-width="3"/>
  <text x="600" y="670" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Vector Similarity Search</text>
  <text x="600" y="693" font-family="Arial" font-size="11" text-anchor="middle">Find documents similar to hypothetical answer</text>
  <rect x="230" y="705" width="740" height="40" rx="5" fill="#fff" stroke="#37b24d" stroke-width="2"/>
  <text x="250" y="728" font-family="Arial" font-size="10" fill="#495057">Retrieved: Documents about CO₂ absorption, ocean chemistry, marine impacts...</text>
  
  <line x1="600" y1="760" x2="600" y2="795" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  
  <rect x="150" y="805" width="900" height="70" rx="10" fill="#51cf66" stroke="#2f9e44" stroke-width="3"/>
  <text x="600" y="835" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Generate Factual Answer with Retrieved Documents</text>
  <text x="600" y="858" font-family="Arial" font-size="11" text-anchor="middle" fill="white">Use actual retrieved facts to create verified answer</text>
  
  <g id="comparison">
    <rect x="50" y="100" width="200" height="200" rx="8" fill="#ffe3e3" stroke="#f03e3e" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="150" y="125" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#f03e3e">❌ Problem</text>
    <text x="70" y="150" font-family="Arial" font-size="9" fill="#495057">Query-Document</text>
    <text x="70" y="165" font-family="Arial" font-size="9" fill="#495057">Mismatch</text>
    <circle cx="150" cy="195" r="30" fill="#fff" stroke="#f03e3e" stroke-width="2"/>
    <text x="150" y="200" font-family="Arial" font-size="9" text-anchor="middle" fill="#495057">Short</text>
    <text x="150" y="212" font-family="Arial" font-size="9" text-anchor="middle" fill="#495057">Question</text>
    <rect x="70" y="240" width="160" height="45" rx="5" fill="#fff" stroke="#f03e3e" stroke-width="1"/>
    <text x="150" y="260" font-family="Arial" font-size="8" text-anchor="middle" fill="#495057">vs</text>
    <text x="150" y="275" font-family="Arial" font-size="8" text-anchor="middle" fill="#495057">Long declarative docs</text>
    
    <rect x="950" y="100" width="200" height="200" rx="8" fill="#d3f9d8" stroke="#37b24d" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="1050" y="125" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#37b24d">✓ Solution</text>
    <text x="970" y="150" font-family="Arial" font-size="9" fill="#495057">Better Semantic</text>
    <text x="970" y="165" font-family="Arial" font-size="9" fill="#495057">Matching</text>
    <circle cx="1050" cy="195" r="30" fill="#fff" stroke="#37b24d" stroke-width="2"/>
    <text x="1050" y="200" font-family="Arial" font-size="9" text-anchor="middle" fill="#495057">Document</text>
    <text x="1050" y="212" font-family="Arial" font-size="9" text-anchor="middle" fill="#495057">Style</text>
    <rect x="970" y="240" width="160" height="45" rx="5" fill="#fff" stroke="#37b24d" stroke-width="1"/>
    <text x="1050" y="260" font-family="Arial" font-size="8" text-anchor="middle" fill="#495057">matches</text>
    <text x="1050" y="275" font-family="Arial" font-size="8" text-anchor="middle" fill="#495057">Document style</text>
  </g>
</svg>