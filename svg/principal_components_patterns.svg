<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="adventureGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E74C3C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C0392B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#27AE60;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#229954;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="positiveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ECC71;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27AE60;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="negativeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E74C3C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C0392B;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="600" fill="#F8F9FA"/>
  
  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2C3E50">
    Principal Components: Hidden Patterns Discovery
  </text>
  
  <!-- Pattern 1: Adventure Component -->
  <rect x="50" y="80" width="800" height="120" fill="url(#adventureGrad)" rx="10"/>
  <text x="450" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white">
    Pattern 1: Adventure Component [-1, +1, -1, +1]
  </text>
  
  <!-- Pattern 1 Values -->
  <rect x="100" y="130" width="150" height="50" fill="url(#negativeGrad)" rx="5"/>
  <text x="175" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Alpine Spa</text>
  <text x="175" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">-1</text>
  
  <rect x="270" y="130" width="150" height="50" fill="url(#positiveGrad)" rx="5"/>
  <text x="345" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Himalayas</text>
  <text x="345" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">+1</text>
  
  <rect x="440" y="130" width="150" height="50" fill="url(#negativeGrad)" rx="5"/>
  <text x="515" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Hawaii</text>
  <text x="515" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">-1</text>
  
  <rect x="610" y="130" width="150" height="50" fill="url(#positiveGrad)" rx="5"/>
  <text x="685" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Scuba</text>
  <text x="685" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">+1</text>
  
  <!-- Pattern 2: Mountain Component -->
  <rect x="50" y="230" width="800" height="120" fill="url(#mountainGrad)" rx="10"/>
  <text x="450" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white">
    Pattern 2: Mountain Component [+1, +1, -1, -1]
  </text>
  
  <!-- Pattern 2 Values -->
  <rect x="100" y="280" width="150" height="50" fill="url(#positiveGrad)" rx="5"/>
  <text x="175" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Alpine Spa</text>
  <text x="175" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">+1</text>
  
  <rect x="270" y="280" width="150" height="50" fill="url(#positiveGrad)" rx="5"/>
  <text x="345" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Himalayas</text>
  <text x="345" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">+1</text>
  
  <rect x="440" y="280" width="150" height="50" fill="url(#negativeGrad)" rx="5"/>
  <text x="515" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Hawaii</text>
  <text x="515" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">-1</text>
  
  <rect x="610" y="280" width="150" height="50" fill="url(#negativeGrad)" rx="5"/>
  <text x="685" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Scuba</text>
  <text x="685" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">-1</text>
  
  <!-- Mathematical Representation -->
  <rect x="100" y="380" width="700" height="80" fill="#34495E" rx="10"/>
  <text x="450" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">
    Linear Combination Formula
  </text>
  <text x="450" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="white">
    Rating = Mean + a × (Adventure Component) + b × (Mountain Component)
  </text>
  <text x="450" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#BDC3C7">
    Where 'a' and 'b' are person-specific coefficients
  </text>
  
  <!-- Interpretation Box -->
  <rect x="50" y="490" width="360" height="90" fill="#ECF0F1" stroke="#BDC3C7" stroke-width="2" rx="10"/>
  <text x="230" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#2C3E50">
    Pattern 1 Interpretation
  </text>
  <text x="230" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">
    Positive for Himalayas and Scuba
  </text>
  <text x="230" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">
    Represents "Adventure Preference"
  </text>
  <text x="230" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">
    High values = Seeks excitement
  </text>
  
  <rect x="450" y="490" width="360" height="90" fill="#ECF0F1" stroke="#BDC3C7" stroke-width="2" rx="10"/>
  <text x="630" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#2C3E50">
    Pattern 2 Interpretation
  </text>
  <text x="630" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">
    Positive for Alpine Spa and Himalayas
  </text>
  <text x="630" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">
    Represents "Mountain Preference"
  </text>
  <text x="630" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">
    High values = Loves high altitudes
  </text>
</svg>