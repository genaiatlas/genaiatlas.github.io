<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="manufGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="financeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="adGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#43e97b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38f9d7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="healthGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fa709a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fee140;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <rect x="50" y="20" width="800" height="40" fill="url(#titleGrad)" rx="8"/>
  <text x="450" y="45" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold">
    Data Collection Framework: Problem-Dependent Approach
  </text>
  
  <!-- Central Principle -->
  <ellipse cx="450" cy="120" rx="180" ry="40" fill="#fff3cd" stroke="#ffeaa7" stroke-width="2"/>
  <text x="450" y="115" text-anchor="middle" fill="#6c5700" font-family="Arial, sans-serif" font-size="14" font-weight="bold">
    Data Collection Must Align
  </text>
  <text x="450" y="130" text-anchor="middle" fill="#6c5700" font-family="Arial, sans-serif" font-size="14" font-weight="bold">
    With Problem Being Solved
  </text>
  
  <!-- Connecting Lines -->
  <line x1="320" y1="160" x2="200" y2="220" stroke="#636e72" stroke-width="2"/>
  <line x1="380" y1="160" x2="320" y2="220" stroke="#636e72" stroke-width="2"/>
  <line x1="520" y1="160" x2="580" y2="220" stroke="#636e72" stroke-width="2"/>
  <line x1="580" y1="160" x2="700" y2="220" stroke="#636e72" stroke-width="2"/>
  
  <!-- Manufacturing -->
  <rect x="50" y="240" width="250" height="140" fill="url(#manufGrad)" rx="10"/>
  <text x="175" y="265" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">
    MANUFACTURING
  </text>
  <text x="175" y="285" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">
    Question:
  </text>
  <text x="175" y="305" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11">
    Does new process reduce
  </text>
  <text x="175" y="320" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11">
    defective items?
  </text>
  <text x="175" y="340" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">
    Data to Collect:
  </text>
  <text x="175" y="360" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11">
    Defect rates before/after
  </text>
  
  <!-- Finance -->
  <rect x="330" y="240" width="250" height="140" fill="url(#financeGrad)" rx="10"/>
  <text x="455" y="265" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">
    FINANCE
  </text>
  <text x="455" y="285" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">
    Question:
  </text>
  <text x="455" y="305" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11">
    Does new investment
  </text>
  <text x="455" y="320" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11">
    enhance profits?
  </text>
  <text x="455" y="340" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">
    Data to Collect:
  </text>
  <text x="455" y="360" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11">
    Return rates, profit margins
  </text>
  
  <!-- Advertising -->
  <rect x="50" y="410" width="250" height="140" fill="url(#adGrad)" rx="10"/>
  <text x="175" y="435" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">
    ADVERTISING
  </text>
  <text x="175" y="455" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">
    Question:
  </text>
  <text x="175" y="475" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11">
    Does new campaign
  </text>
  <text x="175" y="490" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11">
    increase sales?
  </text>
  <text x="175" y="510" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">
    Data to Collect:
  </text>
  <text x="175" y="530" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11">
    Sales figures, conversions
  </text>
  
  <!-- Healthcare -->
  <rect x="330" y="410" width="250" height="140" fill="url(#healthGrad)" rx="10"/>
  <text x="455" y="435" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">
    HEALTHCARE
  </text>
  <text x="455" y="455" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">
    Question:
  </text>
  <text x="455" y="475" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11">
    Does mammography reduce
  </text>
  <text x="455" y="490" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11">
    breast cancer deaths?
  </text>
  <text x="455" y="510" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">
    Data to Collect:
  </text>
  <text x="455" y="530" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11">
    Mortality rates screened vs. control
  </text>
  
  <!-- Universal Principles Box -->
  <rect x="610" y="240" width="240" height="310" fill="#e8f4fd" stroke="#74b9ff" stroke-width="2" rx="10"/>
  <text x="730" y="265" text-anchor="middle" fill="#2d3436" font-family="Arial, sans-serif" font-size="16" font-weight="bold">
    Universal Principles
  </text>
  
  <text x="730" y="295" text-anchor="middle" fill="#2d3436" font-family="Arial, sans-serif" font-size="13" font-weight="bold">
    1. Clear Problem Definition
  </text>
  <text x="730" y="315" text-anchor="middle" fill="#2d3436" font-family="Arial, sans-serif" font-size="13" font-weight="bold">
    2. Control &amp; Treatment Groups
  </text>
  <text x="730" y="335" text-anchor="middle" fill="#2d3436" font-family="Arial, sans-serif" font-size="13" font-weight="bold">
    3. Randomization
  </text>
  <text x="730" y="355" text-anchor="middle" fill="#2d3436" font-family="Arial, sans-serif" font-size="13" font-weight="bold">
    4. Sufficient Sample Size
  </text>
  <text x="730" y="375" text-anchor="middle" fill="#2d3436" font-family="Arial, sans-serif" font-size="13" font-weight="bold">
    5. Proper Measurement
  </text>
  
  <rect x="620" y="390" width="220" height="150" fill="#fff3cd" stroke="#ffeaa7" stroke-width="1" rx="5"/>
  <text x="730" y="410" text-anchor="middle" fill="#6c5700" font-family="Arial, sans-serif" font-size="12" font-weight="bold">
    Key Insight:
  </text>
  <text x="730" y="430" text-anchor="middle" fill="#6c5700" font-family="Arial, sans-serif" font-size="11">
    Same statistical methods
  </text>
  <text x="730" y="445" text-anchor="middle" fill="#6c5700" font-family="Arial, sans-serif" font-size="11">
    apply across all industries.
  </text>
  <text x="730" y="465" text-anchor="middle" fill="#6c5700" font-family="Arial, sans-serif" font-size="11">
    Only context and metrics
  </text>
  <text x="730" y="480" text-anchor="middle" fill="#6c5700" font-family="Arial, sans-serif" font-size="11">
    change - the fundamental
  </text>
  <text x="730" y="495" text-anchor="middle" fill="#6c5700" font-family="Arial, sans-serif" font-size="11">
    approach remains constant.
  </text>
  <text x="730" y="515" text-anchor="middle" fill="#6c5700" font-family="Arial, sans-serif" font-size="11" font-weight="bold">
    "Does X improve Y enough
  </text>
  <text x="730" y="530" text-anchor="middle" fill="#6c5700" font-family="Arial, sans-serif" font-size="11" font-weight="bold">
    to matter?"
  </text>
</svg>