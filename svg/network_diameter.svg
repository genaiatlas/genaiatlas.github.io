<svg viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="800" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="500" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Network Diameter &amp; Six Degrees of Separation
  </text>
  
  <!-- Subtitle -->
  <text x="500" y="70" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#7f8c8d">
    Maximum shortest path length between any two nodes
  </text>
  
  <!-- Network visualization -->
  <g transform="translate(500, 300)">
    <!-- Center node (starting point) -->
    <circle cx="0" cy="0" r="16" fill="#e74c3c" stroke="white" stroke-width="3"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">S</text>
    <text x="0" y="-28" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#e74c3c" font-weight="bold">Start</text>
    
    <!-- Layer 1 (distance 1) -->
    <g id="layer1">
      <circle cx="-100" cy="0" r="14" fill="#3498db" stroke="white" stroke-width="2"/>
      <text x="-100" y="4" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">1</text>
      <line x1="-16" y1="0" x2="-86" y2="0" stroke="#34495e" stroke-width="2"/>
      
      <circle cx="0" cy="-100" r="14" fill="#3498db" stroke="white" stroke-width="2"/>
      <text x="0" y="-96" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">1</text>
      <line x1="0" y1="-16" x2="0" y2="-86" stroke="#34495e" stroke-width="2"/>
      
      <circle cx="100" cy="0" r="14" fill="#3498db" stroke="white" stroke-width="2"/>
      <text x="100" y="4" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">1</text>
      <line x1="16" y1="0" x2="86" y2="0" stroke="#34495e" stroke-width="2"/>
    </g>
    
    <!-- Layer 2 (distance 2) -->
    <g id="layer2">
      <circle cx="-180" cy="-40" r="13" fill="#9b59b6" stroke="white" stroke-width="2"/>
      <text x="-180" y="-36" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="white">2</text>
      <line x1="-108" y1="-7" x2="-172" y2="-33" stroke="#34495e" stroke-width="2"/>
      
      <circle cx="-70" cy="-120" r="13" fill="#9b59b6" stroke="white" stroke-width="2"/>
      <text x="-70" y="-116" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="white">2</text>
      <line x1="-7" y1="-108" x2="-63" y2="-113" stroke="#34495e" stroke-width="2"/>
      
      <circle cx="70" cy="-120" r="13" fill="#9b59b6" stroke="white" stroke-width="2"/>
      <text x="70" y="-116" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="white">2</text>
      <line x1="7" y1="-108" x2="63" y2="-113" stroke="#34495e" stroke-width="2"/>
      
      <circle cx="180" cy="-40" r="13" fill="#9b59b6" stroke="white" stroke-width="2"/>
      <text x="180" y="-36" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="white">2</text>
      <line x1="108" y1="-7" x2="172" y2="-33" stroke="#34495e" stroke-width="2"/>
    </g>
    
    <!-- Layer 3 (distance 3) - Target node -->
    <g id="layer3">
      <circle cx="-240" cy="-90" r="13" fill="#27ae60" stroke="white" stroke-width="2"/>
      <text x="-240" y="-86" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="white">3</text>
      <line x1="-188" y1="-47" x2="-232" y2="-83" stroke="#34495e" stroke-width="2"/>
      
      <circle cx="240" cy="-90" r="13" fill="#27ae60" stroke="white" stroke-width="2"/>
      <text x="240" y="-86" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="white">3</text>
      <line x1="188" y1="-47" x2="232" y2="-83" stroke="#34495e" stroke-width="2"/>
    </g>
    
    <!-- Shortest path highlight -->
    <path d="M 0,0 L 100,0 L 180,-40 L 240,-90" 
          fill="none" stroke="#f39c12" stroke-width="4" opacity="0.6" 
          stroke-dasharray="10,5"/>
    
    <!-- Endpoint annotation -->
    <circle cx="240" cy="-90" r="18" fill="none" stroke="#f39c12" stroke-width="3"/>
    <text x="240" y="-110" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#f39c12" font-weight="bold">Target</text>
  </g>
  
  <!-- Path length annotation -->
  <g transform="translate(100, 140)">
    <rect x="0" y="0" width="280" height="80" fill="white" stroke="#f39c12" stroke-width="2" rx="5"/>
    <text x="140" y="30" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#f39c12">
      Shortest Path: 3 steps
    </text>
    <text x="140" y="55" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#34495e">
      Diameter = Maximum of all
    </text>
    <text x="140" y="70" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#34495e">
      shortest paths in network
    </text>
  </g>
  
  <!-- Six Degrees Section -->
  <g transform="translate(100, 500)">
    <rect x="0" y="0" width="800" height="260" fill="white" stroke="#2c3e50" stroke-width="2" rx="5"/>
    
    <text x="400" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Six Degrees of Separation
    </text>
    
    <!-- Milgram experiment -->
    <g transform="translate(50, 70)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="15" fill="#34495e" font-weight="bold">
        📊 Milgram's Experiment (1960s):
      </text>
      
      <text x="20" y="30" font-family="Arial, sans-serif" font-size="13" fill="#34495e">
        • Participants passed messages through acquaintances to reach target person
      </text>
      <text x="20" y="55" font-family="Arial, sans-serif" font-size="13" fill="#34495e">
        • Messages that arrived took an average of <tspan font-weight="bold" fill="#e74c3c">6 steps</tspan>
      </text>
      <text x="20" y="80" font-family="Arial, sans-serif" font-size="13" fill="#34495e">
        • Confirmed the "small world" hypothesis empirically
      </text>
    </g>
    
    <!-- Modern examples -->
    <g transform="translate(50, 170)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="15" fill="#34495e" font-weight="bold">
        🌐 Small World in Modern Networks:
      </text>
      
      <text x="20" y="30" font-family="Arial, sans-serif" font-size="13" fill="#3498db">
        • Facebook: Average distance ≈ 4-5 hops between any two users
      </text>
      <text x="20" y="55" font-family="Arial, sans-serif" font-size="13" fill="#3498db">
        • World Wide Web: Typically &lt;20 clicks between any two pages
      </text>
      <text x="20" y="80" font-family="Arial, sans-serif" font-size="13" fill="#3498db">
        • Enables rapid information and gossip spread in social networks
      </text>
    </g>
  </g>
  
  <!-- Formula -->
  <g transform="translate(450, 130)">
    <rect x="0" y="0" width="430" height="90" fill="#ecf0f1" stroke="#34495e" stroke-width="2" rx="5"/>
    <text x="215" y="30" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Diameter Formula
    </text>
    <text x="215" y="55" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      D = max(d(i,j)) for all pairs (i,j)
    </text>
    <text x="215" y="77" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d">
      d(i,j) = shortest path length between i and j
    </text>
  </g>
</svg>