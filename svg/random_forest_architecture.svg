<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="bootstrap" patternUnits="userSpaceOnUse" width="4" height="4">
      <rect width="4" height="4" fill="#f0f8ff"/>
      <circle cx="2" cy="2" r="0.5" fill="#4169e1"/>
    </pattern>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">Random Forest Architecture</text>
  
  <!-- Original Dataset -->
  <rect x="350" y="60" width="100" height="60" fill="#3498db" stroke="#2980b9" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Training</text>
  <text x="400" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Dataset</text>
  <text x="400" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">(n samples, p features)</text>
  
  <!-- Bootstrap Arrow -->
  <path d="M 400 130 L 400 150" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="420" y="145" font-family="Arial, sans-serif" font-size="11" fill="#34495e">Bootstrap Sampling</text>
  
  <!-- Bootstrap Datasets -->
  <g id="bootstrap-datasets">
    <rect x="100" y="170" width="80" height="50" fill="url(#bootstrap)" stroke="#27ae60" stroke-width="2"/>
    <text x="140" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#27ae60">Dataset 1</text>
    <text x="140" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#27ae60">Sample 1</text>
    
    <rect x="250" y="170" width="80" height="50" fill="url(#bootstrap)" stroke="#27ae60" stroke-width="2"/>
    <text x="290" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#27ae60">Dataset 2</text>
    <text x="290" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#27ae60">Sample 2</text>
    
    <rect x="470" y="170" width="80" height="50" fill="url(#bootstrap)" stroke="#27ae60" stroke-width="2"/>
    <text x="510" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#27ae60">Dataset B</text>
    <text x="510" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#27ae60">Sample B</text>
    
    <text x="400" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#34495e">...</text>
  </g>
  
  <!-- Feature Sampling -->
  <g id="feature-sampling">
    <rect x="80" y="240" width="120" height="40" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
    <text x="140" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Feature Sample 1</text>
    <text x="140" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">{f₁, f₃, f₇, f₁₂}</text>
    
    <rect x="240" y="240" width="120" height="40" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
    <text x="300" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Feature Sample 2</text>
    <text x="300" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">{f₂, f₅, f₉, f₁₁}</text>
    
    <rect x="450" y="240" width="120" height="40" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
    <text x="510" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Feature Sample B</text>
    <text x="510" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">{f₄, f₆, f₈, f₁₀}</text>
  </g>
  
  <!-- Arrows from bootstrap to feature sampling -->
  <path d="M 140 220 L 140 240" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 290 220 L 300 240" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 510 220 L 510 240" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Decision Trees -->
  <g id="decision-trees">
    <!-- Tree 1 -->
    <g transform="translate(100,300)">
      <circle cx="20" cy="20" r="12" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
      <text x="20" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">T₁</text>
      <line x1="10" y1="30" x2="30" y2="30" stroke="#8e44ad" stroke-width="2"/>
      <circle cx="5" cy="45" r="8" fill="#e74c3c" stroke="#c0392b" stroke-width="1"/>
      <circle cx="35" cy="45" r="8" fill="#27ae60" stroke="#229954" stroke-width="1"/>
    </g>
    
    <!-- Tree 2 -->
    <g transform="translate(260,300)">
      <circle cx="20" cy="20" r="12" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
      <text x="20" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">T₂</text>
      <line x1="10" y1="30" x2="30" y2="30" stroke="#8e44ad" stroke-width="2"/>
      <circle cx="5" cy="45" r="8" fill="#27ae60" stroke="#229954" stroke-width="1"/>
      <circle cx="35" cy="45" r="8" fill="#e74c3c" stroke="#c0392b" stroke-width="1"/>
    </g>
    
    <!-- Tree B -->
    <g transform="translate(470,300)">
      <circle cx="20" cy="20" r="12" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
      <text x="20" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Tᵦ</text>
      <line x1="10" y1="30" x2="30" y2="30" stroke="#8e44ad" stroke-width="2"/>
      <circle cx="5" cy="45" r="8" fill="#e74c3c" stroke="#c0392b" stroke-width="1"/>
      <circle cx="35" cy="45" r="8" fill="#27ae60" stroke="#229954" stroke-width="1"/>
    </g>
  </g>
  
  <!-- Arrows from feature sampling to trees -->
  <path d="M 140 280 L 120 300" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 300 280 L 280 300" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 510 280 L 490 300" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Voting/Aggregation -->
  <rect x="300" y="400" width="200" height="60" fill="#e67e22" stroke="#d35400" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Voting/Aggregation</text>
  <text x="400" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">Classification: Majority Vote</text>
  <text x="400" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">Regression: Average</text>
  
  <!-- Arrows from trees to voting -->
  <path d="M 120 360 L 350 400" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 280 360 L 380 400" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 490 360 L 450 400" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Final Prediction -->
  <rect x="350" y="490" width="100" height="50" fill="#1abc9c" stroke="#16a085" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Final</text>
  <text x="400" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Prediction</text>
  
  <!-- Arrow from voting to final prediction -->
  <path d="M 400 460 L 400 490" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Key Features Box -->
  <rect x="580" y="170" width="200" height="200" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2"/>
  <text x="680" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Key Features</text>
  
  <text x="590" y="210" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#e74c3c">• Bootstrap Sampling</text>
  <text x="600" y="225" font-family="Arial, sans-serif" font-size="10" fill="#34495e">Sample with replacement</text>
  
  <text x="590" y="245" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#f39c12">• Feature Sampling</text>
  <text x="600" y="260" font-family="Arial, sans-serif" font-size="10" fill="#34495e">Random subset at each split</text>
  
  <text x="590" y="280" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#9b59b6">• Diverse Trees</text>
  <text x="600" y="295" font-family="Arial, sans-serif" font-size="10" fill="#34495e">Reduced correlation</text>
  
  <text x="590" y="315" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#e67e22">• Ensemble Voting</text>
  <text x="600" y="330" font-family="Arial, sans-serif" font-size="10" fill="#34495e">Majority rule/averaging</text>
  
  <text x="590" y="350" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1abc9c">• Better Generalization</text>
  <text x="600" y="365" font-family="Arial, sans-serif" font-size="10" fill="#34495e">Reduced overfitting</text>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e"/>
    </marker>
  </defs>
</svg>