<svg viewBox="0 0 1000 550" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="550" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="500" y="30" font-size="22" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Preferential Attachment Model: Sequential Network Growth
  </text>
  <text x="500" y="55" font-size="14" text-anchor="middle" fill="#7f8c8d">
    "Rich get richer" - New nodes preferentially connect to high-degree nodes
  </text>
  
  <!-- Time Step 1 -->
  <g id="time1">
    <text x="150" y="95" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      t = 1 (Initial)
    </text>
    
    <!-- Initial nodes -->
    <circle cx="120" cy="140" r="15" fill="#3498db" stroke="#2c3e50" stroke-width="2"/>
    <text x="120" y="145" font-size="11" font-weight="bold" text-anchor="middle" fill="white">A</text>
    <text x="120" y="175" font-size="9" text-anchor="middle" fill="#7f8c8d">k=1</text>
    
    <circle cx="180" cy="140" r="15" fill="#3498db" stroke="#2c3e50" stroke-width="2"/>
    <text x="180" y="145" font-size="11" font-weight="bold" text-anchor="middle" fill="white">B</text>
    <text x="180" y="175" font-size="9" text-anchor="middle" fill="#7f8c8d">k=1</text>
    
    <!-- Edge -->
    <line x1="135" y1="140" x2="165" y2="140" stroke="#2c3e50" stroke-width="2"/>
  </g>
  
  <!-- Arrow -->
  <path d="M 210,140 L 240,140" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead4)"/>
  
  <!-- Time Step 2 -->
  <g id="time2">
    <text x="350" y="95" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      t = 2
    </text>
    
    <!-- Existing nodes -->
    <circle cx="320" cy="140" r="15" fill="#3498db" stroke="#2c3e50" stroke-width="2"/>
    <text x="320" y="145" font-size="11" font-weight="bold" text-anchor="middle" fill="white">A</text>
    <text x="320" y="175" font-size="9" text-anchor="middle" fill="#7f8c8d">k=2</text>
    
    <circle cx="380" cy="140" r="15" fill="#3498db" stroke="#2c3e50" stroke-width="2"/>
    <text x="380" y="145" font-size="11" font-weight="bold" text-anchor="middle" fill="white">B</text>
    <text x="380" y="175" font-size="9" text-anchor="middle" fill="#7f8c8d">k=1</text>
    
    <!-- New node -->
    <circle cx="350" cy="190" r="15" fill="#27ae60" stroke="#2c3e50" stroke-width="2"/>
    <text x="350" y="195" font-size="11" font-weight="bold" text-anchor="middle" fill="white">C</text>
    <text x="350" y="225" font-size="9" text-anchor="middle" fill="#27ae60">New</text>
    
    <!-- Edges -->
    <line x1="335" y1="140" x2="365" y2="140" stroke="#2c3e50" stroke-width="2"/>
    <line x1="330" y1="153" x2="343" y2="178" stroke="#e74c3c" stroke-width="2.5"/>
    
    <!-- Probability annotation -->
    <text x="310" y="167" font-size="9" fill="#e74c3c" font-weight="bold">P ∝ k_A</text>
  </g>
  
  <!-- Arrow -->
  <path d="M 410,140 L 440,140" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead4)"/>
  
  <!-- Time Step 3 -->
  <g id="time3">
    <text x="580" y="95" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      t = 3
    </text>
    
    <!-- Nodes -->
    <circle cx="540" cy="120" r="18" fill="#9b59b6" stroke="#2c3e50" stroke-width="2"/>
    <text x="540" y="126" font-size="11" font-weight="bold" text-anchor="middle" fill="white">A</text>
    <text x="540" y="105" font-size="9" text-anchor="middle" fill="#9b59b6" font-weight="bold">Hub: k=3</text>
    
    <circle cx="620" cy="120" r="15" fill="#3498db" stroke="#2c3e50" stroke-width="2"/>
    <text x="620" y="125" font-size="11" font-weight="bold" text-anchor="middle" fill="white">B</text>
    <text x="620" y="105" font-size="9" text-anchor="middle" fill="#7f8c8d">k=1</text>
    
    <circle cx="540" cy="180" r="15" fill="#3498db" stroke="#2c3e50" stroke-width="2"/>
    <text x="540" y="185" font-size="11" font-weight="bold" text-anchor="middle" fill="white">C</text>
    <text x="540" y="205" font-size="9" text-anchor="middle" fill="#7f8c8d">k=1</text>
    
    <!-- New node -->
    <circle cx="620" cy="180" r="15" fill="#27ae60" stroke="#2c3e50" stroke-width="2"/>
    <text x="620" y="185" font-size="11" font-weight="bold" text-anchor="middle" fill="white">D</text>
    <text x="620" y="205" font-size="9" text-anchor="middle" fill="#27ae60">New</text>
    
    <!-- Edges -->
    <line x1="558" y1="120" x2="602" y2="120" stroke="#2c3e50" stroke-width="2"/>
    <line x1="545" y1="135" x2="545" y2="165" stroke="#2c3e50" stroke-width="2"/>
    <line x1="555" y1="130" x2="610" y2="170" stroke="#e74c3c" stroke-width="2.5"/>
    
    <!-- Hub indicator -->
    <circle cx="540" cy="120" r="28" fill="none" stroke="#f39c12" stroke-width="2" stroke-dasharray="4,2"/>
  </g>
  
  <!-- Arrow -->
  <path d="M 660,140 L 690,140" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead4)"/>
  
  <!-- Mature Network -->
  <g id="mature">
    <text x="850" y="95" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      t = n (Mature Network)
    </text>
    
    <!-- Hub node (large) -->
    <circle cx="850" cy="150" r="28" fill="#9b59b6" stroke="#2c3e50" stroke-width="2.5"/>
    <text x="850" y="157" font-size="13" font-weight="bold" text-anchor="middle" fill="white">A</text>
    <text x="850" y="120" font-size="10" text-anchor="middle" fill="#9b59b6" font-weight="bold">
      Major Hub
    </text>
    
    <!-- Secondary nodes -->
    <circle cx="780" cy="130" r="16" fill="#3498db" stroke="#2c3e50" stroke-width="2"/>
    <text x="780" y="135" font-size="10" font-weight="bold" text-anchor="middle" fill="white">B</text>
    
    <circle cx="920" cy="130" r="16" fill="#3498db" stroke="#2c3e50" stroke-width="2"/>
    <text x="920" y="135" font-size="10" font-weight="bold" text-anchor="middle" fill="white">C</text>
    
    <circle cx="790" cy="190" r="13" fill="#3498db" stroke="#2c3e50" stroke-width="1.5"/>
    <text x="790" y="195" font-size="9" font-weight="bold" text-anchor="middle" fill="white">D</text>
    
    <circle cx="910" cy="190" r="13" fill="#3498db" stroke="#2c3e50" stroke-width="1.5"/>
    <text x="910" y="195" font-size="9" font-weight="bold" text-anchor="middle" fill="white">E</text>
    
    <!-- Peripheral nodes -->
    <circle cx="750" cy="160" r="10" fill="#95a5a6" stroke="#2c3e50" stroke-width="1"/>
    <circle cx="950" cy="160" r="10" fill="#95a5a6" stroke="#2c3e50" stroke-width="1"/>
    <circle cx="820" cy="210" r="10" fill="#95a5a6" stroke="#2c3e50" stroke-width="1"/>
    <circle cx="880" cy="210" r="10" fill="#95a5a6" stroke="#2c3e50" stroke-width="1"/>
    
    <!-- Edges to hub -->
    <line x1="796" y1="133" x2="822" y2="145" stroke="#2c3e50" stroke-width="2"/>
    <line x1="904" y1="133" x2="878" y2="145" stroke="#2c3e50" stroke-width="2"/>
    <line x1="798" y1="185" x2="830" y2="167" stroke="#2c3e50" stroke-width="2"/>
    <line x1="902" y1="185" x2="870" y2="167" stroke="#2c3e50" stroke-width="2"/>
    <line x1="758" y1="160" x2="822" y2="157" stroke="#2c3e50" stroke-width="1.5"/>
    <line x1="942" y1="160" x2="878" y2="157" stroke="#2c3e50" stroke-width="1.5"/>
    <line x1="825" y1="207" x2="838" y2="175" stroke="#2c3e50" stroke-width="1.5"/>
    <line x1="875" y1="207" x2="862" y2="175" stroke="#2c3e50" stroke-width="1.5"/>
    
    <!-- Power-law degree distribution indicator -->
    <text x="850" y="235" font-size="10" text-anchor="middle" fill="#e74c3c" font-weight="bold">
      Power-law distribution P(k) ∝ k^(-γ)
    </text>
  </g>
  
  <!-- Formula Box -->
  <g id="formula">
    <rect x="50" y="260" width="900" height="80" fill="white" stroke="#34495e" stroke-width="2" rx="8"/>
    
    <text x="500" y="285" font-size="15" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Preferential Attachment Mechanism
    </text>
    
    <text x="500" y="310" font-size="13" text-anchor="middle" fill="#2c3e50">
      P(new node connects to node i) ∝ k_i + α
    </text>
    
    <text x="500" y="330" font-size="11" text-anchor="middle" fill="#7f8c8d">
      Where k_i = current degree of node i, and α = attractiveness parameter (ensures all nodes can be selected)
    </text>
  </g>
  
  <!-- Key Properties -->
  <g id="properties">
    <rect x="50" y="360" width="430" height="170" fill="#ecf0f1" stroke="#95a5a6" stroke-width="1.5" rx="8"/>
    
    <text x="265" y="385" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      🔑 Key Properties
    </text>
    
    <circle cx="70" cy="410" r="4" fill="#27ae60"/>
    <text x="85" y="414" font-size="12" fill="#2c3e50">
      <tspan font-weight="bold">Power-Law Distribution:</tspan> P(k) ∝ k^(-γ) with γ ≥ 2
    </text>
    
    <circle cx="70" cy="435" r="4" fill="#27ae60"/>
    <text x="85" y="439" font-size="12" fill="#2c3e50">
      <tspan font-weight="bold">Hub Formation:</tspan> Early nodes accumulate many connections
    </text>
    
    <circle cx="70" cy="460" r="4" fill="#27ae60"/>
    <text x="85" y="464" font-size="12" fill="#2c3e50">
      <tspan font-weight="bold">Small Diameter:</tspan> Scales as log(log(n))
    </text>
    
    <circle cx="70" cy="485" r="4" fill="#e74c3c"/>
    <text x="85" y="489" font-size="12" fill="#2c3e50">
      <tspan font-weight="bold">Low Clustering:</tspan> Similar to configuration model
    </text>
    
    <circle cx="70" cy="510" r="4" fill="#e74c3c"/>
    <text x="85" y="514" font-size="12" fill="#2c3e50">
      <tspan font-weight="bold">Age Bias:</tspan> Older nodes tend to have higher degree
    </text>
  </g>
  
  <!-- Real-World Examples -->
  <g id="examples">
    <rect x="510" y="360" width="440" height="170" fill="#ecf0f1" stroke="#95a5a6" stroke-width="1.5" rx="8"/>
    
    <text x="730" y="385" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      🌐 Real-World Applications
    </text>
    
    <text x="530" y="410" font-size="12" fill="#2c3e50">
      <tspan font-weight="bold">• Citation Networks:</tspan> Highly-cited papers attract more citations
    </text>
    
    <text x="530" y="433" font-size="12" fill="#2c3e50">
      <tspan font-weight="bold">• World Wide Web:</tspan> Popular websites gain more incoming links
    </text>
    
    <text x="530" y="456" font-size="12" fill="#2c3e50">
      <tspan font-weight="bold">• Social Networks:</tspan> Users with many followers attract new followers
    </text>
    
    <text x="530" y="479" font-size="12" fill="#2c3e50">
      <tspan font-weight="bold">• Internet Infrastructure:</tspan> High-degree routers attract more connections
    </text>
    
    <text x="530" y="502" font-size="12" fill="#2c3e50">
      <tspan font-weight="bold">• Metabolic Networks:</tspan> Essential metabolites participate in many reactions
    </text>
    
    <text x="730" y="520" font-size="10" text-anchor="middle" fill="#7f8c8d" font-style="italic">
      The "rich get richer" principle appears across diverse domains
    </text>
  </g>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead4" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#34495e"/>
    </marker>
  </defs>
</svg>