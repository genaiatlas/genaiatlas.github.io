<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <rect width="1000" height="700" fill="#f8f9fa"/>
  <text x="500" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Retrieval Evaluation Metrics
  </text>
  
  <!-- Metric 1: Precision@K -->
  <rect x="50" y="60" width="450" height="140" rx="8" fill="white" stroke="#e74c3c" stroke-width="3"/>
  <rect x="50" y="60" width="450" height="40" rx="8" fill="#e74c3c"/>
  <text x="275" y="87" font-size="15" font-weight="bold" text-anchor="middle" fill="white">Precision@K</text>
  
  <g transform="translate(70, 115)">
    <text x="0" y="0" font-size="12" font-weight="bold" fill="#1a1a1a">Formula:</text>
    <text x="0" y="18" font-size="11" fill="#666">Precision@K = (# relevant docs in top K) / K</text>
    
    <text x="0" y="45" font-size="11" font-weight="bold" fill="#1a1a1a">Example:</text>
    <text x="0" y="60" font-size="10" fill="#666">Top 5 results: [Relevant, Relevant, Irrelevant, Relevant, Irrelevant]</text>
    <text x="0" y="75" font-size="10" fill="#27ae60" font-weight="bold">Precision@5 = 3/5 = 0.60 (60%)</text>
    <text x="240" y="60" font-size="9" fill="#555">+ Measures accuracy</text>
    <text x="240" y="75" font-size="9" fill="#555">+ Easy to interpret</text>
  </g>
  
  <!-- Metric 2: Recall@K -->
  <rect x="530" y="60" width="450" height="140" rx="8" fill="white" stroke="#3498db" stroke-width="3"/>
  <rect x="530" y="60" width="450" height="40" rx="8" fill="#3498db"/>
  <text x="755" y="87" font-size="15" font-weight="bold" text-anchor="middle" fill="white">Recall@K</text>
  
  <g transform="translate(550, 115)">
    <text x="0" y="0" font-size="12" font-weight="bold" fill="#1a1a1a">Formula:</text>
    <text x="0" y="18" font-size="11" fill="#666">Recall@K = (# relevant docs in top K) / (total # relevant docs)</text>
    
    <text x="0" y="45" font-size="11" font-weight="bold" fill="#1a1a1a">Example:</text>
    <text x="0" y="60" font-size="10" fill="#666">Found 3 relevant in top 5, but 10 total relevant docs exist</text>
    <text x="0" y="75" font-size="10" fill="#27ae60" font-weight="bold">Recall@5 = 3/10 = 0.30 (30%)</text>
    <text x="240" y="60" font-size="9" fill="#555">+ Measures coverage</text>
    <text x="240" y="75" font-size="9" fill="#555">+ Finds missed docs</text>
  </g>
  
  <!-- Metric 3: MRR -->
  <rect x="50" y="220" width="450" height="140" rx="8" fill="white" stroke="#f39c12" stroke-width="3"/>
  <rect x="50" y="220" width="450" height="40" rx="8" fill="#f39c12"/>
  <text x="275" y="247" font-size="15" font-weight="bold" text-anchor="middle" fill="white">Mean Reciprocal Rank (MRR)</text>
  
  <g transform="translate(70, 275)">
    <text x="0" y="0" font-size="12" font-weight="bold" fill="#1a1a1a">Formula:</text>
    <text x="0" y="18" font-size="11" fill="#666">MRR = (1/N) * sum(1 / rank of first relevant doc)</text>
    
    <text x="0" y="45" font-size="11" font-weight="bold" fill="#1a1a1a">Example:</text>
    <text x="0" y="60" font-size="10" fill="#666">Query 1: First relevant at rank 2 = 1/2 = 0.50</text>
    <text x="0" y="73" font-size="10" fill="#666">Query 2: First relevant at rank 1 = 1/1 = 1.00</text>
    <text x="0" y="86" font-size="10" fill="#666">Query 3: First relevant at rank 4 = 1/4 = 0.25</text>
    <text x="0" y="103" font-size="10" fill="#27ae60" font-weight="bold">MRR = (0.50 + 1.00 + 0.25) / 3 = 0.58</text>
  </g>
  
  <!-- Metric 4: NDCG -->
  <rect x="530" y="220" width="450" height="140" rx="8" fill="white" stroke="#9b59b6" stroke-width="3"/>
  <rect x="530" y="220" width="450" height="40" rx="8" fill="#9b59b6"/>
  <text x="755" y="247" font-size="15" font-weight="bold" text-anchor="middle" fill="white">NDCG@K</text>
  
  <g transform="translate(550, 275)">
    <text x="0" y="0" font-size="12" font-weight="bold" fill="#1a1a1a">Formula:</text>
    <text x="0" y="18" font-size="11" fill="#666">NDCG@K = DCG@K / IDCG@K</text>
    <text x="0" y="33" font-size="10" fill="#666">DCG@K = sum(relevance_i / log2(position_i + 1))</text>
    
    <text x="0" y="55" font-size="11" font-weight="bold" fill="#1a1a1a">Example:</text>
    <text x="0" y="70" font-size="10" fill="#666">Ranks [1,2,3]: relevance [3,2,1] (3=most relevant)</text>
    <text x="0" y="83" font-size="10" fill="#666">DCG = 3/log2(2) + 2/log2(3) + 1/log2(4) = 4.51</text>
    <text x="0" y="96" font-size="10" fill="#666">IDCG (perfect order) = 3 + 2 + 1 = 4.77</text>
    <text x="0" y="111" font-size="10" fill="#27ae60" font-weight="bold">NDCG@3 = 4.51 / 4.77 = 0.95</text>
  </g>
  
  <!-- Comparison Table -->
  <rect x="50" y="380" width="900" height="290" rx="8" fill="white" stroke="#ddd" stroke-width="2"/>
  <text x="500" y="410" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Metric Comparison and Use Cases
  </text>
  
  <!-- Table Header -->
  <rect x="70" y="425" width="860" height="35" fill="#34495e"/>
  <text x="180" y="448" font-size="11" font-weight="bold" fill="white">Metric</text>
  <text x="330" y="448" font-size="11" font-weight="bold" fill="white">Range</text>
  <text x="470" y="448" font-size="11" font-weight="bold" fill="white">Best For</text>
  <text x="710" y="448" font-size="11" font-weight="bold" fill="white">Considerations</text>
  
  <!-- Row 1 -->
  <rect x="70" y="460" width="860" height="50" fill="#f8f9fa" stroke="#ddd"/>
  <text x="80" y="485" font-size="10" font-weight="bold" fill="#1a1a1a">Precision@K</text>
  <text x="310" y="485" font-size="10" fill="#666">0.0 - 1.0</text>
  <text x="400" y="480" font-size="9" fill="#555">Quality-focused systems</text>
  <text x="400" y="493" font-size="9" fill="#555">Small result sets</text>
  <text x="650" y="480" font-size="9" fill="#555">Does not consider all relevant docs</text>
  <text x="650" y="493" font-size="9" fill="#555">Good for user-facing systems</text>
  
  <!-- Row 2 -->
  <rect x="70" y="510" width="860" height="50" fill="white" stroke="#ddd"/>
  <text x="80" y="535" font-size="10" font-weight="bold" fill="#1a1a1a">Recall@K</text>
  <text x="310" y="535" font-size="10" fill="#666">0.0 - 1.0</text>
  <text x="400" y="530" font-size="9" fill="#555">Coverage-focused systems</text>
  <text x="400" y="543" font-size="9" fill="#555">Research applications</text>
  <text x="650" y="530" font-size="9" fill="#555">Requires knowing all relevant docs</text>
  <text x="650" y="543" font-size="9" fill="#555">Important for critical searches</text>
  
  <!-- Row 3 -->
  <rect x="70" y="560" width="860" height="50" fill="#f8f9fa" stroke="#ddd"/>
  <text x="80" y="585" font-size="10" font-weight="bold" fill="#1a1a1a">MRR</text>
  <text x="310" y="585" font-size="10" fill="#666">0.0 - 1.0</text>
  <text x="400" y="580" font-size="9" fill="#555">QA systems</text>
  <text x="400" y="593" font-size="9" fill="#555">Single answer needed</text>
  <text x="650" y="580" font-size="9" fill="#555">Only cares about first result</text>
  <text x="650" y="593" font-size="9" fill="#555">Good for known-item search</text>
  
  <!-- Row 4 -->
  <rect x="70" y="610" width="860" height="50" fill="white" stroke="#ddd"/>
  <text x="80" y="635" font-size="10" font-weight="bold" fill="#1a1a1a">NDCG@K</text>
  <text x="310" y="635" font-size="10" fill="#666">0.0 - 1.0</text>
  <text x="400" y="630" font-size="9" fill="#555">Graded relevance</text>
  <text x="400" y="643" font-size="9" fill="#555">Ranking quality</text>
  <text x="650" y="630" font-size="9" fill="#555">Most comprehensive metric</text>
  <text x="650" y="643" font-size="9" fill="#555">Industry standard for IR</text>
</svg>