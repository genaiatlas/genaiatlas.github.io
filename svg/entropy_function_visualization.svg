<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="curveGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4ECDC4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#45B7D1;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#00000030"/>
    </filter>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">
    Entropy Function: H(p) = -p log₂(p) - (1-p) log₂(1-p)
  </text>
  
  <!-- Chart Background -->
  <rect x="100" y="70" width="600" height="400" fill="#f8f9fa" stroke="#ddd" stroke-width="1" filter="url(#shadow)"/>
  
  <!-- Grid Lines -->
  <defs>
    <pattern id="grid" width="60" height="40" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 40" fill="none" stroke="#e0e0e0" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect x="100" y="70" width="600" height="400" fill="url(#grid)"/>
  
  <!-- Axes -->
  <line x1="100" y1="470" x2="700" y2="470" stroke="#333" stroke-width="2"/>
  <line x1="100" y1="470" x2="100" y2="70" stroke="#333" stroke-width="2"/>
  
  <!-- X-axis labels -->
  <text x="100" y="490" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666">0.0</text>
  <text x="220" y="490" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666">0.2</text>
  <text x="340" y="490" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666">0.4</text>
  <text x="460" y="490" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666">0.6</text>
  <text x="580" y="490" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666">0.8</text>
  <text x="700" y="490" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666">1.0</text>
  
  <!-- Y-axis labels -->
  <text x="85" y="475" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#666">0.0</text>
  <text x="85" y="395" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#666">0.2</text>
  <text x="85" y="315" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#666">0.4</text>
  <text x="85" y="235" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#666">0.6</text>
  <text x="85" y="155" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#666">0.8</text>
  <text x="85" y="75" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#666">1.0</text>
  
  <!-- Axis Labels -->
  <text x="400" y="520" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">
    Probability (p)
  </text>
  <text x="40" y="275" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333" transform="rotate(-90 40 275)">
    Entropy H(p)
  </text>
  
  <!-- Entropy Curve -->
  <path d="M 100 470 
           Q 150 420 200 350
           Q 250 280 300 230
           Q 350 180 400 150
           Q 450 180 500 230
           Q 550 280 600 350
           Q 650 420 700 470" 
        fill="none" stroke="url(#curveGradient)" stroke-width="4"/>
  
  <!-- Key Points -->
  <!-- p = 0 -->
  <circle cx="100" cy="470" r="6" fill="#FF6B6B" stroke="white" stroke-width="2"/>
  <text x="100" y="500" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#FF6B6B" font-weight="bold">
    p = 0
  </text>
  <text x="100" y="512" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#FF6B6B">
    H = 0
  </text>
  
  <!-- p = 0.5 (Maximum) -->
  <circle cx="400" cy="150" r="8" fill="#4ECDC4" stroke="white" stroke-width="3"/>
  <text x="400" y="130" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#4ECDC4" font-weight="bold">
    Maximum Entropy
  </text>
  <text x="400" y="145" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#4ECDC4">
    p = 0.5, H = 1.0
  </text>
  
  <!-- p = 1 -->
  <circle cx="700" cy="470" r="6" fill="#45B7D1" stroke="white" stroke-width="2"/>
  <text x="700" y="500" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#45B7D1" font-weight="bold">
    p = 1
  </text>
  <text x="700" y="512" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#45B7D1">
    H = 0
  </text>
  
  <!-- Uncertainty Indicators -->
  <rect x="50" y="530" width="700" height="60" fill="#f0f8ff" stroke="#b0d4f1" stroke-width="1" rx="8"/>
  
  <text x="400" y="550" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c5282">
    Entropy Interpretation
  </text>
  
  <!-- Left side - Low Entropy -->
  <rect x="80" y="560" width="15" height="15" fill="#FF6B6B"/>
  <text x="105" y="572" font-family="Arial, sans-serif" font-size="11" fill="#333">
    <tspan font-weight="bold">Low Entropy (H ≈ 0):</tspan> High certainty, pure classes
  </text>
  
  <!-- Center - High Entropy -->
  <rect x="320" y="560" width="15" height="15" fill="#4ECDC4"/>
  <text x="345" y="572" font-family="Arial, sans-serif" font-size="11" fill="#333">
    <tspan font-weight="bold">High Entropy (H = 1):</tspan> Maximum uncertainty, 50-50 split
  </text>
  
  <!-- Right side - Low Entropy -->
  <rect x="620" y="560" width="15" height="15" fill="#45B7D1"/>
  <text x="645" y="572" font-family="Arial, sans-serif" font-size="11" fill="#333">
    <tspan font-weight="bold">Low Entropy (H ≈ 0):</tspan> High certainty, pure classes
  </text>
  
  <!-- Formula breakdown -->
  <text x="80" y="585" font-family="Arial, sans-serif" font-size="10" fill="#555">
    When p = 0 or p = 1: All samples same class → Perfect prediction → H = 0
  </text>
  <text x="480" y="585" font-family="Arial, sans-serif" font-size="10" fill="#555">
    When p = 0.5: Equal class distribution → Maximum uncertainty → H = 1
  </text>
</svg>