<svg viewBox="0 0 750 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #2c3e50; }
      .step-title { font-family: Arial, sans-serif; font-size: 12px; font-weight: bold; fill: white; }
      .step-desc { font-family: Arial, sans-serif; font-size: 9px; fill: white; }
      .section-title { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #2c3e50; }
      .arrow { stroke: #34495e; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#34495e"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="375" y="25" text-anchor="middle" class="title">Data Understanding Process</text>
  
  <!-- Data Sources Section -->
  <text x="70" y="55" class="section-title">Data Sources</text>
  
  <!-- Internal Data -->
  <rect x="50" y="65" width="100" height="50" rx="6" fill="#3498db"/>
  <text x="100" y="82" text-anchor="middle" class="step-title">Internal Data</text>
  <text x="100" y="95" text-anchor="middle" class="step-desc">Databases</text>
  <text x="100" y="105" text-anchor="middle" class="step-desc">CRM Systems</text>
  
  <!-- External Data -->
  <rect x="50" y="125" width="100" height="50" rx="6" fill="#2ecc71"/>
  <text x="100" y="142" text-anchor="middle" class="step-title">External Data</text>
  <text x="100" y="155" text-anchor="middle" class="step-desc">APIs</text>
  <text x="100" y="165" text-anchor="middle" class="step-desc">Public datasets</text>
  
  <!-- Streaming Data -->
  <rect x="50" y="185" width="100" height="50" rx="6" fill="#f39c12"/>
  <text x="100" y="202" text-anchor="middle" class="step-title">Streaming</text>
  <text x="100" y="215" text-anchor="middle" class="step-desc">Real-time feeds</text>
  <text x="100" y="225" text-anchor="middle" class="step-desc">Sensor data</text>
  
  <!-- Data Collection -->
  <rect x="200" y="125" width="120" height="60" rx="8" fill="#9b59b6"/>
  <text x="260" y="145" text-anchor="middle" class="step-title">Data Collection</text>
  <text x="260" y="160" text-anchor="middle" class="step-desc">Extract from sources</text>
  <text x="260" y="172" text-anchor="middle" class="step-desc">Initial loading</text>
  <text x="260" y="184" text-anchor="middle" class="step-desc">Format standardization</text>
  
  <!-- Quality Assessment -->
  <rect x="370" y="65" width="120" height="60" rx="8" fill="#e67e22"/>
  <text x="430" y="85" text-anchor="middle" class="step-title">Quality Assessment</text>
  <text x="430" y="100" text-anchor="middle" class="step-desc">Completeness check</text>
  <text x="430" y="112" text-anchor="middle" class="step-desc">Accuracy validation</text>
  <text x="430" y="124" text-anchor="middle" class="step-desc">Consistency review</text>
  
  <!-- Exploratory Analysis -->
  <rect x="370" y="185" width="120" height="60" rx="8" fill="#1abc9c"/>
  <text x="430" y="205" text-anchor="middle" class="step-title">Exploratory Analysis</text>
  <text x="430" y="220" text-anchor="middle" class="step-desc">Statistical summaries</text>
  <text x="430" y="232" text-anchor="middle" class="step-desc">Visualizations</text>
  <text x="430" y="244" text-anchor="middle" class="step-desc">Pattern discovery</text>
  
  <!-- Documentation -->
  <rect x="540" y="125" width="120" height="60" rx="8" fill="#e74c3c"/>
  <text x="600" y="145" text-anchor="middle" class="step-title">Documentation</text>
  <text x="600" y="160" text-anchor="middle" class="step-desc">Data catalog</text>
  <text x="600" y="172" text-anchor="middle" class="step-desc">Quality report</text>
  <text x="600" y="184" text-anchor="middle" class="step-desc">Key insights</text>
  
  <!-- Flow Arrows -->
  <path d="M 150 90 L 190 130" class="arrow"/>
  <path d="M 150 150 L 190 150" class="arrow"/>
  <path d="M 150 210 L 190 170" class="arrow"/>
  
  <path d="M 320 140 L 360 95" class="arrow"/>
  <path d="M 320 170 L 360 215" class="arrow"/>
  
  <path d="M 490 95 L 530 130" class="arrow"/>
  <path d="M 490 215 L 530 170" class="arrow"/>
  
  <!-- Quality Dimensions -->
  <text x="50" y="290" class="section-title">Key Quality Dimensions</text>
  
  <!-- Quality metric boxes -->
  <rect x="50" y="305" width="140" height="40" rx="4" fill="#ecf0f1" stroke="#bdc3c7"/>
  <text x="120" y="320" text-anchor="middle" style="font-family: Arial; font-size: 11px; font-weight: bold; fill: #2c3e50;">Completeness</text>
  <text x="120" y="335" text-anchor="middle" style="font-family: Arial; font-size: 9px; fill: #7f8c8d;">% of non-missing values</text>
  
  <rect x="200" y="305" width="140" height="40" rx="4" fill="#ecf0f1" stroke="#bdc3c7"/>
  <text x="270" y="320" text-anchor="middle" style="font-family: Arial; font-size: 11px; font-weight: bold; fill: #2c3e50;">Accuracy</text>
  <text x="270" y="335" text-anchor="middle" style="font-family: Arial; font-size: 9px; fill: #7f8c8d;">Correctness of values</text>
  
  <rect x="350" y="305" width="140" height="40" rx="4" fill="#ecf0f1" stroke="#bdc3c7"/>
  <text x="420" y="320" text-anchor="middle" style="font-family: Arial; font-size: 11px; font-weight: bold; fill: #2c3e50;">Consistency</text>
  <text x="420" y="335" text-anchor="middle" style="font-family: Arial; font-size: 9px; fill: #7f8c8d;">Format standardization</text>
  
  <rect x="500" y="305" width="140" height="40" rx="4" fill="#ecf0f1" stroke="#bdc3c7"/>
  <text x="570" y="320" text-anchor="middle" style="font-family: Arial; font-size: 11px; font-weight: bold; fill: #2c3e50;">Timeliness</text>
  <text x="570" y="335" text-anchor="middle" style="font-family: Arial; font-size: 9px; fill: #7f8c8d;">Data freshness</text>
  
  <!-- EDA Techniques -->
  <text x="50" y="380" class="section-title">Common EDA Techniques</text>
  <text x="50" y="400" style="font-family: Arial; font-size: 11px; fill: #2c3e50;">• Histograms for distributions</text>
  <text x="50" y="415" style="font-family: Arial; font-size: 11px; fill: #2c3e50;">• Correlation matrices</text>
  <text x="50" y="430" style="font-family: Arial; font-size: 11px; fill: #2c3e50;">• Time series plots</text>
  
  <text x="250" y="400" style="font-family: Arial; font-size: 11px; fill: #2c3e50;">• Scatter plots for patterns</text>
  <text x="250" y="415" style="font-family: Arial; font-size: 11px; fill: #2c3e50;">• Summary statistics</text>
  <text x="250" y="430" style="font-family: Arial; font-size: 11px; fill: #2c3e50;">• Missing value analysis</text>
  
  <text x="450" y="400" style="font-family: Arial; font-size: 11px; fill: #2c3e50;">• Box plots for outliers</text>
  <text x="450" y="415" style="font-family: Arial; font-size: 11px; fill: #2c3e50;">• Cross-tabulations</text>
  <text x="450" y="430" style="font-family: Arial; font-size: 11px; fill: #2c3e50;">• Distribution comparisons</text>
</svg>