<svg width="900" height="600" viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="900" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">Activation Functions Comparison</text>
  
  <!-- Sigmoid Function -->
  <rect x="50" y="70" width="200" height="220" fill="#fff" stroke="#3498db" stroke-width="2" rx="10"/>
  <text x="150" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#3498db">Sigmoid</text>
  
  <!-- Sigmoid plot -->
  <g transform="translate(150, 180)">
    <!-- Axes -->
    <line x1="-80" y1="0" x2="80" y2="0" stroke="#bdc3c7" stroke-width="1"/>
    <line x1="0" y1="-60" x2="0" y2="60" stroke="#bdc3c7" stroke-width="1"/>
    
    <!-- Sigmoid curve -->
    <path d="M-70,-50 Q-35,-45 -20,-30 Q-10,-15 0,0 Q10,15 20,30 Q35,45 70,50" 
          stroke="#3498db" stroke-width="3" fill="none"/>
    
    <!-- Labels -->
    <text x="0" y="-70" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">σ(x) = 1/(1+e⁻ˣ)</text>
    <text x="0" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">Range: (0,1)</text>
  </g>
  
  <!-- Sigmoid properties -->
  <text x="60" y="310" font-family="Arial, sans-serif" font-size="10" fill="#27ae60">✓ Smooth, differentiable</text>
  <text x="60" y="325" font-family="Arial, sans-serif" font-size="10" fill="#27ae60">✓ Probabilistic output</text>
  <text x="60" y="340" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c">✗ Vanishing gradients</text>
  <text x="60" y="355" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c">✗ Not zero-centered</text>
  
  <!-- Tanh Function -->
  <rect x="270" y="70" width="200" height="220" fill="#fff" stroke="#27ae60" stroke-width="2" rx="10"/>
  <text x="370" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#27ae60">Tanh</text>
  
  <!-- Tanh plot -->
  <g transform="translate(370, 180)">
    <!-- Axes -->
    <line x1="-80" y1="0" x2="80" y2="0" stroke="#bdc3c7" stroke-width="1"/>
    <line x1="0" y1="-60" x2="0" y2="60" stroke="#bdc3c7" stroke-width="1"/>
    
    <!-- Tanh curve -->
    <path d="M-70,-55 Q-30,-50 -15,-25 Q-5,-5 0,0 Q5,5 15,25 Q30,50 70,55" 
          stroke="#27ae60" stroke-width="3" fill="none"/>
    
    <!-- Labels -->
    <text x="0" y="-70" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">tanh(x) = (eˣ-e⁻ˣ)/(eˣ+e⁻ˣ)</text>
    <text x="0" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">Range: (-1,1)</text>
  </g>
  
  <!-- Tanh properties -->
  <text x="280" y="310" font-family="Arial, sans-serif" font-size="10" fill="#27ae60">✓ Zero-centered</text>
  <text x="280" y="325" font-family="Arial, sans-serif" font-size="10" fill="#27ae60">✓ Stronger gradients</text>
  <text x="280" y="340" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c">✗ Still vanishing gradients</text>
  <text x="280" y="355" font-family="Arial, sans-serif" font-size="10" fill="#f39c12">⚠ Saturation issues</text>
  
  <!-- ReLU Function -->
  <rect x="490" y="70" width="200" height="220" fill="#fff" stroke="#f39c12" stroke-width="2" rx="10"/>
  <text x="590" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f39c12">ReLU</text>
  
  <!-- ReLU plot -->
  <g transform="translate(590, 180)">
    <!-- Axes -->
    <line x1="-80" y1="0" x2="80" y2="0" stroke="#bdc3c7" stroke-width="1"/>
    <line x1="0" y1="-60" x2="0" y2="60" stroke="#bdc3c7" stroke-width="1"/>
    
    <!-- ReLU curve -->
    <path d="M-70,0 L0,0 L70,-60" stroke="#f39c12" stroke-width="3" fill="none"/>
    
    <!-- Labels -->
    <text x="0" y="-70" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">ReLU(x) = max(0,x)</text>
    <text x="0" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">Range: [0,∞)</text>
  </g>
  
  <!-- ReLU properties -->
  <text x="500" y="310" font-family="Arial, sans-serif" font-size="10" fill="#27ae60">✓ Computationally efficient</text>
  <text x="500" y="325" font-family="Arial, sans-serif" font-size="10" fill="#27ae60">✓ No vanishing gradients</text>
  <text x="500" y="340" font-family="Arial, sans-serif" font-size="10" fill="#27ae60">✓ Default choice</text>
  <text x="500" y="355" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c">✗ Dying ReLU problem</text>
  
  <!-- Leaky ReLU Function -->
  <rect x="710" y="70" width="180" height="220" fill="#fff" stroke="#9b59b6" stroke-width="2" rx="10"/>
  <text x="800" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#9b59b6">Leaky ReLU</text>
  
  <!-- Leaky ReLU plot -->
  <g transform="translate(800, 180)">
    <!-- Axes -->
    <line x1="-70" y1="0" x2="70" y2="0" stroke="#bdc3c7" stroke-width="1"/>
    <line x1="0" y1="-60" x2="0" y2="60" stroke="#bdc3c7" stroke-width="1"/>
    
    <!-- Leaky ReLU curve -->
    <path d="M-70,7 L0,0 L70,-60" stroke="#9b59b6" stroke-width="3" fill="none"/>
    
    <!-- Labels -->
    <text x="0" y="-70" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">f(x) = max(αx,x)</text>
    <text x="0" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">α ≈ 0.01</text>
  </g>
  
  <!-- Leaky ReLU properties -->
  <text x="720" y="310" font-family="Arial, sans-serif" font-size="10" fill="#27ae60">✓ Solves dying ReLU</text>
  <text x="720" y="325" font-family="Arial, sans-serif" font-size="10" fill="#27ae60">✓ Better gradients</text>
  <text x="720" y="340" font-family="Arial, sans-serif" font-size="10" fill="#f39c12">⚠ Less common</text>
  <text x="720" y="355" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">• Small negative slope</text>
  
  <!-- Softmax Function -->
  <rect x="150" y="380" width="250" height="180" fill="#fff" stroke="#e74c3c" stroke-width="2" rx="10"/>
  <text x="275" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e74c3c">Softmax</text>
  
  <!-- Softmax visualization -->
  <g transform="translate(275, 480)">
    <!-- Input vector -->
    <rect x="-80" y="-30" width="160" height="20" fill="#ecf0f1" stroke="#bdc3c7"/>
    <text x="0" y="-17" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">[2.0, 1.0, 0.1]</text>
    
    <!-- Arrow -->
    <path d="M0 -5 L0 15" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Output probabilities -->
    <rect x="-80" y="20" width="45" height="15" fill="#e74c3c" opacity="0.8"/>
    <text x="-57" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">0.66</text>
    
    <rect x="-30" y="20" width="35" height="15" fill="#f39c12" opacity="0.8"/>
    <text x="-12" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">0.24</text>
    
    <rect x="10" y="20" width="25" height="15" fill="#3498db" opacity="0.8"/>
    <text x="22" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">0.10</text>
  </g>
  
  <!-- Softmax formula -->
  <text x="275" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">σ(xᵢ) = e^xᵢ / Σⱼe^xⱼ</text>
  
  <!-- Softmax properties -->
  <text x="160" y="540" font-family="Arial, sans-serif" font-size="10" fill="#27ae60">✓ Probability distribution</text>
  <text x="160" y="555" font-family="Arial, sans-serif" font-size="10" fill="#27ae60">✓ Multi-class classification</text>
  
  <!-- Usage Guidelines -->
  <rect x="450" y="380" width="400" height="180" fill="#fff" stroke="#2c3e50" stroke-width="2" rx="10"/>
  <text x="650" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Usage Guidelines</text>
  
  <!-- Output layer recommendations -->
  <text x="470" y="430" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Output Layer:</text>
  <text x="480" y="445" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Regression: Linear (no activation)</text>
  <text x="480" y="460" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Binary Classification: Sigmoid</text>
  <text x="480" y="475" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Multi-class Classification: Softmax</text>
  
  <!-- Hidden layer recommendations -->
  <text x="470" y="500" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Hidden Layers:</text>
  <text x="480" y="515" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Default Choice: ReLU or variants</text>
  <text x="480" y="530" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Zero-centered data: Tanh</text>
  <text x="480" y="545" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Avoid: Sigmoid in hidden layers</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/>
    </marker>
  </defs>
</svg>