<svg viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef7cd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fde68a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="normalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:0.7" />
    </linearGradient>
    <linearGradient id="rightSkewGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:0.7" />
    </linearGradient>
    <linearGradient id="leftSkewGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:0.7" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="800" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" fill="#92400e" font-family="Arial, sans-serif" font-size="28" font-weight="bold">Distribution Shapes</text>
  <text x="500" y="65" text-anchor="middle" fill="#92400e" font-family="Arial, sans-serif" font-size="16">Skewness and Kurtosis</text>
  
  <!-- Skewness Section -->
  <text x="500" y="110" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="20" font-weight="bold">SKEWNESS: Measuring Asymmetry</text>
  
  <!-- Left Skewed Distribution -->
  <g transform="translate(50, 140)">
    <rect x="0" y="0" width="280" height="200" rx="10" fill="white" stroke="#f59e0b" stroke-width="2"/>
    <rect x="0" y="0" width="280" height="35" rx="10" fill="url(#leftSkewGrad)"/>
    <text x="140" y="22" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">LEFT SKEWED (Negative)</text>
    
    <!-- Left skewed curve -->
    <path d="M 30 160 Q 60 80 120 100 Q 180 110 250 160" 
          fill="none" stroke="#d97706" stroke-width="4"/>
    
    <!-- Mean, Median, Mode positions -->
    <line x1="90" y1="60" x2="90" y2="170" stroke="#ef4444" stroke-width="2" stroke-dasharray="3,3"/>
    <line x1="130" y1="60" x2="130" y2="170" stroke="#10b981" stroke-width="2" stroke-dasharray="3,3"/>
    <line x1="180" y1="60" x2="180" y2="170" stroke="#3b82f6" stroke-width="2" stroke-dasharray="3,3"/>
    
    <text x="90" y="185" text-anchor="middle" fill="#ef4444" font-family="Arial, sans-serif" font-size="10">Mean</text>
    <text x="130" y="185" text-anchor="middle" fill="#10b981" font-family="Arial, sans-serif" font-size="10">Median</text>
    <text x="180" y="185" text-anchor="middle" fill="#3b82f6" font-family="Arial, sans-serif" font-size="10">Mode</text>
    
    <text x="140" y="50" text-anchor="middle" fill="#d97706" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Skewness &lt; 0</text>
  </g>
  
  <!-- Normal Distribution -->
  <g transform="translate(360, 140)">
    <rect x="0" y="0" width="280" height="200" rx="10" fill="white" stroke="#10b981" stroke-width="2"/>
    <rect x="0" y="0" width="280" height="35" rx="10" fill="url(#normalGrad)"/>
    <text x="140" y="22" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">SYMMETRIC (Normal)</text>
    
    <!-- Normal curve -->
    <path d="M 30 160 Q 70 70 140 70 Q 210 70 250 160" 
          fill="none" stroke="#059669" stroke-width="4"/>
    
    <!-- Mean = Median = Mode -->
    <line x1="140" y1="60" x2="140" y2="170" stroke="#374151" stroke-width="3"/>
    <text x="140" y="185" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="10">Mean = Median = Mode</text>
    
    <text x="140" y="50" text-anchor="middle" fill="#059669" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Skewness = 0</text>
  </g>
  
  <!-- Right Skewed Distribution -->
  <g transform="translate(670, 140)">
    <rect x="0" y="0" width="280" height="200" rx="10" fill="white" stroke="#3b82f6" stroke-width="2"/>
    <rect x="0" y="0" width="280" height="35" rx="10" fill="url(#rightSkewGrad)"/>
    <text x="140" y="22" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">RIGHT SKEWED (Positive)</text>
    
    <!-- Right skewed curve -->
    <path d="M 30 160 Q 100 110 160 100 Q 220 80 250 160" 
          fill="none" stroke="#1d4ed8" stroke-width="4"/>
    
    <!-- Mode, Median, Mean positions -->
    <line x1="100" y1="60" x2="100" y2="170" stroke="#3b82f6" stroke-width="2" stroke-dasharray="3,3"/>
    <line x1="150" y1="60" x2="150" y2="170" stroke="#10b981" stroke-width="2" stroke-dasharray="3,3"/>
    <line x1="190" y1="60" x2="190" y2="170" stroke="#ef4444" stroke-width="2" stroke-dasharray="3,3"/>
    
    <text x="100" y="185" text-anchor="middle" fill="#3b82f6" font-family="Arial, sans-serif" font-size="10">Mode</text>
    <text x="150" y="185" text-anchor="middle" fill="#10b981" font-family="Arial, sans-serif" font-size="10">Median</text>
    <text x="190" y="185" text-anchor="middle" fill="#ef4444" font-family="Arial, sans-serif" font-size="10">Mean</text>
    
    <text x="140" y="50" text-anchor="middle" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Skewness &gt; 0</text>
  </g>
  
  <!-- Kurtosis Section -->
  <text x="500" y="400" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="20" font-weight="bold">KURTOSIS: Measuring Tail Thickness</text>
  
  <!-- Platykurtic Distribution -->
  <g transform="translate(50, 430)">
    <rect x="0" y="0" width="280" height="200" rx="10" fill="white" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="0" y="0" width="280" height="35" rx="10" fill="#8b5cf6" fill-opacity="0.8"/>
    <text x="140" y="22" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">PLATYKURTIC</text>
    
    <!-- Flat curve -->
    <path d="M 30 160 Q 70 120 140 115 Q 210 120 250 160" 
          fill="none" stroke="#7c3aed" stroke-width="4"/>
    
    <text x="140" y="50" text-anchor="middle" fill="#7c3aed" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Kurtosis &lt; 3</text>
    <text x="140" y="185" text-anchor="middle" fill="#7c3aed" font-family="Arial, sans-serif" font-size="11">Light Tails, Flat Peak</text>
  </g>
  
  <!-- Mesokurtic Distribution (Normal) -->
  <g transform="translate(360, 430)">
    <rect x="0" y="0" width="280" height="200" rx="10" fill="white" stroke="#10b981" stroke-width="2"/>
    <rect x="0" y="0" width="280" height="35" rx="10" fill="url(#normalGrad)"/>
    <text x="140" y="22" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">MESOKURTIC</text>
    
    <!-- Normal curve -->
    <path d="M 30 160 Q 70 70 140 70 Q 210 70 250 160" 
          fill="none" stroke="#059669" stroke-width="4"/>
    
    <text x="140" y="50" text-anchor="middle" fill="#059669" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Kurtosis = 3</text>
    <text x="140" y="185" text-anchor="middle" fill="#059669" font-family="Arial, sans-serif" font-size="11">Normal Tails and Peak</text>
  </g>
  
  <!-- Leptokurtic Distribution -->
  <g transform="translate(670, 430)">
    <rect x="0" y="0" width="280" height="200" rx="10" fill="white" stroke="#ef4444" stroke-width="2"/>
    <rect x="0" y="0" width="280" height="35" rx="10" fill="#ef4444" fill-opacity="0.8"/>
    <text x="140" y="22" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">LEPTOKURTIC</text>
    
    <!-- Peaked curve -->
    <path d="M 30 160 Q 60 140 90 120 Q 120 45 140 40 Q 160 45 190 120 Q 220 140 250 160" 
          fill="none" stroke="#dc2626" stroke-width="4"/>
    
    <text x="140" y="50" text-anchor="middle" fill="#dc2626" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Kurtosis &gt; 3</text>
    <text x="140" y="185" text-anchor="middle" fill="#dc2626" font-family="Arial, sans-serif" font-size="11">Heavy Tails, Sharp Peak</text>
  </g>
  
  <!-- Interpretation Guide -->
  <g transform="translate(50, 660)">
    <rect x="0" y="0" width="900" height="120" rx="10" fill="white" stroke="#6b7280" stroke-width="2"/>
    <text x="450" y="25" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Interpretation Guidelines</text>
    
    <text x="20" y="50" fill="#374151" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Skewness:</text>
    <text x="20" y="70" fill="#374151" font-family="Arial, sans-serif" font-size="12">• |Skew| &lt; 0.5: Approximately symmetric</text>
    <text x="280" y="70" fill="#374151" font-family="Arial, sans-serif" font-size="12">• 0.5 ≤ |Skew| &lt; 1: Moderately skewed</text>
    <text x="580" y="70" fill="#374151" font-family="Arial, sans-serif" font-size="12">• |Skew| ≥ 1: Highly skewed</text>
    
    <text x="20" y="95" fill="#374151" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Kurtosis:</text>
    <text x="20" y="115" fill="#374151" font-family="Arial, sans-serif" font-size="12">• Excess Kurtosis = Kurtosis - 3</text>
    <text x="280" y="115" fill="#374151" font-family="Arial, sans-serif" font-size="12">• Positive: Heavier tails than normal</text>
    <text x="580" y="115" fill="#374151" font-family="Arial, sans-serif" font-size="12">• Negative: Lighter tails than normal</text>
  </g>
</svg>