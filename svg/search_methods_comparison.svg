<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E3F2FD;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2196F3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="randomGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E8F5E8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4CAF50;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="vsGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFF3E0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF9800;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#333">
    Grid Search vs Random Search Comparison
  </text>
  
  <!-- VS Badge -->
  <ellipse cx="500" cy="70" rx="35" ry="18" fill="url(#vsGrad)" stroke="#FF9800" stroke-width="2"/>
  <text x="500" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    VS
  </text>
  
  <!-- Grid Search Section -->
  <rect x="50" y="100" width="400" height="450" rx="15" fill="url(#gridGrad)" stroke="#2196F3" stroke-width="3"/>
  
  <!-- Grid Search Header -->
  <text x="250" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">
    GRID SEARCH
  </text>
  <text x="250" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
    Exhaustive Systematic Search
  </text>
  
  <!-- Grid Visualization -->
  <rect x="80" y="170" width="140" height="100" rx="5" fill="rgba(255,255,255,0.9)" stroke="#1976D2" stroke-width="1"/>
  <text x="150" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1976D2">
    Parameter Space Grid
  </text>
  
  <!-- Grid points -->
  <g fill="#1976D2">
    <circle cx="90" cy="200" r="3"/>
    <circle cx="110" cy="200" r="3"/>
    <circle cx="130" cy="200" r="3"/>
    <circle cx="150" cy="200" r="3"/>
    <circle cx="170" cy="200" r="3"/>
    <circle cx="190" cy="200" r="3"/>
    <circle cx="210" cy="200" r="3"/>
    
    <circle cx="90" cy="220" r="3"/>
    <circle cx="110" cy="220" r="3"/>
    <circle cx="130" cy="220" r="3"/>
    <circle cx="150" cy="220" r="3"/>
    <circle cx="170" cy="220" r="3"/>
    <circle cx="190" cy="220" r="3"/>
    <circle cx="210" cy="220" r="3"/>
    
    <circle cx="90" cy="240" r="3"/>
    <circle cx="110" cy="240" r="3"/>
    <circle cx="130" cy="240" r="3"/>
    <circle cx="150" cy="240" r="3"/>
    <circle cx="170" cy="240" r="3"/>
    <circle cx="190" cy="240" r="3"/>
    <circle cx="210" cy="240" r="3"/>
    
    <circle cx="90" cy="260" r="3"/>
    <circle cx="110" cy="260" r="3"/>
    <circle cx="130" cy="260" r="3"/>
    <circle cx="150" cy="260" r="3"/>
    <circle cx="170" cy="260" r="3"/>
    <circle cx="190" cy="260" r="3"/>
    <circle cx="210" cy="260" r="3"/>
  </g>
  
  <!-- Best point -->
  <circle cx="170" cy="220" r="5" fill="#FFD700" stroke="#FF8F00" stroke-width="2"/>
  <text x="175" y="215" font-family="Arial, sans-serif" font-size="8" fill="#FF8F00" font-weight="bold">
    Best
  </text>
  
  <!-- Grid Search Characteristics -->
  <text x="270" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Characteristics:
  </text>
  <text x="280" y="215" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Tests ALL combinations
  </text>
  <text x="280" y="230" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Systematic coverage
  </text>
  <text x="280" y="245" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Predictable runtime
  </text>
  <text x="280" y="260" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Guaranteed optimal*
  </text>
  
  <!-- Grid Search Advantages -->
  <text x="70" y="300" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    ADVANTAGES:
  </text>
  <text x="80" y="320" font-family="Arial, sans-serif" font-size="10" fill="white">
    ✓ Finds best combination in grid
  </text>
  <text x="80" y="335" font-family="Arial, sans-serif" font-size="10" fill="white">
    ✓ Reproducible results
  </text>
  <text x="80" y="350" font-family="Arial, sans-serif" font-size="10" fill="white">
    ✓ Simple to understand
  </text>
  <text x="80" y="365" font-family="Arial, sans-serif" font-size="10" fill="white">
    ✓ Comprehensive search
  </text>
  <text x="80" y="380" font-family="Arial, sans-serif" font-size="10" fill="white">
    ✓ Works well for few parameters
  </text>
  
  <!-- Grid Search Disadvantages -->
  <text x="70" y="410" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    DISADVANTAGES:
  </text>
  <text x="80" y="430" font-family="Arial, sans-serif" font-size="10" fill="white">
    ✗ Exponentially expensive
  </text>
  <text x="80" y="445" font-family="Arial, sans-serif" font-size="10" fill="white">
    ✗ Curse of dimensionality
  </text>
  <text x="80" y="460" font-family="Arial, sans-serif" font-size="10" fill="white">
    ✗ Wastes computation
  </text>
  <text x="80" y="475" font-family="Arial, sans-serif" font-size="10" fill="white">
    ✗ May miss optimal between points
  </text>
  <text x="80" y="490" font-family="Arial, sans-serif" font-size="10" fill="white">
    ✗ Poor for high dimensions
  </text>
  
  <!-- Formula -->
  <text x="250" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">
    Total Evaluations = n₁ × n₂ × ... × nₖ
  </text>
  <text x="250" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">
    (where nᵢ = number of values for parameter i)
  </text>
  
  <!-- Random Search Section -->
  <rect x="550" y="100" width="400" height="450" rx="15" fill="url(#randomGrad)" stroke="#4CAF50" stroke-width="3"/>
  
  <!-- Random Search Header -->
  <text x="750" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">
    RANDOM SEARCH
  </text>
  <text x="750" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
    Probabilistic Sampling Approach
  </text>
  
  <!-- Random Visualization -->
  <rect x="580" y="170" width="140" height="100" rx="5" fill="rgba(255,255,255,0.9)" stroke="#2E7D32" stroke-width="1"/>
  <text x="650" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#2E7D32">
    Random Parameter Sampling
  </text>
  
  <!-- Random points -->
  <g fill="#2E7D32">
    <circle cx="595" cy="205" r="3"/>
    <circle cx="625" cy="215" r="3"/>
    <circle cx="645" cy="195" r="3"/>
    <circle cx="665" cy="245" r="3"/>
    <circle cx="685" cy="220" r="3"/>
    <circle cx="705" cy="200" r="3"/>
    <circle cx="610" cy="240" r="3"/>
    <circle cx="635" cy="255" r="3"/>
    <circle cx="655" cy="225" r="3"/>
    <circle cx="675" cy="210" r="3"/>
    <circle cx="695" cy="235" r="3"/>
    <circle cx="715" cy="250" r="3"/>
    <circle cx="590" cy="230" r="3"/>
    <circle cx="620" cy="245" r="3"/>
    <circle cx="640" cy="260" r="3"/>
    <circle cx="660" cy="200" r="3"/>
    <circle cx="680" cy="255" r="3"/>
    <circle cx="700" cy="215" r="3"/>
    <circle cx="605" cy="220" r="3"/>
    <circle cx="630" cy="235" r="3"/>
    <circle cx="650" cy="240" r="3"/>
    <circle cx="670" cy="195" r="3"/>
    <circle cx="690" cy="260" r="3"/>
    <circle cx="710" cy="225" r="3"/>
  </g>
  
  <!-- Best random point -->
  <circle cx="685" cy="220" r="5" fill="#FFD700" stroke="#FF8F00" stroke-width="2"/>
  <text x="690" y="215" font-family="Arial, sans-serif" font-size="8" fill="#FF8F00" font-weight="bold">
    Best
  </text>
  
  <!-- Random Search Characteristics -->
  <text x="770" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Characteristics:
  </text>
  <text x="780" y="215" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Samples randomly
  </text>
  <text x="780" y="230" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Flexible budget
  </text>
  <text x="780" y="245" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Probabilistic coverage
  </text>
  <text x="780" y="260" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Better scaling
  </text>
  
  <!-- Random Search Advantages -->
  <text x="570" y="300" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    ADVANTAGES:
  </text>
  <text x="580" y="320" font-family="Arial, sans-serif" font-size="10" fill="white">
    ✓ Efficient for high dimensions
  </text>
  <text x="580" y="335" font-family="Arial, sans-serif" font-size="10" fill="white">
    ✓ Flexible evaluation budget
  </text>
  <text x="580" y="350" font-family="Arial, sans-serif" font-size="10" fill="white">
    ✓ Can find unexpected solutions
  </text>
  <text x="580" y="365" font-family="Arial, sans-serif" font-size="10" fill="white">
    ✓ Easy to parallelize
  </text>
  <text x="580" y="380" font-family="Arial, sans-serif" font-size="10" fill="white">
    ✓ Better continuous coverage
  </text>
  
  <!-- Random Search Disadvantages -->
  <text x="570" y="410" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    DISADVANTAGES:
  </text>
  <text x="580" y="430" font-family="Arial, sans-serif" font-size="10" fill="white">
    ✗ No guarantee of optimum
  </text>
  <text x="580" y="445" font-family="Arial, sans-serif" font-size="10" fill="white">
    ✗ Results may vary
  </text>
  <text x="580" y="460" font-family="Arial, sans-serif" font-size="10" fill="white">
    ✗ May miss important regions
  </text>
  <text x="580" y="475" font-family="Arial, sans-serif" font-size="10" fill="white">
    ✗ Requires distribution knowledge
  </text>
  <text x="580" y="490" font-family="Arial, sans-serif" font-size="10" fill="white">
    ✗ Less systematic coverage
  </text>
  
  <!-- Formula -->
  <text x="750" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">
    Total Evaluations = n (budget)
  </text>
  <text x="750" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">
    (where n = computational budget)
  </text>
  
  <!-- Bottom Comparison -->
  <rect x="100" y="570" width="800" height="25" rx="5" fill="#F5F5F5" stroke="#ddd" stroke-width="1"/>
  <text x="120" y="585" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">
    Recommendation: Use Grid Search for ≤3 parameters, Random Search for >3 parameters or limited budget
  </text>
</svg>