<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="stepGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9a9e;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#fecfef;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="stepGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a8edea;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#fed6e3;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="stepGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d299c2;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#fef9d7;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="stepGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#89f7fe;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#66a6ff;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#2c3e50">
    PCA Process Workflow
  </text>
  
  <!-- Step 1: Original Data -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="180" height="120" fill="url(#stepGrad1)" stroke="#2c3e50" stroke-width="2" rx="10"/>
    <text x="90" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
      Step 1: Original Data
    </text>
    
    <!-- Data matrix representation -->
    <g transform="translate(30, 40)">
      <rect x="0" y="0" width="20" height="15" fill="#e74c3c" stroke="#2c3e50" stroke-width="1"/>
      <rect x="25" y="0" width="20" height="15" fill="#3498db" stroke="#2c3e50" stroke-width="1"/>
      <rect x="50" y="0" width="20" height="15" fill="#f39c12" stroke="#2c3e50" stroke-width="1"/>
      <rect x="75" y="0" width="20" height="15" fill="#27ae60" stroke="#2c3e50" stroke-width="1"/>
      
      <rect x="0" y="20" width="20" height="15" fill="#e74c3c" stroke="#2c3e50" stroke-width="1"/>
      <rect x="25" y="20" width="20" height="15" fill="#3498db" stroke="#2c3e50" stroke-width="1"/>
      <rect x="50" y="20" width="20" height="15" fill="#f39c12" stroke="#2c3e50" stroke-width="1"/>
      <rect x="75" y="20" width="20" height="15" fill="#27ae60" stroke="#2c3e50" stroke-width="1"/>
      
      <rect x="0" y="40" width="20" height="15" fill="#e74c3c" stroke="#2c3e50" stroke-width="1"/>
      <rect x="25" y="40" width="20" height="15" fill="#3498db" stroke="#2c3e50" stroke-width="1"/>
      <rect x="50" y="40" width="20" height="15" fill="#f39c12" stroke="#2c3e50" stroke-width="1"/>
      <rect x="75" y="40" width="20" height="15" fill="#27ae60" stroke="#2c3e50" stroke-width="1"/>
    </g>
    
    <text x="90" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
      X matrix (n × m)
    </text>
  </g>
  
  <!-- Arrow 1 -->
  <path d="M 250 140 L 320 140 L 305 130 M 320 140 L 305 150" stroke="#2c3e50" stroke-width="2" fill="none"/>
  
  <!-- Step 2: Center Data -->
  <g transform="translate(350, 80)">
    <rect x="0" y="0" width="180" height="120" fill="url(#stepGrad2)" stroke="#2c3e50" stroke-width="2" rx="10"/>
    <text x="90" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
      Step 2: Center Data
    </text>
    
    <!-- Formula -->
    <text x="90" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">
      X_centered = X - μ
    </text>
    
    <!-- Centered data visualization -->
    <g transform="translate(40, 65)">
      <circle cx="20" cy="10" r="3" fill="#e74c3c"/>
      <circle cx="40" cy="5" r="3" fill="#e74c3c"/>
      <circle cx="60" cy="15" r="3" fill="#e74c3c"/>
      <circle cx="80" cy="8" r="3" fill="#e74c3c"/>
      <circle cx="100" cy="12" r="3" fill="#e74c3c"/>
      
      <!-- Center line -->
      <line x1="0" y1="10" x2="120" y2="10" stroke="#2c3e50" stroke-width="1" stroke-dasharray="3,3"/>
    </g>
    
    <text x="90" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
      Zero-mean data
    </text>
  </g>
  
  <!-- Arrow 2 -->
  <path d="M 550 140 L 620 140 L 605 130 M 620 140 L 605 150" stroke="#2c3e50" stroke-width="2" fill="none"/>
  
  <!-- Step 3: Covariance Matrix -->
  <g transform="translate(650, 80)">
    <rect x="0" y="0" width="180" height="120" fill="url(#stepGrad3)" stroke="#2c3e50" stroke-width="2" rx="10"/>
    <text x="90" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
      Step 3: Covariance
    </text>
    
    <!-- Formula -->
    <text x="90" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">
      C = X^T X / (n-1)
    </text>
    
    <!-- Covariance matrix representation -->
    <g transform="translate(60, 65)">
      <rect x="0" y="0" width="15" height="15" fill="#3498db" stroke="#2c3e50" stroke-width="1"/>
      <rect x="20" y="0" width="15" height="15" fill="#e74c3c" stroke="#2c3e50" stroke-width="1"/>
      <rect x="40" y="0" width="15" height="15" fill="#f39c12" stroke="#2c3e50" stroke-width="1"/>
      
      <rect x="0" y="20" width="15" height="15" fill="#e74c3c" stroke="#2c3e50" stroke-width="1"/>
      <rect x="20" y="20" width="15" height="15" fill="#3498db" stroke="#2c3e50" stroke-width="1"/>
      <rect x="40" y="20" width="15" height="15" fill="#27ae60" stroke="#2c3e50" stroke-width="1"/>
      
      <rect x="0" y="40" width="15" height="15" fill="#f39c12" stroke="#2c3e50" stroke-width="1"/>
      <rect x="20" y="40" width="15" height="15" fill="#27ae60" stroke="#2c3e50" stroke-width="1"/>
      <rect x="40" y="40" width="15" height="15" fill="#3498db" stroke="#2c3e50" stroke-width="1"/>
    </g>
    
    <text x="90" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
      Symmetric matrix
    </text>
  </g>
  
  <!-- Vertical Arrow -->
  <path d="M 740 220 L 740 270 L 730 255 M 740 270 L 750 255" stroke="#2c3e50" stroke-width="2" fill="none"/>
  
  <!-- Step 4: Eigendecomposition -->
  <g transform="translate(650, 290)">
    <rect x="0" y="0" width="180" height="120" fill="url(#stepGrad4)" stroke="#2c3e50" stroke-width="2" rx="10"/>
    <text x="90" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
      Step 4: Eigendecomposition
    </text>
    
    <!-- Formula -->
    <text x="90" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">
      C v = λ v
    </text>
    
    <!-- Eigenvalues visualization -->
    <g transform="translate(40, 65)">
      <rect x="0" y="0" width="25" height="8" fill="#e74c3c"/>
      <text x="30" y="8" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">λ₁ = 5.2</text>
      
      <rect x="0" y="15" width="18" height="8" fill="#3498db"/>
      <text x="25" y="23" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">λ₂ = 2.1</text>
      
      <rect x="0" y="30" width="8" height="8" fill="#f39c12"/>
      <text x="15" y="38" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">λ₃ = 0.8</text>
    </g>
    
    <text x="90" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
      Sorted eigenvalues
    </text>
  </g>
  
  <!-- Left Arrow -->
  <path d="M 630 350 L 560 350 L 575 340 M 560 350 L 575 360" stroke="#2c3e50" stroke-width="2" fill="none"/>
  
  <!-- Step 5: Principal Components -->
  <g transform="translate(350, 290)">
    <rect x="0" y="0" width="180" height="120" fill="url(#stepGrad1)" stroke="#2c3e50" stroke-width="2" rx="10"/>
    <text x="90" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
      Step 5: Select PCs
    </text>
    
    <!-- PC selection -->
    <g transform="translate(30, 45)">
      <rect x="0" y="0" width="40" height="20" fill="#e74c3c" stroke="#2c3e50" stroke-width="1"/>
      <text x="20" y="14" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">PC1</text>
      
      <rect x="50" y="0" width="40" height="20" fill="#3498db" stroke="#2c3e50" stroke-width="1"/>
      <text x="70" y="14" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">PC2</text>
      
      <rect x="100" y="0" width="40" height="20" fill="#95a5a6" stroke="#2c3e50" stroke-width="1"/>
      <text x="120" y="14" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">PC3</text>
    </g>
    
    <text x="90" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
      Keep top k components
    </text>
    
    <text x="90" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
      (e.g., 95% variance)
    </text>
  </g>
  
  <!-- Left Arrow -->
  <path d="M 330 350 L 260 350 L 275 340 M 260 350 L 275 360" stroke="#2c3e50" stroke-width="2" fill="none"/>
  
  <!-- Step 6: Transform Data -->
  <g transform="translate(50, 290)">
    <rect x="0" y="0" width="180" height="120" fill="url(#stepGrad2)" stroke="#2c3e50" stroke-width="2" rx="10"/>
    <text x="90" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
      Step 6: Transform
    </text>
    
    <!-- Formula -->
    <text x="90" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">
      Y = X_centered × W
    </text>
    
    <!-- Transformed data -->
    <g transform="translate(50, 65)">
      <circle cx="10" cy="10" r="3" fill="#e74c3c"/>
      <circle cx="30" cy="5" r="3" fill="#e74c3c"/>
      <circle cx="50" cy="15" r="3" fill="#e74c3c"/>
      <circle cx="70" cy="8" r="3" fill="#e74c3c"/>
      
      <!-- PC axes -->
      <line x1="0" y1="10" x2="80" y2="10" stroke="#e74c3c" stroke-width="2"/>
      <line x1="40" y1="0" x2="40" y2="20" stroke="#3498db" stroke-width="2"/>
      
      <text x="85" y="14" font-family="Arial, sans-serif" font-size="8" fill="#e74c3c">PC1</text>
      <text x="44" y="-5" font-family="Arial, sans-serif" font-size="8" fill="#3498db">PC2</text>
    </g>
    
    <text x="90" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
      Low-dimensional data
    </text>
  </g>
  
  <!-- Mathematical formulation box -->
  <g transform="translate(50, 450)">
    <rect x="0" y="0" width="800" height="120" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2" rx="10"/>
    <text x="400" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">
      Mathematical Summary
    </text>
    
    <text x="50" y="50" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
      • Original Data: X ∈ ℝⁿˣᵐ (n samples, m features)
    </text>
    <text x="50" y="70" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
      • Centered Data: X̃ = X - μ, where μ is the mean vector
    </text>
    <text x="50" y="90" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
      • Covariance Matrix: C = (1/(n-1)) × X̃ᵀX̃
    </text>
    
    <text x="450" y="50" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
      • Eigendecomposition: C = QΛQᵀ
    </text>
    <text x="450" y="70" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
      • Principal Components: W = Q[:, :k] (first k eigenvectors)
    </text>
    <text x="450" y="90" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
      • Transformed Data: Y = X̃W ∈ ℝⁿˣᵏ (reduced dimensions)
    </text>
  </g>
</svg>