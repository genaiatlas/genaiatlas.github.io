<svg viewBox="0 0 900 550" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title-text { font-family: 'Arial', sans-serif; font-size: 24px; font-weight: bold; fill: #2C3E50; }
      .subtitle-text { font-family: 'Arial', sans-serif; font-size: 16px; fill: #555; }
      .node-circle { fill: #4A90E2; stroke: #2E5C8A; stroke-width: 3; }
      .node-label { font-family: 'Arial', sans-serif; font-size: 16px; fill: white; font-weight: bold; text-anchor: middle; }
      .edge-line { stroke: #666; stroke-width: 3; }
      .message-arrow { stroke: #E74C3C; stroke-width: 3; fill: none; marker-end: url(#red-arrow); }
      .message-box { fill: #FFF9E6; stroke: #FFA500; stroke-width: 2; rx: 5; }
      .message-text { font-family: 'Courier New', monospace; font-size: 12px; fill: #333; }
      .label-text { font-family: 'Arial', sans-serif; font-size: 14px; fill: #555; }
    </style>
    
    <marker id="red-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#E74C3C"/>
    </marker>
    
    <marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#3498DB"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="450" y="30" class="title-text" text-anchor="middle">Chain Message Passing (Markov Chain)</text>
  <text x="450" y="55" class="subtitle-text" text-anchor="middle">Belief Propagation Algorithm</text>
  
  <!-- Chain Structure -->
  <g transform="translate(0, 100)">
    <text x="450" y="0" class="subtitle-text" text-anchor="middle" font-weight="bold">Chain Graph Structure</text>
    
    <!-- Edges -->
    <line x1="130" y1="70" x2="210" y2="70" class="edge-line"/>
    <line x1="250" y1="70" x2="330" y2="70" class="edge-line"/>
    <line x1="370" y1="70" x2="450" y2="70" class="edge-line"/>
    <line x1="490" y1="70" x2="570" y2="70" class="edge-line"/>
    <line x1="610" y1="70" x2="690" y2="70" class="edge-line"/>
    <line x1="730" y1="70" x2="810" y2="70" class="edge-line"/>
    
    <!-- Nodes -->
    <circle cx="110" cy="70" r="25" class="node-circle"/>
    <text x="110" y="77" class="node-label">X₁</text>
    
    <circle cx="230" cy="70" r="25" class="node-circle"/>
    <text x="230" y="77" class="node-label">X₂</text>
    
    <circle cx="350" cy="70" r="25" class="node-circle"/>
    <text x="350" y="77" class="node-label">X₃</text>
    
    <circle cx="470" cy="70" r="25" class="node-circle"/>
    <text x="470" y="77" class="node-label">X₄</text>
    
    <circle cx="590" cy="70" r="25" class="node-circle"/>
    <text x="590" y="77" class="node-label">X₅</text>
    
    <circle cx="710" cy="70" r="25" class="node-circle"/>
    <text x="710" y="77" class="node-label">X₆</text>
    
    <circle cx="830" cy="70" r="25" class="node-circle"/>
    <text x="830" y="77" class="node-label">X₇</text>
    
    <text x="110" y="120" class="label-text" text-anchor="middle" font-weight="bold">Start</text>
    <text x="830" y="120" class="label-text" text-anchor="middle" font-weight="bold">End</text>
  </g>
  
  <!-- Message Flow Arrows -->
  <g transform="translate(0, 100)">
    <!-- Forward messages (right) -->
    <path d="M 130 90 Q 170 110, 210 90" class="message-arrow"/>
    <text x="170" y="125" class="label-text" text-anchor="middle" fill="#E74C3C" font-size="11px">m₁→₂</text>
    
    <path d="M 250 90 Q 290 110, 330 90" class="message-arrow"/>
    <text x="290" y="125" class="label-text" text-anchor="middle" fill="#E74C3C" font-size="11px">m₂→₃</text>
    
    <path d="M 370 90 Q 410 110, 450 90" class="message-arrow"/>
    <text x="410" y="125" class="label-text" text-anchor="middle" fill="#E74C3C" font-size="11px">m₃→₄</text>
    
    <!-- Backward messages (left) -->
    <path d="M 810 50 Q 770 30, 730 50" stroke="#3498DB" stroke-width="3" fill="none" marker-end="url(#blue-arrow)"/>
    <text x="770" y="20" class="label-text" text-anchor="middle" fill="#3498DB" font-size="11px">m₇→₆</text>
    
    <path d="M 690 50 Q 650 30, 610 50" stroke="#3498DB" stroke-width="3" fill="none" marker-end="url(#blue-arrow)"/>
    <text x="650" y="20" class="label-text" text-anchor="middle" fill="#3498DB" font-size="11px">m₆→₅</text>
    
    <path d="M 570 50 Q 530 30, 490 50" stroke="#3498DB" stroke-width="3" fill="none" marker-end="url(#blue-arrow)"/>
    <text x="530" y="20" class="label-text" text-anchor="middle" fill="#3498DB" font-size="11px">m₅→₄</text>
  </g>
  
  <!-- Message Content Box -->
  <g transform="translate(50, 260)">
    <rect x="0" y="0" width="380" height="240" class="message-box"/>
    <text x="190" y="30" class="subtitle-text" text-anchor="middle" font-weight="bold">Message Format</text>
    
    <text x="20" y="60" class="message-text" font-weight="bold">Message from X₂ to X₁:</text>
    
    <text x="30" y="85" class="message-text">P(X₂ = +1 | X₁ = +1) = 0.7</text>
    <text x="30" y="105" class="message-text">P(X₂ = -1 | X₁ = +1) = 0.3</text>
    
    <line x1="20" y1="115" x2="360" y2="115" stroke="#CCC" stroke-width="1"/>
    
    <text x="30" y="135" class="message-text">P(X₂ = +1 | X₁ = -1) = 0.4</text>
    <text x="30" y="155" class="message-text">P(X₂ = -1 | X₁ = -1) = 0.6</text>
    
    <line x1="20" y1="170" x2="360" y2="170" stroke="#CCC" stroke-width="1"/>
    
    <text x="190" y="195" class="label-text" text-anchor="middle" font-style="italic">Conditional probabilities</text>
    <text x="190" y="215" class="label-text" text-anchor="middle" font-style="italic">given neighbor's state</text>
  </g>
  
  <!-- Algorithm Box -->
  <g transform="translate(460, 260)">
    <rect x="0" y="0" width="390" height="240" fill="#E8F4F8" stroke="#3498DB" stroke-width="2" rx="5"/>
    <text x="195" y="30" class="subtitle-text" text-anchor="middle" font-weight="bold">Message Passing Algorithm</text>
    
    <text x="20" y="60" class="label-text" font-weight="bold">1. Initialization:</text>
    <text x="30" y="80" class="label-text">• Start at leaf nodes (X₁ and X₇)</text>
    
    <text x="20" y="110" class="label-text" font-weight="bold">2. Forward Pass:</text>
    <text x="30" y="130" class="label-text">• X₁ → X₂ → X₃ → X₄</text>
    <text x="30" y="148" class="label-text">• Each node sends message right</text>
    
    <text x="20" y="175" class="label-text" font-weight="bold">3. Backward Pass:</text>
    <text x="30" y="195" class="label-text">• X₇ → X₆ → X₅ → X₄</text>
    <text x="30" y="213" class="label-text">• Each node sends message left</text>
  </g>
  
  <!-- Complexity Note -->
  <rect x="50" y="515" width="800" height="25" fill="#D5F4E6" stroke="#27AE60" stroke-width="2" rx="3"/>
  <text x="450" y="533" class="label-text" text-anchor="middle" font-weight="bold">
    Complexity: O(2 × edges) = Linear time in number of nodes
  </text>
</svg>