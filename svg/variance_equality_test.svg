<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="500" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    F-Test for Equality of Variances
  </text>
  
  <!-- Subtitle -->
  <text x="400" y="70" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#5a6c7d">
    H₀: σ₁² = σ₂²  vs  H₁: σ₁² ≠ σ₂²
  </text>
  
  <!-- F-distribution curve -->
  <path d="M 100 400 Q 130 150, 180 220 Q 230 280, 280 320 Q 350 360, 450 380 Q 550 390, 650 395 Q 700 397, 720 398" 
        fill="none" stroke="#9b59b6" stroke-width="3"/>
  
  <!-- Fill rejection region (right tail) -->
  <path d="M 600 390 Q 625 392, 650 395 Q 675 397, 700 398 Q 715 398.5, 720 398.7 L 720 400 L 600 400 Z" 
        fill="#e74c3c" opacity="0.3"/>
  
  <!-- Axes -->
  <line x1="80" y1="400" x2="740" y2="400" stroke="#2c3e50" stroke-width="2"/>
  <line x1="80" y1="400" x2="80" y2="100" stroke="#2c3e50" stroke-width="2"/>
  
  <!-- Axis labels -->
  <text x="400" y="440" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50">
    F statistic
  </text>
  <text x="30" y="250" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50" transform="rotate(-90 30 250)">
    Probability Density
  </text>
  
  <!-- Critical value -->
  <line x1="600" y1="390" x2="600" y2="410" stroke="#e74c3c" stroke-width="2" stroke-dasharray="5,5"/>
  
  <text x="600" y="430" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#e74c3c">
    F(α, df₁, df₂)
  </text>
  
  <!-- Test statistic formula box -->
  <rect x="500" y="110" width="270" height="160" fill="white" stroke="#9b59b6" stroke-width="2" rx="5"/>
  <text x="635" y="140" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Test Statistic:
  </text>
  <text x="635" y="170" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#2c3e50">
    F = s₁²/s₂²
  </text>
  <text x="635" y="200" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#5a6c7d">
    where s₁² ≥ s₂² (larger first)
  </text>
  <text x="635" y="225" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#5a6c7d">
    df₁ = n₁ - 1
  </text>
  <text x="635" y="245" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#5a6c7d">
    df₂ = n₂ - 1
  </text>
  
  <!-- Comparison box -->
  <rect x="100" y="110" width="280" height="140" fill="white" stroke="#3498db" stroke-width="2" rx="5"/>
  <text x="240" y="140" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Two Sample Variances:
  </text>
  <text x="240" y="170" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50">
    Sample 1: s₁², n₁
  </text>
  <text x="240" y="200" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50">
    Sample 2: s₂², n₂
  </text>
  <text x="240" y="230" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#5a6c7d">
    Assuming normal populations
  </text>
  
  <!-- Rejection region label -->
  <text x="660" y="375" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#e74c3c" font-weight="bold">
    Reject H₀
  </text>
  <text x="350" y="340" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#27ae60" font-weight="bold">
    Do Not Reject H₀
  </text>
  
  <!-- Alpha annotation -->
  <text x="660" y="460" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#e74c3c">
    Significance level: α
  </text>
  
  <!-- Note about two-tailed -->
  <text x="400" y="485" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d" font-style="italic">
    Note: For two-tailed test, use α/2 and also check F &lt; F(1-α/2, df₁, df₂)
  </text>
</svg>