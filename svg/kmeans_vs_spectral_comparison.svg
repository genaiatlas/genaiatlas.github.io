<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cluster1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#ffa8a8;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="cluster2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ecdc4;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#96f2ed;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="700" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">
    K-Means vs Spectral Clustering: Handling Complex Shapes
  </text>
  
  <!-- Original Data Section -->
  <g transform="translate(50, 70)">
    <text x="150" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">
      Original Data: Spiral Pattern
    </text>
    
    <!-- Coordinate system -->
    <line x1="20" y1="180" x2="280" y2="180" stroke="#bdc3c7" stroke-width="1"/>
    <line x1="150" y1="50" x2="150" y2="210" stroke="#bdc3c7" stroke-width="1"/>
    
    <!-- Spiral data points -->
    <!-- Outer spiral (red cluster) -->
    <circle cx="150" cy="80" r="3" fill="#e74c3c"/>
    <circle cx="170" cy="85" r="3" fill="#e74c3c"/>
    <circle cx="185" cy="100" r="3" fill="#e74c3c"/>
    <circle cx="190" cy="120" r="3" fill="#e74c3c"/>
    <circle cx="185" cy="140" r="3" fill="#e74c3c"/>
    <circle cx="170" cy="155" r="3" fill="#e74c3c"/>
    <circle cx="150" cy="160" r="3" fill="#e74c3c"/>
    <circle cx="130" cy="155" r="3" fill="#e74c3c"/>
    <circle cx="115" cy="140" r="3" fill="#e74c3c"/>
    <circle cx="110" cy="120" r="3" fill="#e74c3c"/>
    <circle cx="115" cy="100" r="3" fill="#e74c3c"/>
    <circle cx="130" cy="85" r="3" fill="#e74c3c"/>
    <circle cx="140" cy="75" r="3" fill="#e74c3c"/>
    <circle cx="160" cy="75" r="3" fill="#e74c3c"/>
    <circle cx="175" cy="80" r="3" fill="#e74c3c"/>
    <circle cx="185" cy="90" r="3" fill="#e74c3c"/>
    <circle cx="185" cy="105" r="3" fill="#e74c3c"/>
    <circle cx="180" cy="120" r="3" fill="#e74c3c"/>
    <circle cx="170" cy="135" r="3" fill="#e74c3c"/>
    <circle cx="155" cy="145" r="3" fill="#e74c3c"/>
    <circle cx="140" cy="145" r="3" fill="#e74c3c"/>
    <circle cx="125" cy="135" r="3" fill="#e74c3c"/>
    <circle cx="120" cy="120" r="3" fill="#e74c3c"/>
    <circle cx="125" cy="105" r="3" fill="#e74c3c"/>
    <circle cx="135" cy="95" r="3" fill="#e74c3c"/>
    <circle cx="150" cy="95" r="3" fill="#e74c3c"/>
    
    <!-- Inner spiral (blue cluster) -->
    <circle cx="150" cy="110" r="3" fill="#3498db"/>
    <circle cx="160" cy="115" r="3" fill="#3498db"/>
    <circle cx="165" cy="125" r="3" fill="#3498db"/>
    <circle cx="160" cy="135" r="3" fill="#3498db"/>
    <circle cx="150" cy="140" r="3" fill="#3498db"/>
    <circle cx="140" cy="135" r="3" fill="#3498db"/>
    <circle cx="135" cy="125" r="3" fill="#3498db"/>
    <circle cx="140" cy="115" r="3" fill="#3498db"/>
    <circle cx="145" cy="110" r="3" fill="#3498db"/>
    <circle cx="155" cy="110" r="3" fill="#3498db"/>
    <circle cx="160" cy="112" r="3" fill="#3498db"/>
    <circle cx="162" cy="120" r="3" fill="#3498db"/>
    <circle cx="158" cy="130" r="3" fill="#3498db"/>
    <circle cx="150" cy="132" r="3" fill="#3498db"/>
    <circle cx="142" cy="130" r="3" fill="#3498db"/>
    <circle cx="138" cy="120" r="3" fill="#3498db"/>
    <circle cx="142" cy="112" r="3" fill="#3498db"/>
    <circle cx="148" cy="108" r="3" fill="#3498db"/>
    <circle cx="152" cy="108" r="3" fill="#3498db"/>
    
    <text x="150" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">
      Interwoven spiral clusters
    </text>
  </g>
  
  <!-- K-Means Results Section -->
  <g transform="translate(350, 70)">
    <text x="150" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">
      K-Means Clustering Result
    </text>
    
    <!-- Coordinate system -->
    <line x1="20" y1="180" x2="280" y2="180" stroke="#bdc3c7" stroke-width="1"/>
    <line x1="150" y1="50" x2="150" y2="210" stroke="#bdc3c7" stroke-width="1"/>
    
    <!-- K-means cluster boundaries (linear) -->
    <line x1="50" y1="50" x2="250" y2="210" stroke="#f39c12" stroke-width="3" stroke-dasharray="5,5"/>
    
    <!-- Misclassified points -->
    <!-- Points that should be red but classified as blue -->
    <circle cx="150" cy="80" r="3" fill="#3498db" stroke="#e74c3c" stroke-width="2"/>
    <circle cx="170" cy="85" r="3" fill="#3498db" stroke="#e74c3c" stroke-width="2"/>
    <circle cx="185" cy="100" r="3" fill="#e74c3c"/>
    <circle cx="190" cy="120" r="3" fill="#e74c3c"/>
    <circle cx="185" cy="140" r="3" fill="#e74c3c"/>
    <circle cx="170" cy="155" r="3" fill="#e74c3c"/>
    <circle cx="150" cy="160" r="3" fill="#e74c3c"/>
    <circle cx="130" cy="155" r="3" fill="#e74c3c"/>
    <circle cx="115" cy="140" r="3" fill="#e74c3c"/>
    <circle cx="110" cy="120" r="3" fill="#e74c3c"/>
    <circle cx="115" cy="100" r="3" fill="#e74c3c"/>
    <circle cx="130" cy="85" r="3" fill="#3498db" stroke="#e74c3c" stroke-width="2"/>
    
    <!-- Points that should be blue but classified as red -->
    <circle cx="150" cy="110" r="3" fill="#e74c3c" stroke="#3498db" stroke-width="2"/>
    <circle cx="160" cy="115" r="3" fill="#e74c3c" stroke="#3498db" stroke-width="2"/>
    <circle cx="165" cy="125" r="3" fill="#e74c3c" stroke="#3498db" stroke-width="2"/>
    <circle cx="160" cy="135" r="3" fill="#e74c3c" stroke="#3498db" stroke-width="2"/>
    <circle cx="150" cy="140" r="3" fill="#e74c3c"/>
    <circle cx="140" cy="135" r="3" fill="#3498db" stroke="#e74c3c" stroke-width="2"/>
    <circle cx="135" cy="125" r="3" fill="#3498db" stroke="#e74c3c" stroke-width="2"/>
    <circle cx="140" cy="115" r="3" fill="#3498db" stroke="#e74c3c" stroke-width="2"/>
    
    <!-- Cluster centers -->
    <circle cx="120" cy="100" r="5" fill="#2c3e50" stroke="#ffffff" stroke-width="2"/>
    <circle cx="180" cy="140" r="5" fill="#2c3e50" stroke="#ffffff" stroke-width="2"/>
    
    <text x="150" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">
      Linear decision boundary fails
    </text>
    <text x="150" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#e74c3c">
      Many misclassifications
    </text>
  </g>
  
  <!-- Spectral Clustering Results Section -->
  <g transform="translate(650, 70)">
    <text x="150" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">
      Spectral Clustering Result
    </text>
    
    <!-- Coordinate system -->
    <line x1="20" y1="180" x2="280" y2="180" stroke="#bdc3c7" stroke-width="1"/>
    <line x1="150" y1="50" x2="150" y2="210" stroke="#bdc3c7" stroke-width="1"/>
    
    <!-- Correctly classified spiral points -->
    <!-- Outer spiral (red cluster) -->
    <circle cx="150" cy="80" r="3" fill="#e74c3c"/>
    <circle cx="170" cy="85" r="3" fill="#e74c3c"/>
    <circle cx="185" cy="100" r="3" fill="#e74c3c"/>
    <circle cx="190" cy="120" r="3" fill="#e74c3c"/>
    <circle cx="185" cy="140" r="3" fill="#e74c3c"/>
    <circle cx="170" cy="155" r="3" fill="#e74c3c"/>
    <circle cx="150" cy="160" r="3" fill="#e74c3c"/>
    <circle cx="130" cy="155" r="3" fill="#e74c3c"/>
    <circle cx="115" cy="140" r="3" fill="#e74c3c"/>
    <circle cx="110" cy="120" r="3" fill="#e74c3c"/>
    <circle cx="115" cy="100" r="3" fill="#e74c3c"/>
    <circle cx="130" cy="85" r="3" fill="#e74c3c"/>
    <circle cx="140" cy="75" r="3" fill="#e74c3c"/>
    <circle cx="160" cy="75" r="3" fill="#e74c3c"/>
    <circle cx="175" cy="80" r="3" fill="#e74c3c"/>
    <circle cx="185" cy="90" r="3" fill="#e74c3c"/>
    <circle cx="185" cy="105" r="3" fill="#e74c3c"/>
    <circle cx="180" cy="120" r="3" fill="#e74c3c"/>
    <circle cx="170" cy="135" r="3" fill="#e74c3c"/>
    <circle cx="155" cy="145" r="3" fill="#e74c3c"/>
    <circle cx="140" cy="145" r="3" fill="#e74c3c"/>
    <circle cx="125" cy="135" r="3" fill="#e74c3c"/>
    <circle cx="120" cy="120" r="3" fill="#e74c3c"/>
    <circle cx="125" cy="105" r="3" fill="#e74c3c"/>
    <circle cx="135" cy="95" r="3" fill="#e74c3c"/>
    <circle cx="150" cy="95" r="3" fill="#e74c3c"/>
    
    <!-- Inner spiral (blue cluster) -->
    <circle cx="150" cy="110" r="3" fill="#3498db"/>
    <circle cx="160" cy="115" r="3" fill="#3498db"/>
    <circle cx="165" cy="125" r="3" fill="#3498db"/>
    <circle cx="160" cy="135" r="3" fill="#3498db"/>
    <circle cx="150" cy="140" r="3" fill="#3498db"/>
    <circle cx="140" cy="135" r="3" fill="#3498db"/>
    <circle cx="135" cy="125" r="3" fill="#3498db"/>
    <circle cx="140" cy="115" r="3" fill="#3498db"/>
    <circle cx="145" cy="110" r="3" fill="#3498db"/>
    <circle cx="155" cy="110" r="3" fill="#3498db"/>
    <circle cx="160" cy="112" r="3" fill="#3498db"/>
    <circle cx="162" cy="120" r="3" fill="#3498db"/>
    <circle cx="158" cy="130" r="3" fill="#3498db"/>
    <circle cx="150" cy="132" r="3" fill="#3498db"/>
    <circle cx="142" cy="130" r="3" fill="#3498db"/>
    <circle cx="138" cy="120" r="3" fill="#3498db"/>
    <circle cx="142" cy="112" r="3" fill="#3498db"/>
    <circle cx="148" cy="108" r="3" fill="#3498db"/>
    <circle cx="152" cy="108" r="3" fill="#3498db"/>
    
    <!-- Non-linear decision boundary visualization -->
    <path d="M 150 100 Q 170 110 175 130 Q 170 150 150 150 Q 130 150 125 130 Q 130 110 150 100" 
          stroke="#27ae60" stroke-width="2" fill="none" stroke-dasharray="3,3"/>
    
    <text x="150" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">
      Non-linear boundary succeeds
    </text>
    <text x="150" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#27ae60">
      Perfect separation
    </text>
  </g>
  
  <!-- Comparison Table -->
  <g transform="translate(50, 350)">
    <text x="400" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">
      Detailed Comparison
    </text>
    
    <!-- Table background -->
    <rect x="0" y="20" width="800" height="280" fill="#ffffff" stroke="#2c3e50" stroke-width="2"/>
    
    <!-- Table headers -->
    <rect x="0" y="20" width="200" height="40" fill="#34495e"/>
    <text x="100" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
      Aspect
    </text>
    
    <rect x="200" y="20" width="300" height="40" fill="#e74c3c"/>
    <text x="350" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
      K-Means Clustering
    </text>
    
    <rect x="500" y="20" width="300" height="40" fill="#3498db"/>
    <text x="650" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
      Spectral Clustering
    </text>
    
    <!-- Row 1: Cluster Shape -->
    <rect x="0" y="60" width="200" height="35" fill="#ecf0f1"/>
    <text x="100" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">
      Cluster Shape
    </text>
    
    <rect x="200" y="60" width="300" height="35" fill="#ffebee"/>
    <text x="350" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
      Spherical/Convex only
    </text>
    
    <rect x="500" y="60" width="300" height="35" fill="#e3f2fd"/>
    <text x="650" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
      Any shape (non-convex, curved)
    </text>
    
    <!-- Row 2: Distance Metric -->
    <rect x="0" y="95" width="200" height="35" fill="#ecf0f1"/>
    <text x="100" y="117" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">
      Distance Metric
    </text>
    
    <rect x="200" y="95" width="300" height="35" fill="#ffebee"/>
    <text x="350" y="117" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
      Euclidean distance only
    </text>
    
    <rect x="500" y="95" width="300" height="35" fill="#e3f2fd"/>
    <text x="650" y="117" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
      Graph-based similarity
    </text>
    
    <!-- Row 3: Algorithm Complexity -->
    <rect x="0" y="130" width="200" height="35" fill="#ecf0f1"/>
    <text x="100" y="152" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">
      Complexity
    </text>
    
    <rect x="200" y="130" width="300" height="35" fill="#ffebee"/>
    <text x="350" y="152" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
      O(n·k·i) - Fast
    </text>
    
    <rect x="500" y="130" width="300" height="35" fill="#e3f2fd"/>
    <text x="650" y="152" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
      O(n³) - Slower (eigendecomposition)
    </text>
    
    <!-- Row 4: Data Requirements -->
    <rect x="0" y="165" width="200" height="35" fill="#ecf0f1"/>
    <text x="100" y="187" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">
      Data Requirements
    </text>
    
    <rect x="200" y="165" width="300" height="35" fill="#ffebee"/>
    <text x="350" y="187" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
      Feature vectors in Euclidean space
    </text>
    
    <rect x="500" y="165" width="300" height="35" fill="#e3f2fd"/>
    <text x="650" y="187" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
      Any data representable as a graph
    </text>
    
    <!-- Row 5: Parameter Sensitivity -->
    <rect x="0" y="200" width="200" height="35" fill="#ecf0f1"/>
    <text x="100" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">
      Parameter Tuning
    </text>
    
    <rect x="200" y="200" width="300" height="35" fill="#ffebee"/>
    <text x="350" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
      Only k (number of clusters)
    </text>
    
    <rect x="500" y="200" width="300" height="35" fill="#e3f2fd"/>
    <text x="650" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
      k, similarity function, graph construction
    </text>
    
    <!-- Row 6: Best Use Cases -->
    <rect x="0" y="235" width="200" height="35" fill="#ecf0f1"/>
    <text x="100" y="257" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">
      Best For
    </text>
    
    <rect x="200" y="235" width="300" height="35" fill="#ffebee"/>
    <text x="350" y="257" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
      Round clusters, large datasets, speed
    </text>
    
    <rect x="500" y="235" width="300" height="35" fill="#e3f2fd"/>
    <text x="650" y="257" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
      Complex shapes, network data, quality
    </text>
    
    <!-- Row 7: Initialization -->
    <rect x="0" y="270" width="200" height="30" fill="#ecf0f1"/>
    <text x="100" y="289" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">
      Initialization
    </text>
    
    <rect x="200" y="270" width="300" height="30" fill="#ffebee"/>
    <text x="350" y="289" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
      Sensitive to initial centroids
    </text>
    
    <rect x="500" y="270" width="300" height="30" fill="#e3f2fd"/>
    <text x="650" y="289" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
      Deterministic (eigendecomposition)
    </text>
  </g>
  
  <!-- When to use each section -->
  <g transform="translate(50, 650)">
    <rect x="0" y="0" width="800" height="45" fill="#f8f9fa" stroke="#bdc3c7" stroke-width="1" rx="5"/>
    <text x="400" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
      Decision Guide
    </text>
    <text x="200" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
      🔴 Use K-Means: Spherical clusters, speed priority, large datasets
    </text>
    <text x="600" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
      🔵 Use Spectral: Complex shapes, network data, quality priority
    </text>
  </g>
</svg>