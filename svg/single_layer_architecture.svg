<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="inputGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#74b9ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0984e3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="hiddenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00b894;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00a085;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="outputGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e17055;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d63031;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="2" orient="auto">
      <path d="M0,0 L0,4 L8,2 z" fill="#2d3436"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="600" fill="#fafafa"/>
  
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">
    Single Hidden Layer Neural Network Architecture
  </text>
  
  <!-- Input Layer -->
  <g transform="translate(50, 100)">
    <text x="60" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
      Input Layer
    </text>
    
    <!-- Input neurons -->
    <circle cx="60" cy="80" r="25" fill="url(#inputGrad)" filter="url(#shadow)"/>
    <text x="60" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white" font-weight="bold">x₁</text>
    <text x="60" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Input 1</text>
    
    <circle cx="60" cy="180" r="25" fill="url(#inputGrad)" filter="url(#shadow)"/>
    <text x="60" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white" font-weight="bold">x₂</text>
    <text x="60" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Input 2</text>
    
    <!-- Dots for more inputs -->
    <circle cx="60" cy="230" r="3" fill="#7f8c8d"/>
    <circle cx="60" cy="245" r="3" fill="#7f8c8d"/>
    <circle cx="60" cy="260" r="3" fill="#7f8c8d"/>
    <text x="60" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">more inputs</text>
  </g>
  
  <!-- Hidden Layer - Preactivation -->
  <g transform="translate(250, 100)">
    <text x="100" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
      Hidden Layer (Preactivation)
    </text>
    
    <!-- Preactivation units -->
    <rect x="50" y="55" width="100" height="50" fill="#ddd" stroke="#bdc3c7" stroke-width="2" rx="10"/>
    <text x="100" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50" font-weight="bold">z₁ = Σwᵢⱼxⱼ</text>
    <text x="100" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Weighted Sum</text>
    <text x="100" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Unit 1</text>
    
    <rect x="50" y="155" width="100" height="50" fill="#ddd" stroke="#bdc3c7" stroke-width="2" rx="10"/>
    <text x="100" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50" font-weight="bold">z₂ = Σwᵢⱼxⱼ</text>
    <text x="100" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Weighted Sum</text>
    <text x="100" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Unit 2</text>
    
    <!-- Dots -->
    <circle cx="100" cy="250" r="3" fill="#7f8c8d"/>
    <circle cx="100" cy="265" r="3" fill="#7f8c8d"/>
    <circle cx="100" cy="280" r="3" fill="#7f8c8d"/>
  </g>
  
  <!-- Hidden Layer - Activation -->
  <g transform="translate(450, 100)">
    <text x="70" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
      Activation
    </text>
    
    <!-- Activation neurons -->
    <circle cx="70" cy="80" r="25" fill="url(#hiddenGrad)" filter="url(#shadow)"/>
    <text x="70" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white" font-weight="bold">a₁</text>
    <text x="70" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">ReLU(z₁)</text>
    
    <circle cx="70" cy="180" r="25" fill="url(#hiddenGrad)" filter="url(#shadow)"/>
    <text x="70" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white" font-weight="bold">a₂</text>
    <text x="70" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">ReLU(z₂)</text>
    
    <!-- Dots -->
    <circle cx="70" cy="250" r="3" fill="#7f8c8d"/>
    <circle cx="70" cy="265" r="3" fill="#7f8c8d"/>
    <circle cx="70" cy="280" r="3" fill="#7f8c8d"/>
  </g>
  
  <!-- Output Layer -->
  <g transform="translate(650, 100)">
    <text x="90" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
      Output Layer
    </text>
    
    <!-- Output preactivation -->
    <rect x="40" y="130" width="100" height="50" fill="#fdeaa7" stroke="#fdcb6e" stroke-width="2" rx="10"/>
    <text x="90" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50" font-weight="bold">z = Σvᵢaᵢ</text>
    <text x="90" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Output Sum</text>
    
    <!-- Output activation -->
    <circle cx="90" cy="230" r="25" fill="url(#outputGrad)" filter="url(#shadow)"/>
    <text x="90" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white" font-weight="bold">ŷ</text>
    <text x="90" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">σ(z)</text>
  </g>
  
  <!-- Loss Function -->
  <g transform="translate(800, 200)">
    <rect x="0" y="0" width="80" height="60" fill="#fab1a0" stroke="#e17055" stroke-width="2" rx="10"/>
    <text x="40" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50" font-weight="bold">ℒ</text>
    <text x="40" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Loss</text>
    <text x="40" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">Function</text>
  </g>
  
  <!-- Connections from Input to Hidden (Preactivation) -->
  <g stroke="#2d3436" stroke-width="2">
    <!-- From x1 -->
    <line x1="135" y1="180" x2="250" y2="180" marker-end="url(#arrow)"/>
    <line x1="135" y1="180" x2="250" y2="280" marker-end="url(#arrow)"/>
    <text x="180" y="170" font-family="Arial, sans-serif" font-size="9" fill="#2d3436">w₁₁</text>
    <text x="180" y="240" font-family="Arial, sans-serif" font-size="9" fill="#2d3436">w₂₁</text>
    
    <!-- From x2 -->
    <line x1="135" y1="280" x2="250" y2="180" marker-end="url(#arrow)"/>
    <line x1="135" y1="280" x2="250" y2="280" marker-end="url(#arrow)"/>
    <text x="180" y="220" font-family="Arial, sans-serif" font-size="9" fill="#2d3436">w₁₂</text>
    <text x="180" y="290" font-family="Arial, sans-serif" font-size="9" fill="#2d3436">w₂₂</text>
  </g>
  
  <!-- Connections from Preactivation to Activation -->
  <g stroke="#27ae60" stroke-width="3">
    <line x1="350" y1="180" x2="445" y2="180" marker-end="url(#arrow)"/>
    <line x1="350" y1="280" x2="445" y2="280" marker-end="url(#arrow)"/>
    <text x="395" y="170" font-family="Arial, sans-serif" font-size="10" fill="#27ae60" font-weight="bold">ReLU</text>
    <text x="395" y="270" font-family="Arial, sans-serif" font-size="10" fill="#27ae60" font-weight="bold">ReLU</text>
  </g>
  
  <!-- Connections from Hidden to Output -->
  <g stroke="#2d3436" stroke-width="2">
    <line x1="520" y1="180" x2="650" y2="255" marker-end="url(#arrow)"/>
    <line x1="520" y1="280" x2="650" y2="255" marker-end="url(#arrow)"/>
    <text x="570" y="210" font-family="Arial, sans-serif" font-size="9" fill="#2d3436">v₁</text>
    <text x="570" y="270" font-family="Arial, sans-serif" font-size="9" fill="#2d3436">v₂</text>
  </g>
  
  <!-- Connection from Output Preactivation to Activation -->
  <g stroke="#e17055" stroke-width="3">
    <line x1="740" y1="255" x2="740" y2="305" marker-end="url(#arrow)"/>
    <text x="750" y="280" font-family="Arial, sans-serif" font-size="10" fill="#e17055" font-weight="bold">σ</text>
  </g>
  
  <!-- Connection to Loss -->
  <g stroke="#2d3436" stroke-width="2">
    <line x1="765" y1="330" x2="800" y2="330" marker-end="url(#arrow)"/>
  </g>
  
  <!-- Processing Steps Box -->
  <g transform="translate(50, 420)">
    <rect x="0" y="0" width="800" height="140" fill="white" stroke="#bdc3c7" stroke-width="2" rx="10" filter="url(#shadow)"/>
    
    <text x="20" y="25" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50" font-weight="bold">
      Processing Steps:
    </text>
    
    <g transform="translate(20, 35)">
      <!-- Step 1 -->
      <rect x="0" y="10" width="150" height="30" fill="#dfe6e9" stroke="#b2bec3" rx="5"/>
      <text x="75" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50" font-weight="bold">1. Linear Combination</text>
      <text x="75" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">z = Σwᵢⱼxⱼ + b</text>
      
      <!-- Arrow -->
      <line x1="155" y1="25" x2="185" y2="25" stroke="#2d3436" stroke-width="2" marker-end="url(#arrow)"/>
      
      <!-- Step 2 -->
      <rect x="190" y="10" width="150" height="30" fill="#d1f2eb" stroke="#52c41a" rx="5"/>
      <text x="265" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50" font-weight="bold">2. Non-linear Activation</text>
      <text x="265" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">a = ReLU(z) = max(0,z)</text>
      
      <!-- Arrow -->
      <line x1="345" y1="25" x2="375" y2="25" stroke="#2d3436" stroke-width="2" marker-end="url(#arrow)"/>
      
      <!-- Step 3 -->
      <rect x="380" y="10" width="150" height="30" fill="#fef9e7" stroke="#faad14" rx="5"/>
      <text x="455" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50" font-weight="bold">3. Output Combination</text>
      <text x="455" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">z = Σvᵢaᵢ + c</text>
      
      <!-- Arrow -->
      <line x1="535" y1="25" x2="565" y2="25" stroke="#2d3436" stroke-width="2" marker-end="url(#arrow)"/>
      
      <!-- Step 4 -->
      <rect x="570" y="10" width="150" height="30" fill="#ffe7e6" stroke="#ff4d4f" rx="5"/>
      <text x="645" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50" font-weight="bold">4. Output Activation</text>
      <text x="645" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">ŷ = σ(z) = 1/(1+e⁻ᶻ)</text>
    </g>
    
    <!-- Key Properties -->
    <g transform="translate(20, 80)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50" font-weight="bold">Key Properties:</text>
      <text x="0" y="18" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• <tspan font-weight="bold">Universal Approximation:</tspan> Single hidden layer can approximate any continuous function</text>
      <text x="0" y="32" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• <tspan font-weight="bold">ReLU Activation:</tspan> Introduces non-linearity while maintaining sparse gradients</text>
      <text x="0" y="46" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• <tspan font-weight="bold">Parameter Count:</tspan> (input_size × hidden_size) + (hidden_size × output_size) + biases</text>
    </g>
  </g>
</svg>