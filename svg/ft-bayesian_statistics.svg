<svg width="1200" height="675" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="675" fill="#f8f9fa"/>
  
  <!-- Fast Track Ribbon -->
  <polygon points="1050,0 1200,0 1200,150" fill="#e74c3c"/>
  <text x="1125" y="75" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" transform="rotate(45 1125 75)">FAST TRACK</text>
  
  <!-- Title -->
  <text x="600" y="50" fill="#2c3e50" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle">Bayesian Statistics in Python</text>
  
  <!-- Bayes Theorem -->
  <rect x="100" y="80" width="1000" height="60" fill="#3498db" stroke="#2c3e50" stroke-width="2" rx="10"/>
  <text x="600" y="105" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Bayes Theorem</text>
  <text x="600" y="125" fill="white" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">P(theta given data) = P(data given theta) * P(theta) / P(data)</text>
  
  <!-- Components -->
  <rect x="50" y="170" width="270" height="100" fill="#27ae60" stroke="#2c3e50" stroke-width="2" rx="10"/>
  <text x="185" y="200" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Prior P(theta)</text>
  <text x="185" y="220" fill="white" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Initial belief</text>
  <text x="185" y="240" fill="white" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Before seeing data</text>
  <text x="185" y="260" fill="white" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Domain knowledge</text>
  
  <rect x="340" y="170" width="270" height="100" fill="#f39c12" stroke="#2c3e50" stroke-width="2" rx="10"/>
  <text x="475" y="200" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Likelihood P(data given theta)</text>
  <text x="475" y="220" fill="white" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">How likely is data</text>
  <text x="475" y="240" fill="white" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">given parameters</text>
  <text x="475" y="260" fill="white" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Model fit</text>
  
  <rect x="630" y="170" width="270" height="100" fill="#9b59b6" stroke="#2c3e50" stroke-width="2" rx="10"/>
  <text x="765" y="200" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Evidence P(data)</text>
  <text x="765" y="220" fill="white" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Marginal likelihood</text>
  <text x="765" y="240" fill="white" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Normalization</text>
  <text x="765" y="260" fill="white" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Often intractable</text>
  
  <rect x="920" y="170" width="270" height="100" fill="#e74c3c" stroke="#2c3e50" stroke-width="2" rx="10"/>
  <text x="1055" y="200" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Posterior P(theta given data)</text>
  <text x="1055" y="220" fill="white" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Updated belief</text>
  <text x="1055" y="240" fill="white" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">After seeing data</text>
  <text x="1055" y="260" fill="white" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Goal of inference</text>
  
  <!-- PyMC3 Components -->
  <text x="100" y="320" fill="#2c3e50" font-family="Arial, sans-serif" font-size="18" font-weight="bold">PyMC3 Workflow:</text>
  
  <rect x="50" y="340" width="180" height="80" fill="#ecf0f1" stroke="#34495e" stroke-width="1" rx="5"/>
  <text x="140" y="365" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">1. Define Model</text>
  <text x="140" y="385" fill="#7f8c8d" font-family="monospace" font-size="11" text-anchor="middle">pm.Model()</text>
  <text x="140" y="405" fill="#7f8c8d" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Priors and likelihood</text>
  
  <rect x="250" y="340" width="180" height="80" fill="#ecf0f1" stroke="#34495e" stroke-width="1" rx="5"/>
  <text x="340" y="365" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">2. Sample</text>
  <text x="340" y="385" fill="#7f8c8d" font-family="monospace" font-size="11" text-anchor="middle">pm.sample()</text>
  <text x="340" y="405" fill="#7f8c8d" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">MCMC/NUTS</text>
  
  <rect x="450" y="340" width="180" height="80" fill="#ecf0f1" stroke="#34495e" stroke-width="1" rx="5"/>
  <text x="540" y="365" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">3. Diagnose</text>
  <text x="540" y="385" fill="#7f8c8d" font-family="monospace" font-size="11" text-anchor="middle">pm.summary()</text>
  <text x="540" y="405" fill="#7f8c8d" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">R-hat, ESS</text>
  
  <rect x="650" y="340" width="180" height="80" fill="#ecf0f1" stroke="#34495e" stroke-width="1" rx="5"/>
  <text x="740" y="365" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">4. Analyze</text>
  <text x="740" y="385" fill="#7f8c8d" font-family="monospace" font-size="11" text-anchor="middle">pm.plot_trace()</text>
  <text x="740" y="405" fill="#7f8c8d" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Posterior plots</text>
  
  <rect x="850" y="340" width="180" height="80" fill="#ecf0f1" stroke="#34495e" stroke-width="1" rx="5"/>
  <text x="940" y="365" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">5. Compare</text>
  <text x="940" y="385" fill="#7f8c8d" font-family="monospace" font-size="11" text-anchor="middle">pm.compare()</text>
  <text x="940" y="405" fill="#7f8c8d" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">WAIC, LOO</text>
  
  <!-- Arrows -->
  <path d="M 230 380 L 250 380" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 430 380 L 450 380" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 630 380 L 650 380" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 830 380 L 850 380" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Code Example -->
  <rect x="50" y="450" width="1100" height="120" fill="#2c3e50" stroke="#34495e" stroke-width="2" rx="5"/>
  <text x="70" y="480" fill="#f39c12" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Example Code:</text>
  <text x="70" y="510" fill="#ecf0f1" font-family="monospace" font-size="14">import pymc3 as pm</text>
  <text x="70" y="530" fill="#ecf0f1" font-family="monospace" font-size="14">with pm.Model() as model:</text>
  <text x="70" y="550" fill="#ecf0f1" font-family="monospace" font-size="14">    mu = pm.Normal('mu', mu=0, sigma=1)  # Prior</text>
  
  <!-- Advantages -->
  <rect x="50" y="590" width="350" height="70" fill="#e8f8f5" stroke="#27ae60" stroke-width="2" rx="5"/>
  <text x="70" y="615" fill="#27ae60" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Advantages:</text>
  <text x="70" y="635" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12">• Uncertainty quantification</text>
  <text x="70" y="650" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12">• Incorporates prior knowledge</text>
  
  <!-- Applications -->
  <rect x="420" y="590" width="350" height="70" fill="#fef9e7" stroke="#f39c12" stroke-width="2" rx="5"/>
  <text x="440" y="615" fill="#f39c12" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Applications:</text>
  <text x="440" y="635" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12">• A/B testing, medical trials</text>
  <text x="440" y="650" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12">• Hierarchical modeling</text>
  
  <!-- Concepts -->
  <rect x="790" y="590" width="360" height="70" fill="#fdedec" stroke="#e74c3c" stroke-width="2" rx="5"/>
  <text x="810" y="615" fill="#e74c3c" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Key Concepts:</text>
  <text x="810" y="635" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12">• Credible intervals (not confidence)</text>
  <text x="810" y="650" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12">• MCMC sampling convergence</text>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/>
    </marker>
  </defs>
</svg>