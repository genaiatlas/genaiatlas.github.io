<svg viewBox="0 0 1400 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1400" height="800" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="700" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Document Processing Pipeline
  </text>
  
  <!-- Markers -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#495057"/>
    </marker>
  </defs>
  
  <!-- Stage 1: Document Ingestion -->
  <g id="stage1">
    <rect x="50" y="100" width="250" height="140" rx="10" fill="#fff3bf" stroke="#f59f00" stroke-width="3"/>
    <text x="175" y="130" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      1. Document Ingestion
    </text>
    <text x="175" y="160" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#495057">
      Load from sources:
    </text>
    <text x="175" y="180" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#495057">
      • Files (PDF, DOCX, TXT)
    </text>
    <text x="175" y="200" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#495057">
      • Databases
    </text>
    <text x="175" y="220" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#495057">
      • APIs &amp; Web scraping
    </text>
  </g>
  
  <!-- Arrow 1 -->
  <line x1="300" y1="170" x2="350" y2="170" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  
  <!-- Stage 2: Text Extraction -->
  <g id="stage2">
    <rect x="350" y="100" width="250" height="140" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="3"/>
    <text x="475" y="130" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      2. Text Extraction
    </text>
    <text x="475" y="160" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#495057">
      Parse &amp; extract:
    </text>
    <text x="475" y="180" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#495057">
      • OCR for images
    </text>
    <text x="475" y="200" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#495057">
      • PDF text extraction
    </text>
    <text x="475" y="220" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#495057">
      • HTML cleaning
    </text>
  </g>
  
  <!-- Arrow 2 -->
  <line x1="600" y1="170" x2="650" y2="170" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  
  <!-- Stage 3: Preprocessing -->
  <g id="stage3">
    <rect x="650" y="100" width="250" height="140" rx="10" fill="#d0bfff" stroke="#7950f2" stroke-width="3"/>
    <text x="775" y="130" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      3. Text Preprocessing
    </text>
    <text x="775" y="160" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#495057">
      Clean &amp; normalize:
    </text>
    <text x="775" y="180" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#495057">
      • Remove artifacts
    </text>
    <text x="775" y="200" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#495057">
      • Fix encoding
    </text>
    <text x="775" y="220" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#495057">
      • Preserve structure
    </text>
  </g>
  
  <!-- Arrow 3 -->
  <line x1="900" y1="170" x2="950" y2="170" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  
  <!-- Stage 4: Chunking -->
  <g id="stage4">
    <rect x="950" y="100" width="250" height="140" rx="10" fill="#c3fae8" stroke="#12b886" stroke-width="3"/>
    <text x="1075" y="130" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      4. Chunking
    </text>
    <text x="1075" y="160" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#495057">
      Split strategically:
    </text>
    <text x="1075" y="180" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#495057">
      • Fixed size / Semantic
    </text>
    <text x="1075" y="200" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#495057">
      • With overlap
    </text>
    <text x="1075" y="220" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#495057">
      • Preserve context
    </text>
  </g>
  
  <!-- Arrow 4 down -->
  <line x1="1075" y1="240" x2="1075" y2="290" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  
  <!-- Stage 5: Embedding Generation -->
  <g id="stage5">
    <rect x="950" y="290" width="250" height="140" rx="10" fill="#ffd8a8" stroke="#fd7e14" stroke-width="3"/>
    <text x="1075" y="320" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      5. Embedding Generation
    </text>
    <text x="1075" y="350" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#495057">
      Convert to vectors:
    </text>
    <text x="1075" y="370" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#495057">
      • Batch processing
    </text>
    <text x="1075" y="390" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#495057">
      • Model selection
    </text>
    <text x="1075" y="410" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#495057">
      • Normalization
    </text>
  </g>
  
  <!-- Arrow 5 left -->
  <line x1="950" y1="360" x2="900" y2="360" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  
  <!-- Stage 6: Metadata Extraction -->
  <g id="stage6">
    <rect x="650" y="290" width="250" height="140" rx="10" fill="#ffdeeb" stroke="#e64980" stroke-width="3"/>
    <text x="775" y="320" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      6. Metadata Extraction
    </text>
    <text x="775" y="350" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#495057">
      Extract &amp; tag:
    </text>
    <text x="775" y="370" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#495057">
      • Document properties
    </text>
    <text x="775" y="390" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#495057">
      • Chunk location
    </text>
    <text x="775" y="410" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#495057">
      • Custom fields
    </text>
  </g>
  
  <!-- Arrow 6 left -->
  <line x1="650" y1="360" x2="600" y2="360" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  
  <!-- Stage 7: Index Creation -->
  <g id="stage7">
    <rect x="350" y="290" width="250" height="140" rx="10" fill="#fcc2d7" stroke="#c2255c" stroke-width="3"/>
    <text x="475" y="320" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      7. Index Creation
    </text>
    <text x="475" y="350" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#495057">
      Build structures:
    </text>
    <text x="475" y="370" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#495057">
      • Vector index (HNSW)
    </text>
    <text x="475" y="390" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#495057">
      • Keyword index (BM25)
    </text>
    <text x="475" y="410" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#495057">
      • Metadata filters
    </text>
  </g>
  
  <!-- Arrow 7 left -->
  <line x1="350" y1="360" x2="300" y2="360" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  
  <!-- Stage 8: Storage -->
  <g id="stage8">
    <rect x="50" y="290" width="250" height="140" rx="10" fill="#51cf66" stroke="#2f9e44" stroke-width="3"/>
    <text x="175" y="320" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">
      8. Storage
    </text>
    <text x="175" y="350" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">
      Persist to:
    </text>
    <text x="175" y="370" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
      • Vector database
    </text>
    <text x="175" y="390" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
      • Search engine
    </text>
    <text x="175" y="410" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
      • Metadata store
    </text>
  </g>
  
  <!-- Bottom stats panel -->
  <g id="stats">
    <rect x="50" y="480" width="1150" height="280" rx="10" fill="#fff" stroke="#868e96" stroke-width="2"/>
    <text x="625" y="520" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Pipeline Considerations
    </text>
    
    <!-- Left column -->
    <text x="80" y="560" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#495057">
      Quality Factors:
    </text>
    <text x="80" y="585" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Text extraction accuracy (OCR, PDF parsing)
    </text>
    <text x="80" y="605" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Chunking strategy (semantic vs. fixed)
    </text>
    <text x="80" y="625" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Embedding model selection
    </text>
    <text x="80" y="645" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Metadata completeness
    </text>
    <text x="80" y="665" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Index structure optimization
    </text>
    
    <!-- Middle column -->
    <text x="450" y="560" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#495057">
      Performance Factors:
    </text>
    <text x="450" y="585" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Batch processing for embeddings
    </text>
    <text x="450" y="605" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Parallel document processing
    </text>
    <text x="450" y="625" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Caching strategies
    </text>
    <text x="450" y="645" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Incremental updates
    </text>
    <text x="450" y="665" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Index compression
    </text>
    
    <!-- Right column -->
    <text x="820" y="560" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#495057">
      Cost Factors:
    </text>
    <text x="820" y="585" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Embedding API costs
    </text>
    <text x="820" y="605" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Storage requirements
    </text>
    <text x="820" y="625" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Compute resources
    </text>
    <text x="820" y="645" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Re-indexing frequency
    </text>
    <text x="820" y="665" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Maintenance overhead
    </text>
    
    <!-- Bottom note -->
    <rect x="70" y="690" width="1110" height="55" rx="5" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
    <text x="625" y="715" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      💡 Key Insight
    </text>
    <text x="625" y="735" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#495057">
      The quality of your indexing pipeline directly impacts retrieval accuracy and system performance—invest time in optimization early.
    </text>
  </g>
</svg>