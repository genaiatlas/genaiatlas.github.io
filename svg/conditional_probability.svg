<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="24" font-weight="bold" fill="#2c3e50">
    Conditional Probability and Independence
  </text>
  
  <!-- Left side: Conditional Probability -->
  <text x="200" y="70" text-anchor="middle" font-size="18" font-weight="bold" fill="#3498db">
    Conditional Probability
  </text>
  
  <!-- Sample Space for conditional -->
  <rect x="50" y="90" width="300" height="200" fill="none" stroke="#3498db" stroke-width="2"/>
  <text x="60" y="110" font-size="14" fill="#3498db">Ω</text>
  
  <!-- Event B (Given condition) -->
  <rect x="100" y="140" width="200" height="100" fill="#f39c12" fill-opacity="0.3" stroke="#f39c12" stroke-width="2"/>
  <text x="200" y="170" text-anchor="middle" font-size="16" font-weight="bold" fill="#f39c12">B (Given)</text>
  
  <!-- Event A ∩ B -->
  <rect x="150" y="160" width="100" height="60" fill="#e74c3c" fill-opacity="0.6" stroke="#e74c3c" stroke-width="2"/>
  <text x="200" y="195" text-anchor="middle" font-size="14" font-weight="bold" fill="#e74c3c">A ∩ B</text>
  
  <!-- Formula -->
  <rect x="50" y="310" width="300" height="40" fill="#ecf0f1" stroke="#bdc3c7"/>
  <text x="200" y="335" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">
    P(A|B) = P(A ∩ B) / P(B)
  </text>
  
  <!-- Right side: Independence -->
  <text x="600" y="70" text-anchor="middle" font-size="18" font-weight="bold" fill="#27ae60">
    Independence
  </text>
  
  <!-- Independent Events -->
  <rect x="450" y="90" width="300" height="200" fill="none" stroke="#27ae60" stroke-width="2"/>
  <text x="460" y="110" font-size="14" fill="#27ae60">Ω</text>
  
  <!-- Event A (Independent) -->
  <circle cx="530" cy="180" r="40" fill="#3498db" fill-opacity="0.3" stroke="#3498db" stroke-width="2"/>
  <text x="530" y="185" text-anchor="middle" font-size="16" font-weight="bold" fill="#3498db">A</text>
  
  <!-- Event B (Independent) -->
  <circle cx="620" cy="180" r="40" fill="#e74c3c" fill-opacity="0.3" stroke="#e74c3c" stroke-width="2"/>
  <text x="620" y="185" text-anchor="middle" font-size="16" font-weight="bold" fill="#e74c3c">B</text>
  
  <!-- Independence Formula -->
  <rect x="450" y="310" width="300" height="40" fill="#ecf0f1" stroke="#bdc3c7"/>
  <text x="600" y="335" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">
    P(A ∩ B) = P(A) × P(B)
  </text>
  
  <!-- Comparison Table -->
  <rect x="100" y="380" width="600" height="180" fill="#ffffff" stroke="#bdc3c7" stroke-width="1"/>
  <text x="400" y="405" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50">
    Event Relationships
  </text>
  
  <!-- Table Headers -->
  <line x1="100" y1="420" x2="700" y2="420" stroke="#bdc3c7"/>
  <line x1="250" y1="420" x2="250" y2="560" stroke="#bdc3c7"/>
  <line x1="450" y1="420" x2="450" y2="560" stroke="#bdc3c7"/>
  
  <text x="175" y="440" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">Type</text>
  <text x="350" y="440" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">Condition</text>
  <text x="575" y="440" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">Formula</text>
  
  <!-- Table Rows -->
  <line x1="100" y1="450" x2="700" y2="450" stroke="#bdc3c7"/>
  
  <text x="175" y="470" text-anchor="middle" font-size="12" fill="#3498db">Dependent</text>
  <text x="350" y="470" text-anchor="middle" font-size="12" fill="#2c3e50">P(A|B) ≠ P(A)</text>
  <text x="575" y="470" text-anchor="middle" font-size="12" fill="#2c3e50">P(A|B) = P(A∩B)/P(B)</text>
  
  <line x1="100" y1="480" x2="700" y2="480" stroke="#ecf0f1"/>
  
  <text x="175" y="500" text-anchor="middle" font-size="12" fill="#27ae60">Independent</text>
  <text x="350" y="500" text-anchor="middle" font-size="12" fill="#2c3e50">P(A|B) = P(A)</text>
  <text x="575" y="500" text-anchor="middle" font-size="12" fill="#2c3e50">P(A∩B) = P(A)×P(B)</text>
  
  <line x1="100" y1="510" x2="700" y2="510" stroke="#ecf0f1"/>
  
  <text x="175" y="530" text-anchor="middle" font-size="12" fill="#e74c3c">Mutually Exclusive</text>
  <text x="350" y="530" text-anchor="middle" font-size="12" fill="#2c3e50">P(A∩B) = 0</text>
  <text x="575" y="530" text-anchor="middle" font-size="12" fill="#2c3e50">P(A∪B) = P(A)+P(B)</text>
</svg>