<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="500" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">
    PCA: Finding Directions of Maximum Variance
  </text>
  
  <!-- Original 3D coordinate system -->
  <g transform="translate(150, 100)">
    <!-- Axes -->
    <line x1="0" y1="200" x2="150" y2="200" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="0" y1="200" x2="0" y2="50" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="0" y1="200" x2="-75" y2="125" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Axis labels -->
    <text x="160" y="205" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">X₁</text>
    <text x="-5" y="40" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">X₂</text>
    <text x="-90" y="115" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">X₃</text>
    
    <!-- Data points cloud -->
    <ellipse cx="40" cy="120" rx="60" ry="30" fill="rgba(52, 152, 219, 0.3)" stroke="#3498db" stroke-width="2" transform="rotate(-20 40 120)"/>
    
    <!-- Sample data points -->
    <circle cx="20" cy="125" r="3" fill="#e74c3c"/>
    <circle cx="35" cy="115" r="3" fill="#e74c3c"/>
    <circle cx="50" cy="108" r="3" fill="#e74c3c"/>
    <circle cx="45" cy="130" r="3" fill="#e74c3c"/>
    <circle cx="60" cy="120" r="3" fill="#e74c3c"/>
    <circle cx="30" cy="140" r="3" fill="#e74c3c"/>
    <circle cx="55" cy="135" r="3" fill="#e74c3c"/>
    <circle cx="40" cy="110" r="3" fill="#e74c3c"/>
    
    <!-- PC1 arrow (main direction) -->
    <line x1="10" y1="145" x2="90" y2="95" stroke="#e67e22" stroke-width="4" marker-end="url(#orangeArrow)"/>
    <text x="95" y="90" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e67e22">PC1</text>
    <text x="95" y="105" font-family="Arial, sans-serif" font-size="12" fill="#e67e22">(Max Variance)</text>
    
    <!-- PC2 arrow (perpendicular) -->
    <line x1="25" y1="100" x2="60" y2="150" stroke="#9b59b6" stroke-width="3" marker-end="url(#purpleArrow)"/>
    <text x="65" y="155" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#9b59b6">PC2</text>
    <text x="65" y="170" font-family="Arial, sans-serif" font-size="12" fill="#9b59b6">(2nd Max)</text>
    
    <!-- Label -->
    <text x="0" y="250" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">High-Dimensional Data</text>
  </g>
  
  <!-- Arrow indicating transformation -->
  <g transform="translate(350, 250)">
    <line x1="0" y1="0" x2="80" y2="0" stroke="#2c3e50" stroke-width="3" marker-end="url(#arrowhead)"/>
    <text x="40" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">PCA</text>
    <text x="40" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Projection</text>
  </g>
  
  <!-- 2D projected result -->
  <g transform="translate(500, 100)">
    <!-- 2D axes -->
    <line x1="0" y1="200" x2="180" y2="200" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="0" y1="200" x2="0" y2="50" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Axis labels -->
    <text x="190" y="205" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">PC1</text>
    <text x="-15" y="40" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">PC2</text>
    
    <!-- Projected data points -->
    <circle cx="30" cy="150" r="3" fill="#e74c3c"/>
    <circle cx="50" cy="140" r="3" fill="#e74c3c"/>
    <circle cx="70" cy="130" r="3" fill="#e74c3c"/>
    <circle cx="60" cy="160" r="3" fill="#e74c3c"/>
    <circle cx="90" cy="125" r="3" fill="#e74c3c"/>
    <circle cx="40" cy="170" r="3" fill="#e74c3c"/>
    <circle cx="80" cy="155" r="3" fill="#e74c3c"/>
    <circle cx="55" cy="135" r="3" fill="#e74c3c"/>
    
    <!-- Variance indicators -->
    <line x1="20" y1="80" x2="100" y2="80" stroke="#e67e22" stroke-width="3"/>
    <text x="110" y="85" font-family="Arial, sans-serif" font-size="12" fill="#e67e22">High Variance</text>
    
    <line x1="150" y1="120" x2="150" y2="180" stroke="#9b59b6" stroke-width="3"/>
    <text x="160" y="155" font-family="Arial, sans-serif" font-size="12" fill="#9b59b6">Lower Variance</text>
    
    <!-- Label -->
    <text x="0" y="250" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">2D Representation</text>
  </g>
  
  <!-- Legend -->
  <g transform="translate(50, 400)">
    <rect x="0" y="0" width="700" height="80" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" rx="5"/>
    <text x="20" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Key Concepts:</text>
    
    <circle cx="30" cy="45" r="3" fill="#e74c3c"/>
    <text x="40" y="50" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Data Points</text>
    
    <line x1="130" y1="45" x2="160" y2="45" stroke="#e67e22" stroke-width="3"/>
    <text x="170" y="50" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">PC1: Direction of Maximum Variance</text>
    
    <line x1="380" y1="45" x2="410" y2="45" stroke="#9b59b6" stroke-width="3"/>
    <text x="420" y="50" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">PC2: Second Maximum (⊥ to PC1)</text>
    
    <text x="20" y="70" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">
      PCA preserves directions with highest variance, enabling dimensionality reduction while retaining information
    </text>
  </g>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e"/>
    </marker>
    <marker id="orangeArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e67e22"/>
    </marker>
    <marker id="purpleArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9b59b6"/>
    </marker>
  </defs>
</svg>