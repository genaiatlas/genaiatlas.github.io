<svg viewBox="0 0 800 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title-text { font-family: 'Arial', sans-serif; font-size: 24px; font-weight: bold; fill: #2c3e50; }
      .subtitle-text { font-family: 'Arial', sans-serif; font-size: 18px; font-weight: bold; fill: #34495e; }
      .label-text { font-family: 'Arial', sans-serif; font-size: 14px; fill: #34495e; }
      .small-text { font-family: 'Arial', sans-serif; font-size: 12px; fill: #7f8c8d; }
      .equation-text { font-family: 'Times New Roman', serif; font-size: 14px; fill: #2c3e50; }
      .tv-box { fill: #e8f5e8; stroke: #28a745; stroke-width: 2; rx: 10; }
      .radio-box { fill: #e3f2fd; stroke: #2196f3; stroke-width: 2; rx: 10; }
      .newspaper-box { fill: #fdeaea; stroke: #dc3545; stroke-width: 2; rx: 10; }
      .combined-box { fill: #fff3cd; stroke: #ffc107; stroke-width: 2; rx: 10; }
      .comparison-box { fill: #f8f9fa; stroke: #6c757d; stroke-width: 1; rx: 5; }
      .r2-bar-tv { fill: #28a745; }
      .r2-bar-radio { fill: #2196f3; }
      .r2-bar-newspaper { fill: #dc3545; }
      .r2-bar-combined { fill: #ffc107; }
    </style>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title-text">Individual Variable Performance Analysis</text>
  
  <!-- TV Performance -->
  <g transform="translate(50, 70)">
    <rect x="0" y="0" width="160" height="150" class="tv-box"/>
    <text x="80" y="25" text-anchor="middle" class="subtitle-text" fill="#155724">📺 TV Advertising</text>
    
    <text x="80" y="50" text-anchor="middle" class="equation-text">R² = 0.61</text>
    <text x="80" y="70" text-anchor="middle" class="small-text">61% variance explained</text>
    
    <!-- R² bar -->
    <rect x="20" y="85" width="122" height="15" class="r2-bar-tv"/>
    <text x="80" y="97" text-anchor="middle" class="small-text" fill="white">Strong individual effect</text>
    
    <text x="20" y="120" class="small-text">• Solid predictive power</text>
    <text x="20" y="135" class="small-text">• Reliable advertising channel</text>
  </g>
  
  <!-- Radio Performance -->
  <g transform="translate(230, 70)">
    <rect x="0" y="0" width="160" height="150" class="radio-box"/>
    <text x="80" y="25" text-anchor="middle" class="subtitle-text" fill="#1976d2">📻 Radio Advertising</text>
    
    <text x="80" y="50" text-anchor="middle" class="equation-text">R² = 0.33</text>
    <text x="80" y="70" text-anchor="middle" class="small-text">33% variance explained</text>
    
    <!-- R² bar -->
    <rect x="20" y="85" width="66" height="15" class="r2-bar-radio"/>
    <text x="80" y="97" text-anchor="middle" class="small-text">Moderate effect</text>
    
    <text x="20" y="120" class="small-text">• Moderate predictive power</text>
    <text x="20" y="135" class="small-text">• Secondary channel</text>
  </g>
  
  <!-- Newspaper Performance -->
  <g transform="translate(410, 70)">
    <rect x="0" y="0" width="160" height="150" class="newspaper-box"/>
    <text x="80" y="25" text-anchor="middle" class="subtitle-text" fill="#721c24">📰 Newspaper Advertising</text>
    
    <text x="80" y="50" text-anchor="middle" class="equation-text">R² = 0.05</text>
    <text x="80" y="70" text-anchor="middle" class="small-text">5% variance explained</text>
    
    <!-- R² bar -->
    <rect x="20" y="85" width="10" height="15" class="r2-bar-newspaper"/>
    <text x="80" y="97" text-anchor="middle" class="small-text">Minimal effect</text>
    
    <text x="20" y="120" class="small-text">• Poor predictive power</text>
    <text x="20" y="135" class="small-text">• Questionable value</text>
  </g>
  
  <!-- Combined Model -->
  <g transform="translate(590, 70)">
    <rect x="0" y="0" width="160" height="150" class="combined-box"/>
    <text x="80" y="25" text-anchor="middle" class="subtitle-text" fill="#856404">🔄 Combined Model</text>
    
    <text x="80" y="50" text-anchor="middle" class="equation-text">R² = 0.897</text>
    <text x="80" y="70" text-anchor="middle" class="small-text">89.7% variance explained</text>
    
    <!-- R² bar -->
    <rect x="20" y="85" width="120" height="15" class="r2-bar-combined"/>
    <text x="80" y="97" text-anchor="middle" class="small-text">Excellent fit</text>
    
    <text x="20" y="120" class="small-text">• Synergistic effects</text>
    <text x="20" y="135" class="small-text">• Combined power</text>
  </g>
  
  <!-- R² Comparison Chart -->
  <g transform="translate(50, 250)">
    <text x="350" y="0" text-anchor="middle" class="subtitle-text">R² Comparison Chart</text>
    
    <!-- Chart background -->
    <rect x="0" y="20" width="700" height="200" class="comparison-box"/>
    
    <!-- Y-axis -->
    <line x1="50" y1="40" x2="50" y2="200" stroke="#2c3e50" stroke-width="2"/>
    <!-- X-axis -->
    <line x1="50" y1="200" x2="650" y2="200" stroke="#2c3e50" stroke-width="2"/>
    
    <!-- Y-axis labels -->
    <text x="40" y="45" text-anchor="end" class="small-text">1.0</text>
    <text x="40" y="85" text-anchor="end" class="small-text">0.8</text>
    <text x="40" y="125" text-anchor="end" class="small-text">0.6</text>
    <text x="40" y="165" text-anchor="end" class="small-text">0.4</text>
    <text x="40" y="205" text-anchor="end" class="small-text">0.0</text>
    
    <!-- Grid lines -->
    <line x1="50" y1="40" x2="650" y2="40" stroke="#ecf0f1" stroke-width="1"/>
    <line x1="50" y1="80" x2="650" y2="80" stroke="#ecf0f1" stroke-width="1"/>
    <line x1="50" y1="120" x2="650" y2="120" stroke="#ecf0f1" stroke-width="1"/>
    <line x1="50" y1="160" x2="650" y2="160" stroke="#ecf0f1" stroke-width="1"/>
    
    <!-- Bars -->
    <!-- TV: R² = 0.61 -->
    <rect x="80" y="102.4" width="80" height="97.6" class="r2-bar-tv"/>
    <text x="120" y="215" text-anchor="middle" class="small-text">TV</text>
    <text x="120" y="95" text-anchor="middle" class="small-text" fill="white">0.61</text>
    
    <!-- Radio: R² = 0.33 -->
    <rect x="200" y="147.2" width="80" height="52.8" class="r2-bar-radio"/>
    <text x="240" y="215" text-anchor="middle" class="small-text">Radio</text>
    <text x="240" y="140" text-anchor="middle" class="small-text" fill="white">0.33</text>
    
    <!-- Newspaper: R² = 0.05 -->
    <rect x="320" y="192" width="80" height="8" class="r2-bar-newspaper"/>
    <text x="360" y="215" text-anchor="middle" class="small-text">Newspaper</text>
    <text x="360" y="185" text-anchor="middle" class="small-text">0.05</text>
    
    <!-- Combined: R² = 0.897 -->
    <rect x="480" y="56.48" width="80" height="143.52" class="r2-bar-combined"/>
    <text x="520" y="215" text-anchor="middle" class="small-text">Combined</text>
    <text x="520" y="50" text-anchor="middle" class="small-text">0.897</text>
  </g>
  
  <!-- Synergistic Effects Analysis -->
  <g transform="translate(50, 480)">
    <rect x="0" y="0" width="700" height="120" class="comparison-box"/>
    <text x="350" y="25" text-anchor="middle" class="subtitle-text">Synergistic Effects Analysis</text>
    
    <text x="50" y="55" class="label-text">Individual Performance:</text>
    <text x="70" y="75" class="small-text">• TV alone: 61% (strongest individual predictor)</text>
    <text x="70" y="90" class="small-text">• Radio alone: 33% (moderate individual predictor)</text>
    <text x="70" y="105" class="small-text">• Newspaper alone: 5% (weak individual predictor)</text>
    
    <text x="400" y="55" class="label-text">Combined Performance:</text>
    <text x="420" y="75" class="small-text">• All together: 89.7% (excellent fit)</text>
    <text x="420" y="90" class="small-text">• Improvement: +28.7% over best individual</text>
    <text x="420" y="105" class="small-text">• Synergy: Variables complement each other</text>
  </g>
  
  <!-- Key Insights -->
  <g transform="translate(50, 620)">
    <text x="350" y="0" text-anchor="middle" class="subtitle-text">Key Insights</text>
    
    <text x="100" y="30" class="small-text">📈 Individual contributions vary significantly</text>
    <text x="100" y="45" class="small-text">🔄 Combined model >> sum of individual parts</text>
    <text x="100" y="60" class="small-text">⚡ Synergistic effects reveal interaction benefits</text>
    
    <text x="450" y="30" class="small-text">💡 Variable correlation effects</text>
    <text x="450" y="45" class="small-text">🎯 Complementary information capture</text>
    <text x="450" y="60" class="small-text">📊 Multi-variable modeling superiority</text>
  </g>
</svg>