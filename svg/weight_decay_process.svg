<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    Weight Decay (L2 Regularization) Process
  </text>
  
  <!-- Original Weight Update -->
  <g id="original-update" transform="translate(50, 80)">
    <rect width="300" height="100" rx="8" fill="#e8f4f8" stroke="#3498db" stroke-width="2"/>
    <text x="150" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2980b9">
      Original Weight Update
    </text>
    <text x="150" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#34495e">
      W<tspan dy="3" font-size="10">ij</tspan> <tspan dy="-3">← W</tspan><tspan dy="3" font-size="10">ij</tspan> <tspan dy="-3">- η</tspan> <tspan font-size="16">∂L</tspan>
    </text>
    <text x="150" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#34495e">
      <tspan font-size="16">∂W</tspan><tspan dy="3" font-size="10">ij</tspan>
    </text>
  </g>
  
  <!-- Arrow Down -->
  <path d="M 200 180 L 200 220" stroke="#34495e" stroke-width="3" marker-end="url(#arrowhead)" fill="none"/>
  <text x="240" y="205" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">Add Regularization</text>
  
  <!-- Regularized Weight Update -->
  <g id="regularized-update" transform="translate(50, 240)">
    <rect width="300" height="120" rx="8" fill="#fff3e0" stroke="#f39c12" stroke-width="2"/>
    <text x="150" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#d35400">
      With L2 Regularization
    </text>
    <text x="150" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#34495e">
      W<tspan dy="3" font-size="10">ij</tspan> <tspan dy="-3">← W</tspan><tspan dy="3" font-size="10">ij</tspan> <tspan dy="-3">- η</tspan> (<tspan font-size="16">∂L</tspan> + λW<tspan dy="3" font-size="10">ij</tspan>)
    </text>
    <text x="150" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#34495e">
      <tspan font-size="16">∂W</tspan><tspan dy="3" font-size="10">ij</tspan>
    </text>
    <text x="150" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#e74c3c">
      Regularization Term: λW<tspan dy="3" font-size="10">ij</tspan>
    </text>
  </g>
  
  <!-- Arrow Down -->
  <path d="M 200 360 L 200 400" stroke="#34495e" stroke-width="3" marker-end="url(#arrowhead)" fill="none"/>
  <text x="240" y="385" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">Simplify</text>
  
  <!-- Simplified Form -->
  <g id="simplified-form" transform="translate(50, 420)">
    <rect width="300" height="120" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
    <text x="150" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#229954">
      Simplified Form
    </text>
    <text x="150" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#34495e">
      W<tspan dy="3" font-size="10">ij</tspan> <tspan dy="-3">← W</tspan><tspan dy="3" font-size="10">ij</tspan><tspan dy="-3">(1 - ηλ) - η</tspan> <tspan font-size="16">∂L</tspan>
    </text>
    <text x="150" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#34495e">
      <tspan font-size="16">∂W</tspan><tspan dy="3" font-size="10">ij</tspan>
    </text>
    <text x="150" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#27ae60">
      Weight Decay Factor: (1 - ηλ)
    </text>
  </g>
  
  <!-- Visual Representation -->
  <g id="visual" transform="translate(450, 100)">
    <!-- Before Regularization -->
    <g id="before">
      <text x="150" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#e74c3c">
        Without Weight Decay
      </text>
      
      <!-- Large weights visualization -->
      <rect x="50" y="30" width="200" height="80" rx="8" fill="#fdeaea" stroke="#e74c3c" stroke-width="2"/>
      
      <!-- Weight bars (large) -->
      <rect x="70" y="50" width="40" height="15" fill="#e74c3c"/>
      <text x="90" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">2.5</text>
      
      <rect x="70" y="70" width="60" height="15" fill="#e74c3c"/>
      <text x="100" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">3.8</text>
      
      <rect x="70" y="90" width="35" height="15" fill="#e74c3c"/>
      <text x="87" y="102" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">2.2</text>
      
      <!-- Labels -->
      <text x="140" y="55" font-family="Arial, sans-serif" font-size="10" fill="#34495e">W₁</text>
      <text x="140" y="75" font-family="Arial, sans-serif" font-size="10" fill="#34495e">W₂</text>
      <text x="140" y="95" font-family="Arial, sans-serif" font-size="10" fill="#34495e">W₃</text>
      
      <!-- Problem indicators -->
      <text x="150" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#c0392b">
        Large Weights → Overfitting
      </text>
    </g>
    
    <!-- Arrow -->
    <path d="M 150 140 L 150 180" stroke="#f39c12" stroke-width="3" marker-end="url(#arrowhead-orange)" fill="none"/>
    <text x="200" y="165" font-family="Arial, sans-serif" font-size="12" fill="#d35400">Weight Decay</text>
    
    <!-- After Regularization -->
    <g id="after">
      <text x="150" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#27ae60">
        With Weight Decay
      </text>
      
      <!-- Small weights visualization -->
      <rect x="50" y="220" width="200" height="80" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
      
      <!-- Weight bars (small) -->
      <rect x="70" y="240" width="15" height="15" fill="#27ae60"/>
      <text x="77" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">0.8</text>
      
      <rect x="70" y="260" width="20" height="15" fill="#27ae60"/>
      <text x="80" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">1.1</text>
      
      <rect x="70" y="280" width="12" height="15" fill="#27ae60"/>
      <text x="76" y="292" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">0.6</text>
      
      <!-- Labels -->
      <text x="140" y="245" font-family="Arial, sans-serif" font-size="10" fill="#34495e">W₁</text>
      <text x="140" y="265" font-family="Arial, sans-serif" font-size="10" fill="#34495e">W₂</text>
      <text x="140" y="285" font-family="Arial, sans-serif" font-size="10" fill="#34495e">W₃</text>
      
      <!-- Benefit indicators -->
      <text x="150" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#229954">
        Small Weights → Better Generalization
      </text>
    </g>
  </g>
  
  <!-- Parameter Explanation Box -->
  <g id="parameters" transform="translate(50, 570)">
    <rect width="700" height="25" rx="8" fill="#f1f2f6" stroke="#57606f" stroke-width="1"/>
    <text x="20" y="17" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">
      <tspan font-weight="bold">Parameters:</tspan>
      <tspan dx="20">η = learning rate</tspan>
      <tspan dx="40">λ = regularization strength</tspan>
      <tspan dx="40">W<tspan dy="3" font-size="10">ij</tspan> = weight</tspan>
      <tspan dx="40">L = loss function</tspan>
    </text>
  </g>
  
  <!-- Define arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e"/>
    </marker>
    <marker id="arrowhead-orange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f39c12"/>
    </marker>
  </defs>
</svg>