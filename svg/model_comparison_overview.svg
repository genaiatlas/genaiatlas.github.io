<svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dataGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E3F2FD;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2196F3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="modelsGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E8F5E8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4CAF50;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="evalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFF3E0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF9800;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="resultGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FCE4EC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E91E63;stop-opacity:1" />
    </linearGradient>
    <marker id="flowArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#333">
    Machine Learning Model Comparison Workflow
  </text>
  
  <!-- Step 1: Data Preparation -->
  <rect x="50" y="70" width="180" height="100" rx="10" fill="url(#dataGrad)" stroke="#1976D2" stroke-width="2"/>
  <text x="140" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    Data Preparation
  </text>
  <text x="140" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Train/Test Split
  </text>
  <text x="140" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Cross-Validation Setup
  </text>
  <text x="140" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Feature Engineering
  </text>
  <text x="140" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Data Preprocessing
  </text>
  
  <!-- Arrow 1 -->
  <path d="M 240 120 L 280 120" stroke="#333" stroke-width="3" fill="none" marker-end="url(#flowArrow)"/>
  
  <!-- Step 2: Model Training -->
  <rect x="290" y="70" width="180" height="100" rx="10" fill="url(#modelsGrad)" stroke="#4CAF50" stroke-width="2"/>
  <text x="380" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    Model Training
  </text>
  <text x="380" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Multiple Algorithms
  </text>
  <text x="380" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Hyperparameter Tuning
  </text>
  <text x="380" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Ensemble Methods
  </text>
  <text x="380" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Baseline Models
  </text>
  
  <!-- Arrow 2 -->
  <path d="M 480 120 L 520 120" stroke="#333" stroke-width="3" fill="none" marker-end="url(#flowArrow)"/>
  
  <!-- Step 3: Evaluation -->
  <rect x="530" y="70" width="180" height="100" rx="10" fill="url(#evalGrad)" stroke="#F57C00" stroke-width="2"/>
  <text x="620" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    Model Evaluation
  </text>
  <text x="620" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Multiple Metrics
  </text>
  <text x="620" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Statistical Testing
  </text>
  <text x="620" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Cross-Validation
  </text>
  <text x="620" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Performance Analysis
  </text>
  
  <!-- Arrow 3 -->
  <path d="M 720 120 L 760 120" stroke="#333" stroke-width="3" fill="none" marker-end="url(#flowArrow)"/>
  
  <!-- Step 4: Model Selection -->
  <rect x="770" y="70" width="180" height="100" rx="10" fill="url(#resultGrad)" stroke="#C2185B" stroke-width="2"/>
  <text x="860" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    Model Selection
  </text>
  <text x="860" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Best Performer
  </text>
  <text x="860" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Trade-off Analysis
  </text>
  <text x="860" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Business Requirements
  </text>
  <text x="860" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Final Validation
  </text>
  
  <!-- Key Metrics Section -->
  <text x="500" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">
    Essential Evaluation Metrics
  </text>
  
  <!-- RMSE -->
  <rect x="80" y="240" width="150" height="60" rx="8" fill="#FFEBEE" stroke="#F44336" stroke-width="1"/>
  <text x="155" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#C62828">
    RMSE
  </text>
  <text x="155" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#C62828">
    Root Mean Square Error
  </text>
  <text x="155" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#C62828">
    Penalizes large errors
  </text>
  
  <!-- MAE -->
  <rect x="250" y="240" width="150" height="60" rx="8" fill="#E8F5E8" stroke="#4CAF50" stroke-width="1"/>
  <text x="325" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2E7D32">
    MAE
  </text>
  <text x="325" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2E7D32">
    Mean Absolute Error
  </text>
  <text x="325" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2E7D32">
    Robust to outliers
  </text>
  
  <!-- R-squared -->
  <rect x="420" y="240" width="150" height="60" rx="8" fill="#E3F2FD" stroke="#2196F3" stroke-width="1"/>
  <text x="495" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1565C0">
    R-squared
  </text>
  <text x="495" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#1565C0">
    Coefficient of Determination
  </text>
  <text x="495" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#1565C0">
    Variance explained
  </text>
  
  <!-- MAPE -->
  <rect x="590" y="240" width="150" height="60" rx="8" fill="#FFF3E0" stroke="#FF9800" stroke-width="1"/>
  <text x="665" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#E65100">
    MAPE
  </text>
  <text x="665" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#E65100">
    Mean Absolute Percentage Error
  </text>
  <text x="665" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#E65100">
    Scale independent
  </text>
  
  <!-- Statistical Testing -->
  <rect x="770" y="240" width="150" height="60" rx="8" fill="#F3E5F5" stroke="#9C27B0" stroke-width="1"/>
  <text x="845" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#6A1B99">
    Statistical Tests
  </text>
  <text x="845" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#6A1B99">
    Paired t-test
  </text>
  <text x="845" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#6A1B99">
    Significance testing
  </text>
  
  <!-- Best Practices -->
  <rect x="100" y="330" width="800" height="50" rx="10" fill="#F5F5F5" stroke="#ddd" stroke-width="1"/>
  <text x="120" y="350" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">
    Best Practices for Model Comparison:
  </text>
  <text x="130" y="365" font-family="Arial, sans-serif" font-size="11" fill="#333">
    • Use multiple evaluation metrics • Apply cross-validation • Test statistical significance • Consider business requirements
  </text>
  
  <!-- Iterative Process Arrow -->
  <path d="M 860 180 Q 920 220 860 260" stroke="#666" stroke-width="2" fill="none" stroke-dasharray="5,5"/>
  <text x="930" y="220" font-family="Arial, sans-serif" font-size="9" fill="#666">
    Iterative
  </text>
  <text x="930" y="235" font-family="Arial, sans-serif" font-size="9" fill="#666">
    Refinement
  </text>
</svg>