<svg viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1400" height="900" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="700" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Query Translation Overview
  </text>
  <text x="700" y="70" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#495057">
    Optimizing Queries for Better Retrieval Performance
  </text>
  
  <!-- Original Query -->
  <g id="original">
    <rect x="500" y="120" width="400" height="70" rx="10" fill="#ffdeeb" stroke="#e64980" stroke-width="3"/>
    <text x="700" y="145" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#495057">
      Original Query
    </text>
    <text x="700" y="170" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#868e96" font-style="italic">
      "How does climate change affect biodiversity?"
    </text>
  </g>
  
  <!-- Arrow -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#495057"/>
    </marker>
  </defs>
  <line x1="700" y1="190" x2="700" y2="230" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  
  <!-- Translation Techniques -->
  <g id="translation-box">
    <rect x="250" y="240" width="900" height="60" rx="10" fill="#e64980" stroke="#c92a2a" stroke-width="3"/>
    <text x="700" y="270" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">
      Query Translation Techniques
    </text>
    <text x="700" y="290" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">
      Decompose • Expand • Rephrase • Generalize
    </text>
  </g>
  
  <!-- Four Techniques -->
  
  <!-- 1. Multi-Query -->
  <g id="multi-query">
    <rect x="50" y="340" width="300" height="240" rx="10" fill="#fff3bf" stroke="#f59f00" stroke-width="3"/>
    <text x="200" y="370" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      1️⃣ Multi-Query
    </text>
    
    <rect x="70" y="390" width="260" height="175" rx="5" fill="#fff" stroke="#f59f00" stroke-width="2"/>
    <text x="200" y="410" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#495057">
      Multiple Query Variations
    </text>
    <text x="85" y="430" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      Q1: "What are climate change
    </text>
    <text x="85" y="447" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      impacts on species?"
    </text>
    <text x="85" y="470" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      Q2: "How do ecosystems respond
    </text>
    <text x="85" y="487" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      to global warming?"
    </text>
    <text x="85" y="510" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      Q3: "Relationship between
    </text>
    <text x="85" y="527" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      temperature and biodiversity?"
    </text>
    <text x="200" y="555" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#7950f2">
      Benefit: Better coverage
    </text>
  </g>
  
  <!-- 2. Step-Back -->
  <g id="step-back">
    <rect x="380" y="340" width="300" height="240" rx="10" fill="#d0bfff" stroke="#7950f2" stroke-width="3"/>
    <text x="530" y="370" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      2️⃣ Step-Back
    </text>
    
    <rect x="400" y="390" width="260" height="175" rx="5" fill="#fff" stroke="#7950f2" stroke-width="2"/>
    <text x="530" y="410" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#495057">
      Higher-Level Questions
    </text>
    <text x="415" y="435" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      Original: "How does climate
    </text>
    <text x="415" y="452" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      change affect biodiversity?"
    </text>
    <text x="530" y="477" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#e64980">
      ↓ Step Back ↓
    </text>
    <text x="415" y="500" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      More General: "What is climate
    </text>
    <text x="415" y="517" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      change and what is biodiversity?"
    </text>
    <text x="530" y="545" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#7950f2">
      Benefit: Foundational context
    </text>
  </g>
  
  <!-- 3. RAG-Fusion -->
  <g id="rag-fusion">
    <rect x="710" y="340" width="300" height="240" rx="10" fill="#d3f9d8" stroke="#37b24d" stroke-width="3"/>
    <text x="860" y="370" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      3️⃣ RAG-Fusion
    </text>
    
    <rect x="730" y="390" width="260" height="175" rx="5" fill="#fff" stroke="#37b24d" stroke-width="2"/>
    <text x="860" y="410" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#495057">
      Combine &amp; Merge Results
    </text>
    <text x="745" y="435" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      1. Generate multiple queries
    </text>
    <text x="745" y="457" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      2. Retrieve from each query
    </text>
    <text x="745" y="479" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      3. Apply Reciprocal Rank
    </text>
    <text x="745" y="496" font-family="Arial, sans-serif" font-size="11" fill="#495057">
         Fusion (RRF)
    </text>
    <text x="745" y="518" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      4. Return merged, ranked
    </text>
    <text x="745" y="535" font-family="Arial, sans-serif" font-size="11" fill="#495057">
         results
    </text>
    <text x="860" y="557" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#7950f2">
      Benefit: Comprehensive results
    </text>
  </g>
  
  <!-- 4. Query Decomposition -->
  <g id="decomposition">
    <rect x="1040" y="340" width="310" height="240" rx="10" fill="#ffc9c9" stroke="#f03e3e" stroke-width="3"/>
    <text x="1195" y="370" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      4️⃣ Decomposition
    </text>
    
    <rect x="1060" y="390" width="270" height="175" rx="5" fill="#fff" stroke="#f03e3e" stroke-width="2"/>
    <text x="1195" y="410" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#495057">
      Break into Sub-Questions
    </text>
    <text x="1075" y="435" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      Original: Complex question
    </text>
    <text x="1195" y="460" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#e64980">
      ↓ Decompose ↓
    </text>
    <text x="1075" y="483" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      Sub-Q1: "What is climate
    </text>
    <text x="1075" y="500" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      change?"
    </text>
    <text x="1075" y="520" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      Sub-Q2: "How does it affect
    </text>
    <text x="1075" y="537" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      species?"
    </text>
    <text x="1195" y="557" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#7950f2">
      Benefit: Multi-hop reasoning
    </text>
  </g>
  
  <!-- Arrows from translation to techniques -->
  <line x1="400" y1="300" x2="200" y2="330" stroke="#495057" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <line x1="600" y1="300" x2="530" y2="330" stroke="#495057" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <line x1="800" y1="300" x2="860" y2="330" stroke="#495057" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <line x1="1000" y1="300" x2="1195" y2="330" stroke="#495057" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  
  <!-- HyDE Technique (Bonus) -->
  <g id="hyde">
    <rect x="350" y="620" width="700" height="240" rx="10" fill="#e9d5ff" stroke="#9333ea" stroke-width="3"/>
    <text x="700" y="650" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      5️⃣ HyDE (Hypothetical Document Embeddings)
    </text>
    
    <rect x="370" y="670" width="660" height="175" rx="5" fill="#fff" stroke="#9333ea" stroke-width="2"/>
    <text x="700" y="690" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#495057">
      Generate Hypothetical Answer, Then Search
    </text>
    
    <rect x="390" y="705" width="200" height="125" rx="5" fill="#f8f9fa" stroke="#9333ea" stroke-width="2"/>
    <text x="490" y="725" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#495057">
      Step 1: Generate
    </text>
    <text x="405" y="745" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      LLM generates hypothetical
    </text>
    <text x="405" y="760" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      answer to the question
    </text>
    <text x="405" y="775" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      (even if not factual)
    </text>
    <text x="405" y="795" font-family="Arial, sans-serif" font-size="10" fill="#495057" font-style="italic">
      "Climate change reduces
    </text>
    <text x="405" y="810" font-family="Arial, sans-serif" font-size="10" fill="#495057" font-style="italic">
      biodiversity by..."
    </text>
    
    <text x="620" y="770" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#9333ea">
      →
    </text>
    
    <rect x="640" y="705" width="200" height="125" rx="5" fill="#f8f9fa" stroke="#9333ea" stroke-width="2"/>
    <text x="740" y="725" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#495057">
      Step 2: Embed &amp; Search
    </text>
    <text x="655" y="745" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      Embed the hypothetical
    </text>
    <text x="655" y="760" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      answer
    </text>
    <text x="655" y="780" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      Search for documents
    </text>
    <text x="655" y="795" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      similar to this answer
    </text>
    <text x="655" y="815" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      (not the question)
    </text>
    
    <rect x="860" y="705" width="150" height="125" rx="5" fill="#fff9db" stroke="#fab005" stroke-width="2"/>
    <text x="935" y="725" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#495057">
      Benefit
    </text>
    <text x="875" y="750" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      Better semantic
    </text>
    <text x="875" y="765" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      matching when
    </text>
    <text x="875" y="780" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      query style differs
    </text>
    <text x="875" y="795" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      from document
    </text>
    <text x="875" y="810" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      style
    </text>
  </g>
  
  <!-- Summary Box -->
  <g id="summary">
    <rect x="50" y="620" width="270" height="240" rx="10" fill="#fff9db" stroke="#fab005" stroke-width="3"/>
    <text x="185" y="650" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      📊 When to Use
    </text>
    
    <text x="65" y="680" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#495057">
      Multi-Query:
    </text>
    <text x="65" y="697" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      Ambiguous or broad queries
    </text>
    
    <text x="65" y="720" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#495057">
      Step-Back:
    </text>
    <text x="65" y="737" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      Need background context
    </text>
    
    <text x="65" y="760" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#495057">
      RAG-Fusion:
    </text>
    <text x="65" y="777" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      Comprehensive coverage
    </text>
    
    <text x="65" y="800" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#495057">
      Decomposition:
    </text>
    <text x="65" y="817" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      Complex multi-step queries
    </text>
    
    <text x="65" y="840" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#495057">
      HyDE:
    </text>
    <text x="65" y="857" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      Query-document mismatch
    </text>
  </g>
  
  <!-- Result Box -->
  <g id="result">
    <rect x="1070" y="620" width="280" height="240" rx="10" fill="#d3f9d8" stroke="#37b24d" stroke-width="3"/>
    <text x="1210" y="650" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      ✅ Results
    </text>
    
    <rect x="1090" y="670" width="240" height="175" rx="5" fill="#fff" stroke="#37b24d" stroke-width="2"/>
    <text x="1210" y="690" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#495057">
      Optimized Queries
    </text>
    <text x="1105" y="715" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      ✓ Better retrieval coverage
    </text>
    <text x="1105" y="735" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      ✓ Reduced ambiguity
    </text>
    <text x="1105" y="755" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      ✓ Multi-hop reasoning
    </text>
    <text x="1105" y="775" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      ✓ Foundational context
    </text>
    <text x="1105" y="795" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      ✓ Comprehensive results
    </text>
    <text x="1105" y="815" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      ✓ Better semantic match
    </text>
    <text x="1210" y="835" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#37b24d">
      → Send to Retrieval
    </text>
  </g>
</svg>