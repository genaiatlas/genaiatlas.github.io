<svg viewBox="0 0 900 650" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="900" height="650" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">
    Neural Network Training: Forward &amp; Backward Propagation
  </text>
  
  <!-- Forward Propagation Section -->
  <g transform="translate(50, 70)">
    <text x="200" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#3498db">
      Forward Propagation
    </text>
    
    <!-- Input layer -->
    <g transform="translate(0, 40)">
      <circle cx="30" cy="30" r="15" fill="#e8f4fd" stroke="#3498db" stroke-width="2"/>
      <circle cx="30" cy="70" r="15" fill="#e8f4fd" stroke="#3498db" stroke-width="2"/>
      <circle cx="30" cy="110" r="15" fill="#e8f4fd" stroke="#3498db" stroke-width="2"/>
      <text x="30" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">x₁</text>
      <text x="30" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">x₂</text>
      <text x="30" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">x₃</text>
      <text x="30" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#3498db">Input</text>
    </g>
    
    <!-- Hidden layer 1 -->
    <g transform="translate(120, 40)">
      <circle cx="30" cy="20" r="12" fill="#fef9e7" stroke="#f39c12" stroke-width="2"/>
      <circle cx="30" cy="50" r="12" fill="#fef9e7" stroke="#f39c12" stroke-width="2"/>
      <circle cx="30" cy="80" r="12" fill="#fef9e7" stroke="#f39c12" stroke-width="2"/>
      <circle cx="30" cy="110" r="12" fill="#fef9e7" stroke="#f39c12" stroke-width="2"/>
      <text x="30" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f39c12">Hidden 1</text>
    </g>
    
    <!-- Hidden layer 2 -->
    <g transform="translate(220, 40)">
      <circle cx="30" cy="30" r="12" fill="#fef9e7" stroke="#f39c12" stroke-width="2"/>
      <circle cx="30" cy="60" r="12" fill="#fef9e7" stroke="#f39c12" stroke-width="2"/>
      <circle cx="30" cy="90" r="12" fill="#fef9e7" stroke="#f39c12" stroke-width="2"/>
      <text x="30" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f39c12">Hidden 2</text>
    </g>
    
    <!-- Output layer -->
    <g transform="translate(320, 40)">
      <circle cx="30" cy="50" r="15" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
      <circle cx="30" cy="80" r="15" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
      <text x="30" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">ŷ₁</text>
      <text x="30" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">ŷ₂</text>
      <text x="30" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#27ae60">Output</text>
    </g>
    
    <!-- Forward arrows and weights -->
    <!-- Input to Hidden 1 -->
    <path d="M 48 50 L 138 35" stroke="#3498db" stroke-width="2" marker-end="url(#arrowhead)"/>
    <path d="M 48 80 L 138 55" stroke="#3498db" stroke-width="2" marker-end="url(#arrowhead)"/>
    <path d="M 48 110 L 138 95" stroke="#3498db" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Hidden 1 to Hidden 2 -->
    <path d="M 162 30 L 238 45" stroke="#f39c12" stroke-width="2" marker-end="url(#arrowhead)"/>
    <path d="M 162 60 L 238 75" stroke="#f39c12" stroke-width="2" marker-end="url(#arrowhead)"/>
    <path d="M 162 90 L 238 105" stroke="#f39c12" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Hidden 2 to Output -->
    <path d="M 262 50 L 335 60" stroke="#27ae60" stroke-width="2" marker-end="url(#arrowhead)"/>
    <path d="M 262 80 L 335 90" stroke="#27ae60" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Weight labels -->
    <text x="90" y="35" font-family="Arial, sans-serif" font-size="8" fill="#7f8c8d">W₁₁</text>
    <text x="200" y="35" font-family="Arial, sans-serif" font-size="8" fill="#7f8c8d">W₂₁</text>
    <text x="300" y="45" font-family="Arial, sans-serif" font-size="8" fill="#7f8c8d">W₃₁</text>
    
    <!-- Mathematical operations -->
    <text x="200" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">
      Step 1: Calculate weighted inputs
    </text>
    <text x="200" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">
      z = X·W + b
    </text>
    <text x="200" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">
      Step 2: Apply activation function
    </text>
    <text x="200" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">
      a = f(z)
    </text>
  </g>
  
  <!-- Loss calculation -->
  <g transform="translate(450, 100)">
    <rect x="0" y="0" width="150" height="80" fill="#fdf2f2" stroke="#e74c3c" stroke-width="2" rx="5"/>
    <text x="75" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e74c3c">
      Loss Calculation
    </text>
    <text x="75" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">
      Loss = (Y - Ŷ)²
    </text>
    <text x="75" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">
      Compare prediction with actual
    </text>
  </g>
  
  <!-- Arrow from output to loss -->
  <path d="M 415 125 Q 430 125 450 140" fill="none" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Backward Propagation Section -->
  <g transform="translate(50, 320)">
    <text x="200" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#e74c3c">
      Backward Propagation
    </text>
    
    <!-- Same network structure but with backward arrows -->
    <!-- Input layer -->
    <g transform="translate(0, 40)">
      <circle cx="30" cy="30" r="15" fill="#e8f4fd" stroke="#3498db" stroke-width="2"/>
      <circle cx="30" cy="70" r="15" fill="#e8f4fd" stroke="#3498db" stroke-width="2"/>
      <circle cx="30" cy="110" r="15" fill="#e8f4fd" stroke="#3498db" stroke-width="2"/>
      <text x="30" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">x₁</text>
      <text x="30" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">x₂</text>
      <text x="30" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">x₃</text>
      <text x="30" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#3498db">Input</text>
    </g>
    
    <!-- Hidden layer 1 -->
    <g transform="translate(120, 40)">
      <circle cx="30" cy="20" r="12" fill="#fef9e7" stroke="#f39c12" stroke-width="2"/>
      <circle cx="30" cy="50" r="12" fill="#fef9e7" stroke="#f39c12" stroke-width="2"/>
      <circle cx="30" cy="80" r="12" fill="#fef9e7" stroke="#f39c12" stroke-width="2"/>
      <circle cx="30" cy="110" r="12" fill="#fef9e7" stroke="#f39c12" stroke-width="2"/>
      <text x="30" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f39c12">Hidden 1</text>
    </g>
    
    <!-- Hidden layer 2 -->
    <g transform="translate(220, 40)">
      <circle cx="30" cy="30" r="12" fill="#fef9e7" stroke="#f39c12" stroke-width="2"/>
      <circle cx="30" cy="60" r="12" fill="#fef9e7" stroke="#f39c12" stroke-width="2"/>
      <circle cx="30" cy="90" r="12" fill="#fef9e7" stroke="#f39c12" stroke-width="2"/>
      <text x="30" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f39c12">Hidden 2</text>
    </g>
    
    <!-- Output layer -->
    <g transform="translate(320, 40)">
      <circle cx="30" cy="50" r="15" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
      <circle cx="30" cy="80" r="15" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
      <text x="30" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">ŷ₁</text>
      <text x="30" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">ŷ₂</text>
      <text x="30" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#27ae60">Output</text>
    </g>
    
    <!-- Backward arrows (error propagation) -->
    <!-- Output to Hidden 2 -->
    <path d="M 335 60 L 262 50" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="5,3"/>
    <path d="M 335 90 L 262 80" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="5,3"/>
    
    <!-- Hidden 2 to Hidden 1 -->
    <path d="M 238 45 L 162 30" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="5,3"/>
    <path d="M 238 75 L 162 60" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="5,3"/>
    <path d="M 238 105 L 162 90" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="5,3"/>
    
    <!-- Hidden 1 to Input -->
    <path d="M 138 35 L 48 50" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="5,3"/>
    <path d="M 138 55 L 48 80" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="5,3"/>
    <path d="M 138 95 L 48 110" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="5,3"/>
    
    <!-- Gradient labels -->
    <text x="300" y="35" font-family="Arial, sans-serif" font-size="8" fill="#e74c3c">∂L/∂W₃</text>
    <text x="200" y="25" font-family="Arial, sans-serif" font-size="8" fill="#e74c3c">∂L/∂W₂</text>
    <text x="90" y="25" font-family="Arial, sans-serif" font-size="8" fill="#e74c3c">∂L/∂W₁</text>
    
    <!-- Mathematical operations -->
    <text x="200" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">
      Step 1: Calculate gradients (Chain rule)
    </text>
    <text x="200" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">
      ∂L/∂W = ∂L/∂a · ∂a/∂z · ∂z/∂W
    </text>
    <text x="200" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">
      Step 2: Update weights using optimizer
    </text>
    <text x="200" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">
      W = W - optimizer_update(∇L)
    </text>
  </g>
  
  <!-- Error from loss -->
  <g transform="translate(450, 320)">
    <rect x="0" y="0" width="150" height="80" fill="#fdf2f2" stroke="#e74c3c" stroke-width="2" rx="5"/>
    <text x="75" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e74c3c">
      Error Signal
    </text>
    <text x="75" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">
      ∂Loss/∂Ŷ
    </text>
    <text x="75" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">
      Propagate error backward
    </text>
  </g>
  
  <!-- Arrow from loss to backprop -->
  <path d="M 450 360 Q 430 360 415 365" fill="none" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Connecting arrow between forward and backward -->
  <path d="M 525 180 Q 525 230 525 280" fill="none" stroke="#9b59b6" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="540" y="235" font-family="Arial, sans-serif" font-size="12" fill="#9b59b6" font-weight="bold">
    Loss triggers
  </text>
  <text x="540" y="250" font-family="Arial, sans-serif" font-size="12" fill="#9b59b6" font-weight="bold">
    backpropagation
  </text>
  
  <!-- Key characteristics box -->
  <g transform="translate(650, 150)">
    <rect x="0" y="0" width="200" height="280" fill="#f4f4f4" stroke="#95a5a6" stroke-width="1" rx="5"/>
    
    <text x="100" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
      Training Process
    </text>
    
    <text x="20" y="50" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#3498db">
      Forward Pass:
    </text>
    <text x="20" y="70" font-family="Arial, sans-serif" font-size="10" fill="#333">
      • Calculate predictions
    </text>
    <text x="20" y="85" font-family="Arial, sans-serif" font-size="10" fill="#333">
      • Apply activation functions
    </text>
    <text x="20" y="100" font-family="Arial, sans-serif" font-size="10" fill="#333">
      • Compute loss
    </text>
    
    <text x="20" y="130" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e74c3c">
      Backward Pass:
    </text>
    <text x="20" y="150" font-family="Arial, sans-serif" font-size="10" fill="#333">
      • Calculate gradients
    </text>
    <text x="20" y="165" font-family="Arial, sans-serif" font-size="10" fill="#333">
      • Propagate error backward
    </text>
    <text x="20" y="180" font-family="Arial, sans-serif" font-size="10" fill="#333">
      • Update all parameters
    </text>
    
    <text x="20" y="210" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#27ae60">
      Key Principles:
    </text>
    <text x="20" y="230" font-family="Arial, sans-serif" font-size="10" fill="#333">
      • Chain rule for gradients
    </text>
    <text x="20" y="245" font-family="Arial, sans-serif" font-size="10" fill="#333">
      • Error attribution
    </text>
    <text x="20" y="260" font-family="Arial, sans-serif" font-size="10" fill="#333">
      • Iterative refinement
    </text>
  </g>
  
  <!-- Cycle indicator -->
  <g transform="translate(200, 580)">
    <path d="M 0 0 Q 50 -20 100 0 Q 150 20 200 0" fill="none" stroke="#9b59b6" stroke-width="3" stroke-dasharray="10,5"/>
    <text x="100" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#9b59b6">
      Iterative Process: Repeat Until Convergence
    </text>
    <text x="100" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">
      Each epoch: Forward → Loss → Backward → Update
    </text>
  </g>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="currentColor"/>
    </marker>
  </defs>
</svg>