<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="chatgptMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10a37f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#15d399;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="featureBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:0.9" />
    </linearGradient>
    <filter id="boxShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#00000020"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="800" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="600" y="40" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#1e293b">
    ChatGPT Features and Capabilities Overview
  </text>
  
  <!-- Central ChatGPT Hub -->
  <g transform="translate(600, 150)">
    <circle r="60" fill="url(#chatgptMain)" stroke="#059669" stroke-width="3" filter="url(#boxShadow)"/>
    <text x="0" y="-5" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">ChatGPT</text>
    <text x="0" y="10" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">by OpenAI</text>
  </g>
  
  <!-- Core Features (Surrounding the hub) -->
  <!-- Text Generation -->
  <g transform="translate(400, 100)">
    <rect x="-60" y="-20" width="120" height="40" rx="20" fill="url(#featureBox)" stroke="#059669" stroke-width="1" filter="url(#boxShadow)"/>
    <text x="0" y="-2" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">Text Generation</text>
    <text x="0" y="12" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">Advanced Writing</text>
  </g>
  
  <!-- Image Processing -->
  <g transform="translate(800, 100)">
    <rect x="-60" y="-20" width="120" height="40" rx="20" fill="url(#featureBox)" stroke="#059669" stroke-width="1" filter="url(#boxShadow)"/>
    <text x="0" y="-2" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">Image Processing</text>
    <text x="0" y="12" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">DALL-E Integration</text>
  </g>
  
  <!-- Code Generation -->
  <g transform="translate(750, 200)">
    <rect x="-60" y="-20" width="120" height="40" rx="20" fill="url(#featureBox)" stroke="#059669" stroke-width="1" filter="url(#boxShadow)"/>
    <text x="0" y="-2" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">Code Generation</text>
    <text x="0" y="12" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">Multi-Language</text>
  </g>
  
  <!-- Web Browsing -->
  <g transform="translate(450, 200)">
    <rect x="-60" y="-20" width="120" height="40" rx="20" fill="url(#featureBox)" stroke="#059669" stroke-width="1" filter="url(#boxShadow)"/>
    <text x="0" y="-2" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">Web Browsing</text>
    <text x="0" y="12" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">Real-time Info</text>
  </g>
  
  <!-- Connection Lines -->
  <g stroke="#cbd5e1" stroke-width="2" fill="none">
    <line x1="550" y1="130" x2="460" y2="110"/>
    <line x1="650" y1="130" x2="740" y2="110"/>
    <line x1="630" y1="190" x2="690" y2="190"/>
    <line x1="570" y1="190" x2="510" y2="190"/>
  </g>
  
  <!-- Advanced Features Section -->
  <g transform="translate(200, 300)">
    <rect x="0" y="0" width="800" height="200" fill="white" stroke="#e2e8f0" stroke-width="2" rx="10" filter="url(#boxShadow)"/>
    <text x="400" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1e293b">
      Advanced Capabilities
    </text>
    
    <!-- Custom GPTs -->
    <g transform="translate(100, 60)">
      <rect x="-80" y="-20" width="160" height="40" rx="20" fill="#6366f1" stroke="#4f46e5" stroke-width="1"/>
      <text x="0" y="-2" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Custom GPTs</text>
      <text x="0" y="12" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Specialized Agents</text>
    </g>
    
    <!-- Plugin Ecosystem -->
    <g transform="translate(400, 60)">
      <rect x="-80" y="-20" width="160" height="40" rx="20" fill="#8b5cf6" stroke="#7c3aed" stroke-width="1"/>
      <text x="0" y="-2" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Plugin Ecosystem</text>
      <text x="0" y="12" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Extended Tools</text>
    </g>
    
    <!-- Memory System -->
    <g transform="translate(700, 60)">
      <rect x="-80" y="-20" width="160" height="40" rx="20" fill="#ec4899" stroke="#db2777" stroke-width="1"/>
      <text x="0" y="-2" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Memory System</text>
      <text x="0" y="12" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Context Retention</text>
    </g>
    
    <!-- Feature Details -->
    <g font-family="Arial, sans-serif" font-size="10" fill="#64748b">
      <text x="40" y="120">• Tailored Instructions</text>
      <text x="40" y="135">• Knowledge Base Upload</text>
      <text x="40" y="150">• Marketplace Access</text>
      
      <text x="280" y="120">• Third-party Integrations</text>
      <text x="280" y="135">• API Connections</text>
      <text x="280" y="150">• Workflow Automation</text>
      
      <text x="560" y="120">• Session Continuity</text>
      <text x="560" y="135">• User Preferences</text>
      <text x="560" y="150">• Learning from Feedback</text>
    </g>
  </g>
  
  <!-- Use Cases Section -->
  <g transform="translate(50, 550)">
    <rect x="0" y="0" width="1100" height="200" fill="white" stroke="#e2e8f0" stroke-width="2" rx="10" filter="url(#boxShadow)"/>
    <text x="550" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1e293b">
      Primary Use Cases
    </text>
    
    <!-- Content Creation -->
    <g transform="translate(140, 70)">
      <rect x="-70" y="-25" width="140" height="50" rx="15" fill="#f59e0b" stroke="#d97706" stroke-width="1"/>
      <text x="0" y="-8" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Content Creation</text>
      <text x="0" y="8" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">Writing and Marketing</text>
    </g>
    
    <!-- Business Automation -->
    <g transform="translate(350, 70)">
      <rect x="-70" y="-25" width="140" height="50" rx="15" fill="#3b82f6" stroke="#2563eb" stroke-width="1"/>
      <text x="0" y="-8" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Business Automation</text>
      <text x="0" y="8" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">Process Optimization</text>
    </g>
    
    <!-- Education -->
    <g transform="translate(560, 70)">
      <rect x="-70" y="-25" width="140" height="50" rx="15" fill="#10b981" stroke="#059669" stroke-width="1"/>
      <text x="0" y="-8" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Education</text>
      <text x="0" y="8" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">Learning Support</text>
    </g>
    
    <!-- Development -->
    <g transform="translate(770, 70)">
      <rect x="-70" y="-25" width="140" height="50" rx="15" fill="#ef4444" stroke="#dc2626" stroke-width="1"/>
      <text x="0" y="-8" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Development</text>
      <text x="0" y="8" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">Code Generation</text>
    </g>
    
    <!-- Research -->
    <g transform="translate(980, 70)">
      <rect x="-70" y="-25" width="140" height="50" rx="15" fill="#8b5cf6" stroke="#7c3aed" stroke-width="1"/>
      <text x="0" y="-8" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Research</text>
      <text x="0" y="8" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">Analysis Tasks</text>
    </g>
    
    <!-- Use Case Details -->
    <g font-family="Arial, sans-serif" font-size="9" fill="#64748b">
      <text x="80" y="140">• Blog Posts</text>
      <text x="80" y="155">• Marketing Copy</text>
      <text x="80" y="170">• Creative Writing</text>
      
      <text x="290" y="140">• Email Templates</text>
      <text x="290" y="155">• Report Generation</text>
      <text x="290" y="170">• Documentation</text>
      
      <text x="500" y="140">• Explanations</text>
      <text x="500" y="155">• Study Materials</text>
      <text x="500" y="170">• Tutoring</text>
      
      <text x="710" y="140">• Code Review</text>
      <text x="710" y="155">• Debugging Help</text>
      <text x="710" y="170">• Architecture</text>
      
      <text x="920" y="140">• Data Analysis</text>
      <text x="920" y="155">• Market Research</text>
      <text x="920" y="170">• Document Review</text>
    </g>
  </g>
  
  <!-- Pricing Info -->
  <g transform="translate(50, 20)">
    <g font-family="Arial, sans-serif" font-size="11" fill="#64748b">
      <text x="0" y="0">Available Tiers: Free (GPT-3.5) | Plus $20/mo (GPT-4 + Features) | Team $25/user | Enterprise (Custom)</text>
    </g>
  </g>
</svg>