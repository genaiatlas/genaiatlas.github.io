<svg width="800" height="700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'Arial', sans-serif; font-size: 20px; font-weight: bold; fill: #2c3e50; }
      .subtitle { font-family: 'Arial', sans-serif; font-size: 16px; fill: #34495e; font-weight: bold; }
      .section-title { font-family: 'Arial', sans-serif; font-size: 14px; fill: #34495e; font-weight: bold; }
      .step-title { font-family: 'Arial', sans-serif; font-size: 13px; fill: #2c3e50; font-weight: bold; }
      .description { font-family: 'Arial', sans-serif; font-size: 12px; fill: #34495e; }
      .small-text { font-family: 'Arial', sans-serif; font-size: 10px; fill: #34495e; }
      .percentage { font-family: 'Arial', sans-serif; font-size: 11px; fill: #2c3e50; font-weight: bold; }
      .box { fill: #f8f9fa; stroke: #dee2e6; stroke-width: 2; rx: 8; }
      .train-color { fill: #3498db; stroke: #2980b9; stroke-width: 2; }
      .val-color { fill: #f39c12; stroke: #e67e22; stroke-width: 2; }
      .test-color { fill: #e74c3c; stroke: #c0392b; stroke-width: 2; }
      .dataset-color { fill: #95a5a6; stroke: #7f8c8d; stroke-width: 2; }
      .workflow-box { fill: #e8f6f3; stroke: #16a085; stroke-width: 2; rx: 8; }
      .step-box { fill: #ffffff; stroke: #34495e; stroke-width: 2; rx: 6; }
      .arrow { stroke: #34495e; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .flow-arrow { stroke: #16a085; stroke-width: 3; fill: none; marker-end: url(#greenarrowhead); }
      .split-line { stroke: #e74c3c; stroke-width: 3; stroke-dasharray: 5,5; }
      .warning-box { fill: #fff3cd; stroke: #ffc107; stroke-width: 2; rx: 8; }
      .best-practices-box { fill: #d4edda; stroke: #28a745; stroke-width: 2; rx: 8; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e" />
    </marker>
    <marker id="greenarrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a085" />
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="700" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="400" y="25" text-anchor="middle" class="title">Three-Way Data Split Protocol</text>
  
  <!-- Original Dataset -->
  <text x="400" y="55" text-anchor="middle" class="subtitle">Complete Machine Learning Workflow</text>
  
  <!-- Step 1: Original Dataset -->
  <g transform="translate(300, 80)">
    <rect x="0" y="0" width="200" height="40" class="dataset-color" rx="4"/>
    <text x="100" y="25" text-anchor="middle" class="description" fill="white">Original Dataset (n=1000)</text>
    
    <!-- First split arrow -->
    <path d="M 100 50 L 100 80" class="arrow"/>
    <text x="130" y="70" class="small-text">Random split</text>
  </g>
  
  <!-- Step 2: First Split (Train+Val vs Test) -->
  <g transform="translate(200, 170)">
    <text x="200" y="-10" text-anchor="middle" class="step-title">Step 1: Reserve Test Set</text>
    
    <!-- Temp dataset (80%) -->
    <rect x="0" y="0" width="320" height="30" class="train-color" rx="4"/>
    <text x="160" y="20" text-anchor="middle" class="description" fill="white">Temporary Dataset (80% = 800 samples)</text>
    
    <!-- Test dataset (20%) -->
    <rect x="340" y="0" width="80" height="30" class="test-color" rx="4"/>
    <text x="380" y="20" text-anchor="middle" class="description" fill="white">Test Set</text>
    <text x="380" y="45" text-anchor="middle" class="percentage">(20% = 200)</text>
    
    <!-- Split line -->
    <line x1="340" y1="-5" x2="340" y2="35" class="split-line"/>
    
    <!-- Second split arrow -->
    <path d="M 160 40 L 160 70" class="arrow"/>
    <text x="190" y="60" class="small-text">Second split</text>
  </g>
  
  <!-- Step 3: Second Split (Train vs Validation) -->
  <g transform="translate(100, 280)">
    <text x="200" y="-10" text-anchor="middle" class="step-title">Step 2: Create Train/Validation Split</text>
    
    <!-- Training set (60% of total) -->
    <rect x="0" y="0" width="240" height="30" class="train-color" rx="4"/>
    <text x="120" y="20" text-anchor="middle" class="description" fill="white">Training Set (60% = 600)</text>
    
    <!-- Validation set (20% of total) -->
    <rect x="260" y="0" width="80" height="30" class="val-color" rx="4"/>
    <text x="300" y="20" text-anchor="middle" class="description" fill="white">Validation</text>
    <text x="300" y="45" text-anchor="middle" class="percentage">(20% = 200)</text>
    
    <!-- Test set (unchanged) -->
    <rect x="360" y="0" width="80" height="30" class="test-color" rx="4"/>
    <text x="400" y="20" text-anchor="middle" class="description" fill="white">Test Set</text>
    <text x="400" y="45" text-anchor="middle" class="percentage">(20% = 200)</text>
    
    <!-- Split lines -->
    <line x1="260" y1="-5" x2="260" y2="35" class="split-line"/>
    <line x1="360" y1="-5" x2="360" y2="35" class="split-line"/>
  </g>
  
  <!-- Workflow Process -->
  <rect x="50" y="350" width="700" height="180" class="workflow-box"/>
  <text x="400" y="375" text-anchor="middle" class="subtitle" fill="#16a085">Model Development Workflow</text>
  
  <!-- Step 3: Model Training -->
  <g transform="translate(80, 390)">
    <rect x="0" y="0" width="140" height="60" class="step-box"/>
    <text x="70" y="20" text-anchor="middle" class="step-title">Step 3: Training</text>
    <text x="70" y="35" text-anchor="middle" class="description">• Use training set only</text>
    <text x="70" y="48" text-anchor="middle" class="description">• Try multiple algorithms</text>
    <text x="70" y="60" text-anchor="middle" class="description">• Tune hyperparameters</text>
    
    <path d="M 145 30 L 180 30" class="flow-arrow"/>
  </g>
  
  <!-- Step 4: Model Selection -->
  <g transform="translate(190, 390)">
    <rect x="0" y="0" width="140" height="60" class="step-box"/>
    <text x="70" y="20" text-anchor="middle" class="step-title">Step 4: Selection</text>
    <text x="70" y="35" text-anchor="middle" class="description">• Evaluate on validation</text>
    <text x="70" y="48" text-anchor="middle" class="description">• Compare models</text>
    <text x="70" y="60" text-anchor="middle" class="description">• Choose best performer</text>
    
    <path d="M 145 30 L 180 30" class="flow-arrow"/>
  </g>
  
  <!-- Step 5: Final Evaluation -->
  <g transform="translate(340, 390)">
    <rect x="0" y="0" width="140" height="60" class="step-box"/>
    <text x="70" y="20" text-anchor="middle" class="step-title">Step 5: Final Test</text>
    <text x="70" y="35" text-anchor="middle" class="description">• Test on test set</text>
    <text x="70" y="48" text-anchor="middle" class="description">• Report final score</text>
    <text x="70" y="60" text-anchor="middle" class="description">• Deploy model</text>
    
    <path d="M 145 30 L 180 30" class="flow-arrow"/>
  </g>
  
  <!-- Step 6: Deployment -->
  <g transform="translate(530, 390)">
    <rect x="0" y="0" width="140" height="60" class="step-box"/>
    <text x="70" y="20" text-anchor="middle" class="step-title">Step 6: Deployment</text>
    <text x="70" y="35" text-anchor="middle" class="description">• Production ready</text>
    <text x="70" y="48" text-anchor="middle" class="description">• Monitor performance</text>
    <text x="70" y="60" text-anchor="middle" class="description">• Collect new data</text>
  </g>
  
  <!-- Data Usage Arrows -->
  <g transform="translate(80, 470)">
    <!-- Training data arrow -->
    <path d="M 70 0 Q 70 -20 70 -40" stroke="#3498db" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <text x="50" y="-5" class="small-text" fill="#3498db">Train Data</text>
    
    <!-- Validation data arrow -->
    <path d="M 260 0 Q 260 -20 260 -40" stroke="#f39c12" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <text x="235" y="-5" class="small-text" fill="#f39c12">Val Data</text>
    
    <!-- Test data arrow -->
    <path d="M 410 0 Q 410 -20 410 -40" stroke="#e74c3c" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <text x="385" y="-5" class="small-text" fill="#e74c3c">Test Data</text>
  </g>
  
  <!-- Critical Guidelines -->
  <rect x="50" y="550" width="340" height="120" class="warning-box"/>
  <text x="220" y="575" text-anchor="middle" class="subtitle" fill="#856404">⚠️ Critical Rules</text>
  
  <text x="70" y="595" class="description" fill="#856404">• <span style="font-weight: bold;">Never</span> use test data for model decisions</text>
  <text x="70" y="610" class="description" fill="#856404">• <span style="font-weight: bold;">Only evaluate</span> on test set once</text>
  <text x="70" y="625" class="description" fill="#856404">• <span style="font-weight: bold;">No peeking</span> at test performance</text>
  <text x="70" y="640" class="description" fill="#856404">• <span style="font-weight: bold;">Report test error</span> as final result</text>
  <text x="70" y="655" class="description" fill="#856404">• <span style="font-weight: bold;">Maintain separation</span> throughout project</text>
  
  <!-- Best Practices -->
  <rect x="410" y="560" width="340" height="120" class="best-practices-box"/>
  <text x="580" y="585" text-anchor="middle" class="subtitle" fill="#155724">✓ Best Practices</text>
  
  <text x="430" y="605" class="description" fill="#155724">• Use stratified splitting for classification</text>
  <text x="430" y="620" class="description" fill="#155724">• Consider temporal splits for time series</text>
  <text x="430" y="635" class="description" fill="#155724">• Document all model choices</text>
  <text x="430" y="650" class="description" fill="#155724">• Cross-validate within training set</text>
  <text x="430" y="665" class="description" fill="#155724">• Scale features consistently across splits</text>
  
  <!-- Summary Statistics -->
  <rect x="50" y="680" width="700" height="15" class="box"/>
  <text x="400" y="692" text-anchor="middle" class="description">Standard Split: 60% Train | 20% Validation | 20% Test → Robust model evaluation with proper generalization assessment</text>
</svg>