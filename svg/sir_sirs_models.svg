<svg viewBox="0 0 1200 850" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="850" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="600" y="40" font-size="28" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Extended Epidemic Models: SIR and SIRS
  </text>
  
  <!-- SIR Model Section -->
  <g id="sir-model">
    <rect x="50" y="80" width="1100" height="320" fill="#e3f2fd" stroke="#1976d2" stroke-width="3" rx="10"/>
    <text x="600" y="115" font-size="22" font-weight="bold" text-anchor="middle" fill="#0d47a1">
      SIR Model: Susceptible-Infected-Recovered
    </text>
    
    <!-- State Diagram -->
    <g id="sir-states">
      <!-- Susceptible -->
      <circle cx="200" cy="200" r="50" fill="#90caf9" stroke="#1976d2" stroke-width="3"/>
      <text x="200" y="195" font-size="24" font-weight="bold" text-anchor="middle" fill="#0d47a1">S</text>
      <text x="200" y="220" font-size="14" text-anchor="middle" fill="#1565c0">Susceptible</text>
      
      <!-- Arrow S -> I -->
      <defs>
        <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
          <polygon points="0 0, 10 3, 0 6" fill="#f44336"/>
        </marker>
        <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
          <polygon points="0 0, 10 3, 0 6" fill="#4caf50"/>
        </marker>
      </defs>
      <line x1="255" y1="200" x2="395" y2="200" stroke="#f44336" stroke-width="3" marker-end="url(#arrow-red)"/>
      <text x="325" y="185" font-size="14" font-weight="bold" text-anchor="middle" fill="#c62828">
        Infection (β)
      </text>
      
      <!-- Infected -->
      <circle cx="450" cy="200" r="50" fill="#ffcdd2" stroke="#c62828" stroke-width="3"/>
      <text x="450" y="195" font-size="24" font-weight="bold" text-anchor="middle" fill="#b71c1c">I</text>
      <text x="450" y="220" font-size="14" text-anchor="middle" fill="#c62828">Infected</text>
      
      <!-- Arrow I -> R -->
      <line x1="505" y1="200" x2="645" y2="200" stroke="#4caf50" stroke-width="3" marker-end="url(#arrow-green)"/>
      <text x="575" y="185" font-size="14" font-weight="bold" text-anchor="middle" fill="#2e7d32">
        Recovery (γ)
      </text>
      
      <!-- Recovered -->
      <circle cx="700" cy="200" r="50" fill="#c8e6c9" stroke="#2e7d32" stroke-width="3"/>
      <text x="700" y="195" font-size="24" font-weight="bold" text-anchor="middle" fill="#1b5e20">R</text>
      <text x="700" y="220" font-size="14" text-anchor="middle" fill="#2e7d32">Recovered</text>
      
      <!-- No return arrow -->
      <text x="700" y="270" font-size="13" text-anchor="middle" fill="#424242" font-style="italic">
        (Permanent immunity)
      </text>
    </g>
    
    <!-- SIR Characteristics -->
    <g id="sir-properties">
      <text x="900" y="155" font-size="15" font-weight="bold" fill="#1565c0">
        Key Properties:
      </text>
      <text x="900" y="180" font-size="13" fill="#424242">
        • Recovery with immunity
      </text>
      <text x="900" y="200" font-size="13" fill="#424242">
        • No reinfection possible
      </text>
      <text x="900" y="220" font-size="13" fill="#424242">
        • Epidemic eventually dies out
      </text>
      <text x="900" y="240" font-size="13" fill="#424242">
        • Final size depends on R₀
      </text>
    </g>
    
    <!-- SIR Equations -->
    <rect x="70" y="300" width="480" height="85" fill="#ffffff" stroke="#1976d2" stroke-width="2" rx="6"/>
    <text x="310" y="325" font-size="14" font-weight="bold" text-anchor="middle" fill="#0d47a1">
      Differential Equations:
    </text>
    <text x="90" y="350" font-size="13" font-family="monospace" fill="#424242">
      dS/dt = -β × S × I
    </text>
    <text x="90" y="370" font-size="13" font-family="monospace" fill="#424242">
      dI/dt = β × S × I - γ × I
    </text>
    <text x="320" y="350" font-size="13" font-family="monospace" fill="#424242">
      dR/dt = γ × I
    </text>
    <text x="320" y="370" font-size="13" font-family="monospace" fill="#424242">
      R₀ = β / γ
    </text>
    
    <!-- SIR Applications -->
    <rect x="570" y="300" width="560" height="85" fill="#fff3e0" stroke="#ef6c00" stroke-width="2" rx="6"/>
    <text x="850" y="325" font-size="14" font-weight="bold" text-anchor="middle" fill="#e65100">
      Applications:
    </text>
    <text x="590" y="350" font-size="13" fill="#424242">
      • Influenza (seasonal strains) • Measles
    </text>
    <text x="590" y="370" font-size="13" fill="#424242">
      • Chickenpox • COVID-19 (with lasting immunity)
    </text>
  </g>
  
  <!-- SIRS Model Section -->
  <g id="sirs-model">
    <rect x="50" y="430" width="1100" height="360" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="3" rx="10"/>
    <text x="600" y="465" font-size="22" font-weight="bold" text-anchor="middle" fill="#6a1b9a">
      SIRS Model: Temporary Immunity (Cyclic)
    </text>
    
    <!-- State Diagram with cycle -->
    <g id="sirs-states">
      <!-- Susceptible -->
      <circle cx="200" cy="570" r="50" fill="#ce93d8" stroke="#7b1fa2" stroke-width="3"/>
      <text x="200" y="565" font-size="24" font-weight="bold" text-anchor="middle" fill="#4a148c">S</text>
      <text x="200" y="590" font-size="14" text-anchor="middle" fill="#6a1b9a">Susceptible</text>
      
      <!-- Arrow S -> I -->
      <defs>
        <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
          <polygon points="0 0, 10 3, 0 6" fill="#7b1fa2"/>
        </marker>
      </defs>
      <path d="M 245 550 Q 325 520, 405 550" fill="none" stroke="#f44336" stroke-width="3" marker-end="url(#arrow-red)"/>
      <text x="325" y="510" font-size="14" font-weight="bold" text-anchor="middle" fill="#c62828">
        Infection (β)
      </text>
      
      <!-- Infected -->
      <circle cx="450" cy="570" r="50" fill="#ffcdd2" stroke="#c62828" stroke-width="3"/>
      <text x="450" y="565" font-size="24" font-weight="bold" text-anchor="middle" fill="#b71c1c">I</text>
      <text x="450" y="590" font-size="14" text-anchor="middle" fill="#c62828">Infected</text>
      
      <!-- Arrow I -> R -->
      <path d="M 495 590 Q 575 620, 655 590" fill="none" stroke="#4caf50" stroke-width="3" marker-end="url(#arrow-green)"/>
      <text x="575" y="640" font-size="14" font-weight="bold" text-anchor="middle" fill="#2e7d32">
        Recovery (γ)
      </text>
      
      <!-- Recovered -->
      <circle cx="700" cy="570" r="50" fill="#c8e6c9" stroke="#2e7d32" stroke-width="3"/>
      <text x="700" y="565" font-size="24" font-weight="bold" text-anchor="middle" fill="#1b5e20">R</text>
      <text x="700" y="590" font-size="14" text-anchor="middle" fill="#2e7d32">Recovered</text>
      
      <!-- Arrow R -> S (return path) -->
      <path d="M 655 550 Q 450 480, 245 550" fill="none" stroke="#7b1fa2" stroke-width="3" marker-end="url(#arrow-purple)" stroke-dasharray="5,5"/>
      <text x="450" y="470" font-size="14" font-weight="bold" text-anchor="middle" fill="#6a1b9a">
        Immunity Loss (δ)
      </text>
      
      <!-- Cycle indicator -->
      <text x="450" y="680" font-size="13" text-anchor="middle" fill="#6a1b9a" font-style="italic">
        (Cyclic: Temporary immunity)
      </text>
    </g>
    
    <!-- SIRS Characteristics -->
    <g id="sirs-properties">
      <text x="900" y="520" font-size="15" font-weight="bold" fill="#6a1b9a">
        Key Properties:
      </text>
      <text x="900" y="545" font-size="13" fill="#424242">
        • Recovery with temp. immunity
      </text>
      <text x="900" y="565" font-size="13" fill="#424242">
        • Reinfection possible after δ
      </text>
      <text x="900" y="585" font-size="13" fill="#424242">
        • Can reach endemic state
      </text>
      <text x="900" y="605" font-size="13" fill="#424242">
        • All states persist long-term
      </text>
    </g>
    
    <!-- SIRS Equations -->
    <rect x="70" y="710" width="530" height="65" fill="#ffffff" stroke="#7b1fa2" stroke-width="2" rx="6"/>
    <text x="335" y="735" font-size="14" font-weight="bold" text-anchor="middle" fill="#6a1b9a">
      Differential Equations (adds immunity loss):
    </text>
    <text x="90" y="755" font-size="13" font-family="monospace" fill="#424242">
      dS/dt = -β × S × I + δ × R
    </text>
    <text x="330" y="755" font-size="13" font-family="monospace" fill="#424242">
      dI/dt = β × S × I - γ × I
    </text>
  </g>
  
  <!-- Comparison Table -->
  <g id="comparison">
    <rect x="620" y="710" width="510" height="65" fill="#fff9c4" stroke="#f57f17" stroke-width="2" rx="6"/>
    <text x="875" y="735" font-size="14" font-weight="bold" text-anchor="middle" fill="#f57f17">
      SIRS Applications:
    </text>
    <text x="640" y="755" font-size="13" fill="#424242">
      • Fashion cycles • Common cold (short immunity)
    </text>
    <text x="640" y="770" font-size="13" fill="#424242">
      • Opinion dynamics • Seasonal flu strains
    </text>
  </g>
  
  <!-- Bottom legend -->
  <rect x="50" y="810" width="1100" height="30" fill="#e1f5fe" stroke="#0277bd" stroke-width="2" rx="6"/>
  <text x="600" y="830" font-size="12" text-anchor="middle" fill="#01579b">
    <tspan font-weight="bold">Key Difference:</tspan> SIR has permanent immunity (R state is terminal) • SIRS allows return to susceptible (cyclic dynamics)
  </text>
</svg>