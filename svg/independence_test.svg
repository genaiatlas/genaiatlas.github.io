<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="500" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Independence Test: X ⊥ Y vs X ⊥̸ Y
  </text>
  
  <!-- Independent Case -->
  <g transform="translate(100, 80)">
    <text x="150" y="0" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#27ae60">
      Independent (X ⊥ Y)
    </text>
    
    <!-- Scatter plot for independent variables -->
    <rect x="0" y="20" width="300" height="300" fill="white" stroke="#bdc3c7" stroke-width="2"/>
    <line x1="0" y1="320" x2="300" y2="320" stroke="#34495e" stroke-width="2"/>
    <line x1="0" y1="20" x2="0" y2="320" stroke="#34495e" stroke-width="2"/>
    
    <!-- Random scattered points -->
    <circle cx="50" cy="80" r="4" fill="#3498db" opacity="0.6"/>
    <circle cx="80" cy="250" r="4" fill="#3498db" opacity="0.6"/>
    <circle cx="120" cy="150" r="4" fill="#3498db" opacity="0.6"/>
    <circle cx="90" cy="180" r="4" fill="#3498db" opacity="0.6"/>
    <circle cx="150" cy="200" r="4" fill="#3498db" opacity="0.6"/>
    <circle cx="180" cy="90" r="4" fill="#3498db" opacity="0.6"/>
    <circle cx="200" cy="270" r="4" fill="#3498db" opacity="0.6"/>
    <circle cx="220" cy="130" r="4" fill="#3498db" opacity="0.6"/>
    <circle cx="250" cy="220" r="4" fill="#3498db" opacity="0.6"/>
    <circle cx="270" cy="160" r="4" fill="#3498db" opacity="0.6"/>
    <circle cx="60" cy="200" r="4" fill="#3498db" opacity="0.6"/>
    <circle cx="130" cy="100" r="4" fill="#3498db" opacity="0.6"/>
    <circle cx="170" cy="240" r="4" fill="#3498db" opacity="0.6"/>
    <circle cx="210" cy="190" r="4" fill="#3498db" opacity="0.6"/>
    <circle cx="240" cy="80" r="4" fill="#3498db" opacity="0.6"/>
    <circle cx="100" cy="120" r="4" fill="#3498db" opacity="0.6"/>
    <circle cx="160" cy="280" r="4" fill="#3498db" opacity="0.6"/>
    <circle cx="190" cy="140" r="4" fill="#3498db" opacity="0.6"/>
    <circle cx="230" cy="210" r="4" fill="#3498db" opacity="0.6"/>
    <circle cx="260" cy="110" r="4" fill="#3498db" opacity="0.6"/>
    
    <!-- Axis labels -->
    <text x="150" y="350" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#34495e">X</text>
    <text x="-10" y="170" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#34495e" transform="rotate(-90, -10, 170)">Y</text>
    
    <!-- Note -->
    <text x="150" y="380" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d">
      No pattern: Knowing X tells us nothing about Y
    </text>
  </g>
  
  <!-- Dependent Case -->
  <g transform="translate(450, 80)">
    <text x="150" y="0" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#e74c3c">
      Dependent (X ⊥̸ Y)
    </text>
    
    <!-- Scatter plot for dependent variables -->
    <rect x="0" y="20" width="300" height="300" fill="white" stroke="#bdc3c7" stroke-width="2"/>
    <line x1="0" y1="320" x2="300" y2="320" stroke="#34495e" stroke-width="2"/>
    <line x1="0" y1="20" x2="0" y2="320" stroke="#34495e" stroke-width="2"/>
    
    <!-- Correlated points with trend -->
    <circle cx="30" cy="280" r="4" fill="#e74c3c" opacity="0.6"/>
    <circle cx="50" cy="260" r="4" fill="#e74c3c" opacity="0.6"/>
    <circle cx="70" cy="250" r="4" fill="#e74c3c" opacity="0.6"/>
    <circle cx="90" cy="230" r="4" fill="#e74c3c" opacity="0.6"/>
    <circle cx="110" cy="210" r="4" fill="#e74c3c" opacity="0.6"/>
    <circle cx="130" cy="200" r="4" fill="#e74c3c" opacity="0.6"/>
    <circle cx="150" cy="180" r="4" fill="#e74c3c" opacity="0.6"/>
    <circle cx="170" cy="160" r="4" fill="#e74c3c" opacity="0.6"/>
    <circle cx="190" cy="150" r="4" fill="#e74c3c" opacity="0.6"/>
    <circle cx="210" cy="130" r="4" fill="#e74c3c" opacity="0.6"/>
    <circle cx="230" cy="110" r="4" fill="#e74c3c" opacity="0.6"/>
    <circle cx="250" cy="100" r="4" fill="#e74c3c" opacity="0.6"/>
    <circle cx="270" cy="80" r="4" fill="#e74c3c" opacity="0.6"/>
    <circle cx="60" cy="240" r="4" fill="#e74c3c" opacity="0.6"/>
    <circle cx="100" cy="220" r="4" fill="#e74c3c" opacity="0.6"/>
    <circle cx="140" cy="190" r="4" fill="#e74c3c" opacity="0.6"/>
    <circle cx="180" cy="145" r="4" fill="#e74c3c" opacity="0.6"/>
    <circle cx="220" cy="120" r="4" fill="#e74c3c" opacity="0.6"/>
    <circle cx="260" cy="90" r="4" fill="#e74c3c" opacity="0.6"/>
    
    <!-- Trend line -->
    <line x1="20" y1="290" x2="280" y2="70" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,5"/>
    
    <!-- Axis labels -->
    <text x="150" y="350" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#34495e">X</text>
    <text x="-10" y="170" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#34495e" transform="rotate(-90, -10, 170)">Y</text>
    
    <!-- Note -->
    <text x="150" y="380" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d">
      Clear pattern: Knowing X helps predict Y
    </text>
  </g>
</svg>