<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="700" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="500" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Degree Distribution in Networks
  </text>
  
  <!-- Subtitle -->
  <text x="500" y="70" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#7f8c8d">
    Long-tailed distribution with hub nodes
  </text>
  
  <!-- Main graph area -->
  <g transform="translate(100, 120)">
    <!-- Axes -->
    <line x1="0" y1="400" x2="700" y2="400" stroke="#34495e" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="400" stroke="#34495e" stroke-width="2"/>
    
    <!-- X-axis label -->
    <text x="350" y="450" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#2c3e50" font-weight="bold">
      Degree (k)
    </text>
    
    <!-- Y-axis label -->
    <text x="-200" y="-25" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#2c3e50" font-weight="bold" transform="rotate(-90, -200, -25)">
      Fraction of Nodes P(k)
    </text>
    
    <!-- X-axis ticks and labels -->
    <line x1="100" y1="400" x2="100" y2="410" stroke="#34495e" stroke-width="2"/>
    <text x="100" y="430" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#34495e">100</text>
    
    <line x1="200" y1="400" x2="200" y2="410" stroke="#34495e" stroke-width="2"/>
    <text x="200" y="430" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#34495e">200</text>
    
    <line x1="300" y1="400" x2="300" y2="410" stroke="#34495e" stroke-width="2"/>
    <text x="300" y="430" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#34495e">500</text>
    
    <line x1="450" y1="400" x2="450" y2="410" stroke="#34495e" stroke-width="2"/>
    <text x="450" y="430" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#34495e">1000</text>
    
    <line x1="600" y1="400" x2="600" y2="410" stroke="#34495e" stroke-width="2"/>
    <text x="600" y="430" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#34495e">5000+</text>
    
    <!-- Y-axis ticks -->
    <line x1="-10" y1="80" x2="0" y2="80" stroke="#34495e" stroke-width="2"/>
    <text x="-15" y="85" font-family="Arial, sans-serif" font-size="14" text-anchor="end" fill="#34495e">0.3</text>
    
    <line x1="-10" y1="160" x2="0" y2="160" stroke="#34495e" stroke-width="2"/>
    <text x="-15" y="165" font-family="Arial, sans-serif" font-size="14" text-anchor="end" fill="#34495e">0.2</text>
    
    <line x1="-10" y1="280" x2="0" y2="280" stroke="#34495e" stroke-width="2"/>
    <text x="-15" y="285" font-family="Arial, sans-serif" font-size="14" text-anchor="end" fill="#34495e">0.1</text>
    
    <!-- Power law curve (skewed right distribution) -->
    <path d="M 10 40 Q 40 45, 70 80 Q 100 140, 130 220 Q 160 280, 200 320 Q 250 350, 300 365 Q 400 380, 500 388 Q 600 393, 700 395" 
          fill="none" stroke="#3498db" stroke-width="4"/>
    
    <!-- Fill under curve -->
    <path d="M 10 40 Q 40 45, 70 80 Q 100 140, 130 220 Q 160 280, 200 320 Q 250 350, 300 365 Q 400 380, 500 388 Q 600 393, 700 395 L 700 400 L 10 400 Z" 
          fill="#3498db" opacity="0.2"/>
    
    <!-- Annotation for moderate degree nodes -->
    <circle cx="120" cy="230" r="6" fill="#e74c3c"/>
    <line x1="120" y1="230" x2="120" y2="150" stroke="#e74c3c" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="125" y="140" font-family="Arial, sans-serif" font-size="14" fill="#e74c3c" font-weight="bold">
      Most nodes: moderate degree
    </text>
    
    <!-- Annotation for hub nodes -->
    <circle cx="550" cy="390" r="6" fill="#9b59b6"/>
    <line x1="550" y1="390" x2="550" y2="310" stroke="#9b59b6" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="480" y="300" font-family="Arial, sans-serif" font-size="14" fill="#9b59b6" font-weight="bold">
      Few nodes: very high degree
    </text>
    <text x="520" y="320" font-family="Arial, sans-serif" font-size="14" fill="#9b59b6" font-weight="bold">
      (HUBS)
    </text>
  </g>
  
  <!-- Legend box -->
  <g transform="translate(750, 150)">
    <rect x="0" y="0" width="220" height="180" fill="white" stroke="#34495e" stroke-width="2" rx="5"/>
    <text x="110" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Key Features
    </text>
    
    <text x="10" y="55" font-family="Arial, sans-serif" font-size="13" fill="#34495e">
      • Right-skewed
    </text>
    <text x="10" y="80" font-family="Arial, sans-serif" font-size="13" fill="#34495e">
      • Long tail to the right
    </text>
    <text x="10" y="105" font-family="Arial, sans-serif" font-size="13" fill="#34495e">
      • High variance
    </text>
    <text x="10" y="130" font-family="Arial, sans-serif" font-size="13" fill="#34495e">
      • Few high-degree hubs
    </text>
    <text x="10" y="155" font-family="Arial, sans-serif" font-size="13" fill="#34495e">
      • Many moderate nodes
    </text>
  </g>
  
  <!-- Example networks -->
  <g transform="translate(100, 550)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">
      Networks with this distribution:
    </text>
    <text x="0" y="25" font-family="Arial, sans-serif" font-size="14" fill="#34495e">
      • Social Networks • World Wide Web • Biological Networks • Gene Regulatory Networks
    </text>
  </g>
</svg>