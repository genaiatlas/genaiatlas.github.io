<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="400" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">Deep Learning: Hierarchical Feature Learning</text>
  
  <!-- Input layer -->
  <rect x="50" y="80" width="120" height="240" fill="#e8f4f8" stroke="#3498db" stroke-width="2" rx="10"/>
  <text x="110" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Raw Input</text>
  <text x="110" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">(Pixels)</text>
  
  <!-- Simple features -->
  <circle cx="85" cy="150" r="15" fill="#3498db"/>
  <circle cx="135" cy="150" r="15" fill="#3498db"/>
  <circle cx="85" cy="190" r="15" fill="#3498db"/>
  <circle cx="135" cy="190" r="15" fill="#3498db"/>
  <circle cx="85" cy="230" r="15" fill="#3498db"/>
  <circle cx="135" cy="230" r="15" fill="#3498db"/>
  <circle cx="85" cy="270" r="15" fill="#3498db"/>
  <circle cx="135" cy="270" r="15" fill="#3498db"/>
  
  <!-- Arrow 1 -->
  <path d="M170 200 L220 200" stroke="#2c3e50" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="195" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Layer 1</text>
  
  <!-- Hidden layer 1 -->
  <rect x="240" y="120" width="120" height="160" fill="#e8f8e8" stroke="#27ae60" stroke-width="2" rx="10"/>
  <text x="300" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Basic Features</text>
  <text x="300" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">(Edges, Textures)</text>
  
  <!-- Feature representations -->
  <circle cx="270" cy="190" r="12" fill="#27ae60"/>
  <circle cx="330" cy="190" r="12" fill="#27ae60"/>
  <circle cx="270" cy="220" r="12" fill="#27ae60"/>
  <circle cx="330" cy="220" r="12" fill="#27ae60"/>
  <circle cx="270" cy="250" r="12" fill="#27ae60"/>
  <circle cx="330" cy="250" r="12" fill="#27ae60"/>
  
  <!-- Arrow 2 -->
  <path d="M360 200 L410 200" stroke="#2c3e50" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="385" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Layer 2</text>
  
  <!-- Hidden layer 2 -->
  <rect x="430" y="140" width="120" height="120" fill="#fff8e8" stroke="#f39c12" stroke-width="2" rx="10"/>
  <text x="490" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Parts</text>
  <text x="490" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">(Eyes, Wheels)</text>
  
  <!-- Complex features -->
  <circle cx="460" cy="210" r="10" fill="#f39c12"/>
  <circle cx="520" cy="210" r="10" fill="#f39c12"/>
  <circle cx="460" cy="235" r="10" fill="#f39c12"/>
  <circle cx="520" cy="235" r="10" fill="#f39c12"/>
  
  <!-- Arrow 3 -->
  <path d="M550 200 L600 200" stroke="#2c3e50" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="575" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Layer 3</text>
  
  <!-- Output layer -->
  <rect x="620" y="160" width="120" height="80" fill="#f8e8e8" stroke="#e74c3c" stroke-width="2" rx="10"/>
  <text x="680" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Objects</text>
  <text x="680" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">(Dog, Cat, Car)</text>
  
  <!-- Final output -->
  <circle cx="680" cy="220" r="8" fill="#e74c3c"/>
  
  <!-- Complexity indicator -->
  <text x="400" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-style="italic" fill="#7f8c8d">Increasing Complexity →</text>
  <path d="M150 350 L650 350" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/>
    </marker>
  </defs>
</svg>