<svg viewBox="0 0 800 650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'Arial', sans-serif; font-size: 24px; font-weight: bold; fill: #2c3e50; }
      .component-title { font-family: 'Arial', sans-serif; font-size: 12px; font-weight: bold; fill: white; }
      .component-desc { font-family: 'Arial', sans-serif; font-size: 9px; fill: white; }
      .section-title { font-family: 'Arial', sans-serif; font-size: 16px; font-weight: bold; fill: #2c3e50; }
      .arrow { stroke: #34495e; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .data-flow { stroke: #3498db; stroke-width: 3; fill: none; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" class="title">Deployment Architecture</text>
  
  <!-- User/Client Layer -->
  <text x="100" y="80" class="section-title">Client Layer</text>
  
  <!-- Web App -->
  <rect x="50" y="90" width="100" height="60" rx="8" fill="#3498db"/>
  <text x="100" y="110" text-anchor="middle" class="component-title">Web App</text>
  <text x="100" y="125" text-anchor="middle" class="component-desc">User Interface</text>
  <text x="100" y="138" text-anchor="middle" class="component-desc">Frontend</text>
  
  <!-- Mobile App -->
  <rect x="170" y="90" width="100" height="60" rx="8" fill="#2ecc71"/>
  <text x="220" y="110" text-anchor="middle" class="component-title">Mobile App</text>
  <text x="220" y="125" text-anchor="middle" class="component-desc">iOS/Android</text>
  <text x="220" y="138" text-anchor="middle" class="component-desc">Native/Hybrid</text>
  
  <!-- API Client -->
  <rect x="290" y="90" width="100" height="60" rx="8" fill="#f39c12"/>
  <text x="340" y="110" text-anchor="middle" class="component-title">API Client</text>
  <text x="340" y="125" text-anchor="middle" class="component-desc">External</text>
  <text x="340" y="138" text-anchor="middle" class="component-desc">Integration</text>
  
  <!-- API Gateway -->
  <rect x="450" y="90" width="150" height="60" rx="8" fill="#9b59b6"/>
  <text x="525" y="110" text-anchor="middle" class="component-title">API Gateway</text>
  <text x="525" y="125" text-anchor="middle" class="component-desc">Authentication, Rate Limiting</text>
  <text x="525" y="138" text-anchor="middle" class="component-desc">Load Balancing, Monitoring</text>
  
  <!-- Service Layer -->
  <text x="100" y="200" class="section-title">Service Layer</text>
  
  <!-- Model Serving Service -->
  <rect x="50" y="210" width="120" height="70" rx="8" fill="#e74c3c"/>
  <text x="110" y="230" text-anchor="middle" class="component-title">Model Serving</text>
  <text x="110" y="245" text-anchor="middle" class="component-desc">• Real-time inference</text>
  <text x="110" y="258" text-anchor="middle" class="component-desc">• Batch predictions</text>
  <text x="110" y="271" text-anchor="middle" class="component-desc">• Model versioning</text>
  
  <!-- Feature Store -->
  <rect x="190" y="210" width="120" height="70" rx="8" fill="#1abc9c"/>
  <text x="250" y="230" text-anchor="middle" class="component-title">Feature Store</text>
  <text x="250" y="245" text-anchor="middle" class="component-desc">• Feature serving</text>
  <text x="250" y="258" text-anchor="middle" class="component-desc">• Feature caching</text>
  <text x="250" y="271" text-anchor="middle" class="component-desc">• Feature lineage</text>
  
  <!-- Model Registry -->
  <rect x="330" y="210" width="120" height="70" rx="8" fill="#95a5a6"/>
  <text x="390" y="230" text-anchor="middle" class="component-title">Model Registry</text>
  <text x="390" y="245" text-anchor="middle" class="component-desc">• Model storage</text>
  <text x="390" y="258" text-anchor="middle" class="component-desc">• Version control</text>
  <text x="390" y="271" text-anchor="middle" class="component-desc">• Metadata</text>
  
  <!-- Monitoring Service -->
  <rect x="470" y="210" width="120" height="70" rx="8" fill="#34495e"/>
  <text x="530" y="230" text-anchor="middle" class="component-title">Monitoring</text>
  <text x="530" y="245" text-anchor="middle" class="component-desc">• Performance metrics</text>
  <text x="530" y="258" text-anchor="middle" class="component-desc">• Model drift detection</text>
  <text x="530" y="271" text-anchor="middle" class="component-desc">• Alerting</text>
  
  <!-- Data Layer -->
  <text x="100" y="330" class="section-title">Data Layer</text>
  
  <!-- Real-time Data -->
  <rect x="50" y="340" width="110" height="60" rx="8" fill="#3498db"/>
  <text x="105" y="360" text-anchor="middle" class="component-title">Real-time Data</text>
  <text x="105" y="375" text-anchor="middle" class="component-desc">Streaming ingestion</text>
  <text x="105" y="388" text-anchor="middle" class="component-desc">Kafka, Kinesis</text>
  
  <!-- Data Warehouse -->
  <rect x="180" y="340" width="110" height="60" rx="8" fill="#2ecc71"/>
  <text x="235" y="360" text-anchor="middle" class="component-title">Data Warehouse</text>
  <text x="235" y="375" text-anchor="middle" class="component-desc">Historical data</text>
  <text x="235" y="388" text-anchor="middle" class="component-desc">Analytics</text>
  
  <!-- Data Lake -->
  <rect x="310" y="340" width="110" height="60" rx="8" fill="#f39c12"/>
  <text x="365" y="360" text-anchor="middle" class="component-title">Data Lake</text>
  <text x="365" y="375" text-anchor="middle" class="component-desc">Raw data storage</text>
  <text x="365" y="388" text-anchor="middle" class="component-desc">S3, HDFS</text>
  
  <!-- Cache -->
  <rect x="440" y="340" width="110" height="60" rx="8" fill="#9b59b6"/>
  <text x="495" y="360" text-anchor="middle" class="component-title">Cache</text>
  <text x="495" y="375" text-anchor="middle" class="component-desc">Fast data access</text>
  <text x="495" y="388" text-anchor="middle" class="component-desc">Redis, Memcached</text>
  
  <!-- Infrastructure Layer -->
  <text x="100" y="450" class="section-title">Infrastructure</text>
  
  <!-- Container Orchestration -->
  <rect x="50" y="460" width="140" height="60" rx="8" fill="#e67e22"/>
  <text x="120" y="480" text-anchor="middle" class="component-title">Container Platform</text>
  <text x="120" y="495" text-anchor="middle" class="component-desc">Kubernetes, Docker</text>
  <text x="120" y="508" text-anchor="middle" class="component-desc">Auto-scaling, Service discovery</text>
  
  <!-- CI/CD Pipeline -->
  <rect x="210" y="460" width="140" height="60" rx="8" fill="#1abc9c"/>
  <text x="280" y="480" text-anchor="middle" class="component-title">CI/CD Pipeline</text>
  <text x="280" y="495" text-anchor="middle" class="component-desc">Automated deployment</text>
  <text x="280" y="508" text-anchor="middle" class="component-desc">Testing, Validation</text>
  
  <!-- Cloud Infrastructure -->
  <rect x="370" y="460" width="140" height="60" rx="8" fill="#34495e"/>
  <text x="440" y="480" text-anchor="middle" class="component-title">Cloud Platform</text>
  <text x="440" y="495" text-anchor="middle" class="component-desc">AWS, Azure, GCP</text>
  <text x="440" y="508" text-anchor="middle" class="component-desc">Compute, Storage, Network</text>
  
  <!-- Data Flow Arrows -->
  <path d="M 100 150 L 100 200" class="arrow"/>
  <path d="M 220 150 L 220 200" class="arrow"/>
  <path d="M 340 150 L 340 200" class="arrow"/>
  <path d="M 525 150 L 525 200" class="arrow"/>
  
  <path d="M 110 280 L 110 330" class="arrow"/>
  <path d="M 250 280 L 250 330" class="arrow"/>
  <path d="M 390 280 L 390 330" class="arrow"/>
  <path d="M 530 280 L 530 330" class="arrow"/>
  
  <path d="M 120 400 L 120 450" class="arrow"/>
  <path d="M 280 400 L 280 450" class="arrow"/>
  <path d="M 440 400 L 440 450" class="arrow"/>
  
  <!-- Deployment Strategies -->
  <text x="580" y="330" class="section-title">Deployment Types</text>
  
  <!-- Batch Processing -->
  <rect x="580" y="340" width="150" height="45" rx="5" fill="#ecf0f1" stroke="#bdc3c7"/>
  <text x="655" y="360" text-anchor="middle" style="font-family: Arial; font-size: 12px; font-weight: bold; fill: #2c3e50;">Batch Processing</text>
  <text x="655" y="375" text-anchor="middle" style="font-family: Arial; font-size: 10px; fill: #7f8c8d;">Scheduled, large-scale predictions</text>
  
  <!-- Real-time Inference -->
  <rect x="580" y="395" width="150" height="45" rx="5" fill="#ecf0f1" stroke="#bdc3c7"/>
  <text x="655" y="415" text-anchor="middle" style="font-family: Arial; font-size: 12px; font-weight: bold; fill: #2c3e50;">Real-time Inference</text>
  <text x="655" y="430" text-anchor="middle" style="font-family: Arial; font-size: 10px; fill: #7f8c8d;">Low-latency, individual predictions</text>
  
  <!-- Edge Deployment -->
  <rect x="580" y="450" width="150" height="45" rx="5" fill="#ecf0f1" stroke="#bdc3c7"/>
  <text x="655" y="470" text-anchor="middle" style="font-family: Arial; font-size: 12px; font-weight: bold; fill: #2c3e50;">Edge Deployment</text>
  <text x="655" y="485" text-anchor="middle" style="font-family: Arial; font-size: 10px; fill: #7f8c8d;">Local devices, offline capability</text>
  
  <!-- Key Considerations -->
  <text x="50" y="560" style="font-family: Arial; font-size: 14px; font-weight: bold; fill: #2c3e50;">Key Considerations:</text>
  <text x="50" y="580" style="font-family: Arial; font-size: 12px; fill: #2c3e50;">• Scalability: Handle varying loads</text>
  <text x="50" y="595" style="font-family: Arial; font-size: 12px; fill: #2c3e50;">• Reliability: High availability, fault tolerance</text>
  <text x="50" y="610" style="font-family: Arial; font-size: 12px; fill: #2c3e50;">• Security: Authentication, authorization, encryption</text>
  <text x="50" y="625" style="font-family: Arial; font-size: 12px; fill: #2c3e50;">• Monitoring: Performance tracking, error detection</text>
  
  <text x="400" y="580" style="font-family: Arial; font-size: 12px; fill: #2c3e50;">• Cost optimization: Resource usage efficiency</text>
  <text x="400" y="595" style="font-family: Arial; font-size: 12px; fill: #2c3e50;">• Compliance: Data privacy, regulatory requirements</text>
  <text x="400" y="610" style="font-family: Arial; font-size: 12px; fill: #2c3e50;">• Maintainability: Version control, rollback capability</text>
  <text x="400" y="625" style="font-family: Arial; font-size: 12px; fill: #2c3e50;">• Performance: Latency, throughput optimization</text>
</svg>