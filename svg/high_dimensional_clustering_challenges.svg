<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">High-Dimensional Clustering Challenges</text>
  
  <!-- Subtitle -->
  <text x="400" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#7f8c8d">The Curse of Dimensionality in Clustering</text>
  
  <!-- 2D Case (Left Side) -->
  <g id="low-dimensional">
    <rect x="50" y="80" width="300" height="220" fill="#e8f6f3" stroke="#27ae60" stroke-width="2" rx="10"/>
    <text x="200" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#27ae60">2D Data - Easy Clustering</text>
    
    <!-- 2D coordinate system -->
    <line x1="80" y1="280" x2="320" y2="280" stroke="#34495e" stroke-width="1"/>
    <line x1="80" y1="280" x2="80" y2="120" stroke="#34495e" stroke-width="1"/>
    
    <!-- Axis labels -->
    <text x="200" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#34495e">Feature 1</text>
    <text x="65" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#34495e" transform="rotate(-90, 65, 200)">Feature 2</text>
    
    <!-- Clear clusters in 2D -->
    <g id="cluster-1-2d">
      <ellipse cx="130" cy="200" rx="25" ry="20" fill="#e74c3c" opacity="0.3"/>
      <circle cx="125" cy="195" r="3" fill="#e74c3c"/>
      <circle cx="135" cy="200" r="3" fill="#e74c3c"/>
      <circle cx="130" cy="210" r="3" fill="#e74c3c"/>
      <circle cx="140" cy="190" r="3" fill="#e74c3c"/>
      <circle cx="120" cy="205" r="3" fill="#e74c3c"/>
    </g>
    
    <g id="cluster-2-2d">
      <ellipse cx="250" cy="170" rx="25" ry="20" fill="#3498db" opacity="0.3"/>
      <circle cx="245" cy="165" r="3" fill="#3498db"/>
      <circle cx="255" cy="170" r="3" fill="#3498db"/>
      <circle cx="250" cy="180" r="3" fill="#3498db"/>
      <circle cx="260" cy="160" r="3" fill="#3498db"/>
      <circle cx="240" cy="175" r="3" fill="#3498db"/>
    </g>
    
    <g id="cluster-3-2d">
      <ellipse cx="180" cy="240" rx="25" ry="20" fill="#27ae60" opacity="0.3"/>
      <circle cx="175" cy="235" r="3" fill="#27ae60"/>
      <circle cx="185" cy="240" r="3" fill="#27ae60"/>
      <circle cx="180" cy="250" r="3" fill="#27ae60"/>
      <circle cx="190" cy="230" r="3" fill="#27ae60"/>
      <circle cx="170" cy="245" r="3" fill="#27ae60"/>
    </g>
    
    <!-- Distance illustration -->
    <line x1="125" y1="195" x2="245" y2="165" stroke="#e67e22" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="180" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#e67e22">Clear distances</text>
  </g>
  
  <!-- High-D Case (Right Side) -->
  <g id="high-dimensional">
    <rect x="450" y="80" width="300" height="220" fill="#fdeaea" stroke="#e74c3c" stroke-width="2" rx="10"/>
    <text x="600" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#e74c3c">High-D Data - Clustering Issues</text>
    
    <!-- Multiple dimension representation -->
    <text x="470" y="130" font-family="Arial, sans-serif" font-size="12" fill="#34495e">Features: x₁, x₂, x₃, ..., x₁₀₀₀</text>
    
    <!-- Cloud of similar-looking points -->
    <g id="high-d-cloud">
      <circle cx="500" cy="160" r="2" fill="#95a5a6"/>
      <circle cx="520" cy="165" r="2" fill="#95a5a6"/>
      <circle cx="540" cy="170" r="2" fill="#95a5a6"/>
      <circle cx="560" cy="175" r="2" fill="#95a5a6"/>
      <circle cx="580" cy="180" r="2" fill="#95a5a6"/>
      <circle cx="600" cy="185" r="2" fill="#95a5a6"/>
      <circle cx="620" cy="190" r="2" fill="#95a5a6"/>
      <circle cx="640" cy="195" r="2" fill="#95a5a6"/>
      <circle cx="660" cy="200" r="2" fill="#95a5a6"/>
      <circle cx="680" cy="205" r="2" fill="#95a5a6"/>
      <circle cx="700" cy="210" r="2" fill="#95a5a6"/>
      <circle cx="720" cy="215" r="2" fill="#95a5a6"/>
      
      <!-- More scattered points -->
      <circle cx="510" cy="190" r="2" fill="#95a5a6"/>
      <circle cx="530" cy="195" r="2" fill="#95a5a6"/>
      <circle cx="550" cy="200" r="2" fill="#95a5a6"/>
      <circle cx="570" cy="155" r="2" fill="#95a5a6"/>
      <circle cx="590" cy="160" r="2" fill="#95a5a6"/>
      <circle cx="610" cy="165" r="2" fill="#95a5a6"/>
      <circle cx="630" cy="170" r="2" fill="#95a5a6"/>
      <circle cx="650" cy="175" r="2" fill="#95a5a6"/>
      <circle cx="670" cy="180" r="2" fill="#95a5a6"/>
      <circle cx="690" cy="185" r="2" fill="#95a5a6"/>
    </g>
    
    <!-- Distance illustration showing confusion -->
    <line x1="500" y1="160" x2="720" y2="215" stroke="#e67e22" stroke-width="2" stroke-dasharray="3,3"/>
    <line x1="500" y1="160" x2="530" y2="195" stroke="#e67e22" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="600" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#e67e22">All distances similar!</text>
    
    <!-- Warning symbol -->
    <polygon points="470,260 480,280 460,280" fill="#f39c12"/>
    <text x="470" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">!</text>
    <text x="520" y="275" font-family="Arial, sans-serif" font-size="11" fill="#f39c12">Curse of Dimensionality</text>
  </g>
  
  <!-- Problem Illustration -->
  <rect x="100" y="330" width="600" height="180" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2" rx="10"/>
  <text x="400" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Why High Dimensions Cause Problems</text>
  
  <!-- Problem 1: Distance Concentration -->
  <g id="problem1">
    <rect x="120" y="370" width="150" height="60" fill="#fadbd8" stroke="#e74c3c" stroke-width="1" rx="5"/>
    <text x="195" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#c0392b">Distance Concentration</text>
    <text x="130" y="400" font-family="Arial, sans-serif" font-size="10" fill="#922b21">All points appear</text>
    <text x="130" y="415" font-family="Arial, sans-serif" font-size="10" fill="#922b21">equidistant from each other</text>
  </g>
  
  <!-- Problem 2: Sparsity -->
  <g id="problem2">
    <rect x="290" y="370" width="150" height="60" fill="#d6eaf8" stroke="#3498db" stroke-width="1" rx="5"/>
    <text x="365" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2471a3">Data Sparsity</text>
    <text x="300" y="400" font-family="Arial, sans-serif" font-size="10" fill="#1b4f72">Points spread too far</text>
    <text x="300" y="415" font-family="Arial, sans-serif" font-size="10" fill="#1b4f72">apart in high-D space</text>
  </g>
  
  <!-- Problem 3: Computational -->
  <g id="problem3">
    <rect x="460" y="370" width="150" height="60" fill="#d5f4e6" stroke="#27ae60" stroke-width="1" rx="5"/>
    <text x="535" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#196f3d">Computational Cost</text>
    <text x="470" y="400" font-family="Arial, sans-serif" font-size="10" fill="#0e4b2b">Exponential growth in</text>
    <text x="470" y="415" font-family="Arial, sans-serif" font-size="10" fill="#0e4b2b">processing requirements</text>
  </g>
  
  <!-- Solutions Box -->
  <rect x="120" y="450" width="490" height="50" fill="#fef9e7" stroke="#f4d03f" stroke-width="2" rx="5"/>
  <text x="130" y="470" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#8b7d00">Common Solutions:</text>
  <text x="130" y="485" font-family="Arial, sans-serif" font-size="11" fill="#6c5f00">• Dimensionality reduction (PCA, t-SNE)</text>
  <text x="320" y="485" font-family="Arial, sans-serif" font-size="11" fill="#6c5f00">• Feature selection</text>
  <text x="450" y="485" font-family="Arial, sans-serif" font-size="11" fill="#6c5f00">• Specialized algorithms</text>
  
  <!-- Mathematical illustration -->
  <g id="math-explanation">
    <text x="50" y="540" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Mathematical Insight:</text>
    <text x="50" y="560" font-family="Arial, sans-serif" font-size="11" fill="#34495e">In high dimensions, the ratio of distances approaches 1:</text>
    
    <!-- Mathematical formula -->
    <text x="350" y="560" font-family="Arial, sans-serif" font-size="11" fill="#8e44ad">lim</text>
    <text x="370" y="565" font-family="Arial, sans-serif" font-size="8" fill="#8e44ad">d→∞</text>
    <text x="400" y="560" font-family="Arial, sans-serif" font-size="11" fill="#8e44ad">( dist_max - dist_min ) / dist_min → 0</text>
    
    <text x="50" y="580" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">This makes similarity-based clustering increasingly difficult and unreliable.</text>
  </g>
</svg>