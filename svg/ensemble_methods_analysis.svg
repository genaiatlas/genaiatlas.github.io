  <text x="693" y="163" font-family="Arial, sans-serif" font-size="9" fill="white">
    • R²: 0.948965
  </text>
  <text x="693" y="176" font-family="Arial, sans-serif" font-size="9" fill="white">
    • Rank: 5th
  </text>
  <text x="693" y="189" font-family="Arial, sans-serif" font-size="9" fill="white">
