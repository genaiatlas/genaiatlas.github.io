  </text>
  
  <!-- AdaBoost -->
  <rect x="830" y="120" width="130" height="80" rx="8" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="1"/>
  <text x="895" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">
