  </text>
  <text x="545" y="265" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Can achieve low bias
  </text>
  <text x="545" y="280" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Risk of overfitting
  </text>
  <text x="545" y="295" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Sensitive to hyperparameters
  </text>
  
  <!-- Performance Analysis Section -->
  <rect x="50" y="330" width="900" height="240" rx="15" fill="url(#performanceGrad)" stroke="#FF9800" stroke-width="3"/>
  <text x="500" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">
