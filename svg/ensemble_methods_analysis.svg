    Key Insights:
  </text>
  <text x="510" y="400" font-family="Arial, sans-serif" font-size="11" fill="white">
    1. Bagging Methods Dominate Top Performance
  </text>
  <text x="515" y="415" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Random Forest variants: 1st and 2nd place
  </text>
  <text x="515" y="430" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Bagging Regressor: Strong 3rd place showing
  </text>
  <text x="515" y="445" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Consistent high R² values (>0.97)
  </text>
  
  <text x="510" y="465" font-family="Arial, sans-serif" font-size="11" fill="white">
    2. Boosting Methods Show Mixed Results
  </text>
  <text x="515" y="480" font-family="Arial, sans-serif" font-size="10" fill="white">
    • XGBoost: Decent performance, room for tuning
  </text>
  <text x="515" y="495" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Traditional GBM: Moderate performance
  </text>
  <text x="515" y="510" font-family="Arial, sans-serif" font-size="10" fill="white">
    • AdaBoost: Poor fit for this problem type
  </text>
  
  <!-- Recommendations -->
  <text x="700" y="380" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Recommendations:
  </text>
  <text x="710" y="400" font-family="Arial, sans-serif" font-size="11" fill="white">
    Production Strategy:
  </text>
  <text x="715" y="415" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Deploy Random Forest Tuned
  </text>
  <text x="715" y="430" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Bagging as backup model
  </text>
  <text x="715" y="445" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Monitor ensemble consistency
  </text>
  
  <text x="710" y="465" font-family="Arial, sans-serif" font-size="11" fill="white">
    Future Optimization:
  </text>
  <text x="715" y="480" font-family="Arial, sans-serif" font-size="10" fill="white">
