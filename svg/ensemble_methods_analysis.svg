  </text>
  
  <!-- Bottom Summary -->
  <rect x="100" y="580" width="800" height="15" rx="5" fill="#37474F"/>
  <text x="500" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">
    Conclusion: Bagging methods excel for this dataset. Random Forest with tuning achieves optimal performance.
  </text>
