  </text>
  
  <!-- Performance bars -->
  <text x="70" y="400" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Random Forest Tuned</text>
  <rect x="200" y="392" width="100" height="12" rx="6" fill="#FFD700"/>
  <text x="310" y="402" font-family="Arial, sans-serif" font-size="9" fill="white">1.296 (Best)</text>
  
  <text x="70" y="420" font-family="Arial, sans-serif" font-size="10" fill="white">Random Forest</text>
  <rect x="200" y="412" width="105" height="12" rx="6" fill="#4CAF50"/>
  <text x="315" y="422" font-family="Arial, sans-serif" font-size="9" fill="white">1.304</text>
  
  <text x="70" y="440" font-family="Arial, sans-serif" font-size="10" fill="white">Bagging Regressor</text>
  <rect x="200" y="432" width="115" height="12" rx="6" fill="#4CAF50"/>
  <text x="325" y="442" font-family="Arial, sans-serif" font-size="9" fill="white">1.369</text>
  
  <text x="70" y="460" font-family="Arial, sans-serif" font-size="10" fill="white">XGBoost</text>
  <rect x="200" y="452" width="135" height="12" rx="6" fill="#2196F3"/>
  <text x="345" y="462" font-family="Arial, sans-serif" font-size="9" fill="white">1.508</text>
  
  <text x="70" y="480" font-family="Arial, sans-serif" font-size="10" fill="white">Gradient Boosting</text>
  <rect x="200" y="472" width="155" height="12" rx="6" fill="#2196F3"/>
  <text x="365" y="482" font-family="Arial, sans-serif" font-size="9" fill="white">1.793</text>
  
  <text x="70" y="500" font-family="Arial, sans-serif" font-size="10" fill="white">AdaBoost</text>
  <rect x="200" y="492" width="200" height="12" rx="6" fill="#F44336"/>
  <text x="410" y="502" font-family="Arial, sans-serif" font-size="9" fill="white">2.375 (Worst)</text>
  
  <!-- Key Insights -->
