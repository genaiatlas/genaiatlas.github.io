  <text x="80" y="170" font-family="Arial, sans-serif" font-size="10" fill="white">
    • R²: 0.973011
  </text>
  <text x="80" y="185" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Rank: 2nd
  </text>
  
  <!-- Bagging Regressor -->
  <rect x="270" y="120" width="180" height="80" rx="8" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="1"/>
  <text x="360" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Bagging Regressor
  </text>
  <text x="280" y="155" font-family="Arial, sans-serif" font-size="10" fill="white">
    • RMSE: 1.368940
  </text>
  <text x="280" y="170" font-family="Arial, sans-serif" font-size="10" fill="white">
    • R²: 0.970242
  </text>
  <text x="280" y="185" font-family="Arial, sans-serif" font-size="10" fill="white">
