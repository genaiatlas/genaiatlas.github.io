<svg viewBox="0 0 1000 850" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="850" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="500" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Joblib Workflow Diagram
  </text>
  
  <text x="500" y="60" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#7f8c8d" font-style="italic">
    Optimized for Machine Learning and NumPy Arrays
  </text>
  
  <!-- Step 0: Installation -->
  <g transform="translate(100, 90)">
    <rect x="0" y="0" width="800" height="70" fill="white" stroke="#9b59b6" stroke-width="3" rx="8"/>
    <circle cx="35" cy="35" r="25" fill="#9b59b6"/>
    <text x="35" y="43" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">0</text>
    
    <text x="80" y="28" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#9b59b6">
      Install Joblib (One-time setup)
    </text>
    <rect x="80" y="38" width="700" height="25" fill="#ecf0f1" rx="3"/>
    <text x="90" y="56" font-family="Courier New, monospace" font-size="13" fill="#2c3e50">
      pip install joblib
    </text>
  </g>
  
  <!-- Arrow -->
  <line x1="500" y1="170" x2="500" y2="200" stroke="#95a5a6" stroke-width="3" marker-end="url(#arrowhead-jl)"/>
  
  <!-- Step 1: Import Joblib -->
  <g transform="translate(100, 210)">
    <rect x="0" y="0" width="800" height="70" fill="white" stroke="#3498db" stroke-width="3" rx="8"/>
    <circle cx="35" cy="35" r="25" fill="#3498db"/>
    <text x="35" y="43" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">1</text>
    
    <text x="80" y="28" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#3498db">
      Import Joblib Library
    </text>
    <rect x="80" y="38" width="700" height="25" fill="#ecf0f1" rx="3"/>
    <text x="90" y="56" font-family="Courier New, monospace" font-size="13" fill="#2c3e50">
      import joblib
    </text>
  </g>
  
  <!-- Arrow -->
  <line x1="500" y1="290" x2="500" y2="320" stroke="#95a5a6" stroke-width="3" marker-end="url(#arrowhead-jl)"/>
  
  <!-- Step 2: Train Model -->
  <g transform="translate(100, 330)">
    <rect x="0" y="0" width="800" height="110" fill="white" stroke="#27ae60" stroke-width="3" rx="8"/>
    <circle cx="35" cy="35" r="25" fill="#27ae60"/>
    <text x="35" y="43" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">2</text>
    
    <text x="80" y="28" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#27ae60">
      Create and Train Model
    </text>
    <rect x="80" y="38" width="700" height="65" fill="#ecf0f1" rx="3"/>
    <text x="90" y="56" font-family="Courier New, monospace" font-size="12" fill="#2c3e50">
      model = RandomForestRegressor(n_estimators=120, max_depth=None)
    </text>
    <text x="90" y="75" font-family="Courier New, monospace" font-size="12" fill="#2c3e50">
      model.fit(X_train, y_train)
    </text>
    <text x="90" y="94" font-family="Courier New, monospace" font-size="12" fill="#7f8c8d">
      # Model trained with large NumPy arrays
    </text>
  </g>
  
  <!-- Arrow -->
  <line x1="500" y1="450" x2="500" y2="480" stroke="#95a5a6" stroke-width="3" marker-end="url(#arrowhead-jl)"/>
  
  <!-- Step 3: Save with Joblib -->
  <g transform="translate(100, 490)">
    <rect x="0" y="0" width="800" height="100" fill="white" stroke="#f39c12" stroke-width="3" rx="8"/>
    <circle cx="35" cy="35" r="25" fill="#f39c12"/>
    <text x="35" y="43" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">3</text>
    
    <text x="80" y="28" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#f39c12">
      Save Model (Efficient Serialization)
    </text>
    <rect x="80" y="38" width="700" height="55" fill="#ecf0f1" rx="3"/>
    <text x="90" y="56" font-family="Courier New, monospace" font-size="12" fill="#2c3e50">
      joblib.dump(model, 'model.joblib')
    </text>
    <text x="90" y="75" font-family="Courier New, monospace" font-size="12" fill="#7f8c8d">
      # Simple one-line save - optimized for NumPy arrays
    </text>
  </g>
  
  <!-- Storage representation with performance indicators -->
  <g transform="translate(350, 610)">
    <rect x="0" y="0" width="300" height="100" fill="#fff3cd" stroke="#f39c12" stroke-width="2" rx="5"/>
    <rect x="20" y="15" width="260" height="50" fill="#f39c12" opacity="0.3" rx="3"/>
    <text x="150" y="35" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#856404">
      💾 model.joblib
    </text>
    <text x="150" y="52" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#856404">
      Compressed &amp; Efficiently Stored
    </text>
    
    <text x="25" y="80" font-family="Arial, sans-serif" font-size="9" fill="#27ae60">
      ⚡ Faster load times
    </text>
    <text x="160" y="80" font-family="Arial, sans-serif" font-size="9" fill="#27ae60">
      💾 Smaller file size
    </text>
  </g>
  
  <!-- Arrow -->
  <line x1="500" y1="720" x2="500" y2="750" stroke="#95a5a6" stroke-width="3" marker-end="url(#arrowhead-jl)"/>
  
  <!-- Step 4: Load with Joblib -->
  <g transform="translate(100, 760)">
    <rect x="0" y="0" width="800" height="80" fill="white" stroke="#e74c3c" stroke-width="3" rx="8"/>
    <circle cx="35" cy="35" r="25" fill="#e74c3c"/>
    <text x="35" y="43" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">4</text>
    
    <text x="80" y="28" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#e74c3c">
      Load Model (Fast Deserialization)
    </text>
    <rect x="80" y="38" width="700" height="35" fill="#ecf0f1" rx="3"/>
    <text x="90" y="56" font-family="Courier New, monospace" font-size="12" fill="#2c3e50">
      loaded_model = joblib.load('model.joblib')
    </text>
  </g>
  
  <!-- Left Panel: Advantages -->
  <g transform="translate(30, 90)">
    <rect x="0" y="610" width="300" height="210" fill="#d5f4e6" stroke="#27ae60" stroke-width="2" rx="8"/>
    <text x="150" y="635" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#27ae60">
      ✓ Joblib Advantages
    </text>
    
    <circle cx="20" cy="660" r="4" fill="#27ae60"/>
    <text x="35" y="664" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
      ⚡ Optimized for NumPy arrays
    </text>
    
    <circle cx="20" cy="685" r="4" fill="#27ae60"/>
    <text x="35" y="689" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
      🚀 Faster than Pickle for ML models
    </text>
    
    <circle cx="20" cy="710" r="4" fill="#27ae60"/>
    <text x="35" y="714" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
      💾 Better compression efficiency
    </text>
    
    <circle cx="20" cy="735" r="4" fill="#27ae60"/>
    <text x="35" y="739" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
      🔄 Parallel processing support
    </text>
    
    <circle cx="20" cy="760" r="4" fill="#27ae60"/>
    <text x="35" y="764" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
      🤝 Seamless scikit-learn integration
    </text>
    
    <circle cx="20" cy="785" r="4" fill="#27ae60"/>
    <text x="35" y="789" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
      🧠 Memory efficient for large datasets
    </text>
  </g>
  
  <!-- Right Panel: Performance Insights -->
  <g transform="translate(670, 90)">
    <rect x="0" y="610" width="300" height="210" fill="#ebf5fb" stroke="#3498db" stroke-width="2" rx="8"/>
    <text x="150" y="635" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#3498db">
      📊 Performance Insights
    </text>
    
    <text x="150" y="665" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#34495e">
      Why Joblib is Faster:
    </text>
    
    <text x="20" y="690" font-family="Arial, sans-serif" font-size="10" fill="#34495e">
      • Uses mmap for efficient memory
    </text>
    <text x="30" y="705" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">
      access with large arrays
    </text>
    
    <text x="20" y="725" font-family="Arial, sans-serif" font-size="10" fill="#34495e">
      • Compression algorithms optimized
    </text>
    <text x="30" y="740" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">
      for scientific computing
    </text>
    
    <text x="20" y="760" font-family="Arial, sans-serif" font-size="10" fill="#34495e">
      • Parallel I/O operations reduce
    </text>
    <text x="30" y="775" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">
      serialization time
    </text>
    
    <text x="150" y="800" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#3498db" font-style="italic">
      Perfect for production ML systems!
    </text>
  </g>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead-jl" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#95a5a6"/>
    </marker>
  </defs>
</svg>