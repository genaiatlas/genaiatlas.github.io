<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">Word Clustering in MIT Research Abstracts</text>
  
  <!-- Subtitle -->
  <text x="400" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#7f8c8d">Discovering research themes through co-occurrence patterns</text>
  
  <!-- Fabrication Cluster -->
  <g id="fabrication-cluster">
    <ellipse cx="200" cy="170" rx="140" ry="100" fill="#e74c3c" opacity="0.15" stroke="#c0392b" stroke-width="2"/>
    <text x="200" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#c0392b">FABRICATION</text>
    
    <!-- Word nodes -->
    <rect x="140" y="140" width="80" height="25" fill="#e74c3c" rx="12"/>
    <text x="180" y="157" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">TEMPERATURE</text>
    
    <rect x="160" y="175" width="70" height="25" fill="#e74c3c" rx="12"/>
    <text x="195" y="192" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">GRAPHENE</text>
    
    <rect x="240" y="155" width="60" height="25" fill="#e74c3c" rx="12"/>
    <text x="270" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">DEVICES</text>
    
    <rect x="155" y="210" width="70" height="25" fill="#e74c3c" rx="12"/>
    <text x="190" y="227" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">MAGNETIC</text>
    
    <!-- Connections between words -->
    <line x1="200" y1="165" x2="225" y2="180" stroke="#c0392b" stroke-width="2" opacity="0.7"/>
    <line x1="195" y1="200" x2="180" y2="165" stroke="#c0392b" stroke-width="2" opacity="0.7"/>
    <line x1="270" y1="168" x2="220" y2="188" stroke="#c0392b" stroke-width="2" opacity="0.7"/>
    <line x1="190" y1="210" x2="260" y2="180" stroke="#c0392b" stroke-width="2" opacity="0.7"/>
  </g>
  
  <!-- Data Science Cluster -->
  <g id="datascience-cluster">
    <ellipse cx="600" cy="170" rx="130" ry="90" fill="#3498db" opacity="0.15" stroke="#2980b9" stroke-width="2"/>
    <text x="600" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2980b9">DATA SCIENCE</text>
    
    <!-- Word nodes -->
    <rect x="545" y="145" width="75" height="25" fill="#3498db" rx="12"/>
    <text x="582" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">ALGORITHM</text>
    
    <rect x="575" y="180" width="50" height="25" fill="#3498db" rx="12"/>
    <text x="600" y="197" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">MODEL</text>
    
    <rect x="590" y="215" width="40" height="25" fill="#3498db" rx="12"/>
    <text x="610" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">DATA</text>
    
    <!-- Connections -->
    <line x1="582" y1="170" x2="600" y2="180" stroke="#2980b9" stroke-width="2" opacity="0.7"/>
    <line x1="600" y1="205" x2="610" y2="215" stroke="#2980b9" stroke-width="2" opacity="0.7"/>
    <line x1="582" y1="170" x2="610" y2="215" stroke="#2980b9" stroke-width="2" opacity="0.7"/>
  </g>
  
  <!-- Physics Cluster -->
  <g id="physics-cluster">
    <ellipse cx="400" cy="400" rx="150" ry="110" fill="#27ae60" opacity="0.15" stroke="#229954" stroke-width="2"/>
    <text x="400" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#229954">PHYSICS</text>
    
    <!-- Word nodes -->
    <rect x="340" y="365" width="65" height="25" fill="#27ae60" rx="12"/>
    <text x="372" y="382" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">QUANTUM</text>
    
    <rect x="420" y="375" width="45" height="25" fill="#27ae60" rx="12"/>
    <text x="442" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">STATE</text>
    
    <rect x="480" y="395" width="60" height="25" fill="#27ae60" rx="12"/>
    <text x="510" y="412" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">CHANNEL</text>
    
    <rect x="320" y="430" width="55" height="25" fill="#27ae60" rx="12"/>
    <text x="347" y="447" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">ENERGY</text>
    
    <!-- Connections -->
    <line x1="372" y1="390" x2="442" y2="375" stroke="#229954" stroke-width="2" opacity="0.7"/>
    <line x1="442" y1="400" x2="510" y2="395" stroke="#229954" stroke-width="2" opacity="0.7"/>
    <line x1="347" y1="430" x2="372" y2="390" stroke="#229954" stroke-width="2" opacity="0.7"/>
    <line x1="347" y1="430" x2="442" y2="400" stroke="#229954" stroke-width="2" opacity="0.7"/>
  </g>
  
  <!-- Document Representation -->
  <rect x="50" y="320" width="200" height="150" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2" rx="5"/>
  <text x="60" y="340" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Word Co-occurrence Matrix</text>
  
  <!-- Mini table representation -->
  <rect x="60" y="350" width="180" height="100" fill="white" stroke="#95a5a6"/>
  
  <!-- Table headers -->
  <text x="70" y="365" font-family="Arial, sans-serif" font-size="9" fill="#34495e">Word</text>
  <text x="110" y="365" font-family="Arial, sans-serif" font-size="9" fill="#34495e">Doc1</text>
  <text x="140" y="365" font-family="Arial, sans-serif" font-size="9" fill="#34495e">Doc2</text>
  <text x="170" y="365" font-family="Arial, sans-serif" font-size="9" fill="#34495e">Doc3</text>
  <text x="200" y="365" font-family="Arial, sans-serif" font-size="9" fill="#34495e">Doc4</text>
  
  <!-- Sample data -->
  <text x="70" y="380" font-family="Arial, sans-serif" font-size="8" fill="#e74c3c">temperature</text>
  <text x="115" y="380" font-family="Arial, sans-serif" font-size="8" fill="#34495e">1</text>
  <text x="145" y="380" font-family="Arial, sans-serif" font-size="8" fill="#34495e">1</text>
  <text x="175" y="380" font-family="Arial, sans-serif" font-size="8" fill="#34495e">0</text>
  <text x="205" y="380" font-family="Arial, sans-serif" font-size="8" fill="#34495e">0</text>
  
  <text x="70" y="395" font-family="Arial, sans-serif" font-size="8" fill="#e74c3c">graphene</text>
  <text x="115" y="395" font-family="Arial, sans-serif" font-size="8" fill="#34495e">1</text>
  <text x="145" y="395" font-family="Arial, sans-serif" font-size="8" fill="#34495e">1</text>
  <text x="175" y="395" font-family="Arial, sans-serif" font-size="8" fill="#34495e">0</text>
  <text x="205" y="395" font-family="Arial, sans-serif" font-size="8" fill="#34495e">0</text>
  
  <text x="70" y="410" font-family="Arial, sans-serif" font-size="8" fill="#3498db">algorithm</text>
  <text x="115" y="410" font-family="Arial, sans-serif" font-size="8" fill="#34495e">0</text>
  <text x="145" y="410" font-family="Arial, sans-serif" font-size="8" fill="#34495e">0</text>
  <text x="175" y="410" font-family="Arial, sans-serif" font-size="8" fill="#34495e">1</text>
  <text x="205" y="410" font-family="Arial, sans-serif" font-size="8" fill="#34495e">1</text>
  
  <text x="70" y="425" font-family="Arial, sans-serif" font-size="8" fill="#27ae60">quantum</text>
  <text x="115" y="425" font-family="Arial, sans-serif" font-size="8" fill="#34495e">0</text>
  <text x="145" y="425" font-family="Arial, sans-serif" font-size="8" fill="#34495e">0</text>
  <text x="175" y="425" font-family="Arial, sans-serif" font-size="8" fill="#34495e">0</text>
  <text x="205" y="425" font-family="Arial, sans-serif" font-size="8" fill="#34495e">1</text>
  
  <!-- Process flow arrows -->
  <path d="M 250 380 L 300 200" stroke="#f39c12" stroke-width="3" fill="none" marker-end="url(#arrowhead-orange)"/>
  <text x="260" y="290" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#f39c12" transform="rotate(-35, 260, 290)">Clustering</text>
  
  <!-- Similarity measure explanation -->
  <rect x="280" y="480" width="240" height="100" fill="#fef9e7" stroke="#f4d03f" stroke-width="1" rx="5"/>
  <text x="290" y="500" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#8b7d00">Similarity Measure:</text>
  <text x="290" y="520" font-family="Arial, sans-serif" font-size="11" fill="#8b7d00">Number of documents where</text>
  <text x="290" y="535" font-family="Arial, sans-serif" font-size="11" fill="#8b7d00">both words appear together</text>
  
  <text x="290" y="555" font-family="Arial, sans-serif" font-size="10" fill="#966c00">Example: "temperature" + "graphene"</text>
  <text x="290" y="570" font-family="Arial, sans-serif" font-size="10" fill="#966c00">appear together in 2 documents</text>
  
  <!-- Key Discovery Box -->
  <rect x="550" y="480" width="220" height="100" fill="#eaf2f8" stroke="#5dade2" stroke-width="1" rx="5"/>
  <text x="560" y="500" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1f4e79">Key Discovery:</text>
  <text x="560" y="520" font-family="Arial, sans-serif" font-size="11" fill="#1f4e79">Automated topic detection</text>
  <text x="560" y="535" font-family="Arial, sans-serif" font-size="11" fill="#1f4e79">without prior knowledge of</text>
  <text x="560" y="550" font-family="Arial, sans-serif" font-size="11" fill="#1f4e79">MIT research areas</text>
  
  <text x="560" y="570" font-family="Arial, sans-serif" font-size="10" font-style="italic" fill="#2874a6">Topics emerged naturally!</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead-orange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f39c12"/>
    </marker>
  </defs>
</svg>