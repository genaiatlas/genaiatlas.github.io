<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Medical Diagnosis Workflow with Predictive Modeling
  </text>
  
  <!-- Step 1: Data Collection -->
  <rect x="50" y="80" width="200" height="80" fill="#3498db" stroke="#2c3e50" stroke-width="2" rx="10"/>
  <text x="150" y="110" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
    Data Collection
  </text>
  <text x="150" y="135" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    Patient history, symptoms,
  </text>
  <text x="150" y="150" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    lab tests, imaging data
  </text>
  
  <!-- Arrow 1 -->
  <path d="M 150 160 L 150 200" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Step 2: Feature Engineering -->
  <rect x="50" y="200" width="200" height="80" fill="#9b59b6" stroke="#2c3e50" stroke-width="2" rx="10"/>
  <text x="150" y="230" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
    Feature Engineering
  </text>
  <text x="150" y="255" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    Encode categorical variables,
  </text>
  <text x="150" y="270" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    normalize, handle missing data
  </text>
  
  <!-- Arrow 2 -->
  <path d="M 150 280 L 150 320" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Step 3: Model Training -->
  <rect x="50" y="320" width="200" height="80" fill="#e67e22" stroke="#2c3e50" stroke-width="2" rx="10"/>
  <text x="150" y="350" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
    Model Training
  </text>
  <text x="150" y="375" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    Logistic regression, decision
  </text>
  <text x="150" y="390" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    trees, neural networks
  </text>
  
  <!-- Arrow 3 -->
  <path d="M 250 360 L 310 360" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Step 4: Model Validation -->
  <rect x="310" y="320" width="200" height="80" fill="#16a085" stroke="#2c3e50" stroke-width="2" rx="10"/>
  <text x="410" y="350" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
    Model Validation
  </text>
  <text x="410" y="375" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    Cross-validation, metrics:
  </text>
  <text x="410" y="390" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    accuracy, sensitivity, AUC
  </text>
  
  <!-- Arrow 4 -->
  <path d="M 510 360 L 570 360" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Step 5: Clinical Prediction -->
  <rect x="570" y="320" width="200" height="80" fill="#c0392b" stroke="#2c3e50" stroke-width="2" rx="10"/>
  <text x="670" y="350" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
    Clinical Prediction
  </text>
  <text x="670" y="375" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    Diagnosis probability,
  </text>
  <text x="670" y="390" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    risk stratification
  </text>
  
  <!-- Arrow 5 (downward from prediction) -->
  <path d="M 670 400 L 670 450" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Step 6: Clinical Decision -->
  <rect x="570" y="450" width="200" height="80" fill="#27ae60" stroke="#2c3e50" stroke-width="2" rx="10"/>
  <text x="670" y="480" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
    Clinical Decision
  </text>
  <text x="670" y="505" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    Treatment plan,
  </text>
  <text x="670" y="520" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    further testing, monitoring
  </text>
  
  <!-- Feedback arrow -->
  <path d="M 570 490 L 290 490 L 290 240 L 250 240" stroke="#7f8c8d" stroke-width="2" fill="none" marker-end="url(#arrowhead2)" stroke-dasharray="5,5"/>
  
  <text x="340" y="480" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d">
    Feedback &amp; Model Update
  </text>
  
  <!-- Key Performance Indicators Box -->
  <rect x="310" y="80" width="200" height="100" fill="white" stroke="#34495e" stroke-width="2" rx="10"/>
  <text x="410" y="105" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Key Metrics
  </text>
  <text x="410" y="127" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">
    • Sensitivity (True Positive Rate)
  </text>
  <text x="410" y="145" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">
    • Specificity (True Negative Rate)
  </text>
  <text x="410" y="163" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">
    • PPV, NPV, AUC-ROC
  </text>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#2c3e50"/>
    </marker>
    <marker id="arrowhead2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#7f8c8d"/>
    </marker>
  </defs>
  
  <!-- Considerations Box -->
  <rect x="570" y="80" width="200" height="100" fill="white" stroke="#34495e" stroke-width="2" rx="10"/>
  <text x="670" y="105" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Important Considerations
  </text>
  <text x="670" y="127" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">
    • Class imbalance handling
  </text>
  <text x="670" y="145" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">
    • Model interpretability
  </text>
  <text x="670" y="163" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">
    • Clinical validation required
  </text>
</svg>