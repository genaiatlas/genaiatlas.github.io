<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="675" fill="#f8fafc"/>
  
  <!-- Fast Track Ribbon -->
  <polygon points="1050,0 1200,0 1200,80 1050,60" fill="#3b82f6"/>
  <text x="1125" y="35" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">FAST TRACK</text>
  
  <!-- Title -->
  <text x="600" y="80" text-anchor="middle" fill="#1e293b" font-family="Arial, sans-serif" font-size="36" font-weight="bold">Error Handling &amp; Debugging</text>
  
  <!-- Try/Except Block -->
  <rect x="80" y="130" width="260" height="160" fill="#fef2f2" stroke="#dc2626" stroke-width="2" rx="8"/>
  <text x="210" y="160" text-anchor="middle" fill="#dc2626" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Try/Except</text>
  <rect x="120" y="180" width="180" height="100" fill="#ffffff" stroke="#d1d5db" stroke-width="1" rx="4"/>
  <text x="130" y="200" fill="#374151" font-family="Courier, monospace" font-size="12">try:</text>
  <text x="140" y="220" fill="#374151" font-family="Courier, monospace" font-size="12">risky_code()</text>
  <text x="130" y="240" fill="#374151" font-family="Courier, monospace" font-size="12">except ValueError:</text>
  <text x="140" y="260" fill="#374151" font-family="Courier, monospace" font-size="12">handle_error()</text>
  
  <!-- Try/Except/Finally -->
  <rect x="360" y="130" width="260" height="160" fill="#fef3c7" stroke="#d97706" stroke-width="2" rx="8"/>
  <text x="490" y="160" text-anchor="middle" fill="#d97706" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Try/Finally</text>
  <rect x="400" y="180" width="180" height="100" fill="#ffffff" stroke="#d1d5db" stroke-width="1" rx="4"/>
  <text x="410" y="200" fill="#374151" font-family="Courier, monospace" font-size="12">try:</text>
  <text x="420" y="220" fill="#374151" font-family="Courier, monospace" font-size="12">open_file()</text>
  <text x="410" y="240" fill="#374151" font-family="Courier, monospace" font-size="12">finally:</text>
  <text x="420" y="260" fill="#374151" font-family="Courier, monospace" font-size="12">close_file()</text>
  
  <!-- Common Exceptions -->
  <rect x="640" y="130" width="260" height="160" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" rx="8"/>
  <text x="770" y="160" text-anchor="middle" fill="#16a34a" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Common Exceptions</text>
  <rect x="680" y="180" width="180" height="100" fill="#ffffff" stroke="#d1d5db" stroke-width="1" rx="4"/>
  <text x="690" y="200" fill="#374151" font-family="Courier, monospace" font-size="11">ValueError</text>
  <text x="690" y="220" fill="#374151" font-family="Courier, monospace" font-size="11">TypeError</text>
  <text x="690" y="240" fill="#374151" font-family="Courier, monospace" font-size="11">FileNotFoundError</text>
  <text x="690" y="260" fill="#374151" font-family="Courier, monospace" font-size="11">KeyError</text>
  
  <!-- Debugging Tools -->
  <rect x="920" y="130" width="260" height="160" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" rx="8"/>
  <text x="1050" y="160" text-anchor="middle" fill="#0284c7" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Debugging Tools</text>
  <rect x="960" y="180" width="180" height="100" fill="#ffffff" stroke="#d1d5db" stroke-width="1" rx="4"/>
  <text x="970" y="200" fill="#374151" font-family="Courier, monospace" font-size="12">print() statements</text>
  <text x="970" y="220" fill="#374151" font-family="Courier, monospace" font-size="12">type() function</text>
  <text x="970" y="240" fill="#374151" font-family="Courier, monospace" font-size="12">len() for collections</text>
  <text x="970" y="260" fill="#374151" font-family="Courier, monospace" font-size="12">assert statements</text>
  
  <!-- Error Flow Diagram -->
  <rect x="100" y="320" width="1000" height="280" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="12"/>
  <text x="600" y="355" text-anchor="middle" fill="#1e293b" font-family="Arial, sans-serif" font-size="24" font-weight="bold">Error Handling Process</text>
  
  <!-- Simple horizontal boxes -->
  <rect x="150" y="380" width="180" height="100" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="8"/>
  <text x="240" y="410" text-anchor="middle" fill="#1e40af" font-family="Arial, sans-serif" font-size="16" font-weight="bold">1. Try Block</text>
  <text x="240" y="430" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">Execute code that</text>
  <text x="240" y="450" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">might cause errors</text>
  
  <rect x="350" y="380" width="180" height="100" fill="#dcfce7" stroke="#16a34a" stroke-width="2" rx="8"/>
  <text x="440" y="410" text-anchor="middle" fill="#15803d" font-family="Arial, sans-serif" font-size="16" font-weight="bold">2. Success Path</text>
  <text x="440" y="430" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">No errors occurred</text>
  <text x="440" y="450" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">Continue normally</text>
  
  <rect x="550" y="380" width="180" height="100" fill="#fef2f2" stroke="#dc2626" stroke-width="2" rx="8"/>
  <text x="640" y="410" text-anchor="middle" fill="#b91c1c" font-family="Arial, sans-serif" font-size="16" font-weight="bold">3. Error Path</text>
  <text x="640" y="430" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">Exception occurred</text>
  <text x="640" y="450" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">Handle the error</text>
  
  <rect x="750" y="380" width="180" height="100" fill="#f3e8ff" stroke="#a855f7" stroke-width="2" rx="8"/>
  <text x="840" y="410" text-anchor="middle" fill="#7c3aed" font-family="Arial, sans-serif" font-size="16" font-weight="bold">4. Finally Block</text>
  <text x="840" y="430" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">Always executes</text>
  <text x="840" y="450" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">Cleanup code</text>
  
  <!-- Simple example -->
  <rect x="200" y="510" width="600" height="60" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" rx="6"/>
  <text x="500" y="530" text-anchor="middle" fill="#1e293b" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Basic Pattern</text>
  <text x="500" y="550" text-anchor="middle" fill="#6b7280" font-family="Courier, monospace" font-size="12">try: → risky_code() → except ErrorType: → handle_error() → finally: → cleanup()</text>
  
  <!-- Best Practices -->
  <text x="200" y="570" fill="#374151" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Best Practices:</text>
  
  <circle cx="150" cy="585" r="3" fill="#16a34a"/>
  <text x="165" y="590" fill="#374151" font-family="Arial, sans-serif" font-size="13">Catch specific exceptions, not general ones</text>
  
  <circle cx="500" cy="585" r="3" fill="#16a34a"/>
  <text x="515" y="590" fill="#374151" font-family="Arial, sans-serif" font-size="13">Use finally for cleanup that must happen</text>
  
  <circle cx="150" cy="605" r="3" fill="#16a34a"/>
  <text x="165" y="610" fill="#374151" font-family="Arial, sans-serif" font-size="13">Don't ignore errors - log or handle them</text>
  
  <circle cx="500" cy="605" r="3" fill="#16a34a"/>
  <text x="515" y="610" fill="#374151" font-family="Arial, sans-serif" font-size="13">Test error conditions during development</text>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <polygon points="0,0 0,6 9,3" fill="#374151"/>
    </marker>
  </defs>
</svg>