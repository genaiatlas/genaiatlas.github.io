<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pureGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#45a049;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="mixedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF9800;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFC107;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF5722;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="highGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F44336;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D32F2F;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#333">
    Entropy: Measuring Uncertainty in Data
  </text>
  
  <!-- Low Entropy Section -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="200" height="120" rx="10" fill="url(#pureGrad)" stroke="#333" stroke-width="2"/>
    <text x="100" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
      Low Entropy
    </text>
    <text x="100" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
      H ≈ 0.0
    </text>
    
    <!-- Pure data visualization -->
    <circle cx="40" cy="70" r="8" fill="#2E7D32"/>
    <circle cx="65" cy="70" r="8" fill="#2E7D32"/>
    <circle cx="90" cy="70" r="8" fill="#2E7D32"/>
    <circle cx="115" cy="70" r="8" fill="#2E7D32"/>
    <circle cx="140" cy="70" r="8" fill="#2E7D32"/>
    <circle cx="165" cy="70" r="8" fill="#2E7D32"/>
    
    <circle cx="40" cy="95" r="8" fill="#2E7D32"/>
    <circle cx="65" cy="95" r="8" fill="#2E7D32"/>
    <circle cx="90" cy="95" r="8" fill="#2E7D32"/>
    <circle cx="115" cy="95" r="8" fill="#2E7D32"/>
    <circle cx="140" cy="95" r="8" fill="#2E7D32"/>
    <circle cx="165" cy="95" r="8" fill="#2E7D32"/>
    
    <text x="100" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">
      Homogeneous Data
    </text>
    <text x="100" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">
      (High Predictability)
    </text>
  </g>
  
  <!-- Medium Entropy Section -->
  <g transform="translate(300, 80)">
    <rect x="0" y="0" width="200" height="120" rx="10" fill="url(#mixedGrad)" stroke="#333" stroke-width="2"/>
    <text x="100" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
      Medium Entropy
    </text>
    <text x="100" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
      H ≈ 0.5-0.8
    </text>
    
    <!-- Mixed data visualization -->
    <circle cx="40" cy="70" r="8" fill="#2E7D32"/>
    <circle cx="65" cy="70" r="8" fill="#D32F2F"/>
    <circle cx="90" cy="70" r="8" fill="#2E7D32"/>
    <circle cx="115" cy="70" r="8" fill="#2E7D32"/>
    <circle cx="140" cy="70" r="8" fill="#D32F2F"/>
    <circle cx="165" cy="70" r="8" fill="#2E7D32"/>
    
    <circle cx="40" cy="95" r="8" fill="#D32F2F"/>
    <circle cx="65" cy="95" r="8" fill="#2E7D32"/>
    <circle cx="90" cy="95" r="8" fill="#D32F2F"/>
    <circle cx="115" cy="95" r="8" fill="#2E7D32"/>
    <circle cx="140" cy="95" r="8" fill="#2E7D32"/>
    <circle cx="165" cy="95" r="8" fill="#D32F2F"/>
    
    <text x="100" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">
      Mixed Data
    </text>
    <text x="100" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">
      (Moderate Predictability)
    </text>
  </g>
  
  <!-- High Entropy Section -->
  <g transform="translate(550, 80)">
    <rect x="0" y="0" width="200" height="120" rx="10" fill="url(#highGrad)" stroke="#333" stroke-width="2"/>
    <text x="100" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
      High Entropy
    </text>
    <text x="100" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
      H ≈ 1.0
    </text>
    
    <!-- Random data visualization -->
    <circle cx="40" cy="70" r="8" fill="#D32F2F"/>
    <circle cx="65" cy="70" r="8" fill="#2E7D32"/>
    <circle cx="90" cy="70" r="8" fill="#D32F2F"/>
    <circle cx="115" cy="70" r="8" fill="#D32F2F"/>
    <circle cx="140" cy="70" r="8" fill="#2E7D32"/>
    <circle cx="165" cy="70" r="8" fill="#D32F2F"/>
    
    <circle cx="40" cy="95" r="8" fill="#2E7D32"/>
    <circle cx="65" cy="95" r="8" fill="#D32F2F"/>
    <circle cx="90" cy="95" r="8" fill="#2E7D32"/>
    <circle cx="115" cy="95" r="8" fill="#2E7D32"/>
    <circle cx="140" cy="95" r="8" fill="#D32F2F"/>
    <circle cx="165" cy="95" r="8" fill="#2E7D32"/>
    
    <text x="100" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">
      Random Data
    </text>
    <text x="100" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">
      (Low Predictability)
    </text>
  </g>
  
  <!-- Formula Section -->
  <g transform="translate(150, 250)">
    <rect x="0" y="0" width="500" height="80" rx="10" fill="#F5F5F5" stroke="#333" stroke-width="2"/>
    <text x="250" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">
      Entropy Formula
    </text>
    <text x="250" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#333">
      H(S) = -Σ pᵢ log₂(pᵢ)
    </text>
    <text x="250" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">
      where pᵢ is the proportion of examples in class i
    </text>
  </g>
  
  <!-- Legend -->
  <g transform="translate(50, 370)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">
      Legend:
    </text>
    <circle cx="20" cy="20" r="8" fill="#2E7D32"/>
    <text x="35" y="25" font-family="Arial, sans-serif" font-size="12" fill="#333">
      Class A (Positive)
    </text>
    <circle cx="20" cy="40" r="8" fill="#D32F2F"/>
    <text x="35" y="45" font-family="Arial, sans-serif" font-size="12" fill="#333">
      Class B (Negative)
    </text>
  </g>
  
  <!-- Information Box -->
  <g transform="translate(300, 370)">
    <rect x="0" y="0" width="450" height="70" rx="5" fill="#E3F2FD" stroke="#2196F3" stroke-width="1"/>
    <text x="10" y="20" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1976D2">
      Key Insight:
    </text>
    <text x="10" y="35" font-family="Arial, sans-serif" font-size="11" fill="#333">
      • Lower entropy = More predictable outcomes = Better for classification
    </text>
    <text x="10" y="50" font-family="Arial, sans-serif" font-size="11" fill="#333">
      • Decision trees aim to minimize entropy through intelligent feature splits
    </text>
    <text x="10" y="65" font-family="Arial, sans-serif" font-size="11" fill="#333">
      • Information Gain measures entropy reduction after splitting
    </text>
  </g>
</svg>