<svg viewBox="0 0 1400 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1400" height="800" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="700" y="35" font-size="24" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Eigenvector Centrality: Iterative Score Propagation
  </text>
  
  <!-- Step 0: Initialization -->
  <g id="step0">
    <text x="150" y="80" font-size="16" font-weight="bold" fill="#2c3e50">
      Step 0: Initialize x(0)
    </text>
    
    <!-- Network at t=0 -->
    <circle cx="100" cy="150" r="18" fill="#e0e0e0" stroke="#333" stroke-width="2"/>
    <text x="100" y="156" font-size="14" font-weight="bold" text-anchor="middle">1</text>
    
    <circle cx="200" cy="150" r="18" fill="#e0e0e0" stroke="#333" stroke-width="2"/>
    <text x="200" y="156" font-size="14" font-weight="bold" text-anchor="middle">1</text>
    
    <circle cx="150" cy="220" r="18" fill="#e0e0e0" stroke="#333" stroke-width="2"/>
    <text x="150" y="226" font-size="14" font-weight="bold" text-anchor="middle">1</text>
    
    <circle cx="100" cy="290" r="18" fill="#e0e0e0" stroke="#333" stroke-width="2"/>
    <text x="100" y="296" font-size="14" font-weight="bold" text-anchor="middle">1</text>
    
    <circle cx="200" cy="290" r="18" fill="#e0e0e0" stroke="#333" stroke-width="2"/>
    <text x="200" y="296" font-size="14" font-weight="bold" text-anchor="middle">1</text>
    
    <!-- Edges -->
    <line x1="110" y1="160" x2="140" y2="210" stroke="#666" stroke-width="2"/>
    <line x1="190" y1="160" x2="160" y2="210" stroke="#666" stroke-width="2"/>
    <line x1="150" y1="238" x2="100" y2="275" stroke="#666" stroke-width="2"/>
    <line x1="150" y1="238" x2="200" y2="275" stroke="#666" stroke-width="2"/>
    <line x1="115" y1="150" x2="185" y2="150" stroke="#666" stroke-width="2"/>
    
    <text x="150" y="330" font-size="12" text-anchor="middle" fill="#555">
      All scores = 1
    </text>
  </g>
  
  <!-- Arrow -->
  <path d="M 250 200 L 300 200 L 295 195 M 300 200 L 295 205" 
        stroke="#1976d2" stroke-width="3" fill="none"/>
  <text x="275" y="195" font-size="13" fill="#1976d2" font-weight="bold">A×</text>
  
  <!-- Step 1: After first multiplication -->
  <g id="step1">
    <text x="420" y="80" font-size="16" font-weight="bold" fill="#2c3e50">
      Step 1: x(1) = A × x(0)
    </text>
    
    <!-- Network at t=1 -->
    <circle cx="370" cy="150" r="18" fill="#90caf9" stroke="#1976d2" stroke-width="2"/>
    <text x="370" y="156" font-size="14" font-weight="bold" text-anchor="middle">2</text>
    
    <circle cx="470" cy="150" r="18" fill="#90caf9" stroke="#1976d2" stroke-width="2"/>
    <text x="470" y="156" font-size="14" font-weight="bold" text-anchor="middle">2</text>
    
    <circle cx="420" cy="220" r="22" fill="#64b5f6" stroke="#1565c0" stroke-width="2"/>
    <text x="420" y="227" font-size="15" font-weight="bold" text-anchor="middle">4</text>
    
    <circle cx="370" cy="290" r="18" fill="#90caf9" stroke="#1976d2" stroke-width="2"/>
    <text x="370" y="296" font-size="14" font-weight="bold" text-anchor="middle">2</text>
    
    <circle cx="470" cy="290" r="18" fill="#90caf9" stroke="#1976d2" stroke-width="2"/>
    <text x="470" y="296" font-size="14" font-weight="bold" text-anchor="middle">2</text>
    
    <!-- Edges -->
    <line x1="380" y1="160" x2="410" y2="205" stroke="#666" stroke-width="2"/>
    <line x1="460" y1="160" x2="430" y2="205" stroke="#666" stroke-width="2"/>
    <line x1="420" y1="242" x2="370" y2="275" stroke="#666" stroke-width="2"/>
    <line x1="420" y1="242" x2="470" y2="275" stroke="#666" stroke-width="2"/>
    <line x1="385" y1="150" x2="455" y2="150" stroke="#666" stroke-width="2"/>
    
    <text x="420" y="330" font-size="12" text-anchor="middle" fill="#555">
      Scores updated
    </text>
  </g>
  
  <!-- Arrow -->
  <path d="M 520 200 L 570 200 L 565 195 M 570 200 L 565 205" 
        stroke="#1976d2" stroke-width="3" fill="none"/>
  <text x="545" y="195" font-size="13" fill="#1976d2" font-weight="bold">A×</text>
  
  <!-- Step 2: After second multiplication -->
  <g id="step2">
    <text x="700" y="80" font-size="16" font-weight="bold" fill="#2c3e50">
      Step 2: x(2) = A × x(1)
    </text>
    
    <!-- Network at t=2 -->
    <circle cx="650" cy="150" r="20" fill="#4fc3f7" stroke="#0288d1" stroke-width="2"/>
    <text x="650" y="157" font-size="14" font-weight="bold" text-anchor="middle">6</text>
    
    <circle cx="750" cy="150" r="20" fill="#4fc3f7" stroke="#0288d1" stroke-width="2"/>
    <text x="750" y="157" font-size="14" font-weight="bold" text-anchor="middle">6</text>
    
    <circle cx="700" cy="220" r="26" fill="#29b6f6" stroke="#01579b" stroke-width="3"/>
    <text x="700" y="228" font-size="16" font-weight="bold" text-anchor="middle">10</text>
    
    <circle cx="650" cy="290" r="20" fill="#4fc3f7" stroke="#0288d1" stroke-width="2"/>
    <text x="650" y="297" font-size="14" font-weight="bold" text-anchor="middle">6</text>
    
    <circle cx="750" cy="290" r="20" fill="#4fc3f7" stroke="#0288d1" stroke-width="2"/>
    <text x="750" y="297" font-size="14" font-weight="bold" text-anchor="middle">6</text>
    
    <!-- Edges -->
    <line x1="662" y1="162" x2="690" y2="203" stroke="#666" stroke-width="2"/>
    <line x1="738" y1="162" x2="710" y2="203" stroke="#666" stroke-width="2"/>
    <line x1="700" y1="246" x2="650" y2="275" stroke="#666" stroke-width="2"/>
    <line x1="700" y1="246" x2="750" y2="275" stroke="#666" stroke-width="2"/>
    <line x1="670" y1="150" x2="730" y2="150" stroke="#666" stroke-width="2"/>
    
    <text x="700" y="330" font-size="12" text-anchor="middle" fill="#555">
      Center node dominates
    </text>
  </g>
  
  <!-- Arrow and dots -->
  <path d="M 800 200 L 850 200 L 845 195 M 850 200 L 845 205" 
        stroke="#1976d2" stroke-width="3" fill="none"/>
  <text x="870" y="205" font-size="18" fill="#1976d2" font-weight="bold">...</text>
  
  <!-- Step T: Convergence -->
  <g id="stepT">
    <text x="1050" y="80" font-size="16" font-weight="bold" fill="#2c3e50">
      Step T: x(T) converges
    </text>
    
    <!-- Network at t=T (converged) -->
    <circle cx="1000" cy="150" r="20" fill="#26c6da" stroke="#00838f" stroke-width="2"/>
    <text x="1000" y="157" font-size="13" font-weight="bold" text-anchor="middle">0.46</text>
    
    <circle cx="1100" cy="150" r="20" fill="#26c6da" stroke="#00838f" stroke-width="2"/>
    <text x="1100" y="157" font-size="13" font-weight="bold" text-anchor="middle">0.46</text>
    
    <circle cx="1050" cy="220" r="30" fill="#00acc1" stroke="#006064" stroke-width="3"/>
    <text x="1050" y="228" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">1.00</text>
    
    <circle cx="1000" cy="290" r="20" fill="#26c6da" stroke="#00838f" stroke-width="2"/>
    <text x="1000" y="297" font-size="13" font-weight="bold" text-anchor="middle">0.46</text>
    
    <circle cx="1100" cy="290" r="20" fill="#26c6da" stroke="#00838f" stroke-width="2"/>
    <text x="1100" y="297" font-size="13" font-weight="bold" text-anchor="middle">0.46</text>
    
    <!-- Edges -->
    <line x1="1012" y1="162" x2="1040" y2="203" stroke="#666" stroke-width="2"/>
    <line x1="1088" y1="162" x2="1060" y2="203" stroke="#666" stroke-width="2"/>
    <line x1="1050" y1="250" x2="1000" y2="275" stroke="#666" stroke-width="2"/>
    <line x1="1050" y1="250" x2="1100" y2="275" stroke="#666" stroke-width="2"/>
    <line x1="1020" y1="150" x2="1080" y2="150" stroke="#666" stroke-width="2"/>
    
    <text x="1050" y="330" font-size="12" text-anchor="middle" fill="#555">
      Stable scores (normalized)
    </text>
  </g>
  
  <!-- Mathematical Formula Box -->
  <g id="formula-box">
    <rect x="100" y="380" width="1200" height="180" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" rx="10"/>
    
    <text x="700" y="415" font-size="18" font-weight="bold" text-anchor="middle" fill="#1b5e20">
      Eigenvector Centrality Formula
    </text>
    
    <!-- Main equation -->
    <text x="700" y="450" font-size="20" text-anchor="middle" fill="#1a1a1a" font-family="serif" font-style="italic">
      A × x = λ × x
    </text>
    
    <text x="700" y="475" font-size="14" text-anchor="middle" fill="#555">
      where λ is the largest eigenvalue of adjacency matrix A
    </text>
    
    <!-- Interpretation -->
    <rect x="150" y="490" width="1100" height="55" fill="#fff" stroke="#4caf50" stroke-width="1" rx="5"/>
    <text x="700" y="515" font-size="14" font-weight="bold" text-anchor="middle" fill="#2e7d32">
      Interpretation: Your centrality is proportional to the sum of your neighbors' centralities
    </text>
    <text x="700" y="535" font-size="13" text-anchor="middle" fill="#555">
      xᵢ ∝ Σⱼ Aᵢⱼ xⱼ  →  A node is important if connected to important nodes
    </text>
  </g>
  
  <!-- Comparison Box -->
  <g id="comparison">
    <rect x="100" y="590" width="600" height="180" fill="#fff3e0" stroke="#f57c00" stroke-width="2" rx="5"/>
    
    <text x="400" y="620" font-size="16" font-weight="bold" text-anchor="middle" fill="#e65100">
      Degree vs Eigenvector Centrality
    </text>
    
    <!-- Degree centrality -->
    <text x="140" y="650" font-size="13" font-weight="bold" fill="#ff5722">Degree Centrality:</text>
    <text x="140" y="670" font-size="12" fill="#555">• Counts only direct connections</text>
    <text x="140" y="688" font-size="12" fill="#555">• Treats all connections equally</text>
    <text x="140" y="706" font-size="12" fill="#555">• Fast to compute (O(n))</text>
    <text x="140" y="724" font-size="12" fill="#555">• Best for: immediate reach</text>
    
    <!-- Eigenvector centrality -->
    <text x="140" y="750" font-size="13" font-weight="bold" fill="#4caf50">Eigenvector Centrality:</text>
    <text x="400" y="670" font-size="12" fill="#555">• Considers connection quality recursively</text>
    <text x="400" y="688" font-size="12" fill="#555">• Weights by neighbor importance</text>
    <text x="400" y="706" font-size="12" fill="#555">• Requires eigendecomposition</text>
    <text x="400" y="724" font-size="12" fill="#555">• Best for: influence through network</text>
  </g>
  
  <!-- Example Application -->
  <g id="application">
    <rect x="730" y="590" width="570" height="180" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="5"/>
    
    <text x="1015" y="620" font-size="16" font-weight="bold" text-anchor="middle" fill="#1565c0">
      Application: Social Network Marketing
    </text>
    
    <text x="1015" y="650" font-size="13" text-anchor="middle" fill="#555">
      Scenario: Give free concert ticket to most influential person
    </text>
    
    <!-- Two strategies -->
    <rect x="760" y="665" width="240" height="90" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
    <text x="880" y="685" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">
      Degree Strategy
    </text>
    <text x="880" y="705" font-size="11" text-anchor="middle" fill="#555">
      Choose: Person with most friends
    </text>
    <text x="880" y="722" font-size="11" text-anchor="middle" fill="#555">
      Result: Maximum immediate reach
    </text>
    <text x="880" y="739" font-size="10" text-anchor="middle" fill="#999" font-style="italic">
      May have low-quality connections
    </text>
    
    <rect x="1030" y="665" width="240" height="90" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
    <text x="1150" y="685" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">
      Eigenvector Strategy
    </text>
    <text x="1150" y="705" font-size="11" text-anchor="middle" fill="#555">
      Choose: Person with best-connected friends
    </text>
    <text x="1150" y="722" font-size="11" text-anchor="middle" fill="#555">
      Result: Maximum cascade potential
    </text>
    <text x="1150" y="739" font-size="10" text-anchor="middle" fill="#4caf50" font-style="italic">
      Better long-term viral spread
    </text>
  </g>
</svg>