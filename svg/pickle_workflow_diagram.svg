<svg viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="800" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="500" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Pickle Workflow Diagram
  </text>
  
  <text x="500" y="60" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#7f8c8d" font-style="italic">
    Python's Built-in Serialization Library
  </text>
  
  <!-- Step 1: Import Pickle -->
  <g transform="translate(100, 100)">
    <rect x="0" y="0" width="800" height="70" fill="white" stroke="#3498db" stroke-width="3" rx="8"/>
    <circle cx="35" cy="35" r="25" fill="#3498db"/>
    <text x="35" y="43" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">1</text>
    
    <text x="80" y="28" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#3498db">
      Import Pickle Library
    </text>
    <rect x="80" y="38" width="700" height="25" fill="#ecf0f1" rx="3"/>
    <text x="90" y="56" font-family="Courier New, monospace" font-size="13" fill="#2c3e50">
      import pickle
    </text>
  </g>
  
  <!-- Arrow -->
  <line x1="500" y1="180" x2="500" y2="210" stroke="#95a5a6" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Step 2: Train Model -->
  <g transform="translate(100, 220)">
    <rect x="0" y="0" width="800" height="110" fill="white" stroke="#27ae60" stroke-width="3" rx="8"/>
    <circle cx="35" cy="35" r="25" fill="#27ae60"/>
    <text x="35" y="43" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">2</text>
    
    <text x="80" y="28" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#27ae60">
      Create and Train Model
    </text>
    <rect x="80" y="38" width="700" height="65" fill="#ecf0f1" rx="3"/>
    <text x="90" y="56" font-family="Courier New, monospace" font-size="12" fill="#2c3e50">
      model = RandomForestRegressor(n_estimators=120, max_depth=None)
    </text>
    <text x="90" y="75" font-family="Courier New, monospace" font-size="12" fill="#2c3e50">
      model.fit(X_train, y_train)
    </text>
    <text x="90" y="94" font-family="Courier New, monospace" font-size="12" fill="#7f8c8d">
      # Model is now trained and ready to be saved
    </text>
  </g>
  
  <!-- Arrow -->
  <line x1="500" y1="340" x2="500" y2="370" stroke="#95a5a6" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Step 3: Save with Pickle (Serialization) -->
  <g transform="translate(100, 380)">
    <rect x="0" y="0" width="800" height="130" fill="white" stroke="#f39c12" stroke-width="3" rx="8"/>
    <circle cx="35" cy="35" r="25" fill="#f39c12"/>
    <text x="35" y="43" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">3</text>
    
    <text x="80" y="28" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#f39c12">
      Save Model (Serialization)
    </text>
    <rect x="80" y="38" width="700" height="85" fill="#ecf0f1" rx="3"/>
    <text x="90" y="56" font-family="Courier New, monospace" font-size="12" fill="#2c3e50">
      # Method 1: Using with statement (recommended)
    </text>
    <text x="90" y="75" font-family="Courier New, monospace" font-size="12" fill="#2c3e50">
      with open('model.pkl', 'wb') as file:
    </text>
    <text x="110" y="94" font-family="Courier New, monospace" font-size="12" fill="#2c3e50">
      pickle.dump(model, file)
    </text>
    <text x="90" y="113" font-family="Courier New, monospace" font-size="11" fill="#7f8c8d">
      # 'wb' = write binary mode
    </text>
  </g>
  
  <!-- Storage representation -->
  <g transform="translate(400, 530)">
    <rect x="0" y="0" width="200" height="80" fill="#fff3cd" stroke="#f39c12" stroke-width="2" rx="5"/>
    <rect x="20" y="15" width="160" height="50" fill="#f39c12" opacity="0.3" rx="3"/>
    <text x="100" y="35" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#856404">
      💾 model.pkl
    </text>
    <text x="100" y="52" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#856404">
      Stored on Disk
    </text>
  </g>
  
  <!-- Arrow -->
  <line x1="500" y1="620" x2="500" y2="650" stroke="#95a5a6" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Step 4: Load with Pickle (Deserialization) -->
  <g transform="translate(100, 660)">
    <rect x="0" y="0" width="800" height="110" fill="white" stroke="#e74c3c" stroke-width="3" rx="8"/>
    <circle cx="35" cy="35" r="25" fill="#e74c3c"/>
    <text x="35" y="43" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">4</text>
    
    <text x="80" y="28" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#e74c3c">
      Load Model (Deserialization)
    </text>
    <rect x="80" y="38" width="700" height="65" fill="#ecf0f1" rx="3"/>
    <text x="90" y="56" font-family="Courier New, monospace" font-size="12" fill="#2c3e50">
      with open('model.pkl', 'rb') as file:
    </text>
    <text x="110" y="75" font-family="Courier New, monospace" font-size="12" fill="#2c3e50">
      loaded_model = pickle.load(file)
    </text>
    <text x="90" y="94" font-family="Courier New, monospace" font-size="11" fill="#7f8c8d">
      # 'rb' = read binary mode | Model is now ready for predictions
    </text>
  </g>
  
  <!-- Advantages Panel -->
  <g transform="translate(50, 600)">
    <rect x="-30" y="200" width="280" height="180" fill="#d5f4e6" stroke="#27ae60" stroke-width="2" rx="8"/>
    <text x="110" y="220" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#27ae60">
      ✓ Pickle Advantages
    </text>
    
    <circle cx="-10" cy="245" r="4" fill="#27ae60"/>
    <text x="5" y="249" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
      Built-in (No installation needed)
    </text>
    
    <circle cx="-10" cy="270" r="4" fill="#27ae60"/>
    <text x="5" y="274" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
      Easy to use - Simple API
    </text>
    
    <circle cx="-10" cy="295" r="4" fill="#27ae60"/>
    <text x="5" y="299" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
      Handles any Python object
    </text>
    
    <circle cx="-10" cy="320" r="4" fill="#27ae60"/>
    <text x="5" y="324" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
      Compression support
    </text>
    
    <circle cx="-10" cy="345" r="4" fill="#27ae60"/>
    <text x="5" y="349" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
      Data integrity guaranteed
    </text>
  </g>
  
  <!-- Security Warning -->
  <g transform="translate(720, 600)">
    <rect x="-30" y="200" width="280" height="180" fill="#fadbd8" stroke="#e74c3c" stroke-width="2" rx="8"/>
    <text x="110" y="220" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#e74c3c">
      ⚠️ Security Warning
    </text>
    
    <text x="110" y="250" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#c0392b" font-weight="bold">
      Never unpickle data from
    </text>
    <text x="110" y="268" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#c0392b" font-weight="bold">
      untrusted sources!
    </text>
    
    <text x="110" y="295" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">
      Pickle can execute arbitrary
    </text>
    <text x="110" y="310" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">
      code during deserialization,
    </text>
    <text x="110" y="325" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">
      making it a security risk
    </text>
    <text x="110" y="340" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">
      with untrusted data.
    </text>
    
    <text x="110" y="365" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#7f8c8d" font-style="italic">
      Always validate the source!
    </text>
  </g>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#95a5a6"/>
    </marker>
  </defs>
</svg>