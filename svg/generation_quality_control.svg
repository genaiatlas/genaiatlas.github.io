<svg viewBox="0 0 1400 1100" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1400" height="1100" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="700" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Quality Control Mechanisms
  </text>
  <text x="700" y="70" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#495057">
    Ensuring Accuracy, Relevance, and Safety in Generated Responses
  </text>
  
  <!-- Input Response -->
  <rect x="50" y="110" width="200" height="80" rx="10" fill="#e9ecef" stroke="#495057" stroke-width="2"/>
  <text x="150" y="140" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    📝 Generated
  </text>
  <text x="150" y="160" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Response
  </text>
  <text x="150" y="180" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#868e96">
    Needs validation
  </text>
  
  <!-- Arrow -->
  <path d="M 250 150 L 320 150" stroke="#495057" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Quality Dimensions -->
  <rect x="320" y="110" width="1030" height="900" rx="15" fill="#d0ebff" stroke="#1c7ed6" stroke-width="4"/>
  <text x="835" y="150" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Quality Control Framework
  </text>
  
  <!-- Dimension 1: Factual Accuracy -->
  <g id="accuracy">
    <rect x="350" y="180" width="460" height="180" rx="10" fill="#fff" stroke="#c92a2a" stroke-width="3"/>
    <text x="580" y="215" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#c92a2a">
      1️⃣ Factual Accuracy
    </text>
    
    <rect x="370" y="235" width="420" height="110" rx="8" fill="#fff5f5" stroke="#c92a2a" stroke-width="2"/>
    <text x="390" y="258" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#c92a2a">
      Verification Checks:
    </text>
    <text x="390" y="278" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      ✓ Cross-check claims against source documents
    </text>
    <text x="390" y="295" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      ✓ Hallucination detection (unsupported statements)
    </text>
    <text x="390" y="312" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      ✓ Consistency checking (no contradictions)
    </text>
    <text x="390" y="329" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      ✓ Source attribution validation (all claims cited)
    </text>
  </g>
  
  <!-- Dimension 2: Relevance -->
  <g id="relevance">
    <rect x="840" y="180" width="460" height="180" rx="10" fill="#fff" stroke="#1c7ed6" stroke-width="3"/>
    <text x="1070" y="215" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1c7ed6">
      2️⃣ Relevance
    </text>
    
    <rect x="860" y="235" width="420" height="110" rx="8" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="2"/>
    <text x="880" y="258" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1c7ed6">
      Relevance Checks:
    </text>
    <text x="880" y="278" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      ✓ Query alignment (addresses the actual question)
    </text>
    <text x="880" y="295" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      ✓ Context utilization (uses provided docs effectively)
    </text>
    <text x="880" y="312" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      ✓ Focus (stays on topic without tangents)
    </text>
    <text x="880" y="329" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      ✓ Completeness (covers all aspects of query)
    </text>
  </g>
  
  <!-- Dimension 3: Coherence -->
  <g id="coherence">
    <rect x="350" y="380" width="460" height="180" rx="10" fill="#fff" stroke="#37b24d" stroke-width="3"/>
    <text x="580" y="415" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#37b24d">
      3️⃣ Coherence
    </text>
    
    <rect x="370" y="435" width="420" height="110" rx="8" fill="#d3f9d8" stroke="#37b24d" stroke-width="2"/>
    <text x="390" y="458" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#37b24d">
      Coherence Checks:
    </text>
    <text x="390" y="478" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      ✓ Logical flow (ideas connect naturally)
    </text>
    <text x="390" y="495" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      ✓ Clarity (clear and understandable language)
    </text>
    <text x="390" y="512" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      ✓ Structure (well-organized presentation)
    </text>
    <text x="390" y="529" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      ✓ Readability (appropriate for target audience)
    </text>
  </g>
  
  <!-- Dimension 4: Safety -->
  <g id="safety">
    <rect x="840" y="380" width="460" height="180" rx="10" fill="#fff" stroke="#9333ea" stroke-width="3"/>
    <text x="1070" y="415" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#9333ea">
      4️⃣ Safety
    </text>
    
    <rect x="860" y="435" width="420" height="110" rx="8" fill="#e9d5ff" stroke="#9333ea" stroke-width="2"/>
    <text x="880" y="458" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#9333ea">
      Safety Checks:
    </text>
    <text x="880" y="478" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      ✓ Content filtering (remove harmful content)
    </text>
    <text x="880" y="495" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      ✓ Bias detection (identify and mitigate biases)
    </text>
    <text x="880" y="512" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      ✓ Privacy protection (no sensitive info leakage)
    </text>
    <text x="880" y="529" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      ✓ Compliance (adhere to guidelines and regulations)
    </text>
  </g>
  
  <!-- Quality Control Methods -->
  <rect x="350" y="580" width="950" height="280" rx="10" fill="#fff3bf" stroke="#fab005" stroke-width="3"/>
  <text x="825" y="615" font-family="Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#fab005">
    🔍 Quality Control Methods
  </text>
  
  <!-- Automated Checks -->
  <g id="automated">
    <rect x="370" y="640" width="280" height="200" rx="8" fill="#fff" stroke="#fab005" stroke-width="2"/>
    <text x="510" y="665" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#fab005">
      Automated Checks
    </text>
    
    <text x="390" y="690" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#495057">
      Rule-Based:
    </text>
    <text x="390" y="708" font-family="Arial, sans-serif" font-size="9" fill="#495057">
      • Citation presence
    </text>
    <text x="390" y="723" font-family="Arial, sans-serif" font-size="9" fill="#495057">
      • Length requirements
    </text>
    <text x="390" y="738" font-family="Arial, sans-serif" font-size="9" fill="#495057">
      • Format validation
    </text>
    
    <text x="390" y="763" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#495057">
      LLM-Based:
    </text>
    <text x="390" y="781" font-family="Arial, sans-serif" font-size="9" fill="#495057">
      • Factual accuracy (0-10)
    </text>
    <text x="390" y="796" font-family="Arial, sans-serif" font-size="9" fill="#495057">
      • Relevance to query (0-10)
    </text>
    <text x="390" y="811" font-family="Arial, sans-serif" font-size="9" fill="#495057">
      • Coherence (0-10)
    </text>
    <text x="390" y="826" font-family="Arial, sans-serif" font-size="9" fill="#495057">
      • Citation quality (0-10)
    </text>
  </g>
  
  <!-- Confidence Scoring -->
  <g id="confidence">
    <rect x="670" y="640" width="280" height="200" rx="8" fill="#fff" stroke="#fab005" stroke-width="2"/>
    <text x="810" y="665" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#fab005">
      Confidence Scoring
    </text>
    
    <rect x="690" y="680" width="240" height="145" rx="5" fill="#f8f9fa" stroke="#fab005" stroke-width="1"/>
    <text x="700" y="700" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      Assign confidence scores:
    </text>
    <text x="700" y="720" font-family="Arial, sans-serif" font-size="9" fill="#37b24d">
      🟢 High (0.8-1.0): Deliver
    </text>
    <text x="700" y="738" font-family="Arial, sans-serif" font-size="9" fill="#fab005">
      🟡 Medium (0.5-0.8): Flag
    </text>
    <text x="700" y="756" font-family="Arial, sans-serif" font-size="9" fill="#e03131">
      🔴 Low (&lt;0.5): Regenerate
    </text>
    
    <text x="700" y="785" font-family="Arial, sans-serif" font-size="9" font-style="italic" fill="#868e96">
      User receives uncertainty
    </text>
    <text x="700" y="800" font-family="Arial, sans-serif" font-size="9" font-style="italic" fill="#868e96">
      indicators for medium/low
    </text>
    <text x="700" y="815" font-family="Arial, sans-serif" font-size="9" font-style="italic" fill="#868e96">
      confidence responses
    </text>
  </g>
  
  <!-- Fallback Strategies -->
  <g id="fallback">
    <rect x="970" y="640" width="310" height="200" rx="8" fill="#fff" stroke="#fab005" stroke-width="2"/>
    <text x="1125" y="665" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#fab005">
      Fallback Strategies
    </text>
    
    <rect x="990" y="680" width="270" height="145" rx="5" fill="#f8f9fa" stroke="#fab005" stroke-width="1"/>
    <text x="1000" y="700" font-family="Courier, monospace" font-size="8" fill="#495057">
      if confidence &lt; threshold:
    </text>
    <text x="1000" y="715" font-family="Courier, monospace" font-size="8" fill="#495057">
        # Regenerate with
    </text>
    <text x="1000" y="730" font-family="Courier, monospace" font-size="8" fill="#495057">
        # different params
    </text>
    <text x="1000" y="745" font-family="Courier, monospace" font-size="8" fill="#495057">
        response =
    </text>
    <text x="1000" y="760" font-family="Courier, monospace" font-size="8" fill="#495057">
          regenerate(temp=0.1)
    </text>
    <text x="1000" y="775" font-family="Courier, monospace" font-size="8" fill="#495057">
      
    </text>
    <text x="1000" y="790" font-family="Courier, monospace" font-size="8" fill="#495057">
      if still_low:
    </text>
    <text x="1000" y="805" font-family="Courier, monospace" font-size="8" fill="#495057">
        # Add caveats
    </text>
    <text x="1000" y="820" font-family="Courier, monospace" font-size="8" fill="#495057">
        return partial_answer()
    </text>
  </g>
  
  <!-- Quality Metrics -->
  <rect x="350" y="880" width="950" height="110" rx="10" fill="#d3f9d8" stroke="#37b24d" stroke-width="3"/>
  <text x="825" y="915" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#37b24d">
    📊 Key Quality Metrics
  </text>
  
  <text x="370" y="945" font-family="Arial, sans-serif" font-size="11" fill="#495057">
    <tspan font-weight="bold">Faithfulness:</tspan> Alignment with sources (Entailment, NLI)
  </text>
  <text x="370" y="965" font-family="Arial, sans-serif" font-size="11" fill="#495057">
    <tspan font-weight="bold">Answer Relevance:</tspan> Pertinence to query (Semantic similarity)
  </text>
  <text x="370" y="985" font-family="Arial, sans-serif" font-size="11" fill="#495057">
    <tspan font-weight="bold">Context Quality:</tspan> Precision@k, Recall@k, MRR
  </text>
  
  <text x="870" y="945" font-family="Arial, sans-serif" font-size="11" fill="#495057">
    <tspan font-weight="bold">Response Quality:</tspan> Human eval, LLM scoring
  </text>
  <text x="870" y="965" font-family="Arial, sans-serif" font-size="11" fill="#495057">
    <tspan font-weight="bold">User Satisfaction:</tspan> Feedback ratings, thumbs up/down
  </text>
  <text x="870" y="985" font-family="Arial, sans-serif" font-size="11" fill="#495057">
    <tspan font-weight="bold">Safety Score:</tspan> Content filter pass rate
  </text>
  
  <!-- Decision Flow -->
  <rect x="50" y="220" width="240" height="480" rx="10" fill="#e9d5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="170" y="255" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#9333ea">
    🔄 QC Decision Flow
  </text>
  
  <!-- Flow Step 1 -->
  <rect x="70" y="275" width="200" height="60" rx="8" fill="#fff" stroke="#9333ea" stroke-width="2"/>
  <text x="170" y="295" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#9333ea">
    1. Run Automated Checks
  </text>
  <text x="170" y="313" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#495057">
    Validate all dimensions
  </text>
  <text x="170" y="327" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#495057">
    Calculate scores
  </text>
  
  <!-- Arrow -->
  <path d="M 170 335 L 170 360" stroke="#9333ea" stroke-width="2" fill="none" marker-end="url(#arrowhead2)"/>
  
  <!-- Flow Step 2 -->
  <rect x="70" y="360" width="200" height="60" rx="8" fill="#fff" stroke="#9333ea" stroke-width="2"/>
  <text x="170" y="380" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#9333ea">
    2. Score &gt; Threshold?
  </text>
  <text x="170" y="398" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#37b24d">
    ✅ Yes → Deliver response
  </text>
  <text x="170" y="412" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#e03131">
    ❌ No → Go to step 3
  </text>
  
  <!-- Arrow -->
  <path d="M 170 420 L 170 445" stroke="#e03131" stroke-width="2" fill="none" marker-end="url(#arrowhead3)"/>
  
  <!-- Flow Step 3 -->
  <rect x="70" y="445" width="200" height="60" rx="8" fill="#fff" stroke="#9333ea" stroke-width="2"/>
  <text x="170" y="465" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#9333ea">
    3. Apply Fallback
  </text>
  <text x="170" y="483" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#495057">
    Regenerate or add
  </text>
  <text x="170" y="497" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#495057">
    uncertainty message
  </text>
  
  <!-- Arrow -->
  <path d="M 170 505 L 170 530" stroke="#9333ea" stroke-width="2" fill="none" marker-end="url(#arrowhead2)"/>
  
  <!-- Flow Step 4 -->
  <rect x="70" y="530" width="200" height="60" rx="8" fill="#fff" stroke="#9333ea" stroke-width="2"/>
  <text x="170" y="550" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#9333ea">
    4. Human-in-Loop?
  </text>
  <text x="170" y="568" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#495057">
    Critical apps: Manual
  </text>
  <text x="170" y="582" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#495057">
    review before delivery
  </text>
  
  <!-- Arrow -->
  <path d="M 170 590 L 170 630" stroke="#37b24d" stroke-width="2" fill="none" marker-end="url(#arrowhead4)"/>
  
  <!-- Final Output -->
  <rect x="70" y="630" width="200" height="50" rx="8" fill="#d3f9d8" stroke="#37b24d" stroke-width="3"/>
  <text x="170" y="650" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#37b24d">
    ✅ Quality Validated
  </text>
  <text x="170" y="668" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#37b24d">
    Ready for delivery
  </text>
  
  <!-- Best Practices -->
  <rect x="50" y="740" width="240" height="280" rx="10" fill="#fff3bf" stroke="#fcc419" stroke-width="2"/>
  <text x="170" y="775" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    💡 QC Best Practices
  </text>
  
  <text x="70" y="805" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    ✓ Automate where possible
  </text>
  <text x="70" y="825" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    ✓ Set clear thresholds
  </text>
  <text x="70" y="845" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    ✓ Monitor metrics daily
  </text>
  <text x="70" y="865" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    ✓ Collect user feedback
  </text>
  <text x="70" y="885" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    ✓ Iterate and improve
  </text>
  <text x="70" y="905" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    ✓ A/B test approaches
  </text>
  <text x="70" y="925" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    ✓ Human review for critical
  </text>
  <text x="70" y="945" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    applications
  </text>
  <text x="70" y="965" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    ✓ Log all quality scores
  </text>
  <text x="70" y="985" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    ✓ Regular audits
  </text>
  <text x="70" y="1005" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    ✓ Update thresholds based
  </text>
  <text x="70" y="1020" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    on performance
  </text>
  
  <!-- Final Output Arrow -->
  <path d="M 825 990 L 825 1050" stroke="#37b24d" stroke-width="3" fill="none" marker-end="url(#arrowhead4)"/>
  
  <!-- Final Result -->
  <rect x="525" y="1050" width="600" height="40" rx="10" fill="#d3f9d8" stroke="#37b24d" stroke-width="3"/>
  <text x="825" y="1077" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#37b24d">
    ✅ High-Quality, Validated Response - Ready for User
  </text>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#495057"/>
    </marker>
    <marker id="arrowhead2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#9333ea"/>
    </marker>
    <marker id="arrowhead3" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#e03131"/>
    </marker>
    <marker id="arrowhead4" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#37b24d"/>
    </marker>
  </defs>
</svg>