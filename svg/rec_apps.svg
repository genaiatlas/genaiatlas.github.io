<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ecomGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF5E00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="mediaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E91E63;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C2185B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="socialGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1DA1F2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0C85D0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="finGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00C853;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00A040;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="3" dy="3" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="800" fill="#f0f2f5"/>
  
  <!-- Title -->
  <text x="600" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#1a1a1a">
    Recommendation Systems Applications
  </text>
  
  <!-- Central Hub -->
  <g transform="translate(600, 400)">
    <circle cx="0" cy="0" r="80" fill="white" stroke="#333" stroke-width="3" filter="url(#shadow)"/>
    <text x="0" y="-10" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">RECOMMENDATION</text>
    <text x="0" y="10" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">ENGINE</text>
  </g>
  
  <!-- E-commerce Section -->
  <g transform="translate(200, 200)">
    <rect x="-100" y="-60" width="200" height="120" rx="15" fill="url(#ecomGrad)" filter="url(#shadow)"/>
    <text x="0" y="-30" text-anchor="middle" font-size="18" font-weight="bold" fill="white">E-Commerce</text>
    
    <!-- Icons and Labels -->
    <g transform="translate(-80, -5)">
      <rect x="0" y="0" width="160" height="20" rx="10" fill="rgba(255,255,255,0.2)"/>
      <text x="80" y="14" text-anchor="middle" font-size="11" fill="white">Product Suggestions</text>
    </g>
    <g transform="translate(-80, 20)">
      <rect x="0" y="0" width="160" height="20" rx="10" fill="rgba(255,255,255,0.2)"/>
      <text x="80" y="14" text-anchor="middle" font-size="11" fill="white">Cross-selling</text>
    </g>
    
    <!-- Company Logos/Names -->
    <text x="0" y="75" text-anchor="middle" font-size="12" font-style="italic" fill="#666">Amazon • eBay • Alibaba</text>
  </g>
  
  <!-- Media & Entertainment Section -->
  <g transform="translate(1000, 200)">
    <rect x="-100" y="-60" width="200" height="120" rx="15" fill="url(#mediaGrad)" filter="url(#shadow)"/>
    <text x="0" y="-30" text-anchor="middle" font-size="18" font-weight="bold" fill="white">Entertainment</text>
    
    <g transform="translate(-80, -5)">
      <rect x="0" y="0" width="160" height="20" rx="10" fill="rgba(255,255,255,0.2)"/>
      <text x="80" y="14" text-anchor="middle" font-size="11" fill="white">Video Streaming</text>
    </g>
    <g transform="translate(-80, 20)">
      <rect x="0" y="0" width="160" height="20" rx="10" fill="rgba(255,255,255,0.2)"/>
      <text x="80" y="14" text-anchor="middle" font-size="11" fill="white">Music Discovery</text>
    </g>
    
    <text x="0" y="75" text-anchor="middle" font-size="12" font-style="italic" fill="#666">Netflix • Spotify • YouTube</text>
  </g>
  
  <!-- Social Media Section -->
  <g transform="translate(200, 600)">
    <rect x="-100" y="-60" width="200" height="120" rx="15" fill="url(#socialGrad)" filter="url(#shadow)"/>
    <text x="0" y="-30" text-anchor="middle" font-size="18" font-weight="bold" fill="white">Social Media</text>
    
    <g transform="translate(-80, -5)">
      <rect x="0" y="0" width="160" height="20" rx="10" fill="rgba(255,255,255,0.2)"/>
      <text x="80" y="14" text-anchor="middle" font-size="11" fill="white">Friend Suggestions</text>
    </g>
    <g transform="translate(-80, 20)">
      <rect x="0" y="0" width="160" height="20" rx="10" fill="rgba(255,255,255,0.2)"/>
      <text x="80" y="14" text-anchor="middle" font-size="11" fill="white">Content Feed</text>
    </g>
    
    <text x="0" y="75" text-anchor="middle" font-size="12" font-style="italic" fill="#666">Facebook • LinkedIn • TikTok</text>
  </g>
  
  <!-- Financial Services Section -->
  <g transform="translate(1000, 600)">
    <rect x="-100" y="-60" width="200" height="120" rx="15" fill="url(#finGrad)" filter="url(#shadow)"/>
    <text x="0" y="-30" text-anchor="middle" font-size="18" font-weight="bold" fill="white">Finance</text>
    
    <g transform="translate(-80, -5)">
      <rect x="0" y="0" width="160" height="20" rx="10" fill="rgba(255,255,255,0.2)"/>
      <text x="80" y="14" text-anchor="middle" font-size="11" fill="white">Investment Tips</text>
    </g>
    <g transform="translate(-80, 20)">
      <rect x="0" y="0" width="160" height="20" rx="10" fill="rgba(255,255,255,0.2)"/>
      <text x="80" y="14" text-anchor="middle" font-size="11" fill="white">Credit Products</text>
    </g>
    
    <text x="0" y="75" text-anchor="middle" font-size="12" font-style="italic" fill="#666">Robinhood • Mint • PayPal</text>
  </g>
  
  <!-- Additional Industries -->
  <g transform="translate(600, 150)">
    <rect x="-80" y="-30" width="160" height="60" rx="10" fill="#9C27B0" filter="url(#shadow)"/>
    <text x="0" y="0" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Travel</text>
    <text x="0" y="20" text-anchor="middle" font-size="10" fill="white">Hotels • Flights</text>
  </g>
  
  <g transform="translate(350, 350)">
    <rect x="-80" y="-30" width="160" height="60" rx="10" fill="#607D8B" filter="url(#shadow)"/>
    <text x="0" y="0" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Education</text>
    <text x="0" y="20" text-anchor="middle" font-size="10" fill="white">Courses • Content</text>
  </g>
  
  <g transform="translate(850, 350)">
    <rect x="-80" y="-30" width="160" height="60" rx="10" fill="#795548" filter="url(#shadow)"/>
    <text x="0" y="0" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Dating</text>
    <text x="0" y="20" text-anchor="middle" font-size="10" fill="white">Matches • Profiles</text>
  </g>
  
  <g transform="translate(600, 650)">
    <rect x="-80" y="-30" width="160" height="60" rx="10" fill="#FF5722" filter="url(#shadow)"/>
    <text x="0" y="0" text-anchor="middle" font-size="14" font-weight="bold" fill="white">News</text>
    <text x="0" y="20" text-anchor="middle" font-size="10" fill="white">Articles • Topics</text>
  </g>
  
  <!-- Connection Lines -->
  <defs>
    <marker id="endmarker" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666" opacity="0.5"/>
    </marker>
  </defs>
  
  <!-- Animated connections -->
  <g opacity="0.3">
    <line x1="300" y1="250" x2="520" y2="360" stroke="#666" stroke-width="2" marker-end="url(#endmarker)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="900" y1="250" x2="680" y2="360" stroke="#666" stroke-width="2" marker-end="url(#endmarker)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" begin="0.5s" repeatCount="indefinite"/>
    </line>
    <line x1="300" y1="550" x2="520" y2="440" stroke="#666" stroke-width="2" marker-end="url(#endmarker)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" begin="1s" repeatCount="indefinite"/>
    </line>
    <line x1="900" y1="550" x2="680" y2="440" stroke="#666" stroke-width="2" marker-end="url(#endmarker)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </line>
    <line x1="600" y1="210" x2="600" y2="320" stroke="#666" stroke-width="2" marker-end="url(#endmarker)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" begin="2s" repeatCount="indefinite"/>
    </line>
    <line x1="430" y1="350" x2="520" y2="380" stroke="#666" stroke-width="2" marker-end="url(#endmarker)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" begin="2.5s" repeatCount="indefinite"/>
    </line>
    <line x1="770" y1="350" x2="680" y2="380" stroke="#666" stroke-width="2" marker-end="url(#endmarker)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" begin="0.5s" repeatCount="indefinite"/>
    </line>
    <line x1="600" y1="590" x2="600" y2="480" stroke="#666" stroke-width="2" marker-end="url(#endmarker)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" begin="1s" repeatCount="indefinite"/>
    </line>
  </g>
  
  <!-- Key Stats -->
  <g transform="translate(50, 700)">
    <text x="0" y="0" font-size="14" font-weight="bold" fill="#666">Industry Impact:</text>
    <text x="0" y="25" font-size="12" fill="#888">• 35% of Amazon purchases from recommendations</text>
    <text x="0" y="45" font-size="12" fill="#888">• 80% of Netflix content discovered through recommendations</text>
    <text x="0" y="65" font-size="12" fill="#888">• 40% increase in click-through rates with personalization</text>
  </g>
</svg>