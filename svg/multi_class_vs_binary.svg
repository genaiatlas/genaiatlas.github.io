<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">Binary vs Multi-Class Classification</text>
  
  <!-- Binary Classification Section -->
  <g id="binary-classification">
    <!-- Background box -->
    <rect x="50" y="60" width="300" height="480" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2" rx="10"/>
    <text x="200" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Binary Classification</text>
    
    <!-- Input Layer -->
    <text x="100" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#34495e">Input</text>
    <circle cx="100" cy="140" r="10" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    <circle cx="100" cy="165" r="10" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    <circle cx="100" cy="190" r="10" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    <text x="100" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">⋮</text>
    
    <!-- Hidden Layer -->
    <text x="200" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#34495e">Hidden</text>
    <circle cx="200" cy="135" r="8" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
    <circle cx="200" cy="155" r="8" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
    <circle cx="200" cy="175" r="8" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
    <circle cx="200" cy="195" r="8" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
    
    <!-- Output Layer -->
    <text x="300" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#34495e">Output</text>
    <circle cx="300" cy="165" r="12" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
    <text x="320" y="170" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Sigmoid</text>
    
    <!-- Connections -->
    <g stroke="#7f8c8d" stroke-width="1" opacity="0.6">
      <!-- Input to Hidden -->
      <line x1="110" y1="140" x2="192" y2="135"/>
      <line x1="110" y1="165" x2="192" y2="155"/>
      <line x1="110" y1="190" x2="192" y2="175"/>
      <!-- Hidden to Output -->
      <line x1="208" y1="135" x2="288" y2="165"/>
      <line x1="208" y1="155" x2="288" y2="165"/>
      <line x1="208" y1="175" x2="288" y2="165"/>
      <line x1="208" y1="195" x2="288" y2="165"/>
    </g>
    
    <!-- Binary Output -->
    <text x="200" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Output</text>
    <rect x="150" y="270" width="100" height="30" fill="#f39c12" stroke="#e67e22" stroke-width="2" rx="5"/>
    <text x="200" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#fff">0.73</text>
    <text x="200" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Single probability</text>
    
    <!-- Decision Logic -->
    <text x="200" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Decision</text>
    <text x="200" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">if output > 0.5:</text>
    <text x="200" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#27ae60">    Class 1</text>
    <text x="200" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">else:</text>
    <text x="200" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#e74c3c">    Class 0</text>
    
    <!-- Example -->
    <text x="200" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Example: Cat vs Dog</text>
    <text x="200" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#27ae60">0.73 > 0.5 → Cat</text>
    
    <!-- Loss Function -->
    <text x="200" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Loss: Binary Cross-Entropy</text>
    <text x="200" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">L = -y log(ŷ) - (1-y) log(1-ŷ)</text>
  </g>
  
  <!-- Multi-Class Classification Section -->
  <g id="multi-class-classification">
    <!-- Background box -->
    <rect x="450" y="60" width="300" height="480" fill="#e8f5e8" stroke="#27ae60" stroke-width="2" rx="10"/>
    <text x="600" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Multi-Class Classification</text>
    
    <!-- Input Layer -->
    <text x="500" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#34495e">Input</text>
    <circle cx="500" cy="140" r="10" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    <circle cx="500" cy="165" r="10" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    <circle cx="500" cy="190" r="10" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    <text x="500" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">⋮</text>
    
    <!-- Hidden Layer -->
    <text x="600" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#34495e">Hidden</text>
    <circle cx="600" cy="135" r="8" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
    <circle cx="600" cy="155" r="8" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
    <circle cx="600" cy="175" r="8" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
    <circle cx="600" cy="195" r="8" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
    
    <!-- Output Layer -->
    <text x="700" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#34495e">Output</text>
    <circle cx="700" cy="135" r="10" fill="#27ae60" stroke="#229954" stroke-width="2"/>
    <circle cx="700" cy="155" r="10" fill="#27ae60" stroke="#229954" stroke-width="2"/>
    <circle cx="700" cy="175" r="10" fill="#27ae60" stroke="#229954" stroke-width="2"/>
    <circle cx="700" cy="195" r="10" fill="#27ae60" stroke="#229954" stroke-width="2"/>
    <text x="720" y="165" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Softmax</text>
    
    <!-- Connections -->
    <g stroke="#7f8c8d" stroke-width="1" opacity="0.6">
      <!-- Input to Hidden -->
      <line x1="510" y1="140" x2="592" y2="135"/>
      <line x1="510" y1="165" x2="592" y2="155"/>
      <line x1="510" y1="190" x2="592" y2="175"/>
      <!-- Hidden to Output -->
      <line x1="608" y1="135" x2="690" y2="135"/>
      <line x1="608" y1="155" x2="690" y2="155"/>
      <line x1="608" y1="175" x2="690" y2="175"/>
      <line x1="608" y1="195" x2="690" y2="195"/>
    </g>
    
    <!-- Multi-Class Output -->
    <text x="600" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Output</text>
    
    <!-- Probability bars -->
    <g>
      <!-- Class 0 -->
      <rect x="520" y="270" width="160" height="15" fill="#e8f5e8" stroke="#27ae60" stroke-width="1" rx="2"/>
      <rect x="520" y="270" width="16" height="15" fill="#e74c3c" rx="2"/>
      <text x="515" y="280" text-anchor="end" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">Cat:</text>
      <text x="685" y="280" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">0.10</text>
      
      <!-- Class 1 -->
      <rect x="520" y="290" width="160" height="15" fill="#e8f5e8" stroke="#27ae60" stroke-width="1" rx="2"/>
      <rect x="520" y="290" width="144" height="15" fill="#27ae60" rx="2"/>
      <text x="515" y="300" text-anchor="end" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">Dog:</text>
      <text x="685" y="300" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">0.90</text>
      
      <!-- Class 2 -->
      <rect x="520" y="310" width="160" height="15" fill="#e8f5e8" stroke="#27ae60" stroke-width="1" rx="2"/>
      <rect x="520" y="310" width="0" height="15" fill="#f39c12" rx="2"/>
      <text x="515" y="320" text-anchor="end" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">Bird:</text>
      <text x="685" y="320" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">0.00</text>
    </g>
    
    <text x="600" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Probabilities sum to 1.0</text>
    
    <!-- Decision Logic -->
    <text x="600" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Decision</text>
    <text x="600" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">argmax(output):</text>
    <text x="600" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#27ae60">Class 1 (Dog)</text>
    
    <!-- Example -->
    <text x="600" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Example: Animal Classification</text>
    <text x="600" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#27ae60">max(0.10, 0.90, 0.00) → Dog</text>
    
    <!-- Loss Function -->
    <text x="600" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Loss: Categorical Cross-Entropy</text>
    <text x="600" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">L = -∑ y_i log(ŷ_i)</text>
  </g>
  
  <!-- Comparison Arrow -->
  <defs>
    <marker id="arrowhead2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e"/>
    </marker>
  </defs>
  <line x1="370" y1="300" x2="430" y2="300" stroke="#34495e" stroke-width="3" marker-end="url(#arrowhead2)"/>
  <text x="400" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#34495e">vs</text>
  
  <!-- Key Differences Table -->
  <g transform="translate(100, 550)">
    <text x="300" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Key Differences</text>
    <rect x="0" y="10" width="600" height="80" fill="#ffffff" stroke="#bdc3c7" stroke-width="1" rx="5"/>
    
    <!-- Table Headers -->
    <text x="10" y="30" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">Aspect</text>
    <text x="150" y="30" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">Binary</text>
    <text x="350" y="30" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">Multi-Class</text>
    
    <!-- Table Rows -->
    <line x1="0" y1="35" x2="600" y2="35" stroke="#bdc3c7" stroke-width="1"/>
    
    <text x="10" y="50" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Output Neurons</text>
    <text x="150" y="50" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">1</text>
    <text x="350" y="50" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">N (number of classes)</text>
    
    <text x="10" y="65" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Activation</text>
    <text x="150" y="65" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Sigmoid</text>
    <text x="350" y="65" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Softmax</text>
    
    <text x="10" y="80" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Decision</text>
    <text x="150" y="80" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Threshold (>0.5)</text>
    <text x="350" y="80" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Argmax</text>
  </g>
</svg>