<svg viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1400" height="900" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="700" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#2c3e50">Complete Bagging Workflow</text>
  
  <!-- Step 1: Original Dataset -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="200" height="250" fill="#e3f2fd" stroke="#1976d2" stroke-width="3" rx="15"/>
    <text x="100" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1976d2">Step 1: Original Dataset</text>
    <text x="100" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1976d2">D = {(xᵢ, yᵢ)} where i=1..12</text>
    
    <!-- Dataset visualization -->
    <g transform="translate(20, 60)">
      <rect x="0" y="0" width="160" height="160" fill="#fff" stroke="#1976d2" rx="5"/>
      <text x="80" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#424242">Restaurant Dataset</text>
      
      <!-- Data grid -->
      <g font-family="Arial, sans-serif" font-size="8" fill="#424242">
        <text x="5" y="35">X₁: Thai, H=No, R=Yes → Wait</text>
        <text x="5" y="50">X₂: Thai, H=Yes, R=No → Leave</text>
        <text x="5" y="65">X₃: Burger, H=No, R=No → Wait</text>
        <text x="5" y="80">X₄: Thai, H=Yes, R=No → Wait</text>
        <text x="5" y="95">X₅: French, H=No, R=Yes → Leave</text>
        <text x="5" y="110">X₆: Italian, H=Yes, R=Yes → Wait</text>
        <text x="5" y="125">X₇: Burger, H=No, R=No → Leave</text>
        <text x="5" y="140">X₈: Thai, H=Yes, R=Yes → Wait</text>
        <text x="5" y="155">... (X₉-X₁₂)</text>
      </g>
    </g>
    
    <!-- Statistics -->
    <g transform="translate(20, 230)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="10" fill="#1976d2">• n = 12 samples</text>
      <text x="0" y="15" font-family="Arial, sans-serif" font-size="10" fill="#1976d2">• 10 features</text>
    </g>
  </g>
  
  <!-- Arrow 1 -->
  <path d="M 270 180 Q 320 160 370 140" stroke="#e74c3c" stroke-width="4" fill="none" marker-end="url(#arrowhead)"/>
  <text x="320" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#e74c3c">Bootstrap</text>
  <text x="320" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#e74c3c">Sampling</text>
  
  <!-- Step 2: Bootstrap Samples -->
  <g transform="translate(380, 80)">
    <rect x="0" y="0" width="280" height="250" fill="#fff3e0" stroke="#f57c00" stroke-width="3" rx="15"/>
    <text x="140" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#f57c00">Step 2: Bootstrap Sampling</text>
    <text x="140" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#f57c00">Generate m bootstrap samples Bᵢ</text>
    
    <!-- Sample 1 -->
    <g transform="translate(20, 60)">
      <rect x="0" y="0" width="70" height="120" fill="#ffecb3" stroke="#ff8f00" rx="5"/>
      <text x="35" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ff8f00">B₁</text>
      <text x="35" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#424242">k=5 samples</text>
      <g font-family="Arial, sans-serif" font-size="7" fill="#424242">
        <text x="5" y="45">X₁₁</text>
        <text x="5" y="60">X₁₂</text>
        <text x="5" y="75">X₇</text>
        <text x="5" y="90">X₂</text>
        <text x="5" y="105">X₁₂*</text>
      </g>
    </g>
    
    <!-- Sample 2 -->
    <g transform="translate(105, 60)">
      <rect x="0" y="0" width="70" height="120" fill="#ffecb3" stroke="#ff8f00" rx="5"/>
      <text x="35" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ff8f00">B₂</text>
      <text x="35" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#424242">k=5 samples</text>
      <g font-family="Arial, sans-serif" font-size="7" fill="#424242">
        <text x="5" y="45">X₅</text>
        <text x="5" y="60">X₄</text>
        <text x="5" y="75">X₆</text>
        <text x="5" y="90">X₈</text>
        <text x="5" y="105">X₇</text>
      </g>
    </g>
    
    <!-- Sample 3 -->
    <g transform="translate(190, 60)">
      <rect x="0" y="0" width="70" height="120" fill="#ffecb3" stroke="#ff8f00" rx="5"/>
      <text x="35" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ff8f00">B₃</text>
      <text x="35" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#424242">k=5 samples</text>
      <g font-family="Arial, sans-serif" font-size="7" fill="#424242">
        <text x="5" y="45">X₉</text>
        <text x="5" y="60">X₁₀</text>
        <text x="5" y="75">X₄</text>
        <text x="5" y="90">X₂</text>
        <text x="5" y="105">X₁₀*</text>
      </g>
    </g>
    
    <!-- Formula -->
    <g transform="translate(20, 190)">
      <text x="0" y="15" font-family="Arial, sans-serif" font-size="10" fill="#f57c00">Sampling with replacement:</text>
      <text x="0" y="30" font-family="Arial, sans-serif" font-size="9" fill="#424242">P(sample i) = 1/n for each draw</text>
      <text x="0" y="45" font-family="Arial, sans-serif" font-size="9" fill="#424242">* indicates duplicate selection</text>
    </g>
  </g>
  
  <!-- Arrow 2 -->
  <path d="M 680 180 Q 730 160 780 140" stroke="#e74c3c" stroke-width="4" fill="none" marker-end="url(#arrowhead)"/>
  <text x="730" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#e74c3c">Train</text>
  <text x="730" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#e74c3c">Models</text>
  
  <!-- Step 3: Model Training -->
  <g transform="translate(790, 80)">
    <rect x="0" y="0" width="250" height="250" fill="#e8f5e8" stroke="#27ae60" stroke-width="3" rx="15"/>
    <text x="125" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#27ae60">Step 3: Train Decision Trees</text>
    <text x="125" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#27ae60">Use entropy minimization</text>
    
    <!-- Tree 1 -->
    <g transform="translate(20, 60)">
      <rect x="0" y="0" width="65" height="110" fill="#c8e6c9" stroke="#4caf50" rx="5"/>
      <text x="32" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#2e7d32">h₁(x)</text>
      <circle cx="32" cy="35" r="12" fill="#4caf50"/>
      <text x="32" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="white">Type</text>
      <line x1="20" y1="47" x2="10" y2="65" stroke="#424242"/>
      <line x1="44" y1="47" x2="54" y2="65" stroke="#424242"/>
      <rect x="5" y="70" width="18" height="12" fill="#ff5722" rx="2"/>
      <text x="14" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="white">L</text>
      <rect x="42" y="70" width="18" height="12" fill="#2196f3" rx="2"/>
      <text x="51" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="white">W</text>
      <text x="32" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#27ae60">Loss: 0.55</text>
    </g>
    
    <!-- Tree 2 -->
    <g transform="translate(92, 60)">
      <rect x="0" y="0" width="65" height="110" fill="#c8e6c9" stroke="#4caf50" rx="5"/>
      <text x="32" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#2e7d32">h₂(x)</text>
      <circle cx="32" cy="35" r="12" fill="#4caf50"/>
      <text x="32" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="white">Hungry</text>
      <line x1="20" y1="47" x2="10" y2="65" stroke="#424242"/>
      <line x1="44" y1="47" x2="54" y2="65" stroke="#424242"/>
      <rect x="5" y="70" width="18" height="12" fill="#2196f3" rx="2"/>
      <text x="14" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="white">W</text>
      <rect x="42" y="70" width="18" height="12" fill="#ff5722" rx="2"/>
      <text x="51" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="white">L</text>
      <text x="32" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#27ae60">Loss: 0.0</text>
    </g>
    
    <!-- Tree 3 -->
    <g transform="translate(164, 60)">
      <rect x="0" y="0" width="65" height="110" fill="#c8e6c9" stroke="#4caf50" rx="5"/>
      <text x="32" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#2e7d32">h₃(x)</text>
      <circle cx="32" cy="35" r="12" fill="#4caf50"/>
      <text x="32" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="white">Rain</text>
      <line x1="20" y1="47" x2="10" y2="65" stroke="#424242"/>
      <line x1="44" y1="47" x2="54" y2="65" stroke="#424242"/>
      <rect x="5" y="70" width="18" height="12" fill="#2196f3" rx="2"/>
      <text x="14" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="white">W</text>
      <rect x="42" y="70" width="18" height="12" fill="#ff5722" rx="2"/>
      <text x="51" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="white">L</text>
      <text x="32" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#27ae60">Loss: 0.4</text>
    </g>
    
    <!-- Algorithm details -->
    <g transform="translate(20, 180)">
      <text x="0" y="15" font-family="Arial, sans-serif" font-size="10" fill="#27ae60">Entropy minimization:</text>
      <text x="0" y="30" font-family="Arial, sans-serif" font-size="9" fill="#424242">Select feature with max info gain</text>
      <text x="0" y="45" font-family="Arial, sans-serif" font-size="9" fill="#424242">Different samples → different trees</text>
      <text x="0" y="60" font-family="Arial, sans-serif" font-size="9" fill="#424242">Diversity is key!</text>
    </g>
  </g>
  
  <!-- Arrow 3 -->
  <path d="M 1060 180 Q 1110 160 1160 140" stroke="#e74c3c" stroke-width="4" fill="none" marker-end="url(#arrowhead)"/>
  <text x="1110" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#e74c3c">Test</text>
  <text x="1110" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#e74c3c">Input</text>
  
  <!-- Step 4: Test Input -->
  <g transform="translate(1170, 80)">
    <rect x="0" y="0" width="180" height="250" fill="#fce4ec" stroke="#e91e63" stroke-width="3" rx="15"/>
    <text x="90" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#e91e63">Step 4: New Sample</text>
    <text x="90" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#e91e63">x_test</text>
    
    <!-- Test sample -->
    <g transform="translate(20, 60)">
      <rect x="0" y="0" width="140" height="140" fill="#fff" stroke="#e91e63" rx="5"/>
      <text x="70" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#424242">Test Sample</text>
      
      <g font-family="Arial, sans-serif" font-size="9" fill="#424242">
        <text x="10" y="35">Type: Burger</text>
        <text x="10" y="50">Hungry: No</text>
        <text x="10" y="65">Rain: No</text>
        <text x="10" y="80">Price: $$</text>
        <text x="10" y="95">Patrons: Some</text>
        <text x="10" y="110">...</text>
        <text x="10" y="125">Actual: ?</text>
      </g>
    </g>
    
    <!-- Input arrow -->
    <g transform="translate(20, 210)">
      <text x="0" y="15" font-family="Arial, sans-serif" font-size="10" fill="#e91e63">Apply to each tree:</text>
      <text x="0" y="30" font-family="Arial, sans-serif" font-size="9" fill="#424242">• Extract features</text>
      <text x="0" y="45" font-family="Arial, sans-serif" font-size="9" fill="#424242">• Follow decision path</text>
    </g>
  </g>
  
  <!-- Vertical arrow down -->
  <path d="M 700 350 L 700 400" stroke="#e74c3c" stroke-width="4" fill="none" marker-end="url(#arrowhead)"/>
  <text x="720" y="380" font-family="Arial, sans-serif" font-size="12" fill="#e74c3c">Predict</text>
  
  <!-- Step 5: Individual Predictions -->
  <g transform="translate(50, 420)">
    <rect x="0" y="0" width="1300" height="200" fill="#f3e5f5" stroke="#9c27b0" stroke-width="3" rx="15"/>
    <text x="650" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#9c27b0">Step 5: Individual Tree Predictions</text>
    
    <!-- Tree 1 prediction -->
    <g transform="translate(100, 40)">
      <rect x="0" y="0" width="300" height="140" fill="#e1bee7" stroke="#8e24aa" rx="8"/>
      <text x="150" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#8e24aa">Tree 1: Type Split</text>
      
      <g transform="translate(20, 30)">
        <text x="0" y="15" font-family="Arial, sans-serif" font-size="10" fill="#424242">Input: Type = Burger</text>
        <circle cx="130" cy="35" r="15" fill="#4caf50"/>
        <text x="130" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">Type</text>
        <line x1="115" y1="45" x2="80" y2="65" stroke="#424242" stroke-width="2"/>
        <text x="70" y="60" font-family="Arial, sans-serif" font-size="8" fill="#424242">Thai</text>
        <line x1="145" y1="45" x2="180" y2="65" stroke="#ff9800" stroke-width="3"/>
        <text x="170" y="60" font-family="Arial, sans-serif" font-size="8" fill="#424242">Burger</text>
        <rect x="160" y="70" width="40" height="20" fill="#2196f3" rx="3"/>
        <text x="180" y="83" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">Wait</text>
        <text x="130" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#8e24aa">h₁(x) = 1 (Wait)</text>
      </g>
    </g>
    
    <!-- Tree 2 prediction -->
    <g transform="translate(450, 40)">
      <rect x="0" y="0" width="300" height="140" fill="#e1bee7" stroke="#8e24aa" rx="8"/>
      <text x="150" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#8e24aa">Tree 2: Hungry Split</text>
      
      <g transform="translate(20, 30)">
        <text x="0" y="15" font-family="Arial, sans-serif" font-size="10" fill="#424242">Input: Hungry = No</text>
        <circle cx="130" cy="35" r="15" fill="#4caf50"/>
        <text x="130" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="white">Hungry</text>
        <line x1="115" y1="45" x2="80" y2="65" stroke="#424242" stroke-width="2"/>
        <text x="70" y="60" font-family="Arial, sans-serif" font-size="8" fill="#424242">Yes</text>
        <line x1="145" y1="45" x2="180" y2="65" stroke="#ff9800" stroke-width="3"/>
        <text x="170" y="60" font-family="Arial, sans-serif" font-size="8" fill="#424242">No</text>
        <rect x="160" y="70" width="40" height="20" fill="#ff5722" rx="3"/>
        <text x="180" y="83" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">Leave</text>
        <text x="130" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#8e24aa">h₂(x) = 0 (Leave)</text>
      </g>
    </g>
    
    <!-- Tree 3 prediction -->
    <g transform="translate(800, 40)">
      <rect x="0" y="0" width="300" height="140" fill="#e1bee7" stroke="#8e24aa" rx="8"/>
      <text x="150" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#8e24aa">Tree 3: Rain Split</text>
      
      <g transform="translate(20, 30)">
        <text x="0" y="15" font-family="Arial, sans-serif" font-size="10" fill="#424242">Input: Rain = No</text>
        <circle cx="130" cy="35" r="15" fill="#4caf50"/>
        <text x="130" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">Rain</text>
        <line x1="115" y1="45" x2="80" y2="65" stroke="#424242" stroke-width="2"/>
        <text x="70" y="60" font-family="Arial, sans-serif" font-size="8" fill="#424242">Yes</text>
        <line x1="145" y1="45" x2="180" y2="65" stroke="#ff9800" stroke-width="3"/>
        <text x="170" y="60" font-family="Arial, sans-serif" font-size="8" fill="#424242">No</text>
        <rect x="160" y="70" width="40" height="20" fill="#ff5722" rx="3"/>
        <text x="180" y="83" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">Leave</text>
        <text x="130" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#8e24aa">h₃(x) = 0 (Leave)</text>
      </g>
    </g>
  </g>
  
  <!-- Vertical arrow down -->
  <path d="M 700 640 L 700 690" stroke="#e74c3c" stroke-width="4" fill="none" marker-end="url(#arrowhead)"/>
  <text x="720" y="670" font-family="Arial, sans-serif" font-size="12" fill="#e74c3c">Aggregate</text>
  
  <!-- Step 6: Final Prediction -->
  <g transform="translate(450, 710)">
    <rect x="0" y="0" width="500" height="150" fill="#ffebee" stroke="#f44336" stroke-width="3" rx="15"/>
    <text x="250" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#f44336">Step 6: Ensemble Decision</text>
    
    <!-- Voting process -->
    <g transform="translate(50, 40)">
      <text x="0" y="15" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#424242">Majority Voting:</text>
      <text x="0" y="35" font-family="Arial, sans-serif" font-size="11" fill="#424242">Individual votes: [1, 0, 0]</text>
      <text x="0" y="55" font-family="Arial, sans-serif" font-size="11" fill="#424242">Wait votes: 1</text>
      <text x="0" y="75" font-family="Arial, sans-serif" font-size="11" fill="#424242">Leave votes: 2</text>
    </g>
    
    <!-- Final result -->
    <g transform="translate(250, 40)">
      <rect x="0" y="0" width="200" height="80" fill="#ff5722" stroke="#d32f2f" stroke-width="2" rx="10"/>
      <text x="100" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">FINAL PREDICTION</text>
      <text x="100" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">LEAVE</text>
      <text x="100" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Majority: 2/3 votes</text>
    </g>
  </g>
  
  <!-- Mathematical summary -->
  <g transform="translate(50, 880)">
    <rect x="0" y="0" width="1300" height="50" fill="#fff" stroke="#9e9e9e" stroke-width="1" rx="5" stroke-dasharray="5,5"/>
    <text x="20" y="20" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#424242">Mathematical Summary:</text>
    <text x="200" y="20" font-family="Arial, sans-serif" font-size="11" fill="#424242">ŷ_ensemble = sign(Σᵢ hᵢ(x)) = sign(1 + 0 + 0) = sign(1) = +1 → Wait</text>
    <text x="20" y="40" font-family="Arial, sans-serif" font-size="11" fill="#424242">But majority vote gives Leave (2/3). Final decision uses majority rule: argmax_y Σᵢ 𝟙[hᵢ(x) = y]</text>
  </g>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="12" markerHeight="8" refX="12" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#e74c3c"/>
    </marker>
  </defs>
</svg>