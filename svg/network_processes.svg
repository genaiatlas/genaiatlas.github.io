<svg viewBox="0 0 1200 850" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 28px; font-weight: bold; fill: #2c3e50; }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 20px; font-weight: 600; fill: #34495e; }
      .label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #2c3e50; }
      .small-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #555; }
      .node { fill: #95a5a6; stroke: #7f8c8d; stroke-width: 2; }
      .node-active { fill: #e74c3c; stroke: #c0392b; stroke-width: 2; }
      .node-spreading { fill: #f39c12; stroke: #d68910; stroke-width: 2; }
      .node-susceptible { fill: #3498db; stroke: #2980b9; stroke-width: 2; }
      .edge { stroke: #bdc3c7; stroke-width: 2; fill: none; }
      .edge-active { stroke: #e74c3c; stroke-width: 3; fill: none; }
      .box { fill: #ecf0f1; stroke: #34495e; stroke-width: 2; rx: 10; }
      .formula-box { fill: #fff; stroke: #3498db; stroke-width: 2; rx: 8; }
      .wave { fill: none; stroke: #e74c3c; stroke-width: 2; }
    </style>
    <marker id="flow-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#e74c3c"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="600" y="40" class="title" text-anchor="middle">Processes on Networks</text>
  
  <!-- Top Section: Information Spreading -->
  <rect x="50" y="70" width="540" height="350" class="box"/>
  <text x="320" y="105" class="subtitle" text-anchor="middle">Information Spreading</text>
  
  <!-- Time steps visualization -->
  <text x="120" y="140" class="label" font-weight="bold">t = 0</text>
  <circle cx="150" cy="200" r="15" class="node-active"/>
  <circle cx="220" cy="180" r="13" class="node-susceptible"/>
  <circle cx="220" cy="220" r="13" class="node-susceptible"/>
  <circle cx="290" cy="200" r="13" class="node-susceptible"/>
  <circle cx="260" cy="260" r="13" class="node-susceptible"/>
  
  <line x1="165" y1="200" x2="205" y2="185" class="edge"/>
  <line x1="165" y1="200" x2="205" y2="215" class="edge"/>
  <line x1="235" y1="180" x2="275" y2="195" class="edge"/>
  <line x1="235" y1="220" x2="255" y2="250" class="edge"/>
  
  <text x="280" y="140" class="label" font-weight="bold">t = 1</text>
  <circle cx="310" cy="200" r="15" class="node-active"/>
  <circle cx="380" cy="180" r="13" class="node-spreading"/>
  <circle cx="380" cy="220" r="13" class="node-spreading"/>
  <circle cx="450" cy="200" r="13" class="node-susceptible"/>
  <circle cx="420" cy="260" r="13" class="node-susceptible"/>
  
  <line x1="325" y1="200" x2="365" y2="185" class="edge-active"/>
  <line x1="325" y1="200" x2="365" y2="215" class="edge-active"/>
  <line x1="395" y1="180" x2="435" y2="195" class="edge"/>
  <line x1="395" y1="220" x2="415" y2="250" class="edge"/>
  
  <text x="490" y="140" class="label" font-weight="bold">t = 2</text>
  <circle cx="520" cy="200" r="15" class="node-active"/>
  <circle cx="520" cy="160" r="13" class="node-active"/>
  <circle cx="520" cy="240" r="13" class="node-active"/>
  <circle cx="550" cy="280" r="13" class="node-spreading"/>
  
  <line x1="520" y1="175" x2="520" y2="185" class="edge-active"/>
  <line x1="520" y1="215" x2="520" y2="225" class="edge-active"/>
  <line x1="530" y1="250" x2="545" y2="270" class="edge-active"/>
  
  <!-- Legend -->
  <rect x="100" y="300" width="450" height="105" class="formula-box"/>
  <text x="325" y="325" class="label" text-anchor="middle" font-weight="bold">Epidemic Model (SIS):</text>
  <text x="325" y="350" class="small-label" text-anchor="middle">dI/dt = βSI - γI</text>
  
  <circle cx="140" cy="365" r="10" class="node-susceptible"/>
  <text x="160" y="370" class="small-label">Susceptible (not infected)</text>
  
  <circle cx="330" cy="365" r="10" class="node-spreading"/>
  <text x="350" y="370" class="small-label">Spreading (newly infected)</text>
  
  <circle cx="140" cy="390" r="10" class="node-active"/>
  <text x="160" y="395" class="small-label">Active (infected)</text>
  
  <text x="330" y="395" class="small-label">β = transmission rate, γ = recovery rate</text>
  
  <!-- Right Section: Cascade Effects -->
  <rect x="630" y="70" width="520" height="350" class="box"/>
  <text x="890" y="105" class="subtitle" text-anchor="middle">Cascade Effects</text>
  
  <!-- Cascade visualization -->
  <text x="890" y="140" class="small-label" text-anchor="middle">Threshold-based activation</text>
  
  <!-- Initial state -->
  <circle cx="750" cy="180" r="18" class="node-active"/>
  <text x="750" y="185" class="small-label" text-anchor="middle" fill="white">A</text>
  
  <circle cx="850" cy="160" r="16" class="node-spreading"/>
  <text x="850" y="165" class="small-label" text-anchor="middle" fill="white">B</text>
  
  <circle cx="950" cy="180" r="16" class="node-susceptible"/>
  <text x="950" y="185" class="small-label" text-anchor="middle" fill="white">C</text>
  
  <circle cx="1030" cy="220" r="16" class="node-susceptible"/>
  <text x="1030" y="225" class="small-label" text-anchor="middle" fill="white">D</text>
  
  <circle cx="850" cy="240" r="16" class="node-susceptible"/>
  <text x="850" y="245" class="small-label" text-anchor="middle" fill="white">E</text>
  
  <circle cx="950" cy="260" r="16" class="node-susceptible"/>
  <text x="950" y="265" class="small-label" text-anchor="middle" fill="white">F</text>
  
  <!-- Edges showing cascade -->
  <path d="M 768 180 L 832 165" class="edge-active" marker-end="url(#flow-arrow)"/>
  <path d="M 866 165 L 934 180" class="edge-active" marker-end="url(#flow-arrow)"/>
  <path d="M 866 240 L 934 255" class="edge" marker-end="url(#flow-arrow)"/>
  <path d="M 966 185 L 1014 215" class="edge" marker-end="url(#flow-arrow)"/>
  <path d="M 950" y1="200" x2="950" y2="244" class="edge"/>
  
  <!-- Propagation wave -->
  <path d="M 700 290 Q 800 270 900 290 T 1100 290" class="wave"/>
  <text x="890" y="320" class="small-label" text-anchor="middle" style="fill: #e74c3c; font-weight: bold;">Propagation Wave →</text>
  
  <!-- Cascade properties -->
  <rect x="660" y="340" width="460" height="70" class="formula-box"/>
  <text x="890" y="362" class="label" text-anchor="middle" font-weight="bold">Cascade Characteristics:</text>
  <text x="675" y="380" class="small-label">• Chain reaction through network</text>
  <text x="675" y="395" class="small-label">• Activation depends on threshold (e.g., 2 active neighbors)</text>
  <text x="675" y="410" class="small-label">• Examples: Viral tweets, bank runs, blackouts, trends</text>
  
  <!-- Bottom Section: Network Traffic/Flow -->
  <rect x="50" y="460" width="540" height="360" class="box"/>
  <text x="320" y="495" class="subtitle" text-anchor="middle">Network Traffic &amp; Flow</text>
  
  <!-- Flow network diagram -->
  <circle cx="150" cy="570" r="18" class="node"/>
  <text x="150" y="575" class="small-label" text-anchor="middle">S</text>
  <text x="150" y="600" class="small-label" text-anchor="middle">Source</text>
  
  <circle cx="270" cy="540" r="16" class="node"/>
  <text x="270" y="545" class="small-label" text-anchor="middle">A</text>
  
  <circle cx="270" cy="600" r="16" class="node"/>
  <text x="270" y="605" class="small-label" text-anchor="middle">B</text>
  
  <circle cx="390" cy="540" r="16" class="node"/>
  <text x="390" y="545" class="small-label" text-anchor="middle">C</text>
  
  <circle cx="390" cy="600" r="16" class="node"/>
  <text x="390" y="605" class="small-label" text-anchor="middle">D</text>
  
  <circle cx="490" cy="570" r="18" class="node"/>
  <text x="490" y="575" class="small-label" text-anchor="middle">T</text>
  <text x="490" y="600" class="small-label" text-anchor="middle">Target</text>
  
  <!-- Flow edges with capacity labels -->
  <path d="M 168 565 L 252 545" class="edge-active" marker-end="url(#flow-arrow)"/>
  <text x="210" y="550" class="small-label" fill="#e74c3c">10</text>
  
  <path d="M 168 575 L 252 595" class="edge-active" marker-end="url(#flow-arrow)"/>
  <text x="210" y="595" class="small-label" fill="#e74c3c">8</text>
  
  <path d="M 286 540 L 374 540" class="edge-active" marker-end="url(#flow-arrow)"/>
  <text x="330" y="535" class="small-label" fill="#e74c3c">6</text>
  
  <path d="M 280 555 L 380 590" class="edge-active" marker-end="url(#flow-arrow)"/>
  <text x="330" y="580" class="small-label" fill="#e74c3c">4</text>
  
  <path d="M 286 600 L 374 600" class="edge-active" marker-end="url(#flow-arrow)"/>
  <text x="330" y="615" class="small-label" fill="#e74c3c">5</text>
  
  <path d="M 406 545 L 472 565" class="edge-active" marker-end="url(#flow-arrow)"/>
  <text x="440" y="550" class="small-label" fill="#e74c3c">10</text>
  
  <path d="M 406 595 L 472 575" class="edge-active" marker-end="url(#flow-arrow)"/>
  <text x="440" y="595" class="small-label" fill="#e74c3c">9</text>
  
  <!-- Flow properties -->
  <rect x="80" y="650" width="480" height="150" class="formula-box"/>
  <text x="320" y="675" class="label" text-anchor="middle" font-weight="bold">Flow Optimization Goals:</text>
  
  <text x="100" y="700" class="small-label">• Maximize throughput (total flow from source to target)</text>
  <text x="100" y="718" class="small-label">• Minimize congestion at bottleneck edges</text>
  <text x="100" y="736" class="small-label">• Balance load across multiple paths</text>
  <text x="100" y="754" class="small-label">• Applications: Internet routing, traffic systems, supply chains</text>
  
  <text x="320" y="785" class="small-label" text-anchor="middle" font-weight="bold" fill="#e74c3c">Edge labels show capacity/flow amounts</text>
  
  <!-- Right Bottom: Influence & Adoption -->
  <rect x="630" y="460" width="520" height="360" class="box"/>
  <text x="890" y="495" class="subtitle" text-anchor="middle">Influence &amp; Adoption</text>
  
  <!-- Influence network -->
  <circle cx="890" cy="560" r="25" class="node-active"/>
  <text x="890" y="567" class="label" text-anchor="middle" fill="white">Hub</text>
  
  <!-- Inner ring -->
  <circle cx="780" cy="560" r="16" class="node-spreading"/>
  <circle cx="890" cy="480" r="16" class="node-spreading"/>
  <circle cx="1000" cy="560" r="16" class="node-spreading"/>
  <circle cx="890" cy="640" r="16" class="node-spreading"/>
  
  <!-- Outer ring -->
  <circle cx="720" cy="520" r="13" class="node-susceptible"/>
  <circle cx="720" cy="600" r="13" class="node-susceptible"/>
  <circle cx="850" cy="440" r="13" class="node-susceptible"/>
  <circle cx="930" cy="440" r="13" class="node-susceptible"/>
  <circle cx="1040" cy="520" r="13" class="node-susceptible"/>
  <circle cx="1040" cy="600" r="13" class="node-susceptible"/>
  
  <!-- Connections -->
  <line x1="865" y1="560" x2="796" y2="560" class="edge-active"/>
  <line x1="890" y1="535" x2="890" y2="496" class="edge-active"/>
  <line x1="915" y1="560" x2="984" y2="560" class="edge-active"/>
  <line x1="890" y1="585" x2="890" y2="624" class="edge-active"/>
  
  <line x1="765" y1="550" x2="730" y2="530" class="edge"/>
  <line x1="765" y1="570" x2="730" y2="590" class="edge"/>
  <line x1="885" y1="465" x2="860" y2="448" class="edge"/>
  <line x1="895" y1="465" x2="920" y2="448" class="edge"/>
  <line x1="1015" y1="550" x2="1030" y2="530" class="edge"/>
  <line x1="1015" y1="570" x2="1030" y2="590" class="edge"/>
  
  <!-- Influence metrics -->
  <rect x="660" y="690" width="460" height="110" class="formula-box"/>
  <text x="890" y="715" class="label" text-anchor="middle" font-weight="bold">Influence Factors:</text>
  
  <text x="675" y="738" class="small-label">• Network Position: Central nodes have more reach</text>
  <text x="675" y="755" class="small-label">• Connection Quality: Strong vs weak ties</text>
  <text x="675" y="772" class="small-label">• Trust &amp; Homophily: Similar nodes influence more</text>
  <text x="675" y="789" class="small-label">• Applications: Marketing, opinion formation, product adoption</text>
</svg>