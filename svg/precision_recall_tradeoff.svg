<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="aggressiveGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e74c3c" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#c0392b" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="conservativeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ecc71" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#27ae60" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="balancedGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f39c12" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#d68910" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#00000030"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#2c3e50">
    Precision-Recall Trade-off
  </text>

  <!-- Trade-off Arrow -->
  <g transform="translate(100, 70)">
    <line x1="0" y1="50" x2="600" y2="50" stroke="#7f8c8d" stroke-width="4" marker-end="url(#arrowhead)"/>
    
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#7f8c8d"/>
      </marker>
    </defs>
    
    <!-- Conservative end -->
    <g transform="translate(0, 0)">
      <rect x="-50" y="70" width="150" height="120" rx="10" fill="url(#conservativeGradient)" stroke="#27ae60" stroke-width="3" filter="url(#shadow)"/>
      
      <text x="25" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e8449">
        CONSERVATIVE
      </text>
      <text x="25" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">
        Flag fewer cases
      </text>
      <line x1="-30" y1="135" x2="80" y2="135" stroke="#27ae60" stroke-width="1"/>
      <text x="25" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#27ae60">
        HIGH PRECISION
      </text>
      <text x="25" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">
        Few false positives
      </text>
      <text x="25" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#c0392b">
        LOW RECALL
      </text>
    </g>
    
    <!-- Balanced center -->
    <g transform="translate(300, 0)">
      <rect x="-75" y="70" width="150" height="120" rx="10" fill="url(#balancedGradient)" stroke="#d68910" stroke-width="3" filter="url(#shadow)"/>
      
      <text x="0" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#b7670f">
        BALANCED
      </text>
      <text x="0" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">
        Moderate approach
      </text>
      <line x1="-55" y1="135" x2="55" y2="135" stroke="#d68910" stroke-width="1"/>
      <text x="0" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#d68910">
        MODERATE BOTH
      </text>
      <text x="0" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">
        Optimize F1 Score
      </text>
    </g>
    
    <!-- Aggressive end -->
    <g transform="translate(550, 0)">
      <rect x="-50" y="70" width="150" height="120" rx="10" fill="url(#aggressiveGradient)" stroke="#c0392b" stroke-width="3" filter="url(#shadow)"/>
      
      <text x="25" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#922b21">
        AGGRESSIVE
      </text>
      <text x="25" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">
        Flag more cases
      </text>
      <line x1="-30" y1="135" x2="80" y2="135" stroke="#c0392b" stroke-width="1"/>
      <text x="25" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#c0392b">
        LOW PRECISION
      </text>
      <text x="25" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">
        Many false positives
      </text>
      <text x="25" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#27ae60">
        HIGH RECALL
      </text>
    </g>
    
    <!-- Arrow labels -->
    <text x="150" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#7f8c8d">
      Higher Precision
    </text>
    <text x="450" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#7f8c8d">
      Higher Recall
    </text>
  </g>

  <!-- Real-world examples -->
  <g transform="translate(50, 320)">
    <text x="350" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#2c3e50">
      When to Choose Each Approach
    </text>
    
    <!-- Conservative scenarios -->
    <g transform="translate(0, 50)">
      <rect x="0" y="0" width="220" height="150" fill="#eafaf1" stroke="#27ae60" stroke-width="2" rx="8"/>
      
      <text x="110" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#27ae60">
        Choose Conservative
      </text>
      <text x="110" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
        (High Precision)
      </text>
      
      <g transform="translate(15, 60)">
        <circle cx="5" cy="5" r="3" fill="#27ae60"/>
        <text x="15" y="10" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Email spam detection</text>
        
        <circle cx="5" cy="25" r="3" fill="#27ae60"/>
        <text x="15" y="30" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">News content filtering</text>
        
        <circle cx="5" cy="45" r="3" fill="#27ae60"/>
        <text x="15" y="50" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Advertising placement</text>
        
        <circle cx="5" cy="65" r="3" fill="#27ae60"/>
        <text x="15" y="70" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Product recommendations</text>
      </g>
      
      <text x="110" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d" font-style="italic">
        False positives are annoying
      </text>
      <text x="110" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d" font-style="italic">
        but not dangerous
      </text>
    </g>
    
    <!-- Balanced scenarios -->
    <g transform="translate(280, 50)">
      <rect x="0" y="0" width="220" height="150" fill="#fef9e6" stroke="#d68910" stroke-width="2" rx="8"/>
      
      <text x="110" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#d68910">
        Choose Balanced
      </text>
      <text x="110" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
        (Optimize F1)
      </text>
      
      <g transform="translate(15, 60)">
        <circle cx="5" cy="5" r="3" fill="#d68910"/>
        <text x="15" y="10" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Credit scoring</text>
        
        <circle cx="5" cy="25" r="3" fill="#d68910"/>
        <text x="15" y="30" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Customer churn prediction</text>
        
        <circle cx="5" cy="45" r="3" fill="#d68910"/>
        <text x="15" y="50" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Quality control</text>
        
        <circle cx="5" cy="65" r="3" fill="#d68910"/>
        <text x="15" y="70" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">A/B test analysis</text>
      </g>
      
      <text x="110" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d" font-style="italic">
        Both error types have
      </text>
      <text x="110" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d" font-style="italic">
        similar business impact
      </text>
    </g>
    
    <!-- Aggressive scenarios -->
    <g transform="translate(560, 50)">
      <rect x="0" y="0" width="220" height="165" fill="#fdeaea" stroke="#c0392b" stroke-width="2" rx="8"/>
      
      <text x="110" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#c0392b">
        Choose Aggressive
      </text>
      <text x="110" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
        (High Recall)
      </text>
      
      <g transform="translate(15, 60)">
        <circle cx="5" cy="5" r="3" fill="#c0392b"/>
        <text x="15" y="10" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Disease screening</text>
        
        <circle cx="5" cy="25" r="3" fill="#c0392b"/>
        <text x="15" y="30" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Security threat detection</text>
        
        <circle cx="5" cy="45" r="3" fill="#c0392b"/>
        <text x="15" y="50" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Financial fraud</text>
        
        <circle cx="5" cy="65" r="3" fill="#c0392b"/>
        <text x="15" y="70" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Safety system alerts</text>
      </g>
      
      <text x="110" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d" font-style="italic">
        Missing positives can be
      </text>
      <text x="110" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d" font-style="italic">
        dangerous or costly
      </text>
    </g>
  </g>

  <!-- Decision framework -->
  <g transform="translate(100, 520)">
    <rect x="0" y="0" width="600" height="60" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2" rx="10"/>
    
    <text x="300" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">
      🎯 Decision Framework
    </text>
    <text x="300" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#7f8c8d">
      Consider the relative cost of false positives vs. false negatives in your specific domain
    </text>
  </g>
</svg>