<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pcaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:0.2" />
    </linearGradient>
    <linearGradient id="tsneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:0.2" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="600" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1e293b">
    PCA vs t-SNE: MNIST Digits Visualization Comparison
  </text>
  
  <!-- PCA Results -->
  <g transform="translate(80,80)">
    <rect x="0" y="0" width="380" height="380" rx="10" fill="url(#pcaGrad)" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
    
    <!-- PCA Title -->
    <text x="190" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#dc2626">
      PCA Projection (Linear)
    </text>
    <text x="190" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7f1d1d">
      Time: 0.01 seconds
    </text>
    
    <!-- PCA scatter plot - one big blob -->
    <g transform="translate(40,60)">
      <!-- Main blob of mixed points -->
      <ellipse cx="150" cy="150" rx="120" ry="80" fill="#fca5a5" opacity="0.3" stroke="#dc2626" stroke-width="1" stroke-dasharray="5,5"/>
      
      <!-- Mixed digit points in blob -->
      <!-- 0s (blue) -->
      <circle cx="130" cy="140" r="3" fill="#3b82f6"/>
      <circle cx="135" cy="145" r="3" fill="#3b82f6"/>
      <circle cx="125" cy="150" r="3" fill="#3b82f6"/>
      <circle cx="140" cy="135" r="3" fill="#3b82f6"/>
      
      <!-- 1s (yellow) spread along PC1 -->
      <circle cx="80" cy="160" r="3" fill="#eab308"/>
      <circle cx="70" cy="155" r="3" fill="#eab308"/>
      <circle cx="90" cy="165" r="3" fill="#eab308"/>
      <circle cx="220" cy="140" r="3" fill="#eab308"/>
      <circle cx="230" cy="145" r="3" fill="#eab308"/>
      
      <!-- 2s (green) -->
      <circle cx="160" cy="130" r="3" fill="#10b981"/>
      <circle cx="155" cy="135" r="3" fill="#10b981"/>
      <circle cx="165" cy="125" r="3" fill="#10b981"/>
      <circle cx="170" cy="140" r="3" fill="#10b981"/>
      
      <!-- 3s (purple) -->
      <circle cx="145" cy="160" r="3" fill="#8b5cf6"/>
      <circle cx="150" cy="165" r="3" fill="#8b5cf6"/>
      <circle cx="140" cy="170" r="3" fill="#8b5cf6"/>
      <circle cx="155" cy="155" r="3" fill="#8b5cf6"/>
      
      <!-- 4s (orange) -->
      <circle cx="120" cy="135" r="3" fill="#f97316"/>
      <circle cx="125" cy="140" r="3" fill="#f97316"/>
      <circle cx="115" cy="145" r="3" fill="#f97316"/>
      <circle cx="130" cy="130" r="3" fill="#f97316"/>
      
      <!-- 5s (pink) -->
      <circle cx="175" cy="155" r="3" fill="#ec4899"/>
      <circle cx="180" cy="160" r="3" fill="#ec4899"/>
      <circle cx="170" cy="165" r="3" fill="#ec4899"/>
      <circle cx="185" cy="150" r="3" fill="#ec4899"/>
    </g>
    
    <!-- Axes -->
    <path d="M 50 320 L 350 320" stroke="#7f1d1d" stroke-width="2"/>
    <path d="M 50 320 L 50 70" stroke="#7f1d1d" stroke-width="2"/>
    
    <!-- Axis labels -->
    <text x="350" y="340" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#7f1d1d">
      First Principal Component
    </text>
    <text x="30" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7f1d1d" transform="rotate(-90,30,75)">
      Second Principal Component
    </text>
    
    <!-- Problem annotation -->
    <text x="190" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#991b1b" font-style="italic">
      Problem: All digits crowded into one blob
    </text>
  </g>
  
  <!-- t-SNE Results -->
  <g transform="translate(540,80)">
    <rect x="0" y="0" width="380" height="380" rx="10" fill="url(#tsneGrad)" stroke="#047857" stroke-width="2" filter="url(#shadow)"/>
    
    <!-- t-SNE Title -->
    <text x="190" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#047857">
      t-SNE Embedding (Non-linear)
    </text>
    <text x="190" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#065f46">
      Time: 5.7 seconds
    </text>
    
    <!-- t-SNE scatter plot - well-separated clusters -->
    <g transform="translate(40,60)">
      <!-- Cluster 0 (top-left) -->
      <ellipse cx="80" cy="80" rx="25" ry="20" fill="#bfdbfe" opacity="0.5" stroke="#3b82f6" stroke-width="1" stroke-dasharray="3,3"/>
      <circle cx="75" cy="75" r="3" fill="#3b82f6"/>
      <circle cx="85" cy="80" r="3" fill="#3b82f6"/>
      <circle cx="80" cy="85" r="3" fill="#3b82f6"/>
      <circle cx="82" cy="72" r="3" fill="#3b82f6"/>
      <text x="80" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e40af" font-weight="bold">0</text>
      
      <!-- Cluster 1 (center-left) -->
      <ellipse cx="60" cy="150" rx="22" ry="25" fill="#fef3c7" opacity="0.5" stroke="#eab308" stroke-width="1" stroke-dasharray="3,3"/>
      <circle cx="55" cy="145" r="3" fill="#eab308"/>
      <circle cx="65" cy="150" r="3" fill="#eab308"/>
      <circle cx="60" cy="155" r="3" fill="#eab308"/>
      <circle cx="62" cy="140" r="3" fill="#eab308"/>
      <text x="60" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#a16207" font-weight="bold">1</text>
      
      <!-- Cluster 2 (bottom-left) -->
      <ellipse cx="100" cy="220" rx="28" ry="22" fill="#dcfce7" opacity="0.5" stroke="#10b981" stroke-width="1" stroke-dasharray="3,3"/>
      <circle cx="95" cy="215" r="3" fill="#10b981"/>
      <circle cx="105" cy="220" r="3" fill="#10b981"/>
      <circle cx="100" cy="225" r="3" fill="#10b981"/>
      <circle cx="102" cy="210" r="3" fill="#10b981"/>
      <text x="100" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#047857" font-weight="bold">2</text>
      
      <!-- Cluster 3 (center) -->
      <ellipse cx="180" cy="130" rx="25" ry="28" fill="#ede9fe" opacity="0.5" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="3,3"/>
      <circle cx="175" cy="125" r="3" fill="#8b5cf6"/>
      <circle cx="185" cy="130" r="3" fill="#8b5cf6"/>
      <circle cx="180" cy="135" r="3" fill="#8b5cf6"/>
      <circle cx="182" cy="120" r="3" fill="#8b5cf6"/>
      <text x="180" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6d28d9" font-weight="bold">3</text>
      
      <!-- Cluster 4 (top-right) -->
      <ellipse cx="240" cy="90" rx="24" ry="26" fill="#fed7aa" opacity="0.5" stroke="#f97316" stroke-width="1" stroke-dasharray="3,3"/>
      <circle cx="235" cy="85" r="3" fill="#f97316"/>
      <circle cx="245" cy="90" r="3" fill="#f97316"/>
      <circle cx="240" cy="95" r="3" fill="#f97316"/>
      <circle cx="242" cy="82" r="3" fill="#f97316"/>
      <text x="240" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#c2410c" font-weight="bold">4</text>
      
      <!-- Cluster 5 (bottom-right) -->
      <ellipse cx="260" cy="200" rx="26" ry="23" fill="#fce7f3" opacity="0.5" stroke="#ec4899" stroke-width="1" stroke-dasharray="3,3"/>
      <circle cx="255" cy="195" r="3" fill="#ec4899"/>
      <circle cx="265" cy="200" r="3" fill="#ec4899"/>
      <circle cx="260" cy="205" r="3" fill="#ec4899"/>
      <circle cx="262" cy="192" r="3" fill="#ec4899"/>
      <text x="260" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#be185d" font-weight="bold">5</text>
    </g>
    
    <!-- Axes -->
    <path d="M 50 320 L 350 320" stroke="#065f46" stroke-width="2"/>
    <path d="M 50 320 L 50 70" stroke="#065f46" stroke-width="2"/>
    
    <!-- Axis labels -->
    <text x="350" y="340" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#065f46">
      t-SNE Dimension 1
    </text>
    <text x="30" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#065f46" transform="rotate(-90,30,75)">
      t-SNE Dimension 2
    </text>
    
    <!-- Success annotation -->
    <text x="190" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#047857" font-style="italic">
      Success: Clear digit cluster separation
    </text>
  </g>
  
  <!-- Comparison table -->
  <g transform="translate(150,500)">
    <rect x="0" y="0" width="700" height="80" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1" filter="url(#shadow)"/>
    
    <text x="350" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#374151">
      Method Comparison
    </text>
    
    <!-- Table headers -->
    <text x="50" y="40" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#374151">Method</text>
    <text x="150" y="40" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#374151">Speed</text>
    <text x="250" y="40" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#374151">Cluster Quality</text>
    <text x="400" y="40" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#374151">Deterministic</text>
    <text x="550" y="40" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#374151">Best Use Case</text>
    
    <!-- PCA row -->
    <text x="50" y="55" font-family="Arial, sans-serif" font-size="11" fill="#dc2626">PCA</text>
    <text x="150" y="55" font-family="Arial, sans-serif" font-size="11" fill="#10b981">Very Fast ✓</text>
    <text x="250" y="55" font-family="Arial, sans-serif" font-size="11" fill="#ef4444">Poor ✗</text>
    <text x="400" y="55" font-family="Arial, sans-serif" font-size="11" fill="#10b981">Yes ✓</text>
    <text x="550" y="55" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">Quick exploration</text>
    
    <!-- t-SNE row -->
    <text x="50" y="70" font-family="Arial, sans-serif" font-size="11" fill="#047857">t-SNE</text>
    <text x="150" y="70" font-family="Arial, sans-serif" font-size="11" fill="#ef4444">Slow ✗</text>
    <text x="250" y="70" font-family="Arial, sans-serif" font-size="11" fill="#10b981">Excellent ✓</text>
    <text x="400" y="70" font-family="Arial, sans-serif" font-size="11" fill="#ef4444">No ✗</text>
    <text x="550" y="70" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">Cluster discovery</text>
  </g>
</svg>