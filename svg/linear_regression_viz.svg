<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .axis { stroke: #333; stroke-width: 2; }
      .grid { stroke: #ddd; stroke-width: 0.5; }
      .point { fill: #4285f4; stroke: #1a73e8; stroke-width: 1; }
      .regression-line { stroke: #ea4335; stroke-width: 3; fill: none; }
      .residual { stroke: #ff9800; stroke-width: 1; stroke-dasharray: 3,3; }
      .title { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #333; }
      .label { font-family: Arial, sans-serif; font-size: 14px; fill: #333; }
      .equation { font-family: Arial, sans-serif; font-size: 12px; fill: #333; }
      .legend { font-family: Arial, sans-serif; font-size: 11px; fill: #333; }
    </style>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title">Linear Regression: Best Fit Line</text>
  
  <!-- Grid lines -->
  <g class="grid">
    <line x1="80" y1="80" x2="80" y2="420" />
    <line x1="80" y1="420" x2="720" y2="420" />
    <!-- Vertical grid lines -->
    <line x1="160" y1="80" x2="160" y2="420" />
    <line x1="240" y1="80" x2="240" y2="420" />
    <line x1="320" y1="80" x2="320" y2="420" />
    <line x1="400" y1="80" x2="400" y2="420" />
    <line x1="480" y1="80" x2="480" y2="420" />
    <line x1="560" y1="80" x2="560" y2="420" />
    <line x1="640" y1="80" x2="640" y2="420" />
    <!-- Horizontal grid lines -->
    <line x1="80" y1="120" x2="720" y2="120" />
    <line x1="80" y1="160" x2="720" y2="160" />
    <line x1="80" y1="200" x2="720" y2="200" />
    <line x1="80" y1="240" x2="720" y2="240" />
    <line x1="80" y1="280" x2="720" y2="280" />
    <line x1="80" y1="320" x2="720" y2="320" />
    <line x1="80" y1="360" x2="720" y2="360" />
  </g>
  
  <!-- Axes -->
  <g class="axis">
    <line x1="80" y1="420" x2="720" y2="420" />
    <line x1="80" y1="80" x2="80" y2="420" />
    <!-- Arrow heads -->
    <polygon points="720,420 710,415 710,425" fill="#333" />
    <polygon points="80,80 75,90 85,90" fill="#333" />
  </g>
  
  <!-- Axis labels -->
  <text x="400" y="450" text-anchor="middle" class="label">House Size (sq ft)</text>
  <text x="40" y="250" text-anchor="middle" class="label" transform="rotate(-90 40 250)">Price ($1000s)</text>
  
  <!-- Tick marks and values -->
  <g class="label">
    <text x="160" y="435" text-anchor="middle">500</text>
    <text x="240" y="435" text-anchor="middle">1000</text>
    <text x="320" y="435" text-anchor="middle">1500</text>
    <text x="400" y="435" text-anchor="middle">2000</text>
    <text x="480" y="435" text-anchor="middle">2500</text>
    <text x="560" y="435" text-anchor="middle">3000</text>
    <text x="640" y="435" text-anchor="middle">3500</text>
    
    <text x="70" y="425" text-anchor="end">0</text>
    <text x="70" y="365" text-anchor="end">100</text>
    <text x="70" y="305" text-anchor="end">200</text>
    <text x="70" y="245" text-anchor="end">300</text>
    <text x="70" y="185" text-anchor="end">400</text>
    <text x="70" y="125" text-anchor="end">500</text>
  </g>
  
  <!-- Data points -->
  <circle cx="180" cy="380" r="4" class="point" />
  <circle cx="220" cy="350" r="4" class="point" />
  <circle cx="280" cy="320" r="4" class="point" />
  <circle cx="340" cy="290" r="4" class="point" />
  <circle cx="380" cy="260" r="4" class="point" />
  <circle cx="420" cy="240" r="4" class="point" />
  <circle cx="480" cy="200" r="4" class="point" />
  <circle cx="540" cy="180" r="4" class="point" />
  <circle cx="580" cy="150" r="4" class="point" />
  <circle cx="620" cy="130" r="4" class="point" />
  
  <!-- Best fit line -->
  <line x1="120" y1="400" x2="680" y2="100" class="regression-line" />
  
  <!-- Residual lines (showing error) -->
  <line x1="180" y1="380" x2="180" y2="360" class="residual" />
  <line x1="220" y1="350" x2="220" y2="340" class="residual" />
  <line x1="280" y1="320" x2="280" y2="300" class="residual" />
  <line x1="340" y1="290" x2="340" y2="260" class="residual" />
  <line x1="420" y1="240" x2="420" y2="220" class="residual" />
  <line x1="540" y1="180" x2="540" y2="160" class="residual" />
  
  <!-- Equation -->
  <rect x="520" y="280" width="160" height="70" fill="white" stroke="#ccc" stroke-width="1" rx="5" />
  <text x="600" y="300" text-anchor="middle" class="equation" font-weight="bold">Linear Model</text>
  <text x="600" y="315" text-anchor="middle" class="equation">Y = θ₀ + θ₁X + W</text>
  <text x="530" y="330" class="equation">Y: House Price</text>
  <text x="530" y="345" class="equation">X: House Size</text>
  
  <!-- Legend -->
  <g transform="translate(80, 90)">
    <rect x="0" y="0" width="170" height="75" fill="white" stroke="#ccc" stroke-width="1" rx="3" />
    <circle cx="15" cy="15" r="3" class="point" />
    <text x="25" y="20" class="legend">Data Points</text>
    <line x1="10" y1="30" x2="25" y2="30" class="regression-line" />
    <text x="30" y="35" class="legend">Best Fit Line</text>
    <line x1="10" y1="45" x2="25" y2="45" class="residual" />
    <text x="30" y="50" class="legend">Residuals</text>
  </g>
</svg>