<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cluster1Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3498DB;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#2980B9;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="cluster2Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E74C3C;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#C0392B;stop-opacity:0.8" />
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#2C3E50">
    User Clustering Based on Preferences
  </text>

  <!-- Main Clustering Visualization -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="350" height="250" fill="#F8F9FA" stroke="#D5DBDB" stroke-width="2" rx="5" />
    
    <!-- Cluster 1: Chick Flick Fans -->
    <g transform="translate(80, 50)">
      <!-- Cluster background -->
      <ellipse cx="0" cy="30" rx="100" ry="70" fill="url(#cluster1Grad)" opacity="0.3" />
      
      <!-- User points -->
      <circle cx="-40" cy="20" r="8" fill="#2980B9" />
      <text x="-40" y="20" text-anchor="middle" fill="white" font-size="8">F1</text>
      
      <circle cx="-20" cy="40" r="8" fill="#2980B9" />
      <text x="-20" y="40" text-anchor="middle" fill="white" font-size="8">F2</text>
      
      <circle cx="10" cy="25" r="8" fill="#2980B9" />
      <text x="10" y="25" text-anchor="middle" fill="white" font-size="8">F3</text>
      
      <circle cx="-30" cy="55" r="8" fill="#2980B9" />
      <text x="-30" y="55" text-anchor="middle" fill="white" font-size="8">F4</text>
      
      <circle cx="30" cy="45" r="8" fill="#2980B9" />
      <text x="30" y="45" text-anchor="middle" fill="white" font-size="8">F5</text>
      
      <circle cx="-5" cy="10" r="8" fill="#2980B9" />
      <text x="-5" y="10" text-anchor="middle" fill="white" font-size="8">F6</text>
      
      <circle cx="20" cy="15" r="8" fill="#2980B9" />
      <text x="20" y="15" text-anchor="middle" fill="white" font-size="8">F7</text>
      
      <circle cx="-45" cy="40" r="8" fill="#2980B9" />
      <text x="-45" y="40" text-anchor="middle" fill="white" font-size="8">F8</text>
      
      <!-- Frank highlighted -->
      <circle cx="0" cy="35" r="10" fill="#2980B9" stroke="#FFC107" stroke-width="3" />
      <text x="0" y="35" text-anchor="middle" fill="white" font-size="9" font-weight="bold">Frank</text>
      
      <!-- Label -->
      <text x="0" y="-35" text-anchor="middle" font-size="14" fill="#2980B9" font-weight="bold">
        Chick Flick Fans
      </text>
    </g>
    
    <!-- Cluster 2: Action Movie Fans -->
    <g transform="translate(250, 120)">
      <!-- Cluster background -->
      <ellipse cx="0" cy="30" rx="100" ry="70" fill="url(#cluster2Grad)" opacity="0.3" />
      
      <!-- User points -->
      <circle cx="-40" cy="20" r="8" fill="#C0392B" />
      <text x="-40" y="20" text-anchor="middle" fill="white" font-size="8">A1</text>
      
      <circle cx="-20" cy="40" r="8" fill="#C0392B" />
      <text x="-20" y="40" text-anchor="middle" fill="white" font-size="8">A2</text>
      
      <circle cx="10" cy="25" r="8" fill="#C0392B" />
      <text x="10" y="25" text-anchor="middle" fill="white" font-size="8">A3</text>
      
      <circle cx="-30" cy="55" r="8" fill="#C0392B" />
      <text x="-30" y="55" text-anchor="middle" fill="white" font-size="8">A4</text>
      
      <circle cx="30" cy="45" r="8" fill="#C0392B" />
      <text x="30" y="45" text-anchor="middle" fill="white" font-size="8">A5</text>
      
      <circle cx="-5" cy="10" r="8" fill="#C0392B" />
      <text x="-5" y="10" text-anchor="middle" fill="white" font-size="8">A6</text>
      
      <circle cx="20" cy="15" r="8" fill="#C0392B" />
      <text x="20" y="15" text-anchor="middle" fill="white" font-size="8">A7</text>
      
      <circle cx="-45" cy="40" r="8" fill="#C0392B" />
      <text x="-45" y="40" text-anchor="middle" fill="white" font-size="8">A8</text>
      
      <!-- Me highlighted -->
      <circle cx="0" cy="35" r="10" fill="#C0392B" stroke="#FFC107" stroke-width="3" />
      <text x="0" y="35" text-anchor="middle" fill="white" font-size="9" font-weight="bold">Me</text>
      
      <!-- Label -->
      <text x="0" y="105" text-anchor="middle" font-size="14" fill="#C0392B" font-weight="bold">
        Action Movie Fans
      </text>
    </g>
    
    <!-- Axes labels -->
    <text x="175" y="245" text-anchor="middle" font-size="12" fill="#7F8C8D">
      User Preference Space (17,000 dimensions → 2D)
    </text>
  </g>

  <!-- Histogram of Inner Products -->
  <g transform="translate(420, 80)">
    <rect x="0" y="0" width="330" height="250" fill="#F8F9FA" stroke="#D5DBDB" stroke-width="2" rx="5" />
    <text x="165" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C3E50">
      Inner Product Distribution
    </text>
    
    <!-- Histogram bars -->
    <g transform="translate(30, 200)">
      <!-- X-axis -->
      <line x1="0" y1="0" x2="270" y2="0" stroke="#34495E" stroke-width="2" />
      <!-- Y-axis -->
      <line x1="0" y1="0" x2="0" y2="-150" stroke="#34495E" stroke-width="2" />
      
      <!-- Low similarity bars (different user types) -->
      <rect x="10" y="-20" width="15" height="20" fill="#95A5A6" opacity="0.7" />
      <rect x="25" y="-35" width="15" height="35" fill="#95A5A6" opacity="0.7" />
      <rect x="40" y="-50" width="15" height="50" fill="#95A5A6" opacity="0.7" />
      <rect x="55" y="-65" width="15" height="65" fill="#95A5A6" opacity="0.7" />
      <rect x="70" y="-75" width="15" height="75" fill="#95A5A6" opacity="0.7" />
      <rect x="85" y="-60" width="15" height="60" fill="#95A5A6" opacity="0.7" />
      <rect x="100" y="-45" width="15" height="45" fill="#95A5A6" opacity="0.7" />
      <rect x="115" y="-30" width="15" height="30" fill="#95A5A6" opacity="0.7" />
      <rect x="130" y="-20" width="15" height="20" fill="#95A5A6" opacity="0.7" />
      
      <!-- Gap in middle -->
      <rect x="145" y="-10" width="15" height="10" fill="#95A5A6" opacity="0.7" />
      <rect x="160" y="-5" width="15" height="5" fill="#95A5A6" opacity="0.7" />
      
      <!-- High similarity bars (same user types) -->
      <rect x="175" y="-15" width="15" height="15" fill="#27AE60" opacity="0.7" />
      <rect x="190" y="-25" width="15" height="25" fill="#27AE60" opacity="0.7" />
      <rect x="205" y="-40" width="15" height="40" fill="#27AE60" opacity="0.7" />
      <rect x="220" y="-70" width="15" height="70" fill="#27AE60" opacity="0.7" />
      <rect x="235" y="-80" width="15" height="80" fill="#27AE60" opacity="0.7" />
      <rect x="250" y="-50" width="15" height="50" fill="#27AE60" opacity="0.7" />
      
      <!-- Labels -->
      <text x="65" y="20" text-anchor="middle" font-size="10" fill="#7F8C8D">~42</text>
      <text x="235" y="20" text-anchor="middle" font-size="10" fill="#7F8C8D">~101</text>
      <text x="135" y="35" text-anchor="middle" font-size="11" fill="#34495E">Inner Product Value</text>
      
      <!-- Annotations -->
      <text x="65" y="-85" text-anchor="middle" font-size="10" fill="#95A5A6" font-weight="bold">Different</text>
      <text x="65" y="-95" text-anchor="middle" font-size="10" fill="#95A5A6" font-weight="bold">User Types</text>
      
      <text x="235" y="-90" text-anchor="middle" font-size="10" fill="#27AE60" font-weight="bold">Same</text>
      <text x="235" y="-100" text-anchor="middle" font-size="10" fill="#27AE60" font-weight="bold">User Type</text>
    </g>
  </g>

  <!-- Overlap Scenario -->
  <g transform="translate(100, 360)">
    <text x="0" y="0" font-size="16" font-weight="bold" fill="#2C3E50">Real-World Scenario: Overlapping Clusters</text>
    
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="600" height="150" fill="#F8F9FA" stroke="#D5DBDB" stroke-width="1" rx="5" />
      
      <!-- Overlapping clusters -->
      <ellipse cx="200" cy="75" rx="120" ry="60" fill="#3498DB" opacity="0.2" />
      <ellipse cx="320" cy="75" rx="120" ry="60" fill="#E74C3C" opacity="0.2" />
      
      <!-- Overlap area -->
      <ellipse cx="260" cy="75" rx="60" ry="50" fill="#9B59B6" opacity="0.3" />
      
      <!-- Sample users -->
      <!-- Blue cluster users -->
      <circle cx="150" cy="60" r="5" fill="#2980B9" />
      <circle cx="170" cy="80" r="5" fill="#2980B9" />
      <circle cx="140" cy="90" r="5" fill="#2980B9" />
      <circle cx="180" cy="50" r="5" fill="#2980B9" />
      <circle cx="160" cy="70" r="5" fill="#2980B9" />
      
      <!-- Red cluster users -->
      <circle cx="370" cy="60" r="5" fill="#C0392B" />
      <circle cx="350" cy="80" r="5" fill="#C0392B" />
      <circle cx="380" cy="90" r="5" fill="#C0392B" />
      <circle cx="340" cy="50" r="5" fill="#C0392B" />
      <circle cx="360" cy="70" r="5" fill="#C0392B" />
      
      <!-- Mixed preference users (gray sheep) -->
      <circle cx="260" cy="75" r="5" fill="#9B59B6" />
      <circle cx="250" cy="60" r="5" fill="#9B59B6" />
      <circle cx="270" cy="85" r="5" fill="#9B59B6" />
      <circle cx="240" cy="80" r="5" fill="#9B59B6" />
      <circle cx="280" cy="70" r="5" fill="#9B59B6" />
      
      <!-- Labels -->
      <text x="150" y="120" text-anchor="middle" font-size="12" fill="#2980B9">Primarily Chick Flicks</text>
      <text x="370" y="120" text-anchor="middle" font-size="12" fill="#C0392B">Primarily Action</text>
      <text x="260" y="120" text-anchor="middle" font-size="12" fill="#9B59B6">Mixed Preferences</text>
      
      <!-- Note -->
      <text x="450" y="40" font-size="11" fill="#7F8C8D">Netflix: ~15 user types</text>
      <text x="450" y="55" font-size="11" fill="#7F8C8D">Complex overlaps</text>
      <text x="450" y="70" font-size="11" fill="#7F8C8D">Gray sheep users</text>
    </g>
  </g>

  <!-- Key Insights -->
  <g transform="translate(100, 540)">
    <rect x="0" y="0" width="600" height="40" rx="5" fill="#ECF0F1" stroke="#BDC3C7" />
    <text x="10" y="25" font-size="12" fill="#2C3E50" font-weight="bold">Key Insight:</text>
    <text x="90" y="25" font-size="11" fill="#34495E">
      Users naturally cluster based on preferences, enabling personalized recommendations for each group
    </text>
  </g>
</svg>