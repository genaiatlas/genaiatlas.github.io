<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="supervised" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="unsupervised" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="reinforcement" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="700" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#1e293b">
    Machine Learning Types &amp; Applications
  </text>
  
  <!-- Supervised Learning Section -->
  <rect x="50" y="80" width="280" height="550" rx="20" fill="url(#supervised)" stroke="#1e40af" stroke-width="3" filter="url(#shadow)"/>
  <text x="190" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white">
    SUPERVISED LEARNING
  </text>
  <text x="190" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">
    Learning with labeled examples
  </text>
  
  <!-- Classification -->
  <rect x="70" y="160" width="240" height="160" rx="10" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
  <text x="190" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
    CLASSIFICATION
  </text>
  <text x="190" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="white">
    Predicting Categories
  </text>
  
  <text x="90" y="230" font-family="Arial, sans-serif" font-size="12" fill="white">• Email Spam Detection</text>
  <text x="90" y="250" font-family="Arial, sans-serif" font-size="12" fill="white">• Image Recognition</text>
  <text x="90" y="270" font-family="Arial, sans-serif" font-size="12" fill="white">• Medical Diagnosis</text>
  <text x="90" y="290" font-family="Arial, sans-serif" font-size="12" fill="white">• Sentiment Analysis</text>
  <text x="90" y="310" font-family="Arial, sans-serif" font-size="12" fill="white">• Fraud Detection</text>
  
  <!-- Regression -->
  <rect x="70" y="340" width="240" height="160" rx="10" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
  <text x="190" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
    REGRESSION
  </text>
  <text x="190" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="white">
    Predicting Numbers
  </text>
  
  <text x="90" y="410" font-family="Arial, sans-serif" font-size="12" fill="white">• House Price Prediction</text>
  <text x="90" y="430" font-family="Arial, sans-serif" font-size="12" fill="white">• Sales Forecasting</text>
  <text x="90" y="450" font-family="Arial, sans-serif" font-size="12" fill="white">• Stock Market Analysis</text>
  <text x="90" y="470" font-family="Arial, sans-serif" font-size="12" fill="white">• Customer Lifetime Value</text>
  <text x="90" y="490" font-family="Arial, sans-serif" font-size="12" fill="white">• Demand Planning</text>
  
  <!-- Common Algorithms -->
  <text x="190" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Common Algorithms:
  </text>
  <text x="190" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Random Forest • XGBoost • Neural Networks
  </text>
  <text x="190" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Logistic Regression • Support Vector Machines
  </text>
  
  <!-- Unsupervised Learning Section -->
  <rect x="360" y="80" width="280" height="550" rx="20" fill="url(#unsupervised)" stroke="#047857" stroke-width="3" filter="url(#shadow)"/>
  <text x="500" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white">
    UNSUPERVISED LEARNING
  </text>
  <text x="500" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">
    Finding hidden patterns
  </text>
  
  <!-- Clustering -->
  <rect x="380" y="160" width="240" height="160" rx="10" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
  <text x="500" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
    CLUSTERING
  </text>
  <text x="500" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="white">
    Grouping Similar Data
  </text>
  
  <text x="400" y="230" font-family="Arial, sans-serif" font-size="12" fill="white">• Customer Segmentation</text>
  <text x="400" y="250" font-family="Arial, sans-serif" font-size="12" fill="white">• Market Research</text>
  <text x="400" y="270" font-family="Arial, sans-serif" font-size="12" fill="white">• Gene Sequencing</text>
  <text x="400" y="290" font-family="Arial, sans-serif" font-size="12" fill="white">• Social Network Analysis</text>
  <text x="400" y="310" font-family="Arial, sans-serif" font-size="12" fill="white">• Anomaly Detection</text>
  
  <!-- Dimensionality Reduction -->
  <rect x="380" y="340" width="240" height="160" rx="10" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
  <text x="500" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
    DIMENSIONALITY REDUCTION
  </text>
  <text x="500" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="white">
    Simplifying Complex Data
  </text>
  
  <text x="400" y="410" font-family="Arial, sans-serif" font-size="12" fill="white">• Data Visualization</text>
  <text x="400" y="430" font-family="Arial, sans-serif" font-size="12" fill="white">• Feature Selection</text>
  <text x="400" y="450" font-family="Arial, sans-serif" font-size="12" fill="white">• Noise Reduction</text>
  <text x="400" y="470" font-family="Arial, sans-serif" font-size="12" fill="white">• Compression</text>
  <text x="400" y="490" font-family="Arial, sans-serif" font-size="12" fill="white">• Preprocessing</text>
  
  <!-- Common Algorithms -->
  <text x="500" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Common Algorithms:
  </text>
  <text x="500" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    K-Means • DBSCAN • Hierarchical
  </text>
  <text x="500" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    PCA • t-SNE • Association Rules
  </text>
  
  <!-- Reinforcement Learning Section -->
  <rect x="670" y="80" width="280" height="550" rx="20" fill="url(#reinforcement)" stroke="#d97706" stroke-width="3" filter="url(#shadow)"/>
  <text x="810" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white">
    REINFORCEMENT LEARNING
  </text>
  <text x="810" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">
    Learning through trial &amp; error
  </text>
  
  <!-- Game Playing -->
  <rect x="690" y="160" width="240" height="160" rx="10" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
  <text x="810" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
    AUTONOMOUS SYSTEMS
  </text>
  <text x="810" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="white">
    Decision Making Agents
  </text>
  
  <text x="710" y="230" font-family="Arial, sans-serif" font-size="12" fill="white">• Game Playing (Chess, Go)</text>
  <text x="710" y="250" font-family="Arial, sans-serif" font-size="12" fill="white">• Autonomous Vehicles</text>
  <text x="710" y="270" font-family="Arial, sans-serif" font-size="12" fill="white">• Robotics Control</text>
  <text x="710" y="290" font-family="Arial, sans-serif" font-size="12" fill="white">• Trading Algorithms</text>
  <text x="710" y="310" font-family="Arial, sans-serif" font-size="12" fill="white">• Resource Allocation</text>
  
  <!-- Optimization -->
  <rect x="690" y="340" width="240" height="160" rx="10" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
  <text x="810" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
    OPTIMIZATION
  </text>
  <text x="810" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="white">
    Maximizing Rewards
  </text>
  
  <text x="710" y="410" font-family="Arial, sans-serif" font-size="12" fill="white">• Dynamic Pricing</text>
  <text x="710" y="430" font-family="Arial, sans-serif" font-size="12" fill="white">• Recommendation Tuning</text>
  <text x="710" y="450" font-family="Arial, sans-serif" font-size="12" fill="white">• A/B Testing</text>
  <text x="710" y="470" font-family="Arial, sans-serif" font-size="12" fill="white">• Supply Chain</text>
  <text x="710" y="490" font-family="Arial, sans-serif" font-size="12" fill="white">• Energy Management</text>
  
  <!-- Common Algorithms -->
  <text x="810" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Common Algorithms:
  </text>
  <text x="810" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Q-Learning • Deep Q-Networks
  </text>
  <text x="810" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Policy Gradient • Actor-Critic
  </text>
  
  <!-- Key Differences Summary -->
  <rect x="50" y="650" width="900" height="40" rx="10" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1"/>
  <text x="500" y="668" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#374151">
    Key Differences
  </text>
  <text x="500" y="685" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">
    Supervised: Learns from examples with known answers • Unsupervised: Discovers patterns without labels • Reinforcement: Learns through rewards and punishments
  </text>
</svg>