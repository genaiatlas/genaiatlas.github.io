<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .node-text { font-family: 'Arial', sans-serif; font-size: 14px; text-anchor: middle; }
      .leaf-text { font-family: 'Arial', sans-serif; font-size: 12px; text-anchor: middle; fill: #2c3e50; }
      .equation-text { font-family: 'Arial', sans-serif; font-size: 16px; text-anchor: middle; fill: #2c3e50; }
      .title-text { font-family: 'Arial', sans-serif; font-size: 18px; font-weight: bold; text-anchor: middle; fill: #34495e; }
      .label-text { font-family: 'Arial', sans-serif; font-size: 12px; text-anchor: middle; fill: #7f8c8d; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" class="title-text">Regression Tree Structure and Space Partitioning</text>
  
  <!-- Tree Structure (Left Side) -->
  <text x="200" y="60" class="label-text">Decision Tree</text>
  
  <!-- Root Node -->
  <rect x="150" y="80" width="100" height="40" rx="5" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="200" y="105" class="node-text" fill="white">College &lt; 0.5</text>
  
  <!-- Level 1 Nodes -->
  <rect x="50" y="160" width="80" height="35" rx="5" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="90" y="180" class="node-text" fill="white" font-size="12px">Exper &lt; 14</text>
  
  <rect x="270" y="160" width="80" height="35" rx="5" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="310" y="180" class="node-text" fill="white" font-size="12px">Exper &lt; 9.5</text>
  
  <!-- Leaf Nodes -->
  <circle cx="40" cy="240" r="20" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <text x="40" y="245" class="leaf-text" fill="white">12</text>
  
  <circle cx="120" cy="240" r="20" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <text x="120" y="245" class="leaf-text" fill="white">14</text>
  
  <circle cx="260" cy="240" r="20" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <text x="260" y="245" class="leaf-text" fill="white">17</text>
  
  <circle cx="340" cy="240" r="20" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <text x="340" y="245" class="leaf-text" fill="white">24</text>
  
  <!-- Tree Connections -->
  <line x1="175" y1="120" x2="110" y2="160" stroke="#34495e" stroke-width="2"/>
  <line x1="225" y1="120" x2="290" y2="160" stroke="#34495e" stroke-width="2"/>
  <line x1="70" y1="195" x2="50" y2="220" stroke="#34495e" stroke-width="2"/>
  <line x1="110" y1="195" x2="130" y2="220" stroke="#34495e" stroke-width="2"/>
  <line x1="290" y1="195" x2="270" y2="220" stroke="#34495e" stroke-width="2"/>
  <line x1="330" y1="195" x2="350" y2="220" stroke="#34495e" stroke-width="2"/>
  
  <!-- Labels for branches -->
  <text x="135" y="145" class="label-text" font-size="10px">Yes</text>
  <text x="255" y="145" class="label-text" font-size="10px">No</text>
  <text x="60" y="210" class="label-text" font-size="10px">Yes</text>
  <text x="110" y="210" class="label-text" font-size="10px">No</text>
  <text x="270" y="210" class="label-text" font-size="10px">Yes</text>
  <text x="340" y="210" class="label-text" font-size="10px">No</text>
  
  <!-- Space Partitioning (Right Side) -->
  <text x="600" y="60" class="label-text">Feature Space Partition</text>
  
  <!-- Main Rectangle -->
  <rect x="470" y="80" width="280" height="160" fill="none" stroke="#2c3e50" stroke-width="2"/>
  
  <!-- Vertical split (College) -->
  <line x1="585" y1="80" x2="585" y2="240" stroke="#3498db" stroke-width="3"/>
  <text x="527" y="75" class="label-text">Non-College</text>
  <text x="642" y="75" class="label-text">College</text>
  
  <!-- Horizontal splits - better positioned -->
  <line x1="470" y1="170" x2="585" y2="170" stroke="#e67e22" stroke-width="2"/>
  <line x1="585" y1="150" x2="750" y2="150" stroke="#e67e22" stroke-width="2"/>
  
  <!-- Region Labels - better spacing -->
  <text x="527" y="125" class="leaf-text">Exper ≥ 14</text>
  <text x="527" y="140" class="leaf-text">Wage: $14</text>
  
  <text x="527" y="205" class="leaf-text">Exper &lt; 14</text>
  <text x="527" y="220" class="leaf-text">Wage: $12</text>
  
  <text x="667" y="115" class="leaf-text">Exper ≥ 9.5</text>
  <text x="667" y="130" class="leaf-text">Wage: $24</text>
  
  <text x="667" y="195" class="leaf-text">Exper &lt; 9.5</text>
  <text x="667" y="210" class="leaf-text">Wage: $17</text>
  
  <!-- Axes Labels -->
  <text x="610" y="265" class="label-text">Experience (Years)</text>
  <text x="450" y="170" class="label-text" transform="rotate(-90 450 170)">College Degree</text>
  
  <!-- Mathematical Formula -->
  <text x="400" y="320" class="equation-text">ĝ(Z) = Σ βₘ · 1(Z ∈ Rₘ)</text>
  <text x="400" y="340" class="label-text">where βₘ = average of Yᵢ in region Rₘ</text>
  
  <!-- Legend -->
  <rect x="20" y="320" width="200" height="120" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" rx="5"/>
  <text x="120" y="340" class="label-text" font-weight="bold">Legend</text>
  
  <rect x="30" y="350" width="15" height="15" fill="#3498db"/>
  <text x="55" y="362" class="label-text">Decision Nodes</text>
  
  <circle cx="37" cy="375" r="7" fill="#e74c3c"/>
  <text x="55" y="380" class="label-text">Leaf Nodes (Predictions)</text>
  
  <line x1="30" y1="395" x2="45" y2="395" stroke="#e67e22" stroke-width="2"/>
  <text x="55" y="400" class="label-text">Split Boundaries</text>
  
  <!-- Example Calculation -->
  <text x="400" y="380" class="label-text">Example: College=1, Experience=12 → Region 3 → $17/hour</text>
  
  <!-- Performance Metrics Box -->
  <rect x="450" y="320" width="300" height="80" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" rx="5"/>
  <text x="600" y="340" class="label-text" font-weight="bold">Tree Advantages</text>
  <text x="460" y="360" class="label-text">• Easy to interpret and visualize</text>
  <text x="460" y="375" class="label-text">• Handles non-linear relationships</text>
  <text x="460" y="390" class="label-text">• No assumptions about data distribution</text>
  
</svg>