<svg width="900" height="700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b91c1c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="expGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff7ed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f97316;stop-opacity:0.4" />
    </linearGradient>
    <linearGradient id="trainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#eff6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.4" />
    </linearGradient>
    <linearGradient id="evalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0fdf4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:0.4" />
    </linearGradient>
    <linearGradient id="optGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fdf4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:0.4" />
    </linearGradient>
    <linearGradient id="centerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f1f5f9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cbd5e1;stop-opacity:0.8" />
    </linearGradient>
    <filter id="shadow">
      <dropshadow dx="2" dy="2" stddeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="700" fill="#f8fafc"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="900" height="60" fill="url(#headerGrad)"/>
  <text x="450" y="30" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="22" font-weight="bold" dy="0.35em">Model Development Cycle</text>
  
  <!-- Center circle for iterative process -->
  <circle cx="450" cy="380" r="120" fill="url(#centerGrad)" stroke="#64748b" stroke-width="3" filter="url(#shadow)"/>
  <text x="450" y="360" text-anchor="middle" fill="#1e293b" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Iterative ML</text>
  <text x="450" y="380" text-anchor="middle" fill="#1e293b" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Development</text>
  <text x="450" y="400" text-anchor="middle" fill="#1e293b" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Process</text>
  
  <!-- Experiment Design & Algorithm Selection -->
  <g id="experiment">
    <rect x="50" y="100" width="280" height="140" fill="url(#expGrad)" stroke="#f97316" stroke-width="2" rx="12" filter="url(#shadow)"/>
    <text x="70" y="125" fill="#c2410c" font-family="Arial, sans-serif" font-size="16" font-weight="bold">1. Experiment Design</text>
    <text x="70" y="145" fill="#c2410c" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Algorithm Selection</text>
    
    <!-- Algorithm categories -->
    <rect x="70" y="160" width="100" height="70" fill="rgba(255,255,255,0.7)" stroke="#ea580c" stroke-width="1" rx="5"/>
    <text x="120" y="175" text-anchor="middle" fill="#c2410c" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Supervised</text>
    <text x="120" y="188" text-anchor="middle" fill="#c2410c" font-family="Arial, sans-serif" font-size="9">• Linear/Logistic Reg</text>
    <text x="120" y="200" text-anchor="middle" fill="#c2410c" font-family="Arial, sans-serif" font-size="9">• Tree-based (RF, XGB)</text>
    <text x="120" y="212" text-anchor="middle" fill="#c2410c" font-family="Arial, sans-serif" font-size="9">• Neural Networks</text>
    <text x="120" y="224" text-anchor="middle" fill="#c2410c" font-family="Arial, sans-serif" font-size="9">• SVM, Naive Bayes</text>
    
    <rect x="190" y="160" width="120" height="70" fill="rgba(255,255,255,0.7)" stroke="#ea580c" stroke-width="1" rx="5"/>
    <text x="250" y="175" text-anchor="middle" fill="#c2410c" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Unsupervised</text>
    <text x="250" y="188" text-anchor="middle" fill="#c2410c" font-family="Arial, sans-serif" font-size="9">• K-Means, DBSCAN</text>
    <text x="250" y="200" text-anchor="middle" fill="#c2410c" font-family="Arial, sans-serif" font-size="9">• Hierarchical clustering</text>
    <text x="250" y="212" text-anchor="middle" fill="#c2410c" font-family="Arial, sans-serif" font-size="9">• PCA, t-SNE</text>
    <text x="250" y="224" text-anchor="middle" fill="#c2410c" font-family="Arial, sans-serif" font-size="9">• Association rules</text>
  </g>
  
  <!-- Model Training & Validation -->
  <g id="training">
    <rect x="570" y="100" width="280" height="140" fill="url(#trainGrad)" stroke="#3b82f6" stroke-width="2" rx="12" filter="url(#shadow)"/>
    <text x="590" y="125" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="16" font-weight="bold">2. Training & Validation</text>
    
    <!-- Training strategies -->
    <rect x="590" y="140" width="120" height="90" fill="rgba(255,255,255,0.7)" stroke="#2563eb" stroke-width="1" rx="5"/>
    <text x="650" y="155" text-anchor="middle" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Cross-Validation</text>
    <text x="650" y="170" text-anchor="middle" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="9">K-Fold CV:</text>
    <text x="650" y="182" text-anchor="middle" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="9">Score = (1/k)Σᵢ Scoreᵢ</text>
    <text x="650" y="195" text-anchor="middle" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="9">• Stratified CV</text>
    <text x="650" y="207" text-anchor="middle" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="9">• Time series split</text>
    <text x="650" y="219" text-anchor="middle" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="9">• Group K-Fold</text>
    
    <rect x="720" y="140" width="120" height="90" fill="rgba(255,255,255,0.7)" stroke="#2563eb" stroke-width="1" rx="5"/>
    <text x="780" y="155" text-anchor="middle" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Regularization</text>
    <text x="780" y="170" text-anchor="middle" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="9">L1 (Lasso): λΣ|wᵢ|</text>
    <text x="780" y="182" text-anchor="middle" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="9">L2 (Ridge): λΣwᵢ²</text>
    <text x="780" y="195" text-anchor="middle" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="9">• Elastic Net</text>
    <text x="780" y="207" text-anchor="middle" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="9">• Dropout</text>
    <text x="780" y="219" text-anchor="middle" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="9">• Early stopping</text>
  </g>
  
  <!-- Evaluation & Metrics -->
  <g id="evaluation">
    <rect x="570" y="480" width="280" height="140" fill="url(#evalGrad)" stroke="#22c55e" stroke-width="2" rx="12" filter="url(#shadow)"/>
    <text x="590" y="505" fill="#16a34a" font-family="Arial, sans-serif" font-size="16" font-weight="bold">3. Evaluation & Metrics</text>
    
    <!-- Classification metrics -->
    <rect x="590" y="520" width="120" height="90" fill="rgba(255,255,255,0.7)" stroke="#16a34a" stroke-width="1" rx="5"/>
    <text x="650" y="535" text-anchor="middle" fill="#16a34a" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Classification</text>
    <text x="650" y="550" text-anchor="middle" fill="#16a34a" font-family="Arial, sans-serif" font-size="9">Precision = TP/(TP+FP)</text>
    <text x="650" y="562" text-anchor="middle" fill="#16a34a" font-family="Arial, sans-serif" font-size="9">Recall = TP/(TP+FN)</text>
    <text x="650" y="574" text-anchor="middle" fill="#16a34a" font-family="Arial, sans-serif" font-size="9">F1 = 2×P×R/(P+R)</text>
    <text x="650" y="586" text-anchor="middle" fill="#16a34a" font-family="Arial, sans-serif" font-size="9">• AUC-ROC</text>
    <text x="650" y="598" text-anchor="middle" fill="#16a34a" font-family="Arial, sans-serif" font-size="9">• Confusion Matrix</text>
    
    <!-- Regression metrics -->
    <rect x="720" y="520" width="120" height="90" fill="rgba(255,255,255,0.7)" stroke="#16a34a" stroke-width="1" rx="5"/>
    <text x="780" y="535" text-anchor="middle" fill="#16a34a" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Regression</text>
    <text x="780" y="550" text-anchor="middle" fill="#16a34a" font-family="Arial, sans-serif" font-size="9">RMSE = √(Σ(yᵢ-ŷᵢ)²/n)</text>
    <text x="780" y="562" text-anchor="middle" fill="#16a34a" font-family="Arial, sans-serif" font-size="9">MAE = Σ|yᵢ-ŷᵢ|/n</text>
    <text x="780" y="574" text-anchor="middle" fill="#16a34a" font-family="Arial, sans-serif" font-size="9">R² = 1-SS_res/SS_tot</text>
    <text x="780" y="586" text-anchor="middle" fill="#16a34a" font-family="Arial, sans-serif" font-size="9">• MAPE</text>
    <text x="780" y="598" text-anchor="middle" fill="#16a34a" font-family="Arial, sans-serif" font-size="9">• Residual analysis</text>
  </g>
  
  <!-- Hyperparameter Optimization -->
  <g id="optimization">
    <rect x="50" y="480" width="280" height="140" fill="url(#optGrad)" stroke="#a855f7" stroke-width="2" rx="12" filter="url(#shadow)"/>
    <text x="70" y="505" fill="#7c3aed" font-family="Arial, sans-serif" font-size="16" font-weight="bold">4. Hyperparameter Optimization</text>
    
    <!-- Optimization methods -->
    <rect x="70" y="520" width="120" height="90" fill="rgba(255,255,255,0.7)" stroke="#8b5cf6" stroke-width="1" rx="5"/>
    <text x="130" y="535" text-anchor="middle" fill="#7c3aed" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Search Methods</text>
    <text x="130" y="550" text-anchor="middle" fill="#7c3aed" font-family="Arial, sans-serif" font-size="9">• Grid Search</text>
    <text x="130" y="562" text-anchor="middle" fill="#7c3aed" font-family="Arial, sans-serif" font-size="9">• Random Search</text>
    <text x="130" y="574" text-anchor="middle" fill="#7c3aed" font-family="Arial, sans-serif" font-size="9">• Bayesian Optimization</text>
    <text x="130" y="586" text-anchor="middle" fill="#7c3aed" font-family="Arial, sans-serif" font-size="9">• Evolutionary Algorithms</text>
    <text x="130" y="598" text-anchor="middle" fill="#7c3aed" font-family="Arial, sans-serif" font-size="9">• Optuna/Hyperopt</text>
    
    <rect x="200" y="520" width="120" height="90" fill="rgba(255,255,255,0.7)" stroke="#8b5cf6" stroke-width="1" rx="5"/>
    <text x="260" y="535" text-anchor="middle" fill="#7c3aed" font-family="Arial, sans-serif" font-size="11" font-weight="bold">AutoML</text>
    <text x="260" y="550" text-anchor="middle" fill="#7c3aed" font-family="Arial, sans-serif" font-size="9">• Auto-sklearn</text>
    <text x="260" y="562" text-anchor="middle" fill="#7c3aed" font-family="Arial, sans-serif" font-size="9">• H2O AutoML</text>
    <text x="260" y="574" text-anchor="middle" fill="#7c3aed" font-family="Arial, sans-serif" font-size="9">• TPOT</text>
    <text x="260" y="586" text-anchor="middle" fill="#7c3aed" font-family="Arial, sans-serif" font-size="9">• Neural Architecture</text>
    <text x="260" y="598" text-anchor="middle" fill="#7c3aed" font-family="Arial, sans-serif" font-size="9">  Search (NAS)</text>
  </g>
  
  <!-- Model Selection Table -->
  <rect x="100" y="640" width="700" height="50" fill="rgba(243, 244, 246, 0.9)" stroke="#9ca3af" stroke-width="1" rx="8"/>
  <text x="120" y="655" fill="#374151" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Model Selection Criteria:</text>
  <text x="120" y="670" fill="#374151" font-family="Arial, sans-serif" font-size="11">Performance • Interpretability • Computational Cost • Robustness • Business Requirements</text>
  <text x="120" y="685" fill="#374151" font-family="Arial, sans-serif" font-size="11">Cross-validation score • Feature importance • Training time • Prediction latency • Domain constraints</text>
  
  <!-- Arrows showing the cycle -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4b5563"/>
    </marker>
    <marker id="arrowheadRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
  </defs>
  
  <!-- Cycle arrows -->
  <path d="M 330 170 Q 400 170 400 260" stroke="#4b5563" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 570 170 Q 500 170 500 260" stroke="#4b5563" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 710 240 Q 710 310 710 380 Q 710 450 640 500" stroke="#4b5563" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 570 550 Q 500 550 500 500" stroke="#4b5563" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 330 550 Q 260 550 260 470 Q 260 350 330 170" stroke="#4b5563" stroke-width="3" fill="none" marker-end="url(#arrowhead)" stroke-dasharray="8,4"/>
  
  <!-- Central arrows pointing to the center -->
  <path d="M 330 260 L 380 320" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#arrowheadRed)"/>
  <path d="M 570 260 L 520 320" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#arrowheadRed)"/>
  <path d="M 570 500 L 520 440" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#arrowheadRed)"/>
  <path d="M 330 500 L 380 440" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#arrowheadRed)"/>
  
  <!-- Feedback loop indicators -->
  <text x="380" y="200" fill="#6b7280" font-family="Arial, sans-serif" font-size="10">Iterate</text>
  <text x="520" y="200" fill="#6b7280" font-family="Arial, sans-serif" font-size="10">Refine</text>
  <text x="520" y="580" fill="#6b7280" font-family="Arial, sans-serif" font-size="10">Optimize</text>
  <text x="380" y="580" fill="#6b7280" font-family="Arial, sans-serif" font-size="10">Improve</text>
  
  <!-- Performance tracking -->
  <text x="450" y="420" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="11" font-style="italic">Performance</text>
  <text x="450" y="435" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="11" font-style="italic">Tracking &</text>
  <text x="450" y="450" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="11" font-style="italic">Comparison</text>
</svg>