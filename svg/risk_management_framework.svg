<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="900" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="600" y="40" font-size="24" font-weight="bold" text-anchor="middle" fill="#1a1a2e">
    AI Agent Security: Risk Management Framework
  </text>
  
  <!-- Defense in Depth Layers -->
  <text x="600" y="85" font-size="16" font-weight="bold" text-anchor="middle" fill="#555">
    Multiple layers of security controls to break the Lethal Trifecta
  </text>
  
  <!-- Layer 1: Network Controls -->
  <g transform="translate(100, 130)">
    <rect x="0" y="0" width="1000" height="120" rx="10" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3"/>
    <text x="30" y="35" font-size="18" font-weight="bold" fill="#1a1a2e">Layer 1: Network Controls</text>
    <text x="30" y="60" font-size="13" fill="#1a1a2e" font-weight="bold">🎯 Targets: Factor 2 &amp; 3</text>
    
    <g transform="translate(40, 75)">
      <text x="0" y="0" font-size="12" fill="#555">✓ Allowlist trusted domains only</text>
      <text x="280" y="0" font-size="12" fill="#555">✓ Block data uploads (read-only HTTP)</text>
      <text x="600" y="0" font-size="12" fill="#555">✓ Remove internet for sensitive work</text>
    </g>
  </g>
  
  <!-- Layer 2: File System Controls -->
  <g transform="translate(100, 280)">
    <rect x="0" y="0" width="1000" height="120" rx="10" fill="#e8f8f0" stroke="#27ae60" stroke-width="3"/>
    <text x="30" y="35" font-size="18" font-weight="bold" fill="#1a1a2e">Layer 2: File System Controls</text>
    <text x="30" y="60" font-size="13" fill="#1a1a2e" font-weight="bold">🎯 Targets: Factor 1</text>
    
    <g transform="translate(40, 75)">
      <text x="0" y="0" font-size="12" fill="#555">✓ Sandbox to project directory</text>
      <text x="280" y="0" font-size="12" fill="#555">✓ Exclude .env, secrets, .ssh folders</text>
      <text x="600" y="0" font-size="12" fill="#555">✓ Read-only mounts where possible</text>
    </g>
  </g>
  
  <!-- Layer 3: Execution Controls -->
  <g transform="translate(100, 430)">
    <rect x="0" y="0" width="1000" height="120" rx="10" fill="#fff5e6" stroke="#ff9800" stroke-width="3"/>
    <text x="30" y="35" font-size="18" font-weight="bold" fill="#1a1a2e">Layer 3: Execution Controls</text>
    <text x="30" y="60" font-size="13" fill="#1a1a2e" font-weight="bold">🎯 Targets: All Factors</text>
    
    <g transform="translate(40, 75)">
      <text x="0" y="0" font-size="12" fill="#555">✓ Require approval for risky operations</text>
      <text x="330" y="0" font-size="12" fill="#555">✓ Log all agent actions</text>
      <text x="600" y="0" font-size="12" fill="#555">✓ Implement operation timeouts</text>
    </g>
  </g>
  
  <!-- Layer 4: Credential Controls -->
  <g transform="translate(100, 580)">
    <rect x="0" y="0" width="1000" height="120" rx="10" fill="#fff0f5" stroke="#e91e63" stroke-width="3"/>
    <text x="30" y="35" font-size="18" font-weight="bold" fill="#1a1a2e">Layer 4: Credential Controls</text>
    <text x="30" y="60" font-size="13" fill="#1a1a2e" font-weight="bold">🎯 Targets: Factor 1</text>
    
    <g transform="translate(40, 75)">
      <text x="0" y="0" font-size="12" fill="#555">✓ Least-privilege tokens</text>
      <text x="280" y="0" font-size="12" fill="#555">✓ Automatic rotation (7-30 days)</text>
      <text x="600" y="0" font-size="12" fill="#555">✓ Scope to specific resources only</text>
    </g>
  </g>
  
  <!-- Layer 5: Monitoring -->
  <g transform="translate(100, 730)">
    <rect x="0" y="0" width="1000" height="120" rx="10" fill="#f3e5f5" stroke="#9c27b0" stroke-width="3"/>
    <text x="30" y="35" font-size="18" font-weight="bold" fill="#1a1a2e">Layer 5: Monitoring &amp; Detection</text>
    <text x="30" y="60" font-size="13" fill="#1a1a2e" font-weight="bold">🎯 Targets: Detection &amp; Response</text>
    
    <g transform="translate(40, 75)">
      <text x="0" y="0" font-size="12" fill="#555">✓ Comprehensive activity logs</text>
      <text x="280" y="0" font-size="12" fill="#555">✓ Alert on suspicious patterns</text>
      <text x="600" y="0" font-size="12" fill="#555">✓ Regular audit reviews</text>
    </g>
  </g>
  
  <!-- Risk Level Indicator -->
  <g transform="translate(50, 120)">
    <text x="0" y="20" font-size="14" font-weight="bold" fill="#1a1a2e">Risk Level:</text>
    <rect x="0" y="30" width="30" height="600" fill="url(#risk-gradient)"/>
    
    <!-- Risk labels -->
    <text x="-45" y="60" font-size="12" fill="#dc3545">🔴 CRITICAL</text>
    <text x="-35" y="200" font-size="12" fill="#ff9800">🟡 HIGH</text>
    <text x="-40" y="380" font-size="12" fill="#ffc107">🟠 MEDIUM</text>
    <text x="-30" y="560" font-size="12" fill="#4caf50">🟢 LOW</text>
    
    <defs>
      <linearGradient id="risk-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:#dc3545;stop-opacity:1" />
        <stop offset="33%" style="stop-color:#ff9800;stop-opacity:1" />
        <stop offset="66%" style="stop-color:#ffc107;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#4caf50;stop-opacity:1" />
      </linearGradient>
    </defs>
  </g>
  
  <!-- Security Principle -->
  <g transform="translate(1110, 400)">
    <text x="0" y="0" font-size="13" font-weight="bold" fill="#1a1a2e" transform="rotate(90)" text-anchor="middle">
      Defense in Depth: If one layer fails, others provide backup security
    </text>
  </g>
</svg>