<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="700" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="500" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Retrieval Optimization Strategies
  </text>
  
  <!-- Strategy 1: Hybrid Search -->
  <g>
    <!-- Box -->
    <rect x="50" y="80" width="420" height="260" rx="8" fill="#fff" stroke="#4CAF50" stroke-width="3"/>
    
    <!-- Title -->
    <text x="260" y="110" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#4CAF50">
      1. Hybrid Search
    </text>
    
    <!-- BM25 Box -->
    <rect x="80" y="130" width="150" height="80" rx="4" fill="#e8f5e9" stroke="#4CAF50" stroke-width="2"/>
    <text x="155" y="155" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2e7d32">
      BM25
    </text>
    <text x="155" y="175" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#555">
      Lexical
    </text>
    <text x="155" y="195" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#555">
      (Keywords)
    </text>
    
    <!-- Vector Box -->
    <rect x="260" y="130" width="150" height="80" rx="4" fill="#e8f5e9" stroke="#4CAF50" stroke-width="2"/>
    <text x="335" y="155" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2e7d32">
      Vector
    </text>
    <text x="335" y="175" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#555">
      Semantic
    </text>
    <text x="335" y="195" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#555">
      (Embeddings)
    </text>
    
    <!-- Arrows down -->
    <path d="M 155 210 L 155 240" stroke="#4CAF50" stroke-width="2" fill="none" marker-end="url(#arrowGreen)"/>
    <path d="M 335 210 L 335 240" stroke="#4CAF50" stroke-width="2" fill="none" marker-end="url(#arrowGreen)"/>
    
    <!-- Combine Box -->
    <rect x="155" y="240" width="180" height="60" rx="4" fill="#4CAF50" stroke="#2e7d32" stroke-width="2"/>
    <text x="245" y="262" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">
      Combine Scores
    </text>
    <text x="245" y="280" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#fff">
      0.7 × vector_score +
    </text>
    <text x="245" y="294" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#fff">
      0.3 × bm25_score
    </text>
    
    <!-- Benefit -->
    <text x="260" y="325" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666" font-style="italic">
      ✓ Captures both exact matches and semantic similarity
    </text>
  </g>
  
  <!-- Strategy 2: Query Expansion -->
  <g>
    <!-- Box -->
    <rect x="530" y="80" width="420" height="260" rx="8" fill="#fff" stroke="#2196F3" stroke-width="3"/>
    
    <!-- Title -->
    <text x="740" y="110" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#2196F3">
      2. Query Expansion
    </text>
    
    <!-- Original Query -->
    <rect x="640" y="130" width="200" height="50" rx="4" fill="#e3f2fd" stroke="#2196F3" stroke-width="2"/>
    <text x="740" y="150" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1565c0">
      Original Query
    </text>
    <text x="740" y="168" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555">
      "neural networks"
    </text>
    
    <!-- Arrow down -->
    <path d="M 740 180 L 740 200" stroke="#2196F3" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/>
    
    <!-- Expanded Terms -->
    <ellipse cx="640" cy="235" rx="60" ry="30" fill="#bbdefb" stroke="#2196F3" stroke-width="1.5"/>
    <text x="640" y="232" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1565c0">
      deep
    </text>
    <text x="640" y="245" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1565c0">
      learning
    </text>
    
    <ellipse cx="740" cy="235" rx="60" ry="30" fill="#bbdefb" stroke="#2196F3" stroke-width="1.5"/>
    <text x="740" y="232" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1565c0">
      artificial
    </text>
    <text x="740" y="245" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1565c0">
      neural
    </text>
    
    <ellipse cx="840" cy="235" rx="60" ry="30" fill="#bbdefb" stroke="#2196F3" stroke-width="1.5"/>
    <text x="840" y="240" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1565c0">
      backprop
    </text>
    
    <!-- Arrow down -->
    <path d="M 740 265 L 740 285" stroke="#2196F3" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/>
    
    <!-- Result -->
    <rect x="590" y="285" width="300" height="35" rx="4" fill="#2196F3" stroke="#1565c0" stroke-width="2"/>
    <text x="740" y="308" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">
      Enhanced Retrieval Coverage
    </text>
    
    <!-- Benefit -->
    <text x="740" y="330" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666" font-style="italic">
      ✓ Handles vocabulary mismatch and improves recall
    </text>
  </g>
  
  <!-- Strategy 3: Contextual Compression -->
  <g>
    <!-- Box -->
    <rect x="50" y="380" width="420" height="270" rx="8" fill="#fff" stroke="#FF9800" stroke-width="3"/>
    
    <!-- Title -->
    <text x="260" y="410" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#FF9800">
      3. Contextual Compression
    </text>
    
    <!-- Full Document -->
    <rect x="80" y="430" width="180" height="120" rx="4" fill="#fff3e0" stroke="#FF9800" stroke-width="2"/>
    <text x="170" y="450" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#e65100">
      Retrieved Document
    </text>
    <line x1="90" y1="465" x2="250" y2="465" stroke="#ccc" stroke-width="1"/>
    <line x1="90" y1="475" x2="250" y2="475" stroke="#ccc" stroke-width="1"/>
    <line x1="90" y1="485" x2="220" y2="485" stroke="#ccc" stroke-width="1"/>
    <line x1="90" y1="495" x2="240" y2="495" stroke="#FF9800" stroke-width="2"/>
    <line x1="90" y1="505" x2="230" y2="505" stroke="#FF9800" stroke-width="2"/>
    <line x1="90" y1="515" x2="250" y2="515" stroke="#ccc" stroke-width="1"/>
    <line x1="90" y1="525" x2="210" y2="525" stroke="#ccc" stroke-width="1"/>
    <line x1="90" y1="535" x2="240" y2="535" stroke="#ccc" stroke-width="1"/>
    
    <!-- Arrow -->
    <path d="M 270 490 L 310 490" stroke="#FF9800" stroke-width="3" fill="none" marker-end="url(#arrowOrange)"/>
    <text x="290" y="478" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#e65100">
      Extract
    </text>
    
    <!-- Compressed -->
    <rect x="320" y="455" width="130" height="70" rx="4" fill="#FF9800" stroke="#e65100" stroke-width="2"/>
    <text x="385" y="475" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#fff">
      Relevant Parts
    </text>
    <line x1="330" y1="488" x2="440" y2="488" stroke="#fff" stroke-width="2"/>
    <line x1="330" y1="498" x2="440" y2="498" stroke="#fff" stroke-width="2"/>
    <line x1="330" y1="508" x2="410" y2="508" stroke="#fff" stroke-width="2"/>
    
    <!-- Benefit -->
    <text x="260" y="575" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666" font-style="italic">
      ✓ Reduces noise and improves context quality
    </text>
    <text x="260" y="595" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666" font-style="italic">
      ✓ Saves tokens in LLM context window
    </text>
    
    <!-- Stats -->
    <text x="90" y="625" font-family="Arial, sans-serif" font-size="10" text-anchor="start" fill="#999">
      Before: 2000 tokens
    </text>
    <text x="320" y="625" font-family="Arial, sans-serif" font-size="10" text-anchor="start" fill="#e65100" font-weight="bold">
      After: 400 tokens
    </text>
  </g>
  
  <!-- Strategy 4: Multi-Stage Retrieval -->
  <g>
    <!-- Box -->
    <rect x="530" y="380" width="420" height="270" rx="8" fill="#fff" stroke="#9C27B0" stroke-width="3"/>
    
    <!-- Title -->
    <text x="740" y="410" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#9C27B0">
      4. Multi-Stage Retrieval
    </text>
    
    <!-- Stage 1 -->
    <rect x="560" y="430" width="140" height="60" rx="4" fill="#f3e5f5" stroke="#9C27B0" stroke-width="2"/>
    <text x="630" y="450" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#6a1b9a">
      Stage 1: Fast
    </text>
    <text x="630" y="467" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555">
      Vector Search
    </text>
    <text x="630" y="482" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#9C27B0" font-weight="bold">
      Top 1000
    </text>
    
    <!-- Arrow -->
    <path d="M 710 460 L 760 460" stroke="#9C27B0" stroke-width="2" fill="none" marker-end="url(#arrowPurple)"/>
    
    <!-- Stage 2 -->
    <rect x="770" y="430" width="140" height="60" rx="4" fill="#e1bee7" stroke="#9C27B0" stroke-width="2"/>
    <text x="840" y="450" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#6a1b9a">
      Stage 2: BM25
    </text>
    <text x="840" y="467" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555">
      Re-ranking
    </text>
    <text x="840" y="482" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#9C27B0" font-weight="bold">
      Top 100
    </text>
    
    <!-- Arrow down -->
    <path d="M 740 500 L 740 530" stroke="#9C27B0" stroke-width="2" fill="none" marker-end="url(#arrowPurple)"/>
    
    <!-- Stage 3 -->
    <rect x="620" y="530" width="240" height="60" rx="4" fill="#9C27B0" stroke="#6a1b9a" stroke-width="2"/>
    <text x="740" y="550" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">
      Stage 3: Cross-Encoder
    </text>
    <text x="740" y="567" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#fff">
      Precise Re-ranking
    </text>
    <text x="740" y="582" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#f3e5f5" font-weight="bold">
      Final Top 10
    </text>
    
    <!-- Benefit -->
    <text x="740" y="610" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666" font-style="italic">
      ✓ Balances speed and accuracy
    </text>
    <text x="740" y="630" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666" font-style="italic">
      ✓ Fast initial retrieval + precise final ranking
    </text>
  </g>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4CAF50"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2196F3"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#FF9800"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#9C27B0"/>
    </marker>
  </defs>
</svg>