<svg width="700" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title-text { font-family: 'Arial', sans-serif; font-size: 28px; font-weight: bold; fill: #2c3e50; }
      .header-text { font-family: 'Arial', sans-serif; font-size: 20px; font-weight: bold; fill: #34495e; }
      .label-text { font-family: 'Arial', sans-serif; font-size: 18px; font-weight: bold; fill: #2c3e50; }
      .cell-text { font-family: 'Arial', sans-serif; font-size: 24px; font-weight: bold; fill: white; }
      .desc-text { font-family: 'Arial', sans-serif; font-size: 14px; fill: #2c3e50; }
      .formula-text { font-family: 'Arial', sans-serif; font-size: 16px; fill: #2c3e50; font-weight: bold; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="700" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="350" y="35" text-anchor="middle" class="title-text">Confusion Matrix</text>
  
  <!-- Column headers (Predicted) -->
  <text x="350" y="80" text-anchor="middle" class="header-text">PREDICTED</text>
  <text x="400" y="110" text-anchor="middle" class="label-text">Positive</text>
  <text x="550" y="110" text-anchor="middle" class="label-text">Negative</text>
  
  <!-- Row headers (Actual) -->
  <g transform="rotate(-90, 120, 220)">
    <text x="120" y="225" text-anchor="middle" class="header-text">ACTUAL</text>
  </g>
  <text x="180" y="180" text-anchor="middle" class="label-text">Positive</text>
  <text x="180" y="280" text-anchor="middle" class="label-text">Negative</text>
  
  <!-- Matrix cells -->
  <!-- True Positive (TP) -->
  <rect x="300" y="140" width="120" height="80" fill="#27ae60" stroke="#1e8449" stroke-width="3" rx="5"/>
  <text x="360" y="175" text-anchor="middle" class="cell-text">TP</text>
  <text x="360" y="195" text-anchor="middle" class="desc-text" fill="white">True</text>
  <text x="360" y="210" text-anchor="middle" class="desc-text" fill="white">Positive</text>
  
  <!-- False Negative (FN) -->
  <rect x="450" y="140" width="120" height="80" fill="#e74c3c" stroke="#c0392b" stroke-width="3" rx="5"/>
  <text x="510" y="175" text-anchor="middle" class="cell-text">FN</text>
  <text x="510" y="195" text-anchor="middle" class="desc-text" fill="white">False</text>
  <text x="510" y="210" text-anchor="middle" class="desc-text" fill="white">Negative</text>
  
  <!-- False Positive (FP) -->
  <rect x="300" y="240" width="120" height="80" fill="#e67e22" stroke="#d35400" stroke-width="3" rx="5"/>
  <text x="360" y="275" text-anchor="middle" class="cell-text">FP</text>
  <text x="360" y="295" text-anchor="middle" class="desc-text" fill="white">False</text>
  <text x="360" y="310" text-anchor="middle" class="desc-text" fill="white">Positive</text>
  
  <!-- True Negative (TN) -->
  <rect x="450" y="240" width="120" height="80" fill="#3498db" stroke="#2980b9" stroke-width="3" rx="5"/>
  <text x="510" y="275" text-anchor="middle" class="cell-text">TN</text>
  <text x="510" y="295" text-anchor="middle" class="desc-text" fill="white">True</text>
  <text x="510" y="310" text-anchor="middle" class="desc-text" fill="white">Negative</text>
  
  <!-- Formulas section -->
  <rect x="50" y="360" width="600" height="220" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2" rx="5"/>
  <text x="350" y="385" text-anchor="middle" class="header-text">Performance Metrics from Confusion Matrix</text>
  
  <!-- Accuracy -->
  <text x="70" y="415" class="formula-text">Accuracy = </text>
  <text x="180" y="415" class="formula-text" fill="#2980b9">(TP + TN)</text>
  <line x1="180" y1="420" x2="320" y2="420" stroke="#2c3e50" stroke-width="1"/>
  <text x="180" y="435" class="formula-text">(TP + TN + FP + FN)</text>
  
  <!-- Precision -->
  <text x="370" y="415" class="formula-text">Precision = </text>
  <text x="470" y="415" class="formula-text" fill="#27ae60">TP</text>
  <line x1="470" y1="420" x2="530" y2="420" stroke="#2c3e50" stroke-width="1"/>
  <text x="470" y="435" class="formula-text">(TP + FP)</text>
  
  <!-- Recall -->
  <text x="70" y="470" class="formula-text">Recall = </text>
  <text x="150" y="470" class="formula-text" fill="#27ae60">TP</text>
  <line x1="150" y1="475" x2="210" y2="475" stroke="#2c3e50" stroke-width="1"/>
  <text x="150" y="490" class="formula-text">(TP + FN)</text>
  
  <!-- F1-Score -->
  <text x="250" y="470" class="formula-text">F1-Score = </text>
  <text x="350" y="470" class="formula-text">2 × </text>
  <text x="390" y="470" class="formula-text" fill="#8e44ad">(Precision × Recall)</text>
  <line x1="390" y1="475" x2="580" y2="475" stroke="#2c3e50" stroke-width="1"/>
  <text x="390" y="490" class="formula-text">(Precision + Recall)</text>
  
  <!-- Key insight -->
  <text x="350" y="525" text-anchor="middle" class="desc-text" font-style="italic">The confusion matrix provides the foundation for calculating all classification metrics</text>
  <text x="350" y="545" text-anchor="middle" class="desc-text">Each metric emphasizes different aspects of model performance</text>
  <text x="350" y="565" text-anchor="middle" class="desc-text" font-weight="bold">Choose metrics based on your specific business requirements and costs</text>
</svg>