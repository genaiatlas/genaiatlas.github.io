<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="treatmentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fd79a8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e84393;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="controlBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00cec9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00b894;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <rect x="50" y="20" width="800" height="40" fill="url(#titleGrad)" rx="8"/>
  <text x="450" y="45" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold">
    HIP Study Results: Treatment vs Control Comparison
  </text>
  
  <!-- Table Header -->
  <rect x="100" y="80" width="700" height="40" fill="#2d3436" rx="5"/>
  <text x="150" y="105" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Group</text>
  <text x="280" y="105" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Size</text>
  <text x="400" y="105" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">BC Deaths</text>
  <text x="520" y="105" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">BC Rate/1000</text>
  <text x="650" y="105" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Other Deaths</text>
  <text x="750" y="105" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Rate/1000</text>
  
  <!-- Treatment Group Rows -->
  <rect x="100" y="120" width="700" height="30" fill="#ffe0e6" stroke="#e84393" stroke-width="1"/>
  <text x="150" y="140" fill="#2d3436" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Screened</text>
  <text x="280" y="140" fill="#2d3436" font-family="Arial, sans-serif" font-size="12">20,200</text>
  <text x="400" y="140" fill="#2d3436" font-family="Arial, sans-serif" font-size="12">23</text>
  <text x="520" y="140" fill="#2d3436" font-family="Arial, sans-serif" font-size="12" font-weight="bold">1.1</text>
  <text x="650" y="140" fill="#2d3436" font-family="Arial, sans-serif" font-size="12">428</text>
  <text x="750" y="140" fill="#2d3436" font-family="Arial, sans-serif" font-size="12">21</text>
  
  <rect x="100" y="150" width="700" height="30" fill="#ffe0e6" stroke="#e84393" stroke-width="1"/>
  <text x="150" y="170" fill="#2d3436" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Refused</text>
  <text x="280" y="170" fill="#2d3436" font-family="Arial, sans-serif" font-size="12">10,800</text>
  <text x="400" y="170" fill="#2d3436" font-family="Arial, sans-serif" font-size="12">16</text>
  <text x="520" y="170" fill="#2d3436" font-family="Arial, sans-serif" font-size="12" font-weight="bold">1.5</text>
  <text x="650" y="170" fill="#2d3436" font-family="Arial, sans-serif" font-size="12">409</text>
  <text x="750" y="170" fill="#2d3436" font-family="Arial, sans-serif" font-size="12">38</text>
  
  <rect x="100" y="180" width="700" height="30" fill="url(#treatmentBar)" stroke="#e84393" stroke-width="2"/>
  <text x="150" y="200" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Treatment Total</text>
  <text x="280" y="200" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">31,000</text>
  <text x="400" y="200" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">39</text>
  <text x="520" y="200" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">1.3</text>
  <text x="650" y="200" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">837</text>
  <text x="750" y="200" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">27</text>
  
  <!-- Control Group Row -->
  <rect x="100" y="210" width="700" height="30" fill="url(#controlBar)" stroke="#00b894" stroke-width="2"/>
  <text x="150" y="230" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Control</text>
  <text x="280" y="230" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">31,000</text>
  <text x="400" y="230" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">63</text>
  <text x="520" y="230" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">2.0</text>
  <text x="650" y="230" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">879</text>
  <text x="750" y="230" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">28</text>
  
  <!-- Visual Comparison Charts -->
  <text x="450" y="280" text-anchor="middle" fill="#2d3436" font-family="Arial, sans-serif" font-size="16" font-weight="bold">
    Breast Cancer Deaths per 1,000 Women
  </text>
  
  <!-- Treatment Bar -->
  <rect x="200" y="310" width="130" height="40" fill="url(#treatmentBar)" rx="5"/>
  <text x="265" y="335" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">1.3</text>
  <text x="265" y="365" text-anchor="middle" fill="#2d3436" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Treatment</text>
  
  <!-- Control Bar -->
  <rect x="400" y="310" width="200" height="40" fill="url(#controlBar)" rx="5"/>
  <text x="500" y="335" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">2.0</text>
  <text x="500" y="365" text-anchor="middle" fill="#2d3436" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Control</text>
  
  <!-- Reduction Arrow -->
  <path d="M 350 330 L 380 330" stroke="#e17055" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="365" y="325" text-anchor="middle" fill="#e17055" font-family="Arial, sans-serif" font-size="11" font-weight="bold">35% reduction</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e17055"/>
    </marker>
  </defs>
  
  <!-- Key Insights -->
  <rect x="100" y="400" width="700" height="180" fill="#fff3cd" stroke="#ffeaa7" stroke-width="2" rx="10"/>
  <text x="450" y="425" text-anchor="middle" fill="#6c5700" font-family="Arial, sans-serif" font-size="16" font-weight="bold">
    Key Statistical Insights
  </text>
  
  <!-- Insight 1 -->
  <rect x="120" y="440" width="320" height="60" fill="#d4edda" stroke="#28a745" stroke-width="1" rx="5"/>
  <text x="280" y="460" text-anchor="middle" fill="#155724" font-family="Arial, sans-serif" font-size="12" font-weight="bold">
    ✓ Randomization Validated
  </text>
  <text x="280" y="475" text-anchor="middle" fill="#155724" font-family="Arial, sans-serif" font-size="11">
    Other death rates nearly identical
  </text>
  <text x="280" y="490" text-anchor="middle" fill="#155724" font-family="Arial, sans-serif" font-size="11">
    (27 vs 28 per 1,000) confirms proper randomization
  </text>
  
  <!-- Insight 2 -->
  <rect x="460" y="440" width="320" height="60" fill="#f8d7da" stroke="#dc3545" stroke-width="1" rx="5"/>
  <text x="620" y="460" text-anchor="middle" fill="#721c24" font-family="Arial, sans-serif" font-size="12" font-weight="bold">
    ⚠ Observational Bias Warning
  </text>
  <text x="620" y="475" text-anchor="middle" fill="#721c24" font-family="Arial, sans-serif" font-size="11">
    Screened vs Refused comparison
  </text>
  <text x="620" y="490" text-anchor="middle" fill="#721c24" font-family="Arial, sans-serif" font-size="11">
    invalid due to selection bias (21 vs 38)</text>
  
  <!-- Insight 3 -->
  <rect x="290" y="520" width="320" height="50" fill="#e2e3e5" stroke="#6c757d" stroke-width="1" rx="5"/>
  <text x="450" y="540" text-anchor="middle" fill="#495057" font-family="Arial, sans-serif" font-size="12" font-weight="bold">
    Intention-to-Treat Principle
  </text>
  <text x="450" y="555" text-anchor="middle" fill="#495057" font-family="Arial, sans-serif" font-size="11">
    Compare entire assigned groups (31,000 vs 31,000)
  </text>
</svg>