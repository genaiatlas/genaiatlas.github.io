<svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#333" />
    </marker>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <dropShadow dx="3" dy="3" stdDeviation="4" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
    <linearGradient id="transformGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4caf50;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#2196f3;stop-opacity:0.2" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="500" fill="#f8f9fa"/>
  
  <!-- Transformation arrow -->
  <rect x="420" y="220" width="160" height="60" fill="url(#transformGradient)" rx="30"/>
  <line x1="430" y1="250" x2="570" y2="250" stroke="#333" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="500" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Neural Network</text>
  <text x="500" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Transformation</text>
  <text x="500" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">(Hidden Layer)</text>
  
  <!-- Left side: Original space -->
  <rect x="50" y="50" width="350" height="350" fill="white" stroke="#4caf50" stroke-width="3" rx="10" filter="url(#shadow)"/>
  
  <!-- Grid for left plot -->
  <defs>
    <pattern id="gridLeft" width="35" height="35" patternUnits="userSpaceOnUse">
      <path d="M 35 0 L 0 0 0 35" fill="none" stroke="#e8f5e8" stroke-width="1"/>
    </pattern>
  </defs>
  <rect x="60" y="60" width="330" height="330" fill="url(#gridLeft)" opacity="0.5"/>
  
  <!-- Left plot axes -->
  <line x1="60" y1="380" x2="380" y2="380" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="380" x2="60" y2="70" stroke="#333" stroke-width="2"/>
  
  <!-- Left plot tick marks -->
  <line x1="220" y1="375" x2="220" y2="385" stroke="#333" stroke-width="2"/>
  <text x="220" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">0</text>
  
  <line x1="55" y1="220" x2="65" y2="220" stroke="#333" stroke-width="2"/>
  <text x="45" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">0</text>
  
  <!-- Left plot data points -->
  <!-- Red data points (two clusters) -->
  <circle cx="120" cy="340" r="6" fill="#f44336" stroke="#d32f2f" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="110" cy="350" r="6" fill="#f44336" stroke="#d32f2f" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="130" cy="350" r="6" fill="#f44336" stroke="#d32f2f" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="115" cy="330" r="6" fill="#f44336" stroke="#d32f2f" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="125" cy="330" r="6" fill="#f44336" stroke="#d32f2f" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="105" cy="340" r="6" fill="#f44336" stroke="#d32f2f" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="135" cy="340" r="6" fill="#f44336" stroke="#d32f2f" stroke-width="2" filter="url(#shadow)"/>
  
  <circle cx="330" cy="100" r="6" fill="#f44336" stroke="#d32f2f" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="320" cy="90" r="6" fill="#f44336" stroke="#d32f2f" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="340" cy="90" r="6" fill="#f44336" stroke="#d32f2f" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="325" cy="110" r="6" fill="#f44336" stroke="#d32f2f" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="335" cy="110" r="6" fill="#f44336" stroke="#d32f2f" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="315" cy="100" r="6" fill="#f44336" stroke="#d32f2f" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="345" cy="100" r="6" fill="#f44336" stroke="#d32f2f" stroke-width="2" filter="url(#shadow)"/>
  
  <!-- Blue data points (center cluster) -->
  <circle cx="220" cy="220" r="6" fill="#2196f3" stroke="#1976d2" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="210" cy="210" r="6" fill="#2196f3" stroke="#1976d2" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="230" cy="210" r="6" fill="#2196f3" stroke="#1976d2" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="215" cy="230" r="6" fill="#2196f3" stroke="#1976d2" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="225" cy="230" r="6" fill="#2196f3" stroke="#1976d2" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="205" cy="220" r="6" fill="#2196f3" stroke="#1976d2" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="235" cy="220" r="6" fill="#2196f3" stroke="#1976d2" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="200" cy="215" r="6" fill="#2196f3" stroke="#1976d2" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="240" cy="215" r="6" fill="#2196f3" stroke="#1976d2" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="195" cy="225" r="6" fill="#2196f3" stroke="#1976d2" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="245" cy="225" r="6" fill="#2196f3" stroke="#1976d2" stroke-width="2" filter="url(#shadow)"/>
  
  <!-- No linear separator possible (shown with X) -->
  <line x1="150" y1="130" x2="290" y2="270" stroke="#ff5722" stroke-width="4" stroke-dasharray="15,10" opacity="0.7"/>
  <text x="190" y="180" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ff5722" transform="rotate(30, 190, 180)">✗ No single line works</text>
  
  <!-- Left plot labels -->
  <text x="220" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">x₁</text>
  <text x="25" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333" transform="rotate(-90, 25, 225)">x₂</text>
  
  <!-- Left plot title -->
  <text x="225" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#4caf50">Original Feature Space</text>
  <text x="225" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#666">Linearly Inseparable</text>
  
  <!-- Right side: Transformed space -->
  <rect x="600" y="50" width="350" height="350" fill="white" stroke="#2196f3" stroke-width="3" rx="10" filter="url(#shadow)"/>
  
  <!-- Grid for right plot -->
  <defs>
    <pattern id="gridRight" width="35" height="35" patternUnits="userSpaceOnUse">
      <path d="M 35 0 L 0 0 0 35" fill="none" stroke="#e3f2fd" stroke-width="1"/>
    </pattern>
  </defs>
  <rect x="610" y="60" width="330" height="330" fill="url(#gridRight)" opacity="0.5"/>
  
  <!-- Right plot axes -->
  <line x1="610" y1="380" x2="930" y2="380" stroke="#333" stroke-width="2"/>
  <line x1="610" y1="380" x2="610" y2="70" stroke="#333" stroke-width="2"/>
  
  <!-- Right plot tick marks and labels -->
  <line x1="770" y1="375" x2="770" y2="385" stroke="#333" stroke-width="2"/>
  <text x="770" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">1</text>
  <text x="610" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">0</text>
  
  <line x1="605" y1="220" x2="615" y2="220" stroke="#333" stroke-width="2"/>
  <text x="595" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">1</text>
  <text x="595" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">0</text>
  
  <!-- Right plot transformed data points -->
  <!-- All red points at (0,1) and (1,0) -->
  <g>
    <!-- Position (0,1) - Red cluster -->
    <circle cx="610" cy="220" r="8" fill="#f44336" stroke="#d32f2f" stroke-width="3" filter="url(#shadow)"/>
    <circle cx="615" cy="215" r="6" fill="#f44336" stroke="#d32f2f" stroke-width="2" opacity="0.8"/>
    <circle cx="620" cy="225" r="6" fill="#f44336" stroke="#d32f2f" stroke-width="2" opacity="0.8"/>
    <circle cx="605" cy="225" r="6" fill="#f44336" stroke="#d32f2f" stroke-width="2" opacity="0.8"/>
    <text x="630" y="210" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f44336">(0,1) Red</text>
    
    <!-- Position (1,0) - Red cluster -->
    <circle cx="770" cy="380" r="8" fill="#f44336" stroke="#d32f2f" stroke-width="3" filter="url(#shadow)"/>
    <circle cx="775" cy="375" r="6" fill="#f44336" stroke="#d32f2f" stroke-width="2" opacity="0.8"/>
    <circle cx="765" cy="375" r="6" fill="#f44336" stroke="#d32f2f" stroke-width="2" opacity="0.8"/>
    <circle cx="775" cy="385" r="6" fill="#f44336" stroke="#d32f2f" stroke-width="2" opacity="0.8"/>
    <text x="780" y="370" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f44336">(1,0) Red</text>
  </g>
  
  <!-- All blue points at (1,1) -->
  <g>
    <!-- Position (1,1) - Blue cluster -->
    <circle cx="770" cy="220" r="8" fill="#2196f3" stroke="#1976d2" stroke-width="3" filter="url(#shadow)"/>
    <circle cx="775" cy="215" r="6" fill="#2196f3" stroke="#1976d2" stroke-width="2" opacity="0.8"/>
    <circle cx="765" cy="215" r="6" fill="#2196f3" stroke="#1976d2" stroke-width="2" opacity="0.8"/>
    <circle cx="775" cy="225" r="6" fill="#2196f3" stroke="#1976d2" stroke-width="2" opacity="0.8"/>
    <circle cx="765" cy="225" r="6" fill="#2196f3" stroke="#1976d2" stroke-width="2" opacity="0.8"/>
    <circle cx="770" cy="210" r="6" fill="#2196f3" stroke="#1976d2" stroke-width="2" opacity="0.8"/>
    <circle cx="770" cy="230" r="6" fill="#2196f3" stroke="#1976d2" stroke-width="2" opacity="0.8"/>
    <text x="780" y="210" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2196f3">(1,1) Blue</text>
  </g>
  
  <!-- Perfect linear separator -->
  <line x1="650" y1="120" x2="850" y2="320" stroke="#4caf50" stroke-width="4"/>
  <text x="720" y="190" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#4caf50" transform="rotate(35, 720, 190)">✓ Perfect Separation!</text>
  
  <!-- Right plot labels -->
  <text x="770" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">a₁ (Neuron 1 output)</text>
  <text x="575" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333" transform="rotate(-90, 575, 225)">a₂ (Neuron 2 output)</text>
  
  <!-- Right plot title -->
  <text x="775" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2196f3">Transformed Feature Space</text>
  <text x="775" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#666">Linearly Separable!</text>
  
  <!-- Key insight box -->
  <rect x="250" y="30" width="500" height="80" fill="white" stroke="#ff9800" stroke-width="3" rx="10" filter="url(#shadow)" opacity="0.95"/>
  <text x="500" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ff9800">🧠 Key Insight</text>
  <text x="500" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#333">The hidden layer creates a new coordinate system where</text>
  <text x="500" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#333">complex problems become simple linear separation tasks!</text>
  <text x="500" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#d32f2f">This is the fundamental power of deep learning.</text>
  
  <!-- Main title -->
  <text x="500" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#333">Neural Network Data Transformation: Creating Separable Representations</text>
</svg>