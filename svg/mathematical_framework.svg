<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: bold; }
      .section-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 600; }
      .label-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: 600; }
      .desc-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; }
      .math-text { font-family: 'Times New Roman', serif; font-size: 14px; }
      .big-math { font-family: 'Times New Roman', serif; font-size: 16px; font-weight: bold; }
      .small-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10px; }
      .gradient-bg { fill: url(#bgGradient); }
      .card { fill: white; stroke: #e0e0e0; stroke-width: 2; rx: 8; ry: 8; }
      .math-card { fill: #f8f9fa; stroke: #6c757d; stroke-width: 1; rx: 6; ry: 6; }
      .arrow { stroke: #2196F3; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .constraint-box { fill: #e3f2fd; stroke: #2196F3; stroke-width: 1; rx: 4; ry: 4; }
      .method-box { fill: #fff3e0; stroke: #ff9800; stroke-width: 1; rx: 4; ry: 4; }
    </style>
    
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
    
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2196F3" />
    </marker>
    
    <!-- Pattern for optimization landscape -->
    <pattern id="landscapePattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#f0f0f0"/>
      <circle cx="5" cy="15" r="2" fill="#ff4444" opacity="0.6"/>
      <circle cx="15" cy="25" r="3" fill="#4444ff" opacity="0.5"/>
      <circle cx="25" cy="10" r="1.5" fill="#44ff44" opacity="0.7"/>
      <circle cx="35" cy="30" r="2.5" fill="#ff8800" opacity="0.4"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" class="gradient-bg"/>
  
  <!-- Title -->
  <text x="400" y="25" text-anchor="middle" class="title-text" fill="#1565C0">Mathematical Framework for Adversarial Attacks</text>
  
  <!-- Main Problem Formulation -->
  <rect x="50" y="50" width="700" height="100" class="math-card"/>
  <text x="400" y="75" text-anchor="middle" class="section-text" fill="#495057">Core Optimization Problem</text>
  
  <text x="90" y="110" class="big-math" fill="#212529">minimize</text>
  <text x="200" y="110" class="big-math" fill="#d73502">||R||</text>
  <text x="270" y="115" class="desc-text" fill="#6c757d">(perturbation magnitude)</text>
  
  <text x="90" y="135" class="big-math" fill="#212529">subject to:</text>
  <text x="200" y="135" class="big-math" fill="#1976d2">f(X + R) = y*</text>
  <text x="350" y="140" class="desc-text" fill="#6c757d">(target misclassification)</text>

  <!-- Variable Definitions -->
  <rect x="50" y="170" width="340" height="140" class="card"/>
  <text x="220" y="195" text-anchor="middle" class="label-text" fill="#495057">Variable Definitions</text>
  
  <text x="70" y="220" class="math-text" fill="#d73502">X ∈ ℝⁿ:</text>
  <text x="150" y="220" class="desc-text" fill="#212529">Original input image (n-dimensional vector)</text>
  
  <text x="70" y="240" class="math-text" fill="#d73502">R ∈ ℝⁿ:</text>
  <text x="150" y="240" class="desc-text" fill="#212529">Adversarial perturbation vector</text>
  
  <text x="70" y="260" class="math-text" fill="#d73502">f(·):</text>
  <text x="150" y="260" class="desc-text" fill="#212529">Neural network classification function</text>
  
  <text x="70" y="280" class="math-text" fill="#d73502">y*:</text>
  <text x="150" y="280" class="desc-text" fill="#212529">Target adversarial class</text>
  
  <text x="70" y="300" class="math-text" fill="#d73502">||·||:</text>
  <text x="150" y="300" class="desc-text" fill="#212529">Norm function (Linfty, L2, or L1)</text>

  <!-- Constraint Types -->
  <rect x="410" y="170" width="340" height="140" class="card"/>
  <text x="580" y="195" text-anchor="middle" class="label-text" fill="#495057">Common Constraints</text>
  
  <!-- L-infinity constraint -->
  <rect x="430" y="210" width="300" height="25" class="constraint-box"/>
  <text x="440" y="225" class="math-text" fill="#1976d2">||R||∞ ≤ ε</text>
  <text x="540" y="225" class="desc-text" fill="#1565c0">Maximum pixel change</text>
  
  <!-- L2 constraint -->
  <rect x="430" y="240" width="300" height="25" class="constraint-box"/>
  <text x="440" y="255" class="math-text" fill="#1976d2">||R||₂ ≤ δ</text>
  <text x="540" y="255" class="desc-text" fill="#1565c0">Euclidean distance bound</text>
  
  <!-- Box constraint -->
  <rect x="430" y="270" width="300" height="25" class="constraint-box"/>
  <text x="440" y="285" class="math-text" fill="#1976d2">X + R ∈ [0,1]ⁿ</text>
  <text x="540" y="285" class="desc-text" fill="#1565c0">Valid pixel values</text>

  <!-- Attack Methods -->
  <text x="400" y="345" text-anchor="middle" class="section-text" fill="#495057">Popular Attack Methods</text>
  
  <!-- FGSM -->
  <rect x="50" y="360" width="220" height="90" class="method-box"/>
  <text x="160" y="380" text-anchor="middle" class="label-text" fill="#e65100">Fast Gradient Sign Method</text>
  <text x="160" y="395" text-anchor="middle" class="desc-text" fill="#ef6c00">(FGSM)</text>
  <text x="60" y="415" class="math-text" fill="#212529">R = ε · sign(∇ₓJ(θ, X, y))</text>
  <text x="60" y="435" class="small-text" fill="#6c757d">Single-step gradient-based attack</text>

  <!-- PGD -->
  <rect x="290" y="360" width="220" height="90" class="method-box"/>
  <text x="400" y="380" text-anchor="middle" class="label-text" fill="#e65100">Projected Gradient Descent</text>
  <text x="400" y="395" text-anchor="middle" class="desc-text" fill="#ef6c00">(PGD)</text>
  <text x="300" y="415" class="math-text" fill="#212529">Rᵗ⁺¹ = Π(Rᵗ + α·sign(∇J))</text>
  <text x="300" y="435" class="small-text" fill="#6c757d">Iterative gradient-based attack</text>

  <!-- C&W -->
  <rect x="530" y="360" width="220" height="90" class="method-box"/>
  <text x="640" y="380" text-anchor="middle" class="label-text" fill="#e65100">Carlini Wagner</text>
  <text x="640" y="395" text-anchor="middle" class="desc-text" fill="#ef6c00">(C W)</text>
  <text x="540" y="415" class="math-text" fill="#212529">min ||δ||₂ + c·f(X + δ)</text>
  <text x="540" y="435" class="small-text" fill="#6c757d">Optimization-based attack</text>

  <!-- Non-Convex Landscape -->
  <rect x="50" y="470" width="340" height="120" class="card"/>
  <text x="220" y="490" text-anchor="middle" class="label-text" fill="#495057">Optimization Landscape</text>
  
  <!-- Visualization of non-convex surface -->
  <rect x="70" y="500" width="300" height="60" fill="url(#landscapePattern)" stroke="#666"/>
  
  <!-- Multiple local minima -->
  <circle cx="120" cy="520" r="4" fill="#ff4444"/>
  <circle cx="200" cy="540" r="4" fill="#ff4444"/>
  <circle cx="280" cy="515" r="4" fill="#ff4444"/>
  <circle cx="340" cy="535" r="4" fill="#ff4444"/>
  
  <text x="70" y="580" class="desc-text" fill="#6c757d">● Multiple local minima (non-convex)</text>
  <text x="250" y="580" class="desc-text" fill="#6c757d">● Gradient-based solutions</text>

  <!-- Success Rates -->
  <rect x="410" y="470" width="340" height="120" class="card"/>
  <text x="580" y="490" text-anchor="middle" class="label-text" fill="#495057">Attack Success Statistics</text>
  
  <!-- Success rate table -->
  <rect x="430" y="500" width="90" height="20" fill="#f0f0f0"/>
  <text x="475" y="515" text-anchor="middle" class="small-text" fill="#212529">Method</text>
  
  <rect x="520" y="500" width="90" height="20" fill="#f0f0f0"/>
  <text x="565" y="515" text-anchor="middle" class="small-text" fill="#212529">Success Rate</text>
  
  <rect x="610" y="500" width="90" height="20" fill="#f0f0f0"/>
  <text x="655" y="515" text-anchor="middle" class="small-text" fill="#212529">Avg. ε</text>
  
  <!-- Data rows -->
  <rect x="430" y="520" width="90" height="15" fill="#e8f5e8"/>
  <text x="475" y="532" text-anchor="middle" class="small-text" fill="#212529">FGSM</text>
  
  <rect x="520" y="520" width="90" height="15" fill="#e8f5e8"/>
  <text x="565" y="532" text-anchor="middle" class="small-text" fill="#212529">87.3%</text>
  
  <rect x="610" y="520" width="90" height="15" fill="#e8f5e8"/>
  <text x="655" y="532" text-anchor="middle" class="small-text" fill="#212529">0.031</text>
  
  <rect x="430" y="535" width="90" height="15" fill="#fff3e0"/>
  <text x="475" y="547" text-anchor="middle" class="small-text" fill="#212529">PGD</text>
  
  <rect x="520" y="535" width="90" height="15" fill="#fff3e0"/>
  <text x="565" y="547" text-anchor="middle" class="small-text" fill="#212529">96.8%</text>
  
  <rect x="610" y="535" width="90" height="15" fill="#fff3e0"/>
  <text x="655" y="547" text-anchor="middle" class="small-text" fill="#212529">0.047</text>
  
  <rect x="430" y="550" width="90" height="15" fill="#ffebee"/>
  <text x="475" y="562" text-anchor="middle" class="small-text" fill="#212529">C W</text>
  
  <rect x="520" y="550" width="90" height="15" fill="#ffebee"/>
  <text x="565" y="562" text-anchor="middle" class="small-text" fill="#212529">99.2%</text>
  
  <rect x="610" y="550" width="90" height="15" fill="#ffebee"/>
  <text x="655" y="562" text-anchor="middle" class="small-text" fill="#212529">0.089</text>

  <text x="580" y="580" text-anchor="middle" class="small-text" fill="#6c757d">Tested on ImageNet, ResNet-50</text>
</svg>