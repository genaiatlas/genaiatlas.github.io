<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'Arial', sans-serif; font-size: 24px; font-weight: bold; fill: #2c3e50; }
      .phase-title { font-family: 'Arial', sans-serif; font-size: 14px; font-weight: bold; fill: white; }
      .phase-desc { font-family: 'Arial', sans-serif; font-size: 11px; fill: white; }
      .arrow { stroke: #7f8c8d; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .feedback-arrow { stroke: #e74c3c; stroke-width: 2; fill: none; marker-end: url(#arrowhead-red); stroke-dasharray: 5,5; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7f8c8d" />
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title">Data Science Lifecycle Overview</text>
  
  <!-- Phase 1: Business Understanding -->
  <rect x="50" y="60" width="130" height="70" rx="8" fill="#3498db"/>
  <text x="115" y="80" text-anchor="middle" class="phase-title">1. Business</text>
  <text x="115" y="95" text-anchor="middle" class="phase-title">Understanding</text>
  <text x="115" y="110" text-anchor="middle" class="phase-desc">Define problem</text>
  <text x="115" y="122" text-anchor="middle" class="phase-desc">Set success criteria</text>
  
  <!-- Phase 2: Data Understanding -->
  <rect x="220" y="60" width="130" height="70" rx="8" fill="#2ecc71"/>
  <text x="285" y="80" text-anchor="middle" class="phase-title">2. Data</text>
  <text x="285" y="95" text-anchor="middle" class="phase-title">Understanding</text>
  <text x="285" y="110" text-anchor="middle" class="phase-desc">Explore data</text>
  <text x="285" y="122" text-anchor="middle" class="phase-desc">Assess quality</text>
  
  <!-- Phase 3: Data Preparation -->
  <rect x="390" y="60" width="130" height="70" rx="8" fill="#f39c12"/>
  <text x="455" y="80" text-anchor="middle" class="phase-title">3. Data</text>
  <text x="455" y="95" text-anchor="middle" class="phase-title">Preparation</text>
  <text x="455" y="110" text-anchor="middle" class="phase-desc">Clean &amp; transform</text>
  <text x="455" y="122" text-anchor="middle" class="phase-desc">Feature engineering</text>
  
  <!-- Phase 4: Modeling -->
  <rect x="390" y="180" width="130" height="70" rx="8" fill="#9b59b6"/>
  <text x="455" y="200" text-anchor="middle" class="phase-title">4. Modeling</text>
  <text x="455" y="220" text-anchor="middle" class="phase-desc">Build &amp; train</text>
  <text x="455" y="232" text-anchor="middle" class="phase-desc">ML models</text>
  
  <!-- Phase 5: Evaluation -->
  <rect x="220" y="180" width="130" height="70" rx="8" fill="#e67e22"/>
  <text x="285" y="200" text-anchor="middle" class="phase-title">5. Evaluation</text>
  <text x="285" y="220" text-anchor="middle" class="phase-desc">Test performance</text>
  <text x="285" y="232" text-anchor="middle" class="phase-desc">Business impact</text>
  
  <!-- Phase 6: Deployment -->
  <rect x="50" y="180" width="130" height="70" rx="8" fill="#1abc9c"/>
  <text x="115" y="200" text-anchor="middle" class="phase-title">6. Deployment</text>
  <text x="115" y="220" text-anchor="middle" class="phase-desc">Launch model</text>
  <text x="115" y="232" text-anchor="middle" class="phase-desc">Production use</text>
  
  <!-- Forward Flow Arrows -->
  <path d="M 180 95 L 210 95" class="arrow"/>
  <path d="M 350 95 L 380 95" class="arrow"/>
  <path d="M 455 130 L 455 170" class="arrow"/>
  <path d="M 380 215 L 360 215" class="arrow"/>
  <path d="M 210 215 L 190 215" class="arrow"/>
  
  <!-- Feedback Arrows -->
  <path d="M 285 180 L 285 140" class="feedback-arrow"/>
  <path d="M 220 95 L 190 95" class="feedback-arrow"/>
  <path d="M 115 180 L 115 140" class="feedback-arrow"/>
  <path d="M 390 95 L 360 95" class="feedback-arrow"/>
  
  <!-- Center Circle -->
  <circle cx="285" cy="155" r="35" fill="#34495e" opacity="0.8"/>
  <text x="285" y="152" text-anchor="middle" style="font-family: Arial; font-size: 11px; font-weight: bold; fill: white;">Iterative</text>
  <text x="285" y="164" text-anchor="middle" style="font-family: Arial; font-size: 11px; font-weight: bold; fill: white;">Process</text>
  
  <!-- Legend -->
  <text x="50" y="300" style="font-family: Arial; font-size: 14px; font-weight: bold; fill: #2c3e50;">Key Features:</text>
  
  <line x1="50" y1="320" x2="80" y2="320" stroke="#7f8c8d" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="90" y="325" style="font-family: Arial; font-size: 11px; fill: #2c3e50;">Primary workflow</text>
  
  <line x1="50" y1="340" x2="80" y2="340" stroke="#e74c3c" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead-red)"/>
  <text x="90" y="345" style="font-family: Arial; font-size: 11px; fill: #2c3e50;">Feedback loops</text>
  
  <!-- Benefits -->
  <text x="300" y="300" style="font-family: Arial; font-size: 14px; font-weight: bold; fill: #2c3e50;">Benefits:</text>
  <text x="300" y="320" style="font-family: Arial; font-size: 11px; fill: #2c3e50;">• Clear roadmap</text>
  <text x="300" y="335" style="font-family: Arial; font-size: 11px; fill: #2c3e50;">• Quality checkpoints</text>
  <text x="300" y="350" style="font-family: Arial; font-size: 11px; fill: #2c3e50;">• Iterative improvement</text>
  
  <text x="450" y="320" style="font-family: Arial; font-size: 11px; fill: #2c3e50;">• Better communication</text>
  <text x="450" y="335" style="font-family: Arial; font-size: 11px; fill: #2c3e50;">• Risk mitigation</text>
  <text x="450" y="350" style="font-family: Arial; font-size: 11px; fill: #2c3e50;">• Stakeholder alignment</text>
</svg>