<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="800" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="600" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Query Construction Overview
  </text>
  <text x="600" y="70" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#495057">
    Converting Natural Language to Structured Database Queries
  </text>
  
  <!-- User Query -->
  <g id="user-query">
    <rect x="450" y="120" width="300" height="60" rx="10" fill="#fff3bf" stroke="#f59f00" stroke-width="3"/>
    <text x="600" y="145" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#495057">
      Natural Language Query
    </text>
    <text x="600" y="165" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#868e96" font-style="italic">
      "What are the top 10 customers by revenue?"
    </text>
  </g>
  
  <!-- Query Construction Engine -->
  <g id="engine">
    <rect x="400" y="220" width="400" height="80" rx="10" fill="#ff922b" stroke="#f59f00" stroke-width="3"/>
    <text x="600" y="250" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">
      Query Construction Engine
    </text>
    <text x="600" y="275" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">
      Parse Intent → Extract Entities → Generate Query
    </text>
  </g>
  
  <!-- Arrow from query to engine -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#495057"/>
    </marker>
  </defs>
  <line x1="600" y1="180" x2="600" y2="210" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  
  <!-- Three Database Types -->
  
  <!-- 1. Relational DB -->
  <g id="relational">
    <rect x="50" y="360" width="320" height="400" rx="10" fill="#d3f9d8" stroke="#37b24d" stroke-width="3"/>
    <text x="210" y="390" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      📊 Relational DB
    </text>
    <text x="210" y="415" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#495057" font-weight="bold">
      Text-to-SQL
    </text>
    
    <rect x="70" y="430" width="280" height="110" rx="5" fill="#fff" stroke="#37b24d" stroke-width="2"/>
    <text x="210" y="450" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#495057">
      Generated SQL Query
    </text>
    <text x="85" y="475" font-family="Courier New, monospace" font-size="11" fill="#495057">
      SELECT customer_name,
    </text>
    <text x="85" y="492" font-family="Courier New, monospace" font-size="11" fill="#495057">
        SUM(order_amount) AS revenue
    </text>
    <text x="85" y="509" font-family="Courier New, monospace" font-size="11" fill="#495057">
      FROM customers
    </text>
    <text x="85" y="526" font-family="Courier New, monospace" font-size="11" fill="#495057">
      JOIN orders ON ...
    </text>
    
    <rect x="70" y="555" width="280" height="90" rx="5" fill="#f8f9fa" stroke="#37b24d" stroke-width="2"/>
    <text x="210" y="575" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#495057">
      Use Cases
    </text>
    <text x="85" y="595" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Business intelligence queries
    </text>
    <text x="85" y="612" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Analytics &amp; reporting
    </text>
    <text x="85" y="629" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Structured data retrieval
    </text>
    
    <rect x="70" y="660" width="280" height="85" rx="5" fill="#fff9db" stroke="#f59f00" stroke-width="2"/>
    <text x="210" y="680" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#495057">
      Challenges
    </text>
    <text x="85" y="700" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Complex joins &amp; aggregations
    </text>
    <text x="85" y="717" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Schema understanding
    </text>
    <text x="85" y="734" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Ambiguous queries
    </text>
  </g>
  
  <!-- 2. Graph DB -->
  <g id="graph">
    <rect x="420" y="360" width="320" height="400" rx="10" fill="#ffc9c9" stroke="#f03e3e" stroke-width="3"/>
    <text x="580" y="390" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      🕸️ Graph DB
    </text>
    <text x="580" y="415" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#495057" font-weight="bold">
      Text-to-Cypher
    </text>
    
    <rect x="440" y="430" width="280" height="110" rx="5" fill="#fff" stroke="#f03e3e" stroke-width="2"/>
    <text x="580" y="450" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#495057">
      Generated Cypher Query
    </text>
    <text x="455" y="475" font-family="Courier New, monospace" font-size="11" fill="#495057">
      MATCH (c:Customer)
    </text>
    <text x="455" y="492" font-family="Courier New, monospace" font-size="11" fill="#495057">
      -[:PLACED]->(o:Order)
    </text>
    <text x="455" y="509" font-family="Courier New, monospace" font-size="11" fill="#495057">
      RETURN c.name,
    </text>
    <text x="455" y="526" font-family="Courier New, monospace" font-size="11" fill="#495057">
        SUM(o.amount) AS revenue
    </text>
    
    <rect x="440" y="555" width="280" height="90" rx="5" fill="#f8f9fa" stroke="#f03e3e" stroke-width="2"/>
    <text x="580" y="575" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#495057">
      Use Cases
    </text>
    <text x="455" y="595" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Knowledge graphs
    </text>
    <text x="455" y="612" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Relationship mapping
    </text>
    <text x="455" y="629" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Network analysis
    </text>
    
    <rect x="440" y="660" width="280" height="85" rx="5" fill="#fff9db" stroke="#f59f00" stroke-width="2"/>
    <text x="580" y="680" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#495057">
      Challenges
    </text>
    <text x="455" y="700" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Complex path queries
    </text>
    <text x="455" y="717" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Pattern matching syntax
    </text>
    <text x="455" y="734" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Graph schema understanding
    </text>
  </g>
  
  <!-- 3. Vector DB -->
  <g id="vector">
    <rect x="790" y="360" width="360" height="400" rx="10" fill="#d0bfff" stroke="#7950f2" stroke-width="3"/>
    <text x="970" y="390" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      🎯 Vector DB
    </text>
    <text x="970" y="415" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#495057" font-weight="bold">
      Auto-generate Metadata Filters
    </text>
    
    <rect x="810" y="430" width="320" height="110" rx="5" fill="#fff" stroke="#7950f2" stroke-width="2"/>
    <text x="970" y="450" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#495057">
      Generated Filter Query
    </text>
    <text x="825" y="475" font-family="Courier New, monospace" font-size="11" fill="#495057">
      {
    </text>
    <text x="825" y="492" font-family="Courier New, monospace" font-size="11" fill="#495057">
        "metadata": {
    </text>
    <text x="825" y="509" font-family="Courier New, monospace" font-size="11" fill="#495057">
          "customer_type": "premium"
    </text>
    <text x="825" y="526" font-family="Courier New, monospace" font-size="11" fill="#495057">
        }
    </text>
    
    <rect x="810" y="555" width="320" height="90" rx="5" fill="#f8f9fa" stroke="#7950f2" stroke-width="2"/>
    <text x="970" y="575" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#495057">
      Use Cases
    </text>
    <text x="825" y="595" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Semantic search with filters
    </text>
    <text x="825" y="612" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Document retrieval
    </text>
    <text x="825" y="629" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Self-query retrieval
    </text>
    
    <rect x="810" y="660" width="320" height="85" rx="5" fill="#fff9db" stroke="#f59f00" stroke-width="2"/>
    <text x="970" y="680" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#495057">
      Challenges
    </text>
    <text x="825" y="700" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Metadata extraction from query
    </text>
    <text x="825" y="717" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Filter construction
    </text>
    <text x="825" y="734" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Balancing semantic &amp; exact match
    </text>
  </g>
  
  <!-- Arrows from engine to databases -->
  <line x1="500" y1="300" x2="210" y2="350" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="600" y1="300" x2="580" y2="350" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="700" y1="300" x2="970" y2="350" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
</svg>