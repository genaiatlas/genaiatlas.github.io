<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400">
  <defs>
    <linearGradient id="inputGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#4285f4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a73e8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="neuronGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#34a853;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#137333;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="activationGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ea4335;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d33b2c;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="rgba(0,0,0,0.1)"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="400" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#202124">
    Individual Neuron Operations: Linear Classifier with Activation
  </text>

  <!-- Input Section -->
  <text x="100" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f1f1f">
    Inputs
  </text>

  <!-- Input nodes with values -->
  <circle cx="70" cy="100" r="12" fill="url(#inputGrad)" stroke="#1a73e8" stroke-width="2"/>
  <text x="70" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">x₁</text>
  <text x="25" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5f6368">2.5</text>

  <circle cx="70" cy="140" r="12" fill="url(#inputGrad)" stroke="#1a73e8" stroke-width="2"/>
  <text x="70" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">x₂</text>
  <text x="25" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5f6368">1.8</text>

  <circle cx="70" cy="180" r="12" fill="url(#inputGrad)" stroke="#1a73e8" stroke-width="2"/>
  <text x="70" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">x₃</text>
  <text x="25" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5f6368">-0.5</text>

  <circle cx="70" cy="220" r="12" fill="url(#inputGrad)" stroke="#1a73e8" stroke-width="2"/>
  <text x="70" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">x₄</text>
  <text x="25" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5f6368">3.2</text>

  <!-- Weights on connections -->
  <text x="140" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ea4335">w₁=0.8</text>
  <text x="140" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ea4335">w₂=1.2</text>
  <text x="140" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ea4335">w₃=-0.3</text>
  <text x="140" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ea4335">w₄=0.6</text>

  <!-- Connections to neuron -->
  <line x1="82" y1="100" x2="180" y2="160" stroke="#5f6368" stroke-width="2" opacity="0.7"/>
  <line x1="82" y1="140" x2="180" y2="160" stroke="#5f6368" stroke-width="2" opacity="0.7"/>
  <line x1="82" y1="180" x2="180" y2="160" stroke="#5f6368" stroke-width="2" opacity="0.7"/>
  <line x1="82" y1="220" x2="180" y2="160" stroke="#5f6368" stroke-width="2" opacity="0.7"/>

  <!-- Neuron (Summation) -->
  <circle cx="200" cy="160" r="25" fill="url(#neuronGrad)" stroke="#137333" stroke-width="3" filter="url(#shadow)"/>
  <text x="200" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">Σ</text>
  <text x="200" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1f1f1f">
    Weighted Sum
  </text>

  <!-- Bias -->
  <circle cx="200" cy="110" r="10" fill="#ff9800" stroke="#e65100" stroke-width="2"/>
  <text x="200" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">b</text>
  <text x="200" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#e65100">bias = -1.0</text>

  <!-- Mathematical equation box -->
  <rect x="300" y="130" width="180" height="60" fill="#ffffff" stroke="#e0e0e0" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="390" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#202124">
    z = Σ(wᵢ × xᵢ) + b
  </text>
  <text x="390" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5f6368">
    z = (0.8×2.5) + (1.2×1.8) + (-0.3×-0.5) + (0.6×3.2) - 1.0
  </text>
  <text x="390" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#34a853">
    z = 4.27
  </text>

  <!-- Arrow to activation function -->
  <path d="M 490 160 L 530 160" stroke="#5f6368" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Activation function -->
  <rect x="550" y="130" width="120" height="60" fill="url(#activationGrad)" stroke="#d33b2c" stroke-width="3" rx="15" filter="url(#shadow)"/>
  <text x="610" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    Activation
  </text>
  <text x="610" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
    f(z) = ReLU(z)
  </text>

  <!-- Arrow to output -->
  <path d="M 670 160 L 710 160" stroke="#5f6368" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Output -->
  <circle cx="740" cy="160" r="20" fill="#ff9800" stroke="#e65100" stroke-width="3" filter="url(#shadow)"/>
  <text x="740" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">a</text>
  <text x="740" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1f1f1f">
    Output
  </text>
  <text x="740" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#34a853">
    a = 4.27
  </text>

  <!-- ReLU function visualization -->
  <rect x="580" y="230" width="200" height="120" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="5"/>
  <text x="680" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#202124">
    ReLU Activation Function
  </text>
  
  <!-- Mini ReLU graph -->
  <path d="M 600 320 L 680 320 L 680 280 L 760 280" stroke="#ea4335" stroke-width="3" fill="none"/>
  <text x="630" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#5f6368">0</text>
  <text x="600" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#5f6368">f(z)</text>
  <text x="720" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#5f6368">z</text>

  <!-- Decision boundary explanation -->
  <rect x="50" y="280" width="450" height="80" fill="#fff3e0" stroke="#ff9800" stroke-width="1" rx="5"/>
  <text x="275" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e65100">
    Linear Classifier Decision Making
  </text>
  <text x="275" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5f6368">
    • Each neuron acts as a linear classifier with learnable weights and bias
  </text>
  <text x="275" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5f6368">
    • Activation function introduces non-linearity for complex decision boundaries
  </text>
  <text x="275" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5f6368">
    • Multiple neurons ensemble together to solve complex classification problems
  </text>

  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#5f6368" />
    </marker>
  </defs>
</svg>