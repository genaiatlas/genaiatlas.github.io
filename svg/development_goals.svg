<svg viewBox="0 0 1400 1400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glowing orbit path -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <radialGradient id="centralGlow">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <rect width="1400" height="1400" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="700" y="80" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#f8fafc" text-anchor="middle">AI-Assisted Development Goals</text>
  <text x="700" y="120" font-family="Arial, sans-serif" font-size="18" fill="#94a3b8" text-anchor="middle">Four Primary Objectives Orbiting Success</text>
  
  <!-- Orbital rings for visual effect -->
  <circle cx="700" cy="700" r="450" fill="none" stroke="#334155" stroke-width="1" opacity="0.3" stroke-dasharray="10,10"/>
  <circle cx="700" cy="700" r="380" fill="none" stroke="#334155" stroke-width="1" opacity="0.2" stroke-dasharray="5,5"/>
  <circle cx="700" cy="700" r="310" fill="none" stroke="#334155" stroke-width="1" opacity="0.15"/>
  
  <!-- Central Core - AI Hub -->
  <g filter="url(#glow)">
    <circle cx="700" cy="700" r="140" fill="url(#centralGlow)"/>
    <circle cx="700" cy="700" r="110" fill="#1e293b" opacity="0.4"/>
    
    <!-- Core icon -->
    <circle cx="700" cy="670" r="35" fill="#818cf8" opacity="0.3"/>
    <text x="700" y="680" font-family="Arial, sans-serif" font-size="32" fill="#f8fafc" text-anchor="middle">🤖</text>
    
    <!-- Core text -->
    <text x="700" y="730" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#f8fafc" text-anchor="middle">AI-Assisted</text>
    <text x="700" y="755" font-family="Arial, sans-serif" font-size="18" fill="#cbd5e1" text-anchor="middle">Development</text>
  </g>
  
  <!-- Connecting energy beams -->
  <line x1="700" y1="590" x2="700" y2="250" stroke="url(#beam1)" stroke-width="3" opacity="0.4"/>
  <line x1="810" y1="700" x2="1050" y2="700" stroke="url(#beam2)" stroke-width="3" opacity="0.4"/>
  <line x1="700" y1="810" x2="700" y2="1050" stroke="url(#beam3)" stroke-width="3" opacity="0.4"/>
  <line x1="590" y1="700" x2="350" y2="700" stroke="url(#beam4)" stroke-width="3" opacity="0.4"/>
  
  <defs>
    <linearGradient id="beam1">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:0" />
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="beam2">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="beam3">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:0" />
      <stop offset="100%" style="stop-color:#f97316;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="beam4">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:0" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Goal 1: Quality (TOP) -->
  <g transform="translate(520, 170)">
    <rect width="360" height="190" rx="20" fill="#1e293b" stroke="#22c55e" stroke-width="3"/>
    <rect width="360" height="50" rx="20" fill="#22c55e"/>
    
    <!-- Icon circle -->
    <circle cx="45" cy="25" r="18" fill="#dcfce7"/>
    <text x="45" y="32" font-family="Arial, sans-serif" font-size="20" fill="#22c55e" text-anchor="middle">✓</text>
    
    <text x="180" y="33" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">Improve Quality</text>
    
    <g transform="translate(25, 70)">
      <circle cx="6" cy="5" r="3" fill="#22c55e"/>
      <text x="18" y="10" font-family="Arial, sans-serif" font-size="14" fill="#cbd5e1">Lower cognitive load</text>
      
      <circle cx="6" cy="35" r="3" fill="#22c55e"/>
      <text x="18" y="40" font-family="Arial, sans-serif" font-size="14" fill="#cbd5e1">Raise reliability</text>
      
      <circle cx="6" cy="65" r="3" fill="#22c55e"/>
      <text x="18" y="70" font-family="Arial, sans-serif" font-size="14" fill="#cbd5e1">Improve clarity</text>
      
      <circle cx="6" cy="95" r="3" fill="#22c55e"/>
      <text x="18" y="100" font-family="Arial, sans-serif" font-size="14" fill="#cbd5e1">Enhance safety</text>
    </g>
  </g>
  
  <!-- Goal 2: Velocity (RIGHT) -->
  <g transform="translate(1030, 520)">
    <rect width="360" height="190" rx="20" fill="#1e293b" stroke="#3b82f6" stroke-width="3"/>
    <rect width="360" height="50" rx="20" fill="#3b82f6"/>
    
    <circle cx="45" cy="25" r="18" fill="#dbeafe"/>
    <text x="45" y="32" font-family="Arial, sans-serif" font-size="20" fill="#3b82f6" text-anchor="middle">⚡</text>
    
    <text x="180" y="33" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">Increase Velocity</text>
    
    <g transform="translate(25, 70)">
      <circle cx="6" cy="5" r="3" fill="#3b82f6"/>
      <text x="18" y="10" font-family="Arial, sans-serif" font-size="14" fill="#cbd5e1">Compress idea-to-production</text>
      
      <circle cx="6" cy="35" r="3" fill="#3b82f6"/>
      <text x="18" y="40" font-family="Arial, sans-serif" font-size="14" fill="#cbd5e1">Faster feature delivery</text>
      
      <circle cx="6" cy="65" r="3" fill="#3b82f6"/>
      <text x="18" y="70" font-family="Arial, sans-serif" font-size="14" fill="#cbd5e1">Reduced time on routine tasks</text>
      
      <circle cx="6" cy="95" r="3" fill="#3b82f6"/>
      <text x="18" y="100" font-family="Arial, sans-serif" font-size="14" fill="#cbd5e1">Quick iteration cycles</text>
    </g>
  </g>
  
  <!-- Goal 3: Efficacy (BOTTOM) -->
  <g transform="translate(520, 1040)">
    <rect width="360" height="190" rx="20" fill="#1e293b" stroke="#f97316" stroke-width="3"/>
    <rect width="360" height="50" rx="20" fill="#f97316"/>
    
    <circle cx="45" cy="25" r="18" fill="#fed7aa"/>
    <text x="45" y="32" font-family="Arial, sans-serif" font-size="20" fill="#f97316" text-anchor="middle">🎯</text>
    
    <text x="180" y="33" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">Enhance Efficacy</text>
    
    <g transform="translate(25, 70)">
      <circle cx="6" cy="5" r="3" fill="#f97316"/>
      <text x="18" y="10" font-family="Arial, sans-serif" font-size="14" fill="#cbd5e1">Access unfamiliar languages</text>
      
      <circle cx="6" cy="35" r="3" fill="#f97316"/>
      <text x="18" y="40" font-family="Arial, sans-serif" font-size="14" fill="#cbd5e1">Learn new techniques</text>
      
      <circle cx="6" cy="65" r="3" fill="#f97316"/>
      <text x="18" y="70" font-family="Arial, sans-serif" font-size="14" fill="#cbd5e1">Master new libraries</text>
      
      <circle cx="6" cy="95" r="3" fill="#f97316"/>
      <text x="18" y="100" font-family="Arial, sans-serif" font-size="14" fill="#cbd5e1">Broaden capabilities</text>
    </g>
  </g>
  
  <!-- Goal 4: Democratization (LEFT) -->
  <g transform="translate(10, 520)">
    <rect width="360" height="190" rx="20" fill="#1e293b" stroke="#ec4899" stroke-width="3"/>
    <rect width="360" height="50" rx="20" fill="#ec4899"/>
    
    <circle cx="45" cy="25" r="18" fill="#fce7f3"/>
    <text x="45" y="32" font-family="Arial, sans-serif" font-size="20" fill="#ec4899" text-anchor="middle">👥</text>
    
    <text x="180" y="33" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">Democratize Access</text>
    
    <g transform="translate(25, 70)">
      <circle cx="6" cy="5" r="3" fill="#ec4899"/>
      <text x="18" y="10" font-family="Arial, sans-serif" font-size="14" fill="#cbd5e1">Enable non-developers</text>
      
      <circle cx="6" cy="35" r="3" fill="#ec4899"/>
      <text x="18" y="40" font-family="Arial, sans-serif" font-size="14" fill="#cbd5e1">Adjacent roles contribute</text>
      
      <circle cx="6" cy="65" r="3" fill="#ec4899"/>
      <text x="18" y="70" font-family="Arial, sans-serif" font-size="14" fill="#cbd5e1">Safe guardrails in place</text>
      
      <circle cx="6" cy="95" r="3" fill="#ec4899"/>
      <text x="18" y="100" font-family="Arial, sans-serif" font-size="14" fill="#cbd5e1">Cross-functional teams</text>
    </g>
  </g>
  
  <!-- Reinforcing Effects - Circular Banner around center -->
  <g transform="translate(700, 700)">
    <!-- Circular text path -->
    <defs>
      <path id="circlePath1" d="M 0,-190 A 190,190 0 0,1 0,190 A 190,190 0 0,1 0,-190" fill="none"/>
      <path id="circlePath2" d="M 0,-210 A 210,210 0 0,1 0,210 A 210,210 0 0,1 0,-210" fill="none"/>
    </defs>
    
    <!-- Decorative rings -->
    <circle r="200" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.6"/>
    <circle r="220" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.3" stroke-dasharray="5,5"/>
    
    <!-- Text on circular path -->
    <text font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#fbbf24">
      <textPath href="#circlePath1" startOffset="25%">
        💫 REINFORCING EFFECTS 💫
      </textPath>
    </text>
    
    <text font-family="Arial, sans-serif" font-size="13" fill="#fcd34d">
      <textPath href="#circlePath2" startOffset="8%">
        Better quality → Less rework → Higher velocity → Safer contributions → More participation
      </textPath>
    </text>
  </g>
  
  <!-- Orbital indicators -->
  <circle cx="700" cy="250" r="8" fill="#22c55e" filter="url(#glow)"/>
  <circle cx="1050" cy="700" r="8" fill="#3b82f6" filter="url(#glow)"/>
  <circle cx="700" cy="1150" r="8" fill="#f97316" filter="url(#glow)"/>
  <circle cx="350" cy="700" r="8" fill="#ec4899" filter="url(#glow)"/>
  
  <!-- Bottom decorative element -->
  <g transform="translate(550, 1320)">
    <rect width="300" height="3" rx="1.5" fill="#475569"/>
    <text x="150" y="30" font-family="Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Four Objectives | One Vision</text>
  </g>
  
  <!-- Corner accent dots -->
  <circle cx="50" cy="50" r="4" fill="#6366f1" opacity="0.4"/>
  <circle cx="1350" cy="50" r="4" fill="#6366f1" opacity="0.4"/>
  <circle cx="50" cy="1350" r="4" fill="#6366f1" opacity="0.4"/>
  <circle cx="1350" cy="1350" r="4" fill="#6366f1" opacity="0.4"/>
</svg>