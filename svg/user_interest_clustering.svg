<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">User Interest Clustering on Meetup.com</text>
  
  <!-- Subtitle -->
  <text x="400" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#7f8c8d">Grouping users by shared interests and activities</text>
  
  <!-- Music & Arts Cluster -->
  <g id="music-cluster">
    <ellipse cx="180" cy="150" rx="110" ry="75" fill="#e74c3c" opacity="0.15" stroke="#c0392b" stroke-width="2"/>
    <text x="180" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#c0392b">🎵 Music & Arts</text>
    
    <!-- User nodes with better spacing -->
    <circle cx="150" cy="130" r="10" fill="#e74c3c" stroke="white" stroke-width="2"/>
    <text x="150" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white" font-weight="bold">A</text>
    
    <circle cx="210" cy="135" r="10" fill="#e74c3c" stroke="white" stroke-width="2"/>
    <text x="210" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white" font-weight="bold">B</text>
    
    <circle cx="160" cy="165" r="10" fill="#e74c3c" stroke="white" stroke-width="2"/>
    <text x="160" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white" font-weight="bold">C</text>
    
    <circle cx="200" cy="170" r="10" fill="#e74c3c" stroke="white" stroke-width="2"/>
    <text x="200" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white" font-weight="bold">D</text>
    
    <circle cx="180" cy="150" r="10" fill="#e74c3c" stroke="white" stroke-width="2"/>
    <text x="180" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white" font-weight="bold">E</text>
    
    <!-- Cleaner connections -->
    <line x1="150" y1="130" x2="210" y2="135" stroke="#c0392b" stroke-width="1" opacity="0.6"/>
    <line x1="160" y1="165" x2="180" y2="150" stroke="#c0392b" stroke-width="1" opacity="0.6"/>
    <line x1="180" y1="150" x2="200" y2="170" stroke="#c0392b" stroke-width="1" opacity="0.6"/>
    
    <!-- Interest labels with better positioning -->
    <text x="90" y="200" font-family="Arial, sans-serif" font-size="11" fill="#c0392b">• Piano lessons</text>
    <text x="90" y="215" font-family="Arial, sans-serif" font-size="11" fill="#c0392b">• Photography</text>
    <text x="90" y="230" font-family="Arial, sans-serif" font-size="11" fill="#c0392b">• Art galleries</text>
    <text x="90" y="245" font-family="Arial, sans-serif" font-size="11" fill="#c0392b">• Live concerts</text>
  </g>
  
  <!-- Outdoor Sports Cluster -->
  <g id="sports-cluster">
    <ellipse cx="600" cy="150" rx="110" ry="75" fill="#27ae60" opacity="0.15" stroke="#229954" stroke-width="2"/>
    <text x="600" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#229954">🏃 Outdoor Sports</text>
    
    <!-- User nodes with proper spacing -->
    <circle cx="570" cy="130" r="10" fill="#27ae60" stroke="white" stroke-width="2"/>
    <text x="570" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white" font-weight="bold">F</text>
    
    <circle cx="630" cy="135" r="10" fill="#27ae60" stroke="white" stroke-width="2"/>
    <text x="630" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white" font-weight="bold">G</text>
    
    <circle cx="580" cy="165" r="10" fill="#27ae60" stroke="white" stroke-width="2"/>
    <text x="580" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white" font-weight="bold">H</text>
    
    <circle cx="620" cy="170" r="10" fill="#27ae60" stroke="white" stroke-width="2"/>
    <text x="620" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white" font-weight="bold">I</text>
    
    <circle cx="600" cy="150" r="10" fill="#27ae60" stroke="white" stroke-width="2"/>
    <text x="600" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white" font-weight="bold">J</text>
    
    <!-- Connections -->
    <line x1="570" y1="130" x2="630" y2="135" stroke="#229954" stroke-width="1" opacity="0.6"/>
    <line x1="580" y1="165" x2="600" y2="150" stroke="#229954" stroke-width="1" opacity="0.6"/>
    <line x1="600" y1="150" x2="620" y2="170" stroke="#229954" stroke-width="1" opacity="0.6"/>
    
    <!-- Interest labels with proper spacing -->
    <text x="520" y="200" font-family="Arial, sans-serif" font-size="11" fill="#229954">• Rock climbing</text>
    <text x="520" y="215" font-family="Arial, sans-serif" font-size="11" fill="#229954">• Hiking trails</text>
    <text x="520" y="230" font-family="Arial, sans-serif" font-size="11" fill="#229954">• Cycling groups</text>
    <text x="520" y="245" font-family="Arial, sans-serif" font-size="11" fill="#229954">• Marathon training</text>
  </g>
  
  <!-- Tech & Hackathons Cluster -->
  <g id="tech-cluster">
    <ellipse cx="400" cy="380" rx="120" ry="80" fill="#3498db" opacity="0.15" stroke="#2980b9" stroke-width="2"/>
    <text x="400" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2980b9">💻 Tech & Hackathons</text>
    
    <!-- User nodes with improved layout -->
    <circle cx="360" cy="360" r="10" fill="#3498db" stroke="white" stroke-width="2"/>
    <text x="360" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white" font-weight="bold">K</text>
    
    <circle cx="420" cy="365" r="10" fill="#3498db" stroke="white" stroke-width="2"/>
    <text x="420" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white" font-weight="bold">L</text>
    
    <circle cx="380" cy="390" r="10" fill="#3498db" stroke="white" stroke-width="2"/>
    <text x="380" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white" font-weight="bold">M</text>
    
    <circle cx="440" cy="385" r="10" fill="#3498db" stroke="white" stroke-width="2"/>
    <text x="440" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white" font-weight="bold">N</text>
    
    <circle cx="400" cy="375" r="10" fill="#3498db" stroke="white" stroke-width="2"/>
    <text x="400" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white" font-weight="bold">O</text>
    
    <circle cx="370" cy="410" r="10" fill="#3498db" stroke="white" stroke-width="2"/>
    <text x="370" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white" font-weight="bold">P</text>
    
    <!-- Connections -->
    <line x1="360" y1="360" x2="420" y2="365" stroke="#2980b9" stroke-width="1" opacity="0.6"/>
    <line x1="380" y1="390" x2="400" y2="375" stroke="#2980b9" stroke-width="1" opacity="0.6"/>
    <line x1="400" y1="375" x2="440" y2="385" stroke="#2980b9" stroke-width="1" opacity="0.6"/>
    <line x1="370" y1="410" x2="380" y2="390" stroke="#2980b9" stroke-width="1" opacity="0.6"/>
    
    <!-- Interest labels in two columns for better organization -->
    <text x="280" y="450" font-family="Arial, sans-serif" font-size="11" fill="#2980b9">• JavaScript meetups</text>
    <text x="280" y="465" font-family="Arial, sans-serif" font-size="11" fill="#2980b9">• AI/ML workshops</text>
    <text x="280" y="480" font-family="Arial, sans-serif" font-size="11" fill="#2980b9">• Startup events</text>
    <text x="280" y="495" font-family="Arial, sans-serif" font-size="11" fill="#2980b9">• Coding bootcamps</text>
    
    <text x="450" y="450" font-family="Arial, sans-serif" font-size="11" fill="#2980b9">• Open source projects</text>
    <text x="450" y="465" font-family="Arial, sans-serif" font-size="11" fill="#2980b9">• Blockchain talks</text>
    <text x="450" y="480" font-family="Arial, sans-serif" font-size="11" fill="#2980b9">• DevOps conferences</text>
  </g>
  
  <!-- Similarity Explanation Box - repositioned to avoid overlap -->
  <rect x="50" y="300" width="250" height="110" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" rx="5"/>
  <text x="60" y="320" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Similarity Measure:</text>
  <text x="60" y="340" font-family="Arial, sans-serif" font-size="12" fill="#34495e">Number of shared groups</text>
  <text x="60" y="355" font-family="Arial, sans-serif" font-size="12" fill="#34495e">between two users</text>
  
  <text x="60" y="375" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">Example:</text>
  <text x="60" y="390" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">User A and B both in:</text>
  <text x="60" y="405" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">Piano, Photography, Concerts</text>
  <text x="180" y="405" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#e74c3c">→ Similarity = 3</text>
  
  <!-- Process Arrow with better positioning -->
  <path d="M 380 280 Q 390 260 410 280" stroke="#f39c12" stroke-width="3" fill="none" marker-end="url(#arrowhead-orange)"/>
  <text x="340" y="250" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f39c12">Clustering Algorithm</text>
  <text x="360" y="265" font-family="Arial, sans-serif" font-size="10" fill="#f39c12">Groups similar users</text>
  
  <!-- Result Box - repositioned -->
  <rect x="450" y="520" width="320" height="60" fill="#d5dbdb" stroke="#85929e" stroke-width="1" rx="5"/>
  <text x="460" y="540" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Discovered Pattern:</text>
  <text x="460" y="555" font-family="Arial, sans-serif" font-size="11" fill="#34495e">Users naturally group by shared interests without</text>
  <text x="460" y="570" font-family="Arial, sans-serif" font-size="11" fill="#34495e">requiring predefined categories or labels</text>
  
  <!-- Arrow marker definitions -->
  <defs>
    <marker id="arrowhead-orange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f39c12"/>
    </marker>
  </defs>
</svg>