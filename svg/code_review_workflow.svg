<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="800" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="600" y="40" font-size="24" font-weight="bold" text-anchor="middle" fill="#1a1a2e">
    AI-Assisted Code Review Workflow
  </text>
  
  <!-- Left Column: Inputs -->
  <text x="150" y="90" font-size="18" font-weight="bold" fill="#1a1a2e">Inputs</text>
  
  <!-- Code Changes Box -->
  <g transform="translate(50, 110)">
    <rect x="0" y="0" width="200" height="80" rx="8" fill="#fff5e6" stroke="#ff9800" stroke-width="2"/>
    <text x="100" y="30" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a2e">Code Changes</text>
    <text x="100" y="50" font-size="11" text-anchor="middle" fill="#555">• Git Diff</text>
    <text x="100" y="68" font-size="11" text-anchor="middle" fill="#555">• PR Files</text>
  </g>
  
  <!-- Context Box -->
  <g transform="translate(50, 220)">
    <rect x="0" y="0" width="200" height="120" rx="8" fill="#fff5e6" stroke="#ff9800" stroke-width="2"/>
    <text x="100" y="25" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a2e">Context</text>
    <text x="100" y="48" font-size="11" text-anchor="middle" fill="#555">• Project Goals</text>
    <text x="100" y="66" font-size="11" text-anchor="middle" fill="#555">• Conventions</text>
    <text x="100" y="84" font-size="11" text-anchor="middle" fill="#555">• Architecture</text>
    <text x="100" y="102" font-size="11" text-anchor="middle" fill="#555">• Focus Areas</text>
  </g>
  
  <!-- Review Request Box -->
  <g transform="translate(50, 370)">
    <rect x="0" y="0" width="200" height="100" rx="8" fill="#fff5e6" stroke="#ff9800" stroke-width="2"/>
    <text x="100" y="25" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a2e">Review Scope</text>
    <text x="100" y="48" font-size="11" text-anchor="middle" fill="#555">• Full PR</text>
    <text x="100" y="66" font-size="11" text-anchor="middle" fill="#555">• Mid-flight WIP</text>
    <text x="100" y="84" font-size="11" text-anchor="middle" fill="#555">• Focused Diff</text>
  </g>
  
  <!-- Center: AI Review Process -->
  <g transform="translate(400, 200)">
    <rect x="0" y="0" width="300" height="350" rx="12" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3"/>
    <text x="150" y="35" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a1a2e">AI Review Engine</text>
    
    <!-- Step 1 -->
    <g transform="translate(20, 60)">
      <circle cx="15" cy="15" r="15" fill="#4a90e2"/>
      <text x="15" y="20" font-size="12" font-weight="bold" text-anchor="middle" fill="white">1</text>
      <text x="45" y="20" font-size="12" font-weight="bold" fill="#1a1a2e">Parse Code &amp; Context</text>
    </g>
    
    <!-- Step 2 -->
    <g transform="translate(20, 110)">
      <circle cx="15" cy="15" r="15" fill="#4a90e2"/>
      <text x="15" y="20" font-size="12" font-weight="bold" text-anchor="middle" fill="white">2</text>
      <text x="45" y="20" font-size="12" font-weight="bold" fill="#1a1a2e">Analyze Patterns</text>
      <text x="45" y="38" font-size="10" fill="#555">• Style violations</text>
      <text x="45" y="52" font-size="10" fill="#555">• Common bugs</text>
      <text x="45" y="66" font-size="10" fill="#555">• Inconsistencies</text>
    </g>
    
    <!-- Step 3 -->
    <g transform="translate(20, 190)">
      <circle cx="15" cy="15" r="15" fill="#4a90e2"/>
      <text x="15" y="20" font-size="12" font-weight="bold" text-anchor="middle" fill="white">3</text>
      <text x="45" y="20" font-size="12" font-weight="bold" fill="#1a1a2e">Run Automated Tools</text>
      <text x="45" y="38" font-size="10" fill="#555">• Linters</text>
      <text x="45" y="52" font-size="10" fill="#555">• Type checkers</text>
      <text x="45" y="66" font-size="10" fill="#555">• Static analysis</text>
    </g>
    
    <!-- Step 4 -->
    <g transform="translate(20, 270)">
      <circle cx="15" cy="15" r="15" fill="#4a90e2"/>
      <text x="15" y="20" font-size="12" font-weight="bold" text-anchor="middle" fill="white">4</text>
      <text x="45" y="20" font-size="12" font-weight="bold" fill="#1a1a2e">Generate Findings</text>
      <text x="45" y="38" font-size="10" fill="#555">• Categorize issues</text>
      <text x="45" y="52" font-size="10" fill="#555">• Suggest fixes</text>
      <text x="45" y="66" font-size="10" fill="#555">• Provide rationale</text>
    </g>
  </g>
  
  <!-- Right Column: Outputs -->
  <text x="1000" y="90" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a2e">Outputs</text>
  
  <!-- Review Summary -->
  <g transform="translate(850, 110)">
    <rect x="0" y="0" width="280" height="100" rx="8" fill="#e8f8f0" stroke="#27ae60" stroke-width="2"/>
    <text x="140" y="25" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a2e">Review Summary</text>
    <text x="140" y="48" font-size="11" text-anchor="middle" fill="#555">• Overall quality assessment</text>
    <text x="140" y="66" font-size="11" text-anchor="middle" fill="#555">• Key concerns highlighted</text>
    <text x="140" y="84" font-size="11" text-anchor="middle" fill="#555">• Test coverage analysis</text>
  </g>
  
  <!-- Specific Findings -->
  <g transform="translate(850, 240)">
    <rect x="0" y="0" width="280" height="140" rx="8" fill="#e8f8f0" stroke="#27ae60" stroke-width="2"/>
    <text x="140" y="25" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a2e">Specific Findings</text>
    <text x="140" y="50" font-size="11" text-anchor="middle" fill="#555">🔴 Critical: Security issues</text>
    <text x="140" y="70" font-size="11" text-anchor="middle" fill="#555">🟡 Major: Performance problems</text>
    <text x="140" y="90" font-size="11" text-anchor="middle" fill="#555">🟢 Minor: Style inconsistencies</text>
    <text x="140" y="110" font-size="11" text-anchor="middle" fill="#555">📍 File/line references</text>
    <text x="140" y="130" font-size="11" text-anchor="middle" fill="#555">💡 Suggested fixes</text>
  </g>
  
  <!-- Human Review -->
  <g transform="translate(850, 410)">
    <rect x="0" y="0" width="280" height="100" rx="8" fill="#fff0f5" stroke="#e91e63" stroke-width="2"/>
    <text x="140" y="25" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a2e">Human Review Focus</text>
    <text x="140" y="48" font-size="11" text-anchor="middle" fill="#555">• Design decisions</text>
    <text x="140" y="66" font-size="11" text-anchor="middle" fill="#555">• Business logic</text>
    <text x="140" y="84" font-size="11" text-anchor="middle" fill="#555">• Architectural impact</text>
  </g>
  
  <!-- Arrows -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#4a90e2"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#27ae60"/>
    </marker>
  </defs>
  
  <!-- Input to AI arrows -->
  <path d="M 250 150 L 400 250" stroke="#ff9800" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 250 280 L 400 320" stroke="#ff9800" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 250 420 L 400 400" stroke="#ff9800" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  
  <!-- AI to Output arrows -->
  <path d="M 700 250 L 850 160" stroke="#27ae60" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>
  <path d="M 700 375 L 850 310" stroke="#27ae60" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>
  <path d="M 700 450 L 850 460" stroke="#27ae60" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>
  
  <!-- Bottom Note -->
  <g transform="translate(200, 700)">
    <rect x="0" y="0" width="800" height="60" rx="8" fill="#fff" stroke="#4a90e2" stroke-width="2"/>
    <text x="400" y="25" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a2e">
      Key Benefit: AI handles routine checks, humans focus on design and intent
    </text>
    <text x="400" y="45" font-size="12" text-anchor="middle" fill="#555">
      Result: 30-50% faster reviews with improved consistency and quality
    </text>
  </g>
</svg>