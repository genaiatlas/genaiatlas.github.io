<svg width="900" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 24px; font-weight: bold; fill: #2c3e50; }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #34495e; }
      .label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #7f8c8d; }
      .axis { stroke: #34495e; stroke-width: 2; }
      .convex-curve { stroke: #27ae60; stroke-width: 3; fill: none; }
      .nonconvex-curve { stroke: #e74c3c; stroke-width: 3; fill: none; }
      .point { fill: #3498db; stroke: #2980b9; stroke-width: 2; }
      .minimum { fill: #f39c12; stroke: #e67e22; stroke-width: 2; }
      .arrow { stroke: #7f8c8d; stroke-width: 2; fill: #7f8c8d; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="500" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="450" y="35" class="title" text-anchor="middle">Convex vs Non-convex Loss Functions</text>
  
  <!-- Convex function (left side) -->
  <g transform="translate(50, 80)">
    <text x="150" y="20" class="subtitle" text-anchor="middle" fill="#27ae60">Convex Loss Function</text>
    
    <!-- Axes -->
    <line x1="30" y1="300" x2="270" y2="300" class="axis"/>
    <line x1="150" y1="50" x2="150" y2="320" class="axis"/>
    
    <!-- Axis labels -->
    <text x="280" y="305" class="label">w<tspan baseline-shift="sub" font-size="12">ij</tspan></text>
    <text x="140" y="45" class="label">Loss</text>
    
    <!-- Convex curve (parabola) -->
    <path d="M 50 250 Q 150 80 250 250" class="convex-curve"/>
    
    <!-- Global minimum -->
    <circle cx="150" cy="80" r="6" class="minimum"/>
    <text x="150" y="70" class="label" text-anchor="middle" font-weight="bold">Global Min</text>
    
    <!-- Sample starting points -->
    <circle cx="90" cy="170" r="4" class="point"/>
    <circle cx="210" cy="170" r="4" class="point"/>
    
    <!-- Arrows showing convergence -->
    <path d="M 90 170 Q 120 125 140 90" class="arrow" marker-end="url(#arrowhead)"/>
    <path d="M 210 170 Q 180 125 160 90" class="arrow" marker-end="url(#arrowhead)"/>
    
    <!-- Characteristics -->
    <rect x="10" y="340" width="280" height="80" fill="#e8f8f5" stroke="#27ae60" stroke-width="1" rx="5"/>
    <text x="20" y="360" class="label" font-weight="bold" fill="#27ae60">Characteristics:</text>
    <text x="20" y="378" class="label">• Single global minimum</text>
    <text x="20" y="396" class="label">• Guaranteed convergence</text>
    <text x="20" y="414" class="label">• Less sensitive to initialization</text>
  </g>
  
  <!-- Non-convex function (right side) -->
  <g transform="translate(450, 80)">
    <text x="150" y="20" class="subtitle" text-anchor="middle" fill="#e74c3c">Non-convex Loss Function</text>
    
    <!-- Axes -->
    <line x1="30" y1="300" x2="270" y2="300" class="axis"/>
    <line x1="150" y1="50" x2="150" y2="320" class="axis"/>
    
    <!-- Axis labels -->
    <text x="280" y="305" class="label">w<tspan baseline-shift="sub" font-size="12">ij</tspan></text>
    <text x="140" y="45" class="label">Loss</text>
    
    <!-- Non-convex curve with multiple minima -->
    <path d="M 50 180 Q 80 120 100 140 Q 120 160 140 100 Q 160 80 180 120 Q 200 140 220 110 Q 240 90 250 130" class="nonconvex-curve"/>
    
    <!-- Multiple minima -->
    <circle cx="100" cy="140" r="4" class="point"/>
    <text x="100" y="130" class="label" text-anchor="middle" font-size="12">Local Min</text>
    
    <circle cx="160" cy="80" r="6" class="minimum"/>
    <text x="160" y="70" class="label" text-anchor="middle" font-weight="bold">Global Min</text>
    
    <circle cx="220" cy="110" r="4" class="point"/>
    <text x="220" y="100" class="label" text-anchor="middle" font-size="12">Local Min</text>
    
    <!-- Sample starting points showing different outcomes -->
    <circle cx="90" cy="165" r="4" style="fill: #3498db"/>
    <circle cx="210" cy="135" r="4" style="fill: #9b59b6"/>
    
    <!-- Arrows showing different convergence paths -->
    <path d="M 90 165 Q 95 155 100 145" class="arrow" marker-end="url(#arrowhead)" style="stroke: #3498db"/>
    <path d="M 210 135 Q 215 125 220 115" class="arrow" marker-end="url(#arrowhead)" style="stroke: #9b59b6"/>
    
    <!-- Characteristics -->
    <rect x="10" y="340" width="280" height="80" fill="#fdf2f2" stroke="#e74c3c" stroke-width="1" rx="5"/>
    <text x="20" y="360" class="label" font-weight="bold" fill="#e74c3c">Challenges:</text>
    <text x="20" y="378" class="label">• Multiple local minima</text>
    <text x="20" y="396" class="label">• No convergence guarantee</text>
    <text x="20" y="414" class="label">• Highly sensitive to initialization</text>
  </g>
  
  <!-- Comparison arrow -->
  <path d="M 380 250 L 420 250" style="stroke: #95a5a6; stroke-width: 3;" marker-end="url(#arrowhead-gray)"/>
  <text x="400" y="270" class="label" text-anchor="middle" font-weight="bold">vs</text>
  
  <!-- Arrow marker definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
     refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7f8c8d"/>
    </marker>
    <marker id="arrowhead-gray" markerWidth="10" markerHeight="7" 
     refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#95a5a6"/>
    </marker>
  </defs>
</svg>