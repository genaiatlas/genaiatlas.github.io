<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="450" y="30" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    MovieLens Rating Matrix Visualization
  </text>
  <text x="450" y="55" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#666">
    Top 200 Users × Top 500 Items (After Clustering)
  </text>
  
  <!-- Main heatmap container -->
  <g transform="translate(100, 100)">
    <!-- Create checkered pattern to simulate clustered ratings -->
    <!-- Cluster 1 (0-50 users, 0-150 items) -->
    <rect x="0" y="0" width="180" height="100" fill="#2c3e50" opacity="0.8"/>
    
    <!-- Cluster 2 (50-100 users, 150-300 items) -->
    <rect x="180" y="100" width="180" height="100" fill="#34495e" opacity="0.7"/>
    
    <!-- Cluster 3 (100-150 users, 300-450 items) -->
    <rect x="360" y="200" width="180" height="100" fill="#2c3e50" opacity="0.8"/>
    
    <!-- Cluster 4 (150-200 users, 450-500 items) -->
    <rect x="540" y="300" width="100" height="100" fill="#34495e" opacity="0.7"/>
    
    <!-- Add noise/variation to simulate real data -->
    <rect x="20" y="10" width="140" height="80" fill="#ecf0f1" opacity="0.3"/>
    <rect x="200" y="110" width="140" height="80" fill="#bdc3c7" opacity="0.3"/>
    <rect x="380" y="210" width="140" height="80" fill="#ecf0f1" opacity="0.3"/>
    <rect x="560" y="310" width="60" height="80" fill="#bdc3c7" opacity="0.3"/>
    
    <!-- Additional clusters for realistic appearance -->
    <rect x="180" y="0" width="180" height="100" fill="#7f8c8d" opacity="0.5"/>
    <rect x="360" y="100" width="180" height="100" fill="#95a5a6" opacity="0.5"/>
    <rect x="0" y="200" width="180" height="100" fill="#7f8c8d" opacity="0.5"/>
    <rect x="540" y="0" width="100" height="100" fill="#95a5a6" opacity="0.5"/>
    
    <!-- Sparse regions (less activity) -->
    <rect x="0" y="100" width="180" height="100" fill="#ecf0f1" opacity="0.2"/>
    <rect x="360" y="0" width="180" height="100" fill="#ecf0f1" opacity="0.2"/>
    <rect x="180" y="200" width="180" height="100" fill="#ecf0f1" opacity="0.2"/>
    <rect x="0" y="300" width="540" height="100" fill="#ecf0f1" opacity="0.2"/>
    
    <!-- Frame -->
    <rect x="0" y="0" width="640" height="400" fill="none" stroke="#2c3e50" stroke-width="2"/>
  </g>
  
  <!-- X-axis label -->
  <text x="450" y="540" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Items (Movies)
  </text>
  
  <!-- Y-axis label -->
  <g transform="translate(50, 300) rotate(-90)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Users
    </text>
  </g>
  
  <!-- X-axis markers -->
  <text x="100" y="520" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#666">0</text>
  <text x="280" y="520" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666">100</text>
  <text x="460" y="520" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666">300</text>
  <text x="640" y="520" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666">400</text>
  <text x="740" y="520" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#666">500</text>
  
  <!-- Y-axis markers -->
  <text x="85" y="105" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#666">0</text>
  <text x="85" y="205" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#666">50</text>
  <text x="85" y="305" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#666">100</text>
  <text x="85" y="405" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#666">150</text>
  <text x="85" y="505" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#666">200</text>
  
  <!-- Color legend -->
  <g transform="translate(770, 200)">
    <text x="0" y="-10" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Rating Intensity</text>
    <rect x="0" y="0" width="30" height="20" fill="#2c3e50" opacity="0.9"/>
    <text x="35" y="15" font-family="Arial, sans-serif" font-size="11" fill="#666">High (5)</text>
    
    <rect x="0" y="30" width="30" height="20" fill="#34495e" opacity="0.7"/>
    <text x="35" y="45" font-family="Arial, sans-serif" font-size="11" fill="#666">Med-High (4)</text>
    
    <rect x="0" y="60" width="30" height="20" fill="#7f8c8d" opacity="0.5"/>
    <text x="35" y="75" font-family="Arial, sans-serif" font-size="11" fill="#666">Medium (3)</text>
    
    <rect x="0" y="90" width="30" height="20" fill="#95a5a6" opacity="0.3"/>
    <text x="35" y="105" font-family="Arial, sans-serif" font-size="11" fill="#666">Low (1-2)</text>
    
    <rect x="0" y="120" width="30" height="20" fill="#ecf0f1" opacity="0.2"/>
    <text x="35" y="135" font-family="Arial, sans-serif" font-size="11" fill="#666">No Rating</text>
  </g>
  
  <!-- Insight Box -->
  <g transform="translate(100, 570)">
    <rect x="0" y="0" width="640" height="80" fill="#e8f4fd" stroke="#2196f3" stroke-width="2" rx="5"/>
    <text x="320" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1565c0">
      Pattern Analysis
    </text>
    <text x="15" y="45" font-family="Arial, sans-serif" font-size="12" fill="#424242">
      • Checkered pattern indicates successful clustering with distinct user-item groups
    </text>
    <text x="15" y="65" font-family="Arial, sans-serif" font-size="12" fill="#424242">
      • Dark regions show high within-cluster similarity (similar preferences)
    </text>
  </g>
</svg>