<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="acfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498DB;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#2980B9;stop-opacity:0.9"/>
    </linearGradient>
    <linearGradient id="pacfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E74C3C;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#C0392B;stop-opacity:0.9"/>
    </linearGradient>
    <linearGradient id="confGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#95A5A6;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#7F8C8D;stop-opacity:0.5"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="700" fill="#FAFAFA"/>
  
  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2C3E50">
    Autocorrelation Functions: ACF, PACF and Statistical Testing
  </text>
  
  <!-- ACF Plot -->
  <g transform="translate(80, 70)">
    <text x="150" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#3498DB">
      Autocorrelation Function (ACF)
    </text>
    
    <!-- Axes -->
    <line x1="30" y1="150" x2="270" y2="150" stroke="#34495E" stroke-width="2"/>
    <line x1="30" y1="50" x2="30" y2="150" stroke="#34495E" stroke-width="2"/>
    
    <!-- Confidence bands -->
    <rect x="30" y="120" width="240" height="10" fill="url(#confGrad)" opacity="0.5"/>
    <rect x="30" y="140" width="240" height="10" fill="url(#confGrad)" opacity="0.5"/>
    
    <!-- ACF bars -->
    <rect x="45" y="60" width="8" height="90" fill="#3498DB"/>
    <rect x="60" y="80" width="8" height="70" fill="#3498DB"/>
    <rect x="75" y="95" width="8" height="55" fill="#3498DB"/>
    <rect x="90" y="105" width="8" height="45" fill="#3498DB"/>
    <rect x="105" y="115" width="8" height="35" fill="#3498DB"/>
    <rect x="120" y="130" width="8" height="20" fill="#3498DB"/>
    <rect x="135" y="135" width="8" height="15" fill="#3498DB"/>
    <rect x="150" y="140" width="8" height="10" fill="#3498DB"/>
    <rect x="165" y="145" width="8" height="5" fill="#3498DB"/>
    <rect x="180" y="155" width="8" height="5" fill="#E74C3C" transform="translate(0, -10)"/>
    <rect x="195" y="148" width="8" height="2" fill="#3498DB"/>
    <rect x="210" y="147" width="8" height="3" fill="#3498DB"/>
    <rect x="225" y="149" width="8" height="1" fill="#3498DB"/>
    <rect x="240" y="148" width="8" height="2" fill="#3498DB"/>
    <rect x="255" y="149" width="8" height="1" fill="#3498DB"/>
    
    <!-- Axis labels -->
    <text x="150" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">Lag</text>
    <text x="20" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666" transform="rotate(-90, 20, 55)">ACF</text>
    
    <!-- Lag numbers -->
    <text x="49" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">1</text>
    <text x="79" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">3</text>
    <text x="109" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">5</text>
    <text x="169" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">9</text>
    <text x="229" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">13</text>
    
    <!-- Confidence band labels -->
    <text x="275" y="127" font-family="Arial, sans-serif" font-size="9" fill="#7F8C8D">95% CI</text>
    <text x="275" y="147" font-family="Arial, sans-serif" font-size="9" fill="#7F8C8D">95% CI</text>
    
    <text x="150" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">
      Exponential decay pattern suggests AR process
    </text>
  </g>
  
  <!-- PACF Plot -->
  <g transform="translate(420, 70)">
    <text x="150" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#E74C3C">
      Partial Autocorrelation Function (PACF)
    </text>
    
    <!-- Axes -->
    <line x1="30" y1="150" x2="270" y2="150" stroke="#34495E" stroke-width="2"/>
    <line x1="30" y1="50" x2="30" y2="150" stroke="#34495E" stroke-width="2"/>
    
    <!-- Confidence bands -->
    <rect x="30" y="120" width="240" height="10" fill="url(#confGrad)" opacity="0.5"/>
    <rect x="30" y="140" width="240" height="10" fill="url(#confGrad)" opacity="0.5"/>
    
    <!-- PACF bars - cuts off after lag 2 (AR(2) process) -->
    <rect x="45" y="70" width="8" height="80" fill="#E74C3C"/>
    <rect x="60" y="90" width="8" height="60" fill="#E74C3C"/>
    <rect x="75" y="145" width="8" height="5" fill="#E74C3C"/>
    <rect x="90" y="148" width="8" height="2" fill="#E74C3C"/>
    <rect x="105" y="155" width="8" height="5" fill="#95A5A6" transform="translate(0, -10)"/>
    <rect x="120" y="147" width="8" height="3" fill="#E74C3C"/>
    <rect x="135" y="149" width="8" height="1" fill="#E74C3C"/>
    <rect x="150" y="148" width="8" height="2" fill="#E74C3C"/>
    <rect x="165" y="155" width="8" height="5" fill="#95A5A6" transform="translate(0, -10)"/>
    <rect x="180" y="147" width="8" height="3" fill="#E74C3C"/>
    <rect x="195" y="149" width="8" height="1" fill="#E74C3C"/>
    <rect x="210" y="148" width="8" height="2" fill="#E74C3C"/>
    <rect x="225" y="149" width="8" height="1" fill="#E74C3C"/>
    <rect x="240" y="155" width="8" height="5" fill="#95A5A6" transform="translate(0, -10)"/>
    <rect x="255" y="148" width="8" height="2" fill="#E74C3C"/>
    
    <!-- Axis labels -->
    <text x="150" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">Lag</text>
    <text x="20" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666" transform="rotate(-90, 20, 55)">PACF</text>
    
    <!-- Lag numbers -->
    <text x="49" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">1</text>
    <text x="79" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">3</text>
    <text x="109" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">5</text>
    <text x="169" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">9</text>
    <text x="229" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">13</text>
    
    <!-- Confidence band labels -->
    <text x="275" y="127" font-family="Arial, sans-serif" font-size="9" fill="#7F8C8D">95% CI</text>
    <text x="275" y="147" font-family="Arial, sans-serif" font-size="9" fill="#7F8C8D">95% CI</text>
    
    <text x="150" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">
      Cutoff after lag 2 suggests AR(2) process
    </text>
  </g>
  
  <!-- Mathematical formulations and testing -->
  <g transform="translate(50, 280)">
    <rect x="0" y="0" width="900" height="390" fill="#F8F9FA" stroke="#DDD" stroke-width="1" rx="8" filter="url(#shadow)"/>
    
    <text x="20" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2C3E50">Autocorrelation Analysis: Mathematical Framework and Testing</text>
    
    <!-- Left column: Definitions -->
    <g transform="translate(30, 60)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#3498DB">Autocorrelation Function:</text>
      <text x="0" y="25" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50">ρ(h) = γ(h) / γ(0)</text>
      <text x="0" y="45" font-family="Arial, sans-serif" font-size="12" fill="#666">where γ(h) = Cov[Y(t), Y(t+h)]</text>
      
      <text x="0" y="80" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#E74C3C">Sample ACF:</text>
      <text x="0" y="105" font-family="Arial, sans-serif" font-size="13" fill="#2C3E50">r(h) = Σ (yₜ - ȳ)(yₜ₋ₕ - ȳ) / Σ (yₜ - ȳ)²</text>
      
      <text x="0" y="140" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#27AE60">Properties:</text>
      <text x="0" y="165" font-family="Arial, sans-serif" font-size="12" fill="#333">• ρ(0) = 1 (perfect correlation with itself)</text>
      <text x="0" y="180" font-family="Arial, sans-serif" font-size="12" fill="#333">• ρ(h) = ρ(-h) (symmetric function)</text>
      <text x="0" y="195" font-family="Arial, sans-serif" font-size="12" fill="#333">• |ρ(h)| ≤ 1 (bounded correlation)</text>
      <text x="0" y="210" font-family="Arial, sans-serif" font-size="12" fill="#333">• ρ(h) → 0 as h → ∞ (for stationary series)</text>
      
      <text x="0" y="245" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8E44AD">PACF Definition:</text>
      <text x="0" y="270" font-family="Arial, sans-serif" font-size="12" fill="#333">Correlation between Y(t) and Y(t+h) after</text>
      <text x="0" y="285" font-family="Arial, sans-serif" font-size="12" fill="#333">removing linear dependence on</text>
      <text x="0" y="300" font-family="Arial, sans-serif" font-size="12" fill="#333">Y(t+1), Y(t+2), ..., Y(t+h-1)</text>
      
      <text x="0" y="330" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#D35400">Confidence Intervals:</text>
      <text x="0" y="355" font-family="Arial, sans-serif" font-size="13" fill="#2C3E50">For white noise: ±1.96/√n (95% CI)</text>
    </g>
    
    <!-- Right column: Testing and interpretation -->
    <g transform="translate(450, 60)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#C0392B">Ljung-Box Test:</text>
      <text x="0" y="25" font-family="Arial, sans-serif" font-size="13" fill="#2C3E50">Q* = n(n+2) Σ r²(h)/(n-h)</text>
      <text x="0" y="45" font-family="Arial, sans-serif" font-size="12" fill="#666">Under H₀: ρ(1) = ... = ρ(H) = 0</text>
      <text x="0" y="60" font-family="Arial, sans-serif" font-size="12" fill="#666">Q* ~ χ²(H) distribution</text>
      
      <text x="0" y="95" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#16A085">Pattern Identification:</text>
      
      <text x="0" y="120" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#E74C3C">AR(p) Process:</text>
      <text x="0" y="135" font-family="Arial, sans-serif" font-size="12" fill="#333">• ACF: Exponential decay/damped oscillation</text>
      <text x="0" y="150" font-family="Arial, sans-serif" font-size="12" fill="#333">• PACF: Cuts off after lag p</text>
      
      <text x="0" y="175" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#3498DB">MA(q) Process:</text>
      <text x="0" y="190" font-family="Arial, sans-serif" font-size="12" fill="#333">• ACF: Cuts off after lag q</text>
      <text x="0" y="205" font-family="Arial, sans-serif" font-size="12" fill="#333">• PACF: Exponential decay/damped oscillation</text>
      
      <text x="0" y="230" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#27AE60">ARMA(p,q) Process:</text>
      <text x="0" y="245" font-family="Arial, sans-serif" font-size="12" fill="#333">• ACF: Exponential decay after lag (q-p)</text>
      <text x="0" y="260" font-family="Arial, sans-serif" font-size="12" fill="#333">• PACF: Exponential decay after lag (p-q)</text>
      
      <text x="0" y="285" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#8E44AD">Non-stationary:</text>
      <text x="0" y="300" font-family="Arial, sans-serif" font-size="12" fill="#333">• ACF: Very slow decay (near unit root)</text>
      <text x="0" y="315" font-family="Arial, sans-serif" font-size="12" fill="#333">• PACF: First lag near 1, others small</text>
      
      <text x="0" y="340" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#F39C12">Seasonal Patterns:</text>
      <text x="0" y="355" font-family="Arial, sans-serif" font-size="12" fill="#333">• ACF/PACF: Spikes at seasonal lags</text>
    </g>
  </g>
</svg>