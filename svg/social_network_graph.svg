<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="900" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">Social Network Graph: Beyond Feature Vectors</text>
  <text x="450" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#7f8c8d">Dr. Simpson's Monk Social Network Study (1960s)</text>
  
  <!-- Problem statement -->
  <rect x="50" y="70" width="800" height="60" fill="#fff3cd" stroke="#f39c12" stroke-width="2" rx="5"/>
  <text x="450" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f39c12">Challenge: No Traditional Feature Vectors Available</text>
  <text x="450" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Data: Monks are data points, but we only know "who talks to whom"</text>
  <text x="450" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Question: Can we use K-Means to find friend groups? Answer: It's going to be hard!</text>
  
  <!-- Graph representation -->
  <rect x="50" y="160" width="550" height="380" fill="#f0f8f0" stroke="#27ae60" stroke-width="2" rx="5"/>
  <text x="325" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#229954">Graph Structure: Nodes and Edges</text>
  
  <!-- Main graph visualization -->
  <g transform="translate(100, 200)">
    <!-- Group 1: Close-knit friend group (top-left) -->
    <g>
      <!-- Nodes in group 1 -->
      <circle cx="80" cy="80" r="20" fill="#e74c3c" stroke="#c0392b" stroke-width="3"/>
      <text x="80" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">M1</text>
      
      <circle cx="120" cy="60" r="20" fill="#e74c3c" stroke="#c0392b" stroke-width="3"/>
      <text x="120" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">M2</text>
      
      <circle cx="140" cy="100" r="20" fill="#e74c3c" stroke="#c0392b" stroke-width="3"/>
      <text x="140" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">M3</text>
      
      <circle cx="100" cy="120" r="20" fill="#e74c3c" stroke="#c0392b" stroke-width="3"/>
      <text x="100" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">M4</text>
      
      <!-- Dense connections within group 1 -->
      <line x1="80" y1="80" x2="120" y2="60" stroke="#2c3e50" stroke-width="2"/>
      <line x1="120" y1="60" x2="140" y2="100" stroke="#2c3e50" stroke-width="2"/>
      <line x1="140" y1="100" x2="100" y2="120" stroke="#2c3e50" stroke-width="2"/>
      <line x1="100" y1="120" x2="80" y2="80" stroke="#2c3e50" stroke-width="2"/>
      <line x1="80" y1="80" x2="140" y2="100" stroke="#2c3e50" stroke-width="2"/>
      <line x1="120" y1="60" x2="100" y2="120" stroke="#2c3e50" stroke-width="2"/>
    </g>
    
    <!-- Group 2: Another close-knit group (top-right) -->
    <g>
      <!-- Nodes in group 2 -->
      <circle cx="320" cy="80" r="20" fill="#3498db" stroke="#2980b9" stroke-width="3"/>
      <text x="320" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">M5</text>
      
      <circle cx="360" cy="60" r="20" fill="#3498db" stroke="#2980b9" stroke-width="3"/>
      <text x="360" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">M6</text>
      
      <circle cx="380" cy="100" r="20" fill="#3498db" stroke="#2980b9" stroke-width="3"/>
      <text x="380" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">M7</text>
      
      <circle cx="340" cy="120" r="20" fill="#3498db" stroke="#2980b9" stroke-width="3"/>
      <text x="340" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">M8</text>
      
      <!-- Dense connections within group 2 -->
      <line x1="320" y1="80" x2="360" y2="60" stroke="#2c3e50" stroke-width="2"/>
      <line x1="360" y1="60" x2="380" y2="100" stroke="#2c3e50" stroke-width="2"/>
      <line x1="380" y1="100" x2="340" y2="120" stroke="#2c3e50" stroke-width="2"/>
      <line x1="340" y1="120" x2="320" y2="80" stroke="#2c3e50" stroke-width="2"/>
      <line x1="320" y1="80" x2="380" y2="100" stroke="#2c3e50" stroke-width="2"/>
      <line x1="360" y1="60" x2="340" y2="120" stroke="#2c3e50" stroke-width="2"/>
    </g>
    
    <!-- Group 3: Loosely connected group (bottom) -->
    <g>
      <!-- Nodes in group 3 -->
      <circle cx="200" cy="200" r="20" fill="#9b59b6" stroke="#8e44ad" stroke-width="3"/>
      <text x="200" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">M9</text>
      
      <circle cx="240" cy="180" r="20" fill="#9b59b6" stroke="#8e44ad" stroke-width="3"/>
      <text x="240" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">M10</text>
      
      <circle cx="260" cy="220" r="20" fill="#9b59b6" stroke="#8e44ad" stroke-width="3"/>
      <text x="260" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">M11</text>
      
      <!-- Sparser connections within group 3 -->
      <line x1="200" y1="200" x2="240" y2="180" stroke="#2c3e50" stroke-width="2"/>
      <line x1="240" y1="180" x2="260" y2="220" stroke="#2c3e50" stroke-width="2"/>
      <line x1="200" y1="200" x2="260" y2="220" stroke="#2c3e50" stroke-width="2"/>
    </g>
    
    <!-- Bridge connections (few edges between groups) -->
    <line x1="140" y1="100" x2="200" y2="200" stroke="#95a5a6" stroke-width="1" stroke-dasharray="5,5"/>
    <line x1="320" y1="80" x2="240" y2="180" stroke="#95a5a6" stroke-width="1" stroke-dasharray="5,5"/>
    
    <!-- Isolated nodes -->
    <circle cx="450" cy="150" r="20" fill="#f39c12" stroke="#e67e22" stroke-width="3"/>
    <text x="450" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">M12</text>
    
    <!-- Connection to isolated node -->
    <line x1="380" y1="100" x2="450" y2="150" stroke="#95a5a6" stroke-width="1" stroke-dasharray="5,5"/>
    
    <!-- Group labels -->
    <text x="110" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#c0392b">Friend Group A</text>
    <text x="350" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2980b9">Friend Group B</text>
    <text x="230" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#8e44ad">Acquaintances</text>
    <text x="450" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e67e22">Loner</text>
  </g>
  
  <!-- Graph properties panel -->
  <rect x="630" y="160" width="220" height="380" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2" rx="5"/>
  <text x="740" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Graph Properties</text>
  
  <g font-family="Arial, sans-serif" font-size="11">
    <!-- Nodes -->
    <text x="640" y="205" font-weight="bold" fill="#2c3e50">Nodes (Vertices):</text>
    <text x="640" y="220" fill="#2c3e50">• Represent monks (data points)</text>
    <text x="640" y="235" fill="#2c3e50">• N = 12 monks total</text>
    <text x="640" y="250" fill="#2c3e50">• No feature vectors available</text>
    
    <!-- Edges -->
    <text x="640" y="275" font-weight="bold" fill="#2c3e50">Edges:</text>
    <text x="640" y="290" fill="#2c3e50">• Represent "talks to" relationship</text>
    <text x="640" y="305" fill="#2c3e50">• Thick lines: frequent interaction</text>
    <text x="640" y="320" fill="#2c3e50">• Dashed lines: rare interaction</text>
    
    <!-- Community structure -->
    <text x="640" y="345" font-weight="bold" fill="#2c3e50">Community Structure:</text>
    <text x="640" y="360" fill="#2c3e50">• Dense edges within groups</text>
    <text x="640" y="375" fill="#2c3e50">• Sparse edges between groups</text>
    <text x="640" y="390" fill="#2c3e50">• Clear clustering pattern</text>
    
    <!-- Mathematical representation -->
    <text x="640" y="415" font-weight="bold" fill="#2c3e50">Adjacency Matrix A:</text>
    <text x="640" y="430" fill="#2c3e50">• A[i,j] = 1 if monks i,j talk</text>
    <text x="640" y="445" fill="#2c3e50">• A[i,j] = 0 otherwise</text>
    <text x="640" y="460" fill="#2c3e50">• Symmetric matrix (A = A<tspan baseline-shift="super" font-size="9">T</tspan>)</text>
    
    <!-- Alternative approaches -->
    <text x="640" y="485" font-weight="bold" fill="#e74c3c">Why K-Means Fails:</text>
    <text x="640" y="500" fill="#2c3e50">• No distance metric in</text>
    <text x="640" y="512" fill="#2c3e50">  original space</text>
    <text x="640" y="525" fill="#2c3e50">• No centroid concept</text>
  </g>
  
  <!-- Solution approaches -->
  <rect x="50" y="560" width="800" height="30" fill="#e8f4fd" stroke="#3498db" stroke-width="2" rx="5"/>
  <text x="450" y="578" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2980b9">Solution: Spectral Clustering &amp; Graph-Based Methods</text>
  <text x="450" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Use graph structure directly - eigenanalysis of adjacency/Laplacian matrix reveals communities</text>
</svg>