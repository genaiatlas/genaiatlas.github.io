<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">A Unit in a Neural Network: Three-Step Process</text>
  
  <!-- Input nodes -->
  <g id="inputs">
    <circle cx="80" cy="120" r="15" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="80" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1e40af">x₁</text>
    
    <circle cx="80" cy="180" r="15" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="80" y="186" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1e40af">x₂</text>
    
    <circle cx="80" cy="240" r="15" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="80" y="246" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1e40af">x₃</text>
    
    <circle cx="80" cy="300" r="15" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="80" y="306" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1e40af">x₄</text>
  </g>
  
  <!-- Weight labels -->
  <g id="weights" fill="#7c3aed" font-family="Arial, sans-serif" font-size="10">
    <text x="140" y="110" text-anchor="middle">w₁</text>
    <text x="140" y="170" text-anchor="middle">w₂</text>
    <text x="140" y="230" text-anchor="middle">w₃</text>
    <text x="140" y="290" text-anchor="middle">w₄</text>
  </g>
  
  <!-- Connections with weights -->
  <g stroke="#7c3aed" stroke-width="2">
    <line x1="95" y1="120" x2="200" y2="210" marker-end="url(#arrowhead)"/>
    <line x1="95" y1="180" x2="200" y2="210" marker-end="url(#arrowhead)"/>
    <line x1="95" y1="240" x2="200" y2="210" marker-end="url(#arrowhead)"/>
    <line x1="95" y1="300" x2="200" y2="210" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- Neuron -->
  <g id="neuron">
    <circle cx="220" cy="210" r="35" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
    <text x="220" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#92400e">Σ</text>
    <text x="220" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#92400e">Z</text>
  </g>
  
  <!-- Activation function -->
  <g id="activation">
    <rect x="300" y="185" width="60" height="50" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
    <text x="330" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#065f46">f(Z)</text>
    <text x="330" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#065f46">Activation</text>
  </g>
  
  <!-- Output -->
  <g id="output">
    <circle cx="420" cy="210" r="20" fill="#fecaca" stroke="#ef4444" stroke-width="2"/>
    <text x="420" y="216" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#991b1b">f</text>
  </g>
  
  <!-- Connections neuron to activation to output -->
  <g stroke="#4b5563" stroke-width="2">
    <line x1="255" y1="210" x2="300" y2="210" marker-end="url(#arrowhead)"/>
    <line x1="360" y1="210" x2="400" y2="210" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4b5563"/>
    </marker>
  </defs>
  
  <!-- Step descriptions -->
  <g id="step-descriptions">
    <!-- Step 1 -->
    <rect x="50" y="350" width="200" height="80" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
    <text x="60" y="375" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e40af">Step 1: Multiply</text>
    <text x="60" y="395" font-family="Arial, sans-serif" font-size="11" fill="#1e40af">Input signals × weights</text>
    <text x="60" y="410" font-family="Arial, sans-serif" font-size="10" fill="#475569">x₁×w₁, x₂×w₂, x₃×w₃, x₄×w₄</text>
    
    <!-- Step 2 -->
    <rect x="270" y="350" width="200" height="80" rx="8" fill="#fef9e7" stroke="#f59e0b" stroke-width="1"/>
    <text x="280" y="375" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#92400e">Step 2: Sum</text>
    <text x="280" y="395" font-family="Arial, sans-serif" font-size="11" fill="#92400e">Add weighted products</text>
    <text x="280" y="410" font-family="Arial, sans-serif" font-size="10" fill="#475569">Z = Σ(xᵢ × wᵢ)</text>
    
    <!-- Step 3 -->
    <rect x="490" y="350" width="200" height="80" rx="8" fill="#f0fdf4" stroke="#10b981" stroke-width="1"/>
    <text x="500" y="375" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#065f46">Step 3: Activate</text>
    <text x="500" y="395" font-family="Arial, sans-serif" font-size="11" fill="#065f46">Apply activation function</text>
    <text x="500" y="410" font-family="Arial, sans-serif" font-size="10" fill="#475569">f(Z) → final output</text>
  </g>
  
  <!-- Mathematical equation -->
  <g id="equation">
    <rect x="100" y="460" width="600" height="60" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="400" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">Mathematical Formula:</text>
    <text x="400" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#475569">Z = X₁ × W₁ + X₂ × W₂ + X₃ × W₃ + X₄ × W₄</text>
  </g>
  
  <!-- Weight impact explanation -->
  <g id="weight-impact">
    <rect x="50" y="540" width="700" height="45" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
    <text x="60" y="560" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#991b1b">Weight Impact:</text>
    <text x="60" y="575" font-family="Arial, sans-serif" font-size="10" fill="#7f1d1d">• Zero weight = Input ignored (×0) • Positive weight = Positive contribution • Negative weight = Negative contribution</text>
  </g>
  
  <!-- Threshold function example (small) -->
  <g id="threshold-example">
    <rect x="500" y="50" width="250" height="130" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1"/>
    <text x="625" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">Threshold Function Example</text>
    
    <!-- Simple step function graph -->
    <g transform="translate(520, 90)">
      <rect width="100" height="70" fill="white" stroke="#cbd5e1" stroke-width="1"/>
      <line x1="0" y1="50" x2="50" y2="50" stroke="#3b82f6" stroke-width="2"/>
      <line x1="50" y1="50" x2="50" y2="20" stroke="#3b82f6" stroke-width="2"/>
      <line x1="50" y1="20" x2="100" y2="20" stroke="#3b82f6" stroke-width="2"/>
      <text x="10" y="45" font-family="Arial, sans-serif" font-size="8" fill="#64748b">0</text>
      <text x="85" y="17" font-family="Arial, sans-serif" font-size="8" fill="#64748b">1</text>
      <text x="45" y="68" font-family="Arial, sans-serif" font-size="8" fill="#64748b">threshold</text>
    </g>
    
    <text x="640" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#64748b">f(z) = 1 if z ≥ threshold, else 0</text>
  </g>
</svg>