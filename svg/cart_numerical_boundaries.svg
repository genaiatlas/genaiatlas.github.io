<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="softShadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
    <pattern id="redClass" patternUnits="userSpaceOnUse" width="6" height="6">
      <rect width="6" height="6" fill="#ffebee"/>
      <circle cx="3" cy="3" r="1.5" fill="#e74c3c"/>
    </pattern>
    <pattern id="blueClass" patternUnits="userSpaceOnUse" width="6" height="6">
      <rect width="6" height="6" fill="#e3f2fd"/>
      <rect x="1" y="1" width="4" height="4" fill="#3498db"/>
    </pattern>
  </defs>
  
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">CART for Numerical Variables</text>
  
  <!-- Decision Tree Visualization -->
  <g id="tree-section">
    <text x="180" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#34495e">Decision Tree Structure</text>
    
    <!-- Root Node -->
    <rect x="130" y="90" width="100" height="50" fill="#9b59b6" stroke="#8e44ad" stroke-width="2" filter="url(#softShadow)"/>
    <text x="180" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">X₁ ≥ 0.3?</text>
    <text x="180" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">a^T x + b ≥ 0</text>
    
    <!-- Left Branch -->
    <line x1="150" y1="140" x2="100" y2="180" stroke="#34495e" stroke-width="2"/>
    <text x="110" y="165" font-family="Arial, sans-serif" font-size="10" fill="#34495e">Yes</text>
    
    <rect x="50" y="190" width="80" height="40" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
    <text x="90" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">X₂ ≥ 0.7?</text>
    <text x="90" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Linear split</text>
    
    <!-- Right Branch -->
    <line x1="210" y1="140" x2="260" y2="180" stroke="#34495e" stroke-width="2"/>
    <text x="245" y="165" font-family="Arial, sans-serif" font-size="10" fill="#34495e">No</text>
    
    <rect x="220" y="190" width="80" height="40" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    <text x="260" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">X₁ ≥ -0.2?</text>
    <text x="260" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Linear split</text>
    
    <!-- Leaf nodes -->
    <line x1="70" y1="230" x2="30" y2="270" stroke="#34495e" stroke-width="2"/>
    <line x1="110" y1="230" x2="150" y2="270" stroke="#34495e" stroke-width="2"/>
    
    <circle cx="20" cy="280" r="15" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
    <text x="20" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Red</text>
    
    <circle cx="160" cy="280" r="15" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    <text x="160" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Blue</text>
    
    <line x1="240" y1="230" x2="200" y2="270" stroke="#34495e" stroke-width="2"/>
    <line x1="280" y1="230" x2="320" y2="270" stroke="#34495e" stroke-width="2"/>
    
    <circle cx="190" cy="280" r="15" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    <text x="190" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Blue</text>
    
    <circle cx="330" cy="280" r="15" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
    <text x="330" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Red</text>
  </g>
  
  <!-- Feature Space Visualization -->
  <g id="feature-space" transform="translate(450,70)">
    <text x="200" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#34495e">Feature Space with Linear Boundaries</text>
    
    <!-- Coordinate system -->
    <rect x="50" y="30" width="300" height="250" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2"/>
    
    <!-- Axes -->
    <line x1="70" y1="260" x2="330" y2="260" stroke="#343a40" stroke-width="2"/>
    <line x1="70" y1="260" x2="70" y2="50" stroke="#343a40" stroke-width="2"/>
    
    <!-- Axis labels -->
    <text x="200" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#495057">X₁</text>
    <g transform="translate(30,155) rotate(-90)">
      <text x="0" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#495057">X₂</text>
    </g>
    
    <!-- Grid -->
    <line x1="120" y1="50" x2="120" y2="260" stroke="#e9ecef" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="170" y1="50" x2="170" y2="260" stroke="#e9ecef" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="220" y1="50" x2="220" y2="260" stroke="#e9ecef" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="270" y1="50" x2="270" y2="260" stroke="#e9ecef" stroke-width="1" stroke-dasharray="3,3"/>
    
    <line x1="70" y1="100" x2="330" y2="100" stroke="#e9ecef" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="70" y1="150" x2="330" y2="150" stroke="#e9ecef" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="70" y1="200" x2="330" y2="200" stroke="#e9ecef" stroke-width="1" stroke-dasharray="3,3"/>
    
    <!-- Scale labels -->
    <text x="70" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">-1</text>
    <text x="120" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">-0.5</text>
    <text x="170" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">0</text>
    <text x="220" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">0.5</text>
    <text x="270" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">1</text>
    
    <text x="55" y="265" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">-1</text>
    <text x="55" y="205" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">0</text>
    <text x="55" y="155" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">0.5</text>
    <text x="55" y="105" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">1</text>
    
    <!-- Data points -->
    <!-- Red class points -->
    <circle cx="85" cy="80" r="3" fill="#e74c3c"/>
    <circle cx="95" cy="90" r="3" fill="#e74c3c"/>
    <circle cx="110" cy="75" r="3" fill="#e74c3c"/>
    <circle cx="115" cy="95" r="3" fill="#e74c3c"/>
    <circle cx="130" cy="85" r="3" fill="#e74c3c"/>
    <circle cx="135" cy="105" r="3" fill="#e74c3c"/>
    
    <circle cx="280" cy="230" r="3" fill="#e74c3c"/>
    <circle cx="290" cy="240" r="3" fill="#e74c3c"/>
    <circle cx="300" cy="220" r="3" fill="#e74c3c"/>
    <circle cx="310" cy="235" r="3" fill="#e74c3c"/>
    <circle cx="285" cy="210" r="3" fill="#e74c3c"/>
    
    <!-- Blue class points -->
    <circle cx="190" cy="120" r="3" fill="#3498db"/>
    <circle cx="200" cy="130" r="3" fill="#3498db"/>
    <circle cx="210" cy="125" r="3" fill="#3498db"/>
    <circle cx="220" cy="140" r="3" fill="#3498db"/>
    <circle cx="180" cy="135" r="3" fill="#3498db"/>
    <circle cx="225" cy="115" r="3" fill="#3498db"/>
    
    <circle cx="170" cy="190" r="3" fill="#3498db"/>
    <circle cx="180" cy="200" r="3" fill="#3498db"/>
    <circle cx="190" cy="185" r="3" fill="#3498db"/>
    <circle cx="160" cy="195" r="3" fill="#3498db"/>
    
    <!-- Decision boundaries (axis-parallel lines) -->
    <line x1="220" y1="50" x2="220" y2="260" stroke="#9b59b6" stroke-width="3" stroke-dasharray="5,5"/>
    <text x="225" y="70" font-family="Arial, sans-serif" font-size="10" fill="#9b59b6">X₁ = 0.3</text>
    
    <line x1="70" y1="150" x2="220" y2="150" stroke="#e74c3c" stroke-width="3" stroke-dasharray="5,5"/>
    <text x="80" y="140" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c">X₂ = 0.7</text>
    
    <line x1="145" y1="50" x2="145" y2="260" stroke="#3498db" stroke-width="3" stroke-dasharray="5,5"/>
    <text x="150" y="70" font-family="Arial, sans-serif" font-size="10" fill="#3498db">X₁ = -0.2</text>
    
    <!-- Decision regions -->
    <rect x="71" y="51" width="74" height="99" fill="url(#redClass)" opacity="0.4"/>
    <text x="108" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#c0392b">Red</text>
    
    <rect x="146" y="151" width="74" height="108" fill="url(#blueClass)" opacity="0.4"/>
    <text x="183" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2980b9">Blue</text>
    
    <rect x="221" y="51" width="108" height="208" fill="url(#blueClass)" opacity="0.4"/>
    <text x="275" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2980b9">Blue</text>
    
    <rect x="146" y="51" width="74" height="99" fill="url(#blueClass)" opacity="0.4"/>
    <text x="183" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2980b9">Blue</text>
    
    <rect x="71" y="151" width="74" height="108" fill="url(#redClass)" opacity="0.4"/>
    <text x="108" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#c0392b">Red</text>
  </g>
  
  <!-- Algorithm explanation -->
  <rect x="50" y="370" width="800" height="280" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2" filter="url(#softShadow)"/>
  <text x="450" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">CART Algorithm for Numerical Features</text>
  
  <!-- Step-by-step process -->
  <g id="algorithm-steps">
    <rect x="70" y="420" width="200" height="120" fill="#e8f4fd" stroke="#3498db" stroke-width="2"/>
    <text x="170" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2980b9">Step 1: Linear Split</text>
    <text x="80" y="465" font-family="Arial, sans-serif" font-size="11" fill="#34495e">At each node, find optimal</text>
    <text x="80" y="480" font-family="Arial, sans-serif" font-size="11" fill="#34495e">linear boundary:</text>
    <text x="170" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e74c3c">a^T x + b ≥ 0</text>
    <text x="80" y="520" font-family="Arial, sans-serif" font-size="11" fill="#34495e">Where a and b are learned</text>
    <text x="80" y="535" font-family="Arial, sans-serif" font-size="11" fill="#34495e">from training data</text>
    
    <rect x="290" y="420" width="200" height="120" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
    <text x="390" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#856404">Step 2: Recursive Split</text>
    <text x="300" y="465" font-family="Arial, sans-serif" font-size="11" fill="#34495e">Apply splitting recursively</text>
    <text x="300" y="480" font-family="Arial, sans-serif" font-size="11" fill="#34495e">to left and right children</text>
    <text x="300" y="500" font-family="Arial, sans-serif" font-size="11" fill="#34495e">until stopping criteria:</text>
    <text x="310" y="515" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">• Min samples per leaf</text>
    <text x="310" y="530" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">• Maximum depth</text>
    
    <rect x="510" y="420" width="200" height="120" fill="#f8d7da" stroke="#e74c3c" stroke-width="2"/>
    <text x="610" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#721c24">Step 3: Class Assignment</text>
    <text x="520" y="465" font-family="Arial, sans-serif" font-size="11" fill="#34495e">Each leaf node assigns</text>
    <text x="520" y="480" font-family="Arial, sans-serif" font-size="11" fill="#34495e">majority class in region</text>
    <text x="520" y="500" font-family="Arial, sans-serif" font-size="11" fill="#34495e">Creates rectangular</text>
    <text x="520" y="515" font-family="Arial, sans-serif" font-size="11" fill="#34495e">decision regions with</text>
    <text x="520" y="530" font-family="Arial, sans-serif" font-size="11" fill="#34495e">axis-parallel boundaries</text>
    
    <rect x="730" y="420" width="120" height="120" fill="#d1ecf1" stroke="#17a2b8" stroke-width="2"/>
    <text x="790" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0c5460">Key Insight</text>
    <text x="740" y="470" font-family="Arial, sans-serif" font-size="11" fill="#34495e">Single tree creates</text>
    <text x="740" y="485" font-family="Arial, sans-serif" font-size="11" fill="#34495e">jagged boundaries</text>
    <text x="740" y="505" font-family="Arial, sans-serif" font-size="11" fill="#34495e">Random Forest</text>
    <text x="740" y="520" font-family="Arial, sans-serif" font-size="11" fill="#34495e">smooths these via</text>
    <text x="740" y="535" font-family="Arial, sans-serif" font-size="11" fill="#34495e">ensemble voting</text>
  </g>
  
  <!-- Comparison with traditional categorical splits -->
  <text x="450" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#495057">Numerical vs Categorical Splits</text>
  
  <rect x="150" y="590" width="250" height="60" fill="#fff" stroke="#28a745" stroke-width="2"/>
  <text x="275" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#28a745">Categorical: feature ∈ {A, B, C}</text>
  <text x="160" y="625" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">Simple membership test</text>
  <text x="160" y="640" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">Creates discrete regions</text>
  
  <rect x="450" y="590" width="250" height="60" fill="#fff" stroke="#fd7e14" stroke-width="2"/>
  <text x="575" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fd7e14">Numerical: a^T x + b ≥ 0</text>
  <text x="460" y="625" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">Linear threshold test</text>
  <text x="460" y="640" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">Creates hyperplane boundaries</text>
</svg>