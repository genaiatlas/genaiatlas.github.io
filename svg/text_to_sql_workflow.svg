<svg viewBox="0 0 1400 950" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1400" height="950" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="700" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Text-to-SQL Workflow
  </text>
  
  <!-- Step 1 -->
  <g id="step1">
    <rect x="50" y="80" width="600" height="180" rx="10" fill="#fff3bf" stroke="#f59f00" stroke-width="3"/>
    <text x="350" y="110" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Step 1: Question Analysis
    </text>
    
    <rect x="80" y="130" width="540" height="115" rx="5" fill="#fff" stroke="#f59f00" stroke-width="2"/>
    <text x="350" y="155" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#495057">
      Natural Language Question
    </text>
    <text x="350" y="177" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#868e96" font-style="italic">
      What are the top 10 customers by total revenue in 2024?
    </text>
    <text x="95" y="205" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#495057">
      Extracted Elements:
    </text>
    <text x="95" y="222" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Entities: customers, revenue
    </text>
    <text x="95" y="237" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Operation: top-N ranking, aggregation (SUM)
    </text>
    
    <text x="350" y="222" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Limit: 10
    </text>
    <text x="350" y="237" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Time filter: year = 2024
    </text>
    
    <text x="520" y="222" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Sorting: DESC
    </text>
  </g>
  
  <!-- Arrow -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#495057"/>
    </marker>
  </defs>
  <line x1="350" y1="260" x2="350" y2="295" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  
  <!-- Step 2 -->
  <g id="step2">
    <rect x="50" y="305" width="600" height="200" rx="10" fill="#d3f9d8" stroke="#37b24d" stroke-width="3"/>
    <text x="350" y="335" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Step 2: Schema Mapping
    </text>
    
    <rect x="80" y="355" width="260" height="135" rx="5" fill="#fff" stroke="#37b24d" stroke-width="2"/>
    <text x="210" y="377" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#495057">
      Database Schema
    </text>
    <text x="95" y="397" font-family="Courier New, monospace" font-size="10" fill="#495057">
      customers
    </text>
    <text x="95" y="413" font-family="Courier New, monospace" font-size="9" fill="#868e96">
        customer_id (PK)
    </text>
    <text x="95" y="427" font-family="Courier New, monospace" font-size="9" fill="#868e96">
        customer_name
    </text>
    <text x="95" y="441" font-family="Courier New, monospace" font-size="9" fill="#868e96">
        email
    </text>
    
    <text x="95" y="460" font-family="Courier New, monospace" font-size="10" fill="#495057">
      orders
    </text>
    <text x="95" y="476" font-family="Courier New, monospace" font-size="9" fill="#868e96">
        order_id (PK)
    </text>
    
    <rect x="360" y="355" width="260" height="135" rx="5" fill="#fff" stroke="#37b24d" stroke-width="2"/>
    <text x="490" y="377" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#495057">
      Entity Mapping
    </text>
    <text x="375" y="397" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      customers → customers table
    </text>
    <text x="375" y="413" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      revenue → order_amount
    </text>
    <text x="375" y="429" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      total → SUM aggregation
    </text>
    <text x="375" y="445" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      2024 → order_date YEAR
    </text>
    <text x="375" y="465" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#37b24d">
      Join Relationship:
    </text>
    <text x="375" y="481" font-family="Arial, sans-serif" font-size="9" fill="#495057">
      customers.customer_id =
    </text>
    <text x="375" y="495" font-family="Arial, sans-serif" font-size="9" fill="#495057">
      orders.customer_id
    </text>
  </g>
  
  <line x1="350" y1="505" x2="350" y2="540" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  
  <!-- Step 3 -->
  <g id="step3">
    <rect x="50" y="550" width="600" height="360" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="3"/>
    <text x="350" y="580" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Step 3: SQL Generation
    </text>
    
    <rect x="80" y="600" width="540" height="295" rx="5" fill="#fff" stroke="#1971c2" stroke-width="2"/>
    <text x="350" y="620" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#495057">
      Generated SQL Query
    </text>
    
    <text x="95" y="645" font-family="Courier New, monospace" font-size="11" fill="#495057">
      SELECT
    </text>
    <text x="120" y="665" font-family="Courier New, monospace" font-size="11" fill="#7950f2">
      c.customer_name,
    </text>
    <text x="120" y="685" font-family="Courier New, monospace" font-size="11" fill="#7950f2">
      c.customer_id,
    </text>
    <text x="120" y="705" font-family="Courier New, monospace" font-size="11" fill="#e64980">
      SUM(o.order_amount) AS total_revenue
    </text>
    
    <text x="95" y="730" font-family="Courier New, monospace" font-size="11" fill="#495057">
      FROM
    </text>
    <text x="120" y="750" font-family="Courier New, monospace" font-size="11" fill="#37b24d">
      customers c
    </text>
    
    <text x="95" y="775" font-family="Courier New, monospace" font-size="11" fill="#495057">
      JOIN
    </text>
    <text x="120" y="795" font-family="Courier New, monospace" font-size="11" fill="#37b24d">
      orders o ON c.customer_id = o.customer_id
    </text>
    
    <text x="95" y="820" font-family="Courier New, monospace" font-size="11" fill="#495057">
      WHERE
    </text>
    <text x="120" y="840" font-family="Courier New, monospace" font-size="11" fill="#fd7e14">
      YEAR(o.order_date) = 2024
    </text>
    
    <text x="95" y="865" font-family="Courier New, monospace" font-size="11" fill="#495057">
      GROUP BY c.customer_id, c.customer_name
    </text>
    <text x="95" y="885" font-family="Courier New, monospace" font-size="11" fill="#495057">
      ORDER BY total_revenue DESC
    </text>
    <text x="95" y="905" font-family="Courier New, monospace" font-size="11" fill="#495057">
      LIMIT 10;
    </text>
  </g>
  
  <line x1="650" y1="320" x2="750" y2="320" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  
  <!-- Right Side: Results and Refinement -->
  <g id="results">
    <rect x="760" y="80" width="590" height="830" rx="10" fill="#fff9db" stroke="#fab005" stroke-width="3"/>
    <text x="1055" y="110" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Step 4: Query Refinement
    </text>
    
    <!-- Optimization -->
    <rect x="790" y="130" width="530" height="140" rx="5" fill="#fff" stroke="#fab005" stroke-width="2"/>
    <text x="1055" y="155" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#495057">
      Performance Optimization
    </text>
    <text x="805" y="180" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      ✓ Add indexes on customer_id and order_date
    </text>
    <text x="805" y="197" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      ✓ Use LIMIT to constrain result set
    </text>
    <text x="805" y="214" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      ✓ Consider partitioning by year for large tables
    </text>
    <text x="805" y="231" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      ✓ Verify execution plan with EXPLAIN
    </text>
    <text x="805" y="248" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      ✓ Estimated execution time: under 50ms
    </text>
    
    <!-- Edge Cases -->
    <rect x="790" y="290" width="530" height="140" rx="5" fill="#fff" stroke="#fab005" stroke-width="2"/>
    <text x="1055" y="315" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#495057">
      Handle Edge Cases
    </text>
    <text x="805" y="340" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      ✓ Handle NULL values in order_amount: COALESCE(0)
    </text>
    <text x="805" y="357" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      ✓ Handle zero revenue customers: SUM filter
    </text>
    <text x="805" y="374" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      ✓ Date format handling: YEAR() vs date comparisons
    </text>
    <text x="805" y="391" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      ✓ Timezone considerations for date filtering
    </text>
    <text x="805" y="408" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      ✓ Handle customers with no orders in 2024
    </text>
    
    <!-- Sample Results -->
    <rect x="790" y="450" width="530" height="230" rx="5" fill="#fff" stroke="#fab005" stroke-width="2"/>
    <text x="1055" y="475" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#495057">
      Sample Query Results
    </text>
    <rect x="810" y="490" width="490" height="175" rx="3" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
    
    <text x="820" y="510" font-family="Courier New, monospace" font-size="10" font-weight="bold" fill="#495057">
      customer_name       | customer_id | total_revenue
    </text>
    <line x1="815" y1="515" x2="1285" y2="515" stroke="#dee2e6" stroke-width="1"/>
    
    <text x="820" y="535" font-family="Courier New, monospace" font-size="9" fill="#495057">
      Acme Corporation    | 1001        | $2,547,892.00
    </text>
    <text x="820" y="552" font-family="Courier New, monospace" font-size="9" fill="#495057">
      Global Tech Inc     | 1052        | $1,893,456.00
    </text>
    <text x="820" y="569" font-family="Courier New, monospace" font-size="9" fill="#495057">
      Innovate Solutions  | 1003        | $1,634,221.00
    </text>
    <text x="820" y="586" font-family="Courier New, monospace" font-size="9" fill="#495057">
      TechStart Labs      | 1098        | $1,456,789.00
    </text>
    <text x="820" y="603" font-family="Courier New, monospace" font-size="9" fill="#495057">
      DataDrive Systems   | 1015        | $1,328,990.00
    </text>
    <text x="820" y="620" font-family="Courier New, monospace" font-size="9" fill="#495057">
      CloudNet Services   | 1077        | $1,289,445.00
    </text>
    <text x="820" y="637" font-family="Courier New, monospace" font-size="9" fill="#495057">
      ...                 | ...         | ...
    </text>
    <text x="820" y="654" font-family="Courier New, monospace" font-size="9" fill="#495057">
      (10 rows returned in 23ms)
    </text>
    
    <!-- Context Addition -->
    <rect x="790" y="700" width="530" height="190" rx="5" fill="#d3f9d8" stroke="#37b24d" stroke-width="2"/>
    <text x="1055" y="725" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#495057">
      Add Context for LLM
    </text>
    <text x="805" y="750" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      Include additional context to help LLM generate better answers:
    </text>
    <text x="805" y="772" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Total customers in 2024: 847
    </text>
    <text x="805" y="789" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Overall revenue in 2024: $45.3M
    </text>
    <text x="805" y="806" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Top 10 accounts for: 32% of total revenue
    </text>
    <text x="805" y="823" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Average revenue per customer: $53,478
    </text>
    <text x="805" y="840" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Comparison to 2023: +18% YoY growth
    </text>
    <text x="805" y="862" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#37b24d">
      → This context enables more insightful LLM responses
    </text>
  </g>
</svg>