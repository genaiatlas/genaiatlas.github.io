<svg viewBox="0 0 1000 750" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="750" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    The Unit Scaling Problem in PCA
  </text>
  
  <!-- Dataset table -->
  <g transform="translate(100, 60)">
    <rect x="0" y="0" width="800" height="80" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2" rx="5"/>
    <text x="400" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">
      Sample Dataset: 4 People with Age and Height
    </text>
    
    <!-- Table -->
    <g transform="translate(250, 35)">
      <!-- Headers -->
      <rect x="0" y="0" width="60" height="20" fill="#3498db" stroke="white"/>
      <rect x="60" y="0" width="80" height="20" fill="#3498db" stroke="white"/>
      <rect x="140" y="0" width="100" height="20" fill="#3498db" stroke="white"/>
      <rect x="240" y="0" width="100" height="20" fill="#3498db" stroke="white"/>
      
      <text x="30" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Person</text>
      <text x="100" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Age (years)</text>
      <text x="190" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Height (cm)</text>
      <text x="290" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Height (feet)</text>
      
      <!-- Data rows -->
      <rect x="0" y="20" width="60" height="20" fill="white" stroke="#bdc3c7"/>
      <rect x="60" y="20" width="80" height="20" fill="white" stroke="#bdc3c7"/>
      <rect x="140" y="20" width="100" height="20" fill="white" stroke="#bdc3c7"/>
      <rect x="240" y="20" width="100" height="20" fill="white" stroke="#bdc3c7"/>
      
      <text x="30" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">A</text>
      <text x="100" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">35</text>
      <text x="190" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">190</text>
      <text x="290" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">6.232</text>
    </g>
  </g>
  
  <!-- Scenario 1: Height in Centimeters -->
  <g transform="translate(50, 170)">
    <rect x="0" y="0" width="400" height="250" fill="#e8f5e8" stroke="#27ae60" stroke-width="3" rx="10"/>
    <text x="200" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#27ae60">
      Scenario 1: Height in Centimeters
    </text>
    
    <!-- Coordinate system -->
    <g transform="translate(50, 50)">
      <line x1="0" y1="150" x2="250" y2="150" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
      <line x1="0" y1="150" x2="0" y2="20" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
      
      <!-- Axis labels -->
      <text x="260" y="155" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Age (years)</text>
      <text x="-15" y="15" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Height (cm)</text>
      
      <!-- Age scale -->
      <text x="50" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">30</text>
      <text x="150" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">40</text>
      <text x="200" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">45</text>
      
      <!-- Height scale -->
      <text x="-25" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">160</text>
      <text x="-25" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">180</text>
      <text x="-25" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">200</text>
      
      <!-- Data points -->
      <circle cx="75" cy="30" r="4" fill="#e74c3c"/> <!-- A: 35, 190 -->
      <circle cx="125" cy="30" r="4" fill="#e74c3c"/> <!-- B: 40, 190 -->
      <circle cx="75" cy="130" r="4" fill="#e74c3c"/> <!-- C: 35, 160 -->
      <circle cx="125" cy="130" r="4" fill="#e74c3c"/> <!-- D: 40, 160 -->
      
      <!-- PC1 direction (dominated by height) -->
      <line x1="60" y1="140" x2="140" y2="20" stroke="#e67e22" stroke-width="4" marker-end="url(#orangeArrow)"/>
      <text x="150" y="15" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e67e22">PC1</text>
      
      <!-- Variance indicators -->
      <line x1="270" y1="40" x2="270" y2="120" stroke="#27ae60" stroke-width="3"/>
      <text x="275" y="85" font-family="Arial, sans-serif" font-size="10" fill="#27ae60" font-weight="bold">Height dominates</text>
      <text x="275" y="95" font-family="Arial, sans-serif" font-size="10" fill="#27ae60">(Large range: 30cm)</text>
      
      <line x1="50" y1="170" x2="150" y2="170" stroke="#e67e22" stroke-width="2"/>
      <text x="100" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e67e22">Age: 10 years</text>
    </g>
    
    <text x="200" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#27ae60">
      Result: PC1 ≈ Height Direction
    </text>
  </g>
  
  <!-- Scenario 2: Height in Feet -->
  <g transform="translate(500, 170)">
    <rect x="0" y="0" width="400" height="250" fill="#fdf2f2" stroke="#e74c3c" stroke-width="3" rx="10"/>
    <text x="200" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#e74c3c">
      Scenario 2: Height in Feet
    </text>
    
    <!-- Coordinate system -->
    <g transform="translate(50, 50)">
      <line x1="0" y1="150" x2="250" y2="150" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
      <line x1="0" y1="150" x2="0" y2="20" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
      
      <!-- Axis labels -->
      <text x="260" y="155" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Age (years)</text>
      <text x="-15" y="15" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Height (feet)</text>
      
      <!-- Age scale -->
      <text x="50" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">30</text>
      <text x="150" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">40</text>
      <text x="200" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">45</text>
      
      <!-- Height scale -->
      <text x="-25" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">5.2</text>
      <text x="-25" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">5.9</text>
      <text x="-25" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">6.5</text>
      
      <!-- Data points (now clustered differently) -->
      <circle cx="75" cy="50" r="4" fill="#3498db"/> <!-- A: 35, 6.232 -->
      <circle cx="125" cy="50" r="4" fill="#3498db"/> <!-- B: 40, 6.232 -->
      <circle cx="75" cy="120" r="4" fill="#3498db"/> <!-- C: 35, 5.248 -->
      <circle cx="125" cy="120" r="4" fill="#3498db"/> <!-- D: 40, 5.248 -->
      
      <!-- PC1 direction (now dominated by age) -->
      <line x1="60" y1="85" x2="140" y2="85" stroke="#9b59b6" stroke-width="4" marker-end="url(#purpleArrow)"/>
      <text x="150" y="80" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#9b59b6">PC1</text>
      
      <!-- Variance indicators -->
      <line x1="50" y1="170" x2="150" y2="170" stroke="#e74c3c" stroke-width="3"/>
      <text x="100" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c" font-weight="bold">Age dominates</text>
      <text x="100" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c">(Range: 10 years)</text>
      
      <line x1="270" y1="40" x2="270" y2="130" stroke="#9b59b6" stroke-width="2"/>
      <text x="275" y="85" font-family="Arial, sans-serif" font-size="10" fill="#9b59b6">Height: ~1 foot</text>
    </g>
    
    <text x="200" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e74c3c">
      Result: PC1 ≈ Age Direction
    </text>
  </g>
  
  <!-- Problem explanation -->
  <g transform="translate(50, 450)">
    <rect x="0" y="0" width="900" height="100" fill="#fff3cd" stroke="#ffc107" stroke-width="2" rx="10"/>
    <text x="450" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#856404">
      The Problem: Same Data, Different Results!
    </text>
    
    <g transform="translate(30, 35)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">
        • <tspan font-weight="bold" fill="#e74c3c">Height in cm:</tspan> Range 160-190 (30 units) → Dominates PC1
      </text>
      <text x="0" y="20" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">
        • <tspan font-weight="bold" fill="#e74c3c">Height in feet:</tspan> Range 5.2-6.2 (1 unit) → Age dominates PC1
      </text>
      <text x="0" y="40" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">
        • <tspan font-weight="bold" fill="#e74c3c">Problem:</tspan> PCA results change based on arbitrary unit choices!
      </text>
      
      <text x="450" y="20" font-family="Arial, sans-serif" font-size="14" fill="#856404" font-weight="bold">
        Solution: Use correlation matrix instead of covariance matrix
      </text>
    </g>
  </g>
  
  <!-- Solution section -->
  <g transform="translate(50, 570)">
    <rect x="0" y="0" width="900" height="150" fill="#d4edda" stroke="#28a745" stroke-width="2" rx="10"/>
    <text x="450" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#155724">
      Solution: Standardization and Correlation Matrix
    </text>
    
    <g transform="translate(30, 40)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
        Standardization Process:
      </text>
      <text x="20" y="20" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
        1. Center each variable: X̃ᵢⱼ = Xᵢⱼ - μⱼ
      </text>
      <text x="20" y="35" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
        2. Scale by standard deviation: Zᵢⱼ = X̃ᵢⱼ / σⱼ
      </text>
      <text x="20" y="50" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
        3. All variables now have mean=0, variance=1
      </text>
      
      <text x="450" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
        When to Use Each Matrix:
      </text>
      
      <!-- Decision table -->
      <g transform="translate(450, 15)">
        <rect x="0" y="0" width="200" height="15" fill="#3498db" stroke="white"/>
        <rect x="200" y="0" width="150" height="15" fill="#3498db" stroke="white"/>
        <text x="100" y="12" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Scenario</text>
        <text x="275" y="12" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Use Matrix</text>
        
        <rect x="0" y="15" width="200" height="15" fill="white" stroke="#bdc3c7"/>
        <rect x="200" y="15" width="150" height="15" fill="#e8f5e8" stroke="#bdc3c7"/>
        <text x="10" y="27" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Same units (all in feet)</text>
        <text x="275" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#27ae60" font-weight="bold">Covariance</text>
        
        <rect x="0" y="30" width="200" height="15" fill="white" stroke="#bdc3c7"/>
        <rect x="200" y="30" width="150" height="15" fill="#fdf2f2" stroke="#bdc3c7"/>
        <text x="10" y="42" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Mixed units (age, height, weight)</text>
        <text x="275" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c" font-weight="bold">Correlation</text>
        
        <rect x="0" y="45" width="200" height="15" fill="white" stroke="#bdc3c7"/>
        <rect x="200" y="45" width="150" height="15" fill="#fdf2f2" stroke="#bdc3c7"/>
        <text x="10" y="57" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Unknown scales</text>
        <text x="275" y="57" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c" font-weight="bold">Correlation</text>
      </g>
      
      <text x="0" y="85" font-family="Arial, sans-serif" font-size="13" fill="#155724" font-weight="bold">
        Key Insight: Correlation matrix normalizes all variables to equal weight, preventing unit bias
      </text>
      
      <text x="0" y="105" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">
        Formula: R_corr = D^(-1/2) * R_cov * D^(-1/2), where D is diagonal matrix of variances
      </text>
    </g>
  </g>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e"/>
    </marker>
    <marker id="orangeArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e67e22"/>
    </marker>
    <marker id="purpleArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9b59b6"/>
    </marker>
  </defs>
</svg>