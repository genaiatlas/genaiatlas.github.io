<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="900" height="700" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="450" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Multi-Source Routing Architecture
  </text>
  <text x="450" y="55" font-size="13" text-anchor="middle" fill="#666">
    Parallel routing to multiple knowledge sources with intelligent aggregation
  </text>
  
  <!-- Query Input -->
  <rect x="350" y="80" width="200" height="60" rx="8" fill="#4a90e2" stroke="#2e5c8a" stroke-width="2"/>
  <text x="450" y="105" font-size="14" font-weight="bold" text-anchor="middle" fill="white">User Query</text>
  <text x="450" y="125" font-size="11" text-anchor="middle" fill="white">"Explain quantum computing"</text>
  
  <!-- Router Component -->
  <rect x="300" y="170" width="300" height="80" rx="8" fill="#f39c12" stroke="#c87f0a" stroke-width="2"/>
  <text x="450" y="195" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Multi-Source Router</text>
  <text x="450" y="215" font-size="11" text-anchor="middle" fill="white">Analyzes query and determines</text>
  <text x="450" y="232" font-size="11" text-anchor="middle" fill="white">relevant sources with confidence scores</text>
  
  <!-- Arrows to sources -->
  <line x1="350" y1="250" x2="120" y2="310" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="420" y1="250" x2="300" y2="310" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="480" y1="250" x2="480" y2="310" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="520" y1="250" x2="660" y2="310" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="550" y1="250" x2="780" y2="310" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#666"/>
    </marker>
  </defs>
  
  <!-- Score labels -->
  <text x="200" y="285" font-size="10" fill="#e74c3c" font-weight="bold">0.95</text>
  <text x="350" y="285" font-size="10" fill="#27ae60" font-weight="bold">0.88</text>
  <text x="470" y="285" font-size="10" fill="#3498db" font-weight="bold">0.82</text>
  <text x="610" y="285" font-size="10" fill="#9b59b6" font-weight="bold">0.71</text>
  <text x="700" y="285" font-size="10" fill="#95a5a6" font-weight="bold">0.43</text>
  
  <!-- Data Source 1: Wikipedia -->
  <rect x="20" y="310" width="200" height="90" rx="6" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <text x="120" y="335" font-size="14" font-weight="bold" text-anchor="middle" fill="white">📚 Wikipedia</text>
  <text x="120" y="355" font-size="10" text-anchor="middle" fill="white">General Knowledge</text>
  <text x="120" y="370" font-size="10" text-anchor="middle" fill="white">High Coverage</text>
  <text x="120" y="390" font-size="11" font-weight="bold" text-anchor="middle" fill="white">✓ Selected</text>
  
  <!-- Data Source 2: Scientific Papers -->
  <rect x="240" y="310" width="200" height="90" rx="6" fill="#27ae60" stroke="#1e8449" stroke-width="2"/>
  <text x="340" y="335" font-size="14" font-weight="bold" text-anchor="middle" fill="white">🔬 Scientific Papers</text>
  <text x="340" y="355" font-size="10" text-anchor="middle" fill="white">Deep Technical</text>
  <text x="340" y="370" font-size="10" text-anchor="middle" fill="white">High Authority</text>
  <text x="340" y="390" font-size="11" font-weight="bold" text-anchor="middle" fill="white">✓ Selected</text>
  
  <!-- Data Source 3: Tech Blogs -->
  <rect x="460" y="310" width="200" height="90" rx="6" fill="#3498db" stroke="#2874a6" stroke-width="2"/>
  <text x="560" y="335" font-size="14" font-weight="bold" text-anchor="middle" fill="white">💻 Tech Blogs</text>
  <text x="560" y="355" font-size="10" text-anchor="middle" fill="white">Practical Examples</text>
  <text x="560" y="370" font-size="10" text-anchor="middle" fill="white">Current Trends</text>
  <text x="560" y="390" font-size="11" font-weight="bold" text-anchor="middle" fill="white">✓ Selected</text>
  
  <!-- Data Source 4: Video Transcripts -->
  <rect x="680" y="310" width="200" height="90" rx="6" fill="#9b59b6" stroke="#7d3c98" stroke-width="2"/>
  <text x="780" y="335" font-size="14" font-weight="bold" text-anchor="middle" fill="white">🎥 Video Content</text>
  <text x="780" y="355" font-size="10" text-anchor="middle" fill="white">Explanations</text>
  <text x="780" y="370" font-size="10" text-anchor="middle" fill="white">Tutorials</text>
  <text x="780" y="390" font-size="11" font-weight="bold" text-anchor="middle" fill="white">✓ Selected</text>
  
  <!-- Retrieval arrows -->
  <line x1="120" y1="400" x2="210" y2="460" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="340" y1="400" x2="330" y2="460" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="560" y1="400" x2="470" y2="460" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="780" y1="400" x2="590" y2="460" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Result labels -->
  <text x="165" y="440" font-size="9" fill="#666">3 docs</text>
  <text x="335" y="440" font-size="9" fill="#666">5 papers</text>
  <text x="515" y="440" font-size="9" fill="#666">4 articles</text>
  <text x="685" y="440" font-size="9" fill="#666">2 videos</text>
  
  <!-- Aggregator -->
  <rect x="250" y="460" width="400" height="80" rx="8" fill="#34495e" stroke="#2c3e50" stroke-width="2"/>
  <text x="450" y="485" font-size="15" font-weight="bold" text-anchor="middle" fill="white">Result Aggregator</text>
  <text x="450" y="505" font-size="11" text-anchor="middle" fill="white">• De-duplication • Re-ranking • Diversity</text>
  <text x="450" y="525" font-size="11" text-anchor="middle" fill="white">• Source balancing • Quality filtering</text>
  
  <!-- Final output -->
  <line x1="450" y1="540" x2="450" y2="580" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="300" y="580" width="300" height="70" rx="8" fill="#27ae60" stroke="#1e8449" stroke-width="2"/>
  <text x="450" y="605" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Unified Response</text>
  <text x="450" y="625" font-size="10" text-anchor="middle" fill="white">Combined insights from 4 sources</text>
  <text x="450" y="640" font-size="10" text-anchor="middle" fill="white">14 retrieved documents, ranked by relevance</text>
  
  <!-- Info box -->
  <rect x="20" y="420" width="200" height="70" rx="6" fill="white" stroke="#ddd" stroke-width="2"/>
  <text x="120" y="440" font-size="11" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Routing Strategy</text>
  <text x="25" y="456" font-size="9" fill="#555">• Threshold: 0.7</text>
  <text x="25" y="469" font-size="9" fill="#555">• Max sources: 5</text>
  <text x="25" y="482" font-size="9" fill="#555">• Min diversity: 0.6</text>
  
  <!-- Legend -->
  <g transform="translate(680, 420)">
    <rect x="0" y="0" width="200" height="70" rx="6" fill="white" stroke="#ddd" stroke-width="2"/>
    <text x="100" y="20" font-size="11" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Confidence Scores</text>
    <circle cx="20" cy="35" r="5" fill="#27ae60"/>
    <text x="30" y="39" font-size="9" fill="#555">≥ 0.8: High confidence</text>
    <circle cx="20" cy="50" r="5" fill="#f39c12"/>
    <text x="30" y="54" font-size="9" fill="#555">0.6-0.8: Medium</text>
    <circle cx="20" cy="65" r="5" fill="#95a5a6"/>
    <text x="30" y="69" font-size="9" fill="#555">&lt; 0.6: Not selected</text>
  </g>
</svg>