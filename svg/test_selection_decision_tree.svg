<svg width="1000" height="800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="800" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">Statistical Test Selection Decision Tree</text>
  
  <!-- Starting Point -->
  <rect x="400" y="50" width="200" height="50" fill="#e3f2fd" stroke="#1976d2" stroke-width="3" rx="10"/>
  <text x="500" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1976d2">What type of data?</text>
  <text x="500" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">Start here</text>
  
  <!-- Categorical Data Branch -->
  <rect x="100" y="140" width="180" height="40" fill="#fff3e0" stroke="#f57c00" stroke-width="2" rx="8"/>
  <text x="190" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f57c00">Categorical Data</text>
  <text x="190" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">Counts, frequencies</text>
  
  <!-- Continuous Data Branch -->
  <rect x="720" y="140" width="180" height="40" fill="#e8f5e8" stroke="#4caf50" stroke-width="2" rx="8"/>
  <text x="810" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4caf50">Continuous Data</text>
  <text x="810" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">Numerical measurements</text>
  
  <!-- Categorical Tests -->
  <rect x="50" y="220" width="140" height="60" fill="#fff3e0" stroke="#f57c00" stroke-width="2" rx="8"/>
  <text x="120" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Goodness of Fit</text>
  <text x="120" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">One variable</text>
  <text x="120" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#f57c00">Chi-square test</text>
  
  <rect x="230" y="220" width="140" height="60" fill="#fff3e0" stroke="#f57c00" stroke-width="2" rx="8"/>
  <text x="300" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Independence</text>
  <text x="300" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Two variables</text>
  <text x="300" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#f57c00">Chi-square test</text>
  
  <!-- Continuous Data Decision Point -->
  <rect x="720" y="220" width="180" height="40" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2" rx="8"/>
  <text x="810" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#9c27b0">How many groups?</text>
  <text x="810" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">Compare groups</text>
  
  <!-- Two Groups Branch -->
  <rect x="580" y="300" width="140" height="40" fill="#e8f5e8" stroke="#4caf50" stroke-width="2" rx="8"/>
  <text x="650" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4caf50">Two Groups</text>
  <text x="650" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">Compare means</text>
  
  <!-- Multiple Groups Branch -->
  <rect x="860" y="300" width="140" height="40" fill="#ffebee" stroke="#f44336" stroke-width="2" rx="8"/>
  <text x="930" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f44336">Multiple Groups</text>
  <text x="930" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">3+ groups</text>
  
  <!-- Paired vs Independent -->
  <rect x="500" y="380" width="120" height="50" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2" rx="8"/>
  <text x="560" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#9c27b0">Paired Data?</text>
  <text x="560" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Same subjects</text>
  <text x="560" y="427" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">measured twice</text>
  
  <rect x="680" y="380" width="120" height="50" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2" rx="8"/>
  <text x="740" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#9c27b0">Independent?</text>
  <text x="740" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Different subjects</text>
  <text x="740" y="427" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">in each group</text>
  
  <!-- Normality Check -->
  <rect x="420" y="480" width="360" height="30" fill="#fff9c4" stroke="#fbc02d" stroke-width="2" rx="8"/>
  <text x="600" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f57c00">Are data normally distributed?</text>
  
  <!-- Final Test Recommendations -->
  
  <!-- Paired Tests -->
  <rect x="380" y="550" width="100" height="60" fill="#e8f5e8" stroke="#4caf50" stroke-width="2" rx="8"/>
  <text x="430" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">Normal</text>
  <text x="430" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#4caf50">Paired t-test</text>
  <text x="430" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">Parametric</text>
  
  <rect x="500" y="550" width="100" height="60" fill="#ffebee" stroke="#f44336" stroke-width="2" rx="8"/>
  <text x="550" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">Non-normal</text>
  <text x="550" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#f44336">Wilcoxon</text>
  <text x="550" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">Signed-rank</text>
  
  <!-- Independent Tests -->
  <rect x="640" y="550" width="100" height="60" fill="#e8f5e8" stroke="#4caf50" stroke-width="2" rx="8"/>
  <text x="690" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">Normal</text>
  <text x="690" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#4caf50">Independent</text>
  <text x="690" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">t-test</text>
  
  <rect x="760" y="550" width="100" height="60" fill="#ffebee" stroke="#f44336" stroke-width="2" rx="8"/>
  <text x="810" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">Non-normal</text>
  <text x="810" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#f44336">Mann-Whitney</text>
  <text x="810" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">U test</text>
  
  <!-- Multiple Groups Tests -->
  <rect x="880" y="380" width="100" height="60" fill="#e8f5e8" stroke="#4caf50" stroke-width="2" rx="8"/>
  <text x="930" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">Normal</text>
  <text x="930" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#4caf50">One-way</text>
  <text x="930" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">ANOVA</text>
  
  <rect x="880" y="460" width="100" height="60" fill="#ffebee" stroke="#f44336" stroke-width="2" rx="8"/>
  <text x="930" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">Non-normal</text>
  <text x="930" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#f44336">Kruskal-Wallis</text>
  <text x="930" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">test</text>
  
  <!-- Decision Guidelines -->
  <rect x="50" y="650" width="900" height="120" fill="#f0f4ff" stroke="#3f51b5" stroke-width="2" rx="10"/>
  <text x="500" y="675" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#3f51b5">Key Decision Guidelines</text>
  
  <text x="70" y="700" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Sample Size:</text>
  <text x="160" y="700" font-family="Arial, sans-serif" font-size="12" fill="#333">Small samples (n &lt; 30) → Consider non-parametric tests</text>
  
  <text x="70" y="720" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Assumptions:</text>
  <text x="150" y="720" font-family="Arial, sans-serif" font-size="12" fill="#333">Check normality, independence, equal variances before parametric tests</text>
  
  <text x="70" y="740" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Effect Size:</text>
  <text x="140" y="740" font-family="Arial, sans-serif" font-size="12" fill="#333">Parametric tests provide more familiar effect size measures</text>
  
  <text x="70" y="760" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Interpretation:</text>
  <text x="160" y="760" font-family="Arial, sans-serif" font-size="12" fill="#333">Parametric tests compare means; non-parametric compare distributions/ranks</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  
  <!-- Arrows and connections -->
  
  <!-- Main branches -->
  <path d="M 450 100 L 250 140" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 550 100 L 750 140" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Categorical branches -->
  <path d="M 160 180 L 120 220" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 220 180 L 300 220" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Continuous branches -->
  <path d="M 750 180 L 650 300" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 850 180 L 930 300" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Two groups branches -->
  <path d="M 620 340 L 560 380" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 680 340 L 740 380" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Normality branches -->
  <path d="M 580 430 L 580 480" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 760 430 L 680 480" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Final test branches -->
  <path d="M 560 510 L 430 550" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 580 510 L 550 550" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 620 510 L 690 550" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 640 510 L 810 550" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Multiple groups branches -->
  <path d="M 930 340 L 930 380" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 930 440 L 930 460" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Labels for arrows -->
  <text x="350" y="125" font-family="Arial, sans-serif" font-size="10" fill="#666">Categorical</text>
  <text x="650" y="125" font-family="Arial, sans-serif" font-size="10" fill="#666">Continuous</text>
  <text x="590" y="365" font-family="Arial, sans-serif" font-size="10" fill="#666">Paired</text>
  <text x="710" y="365" font-family="Arial, sans-serif" font-size="10" fill="#666">Independent</text>
  <text x="430" y="535" font-family="Arial, sans-serif" font-size="10" fill="#4caf50">Normal</text>
  <text x="580" y="535" font-family="Arial, sans-serif" font-size="10" fill="#f44336">Non-normal</text>
  <text x="920" y="365" font-family="Arial, sans-serif" font-size="10" fill="#4caf50">Normal</text>
  <text x="850" y="450" font-family="Arial, sans-serif" font-size="10" fill="#f44336">Non-normal</text>
</svg>