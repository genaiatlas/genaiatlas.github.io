<svg viewBox="0 0 900 650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f9ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0f2fe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="meanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="medianGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="modeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="650" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" fill="#1e40af" font-family="Arial, sans-serif" font-size="28" font-weight="bold">Measures of Central Tendency</text>
  <text x="450" y="65" text-anchor="middle" fill="#1e40af" font-family="Arial, sans-serif" font-size="16">Finding the "Center" of Your Data</text>
  
  <!-- Distribution Background -->
  <rect x="50" y="100" width="800" height="300" fill="white" stroke="#cbd5e1" stroke-width="2" rx="10"/>
  
  <!-- Sample Data Points -->
  <text x="60" y="130" fill="#374151" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Sample Dataset: [2, 3, 3, 4, 5, 5, 5, 6, 7, 8, 12]</text>
  
  <!-- Data visualization as histogram -->
  <g transform="translate(100, 200)">
    <!-- X-axis -->
    <line x1="0" y1="150" x2="600" y2="150" stroke="#374151" stroke-width="2"/>
    <!-- Y-axis -->
    <line x1="0" y1="0" x2="0" y2="150" stroke="#374151" stroke-width="2"/>
    
    <!-- Bars for histogram -->
    <rect x="30" y="120" width="40" height="30" fill="#94a3b8" opacity="0.7"/> <!-- 2: 1 count -->
    <rect x="80" y="90" width="40" height="60" fill="#94a3b8" opacity="0.7"/>  <!-- 3: 2 count -->
    <rect x="130" y="120" width="40" height="30" fill="#94a3b8" opacity="0.7"/> <!-- 4: 1 count -->
    <rect x="180" y="60" width="40" height="90" fill="#94a3b8" opacity="0.7"/>  <!-- 5: 3 count (mode) -->
    <rect x="230" y="120" width="40" height="30" fill="#94a3b8" opacity="0.7"/> <!-- 6: 1 count -->
    <rect x="280" y="120" width="40" height="30" fill="#94a3b8" opacity="0.7"/> <!-- 7: 1 count -->
    <rect x="330" y="120" width="40" height="30" fill="#94a3b8" opacity="0.7"/> <!-- 8: 1 count -->
    <rect x="480" y="120" width="40" height="30" fill="#94a3b8" opacity="0.7"/> <!-- 12: 1 count -->
    
    <!-- X-axis labels -->
    <text x="50" y="170" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">2</text>
    <text x="100" y="170" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">3</text>
    <text x="150" y="170" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">4</text>
    <text x="200" y="170" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">5</text>
    <text x="250" y="170" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">6</text>
    <text x="300" y="170" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">7</text>
    <text x="350" y="170" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">8</text>
    <text x="500" y="170" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">12</text>
    
    <!-- Y-axis labels -->
    <text x="-15" y="125" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="10">1</text>
    <text x="-15" y="95" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="10">2</text>
    <text x="-15" y="65" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="10">3</text>
    
    <!-- Mean line -->
    <line x1="230" y1="0" x2="230" y2="150" stroke="#3b82f6" stroke-width="3" stroke-dasharray="5,5"/>
    <text x="235" y="15" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Mean = 5.45</text>
    
    <!-- Median line -->
    <line x1="200" y1="0" x2="200" y2="150" stroke="#10b981" stroke-width="3" stroke-dasharray="5,5"/>
    <text x="205" y="35" fill="#059669" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Median = 5</text>
    
    <!-- Mode highlight -->
    <rect x="175" y="55" width="50" height="100" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="3,3"/>
    <text x="175" y="50" fill="#d97706" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Mode = 5</text>
  </g>
  
  <!-- Legend and Explanations -->
  <g transform="translate(50, 430)">
    <!-- Mean Card -->
    <rect x="0" y="0" width="250" height="180" rx="10" fill="white" stroke="#3b82f6" stroke-width="2"/>
    <rect x="0" y="0" width="250" height="40" rx="10" fill="url(#meanGrad)"/>
    <text x="125" y="25" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">MEAN (μ or x̄)</text>
    
    <text x="15" y="65" fill="#1e40af" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Formula:</text>
    <text x="15" y="85" fill="#374151" font-family="Arial, sans-serif" font-size="12">x̄ = Σx / n</text>
    
    <text x="15" y="110" fill="#1e40af" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Properties:</text>
    <text x="15" y="125" fill="#374151" font-family="Arial, sans-serif" font-size="11">• Uses all data points</text>
    <text x="15" y="140" fill="#374151" font-family="Arial, sans-serif" font-size="11">• Sensitive to outliers</text>
    <text x="15" y="155" fill="#374151" font-family="Arial, sans-serif" font-size="11">• Minimizes squared deviations</text>
    <text x="15" y="170" fill="#374151" font-family="Arial, sans-serif" font-size="11">• Best for normal distributions</text>
    
    <!-- Median Card -->
    <rect x="270" y="0" width="250" height="180" rx="10" fill="white" stroke="#10b981" stroke-width="2"/>
    <rect x="270" y="0" width="250" height="40" rx="10" fill="url(#medianGrad)"/>
    <text x="395" y="25" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">MEDIAN (Q₂)</text>
    
    <text x="285" y="65" fill="#059669" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Definition:</text>
    <text x="285" y="85" fill="#374151" font-family="Arial, sans-serif" font-size="12">Middle value when sorted</text>
    
    <text x="285" y="110" fill="#059669" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Properties:</text>
    <text x="285" y="125" fill="#374151" font-family="Arial, sans-serif" font-size="11">• Robust to outliers</text>
    <text x="285" y="140" fill="#374151" font-family="Arial, sans-serif" font-size="11">• Divides data in half</text>
    <text x="285" y="155" fill="#374151" font-family="Arial, sans-serif" font-size="11">• Works with ordinal data</text>
    <text x="285" y="170" fill="#374151" font-family="Arial, sans-serif" font-size="11">• Best for skewed distributions</text>
    
    <!-- Mode Card -->
    <rect x="540" y="0" width="250" height="180" rx="10" fill="white" stroke="#f59e0b" stroke-width="2"/>
    <rect x="540" y="0" width="250" height="40" rx="10" fill="url(#modeGrad)"/>
    <text x="665" y="25" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">MODE</text>
    
    <text x="555" y="65" fill="#d97706" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Definition:</text>
    <text x="555" y="85" fill="#374151" font-family="Arial, sans-serif" font-size="12">Most frequent value</text>
    
    <text x="555" y="110" fill="#d97706" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Properties:</text>
    <text x="555" y="125" fill="#374151" font-family="Arial, sans-serif" font-size="11">• Works with any data type</text>
    <text x="555" y="140" fill="#374151" font-family="Arial, sans-serif" font-size="11">• May not exist or be unique</text>
    <text x="555" y="155" fill="#374151" font-family="Arial, sans-serif" font-size="11">• Not affected by extremes</text>
    <text x="555" y="170" fill="#374151" font-family="Arial, sans-serif" font-size="11">• Best for categorical data</text>
  </g>
</svg>