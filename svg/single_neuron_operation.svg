<svg width="700" height="400" viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="700" height="400" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="350" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">Single Neuron Operation</text>
  
  <!-- Input values -->
  <circle cx="80" cy="80" r="15" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="80" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">X₁</text>
  <text x="40" y="85" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Input</text>
  
  <circle cx="80" cy="120" r="15" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="80" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">X₂</text>
  
  <circle cx="80" cy="160" r="15" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="80" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">X₃</text>
  
  <circle cx="80" cy="200" r="15" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="80" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">X₄</text>
  
  <!-- Weights -->
  <text x="150" y="85" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c">W₁</text>
  <text x="150" y="125" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c">W₂</text>
  <text x="150" y="165" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c">W₃</text>
  <text x="150" y="205" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c">W₄</text>
  
  <!-- Connection lines -->
  <line x1="95" y1="80" x2="220" y2="140" stroke="#7f8c8d" stroke-width="2"/>
  <line x1="95" y1="120" x2="220" y2="140" stroke="#7f8c8d" stroke-width="2"/>
  <line x1="95" y1="160" x2="220" y2="140" stroke="#7f8c8d" stroke-width="2"/>
  <line x1="95" y1="200" x2="220" y2="140" stroke="#7f8c8d" stroke-width="2"/>
  
  <!-- Summation node -->
  <circle cx="250" cy="140" r="30" fill="#f39c12" stroke="#e67e22" stroke-width="3"/>
  <text x="250" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">Σ</text>
  <text x="250" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Weighted Sum</text>
  
  <!-- Bias -->
  <circle cx="200" cy="220" r="12" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
  <text x="200" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">b</text>
  <line x1="212" y1="220" x2="230" y2="165" stroke="#9b59b6" stroke-width="2"/>
  <text x="200" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">Bias</text>
  
  <!-- Arrow to activation function -->
  <path d="M 280 140 L 320 140" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Activation function -->
  <rect x="340" y="110" width="80" height="60" fill="#e74c3c" stroke="#c0392b" stroke-width="2" rx="10"/>
  <text x="380" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">σ(z)</text>
  <text x="380" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Activation</text>
  <text x="380" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Function</text>
  
  <!-- Arrow to output -->
  <path d="M 420 140 L 460 140" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Output -->
  <circle cx="500" cy="140" r="25" fill="#27ae60" stroke="#229954" stroke-width="3"/>
  <text x="500" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Output</text>
  <text x="500" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Final Result</text>
  
  <!-- Mathematical equations -->
  <rect x="50" y="270" width="600" height="110" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" rx="5"/>
  <text x="350" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Mathematical Operations</text>
  
  <!-- Step 1 -->
  <text x="70" y="310" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#3498db">Step 1: Weighted Sum</text>
  <text x="70" y="325" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Z = X₁ × W₁ + X₂ × W₂ + X₃ × W₃ + X₄ × W₄ + b</text>
  
  <!-- Step 2 -->
  <text x="70" y="345" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e74c3c">Step 2: Activation Function</text>
  <text x="70" y="360" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Output = σ(Z) = 1 / (1 + e⁻ᶻ)  [Sigmoid example]</text>
  
  <!-- Arrow definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/>
    </marker>
  </defs>
  
  <!-- Process flow arrows -->
  <text x="580" y="85" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Process Flow:</text>
  <text x="580" y="105" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">Inputs → Weights → Sum → Activation → Output</text>
  
  <!-- Key characteristics -->
  <rect x="520" y="120" width="160" height="80" fill="#ffffff" stroke="#95a5a6" stroke-width="1" rx="3"/>
  <text x="600" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#2c3e50">Key Properties</text>
  
  <text x="530" y="150" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">• Weighted inputs</text>
  <text x="530" y="162" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">• Bias addition</text>
  <text x="530" y="174" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">• Non-linear activation</text>
  <text x="530" y="186" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">• Single output value</text>
  
</svg>