<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #2c3e50; }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #34495e; }
      .label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #2c3e50; }
      .formula { font-family: 'Courier New', monospace; font-size: 12px; fill: #2c3e50; }
      .highlight-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #e74c3c; }
      .coin-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10px; fill: white; font-weight: bold; }
    </style>
  </defs>
  
  <!-- Title -->
  <text x="450" y="25" text-anchor="middle" class="title">Variance Reduction Through Averaging</text>
  <text x="450" y="45" text-anchor="middle" class="subtitle">From Coin Flips to Machine Learning Ensembles</text>
  
  <!-- Coin Flip Analogy Section -->
  <rect x="50" y="70" width="380" height="180" fill="#ecf0f1" rx="10" stroke="#bdc3c7" stroke-width="2"/>
  <text x="240" y="95" text-anchor="middle" class="subtitle">Coin Flip Analogy</text>
  
  <!-- Single coin flip -->
  <text x="70" y="120" class="label">Single Flip:</text>
  <circle cx="90" cy="140" r="15" fill="#f39c12"/>
  <text x="90" y="145" text-anchor="middle" class="coin-text">H</text>
  <text x="120" y="145" class="label">Estimate: p̂ = 1.0 (High Variance)</text>
  
  <!-- Multiple coin flips -->
  <text x="70" y="170" class="label">10 Flips:</text>
  <g transform="translate(90, 185)">
    <circle cx="0" cy="0" r="8" fill="#f39c12"/>
    <text x="0" y="3" text-anchor="middle" class="coin-text" style="font-size: 8px;">H</text>
    <circle cx="20" cy="0" r="8" fill="#95a5a6"/>
    <text x="20" y="3" text-anchor="middle" class="coin-text" style="font-size: 8px;">T</text>
    <circle cx="40" cy="0" r="8" fill="#f39c12"/>
    <text x="40" y="3" text-anchor="middle" class="coin-text" style="font-size: 8px;">H</text>
    <circle cx="60" cy="0" r="8" fill="#f39c12"/>
    <text x="60" y="3" text-anchor="middle" class="coin-text" style="font-size: 8px;">H</text>
    <circle cx="80" cy="0" r="8" fill="#95a5a6"/>
    <text x="80" y="3" text-anchor="middle" class="coin-text" style="font-size: 8px;">T</text>
    <circle cx="100" cy="0" r="8" fill="#f39c12"/>
    <text x="100" y="3" text-anchor="middle" class="coin-text" style="font-size: 8px;">H</text>
    <circle cx="120" cy="0" r="8" fill="#f39c12"/>
    <text x="120" y="3" text-anchor="middle" class="coin-text" style="font-size: 8px;">H</text>
    <circle cx="140" cy="0" r="8" fill="#95a5a6"/>
    <text x="140" y="3" text-anchor="middle" class="coin-text" style="font-size: 8px;">T</text>
    <circle cx="160" cy="0" r="8" fill="#f39c12"/>
    <text x="160" y="3" text-anchor="middle" class="coin-text" style="font-size: 8px;">H</text>
    <circle cx="180" cy="0" r="8" fill="#f39c12"/>
    <text x="180" y="3" text-anchor="middle" class="coin-text" style="font-size: 8px;">H</text>
  </g>
  <text x="70" y="205" class="label">Average: p̂ = 7/10 = 0.7 (Lower Variance)</text>
  
  <!-- 1000 flips representation -->
  <text x="70" y="225" class="label">1000 Flips:</text>
  <rect x="90" y="215" width="100" height="15" fill="#3498db" rx="2"/>
  <text x="140" y="227" text-anchor="middle" class="coin-text" style="font-size: 8px;">700H, 300T</text>
  <text x="200" y="225" class="label">p̂ = 0.70 (Very Low Variance)</text>
  
  <!-- Machine Learning Analogy -->
  <rect x="470" y="70" width="380" height="180" fill="#e8f5ff" rx="10" stroke="#3498db" stroke-width="2"/>
  <text x="660" y="95" text-anchor="middle" class="subtitle">Machine Learning Ensemble</text>
  
  <!-- Single model -->
  <text x="490" y="120" class="label">Single Model:</text>
  <rect x="590" y="105" width="60" height="25" fill="#34495e" rx="3"/>
  <text x="620" y="121" text-anchor="middle" class="coin-text">Model₁</text>
  <text x="665" y="120" class="label">High Variance Predictions</text>
  
  <!-- Multiple models -->
  <text x="490" y="150" class="label">Bagging:</text>
  <g transform="translate(590, 135)">
    <rect x="0" y="0" width="30" height="20" fill="#e67e22" rx="2"/>
    <text x="15" y="13" text-anchor="middle" class="coin-text" style="font-size: 8px;">M₁</text>
    <rect x="35" y="0" width="30" height="20" fill="#e67e22" rx="2"/>
    <text x="50" y="13" text-anchor="middle" class="coin-text" style="font-size: 8px;">M₂</text>
    <rect x="70" y="0" width="30" height="20" fill="#e67e22" rx="2"/>
    <text x="85" y="13" text-anchor="middle" class="coin-text" style="font-size: 8px;">M₃</text>
    <rect x="105" y="0" width="30" height="20" fill="#e67e22" rx="2"/>
    <text x="120" y="13" text-anchor="middle" class="coin-text" style="font-size: 8px;">M₄</text>
    <rect x="140" y="0" width="30" height="20" fill="#e67e22" rx="2"/>
    <text x="155" y="13" text-anchor="middle" class="coin-text" style="font-size: 8px;">M₅</text>
  </g>
  <text x="490" y="175" class="label">Average Predictions → Lower Variance</text>
  
  <!-- Large ensemble -->
  <text x="490" y="200" class="label">100 Models:</text>
  <rect x="590" y="185" width="120" height="20" fill="#27ae60" rx="2"/>
  <text x="650" y="198" text-anchor="middle" class="coin-text" style="font-size: 9px;">Ensemble Average</text>
  <text x="720" y="200" class="label">Very Low Variance</text>
  
  <!-- Mathematical Foundation -->
  <rect x="100" y="280" width="700" height="150" fill="#f8f9fa" rx="10" stroke="#6c757d" stroke-width="2"/>
  <text x="450" y="305" text-anchor="middle" class="subtitle">Mathematical Foundation of Variance Reduction</text>
  
  <!-- Key formula -->
  <text x="450" y="335" text-anchor="middle" class="formula" style="font-size: 16px;">Var(X̄) = σ²/n</text>
  
  <text x="120" y="360" class="label">Where:</text>
  <text x="140" y="375" class="label">• X̄ = Average of n independent random variables</text>
  <text x="140" y="390" class="label">• σ² = Variance of individual variable</text>
  <text x="140" y="405" class="label">• n = Number of variables being averaged</text>
  
  <!-- Key insight -->
  <text x="450" y="360" class="highlight-text">Key Insight: Variance decreases by factor of n!</text>
  
  <!-- Examples -->
  <text x="500" y="380" class="label">Examples:</text>
  <text x="520" y="395" class="label">• 1 model: Var = σ²</text>
  <text x="520" y="410" class="label">• 10 models: Var = σ²/10</text>
  <text x="520" y="425" class="label">• 100 models: Var = σ²/100</text>
  
  <!-- Requirements box -->
  <rect x="150" y="450" width="600" height="40" fill="#fff3cd" stroke="#856404" stroke-width="2" rx="5"/>
  <text x="450" y="467" text-anchor="middle" class="highlight-text">Critical Requirement: Independence</text>
  <text x="450" y="482" text-anchor="middle" class="label">Models must make uncorrelated errors for maximum variance reduction</text>
  
</svg>