<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="500" y="35" font-size="24" font-weight="bold" text-anchor="middle" fill="#2C3E50">
    Matrix Transformation: Ratings to Comparisons
  </text>
  
  <!-- Original Rating Matrix -->
  <rect x="50" y="70" width="380" height="250" fill="#E8F4F8" stroke="#3498DB" stroke-width="2" rx="10"/>
  <text x="240" y="100" font-size="18" font-weight="bold" text-anchor="middle" fill="#2C3E50">
    Original Rating Matrix
  </text>
  
  <!-- Rating matrix table -->
  <g transform="translate(80, 120)">
    <!-- Header row -->
    <rect x="0" y="0" width="320" height="35" fill="#3498DB"/>
    <line x1="80" y1="0" x2="80" y2="175" stroke="white" stroke-width="2"/>
    <line x1="160" y1="0" x2="160" y2="175" stroke="white" stroke-width="2"/>
    <line x1="240" y1="0" x2="240" y2="175" stroke="white" stroke-width="2"/>
    
    <text x="40" y="23" font-size="12" font-weight="bold" fill="white" text-anchor="middle">User</text>
    <text x="120" y="23" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Movie A</text>
    <text x="200" y="23" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Movie B</text>
    <text x="280" y="23" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Movie C</text>
    
    <!-- Data rows -->
    <rect x="0" y="35" width="320" height="35" fill="white" stroke="#BDC3C7" stroke-width="1"/>
    <text x="40" y="57" font-size="11" fill="#2C3E50" text-anchor="middle">User 1</text>
    <text x="120" y="57" font-size="13" font-weight="bold" fill="#27AE60" text-anchor="middle">5</text>
    <text x="200" y="57" font-size="13" font-weight="bold" fill="#F39C12" text-anchor="middle">4</text>
    <text x="280" y="57" font-size="13" font-weight="bold" fill="#E67E22" text-anchor="middle">3</text>
    
    <rect x="0" y="70" width="320" height="35" fill="#F8F9F9" stroke="#BDC3C7" stroke-width="1"/>
    <text x="40" y="92" font-size="11" fill="#2C3E50" text-anchor="middle">User 2</text>
    <text x="120" y="92" font-size="13" font-weight="bold" fill="#E67E22" text-anchor="middle">3</text>
    <text x="200" y="92" font-size="13" font-weight="bold" fill="#27AE60" text-anchor="middle">5</text>
    <text x="280" y="92" font-size="13" font-weight="bold" fill="#E74C3C" text-anchor="middle">2</text>
    
    <rect x="0" y="105" width="320" height="35" fill="white" stroke="#BDC3C7" stroke-width="1"/>
    <text x="40" y="127" font-size="11" fill="#2C3E50" text-anchor="middle">User 3</text>
    <text x="120" y="127" font-size="13" font-weight="bold" fill="#F39C12" text-anchor="middle">4</text>
    <text x="200" y="127" font-size="13" font-weight="bold" fill="#E67E22" text-anchor="middle">3</text>
    <text x="280" y="127" font-size="13" font-weight="bold" fill="#27AE60" text-anchor="middle">5</text>
    
    <rect x="0" y="140" width="320" height="35" fill="#F8F9F9" stroke="#BDC3C7" stroke-width="1"/>
    <text x="40" y="162" font-size="11" fill="#2C3E50" text-anchor="middle">User 4</text>
    <text x="120" y="162" font-size="13" font-weight="bold" fill="#27AE60" text-anchor="middle">5</text>
    <text x="200" y="162" font-size="13" font-weight="bold" fill="#27AE60" text-anchor="middle">5</text>
    <text x="280" y="162" font-size="13" font-weight="bold" fill="#F39C12" text-anchor="middle">4</text>
  </g>
  
  <!-- Dimension info -->
  <text x="240" y="310" font-size="12" fill="#7F8C8D" text-anchor="middle">
    Dimensions: Users × Items (4 × 3)
  </text>
  
  <!-- Transformation arrow -->
  <g transform="translate(450, 190)">
    <path d="M 0 0 L 90 0" stroke="#E67E22" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
    <rect x="15" y="-35" width="65" height="25" fill="#FEF5E7" stroke="#E67E22" stroke-width="1" rx="4"/>
    <text x="47" y="-17" font-size="11" font-weight="bold" fill="#E67E22" text-anchor="middle">Transform</text>
  </g>
  
  <!-- Comparison Matrix -->
  <rect x="570" y="70" width="400" height="250" fill="#FEF5E7" stroke="#E67E22" stroke-width="2" rx="10"/>
  <text x="770" y="100" font-size="18" font-weight="bold" text-anchor="middle" fill="#2C3E50">
    Comparison Matrix
  </text>
  
  <!-- Comparison matrix table -->
  <g transform="translate(600, 120)">
    <!-- Header row -->
    <rect x="0" y="0" width="340" height="35" fill="#E67E22"/>
    <line x1="80" y1="0" x2="80" y2="175" stroke="white" stroke-width="2"/>
    <line x1="160" y1="0" x2="160" y2="175" stroke="white" stroke-width="2"/>
    <line x1="240" y1="0" x2="240" y2="175" stroke="white" stroke-width="2"/>
    
    <text x="40" y="23" font-size="12" font-weight="bold" fill="white" text-anchor="middle">User</text>
    <text x="120" y="23" font-size="11" font-weight="bold" fill="white" text-anchor="middle">A vs B</text>
    <text x="200" y="23" font-size="11" font-weight="bold" fill="white" text-anchor="middle">B vs C</text>
    <text x="280" y="23" font-size="11" font-weight="bold" fill="white" text-anchor="middle">A vs C</text>
    
    <!-- Data rows -->
    <rect x="0" y="35" width="340" height="35" fill="white" stroke="#BDC3C7" stroke-width="1"/>
    <text x="40" y="57" font-size="11" fill="#2C3E50" text-anchor="middle">User 1</text>
    <circle cx="120" cy="52" r="12" fill="#27AE60"/>
    <text x="120" y="57" font-size="11" font-weight="bold" fill="white" text-anchor="middle">+1</text>
    <circle cx="200" cy="52" r="12" fill="#27AE60"/>
    <text x="200" y="57" font-size="11" font-weight="bold" fill="white" text-anchor="middle">+1</text>
    <circle cx="280" cy="52" r="12" fill="#27AE60"/>
    <text x="280" y="57" font-size="11" font-weight="bold" fill="white" text-anchor="middle">+1</text>
    
    <rect x="0" y="70" width="340" height="35" fill="#F8F9F9" stroke="#BDC3C7" stroke-width="1"/>
    <text x="40" y="92" font-size="11" fill="#2C3E50" text-anchor="middle">User 2</text>
    <circle cx="120" cy="87" r="12" fill="#E74C3C"/>
    <text x="120" y="92" font-size="11" font-weight="bold" fill="white" text-anchor="middle">-1</text>
    <circle cx="200" cy="87" r="12" fill="#27AE60"/>
    <text x="200" y="92" font-size="11" font-weight="bold" fill="white" text-anchor="middle">+1</text>
    <circle cx="280" cy="87" r="12" fill="#27AE60"/>
    <text x="280" y="92" font-size="11" font-weight="bold" fill="white" text-anchor="middle">+1</text>
    
    <rect x="0" y="105" width="340" height="35" fill="white" stroke="#BDC3C7" stroke-width="1"/>
    <text x="40" y="127" font-size="11" fill="#2C3E50" text-anchor="middle">User 3</text>
    <circle cx="120" cy="122" r="12" fill="#27AE60"/>
    <text x="120" y="127" font-size="11" font-weight="bold" fill="white" text-anchor="middle">+1</text>
    <circle cx="200" cy="122" r="12" fill="#E74C3C"/>
    <text x="200" y="127" font-size="11" font-weight="bold" fill="white" text-anchor="middle">-1</text>
    <circle cx="280" cy="122" r="12" fill="#E74C3C"/>
    <text x="280" y="127" font-size="11" font-weight="bold" fill="white" text-anchor="middle">-1</text>
    
    <rect x="0" y="140" width="340" height="35" fill="#F8F9F9" stroke="#BDC3C7" stroke-width="1"/>
    <text x="40" y="162" font-size="11" fill="#2C3E50" text-anchor="middle">User 4</text>
    <circle cx="120" cy="157" r="12" fill="#95A5A6"/>
    <text x="120" y="162" font-size="11" font-weight="bold" fill="white" text-anchor="middle">0</text>
    <circle cx="200" cy="157" r="12" fill="#27AE60"/>
    <text x="200" y="162" font-size="11" font-weight="bold" fill="white" text-anchor="middle">+1</text>
    <circle cx="280" cy="157" r="12" fill="#27AE60"/>
    <text x="280" y="162" font-size="11" font-weight="bold" fill="white" text-anchor="middle">+1</text>
  </g>
  
  <!-- Dimension info -->
  <text x="770" y="310" font-size="12" fill="#7F8C8D" text-anchor="middle">
    Dimensions: Users × Pairs (4 × 3)
  </text>
  
  <!-- Transformation Rules -->
  <rect x="50" y="360" width="900" height="310" fill="#F8F9F9" stroke="#34495E" stroke-width="2" rx="10"/>
  <text x="500" y="390" font-size="18" font-weight="bold" text-anchor="middle" fill="#2C3E50">
    Transformation Rules
  </text>
  
  <!-- Rule 1 -->
  <g transform="translate(80, 410)">
    <rect x="0" y="0" width="400" height="80" fill="white" stroke="#3498DB" stroke-width="2" rx="6"/>
    <text x="15" y="25" font-size="14" font-weight="bold" fill="#2C3E50">Rule 1: If Rating(A) &gt; Rating(B)</text>
    <text x="15" y="45" font-size="13" fill="#34495E">→ Comparison(A vs B) = +1</text>
    <text x="15" y="65" font-size="11" fill="#7F8C8D">Example: Rating(A)=5, Rating(B)=4 → +1</text>
  </g>
  
  <!-- Rule 2 -->
  <g transform="translate(520, 410)">
    <rect x="0" y="0" width="400" height="80" fill="white" stroke="#E74C3C" stroke-width="2" rx="6"/>
    <text x="15" y="25" font-size="14" font-weight="bold" fill="#2C3E50">Rule 2: If Rating(A) &lt; Rating(B)</text>
    <text x="15" y="45" font-size="13" fill="#34495E">→ Comparison(A vs B) = -1</text>
    <text x="15" y="65" font-size="11" fill="#7F8C8D">Example: Rating(A)=3, Rating(B)=5 → -1</text>
  </g>
  
  <!-- Rule 3 -->
  <g transform="translate(80, 510)">
    <rect x="0" y="0" width="400" height="80" fill="white" stroke="#95A5A6" stroke-width="2" rx="6"/>
    <text x="15" y="25" font-size="14" font-weight="bold" fill="#2C3E50">Rule 3: If Rating(A) = Rating(B)</text>
    <text x="15" y="45" font-size="13" fill="#34495E">→ Comparison(A vs B) = 0 or skip</text>
    <text x="15" y="65" font-size="11" fill="#7F8C8D">Example: Rating(A)=5, Rating(B)=5 → 0 (tie)</text>
  </g>
  
  <!-- Number of comparisons formula -->
  <g transform="translate(520, 510)">
    <rect x="0" y="0" width="400" height="80" fill="white" stroke="#9B59B6" stroke-width="2" rx="6"/>
    <text x="15" y="25" font-size="14" font-weight="bold" fill="#2C3E50">Total Comparisons Formula</text>
    <text x="15" y="50" font-size="16" fill="#9B59B6" font-weight="bold">C = N × (N - 1) / 2</text>
    <text x="15" y="70" font-size="11" fill="#7F8C8D">For 3 items: 3 × 2 / 2 = 3 pairs</text>
  </g>
  
  <!-- Summary box -->
  <rect x="80" y="610" width="840" height="45" fill="#ECF0F1" stroke="#34495E" stroke-width="1" rx="6"/>
  <text x="500" y="635" font-size="13" fill="#2C3E50" text-anchor="middle">
    <tspan font-weight="bold">Key Insight:</tspan> The comparison matrix captures relative preferences, eliminating rating scale biases while increasing dimensionality from N items to N(N-1)/2 item pairs.
  </text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#E67E22"/>
    </marker>
  </defs>
</svg>