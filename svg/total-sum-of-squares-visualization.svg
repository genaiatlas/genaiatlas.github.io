<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title-text { font-family: 'Arial', sans-serif; font-size: 24px; font-weight: bold; fill: #2c3e50; }
      .subtitle-text { font-family: 'Arial', sans-serif; font-size: 18px; font-weight: bold; fill: #34495e; }
      .label-text { font-family: 'Arial', sans-serif; font-size: 14px; fill: #34495e; }
      .small-text { font-family: 'Arial', sans-serif; font-size: 12px; fill: #7f8c8d; }
      .equation-text { font-family: 'Times New Roman', serif; font-size: 16px; fill: #2c3e50; }
      .axis-line { stroke: #2c3e50; stroke-width: 2; }
      .grid-line { stroke: #ecf0f1; stroke-width: 1; }
      .data-point { fill: #e74c3c; stroke: #c0392b; stroke-width: 2; }
      .mean-line { stroke: #3498db; stroke-width: 3; stroke-dasharray: 8,4; }
      .deviation-line { stroke: #e74c3c; stroke-width: 2; stroke-dasharray: 3,3; }
      .deviation-square { fill: rgba(231, 76, 60, 0.2); stroke: #e74c3c; stroke-width: 1; }
      .formula-box { fill: #fff3cd; stroke: #ffc107; stroke-width: 2; rx: 8; }
      .highlight-box { fill: #f8f9fa; stroke: #6c757d; stroke-width: 1; rx: 5; }
    </style>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title-text">Total Sum of Squares (TSS) Visualization</text>
  
  <!-- Main plot -->
  <g transform="translate(80, 70)">
    <text x="200" y="0" text-anchor="middle" class="subtitle-text">Deviations from Sample Mean</text>
    
    <!-- Coordinate system -->
    <g transform="translate(50, 30)">
      <!-- Grid -->
      <line x1="0" y1="50" x2="350" y2="50" class="grid-line"/>
      <line x1="0" y1="100" x2="350" y2="100" class="grid-line"/>
      <line x1="0" y1="150" x2="350" y2="150" class="grid-line"/>
      <line x1="0" y1="200" x2="350" y2="200" class="grid-line"/>
      <line x1="0" y1="250" x2="350" y2="250" class="grid-line"/>
      <line x1="0" y1="300" x2="350" y2="300" class="grid-line"/>
      
      <line x1="70" y1="0" x2="70" y2="350" class="grid-line"/>
      <line x1="140" y1="0" x2="140" y2="350" class="grid-line"/>
      <line x1="210" y1="0" x2="210" y2="350" class="grid-line"/>
      <line x1="280" y1="0" x2="280" y2="350" class="grid-line"/>
      
      <!-- Axes -->
      <line x1="0" y1="350" x2="350" y2="350" class="axis-line"/>
      <line x1="0" y1="0" x2="0" y2="350" class="axis-line"/>
      
      <!-- Sample mean line -->
      <line x1="20" y1="175" x2="330" y2="175" class="mean-line"/>
      
      <!-- Data points with deviations -->
      <!-- Point 1 -->
      <circle cx="50" cy="280" r="4" class="data-point"/>
      <line x1="50" y1="280" x2="50" y2="175" class="deviation-line"/>
      <rect x="45" y="175" width="10" height="105" class="deviation-square"/>
      <text x="60" y="285" class="small-text">Y₁</text>
      
      <!-- Point 2 -->
      <circle cx="90" cy="220" r="4" class="data-point"/>
      <line x1="90" y1="220" x2="90" y2="175" class="deviation-line"/>
      <rect x="85" y="175" width="10" height="45" class="deviation-square"/>
      <text x="100" y="225" class="small-text">Y₂</text>
      
      <!-- Point 3 -->
      <circle cx="130" cy="120" r="4" class="data-point"/>
      <line x1="130" y1="120" x2="130" y2="175" class="deviation-line"/>
      <rect x="125" y="120" width="10" height="55" class="deviation-square"/>
      <text x="140" y="125" class="small-text">Y₃</text>
      
      <!-- Point 4 -->
      <circle cx="170" cy="100" r="4" class="data-point"/>
      <line x1="170" y1="100" x2="170" y2="175" class="deviation-line"/>
      <rect x="165" y="100" width="10" height="75" class="deviation-square"/>
      <text x="180" y="105" class="small-text">Y₄</text>
      
      <!-- Point 5 -->
      <circle cx="210" cy="150" r="4" class="data-point"/>
      <line x1="210" y1="150" x2="210" y2="175" class="deviation-line"/>
      <rect x="205" y="150" width="10" height="25" class="deviation-square"/>
      <text x="220" y="155" class="small-text">Y₅</text>
      
      <!-- Point 6 -->
      <circle cx="250" cy="200" r="4" class="data-point"/>
      <line x1="250" y1="200" x2="250" y2="175" class="deviation-line"/>
      <rect x="245" y="175" width="10" height="25" class="deviation-square"/>
      <text x="260" y="205" class="small-text">Y₆</text>
      
      <!-- Point 7 -->
      <circle cx="290" cy="240" r="4" class="data-point"/>
      <line x1="290" y1="240" x2="290" y2="175" class="deviation-line"/>
      <rect x="285" y="175" width="10" height="65" class="deviation-square"/>
      <text x="300" y="245" class="small-text">Y₇</text>
      
      <!-- Axis labels -->
      <text x="175" y="375" text-anchor="middle" class="label-text">X (Independent Variable)</text>
      <text x="-25" y="175" text-anchor="middle" class="label-text" transform="rotate(-90, -25, 175)">Y (Dependent Variable)</text>
      
      <!-- Mean line label -->
      <text x="340" y="170" class="label-text" fill="#2980b9">Ȳ (Sample Mean)</text>
      
      <!-- Legend -->
      <g transform="translate(10, 10)">
        <circle cx="0" cy="0" r="3" class="data-point"/>
        <text x="10" y="4" class="small-text">Data points</text>
        
        <line x1="0" y1="15" x2="20" y2="15" class="mean-line"/>
        <text x="25" y="19" class="small-text">Sample mean (Ȳ)</text>
        
        <line x1="0" y1="30" x2="15" y2="30" class="deviation-line"/>
        <text x="20" y="34" class="small-text">Deviations</text>
        
        <rect x="0" y="40" width="8" height="8" class="deviation-square"/>
        <text x="15" y="48" class="small-text">Squared deviations</text>
      </g>
    </g>
  </g>
  
  <!-- TSS Formula -->
  <g transform="translate(50, 450)">
    <rect x="0" y="0" width="700" height="120" class="formula-box"/>
    <text x="350" y="30" text-anchor="middle" class="subtitle-text" fill="#856404">Total Sum of Squares Formula</text>
    
    <text x="350" y="60" text-anchor="middle" class="equation-text">TSS = Σᵢ₌₁ⁿ (Yᵢ - Ȳ)²</text>
    
    <text x="50" y="85" class="label-text" fill="#856404">Where:</text>
    <text x="70" y="100" class="small-text">• Yᵢ = observed value for observation i</text>
    <text x="350" y="100" class="small-text">• Ȳ = sample mean of Y</text>
    <text x="550" y="100" class="small-text">• n = number of observations</text>
  </g>
  
  <!-- Key Properties -->
  <g transform="translate(450, 70)">
    <rect x="0" y="0" width="300" height="200" class="highlight-box"/>
    <text x="150" y="25" text-anchor="middle" class="subtitle-text">TSS Properties</text>
    
    <text x="20" y="50" class="label-text">📊 Measures total variation</text>
    <text x="30" y="70" class="small-text">• Quantifies spread around mean</text>
    <text x="30" y="85" class="small-text">• Larger TSS = more variability</text>
    
    <text x="20" y="110" class="label-text">📏 Always non-negative</text>
    <text x="30" y="130" class="small-text">• TSS ≥ 0 (squared terms)</text>
    <text x="30" y="145" class="small-text">• TSS = 0 only if all Y are equal</text>
    
    <text x="20" y="170" class="label-text">⚖️ Baseline for comparison</text>
    <text x="30" y="190" class="small-text">• Denominator in R² formula</text>
  </g>
  
  <!-- Interpretation -->
  <g transform="translate(450, 290)">
    <rect x="0" y="0" width="300" height="130" class="highlight-box"/>
    <text x="150" y="25" text-anchor="middle" class="subtitle-text">Interpretation</text>
    
    <text x="20" y="50" class="small-text">TSS represents the "worst case"</text>
    <text x="20" y="65" class="small-text">scenario where we predict using</text>
    <text x="20" y="80" class="small-text">only the mean (no X information).</text>
    
    <text x="20" y="105" class="small-text">Any model should reduce this</text>
    <text x="20" y="120" class="small-text">total variation to be useful.</text>
  </g>
</svg>