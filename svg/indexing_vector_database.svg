<svg viewBox="0 0 1400 950" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1400" height="950" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="700" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Vector Database Architecture for RAG
  </text>
  <text x="700" y="70" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#495057">
    Efficient Storage and Retrieval of High-Dimensional Embeddings
  </text>
  
  <!-- Input: Documents with Embeddings -->
  <rect x="50" y="110" width="220" height="140" rx="10" fill="#e9ecef" stroke="#495057" stroke-width="2"/>
  <text x="160" y="140" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    📄 Input Documents
  </text>
  <text x="160" y="165" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#495057">
    + Embeddings
  </text>
  <text x="70" y="195" font-family="Arial, sans-serif" font-size="11" fill="#868e96">
    Doc 1: [0.23, 0.45, ...]
  </text>
  <text x="70" y="215" font-family="Arial, sans-serif" font-size="11" fill="#868e96">
    Doc 2: [0.67, 0.12, ...]
  </text>
  <text x="70" y="235" font-family="Arial, sans-serif" font-size="11" fill="#868e96">
    Doc N: [0.89, 0.34, ...]
  </text>
  
  <!-- Arrow -->
  <path d="M 270 180 L 340 180" stroke="#495057" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Vector Database System -->
  <rect x="340" y="110" width="1010" height="720" rx="15" fill="#d0ebff" stroke="#1c7ed6" stroke-width="4"/>
  <text x="845" y="150" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    🗄️ Vector Database System
  </text>
  
  <!-- Indexing Layer -->
  <g id="indexing-layer">
    <rect x="370" y="180" width="950" height="180" rx="10" fill="#fff" stroke="#1c7ed6" stroke-width="3"/>
    <text x="845" y="210" font-family="Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      1️⃣ Indexing Layer
    </text>
    
    <!-- Index Types -->
    <rect x="390" y="230" width="200" height="110" rx="8" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="2"/>
    <text x="490" y="255" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Flat Index
    </text>
    <text x="410" y="280" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Exact search
    </text>
    <text x="410" y="298" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • No compression
    </text>
    <text x="410" y="316" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Best accuracy
    </text>
    <text x="490" y="335" font-family="Arial, sans-serif" font-size="10" fill="#868e96">
      Small datasets
    </text>
    
    <rect x="610" y="230" width="200" height="110" rx="8" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="2"/>
    <text x="710" y="255" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      IVF Index
    </text>
    <text x="630" y="280" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Clustering (k-means)
    </text>
    <text x="630" y="298" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Fast approximate
    </text>
    <text x="630" y="316" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Balanced trade-off
    </text>
    <text x="710" y="335" font-family="Arial, sans-serif" font-size="10" fill="#868e96">
      Medium-large datasets
    </text>
    
    <rect x="830" y="230" width="200" height="110" rx="8" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="2"/>
    <text x="930" y="255" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      HNSW Index
    </text>
    <text x="850" y="280" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Graph-based
    </text>
    <text x="850" y="298" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Very fast queries
    </text>
    <text x="850" y="316" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • High accuracy
    </text>
    <text x="930" y="335" font-family="Arial, sans-serif" font-size="10" fill="#868e96">
      Large-scale systems
    </text>
    
    <rect x="1050" y="230" width="250" height="110" rx="8" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="2"/>
    <text x="1175" y="255" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Hybrid Indexes
    </text>
    <text x="1070" y="280" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • IVF + PQ (compression)
    </text>
    <text x="1070" y="298" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • HNSW + SQ
    </text>
    <text x="1070" y="316" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Custom combinations
    </text>
    <text x="1175" y="335" font-family="Arial, sans-serif" font-size="10" fill="#868e96">
      Optimized performance
    </text>
  </g>
  
  <!-- Storage Layer -->
  <g id="storage-layer">
    <rect x="370" y="380" width="610" height="180" rx="10" fill="#fff" stroke="#1c7ed6" stroke-width="3"/>
    <text x="675" y="410" font-family="Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      2️⃣ Storage Layer
    </text>
    
    <rect x="390" y="430" width="270" height="110" rx="8" fill="#fff9db" stroke="#fab005" stroke-width="2"/>
    <text x="525" y="455" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Vector Storage
    </text>
    <text x="410" y="480" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • High-dimensional arrays
    </text>
    <text x="410" y="498" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Compressed formats (PQ, SQ)
    </text>
    <text x="410" y="516" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Memory/disk optimization
    </text>
    
    <rect x="680" y="430" width="280" height="110" rx="8" fill="#fff9db" stroke="#fab005" stroke-width="2"/>
    <text x="820" y="455" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Metadata Storage
    </text>
    <text x="700" y="480" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Document content
    </text>
    <text x="700" y="498" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Rich metadata fields
    </text>
    <text x="700" y="516" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Key-value or JSON storage
    </text>
  </g>
  
  <!-- Query Processing -->
  <g id="query-processing">
    <rect x="1000" y="380" width="320" height="180" rx="10" fill="#fff" stroke="#1c7ed6" stroke-width="3"/>
    <text x="1160" y="410" font-family="Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      3️⃣ Query Processing
    </text>
    
    <text x="1020" y="445" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1a1a1a">
      Similarity Search:
    </text>
    <text x="1020" y="467" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Cosine similarity
    </text>
    <text x="1020" y="485" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Euclidean distance
    </text>
    <text x="1020" y="503" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Dot product
    </text>
    
    <text x="1020" y="530" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1a1a1a">
      Filtering:
    </text>
    <text x="1020" y="548" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Pre-filtering (metadata)
    </text>
  </g>
  
  <!-- Scalability Features -->
  <g id="scalability">
    <rect x="370" y="580" width="950" height="230" rx="10" fill="#fff" stroke="#1c7ed6" stroke-width="3"/>
    <text x="845" y="610" font-family="Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      4️⃣ Scalability &amp; Performance Features
    </text>
    
    <rect x="390" y="630" width="220" height="160" rx="8" fill="#d3f9d8" stroke="#37b24d" stroke-width="2"/>
    <text x="500" y="655" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Sharding
    </text>
    <text x="410" y="680" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Horizontal partitioning
    </text>
    <text x="410" y="698" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Distributed storage
    </text>
    <text x="410" y="716" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Load balancing
    </text>
    <text x="410" y="734" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Parallel processing
    </text>
    <text x="500" y="765" font-family="Arial, sans-serif" font-size="10" font-style="italic" text-anchor="middle" fill="#37b24d">
      Scale horizontally
    </text>
    
    <rect x="630" y="630" width="220" height="160" rx="8" fill="#d3f9d8" stroke="#37b24d" stroke-width="2"/>
    <text x="740" y="655" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Replication
    </text>
    <text x="650" y="680" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Data redundancy
    </text>
    <text x="650" y="698" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • High availability
    </text>
    <text x="650" y="716" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Fault tolerance
    </text>
    <text x="650" y="734" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Read scaling
    </text>
    <text x="740" y="765" font-family="Arial, sans-serif" font-size="10" font-style="italic" text-anchor="middle" fill="#37b24d">
      Ensure reliability
    </text>
    
    <rect x="870" y="630" width="220" height="160" rx="8" fill="#d3f9d8" stroke="#37b24d" stroke-width="2"/>
    <text x="980" y="655" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Caching
    </text>
    <text x="890" y="680" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Hot data in memory
    </text>
    <text x="890" y="698" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Query result cache
    </text>
    <text x="890" y="716" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Embedding cache
    </text>
    <text x="890" y="734" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • LRU/TTL policies
    </text>
    <text x="980" y="765" font-family="Arial, sans-serif" font-size="10" font-style="italic" text-anchor="middle" fill="#37b24d">
      Boost speed
    </text>
    
    <rect x="1110" y="630" width="190" height="160" rx="8" fill="#d3f9d8" stroke="#37b24d" stroke-width="2"/>
    <text x="1205" y="655" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Monitoring
    </text>
    <text x="1130" y="680" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Query latency
    </text>
    <text x="1130" y="698" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Throughput metrics
    </text>
    <text x="1130" y="716" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Index health
    </text>
    <text x="1130" y="734" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Resource usage
    </text>
    <text x="1205" y="765" font-family="Arial, sans-serif" font-size="10" font-style="italic" text-anchor="middle" fill="#37b24d">
      Optimize ops
    </text>
  </g>
  
  <!-- Popular Vector Databases -->
  <rect x="50" y="280" width="220" height="320" rx="10" fill="#fff3bf" stroke="#fcc419" stroke-width="2"/>
  <text x="160" y="310" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    🛠️ Popular Solutions
  </text>
  <text x="70" y="345" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#495057">
    Specialized:
  </text>
  <text x="70" y="365" font-family="Arial, sans-serif" font-size="11" fill="#495057">
    • Pinecone
  </text>
  <text x="70" y="383" font-family="Arial, sans-serif" font-size="11" fill="#495057">
    • Weaviate
  </text>
  <text x="70" y="401" font-family="Arial, sans-serif" font-size="11" fill="#495057">
    • Qdrant
  </text>
  <text x="70" y="419" font-family="Arial, sans-serif" font-size="11" fill="#495057">
    • Milvus
  </text>
  
  <text x="70" y="450" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#495057">
    Extensions:
  </text>
  <text x="70" y="470" font-family="Arial, sans-serif" font-size="11" fill="#495057">
    • pgvector (Postgres)
  </text>
  <text x="70" y="488" font-family="Arial, sans-serif" font-size="11" fill="#495057">
    • Elasticsearch
  </text>
  <text x="70" y="506" font-family="Arial, sans-serif" font-size="11" fill="#495057">
    • Redis Vector
  </text>
  
  <text x="70" y="537" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#495057">
    Libraries:
  </text>
  <text x="70" y="557" font-family="Arial, sans-serif" font-size="11" fill="#495057">
    • FAISS
  </text>
  <text x="70" y="575" font-family="Arial, sans-serif" font-size="11" fill="#495057">
    • Annoy
  </text>
  
  <!-- Output Arrow -->
  <path d="M 845 830 L 845 890" stroke="#1c7ed6" stroke-width="3" fill="none" marker-end="url(#arrowhead2)"/>
  
  <!-- Output -->
  <rect x="645" y="890" width="400" height="50" rx="10" fill="#d3f9d8" stroke="#37b24d" stroke-width="3"/>
  <text x="845" y="922" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    ⚡ Fast, Scalable Vector Retrieval
  </text>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#495057"/>
    </marker>
    <marker id="arrowhead2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#1c7ed6"/>
    </marker>
  </defs>
</svg>