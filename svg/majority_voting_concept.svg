<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #2c3e50; }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; font-weight: 600; fill: #34495e; }
      .label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #2c3e50; }
      .vote-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: bold; fill: white; }
      .count-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: bold; }
      .result-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: bold; }
      .formula-text { font-family: 'Courier New', monospace; font-size: 13px; fill: #2c3e50; }
      .small-vote { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: bold; fill: white; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3498db"/>
    </marker>
    <marker id="arrowhead2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f39c12"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" class="title">Majority Voting in Ensemble Learning</text>
  
  <!-- Example 1: Clear Majority -->
  <text x="250" y="70" text-anchor="middle" class="subtitle">Example 1: Clear Majority (7 Classifiers)</text>
  
  <!-- New test instance -->
  <rect x="50" y="90" width="100" height="50" fill="#3498db" rx="8"/>
  <text x="100" y="110" text-anchor="middle" class="label" fill="white">New Instance</text>
  <text x="100" y="125" text-anchor="middle" class="label" fill="white">x_test</text>
  
  <!-- Arrow to classifiers -->
  <line x1="150" y1="115" x2="200" y2="115" stroke="#3498db" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Individual Classifier Predictions Label -->
  <text x="350" y="85" text-anchor="middle" class="label">Individual Classifier Predictions</text>
  
  <!-- Classifier predictions -->
  <g transform="translate(220, 100)">
    <!-- Class 1 votes (green) -->
    <circle cx="0" cy="0" r="22" fill="#27ae60"/>
    <text x="0" y="7" text-anchor="middle" class="vote-text">1</text>
    
    <circle cx="60" cy="0" r="22" fill="#27ae60"/>
    <text x="60" y="7" text-anchor="middle" class="vote-text">1</text>
    
    <circle cx="180" cy="0" r="22" fill="#27ae60"/>
    <text x="180" y="7" text-anchor="middle" class="vote-text">1</text>
    
    <circle cx="240" cy="0" r="22" fill="#27ae60"/>
    <text x="240" y="7" text-anchor="middle" class="vote-text">1</text>
    
    <circle cx="300" cy="0" r="22" fill="#27ae60"/>
    <text x="300" y="7" text-anchor="middle" class="vote-text">1</text>
    
    <!-- Class 0 votes (red) -->
    <circle cx="120" cy="0" r="22" fill="#e74c3c"/>
    <text x="120" y="7" text-anchor="middle" class="vote-text">0</text>
    
    <circle cx="360" cy="0" r="22" fill="#e74c3c"/>
    <text x="360" y="7" text-anchor="middle" class="vote-text">0</text>
  </g>
  
  <!-- Vote counting -->
  <text x="250" y="170" text-anchor="middle" class="subtitle">Vote Counting</text>
  <rect x="170" y="180" width="160" height="60" fill="#f39c12" rx="8"/>
  <text x="250" y="205" text-anchor="middle" class="count-text" fill="white">Class 1: 5 votes</text>
  <text x="250" y="225" text-anchor="middle" class="count-text" fill="white">Class 0: 2 votes</text>
  
  <!-- Final decision -->
  <line x1="250" y1="240" x2="250" y2="280" stroke="#f39c12" stroke-width="4" marker-end="url(#arrowhead2)"/>
  <rect x="170" y="290" width="160" height="50" fill="#27ae60" rx="8"/>
  <text x="250" y="310" text-anchor="middle" class="result-text" fill="white">Final Prediction:</text>
  <text x="250" y="330" text-anchor="middle" class="result-text" fill="white">Class 1</text>
  
  <!-- Example 2: Larger Ensemble -->
  <text x="750" y="70" text-anchor="middle" class="subtitle">Example 2: Larger Ensemble (15 Classifiers)</text>
  
  <!-- Grid of predictions with better spacing -->
  <g transform="translate(620, 100)">
    <!-- Row 1 -->
    <circle cx="0" cy="0" r="15" fill="#27ae60"/>
    <text x="0" y="5" text-anchor="middle" class="small-vote">1</text>
    <circle cx="35" cy="0" r="15" fill="#e74c3c"/>
    <text x="35" y="5" text-anchor="middle" class="small-vote">0</text>
    <circle cx="70" cy="0" r="15" fill="#27ae60"/>
    <text x="70" y="5" text-anchor="middle" class="small-vote">1</text>
    <circle cx="105" cy="0" r="15" fill="#27ae60"/>
    <text x="105" y="5" text-anchor="middle" class="small-vote">1</text>
    <circle cx="140" cy="0" r="15" fill="#e74c3c"/>
    <text x="140" y="5" text-anchor="middle" class="small-vote">0</text>
    
    <!-- Row 2 -->
    <circle cx="0" cy="40" r="15" fill="#27ae60"/>
    <text x="0" y="45" text-anchor="middle" class="small-vote">1</text>
    <circle cx="35" cy="40" r="15" fill="#27ae60"/>
    <text x="35" y="45" text-anchor="middle" class="small-vote">1</text>
    <circle cx="70" cy="40" r="15" fill="#e74c3c"/>
    <text x="70" y="45" text-anchor="middle" class="small-vote">0</text>
    <circle cx="105" cy="40" r="15" fill="#27ae60"/>
    <text x="105" y="45" text-anchor="middle" class="small-vote">1</text>
    <circle cx="140" cy="40" r="15" fill="#27ae60"/>
    <text x="140" y="45" text-anchor="middle" class="small-vote">1</text>
    
    <!-- Row 3 -->
    <circle cx="0" cy="80" r="15" fill="#e74c3c"/>
    <text x="0" y="85" text-anchor="middle" class="small-vote">0</text>
    <circle cx="35" cy="80" r="15" fill="#27ae60"/>
    <text x="35" y="85" text-anchor="middle" class="small-vote">1</text>
    <circle cx="70" cy="80" r="15" fill="#e74c3c"/>
    <text x="70" y="85" text-anchor="middle" class="small-vote">0</text>
    <circle cx="105" cy="80" r="15" fill="#27ae60"/>
    <text x="105" y="85" text-anchor="middle" class="small-vote">1</text>
    <circle cx="140" cy="80" r="15" fill="#27ae60"/>
    <text x="140" y="85" text-anchor="middle" class="small-vote">1</text>
  </g>
  
  <!-- Count for larger ensemble -->
  <rect x="670" y="220" width="160" height="60" fill="#f39c12" rx="8"/>
  <text x="750" y="245" text-anchor="middle" class="count-text" fill="white">Class 1: 10 votes</text>
  <text x="750" y="265" text-anchor="middle" class="count-text" fill="white">Class 0: 5 votes</text>
  
  <!-- Final decision for larger ensemble -->
  <line x1="750" y1="280" x2="750" y2="320" stroke="#f39c12" stroke-width="4" marker-end="url(#arrowhead2)"/>
  <rect x="670" y="330" width="160" height="50" fill="#27ae60" rx="8"/>
  <text x="750" y="350" text-anchor="middle" class="result-text" fill="white">Final Prediction:</text>
  <text x="750" y="370" text-anchor="middle" class="result-text" fill="white">Class 1</text>
  
  <!-- Mathematical formulation -->
  <rect x="100" y="420" width="800" height="160" fill="#ecf0f1" rx="12" stroke="#bdc3c7" stroke-width="2"/>
  <text x="500" y="450" text-anchor="middle" class="subtitle">Mathematical Formulation of Majority Voting</text>
  
  <!-- Formula with better spacing -->
  <text x="120" y="480" class="label">For L classifiers f₁, f₂, ..., f_L, the majority vote prediction is:</text>
  
  <text x="500" y="510" text-anchor="middle" class="formula-text" style="font-size: 16px;">ŷ = arg max_c Σᵢ₌₁ᴸ I(fᵢ(x) = c)</text>
  
  <text x="120" y="540" class="label">Where:</text>
  <text x="140" y="560" class="label">• c represents each possible class (0 or 1 in binary classification)</text>
  <text x="140" y="580" class="label">• I(fᵢ(x) = c) is an indicator function (1 if fᵢ(x) = c, 0 otherwise)</text>
  <text x="140" y="600" class="label">• The class with the most votes becomes the final prediction</text>
  
</svg>