<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#666"/>
    </marker>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#52C41A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#389E0D;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Rank Centrality Algorithm Overview
  </text>
  
  <!-- Input: Pairwise Comparisons -->
  <g transform="translate(100, 100)">
    <rect x="0" y="0" width="180" height="100" rx="10" fill="url(#blueGrad)" stroke="#357ABD" stroke-width="2"/>
    <text x="90" y="35" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
      Input
    </text>
    <text x="90" y="60" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">
      Pairwise
    </text>
    <text x="90" y="80" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">
      Comparisons
    </text>
  </g>
  
  <!-- Example comparisons -->
  <g transform="translate(50, 220)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="13" fill="#666">A &gt; B (9 wins)</text>
    <text x="0" y="25" font-family="Arial, sans-serif" font-size="13" fill="#666">B &gt; C (2 wins)</text>
    <text x="0" y="50" font-family="Arial, sans-serif" font-size="13" fill="#666">C &gt; A (4 wins)</text>
    <text x="0" y="75" font-family="Arial, sans-serif" font-size="13" fill="#666">A &gt; C (2 wins)</text>
  </g>
  
  <!-- Process 1: Laplace Correction -->
  <g transform="translate(320, 100)">
    <rect x="0" y="0" width="180" height="100" rx="10" fill="#f0f0f0" stroke="#999" stroke-width="2"/>
    <text x="90" y="35" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">
      Step 1
    </text>
    <text x="90" y="60" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">
      Laplace
    </text>
    <text x="90" y="80" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">
      Correction (+1)
    </text>
  </g>
  
  <!-- Process 2: Transition Matrix -->
  <g transform="translate(320, 240)">
    <rect x="0" y="0" width="180" height="100" rx="10" fill="#f0f0f0" stroke="#999" stroke-width="2"/>
    <text x="90" y="35" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">
      Step 2
    </text>
    <text x="90" y="60" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">
      Build Transition
    </text>
    <text x="90" y="80" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">
      Matrix P
    </text>
  </g>
  
  <!-- Process 3: Markov Chain -->
  <g transform="translate(320, 380)">
    <rect x="0" y="0" width="180" height="100" rx="10" fill="#f0f0f0" stroke="#999" stroke-width="2"/>
    <text x="90" y="35" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">
      Step 3
    </text>
    <text x="90" y="60" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">
      Find Steady-State
    </text>
    <text x="90" y="80" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">
      πP = π
    </text>
  </g>
  
  <!-- Output: Rankings -->
  <g transform="translate(540, 240)">
    <rect x="0" y="0" width="180" height="100" rx="10" fill="url(#greenGrad)" stroke="#389E0D" stroke-width="2"/>
    <text x="90" y="35" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
      Output
    </text>
    <text x="90" y="60" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">
      Global Rankings
    </text>
    <text x="90" y="80" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">
      Score(X) = π_X
    </text>
  </g>
  
  <!-- Example rankings -->
  <g transform="translate(570, 360)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="13" fill="#666">1. A: 0.417</text>
    <text x="0" y="25" font-family="Arial, sans-serif" font-size="13" fill="#666">2. C: 0.333</text>
    <text x="0" y="50" font-family="Arial, sans-serif" font-size="13" fill="#666">3. B: 0.250</text>
  </g>
  
  <!-- Arrows -->
  <line x1="280" y1="150" x2="320" y2="150" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="410" y1="200" x2="410" y2="240" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="410" y1="340" x2="410" y2="380" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="290" x2="540" y2="290" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Key Features Box -->
  <g transform="translate(50, 430)">
    <rect x="0" y="0" width="200" height="120" rx="5" fill="#fff" stroke="#ddd" stroke-width="1"/>
    <text x="10" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">
      Key Features:
    </text>
    <text x="10" y="50" font-family="Arial, sans-serif" font-size="12" fill="#666">
      • Network effects
    </text>
    <text x="10" y="70" font-family="Arial, sans-serif" font-size="12" fill="#666">
      • Handles circular preferences
    </text>
    <text x="10" y="90" font-family="Arial, sans-serif" font-size="12" fill="#666">
      • Mathematically rigorous
    </text>
    <text x="10" y="110" font-family="Arial, sans-serif" font-size="12" fill="#666">
      • Objective comparisons
    </text>
  </g>
</svg>