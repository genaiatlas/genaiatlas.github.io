<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title-text { font-family: 'Arial', sans-serif; font-size: 20px; font-weight: bold; fill: #2c3e50; }
      .subtitle-text { font-family: 'Arial', sans-serif; font-size: 16px; font-weight: bold; fill: #34495e; }
      .label-text { font-family: 'Arial', sans-serif; font-size: 12px; fill: #2c3e50; }
      .math-text { font-family: 'Times New Roman', serif; font-size: 14px; fill: #2c3e50; }
      .step-text { font-family: 'Arial', sans-serif; font-size: 14px; fill: #2c3e50; }
      .raw-color { fill: #3498db; stroke: #2980b9; }
      .constructed-color { fill: #e74c3c; stroke: #c0392b; }
      .transformation-color { fill: #f39c12; stroke: #e67e22; }
      .final-color { fill: #27ae60; stroke: #229954; }
      .arrow { stroke: #2c3e50; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .dashed-arrow { stroke: #7f8c8d; stroke-width: 2; fill: none; stroke-dasharray: "8,4"; marker-end: url(#arrowhead-gray); }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="8" 
            refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#2c3e50" />
    </marker>
    <marker id="arrowhead-gray" markerWidth="12" markerHeight="8" 
            refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#7f8c8d" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" class="title-text">Constructed Regressors: From Raw Features to Rich Representations</text>
  
  <!-- Step 1: Raw Features -->
  <g transform="translate(50, 80)">
    <text x="100" y="20" text-anchor="middle" class="subtitle-text">Step 1: Raw Features</text>
    
    <!-- Raw feature boxes -->
    <rect x="20" y="40" width="60" height="40" class="raw-color" stroke-width="2"/>
    <text x="50" y="60" text-anchor="middle" class="math-text" fill="white">x₁</text>
    <text x="50" y="75" text-anchor="middle" class="label-text" fill="white">Age</text>
    
    <rect x="90" y="40" width="60" height="40" class="raw-color" stroke-width="2"/>
    <text x="120" y="60" text-anchor="middle" class="math-text" fill="white">x₂</text>
    <text x="120" y="75" text-anchor="middle" class="label-text" fill="white">Income</text>
    
    <rect x="160" y="40" width="60" height="40" class="raw-color" stroke-width="2"/>
    <text x="190" y="60" text-anchor="middle" class="math-text" fill="white">x₃</text>
    <text x="190" y="75" text-anchor="middle" class="label-text" fill="white">Education</text>
    
    <text x="120" y="110" text-anchor="middle" class="step-text">Z = (x₁, x₂, x₃)' ∈ ℝ³</text>
    <text x="120" y="130" text-anchor="middle" class="label-text">Original dimension: d = 3</text>
  </g>
  
  <!-- Arrow to transformation -->
  <line x1="280" y1="140" x2="350" y2="140" class="arrow"/>
  <text x="315" y="135" text-anchor="middle" class="step-text">Transform</text>
  
  <!-- Step 2: Transformation Dictionary -->
  <g transform="translate(370, 80)">
    <text x="130" y="20" text-anchor="middle" class="subtitle-text">Step 2: Dictionary P(Z)</text>
    
    <!-- Original features -->
    <text x="20" y="45" class="step-text">Original:</text>
    <rect x="20" y="55" width="40" height="25" class="raw-color" stroke-width="1"/>
    <text x="40" y="72" text-anchor="middle" class="label-text" fill="white">x₁</text>
    
    <rect x="65" y="55" width="40" height="25" class="raw-color" stroke-width="1"/>
    <text x="85" y="72" text-anchor="middle" class="label-text" fill="white">x₂</text>
    
    <rect x="110" y="55" width="40" height="25" class="raw-color" stroke-width="1"/>
    <text x="130" y="72" text-anchor="middle" class="label-text" fill="white">x₃</text>
    
    <!-- Squared terms -->
    <text x="20" y="100" class="step-text">Squared:</text>
    <rect x="20" y="110" width="40" height="25" class="transformation-color" stroke-width="1"/>
    <text x="40" y="127" text-anchor="middle" class="label-text" fill="white">x₁²</text>
    
    <rect x="65" y="110" width="40" height="25" class="transformation-color" stroke-width="1"/>
    <text x="85" y="127" text-anchor="middle" class="label-text" fill="white">x₂²</text>
    
    <rect x="110" y="110" width="40" height="25" class="transformation-color" stroke-width="1"/>
    <text x="130" y="127" text-anchor="middle" class="label-text" fill="white">x₃²</text>
    
    <!-- Interaction terms -->
    <text x="170" y="100" class="step-text">Interactions:</text>
    <rect x="170" y="55" width="40" height="25" class="constructed-color" stroke-width="1"/>
    <text x="190" y="72" text-anchor="middle" class="label-text" fill="white">x₁x₂</text>
    
    <rect x="215" y="55" width="40" height="25" class="constructed-color" stroke-width="1"/>
    <text x="235" y="72" text-anchor="middle" class="label-text" fill="white">x₁x₃</text>
    
    <rect x="170" y="110" width="40" height="25" class="constructed-color" stroke-width="1"/>
    <text x="190" y="127" text-anchor="middle" class="label-text" fill="white">x₂x₃</text>
    
    <text x="130" y="155" text-anchor="middle" class="math-text">P(Z) = (x₁, x₂, x₃, x₁², x₂², x₃², x₁x₂, x₁x₃, x₂x₃)'</text>
    <text x="130" y="175" text-anchor="middle" class="label-text">New dimension: p = 9</text>
  </g>
  
  <!-- Arrow to final model -->
  <line x1="630" y1="140" x2="700" y2="140" class="arrow"/>
  <text x="665" y="135" text-anchor="middle" class="step-text">Use in</text>
  <text x="665" y="150" text-anchor="middle" class="step-text">Regression</text>
  
  <!-- Step 3: Linear Model -->
  <g transform="translate(720, 80)">
    <text x="120" y="20" text-anchor="middle" class="subtitle-text">Step 3: Linear Model</text>
    
    <!-- Model equation box -->
    <rect x="10" y="40" width="220" height="80" class="final-color" stroke-width="2" fill-opacity="0.1"/>
    <text x="120" y="65" text-anchor="middle" class="math-text">Y = β'X + ε</text>
    <text x="120" y="85" text-anchor="middle" class="math-text">where X = P(Z)</text>
    <text x="120" y="105" text-anchor="middle" class="math-text">X ∈ ℝ⁹</text>
    
    <text x="120" y="135" text-anchor="middle" class="label-text">Linear in parameters β</text>
    <text x="120" y="150" text-anchor="middle" class="label-text">Nonlinear in original Z</text>
  </g>
  
  <!-- Example illustration -->
  <g transform="translate(50, 280)">
    <text x="450" y="20" text-anchor="middle" class="subtitle-text">Concrete Example: House Price Prediction</text>
    
    <!-- Before transformation -->
    <g transform="translate(0, 50)">
      <text x="0" y="20" class="step-text">Before (d=3):</text>
      
      <rect x="0" y="30" width="100" height="60" class="raw-color" stroke-width="2" fill-opacity="0.1"/>
      <text x="50" y="50" text-anchor="middle" class="label-text">Age = 15 years</text>
      <text x="50" y="65" text-anchor="middle" class="label-text">Size = 2000 sqft</text>
      <text x="50" y="80" text-anchor="middle" class="label-text">Bedrooms = 3</text>
      
      <text x="50" y="110" text-anchor="middle" class="math-text">Z = (15, 2000, 3)'</text>
    </g>
    
    <!-- Arrow -->
    <line x1="130" y1="120" x2="200" y2="120" class="arrow"/>
    
    <!-- After transformation -->
    <g transform="translate(220, 50)">
      <text x="0" y="20" class="step-text">After (p=9):</text>
      
      <!-- Grid of transformed features -->
      <rect x="0" y="30" width="80" height="20" class="raw-color" stroke-width="1" fill-opacity="0.2"/>
      <text x="40" y="45" text-anchor="middle" class="label-text">Age = 15</text>
      
      <rect x="90" y="30" width="80" height="20" class="raw-color" stroke-width="1" fill-opacity="0.2"/>
      <text x="130" y="45" text-anchor="middle" class="label-text">Size = 2000</text>
      
      <rect x="180" y="30" width="80" height="20" class="raw-color" stroke-width="1" fill-opacity="0.2"/>
      <text x="220" y="45" text-anchor="middle" class="label-text">Beds = 3</text>
      
      <rect x="0" y="55" width="80" height="20" class="transformation-color" stroke-width="1" fill-opacity="0.2"/>
      <text x="40" y="70" text-anchor="middle" class="label-text">Age² = 225</text>
      
      <rect x="90" y="55" width="80" height="20" class="transformation-color" stroke-width="1" fill-opacity="0.2"/>
      <text x="130" y="70" text-anchor="middle" class="label-text">Size² = 4M</text>
      
      <rect x="180" y="55" width="80" height="20" class="transformation-color" stroke-width="1" fill-opacity="0.2"/>
      <text x="220" y="70" text-anchor="middle" class="label-text">Beds² = 9</text>
      
      <rect x="0" y="80" width="80" height="20" class="constructed-color" stroke-width="1" fill-opacity="0.2"/>
      <text x="40" y="95" text-anchor="middle" class="label-text">Age×Size</text>
      
      <rect x="90" y="80" width="80" height="20" class="constructed-color" stroke-width="1" fill-opacity="0.2"/>
      <text x="130" y="95" text-anchor="middle" class="label-text">Age×Beds</text>
      
      <rect x="180" y="80" width="80" height="20" class="constructed-color" stroke-width="1" fill-opacity="0.2"/>
      <text x="220" y="95" text-anchor="middle" class="label-text">Size×Beds</text>
      
      <text x="130" y="125" text-anchor="middle" class="math-text">X = P(Z) ∈ ℝ⁹</text>
    </g>
    
    <!-- Benefits box -->
    <g transform="translate(600, 50)">
      <text x="0" y="20" class="step-text">Benefits:</text>
      
      <rect x="0" y="30" width="150" height="80" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
      <text x="10" y="50" class="label-text">• Captures nonlinearity</text>
      <text x="10" y="65" class="label-text">• Interaction effects</text>
      <text x="10" y="80" text-anchor="start" class="label-text">• Age-size synergies</text>
      <text x="10" y="95" class="label-text">• Remains linear in β</text>
    </g>
  </g>
  
  <!-- Approximation Quality Illustration -->
  <g transform="translate(50, 480)">
    <text x="450" y="20" text-anchor="middle" class="subtitle-text">Approximation Quality vs Dictionary Richness</text>
    
    <!-- Simple graph showing approximation improvement -->
    <g transform="translate(100, 50)">
      <!-- Axes -->
      <line x1="50" y1="100" x2="350" y2="100" class="axis-line"/>
      <line x1="50" y1="20" x2="50" y2="110" class="axis-line"/>
      
      <!-- Labels -->
      <text x="200" y="130" text-anchor="middle" class="label-text">Dictionary Size (p)</text>
      <text x="20" y="60" text-anchor="middle" class="label-text" transform="rotate(-90, 20, 60)">Approximation</text>
      <text x="25" y="65" text-anchor="middle" class="label-text" transform="rotate(-90, 25, 65)">Quality</text>
      
      <!-- Curve showing improvement -->
      <path d="M 70 95 Q 150 60 200 40 Q 250 30 330 25" 
            stroke="#e74c3c" stroke-width="3" fill="none"/>
      
      <!-- Points -->
      <circle cx="70" cy="95" r="4" fill="#e74c3c"/>
      <text x="70" y="115" text-anchor="middle" class="label-text">p=3</text>
      <text x="70" y="125" text-anchor="middle" class="label-text">Linear</text>
      
      <circle cx="150" cy="60" r="4" fill="#e74c3c"/>
      <text x="150" y="115" text-anchor="middle" class="label-text">p=9</text>
      <text x="150" y="125" text-anchor="middle" class="label-text">Quadratic</text>
      
      <circle cx="250" cy="35" r="4" fill="#e74c3c"/>
      <text x="250" y="115" text-anchor="middle" class="label-text">p=19</text>
      <text x="250" y="125" text-anchor="middle" class="label-text">Cubic</text>
      
      <circle cx="330" cy="25" r="4" fill="#e74c3c"/>
      <text x="330" y="115" text-anchor="middle" class="label-text">p>>19</text>
      <text x="330" y="125" text-anchor="middle" class="label-text">Higher order</text>
    </g>
    
    <!-- Mathematical relationship -->
    <g transform="translate(550, 50)">
      <rect x="0" y="20" width="200" height="80" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2"/>
      <text x="100" y="40" text-anchor="middle" class="math-text">Key Relationship:</text>
      <text x="100" y="60" text-anchor="middle" class="math-text">β'P(Z) → g(Z)</text>
      <text x="100" y="80" text-anchor="middle" class="label-text">as dictionary gets richer</text>
      
      <text x="100" y="120" text-anchor="middle" class="label-text">g(Z) = E[Y|Z] is the optimal predictor</text>
    </g>
  </g>
</svg>