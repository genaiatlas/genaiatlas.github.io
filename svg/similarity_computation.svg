<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="600" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Similarity Computation Process
  </text>
  
  <!-- Left Column: Process Flow -->
  
  <!-- Step 1: Raw Ratings -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="400" height="160" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2" rx="8"/>
    <text x="200" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Step 1: Raw Ratings Matrix
    </text>
    
    <!-- Table with better spacing -->
    <g transform="translate(50, 55)">
      <!-- Table background -->
      <rect x="0" y="0" width="300" height="80" fill="white" stroke="#666" stroke-width="1.5"/>
      
      <!-- Grid lines -->
      <line x1="75" y1="0" x2="75" y2="80" stroke="#666" stroke-width="1"/>
      <line x1="135" y1="0" x2="135" y2="80" stroke="#666" stroke-width="1"/>
      <line x1="195" y1="0" x2="195" y2="80" stroke="#666" stroke-width="1"/>
      <line x1="255" y1="0" x2="255" y2="80" stroke="#666" stroke-width="1"/>
      <line x1="0" y1="27" x2="300" y2="27" stroke="#666" stroke-width="1.5"/>
      <line x1="0" y1="53" x2="300" y2="53" stroke="#666" stroke-width="1"/>
      
      <!-- Headers -->
      <text x="37" y="18" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#333">Users</text>
      <text x="105" y="18" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#333">Movie 1</text>
      <text x="165" y="18" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#333">Movie 2</text>
      <text x="225" y="18" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#333">Movie 3</text>
      <text x="277" y="18" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#333">Movie 4</text>
      
      <!-- Data rows -->
      <text x="37" y="45" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#333">User 1</text>
      <text x="105" y="45" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#333">3</text>
      <text x="165" y="45" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#333">4</text>
      <text x="225" y="45" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#999">*</text>
      <text x="277" y="45" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#333">2</text>
      
      <text x="37" y="70" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#333">User 2</text>
      <text x="105" y="70" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#999">*</text>
      <text x="165" y="70" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#333">4</text>
      <text x="225" y="70" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#333">5</text>
      <text x="277" y="70" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#333">1</text>
    </g>
  </g>
  
  <!-- Arrow down -->
  <g>
    <line x1="250" y1="245" x2="250" y2="285" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="280" y="268" font-family="Arial, sans-serif" font-size="13" fill="#666">Filter common items only</text>
  </g>
  
  <!-- Step 2: Common Items -->
  <g transform="translate(50, 290)">
    <rect x="0" y="0" width="400" height="140" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="8"/>
    <text x="200" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#e65100">
      Step 2: Common Items Matrix
    </text>
    
    <!-- Smaller table -->
    <g transform="translate(100, 55)">
      <rect x="0" y="0" width="200" height="65" fill="white" stroke="#666" stroke-width="1.5"/>
      
      <!-- Grid -->
      <line x1="75" y1="0" x2="75" y2="65" stroke="#666" stroke-width="1"/>
      <line x1="137" y1="0" x2="137" y2="65" stroke="#666" stroke-width="1"/>
      <line x1="0" y1="25" x2="200" y2="25" stroke="#666" stroke-width="1.5"/>
      <line x1="0" y1="45" x2="200" y2="45" stroke="#666" stroke-width="1"/>
      
      <!-- Content -->
      <text x="37" y="17" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#333">Users</text>
      <text x="106" y="17" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#333">Movie 2</text>
      <text x="168" y="17" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#333">Movie 4</text>
      
      <text x="37" y="38" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#333">User 1</text>
      <text x="106" y="38" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#e65100">4</text>
      <text x="168" y="38" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#e65100">2</text>
      
      <text x="37" y="58" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#333">User 2</text>
      <text x="106" y="58" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#e65100">4</text>
      <text x="168" y="58" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#e65100">1</text>
    </g>
  </g>
  
  <!-- Right Column: Calculation Details -->
  
  <!-- Cosine Similarity Formula Box -->
  <g transform="translate(500, 80)">
    <rect x="0" y="0" width="650" height="350" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" rx="8"/>
    <text x="325" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#2e7d32">
      Cosine Similarity Calculation
    </text>
    
    <!-- Formula display -->
    <g transform="translate(50, 60)">
      <text x="275" y="20" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#333">
        Cosine Similarity = cos(θ) =
      </text>
      
      <text x="275" y="55" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#333">
        Σ(r₁ᵢ × r₂ᵢ)
      </text>
      <line x1="175" y1="62" x2="375" y2="62" stroke="#333" stroke-width="1.5"/>
      <text x="275" y="90" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#333">
        √(Σr₁ᵢ²) × √(Σr₂ᵢ²)
      </text>
    </g>
    
    <!-- Calculation steps with more space -->
    <g transform="translate(50, 180)">
      <rect x="0" y="0" width="550" height="140" fill="white" stroke="#81c784" stroke-width="1" rx="5"/>
      
      <text x="20" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2e7d32">
        Step-by-Step Calculation:
      </text>
      
      <text x="20" y="50" font-family="Arial, sans-serif" font-size="13" fill="#333">
        <tspan font-weight="bold">Numerator:</tspan> (4 × 4) + (2 × 1) = 16 + 2 = 18
      </text>
      
      <text x="20" y="75" font-family="Arial, sans-serif" font-size="13" fill="#333">
        <tspan font-weight="bold">Denominator:</tspan> √(4² + 2²) × √(4² + 1²) = √20 × √17
      </text>
      
      <text x="20" y="95" font-family="Arial, sans-serif" font-size="13" fill="#333">
        = 4.47 × 4.12 = 18.44
      </text>
      
      <rect x="20" y="105" width="250" height="25" fill="#c8e6c9" stroke="#4caf50" stroke-width="1" rx="3"/>
      <text x="145" y="122" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b5e20">
        Result: 18 / 18.44 = 0.97
      </text>
    </g>
  </g>
  
  <!-- Interpretation Box -->
  <g transform="translate(500, 450)">
    <rect x="0" y="0" width="650" height="90" fill="#ffebee" stroke="#f44336" stroke-width="2" rx="8"/>
    <text x="325" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#c62828">
      Interpretation
    </text>
    
    <text x="30" y="55" font-family="Arial, sans-serif" font-size="13" fill="#333">
      • Similarity score of 0.97 indicates very high similarity between User 1 and User 2
    </text>
    <text x="30" y="75" font-family="Arial, sans-serif" font-size="13" fill="#333">
      • These users have nearly identical movie preferences based on their common ratings
    </text>
  </g>
  
  <!-- Mean-Centered Alternative -->
  <g transform="translate(50, 570)">
    <rect x="0" y="0" width="1100" height="280" fill="#e3f2fd" stroke="#2196f3" stroke-width="2" rx="8"/>
    <text x="550" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1565c0">
      Alternative: Mean-Centered Similarity
    </text>
    
    <!-- Three step boxes arranged horizontally -->
    <g transform="translate(30, 60)">
      <!-- Step 1 -->
      <rect x="0" y="0" width="330" height="180" fill="white" stroke="#90caf9" stroke-width="1" rx="5"/>
      <text x="165" y="25" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1565c0">
        1. Calculate Averages
      </text>
      
      <text x="20" y="55" font-family="Arial, sans-serif" font-size="13" fill="#333">
        User 1 ratings: 4, 2
      </text>
      <text x="20" y="75" font-family="Arial, sans-serif" font-size="13" fill="#333">
        Average = (4 + 2) / 2 = 3
      </text>
      
      <text x="20" y="105" font-family="Arial, sans-serif" font-size="13" fill="#333">
        User 2 ratings: 4, 1
      </text>
      <text x="20" y="125" font-family="Arial, sans-serif" font-size="13" fill="#333">
        Average = (4 + 1) / 2 = 2.5
      </text>
      
      <!-- Step 2 -->
      <rect x="370" y="0" width="330" height="180" fill="white" stroke="#90caf9" stroke-width="1" rx="5"/>
      <text x="535" y="25" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1565c0">
        2. Center Ratings
      </text>
      
      <text x="390" y="55" font-family="Arial, sans-serif" font-size="13" fill="#333">
        User 1 centered:
      </text>
      <text x="400" y="75" font-family="Arial, sans-serif" font-size="13" fill="#333">
        Movie 2: 4 - 3 = 1
      </text>
      <text x="400" y="95" font-family="Arial, sans-serif" font-size="13" fill="#333">
        Movie 4: 2 - 3 = -1
      </text>
      
      <text x="390" y="125" font-family="Arial, sans-serif" font-size="13" fill="#333">
        User 2 centered:
      </text>
      <text x="400" y="145" font-family="Arial, sans-serif" font-size="13" fill="#333">
        Movie 2: 4 - 2.5 = 1.5
      </text>
      <text x="400" y="165" font-family="Arial, sans-serif" font-size="13" fill="#333">
        Movie 4: 1 - 2.5 = -1.5
      </text>
      
      <!-- Step 3 -->
      <rect x="740" y="0" width="300" height="180" fill="white" stroke="#90caf9" stroke-width="1" rx="5"/>
      <text x="890" y="25" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1565c0">
        3. Compute Similarity
      </text>
      
      <text x="760" y="55" font-family="Arial, sans-serif" font-size="13" fill="#333">
        Numerator:
      </text>
      <text x="770" y="75" font-family="Arial, sans-serif" font-size="12" fill="#333">
        (1 × 1.5) + (-1 × -1.5) = 3
      </text>
      
      <text x="760" y="105" font-family="Arial, sans-serif" font-size="13" fill="#333">
        Denominator:
      </text>
      <text x="770" y="125" font-family="Arial, sans-serif" font-size="12" fill="#333">
        √2 × √4.5 = 3
      </text>
      
      <rect x="760" y="140" width="260" height="30" fill="#bbdefb" stroke="#1976d2" stroke-width="1" rx="3"/>
      <text x="890" y="160" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#d32f2f">
        Result = 3 / 3 = 1.0 (Perfect)
      </text>
    </g>
  </g>
  
  <!-- Arrow definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#666"/>
    </marker>
  </defs>
</svg>