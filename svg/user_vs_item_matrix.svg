<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5E9FE3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A90E2;stop-opacity:1" />
    </linearGradient>
    <filter id="dropShadow">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#FAFBFC"/>
  
  <!-- Title -->
  <text x="400" y="35" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#2C3E50">
    User-User Collaborative Filtering Process
  </text>
  
  <!-- Step 1: Matrix Representation -->
  <g transform="translate(50, 70)">
    <rect x="0" y="0" width="320" height="200" rx="8" fill="white" stroke="#CBD5E0" stroke-width="2" filter="url(#dropShadow)"/>
    <text x="160" y="25" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#2D3748">
      Step 1: User-Item Matrix
    </text>
    
    <!-- Matrix Grid -->
    <g transform="translate(20, 40)">
      <!-- Headers -->
      <text x="50" y="15" font-size="12" font-weight="bold" text-anchor="middle" fill="#4A5568">Item 1</text>
      <text x="100" y="15" font-size="12" font-weight="bold" text-anchor="middle" fill="#4A5568">Item j</text>
      <text x="150" y="15" font-size="12" font-weight="bold" text-anchor="middle" fill="#4A5568">Item M</text>
      
      <text x="10" y="40" font-size="12" font-weight="bold" fill="#4A5568">User 1</text>
      <text x="10" y="70" font-size="12" font-weight="bold" fill="#E53E3E">User i</text>
      <text x="10" y="100" font-size="12" font-weight="bold" fill="#4A5568">User N</text>
      
      <!-- Matrix cells -->
      <rect x="35" y="25" width="30" height="25" fill="#EDF2F7" stroke="#CBD5E0"/>
      <text x="50" y="42" font-size="11" text-anchor="middle" fill="#2D3748">3</text>
      
      <rect x="85" y="25" width="30" height="25" fill="#EDF2F7" stroke="#CBD5E0"/>
      <text x="100" y="42" font-size="11" text-anchor="middle" fill="#2D3748">-</text>
      
      <rect x="135" y="25" width="30" height="25" fill="#EDF2F7" stroke="#CBD5E0"/>
      <text x="150" y="42" font-size="11" text-anchor="middle" fill="#2D3748">2</text>
      
      <rect x="35" y="55" width="30" height="25" fill="#FED7D7" stroke="#E53E3E" stroke-width="2"/>
      <text x="50" y="72" font-size="11" text-anchor="middle" fill="#E53E3E">1</text>
      
      <rect x="85" y="55" width="30" height="25" fill="#FEE2E2" stroke="#E53E3E" stroke-width="2"/>
      <text x="100" y="72" font-size="11" font-weight="bold" text-anchor="middle" fill="#E53E3E">?</text>
      
      <rect x="135" y="55" width="30" height="25" fill="#FED7D7" stroke="#E53E3E" stroke-width="2"/>
      <text x="150" y="72" font-size="11" text-anchor="middle" fill="#E53E3E">4</text>
      
      <rect x="35" y="85" width="30" height="25" fill="#C6F6D5" stroke="#38A169"/>
      <text x="50" y="102" font-size="11" text-anchor="middle" fill="#22543D">1</text>
      
      <rect x="85" y="85" width="30" height="25" fill="#C6F6D5" stroke="#38A169" stroke-width="2"/>
      <text x="100" y="102" font-size="11" text-anchor="middle" fill="#22543D">4</text>
      
      <rect x="135" y="85" width="30" height="25" fill="#C6F6D5" stroke="#38A169"/>
      <text x="150" y="102" font-size="11" text-anchor="middle" fill="#22543D">4</text>
    </g>
    
    <text x="160" y="180" font-family="Arial" font-size="11" text-anchor="middle" fill="#718096">
      Target: Predict User i's rating for Item j
    </text>
  </g>
  
  <!-- Step 2: Find Similar Users -->
  <g transform="translate(430, 70)">
    <rect x="0" y="0" width="320" height="200" rx="8" fill="white" stroke="#CBD5E0" stroke-width="2" filter="url(#dropShadow)"/>
    <text x="160" y="25" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#2D3748">
      Step 2: Calculate User Similarity
    </text>
    
    <!-- Similarity Calculation -->
    <g transform="translate(30, 45)">
      <text x="130" y="15" font-family="Arial" font-size="12" text-anchor="middle" fill="#4A5568">
        Cosine Similarity(User i, User N)
      </text>
      
      <!-- Formula -->
      <rect x="20" y="25" width="220" height="40" rx="5" fill="#F7FAFC" stroke="#CBD5E0"/>
      <text x="130" y="48" font-family="Courier" font-size="11" text-anchor="middle" fill="#2D3748">
        (1×1) + (4×4) / √[(1²+4²)×(1²+4²)]
      </text>
      
      <!-- Result -->
      <rect x="70" y="75" width="120" height="35" rx="5" fill="url(#blueGradient)"/>
      <text x="130" y="98" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
        Similarity = 1.0
      </text>
      
      <text x="130" y="130" font-family="Arial" font-size="11" text-anchor="middle" fill="#718096">
        Perfect similarity detected!
      </text>
    </g>
  </g>
  
  <!-- Step 3: Neighborhood Selection -->
  <g transform="translate(50, 300)">
    <rect x="0" y="0" width="320" height="180" rx="8" fill="white" stroke="#CBD5E0" stroke-width="2" filter="url(#dropShadow)"/>
    <text x="160" y="25" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#2D3748">
      Step 3: Select k-Nearest Neighbors
    </text>
    
    <!-- Neighbor visualization -->
    <g transform="translate(60, 50)">
      <!-- Target user -->
      <circle cx="100" cy="60" r="25" fill="#E53E3E" opacity="0.8"/>
      <text x="100" y="65" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="white">User i</text>
      
      <!-- Similar users -->
      <circle cx="40" cy="30" r="20" fill="#38A169" opacity="0.7"/>
      <text x="40" y="35" font-family="Arial" font-size="10" text-anchor="middle" fill="white">U2</text>
      
      <circle cx="160" cy="30" r="20" fill="#38A169" opacity="0.9"/>
      <text x="160" y="35" font-family="Arial" font-size="10" text-anchor="middle" fill="white">UN</text>
      
      <circle cx="60" cy="90" r="20" fill="#38A169" opacity="0.6"/>
      <text x="60" y="95" font-family="Arial" font-size="10" text-anchor="middle" fill="white">U3</text>
      
      <circle cx="140" cy="90" r="20" fill="#38A169" opacity="0.5"/>
      <text x="140" y="95" font-family="Arial" font-size="10" text-anchor="middle" fill="white">U5</text>
      
      <!-- Connection lines -->
      <line x1="100" y1="60" x2="40" y2="30" stroke="#718096" stroke-width="1" stroke-dasharray="3,2" opacity="0.5"/>
      <line x1="100" y1="60" x2="160" y2="30" stroke="#2D3748" stroke-width="2" opacity="0.8"/>
      <line x1="100" y1="60" x2="60" y2="90" stroke="#718096" stroke-width="1" stroke-dasharray="3,2" opacity="0.5"/>
      <line x1="100" y1="60" x2="140" y2="90" stroke="#718096" stroke-width="1" stroke-dasharray="3,2" opacity="0.5"/>
    </g>
  </g>
  
  <!-- Step 4: Prediction -->
  <g transform="translate(430, 300)">
    <rect x="0" y="0" width="320" height="180" rx="8" fill="white" stroke="#CBD5E0" stroke-width="2" filter="url(#dropShadow)"/>
    <text x="160" y="25" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#2D3748">
      Step 4: Generate Prediction
    </text>
    
    <!-- Prediction formula -->
    <g transform="translate(30, 45)">
      <text x="130" y="15" font-family="Arial" font-size="12" text-anchor="middle" fill="#4A5568">
        Weighted Average Method
      </text>
      
      <rect x="20" y="25" width="220" height="35" rx="5" fill="#F7FAFC" stroke="#CBD5E0"/>
      <text x="130" y="47" font-family="Courier" font-size="10" text-anchor="middle" fill="#2D3748">
        r̂ᵢⱼ = Σ(sim(i,n) × rₙⱼ) / Σ|sim(i,n)|
      </text>
      
      <!-- Result -->
      <rect x="60" y="70" width="140" height="40" rx="5" fill="#48BB78"/>
      <text x="130" y="95" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
        Prediction: 4.0
      </text>
      
      <text x="130" y="130" font-family="Arial" font-size="11" text-anchor="middle" fill="#718096">
        Based on User N's rating (sim = 1.0)
      </text>
    </g>
  </g>
  
  <!-- Process Flow Arrows -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#718096"/>
    </marker>
  </defs>
  
  <path d="M 370 170 L 430 170" stroke="#718096" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 210 270 L 210 300" stroke="#718096" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 590 270 L 590 300" stroke="#718096" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  
  <!-- Summary Box -->
  <g transform="translate(150, 510)">
    <rect x="0" y="0" width="500" height="70" rx="8" fill="#EBF8FF" stroke="#4299E1" stroke-width="2"/>
    <text x="250" y="25" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle" fill="#2C5282">
      Algorithm Summary
    </text>
    <text x="250" y="45" font-family="Arial" font-size="11" text-anchor="middle" fill="#2D3748">
      1. Identify users who rated target item → 2. Calculate similarities → 3. Select top-k neighbors
    </text>
    <text x="250" y="60" font-family="Arial" font-size="11" text-anchor="middle" fill="#2D3748">
      → 4. Aggregate neighbor ratings weighted by similarity
    </text>
  </g>
</svg>