<svg width="800" height="650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'Arial', sans-serif; font-size: 20px; font-weight: bold; fill: #2c3e50; }
      .subtitle { font-family: 'Arial', sans-serif; font-size: 16px; fill: #34495e; font-weight: bold; }
      .section-title { font-family: 'Arial', sans-serif; font-size: 14px; fill: #34495e; font-weight: bold; }
      .description { font-family: 'Arial', sans-serif; font-size: 12px; fill: #34495e; }
      .small-text { font-family: 'Arial', sans-serif; font-size: 10px; fill: #34495e; }
      .fold-number { font-family: 'Arial', sans-serif; font-size: 14px; fill: #ffffff; font-weight: bold; }
      .box { fill: #f8f9fa; stroke: #dee2e6; stroke-width: 2; rx: 8; }
      .fold1 { fill: #3498db; stroke: #2980b9; stroke-width: 1; }
      .fold2 { fill: #e74c3c; stroke: #c0392b; stroke-width: 1; }
      .fold3 { fill: #f39c12; stroke: #e67e22; stroke-width: 1; }
      .fold4 { fill: #27ae60; stroke: #229954; stroke-width: 1; }
      .fold5 { fill: #9b59b6; stroke: #8e44ad; stroke-width: 1; }
      .validation-fold { fill: #e74c3c; stroke: #c0392b; stroke-width: 2; }
      .training-fold { fill: #3498db; stroke: #2980b9; stroke-width: 1; }
      .step-circle { fill: #34495e; stroke: #2c3e50; stroke-width: 2; }
      .arrow { stroke: #34495e; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .process-box { fill: #e8f6f3; stroke: #16a085; stroke-width: 2; rx: 8; }
      .formula-box { fill: #fff3cd; stroke: #ffc107; stroke-width: 2; rx: 8; }
      .benefits-box { fill: #d1ecf1; stroke: #0c5460; stroke-width: 2; rx: 8; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e" />
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="650" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title">K-Fold Cross-Validation Process (K=5)</text>
  
  <!-- Initial Data Split -->
  <rect x="50" y="50" width="700" height="80" class="process-box"/>
  <text x="400" y="75" text-anchor="middle" class="subtitle" fill="#16a085">Step 1: Divide Data into K Equal Folds</text>
  
  <g transform="translate(150, 100)">
    <text x="250" y="0" text-anchor="middle" class="section-title">Original Dataset Split into 5 Folds</text>
    <rect x="0" y="10" width="100" height="30" class="fold1"/>
    <text x="50" y="30" text-anchor="middle" class="description" fill="white">Fold 1</text>
    
    <rect x="100" y="10" width="100" height="30" class="fold2"/>
    <text x="150" y="30" text-anchor="middle" class="description" fill="white">Fold 2</text>
    
    <rect x="200" y="10" width="100" height="30" class="fold3"/>
    <text x="250" y="30" text-anchor="middle" class="description" fill="white">Fold 3</text>
    
    <rect x="300" y="10" width="100" height="30" class="fold4"/>
    <text x="350" y="30" text-anchor="middle" class="description" fill="white">Fold 4</text>
    
    <rect x="400" y="10" width="100" height="30" class="fold5"/>
    <text x="450" y="30" text-anchor="middle" class="description" fill="white">Fold 5</text>
  </g>
  
  <!-- K-Fold Iterations -->
  <rect x="50" y="150" width="700" height="300" class="box"/>
  <text x="400" y="175" text-anchor="middle" class="subtitle">Step 2: K Training-Validation Iterations</text>
  
  <!-- Iteration 1 -->
  <g transform="translate(80, 190)">
    <circle cx="15" cy="15" r="12" class="step-circle"/>
    <text x="15" y="20" text-anchor="middle" class="fold-number">1</text>
    
    <text x="35" y="20" class="section-title">Iteration 1: Validate on Fold 1</text>
    
    <rect x="0" y="35" width="80" height="25" class="validation-fold"/>
    <text x="40" y="52" text-anchor="middle" class="description" fill="white">Validation</text>
    
    <rect x="85" y="35" width="320" height="25" class="training-fold"/>
    <text x="245" y="52" text-anchor="middle" class="description" fill="white">Training (Folds 2, 3, 4, 5)</text>
    
    <text x="450" y="52" class="description">→ Error₁</text>
  </g>
  
  <!-- Iteration 2 -->
  <g transform="translate(80, 240)">
    <circle cx="15" cy="15" r="12" class="step-circle"/>
    <text x="15" y="20" text-anchor="middle" class="fold-number">2</text>
    
    <text x="35" y="20" class="section-title">Iteration 2: Validate on Fold 2</text>
    
    <rect x="0" y="35" width="80" height="25" class="training-fold"/>
    <text x="40" y="52" text-anchor="middle" class="description" fill="white">Training</text>
    
    <rect x="85" y="35" width="80" height="25" class="validation-fold"/>
    <text x="125" y="52" text-anchor="middle" class="description" fill="white">Validation</text>
    
    <rect x="170" y="35" width="240" height="25" class="training-fold"/>
    <text x="290" y="52" text-anchor="middle" class="description" fill="white">Training (Folds 3, 4, 5)</text>
    
    <text x="450" y="52" class="description">→ Error₂</text>
  </g>
  
  <!-- Iteration 3 -->
  <g transform="translate(80, 290)">
    <circle cx="15" cy="15" r="12" class="step-circle"/>
    <text x="15" y="20" text-anchor="middle" class="fold-number">3</text>
    
    <text x="35" y="20" class="section-title">Iteration 3: Validate on Fold 3</text>
    
    <rect x="0" y="35" width="160" height="25" class="training-fold"/>
    <text x="80" y="52" text-anchor="middle" class="description" fill="white">Training (Folds 1, 2)</text>
    
    <rect x="165" y="35" width="80" height="25" class="validation-fold"/>
    <text x="205" y="52" text-anchor="middle" class="description" fill="white">Validation</text>
    
    <rect x="250" y="35" width="160" height="25" class="training-fold"/>
    <text x="330" y="52" text-anchor="middle" class="description" fill="white">Training (Folds 4, 5)</text>
    
    <text x="450" y="52" class="description">→ Error₃</text>
  </g>
  
  <!-- Iterations 4 and 5 (abbreviated) -->
  <g transform="translate(80, 340)">
    <circle cx="15" cy="15" r="12" class="step-circle"/>
    <text x="15" y="20" text-anchor="middle" class="fold-number">4</text>
    <text x="35" y="20" class="section-title">Iteration 4: Validate on Fold 4</text>
    <text x="450" y="20" class="description">→ Error₄</text>
  </g>
  
  <g transform="translate(80, 370)">
    <circle cx="15" cy="15" r="12" class="step-circle"/>
    <text x="15" y="20" text-anchor="middle" class="fold-number">5</text>
    <text x="35" y="20" class="section-title">Iteration 5: Validate on Fold 5</text>
    <text x="450" y="20" class="description">→ Error₅</text>
  </g>
  
  <!-- Final Aggregation -->
  <g transform="translate(80, 400)">
    <path d="M 500 0 L 550 0" class="arrow"/>
    <rect x="560" y="-15" width="120" height="30" fill="#27ae60" stroke="#229954" stroke-width="2" rx="4"/>
    <text x="620" y="5" text-anchor="middle" class="description" fill="white">Average Errors</text>
  </g>
  
  <!-- Mathematical Formula -->
  <rect x="50" y="470" width="700" height="60" class="formula-box"/>
  <text x="400" y="495" text-anchor="middle" class="section-title" fill="#856404">K-Fold CV Formula</text>
  <text x="400" y="515" text-anchor="middle" class="description" fill="#856404">CV_K = (1/K) Σᵢ₌₁ᴷ MSE_i  where MSE_i = (1/|V_i|) Σⱼ∈V_i (yⱼ - ŷⱼ)²</text>
  
  <!-- Benefits and Characteristics -->
  <rect x="50" y="550" width="700" height="80" class="benefits-box"/>
  <text x="400" y="575" text-anchor="middle" class="subtitle" fill="#0c5460">K-Fold CV Benefits</text>
  
  <text x="70" y="600" class="description" fill="#0c5460">• Computational efficiency: Only K model fits required (vs n for LOOCV)</text>
  <text x="70" y="615" class="description" fill="#0c5460">• Lower error correlation: Training sets have less overlap than LOOCV</text>
  <text x="70" y="630" class="description" fill="#0c5460">• Balanced bias-variance: Good compromise between data usage and independence</text>
  <text x="450" y="600" class="description" fill="#0c5460">• Standard choice: K=5 or K=10 works well in practice</text>
  <text x="450" y="615" class="description" fill="#0c5460">• Scalable: Suitable for large datasets</text>
  <text x="450" y="630" class="description" fill="#0c5460">• Robust estimates: Less sensitive to single data points</text>
</svg>