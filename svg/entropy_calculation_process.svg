<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="stepGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3F51B5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5C6BC0;stop-opacity:1" />
    </linearGradient>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
     refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#333">
    Step-by-Step Entropy Calculation Process
  </text>
  
  <!-- Step 1: Dataset -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="180" height="140" rx="10" fill="url(#stepGrad)" stroke="#333" stroke-width="2"/>
    <text x="90" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
      Step 1: Dataset
    </text>
    
    <!-- Sample data table -->
    <rect x="20" y="40" width="140" height="80" fill="white" stroke="#333" stroke-width="1"/>
    
    <!-- Table headers -->
    <rect x="20" y="40" width="140" height="20" fill="#E0E0E0"/>
    <text x="60" y="53" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold">Feature</text>
    <text x="120" y="53" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold">Class</text>
    
    <!-- Data rows -->
    <line x1="90" y1="40" x2="90" y2="120" stroke="#333" stroke-width="1"/>
    <line x1="20" y1="60" x2="160" y2="60" stroke="#333" stroke-width="1"/>
    <line x1="20" y1="75" x2="160" y2="75" stroke="#333" stroke-width="1"/>
    <line x1="20" y1="90" x2="160" y2="90" stroke="#333" stroke-width="1"/>
    <line x1="20" y1="105" x2="160" y2="105" stroke="#333" stroke-width="1"/>
    
    <text x="60" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">A₁</text>
    <circle cx="120" cy="68" r="4" fill="#4CAF50"/>
    
    <text x="60" y="87" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">A₂</text>
    <circle cx="120" cy="83" r="4" fill="#F44336"/>
    
    <text x="60" y="102" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">A₃</text>
    <circle cx="120" cy="98" r="4" fill="#4CAF50"/>
    
    <text x="60" y="117" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">A₄</text>
    <circle cx="120" cy="113" r="4" fill="#4CAF50"/>
    
    <text x="90" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">
      n = 4 samples
    </text>
  </g>
  
  <!-- Arrow 1 -->
  <line x1="240" y1="150" x2="290" y2="150" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Step 2: Count Classes -->
  <g transform="translate(300, 80)">
    <rect x="0" y="0" width="180" height="140" rx="10" fill="url(#stepGrad)" stroke="#333" stroke-width="2"/>
    <text x="90" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
      Step 2: Count Classes
    </text>
    
    <rect x="20" y="40" width="140" height="80" fill="white" stroke="#333" stroke-width="1"/>
    
    <!-- Class counts -->
    <circle cx="60" cy="70" r="15" fill="#4CAF50"/>
    <text x="60" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">+</text>
    <text x="60" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">Count: 3</text>
    
    <circle cx="120" cy="70" r="15" fill="#F44336"/>
    <text x="120" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">-</text>
    <text x="120" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">Count: 1</text>
    
    <text x="90" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">
      Total: 4
    </text>
  </g>
  
  <!-- Arrow 2 -->
  <line x1="490" y1="150" x2="540" y2="150" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Step 3: Calculate Probabilities -->
  <g transform="translate(550, 80)">
    <rect x="0" y="0" width="180" height="140" rx="10" fill="url(#stepGrad)" stroke="#333" stroke-width="2"/>
    <text x="90" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
      Step 3: Probabilities
    </text>
    
    <rect x="20" y="40" width="140" height="80" fill="white" stroke="#333" stroke-width="1"/>
    
    <!-- Probability calculations -->
    <text x="90" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">
      p₁ = 3/4 = 0.75
    </text>
    <circle cx="30" cy="55" r="8" fill="#4CAF50"/>
    
    <text x="90" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">
      p₂ = 1/4 = 0.25
    </text>
    <circle cx="30" cy="75" r="8" fill="#F44336"/>
    
    <text x="90" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">
      Σ pᵢ = 1.0 ✓
    </text>
    
    <text x="90" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">
      Normalize by total
    </text>
  </g>
  
  <!-- Arrow down from Step 3 -->
  <line x1="640" y1="230" x2="640" y2="280" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Step 4: Apply Formula -->
  <g transform="translate(550, 290)">
    <rect x="0" y="0" width="300" height="120" rx="10" fill="#FFF3E0" stroke="#FF9800" stroke-width="2"/>
    <text x="150" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#E65100">
      Step 4: Apply Entropy Formula
    </text>
    
    <text x="150" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#333">
      H(S) = -Σ pᵢ log₂(pᵢ)
    </text>
    
    <text x="150" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">
      H(S) = -(0.75 × log₂(0.75)) - (0.25 × log₂(0.25))
    </text>
    
    <text x="150" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">
      H(S) = -(0.75 × -0.415) - (0.25 × -2.0)
    </text>
    
    <text x="150" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#E65100">
      H(S) = 0.311 + 0.5 = 0.811
    </text>
  </g>
  
  <!-- Arrow down from Step 4 -->
  <line x1="700" y1="420" x2="700" y2="470" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Step 5: Interpretation -->
  <g transform="translate(550, 480)">
    <rect x="0" y="0" width="300" height="80" rx="10" fill="#E8F5E8" stroke="#4CAF50" stroke-width="2"/>
    <text x="150" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2E7D32">
      Step 5: Interpretation
    </text>
    
    <text x="150" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">
      Entropy = 0.811 (moderate uncertainty)
    </text>
    
    <text x="150" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">
      Lower values indicate more homogeneous data
    </text>
  </g>
  
  <!-- Left side calculation breakdown -->
  <g transform="translate(50, 290)">
    <rect x="0" y="0" width="420" height="180" rx="10" fill="#F3E5F5" stroke="#9C27B0" stroke-width="2"/>
    <text x="210" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#7B1FA2">
      Detailed Calculation Breakdown
    </text>
    
    <!-- Calculation steps -->
    <text x="20" y="50" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">
      For p₁ = 0.75 (positive class):
    </text>
    <text x="30" y="70" font-family="Arial, sans-serif" font-size="11" fill="#333">
      • log₂(0.75) = -0.415
    </text>
    <text x="30" y="85" font-family="Arial, sans-serif" font-size="11" fill="#333">
      • p₁ × log₂(p₁) = 0.75 × (-0.415) = -0.311
    </text>
    
    <text x="20" y="110" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">
      For p₂ = 0.25 (negative class):
    </text>
    <text x="30" y="130" font-family="Arial, sans-serif" font-size="11" fill="#333">
      • log₂(0.25) = -2.0
    </text>
    <text x="30" y="145" font-family="Arial, sans-serif" font-size="11" fill="#333">
      • p₂ × log₂(p₂) = 0.25 × (-2.0) = -0.5
    </text>
    
    <text x="20" y="170" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#7B1FA2">
      Final: H(S) = -(-0.311 + -0.5) = 0.811
    </text>
  </g>
</svg>