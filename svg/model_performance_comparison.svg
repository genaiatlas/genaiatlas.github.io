<svg viewBox="0 0 1100 750" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1100" height="750" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="550" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Model Performance Comparison
  </text>
  
  <text x="550" y="60" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#7f8c8d" font-style="italic">
    Gun Ownership Effect on Homicide Rates: Causal Estimates with 95% Confidence Intervals
  </text>
  
  <!-- Y-axis scale -->
  <g transform="translate(100, 120)">
    <!-- Scale labels -->
    <text x="-30" y="0" font-family="Arial, sans-serif" font-size="11" text-anchor="end" fill="#34495e">0.50</text>
    <text x="-30" y="100" font-family="Arial, sans-serif" font-size="11" text-anchor="end" fill="#34495e">0.40</text>
    <text x="-30" y="200" font-family="Arial, sans-serif" font-size="11" text-anchor="end" fill="#34495e">0.30</text>
    <text x="-30" y="300" font-family="Arial, sans-serif" font-size="11" text-anchor="end" fill="#34495e">0.20</text>
    <text x="-30" y="400" font-family="Arial, sans-serif" font-size="11" text-anchor="end" fill="#34495e">0.10</text>
    <text x="-30" y="500" font-family="Arial, sans-serif" font-size="11" text-anchor="end" fill="#34495e">0.00</text>
    
    <!-- Y-axis line -->
    <line x1="0" y1="0" x2="0" y2="500" stroke="#34495e" stroke-width="2"/>
    
    <!-- Horizontal grid lines -->
    <line x1="0" y1="100" x2="900" y2="100" stroke="#ecf0f1" stroke-width="1"/>
    <line x1="0" y1="200" x2="900" y2="200" stroke="#ecf0f1" stroke-width="1"/>
    <line x1="0" y1="300" x2="900" y2="300" stroke="#ecf0f1" stroke-width="1"/>
    <line x1="0" y1="400" x2="900" y2="400" stroke="#ecf0f1" stroke-width="1"/>
    <line x1="0" y1="500" x2="900" y2="500" stroke="#34495e" stroke-width="2"/>
    
    <!-- Method 1: Least Squares -->
    <g transform="translate(100, 0)">
      <!-- Confidence interval bar -->
      <line x1="50" y1="339" x2="50" y2="461" stroke="#3498db" stroke-width="8" opacity="0.3"/>
      <!-- Upper CI cap -->
      <line x1="40" y1="339" x2="60" y2="339" stroke="#3498db" stroke-width="2"/>
      <!-- Lower CI cap -->
      <line x1="40" y1="461" x2="60" y2="461" stroke="#3498db" stroke-width="2"/>
      <!-- Point estimate -->
      <circle cx="50" cy="386" r="7" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
      <!-- Value label -->
      <text x="50" y="375" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#3498db">0.227</text>
      <!-- Method label -->
      <text x="50" y="525" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">Least</text>
      <text x="50" y="540" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">Squares</text>
    </g>
    
    <!-- Method 2: Lasso -->
    <g transform="translate(250, 0)">
      <!-- Confidence interval bar -->
      <line x1="50" y1="360" x2="50" y2="472" stroke="#27ae60" stroke-width="8" opacity="0.3"/>
      <!-- Upper CI cap -->
      <line x1="40" y1="360" x2="60" y2="360" stroke="#27ae60" stroke-width="2"/>
      <!-- Lower CI cap -->
      <line x1="40" y1="472" x2="60" y2="472" stroke="#27ae60" stroke-width="2"/>
      <!-- Point estimate -->
      <circle cx="50" cy="416" r="7" fill="#27ae60" stroke="#229954" stroke-width="2"/>
      <!-- Value label -->
      <text x="50" y="405" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#27ae60">0.242</text>
      <!-- Method label -->
      <text x="50" y="525" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">Lasso</text>
      <text x="50" y="540" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">Regression</text>
    </g>
    
    <!-- Method 3: Random Forest -->
    <g transform="translate(400, 0)">
      <!-- Confidence interval bar (wider) -->
      <line x1="50" y1="426" x2="50" y2="461" stroke="#f39c12" stroke-width="8" opacity="0.3"/>
      <!-- Upper CI cap -->
      <line x1="40" y1="426" x2="60" y2="426" stroke="#f39c12" stroke-width="2"/>
      <!-- Lower CI cap -->
      <line x1="40" y1="461" x2="60" y2="461" stroke="#f39c12" stroke-width="2"/>
      <!-- Point estimate -->
      <circle cx="50" cy="248" r="7" fill="#f39c12" stroke="#d68910" stroke-width="2"/>
      <!-- Value label -->
      <text x="50" y="237" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#f39c12">0.252</text>
      <!-- Wide CI indicator -->
      <text x="50" y="490" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#e67e22">Wide CI</text>
      <!-- Method label -->
      <text x="50" y="525" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">Random</text>
      <text x="50" y="540" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">Forest</text>
    </g>
    
    <!-- Method 4: Neural Network -->
    <g transform="translate(550, 0)">
      <!-- Confidence interval bar (very wide) -->
      <line x1="50" y1="419" x2="50" y2="0" stroke="#9b59b6" stroke-width="8" opacity="0.3"/>
      <!-- Upper CI cap -->
      <line x1="40" y1="0" x2="60" y2="0" stroke="#9b59b6" stroke-width="2"/>
      <!-- Lower CI cap -->
      <line x1="40" y1="419" x2="60" y2="419" stroke="#9b59b6" stroke-width="2"/>
      <!-- Point estimate -->
      <circle cx="50" cy="209" r="7" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
      <!-- Value label -->
      <text x="50" y="198" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#9b59b6">0.291</text>
      <!-- Very wide CI indicator -->
      <text x="50" y="490" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#8e44ad">Very Wide CI</text>
      <!-- Method label -->
      <text x="50" y="525" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">Neural</text>
      <text x="50" y="540" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">Network</text>
    </g>
    
    <!-- Method 5: Best Method (highlighted) -->
    <g transform="translate(725, 0)">
      <!-- Highlight box -->
      <rect x="0" y="-30" width="100" height="590" fill="#d5f4e6" opacity="0.5" rx="5"/>
      <!-- Confidence interval bar -->
      <line x1="50" y1="358" x2="50" y2="470" stroke="#16a085" stroke-width="10" opacity="0.4"/>
      <!-- Upper CI cap -->
      <line x1="35" y1="358" x2="65" y2="358" stroke="#16a085" stroke-width="3"/>
      <!-- Lower CI cap -->
      <line x1="35" y1="470" x2="65" y2="470" stroke="#16a085" stroke-width="3"/>
      <!-- Point estimate -->
      <circle cx="50" cy="412" r="9" fill="#16a085" stroke="#138d75" stroke-width="3"/>
      <!-- Value label -->
      <text x="50" y="398" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#16a085">0.244</text>
      <!-- Best indicator -->
      <text x="50" y="-10" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#16a085">★ BEST ★</text>
      <!-- Method label -->
      <text x="50" y="525" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#16a085">Best</text>
      <text x="50" y="540" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#16a085">Method</text>
    </g>
  </g>
  
  <!-- Y-axis label -->
  <g transform="translate(30, 370)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#34495e" transform="rotate(-90)">
      Causal Effect Estimate (β)
    </text>
  </g>
  
  <!-- Legend -->
  <g transform="translate(100, 650)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#34495e">
      Legend:
    </text>
    <circle cx="60" cy="-3" r="5" fill="#3498db"/>
    <text x="70" y="0" font-family="Arial, sans-serif" font-size="10" fill="#34495e">Point Estimate</text>
    
    <line x1="140" y1="-8" x2="140" y2="5" stroke="#27ae60" stroke-width="6" opacity="0.3"/>
    <text x="150" y="0" font-family="Arial, sans-serif" font-size="10" fill="#34495e">95% Confidence Interval</text>
  </g>
  
  <!-- Results table -->
  <g transform="translate(100, 680)">
    <rect x="0" y="0" width="900" height="50" fill="white" stroke="#bdc3c7" stroke-width="2" rx="5"/>
    
    <text x="450" y="18" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Interpretation: 1% increase in gun ownership → 0.24% increase in homicide rates
    </text>
    <text x="450" y="35" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">
      The "Best Method" combines multiple approaches for optimal precision and reliability
    </text>
  </g>
  
  <!-- Key insights panel -->
  <g transform="translate(50, 90)">
    <rect x="850" y="30" width="180" height="480" fill="#fff3cd" stroke="#f39c12" stroke-width="2" rx="8"/>
    
    <text x="940" y="55" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#856404">
      Key Insights
    </text>
    
    <text x="865" y="80" font-family="Arial, sans-serif" font-size="10" fill="#34495e" font-weight="bold">
      Precision:
    </text>
    <text x="865" y="98" font-family="Arial, sans-serif" font-size="9" fill="#34495e">
      • Best Method: Most
    </text>
    <text x="875" y="112" font-family="Arial, sans-serif" font-size="9" fill="#34495e">
      precise (narrowest CI)
    </text>
    <text x="865" y="130" font-family="Arial, sans-serif" font-size="9" fill="#34495e">
      • Neural Network:
    </text>
    <text x="875" y="144" font-family="Arial, sans-serif" font-size="9" fill="#34495e">
      Least precise
    </text>
    
    <line x1="865" y1="160" x2="1015" y2="160" stroke="#f39c12" stroke-width="1"/>
    
    <text x="865" y="180" font-family="Arial, sans-serif" font-size="10" fill="#34495e" font-weight="bold">
      Point Estimates:
    </text>
    <text x="865" y="198" font-family="Arial, sans-serif" font-size="9" fill="#34495e">
      • Range: 0.227 to
    </text>
    <text x="875" y="212" font-family="Arial, sans-serif" font-size="9" fill="#34495e">
      0.291
    </text>
    <text x="865" y="230" font-family="Arial, sans-serif" font-size="9" fill="#34495e">
      • All positive &amp;
    </text>
    <text x="875" y="244" font-family="Arial, sans-serif" font-size="9" fill="#34495e">
      statistically
    </text>
    <text x="875" y="258" font-family="Arial, sans-serif" font-size="9" fill="#34495e">
      significant
    </text>
    
    <line x1="865" y1="274" x2="1015" y2="274" stroke="#f39c12" stroke-width="1"/>
    
    <text x="865" y="294" font-family="Arial, sans-serif" font-size="10" fill="#34495e" font-weight="bold">
      Method Choice:
    </text>
    <text x="865" y="312" font-family="Arial, sans-serif" font-size="9" fill="#34495e">
      • Ensemble approach
    </text>
    <text x="875" y="326" font-family="Arial, sans-serif" font-size="9" fill="#34495e">
      combines strengths
    </text>
    <text x="865" y="344" font-family="Arial, sans-serif" font-size="9" fill="#34495e">
      • Balances bias and
    </text>
    <text x="875" y="358" font-family="Arial, sans-serif" font-size="9" fill="#34495e">
      variance
    </text>
    <text x="865" y="376" font-family="Arial, sans-serif" font-size="9" fill="#34495e">
      • More robust to
    </text>
    <text x="875" y="390" font-family="Arial, sans-serif" font-size="9" fill="#34495e">
      model misspec.
    </text>
    
    <line x1="865" y1="406" x2="1015" y2="406" stroke="#f39c12" stroke-width="1"/>
    
    <text x="865" y="426" font-family="Arial, sans-serif" font-size="10" fill="#34495e" font-weight="bold">
      Statistical Sig.:
    </text>
    <text x="865" y="444" font-family="Arial, sans-serif" font-size="9" fill="#34495e">
      • All CIs exclude
    </text>
    <text x="875" y="458" font-family="Arial, sans-serif" font-size="9" fill="#34495e">
      zero
    </text>
    <text x="865" y="476" font-family="Arial, sans-serif" font-size="9" fill="#34495e">
      • Strong evidence
    </text>
    <text x="875" y="490" font-family="Arial, sans-serif" font-size="9" fill="#34495e">
      for causal effect
    </text>
  </g>
</svg>