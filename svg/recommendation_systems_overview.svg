<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="700" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="600" y="40" font-size="28" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Recommendation Systems Architecture
  </text>
  
  <!-- User Section -->
  <g id="user-section">
    <rect x="50" y="100" width="200" height="500" rx="10" fill="#e8f4f8" stroke="#3498db" stroke-width="2"/>
    <text x="150" y="130" font-size="18" font-weight="bold" text-anchor="middle" fill="#2c3e50">User</text>
    
    <!-- User Profile -->
    <rect x="70" y="150" width="160" height="80" rx="5" fill="#ffffff" stroke="#3498db" stroke-width="1"/>
    <text x="150" y="175" font-size="14" text-anchor="middle" fill="#2c3e50">Profile</text>
    <text x="150" y="195" font-size="12" text-anchor="middle" fill="#7f8c8d">Demographics</text>
    <text x="150" y="210" font-size="12" text-anchor="middle" fill="#7f8c8d">Preferences</text>
    
    <!-- Interaction History -->
    <rect x="70" y="250" width="160" height="80" rx="5" fill="#ffffff" stroke="#3498db" stroke-width="1"/>
    <text x="150" y="275" font-size="14" text-anchor="middle" fill="#2c3e50">Interaction History</text>
    <text x="150" y="295" font-size="12" text-anchor="middle" fill="#7f8c8d">Views, Clicks</text>
    <text x="150" y="310" font-size="12" text-anchor="middle" fill="#7f8c8d">Ratings, Purchases</text>
    
    <!-- Context -->
    <rect x="70" y="350" width="160" height="80" rx="5" fill="#ffffff" stroke="#3498db" stroke-width="1"/>
    <text x="150" y="375" font-size="14" text-anchor="middle" fill="#2c3e50">Context</text>
    <text x="150" y="395" font-size="12" text-anchor="middle" fill="#7f8c8d">Time, Location</text>
    <text x="150" y="410" font-size="12" text-anchor="middle" fill="#7f8c8d">Device, Session</text>
  </g>
  
  <!-- Recommendation Engine -->
  <g id="engine-section">
    <rect x="350" y="100" width="500" height="500" rx="10" fill="#f0f8f0" stroke="#27ae60" stroke-width="2"/>
    <text x="600" y="130" font-size="18" font-weight="bold" text-anchor="middle" fill="#2c3e50">Recommendation Engine</text>
    
    <!-- Data Processing Layer -->
    <rect x="370" y="150" width="460" height="100" rx="5" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
    <text x="600" y="175" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">Data Processing Layer</text>
    <text x="600" y="195" font-size="12" text-anchor="middle" fill="#7f8c8d">• Feature Extraction</text>
    <text x="600" y="210" font-size="12" text-anchor="middle" fill="#7f8c8d">• Data Normalization</text>
    <text x="600" y="225" font-size="12" text-anchor="middle" fill="#7f8c8d">• Missing Value Handling</text>
    
    <!-- Algorithm Layer -->
    <rect x="370" y="270" width="460" height="180" rx="5" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
    <text x="600" y="295" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">Algorithm Layer</text>
    
    <!-- Algorithm boxes -->
    <rect x="390" y="310" width="130" height="50" rx="5" fill="#e8f5e9" stroke="#4caf50" stroke-width="1"/>
    <text x="455" y="340" font-size="12" text-anchor="middle" fill="#2c3e50">Collaborative</text>
    
    <rect x="535" y="310" width="130" height="50" rx="5" fill="#e8f5e9" stroke="#4caf50" stroke-width="1"/>
    <text x="600" y="340" font-size="12" text-anchor="middle" fill="#2c3e50">Content-Based</text>
    
    <rect x="680" y="310" width="130" height="50" rx="5" fill="#e8f5e9" stroke="#4caf50" stroke-width="1"/>
    <text x="745" y="340" font-size="12" text-anchor="middle" fill="#2c3e50">Hybrid</text>
    
    <rect x="390" y="375" width="130" height="50" rx="5" fill="#e8f5e9" stroke="#4caf50" stroke-width="1"/>
    <text x="455" y="405" font-size="12" text-anchor="middle" fill="#2c3e50">Deep Learning</text>
    
    <rect x="535" y="375" width="130" height="50" rx="5" fill="#e8f5e9" stroke="#4caf50" stroke-width="1"/>
    <text x="600" y="405" font-size="12" text-anchor="middle" fill="#2c3e50">Knowledge-Based</text>
    
    <rect x="680" y="375" width="130" height="50" rx="5" fill="#e8f5e9" stroke="#4caf50" stroke-width="1"/>
    <text x="745" y="405" font-size="12" text-anchor="middle" fill="#2c3e50">Graph-Based</text>
    
    <!-- Post-Processing -->
    <rect x="370" y="470" width="460" height="100" rx="5" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
    <text x="600" y="495" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">Post-Processing</text>
    <text x="600" y="515" font-size="12" text-anchor="middle" fill="#7f8c8d">• Diversity Enhancement</text>
    <text x="600" y="530" font-size="12" text-anchor="middle" fill="#7f8c8d">• Business Rules</text>
    <text x="600" y="545" font-size="12" text-anchor="middle" fill="#7f8c8d">• Explanation Generation</text>
  </g>
  
  <!-- Output Section -->
  <g id="output-section">
    <rect x="950" y="100" width="200" height="500" rx="10" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
    <text x="1050" y="130" font-size="18" font-weight="bold" text-anchor="middle" fill="#2c3e50">Recommendations</text>
    
    <!-- Ranked List -->
    <rect x="970" y="150" width="160" height="100" rx="5" fill="#ffffff" stroke="#ff9800" stroke-width="1"/>
    <text x="1050" y="175" font-size="14" text-anchor="middle" fill="#2c3e50">Ranked List</text>
    <text x="1050" y="195" font-size="12" text-anchor="middle" fill="#7f8c8d">1. Item A (0.95)</text>
    <text x="1050" y="210" font-size="12" text-anchor="middle" fill="#7f8c8d">2. Item B (0.87)</text>
    <text x="1050" y="225" font-size="12" text-anchor="middle" fill="#7f8c8d">3. Item C (0.82)</text>
    
    <!-- Explanations -->
    <rect x="970" y="270" width="160" height="80" rx="5" fill="#ffffff" stroke="#ff9800" stroke-width="1"/>
    <text x="1050" y="295" font-size="14" text-anchor="middle" fill="#2c3e50">Explanations</text>
    <text x="1050" y="315" font-size="12" text-anchor="middle" fill="#7f8c8d">Why recommended</text>
    <text x="1050" y="330" font-size="12" text-anchor="middle" fill="#7f8c8d">Similar users liked</text>
    
    <!-- Metrics -->
    <rect x="970" y="370" width="160" height="100" rx="5" fill="#ffffff" stroke="#ff9800" stroke-width="1"/>
    <text x="1050" y="395" font-size="14" text-anchor="middle" fill="#2c3e50">Performance</text>
    <text x="1050" y="415" font-size="12" text-anchor="middle" fill="#7f8c8d">Precision: 0.85</text>
    <text x="1050" y="430" font-size="12" text-anchor="middle" fill="#7f8c8d">Recall: 0.72</text>
    <text x="1050" y="445" font-size="12" text-anchor="middle" fill="#7f8c8d">Coverage: 0.63</text>
  </g>
  
  <!-- Arrows -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#34495e"/>
    </marker>
  </defs>
  
  <!-- User to Engine -->
  <path d="M 250 350 L 350 350" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="300" y="340" font-size="12" text-anchor="middle" fill="#34495e">Input</text>
  
  <!-- Engine to Output -->
  <path d="M 850 350 L 950 350" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="900" y="340" font-size="12" text-anchor="middle" fill="#34495e">Output</text>
  
  <!-- Feedback Loop -->
  <path d="M 1050 500 Q 1050 650, 600 650 Q 150 650, 150 500" 
        stroke="#e74c3c" stroke-width="2" stroke-dasharray="5,5" fill="none" marker-end="url(#arrowhead)"/>
  <text x="600" y="640" font-size="12" text-anchor="middle" fill="#e74c3c">Feedback Loop</text>
</svg>