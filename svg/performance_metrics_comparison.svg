<svg viewBox="0 0 900 750" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="r2Gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="mseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#b91c1c;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="adjGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:0.8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="750" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1e293b">
    Predictive Performance Metrics Comparison
  </text>
  
  <!-- Metric Definitions -->
  <text x="450" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">
    Key Metrics Definitions
  </text>
  
  <!-- R-squared box -->
  <rect x="50" y="100" width="250" height="120" rx="8" fill="url(#r2Gradient)" filter="url(#shadow)"/>
  <text x="175" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
    R-squared (R²)
  </text>
  <text x="175" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="white">
    R² = 1 - SSR/TSS
  </text>
  <text x="175" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Proportion of variance explained
  </text>
  <text x="175" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Range: [0, 1]
  </text>
  <text x="175" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Higher = Better
  </text>
  
  <!-- MSE box -->
  <rect x="325" y="100" width="250" height="120" rx="8" fill="url(#mseGradient)" filter="url(#shadow)"/>
  <text x="450" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
    Mean Squared Error
  </text>
  <text x="450" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="white">
    MSE = E[(Y - Ŷ)²]
  </text>
  <text x="450" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Average prediction error
  </text>
  <text x="450" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Range: [0, ∞)
  </text>
  <text x="450" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Lower = Better
  </text>
  
  <!-- Adjusted R-squared box -->
  <rect x="600" y="100" width="250" height="120" rx="8" fill="url(#adjGradient)" filter="url(#shadow)"/>
  <text x="725" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
    Adjusted R²
  </text>
  <text x="725" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="white">
    R²ₐdⱼ = 1 - (n/(n-p)) × (1-R²)
  </text>
  <text x="725" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Penalizes model complexity
  </text>
  <text x="725" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Accounts for overfitting
  </text>
  <text x="725" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    More reliable when p large
  </text>
  
  <!-- Performance vs p/n ratio -->
  <text x="450" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">
    Performance vs p/n Ratio: Simulation Results
  </text>
  
  <!-- Simulation table header -->
  <rect x="150" y="290" width="600" height="30" fill="#374151"/>
  <text x="200" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Scenario
  </text>
  <text x="300" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    p/n Ratio
  </text>
  <text x="450" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Sample R²
  </text>
  <text x="550" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    True R²
  </text>
  <text x="650" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Reliability
  </text>
  
  <!-- Perfect overfitting -->
  <rect x="150" y="320" width="600" height="25" fill="#fef2f2"/>
  <text x="200" y="337" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">p = n</text>
  <text x="300" y="337" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">1.0</text>
  <text x="450" y="337" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#dc2626">1.00</text>
  <text x="550" y="337" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">0.00</text>
  <text x="650" y="337" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#dc2626">Extremely Poor</text>
  
  <!-- Severe overfitting -->
  <rect x="150" y="345" width="600" height="25" fill="#ffffff"/>
  <text x="200" y="362" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">p = n/2</text>
  <text x="300" y="362" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">0.5</text>
  <text x="450" y="362" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#dc2626">0.50</text>
  <text x="550" y="362" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">0.00</text>
  <text x="650" y="362" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#dc2626">Poor</text>
  
  <!-- Moderate overfitting -->
  <rect x="150" y="370" width="600" height="25" fill="#fef2f2"/>
  <text x="200" y="387" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">p = n/10</text>
  <text x="300" y="387" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">0.1</text>
  <text x="450" y="387" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#f59e0b">0.10</text>
  <text x="550" y="387" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">0.00</text>
  <text x="650" y="387" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#f59e0b">Moderate</text>
  
  <!-- Good performance -->
  <rect x="150" y="395" width="600" height="25" fill="#ffffff"/>
  <text x="200" y="412" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">p = n/20</text>
  <text x="300" y="412" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">0.05</text>
  <text x="450" y="412" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#059669">0.05</text>
  <text x="550" y="412" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">0.00</text>
  <text x="650" y="412" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#059669">Good</text>
  
  <!-- Real data example -->
  <text x="450" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">
    Real Data Example: Wage Prediction Study
  </text>
  
  <!-- Results table header -->
  <rect x="100" y="480" width="700" height="30" fill="#374151"/>
  <text x="200" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Model
  </text>
  <text x="300" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    p
  </text>
  <text x="400" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    R²sample
  </text>
  <text x="500" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    R²adj
  </text>
  <text x="600" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    R²test
  </text>
  <text x="700" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    MSEtest
  </text>
  
  <!-- Basic model results -->
  <rect x="100" y="510" width="700" height="25" fill="#ecfdf5"/>
  <text x="200" y="527" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#047857">Basic</text>
  <text x="300" y="527" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#047857">10</text>
  <text x="400" y="527" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#047857">0.09</text>
  <text x="500" y="527" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#047857">0.09</text>
  <text x="600" y="527" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#047857">0.08</text>
  <text x="700" y="527" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#047857">129.21</text>
  
  <!-- Flexible model results -->
  <rect x="100" y="535" width="700" height="25" fill="#ddd6fe"/>
  <text x="200" y="552" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5b21b6">Flexible</text>
  <text x="300" y="552" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5b21b6">33</text>
  <text x="400" y="552" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5b21b6">0.10</text>
  <text x="500" y="552" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5b21b6">0.10</text>
  <text x="600" y="552" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5b21b6">0.11</text>
  <text x="700" y="552" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5b21b6">118.71</text>
  
  <!-- Key Observations -->
  <text x="450" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">
    Key Observations
  </text>
  
  <!-- Observation boxes -->
  <rect x="100" y="620" width="250" height="80" rx="6" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
  <text x="225" y="645" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0c4a6e">
    Low p/n Ratio Effect
  </text>
  <text x="225" y="665" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0c4a6e">
    Sample R² ≈ Adjusted R²
  </text>
  <text x="225" y="680" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0c4a6e">
    Reliable performance metrics
  </text>
  <text x="225" y="695" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0c4a6e">
    (n≈4000, p≤33)
  </text>
  
  <rect x="375" y="620" width="250" height="80" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="500" y="645" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#92400e">
    Model Comparison
  </text>
  <text x="500" y="665" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#92400e">
    Similar in-sample performance
  </text>
  <text x="500" y="680" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#92400e">
    Flexible model slightly better
  </text>
  <text x="500" y="695" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#92400e">
    out-of-sample
  </text>
  
  <rect x="650" y="620" width="200" height="80" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="750" y="645" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#15803d">
    Practical Insight
  </text>
  <text x="750" y="665" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#15803d">
    Use adjusted R² when
  </text>
  <text x="750" y="680" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#15803d">
    p/n is not small
  </text>
  <text x="750" y="695" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#15803d">
    (p > n/20)
  </text>
</svg>