<svg viewBox="0 0 800 650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', sans-serif; font-size: 18px; font-weight: bold; fill: #2c3e50; }
      .header { font-family: 'Segoe UI', sans-serif; font-size: 14px; font-weight: bold; fill: #34495e; }
      .text { font-family: 'Segoe UI', sans-serif; font-size: 11px; fill: #2c3e50; }
      .small-text { font-family: 'Segoe UI', sans-serif; font-size: 9px; fill: #7f8c8d; }
      .math { font-family: 'Times New Roman', serif; font-size: 12px; fill: #8e44ad; }
      .ci-line { stroke: #3498db; stroke-width: 4; }
      .point-estimate { fill: #e74c3c; stroke: #c0392b; stroke-width: 2; }
      .hypothesis-value { fill: #f39c12; stroke: #e67e22; stroke-width: 2; }
      .tick-mark { stroke: #2c3e50; stroke-width: 2; }
      .box { fill: #ecf0f1; stroke: #34495e; stroke-width: 2; }
      .example-box { fill: #d5e8d4; stroke: #82b366; stroke-width: 2; }
      .formula-box { fill: #fff2cc; stroke: #d6b656; stroke-width: 2; }
    </style>
  </defs>

  <!-- Title -->
  <text x="400" y="25" class="title" text-anchor="middle">Confidence Intervals and Hypothesis Tests</text>

  <!-- Relationship explanation -->
  <rect x="50" y="40" width="700" height="60" class="box" rx="8"/>
  <text x="400" y="60" class="header" text-anchor="middle">Fundamental Relationship</text>
  <text x="70" y="75" class="text">Confidence intervals and hypothesis tests are mathematically equivalent methods</text>
  <text x="70" y="90" class="text">Both use the same sampling distribution and provide consistent results</text>

  <!-- Example 1: Reject H₀ -->
  <text x="150" y="130" class="header" text-anchor="middle">Case 1: Reject H₀</text>
  
  <!-- CI line that doesn't contain μ₀ -->
  <line x1="80" y1="160" x2="220" y2="160" class="ci-line"/>
  <line x1="80" y1="155" x2="80" y2="165" class="tick-mark"/>
  <line x1="220" y1="155" x2="220" y2="165" class="tick-mark"/>
  <circle cx="150" cy="160" r="4" class="point-estimate"/>
  <circle cx="260" cy="160" r="4" class="hypothesis-value"/>
  
  <text x="80" y="180" class="small-text" text-anchor="middle">Lower</text>
  <text x="220" y="180" class="small-text" text-anchor="middle">Upper</text>
  <text x="150" y="145" class="small-text" text-anchor="middle">X̄</text>
  <text x="260" y="145" class="small-text" text-anchor="middle">μ₀</text>
  
  <text x="150" y="200" class="text" text-anchor="middle">95% CI: [L, U]</text>
  <text x="150" y="215" class="text" text-anchor="middle">μ₀ is outside CI</text>
  <text x="150" y="230" class="text" text-anchor="middle">→ Reject H₀</text>

  <!-- Example 2: Fail to Reject H₀ -->
  <text x="550" y="130" class="header" text-anchor="middle">Case 2: Fail to Reject H₀</text>
  
  <!-- CI line that contains μ₀ -->
  <line x1="480" y1="160" x2="620" y2="160" class="ci-line"/>
  <line x1="480" y1="155" x2="480" y2="165" class="tick-mark"/>
  <line x1="620" y1="155" x2="620" y2="165" class="tick-mark"/>
  <circle cx="540" cy="160" r="4" class="point-estimate"/>
  <circle cx="570" cy="160" r="4" class="hypothesis-value"/>
  
  <text x="480" y="180" class="small-text" text-anchor="middle">Lower</text>
  <text x="620" y="180" class="small-text" text-anchor="middle">Upper</text>
  <text x="540" y="145" class="small-text" text-anchor="middle">X̄</text>
  <text x="570" y="145" class="small-text" text-anchor="middle">μ₀</text>
  
  <text x="550" y="200" class="text" text-anchor="middle">95% CI: [L, U]</text>
  <text x="550" y="215" class="text" text-anchor="middle">μ₀ is inside CI</text>
  <text x="550" y="230" class="text" text-anchor="middle">→ Fail to reject H₀</text>

  <!-- Formulas -->
  <rect x="50" y="260" width="700" height="100" class="formula-box" rx="8"/>
  <text x="400" y="280" class="header" text-anchor="middle">Confidence Interval Formulas</text>
  
  <text x="70" y="300" class="text">Population Standard Deviation Known (σ):</text>
  <text x="90" y="315" class="math">CI = X̄ ± Z_{α/2} × (σ/√n)</text>
  
  <text x="400" y="300" class="text">Population Standard Deviation Unknown (s):</text>
  <text x="420" y="315" class="math">CI = X̄ ± t_{α/2,df} × (s/√n)</text>
  
  <text x="70" y="340" class="text">Where df = n - 1 for t-distribution</text>
  <text x="400" y="340" class="text">α = significance level (e.g., α = 0.05 for 95% CI)</text>

  <!-- Decision Rule -->
  <rect x="50" y="380" width="350" height="80" class="example-box" rx="8"/>
  <text x="225" y="400" class="header" text-anchor="middle">Decision Rule</text>
  <text x="70" y="420" class="text">For two-tailed test with significance level α:</text>
  <text x="70" y="435" class="text">• If μ₀ ∈ (1-α)% CI → Fail to reject H₀</text>
  <text x="70" y="450" class="text">• If μ₀ ∉ (1-α)% CI → Reject H₀</text>

  <!-- Practical Example -->
  <rect x="420" y="380" width="330" height="140" class="example-box" rx="8"/>
  <text x="585" y="400" class="header" text-anchor="middle">Numerical Example</text>
  <text x="440" y="420" class="text">Test: H₀: μ = 100 vs H₁: μ ≠ 100</text>
  <text x="440" y="435" class="text">Sample: X̄ = 105, s = 15, n = 25</text>
  <text x="440" y="450" class="text">α = 0.05, t₀.₀₂₅,₂₄ = 2.064</text>
  
  <text x="440" y="470" class="math">95% CI = 105 ± 2.064 × (15/√25)</text>
  <text x="440" y="485" class="math">      = 105 ± 6.19 = [98.81, 111.19]</text>
  
  <text x="440" y="505" class="text">Since 100 ∈ [98.81, 111.19] → Fail to reject H₀</text>

  <!-- Key Points -->
  <rect x="50" y="540" width="700" height="80" class="box" rx="8"/>
  <text x="400" y="560" class="header" text-anchor="middle">Key Advantages of Confidence Intervals</text>
  <text x="70" y="580" class="text">✓ Shows range of plausible values, not just statistical significance</text>
  <text x="70" y="595" class="text">✓ Provides information about effect size and practical significance</text>
  <text x="70" y="610" class="text">✓ Indicates precision of estimate (wider interval = less precision)</text>

</svg>