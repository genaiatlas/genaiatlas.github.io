<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="500" y="35" font-size="24" font-weight="bold" text-anchor="middle" fill="#2C3E50">
    Collaborative Filtering: User-Item Matrix Structure
  </text>
  
  <!-- Main Rating Matrix -->
  <g id="rating-matrix">
    <!-- Matrix Border -->
    <rect x="100" y="80" width="400" height="500" fill="#F8F9FA" stroke="#34495E" stroke-width="3"/>
    
    <!-- Column Labels (Movies) -->
    <text x="200" y="70" font-size="12" font-weight="bold" text-anchor="middle" fill="#2980B9">Movie 1</text>
    <text x="300" y="70" font-size="12" font-weight="bold" text-anchor="middle" fill="#2980B9">Movie 2</text>
    <text x="400" y="70" font-size="12" font-weight="bold" text-anchor="middle" fill="#2980B9">Movie 3</text>
    <text x="470" y="70" font-size="12" font-weight="bold" text-anchor="middle" fill="#2980B9">...</text>
    
    <!-- Row Labels (Users) -->
    <text x="80" y="140" font-size="12" font-weight="bold" text-anchor="end" fill="#E74C3C">User 1</text>
    <text x="80" y="240" font-size="12" font-weight="bold" text-anchor="end" fill="#E74C3C">User 2</text>
    <text x="80" y="340" font-size="12" font-weight="bold" text-anchor="end" fill="#E74C3C">User 3</text>
    <text x="80" y="440" font-size="12" font-weight="bold" text-anchor="end" fill="#E74C3C">User 4</text>
    <text x="80" y="540" font-size="12" font-weight="bold" text-anchor="end" fill="#E74C3C">...</text>
    
    <!-- Sample Ratings (filled cells) -->
    <!-- Row 1 -->
    <rect x="150" y="110" width="80" height="50" fill="#3498DB" opacity="0.7"/>
    <text x="190" y="140" font-size="16" font-weight="bold" text-anchor="middle" fill="white">5</text>
    
    <rect x="250" y="110" width="80" height="50" fill="#95A5A6" opacity="0.5"/>
    <text x="290" y="140" font-size="16" text-anchor="middle" fill="#555">?</text>
    
    <rect x="350" y="110" width="80" height="50" fill="#E74C3C" opacity="0.7"/>
    <text x="390" y="140" font-size="16" font-weight="bold" text-anchor="middle" fill="white">2</text>
    
    <!-- Row 2 -->
    <rect x="150" y="210" width="80" height="50" fill="#95A5A6" opacity="0.5"/>
    <text x="190" y="240" font-size="16" text-anchor="middle" fill="#555">?</text>
    
    <rect x="250" y="210" width="80" height="50" fill="#2ECC71" opacity="0.7"/>
    <text x="290" y="240" font-size="16" font-weight="bold" text-anchor="middle" fill="white">4</text>
    
    <rect x="350" y="210" width="80" height="50" fill="#3498DB" opacity="0.7"/>
    <text x="390" y="240" font-size="16" font-weight="bold" text-anchor="middle" fill="white">5</text>
    
    <!-- Row 3 -->
    <rect x="150" y="310" width="80" height="50" fill="#2ECC71" opacity="0.7"/>
    <text x="190" y="340" font-size="16" font-weight="bold" text-anchor="middle" fill="white">4</text>
    
    <rect x="250" y="310" width="80" height="50" fill="#95A5A6" opacity="0.5"/>
    <text x="290" y="340" font-size="16" text-anchor="middle" fill="#555">?</text>
    
    <rect x="350" y="310" width="80" height="50" fill="#E67E22" opacity="0.7"/>
    <text x="390" y="340" font-size="16" font-weight="bold" text-anchor="middle" fill="white">3</text>
    
    <!-- Row 4 -->
    <rect x="150" y="410" width="80" height="50" fill="#E74C3C" opacity="0.7"/>
    <text x="190" y="440" font-size="16" font-weight="bold" text-anchor="middle" fill="white">1</text>
    
    <rect x="250" y="410" width="80" height="50" fill="#3498DB" opacity="0.7"/>
    <text x="290" y="440" font-size="16" font-weight="bold" text-anchor="middle" fill="white">5</text>
    
    <rect x="350" y="410" width="80" height="50" fill="#95A5A6" opacity="0.5"/>
    <text x="390" y="440" font-size="16" text-anchor="middle" fill="#555">?</text>
  </g>
  
  <!-- SVD Decomposition Arrow -->
  <g id="decomposition-arrow">
    <path d="M 520 330 L 580 330" stroke="#34495E" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
    <text x="550" y="320" font-size="14" font-weight="bold" text-anchor="middle" fill="#E74C3C">SVD</text>
  </g>
  
  <!-- Arrow Marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#34495E"/>
    </marker>
  </defs>
  
  <!-- Factorized Matrices -->
  <g id="factors">
    <!-- User Matrix (U) -->
    <rect x="600" y="200" width="120" height="280" fill="#FFE5E5" stroke="#E74C3C" stroke-width="2"/>
    <text x="660" y="190" font-size="14" font-weight="bold" text-anchor="middle" fill="#E74C3C">Users (U)</text>
    
    <!-- Visual representation of U matrix -->
    <line x1="620" y1="220" x2="700" y2="220" stroke="#E74C3C" stroke-width="1" opacity="0.3"/>
    <line x1="620" y1="280" x2="700" y2="280" stroke="#E74C3C" stroke-width="1" opacity="0.3"/>
    <line x1="620" y1="340" x2="700" y2="340" stroke="#E74C3C" stroke-width="1" opacity="0.3"/>
    <line x1="620" y1="400" x2="700" y2="400" stroke="#E74C3C" stroke-width="1" opacity="0.3"/>
    <line x1="620" y1="460" x2="700" y2="460" stroke="#E74C3C" stroke-width="1" opacity="0.3"/>
    
    <text x="660" y="250" font-size="11" text-anchor="middle" fill="#555">latent</text>
    <text x="660" y="265" font-size="11" text-anchor="middle" fill="#555">factors</text>
    
    <!-- Sigma Matrix (Σ) -->
    <rect x="740" y="300" width="80" height="80" fill="#FFF4E5" stroke="#F39C12" stroke-width="2"/>
    <text x="780" y="290" font-size="14" font-weight="bold" text-anchor="middle" fill="#F39C12">Σ</text>
    
    <!-- Diagonal visualization -->
    <circle cx="755" cy="315" r="4" fill="#F39C12"/>
    <circle cx="770" cy="330" r="4" fill="#F39C12"/>
    <circle cx="785" cy="345" r="4" fill="#E67E22"/>
    <circle cx="800" cy="360" r="4" fill="#D35400"/>
    
    <text x="780" y="400" font-size="10" text-anchor="middle" fill="#555">singular</text>
    <text x="780" y="412" font-size="10" text-anchor="middle" fill="#555">values</text>
    
    <!-- Movie Matrix (V^T) -->
    <rect x="600" y="500" width="280" height="120" fill="#E5F4FF" stroke="#2980B9" stroke-width="2"/>
    <text x="740" y="640" font-size="14" font-weight="bold" text-anchor="middle" fill="#2980B9">Movies (V^T)</text>
    
    <!-- Visual representation of V^T matrix -->
    <line x1="620" y1="520" x2="620" y2="600" stroke="#2980B9" stroke-width="1" opacity="0.3"/>
    <line x1="680" y1="520" x2="680" y2="600" stroke="#2980B9" stroke-width="1" opacity="0.3"/>
    <line x1="740" y1="520" x2="740" y2="600" stroke="#2980B9" stroke-width="1" opacity="0.3"/>
    <line x1="800" y1="520" x2="800" y2="600" stroke="#2980B9" stroke-width="1" opacity="0.3"/>
    <line x1="860" y1="520" x2="860" y2="600" stroke="#2980B9" stroke-width="1" opacity="0.3"/>
    
    <text x="740" y="565" font-size="11" text-anchor="middle" fill="#555">latent factors</text>
  </g>
  
  <!-- Key Information Box -->
  <g id="info-box">
    <rect x="100" y="600" width="380" height="80" fill="#ECF0F1" stroke="#34495E" stroke-width="2" rx="5"/>
    <text x="290" y="625" font-size="13" font-weight="bold" text-anchor="middle" fill="#2C3E50">Matrix Factorization</text>
    <text x="290" y="645" font-size="11" text-anchor="middle" fill="#555">R ≈ U × Σ × V^T</text>
    <text x="290" y="665" font-size="10" text-anchor="middle" fill="#7F8C8D">Predicts missing ratings by finding latent preference patterns</text>
  </g>
</svg>