<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="matrixAGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8E44AD;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6C3483;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="matrixUGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498DB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2874A6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="matrixSGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F39C12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D68910;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="matrixVGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E74C3C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CB4335;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="500" fill="#FAFBFC"/>
  
  <!-- Title -->
  <text x="450" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2C3E50">
    Singular Value Decomposition: A = USV^T
  </text>
  
  <!-- Matrix A -->
  <g transform="translate(50, 150)">
    <text x="60" y="-20" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#8E44AD">
      A
    </text>
    <text x="60" y="-40" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7F8C8D">
      Original Matrix
    </text>
    <rect x="0" y="0" width="120" height="160" fill="url(#matrixAGrad)" opacity="0.1" stroke="#8E44AD" stroke-width="2" rx="3"/>
    
    <!-- Matrix elements -->
    <text x="30" y="40" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#8E44AD">a₁₁</text>
    <text x="60" y="40" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#8E44AD">a₁₂</text>
    <text x="90" y="40" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#8E44AD">a₁₃</text>
    
    <text x="30" y="80" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#8E44AD">a₂₁</text>
    <text x="60" y="80" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#8E44AD">a₂₂</text>
    <text x="90" y="80" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#8E44AD">a₂₃</text>
    
    <text x="30" y="120" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#8E44AD">a₃₁</text>
    <text x="60" y="120" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#8E44AD">a₃₂</text>
    <text x="90" y="120" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#8E44AD">a₃₃</text>
    
    <text x="60" y="155" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#7F8C8D">m × n</text>
  </g>
  
  <!-- Equals sign -->
  <text x="210" y="235" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#2C3E50">=</text>
  
  <!-- Matrix U -->
  <g transform="translate(270, 150)">
    <text x="60" y="-20" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#3498DB">
      U
    </text>
    <text x="60" y="-40" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7F8C8D">
      Left Singular
    </text>
    <rect x="0" y="0" width="120" height="160" fill="url(#matrixUGrad)" opacity="0.1" stroke="#3498DB" stroke-width="2" rx="3"/>
    
    <!-- Matrix elements -->
    <text x="30" y="40" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#3498DB">u₁₁</text>
    <text x="60" y="40" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#3498DB">u₁₂</text>
    <text x="90" y="40" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#3498DB">u₁ᵣ</text>
    
    <text x="30" y="80" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#3498DB">u₂₁</text>
    <text x="60" y="80" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#3498DB">u₂₂</text>
    <text x="90" y="80" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#3498DB">u₂ᵣ</text>
    
    <text x="30" y="120" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#3498DB">uₘ₁</text>
    <text x="60" y="120" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#3498DB">uₘ₂</text>
    <text x="90" y="120" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#3498DB">uₘᵣ</text>
    
    <text x="60" y="155" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#7F8C8D">m × r</text>
  </g>
  
  <!-- Multiplication sign -->
  <text x="430" y="235" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#2C3E50">×</text>
  
  <!-- Matrix S -->
  <g transform="translate(470, 150)">
    <text x="60" y="-20" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#F39C12">
      S
    </text>
    <text x="60" y="-40" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7F8C8D">
      Diagonal
    </text>
    <rect x="0" y="0" width="120" height="120" fill="url(#matrixSGrad)" opacity="0.1" stroke="#F39C12" stroke-width="2" rx="3"/>
    
    <!-- Diagonal elements -->
    <text x="25" y="30" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#F39C12">s₁</text>
    <text x="60" y="30" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#BDC3C7">0</text>
    <text x="95" y="30" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#BDC3C7">0</text>
    
    <text x="25" y="65" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#BDC3C7">0</text>
    <text x="60" y="65" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#F39C12">s₂</text>
    <text x="95" y="65" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#BDC3C7">0</text>
    
    <text x="25" y="100" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#BDC3C7">0</text>
    <text x="60" y="100" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#BDC3C7">0</text>
    <text x="95" y="100" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#F39C12">sᵣ</text>
    
    <text x="60" y="155" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#7F8C8D">r × r</text>
  </g>
  
  <!-- Multiplication sign -->
  <text x="630" y="235" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#2C3E50">×</text>
  
  <!-- Matrix V^T -->
  <g transform="translate(670, 150)">
    <text x="60" y="-20" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#E74C3C">
      V^T
    </text>
    <text x="60" y="-40" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7F8C8D">
      Right Singular
    </text>
    <rect x="0" y="0" width="120" height="100" fill="url(#matrixVGrad)" opacity="0.1" stroke="#E74C3C" stroke-width="2" rx="3"/>
    
    <!-- Matrix elements -->
    <text x="30" y="30" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#E74C3C">v₁₁</text>
    <text x="60" y="30" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#E74C3C">v₁₂</text>
    <text x="90" y="30" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#E74C3C">v₁ₙ</text>
    
    <text x="30" y="60" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#E74C3C">v₂₁</text>
    <text x="60" y="60" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#E74C3C">v₂₂</text>
    <text x="90" y="60" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#E74C3C">v₂ₙ</text>
    
    <text x="30" y="90" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#E74C3C">vᵣ₁</text>
    <text x="60" y="90" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#E74C3C">vᵣ₂</text>
    <text x="90" y="90" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#E74C3C">vᵣₙ</text>
    
    <text x="60" y="135" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#7F8C8D">r × n</text>
  </g>
  
  <!-- Properties -->
  <g transform="translate(100, 370)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2C3E50">Key Properties:</text>
    
    <text x="0" y="30" font-family="Arial, sans-serif" font-size="12" fill="#34495E">
      • U: Orthogonal matrix containing left singular vectors (user features)
    </text>
    <text x="0" y="55" font-family="Arial, sans-serif" font-size="12" fill="#34495E">
      • S: Diagonal matrix with singular values s₁ ≥ s₂ ≥ ... ≥ sᵣ > 0
    </text>
    <text x="0" y="80" font-family="Arial, sans-serif" font-size="12" fill="#34495E">
      • V^T: Orthogonal matrix containing right singular vectors (item features)
    </text>
    <text x="0" y="105" font-family="Arial, sans-serif" font-size="12" fill="#34495E">
      • Rank(A) = r ≤ min(m, n)
    </text>
  </g>
</svg>