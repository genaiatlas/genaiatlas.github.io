<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2E86AB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A23B72;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="treatmentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F18F01;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C73E1D;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="controlGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3F88C5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#032B43;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="#f8f9fa"/>
  
  <!-- Title -->
  <rect x="50" y="20" width="700" height="50" fill="url(#headerGrad)" rx="10"/>
  <text x="400" y="50" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="22" font-weight="bold">
    HIP Breast Cancer Study: Data Collection &amp; Hypothesis Testing
  </text>
  
  <!-- Main Question Box -->
  <rect x="100" y="90" width="600" height="60" fill="#fff3cd" stroke="#ffeaa7" stroke-width="2" rx="8"/>
  <text x="400" y="115" text-anchor="middle" fill="#6c5700" font-family="Arial, sans-serif" font-size="16" font-weight="bold">
    Central Question:
  </text>
  <text x="400" y="135" text-anchor="middle" fill="#6c5700" font-family="Arial, sans-serif" font-size="14">
    Does mammography screening reduce breast cancer deaths enough to matter?
  </text>
  
  <!-- Study Population -->
  <rect x="50" y="180" width="700" height="80" fill="#e8f4fd" stroke="#74b9ff" stroke-width="2" rx="8"/>
  <text x="400" y="205" text-anchor="middle" fill="#2d3436" font-family="Arial, sans-serif" font-size="16" font-weight="bold">
    Study Population: Health Insurance Plan (HIP) New York
  </text>
  <text x="400" y="225" text-anchor="middle" fill="#2d3436" font-family="Arial, sans-serif" font-size="14">
    ~700,000 enrolled members → 62,000 women (age 40-64) randomly selected
  </text>
  <text x="400" y="245" text-anchor="middle" fill="#2d3436" font-family="Arial, sans-serif" font-size="14">
    Conducted in 1960s • 5-year follow-up period
  </text>
  
  <!-- Randomization Arrow -->
  <path d="M 400 280 L 300 320 L 500 320 Z" fill="#636e72" stroke="#2d3436" stroke-width="2"/>
  <text x="400" y="335" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">
    RANDOMIZATION
  </text>
  
  <!-- Treatment Group -->
  <rect x="80" y="360" width="280" height="120" fill="url(#treatmentGrad)" rx="10"/>
  <text x="220" y="385" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">
    TREATMENT GROUP
  </text>
  <text x="220" y="405" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14">
    31,000 women
  </text>
  <text x="220" y="425" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12">
    Invited for mammography
  </text>
  <text x="220" y="445" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12">
    4 times per year
  </text>
  <text x="220" y="465" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">
    39 breast cancer deaths
  </text>
  
  <!-- Control Group -->
  <rect x="440" y="360" width="280" height="120" fill="url(#controlGrad)" rx="10"/>
  <text x="580" y="385" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">
    CONTROL GROUP
  </text>
  <text x="580" y="405" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14">
    31,000 women
  </text>
  <text x="580" y="425" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12">
    Standard healthcare
  </text>
  <text x="580" y="445" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12">
    No mammography invitation
  </text>
  <text x="580" y="465" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">
    63 breast cancer deaths
  </text>
</svg>