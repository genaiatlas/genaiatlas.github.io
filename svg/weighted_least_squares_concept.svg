<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="500" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">
    Weighted Least Squares: Addressing Heteroskedasticity
  </text>
  
  <!-- Problem illustration -->
  <g transform="translate(50, 70)">
    <rect width="300" height="150" fill="#ffebee" stroke="#d32f2f" stroke-width="2" rx="10"/>
    <text x="150" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#d32f2f">
      Problem: Unequal Reliability
    </text>
    
    <!-- Data points with different error bars -->
    <g transform="translate(50, 40)">
      <!-- High variance point (less reliable) -->
      <circle cx="50" cy="40" r="4" fill="#1976d2"/>
      <line x1="50" y1="20" x2="50" y2="60" stroke="#d32f2f" stroke-width="2"/>
      <line x1="45" y1="20" x2="55" y2="20" stroke="#d32f2f" stroke-width="2"/>
      <line x1="45" y1="60" x2="55" y2="60" stroke="#d32f2f" stroke-width="2"/>
      <text x="50" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">High σᵢ²</text>
      <text x="50" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">Less reliable</text>
      
      <!-- Medium variance point -->
      <circle cx="150" cy="40" r="4" fill="#1976d2"/>
      <line x1="150" y1="30" x2="150" y2="50" stroke="#ff9800" stroke-width="2"/>
      <line x1="145" y1="30" x2="155" y2="30" stroke="#ff9800" stroke-width="2"/>
      <line x1="145" y1="50" x2="155" y2="50" stroke="#ff9800" stroke-width="2"/>
      <text x="150" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Medium σᵢ²</text>
      
      <!-- Low variance point (more reliable) -->
      <circle cx="250" cy="40" r="4" fill="#1976d2"/>
      <line x1="250" y1="35" x2="250" y2="45" stroke="#388e3c" stroke-width="2"/>
      <line x1="245" y1="35" x2="255" y2="35" stroke="#388e3c" stroke-width="2"/>
      <line x1="245" y1="45" x2="255" y2="45" stroke="#388e3c" stroke-width="2"/>
      <text x="250" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Low σᵢ²</text>
      <text x="250" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">More reliable</text>
    </g>
  </g>
  
  <!-- Solution illustration -->
  <g transform="translate(450, 70)">
    <rect width="300" height="150" fill="#e8f5e8" stroke="#388e3c" stroke-width="2" rx="10"/>
    <text x="150" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#388e3c">
      Solution: Weight by Reliability
    </text>
    
    <!-- Weighted data points -->
    <g transform="translate(50, 40)">
      <!-- High variance point (small weight) -->
      <circle cx="50" cy="40" r="2" fill="#1976d2" opacity="0.5"/>
      <text x="50" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">wᵢ = 1/σᵢ²</text>
      <text x="50" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">Small weight</text>
      <text x="50" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#d32f2f">Low influence</text>
      
      <!-- Medium variance point -->
      <circle cx="150" cy="40" r="3" fill="#1976d2" opacity="0.7"/>
      <text x="150" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">wᵢ = 1/σᵢ²</text>
      <text x="150" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">Medium weight</text>
      
      <!-- Low variance point (large weight) -->
      <circle cx="250" cy="40" r="5" fill="#1976d2"/>
      <text x="250" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">wᵢ = 1/σᵢ²</text>
      <text x="250" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">Large weight</text>
      <text x="250" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#388e3c">High influence</text>
    </g>
  </g>
  
  <!-- Mathematical formulation -->
  <g transform="translate(100, 260)">
    <rect width="600" height="120" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="10"/>
    <text x="300" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1976d2">
      Weighted Least Squares Formulation
    </text>
    
    <!-- OLS vs WLS comparison -->
    <g transform="translate(50, 50)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">
        Ordinary Least Squares (OLS):
      </text>
      <text x="0" y="20" font-family="Arial, sans-serif" font-size="12" fill="#333">
        Minimize: Σ(yᵢ - xᵢᵀθ)²
      </text>
      <text x="0" y="35" font-family="Arial, sans-serif" font-size="10" fill="#666">
        (All observations weighted equally)
      </text>
    </g>
    
    <g transform="translate(350, 50)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">
        Weighted Least Squares (WLS):
      </text>
      <text x="0" y="20" font-family="Arial, sans-serif" font-size="12" fill="#333">
        Minimize: Σ wᵢ(yᵢ - xᵢᵀθ)²
      </text>
      <text x="0" y="35" font-family="Arial, sans-serif" font-size="10" fill="#666">
        where wᵢ = 1/σᵢ² (inverse variance weights)
      </text>
    </g>
  </g>
  
  <!-- Benefits and limitations -->
  <g transform="translate(50, 410)">
    <!-- Benefits -->
    <rect x="0" y="0" width="320" height="80" fill="#e8f5e8" stroke="#388e3c" stroke-width="1" rx="5"/>
    <text x="160" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#388e3c">
      Benefits of WLS
    </text>
    <text x="20" y="40" font-family="Arial, sans-serif" font-size="11" fill="#333">
      ✓ Correct standard errors
    </text>
    <text x="20" y="55" font-family="Arial, sans-serif" font-size="11" fill="#333">
      ✓ More efficient estimates
    </text>
    <text x="20" y="70" font-family="Arial, sans-serif" font-size="11" fill="#333">
      ✓ Valid hypothesis tests
    </text>
    
    <!-- Limitations -->
    <rect x="360" y="0" width="320" height="80" fill="#fff3e0" stroke="#f57c00" stroke-width="1" rx="5"/>
    <text x="520" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f57c00">
      Practical Limitations
    </text>
    <text x="380" y="40" font-family="Arial, sans-serif" font-size="11" fill="#333">
      ⚠ Requires known variances σᵢ²
    </text>
    <text x="380" y="55" font-family="Arial, sans-serif" font-size="11" fill="#333">
      ⚠ Rarely available in practice
    </text>
    <text x="380" y="70" font-family="Arial, sans-serif" font-size="11" fill="#333">
      ⚠ May need robust methods instead
    </text>
  </g>
  
  <!-- Arrow showing transformation -->
  <path d="M 370 145 L 430 145" stroke="#666" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="400" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">
    Apply weights
  </text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
</svg>