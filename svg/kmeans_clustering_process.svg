<svg viewBox="0 0 900 650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #2c3e50; }
      .subtitle { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #34495e; }
      .text { font-family: Arial, sans-serif; font-size: 11px; fill: #2c3e50; }
      .step-text { font-family: Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #8e44ad; }
      .data-point { fill: #95a5a6; stroke: #7f8c8d; stroke-width: 1; }
      .centroid-1 { fill: #e74c3c; stroke: #c0392b; stroke-width: 2; }
      .centroid-2 { fill: #3498db; stroke: #2980b9; stroke-width: 2; }
      .centroid-3 { fill: #f39c12; stroke: #d68910; stroke-width: 2; }
      .cluster-1 { fill: #ff7675; stroke: #d63031; stroke-width: 1; }
      .cluster-2 { fill: #74b9ff; stroke: #0984e3; stroke-width: 1; }
      .cluster-3 { fill: #fdcb6e; stroke: #e17055; stroke-width: 1; }
      .arrow { stroke: #8e44ad; stroke-width: 2; fill: none; marker-end: url(#purplearrow); }
      .grid-line { stroke: #ecf0f1; stroke-width: 0.5; opacity: 0.5; }
      .step-box { fill: #f8f9fa; stroke: #6c757d; stroke-width: 1; }
    </style>
    <marker id="purplearrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8e44ad" />
    </marker>
  </defs>

  <text x="450" y="25" class="title" text-anchor="middle">K-Means Clustering Algorithm Process (K=3)</text>

  <!-- Step 1: Initial Data -->
  <g transform="translate(50, 50)">
    <rect x="-10" y="-10" width="180" height="160" class="step-box" rx="5"/>
    <text x="80" y="5" class="step-text" text-anchor="middle">Step 1: Initial Data</text>
    
    <!-- Grid -->
    <g opacity="0.3">
      <line x1="10" y1="20" x2="160" y2="20" class="grid-line"/>
      <line x1="10" y1="50" x2="160" y2="50" class="grid-line"/>
      <line x1="10" y1="80" x2="160" y2="80" class="grid-line"/>
      <line x1="10" y1="110" x2="160" y2="110" class="grid-line"/>
      <line x1="40" y1="10" x2="40" y2="130" class="grid-line"/>
      <line x1="70" y1="10" x2="70" y2="130" class="grid-line"/>
      <line x1="100" y1="10" x2="100" y2="130" class="grid-line"/>
      <line x1="130" y1="10" x2="130" y2="130" class="grid-line"/>
    </g>
    
    <!-- Data points -->
    <circle cx="30" cy="35" r="4" class="data-point"/>
    <circle cx="40" cy="25" r="4" class="data-point"/>
    <circle cx="35" cy="45" r="4" class="data-point"/>
    <circle cx="50" cy="30" r="4" class="data-point"/>
    <circle cx="110" cy="40" r="4" class="data-point"/>
    <circle cx="120" cy="50" r="4" class="data-point"/>
    <circle cx="125" cy="35" r="4" class="data-point"/>
    <circle cx="115" cy="60" r="4" class="data-point"/>
    <circle cx="80" cy="90" r="4" class="data-point"/>
    <circle cx="70" cy="100" r="4" class="data-point"/>
    <circle cx="90" cy="85" r="4" class="data-point"/>
    <circle cx="75" cy="95" r="4" class="data-point"/>
  </g>

  <!-- Arrow 1 -->
  <line x1="240" y1="125" x2="280" y2="125" class="arrow"/>

  <!-- Step 2: Initialize Centroids -->
  <g transform="translate(290, 50)">
    <rect x="-10" y="-10" width="180" height="160" class="step-box" rx="5"/>
    <text x="80" y="5" class="step-text" text-anchor="middle">Step 2: Initialize Centroids</text>
    
    <!-- Grid -->
    <g opacity="0.3">
      <line x1="10" y1="20" x2="160" y2="20" class="grid-line"/>
      <line x1="10" y1="50" x2="160" y2="50" class="grid-line"/>
      <line x1="10" y1="80" x2="160" y2="80" class="grid-line"/>
      <line x1="10" y1="110" x2="160" y2="110" class="grid-line"/>
      <line x1="40" y1="10" x2="40" y2="130" class="grid-line"/>
      <line x1="70" y1="10" x2="70" y2="130" class="grid-line"/>
      <line x1="100" y1="10" x2="100" y2="130" class="grid-line"/>
      <line x1="130" y1="10" x2="130" y2="130" class="grid-line"/>
    </g>
    
    <!-- Data points -->
    <circle cx="30" cy="35" r="4" class="data-point"/>
    <circle cx="40" cy="25" r="4" class="data-point"/>
    <circle cx="35" cy="45" r="4" class="data-point"/>
    <circle cx="50" cy="30" r="4" class="data-point"/>
    <circle cx="110" cy="40" r="4" class="data-point"/>
    <circle cx="120" cy="50" r="4" class="data-point"/>
    <circle cx="125" cy="35" r="4" class="data-point"/>
    <circle cx="115" cy="60" r="4" class="data-point"/>
    <circle cx="80" cy="90" r="4" class="data-point"/>
    <circle cx="70" cy="100" r="4" class="data-point"/>
    <circle cx="90" cy="85" r="4" class="data-point"/>
    <circle cx="75" cy="95" r="4" class="data-point"/>
    
    <!-- Initial centroids (random) -->
    <circle cx="60" cy="50" r="6" class="centroid-1"/>
    <circle cx="100" cy="70" r="6" class="centroid-2"/>
    <circle cx="90" cy="30" r="6" class="centroid-3"/>
    
    <text x="10" y="145" class="text">Random centroids:</text>
    <circle cx="25" cy="150" r="4" class="centroid-1"/>
    <text x="32" y="154" class="text">C1</text>
    <circle cx="55" cy="150" r="4" class="centroid-2"/>
    <text x="62" y="154" class="text">C2</text>
    <circle cx="85" cy="150" r="4" class="centroid-3"/>
    <text x="92" y="154" class="text">C3</text>
  </g>

  <!-- Arrow 2 -->
  <line x1="480" y1="125" x2="520" y2="125" class="arrow"/>

  <!-- Step 3: Assign Points -->
  <g transform="translate(530, 50)">
    <rect x="-10" y="-10" width="180" height="160" class="step-box" rx="5"/>
    <text x="80" y="5" class="step-text" text-anchor="middle">Step 3: Assign Points</text>
    
    <!-- Grid -->
    <g opacity="0.3">
      <line x1="10" y1="20" x2="160" y2="20" class="grid-line"/>
      <line x1="10" y1="50" x2="160" y2="50" class="grid-line"/>
      <line x1="10" y1="80" x2="160" y2="80" class="grid-line"/>
      <line x1="10" y1="110" x2="160" y2="110" class="grid-line"/>
      <line x1="40" y1="10" x2="40" y2="130" class="grid-line"/>
      <line x1="70" y1="10" x2="70" y2="130" class="grid-line"/>
      <line x1="100" y1="10" x2="100" y2="130" class="grid-line"/>
      <line x1="130" y1="10" x2="130" y2="130" class="grid-line"/>
    </g>
    
    <!-- Assigned data points -->
    <circle cx="30" cy="35" r="4" class="cluster-1"/>
    <circle cx="40" cy="25" r="4" class="cluster-1"/>
    <circle cx="35" cy="45" r="4" class="cluster-1"/>
    <circle cx="50" cy="30" r="4" class="cluster-1"/>
    <circle cx="110" cy="40" r="4" class="cluster-3"/>
    <circle cx="120" cy="50" r="4" class="cluster-3"/>
    <circle cx="125" cy="35" r="4" class="cluster-3"/>
    <circle cx="115" cy="60" r="4" class="cluster-3"/>
    <circle cx="80" cy="90" r="4" class="cluster-2"/>
    <circle cx="70" cy="100" r="4" class="cluster-2"/>
    <circle cx="90" cy="85" r="4" class="cluster-2"/>
    <circle cx="75" cy="95" r="4" class="cluster-2"/>
    
    <!-- Centroids -->
    <circle cx="60" cy="50" r="6" class="centroid-1"/>
    <circle cx="100" cy="70" r="6" class="centroid-2"/>
    <circle cx="90" cy="30" r="6" class="centroid-3"/>
  </g>

  <!-- Arrow 3 (down) -->
  <line x1="620" y1="220" x2="620" y2="260" class="arrow"/>

  <!-- Step 4: Update Centroids -->
  <g transform="translate(530, 270)">
    <rect x="-10" y="-10" width="180" height="160" class="step-box" rx="5"/>
    <text x="80" y="5" class="step-text" text-anchor="middle">Step 4: Update Centroids</text>
    
    <!-- Grid -->
    <g opacity="0.3">
      <line x1="10" y1="20" x2="160" y2="20" class="grid-line"/>
      <line x1="10" y1="50" x2="160" y2="50" class="grid-line"/>
      <line x1="10" y1="80" x2="160" y2="80" class="grid-line"/>
      <line x1="10" y1="110" x2="160" y2="110" class="grid-line"/>
      <line x1="40" y1="10" x2="40" y2="130" class="grid-line"/>
      <line x1="70" y1="10" x2="70" y2="130" class="grid-line"/>
      <line x1="100" y1="10" x2="100" y2="130" class="grid-line"/>
      <line x1="130" y1="10" x2="130" y2="130" class="grid-line"/>
    </g>
    
    <!-- Data points (same clusters) -->
    <circle cx="30" cy="35" r="4" class="cluster-1"/>
    <circle cx="40" cy="25" r="4" class="cluster-1"/>
    <circle cx="35" cy="45" r="4" class="cluster-1"/>
    <circle cx="50" cy="30" r="4" class="cluster-1"/>
    <circle cx="110" cy="40" r="4" class="cluster-3"/>
    <circle cx="120" cy="50" r="4" class="cluster-3"/>
    <circle cx="125" cy="35" r="4" class="cluster-3"/>
    <circle cx="115" cy="60" r="4" class="cluster-3"/>
    <circle cx="80" cy="90" r="4" class="cluster-2"/>
    <circle cx="70" cy="100" r="4" class="cluster-2"/>
    <circle cx="90" cy="85" r="4" class="cluster-2"/>
    <circle cx="75" cy="95" r="4" class="cluster-2"/>
    
    <!-- Updated centroids (moved to mean of clusters) -->
    <circle cx="38" cy="34" r="6" class="centroid-1"/>
    <circle cx="79" cy="92" r="6" class="centroid-2"/>
    <circle cx="117" cy="46" r="6" class="centroid-3"/>
    
    <!-- Show movement with dashed lines -->
    <line x1="60" y1="50" x2="38" y2="34" stroke="#e74c3c" stroke-width="1" stroke-dasharray="3,3" opacity="0.7"/>
    <line x1="100" y1="70" x2="79" y2="92" stroke="#3498db" stroke-width="1" stroke-dasharray="3,3" opacity="0.7"/>
    <line x1="90" y1="30" x2="117" y2="46" stroke="#f39c12" stroke-width="1" stroke-dasharray="3,3" opacity="0.7"/>
  </g>

  <!-- Arrow 4 (left) -->
  <line x1="520" y1="350" x2="480" y2="350" class="arrow"/>

  <!-- Final Result -->
  <g transform="translate(290, 270)">
    <rect x="-10" y="-10" width="180" height="160" class="step-box" rx="5"/>
    <text x="80" y="5" class="step-text" text-anchor="middle">Final Convergence</text>
    
    <!-- Grid -->
    <g opacity="0.3">
      <line x1="10" y1="20" x2="160" y2="20" class="grid-line"/>
      <line x1="10" y1="50" x2="160" y2="50" class="grid-line"/>
      <line x1="10" y1="80" x2="160" y2="80" class="grid-line"/>
      <line x1="10" y1="110" x2="160" y2="110" class="grid-line"/>
      <line x1="40" y1="10" x2="40" y2="130" class="grid-line"/>
      <line x1="70" y1="10" x2="70" y2="130" class="grid-line"/>
      <line x1="100" y1="10" x2="100" y2="130" class="grid-line"/>
      <line x1="130" y1="10" x2="130" y2="130" class="grid-line"/>
    </g>
    
    <!-- Well-clustered data points -->
    <circle cx="30" cy="35" r="4" class="cluster-1"/>
    <circle cx="40" cy="25" r="4" class="cluster-1"/>
    <circle cx="35" cy="45" r="4" class="cluster-1"/>
    <circle cx="50" cy="30" r="4" class="cluster-1"/>
    <circle cx="110" cy="40" r="4" class="cluster-3"/>
    <circle cx="120" cy="50" r="4" class="cluster-3"/>
    <circle cx="125" cy="35" r="4" class="cluster-3"/>
    <circle cx="115" cy="60" r="4" class="cluster-3"/>
    <circle cx="80" cy="90" r="4" class="cluster-2"/>
    <circle cx="70" cy="100" r="4" class="cluster-2"/>
    <circle cx="90" cy="85" r="4" class="cluster-2"/>
    <circle cx="75" cy="95" r="4" class="cluster-2"/>
    
    <!-- Final centroids -->
    <circle cx="38" cy="34" r="6" class="centroid-1"/>
    <circle cx="79" cy="92" r="6" class="centroid-2"/>
    <circle cx="117" cy="46" r="6" class="centroid-3"/>
  </g>

  <!-- Algorithm Description -->
  <g transform="translate(50, 460)">
    <rect x="-10" y="-10" width="800" height="170" fill="#e8f6f3" stroke="#16a085" stroke-width="2" rx="5"/>
    <text x="10" y="10" class="subtitle">K-Means Clustering Algorithm Steps:</text>
    
    <text x="20" y="35" class="text">1. <tspan font-weight="bold">Choose K:</tspan> Determine the number of clusters (K=3 in this example)</text>
    <text x="20" y="50" class="text">2. <tspan font-weight="bold">Initialize:</tspan> Place K centroids randomly in the data space</text>
    <text x="20" y="65" class="text">3. <tspan font-weight="bold">Assign:</tspan> Assign each data point to the nearest centroid using Euclidean distance</text>
    <text x="20" y="80" class="text">4. <tspan font-weight="bold">Update:</tspan> Move each centroid to the mean (center) of its assigned points</text>
    <text x="20" y="95" class="text">5. <tspan font-weight="bold">Repeat:</tspan> Continue steps 3-4 until centroids stop moving (convergence)</text>
    
    <text x="20" y="120" class="text" font-weight="bold">Key Metrics:</text>
    <text x="30" y="135" class="text">• <tspan font-weight="bold">Euclidean Distance:</tspan> d = √[(x₂-x₁)² + (y₂-y₁)²]</text>
    <text x="30" y="150" class="text">• <tspan font-weight="bold">Within Cluster Sum of Squares (WCSS):</tspan> Σ(distance from points to centroid)²</text>
  </g>
</svg>