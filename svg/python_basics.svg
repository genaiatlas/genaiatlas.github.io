<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="675" fill="#f8fafc"/>
  
  <!-- Fast Track Ribbon -->
  <polygon points="1050,0 1200,0 1200,80 1050,60" fill="#3b82f6"/>
  <text x="1125" y="35" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">FAST TRACK</text>
  
  <!-- Title -->
  <text x="600" y="80" text-anchor="middle" fill="#1e293b" font-family="Arial, sans-serif" font-size="36" font-weight="bold">Python Basics</text>
  
  <!-- Variables Box -->
  <rect x="100" y="150" width="200" height="120" fill="#e0f2fe" stroke="#0891b2" stroke-width="2" rx="8"/>
  <text x="200" y="180" text-anchor="middle" fill="#0891b2" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Variables</text>
  <text x="200" y="210" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="16">name = value</text>
  <text x="200" y="235" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="14">x = 10</text>
  <text x="200" y="255" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="14">age = 25</text>
  
  <!-- Strings Box -->
  <rect x="350" y="150" width="200" height="120" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" rx="8"/>
  <text x="450" y="180" text-anchor="middle" fill="#16a34a" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Strings</text>
  <text x="450" y="210" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="16">"text" or 'text'</text>
  <text x="450" y="235" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="14">name = "Alice"</text>
  <text x="450" y="255" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="14">msg = 'Hello'</text>
  
  <!-- Numbers Box -->
  <rect x="600" y="150" width="200" height="120" fill="#fef3c7" stroke="#d97706" stroke-width="2" rx="8"/>
  <text x="700" y="180" text-anchor="middle" fill="#d97706" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Numbers</text>
  <text x="700" y="210" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="16">int, float</text>
  <text x="700" y="235" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="14">count = 42</text>
  <text x="700" y="255" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="14">price = 9.99</text>
  
  <!-- Comments Box -->
  <rect x="850" y="150" width="200" height="120" fill="#fce7f3" stroke="#db2777" stroke-width="2" rx="8"/>
  <text x="950" y="180" text-anchor="middle" fill="#db2777" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Comments</text>
  <text x="950" y="210" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="16"># comment</text>
  <text x="950" y="235" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="14"># This explains</text>
  <text x="950" y="255" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="14"># the code</text>
  
  <!-- Key Points -->
  <rect x="150" y="320" width="900" height="280" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="12"/>
  <text x="600" y="360" text-anchor="middle" fill="#1e293b" font-family="Arial, sans-serif" font-size="24" font-weight="bold">Key Concepts</text>
  
  <!-- Point 1 -->
  <circle cx="200" cy="410" r="4" fill="#3b82f6"/>
  <text x="220" y="415" fill="#374151" font-family="Arial, sans-serif" font-size="16">Dynamic typing - no need to declare variable types</text>
  
  <!-- Point 2 -->
  <circle cx="200" cy="450" r="4" fill="#3b82f6"/>
  <text x="220" y="455" fill="#374151" font-family="Arial, sans-serif" font-size="16">Use meaningful variable names for readable code</text>
  
  <!-- Point 3 -->
  <circle cx="200" cy="490" r="4" fill="#3b82f6"/>
  <text x="220" y="495" fill="#374151" font-family="Arial, sans-serif" font-size="16">Indentation matters in Python (4 spaces recommended)</text>
  
  <!-- Point 4 -->
  <circle cx="200" cy="530" r="4" fill="#3b82f6"/>
  <text x="220" y="535" fill="#374151" font-family="Arial, sans-serif" font-size="16">Comments help explain your code to others and future you</text>
  
  <!-- Python Logo -->
  <circle cx="600" y="620" r="20" fill="#3776ab"/>
  <text x="600" y="627" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Py</text>
</svg>