<svg viewBox="0 0 1100 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1100" height="900" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="550" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Hyperparameter Search Methods Comparison
  </text>
  
  <!-- Grid Search -->
  <g transform="translate(50, 80)">
    <text x="150" y="0" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#3498db">
      Grid Search
    </text>
    <text x="150" y="20" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d" font-style="italic">
      Exhaustive search over all combinations
    </text>
    
    <!-- Grid visualization -->
    <rect x="0" y="40" width="300" height="250" fill="white" stroke="#bdc3c7" stroke-width="2"/>
    
    <!-- Parameter space grid -->
    <!-- Vertical lines -->
    <line x1="60" y1="40" x2="60" y2="290" stroke="#ecf0f1" stroke-width="1"/>
    <line x1="120" y1="40" x2="120" y2="290" stroke="#ecf0f1" stroke-width="1"/>
    <line x1="180" y1="40" x2="180" y2="290" stroke="#ecf0f1" stroke-width="1"/>
    <line x1="240" y1="40" x2="240" y2="290" stroke="#ecf0f1" stroke-width="1"/>
    
    <!-- Horizontal lines -->
    <line x1="0" y1="90" x2="300" y2="90" stroke="#ecf0f1" stroke-width="1"/>
    <line x1="0" y1="140" x2="300" y2="140" stroke="#ecf0f1" stroke-width="1"/>
    <line x1="0" y1="190" x2="300" y2="190" stroke="#ecf0f1" stroke-width="1"/>
    <line x1="0" y1="240" x2="300" y2="240" stroke="#ecf0f1" stroke-width="1"/>
    
    <!-- Evaluation points - all grid intersections -->
    <circle cx="60" cy="90" r="5" fill="#3498db" opacity="0.8"/>
    <circle cx="120" cy="90" r="5" fill="#3498db" opacity="0.8"/>
    <circle cx="180" cy="90" r="5" fill="#3498db" opacity="0.8"/>
    <circle cx="240" cy="90" r="5" fill="#3498db" opacity="0.8"/>
    
    <circle cx="60" cy="140" r="5" fill="#3498db" opacity="0.8"/>
    <circle cx="120" cy="140" r="5" fill="#3498db" opacity="0.8"/>
    <circle cx="180" cy="140" r="5" fill="#3498db" opacity="0.8"/>
    <circle cx="240" cy="140" r="5" fill="#3498db" opacity="0.8"/>
    
    <circle cx="60" cy="190" r="5" fill="#3498db" opacity="0.8"/>
    <circle cx="120" cy="190" r="5" fill="#3498db" opacity="0.8"/>
    <circle cx="180" cy="190" r="5" fill="#3498db" opacity="0.8"/>
    <circle cx="240" cy="190" r="5" fill="#3498db" opacity="0.8"/>
    
    <circle cx="60" cy="240" r="5" fill="#3498db" opacity="0.8"/>
    <circle cx="120" cy="240" r="5" fill="#3498db" opacity="0.8"/>
    <circle cx="180" cy="240" r="5" fill="#3498db" opacity="0.8"/>
    <circle cx="240" cy="240" r="5" fill="#3498db" opacity="0.8"/>
    
    <!-- Best point -->
    <circle cx="180" cy="140" r="8" fill="none" stroke="#27ae60" stroke-width="3"/>
    <text x="180" y="170" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#27ae60" font-weight="bold">Best</text>
    
    <!-- Axis labels -->
    <text x="150" y="310" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">Hyperparameter 1</text>
    <text x="-20" y="165" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e" transform="rotate(-90, -20, 165)">Hyperparameter 2</text>
    
    <!-- Pros/Cons -->
    <rect x="0" y="330" width="300" height="140" fill="#ebf5fb" stroke="#3498db" stroke-width="2" rx="5"/>
    <text x="150" y="350" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">✓ Advantages</text>
    <text x="10" y="370" font-family="Arial, sans-serif" font-size="10" fill="#34495e">• Guaranteed to find best in grid</text>
    <text x="10" y="387" font-family="Arial, sans-serif" font-size="10" fill="#34495e">• Simple to implement</text>
    <text x="10" y="404" font-family="Arial, sans-serif" font-size="10" fill="#34495e">• Reproducible results</text>
    
    <text x="150" y="425" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#e74c3c">✗ Disadvantages</text>
    <text x="10" y="445" font-family="Arial, sans-serif" font-size="10" fill="#34495e">• Exponentially expensive</text>
    <text x="10" y="462" font-family="Arial, sans-serif" font-size="10" fill="#34495e">• May miss optimal values</text>
  </g>
  
  <!-- Random Search -->
  <g transform="translate(400, 80)">
    <text x="150" y="0" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#f39c12">
      Random Search
    </text>
    <text x="150" y="20" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d" font-style="italic">
      Random sampling from parameter space
    </text>
    
    <!-- Random search visualization -->
    <rect x="0" y="40" width="300" height="250" fill="white" stroke="#bdc3c7" stroke-width="2"/>
    
    <!-- Background grid (lighter) -->
    <line x1="60" y1="40" x2="60" y2="290" stroke="#ecf0f1" stroke-width="1" opacity="0.3"/>
    <line x1="120" y1="40" x2="120" y2="290" stroke="#ecf0f1" stroke-width="1" opacity="0.3"/>
    <line x1="180" y1="40" x2="180" y2="290" stroke="#ecf0f1" stroke-width="1" opacity="0.3"/>
    <line x1="240" y1="40" x2="240" y2="290" stroke="#ecf0f1" stroke-width="1" opacity="0.3"/>
    <line x1="0" y1="90" x2="300" y2="90" stroke="#ecf0f1" stroke-width="1" opacity="0.3"/>
    <line x1="0" y1="140" x2="300" y2="140" stroke="#ecf0f1" stroke-width="1" opacity="0.3"/>
    <line x1="0" y1="190" x2="300" y2="190" stroke="#ecf0f1" stroke-width="1" opacity="0.3"/>
    <line x1="0" y1="240" x2="300" y2="240" stroke="#ecf0f1" stroke-width="1" opacity="0.3"/>
    
    <!-- Random evaluation points -->
    <circle cx="45" cy="115" r="5" fill="#f39c12" opacity="0.8"/>
    <circle cx="85" cy="200" r="5" fill="#f39c12" opacity="0.8"/>
    <circle cx="135" cy="75" r="5" fill="#f39c12" opacity="0.8"/>
    <circle cx="165" cy="155" r="5" fill="#f39c12" opacity="0.8"/>
    <circle cx="95" cy="260" r="5" fill="#f39c12" opacity="0.8"/>
    <circle cx="210" cy="105" r="5" fill="#f39c12" opacity="0.8"/>
    <circle cx="175" cy="220" r="5" fill="#f39c12" opacity="0.8"/>
    <circle cx="250" cy="175" r="5" fill="#f39c12" opacity="0.8"/>
    <circle cx="55" cy="185" r="5" fill="#f39c12" opacity="0.8"/>
    <circle cx="125" cy="135" r="5" fill="#f39c12" opacity="0.8"/>
    <circle cx="225" cy="245" r="5" fill="#f39c12" opacity="0.8"/>
    <circle cx="190" cy="90" r="5" fill="#f39c12" opacity="0.8"/>
    <circle cx="270" cy="125" r="5" fill="#f39c12" opacity="0.8"/>
    <circle cx="75" cy="145" r="5" fill="#f39c12" opacity="0.8"/>
    <circle cx="155" cy="210" r="5" fill="#f39c12" opacity="0.8"/>
    <circle cx="235" cy="60" r="5" fill="#f39c12" opacity="0.8"/>
    
    <!-- Best point found -->
    <circle cx="165" cy="155" r="8" fill="none" stroke="#27ae60" stroke-width="3"/>
    <text x="165" y="180" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#27ae60" font-weight="bold">Best</text>
    
    <!-- Axis labels -->
    <text x="150" y="310" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">Hyperparameter 1</text>
    <text x="-20" y="165" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e" transform="rotate(-90, -20, 165)">Hyperparameter 2</text>
    
    <!-- Pros/Cons -->
    <rect x="0" y="330" width="300" height="140" fill="#fef5e7" stroke="#f39c12" stroke-width="2" rx="5"/>
    <text x="150" y="350" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">✓ Advantages</text>
    <text x="10" y="370" font-family="Arial, sans-serif" font-size="10" fill="#34495e">• More efficient than grid search</text>
    <text x="10" y="387" font-family="Arial, sans-serif" font-size="10" fill="#34495e">• Can find unexpected solutions</text>
    <text x="10" y="404" font-family="Arial, sans-serif" font-size="10" fill="#34495e">• Easy to parallelize</text>
    
    <text x="150" y="425" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#e74c3c">✗ Disadvantages</text>
    <text x="10" y="445" font-family="Arial, sans-serif" font-size="10" fill="#34495e">• No guarantee of optimal solution</text>
    <text x="10" y="462" font-family="Arial, sans-serif" font-size="10" fill="#34495e">• Results may vary between runs</text>
  </g>
  
  <!-- Bayesian Optimization -->
  <g transform="translate(750, 80)">
    <text x="150" y="0" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#9b59b6">
      Bayesian Optimization
    </text>
    <text x="150" y="20" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d" font-style="italic">
      Probabilistic model-guided search
    </text>
    
    <!-- Bayesian optimization visualization -->
    <rect x="0" y="40" width="300" height="250" fill="white" stroke="#bdc3c7" stroke-width="2"/>
    
    <!-- Contour lines representing acquisition function -->
    <ellipse cx="150" cy="140" rx="100" ry="70" fill="none" stroke="#e8daef" stroke-width="2" opacity="0.5"/>
    <ellipse cx="150" cy="140" rx="70" ry="50" fill="none" stroke="#d7bde2" stroke-width="2" opacity="0.6"/>
    <ellipse cx="150" cy="140" rx="40" ry="30" fill="none" stroke="#c39bd3" stroke-width="2" opacity="0.7"/>
    <ellipse cx="150" cy="140" rx="20" ry="15" fill="#9b59b6" opacity="0.3"/>
    
    <!-- Sequential evaluation points -->
    <!-- Early explorations -->
    <circle cx="70" cy="100" r="4" fill="#9b59b6" opacity="0.4"/>
    <text x="70" y="90" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#7f8c8d">1</text>
    
    <circle cx="230" cy="180" r="4" fill="#9b59b6" opacity="0.5"/>
    <text x="230" y="170" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#7f8c8d">2</text>
    
    <circle cx="100" cy="220" r="4" fill="#9b59b6" opacity="0.6"/>
    <text x="100" y="235" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#7f8c8d">3</text>
    
    <!-- Converging to optimal -->
    <circle cx="180" cy="120" r="4" fill="#9b59b6" opacity="0.7"/>
    <text x="180" y="110" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#7f8c8d">4</text>
    
    <circle cx="140" cy="160" r="4" fill="#9b59b6" opacity="0.8"/>
    <text x="140" y="175" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#7f8c8d">5</text>
    
    <circle cx="155" cy="135" r="5" fill="#9b59b6" opacity="0.9"/>
    <text x="155" y="125" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#7f8c8d">6</text>
    
    <!-- Best point -->
    <circle cx="150" cy="140" r="8" fill="none" stroke="#27ae60" stroke-width="3"/>
    <text x="150" y="165" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#27ae60" font-weight="bold">Best</text>
    
    <!-- Axis labels -->
    <text x="150" y="310" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">Hyperparameter 1</text>
    <text x="-20" y="165" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e" transform="rotate(-90, -20, 165)">Hyperparameter 2</text>
    
    <!-- Pros/Cons -->
    <rect x="0" y="330" width="300" height="140" fill="#f4ecf7" stroke="#9b59b6" stroke-width="2" rx="5"/>
    <text x="150" y="350" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">✓ Advantages</text>
    <text x="10" y="370" font-family="Arial, sans-serif" font-size="10" fill="#34495e">• Efficient for expensive functions</text>
    <text x="10" y="387" font-family="Arial, sans-serif" font-size="10" fill="#34495e">• Learns from previous evals</text>
    <text x="10" y="404" font-family="Arial, sans-serif" font-size="10" fill="#34495e">• Balances explore/exploit</text>
    
    <text x="150" y="425" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#e74c3c">✗ Disadvantages</text>
    <text x="10" y="445" font-family="Arial, sans-serif" font-size="10" fill="#34495e">• More complex to implement</text>
    <text x="10" y="462" font-family="Arial, sans-serif" font-size="10" fill="#34495e">• Overhead for simple problems</text>
  </g>
  
  <!-- Comparison Table -->
  <g transform="translate(100, 570)">
    <text x="450" y="0" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Method Comparison Summary
    </text>
    
    <rect x="0" y="20" width="900" height="230" fill="white" stroke="#95a5a6" stroke-width="2" rx="5"/>
    
    <!-- Table headers -->
    <rect x="0" y="20" width="180" height="40" fill="#34495e" rx="5 5 0 0"/>
    <rect x="180" y="20" width="180" height="40" fill="#3498db"/>
    <rect x="360" y="20" width="180" height="40" fill="#f39c12"/>
    <rect x="540" y="20" width="180" height="40" fill="#9b59b6"/>
    <rect x="720" y="20" width="180" height="40" fill="#e67e22" rx="0 5 0 0"/>
    
    <text x="90" y="47" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Criteria</text>
    <text x="270" y="47" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Grid Search</text>
    <text x="450" y="47" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Random Search</text>
    <text x="630" y="47" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Bayesian Opt.</text>
    <text x="810" y="47" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Evolutionary</text>
    
    <!-- Row 1: Efficiency -->
    <rect x="0" y="60" width="180" height="38" fill="#ecf0f1"/>
    <text x="90" y="82" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#34495e">Efficiency</text>
    
    <rect x="180" y="60" width="180" height="38" fill="white"/>
    <text x="270" y="82" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#e74c3c">Low</text>
    
    <rect x="360" y="60" width="180" height="38" fill="white"/>
    <text x="450" y="82" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#f39c12">Medium</text>
    
    <rect x="540" y="60" width="180" height="38" fill="white"/>
    <text x="630" y="82" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#27ae60">High</text>
    
    <rect x="720" y="60" width="180" height="38" fill="white"/>
    <text x="810" y="82" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#27ae60">High</text>
    
    <!-- Row 2: Coverage -->
    <rect x="0" y="98" width="180" height="38" fill="#ecf0f1"/>
    <text x="90" y="120" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#34495e">Coverage</text>
    
    <rect x="180" y="98" width="180" height="38" fill="white"/>
    <text x="270" y="120" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#27ae60">Complete</text>
    
    <rect x="360" y="98" width="180" height="38" fill="white"/>
    <text x="450" y="120" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#f39c12">Probabilistic</text>
    
    <rect x="540" y="98" width="180" height="38" fill="white"/>
    <text x="630" y="120" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#3498db">Guided</text>
    
    <rect x="720" y="98" width="180" height="38" fill="white"/>
    <text x="810" y="120" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#3498db">Adaptive</text>
    
    <!-- Row 3: Complexity -->
    <rect x="0" y="136" width="180" height="38" fill="#ecf0f1"/>
    <text x="90" y="158" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#34495e">Complexity</text>
    
    <rect x="180" y="136" width="180" height="38" fill="white"/>
    <text x="270" y="158" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#27ae60">Simple</text>
    
    <rect x="360" y="136" width="180" height="38" fill="white"/>
    <text x="450" y="158" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#27ae60">Simple</text>
    
    <rect x="540" y="136" width="180" height="38" fill="white"/>
    <text x="630" y="158" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#e74c3c">Complex</text>
    
    <rect x="720" y="136" width="180" height="38" fill="white"/>
    <text x="810" y="158" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#f39c12">Medium</text>
    
    <!-- Row 4: Best For -->
    <rect x="0" y="174" width="180" height="76" fill="#ecf0f1" rx="0 0 0 5"/>
    <text x="90" y="196" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#34495e">Best For</text>
    
    <rect x="180" y="174" width="180" height="76" fill="white"/>
    <text x="270" y="205" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">Small parameter</text>
    <text x="270" y="220" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">spaces</text>
    
    <rect x="360" y="174" width="180" height="76" fill="white"/>
    <text x="450" y="205" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">Medium parameter</text>
    <text x="450" y="220" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">spaces</text>
    
    <rect x="540" y="174" width="180" height="76" fill="white"/>
    <text x="630" y="205" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">Expensive</text>
    <text x="630" y="220" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">evaluations</text>
    
    <rect x="720" y="174" width="180" height="76" fill="white" rx="0 0 5 0"/>
    <text x="810" y="205" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">Complex</text>
    <text x="810" y="220" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">landscapes</text>
  </g>
</svg>