<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="800" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="600" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Central Limit Theorem and Error Correction
  </text>
  
  <!-- Gaussian Distribution Visualization -->
  <g transform="translate(100, 80)">
    <rect x="0" y="0" width="500" height="320" fill="#fff" stroke="#34495e" stroke-width="2" rx="8"/>
    <text x="250" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Gaussian Distribution of Errors
    </text>
    
    <!-- Axes -->
    <line x1="50" y1="280" x2="450" y2="280" stroke="#2c3e50" stroke-width="2"/>
    <line x1="250" y1="80" x2="250" y2="285" stroke="#2c3e50" stroke-width="2"/>
    
    <!-- Gaussian curve -->
    <path d="M 80,280 Q 100,260 120,220 T 160,140 T 200,100 T 250,80 T 300,100 T 340,140 T 380,220 T 420,280" 
          fill="none" stroke="#3498db" stroke-width="3"/>
    <path d="M 80,280 Q 100,260 120,220 T 160,140 T 200,100 T 250,80 T 300,100 T 340,140 T 380,220 T 420,280 L 420,280 L 80,280 Z" 
          fill="#3498db" fill-opacity="0.2"/>
    
    <!-- Labels -->
    <text x="250" y="305" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50">
      0
    </text>
    <text x="150" y="305" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">
      -σ/√n
    </text>
    <text x="350" y="305" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">
      +σ/√n
    </text>
    
    <!-- Mean line -->
    <line x1="250" y1="80" x2="250" y2="280" stroke="#e74c3c" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="260" y="95" font-family="Arial, sans-serif" font-size="12" fill="#e74c3c" font-weight="bold">
      Mean = 0
    </text>
    
    <!-- X-axis label -->
    <text x="250" y="315" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#7f8c8d" font-style="italic">
      Normalized Error
    </text>
  </g>
  
  <!-- Error Formula Section -->
  <g transform="translate(650, 80)">
    <rect x="0" y="0" width="480" height="320" fill="#fff" stroke="#34495e" stroke-width="2" rx="8"/>
    <text x="240" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Error Magnitude Analysis
    </text>
    
    <!-- Formula Box 1 -->
    <g transform="translate(20, 60)">
      <rect x="0" y="0" width="440" height="70" fill="#e8f4f8" stroke="#3498db" stroke-width="2" rx="4"/>
      <text x="220" y="25" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50" font-weight="bold">
        Normalized Error Distribution
      </text>
      <text x="220" y="50" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#2980b9" font-style="italic">
        (Estimated Score - True Score) / √n ~ N(0, σ²)
      </text>
    </g>
    
    <!-- Formula Box 2 -->
    <g transform="translate(20, 150)">
      <rect x="0" y="0" width="440" height="70" fill="#fef5e7" stroke="#f39c12" stroke-width="2" rx="4"/>
      <text x="220" y="25" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50" font-weight="bold">
        Error Variance Depends on True Score
      </text>
      <text x="220" y="50" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#e67e22" font-style="italic">
        σ² = True Score × (1 - True Score)
      </text>
    </g>
    
    <!-- Formula Box 3 -->
    <g transform="translate(20, 240)">
      <rect x="0" y="0" width="440" height="70" fill="#fdedec" stroke="#e74c3c" stroke-width="2" rx="4"/>
      <text x="220" y="25" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50" font-weight="bold">
        Worst-Case (Maximum Uncertainty)
      </text>
      <text x="220" y="50" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#c0392b" font-style="italic">
        Max Error ≈ 0.5 / √n
      </text>
    </g>
  </g>
  
  <!-- Error vs Sample Size Chart -->
  <g transform="translate(100, 450)">
    <rect x="0" y="0" width="500" height="300" fill="#fff" stroke="#34495e" stroke-width="2" rx="8"/>
    <text x="250" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Error Decreases with Sample Size
    </text>
    
    <!-- Axes -->
    <line x1="60" y1="250" x2="460" y2="250" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead2)"/>
    <line x1="60" y1="250" x2="60" y2="70" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead2)"/>
    
    <!-- Curve: 1/sqrt(x) -->
    <path d="M 60,80 Q 100,85 140,110 T 220,160 T 300,195 T 380,220 T 460,235" 
          fill="none" stroke="#e74c3c" stroke-width="3"/>
    
    <!-- Points -->
    <circle cx="100" cy="95" r="5" fill="#e74c3c"/>
    <circle cx="180" cy="135" r="5" fill="#e74c3c"/>
    <circle cx="260" cy="175" r="5" fill="#e74c3c"/>
    <circle cx="340" cy="205" r="5" fill="#e74c3c"/>
    <circle cx="420" cy="225" r="5" fill="#e74c3c"/>
    
    <!-- Point labels -->
    <text x="100" y="85" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#e74c3c">n=4</text>
    <text x="180" y="125" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#e74c3c">n=16</text>
    <text x="260" y="165" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#e74c3c">n=36</text>
    <text x="340" y="195" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#e74c3c">n=64</text>
    <text x="420" y="215" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#e74c3c">n=100</text>
    
    <!-- Axis labels -->
    <text x="260" y="275" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50">
      Number of Observations (n)
    </text>
    <text x="20" y="160" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50" transform="rotate(-90, 20, 160)">
      Error Magnitude
    </text>
    
    <!-- Formula annotation -->
    <text x="350" y="130" font-family="Arial, sans-serif" font-size="15" fill="#e74c3c" font-weight="bold" font-style="italic">
      Error ∝ 1/√n
    </text>
  </g>
  
  <!-- Correction Strategy Box -->
  <g transform="translate(650, 450)">
    <rect x="0" y="0" width="480" height="300" fill="#fff" stroke="#34495e" stroke-width="2" rx="8"/>
    <text x="240" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Correction Strategy
    </text>
    
    <!-- Confidence Interval -->
    <g transform="translate(40, 60)">
      <rect x="0" y="0" width="400" height="80" fill="#e8f8f5" stroke="#27ae60" stroke-width="2" rx="4"/>
      <text x="200" y="25" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50" font-weight="bold">
        Confidence Interval for True Score
      </text>
      <text x="200" y="50" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#27ae60">
        Estimated ± C/√n
      </text>
      <text x="200" y="68" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d" font-style="italic">
        where C is chosen based on desired confidence
      </text>
    </g>
    
    <!-- Conservative Approach -->
    <g transform="translate(40, 160)">
      <rect x="0" y="0" width="400" height="60" fill="#fef9e7" stroke="#f39c12" stroke-width="2" rx="4"/>
      <text x="200" y="25" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50" font-weight="bold">
        Conservative: Lower Bound
      </text>
      <text x="200" y="47" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#e67e22" font-style="italic">
        Adjusted Score = Avg - C/√n
      </text>
    </g>
    
    <!-- Optimistic Approach -->
    <g transform="translate(40, 240)">
      <rect x="0" y="0" width="400" height="60" fill="#ebf5fb" stroke="#3498db" stroke-width="2" rx="4"/>
      <text x="200" y="25" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50" font-weight="bold">
        Optimistic: Upper Bound
      </text>
      <text x="200" y="47" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#2980b9" font-style="italic">
        Adjusted Score = Avg + C/√n
      </text>
    </g>
  </g>
  
  <!-- Karl Gauss Attribution -->
  <g transform="translate(450, 765)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d" font-style="italic">
      Named after Karl Friedrich Gauss (1777-1855) - "Princeps mathematicorum"
    </text>
  </g>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#2c3e50"/>
    </marker>
  </defs>
</svg>