<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    Type I and Type II Statistical Errors
  </text>
  
  <!-- Truth table -->
  <rect x="150" y="80" width="500" height="280" fill="white" stroke="#333" stroke-width="2"/>
  
  <!-- Column headers -->
  <rect x="150" y="80" width="125" height="50" fill="#e3f2fd" stroke="#333" stroke-width="1"/>
  <text x="212" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1976d2">
    Reality/Decision
  </text>
  
  <rect x="275" y="80" width="187" height="50" fill="#fff3e0" stroke="#333" stroke-width="1"/>
  <text x="368" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f57c00">
    Reject H₀
  </text>
  <text x="368" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#f57c00">
    (Find Significant Effect)
  </text>
  
  <rect x="462" y="80" width="188" height="50" fill="#f3e5f5" stroke="#333" stroke-width="1"/>
  <text x="556" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#9c27b0">
    Fail to Reject H₀
  </text>
  <text x="556" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#9c27b0">
    (No Significant Effect)
  </text>
  
  <!-- Row headers -->
  <rect x="150" y="130" width="125" height="115" fill="#e8f5e8" stroke="#333" stroke-width="1"/>
  <text x="212" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2e7d32">
    H₀ True
  </text>
  <text x="212" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2e7d32">
    (No real effect
  </text>
  <text x="212" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2e7d32">
    in population)
  </text>
  
  <rect x="150" y="245" width="125" height="115" fill="#ffebee" stroke="#333" stroke-width="1"/>
  <text x="212" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#d32f2f">
    H₀ False
  </text>
  <text x="212" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#d32f2f">
    (Real effect
  </text>
  <text x="212" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#d32f2f">
    exists in
  </text>
  <text x="212" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#d32f2f">
    population)
  </text>
  
  <!-- Type I Error cell -->
  <rect x="275" y="130" width="187" height="115" fill="#ffcdd2" stroke="#333" stroke-width="1"/>
  <text x="368" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#c62828">
    TYPE I ERROR
  </text>
  <text x="368" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#c62828">
    False Positive
  </text>
  <text x="368" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#c62828">
    Probability = α
  </text>
  <text x="368" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#c62828">
    Claiming effect exists
  </text>
  <text x="368" y="228" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#c62828">
    when it doesn't
  </text>
  
  <!-- Correct Decision (H₀ true, fail to reject) -->
  <rect x="462" y="130" width="188" height="115" fill="#c8e6c9" stroke="#333" stroke-width="1"/>
  <text x="556" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2e7d32">
    CORRECT
  </text>
  <text x="556" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2e7d32">
    True Negative
  </text>
  <text x="556" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2e7d32">
    Probability = 1-α
  </text>
  <text x="556" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2e7d32">
    Correctly concluding
  </text>
  <text x="556" y="228" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2e7d32">
    no effect
  </text>
  
  <!-- Correct Decision (H₀ false, reject) -->
  <rect x="275" y="245" width="187" height="115" fill="#c8e6c9" stroke="#333" stroke-width="1"/>
  <text x="368" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2e7d32">
    CORRECT
  </text>
  <text x="368" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2e7d32">
    True Positive
  </text>
  <text x="368" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2e7d32">
    Probability = 1-β
  </text>
  <text x="368" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2e7d32">
    (POWER)
  </text>
  <text x="368" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2e7d32">
    Correctly detecting effect
  </text>
  
  <!-- Type II Error cell -->
  <rect x="462" y="245" width="188" height="115" fill="#ffcdd2" stroke="#333" stroke-width="1"/>
  <text x="556" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#c62828">
    TYPE II ERROR
  </text>
  <text x="556" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#c62828">
    False Negative
  </text>
  <text x="556" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#c62828">
    Probability = β
  </text>
  <text x="556" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#c62828">
    Missing real effect
  </text>
  <text x="556" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#c62828">
    (false negative)
  </text>
  
  <!-- Error examples -->
  <rect x="50" y="390" width="330" height="140" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="8"/>
  <text x="215" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#f57c00">
    🚨 Type I Error Examples
  </text>
  <text x="70" y="435" font-family="Arial, sans-serif" font-size="12" fill="#333">
    • Medical: False positive test result
  </text>
  <text x="70" y="450" font-family="Arial, sans-serif" font-size="12" fill="#333">
    • Legal: Convicting innocent person
  </text>
  <text x="70" y="465" font-family="Arial, sans-serif" font-size="12" fill="#333">
    • Research: Claiming drug works when it doesn't
  </text>
  <text x="70" y="480" font-family="Arial, sans-serif" font-size="12" fill="#333">
    • Quality: Rejecting good product
  </text>
  <text x="70" y="500" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f57c00">
    Control: Set lower α (e.g., 0.01 instead of 0.05)
  </text>
  <text x="70" y="515" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f57c00">
    Trade-off: Higher chance of Type II errors
  </text>
  
  <rect x="420" y="390" width="330" height="140" fill="#e8f5e8" stroke="#4caf50" stroke-width="2" rx="8"/>
  <text x="585" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2e7d32">
    🔍 Type II Error Examples
  </text>
  <text x="440" y="435" font-family="Arial, sans-serif" font-size="12" fill="#333">
    • Medical: Missing disease (false negative)
  </text>
  <text x="440" y="450" font-family="Arial, sans-serif" font-size="12" fill="#333">
    • Legal: Letting guilty person go free
  </text>
  <text x="440" y="465" font-family="Arial, sans-serif" font-size="12" fill="#333">
    • Research: Missing effective treatment
  </text>
  <text x="440" y="480" font-family="Arial, sans-serif" font-size="12" fill="#333">
    • Quality: Accepting defective product
  </text>
  <text x="440" y="500" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2e7d32">
    Control: Increase sample size, improve design
  </text>
  <text x="440" y="515" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2e7d32">
    Trade-off: Higher cost, more resources
  </text>
  
  <!-- Key relationships -->
  <rect x="250" y="550" width="300" height="40" fill="#f5f5f5" stroke="#757575" stroke-width="1" rx="5"/>
  <text x="400" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#424242">
    Key: α + β relationship is inversely related
  </text>
  <text x="400" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">
    Reducing one type of error typically increases the other
  </text>
</svg>