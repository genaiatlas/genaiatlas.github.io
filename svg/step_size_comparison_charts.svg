<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <linearGradient id="gridGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f5f5"/>
      <stop offset="100%" style="stop-color:#e0e0e0"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#fafafa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1565c0">
    Loss Curves for Different Step Sizes
  </text>
  
  <!-- Chart Background -->
  <rect x="80" y="60" width="640" height="400" fill="white" stroke="#ddd" stroke-width="1"/>
  
  <!-- Grid Lines -->
  <g id="grid" stroke="#e0e0e0" stroke-width="1" opacity="0.5">
    <!-- Vertical grid lines -->
    <line x1="144" y1="60" x2="144" y2="460"/>
    <line x1="208" y1="60" x2="208" y2="460"/>
    <line x1="272" y1="60" x2="272" y2="460"/>
    <line x1="336" y1="60" x2="336" y2="460"/>
    <line x1="400" y1="60" x2="400" y2="460"/>
    <line x1="464" y1="60" x2="464" y2="460"/>
    <line x1="528" y1="60" x2="528" y2="460"/>
    <line x1="592" y1="60" x2="592" y2="460"/>
    <line x1="656" y1="60" x2="656" y2="460"/>
    
    <!-- Horizontal grid lines -->
    <line x1="80" y1="120" x2="720" y2="120"/>
    <line x1="80" y1="180" x2="720" y2="180"/>
    <line x1="80" y1="240" x2="720" y2="240"/>
    <line x1="80" y1="300" x2="720" y2="300"/>
    <line x1="80" y1="360" x2="720" y2="360"/>
    <line x1="80" y1="420" x2="720" y2="420"/>
  </g>
  
  <!-- Axes -->
  <line x1="80" y1="460" x2="720" y2="460" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="80" y1="460" x2="80" y2="60" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Axis Labels -->
  <text x="400" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#333" font-weight="bold">Epochs</text>
  <text x="30" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#333" font-weight="bold" transform="rotate(-90, 30, 260)">Loss</text>
  
  <!-- Epoch Labels -->
  <text x="80" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">0</text>
  <text x="144" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">5</text>
  <text x="208" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">10</text>
  <text x="272" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">15</text>
  <text x="336" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">20</text>
  <text x="400" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">25</text>
  <text x="464" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">30</text>
  
  <!-- Loss Labels -->
  <text x="75" y="460" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#666">0.0</text>
  <text x="75" y="420" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#666">0.2</text>
  <text x="75" y="360" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#666">0.4</text>
  <text x="75" y="300" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#666">0.6</text>
  <text x="75" y="240" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#666">0.8</text>
  <text x="75" y="180" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#666">1.0</text>
  <text x="75" y="120" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#666">1.2</text>
  
  <!-- Loss Curves -->
  
  <!-- Blue Line (η = 0.025) - Very slow convergence -->
  <path d="M 80 140 L 92 135 L 104 131 L 116 128 L 128 125 L 140 122 L 152 120 L 164 118 L 176 116 L 188 115 L 200 114 L 212 113 L 224 112 L 236 111 L 248 110 L 260 109 L 272 108 L 284 107 L 296 106 L 308 105 L 320 104 L 332 103 L 344 102 L 356 101 L 368 100 L 380 99 L 392 98 L 404 97 L 416 96 L 428 95 L 440 94 L 452 93 L 464 92" 
        stroke="#1976d2" stroke-width="3" fill="none"/>
  
  <!-- Yellow Line (η = 0.25) - Optimal convergence -->
  <path d="M 80 200 L 92 160 L 104 130 L 116 110 L 128 95 L 140 85 L 152 78 L 164 74 L 176 71 L 188 69 L 200 68 L 212 67 L 224 66 L 236 65 L 248 65 L 260 64 L 272 64 L 284 64 L 296 63 L 308 63 L 320 63 L 332 63 L 344 63 L 356 63 L 368 62 L 380 62 L 392 62 L 404 62 L 416 62 L 428 62 L 440 62 L 452 62 L 464 62" 
        stroke="#ffa000" stroke-width="3" fill="none"/>
  
  <!-- Red Line (η = 2.5) - Oscillating, no convergence -->
  <path d="M 80 160 L 92 180 L 104 140 L 116 190 L 128 130 L 140 200 L 152 120 L 164 210 L 176 110 L 188 190 L 200 130 L 212 180 L 224 140 L 236 170 L 248 150 L 260 160 L 272 155 L 284 165 L 296 145 L 308 175 L 320 135 L 332 185 L 344 125 L 356 195 L 368 115 L 380 205 L 392 105 L 404 185 L 416 135 L 428 175 L 440 145 L 452 165 L 464 155" 
        stroke="#d32f2f" stroke-width="3" fill="none"/>
  
  <!-- Data Points -->
  <!-- Blue points -->
  <circle cx="80" cy="140" r="3" fill="#1976d2"/>
  <circle cx="144" cy="122" r="3" fill="#1976d2"/>
  <circle cx="208" cy="114" r="3" fill="#1976d2"/>
  <circle cx="272" cy="108" r="3" fill="#1976d2"/>
  <circle cx="336" cy="103" r="3" fill="#1976d2"/>
  <circle cx="400" cy="99" r="3" fill="#1976d2"/>
  <circle cx="464" cy="92" r="3" fill="#1976d2"/>
  
  <!-- Yellow points -->
  <circle cx="80" cy="200" r="3" fill="#ffa000"/>
  <circle cx="144" cy="85" r="3" fill="#ffa000"/>
  <circle cx="208" cy="68" r="3" fill="#ffa000"/>
  <circle cx="272" cy="64" r="3" fill="#ffa000"/>
  <circle cx="336" cy="63" r="3" fill="#ffa000"/>
  <circle cx="400" cy="62" r="3" fill="#ffa000"/>
  <circle cx="464" cy="62" r="3" fill="#ffa000"/>
  
  <!-- Red points -->
  <circle cx="80" cy="160" r="3" fill="#d32f2f"/>
  <circle cx="144" cy="200" r="3" fill="#d32f2f"/>
  <circle cx="208" cy="130" r="3" fill="#d32f2f"/>
  <circle cx="272" cy="155" r="3" fill="#d32f2f"/>
  <circle cx="336" cy="135" r="3" fill="#d32f2f"/>
  <circle cx="400" cy="185" r="3" fill="#d32f2f"/>
  <circle cx="464" cy="155" r="3" fill="#d32f2f"/>
  
  <!-- Legend -->
  <rect x="500" y="80" width="200" height="90" fill="white" stroke="#ddd" stroke-width="1" rx="5"/>
  <text x="510" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Learning Rates:</text>
  
  <!-- Legend items -->
  <line x1="515" y1="115" x2="535" y2="115" stroke="#1976d2" stroke-width="3"/>
  <circle cx="525" cy="115" r="3" fill="#1976d2"/>
  <text x="545" y="120" font-family="Arial, sans-serif" font-size="12" fill="#1976d2">η = 0.025 (Too Small)</text>
  
  <line x1="515" y1="135" x2="535" y2="135" stroke="#ffa000" stroke-width="3"/>
  <circle cx="525" cy="135" r="3" fill="#ffa000"/>
  <text x="545" y="140" font-family="Arial, sans-serif" font-size="12" fill="#ffa000">η = 0.25 (Optimal)</text>
  
  <line x1="515" y1="155" x2="535" y2="155" stroke="#d32f2f" stroke-width="3"/>
  <circle cx="525" cy="155" r="3" fill="#d32f2f"/>
  <text x="545" y="160" font-family="Arial, sans-serif" font-size="12" fill="#d32f2f">η = 2.5 (Too Large)</text>
  
  <!-- Analysis Boxes -->
  <rect x="80" y="510" width="200" height="80" fill="#e3f2fd" stroke="#1976d2" stroke-width="1" rx="5"/>
  <text x="90" y="530" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1976d2">Small Step Size</text>
  <text x="90" y="545" font-family="Arial, sans-serif" font-size="10" fill="#333">✓ Stable convergence</text>
  <text x="90" y="560" font-family="Arial, sans-serif" font-size="10" fill="#333">✗ Very slow progress</text>
  <text x="90" y="575" font-family="Arial, sans-serif" font-size="10" fill="#333">✗ High computational cost</text>
  
  <rect x="300" y="510" width="200" height="80" fill="#fff8e1" stroke="#ffa000" stroke-width="1" rx="5"/>
  <text x="310" y="530" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffa000">Optimal Step Size</text>
  <text x="310" y="545" font-family="Arial, sans-serif" font-size="10" fill="#333">✓ Fast convergence</text>
  <text x="310" y="560" font-family="Arial, sans-serif" font-size="10" fill="#333">✓ Stable training</text>
  <text x="310" y="575" font-family="Arial, sans-serif" font-size="10" fill="#333">✓ Efficient training</text>
  
  <rect x="520" y="510" width="200" height="80" fill="#ffebee" stroke="#d32f2f" stroke-width="1" rx="5"/>
  <text x="530" y="530" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#d32f2f">Large Step Size</text>
  <text x="530" y="545" font-family="Arial, sans-serif" font-size="10" fill="#333">✗ Oscillating loss</text>
  <text x="530" y="560" font-family="Arial, sans-serif" font-size="10" fill="#333">✗ No convergence</text>
  <text x="530" y="575" font-family="Arial, sans-serif" font-size="10" fill="#333">✗ Training instability</text>
</svg>