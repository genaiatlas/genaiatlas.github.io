<svg viewBox="0 0 1400 950" xmlns="http://www.w3.org/2000/svg">
  <rect width="1400" height="950" fill="#f8f9fa"/>
  <text x="700" y="40" font-family="Arial" font-size="28" font-weight="bold" text-anchor="middle">RAG-Fusion with Reciprocal Rank Fusion</text>
  
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" fill="#495057"/></marker></defs>
  
  <rect x="400" y="80" width="600" height="60" rx="10" fill="#fff3bf" stroke="#f59f00" stroke-width="3"/>
  <text x="700" y="118" font-family="Arial" font-size="13" text-anchor="middle" font-style="italic">"What are the effects of climate change?"</text>
  
  <line x1="700" y1="140" x2="700" y2="165" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  
  <rect x="300" y="175" width="800" height="60" rx="10" fill="#9333ea" stroke="#7950f2" stroke-width="3"/>
  <text x="700" y="210" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Generate 4 Query Variations</text>
  
  <g id="queries">
    <rect x="50" y="260" width="280" height="70" rx="5" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
    <text x="190" y="285" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">Q1</text>
    <text x="65" y="305" font-family="Arial" font-size="9">"How does climate change</text>
    <text x="65" y="320" font-family="Arial" font-size="9">impact ecosystems?"</text>
    
    <rect x="360" y="260" width="280" height="70" rx="5" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
    <text x="500" y="285" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">Q2</text>
    <text x="375" y="305" font-family="Arial" font-size="9">"Environmental consequences</text>
    <text x="375" y="320" font-family="Arial" font-size="9">of global warming?"</text>
    
    <rect x="670" y="260" width="280" height="70" rx="5" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
    <text x="810" y="285" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">Q3</text>
    <text x="685" y="305" font-family="Arial" font-size="9">"Climate change effects on</text>
    <text x="685" y="320" font-family="Arial" font-size="9">weather patterns?"</text>
    
    <rect x="980" y="260" width="280" height="70" rx="5" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
    <text x="1120" y="285" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">Q4</text>
    <text x="995" y="305" font-family="Arial" font-size="9">"Impact of rising temperatures</text>
    <text x="995" y="320" font-family="Arial" font-size="9">on planet?"</text>
  </g>
  
  <text x="700" y="360" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#495057">↓ Parallel Retrieval ↓</text>
  
  <g id="results">
    <rect x="50" y="380" width="280" height="90" rx="5" fill="#d3f9d8" stroke="#37b24d" stroke-width="2"/>
    <text x="190" y="405" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle">Results Q1</text>
    <text x="65" y="425" font-family="Courier" font-size="8">1. Doc A</text>
    <text x="65" y="440" font-family="Courier" font-size="8">2. Doc B</text>
    <text x="65" y="455" font-family="Courier" font-size="8">3. Doc C</text>
    
    <rect x="360" y="380" width="280" height="90" rx="5" fill="#d3f9d8" stroke="#37b24d" stroke-width="2"/>
    <text x="500" y="405" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle">Results Q2</text>
    <text x="375" y="425" font-family="Courier" font-size="8">1. Doc B</text>
    <text x="375" y="440" font-family="Courier" font-size="8">2. Doc D</text>
    <text x="375" y="455" font-family="Courier" font-size="8">3. Doc A</text>
    
    <rect x="670" y="380" width="280" height="90" rx="5" fill="#d3f9d8" stroke="#37b24d" stroke-width="2"/>
    <text x="810" y="405" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle">Results Q3</text>
    <text x="685" y="425" font-family="Courier" font-size="8">1. Doc A</text>
    <text x="685" y="440" font-family="Courier" font-size="8">2. Doc C</text>
    <text x="685" y="455" font-family="Courier" font-size="8">3. Doc E</text>
    
    <rect x="980" y="380" width="280" height="90" rx="5" fill="#d3f9d8" stroke="#37b24d" stroke-width="2"/>
    <text x="1120" y="405" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle">Results Q4</text>
    <text x="995" y="425" font-family="Courier" font-size="8">1. Doc C</text>
    <text x="995" y="440" font-family="Courier" font-size="8">2. Doc A</text>
    <text x="995" y="455" font-family="Courier" font-size="8">3. Doc F</text>
  </g>
  
  <line x1="700" y1="470" x2="700" y2="505" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  
  <rect x="200" y="515" width="1000" height="220" rx="10" fill="#ffdeeb" stroke="#e64980" stroke-width="3"/>
  <text x="700" y="545" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Reciprocal Rank Fusion (RRF)</text>
  <rect x="230" y="560" width="940" height="160" rx="5" fill="#fff" stroke="#e64980" stroke-width="2"/>
  <text x="700" y="585" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">RRF Formula: score(doc) = Σ(1 / (k + rank))</text>
  <text x="250" y="610" font-family="Courier" font-size="10">Doc A: 1/(60+1) + 1/(60+3) + 1/(60+1) + 1/(60+2) = 0.0487</text>
  <text x="250" y="630" font-family="Courier" font-size="10">Doc B: 1/(60+2) + 1/(60+1) = 0.0325</text>
  <text x="250" y="650" font-family="Courier" font-size="10">Doc C: 1/(60+3) + 1/(60+2) + 1/(60+1) = 0.0484</text>
  <text x="250" y="670" font-family="Courier" font-size="10">Doc D: 1/(60+2) = 0.0161</text>
  <text x="250" y="690" font-family="Courier" font-size="10">Doc E: 1/(60+3) = 0.0159</text>
  <text x="250" y="710" font-family="Courier" font-size="10">Doc F: 1/(60+3) = 0.0159</text>
  
  <line x1="700" y1="735" x2="700" y2="770" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  
  <rect x="250" y="780" width="900" height="140" rx="10" fill="#51cf66" stroke="#2f9e44" stroke-width="3"/>
  <text x="700" y="810" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Final Ranked Documents</text>
  <text x="700" y="835" font-family="Arial" font-size="13" text-anchor="middle" fill="white">Ranking: A (0.0487) > C (0.0484) > B (0.0325) > D, E, F</text>
  <rect x="280" y="850" width="840" height="55" rx="5" fill="#fff" stroke="#2f9e44" stroke-width="2"/>
  <text x="300" y="872" font-family="Arial" font-size="10" fill="#495057">✓ Documents appearing in multiple queries rank higher (A, B, C)</text>
  <text x="300" y="890" font-family="Arial" font-size="10" fill="#495057">✓ No score normalization needed - works with varying result lists</text>
</svg>