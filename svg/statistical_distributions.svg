<svg width="900" height="700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #333; }
      .subtitle { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #333; }
      .label { font-family: Arial, sans-serif; font-size: 12px; fill: #333; }
      .small-label { font-family: Arial, sans-serif; font-size: 10px; fill: #333; }
      .equation { font-family: Arial, sans-serif; font-size: 11px; fill: #333; }
      .axis { stroke: #333; stroke-width: 2; }
      .grid { stroke: #ddd; stroke-width: 0.5; }
      .normal-curve { stroke: #2196f3; stroke-width: 3; fill: rgba(33, 150, 243, 0.1); }
      .variance-area { fill: rgba(255, 152, 0, 0.3); stroke: #ff9800; stroke-width: 2; }
      .mean-line { stroke: #f44336; stroke-width: 3; stroke-dasharray: 5,5; }
      .std-line { stroke: #4caf50; stroke-width: 2; stroke-dasharray: 3,3; }
      .confidence-area { fill: rgba(156, 39, 176, 0.2); stroke: #9c27b0; stroke-width: 2; }
      .example-box { fill: #f8f9fa; stroke: #dee2e6; stroke-width: 1; rx: 5; }
    </style>
  </defs>
  
  <!-- Title -->
  <text x="450" y="25" text-anchor="middle" class="title">Statistical Distributions and Key Concepts</text>
  
  <!-- Normal Distribution -->
  <g transform="translate(50, 50)">
    <text x="300" y="0" text-anchor="middle" class="subtitle">Normal Distribution</text>
    
    <!-- Main distribution -->
    <g transform="translate(50, 30)">
      <!-- Axes -->
      <line x1="0" y1="200" x2="500" y2="200" class="axis" />
      <line x1="250" y1="200" x2="250" y2="20" class="axis" />
      
      <!-- Grid -->
      <g class="grid">
        <line x1="50" y1="20" x2="50" y2="200" />
        <line x1="100" y1="20" x2="100" y2="200" />
        <line x1="150" y1="20" x2="150" y2="200" />
        <line x1="200" y1="20" x2="200" y2="200" />
        <line x1="300" y1="20" x2="300" y2="200" />
        <line x1="350" y1="20" x2="350" y2="200" />
        <line x1="400" y1="20" x2="400" y2="200" />
        <line x1="450" y1="20" x2="450" y2="200" />
      </g>
      
      <!-- Normal curve -->
      <path d="M 50 195 Q 100 180 150 120 Q 200 60 250 30 Q 300 60 350 120 Q 400 180 450 195" 
            class="normal-curve" />
      
      <!-- Mean line -->
      <line x1="250" y1="30" x2="250" y2="200" class="mean-line" />
      <text x="255" y="25" class="label" fill="#f44336">μ (Mean)</text>
      
      <!-- Standard deviation markers -->
      <line x1="150" y1="120" x2="150" y2="200" class="std-line" />
      <line x1="350" y1="120" x2="350" y2="200" class="std-line" />
      <text x="155" y="115" class="small-label" fill="#4caf50">μ-σ</text>
      <text x="355" y="115" class="small-label" fill="#4caf50">μ+σ</text>
      
      <!-- 68% area -->
      <path d="M 150 120 Q 200 60 250 30 Q 300 60 350 120 L 350 200 L 150 200 Z" 
            class="confidence-area" />
      <text x="250" y="150" text-anchor="middle" class="small-label" fill="#9c27b0">68% of data</text>
      
      <!-- Axis labels -->
      <text x="250" y="220" text-anchor="middle" class="label">Value</text>
      <text x="20" y="110" text-anchor="middle" class="label" transform="rotate(-90 20 110)">Probability Density</text>
      
      <!-- Scale labels -->
      <text x="50" y="215" text-anchor="middle" class="small-label">μ-4σ</text>
      <text x="100" y="215" text-anchor="middle" class="small-label">μ-3σ</text>
      <text x="150" y="215" text-anchor="middle" class="small-label">μ-σ</text>
      <text x="250" y="215" text-anchor="middle" class="small-label">μ</text>
      <text x="350" y="215" text-anchor="middle" class="small-label">μ+σ</text>
      <text x="400" y="215" text-anchor="middle" class="small-label">μ+3σ</text>
      <text x="450" y="215" text-anchor="middle" class="small-label">μ+4σ</text>
    </g>
    
    <!-- Distribution properties -->
    <g transform="translate(560, 30)">
      <rect x="0" y="0" width="180" height="180" class="example-box" />
      <text x="90" y="18" text-anchor="middle" class="label" font-weight="bold">Properties</text>
      
      <text x="15" y="35" class="small-label">• Symmetric about mean</text>
      <text x="15" y="48" class="small-label">• Bell-shaped curve</text>
      <text x="15" y="61" class="small-label">• Mean = Median = Mode</text>
      <text x="15" y="74" class="small-label">• 68% within 1σ of μ</text>
      <text x="15" y="87" class="small-label">• 95% within 2σ of μ</text>
      <text x="15" y="100" class="small-label">• 99.7% within 3σ of μ</text>
      
      <text x="15" y="120" class="small-label" font-weight="bold">Formula:</text>
      <text x="15" y="135" class="equation">f(x) = (1/σ√(2π))e^(-½((x-μ)/σ)²)</text>
      
      <text x="15" y="155" class="small-label">μ = mean</text>
      <text x="15" y="168" class="small-label">σ = standard deviation</text>
    </g>
  </g>
  
  <!-- Variance and Standard Deviation Visualization -->
  <g transform="translate(50, 300)">
    <text x="300" y="0" text-anchor="middle" class="subtitle">Variance vs Standard Deviation</text>
    
    <!-- Low variance distribution -->
    <g transform="translate(50, 25)">
      <text x="80" y="0" text-anchor="middle" class="label">Low Variance (σ² = 4, σ = 2)</text>
      
      <!-- Axes -->
      <line x1="0" y1="100" x2="160" y2="100" class="axis" />
      <line x1="80" y1="100" x2="80" y2="20" class="axis" />
      
      <!-- Narrow distribution -->
      <path d="M 50 95 Q 65 50 80 25 Q 95 50 110 95" class="normal-curve" />
      
      <!-- Mean and std markers -->
      <line x1="80" y1="25" x2="80" y2="100" class="mean-line" />
      <line x1="60" y1="65" x2="60" y2="100" class="std-line" />
      <line x1="100" y1="65" x2="100" y2="100" class="std-line" />
      
      <text x="80" y="120" text-anchor="middle" class="small-label">Data clustered near mean</text>
    </g>
    
    <!-- High variance distribution -->
    <g transform="translate(270, 25)">
      <text x="80" y="0" text-anchor="middle" class="label">High Variance (σ² = 16, σ = 4)</text>
      
      <!-- Axes -->
      <line x1="0" y1="100" x2="160" y2="100" class="axis" />
      <line x1="80" y1="100" x2="80" y2="20" class="axis" />
      
      <!-- Wide distribution -->
      <path d="M 20 95 Q 50 75 80 60 Q 110 75 140 95" class="normal-curve" />
      
      <!-- Mean and std markers -->
      <line x1="80" y1="60" x2="80" y2="100" class="mean-line" />
      <line x1="40" y1="85" x2="40" y2="100" class="std-line" />
      <line x1="120" y1="85" x2="120" y2="100" class="std-line" />
      
      <text x="80" y="120" text-anchor="middle" class="small-label">Data spread from mean</text>
    </g>
    
    <!-- Equations -->
    <g transform="translate(520, 25)">
      <rect x="0" y="0" width="200" height="100" class="example-box" />
      <text x="100" y="18" text-anchor="middle" class="label" font-weight="bold">Formulas</text>
      
      <text x="15" y="35" class="equation" font-weight="bold">Variance (σ²):</text>
      <text x="15" y="48" class="equation">σ² = Σ(xᵢ - μ)² / N</text>
      
      <text x="15" y="65" class="equation" font-weight="bold">Standard Deviation (σ):</text>
      <text x="15" y="78" class="equation">σ = √(σ²)</text>
      
      <text x="15" y="95" class="small-label">Same units as original data</text>
    </g>
  </g>
  
  <!-- Confidence Intervals -->
  <g transform="translate(50, 460)">
    <text x="250" y="0" text-anchor="middle" class="subtitle">Confidence Intervals</text>
    
    <!-- Confidence interval visualization -->
    <g transform="translate(50, 25)">
      <!-- Sample means distribution -->
      <line x1="0" y1="60" x2="300" y2="60" class="axis" />
      <line x1="150" y1="60" x2="150" y2="20" class="axis" />
      
      <!-- Distribution of sample means -->
      <path d="M 50 55 Q 100 30 150 25 Q 200 30 250 55" class="normal-curve" />
      
      <!-- True population mean -->
      <line x1="150" y1="25" x2="150" y2="60" class="mean-line" />
      <text x="155" y="20" class="small-label" fill="#f44336">True μ</text>
      
      <!-- Confidence intervals for different samples -->
      <g transform="translate(0, 80)">
        <!-- Sample 1 CI -->
        <line x1="130" y1="15" x2="170" y2="15" stroke="#4caf50" stroke-width="3" />
        <circle cx="150" cy="15" r="2" fill="#4caf50" />
        <text x="175" y="18" class="small-label">Sample 1 CI (contains μ)</text>
        
        <!-- Sample 2 CI -->
        <line x1="135" y1="30" x2="175" y2="30" stroke="#4caf50" stroke-width="3" />
        <circle cx="155" cy="30" r="2" fill="#4caf50" />
        <text x="180" y="33" class="small-label">Sample 2 CI (contains μ)</text>
        
        <!-- Sample 3 CI (doesn't contain true mean) -->
        <line x1="100" y1="45" x2="140" y2="45" stroke="#f44336" stroke-width="3" />
        <circle cx="120" cy="45" r="2" fill="#f44336" />
        <text x="145" y="48" class="small-label">Sample 3 CI (misses μ)</text>
        
        <!-- Sample 4 CI -->
        <line x1="125" y1="60" x2="165" y2="60" stroke="#4caf50" stroke-width="3" />
        <circle cx="145" cy="60" r="2" fill="#4caf50" />
        <text x="170" y="63" class="small-label">Sample 4 CI (contains μ)</text>
      </g>
      
      <text x="150" y="175" text-anchor="middle" class="small-label">95% of CIs contain the true parameter</text>
    </g>
    
    <!-- CI interpretation -->
    <g transform="translate(400, 25)">
      <rect x="0" y="0" width="250" height="120" class="example-box" />
      <text x="125" y="18" text-anchor="middle" class="label" font-weight="bold">CI Interpretation</text>
      
      <text x="15" y="35" class="small-label" font-weight="bold">95% Confidence Interval:</text>
      <text x="15" y="48" class="small-label">"If we repeated this process</text>
      <text x="15" y="60" class="small-label">100 times, 95 intervals would</text>
      <text x="15" y="72" class="small-label">contain the true parameter."</text>
      
      <text x="15" y="90" class="small-label" font-weight="bold">Common Misconception:</text>
      <text x="15" y="102" class="small-label">"95% chance true value in THIS interval"</text>
      <text x="15" y="114" class="small-label" fill="#f44336">❌ Incorrect</text>
    </g>
  </g>
</svg>