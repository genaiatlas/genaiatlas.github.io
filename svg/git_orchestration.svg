<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="800" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="600" y="40" font-size="24" font-weight="bold" text-anchor="middle" fill="#1a1a2e">
    Git &amp; GitHub Orchestration with AI
  </text>
  
  <!-- Developer -->
  <g transform="translate(50, 120)">
    <circle cx="60" cy="60" r="50" fill="#4a90e2" opacity="0.2"/>
    <circle cx="60" cy="60" r="40" fill="#4a90e2"/>
    <text x="60" y="70" font-size="16" font-weight="bold" text-anchor="middle" fill="white">DEV</text>
    <text x="60" y="150" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a2e">Developer</text>
  </g>
  
  <!-- AI Agent -->
  <g transform="translate(50, 360)">
    <rect x="0" y="0" width="160" height="180" rx="12" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3"/>
    <text x="80" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a1a2e">AI Agent</text>
    
    <text x="80" y="60" font-size="12" font-weight="bold" text-anchor="middle" fill="#555">Capabilities:</text>
    <text x="80" y="82" font-size="11" text-anchor="middle" fill="#555">• Git operations</text>
    <text x="80" y="100" font-size="11" text-anchor="middle" fill="#555">• GitHub CLI (gh)</text>
    <text x="80" y="118" font-size="11" text-anchor="middle" fill="#555">• Log analysis</text>
    <text x="80" y="136" font-size="11" text-anchor="middle" fill="#555">• Auto-fixing</text>
    <text x="80" y="154" font-size="11" text-anchor="middle" fill="#555">• PR management</text>
  </g>
  
  <!-- Git Operations -->
  <g transform="translate(350, 100)">
    <rect x="0" y="0" width="260" height="220" rx="10" fill="#fff5e6" stroke="#ff9800" stroke-width="2"/>
    <text x="130" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a1a2e">Git Operations</text>
    
    <!-- Commits -->
    <g transform="translate(20, 50)">
      <rect x="0" y="0" width="220" height="40" rx="5" fill="#fff" stroke="#ff9800" stroke-width="1"/>
      <text x="10" y="18" font-size="12" font-weight="bold" fill="#1a1a2e">Commits</text>
      <text x="10" y="32" font-size="10" fill="#555">Generate conventional messages</text>
    </g>
    
    <!-- Branches -->
    <g transform="translate(20, 100)">
      <rect x="0" y="0" width="220" height="40" rx="5" fill="#fff" stroke="#ff9800" stroke-width="1"/>
      <text x="10" y="18" font-size="12" font-weight="bold" fill="#1a1a2e">Branches</text>
      <text x="10" y="32" font-size="10" fill="#555">Create, merge, sync with main</text>
    </g>
    
    <!-- Rebases -->
    <g transform="translate(20, 150)">
      <rect x="0" y="0" width="220" height="40" rx="5" fill="#fff" stroke="#ff9800" stroke-width="1"/>
      <text x="10" y="18" font-size="12" font-weight="bold" fill="#1a1a2e">Rebase &amp; Merge</text>
      <text x="10" y="32" font-size="10" fill="#555">Interactive rebase assistance</text>
    </g>
  </g>
  
  <!-- GitHub Operations -->
  <g transform="translate(700, 100)">
    <rect x="0" y="0" width="260" height="220" rx="10" fill="#e8f8f0" stroke="#27ae60" stroke-width="2"/>
    <text x="130" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a1a2e">GitHub Operations</text>
    
    <!-- PR Creation -->
    <g transform="translate(20, 50)">
      <rect x="0" y="0" width="220" height="40" rx="5" fill="#fff" stroke="#27ae60" stroke-width="1"/>
      <text x="10" y="18" font-size="12" font-weight="bold" fill="#1a1a2e">Pull Requests</text>
      <text x="10" y="32" font-size="10" fill="#555">Create, review, merge PRs</text>
    </g>
    
    <!-- Issues -->
    <g transform="translate(20, 100)">
      <rect x="0" y="0" width="220" height="40" rx="5" fill="#fff" stroke="#27ae60" stroke-width="1"/>
      <text x="10" y="18" font-size="12" font-weight="bold" fill="#1a1a2e">Issues</text>
      <text x="10" y="32" font-size="10" fill="#555">Link, update, close issues</text>
    </g>
    
    <!-- Reviewers -->
    <g transform="translate(20, 150)">
      <rect x="0" y="0" width="220" height="40" rx="5" fill="#fff" stroke="#27ae60" stroke-width="1"/>
      <text x="10" y="18" font-size="12" font-weight="bold" fill="#1a1a2e">Reviewers &amp; Labels</text>
      <text x="10" y="32" font-size="10" fill="#555">Assign reviewers, add labels</text>
    </g>
  </g>
  
  <!-- CI/CD Workflow -->
  <g transform="translate(350, 400)">
    <rect x="0" y="0" width="610" height="330" rx="12" fill="#fff0f5" stroke="#e91e63" stroke-width="3"/>
    <text x="305" y="35" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a2e">
      CI/CD Babysitting Workflow
    </text>
    
    <!-- Step 1 -->
    <g transform="translate(30, 60)">
      <circle cx="20" cy="20" r="20" fill="#e91e63"/>
      <text x="20" y="27" font-size="14" font-weight="bold" text-anchor="middle" fill="white">1</text>
      <text x="55" y="27" font-size="13" font-weight="bold" fill="#1a1a2e">Push Code</text>
      <text x="55" y="45" font-size="11" fill="#555">Developer pushes to branch</text>
    </g>
    
    <!-- Step 2 -->
    <g transform="translate(30, 120)">
      <circle cx="20" cy="20" r="20" fill="#e91e63"/>
      <text x="20" y="27" font-size="14" font-weight="bold" text-anchor="middle" fill="white">2</text>
      <text x="55" y="27" font-size="13" font-weight="bold" fill="#1a1a2e">Monitor CI</text>
      <text x="55" y="45" font-size="11" fill="#555">AI watches GitHub Actions run</text>
    </g>
    
    <!-- Step 3 -->
    <g transform="translate(30, 180)">
      <circle cx="20" cy="20" r="20" fill="#e91e63"/>
      <text x="20" y="27" font-size="14" font-weight="bold" text-anchor="middle" fill="white">3</text>
      <text x="55" y="27" font-size="13" font-weight="bold" fill="#1a1a2e">Analyze Failure</text>
      <text x="55" y="45" font-size="11" fill="#555">Parse logs, identify root cause</text>
    </g>
    
    <!-- Step 4 -->
    <g transform="translate(30, 240)">
      <circle cx="20" cy="20" r="20" fill="#e91e63"/>
      <text x="20" y="27" font-size="14" font-weight="bold" text-anchor="middle" fill="white">4</text>
      <text x="55" y="27" font-size="13" font-weight="bold" fill="#1a1a2e">Apply Fix</text>
      <text x="55" y="45" font-size="11" fill="#555">Make changes and push again</text>
    </g>
    
    <!-- Step 5 -->
    <g transform="translate(320, 120)">
      <circle cx="20" cy="20" r="20" fill="#27ae60"/>
      <text x="20" y="27" font-size="14" font-weight="bold" text-anchor="middle" fill="white">✓</text>
      <text x="55" y="27" font-size="13" font-weight="bold" fill="#1a1a2e">CI Passes</text>
      <text x="55" y="45" font-size="11" fill="#555">All checks green ✓</text>
    </g>
    
    <!-- Common Issues Box -->
    <g transform="translate(320, 180)">
      <rect x="0" y="0" width="250" height="120" rx="8" fill="#fff" stroke="#e91e63" stroke-width="1.5"/>
      <text x="125" y="25" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a2e">Common CI Issues AI Fixes</text>
      <text x="125" y="48" font-size="11" text-anchor="middle" fill="#555">• Linting errors</text>
      <text x="125" y="66" font-size="11" text-anchor="middle" fill="#555">• Test failures</text>
      <text x="125" y="84" font-size="11" text-anchor="middle" fill="#555">• Dependency conflicts</text>
      <text x="125" y="102" font-size="11" text-anchor="middle" fill="#555">• Build configuration</text>
    </g>
    
    <!-- Loop arrow -->
    <path d="M 250 180 Q 280 140 250 100" stroke="#e91e63" stroke-width="2" fill="none" 
          marker-end="url(#arrowpink)" stroke-dasharray="5,5"/>
    <text x="265" y="140" font-size="10" fill="#e91e63">Retry</text>
  </g>
  
  <!-- Arrows -->
  <defs>
    <marker id="arrowblue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#4a90e2"/>
    </marker>
    <marker id="arroworange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#ff9800"/>
    </marker>
    <marker id="arrowgreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#27ae60"/>
    </marker>
    <marker id="arrowpink" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#e91e63"/>
    </marker>
  </defs>
  
  <!-- Developer to AI Agent -->
  <path d="M 100 180 L 100 360" stroke="#4a90e2" stroke-width="2" fill="none" marker-end="url(#arrowblue)"/>
  <text x="120" y="270" font-size="11" fill="#4a90e2">Delegates tasks</text>
  
  <!-- AI to Git Ops -->
  <path d="M 210 450 L 350 210" stroke="#ff9800" stroke-width="2" fill="none" marker-end="url(#arroworange)"/>
  
  <!-- AI to GitHub Ops -->
  <path d="M 210 450 L 700 210" stroke="#27ae60" stroke-width="2" fill="none" marker-end="url(#arrowgreen)"/>
  
  <!-- AI to CI/CD -->
  <path d="M 130 540 L 350 520" stroke="#e91e63" stroke-width="2" fill="none" marker-end="url(#arrowpink)"/>
</svg>