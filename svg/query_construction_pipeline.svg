<svg viewBox="0 0 1200 1100" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="1100" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="600" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Query Construction Pipeline
  </text>
  
  <!-- User Input -->
  <g id="user-input">
    <rect x="400" y="80" width="400" height="70" rx="10" fill="#fff3bf" stroke="#f59f00" stroke-width="3"/>
    <text x="600" y="108" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#495057">
      Natural Language Query
    </text>
    <text x="600" y="132" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#868e96" font-style="italic">
      "What are the top 10 customers by revenue in 2024?"
    </text>
  </g>
  
  <!-- Arrow -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#495057"/>
    </marker>
  </defs>
  <line x1="600" y1="150" x2="600" y2="185" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  
  <!-- Stage 1: Query Understanding -->
  <g id="stage1">
    <rect x="50" y="195" width="1100" height="150" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="3"/>
    <text x="600" y="225" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Stage 1: Query Understanding
    </text>
    
    <rect x="80" y="245" width="240" height="85" rx="5" fill="#fff" stroke="#1971c2" stroke-width="2"/>
    <text x="200" y="265" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#495057">
      NLP Processing
    </text>
    <text x="95" y="283" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Parse question structure
    </text>
    <text x="95" y="299" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Tokenize and POS tag
    </text>
    <text x="95" y="315" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Identify question type
    </text>
    
    <rect x="340" y="245" width="240" height="85" rx="5" fill="#fff" stroke="#1971c2" stroke-width="2"/>
    <text x="460" y="265" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#495057">
      Intent Classification
    </text>
    <text x="355" y="283" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Determine query goal
    </text>
    <text x="355" y="299" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Identify: ranking query
    </text>
    <text x="355" y="315" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Expected output: list
    </text>
    
    <rect x="600" y="245" width="240" height="85" rx="5" fill="#fff" stroke="#1971c2" stroke-width="2"/>
    <text x="720" y="265" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#495057">
      Entity Extraction
    </text>
    <text x="615" y="283" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Entities: customers, revenue
    </text>
    <text x="615" y="299" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Values: top 10, 2024
    </text>
    <text x="615" y="315" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Metrics: revenue (sum)
    </text>
    
    <rect x="860" y="245" width="240" height="85" rx="5" fill="#fff" stroke="#1971c2" stroke-width="2"/>
    <text x="980" y="265" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#495057">
      Relationship Mapping
    </text>
    <text x="875" y="283" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • customers HAS revenue
    </text>
    <text x="875" y="299" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • revenue FROM orders
    </text>
    <text x="875" y="315" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Filter BY year
    </text>
  </g>
  
  <line x1="600" y1="345" x2="600" y2="380" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  
  <!-- Stage 2: Schema Analysis -->
  <g id="stage2">
    <rect x="50" y="390" width="1100" height="150" rx="10" fill="#d3f9d8" stroke="#37b24d" stroke-width="3"/>
    <text x="600" y="420" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Stage 2: Schema Analysis
    </text>
    
    <rect x="80" y="440" width="240" height="85" rx="5" fill="#fff" stroke="#37b24d" stroke-width="2"/>
    <text x="200" y="460" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#495057">
      Schema Retrieval
    </text>
    <text x="95" y="478" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Load database schema
    </text>
    <text x="95" y="494" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Get table definitions
    </text>
    <text x="95" y="510" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Retrieve relationships
    </text>
    
    <rect x="340" y="440" width="240" height="85" rx="5" fill="#fff" stroke="#37b24d" stroke-width="2"/>
    <text x="460" y="460" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#495057">
      Table Identification
    </text>
    <text x="355" y="478" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Match: customers table
    </text>
    <text x="355" y="494" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Match: orders table
    </text>
    <text x="355" y="510" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Relevance score: 0.95
    </text>
    
    <rect x="600" y="440" width="240" height="85" rx="5" fill="#fff" stroke="#37b24d" stroke-width="2"/>
    <text x="720" y="460" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#495057">
      Column Mapping
    </text>
    <text x="615" y="478" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • revenue → order_amount
    </text>
    <text x="615" y="494" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • customers → customer_name
    </text>
    <text x="615" y="510" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • 2024 → order_date YEAR
    </text>
    
    <rect x="860" y="440" width="240" height="85" rx="5" fill="#fff" stroke="#37b24d" stroke-width="2"/>
    <text x="980" y="460" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#495057">
      Relationship Discovery
    </text>
    <text x="875" y="478" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • JOIN: customer_id
    </text>
    <text x="875" y="494" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • FK: orders.customer_id
    </text>
    <text x="875" y="510" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • PK: customers.customer_id
    </text>
  </g>
  
  <line x1="600" y1="540" x2="600" y2="575" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  
  <!-- Stage 3: Query Generation -->
  <g id="stage3">
    <rect x="50" y="585" width="1100" height="150" rx="10" fill="#ffdeeb" stroke="#e64980" stroke-width="3"/>
    <text x="600" y="615" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Stage 3: Query Generation
    </text>
    
    <rect x="80" y="635" width="240" height="85" rx="5" fill="#fff" stroke="#e64980" stroke-width="2"/>
    <text x="200" y="655" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#495057">
      Template Selection
    </text>
    <text x="95" y="673" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Pattern: Top-N ranking
    </text>
    <text x="95" y="689" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Structure: SELECT...JOIN
    </text>
    <text x="95" y="705" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Template: ranking_query
    </text>
    
    <rect x="340" y="635" width="240" height="85" rx="5" fill="#fff" stroke="#e64980" stroke-width="2"/>
    <text x="460" y="655" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#495057">
      Clause Construction
    </text>
    <text x="355" y="673" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • SELECT: name, SUM()
    </text>
    <text x="355" y="689" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • WHERE: YEAR = 2024
    </text>
    <text x="355" y="705" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • GROUP BY: customer_id
    </text>
    
    <rect x="600" y="635" width="240" height="85" rx="5" fill="#fff" stroke="#e64980" stroke-width="2"/>
    <text x="720" y="655" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#495057">
      Aggregation Handling
    </text>
    <text x="615" y="673" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Function: SUM
    </text>
    <text x="615" y="689" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Column: order_amount
    </text>
    <text x="615" y="705" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Alias: total_revenue
    </text>
    
    <rect x="860" y="635" width="240" height="85" rx="5" fill="#fff" stroke="#e64980" stroke-width="2"/>
    <text x="980" y="655" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#495057">
      Filter Application
    </text>
    <text x="875" y="673" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • ORDER BY: DESC
    </text>
    <text x="875" y="689" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • LIMIT: 10
    </text>
    <text x="875" y="705" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • HAVING: (if needed)
    </text>
  </g>
  
  <line x1="600" y1="735" x2="600" y2="770" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  
  <!-- Stage 4: Query Validation -->
  <g id="stage4">
    <rect x="50" y="780" width="1100" height="120" rx="10" fill="#ffd8a8" stroke="#fd7e14" stroke-width="3"/>
    <text x="600" y="810" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Stage 4: Query Validation
    </text>
    
    <rect x="80" y="830" width="250" height="55" rx="5" fill="#fff" stroke="#fd7e14" stroke-width="2"/>
    <text x="205" y="850" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#495057">
      Syntax Checking
    </text>
    <text x="95" y="868" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      Parse SQL → Validate syntax
    </text>
    
    <rect x="350" y="830" width="250" height="55" rx="5" fill="#fff" stroke="#fd7e14" stroke-width="2"/>
    <text x="475" y="850" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#495057">
      Semantic Validation
    </text>
    <text x="365" y="868" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      Verify query matches intent
    </text>
    
    <rect x="620" y="830" width="250" height="55" rx="5" fill="#fff" stroke="#fd7e14" stroke-width="2"/>
    <text x="745" y="850" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#495057">
      Permission Check
    </text>
    <text x="635" y="868" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      Verify user has access
    </text>
    
    <rect x="890" y="830" width="250" height="55" rx="5" fill="#fff" stroke="#fd7e14" stroke-width="2"/>
    <text x="1015" y="850" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#495057">
      Safety Checks
    </text>
    <text x="905" y="868" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      Prevent destructive operations
    </text>
  </g>
  
  <line x1="600" y1="900" x2="600" y2="935" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  
  <!-- Stage 5: Execution -->
  <g id="stage5">
    <rect x="200" y="945" width="800" height="120" rx="10" fill="#e9d5ff" stroke="#9333ea" stroke-width="3"/>
    <text x="600" y="975" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Stage 5: Execution &amp; Error Handling
    </text>
    
    <rect x="220" y="995" width="170" height="55" rx="5" fill="#fff" stroke="#9333ea" stroke-width="2"/>
    <text x="305" y="1015" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#495057">
      Query Execution
    </text>
    <text x="235" y="1033" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      Run against DB
    </text>
    
    <rect x="410" y="995" width="170" height="55" rx="5" fill="#fff" stroke="#9333ea" stroke-width="2"/>
    <text x="495" y="1015" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#495057">
      Error Recovery
    </text>
    <text x="425" y="1033" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      Handle failures
    </text>
    
    <rect x="600" y="995" width="170" height="55" rx="5" fill="#fff" stroke="#9333ea" stroke-width="2"/>
    <text x="685" y="1015" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#495057">
      Result Formatting
    </text>
    <text x="615" y="1033" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      Format for LLM
    </text>
    
    <rect x="790" y="995" width="190" height="55" rx="5" fill="#fff" stroke="#9333ea" stroke-width="2"/>
    <text x="885" y="1015" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#495057">
      Performance Monitor
    </text>
    <text x="805" y="1033" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      Track execution time
    </text>
  </g>
</svg>