<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1400" height="1000" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="700" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Chunking Strategies Comparison
  </text>
  
  <!-- Sample Document -->
  <g id="sample-doc">
    <rect x="50" y="70" width="1300" height="80" rx="10" fill="#fff" stroke="#868e96" stroke-width="2"/>
    <text x="700" y="95" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Sample Document (Simplified)
    </text>
    <text x="70" y="118" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      [Introduction] Machine learning is transforming industries. [Methods] We used neural networks for classification.
    </text>
    <text x="70" y="135" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      [Results] Accuracy reached 95%. The model showed excellent generalization. [Conclusion] Future work will explore...
    </text>
  </g>
  
  <!-- Strategy 1: Fixed-Size Chunking -->
  <g id="fixed-size">
    <rect x="50" y="180" width="640" height="180" rx="10" fill="#fff3bf" stroke="#f59f00" stroke-width="3"/>
    <text x="370" y="210" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Fixed-Size Chunking
    </text>
    
    <!-- Chunks visualization -->
    <rect x="70" y="230" width="280" height="50" rx="5" fill="#ffd43b" stroke="#f59f00" stroke-width="2"/>
    <text x="210" y="260" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#000">
      Chunk 1: First 50 tokens
    </text>
    
    <rect x="70" y="290" width="280" height="50" rx="5" fill="#ffd43b" stroke="#f59f00" stroke-width="2"/>
    <text x="210" y="320" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#000">
      Chunk 2: Tokens 40-90 (overlap 10)
    </text>
    
    <rect x="380" y="230" width="290" height="110" rx="5" fill="#fff" stroke="#f59f00" stroke-width="2"/>
    <text x="525" y="250" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2f9e44">
      ✓ Pros
    </text>
    <text x="395" y="270" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Simple &amp; fast
    </text>
    <text x="395" y="288" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Predictable chunk sizes
    </text>
    <text x="525" y="310" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#c92a2a">
      ✗ Cons
    </text>
    <text x="395" y="328" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • May split sentences/concepts
    </text>
  </g>
  
  <!-- Strategy 2: Sentence-Based Chunking -->
  <g id="sentence-based">
    <rect x="710" y="180" width="640" height="180" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="3"/>
    <text x="1030" y="210" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Sentence-Based Chunking
    </text>
    
    <!-- Chunks visualization -->
    <rect x="730" y="230" width="290" height="50" rx="5" fill="#74c0fc" stroke="#1971c2" stroke-width="2"/>
    <text x="875" y="260" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#000">
      Chunk 1: Sentences 1-3
    </text>
    
    <rect x="730" y="290" width="290" height="50" rx="5" fill="#74c0fc" stroke="#1971c2" stroke-width="2"/>
    <text x="875" y="320" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#000">
      Chunk 2: Sentences 4-6
    </text>
    
    <rect x="1040" y="230" width="290" height="110" rx="5" fill="#fff" stroke="#1971c2" stroke-width="2"/>
    <text x="1185" y="250" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2f9e44">
      ✓ Pros
    </text>
    <text x="1055" y="270" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Preserves sentence integrity
    </text>
    <text x="1055" y="288" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Natural semantic units
    </text>
    <text x="1185" y="310" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#c92a2a">
      ✗ Cons
    </text>
    <text x="1055" y="328" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Variable chunk sizes
    </text>
  </g>
  
  <!-- Strategy 3: Semantic Chunking -->
  <g id="semantic">
    <rect x="50" y="390" width="640" height="180" rx="10" fill="#d0bfff" stroke="#7950f2" stroke-width="3"/>
    <text x="370" y="420" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Semantic Chunking
    </text>
    
    <!-- Chunks visualization -->
    <rect x="70" y="440" width="260" height="50" rx="5" fill="#b197fc" stroke="#7950f2" stroke-width="2"/>
    <text x="200" y="470" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#000">
      Chunk 1: Topic A content
    </text>
    
    <rect x="70" y="500" width="340" height="50" rx="5" fill="#b197fc" stroke="#7950f2" stroke-width="2"/>
    <text x="240" y="530" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#000">
      Chunk 2: Topic B content (larger)
    </text>
    
    <rect x="430" y="440" width="240" height="110" rx="5" fill="#fff" stroke="#7950f2" stroke-width="2"/>
    <text x="550" y="460" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2f9e44">
      ✓ Pros
    </text>
    <text x="445" y="480" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Maintains topic coherence
    </text>
    <text x="445" y="498" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Best context preservation
    </text>
    <text x="550" y="520" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#c92a2a">
      ✗ Cons
    </text>
    <text x="445" y="538" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Computationally expensive
    </text>
  </g>
  
  <!-- Strategy 4: Recursive Chunking -->
  <g id="recursive">
    <rect x="710" y="390" width="640" height="180" rx="10" fill="#c3fae8" stroke="#12b886" stroke-width="3"/>
    <text x="1030" y="420" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Recursive Chunking
    </text>
    
    <!-- Chunks visualization -->
    <rect x="730" y="440" width="280" height="50" rx="5" fill="#63e6be" stroke="#12b886" stroke-width="2"/>
    <text x="870" y="470" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#000">
      Chunk 1: Section 1 (by ##)
    </text>
    
    <rect x="730" y="500" width="280" height="50" rx="5" fill="#63e6be" stroke="#12b886" stroke-width="2"/>
    <text x="870" y="530" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#000">
      Chunk 2: Section 2 (by ##)
    </text>
    
    <rect x="1030" y="440" width="300" height="110" rx="5" fill="#fff" stroke="#12b886" stroke-width="2"/>
    <text x="1180" y="460" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2f9e44">
      ✓ Pros
    </text>
    <text x="1045" y="480" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Respects document structure
    </text>
    <text x="1045" y="498" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Works for code &amp; markdown
    </text>
    <text x="1180" y="520" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#c92a2a">
      ✗ Cons
    </text>
    <text x="1045" y="538" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Complex implementation
    </text>
  </g>
  
  <!-- Comparison Table -->
  <g id="comparison">
    <rect x="50" y="600" width="1300" height="370" rx="10" fill="#fff" stroke="#868e96" stroke-width="2"/>
    <text x="700" y="635" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Strategy Comparison Matrix
    </text>
    
    <!-- Table Headers -->
    <rect x="70" y="655" width="240" height="40" fill="#e9ecef" stroke="#868e96" stroke-width="1"/>
    <text x="190" y="680" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Criteria
    </text>
    
    <rect x="310" y="655" width="240" height="40" fill="#fff3bf" stroke="#f59f00" stroke-width="1"/>
    <text x="430" y="680" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Fixed-Size
    </text>
    
    <rect x="550" y="655" width="240" height="40" fill="#e7f5ff" stroke="#1971c2" stroke-width="1"/>
    <text x="670" y="680" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Sentence-Based
    </text>
    
    <rect x="790" y="655" width="240" height="40" fill="#d0bfff" stroke="#7950f2" stroke-width="1"/>
    <text x="910" y="680" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Semantic
    </text>
    
    <rect x="1030" y="655" width="240" height="40" fill="#c3fae8" stroke="#12b886" stroke-width="1"/>
    <text x="1150" y="680" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Recursive
    </text>
    
    <!-- Row 1: Implementation Complexity -->
    <rect x="70" y="695" width="240" height="35" fill="#f8f9fa" stroke="#868e96" stroke-width="1"/>
    <text x="85" y="717" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      Implementation Complexity
    </text>
    <rect x="310" y="695" width="240" height="35" fill="#fff" stroke="#868e96" stroke-width="1"/>
    <text x="430" y="717" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2f9e44">
      ★☆☆☆☆ Low
    </text>
    <rect x="550" y="695" width="240" height="35" fill="#fff" stroke="#868e96" stroke-width="1"/>
    <text x="670" y="717" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#f59f00">
      ★★☆☆☆ Medium-Low
    </text>
    <rect x="790" y="695" width="240" height="35" fill="#fff" stroke="#868e96" stroke-width="1"/>
    <text x="910" y="717" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#c92a2a">
      ★★★★☆ High
    </text>
    <rect x="1030" y="695" width="240" height="35" fill="#fff" stroke="#868e96" stroke-width="1"/>
    <text x="1150" y="717" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#e64980">
      ★★★☆☆ Medium-High
    </text>
    
    <!-- Row 2: Context Coherence -->
    <rect x="70" y="730" width="240" height="35" fill="#f8f9fa" stroke="#868e96" stroke-width="1"/>
    <text x="85" y="752" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      Context Coherence
    </text>
    <rect x="310" y="730" width="240" height="35" fill="#fff" stroke="#868e96" stroke-width="1"/>
    <text x="430" y="752" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#e64980">
      ★★☆☆☆ Low
    </text>
    <rect x="550" y="730" width="240" height="35" fill="#fff" stroke="#868e96" stroke-width="1"/>
    <text x="670" y="752" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#f59f00">
      ★★★☆☆ Medium
    </text>
    <rect x="790" y="730" width="240" height="35" fill="#fff" stroke="#868e96" stroke-width="1"/>
    <text x="910" y="752" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2f9e44">
      ★★★★★ Very High
    </text>
    <rect x="1030" y="730" width="240" height="35" fill="#fff" stroke="#868e96" stroke-width="1"/>
    <text x="1150" y="752" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2f9e44">
      ★★★★☆ High
    </text>
    
    <!-- Row 3: Processing Speed -->
    <rect x="70" y="765" width="240" height="35" fill="#f8f9fa" stroke="#868e96" stroke-width="1"/>
    <text x="85" y="787" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      Processing Speed
    </text>
    <rect x="310" y="765" width="240" height="35" fill="#fff" stroke="#868e96" stroke-width="1"/>
    <text x="430" y="787" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2f9e44">
      ★★★★★ Very Fast
    </text>
    <rect x="550" y="765" width="240" height="35" fill="#fff" stroke="#868e96" stroke-width="1"/>
    <text x="670" y="787" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2f9e44">
      ★★★★☆ Fast
    </text>
    <rect x="790" y="765" width="240" height="35" fill="#fff" stroke="#868e96" stroke-width="1"/>
    <text x="910" y="787" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#c92a2a">
      ★★☆☆☆ Slow
    </text>
    <rect x="1030" y="765" width="240" height="35" fill="#fff" stroke="#868e96" stroke-width="1"/>
    <text x="1150" y="787" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#f59f00">
      ★★★☆☆ Medium
    </text>
    
    <!-- Row 4: Chunk Size Consistency -->
    <rect x="70" y="800" width="240" height="35" fill="#f8f9fa" stroke="#868e96" stroke-width="1"/>
    <text x="85" y="822" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      Chunk Size Consistency
    </text>
    <rect x="310" y="800" width="240" height="35" fill="#fff" stroke="#868e96" stroke-width="1"/>
    <text x="430" y="822" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2f9e44">
      ★★★★★ Very High
    </text>
    <rect x="550" y="800" width="240" height="35" fill="#fff" stroke="#868e96" stroke-width="1"/>
    <text x="670" y="822" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#f59f00">
      ★★★☆☆ Medium
    </text>
    <rect x="790" y="800" width="240" height="35" fill="#fff" stroke="#868e96" stroke-width="1"/>
    <text x="910" y="822" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#e64980">
      ★★☆☆☆ Variable
    </text>
    <rect x="1030" y="800" width="240" height="35" fill="#fff" stroke="#868e96" stroke-width="1"/>
    <text x="1150" y="822" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#f59f00">
      ★★★☆☆ Medium
    </text>
    
    <!-- Row 5: Best Use Case -->
    <rect x="70" y="835" width="240" height="55" fill="#f8f9fa" stroke="#868e96" stroke-width="1"/>
    <text x="85" y="857" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      Best Use Case
    </text>
    <rect x="310" y="835" width="240" height="55" fill="#fff" stroke="#868e96" stroke-width="1"/>
    <text x="430" y="857" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#495057">
      Large homogeneous
    </text>
    <text x="430" y="872" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#495057">
      documents
    </text>
    <rect x="550" y="835" width="240" height="55" fill="#fff" stroke="#868e96" stroke-width="1"/>
    <text x="670" y="857" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#495057">
      Well-structured
    </text>
    <text x="670" y="872" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#495057">
      articles &amp; docs
    </text>
    <rect x="790" y="835" width="240" height="55" fill="#fff" stroke="#868e96" stroke-width="1"/>
    <text x="910" y="857" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#495057">
      Mixed-topic
    </text>
    <text x="910" y="872" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#495057">
      complex documents
    </text>
    <rect x="1030" y="835" width="240" height="55" fill="#fff" stroke="#868e96" stroke-width="1"/>
    <text x="1150" y="857" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#495057">
      Markdown, code,
    </text>
    <text x="1150" y="872" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#495057">
      structured content
    </text>
    
    <!-- Bottom recommendation -->
    <rect x="90" y="910" width="1260" height="45" rx="5" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
    <text x="720" y="930" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      💡 Recommendation
    </text>
    <text x="720" y="948" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#495057">
      Start with sentence-based or recursive chunking for most use cases. Use semantic chunking when retrieval quality is critical and you have computational resources.
    </text>
  </g>
</svg>