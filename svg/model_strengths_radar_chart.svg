<svg viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="800" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="500" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#1e293b">
    AI Model Strengths Radar Comparison
  </text>
  
  <!-- Radar Chart Center -->
  <g transform="translate(500, 400)">
    <!-- Grid circles -->
    <g fill="none" stroke="#cbd5e1" stroke-width="1" opacity="0.5">
      <circle r="50" />
      <circle r="100" />
      <circle r="150" />
      <circle r="200" />
    </g>
    
    <!-- Axis lines -->
    <g stroke="#94a3b8" stroke-width="1" opacity="0.7">
      <!-- Versatility (top) -->
      <line x1="0" y1="0" x2="0" y2="-200" />
      <!-- Speed (top-right) -->
      <line x1="0" y1="0" x2="173" y2="-100" />
      <!-- Cost Efficiency (bottom-right) -->
      <line x1="0" y1="0" x2="173" y2="100" />
      <!-- Integration (bottom) -->
      <line x1="0" y1="0" x2="0" y2="200" />
      <!-- Accuracy (bottom-left) -->
      <line x1="0" y1="0" x2="-173" y2="100" />
      <!-- Specialization (top-left) -->
      <line x1="0" y1="0" x2="-173" y2="-100" />
    </g>
    
    <!-- Axis Labels -->
    <g font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#374151">
      <text x="0" y="-220">Versatility</text>
      <text x="190" y="-95">Speed</text>
      <text x="190" y="110">Cost Efficiency</text>
      <text x="0" y="230">Integration</text>
      <text x="-190" y="110">Accuracy</text>
      <text x="-190" y="-95">Specialization</text>
    </g>
    
    <!-- Scale markers -->
    <g font-family="Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">
      <text x="15" y="-45">25%</text>
      <text x="15" y="-95">50%</text>
      <text x="15" y="-145">75%</text>
      <text x="15" y="-195">100%</text>
    </g>
    
    <!-- ChatGPT polygon -->
    <polygon points="0,-160 138,-80 138,80 0,140 -104,60 -104,-120"
             fill="#10a37f" opacity="0.3" stroke="#059669" stroke-width="2"/>
    
    <!-- Gemini polygon -->
    <polygon points="0,-140 104,-70 104,120 0,160 -138,80 -138,-100"
             fill="#4285f4" opacity="0.3" stroke="#1d4ed8" stroke-width="2"/>
    
    <!-- Claude polygon -->
    <polygon points="0,-120 69,-40 52,60 0,120 -138,100 -173,-100"
             fill="#d97706" opacity="0.3" stroke="#92400e" stroke-width="2"/>
    
    <!-- Grok polygon -->
    <polygon points="0,-80 173,-100 86,40 0,100 -69,40 -86,-60"
             fill="#374151" opacity="0.3" stroke="#1f2937" stroke-width="2"/>
    
    <!-- DeepSeek polygon -->
    <polygon points="0,-100 138,-80 173,100 0,120 -104,80 -104,-80"
             fill="#1e40af" opacity="0.3" stroke="#1e3a8a" stroke-width="2"/>
    
    <!-- Data points -->
    <!-- ChatGPT points -->
    <g fill="#059669">
      <circle cx="0" cy="-160" r="4"/>
      <circle cx="138" cy="-80" r="4"/>
      <circle cx="138" cy="80" r="4"/>
      <circle cx="0" cy="140" r="4"/>
      <circle cx="-104" cy="60" r="4"/>
      <circle cx="-104" cy="-120" r="4"/>
    </g>
    
    <!-- Gemini points -->
    <g fill="#1d4ed8">
      <circle cx="0" cy="-140" r="4"/>
      <circle cx="104" cy="-70" r="4"/>
      <circle cx="104" cy="120" r="4"/>
      <circle cx="0" cy="160" r="4"/>
      <circle cx="-138" cy="80" r="4"/>
      <circle cx="-138" cy="-100" r="4"/>
    </g>
    
    <!-- Claude points -->
    <g fill="#92400e">
      <circle cx="0" cy="-120" r="4"/>
      <circle cx="69" cy="-40" r="4"/>
      <circle cx="52" cy="60" r="4"/>
      <circle cx="0" cy="120" r="4"/>
      <circle cx="-138" cy="100" r="4"/>
      <circle cx="-173" cy="-100" r="4"/>
    </g>
    
    <!-- Grok points -->
    <g fill="#1f2937">
      <circle cx="0" cy="-80" r="4"/>
      <circle cx="173" cy="-100" r="4"/>
      <circle cx="86" cy="40" r="4"/>
      <circle cx="0" cy="100" r="4"/>
      <circle cx="-69" cy="40" r="4"/>
      <circle cx="-86" cy="-60" r="4"/>
    </g>
    
    <!-- DeepSeek points -->
    <g fill="#1e3a8a">
      <circle cx="0" cy="-100" r="4"/>
      <circle cx="138" cy="-80" r="4"/>
      <circle cx="173" cy="100" r="4"/>
      <circle cx="0" cy="120" r="4"/>
      <circle cx="-104" cy="80" r="4"/>
      <circle cx="-104" cy="-80" r="4"/>
    </g>
  </g>
  
  <!-- Legend -->
  <g transform="translate(50, 600)">
    <rect x="0" y="0" width="350" height="180" fill="white" stroke="#e2e8f0" stroke-width="1" rx="8"/>
    <text x="175" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1e293b">
      Legend
    </text>
    
    <!-- ChatGPT -->
    <g>
      <rect x="20" y="40" width="15" height="15" fill="#10a37f"/>
      <text x="45" y="52" font-family="Arial, sans-serif" font-size="12" fill="#1e293b">ChatGPT - Versatile AI Platform</text>
    </g>
    
    <!-- Gemini -->
    <g>
      <rect x="20" y="65" width="15" height="15" fill="#4285f4"/>
      <text x="45" y="77" font-family="Arial, sans-serif" font-size="12" fill="#1e293b">Gemini - Google Ecosystem Integration</text>
    </g>
    
    <!-- Claude -->
    <g>
      <rect x="20" y="90" width="15" height="15" fill="#d97706"/>
      <text x="45" y="102" font-family="Arial, sans-serif" font-size="12" fill="#1e293b">Claude - Deep Analysis &amp; Safety</text>
    </g>
    
    <!-- Grok -->
    <g>
      <rect x="20" y="115" width="15" height="15" fill="#374151"/>
      <text x="45" y="127" font-family="Arial, sans-serif" font-size="12" fill="#1e293b">Grok - Real-time Social Media</text>
    </g>
    
    <!-- DeepSeek -->
    <g>
      <rect x="20" y="140" width="15" height="15" fill="#1e40af"/>
      <text x="45" y="152" font-family="Arial, sans-serif" font-size="12" fill="#1e293b">DeepSeek - Cost-effective Technical AI</text>
    </g>
  </g>
  
  <!-- Performance Metrics -->
  <g transform="translate(600, 600)">
    <rect x="0" y="0" width="350" height="180" fill="white" stroke="#e2e8f0" stroke-width="1" rx="8"/>
    <text x="175" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1e293b">
      Key Metrics
    </text>
    
    <g font-family="Arial, sans-serif" font-size="11" fill="#64748b">
      <text x="20" y="45">• Versatility: General-purpose capabilities</text>
      <text x="20" y="62">• Speed: Response time and processing</text>
      <text x="20" y="79">• Cost Efficiency: Value for money</text>
      <text x="20" y="96">• Integration: Platform connectivity</text>
      <text x="20" y="113">• Accuracy: Reliability and precision</text>
      <text x="20" y="130">• Specialization: Domain expertise</text>
      <text x="20" y="155" font-size="10" fill="#94a3b8">Note: Ratings based on typical use cases</text>
    </g>
  </g>
  
  <!-- Insights Box -->
  <g transform="translate(50, 70)">
    <rect x="0" y="0" width="900" height="100" fill="white" stroke="#e2e8f0" stroke-width="1" rx="8"/>
    <text x="450" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1e293b">
      Key Insights
    </text>
    
    <g font-family="Arial, sans-serif" font-size="12" fill="#475569">
      <text x="30" y="50">• ChatGPT leads in versatility and integration capabilities</text>
      <text x="30" y="68">• DeepSeek excels in cost efficiency while maintaining technical excellence</text>
      <text x="30" y="86">• Claude dominates in accuracy and specialized analysis tasks</text>
      
      <text x="480" y="50">• Grok offers unique real-time social media advantages</text>
      <text x="480" y="68">• Gemini provides seamless Google ecosystem integration</text>
      <text x="480" y="86">• Each model has distinct strengths for specific use cases</text>
    </g>
  </g>
</svg>