<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title-text { font-family: 'Arial', sans-serif; font-size: 24px; font-weight: bold; fill: #2c3e50; }
      .subtitle-text { font-family: 'Arial', sans-serif; font-size: 18px; font-weight: bold; fill: #34495e; }
      .label-text { font-family: 'Arial', sans-serif; font-size: 14px; fill: #34495e; }
      .small-text { font-family: 'Arial', sans-serif; font-size: 12px; fill: #7f8c8d; }
      .equation-text { font-family: 'Times New Roman', serif; font-size: 16px; fill: #2c3e50; }
      .model-box { fill: #e8f5e8; stroke: #28a745; stroke-width: 2; rx: 10; }
      .performance-box { fill: #e3f2fd; stroke: #2196f3; stroke-width: 2; rx: 10; }
      .insight-box { fill: #fff3cd; stroke: #ffc107; stroke-width: 2; rx: 10; }
      .coefficient-box { fill: #f8f9fa; stroke: #6c757d; stroke-width: 1; rx: 5; }
      .bar-tv { fill: #28a745; opacity: 0.8; }
      .bar-radio { fill: #007bff; opacity: 0.8; }
      .bar-newspaper { fill: #dc3545; opacity: 0.8; }
    </style>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title-text">Marketing Campaign R² Analysis</text>
  
  <!-- Model Equation -->
  <g transform="translate(50, 70)">
    <rect x="0" y="0" width="700" height="80" class="model-box"/>
    <text x="350" y="25" text-anchor="middle" class="subtitle-text" fill="#155724">Multiple Regression Model</text>
    <text x="350" y="50" text-anchor="middle" class="equation-text">Sales = 2.94 + 0.046×(TV) + 0.19×(Radio) - 0.001×(Newspaper)</text>
    <text x="350" y="70" text-anchor="middle" class="label-text" fill="#155724">R² = 0.897 (89.7% variance explained)</text>
  </g>
  
  <!-- Performance Visualization -->
  <g transform="translate(50, 170)">
    <rect x="0" y="0" width="320" height="200" class="performance-box"/>
    <text x="160" y="25" text-anchor="middle" class="subtitle-text" fill="#1976d2">Model Performance</text>
    
    <!-- R² Gauge -->
    <g transform="translate(160, 70)">
      <!-- Background arc -->
      <path d="M -80 0 A 80 80 0 0 1 80 0" stroke="#ecf0f1" stroke-width="20" fill="none"/>
      <!-- R² arc (89.7%) -->
      <path d="M -80 0 A 80 80 0 1 1 71.8 35.6" stroke="#28a745" stroke-width="20" fill="none"/>
      
      <!-- Center text -->
      <text x="0" y="-10" text-anchor="middle" class="equation-text">R² = 0.897</text>
      <text x="0" y="10" text-anchor="middle" class="small-text">89.7% Explained</text>
    </g>
    
    <!-- Performance metrics -->
    <text x="20" y="150" class="small-text">✓ High explanatory power</text>
    <text x="20" y="165" class="small-text">✓ Strong model fit</text>
    <text x="20" y="180" class="small-text">✓ Reliable predictions</text>
  </g>
  
  <!-- Coefficient Analysis -->
  <g transform="translate(390, 170)">
    <rect x="0" y="0" width="360" height="200" class="coefficient-box"/>
    <text x="180" y="25" text-anchor="middle" class="subtitle-text">Coefficient Interpretation</text>
    
    <!-- TV coefficient -->
    <g transform="translate(20, 50)">
      <rect x="0" y="0" width="92" height="15" class="bar-tv"/>
      <text x="100" y="12" class="small-text">TV: +0.046 (Positive impact)</text>
    </g>
    
    <!-- Radio coefficient -->
    <g transform="translate(20, 80)">
      <rect x="0" y="0" width="190" height="15" class="bar-radio"/>
      <text x="200" y="12" class="small-text">Radio: +0.19 (Strong positive)</text>
    </g>
    
    <!-- Newspaper coefficient -->
    <g transform="translate(20, 110)">
      <rect x="0" y="0" width="2" height="15" class="bar-newspaper"/>
      <text x="10" y="12" class="small-text">Newspaper: -0.001 (Negligible)</text>
    </g>
    
    <!-- Coefficient values -->
    <text x="20" y="150" class="small-text">• TV: $1 → +0.046 sales units</text>
    <text x="20" y="165" class="small-text">• Radio: $1 → +0.19 sales units</text>
    <text x="20" y="180" class="small-text">• Newspaper: Minimal effect</text>
  </g>
  
  <!-- Business Insights -->
  <g transform="translate(50, 390)">
    <rect x="0" y="0" width="700" height="120" class="insight-box"/>
    <text x="350" y="25" text-anchor="middle" class="subtitle-text" fill="#856404">Business Insights</text>
    
    <text x="50" y="55" class="label-text" fill="#856404">Strategic Implications:</text>
    <text x="70" y="75" class="small-text">• 89.7% of sales variation explained by advertising budget</text>
    <text x="70" y="90" class="small-text">• Radio advertising shows highest per-dollar impact</text>
    <text x="70" y="105" class="small-text">• Newspaper advertising provides minimal value</text>
    
    <text x="400" y="55" class="label-text" fill="#856404">Actionable Recommendations:</text>
    <text x="420" y="75" class="small-text">• Increase radio advertising allocation</text>
    <text x="420" y="90" class="small-text">• Maintain TV advertising (solid returns)</text>
    <text x="420" y="105" class="small-text">• Consider reducing newspaper spend</text>
  </g>
  
  <!-- Model Quality Assessment -->
  <g transform="translate(50, 530)">
    <text x="350" y="0" text-anchor="middle" class="subtitle-text">Model Quality Assessment</text>
    
    <!-- Quality indicators -->
    <text x="100" y="30" class="small-text">R² = 0.897</text>
    <text x="100" y="45" class="small-text">Excellent fit</text>
    
    <text x="250" y="30" class="small-text">All channels combined</text>
    <text x="250" y="45" class="small-text">Synergistic effects</text>
    
    <text x="450" y="30" class="small-text">Significant improvement</text>
    <text x="450" y="45" class="small-text">over individual models</text>
    
    <text x="600" y="30" class="small-text">Business actionable</text>
    <text x="600" y="45" class="small-text">Clear ROI guidance</text>
  </g>
</svg>