<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#27AE60;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#229954;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8E44AD;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7D3C98;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2C3E50">
    Collaborative Filtering Approaches
  </text>
  
  <!-- Main Container -->
  <rect x="50" y="70" width="700" height="400" rx="10" fill="white" stroke="#ddd" stroke-width="2" filter="url(#shadow)"/>
  
  <!-- Aggregate Clustering Section -->
  <g transform="translate(80, 100)">
    <rect x="0" y="0" width="280" height="80" rx="8" fill="#FFE5E5" stroke="#FF6B6B" stroke-width="2"/>
    <text x="140" y="30" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#D32F2F">
      Aggregate Clustering
    </text>
    <text x="140" y="55" font-family="Arial" font-size="13" text-anchor="middle" fill="#666">
      Fixed clusters for all users
    </text>
    <circle cx="50" cy="40" r="5" fill="#FF6B6B"/>
    <circle cx="80" cy="40" r="5" fill="#FF6B6B"/>
    <circle cx="110" cy="40" r="5" fill="#FF6B6B"/>
    <circle cx="170" cy="40" r="5" fill="#FF9999"/>
    <circle cx="200" cy="40" r="5" fill="#FF9999"/>
    <circle cx="230" cy="40" r="5" fill="#FF9999"/>
  </g>
  
  <!-- Arrow pointing to problem -->
  <g>
    <path d="M 360 140 L 420 140" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <text x="390" y="135" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Problem:</text>
    <text x="390" y="150" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Boundary users</text>
  </g>
  
  <!-- Personalized Clustering Section -->
  <g transform="translate(440, 100)">
    <rect x="0" y="0" width="280" height="80" rx="8" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2"/>
    <text x="140" y="30" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#2E7D32">
      Personalized Clustering
    </text>
    <text x="140" y="55" font-family="Arial" font-size="13" text-anchor="middle" fill="#666">
      Dynamic clusters per user/item
    </text>
    <circle cx="140" cy="40" r="7" fill="#4CAF50"/>
    <circle cx="100" cy="35" r="5" fill="#81C784"/>
    <circle cx="120" cy="45" r="5" fill="#81C784"/>
    <circle cx="160" cy="45" r="5" fill="#81C784"/>
    <circle cx="180" cy="35" r="5" fill="#81C784"/>
  </g>
  
  <!-- User-User CF Box -->
  <g transform="translate(100, 220)">
    <rect x="0" y="0" width="250" height="180" rx="10" fill="url(#blueGrad)" filter="url(#shadow)"/>
    <text x="125" y="30" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="white">
      User-User CF
    </text>
    
    <!-- User icons -->
    <g transform="translate(30, 50)">
      <circle cx="30" cy="30" r="20" fill="white" opacity="0.9"/>
      <text x="30" y="35" font-family="Arial" font-size="14" text-anchor="middle" fill="#4A90E2">U1</text>
      
      <circle cx="100" cy="30" r="20" fill="white" opacity="0.9"/>
      <text x="100" y="35" font-family="Arial" font-size="14" text-anchor="middle" fill="#4A90E2">U2</text>
      
      <circle cx="170" cy="30" r="20" fill="white" opacity="0.9"/>
      <text x="170" y="35" font-family="Arial" font-size="14" text-anchor="middle" fill="#4A90E2">U3</text>
    </g>
    
    <!-- Similarity lines -->
    <line x1="80" y1="80" x2="130" y2="80" stroke="white" stroke-width="2" stroke-dasharray="3,3" opacity="0.7"/>
    <line x1="130" y1="80" x2="180" y2="80" stroke="white" stroke-width="2" stroke-dasharray="3,3" opacity="0.7"/>
    
    <text x="125" y="140" font-family="Arial" font-size="12" text-anchor="middle" fill="white">
      Find similar users
    </text>
    <text x="125" y="158" font-family="Arial" font-size="12" text-anchor="middle" fill="white">
      Aggregate their ratings
    </text>
  </g>
  
  <!-- Item-Item CF Box -->
  <g transform="translate(450, 220)">
    <rect x="0" y="0" width="250" height="180" rx="10" fill="url(#greenGrad)" filter="url(#shadow)"/>
    <text x="125" y="30" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="white">
      Item-Item CF
    </text>
    
    <!-- Item icons -->
    <g transform="translate(30, 50)">
      <rect x="15" y="15" width="30" height="30" rx="5" fill="white" opacity="0.9"/>
      <text x="30" y="35" font-family="Arial" font-size="14" text-anchor="middle" fill="#27AE60">I1</text>
      
      <rect x="85" y="15" width="30" height="30" rx="5" fill="white" opacity="0.9"/>
      <text x="100" y="35" font-family="Arial" font-size="14" text-anchor="middle" fill="#27AE60">I2</text>
      
      <rect x="155" y="15" width="30" height="30" rx="5" fill="white" opacity="0.9"/>
      <text x="170" y="35" font-family="Arial" font-size="14" text-anchor="middle" fill="#27AE60">I3</text>
    </g>
    
    <!-- Similarity lines -->
    <line x1="75" y1="80" x2="125" y2="80" stroke="white" stroke-width="2" stroke-dasharray="3,3" opacity="0.7"/>
    <line x1="125" y1="80" x2="175" y2="80" stroke="white" stroke-width="2" stroke-dasharray="3,3" opacity="0.7"/>
    
    <text x="125" y="140" font-family="Arial" font-size="12" text-anchor="middle" fill="white">
      Find similar items
    </text>
    <text x="125" y="158" font-family="Arial" font-size="12" text-anchor="middle" fill="white">
      Use user's past ratings
    </text>
  </g>
  
  <!-- Key Formula -->
  <g transform="translate(200, 430)">
    <rect x="0" y="0" width="400" height="50" rx="5" fill="#F0F3F7" stroke="#BDC3C7" stroke-width="1"/>
    <text x="200" y="20" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#34495E">
      Key Principle
    </text>
    <text x="200" y="38" font-family="Arial" font-size="11" text-anchor="middle" fill="#555">
      L̂ᵢⱼ = Average(Similar Users/Items ratings for target)
    </text>
  </g>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
</svg>