<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="900" height="700" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1e293b">Activation Functions Comparison</text>
  
  <!-- Binary Step Function -->
  <g id="binary-step">
    <rect x="50" y="60" width="350" height="150" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="225" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e40af">1. Binary Step Function</text>
    
    <!-- Graph -->
    <g transform="translate(70, 100)">
      <rect width="120" height="80" fill="white" stroke="#cbd5e1" stroke-width="1"/>
      <!-- Axes -->
      <line x1="0" y1="70" x2="120" y2="70" stroke="#64748b" stroke-width="1"/>
      <line x1="60" y1="0" x2="60" y2="80" stroke="#64748b" stroke-width="1"/>
      <!-- Step function -->
      <line x1="10" y1="60" x2="60" y2="60" stroke="#3b82f6" stroke-width="3"/>
      <line x1="60" y1="60" x2="60" y2="20" stroke="#3b82f6" stroke-width="3"/>
      <line x1="60" y1="20" x2="110" y2="20" stroke="#3b82f6" stroke-width="3"/>
      <circle cx="60" cy="60" r="2" fill="white" stroke="#3b82f6" stroke-width="2"/>
      <circle cx="60" cy="20" r="2" fill="#3b82f6"/>
      <!-- Labels -->
      <text x="5" y="65" font-family="Arial, sans-serif" font-size="9" fill="#64748b">0</text>
      <text x="5" y="25" font-family="Arial, sans-serif" font-size="9" fill="#64748b">1</text>
      <text x="55" y="88" font-family="Arial, sans-serif" font-size="9" fill="#64748b">0</text>
    </g>
    
    <!-- Formula and description -->
    <text x="220" y="125" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e40af">f(z) = {1 if z > 0, 0 otherwise}</text>
    <text x="220" y="145" font-family="Arial, sans-serif" font-size="10" fill="#475569">• Threshold-based classifier</text>
    <text x="220" y="160" font-family="Arial, sans-serif" font-size="10" fill="#475569">• Not differentiable</text>
    <text x="220" y="175" font-family="Arial, sans-serif" font-size="10" fill="#475569">• Historical significance</text>
    <text x="220" y="190" font-family="Arial, sans-serif" font-size="10" fill="#475569">• Sharp transition</text>
  </g>
  
  <!-- Sigmoid Function -->
  <g id="sigmoid">
    <rect x="450" y="60" width="350" height="150" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="625" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#92400e">2. Sigmoid Function</text>
    
    <!-- Graph -->
    <g transform="translate(470, 100)">
      <rect width="120" height="80" fill="white" stroke="#cbd5e1" stroke-width="1"/>
      <!-- Axes -->
      <line x1="0" y1="70" x2="120" y2="70" stroke="#64748b" stroke-width="1"/>
      <line x1="60" y1="0" x2="60" y2="80" stroke="#64748b" stroke-width="1"/>
      <!-- Sigmoid curve -->
      <path d="M10,65 Q30,60 45,45 Q60,30 75,15 Q90,10 110,8" fill="none" stroke="#f59e0b" stroke-width="3"/>
      <!-- Labels -->
      <text x="5" y="75" font-family="Arial, sans-serif" font-size="9" fill="#64748b">0</text>
      <text x="5" y="15" font-family="Arial, sans-serif" font-size="9" fill="#64748b">1</text>
      <text x="25" y="50" font-family="Arial, sans-serif" font-size="9" fill="#64748b">0.5</text>
    </g>
    
    <!-- Formula and description -->
    <text x="620" y="125" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#92400e">f(z) = eᶻ/(1 + eᶻ)</text>
    <text x="620" y="145" font-family="Arial, sans-serif" font-size="10" fill="#475569">• Output: (0, 1)</text>
    <text x="620" y="160" font-family="Arial, sans-serif" font-size="10" fill="#475569">• Probability interpretation</text>
    <text x="620" y="175" font-family="Arial, sans-serif" font-size="10" fill="#475569">• Binary classification output</text>
    <text x="620" y="190" font-family="Arial, sans-serif" font-size="10" fill="#475569">• Smooth, differentiable</text>
  </g>
  
  <!-- Tanh Function -->
  <g id="tanh">
    <rect x="50" y="240" width="350" height="150" rx="8" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
    <text x="225" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0c4a6e">3. Tanh Function</text>
    
    <!-- Graph -->
    <g transform="translate(70, 280)">
      <rect width="120" height="80" fill="white" stroke="#cbd5e1" stroke-width="1"/>
      <!-- Axes -->
      <line x1="0" y1="40" x2="120" y2="40" stroke="#64748b" stroke-width="1"/>
      <line x1="60" y1="0" x2="60" y2="80" stroke="#64748b" stroke-width="1"/>
      <!-- Tanh curve -->
      <path d="M10,75 Q30,65 45,50 Q60,40 75,30 Q90,15 110,5" fill="none" stroke="#0ea5e9" stroke-width="3"/>
      <!-- Labels -->
      <text x="5" y="80" font-family="Arial, sans-serif" font-size="9" fill="#64748b">-1</text>
      <text x="5" y="10" font-family="Arial, sans-serif" font-size="9" fill="#64748b">1</text>
      <text x="55" y="50" font-family="Arial, sans-serif" font-size="9" fill="#64748b">0</text>
    </g>
    
    <!-- Formula and description -->
    <text x="220" y="305" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0c4a6e">f(z) = (eᶻ - e⁻ᶻ)/(eᶻ + e⁻ᶻ)</text>
    <text x="220" y="325" font-family="Arial, sans-serif" font-size="10" fill="#475569">• Output: (-1, 1)</text>
    <text x="220" y="340" font-family="Arial, sans-serif" font-size="10" fill="#475569">• Zero-centered</text>
    <text x="220" y="355" font-family="Arial, sans-serif" font-size="10" fill="#475569">• Preferred for hidden layers</text>
    <text x="220" y="370" font-family="Arial, sans-serif" font-size="10" fill="#475569">• Shifted sigmoid</text>
  </g>
  
  <!-- ReLU Function -->
  <g id="relu">
    <rect x="450" y="240" width="350" height="150" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="625" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#166534">4. ReLU Function</text>
    
    <!-- Graph -->
    <g transform="translate(470, 280)">
      <rect width="120" height="80" fill="white" stroke="#cbd5e1" stroke-width="1"/>
      <!-- Axes -->
      <line x1="0" y1="70" x2="120" y2="70" stroke="#64748b" stroke-width="1"/>
      <line x1="60" y1="0" x2="60" y2="80" stroke="#64748b" stroke-width="1"/>
      <!-- ReLU function -->
      <line x1="10" y1="70" x2="60" y2="70" stroke="#16a34a" stroke-width="3"/>
      <line x1="60" y1="70" x2="110" y2="20" stroke="#16a34a" stroke-width="3"/>
      <!-- Labels -->
      <text x="55" y="82" font-family="Arial, sans-serif" font-size="9" fill="#64748b">0</text>
    </g>
    
    <!-- Formula and description -->
    <text x="620" y="305" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#166534">f(z) = max(0, z)</text>
    <text x="620" y="325" font-family="Arial, sans-serif" font-size="10" fill="#475569">• Output: [0, ∞)</text>
    <text x="620" y="340" font-family="Arial, sans-serif" font-size="10" fill="#475569">• Computationally efficient</text>
    <text x="620" y="355" font-family="Arial, sans-serif" font-size="10" fill="#475569">• Most popular in deep learning</text>
    <text x="620" y="370" font-family="Arial, sans-serif" font-size="10" fill="#475569">• Simple operation</text>
  </g>
  
  <!-- Comparison table -->
  <g id="comparison-table">
    <rect x="50" y="420" width="800" height="180" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
    <text x="450" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">Function Comparison Summary</text>
    
    <!-- Table headers -->
    <rect x="70" y="460" width="760" height="25" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
    <text x="85" y="477" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">Function</text>
    <text x="200" y="477" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">Range</text>
    <text x="300" y="477" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">Differentiable</text>
    <text x="420" y="477" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">Computational Cost</text>
    <text x="600" y="477" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">Primary Use</text>
    
    <!-- Table rows -->
    <!-- Binary Step -->
    <rect x="70" y="485" width="760" height="20" fill="white" stroke="#94a3b8" stroke-width="1"/>
    <text x="85" y="498" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">Binary Step</text>
    <text x="200" y="498" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">{0, 1}</text>
    <text x="300" y="498" font-family="Arial, sans-serif" font-size="10" fill="#dc2626">❌ No</text>
    <text x="420" y="498" font-family="Arial, sans-serif" font-size="10" fill="#16a34a">Very Low</text>
    <text x="600" y="498" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">Historical/Thresholding</text>
    
    <!-- Sigmoid -->
    <rect x="70" y="505" width="760" height="20" fill="#fefce8" stroke="#94a3b8" stroke-width="1"/>
    <text x="85" y="518" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">Sigmoid</text>
    <text x="200" y="518" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">(0, 1)</text>
    <text x="300" y="518" font-family="Arial, sans-serif" font-size="10" fill="#16a34a">✅ Yes</text>
    <text x="420" y="518" font-family="Arial, sans-serif" font-size="10" fill="#f59e0b">Medium</text>
    <text x="600" y="518" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">Binary Classification Output</text>
    
    <!-- Tanh -->
    <rect x="70" y="525" width="760" height="20" fill="white" stroke="#94a3b8" stroke-width="1"/>
    <text x="85" y="538" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">Tanh</text>
    <text x="200" y="538" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">(-1, 1)</text>
    <text x="300" y="538" font-family="Arial, sans-serif" font-size="10" fill="#16a34a">✅ Yes</text>
    <text x="420" y="538" font-family="Arial, sans-serif" font-size="10" fill="#f59e0b">Medium</text>
    <text x="600" y="538" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">Hidden Layers</text>
    
    <!-- ReLU -->
    <rect x="70" y="545" width="760" height="20" fill="#f0fdf4" stroke="#94a3b8" stroke-width="1"/>
    <text x="85" y="558" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">ReLU</text>
    <text x="200" y="558" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">[0, ∞)</text>
    <text x="300" y="558" font-family="Arial, sans-serif" font-size="10" fill="#f59e0b">✅ Yes*</text>
    <text x="420" y="558" font-family="Arial, sans-serif" font-size="10" fill="#16a34a">Very Low</text>
    <text x="600" y="558" font-family="Arial, sans-serif" font-size="10" fill="#1e293b">Hidden Layers (Modern)</text>
  </g>
  
  <!-- Key insights -->
  <g id="key-insights">
    <rect x="50" y="620" width="800" height="60" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
    <text x="450" y="640" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#991b1b">🔑 Key Insights</text>
    <text x="60" y="658" font-family="Arial, sans-serif" font-size="11" fill="#7f1d1d">• Activation functions introduce non-linearity, enabling complex pattern recognition</text>
    <text x="60" y="673" font-family="Arial, sans-serif" font-size="11" fill="#7f1d1d">• ReLU is most popular in modern deep networks due to computational efficiency and performance</text>
  </g>
</svg>