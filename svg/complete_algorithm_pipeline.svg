<svg viewBox="0 0 1000 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="500" y="35" font-size="24" font-weight="bold" text-anchor="middle" fill="#2C3E50">
    Complete Algorithm Pipeline
  </text>
  <text x="500" y="60" font-size="14" text-anchor="middle" fill="#7F8C8D">
    End-to-End: Ratings → Personalized Rankings
  </text>
  
  <!-- Stage 1: Data Transformation -->
  <rect x="100" y="90" width="800" height="120" fill="#E8F4F8" stroke="#3498DB" stroke-width="3" rx="10"/>
  <text x="500" y="120" font-size="18" font-weight="bold" text-anchor="middle" fill="#2C3E50">
    Stage 1: Data Transformation
  </text>
  
  <g transform="translate(130, 135)">
    <rect x="0" y="0" width="200" height="55" fill="white" stroke="#3498DB" stroke-width="1" rx="5"/>
    <text x="100" y="20" font-size="12" font-weight="bold" text-anchor="middle" fill="#2C3E50">Input</text>
    <text x="100" y="38" font-size="10" text-anchor="middle" fill="#34495E">User ratings or</text>
    <text x="100" y="50" font-size="10" text-anchor="middle" fill="#34495E">explicit comparisons</text>
  </g>
  
  <path d="M 340 162 L 380 162" stroke="#7F8C8D" stroke-width="2" marker-end="url(#arrow)"/>
  
  <g transform="translate(390, 135)">
    <rect x="0" y="0" width="180" height="55" fill="#3498DB" stroke="#3498DB" stroke-width="1" rx="5"/>
    <text x="90" y="25" font-size="11" font-weight="bold" text-anchor="middle" fill="white">Transform</text>
    <text x="90" y="42" font-size="9" text-anchor="middle" fill="white">Rating(A) &gt; Rating(B)</text>
    <text x="90" y="53" font-size="9" text-anchor="middle" fill="white">→ Comparison = +1</text>
  </g>
  
  <path d="M 580 162 L 620 162" stroke="#7F8C8D" stroke-width="2" marker-end="url(#arrow)"/>
  
  <g transform="translate(630, 135)">
    <rect x="0" y="0" width="200" height="55" fill="white" stroke="#3498DB" stroke-width="1" rx="5"/>
    <text x="100" y="20" font-size="12" font-weight="bold" text-anchor="middle" fill="#2C3E50">Output</text>
    <text x="100" y="38" font-size="10" text-anchor="middle" fill="#34495E">Comparison matrix</text>
    <text x="100" y="50" font-size="10" text-anchor="middle" fill="#34495E">(+1, -1, missing)</text>
  </g>
  
  <!-- Arrow down -->
  <path d="M 500 220 L 500 260" stroke="#7F8C8D" stroke-width="3" marker-end="url(#arrow)"/>
  
  <!-- Stage 2: Collaborative Filtering -->
  <rect x="100" y="270" width="800" height="120" fill="#FEF5E7" stroke="#E67E22" stroke-width="3" rx="10"/>
  <text x="500" y="300" font-size="18" font-weight="bold" text-anchor="middle" fill="#2C3E50">
    Stage 2: Collaborative Filtering
  </text>
  
  <g transform="translate(130, 315)">
    <rect x="0" y="0" width="200" height="55" fill="white" stroke="#E67E22" stroke-width="1" rx="5"/>
    <text x="100" y="20" font-size="12" font-weight="bold" text-anchor="middle" fill="#2C3E50">Input</text>
    <text x="100" y="38" font-size="10" text-anchor="middle" fill="#34495E">Sparse comparison</text>
    <text x="100" y="50" font-size="10" text-anchor="middle" fill="#34495E">matrix with missing</text>
  </g>
  
  <path d="M 340 342 L 350 342" stroke="#7F8C8D" stroke-width="2" marker-end="url(#arrow)"/>
  
  <g transform="translate(360, 315)">
    <rect x="0" y="0" width="210" height="55" fill="#E67E22" stroke="#E67E22" stroke-width="1" rx="5"/>
    <text x="105" y="18" font-size="11" font-weight="bold" text-anchor="middle" fill="white">Matrix Completion</text>
    <text x="105" y="32" font-size="9" text-anchor="middle" fill="white">1. Cosine similarity</text>
    <text x="105" y="44" font-size="9" text-anchor="middle" fill="white">2. Weighted prediction</text>
    <text x="105" y="55" font-size="9" text-anchor="middle" fill="white">Σ(sim × pref) / Σ|sim|</text>
  </g>
  
  <path d="M 580 342 L 620 342" stroke="#7F8C8D" stroke-width="2" marker-end="url(#arrow)"/>
  
  <g transform="translate(630, 315)">
    <rect x="0" y="0" width="200" height="55" fill="white" stroke="#E67E22" stroke-width="1" rx="5"/>
    <text x="100" y="20" font-size="12" font-weight="bold" text-anchor="middle" fill="#2C3E50">Output</text>
    <text x="100" y="38" font-size="10" text-anchor="middle" fill="#34495E">Predicted scores</text>
    <text x="100" y="50" font-size="10" text-anchor="middle" fill="#34495E">in range [-1, +1]</text>
  </g>
  
  <!-- Arrow down -->
  <path d="M 500 400 L 500 440" stroke="#7F8C8D" stroke-width="3" marker-end="url(#arrow)"/>
  
  <!-- Stage 3: Probability Conversion -->
  <rect x="100" y="450" width="800" height="120" fill="#E8F8F5" stroke="#27AE60" stroke-width="3" rx="10"/>
  <text x="500" y="480" font-size="18" font-weight="bold" text-anchor="middle" fill="#2C3E50">
    Stage 3: Probability Conversion
  </text>
  
  <g transform="translate(130, 495)">
    <rect x="0" y="0" width="200" height="55" fill="white" stroke="#27AE60" stroke-width="1" rx="5"/>
    <text x="100" y="20" font-size="12" font-weight="bold" text-anchor="middle" fill="#2C3E50">Input</text>
    <text x="100" y="38" font-size="10" text-anchor="middle" fill="#34495E">Comparison scores</text>
    <text x="100" y="50" font-size="10" text-anchor="middle" fill="#34495E">X ∈ [-1, +1]</text>
  </g>
  
  <path d="M 340 522 L 400 522" stroke="#7F8C8D" stroke-width="2" marker-end="url(#arrow)"/>
  
  <g transform="translate(410, 495)">
    <rect x="0" y="0" width="150" height="55" fill="#27AE60" stroke="#27AE60" stroke-width="1" rx="5"/>
    <text x="75" y="25" font-size="11" font-weight="bold" text-anchor="middle" fill="white">Convert</text>
    <text x="75" y="42" font-size="13" font-weight="bold" text-anchor="middle" fill="white">B = (X + 1) / 2</text>
  </g>
  
  <path d="M 570 522 L 620 522" stroke="#7F8C8D" stroke-width="2" marker-end="url(#arrow)"/>
  
  <g transform="translate(630, 495)">
    <rect x="0" y="0" width="200" height="55" fill="white" stroke="#27AE60" stroke-width="1" rx="5"/>
    <text x="100" y="20" font-size="12" font-weight="bold" text-anchor="middle" fill="#2C3E50">Output</text>
    <text x="100" y="38" font-size="10" text-anchor="middle" fill="#34495E">Winning probabilities</text>
    <text x="100" y="50" font-size="10" text-anchor="middle" fill="#34495E">B ∈ [0, 1]</text>
  </g>
  
  <!-- Arrow down -->
  <path d="M 500 580 L 500 620" stroke="#7F8C8D" stroke-width="3" marker-end="url(#arrow)"/>
  
  <!-- Stage 4: Rank Centrality -->
  <rect x="100" y="630" width="800" height="120" fill="#F4ECF7" stroke="#9B59B6" stroke-width="3" rx="10"/>
  <text x="500" y="660" font-size="18" font-weight="bold" text-anchor="middle" fill="#2C3E50">
    Stage 4: Rank Centrality
  </text>
  
  <g transform="translate(130, 675)">
    <rect x="0" y="0" width="200" height="55" fill="white" stroke="#9B59B6" stroke-width="1" rx="5"/>
    <text x="100" y="20" font-size="12" font-weight="bold" text-anchor="middle" fill="#2C3E50">Input</text>
    <text x="100" y="38" font-size="10" text-anchor="middle" fill="#34495E">Pairwise winning</text>
    <text x="100" y="50" font-size="10" text-anchor="middle" fill="#34495E">probabilities</text>
  </g>
  
  <path d="M 340 702 L 370 702" stroke="#7F8C8D" stroke-width="2" marker-end="url(#arrow)"/>
  
  <g transform="translate(380, 675)">
    <rect x="0" y="0" width="190" height="55" fill="#9B59B6" stroke="#9B59B6" stroke-width="1" rx="5"/>
    <text x="95" y="20" font-size="11" font-weight="bold" text-anchor="middle" fill="white">Rank Centrality</text>
    <text x="95" y="35" font-size="9" text-anchor="middle" fill="white">Build weighted graph</text>
    <text x="95" y="48" font-size="9" text-anchor="middle" fill="white">Compute rankings from</text>
    <text x="95" y="59" font-size="9" text-anchor="middle" fill="white">aggregated scores</text>
  </g>
  
  <path d="M 580 702 L 620 702" stroke="#7F8C8D" stroke-width="2" marker-end="url(#arrow)"/>
  
  <g transform="translate(630, 675)">
    <rect x="0" y="0" width="200" height="55" fill="white" stroke="#9B59B6" stroke-width="1" rx="5"/>
    <text x="100" y="20" font-size="12" font-weight="bold" text-anchor="middle" fill="#2C3E50">Output</text>
    <text x="100" y="38" font-size="10" text-anchor="middle" fill="#27AE60" font-weight="bold">Personalized</text>
    <text x="100" y="50" font-size="10" text-anchor="middle" fill="#27AE60" font-weight="bold">Rankings!</text>
  </g>
  
  <!-- Summary box -->
  <rect x="100" y="775" width="800" height="100" fill="#ECF0F1" stroke="#34495E" stroke-width="2" rx="10"/>
  <text x="500" y="805" font-size="15" font-weight="bold" text-anchor="middle" fill="#2C3E50">
    Pipeline Summary
  </text>
  <text x="500" y="830" font-size="12" text-anchor="middle" fill="#34495E">
    Ratings → Comparisons → Collaborative Filtering → Probabilities → Rank Centrality → Rankings
  </text>
  <text x="500" y="850" font-size="11" text-anchor="middle" fill="#7F8C8D">
    Two classic algorithms combined: Matrix Completion + Global Ranking from Pairwise Comparisons
  </text>
  <text x="500" y="865" font-size="11" font-weight="bold" text-anchor="middle" fill="#27AE60">
    Result: Personalized item rankings for each user based on comparison data
  </text>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#7F8C8D"/>
    </marker>
  </defs>
</svg>