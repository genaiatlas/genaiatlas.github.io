<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .chart-title { font-family: 'Arial', sans-serif; font-size: 18px; font-weight: bold; text-anchor: middle; }
      .axis-label { font-family: 'Arial', sans-serif; font-size: 14px; text-anchor: middle; }
      .legend-text { font-family: 'Arial', sans-serif; font-size: 12px; }
      .grid-line { stroke: #e0e0e0; stroke-width: 1; }
      .axis-line { stroke: #333; stroke-width: 2; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="400" fill="#fafafa"/>
  
  <!-- Chart Title -->
  <text x="300" y="30" class="chart-title">Training vs Validation Error: Overfitting Pattern</text>
  
  <!-- Grid Lines -->
  <g class="grid">
    <!-- Horizontal grid lines -->
    <line x1="80" y1="100" x2="520" y2="100" class="grid-line"/>
    <line x1="80" y1="150" x2="520" y2="150" class="grid-line"/>
    <line x1="80" y1="200" x2="520" y2="200" class="grid-line"/>
    <line x1="80" y1="250" x2="520" y2="250" class="grid-line"/>
    <line x1="80" y1="300" x2="520" y2="300" class="grid-line"/>
    
    <!-- Vertical grid lines -->
    <line x1="140" y1="50" x2="140" y2="320" class="grid-line"/>
    <line x1="200" y1="50" x2="200" y2="320" class="grid-line"/>
    <line x1="260" y1="50" x2="260" y2="320" class="grid-line"/>
    <line x1="320" y1="50" x2="320" y2="320" class="grid-line"/>
    <line x1="380" y1="50" x2="380" y2="320" class="grid-line"/>
    <line x1="440" y1="50" x2="440" y2="320" class="grid-line"/>
    <line x1="500" y1="50" x2="500" y2="320" class="grid-line"/>
  </g>
  
  <!-- Axes -->
  <line x1="80" y1="50" x2="80" y2="320" class="axis-line"/>
  <line x1="80" y1="320" x2="520" y2="320" class="axis-line"/>
  
  <!-- Training Error Curve (monotonically decreasing) -->
  <path d="M 80 280 Q 140 250 200 220 Q 260 195 320 175 Q 380 160 440 150 Q 480 145 520 140" 
        stroke="#ff6b35" stroke-width="3" fill="none"/>
  
  <!-- Validation Error Curve (U-shaped) -->
  <path d="M 80 260 Q 140 220 200 180 Q 260 160 320 170 Q 380 185 440 210 Q 480 230 520 250" 
        stroke="#4a90e2" stroke-width="3" fill="none"/>
  
  <!-- Optimal Point Marker -->
  <circle cx="320" cy="170" r="6" fill="#2d5aa0" stroke="#fff" stroke-width="2"/>
  <text x="330" y="165" class="legend-text" fill="#2d5aa0">Optimal Depth</text>
  
  <!-- Overfitting Zone -->
  <rect x="340" y="50" width="180" height="270" fill="rgba(255, 107, 53, 0.1)" stroke="none"/>
  <text x="430" y="80" class="legend-text" fill="#ff6b35" text-anchor="middle">Overfitting Zone</text>
  
  <!-- Y-axis labels -->
  <text x="70" y="105" class="legend-text" text-anchor="end">0.30</text>
  <text x="70" y="155" class="legend-text" text-anchor="end">0.25</text>
  <text x="70" y="205" class="legend-text" text-anchor="end">0.20</text>
  <text x="70" y="255" class="legend-text" text-anchor="end">0.15</text>
  <text x="70" y="305" class="legend-text" text-anchor="end">0.10</text>
  
  <!-- X-axis labels -->
  <text x="80" y="340" class="legend-text" text-anchor="middle">1</text>
  <text x="140" y="340" class="legend-text" text-anchor="middle">2</text>
  <text x="200" y="340" class="legend-text" text-anchor="middle">3</text>
  <text x="260" y="340" class="legend-text" text-anchor="middle">4</text>
  <text x="320" y="340" class="legend-text" text-anchor="middle">5</text>
  <text x="380" y="340" class="legend-text" text-anchor="middle">6</text>
  <text x="440" y="340" class="legend-text" text-anchor="middle">7</text>
  <text x="500" y="340" class="legend-text" text-anchor="middle">8</text>
  
  <!-- Axis Labels -->
  <text x="300" y="370" class="axis-label">Max Tree Depth</text>
  <text x="25" y="185" class="axis-label" transform="rotate(-90 25 185)">Misclassification Error</text>
  
  <!-- Legend -->
  <g transform="translate(440, 110)">
    <rect x="0" y="0" width="140" height="60" fill="white" stroke="#ccc" stroke-width="1"/>
    <line x1="10" y1="20" x2="30" y2="20" stroke="#ff6b35" stroke-width="3"/>
    <text x="35" y="25" class="legend-text">Training Error</text>
    <line x1="10" y1="40" x2="30" y2="40" stroke="#4a90e2" stroke-width="3"/>
    <text x="35" y="45" class="legend-text">Validation Error</text>
  </g>
</svg>