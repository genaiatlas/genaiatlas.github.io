<svg width="800" height="650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'Arial', sans-serif; font-size: 20px; font-weight: bold; fill: #2c3e50; }
      .subtitle { font-family: 'Arial', sans-serif; font-size: 16px; fill: #34495e; font-weight: bold; }
      .section-title { font-family: 'Arial', sans-serif; font-size: 14px; fill: #34495e; font-weight: bold; }
      .description { font-family: 'Arial', sans-serif; font-size: 12px; fill: #34495e; }
      .small-text { font-family: 'Arial', sans-serif; font-size: 10px; fill: #34495e; }
      .equation { font-family: 'Times New Roman', serif; font-size: 14px; fill: #2c3e50; }
      .box { fill: #f8f9fa; stroke: #dee2e6; stroke-width: 2; rx: 8; }
      .problem-box { fill: #ffebee; stroke: #d32f2f; stroke-width: 2; rx: 8; }
      .solution-box { fill: #e8f5e8; stroke: #388e3c; stroke-width: 2; rx: 8; }
      .warning-box { fill: #fff3cd; stroke: #ffc107; stroke-width: 2; rx: 8; }
      .model-good { fill: #27ae60; stroke: #229954; stroke-width: 2; rx: 4; }
      .model-bad { fill: #95a5a6; stroke: #7f8c8d; stroke-width: 2; rx: 4; }
      .model-lucky { fill: #f39c12; stroke: #e67e22; stroke-width: 2; rx: 4; }
      .arrow { stroke: #34495e; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .danger-arrow { stroke: #e74c3c; stroke-width: 3; fill: none; marker-end: url(#redarrowhead); }
      .axis-line { stroke: #34495e; stroke-width: 2; }
      .probability-bar { fill: #e74c3c; stroke: #c0392b; stroke-width: 1; }
      .warning-color { fill: #e74c3c; font-weight: bold; }
      .solution-color { fill: #27ae60; font-weight: bold; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e" />
    </marker>
    <marker id="redarrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c" />
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="650" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="400" y="25" text-anchor="middle" class="title">The Risk of Validation Set Overfitting</text>
  
  <!-- Problem Illustration -->
  <rect x="50" y="50" width="700" height="140" class="problem-box"/>
  <text x="400" y="75" text-anchor="middle" class="subtitle" fill="#d32f2f">The Multiple Comparison Problem</text>
  
  <!-- Many models visualization -->
  <g transform="translate(100, 100)">
    <text x="0" y="15" class="section-title">Testing 1000 Different Models on Same Validation Set</text>
    
    <!-- Grid of models -->
    <g transform="translate(0, 25)">
      <!-- Row 1 -->
      <rect x="0" y="0" width="20" height="15" class="model-bad"/>
      <rect x="25" y="0" width="20" height="15" class="model-bad"/>
      <rect x="50" y="0" width="20" height="15" class="model-bad"/>
      <text x="75" y="12" class="small-text">...</text>
      <rect x="100" y="0" width="20" height="15" class="model-lucky"/>
      <text x="125" y="12" class="small-text">...</text>
      <rect x="150" y="0" width="20" height="15" class="model-bad"/>
      <text x="175" y="12" class="small-text">Model 1-200</text>
      
      <!-- Row 2 -->
      <rect x="0" y="20" width="20" height="15" class="model-bad"/>
      <rect x="25" y="20" width="20" height="15" class="model-bad"/>
      <rect x="50" y="20" width="20" height="15" class="model-bad"/>
      <text x="75" y="32" class="small-text">...</text>
      <rect x="100" y="20" width="20" height="15" class="model-bad"/>
      <text x="125" y="32" class="small-text">...</text>
      <rect x="150" y="20" width="20" height="15" class="model-bad"/>
      <text x="175" y="32" class="small-text">Model 201-400</text>
      
      <!-- Row 3 -->
      <rect x="0" y="40" width="20" height="15" class="model-bad"/>
      <rect x="25" y="40" width="20" height="15" class="model-bad"/>
      <rect x="50" y="40" width="20" height="15" class="model-bad"/>
      <text x="75" y="52" class="small-text">...</text>
      <rect x="100" y="40" width="20" height="15" class="model-bad"/>
      <text x="125" y="52" class="small-text">...</text>
      <rect x="150" y="40" width="20" height="15" class="model-bad"/>
      <text x="175" y="52" class="small-text">Model 401-600</text>
      
      <!-- Row 4 -->
      <rect x="0" y="60" width="20" height="15" class="model-bad"/>
      <rect x="25" y="60" width="20" height="15" class="model-bad"/>
      <rect x="50" y="60" width="20" height="15" class="model-bad"/>
      <text x="75" y="72" class="small-text">...</text>
      <rect x="100" y="60" width="20" height="15" class="model-bad"/>
      <text x="125" y="72" class="small-text">...</text>
      <rect x="150" y="60" width="20" height="15" class="model-bad"/>
      <text x="175" y="72" class="small-text">Model 601-800</text>
      
      <!-- Row 5 -->
      <rect x="0" y="80" width="20" height="15" class="model-bad"/>
      <rect x="25" y="80" width="20" height="15" class="model-bad"/>
      <rect x="50" y="80" width="20" height="15" class="model-bad"/>
      <text x="75" y="92" class="small-text">...</text>
      <rect x="100" y="80" width="20" height="15" class="model-bad"/>
      <text x="125" y="92" class="small-text">...</text>
      <rect x="150" y="80" width="20" height="15" class="model-bad"/>
      <text x="175" y="92" class="small-text">Model 801-1000</text>
    </g>
    
    <!-- Danger arrow pointing to lucky model -->
    <path d="M 350 60 Q 320 40 110 25" class="danger-arrow"/>
    <text x="360" y="55" class="warning-color">"Lucky" Model</text>
    <text x="360" y="70" class="description">Performs well by chance,</text>
    <text x="360" y="85" class="description">not true superiority</text>
  </g>
  
  <!-- Statistical Analysis -->
  <rect x="50" y="210" width="340" height="160" class="box"/>
  <text x="220" y="235" text-anchor="middle" class="subtitle">Statistical Reality</text>
  
  <!-- Probability calculation -->
  <text x="70" y="260" class="equation">P(at least one "lucky" model) = 1 - (1 - α)ⁿ</text>
  <text x="70" y="280" class="description">where α = significance level, n = number of models</text>
  
  <!-- Examples -->
  <text x="70" y="305" class="description" font-weight="bold">Examples:</text>
  <text x="70" y="320" class="description">• n = 10 models, α = 0.05 → P(lucky) = 40%</text>
  <text x="70" y="335" class="description">• n = 100 models, α = 0.05 → P(lucky) = 99.4%</text>
  <text x="70" y="350" class="description">• n = 1000 models, α = 0.05 → P(lucky) ≈ 100%</text>
  
  <!-- Probability visualization -->
  <g transform="translate(410, 210)">
    <rect x="0" y="0" width="340" height="160" class="warning-box"/>
    <text x="170" y="25" text-anchor="middle" class="subtitle" fill="#856404">Probability of Lucky Model</text>
    
    <!-- Bar chart -->
    <g transform="translate(30, 50)">
      <!-- Axes -->
      <line x1="0" y1="80" x2="250" y2="80" class="axis-line"/>
      <line x1="0" y1="0" x2="0" y2="85" class="axis-line"/>
      
      <!-- Bars -->
      <rect x="20" y="60" width="30" height="20" class="probability-bar"/>
      <text x="35" y="100" text-anchor="middle" class="small-text">10</text>
      <text x="35" y="55" text-anchor="middle" class="small-text" fill="white">40%</text>
      
      <rect x="70" y="5" width="30" height="75" class="probability-bar"/>
      <text x="85" y="100" text-anchor="middle" class="small-text">100</text>
      <text x="85" y="47" text-anchor="middle" class="small-text" fill="white">99%</text>
      
      <rect x="120" y="0" width="30" height="80" class="probability-bar"/>
      <text x="135" y="100" text-anchor="middle" class="small-text">1000</text>
      <text x="135" y="45" text-anchor="middle" class="small-text" fill="white">~100%</text>
      
      <!-- Labels -->
      <text x="125" y="120" text-anchor="middle" class="small-text">Number of Models Tested</text>
      <text x="-20" y="40" text-anchor="middle" class="small-text" transform="rotate(-90 -20 40)">P(Lucky Model)</text>
    </g>
  </g>
  
  <!-- The Solution -->
  <rect x="50" y="390" width="700" height="140" class="solution-box"/>
  <text x="400" y="415" text-anchor="middle" class="subtitle" fill="#388e3c">Solution: Three-Way Data Split</text>
  
  <!-- Three-way split visualization -->
  <g transform="translate(100, 440)">
    <text x="300" y="15" text-anchor="middle" class="section-title">Reserve Final Test Set for Unbiased Evaluation</text>
    
    <!-- Training set -->
    <rect x="0" y="25" width="240" height="30" fill="#3498db" stroke="#2980b9" stroke-width="2" rx="4"/>
    <text x="120" y="45" text-anchor="middle" class="description" fill="white">Training Set (60%)</text>
    
    <!-- Validation set -->
    <rect x="250" y="25" width="120" height="30" fill="#f39c12" stroke="#e67e22" stroke-width="2" rx="4"/>
    <text x="310" y="45" text-anchor="middle" class="description" fill="white">Validation (20%)</text>
    
    <!-- Test set -->
    <rect x="380" y="25" width="120" height="30" fill="#e74c3c" stroke="#c0392b" stroke-width="2" rx="4"/>
    <text x="440" y="45" text-anchor="middle" class="description" fill="white">Test Set (20%)</text>
    
    <!-- Process arrows -->
    <path d="M 120 70 L 120 85" class="arrow"/>
    <text x="120" y="100" text-anchor="middle" class="small-text">Train Models</text>
    
    <path d="M 310 70 L 310 85" class="arrow"/>
    <text x="310" y="100" text-anchor="middle" class="small-text">Select Best</text>
    
    <path d="M 440 70 L 440 85" class="arrow"/>
    <text x="440" y="100" text-anchor="middle" class="small-text">Final Eval</text>
    <text x="440" y="115" text-anchor="middle" class="small-text solution-color">(Only Once!)</text>
  </g>
  
  <!-- Key Principles -->
  <rect x="50" y="550" width="700" height="80" class="box"/>
  <text x="400" y="575" text-anchor="middle" class="subtitle">Critical Guidelines for Test Set</text>
  
  <text x="70" y="600" class="description">• <span class="solution-color font-weight: bold;">Test Set Sanctity:</span> Never use test data for any model decisions or hyperparameter tuning</text>
  <text x="70" y="615" class="description">• <span class="solution-color font-weight: bold;">Single Evaluation:</span> Evaluate on test set only once, at the very end of the project</text>
  <text x="70" y="630" class="description">• <span class="solution-color font-weight: bold;">Honest Reporting:</span> Report test error as the final, unbiased performance estimate</text>
</svg>