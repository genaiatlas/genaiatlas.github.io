<svg viewBox="0 0 800 650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: bold; }
      .section-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 600; }
      .label-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: 600; }
      .desc-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; }
      .small-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10px; }
      .gradient-bg { fill: url(#bgGradient); }
      .critical-card { fill: #ffebee; stroke: #f44336; stroke-width: 2; rx: 8; ry: 8; }
      .warning-card { fill: #fff3e0; stroke: #ff9800; stroke-width: 2; rx: 8; ry: 8; }
      .info-card { fill: #e3f2fd; stroke: #2196f3; stroke-width: 2; rx: 8; ry: 8; }
      .success-card { fill: #e8f5e8; stroke: #4caf50; stroke-width: 2; rx: 8; ry: 8; }
      .attack-arrow { stroke: #f44336; stroke-width: 2; fill: none; marker-end: url(#attackhead); stroke-dasharray: 4,2; }
    </style>
    
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
    
    <marker id="attackhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f44336" />
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="650" class="gradient-bg"/>
  
  <!-- Title -->
  <text x="400" y="25" text-anchor="middle" class="title-text" fill="#1565C0">Real-World Security Implications of Adversarial Examples</text>

  <!-- Autonomous Vehicles Section -->
  <rect x="50" y="50" width="340" height="140" class="critical-card"/>
  
  <!-- Car icon -->
  <rect x="65" y="71" width="30" height="12" fill="#2196F3" rx="2"/>
  <rect x="71" y="68" width="18" height="6" fill="#1976D2" rx="1"/>
  <circle cx="73" cy="85" r="3" fill="#424242"/>
  <circle cx="87" cy="85" r="3" fill="#424242"/>
  
  <text x="110" y="80" class="label-text" fill="#C62828">Autonomous Vehicles</text>
  
  <text x="65" y="105" class="desc-text" fill="#D32F2F">Critical Vulnerabilities:</text>
  <text x="70" y="120" class="small-text" fill="#D32F2F">• Stop signs misclassified as speed limits</text>
  <text x="70" y="135" class="small-text" fill="#D32F2F">• Pedestrian detection failures</text>
  <text x="70" y="150" class="small-text" fill="#D32F2F">• Traffic light confusion (red to green)</text>
  <text x="70" y="165" class="small-text" fill="#D32F2F">• Lane marking manipulation</text>
  
  <rect x="250" y="110" width="125" height="65" fill="#ffcccb" stroke="#f44336" stroke-width="1" rx="4"/>
  <text x="312" y="125" text-anchor="middle" class="small-text" fill="#B71C1C">Potential Impact</text>
  <text x="260" y="140" class="small-text" fill="#C62828">Fatal accidents</text>
  <text x="260" y="152" class="small-text" fill="#C62828">Traffic disruption</text>
  <text x="260" y="164" class="small-text" fill="#C62828">Loss of public trust</text>

  <!-- Medical Diagnosis Section -->
  <rect x="410" y="50" width="340" height="140" class="critical-card"/>
  
  <!-- Medical icon -->
  <rect x="430" y="65" width="20" height="25" fill="#4CAF50" rx="3"/>
  <rect x="437" y="72" width="6" height="11" fill="white"/>
  <rect x="434" y="75" width="12" height="5" fill="white"/>
  
  <text x="470" y="80" class="label-text" fill="#C62828">Medical AI Systems</text>
  
  <text x="425" y="105" class="desc-text" fill="#D32F2F">Critical Vulnerabilities:</text>
  <text x="430" y="120" class="small-text" fill="#D32F2F">• Radiology: Tumors missed or falsely detected</text>
  <text x="430" y="135" class="small-text" fill="#D32F2F">• Drug recommendations altered</text>
  <text x="430" y="150" class="small-text" fill="#D32F2F">• Diagnostic confidence manipulation</text>
  <text x="430" y="165" class="small-text" fill="#D32F2F">• Patient triage system failures</text>
  
  <rect x="610" y="110" width="125" height="65" fill="#ffcccb" stroke="#f44336" stroke-width="1" rx="4"/>
  <text x="672" y="125" text-anchor="middle" class="small-text" fill="#B71C1C">Potential Impact</text>
  <text x="620" y="140" class="small-text" fill="#C62828">Misdiagnosis</text>
  <text x="620" y="152" class="small-text" fill="#C62828">Wrong treatment</text>
  <text x="620" y="164" class="small-text" fill="#C62828">Patient harm</text>

  <!-- Financial Services Section -->
  <rect x="50" y="210" width="340" height="140" class="warning-card"/>
  
  <!-- Bank icon -->
  <polygon points="80,227 67,237 93,237" fill="#FF9800"/>
  <rect x="70" y="237" width="20" height="12" fill="#F57C00"/>
  <rect x="73" y="240" width="3" height="6" fill="#FFA726"/>
  <rect x="77" y="240" width="3" height="6" fill="#FFA726"/>
  <rect x="81" y="240" width="3" height="6" fill="#FFA726"/>
  <rect x="85" y="240" width="3" height="6" fill="#FFA726"/>
  
  <text x="110" y="245" class="label-text" fill="#E65100">Financial Services</text>
  
  <text x="65" y="270" class="desc-text" fill="#EF6C00">Security Risks:</text>
  <text x="70" y="285" class="small-text" fill="#F57C00">• Credit scoring manipulation</text>
  <text x="70" y="300" class="small-text" fill="#F57C00">• Fraudulent loan approvals</text>
  <text x="70" y="315" class="small-text" fill="#F57C00">• Document verification bypass</text>
  <text x="70" y="330" class="small-text" fill="#F57C00">• Biometric authentication spoofing</text>
  
  <rect x="250" y="270" width="125" height="65" fill="#ffe0b2" stroke="#ff9800" stroke-width="1" rx="4"/>
  <text x="312" y="285" text-anchor="middle" class="small-text" fill="#E65100">Potential Impact</text>
  <text x="260" y="300" class="small-text" fill="#EF6C00">Financial fraud</text>
  <text x="260" y="312" class="small-text" fill="#EF6C00">Identity theft</text>
  <text x="260" y="324" class="small-text" fill="#EF6C00">System compromise</text>

  <!-- Security Systems Section -->
  <rect x="410" y="210" width="340" height="140" class="warning-card"/>
  
  <!-- Camera icon -->
  <rect x="425" y="233" width="20" height="12" fill="#607D8B" rx="2"/>
  <circle cx="439" y="239" r="4" fill="#37474F"/>
  <circle cx="439" cy="239" r="2" fill="#263238"/>
  <rect x="427" y="229" width="4" height="4" fill="#78909C"/>
  
  <text x="470" y="245" class="label-text" fill="#E65100">Security and Surveillance</text>
  
  <text x="425" y="270" class="desc-text" fill="#EF6C00">Security Risks:</text>
  <text x="430" y="285" class="small-text" fill="#F57C00">• Person detection system evasion</text>
  <text x="430" y="300" class="small-text" fill="#F57C00">• Facial recognition bypass</text>
  <text x="430" y="315" class="small-text" fill="#F57C00">• Weapon detection failures</text>
  <text x="430" y="330" class="small-text" fill="#F57C00">• Access control circumvention</text>
  
  <rect x="610" y="270" width="125" height="65" fill="#ffe0b2" stroke="#ff9800" stroke-width="1" rx="4"/>
  <text x="672" y="285" text-anchor="middle" class="small-text" fill="#E65100">Potential Impact</text>
  <text x="620" y="300" class="small-text" fill="#EF6C00">Security breaches</text>
  <text x="620" y="312" class="small-text" fill="#EF6C00">Unauthorized access</text>
  <text x="620" y="324" class="small-text" fill="#EF6C00">Safety threats</text>

  <!-- Attack Vectors Section -->
  <text x="400" y="385" text-anchor="middle" class="section-text" fill="#7B1FA2">Common Attack Vectors</text>
  
  <!-- Physical Attacks -->
  <rect x="50" y="400" width="170" height="100" class="info-card"/>
  <text x="135" y="420" text-anchor="middle" class="label-text" fill="#1565C0">Physical Attacks</text>
  <text x="60" y="440" class="small-text" fill="#1976D2">• Printed adversarial patches</text>
  <text x="60" y="455" class="small-text" fill="#1976D2">• 3D adversarial objects</text>
  <text x="60" y="470" class="small-text" fill="#1976D2">• Environmental modifications</text>
  <text x="60" y="485" class="small-text" fill="#1976D2">• Lighting manipulation</text>

  <!-- Digital Attacks -->
  <rect x="240" y="400" width="170" height="100" class="info-card"/>
  <text x="325" y="420" text-anchor="middle" class="label-text" fill="#1565C0">Digital Attacks</text>
  <text x="250" y="440" class="small-text" fill="#1976D2">• Image preprocessing injection</text>
  <text x="250" y="455" class="small-text" fill="#1976D2">• Network stream manipulation</text>
  <text x="250" y="470" class="small-text" fill="#1976D2">• API exploitation</text>
  <text x="250" y="485" class="small-text" fill="#1976D2">• Model inversion attacks</text>

  <!-- Social Engineering -->
  <rect x="430" y="400" width="170" height="100" class="info-card"/>
  <text x="515" y="420" text-anchor="middle" class="label-text" fill="#1565C0">Social Engineering</text>
  <text x="440" y="440" class="small-text" fill="#1976D2">• Phishing with adversarial images</text>
  <text x="440" y="455" class="small-text" fill="#1976D2">• Deepfake-enhanced attacks</text>
  <text x="440" y="470" class="small-text" fill="#1976D2">• Voice synthesis manipulation</text>
  <text x="440" y="485" class="small-text" fill="#1976D2">• Automated social media bots</text>

  <!-- Economic Impact -->
  <rect x="620" y="400" width="130" height="100" class="warning-card"/>
  <text x="685" y="420" text-anchor="middle" class="label-text" fill="#E65100">Economic Impact</text>
  <text x="630" y="440" class="small-text" fill="#F57C00">Estimated losses:</text>
  <text x="630" y="455" class="small-text" fill="#EF6C00">$2.4B annually</text>
  <text x="630" y="470" class="small-text" fill="#F57C00">Growing 23% yearly</text>
  <text x="630" y="485" class="small-text" fill="#F57C00">Across all sectors</text>

  <!-- Mitigation Strategies -->
  <text x="400" y="535" text-anchor="middle" class="section-text" fill="#2E7D32">Mitigation Strategies</text>
  
  <rect x="50" y="550" width="180" height="80" class="success-card"/>
  <text x="140" y="570" text-anchor="middle" class="label-text" fill="#2E7D32">Technical Defenses</text>
  <text x="60" y="585" class="small-text" fill="#388E3C">• Adversarial training</text>
  <text x="60" y="598" class="small-text" fill="#388E3C">• Input preprocessing</text>
  <text x="60" y="611" class="small-text" fill="#388E3C">• Ensemble methods</text>

  <rect x="250" y="550" width="180" height="80" class="success-card"/>
  <text x="340" y="570" text-anchor="middle" class="label-text" fill="#2E7D32">Detection Systems</text>
  <text x="260" y="585" class="small-text" fill="#388E3C">• Statistical analysis</text>
  <text x="260" y="598" class="small-text" fill="#388E3C">• Uncertainty quantification</text>
  <text x="260" y="611" class="small-text" fill="#388E3C">• Behavioral monitoring</text>

  <rect x="450" y="550" width="180" height="80" class="success-card"/>
  <text x="540" y="570" text-anchor="middle" class="label-text" fill="#2E7D32">System Design</text>
  <text x="460" y="585" class="small-text" fill="#388E3C">• Fail-safe mechanisms</text>
  <text x="460" y="598" class="small-text" fill="#388E3C">• Human oversight</text>
  <text x="460" y="611" class="small-text" fill="#388E3C">• Redundant validation</text>

  <rect x="650" y="550" width="100" height="80" class="info-card"/>
  <text x="700" y="570" text-anchor="middle" class="label-text" fill="#1565C0">Research</text>
  <text x="660" y="585" class="small-text" fill="#1976D2">• Certified defenses</text>
  <text x="660" y="598" class="small-text" fill="#1976D2">• Robust architectures</text>
  <text x="660" y="611" class="small-text" fill="#1976D2">• Formal verification</text>

  <!-- Attack flow arrows (subtle) -->
  <path d="M200 190 Q300 250 400 400" class="attack-arrow" opacity="0.3"/>
  <path d="M600 190 Q500 250 400 400" class="attack-arrow" opacity="0.3"/>
</svg>