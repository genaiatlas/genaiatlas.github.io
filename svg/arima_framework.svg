<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="arimaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498DB;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#2980B9;stop-opacity:0.9"/>
    </linearGradient>
    <linearGradient id="arGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E74C3C;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#C0392B;stop-opacity:0.9"/>
    </linearGradient>
    <linearGradient id="maGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#27AE60;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#229954;stop-opacity:0.9"/>
    </linearGradient>
    <linearGradient id="diffGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F39C12;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#D68910;stop-opacity:0.9"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="700" fill="#FAFAFA"/>
  
  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2C3E50">
    ARIMA Framework: AutoRegressive Integrated Moving Average Models
  </text>
  
  <!-- ARIMA(p,d,q) components -->
  <g transform="translate(100, 80)">
    <text x="350" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2C3E50">
      ARIMA(p,d,q) = AR(p) + I(d) + MA(q)
    </text>
    
    <!-- AR component -->
    <g transform="translate(50, 40)">
      <rect x="0" y="0" width="140" height="80" fill="url(#arGrad)" stroke="#E74C3C" stroke-width="2" rx="8"/>
      <text x="70" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
        AutoRegressive (p)
      </text>
      <text x="70" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
        Y(t) = φ₁Y(t-1) +
      </text>
      <text x="70" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
        φ₂Y(t-2) + ... + φₚY(t-p)
      </text>
      <text x="70" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#FFE8E8">
        Past values predict current
      </text>
    </g>
    
    <!-- Plus sign -->
    <text x="210" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#34495E">+</text>
    
    <!-- I component -->
    <g transform="translate(240, 40)">
      <rect x="0" y="0" width="140" height="80" fill="url(#diffGrad)" stroke="#F39C12" stroke-width="2" rx="8"/>
      <text x="70" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
        Integrated (d)
      </text>
      <text x="70" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
        ∇ᵈY(t) = (1-B)ᵈY(t)
      </text>
      <text x="70" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
        d = differencing order
      </text>
      <text x="70" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#FFF3E0">
        Makes series stationary
      </text>
    </g>
    
    <!-- Plus sign -->
    <text x="400" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#34495E">+</text>
    
    <!-- MA component -->
    <g transform="translate(430, 40)">
      <rect x="0" y="0" width="140" height="80" fill="url(#maGrad)" stroke="#27AE60" stroke-width="2" rx="8"/>
      <text x="70" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
        Moving Average (q)
      </text>
      <text x="70" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
        ε(t) + θ₁ε(t-1) +
      </text>
      <text x="70" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
        θ₂ε(t-2) + ... + θₐε(t-q)
      </text>
      <text x="70" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#E8F5E8">
        Past errors predict current
      </text>
    </g>
  </g>
  
  <!-- Box-Jenkins methodology -->
  <g transform="translate(650, 90)">
    <text x="120" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2C3E50">
      Box-Jenkins Method
    </text>
    
    <!-- Step 1: Identification -->
    <g transform="translate(10, 30)">
      <circle cx="15" cy="15" r="12" fill="#3498DB" stroke="#2980B9" stroke-width="2"/>
      <text x="15" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">1</text>
      <text x="35" y="12" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#3498DB">Identification</text>
      <text x="35" y="25" font-family="Arial, sans-serif" font-size="10" fill="#666">• Check stationarity</text>
      <text x="35" y="37" font-family="Arial, sans-serif" font-size="10" fill="#666">• Examine ACF/PACF</text>
      <text x="35" y="49" font-family="Arial, sans-serif" font-size="10" fill="#666">• Determine p,d,q</text>
    </g>
    
    <!-- Step 2: Estimation -->
    <g transform="translate(10, 90)">
      <circle cx="15" cy="15" r="12" fill="#E74C3C" stroke="#C0392B" stroke-width="2"/>
      <text x="15" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">2</text>
      <text x="35" y="12" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#E74C3C">Estimation</text>
      <text x="35" y="25" font-family="Arial, sans-serif" font-size="10" fill="#666">• Maximum Likelihood</text>
      <text x="35" y="37" font-family="Arial, sans-serif" font-size="10" fill="#666">• Method of Moments</text>
      <text x="35" y="49" font-family="Arial, sans-serif" font-size="10" fill="#666">• Estimate parameters</text>
    </g>
    
    <!-- Step 3: Diagnostic -->
    <g transform="translate(10, 150)">
      <circle cx="15" cy="15" r="12" fill="#27AE60" stroke="#229954" stroke-width="2"/>
      <text x="15" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">3</text>
      <text x="35" y="12" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#27AE60">Diagnostic</text>
      <text x="35" y="25" font-family="Arial, sans-serif" font-size="10" fill="#666">• Residual analysis</text>
      <text x="35" y="37" font-family="Arial, sans-serif" font-size="10" fill="#666">• Ljung-Box test</text>
      <text x="35" y="49" font-family="Arial, sans-serif" font-size="10" fill="#666">• Model adequacy</text>
    </g>
  </g>
  
  <!-- Mathematical details -->
  <g transform="translate(50, 270)">
    <rect x="0" y="0" width="900" height="400" fill="#F8F9FA" stroke="#DDD" stroke-width="1" rx="8" filter="url(#shadow)"/>
    
    <text x="20" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2C3E50">ARIMA Mathematical Framework and Model Selection</text>
    
    <!-- Left column: Model equations -->
    <g transform="translate(30, 60)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#3498DB">General ARIMA(p,d,q):</text>
      <text x="0" y="25" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50">φ(B)(1-B)ᵈY(t) = θ(B)ε(t)</text>
      
      <text x="0" y="60" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#E74C3C">AR Polynomial:</text>
      <text x="0" y="85" font-family="Arial, sans-serif" font-size="13" fill="#2C3E50">φ(B) = 1 - φ₁B - φ₂B² - ... - φₚBᵖ</text>
      
      <text x="0" y="120" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#27AE60">MA Polynomial:</text>
      <text x="0" y="145" font-family="Arial, sans-serif" font-size="13" fill="#2C3E50">θ(B) = 1 + θ₁B + θ₂B² + ... + θₐBᵠ</text>
      
      <text x="0" y="180" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#F39C12">Backshift Operator:</text>
      <text x="0" y="205" font-family="Arial, sans-serif" font-size="13" fill="#2C3E50">BY(t) = Y(t-1), B²Y(t) = Y(t-2)</text>
      
      <text x="0" y="240" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8E44AD">Seasonal ARIMA:</text>
      <text x="0" y="265" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">SARIMA(p,d,q)(P,D,Q)ₛ</text>
      <text x="0" y="285" font-family="Arial, sans-serif" font-size="11" fill="#666">φ(B)Φ(Bˢ)(1-B)ᵈ(1-Bˢ)ᴰY(t) = θ(B)Θ(Bˢ)ε(t)</text>
      
      <text x="0" y="320" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#D35400">Stationarity Conditions:</text>
      <text x="0" y="345" font-family="Arial, sans-serif" font-size="12" fill="#333">• AR: Roots of φ(z) = 0 outside unit circle</text>
      <text x="0" y="360" font-family="Arial, sans-serif" font-size="12" fill="#333">• MA: Roots of θ(z) = 0 outside unit circle</text>
    </g>
    
    <!-- Right column: Model selection and applications -->
    <g transform="translate(450, 60)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#C0392B">Model Selection Criteria:</text>
      <text x="0" y="25" font-family="Arial, sans-serif" font-size="13" fill="#2C3E50">AIC = -2logL + 2k</text>
      <text x="0" y="45" font-family="Arial, sans-serif" font-size="13" fill="#2C3E50">BIC = -2logL + k·log(n)</text>
      <text x="0" y="65" font-family="Arial, sans-serif" font-size="12" fill="#666">where k = p + q + P + Q</text>
      
      <text x="0" y="100" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#16A085">ACF/PACF Patterns:</text>
      <text x="0" y="125" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#E74C3C">AR(p):</text>
      <text x="0" y="140" font-family="Arial, sans-serif" font-size="11" fill="#333">• ACF: Exponential decay</text>
      <text x="0" y="152" font-family="Arial, sans-serif" font-size="11" fill="#333">• PACF: Cuts off at lag p</text>
      
      <text x="0" y="172" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#27AE60">MA(q):</text>
      <text x="0" y="187" font-family="Arial, sans-serif" font-size="11" fill="#333">• ACF: Cuts off at lag q</text>
      <text x="0" y="199" font-family="Arial, sans-serif" font-size="11" fill="#333">• PACF: Exponential decay</text>
      
      <text x="0" y="234" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8E44AD">Forecasting:</text>
      <text x="0" y="259" font-family="Arial, sans-serif" font-size="13" fill="#2C3E50">Ŷ(t+h|t) = E[Y(t+h)|Y(t),Y(t-1),...]</text>
      
      <text x="0" y="294" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#D68910">Forecast Variance:</text>
      <text x="0" y="319" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">Var[e(t+h)] = σ²[1 + ψ₁² + ... + ψₕ₋₁²]</text>
      
      <text x="0" y="350" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#7D3C98">Applications:</text>
      <text x="0" y="375" font-family="Arial, sans-serif" font-size="11" fill="#333">• Economic forecasting • Sales prediction</text>
      <text x="0" y="387" font-family="Arial, sans-serif" font-size="11" fill="#333">• Financial time series • Demand planning</text>
    </g>
  </g>
</svg>