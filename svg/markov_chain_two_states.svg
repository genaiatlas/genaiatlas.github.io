<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow3" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#2c3e50"/>
    </marker>
    <filter id="shadow2">
      <feDropShadow dx="3" dy="3" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Two-State Markov Chain Example
  </text>
  <text x="400" y="70" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#666">
    A vs B: 9 wins for A, 1 win for B (with Laplace correction)
  </text>
  
  <!-- States -->
  <g transform="translate(250, 300)">
    <!-- State A -->
    <circle cx="0" cy="0" r="60" fill="#3498db" stroke="#2980b9" stroke-width="3" filter="url(#shadow2)"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="white">A</text>
    
    <!-- State B -->
    <circle cx="300" cy="0" r="60" fill="#e74c3c" stroke="#c0392b" stroke-width="3" filter="url(#shadow2)"/>
    <text x="300" y="5" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="white">B</text>
    
    <!-- Self loops -->
    <!-- A to A -->
    <path d="M -30 -40 Q -60 -80, -30 -120 Q 0 -140, 30 -120 Q 60 -80, 30 -40" 
          fill="none" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow3)"/>
    <text x="0" y="-125" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">10/12</text>
    
    <!-- B to B -->
    <path d="M 270 -40 Q 240 -80, 270 -120 Q 300 -140, 330 -120 Q 360 -80, 330 -40" 
          fill="none" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow3)"/>
    <text x="300" y="-125" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">2/12</text>
    
    <!-- Transitions between states -->
    <!-- A to B -->
    <path d="M 60 -20 L 240 -20" fill="none" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow3)"/>
    <text x="150" y="-30" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">2/12</text>
    
    <!-- B to A -->
    <path d="M 240 20 L 60 20" fill="none" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow3)"/>
    <text x="150" y="40" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">10/12</text>
  </g>
  
  <!-- Comparison Data Box -->
  <g transform="translate(50, 120)">
    <rect x="0" y="0" width="200" height="120" rx="5" fill="white" stroke="#ddd" stroke-width="1"/>
    <text x="100" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">
      Original Data
    </text>
    <text x="15" y="50" font-family="Arial, sans-serif" font-size="13" fill="#666">A wins: 9 games</text>
    <text x="15" y="70" font-family="Arial, sans-serif" font-size="13" fill="#666">B wins: 1 game</text>
    <text x="15" y="95" font-family="Arial, sans-serif" font-size="13" fill="#666">With Laplace (+1):</text>
    <text x="15" y="115" font-family="Arial, sans-serif" font-size="13" fill="#666">A: 10, B: 2</text>
  </g>
  
  <!-- Transition Matrix -->
  <g transform="translate(550, 120)">
    <rect x="0" y="0" width="200" height="120" rx="5" fill="white" stroke="#ddd" stroke-width="1"/>
    <text x="100" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">
      Transition Matrix P
    </text>
    <text x="40" y="55" font-family="Arial, sans-serif" font-size="13" fill="#666">       A        B</text>
    <text x="40" y="75" font-family="Arial, sans-serif" font-size="13" fill="#666">A  [10/12   2/12]</text>
    <text x="40" y="95" font-family="Arial, sans-serif" font-size="13" fill="#666">B  [10/12   2/12]</text>
  </g>
  
  <!-- Steady State Results -->
  <g transform="translate(200, 450)">
    <rect x="0" y="0" width="400" height="100" rx="10" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2"/>
    <text x="200" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Steady-State Distribution
    </text>
    <text x="200" y="55" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#34495e">
      π_A = 10/12 ≈ 0.833
    </text>
    <text x="200" y="80" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#34495e">
      π_B = 2/12 ≈ 0.167
    </text>
  </g>
</svg>