<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="500" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold" fill="#333">Regression vs Classification</text>
  
  <!-- Regression Section -->
  <g transform="translate(50, 70)">
    <!-- Header -->
    <rect x="0" y="0" width="320" height="50" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="5"/>
    <text x="160" y="30" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#1976d2">🔵 Regression</text>
    
    <!-- Plot area -->
    <rect x="20" y="70" width="280" height="180" fill="white" stroke="#ddd" stroke-width="1"/>
    
    <!-- Axes -->
    <line x1="40" y1="230" x2="280" y2="230" stroke="#333" stroke-width="2"/>
    <line x1="40" y1="230" x2="40" y2="90" stroke="#333" stroke-width="2"/>
    
    <!-- Grid lines -->
    <g stroke="#f0f0f0" stroke-width="1">
      <line x1="40" y1="200" x2="280" y2="200"/>
      <line x1="40" y1="170" x2="280" y2="170"/>
      <line x1="40" y1="140" x2="280" y2="140"/>
      <line x1="40" y1="110" x2="280" y2="110"/>
      
      <line x1="80" y1="230" x2="80" y2="90"/>
      <line x1="120" y1="230" x2="120" y2="90"/>
      <line x1="160" y1="230" x2="160" y2="90"/>
      <line x1="200" y1="230" x2="200" y2="90"/>
      <line x1="240" y1="230" x2="240" y2="90"/>
    </g>
    
    <!-- Regression line -->
    <line x1="50" y1="220" x2="270" y2="100" stroke="#2196f3" stroke-width="3"/>
    
    <!-- Data points -->
    <circle cx="60" cy="210" r="4" fill="#ff5722"/>
    <circle cx="80" cy="195" r="4" fill="#ff5722"/>
    <circle cx="100" cy="180" r="4" fill="#ff5722"/>
    <circle cx="120" cy="170" r="4" fill="#ff5722"/>
    <circle cx="140" cy="155" r="4" fill="#ff5722"/>
    <circle cx="160" cy="145" r="4" fill="#ff5722"/>
    <circle cx="180" cy="130" r="4" fill="#ff5722"/>
    <circle cx="200" cy="120" r="4" fill="#ff5722"/>
    <circle cx="220" cy="110" r="4" fill="#ff5722"/>
    <circle cx="240" cy="105" r="4" fill="#ff5722"/>
    
    <!-- Axis labels -->
    <text x="160" y="250" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">Input Features (X)</text>
    <text x="25" y="160" text-anchor="middle" font-family="Arial" font-size="12" fill="#333" transform="rotate(-90 25 160)">Continuous Output (Y)</text>
    
    <!-- Characteristics -->
    <g transform="translate(0, 270)">
      <text x="10" y="15" font-family="Arial" font-size="12" font-weight="bold" fill="#1976d2">Characteristics:</text>
      <text x="10" y="30" font-family="Arial" font-size="11" fill="#333">• Continuous numerical output</text>
      <text x="10" y="45" font-family="Arial" font-size="11" fill="#333">• Predicts quantities (price, time, score)</text>
      <text x="10" y="60" font-family="Arial" font-size="11" fill="#333">• Uses MSE, RMSE, MAE metrics</text>
      <text x="10" y="75" font-family="Arial" font-size="11" fill="#333">• Examples: Stock price, temperature</text>
    </g>
  </g>
  
  <!-- Classification Section -->
  <g transform="translate(430, 70)">
    <!-- Header -->
    <rect x="0" y="0" width="320" height="50" fill="#fff3e0" stroke="#f57c00" stroke-width="2" rx="5"/>
    <text x="160" y="30" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#f57c00">🔴 Classification</text>
    
    <!-- Plot area -->
    <rect x="20" y="70" width="280" height="180" fill="white" stroke="#ddd" stroke-width="1"/>
    
    <!-- Axes -->
    <line x1="40" y1="230" x2="280" y2="230" stroke="#333" stroke-width="2"/>
    <line x1="40" y1="230" x2="40" y2="90" stroke="#333" stroke-width="2"/>
    
    <!-- Grid lines -->
    <g stroke="#f0f0f0" stroke-width="1">
      <line x1="40" y1="200" x2="280" y2="200"/>
      <line x1="40" y1="170" x2="280" y2="170"/>
      <line x1="40" y1="140" x2="280" y2="140"/>
      <line x1="40" y1="110" x2="280" y2="110"/>
      
      <line x1="80" y1="230" x2="80" y2="90"/>
      <line x1="120" y1="230" x2="120" y2="90"/>
      <line x1="160" y1="230" x2="160" y2="90"/>
      <line x1="200" y1="230" x2="200" y2="90"/>
      <line x1="240" y1="230" x2="240" y2="90"/>
    </g>
    
    <!-- Decision boundary -->
    <line x1="160" y1="90" x2="160" y2="230" stroke="#ff9800" stroke-width="3" stroke-dasharray="5,5"/>
    
    <!-- Class A points (left side) -->
    <circle cx="70" cy="110" r="4" fill="#4caf50"/>
    <circle cx="90" cy="130" r="4" fill="#4caf50"/>
    <circle cx="110" cy="120" r="4" fill="#4caf50"/>
    <circle cx="130" cy="105" r="4" fill="#4caf50"/>
    <circle cx="120" cy="140" r="4" fill="#4caf50"/>
    
    <!-- Class B points (right side) -->
    <circle cx="190" cy="200" r="4" fill="#e91e63"/>
    <circle cx="210" cy="180" r="4" fill="#e91e63"/>
    <circle cx="230" cy="190" r="4" fill="#e91e63"/>
    <circle cx="250" cy="170" r="4" fill="#e91e63"/>
    <circle cx="200" cy="210" r="4" fill="#e91e63"/>
    
    <!-- Axis labels -->
    <text x="160" y="250" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">Input Features (X)</text>
    <text x="25" y="160" text-anchor="middle" font-family="Arial" font-size="12" fill="#333" transform="rotate(-90 25 160)">Class Labels (Y)</text>
    
    <!-- Class labels -->
    <text x="100" y="85" text-anchor="middle" font-family="Arial" font-size="12" fill="#4caf50" font-weight="bold">Class A</text>
    <text x="220" y="85" text-anchor="middle" font-family="Arial" font-size="12" fill="#e91e63" font-weight="bold">Class B</text>
    
    <!-- Characteristics -->
    <g transform="translate(0, 270)">
      <text x="10" y="15" font-family="Arial" font-size="12" font-weight="bold" fill="#f57c00">Characteristics:</text>
      <text x="10" y="30" font-family="Arial" font-size="11" fill="#333">• Discrete categorical output</text>
      <text x="10" y="45" font-family="Arial" font-size="11" fill="#333">• Predicts classes (spam/ham, cat/dog)</text>
      <text x="10" y="60" font-family="Arial" font-size="11" fill="#333">• Uses accuracy, F1-score, AUC metrics</text>
      <text x="10" y="75" font-family="Arial" font-size="11" fill="#333">• Examples: Email filtering, image recognition</text>
    </g>
  </g>
  
  <!-- Comparison Table -->
  <g transform="translate(100, 420)">
    <rect x="0" y="0" width="600" height="70" fill="white" stroke="#ccc" stroke-width="1" rx="5"/>
    
    <!-- Headers -->
    <text x="20" y="25" font-family="Arial" font-size="12" font-weight="bold" fill="#333">Aspect</text>
    <text x="150" y="25" font-family="Arial" font-size="12" font-weight="bold" fill="#1976d2">Regression</text>
    <text x="350" y="25" font-family="Arial" font-size="12" font-weight="bold" fill="#f57c00">Classification</text>
    
    <!-- Divider -->
    <line x1="10" y1="30" x2="590" y2="30" stroke="#ddd"/>
    
    <!-- Content -->
    <text x="20" y="45" font-family="Arial" font-size="11" fill="#333">Output Type:</text>
    <text x="150" y="45" font-family="Arial" font-size="11" fill="#333">Continuous values</text>
    <text x="350" y="45" font-family="Arial" font-size="11" fill="#333">Discrete categories</text>
    
    <text x="20" y="60" font-family="Arial" font-size="11" fill="#333">Use Cases:</text>
    <text x="150" y="60" font-family="Arial" font-size="11" fill="#333">Price prediction, forecasting</text>
    <text x="350" y="60" font-family="Arial" font-size="11" fill="#333">Image recognition, sentiment analysis</text>
  </g>
</svg>