<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="24" font-weight="bold" fill="#2c3e50">
    Common Discrete Distributions
  </text>
  
  <!-- Binomial Distribution -->
  <rect x="50" y="60" width="350" height="250" fill="#ffffff" stroke="#e74c3c" stroke-width="2" rx="5"/>
  <text x="225" y="85" text-anchor="middle" font-size="18" font-weight="bold" fill="#e74c3c">
    Binomial Distribution
  </text>
  
  <!-- Binomial description -->
  <text x="70" y="105" font-size="12" fill="#2c3e50">Models: Number of successes in n independent trials</text>
  <text x="70" y="120" font-size="12" fill="#2c3e50">Parameters: n (trials), p (success probability)</text>
  
  <!-- Binomial formula box -->
  <rect x="70" y="130" width="310" height="40" fill="#e74c3c" fill-opacity="0.1" stroke="#e74c3c" stroke-width="1" rx="3"/>
  <text x="225" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">
    P(X = k) = C(n,k) × p^k × (1-p)^(n-k)
  </text>
  
  <!-- Binomial chart -->
  <g transform="translate(80, 180)">
    <!-- Axes -->
    <line x1="0" y1="100" x2="270" y2="100" stroke="#2c3e50" stroke-width="1"/>
    <line x1="0" y1="0" x2="0" y2="100" stroke="#2c3e50" stroke-width="1"/>
    
    <!-- Bars for n=10, p=0.3 -->
    <rect x="10" y="95" width="15" height="5" fill="#e74c3c"/>
    <rect x="30" y="80" width="15" height="20" fill="#e74c3c"/>
    <rect x="50" y="60" width="15" height="40" fill="#e74c3c"/>
    <rect x="70" y="40" width="15" height="60" fill="#e74c3c"/>
    <rect x="90" y="50" width="15" height="50" fill="#e74c3c"/>
    <rect x="110" y="70" width="15" height="30" fill="#e74c3c"/>
    <rect x="130" y="85" width="15" height="15" fill="#e74c3c"/>
    <rect x="150" y="92" width="15" height="8" fill="#e74c3c"/>
    <rect x="170" y="97" width="15" height="3" fill="#e74c3c"/>
    <rect x="190" y="99" width="15" height="1" fill="#e74c3c"/>
    <rect x="210" y="99.5" width="15" height="0.5" fill="#e74c3c"/>
    
    <!-- Labels -->
    <text x="17" y="115" text-anchor="middle" font-size="8" fill="#2c3e50">0</text>
    <text x="77" y="115" text-anchor="middle" font-size="8" fill="#2c3e50">3</text>
    <text x="137" y="115" text-anchor="middle" font-size="8" fill="#2c3e50">6</text>
    <text x="197" y="115" text-anchor="middle" font-size="8" fill="#2c3e50">9</text>
    
    <text x="135" y="130" text-anchor="middle" font-size="10" fill="#2c3e50">k (successes)</text>
    <text x="-20" y="50" text-anchor="middle" font-size="9" fill="#2c3e50" transform="rotate(-90, -20, 50)">P(X=k)</text>
  </g>
  
  <!-- Binomial properties -->
  <text x="70" y="290" font-size="11" fill="#2c3e50">Mean: μ = np</text>
  <text x="200" y="290" font-size="11" fill="#2c3e50">Variance: σ² = np(1-p)</text>
  <text x="70" y="305" font-size="11" fill="#2c3e50">Example: n=10, p=0.3 (shown above)</text>
  
  <!-- Poisson Distribution -->
  <rect x="420" y="60" width="350" height="250" fill="#ffffff" stroke="#f39c12" stroke-width="2" rx="5"/>
  <text x="595" y="85" text-anchor="middle" font-size="18" font-weight="bold" fill="#f39c12">
    Poisson Distribution
  </text>
  
  <!-- Poisson description -->
  <text x="440" y="105" font-size="12" fill="#2c3e50">Models: Events occurring in fixed time/space</text>
  <text x="440" y="120" font-size="12" fill="#2c3e50">Parameter: λ (average rate)</text>
  
  <!-- Poisson formula box -->
  <rect x="440" y="130" width="310" height="40" fill="#f39c12" fill-opacity="0.1" stroke="#f39c12" stroke-width="1" rx="3"/>
  <text x="595" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">
    P(X = k) = (λ^k × e^(-λ)) / k!
  </text>
  
  <!-- Poisson chart -->
  <g transform="translate(450, 180)">
    <!-- Axes -->
    <line x1="0" y1="100" x2="270" y2="100" stroke="#2c3e50" stroke-width="1"/>
    <line x1="0" y1="0" x2="0" y2="100" stroke="#2c3e50" stroke-width="1"/>
    
    <!-- Bars for λ=3 -->
    <rect x="10" y="85" width="15" height="15" fill="#f39c12"/>
    <rect x="30" y="55" width="15" height="45" fill="#f39c12"/>
    <rect x="50" y="30" width="15" height="70" fill="#f39c12"/>
    <rect x="70" y="20" width="15" height="80" fill="#f39c12"/>
    <rect x="90" y="35" width="15" height="65" fill="#f39c12"/>
    <rect x="110" y="55" width="15" height="45" fill="#f39c12"/>
    <rect x="130" y="72" width="15" height="28" fill="#f39c12"/>
    <rect x="150" y="83" width="15" height="17" fill="#f39c12"/>
    <rect x="170" y="90" width="15" height="10" fill="#f39c12"/>
    <rect x="190" y="94" width="15" height="6" fill="#f39c12"/>
    
    <!-- Labels -->
    <text x="17" y="115" text-anchor="middle" font-size="8" fill="#2c3e50">0</text>
    <text x="77" y="115" text-anchor="middle" font-size="8" fill="#2c3e50">3</text>
    <text x="137" y="115" text-anchor="middle" font-size="8" fill="#2c3e50">6</text>
    <text x="197" y="115" text-anchor="middle" font-size="8" fill="#2c3e50">9</text>
    
    <text x="135" y="130" text-anchor="middle" font-size="10" fill="#2c3e50">k (events)</text>
    <text x="-20" y="50" text-anchor="middle" font-size="9" fill="#2c3e50" transform="rotate(-90, -20, 50)">P(X=k)</text>
  </g>
  
  <!-- Poisson properties -->
  <text x="440" y="290" font-size="11" fill="#2c3e50">Mean: μ = λ</text>
  <text x="570" y="290" font-size="11" fill="#2c3e50">Variance: σ² = λ</text>
  <text x="440" y="305" font-size="11" fill="#2c3e50">Example: λ=3 (shown above)</text>
  
  <!-- Geometric Distribution -->
  <rect x="50" y="330" width="350" height="250" fill="#ffffff" stroke="#9b59b6" stroke-width="2" rx="5"/>
  <text x="225" y="355" text-anchor="middle" font-size="18" font-weight="bold" fill="#9b59b6">
    Geometric Distribution
  </text>
  
  <!-- Geometric description -->
  <text x="70" y="375" font-size="12" fill="#2c3e50">Models: Number of trials until first success</text>
  <text x="70" y="390" font-size="12" fill="#2c3e50">Parameter: p (success probability)</text>
  
  <!-- Geometric formula box -->
  <rect x="70" y="400" width="310" height="40" fill="#9b59b6" fill-opacity="0.1" stroke="#9b59b6" stroke-width="1" rx="3"/>
  <text x="225" y="420" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">
    P(X = k) = (1-p)^(k-1) × p
  </text>
  
  <!-- Geometric chart -->
  <g transform="translate(80, 450)">
    <!-- Axes -->
    <line x1="0" y1="100" x2="270" y2="100" stroke="#2c3e50" stroke-width="1"/>
    <line x1="0" y1="0" x2="0" y2="100" stroke="#2c3e50" stroke-width="1"/>
    
    <!-- Bars for p=0.3 -->
    <rect x="10" y="20" width="15" height="80" fill="#9b59b6"/>
    <rect x="30" y="44" width="15" height="56" fill="#9b59b6"/>
    <rect x="50" y="59" width="15" height="41" fill="#9b59b6"/>
    <rect x="70" y="71" width="15" height="29" fill="#9b59b6"/>
    <rect x="90" y="80" width="15" height="20" fill="#9b59b6"/>
    <rect x="110" y="86" width="15" height="14" fill="#9b59b6"/>
    <rect x="130" y="90" width="15" height="10" fill="#9b59b6"/>
    <rect x="150" y="93" width="15" height="7" fill="#9b59b6"/>
    
    <!-- Labels -->
    <text x="17" y="115" text-anchor="middle" font-size="8" fill="#2c3e50">1</text>
    <text x="57" y="115" text-anchor="middle" font-size="8" fill="#2c3e50">3</text>
    <text x="97" y="115" text-anchor="middle" font-size="8" fill="#2c3e50">5</text>
    <text x="137" y="115" text-anchor="middle" font-size="8" fill="#2c3e50">7</text>
    
    <text x="135" y="130" text-anchor="middle" font-size="10" fill="#2c3e50">k (trials)</text>
    <text x="-20" y="50" text-anchor="middle" font-size="9" fill="#2c3e50" transform="rotate(-90, -20, 50)">P(X=k)</text>
  </g>
  
  <!-- Geometric properties -->
  <text x="70" y="560" font-size="11" fill="#2c3e50">Mean: μ = 1/p</text>
  <text x="200" y="560" font-size="11" fill="#2c3e50">Variance: σ² = (1-p)/p²</text>
  <text x="70" y="575" font-size="11" fill="#2c3e50">Example: p=0.3 (shown above)</text>
  
  <!-- Comparison Table -->
  <rect x="420" y="330" width="350" height="250" fill="#ffffff" stroke="#27ae60" stroke-width="2" rx="5"/>
  <text x="595" y="355" text-anchor="middle" font-size="18" font-weight="bold" fill="#27ae60">
    Distribution Comparison
  </text>
  
  <!-- Table -->
  <g transform="translate(440, 370)">
    <!-- Headers -->
    <rect x="0" y="0" width="310" height="25" fill="#27ae60" fill-opacity="0.2"/>
    <text x="10" y="17" font-size="11" font-weight="bold" fill="#2c3e50">Distribution</text>
    <text x="100" y="17" font-size="11" font-weight="bold" fill="#2c3e50">Use Case</text>
    <text x="220" y="17" font-size="11" font-weight="bold" fill="#2c3e50">Mean</text>
    
    <!-- Rows -->
    <line x1="0" y1="25" x2="310" y2="25" stroke="#bdc3c7"/>
    <text x="10" y="42" font-size="10" fill="#e74c3c">Binomial</text>
    <text x="100" y="42" font-size="10" fill="#2c3e50">n trials, count successes</text>
    <text x="220" y="42" font-size="10" fill="#2c3e50">np</text>
    
    <line x1="0" y1="50" x2="310" y2="50" stroke="#ecf0f1"/>
    <text x="10" y="67" font-size="10" fill="#f39c12">Poisson</text>
    <text x="100" y="67" font-size="10" fill="#2c3e50">Rate of rare events</text>
    <text x="220" y="67" font-size="10" fill="#2c3e50">λ</text>
    
    <line x1="0" y1="75" x2="310" y2="75" stroke="#ecf0f1"/>
    <text x="10" y="92" font-size="10" fill="#9b59b6">Geometric</text>
    <text x="100" y="92" font-size="10" fill="#2c3e50">Trials until first success</text>
    <text x="220" y="92" font-size="10" fill="#2c3e50">1/p</text>
    
    <!-- Applications -->
    <text x="10" y="120" font-size="12" font-weight="bold" fill="#27ae60">Real-world Applications:</text>
    <text x="10" y="140" font-size="10" fill="#2c3e50">• Binomial: A/B testing, quality control</text>
    <text x="10" y="155" font-size="10" fill="#2c3e50">• Poisson: Call center arrivals, defects</text>
    <text x="10" y="170" font-size="10" fill="#2c3e50">• Geometric: Time to failure, sales attempts</text>
    
    <!-- Key Properties -->
    <text x="10" y="195" font-size="12" font-weight="bold" fill="#27ae60">Key Properties:</text>
    <text x="10" y="215" font-size="10" fill="#2c3e50">• All have discrete sample spaces</text>
    <text x="10" y="230" font-size="10" fill="#2c3e50">• PMF sums to 1: Σ P(X = k) = 1</text>
  </g>
</svg>