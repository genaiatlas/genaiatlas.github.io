<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="userGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="itemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="700" fill="#f5f5f5"/>
  
  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#2c3e50">
    Collaborative Filtering: User-Item Matrix
  </text>
  
  <!-- User-Based CF Section -->
  <g transform="translate(50, 80)">
    <text x="250" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#34495e">User-Based CF</text>
    
    <!-- Users -->
    <g transform="translate(0, 50)">
      <!-- Active User -->
      <g transform="translate(0, 0)">
        <circle cx="40" cy="40" r="35" fill="url(#userGrad)" filter="url(#shadow)"/>
        <text x="40" y="45" text-anchor="middle" font-size="14" fill="white" font-weight="bold">U1</text>
        <text x="40" y="90" text-anchor="middle" font-size="12" fill="#2c3e50">Active User</text>
      </g>
      
      <!-- Similar Users -->
      <g transform="translate(150, 0)">
        <circle cx="40" cy="40" r="30" fill="#3498db" opacity="0.8" filter="url(#shadow)"/>
        <text x="40" y="45" text-anchor="middle" font-size="14" fill="white">U2</text>
        <text x="40" y="85" text-anchor="middle" font-size="11" fill="#7f8c8d">Similar</text>
      </g>
      
      <g transform="translate(150, 120)">
        <circle cx="40" cy="40" r="30" fill="#3498db" opacity="0.8" filter="url(#shadow)"/>
        <text x="40" y="45" text-anchor="middle" font-size="14" fill="white">U3</text>
        <text x="40" y="85" text-anchor="middle" font-size="11" fill="#7f8c8d">Similar</text>
      </g>
      
      <g transform="translate(300, 60)">
        <circle cx="40" cy="40" r="25" fill="#95a5a6" opacity="0.6" filter="url(#shadow)"/>
        <text x="40" y="45" text-anchor="middle" font-size="14" fill="white">U4</text>
        <text x="40" y="85" text-anchor="middle" font-size="11" fill="#7f8c8d">Dissimilar</text>
      </g>
    </g>
    
    <!-- Connections -->
    <line x1="75" y1="100" x2="150" y2="100" stroke="#2ecc71" stroke-width="3" opacity="0.7"/>
    <line x1="75" y1="120" x2="150" y2="180" stroke="#2ecc71" stroke-width="3" opacity="0.7"/>
    <line x1="75" y1="130" x2="320" y2="140" stroke="#95a5a6" stroke-width="1" stroke-dasharray="5,5" opacity="0.5"/>
    
    <!-- Items liked by similar users -->
    <g transform="translate(450, 100)">
      <rect x="0" y="0" width="60" height="60" rx="5" fill="url(#itemGrad)" filter="url(#shadow)"/>
      <text x="30" y="35" text-anchor="middle" font-size="12" fill="white">Item A</text>
      <text x="30" y="80" text-anchor="middle" font-size="10" fill="#e74c3c">Recommend</text>
    </g>
  </g>
  
  <!-- Item-Based CF Section -->
  <g transform="translate(650, 80)">
    <text x="250" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#34495e">Item-Based CF</text>
    
    <!-- Items -->
    <g transform="translate(0, 50)">
      <!-- Target Item -->
      <g transform="translate(0, 60)">
        <rect x="0" y="0" width="70" height="70" rx="5" fill="url(#itemGrad)" filter="url(#shadow)"/>
        <text x="35" y="40" text-anchor="middle" font-size="14" fill="white" font-weight="bold">I1</text>
        <text x="35" y="85" text-anchor="middle" font-size="12" fill="#2c3e50">Liked Item</text>
      </g>
      
      <!-- Similar Items -->
      <g transform="translate(150, 0)">
        <rect x="0" y="0" width="60" height="60" rx="5" fill="#e74c3c" opacity="0.8" filter="url(#shadow)"/>
        <text x="30" y="35" text-anchor="middle" font-size="14" fill="white">I2</text>
        <text x="30" y="75" text-anchor="middle" font-size="11" fill="#7f8c8d">Similar</text>
      </g>
      
      <g transform="translate(150, 120)">
        <rect x="0" y="0" width="60" height="60" rx="5" fill="#e74c3c" opacity="0.8" filter="url(#shadow)"/>
        <text x="30" y="35" text-anchor="middle" font-size="14" fill="white">I3</text>
        <text x="30" y="75" text-anchor="middle" font-size="11" fill="#7f8c8d">Similar</text>
      </g>
      
      <g transform="translate(300, 60)">
        <rect x="0" y="0" width="50" height="50" rx="5" fill="#95a5a6" opacity="0.6" filter="url(#shadow)"/>
        <text x="25" y="30" text-anchor="middle" font-size="14" fill="white">I4</text>
        <text x="25" y="65" text-anchor="middle" font-size="11" fill="#7f8c8d">Dissimilar</text>
      </g>
    </g>
    
    <!-- Connections -->
    <line x1="70" y1="130" x2="150" y2="100" stroke="#2ecc71" stroke-width="3" opacity="0.7"/>
    <line x1="70" y1="140" x2="150" y2="180" stroke="#2ecc71" stroke-width="3" opacity="0.7"/>
    <line x1="70" y1="145" x2="300" y2="140" stroke="#95a5a6" stroke-width="1" stroke-dasharray="5,5" opacity="0.5"/>
    
    <!-- Recommendation -->
    <g transform="translate(450, 100)">
      <circle cx="35" cy="35" r="35" fill="url(#userGrad)" filter="url(#shadow)"/>
      <text x="35" y="40" text-anchor="middle" font-size="14" fill="white">User</text>
      <text x="35" y="80" text-anchor="middle" font-size="10" fill="#3498db">Gets Recs</text>
    </g>
  </g>
  
  <!-- Matrix Representation -->
  <g transform="translate(200, 380)">
    <text x="400" y="0" text-anchor="middle" font-size="22" font-weight="bold" fill="#2c3e50">Rating Matrix</text>
    
    <!-- Matrix Grid -->
    <g transform="translate(150, 30)">
      <!-- Headers -->
      <text x="50" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#34495e">Item 1</text>
      <text x="120" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#34495e">Item 2</text>
      <text x="190" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#34495e">Item 3</text>
      <text x="260" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#34495e">Item 4</text>
      <text x="330" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#34495e">Item 5</text>
      
      <text x="-20" y="55" text-anchor="middle" font-size="14" font-weight="bold" fill="#34495e">User 1</text>
      <text x="-20" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#34495e">User 2</text>
      <text x="-20" y="155" text-anchor="middle" font-size="14" font-weight="bold" fill="#34495e">User 3</text>
      <text x="-20" y="205" text-anchor="middle" font-size="14" font-weight="bold" fill="#34495e">User 4</text>
      
      <!-- Matrix Cells -->
      <g id="matrix">
        <!-- Row 1 -->
        <rect x="20" y="30" width="60" height="40" fill="#3498db" opacity="0.8" stroke="white" stroke-width="2"/>
        <text x="50" y="55" text-anchor="middle" font-size="16" fill="white">5</text>
        
        <rect x="90" y="30" width="60" height="40" fill="#3498db" opacity="0.6" stroke="white" stroke-width="2"/>
        <text x="120" y="55" text-anchor="middle" font-size="16" fill="white">4</text>
        
        <rect x="160" y="30" width="60" height="40" fill="#ecf0f1" stroke="#95a5a6" stroke-width="2"/>
        <text x="190" y="55" text-anchor="middle" font-size="16" fill="#95a5a6">?</text>
        
        <rect x="230" y="30" width="60" height="40" fill="#3498db" opacity="0.4" stroke="white" stroke-width="2"/>
        <text x="260" y="55" text-anchor="middle" font-size="16" fill="white">2</text>
        
        <rect x="300" y="30" width="60" height="40" fill="#ecf0f1" stroke="#95a5a6" stroke-width="2"/>
        <text x="330" y="55" text-anchor="middle" font-size="16" fill="#95a5a6">?</text>
        
        <!-- Row 2 -->
        <rect x="20" y="80" width="60" height="40" fill="#3498db" opacity="0.8" stroke="white" stroke-width="2"/>
        <text x="50" y="105" text-anchor="middle" font-size="16" fill="white">5</text>
        
        <rect x="90" y="80" width="60" height="40" fill="#ecf0f1" stroke="#95a5a6" stroke-width="2"/>
        <text x="120" y="105" text-anchor="middle" font-size="16" fill="#95a5a6">?</text>
        
        <rect x="160" y="80" width="60" height="40" fill="#3498db" opacity="0.8" stroke="white" stroke-width="2"/>
        <text x="190" y="105" text-anchor="middle" font-size="16" fill="white">5</text>
        
        <rect x="230" y="80" width="60" height="40" fill="#3498db" opacity="0.2" stroke="white" stroke-width="2"/>
        <text x="260" y="105" text-anchor="middle" font-size="16" fill="white">1</text>
        
        <rect x="300" y="80" width="60" height="40" fill="#3498db" opacity="0.6" stroke="white" stroke-width="2"/>
        <text x="330" y="105" text-anchor="middle" font-size="16" fill="white">3</text>
        
        <!-- Row 3 -->
        <rect x="20" y="130" width="60" height="40" fill="#ecf0f1" stroke="#95a5a6" stroke-width="2"/>
        <text x="50" y="155" text-anchor="middle" font-size="16" fill="#95a5a6">?</text>
        
        <rect x="90" y="130" width="60" height="40" fill="#3498db" opacity="0.6" stroke="white" stroke-width="2"/>
        <text x="120" y="155" text-anchor="middle" font-size="16" fill="white">4</text>
        
        <rect x="160" y="130" width="60" height="40" fill="#3498db" opacity="0.8" stroke="white" stroke-width="2"/>
        <text x="190" y="155" text-anchor="middle" font-size="16" fill="white">5</text>
        
        <rect x="230" y="130" width="60" height="40" fill="#ecf0f1" stroke="#95a5a6" stroke-width="2"/>
        <text x="120" y="155" text-anchor="middle" font-size="16" fill="#95a5a6">?</text>
        
        <rect x="300" y="130" width="60" height="40" fill="#3498db" opacity="0.6" stroke="white" stroke-width="2"/>
        <text x="330" y="155" text-anchor="middle" font-size="16" fill="white">3</text>
        
        <!-- Row 4 -->
        <rect x="20" y="180" width="60" height="40" fill="#3498db" opacity="0.4" stroke="white" stroke-width="2"/>
        <text x="50" y="205" text-anchor="middle" font-size="16" fill="white">2</text>
        
        <rect x="90" y="180" width="60" height="40" fill="#ecf0f1" stroke="#95a5a6" stroke-width="2"/>
        <text x="120" y="205" text-anchor="middle" font-size="16" fill="#95a5a6">?</text>
        
        <rect x="160" y="180" width="60" height="40" fill="#3498db" opacity="0.2" stroke="white" stroke-width="2"/>
        <text x="190" y="205" text-anchor="middle" font-size="16" fill="white">1</text>
        
        <rect x="230" y="180" width="60" height="40" fill="#3498db" opacity="0.8" stroke="white" stroke-width="2"/>
        <text x="260" y="205" text-anchor="middle" font-size="16" fill="white">5</text>
        
        <rect x="300" y="180" width="60" height="40" fill="#3498db" opacity="0.8" stroke="white" stroke-width="2"/>
        <text x="330" y="205" text-anchor="middle" font-size="16" fill="white">5</text>
      </g>
    </g>
    
    <!-- Legend -->
    <g transform="translate(650, 100)">
      <text x="0" y="0" font-size="14" font-weight="bold" fill="#34495e">Legend:</text>
      <rect x="0" y="10" width="30" height="20" fill="#3498db" opacity="0.8"/>
      <text x="40" y="25" font-size="12" fill="#34495e">High Rating (4-5)</text>
      <rect x="0" y="40" width="30" height="20" fill="#3498db" opacity="0.4"/>
      <text x="40" y="55" font-size="12" fill="#34495e">Low Rating (1-3)</text>
      <rect x="0" y="70" width="30" height="20" fill="#ecf0f1" stroke="#95a5a6" stroke-width="1"/>
      <text x="40" y="85" font-size="12" fill="#34495e">Unknown (To Predict)</text>
    </g>
  </g>
</svg>