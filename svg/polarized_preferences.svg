<svg viewBox="0 0 1100 850" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="550" y="35" font-size="24" font-weight="bold" text-anchor="middle" fill="#2C3E50">
    Polarized Preferences: Opposite Tastes Pattern
  </text>
  
  <!-- Subtitle -->
  <text x="550" y="60" font-size="14" text-anchor="middle" fill="#7F8C8D">
    Bikers vs Teenage Girls: 80s Dance Movies vs Pop Concerts
  </text>
  
  <!-- User Vector U with +1, -1, 0 -->
  <g id="user-vector-polarized">
    <text x="100" y="115" font-size="14" font-weight="bold" text-anchor="middle" fill="#E74C3C">U (Users)</text>
    <rect x="70" y="125" width="60" height="280" fill="#FFE5E5" stroke="#E74C3C" stroke-width="2.5"/>
    
    <!-- Regular users (0) -->
    <rect x="78" y="135" width="44" height="35" fill="white" stroke="#BDC3C7" stroke-width="1"/>
    <text x="100" y="157" font-size="13" text-anchor="middle" fill="#7F8C8D">0</text>
    <text x="155" y="157" font-size="10" text-anchor="start" fill="#7F8C8D">Regular</text>
    
    <rect x="78" y="175" width="44" height="35" fill="white" stroke="#BDC3C7" stroke-width="1"/>
    <text x="100" y="197" font-size="13" text-anchor="middle" fill="#7F8C8D">0</text>
    <text x="155" y="197" font-size="10" text-anchor="start" fill="#7F8C8D">Regular</text>
    
    <!-- Bikers (+1) -->
    <rect x="78" y="215" width="44" height="35" fill="#E74C3C" stroke="#C0392B" stroke-width="2"/>
    <text x="100" y="237" font-size="14" font-weight="bold" text-anchor="middle" fill="white">+1</text>
    <text x="155" y="237" font-size="11" font-weight="bold" text-anchor="start" fill="#E74C3C">Biker</text>
    
    <rect x="78" y="255" width="44" height="35" fill="#E74C3C" stroke="#C0392B" stroke-width="2"/>
    <text x="100" y="277" font-size="14" font-weight="bold" text-anchor="middle" fill="white">+1</text>
    <text x="155" y="277" font-size="11" font-weight="bold" text-anchor="start" fill="#E74C3C">Biker</text>
    
    <!-- Teenage girls (-1) -->
    <rect x="78" y="295" width="44" height="35" fill="#9B59B6" stroke="#7D3C98" stroke-width="2"/>
    <text x="100" y="317" font-size="14" font-weight="bold" text-anchor="middle" fill="white">-1</text>
    <text x="155" y="317" font-size="11" font-weight="bold" text-anchor="start" fill="#9B59B6">Teen Girl</text>
    
    <rect x="78" y="335" width="44" height="35" fill="#9B59B6" stroke="#7D3C98" stroke-width="2"/>
    <text x="100" y="357" font-size="14" font-weight="bold" text-anchor="middle" fill="white">-1</text>
    <text x="155" y="357" font-size="11" font-weight="bold" text-anchor="start" fill="#9B59B6">Teen Girl</text>
    
    <!-- More regular users -->
    <rect x="78" y="375" width="44" height="25" fill="white" stroke="#BDC3C7" stroke-width="1"/>
    <text x="100" y="392" font-size="12" text-anchor="middle" fill="#7F8C8D">0</text>
    <text x="155" y="392" font-size="10" text-anchor="start" fill="#7F8C8D">Regular</text>
  </g>
  
  <!-- Outer product symbol -->
  <text x="250" y="275" font-size="32" font-weight="bold" text-anchor="middle" fill="#34495E">⊗</text>
  
  <!-- Movie Vector V with +1, -1, 0 -->
  <g id="movie-vector-polarized">
    <text x="500" y="115" font-size="14" font-weight="bold" text-anchor="middle" fill="#2980B9">V (Movies)</text>
    <rect x="320" y="245" width="360" height="60" fill="#E5F4FF" stroke="#2980B9" stroke-width="2.5"/>
    
    <!-- Regular movies (0) -->
    <rect x="330" y="253" width="45" height="44" fill="white" stroke="#BDC3C7" stroke-width="1"/>
    <text x="352" y="280" font-size="13" text-anchor="middle" fill="#7F8C8D">0</text>
    <text x="352" y="325" font-size="9" text-anchor="middle" fill="#7F8C8D">Regular</text>
    
    <!-- 80s Dance (+1) -->
    <rect x="380" y="253" width="45" height="44" fill="#F39C12" stroke="#D68910" stroke-width="2"/>
    <text x="402" y="280" font-size="14" font-weight="bold" text-anchor="middle" fill="white">+1</text>
    <text x="402" y="325" font-size="9" font-weight="bold" text-anchor="middle" fill="#F39C12">80s Dance</text>
    
    <rect x="430" y="253" width="45" height="44" fill="#F39C12" stroke="#D68910" stroke-width="2"/>
    <text x="452" y="280" font-size="14" font-weight="bold" text-anchor="middle" fill="white">+1</text>
    <text x="452" y="325" font-size="9" font-weight="bold" text-anchor="middle" fill="#F39C12">80s Dance</text>
    
    <!-- Pop concerts (-1) -->
    <rect x="480" y="253" width="45" height="44" fill="#16A085" stroke="#138D75" stroke-width="2"/>
    <text x="502" y="280" font-size="14" font-weight="bold" text-anchor="middle" fill="white">-1</text>
    <text x="502" y="325" font-size="9" font-weight="bold" text-anchor="middle" fill="#16A085">Pop Concert</text>
    
    <rect x="530" y="253" width="45" height="44" fill="#16A085" stroke="#138D75" stroke-width="2"/>
    <text x="552" y="280" font-size="14" font-weight="bold" text-anchor="middle" fill="white">-1</text>
    <text x="552" y="325" font-size="9" font-weight="bold" text-anchor="middle" fill="#16A085">Pop Concert</text>
    
    <!-- More regular movies -->
    <rect x="580" y="253" width="45" height="44" fill="white" stroke="#BDC3C7" stroke-width="1"/>
    <text x="602" y="280" font-size="13" text-anchor="middle" fill="#7F8C8D">0</text>
    <text x="602" y="325" font-size="9" text-anchor="middle" fill="#7F8C8D">Regular</text>
    
    <rect x="630" y="253" width="45" height="44" fill="white" stroke="#BDC3C7" stroke-width="1"/>
    <text x="652" y="280" font-size="13" text-anchor="middle" fill="#7F8C8D">0</text>
    <text x="652" y="325" font-size="9" text-anchor="middle" fill="#7F8C8D">Regular</text>
  </g>
  
  <!-- Equals sign -->
  <text x="720" y="275" font-size="32" font-weight="bold" text-anchor="middle" fill="#34495E">=</text>
  
  <!-- Result Matrix with color-coded values -->
  <g id="result-matrix-polarized">
    <text x="910" y="115" font-size="14" font-weight="bold" text-anchor="middle" fill="#34495E">U ⊗ V</text>
    <rect x="770" y="125" width="280" height="280" fill="#F8F9FA" stroke="#34495E" stroke-width="2.5"/>
    
    <!-- Row labels and matrix entries -->
    <!-- Regular user rows (zeros) -->
    <text x="755" y="155" font-size="9" text-anchor="end" fill="#7F8C8D">Reg</text>
    <text x="910" y="155" font-size="11" text-anchor="middle" fill="#95A5A6">0  0  0  0  0  0</text>
    
    <text x="755" y="185" font-size="9" text-anchor="end" fill="#7F8C8D">Reg</text>
    <text x="910" y="185" font-size="11" text-anchor="middle" fill="#95A5A6">0  0  0  0  0  0</text>
    
    <!-- Biker rows -->
    <text x="755" y="215" font-size="9" text-anchor="end" fill="#E74C3C" font-weight="bold">Biker</text>
    <text x="820" y="215" font-size="11" text-anchor="middle" fill="#95A5A6">0</text>
    
    <!-- Positive preferences: Bikers like 80s dance -->
    <rect x="835" y="203" width="60" height="20" fill="#27AE60" opacity="0.3" rx="3"/>
    <text x="865" y="215" font-size="12" font-weight="bold" text-anchor="middle" fill="#27AE60">+1 +1</text>
    
    <!-- Negative preferences: Bikers dislike pop -->
    <rect x="905" y="203" width="60" height="20" fill="#E74C3C" opacity="0.3" rx="3"/>
    <text x="935" y="215" font-size="12" font-weight="bold" text-anchor="middle" fill="#E74C3C">-1 -1</text>
    
    <text x="995" y="215" font-size="11" text-anchor="middle" fill="#95A5A6">0  0</text>
    
    <!-- Second biker row -->
    <text x="755" y="245" font-size="9" text-anchor="end" fill="#E74C3C" font-weight="bold">Biker</text>
    <text x="820" y="245" font-size="11" text-anchor="middle" fill="#95A5A6">0</text>
    
    <rect x="835" y="233" width="60" height="20" fill="#27AE60" opacity="0.3" rx="3"/>
    <text x="865" y="245" font-size="12" font-weight="bold" text-anchor="middle" fill="#27AE60">+1 +1</text>
    
    <rect x="905" y="233" width="60" height="20" fill="#E74C3C" opacity="0.3" rx="3"/>
    <text x="935" y="245" font-size="12" font-weight="bold" text-anchor="middle" fill="#E74C3C">-1 -1</text>
    
    <text x="995" y="245" font-size="11" text-anchor="middle" fill="#95A5A6">0  0</text>
    
    <!-- Teen girl rows -->
    <text x="755" y="275" font-size="9" text-anchor="end" fill="#9B59B6" font-weight="bold">Teen</text>
    <text x="820" y="275" font-size="11" text-anchor="middle" fill="#95A5A6">0</text>
    
    <!-- Negative preferences: Teens dislike 80s dance -->
    <rect x="835" y="263" width="60" height="20" fill="#E74C3C" opacity="0.3" rx="3"/>
    <text x="865" y="275" font-size="12" font-weight="bold" text-anchor="middle" fill="#E74C3C">-1 -1</text>
    
    <!-- Positive preferences: Teens like pop -->
    <rect x="905" y="263" width="60" height="20" fill="#27AE60" opacity="0.3" rx="3"/>
    <text x="935" y="275" font-size="12" font-weight="bold" text-anchor="middle" fill="#27AE60">+1 +1</text>
    
    <text x="995" y="275" font-size="11" text-anchor="middle" fill="#95A5A6">0  0</text>
    
    <!-- Second teen row -->
    <text x="755" y="305" font-size="9" text-anchor="end" fill="#9B59B6" font-weight="bold">Teen</text>
    <text x="820" y="305" font-size="11" text-anchor="middle" fill="#95A5A6">0</text>
    
    <rect x="835" y="293" width="60" height="20" fill="#E74C3C" opacity="0.3" rx="3"/>
    <text x="865" y="305" font-size="12" font-weight="bold" text-anchor="middle" fill="#E74C3C">-1 -1</text>
    
    <rect x="905" y="293" width="60" height="20" fill="#27AE60" opacity="0.3" rx="3"/>
    <text x="935" y="305" font-size="12" font-weight="bold" text-anchor="middle" fill="#27AE60">+1 +1</text>
    
    <text x="995" y="305" font-size="11" text-anchor="middle" fill="#95A5A6">0  0</text>
    
    <!-- Regular user row -->
    <text x="755" y="335" font-size="9" text-anchor="end" fill="#7F8C8D">Reg</text>
    <text x="910" y="335" font-size="11" text-anchor="middle" fill="#95A5A6">0  0  0  0  0  0</text>
  </g>
  
  <!-- Interpretation Section -->
  <g id="interpretation">
    <text x="550" y="450" font-size="16" font-weight="bold" text-anchor="middle" fill="#34495E">
      Pattern Interpretation
    </text>
    
    <!-- Biker interpretation -->
    <g id="biker-interpretation">
      <rect x="80" y="480" width="450" height="100" fill="#FADBD8" stroke="#E74C3C" stroke-width="2" rx="8"/>
      <text x="305" y="505" font-size="14" font-weight="bold" text-anchor="middle" fill="#E74C3C">
        🏍️ Biker Preferences (+1 in U)
      </text>
      <text x="305" y="530" font-size="12" text-anchor="middle" fill="#555">
        <tspan x="305">• Like 80s dance movies MORE than average: (+1) × (+1) = +1</tspan>
      </text>
      <text x="305" y="550" font-size="12" text-anchor="middle" fill="#555">
        <tspan x="305">• Dislike pop concerts MORE than average: (+1) × (-1) = -1</tspan>
      </text>
      <text x="305" y="570" font-size="11" font-style="italic" text-anchor="middle" fill="#7F8C8D">
        Positive coefficient amplifies base ratings for 80s dance
      </text>
    </g>
    
    <!-- Teen interpretation -->
    <g id="teen-interpretation">
      <rect x="570" y="480" width="450" height="100" fill="#EBDEF0" stroke="#9B59B6" stroke-width="2" rx="8"/>
      <text x="795" y="505" font-size="14" font-weight="bold" text-anchor="middle" fill="#9B59B6">
        👧 Teenage Girl Preferences (-1 in U)
      </text>
      <text x="795" y="530" font-size="12" text-anchor="middle" fill="#555">
        <tspan x="795">• Dislike 80s dance MORE than average: (-1) × (+1) = -1</tspan>
      </text>
      <text x="795" y="550" font-size="12" text-anchor="middle" fill="#555">
        <tspan x="795">• Like pop concerts MORE than average: (-1) × (-1) = +1</tspan>
      </text>
      <text x="795" y="570" font-size="11" font-style="italic" text-anchor="middle" fill="#7F8C8D">
        Negative coefficient creates opposite preference pattern
      </text>
    </g>
  </g>
  
  <!-- Formula Box -->
  <g id="formula-box">
    <rect x="100" y="610" width="900" height="90" fill="#E8F8F5" stroke="#27AE60" stroke-width="2" rx="8"/>
    <text x="550" y="640" font-size="14" font-weight="bold" text-anchor="middle" fill="#27AE60">
      Rating Prediction with Polarization
    </text>
    <text x="550" y="665" font-size="13" text-anchor="middle" fill="#555">
      Predicted Rating = Base Rating + σ × (Uᵢ × Vⱼ)
    </text>
    <text x="550" y="690" font-size="11" font-style="italic" text-anchor="middle" fill="#7F8C8D">
      Where σ (singular value) controls the strength of the polarized preference pattern
    </text>
  </g>
  
  <!-- Key Insights -->
  <g id="insights-box">
    <rect x="100" y="720" width="900" height="110" fill="#EBF5FB" stroke="#2980B9" stroke-width="2" rx="8"/>
    <text x="550" y="750" font-size="14" font-weight="bold" text-anchor="middle" fill="#2980B9">
      💡 Key Insights on Polarization
    </text>
    
    <text x="130" y="775" font-size="12" text-anchor="start" fill="#555">
      • <tspan font-weight="bold">Opposite patterns</tspan>: What one group loves (+1), the other dislikes (-1), and vice versa
    </text>
    
    <text x="130" y="795" font-size="12" text-anchor="start" fill="#555">
      • <tspan font-weight="bold">Zero baseline</tspan>: Regular users (0 in U) and regular movies (0 in V) show no special preference
    </text>
    
    <text x="130" y="815" font-size="12" text-anchor="start" fill="#555">
      • <tspan font-weight="bold">Flexible modeling</tspan>: Continuous values allow capturing nuanced preferences beyond simple likes/dislikes
    </text>
  </g>
</svg>