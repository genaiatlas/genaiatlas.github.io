<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="stepGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#667EEA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764BA2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dataGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F093FB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5576C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="nodeGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4FACFE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00F2FE;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#00000020"/>
    </filter>
  </defs>
  
  <!-- Title -->
  <text x="450" y="30" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">
    Decision Tree Construction Process
  </text>
  
  <!-- Step 1: Data Preparation -->
  <rect x="50" y="60" width="200" height="80" rx="10" fill="url(#stepGradient)" stroke="#5A67D8" stroke-width="2" filter="url(#shadow)"/>
  <text x="150" y="85" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
    Step 1: Data Preparation
  </text>
  <text x="150" y="105" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    • Split: 80% Training, 20% Test
  </text>
  <text x="150" y="120" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    • Calculate initial entropy
  </text>
  
  <!-- Arrow 1 -->
  <path d="M 250 100 L 290 100" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Step 2: Feature Selection -->
  <rect x="300" y="60" width="200" height="80" rx="10" fill="url(#stepGradient)" stroke="#5A67D8" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="85" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
    Step 2: Feature Selection
  </text>
  <text x="400" y="105" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    • Calculate information gain
  </text>
  <text x="400" y="120" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    • Select best feature
  </text>
  
  <!-- Arrow 2 -->
  <path d="M 500 100 L 540 100" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Step 3: Node Creation -->
  <rect x="550" y="60" width="200" height="80" rx="10" fill="url(#stepGradient)" stroke="#5A67D8" stroke-width="2" filter="url(#shadow)"/>
  <text x="650" y="85" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
    Step 3: Node Creation
  </text>
  <text x="650" y="105" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    • Create internal node
  </text>
  <text x="650" y="120" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    • Split data on feature
  </text>
  
  <!-- Arrow down from Step 3 -->
  <path d="M 650 140 L 650 180" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Information Gain Formula -->
  <rect x="200" y="180" width="500" height="60" rx="8" fill="#f8f9fa" stroke="#ddd" stroke-width="1"/>
  <text x="450" y="200" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">
    Information Gain Calculation
  </text>
  <text x="450" y="220" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#555">
    IG(S,A) = H(S) - Σ |Sᵥ|/|S| × H(Sᵥ)
  </text>
  <text x="450" y="235" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">
    Select attribute A that maximizes Information Gain
  </text>
  
  <!-- Arrow down -->
  <path d="M 450 240 L 450 280" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Decision Diamond -->
  <polygon points="450,300 500,330 450,360 400,330" fill="url(#dataGradient)" stroke="#E53E3E" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="325" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">
    Stopping
  </text>
  <text x="450" y="340" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">
    Criteria?
  </text>
  
  <!-- Yes branch to Leaf -->
  <path d="M 500 330 L 580 330" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="540" y="325" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#666">Yes</text>
  
  <!-- Leaf Node -->
  <rect x="590" y="305" width="100" height="50" rx="8" fill="#68D391" stroke="#38A169" stroke-width="2"/>
  <text x="640" y="325" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">
    Create Leaf
  </text>
  <text x="640" y="340" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
    (Majority Class)
  </text>
  
  <!-- No branch - Recursive -->
  <path d="M 400 330 L 350 330 L 350 450 L 450 450" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="320" y="325" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#666">No - Recurse</text>
  
  <!-- Recursive Process -->
  <rect x="300" y="460" width="300" height="60" rx="8" fill="url(#nodeGradient)" stroke="#0987A0" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="480" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
    Recursive Process for Each Subset
  </text>
  <text x="450" y="500" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    Repeat steps 2-3 for each data subset until stopping criteria met
  </text>
  
  <!-- Stopping Criteria Box -->
  <rect x="50" y="550" width="800" height="120" rx="10" fill="#FFF5F5" stroke="#FEB2B2" stroke-width="2"/>
  <text x="450" y="575" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#C53030">
    Stopping Criteria
  </text>
  
  <!-- Criteria List -->
  <text x="80" y="600" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">
    1. Pure Node: All samples in subset have same class (entropy = 0)
  </text>
  <text x="80" y="620" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">
    2. Maximum Depth: Predetermined tree depth limit reached
  </text>
  <text x="80" y="640" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">
    3. Minimum Samples: Subset has fewer than minimum required samples
  </text>
  <text x="80" y="660" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">
    4. No Information Gain: No feature provides significant improvement
  </text>
  
  <!-- Algorithm Summary -->
  <rect x="720" y="300" width="150" height="140" rx="8" fill="#EDF2F7" stroke="#A0AEC0" stroke-width="1"/>
  <text x="795" y="320" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">
    Key Metrics
  </text>
  
  <text x="730" y="340" font-family="Arial, sans-serif" font-size="10" fill="#555">
    <tspan font-weight="bold">Entropy:</tspan>
  </text>
  <text x="730" y="355" font-family="Arial, sans-serif" font-size="9" fill="#555">
    H = -Σ p(c) log₂ p(c)
  </text>
  
  <text x="730" y="375" font-family="Arial, sans-serif" font-size="10" fill="#555">
    <tspan font-weight="bold">Information Gain:</tspan>
  </text>
  <text x="730" y="390" font-family="Arial, sans-serif" font-size="9" fill="#555">
    IG = H(parent) - Σ wᵢH(childᵢ)
  </text>
  
  <text x="730" y="410" font-family="Arial, sans-serif" font-size="10" fill="#555">
    <tspan font-weight="bold">Goal:</tspan>
  </text>
  <text x="730" y="425" font-family="Arial, sans-serif" font-size="9" fill="#555">
    Maximize Information Gain
  </text>
  
  <!-- Arrow markers definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
     refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666" />
    </marker>
  </defs>
</svg>