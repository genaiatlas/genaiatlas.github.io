<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
    <!-- Coordinate system -->
    <line x1="100" y1="300" x2="700" y2="300" stroke="black" stroke-width="2"/>
    
    <!-- Arrow at end of axis -->
    <polygon points="700,300 690,295 690,305" fill="black"/>
    
    <!-- Normal distribution curve centered at 0 (null hypothesis) -->
    <path d="M 100,300 
             Q 150,290 200,260 
             Q 250,230 300,180 
             Q 350,130 400,100 
             Q 450,130 500,180 
             Q 550,230 600,260 
             Q 650,290 700,300" 
          fill="none" stroke="#4B6CB7" stroke-width="3"/>
    
    <!-- Zero point marker (null hypothesis) -->
    <line x1="400" y1="290" x2="400" y2="310" stroke="black" stroke-width="2"/>
    <circle cx="400" cy="300" r="5" fill="black"/>
    <text x="400" y="325" font-family="Arial" font-size="16" text-anchor="middle">0</text>
    
    <!-- Observed statistic marker -->
    <line x1="600" y1="290" x2="600" y2="310" stroke="#FF5370" stroke-width="2"/>
    <circle cx="600" cy="300" r="6" fill="#FF5370"/>
    
    <!-- Tail areas (p-value/2 on each side) -->
    <path d="M 600,300 
             Q 625,290 650,270 
             Q 675,250 700,300" 
          fill="#FF5370" fill-opacity="0.3" stroke="none"/>
    
    <path d="M 100,300 
             Q 125,250 150,270 
             Q 175,290 200,300" 
          fill="#FF5370" fill-opacity="0.3" stroke="none"/>
    
    <!-- Theta hat marker -->
    <text x="600" y="280" font-family="Arial" font-size="16" text-anchor="middle">θ̂j</text>
    
    <!-- p-value labels -->
    <text x="650" y="250" font-family="Arial" font-size="14" text-anchor="middle">p/2</text>
    <text x="150" y="250" font-family="Arial" font-size="14" text-anchor="middle">p/2</text>
    
    <!-- Title -->
    <text x="400" y="50" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">p-value Illustration for Two-sided Test</text>
    
    <!-- Description -->
    <text x="400" y="380" font-family="Arial" font-size="16" text-anchor="middle" font-style="italic">
        p-value = probability of observing |θ̂j| ≥ observed value when θ*j = 0
    </text>
</svg>