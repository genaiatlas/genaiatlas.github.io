<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Arrow markers - moved to beginning -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="700" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    PCA Implementation via Spectral Decomposition
  </text>
  
  <!-- Step 1: Data Matrix -->
  <g transform="translate(50, 70)">
    <rect x="0" y="0" width="180" height="120" fill="#e8f5e8" stroke="#27ae60" stroke-width="2" rx="5"/>
    <text x="90" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#27ae60">
      Step 1: Center Data
    </text>
    
    <!-- Data matrix representation -->
    <g transform="translate(30, 30)">
      <rect x="0" y="0" width="120" height="60" fill="white" stroke="#2c3e50" stroke-width="1"/>
      
      <!-- Matrix elements -->
      <text x="60" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">X ∈ ℝⁿˣᵖ</text>
      
      <!-- Sample matrix entries -->
      <text x="10" y="15" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">x₁₁</text>
      <text x="30" y="15" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">x₁₂</text>
      <text x="50" y="15" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">...</text>
      <text x="80" y="15" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">x₁ₚ</text>
      
      <text x="10" y="30" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">x₂₁</text>
      <text x="30" y="30" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">x₂₂</text>
      <text x="50" y="30" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">...</text>
      <text x="80" y="30" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">x₂ₚ</text>
      
      <text x="50" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">⋮</text>
      
      <text x="10" y="55" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">xₙ₁</text>
      <text x="30" y="55" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">xₙ₂</text>
      <text x="50" y="55" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">...</text>
      <text x="80" y="55" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">xₙₚ</text>
    </g>
    
    <text x="90" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
      X̄ᵢⱼ = Xᵢⱼ - μⱼ
    </text>
  </g>
  
  <!-- Arrow 1 -->
  <g transform="translate(250, 120)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#2c3e50" stroke-width="3" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- Step 2: Covariance Matrix -->
  <g transform="translate(310, 70)">
    <rect x="0" y="0" width="180" height="120" fill="#e8f4fd" stroke="#3498db" stroke-width="2" rx="5"/>
    <text x="90" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#3498db">
      Step 2: Covariance Matrix
    </text>
    
    <!-- Covariance matrix -->
    <g transform="translate(30, 35)">
      <text x="60" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">R = (1/n)X̄ᵀX̄</text>
      
      <rect x="20" y="5" width="80" height="50" fill="white" stroke="#2c3e50" stroke-width="1"/>
      
      <!-- Symmetric matrix elements -->
      <text x="30" y="20" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">σ₁₁</text>
      <text x="50" y="20" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">σ₁₂</text>
      <text x="80" y="20" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">σ₁ₚ</text>
      
      <text x="30" y="35" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">σ₂₁</text>
      <text x="50" y="35" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">σ₂₂</text>
      <text x="80" y="35" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">σ₂ₚ</text>
      
      <text x="60" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">⋮</text>
      
      <text x="30" y="50" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">σₚ₁</text>
      <text x="50" y="50" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">σₚ₂</text>
      <text x="80" y="50" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">σₚₚ</text>
    </g>
    
    <text x="90" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
      Symmetric, PSD
    </text>
  </g>
  
  <!-- Arrow 2 -->
  <g transform="translate(510, 120)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#2c3e50" stroke-width="3" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- Step 3: Eigendecomposition -->
  <g transform="translate(570, 70)">
    <rect x="0" y="0" width="180" height="120" fill="#fdf2f2" stroke="#e74c3c" stroke-width="2" rx="5"/>
    <text x="90" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e74c3c">
      Step 3: Eigendecomposition
    </text>
    
    <!-- Eigendecomposition formula -->
    <g transform="translate(30, 35)">
      <text x="60" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">R = VΛVᵀ</text>
      
      <!-- V matrix -->
      <g transform="translate(0, 15)">
        <text x="20" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c">V</text>
        <rect x="5" y="5" width="30" height="30" fill="white" stroke="#e74c3c" stroke-width="1"/>
        <text x="20" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">v₁</text>
        <text x="20" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">⋮</text>
      </g>
      
      <!-- Lambda matrix -->
      <g transform="translate(50, 15)">
        <text x="20" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#9b59b6">Λ</text>
        <rect x="5" y="5" width="30" height="30" fill="white" stroke="#9b59b6" stroke-width="1"/>
        <text x="15" y="20" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">λ₁</text>
        <text x="25" y="30" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">λₚ</text>
        <!-- Diagonal line -->
        <line x1="8" y1="8" x2="32" y2="32" stroke="#9b59b6" stroke-width="1"/>
      </g>
      
      <!-- V transpose -->
      <g transform="translate(100, 15)">
        <text x="20" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c">Vᵀ</text>
        <rect x="5" y="5" width="30" height="30" fill="white" stroke="#e74c3c" stroke-width="1"/>
        <text x="20" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">v₁ᵀ ⋯ vₚᵀ</text>
      </g>
    </g>
    
    <text x="90" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
      λ₁ ≥ λ₂ ≥ ⋯ ≥ λₚ
    </text>
  </g>
  
  <!-- Step 4: Component Selection -->
  <g transform="translate(200, 220)">
    <rect x="0" y="0" width="300" height="150" fill="#fff3cd" stroke="#f39c12" stroke-width="2" rx="5"/>
    <text x="150" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#f39c12">
      Step 4: Select Principal Components
    </text>
    
    <!-- Eigenvalue plot -->
    <g transform="translate(20, 40)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Eigenvalues:</text>
      
      <!-- Bars representing eigenvalues -->
      <rect x="20" y="10" width="15" height="60" fill="#e74c3c"/>
      <rect x="40" y="20" width="15" height="50" fill="#e67e22"/>
      <rect x="60" y="35" width="15" height="35" fill="#f39c12"/>
      <rect x="80" y="50" width="15" height="20" fill="#f1c40f"/>
      <rect x="100" y="60" width="15" height="10" fill="#f4d03f"/>
      <rect x="120" y="65" width="15" height="5" fill="#fdeaa7"/>
      
      <!-- Labels -->
      <text x="27" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">λ₁</text>
      <text x="47" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">λ₂</text>
      <text x="67" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">λ₃</text>
      <text x="87" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">λ₄</text>
      <text x="107" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">λ₅</text>
      <text x="127" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">λ₆</text>
      
      <!-- Selection bracket -->
      <line x1="18" y1="0" x2="18" y2="5" stroke="#27ae60" stroke-width="3"/>
      <line x1="18" y1="0" x2="77" y2="0" stroke="#27ae60" stroke-width="3"/>
      <line x1="77" y1="0" x2="77" y2="5" stroke="#27ae60" stroke-width="3"/>
      <text x="47" y="-8" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#27ae60" font-weight="bold">Keep top-k</text>
    </g>
    
    <!-- Selection criteria -->
    <g transform="translate(160, 40)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Selection Criteria:</text>
      <text x="0" y="20" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">• Keep 80-95% variance</text>
      <text x="0" y="35" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">• Elbow in scree plot</text>
      <text x="0" y="50" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">• Domain knowledge</text>
      <text x="0" y="65" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">• Computational limits</text>
      
      <text x="0" y="90" font-family="Arial, sans-serif" font-size="11" fill="#27ae60" font-weight="bold">Vₖ = [v₁, v₂, ..., vₖ]</text>
    </g>
  </g>
  
  <!-- Arrow 3 -->
  <g transform="translate(520, 290)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#2c3e50" stroke-width="3" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- Step 5: Data Projection -->
  <g transform="translate(580, 220)">
    <rect x="0" y="0" width="180" height="150" fill="#f0f8ff" stroke="#6c5ce7" stroke-width="2" rx="5"/>
    <text x="90" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#6c5ce7">
      Step 5: Project Data
    </text>
    
    <!-- Projection formula -->
    <g transform="translate(20, 40)">
      <text x="70" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">Y = XVₖ</text>
      
      <!-- Dimensions -->
      <text x="70" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">ℝⁿˣᵖ → ℝⁿˣᵏ</text>
      
      <!-- Result matrix -->
      <rect x="30" y="50" width="80" height="50" fill="white" stroke="#6c5ce7" stroke-width="1"/>
      <text x="70" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6c5ce7">Y (Low-dim)</text>
      
      <text x="40" y="65" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">y₁₁</text>
      <text x="60" y="65" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">y₁₂</text>
      <text x="85" y="65" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">y₁ₖ</text>
      
      <text x="70" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">⋮</text>
      
      <text x="40" y="95" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">yₙ₁</text>
      <text x="60" y="95" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">yₙ₂</text>
      <text x="85" y="95" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">yₙₖ</text>
    </g>
    
    <text x="90" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
      k &lt;&lt; p (typically 2-50)
    </text>
  </g>
  
  <!-- Computational complexity note -->
  <g transform="translate(50, 400)">
    <rect x="0" y="0" width="900" height="100" fill="#f8f9fa" stroke="#6c757d" stroke-width="1" rx="5"/>
    <text x="450" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">
      Computational Complexity
    </text>
    
    <g transform="translate(50, 40)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
        <tspan font-weight="bold">• Covariance Matrix:</tspan><tspan> O(np²) - scales with features squared</tspan>
      </text>
      <text x="0" y="20" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
        <tspan font-weight="bold">• Eigendecomposition:</tspan><tspan> O(p³) - most expensive step for high dimensions</tspan>
      </text>
      <text x="0" y="40" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
        <tspan font-weight="bold">• Data Projection:</tspan><tspan> O(npk) - linear in target dimensions</tspan>
      </text>
      
      <text x="450" y="20" font-family="Arial, sans-serif" font-size="12" fill="#e74c3c" font-weight="bold">
        For p &gt; 10,000: Consider randomized PCA or incremental PCA
      </text>
    </g>
  </g>
  
  <!-- Implementation details -->
  <g transform="translate(50, 520)">
    <rect x="0" y="0" width="900" height="130" fill="#fff5f5" stroke="#e53e3e" stroke-width="1" rx="5"/>
    <text x="450" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#e53e3e">
      Key Implementation Details
    </text>
    
    <g transform="translate(30, 40)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2c3e50">Centering is Critical:</text>
      <text x="20" y="18" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• Always subtract feature means: X̄ᵢⱼ = Xᵢⱼ - μⱼ</text>
      <text x="20" y="33" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• Without centering, PC1 often points to data mean</text>
      
      <text x="450" y="0" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2c3e50">Scaling Considerations:</text>
      <text x="470" y="18" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• Use correlation matrix for mixed units</text>
      <text x="470" y="33" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• Standardize features when variance differs greatly</text>
      
      <text x="0" y="60" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2c3e50">Numerical Stability:</text>
      <text x="20" y="78" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• Use SVD instead of eigendecomposition for better numerical properties</text>
      <text x="20" y="93" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• Consider double precision for ill-conditioned covariance matrices</text>
    </g>
  </g>
</svg>