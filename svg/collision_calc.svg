<svg viewBox="0 0 1400 1100" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="700" y="40" font-size="28" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Collision Rate Analysis: The Foundation of Item-Item CF
  </text>
  
  <!-- User-User Collision Example -->
  <g transform="translate(100, 80)">
    <rect x="0" y="0" width="600" height="470" fill="#fff8f0" stroke="#ff9933" stroke-width="3" rx="10"/>
    <text x="300" y="35" font-size="20" font-weight="bold" text-anchor="middle" fill="#ff6600">
      User-User Collision (Low Overlap)
    </text>
    
    <!-- Scenario Setup -->
    <g transform="translate(30, 60)">
      <rect x="0" y="0" width="540" height="90" fill="#fff" stroke="#ff9933" stroke-width="2" rx="5"/>
      <text x="270" y="25" font-size="15" font-weight="bold" text-anchor="middle" fill="#333">
        Scenario: Two Typical Users
      </text>
      <text x="20" y="48" font-size="12" fill="#555">• Total movies in catalog: M = 20,000</text>
      <text x="20" y="66" font-size="12" fill="#555">• User A rated: r₁ = 240 movies (1.2%)</text>
      <text x="20" y="84" font-size="12" fill="#555">• User B rated: r₂ = 240 movies (1.2%)</text>
    </g>
    
    <!-- Collision Calculation -->
    <g transform="translate(30, 170)">
      <text x="0" y="0" font-size="15" font-weight="bold" fill="#333">
        Collision Calculation:
      </text>
      
      <!-- Step 1 -->
      <g transform="translate(20, 25)">
        <text x="0" y="0" font-size="13" font-weight="bold" fill="#ff6600">Step 1: Proportion Rated</text>
        <rect x="0" y="8" width="500" height="50" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
        <text x="10" y="26" font-size="11" font-family="monospace" fill="#555">
          p₁ = r₁/M = 240/20,000 = 0.012 (1.2%)
        </text>
        <text x="10" y="44" font-size="11" font-family="monospace" fill="#555">
          p₂ = r₂/M = 240/20,000 = 0.012 (1.2%)
        </text>
      </g>
      
      <!-- Step 2 -->
      <g transform="translate(20, 90)">
        <text x="0" y="0" font-size="13" font-weight="bold" fill="#ff6600">Step 2: Expected Collisions</text>
        <rect x="0" y="8" width="500" height="70" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
        <text x="10" y="26" font-size="11" font-family="monospace" fill="#555">
          Collisions = M × p₁ × p₂
        </text>
        <text x="10" y="44" font-size="11" font-family="monospace" fill="#555">
          = 20,000 × 0.012 × 0.012
        </text>
        <text x="10" y="62" font-size="12" font-family="monospace" fill="#d63031" font-weight="bold">
          ≈ 2.88 ≈ 3 co-rated movies
        </text>
      </g>
    </g>
    
    <!-- Venn Diagram - Minimal Overlap -->
    <g transform="translate(130, 350)">
      <!-- User A circle -->
      <circle cx="80" cy="50" r="65" fill="#ff9933" opacity="0.3" stroke="#ff6600" stroke-width="3"/>
      <text x="50" y="50" font-size="16" font-weight="bold" fill="#ff6600">User A</text>
      <text x="58" y="68" font-size="13" fill="#333">240</text>
      <text x="48" y="82" font-size="10" fill="#666">movies</text>
      
      <!-- User B circle -->
      <circle cx="240" cy="50" r="65" fill="#ff9933" opacity="0.3" stroke="#ff6600" stroke-width="3"/>
      <text x="250" y="50" font-size="16" font-weight="bold" fill="#ff6600">User B</text>
      <text x="258" y="68" font-size="13" fill="#333">240</text>
      <text x="248" y="82" font-size="10" fill="#666">movies</text>
      
      <!-- Tiny overlap -->
      <ellipse cx="160" cy="50" rx="12" ry="30" fill="#d63031" opacity="0.6"/>
      <text x="160" y="54" font-size="11" font-weight="bold" text-anchor="middle" fill="#fff">~3</text>
      
      <!-- Label -->
      <text x="340" y="55" font-size="14" font-weight="bold" fill="#d63031">
        ❌ Poor Overlap
      </text>
    </g>
  </g>
  
  <!-- Item-Item Collision Example -->
  <g transform="translate(750, 80)">
    <rect x="0" y="0" width="600" height="470" fill="#f0f8ff" stroke="#0066ff" stroke-width="3" rx="10"/>
    <text x="300" y="35" font-size="20" font-weight="bold" text-anchor="middle" fill="#0044cc">
      Item-Item Collision (High Overlap)
    </text>
    
    <!-- Scenario Setup -->
    <g transform="translate(30, 60)">
      <rect x="0" y="0" width="540" height="90" fill="#fff" stroke="#0066ff" stroke-width="2" rx="5"/>
      <text x="270" y="25" font-size="15" font-weight="bold" text-anchor="middle" fill="#333">
        Scenario: Two Popular Movies
      </text>
      <text x="20" y="48" font-size="12" fill="#555">• Total users: N = 500,000</text>
      <text x="20" y="66" font-size="12" fill="#555">• Independence Day: r₁ = 250,000 ratings</text>
      <text x="20" y="84" font-size="12" fill="#555">• Miss Congeniality: r₂ = 250,000 ratings</text>
    </g>
    
    <!-- Collision Calculation -->
    <g transform="translate(30, 170)">
      <text x="0" y="0" font-size="15" font-weight="bold" fill="#333">
        Collision Calculation:
      </text>
      
      <!-- Step 1 -->
      <g transform="translate(20, 25)">
        <text x="0" y="0" font-size="13" font-weight="bold" fill="#0066ff">Step 1: Proportion Rated</text>
        <rect x="0" y="8" width="500" height="50" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
        <text x="10" y="26" font-size="11" font-family="monospace" fill="#555">
          p₁ = r₁/N = 250,000/500,000 = 0.5 (50%)
        </text>
        <text x="10" y="44" font-size="11" font-family="monospace" fill="#555">
          p₂ = r₂/N = 250,000/500,000 = 0.5 (50%)
        </text>
      </g>
      
      <!-- Step 2 -->
      <g transform="translate(20, 90)">
        <text x="0" y="0" font-size="13" font-weight="bold" fill="#0066ff">Step 2: Expected Collisions</text>
        <rect x="0" y="8" width="500" height="70" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
        <text x="10" y="26" font-size="11" font-family="monospace" fill="#555">
          Collisions = N × p₁ × p₂
        </text>
        <text x="10" y="44" font-size="11" font-family="monospace" fill="#555">
          = 500,000 × 0.5 × 0.5
        </text>
        <text x="10" y="62" font-size="12" font-family="monospace" fill="#00b894" font-weight="bold">
          = 125,000 co-ratings
        </text>
      </g>
    </g>
    
    <!-- Venn Diagram - Large Overlap -->
    <g transform="translate(80, 350)">
      <!-- Independence Day circle -->
      <circle cx="100" cy="50" r="80" fill="#4d94ff" opacity="0.4" stroke="#0066ff" stroke-width="3"/>
      <text x="50" y="42" font-size="13" font-weight="bold" fill="#0044cc">Independence</text>
      <text x="70" y="58" font-size="13" font-weight="bold" fill="#0044cc">Day</text>
      <text x="62" y="76" font-size="13" fill="#333">250k</text>
      <text x="64" y="90" font-size="10" fill="#666">users</text>
      
      <!-- Miss Congeniality circle -->
      <circle cx="280" cy="50" r="80" fill="#4d94ff" opacity="0.4" stroke="#0066ff" stroke-width="3"/>
      <text x="250" y="42" font-size="13" font-weight="bold" fill="#0044cc">Miss</text>
      <text x="220" y="58" font-size="13" font-weight="bold" fill="#0044cc">Congeniality</text>
      <text x="270" y="76" font-size="13" fill="#333">250k</text>
      <text x="272" y="90" font-size="10" fill="#666">users</text>
      
      <!-- Large overlap area -->
      <ellipse cx="190" cy="50" rx="55" ry="75" fill="#00b894" opacity="0.6" stroke="#00b894" stroke-width="2"/>
      <text x="190" y="46" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">125k</text>
      <text x="190" y="62" font-size="11" text-anchor="middle" fill="#fff">overlap</text>
      
      <!-- Label -->
      <text x="400" y="55" font-size="14" font-weight="bold" fill="#00b894">
        ✓ Excellent Overlap
      </text>
    </g>
  </g>
  
  <!-- Comparison Table -->
  <g transform="translate(100, 590)">
    <rect x="0" y="0" width="1200" height="460" fill="#f9f9f9" stroke="#666" stroke-width="2" rx="10"/>
    <text x="600" y="40" font-size="22" font-weight="bold" text-anchor="middle" fill="#2d3436">
      Collision Impact on Similarity Reliability
    </text>
    
    <!-- Comparison Metrics -->
    <g transform="translate(50, 70)">
      <!-- Header -->
      <rect x="0" y="0" width="1100" height="45" fill="#34495e" rx="5"/>
      <text x="220" y="28" font-size="15" font-weight="bold" fill="#fff">Metric</text>
      <text x="550" y="28" font-size="15" font-weight="bold" fill="#fff">User-User</text>
      <text x="880" y="28" font-size="15" font-weight="bold" fill="#fff">Item-Item</text>
      
      <!-- Row 1: Total Items/Users -->
      <rect x="0" y="45" width="1100" height="50" fill="#fff"/>
      <text x="20" y="75" font-size="13" font-weight="bold" fill="#333">Total Pool Size</text>
      <text x="550" y="75" font-size="13" text-anchor="middle" fill="#555">20,000 movies</text>
      <text x="880" y="75" font-size="13" text-anchor="middle" fill="#555">500,000 users</text>
      
      <!-- Row 2: Ratings -->
      <rect x="0" y="95" width="1100" height="50" fill="#ecf0f1"/>
      <text x="20" y="125" font-size="13" font-weight="bold" fill="#333">Ratings per Entity</text>
      <text x="550" y="125" font-size="13" text-anchor="middle" fill="#555">240 each (1.2%)</text>
      <text x="880" y="125" font-size="13" text-anchor="middle" fill="#555">250,000 each (50%)</text>
      
      <!-- Row 3: Fill Rate -->
      <rect x="0" y="145" width="1100" height="50" fill="#fff"/>
      <text x="20" y="175" font-size="13" font-weight="bold" fill="#333">Fill Rate (p)</text>
      <text x="550" y="175" font-size="13" text-anchor="middle" fill="#555">0.012</text>
      <text x="880" y="175" font-size="13" text-anchor="middle" fill="#555">0.50</text>
      
      <!-- Row 4: Collision Probability -->
      <rect x="0" y="195" width="1100" height="50" fill="#ecf0f1"/>
      <text x="20" y="225" font-size="13" font-weight="bold" fill="#333">Collision Probability</text>
      <text x="550" y="225" font-size="13" text-anchor="middle" fill="#555">p₁ × p₂ = 0.000144</text>
      <text x="880" y="225" font-size="13" text-anchor="middle" fill="#555">p₁ × p₂ = 0.25</text>
      
      <!-- Row 5: Expected Collisions -->
      <rect x="0" y="245" width="1100" height="50" fill="#fff"/>
      <text x="20" y="275" font-size="13" font-weight="bold" fill="#333">Expected Collisions</text>
      <text x="550" y="275" font-size="13" text-anchor="middle" fill="#d63031" font-weight="bold">~3</text>
      <text x="880" y="275" font-size="13" text-anchor="middle" fill="#00b894" font-weight="bold">125,000</text>
      
      <!-- Row 6: Improvement Factor -->
      <rect x="0" y="295" width="1100" height="50" fill="#ecf0f1"/>
      <text x="20" y="325" font-size="13" font-weight="bold" fill="#333">Improvement Factor</text>
      <text x="550" y="325" font-size="13" text-anchor="middle" fill="#555">Baseline (1×)</text>
      <text x="880" y="325" font-size="13" text-anchor="middle" fill="#00b894" font-weight="bold">41,667× better</text>
      
      <!-- Row 7: Standard Error -->
      <rect x="0" y="345" width="1100" height="50" fill="#fff"/>
      <text x="20" y="375" font-size="13" font-weight="bold" fill="#333">Standard Error</text>
      <text x="550" y="375" font-size="13" text-anchor="middle" fill="#555">SE = σ/√3 ≈ 0.577σ</text>
      <text x="880" y="375" font-size="13" text-anchor="middle" fill="#555">SE = σ/√125,000 ≈ 0.0028σ</text>
      
      <!-- Row 8: Reliability -->
      <rect x="0" y="395" width="1100" height="50" fill="#ecf0f1"/>
      <text x="20" y="425" font-size="13" font-weight="bold" fill="#333">Similarity Reliability</text>
      <text x="550" y="425" font-size="13" text-anchor="middle" fill="#d63031">Very Low</text>
      <text x="880" y="425" font-size="13" text-anchor="middle" fill="#00b894">Very High</text>
    </g>
  </g>
  
  <!-- Mathematical Insight -->
  <g transform="translate(150, 900)">
    <rect x="0" y="0" width="1100" height="170" fill="#fff3cd" stroke="#ffc107" stroke-width="3" rx="8"/>
    <text x="550" y="30" font-size="18" font-weight="bold" text-anchor="middle" fill="#856404">
      📊 Mathematical Foundation
    </text>
    
    <g transform="translate(30, 50)">
      <text x="0" y="0" font-size="14" font-weight="bold" fill="#333">
        Why Item-Item CF Works:
      </text>
      <text x="20" y="25" font-size="12" fill="#555">
        • Collision Rate = N × p₁ × p₂ where p is the proportion of ratings
      </text>
      <text x="20" y="47" font-size="12" fill="#555">
        • Popular items have p ≈ 0.5, typical users have p ≈ 0.012
      </text>
      <text x="20" y="69" font-size="12" fill="#555">
        • Item collision probability (0.25) is 1,736× higher than user collision probability (0.000144)
      </text>
      <text x="20" y="91" font-size="12" font-weight="bold" fill="#00b894">
        • Result: Item similarities computed from 40,000× more data points → dramatically better accuracy
      </text>
      <text x="20" y="113" font-size="12" fill="#555" font-style="italic">
        • The large overlap area in item-item comparisons provides robust, reliable similarity measurements
      </text>
    </g>
  </g>
</svg>