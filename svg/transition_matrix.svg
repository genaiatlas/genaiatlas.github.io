<svg viewBox="0 0 800 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34495e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c3e50;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow4">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="700" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Transition Matrix Construction
  </text>
  <text x="400" y="70" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#666">
    From Comparison Data to Transition Probabilities
  </text>
  
  <!-- Step 1: Raw Comparison Matrix -->
  <g transform="translate(100, 120)">
    <text x="100" y="0" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">
      Step 1: Raw Data
    </text>
    <rect x="0" y="20" width="200" height="140" rx="5" fill="white" stroke="#ddd" stroke-width="1" filter="url(#shadow4)"/>
    
    <!-- Matrix header -->
    <rect x="50" y="20" width="150" height="30" fill="url(#headerGrad)"/>
    <text x="75" y="40" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">vs</text>
    <text x="100" y="40" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">A</text>
    <text x="125" y="40" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">B</text>
    <text x="150" y="40" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">C</text>
    
    <!-- Row headers and data -->
    <rect x="0" y="50" width="50" height="110" fill="url(#headerGrad)"/>
    <text x="25" y="75" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">A</text>
    <text x="25" y="105" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">B</text>
    <text x="25" y="135" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">C</text>
    
    <!-- Matrix values -->
    <text x="100" y="75" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#666">-</text>
    <text x="125" y="75" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#666">9</text>
    <text x="150" y="75" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#666">2</text>
    
    <text x="100" y="105" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#666">1</text>
    <text x="125" y="105" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#666">-</text>
    <text x="150" y="105" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#666">2</text>
    
    <text x="100" y="135" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#666">4</text>
    <text x="125" y="135" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#666">2</text>
    <text x="150" y="135" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#666">-</text>
  </g>
  
  <!-- Step 2: After Laplace Correction -->
  <g transform="translate(500, 120)">
    <text x="100" y="0" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">
      Step 2: +1 Laplace
    </text>
    <rect x="0" y="20" width="200" height="140" rx="5" fill="white" stroke="#ddd" stroke-width="1" filter="url(#shadow4)"/>
    
    <!-- Matrix header -->
    <rect x="50" y="20" width="150" height="30" fill="url(#headerGrad)"/>
    <text x="75" y="40" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">vs</text>
    <text x="100" y="40" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">A</text>
    <text x="125" y="40" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">B</text>
    <text x="150" y="40" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">C</text>
    
    <!-- Row headers and data -->
    <rect x="0" y="50" width="50" height="110" fill="url(#headerGrad)"/>
    <text x="25" y="75" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">A</text>
    <text x="25" y="105" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">B</text>
    <text x="25" y="135" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">C</text>
    
    <!-- Matrix values -->
    <text x="100" y="75" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#666">-</text>
    <text x="125" y="75" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#3498db">10</text>
    <text x="150" y="75" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#3498db">3</text>
    
    <text x="100" y="105" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#3498db">2</text>
    <text x="125" y="105" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#666">-</text>
    <text x="150" y="105" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#3498db">3</text>
    
    <text x="100" y="135" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#3498db">5</text>
    <text x="125" y="135" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#3498db">3</text>
    <text x="150" y="135" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#666">-</text>
  </g>
  
  <!-- Step 3: Transition Matrix -->
  <g transform="translate(300, 320)">
    <text x="100" y="0" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">
      Step 3: Transition Matrix P
    </text>
    <rect x="0" y="20" width="200" height="140" rx="5" fill="white" stroke="#ddd" stroke-width="1" filter="url(#shadow4)"/>
    
    <!-- Matrix header -->
    <rect x="50" y="20" width="150" height="30" fill="url(#headerGrad)"/>
    <text x="75" y="40" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">to→</text>
    <text x="100" y="40" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">A</text>
    <text x="125" y="40" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">B</text>
    <text x="150" y="40" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">C</text>
    
    <!-- Row headers and data -->
    <rect x="0" y="50" width="50" height="110" fill="url(#headerGrad)"/>
    <text x="25" y="75" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">A</text>
    <text x="25" y="105" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">B</text>
    <text x="25" y="135" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">C</text>
    
    <!-- Matrix values (simplified fractions) -->
    <text x="100" y="75" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#27ae60">53/72</text>
    <text x="125" y="75" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666">5/18</text>
    <text x="150" y="75" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666">1/8</text>
    
    <text x="100" y="105" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666">1/18</text>
    <text x="125" y="105" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#27ae60">10/18</text>
    <text x="150" y="105" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666">1/6</text>
    
    <text x="100" y="135" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666">5/24</text>
    <text x="125" y="135" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666">1/6</text>
    <text x="150" y="135" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#27ae60">17/24</text>
  </g>
  
  <!-- Formula Box -->
  <g transform="translate(150, 500)">
    <rect x="0" y="0" width="500" height="120" rx="10" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2"/>
    <text x="250" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Transition Probability Formula
    </text>
    <text x="250" y="60" font-family="monospace" font-size="14" text-anchor="middle" fill="#34495e">
      P(i→j) = [C_corrected[j,i] / Σ(C_corrected[j,:] + C_corrected[:,j])] × (1/N)
    </text>
    <text x="250" y="85" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#7f8c8d">
      Diagonal: P(i→i) = 1 - Σ P(i→j) for j≠i
    </text>
    <text x="250" y="105" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#7f8c8d">
      N = number of nodes (normalization factor)
    </text>
  </g>
  
  <!-- Legend -->
  <g transform="translate(50, 350)">
    <rect x="0" y="0" width="180" height="80" rx="5" fill="white" stroke="#ddd" stroke-width="1"/>
    <text x="90" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">
      Key Points
    </text>
    <text x="10" y="45" font-family="Arial, sans-serif" font-size="12" fill="#666">• Row sum = 1.0</text>
    <text x="10" y="65" font-family="Arial, sans-serif" font-size="12" fill="#666">• Higher diagonal = stable</text>
  </g>
</svg>