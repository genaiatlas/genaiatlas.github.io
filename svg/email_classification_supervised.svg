<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="emailGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e3f2fd;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#bbdefb;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="spamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffebee;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ffcdd2;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="notSpamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f5e8;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#c8e6c9;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="600" fill="#fafafa"/>
  
  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#2c3e50">
    Supervised Learning: Email Spam Classification
  </text>
  
  <!-- Training Phase Section -->
  <rect x="50" y="70" width="380" height="220" rx="10" fill="#ffffff" stroke="#34495e" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">
    Training Phase
  </text>
  
  <!-- Training Dataset -->
  <text x="70" y="120" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#34495e">
    Labeled Training Dataset:
  </text>
  
  <!-- Email Examples -->
  <!-- Spam Email 1 -->
  <rect x="70" y="130" width="340" height="30" rx="5" fill="url(#spamGrad)" stroke="#e57373" stroke-width="1"/>
  <text x="80" y="147" font-family="Arial, sans-serif" font-size="11" fill="#c62828">
    "URGENT! Win $1000000 NOW! Click here immediately!"
  </text>
  <text x="350" y="147" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#c62828">
    → SPAM
  </text>
  
  <!-- Not Spam Email 1 -->
  <rect x="70" y="165" width="340" height="30" rx="5" fill="url(#notSpamGrad)" stroke="#81c784" stroke-width="1"/>
  <text x="80" y="182" font-family="Arial, sans-serif" font-size="11" fill="#2e7d32">
    "Hi John, here's the project report you requested."
  </text>
  <text x="320" y="182" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2e7d32">
    → NOT SPAM
  </text>
  
  <!-- Spam Email 2 -->
  <rect x="70" y="200" width="340" height="30" rx="5" fill="url(#spamGrad)" stroke="#e57373" stroke-width="1"/>
  <text x="80" y="217" font-family="Arial, sans-serif" font-size="11" fill="#c62828">
    "Free pills! Amazing offer! Limited time only!!!"
  </text>
  <text x="350" y="217" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#c62828">
    → SPAM
  </text>
  
  <!-- Not Spam Email 2 -->
  <rect x="70" y="235" width="340" height="30" rx="5" fill="url(#notSpamGrad)" stroke="#81c784" stroke-width="1"/>
  <text x="80" y="252" font-family="Arial, sans-serif" font-size="11" fill="#2e7d32">
    "Meeting scheduled for tomorrow at 2 PM."
  </text>
  <text x="320" y="252" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2e7d32">
    → NOT SPAM
  </text>
  
  <!-- Dots indicating more data -->
  <text x="240" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">
    ... thousands more labeled examples ...
  </text>
  
  <!-- Learning Process Arrow -->
  <path d="M 450 180 L 520 180" stroke="#ff9800" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="485" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ff9800">
    Learning
  </text>
  
  <!-- ML Algorithm Box -->
  <rect x="540" y="150" width="120" height="60" rx="8" fill="#fff3e0" stroke="#ff9800" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e65100">
    ML Algorithm
  </text>
  <text x="600" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e65100">
    (e.g., Naive Bayes,
  </text>
  <text x="600" y="202" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e65100">
    SVM, Random Forest)
  </text>
  
  <!-- Prediction Phase Section -->
  <rect x="50" y="320" width="380" height="200" rx="10" fill="#ffffff" stroke="#34495e" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">
    Prediction Phase
  </text>
  
  <!-- New Email -->
  <text x="70" y="370" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#34495e">
    New Incoming Email:
  </text>
  
  <rect x="70" y="380" width="340" height="40" rx="5" fill="url(#emailGrad)" stroke="#1976d2" stroke-width="2"/>
  <text x="80" y="395" font-family="Arial, sans-serif" font-size="11" fill="#1565c0">
    "Get rich quick! Invest in cryptocurrency now!"
  </text>
  <text x="80" y="408" font-family="Arial, sans-serif" font-size="11" fill="#1565c0">
    "Send money to secure your future wealth!!!"
  </text>
  <text x="375" y="402" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1976d2">
    → ?
  </text>
  
  <!-- Prediction Process -->
  <text x="240" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#34495e">
    Algorithm analyzes patterns learned from training data
  </text>
  
  <!-- Prediction Result -->
  <rect x="120" y="460" width="240" height="40" rx="8" fill="url(#spamGrad)" stroke="#e57373" stroke-width="2"/>
  <text x="240" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#c62828">
    PREDICTION: SPAM
  </text>
  <text x="240" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#c62828">
    Confidence: 94%
  </text>
  
  <!-- Model Performance Section -->
  <rect x="470" y="320" width="380" height="200" rx="10" fill="#ffffff" stroke="#34495e" stroke-width="2" filter="url(#shadow)"/>
  <text x="660" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">
    Model Evaluation
  </text>
  
  <!-- Performance Metrics -->
  <text x="490" y="370" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#34495e">
    Performance Metrics:
  </text>
  
  <text x="500" y="395" font-family="Arial, sans-serif" font-size="12" fill="#2e7d32">
    ✓ Accuracy: 96.5%
  </text>
  <text x="500" y="415" font-family="Arial, sans-serif" font-size="12" fill="#2e7d32">
    ✓ Precision: 94.2%
  </text>
  <text x="500" y="435" font-family="Arial, sans-serif" font-size="12" fill="#2e7d32">
    ✓ Recall: 97.8%
  </text>
  <text x="500" y="455" font-family="Arial, sans-serif" font-size="12" fill="#2e7d32">
    ✓ F1-Score: 95.9%
  </text>
  
  <!-- Validation Note -->
  <text x="660" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d" font-style="italic">
    Measured on held-out test dataset
  </text>
  <text x="660" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d" font-style="italic">
    to ensure unbiased evaluation
  </text>
  
  <!-- Key Features -->
  <text x="450" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#34495e">
    Key Characteristics: Clear objectives • Measurable performance • Prediction-focused • Requires labeled data
  </text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
     refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff9800" />
    </marker>
  </defs>
</svg>