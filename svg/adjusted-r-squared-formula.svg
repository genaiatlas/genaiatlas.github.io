<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title-text { font-family: 'Arial', sans-serif; font-size: 24px; font-weight: bold; fill: #2c3e50; }
      .subtitle-text { font-family: 'Arial', sans-serif; font-size: 18px; font-weight: bold; fill: #34495e; }
      .label-text { font-family: 'Arial', sans-serif; font-size: 14px; fill: #34495e; }
      .small-text { font-family: 'Arial', sans-serif; font-size: 12px; fill: #7f8c8d; }
      .equation-text { font-family: 'Times New Roman', serif; font-size: 16px; fill: #2c3e50; }
      .formula-box { fill: #fff3cd; stroke: #ffc107; stroke-width: 2; rx: 10; }
      .comparison-box { fill: #e3f2fd; stroke: #2196f3; stroke-width: 2; rx: 10; }
      .example-box { fill: #e8f5e8; stroke: #28a745; stroke-width: 2; rx: 10; }
      .insight-box { fill: #f8f9fa; stroke: #6c757d; stroke-width: 1; rx: 5; }
      .penalty-arrow { stroke: #e74c3c; stroke-width: 2; fill: #e74c3c; }
    </style>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title-text">Adjusted R-Squared Formula and Interpretation</text>
  
  <!-- Main Formula -->
  <g transform="translate(100, 70)">
    <rect x="0" y="0" width="600" height="120" class="formula-box"/>
    <text x="300" y="30" text-anchor="middle" class="subtitle-text" fill="#856404">Adjusted R-Squared Formula</text>
    
    <text x="300" y="65" text-anchor="middle" class="equation-text">Adjusted R² = 1 - [RSS/(n-m-1)] / [TSS/(n-1)]</text>
    
    <text x="50" y="95" class="label-text" fill="#856404">Alternative form:</text>
    <text x="300" y="110" text-anchor="middle" class="equation-text">Adjusted R² = 1 - (1-R²) × [(n-1)/(n-m-1)]</text>
  </g>
  
  <!-- Parameter Explanation -->
  <g transform="translate(50, 210)">
    <rect x="0" y="0" width="700" height="100" class="insight-box"/>
    <text x="350" y="25" text-anchor="middle" class="subtitle-text">Parameter Definitions</text>
    
    <text x="50" y="50" class="label-text">Where:</text>
    <text x="70" y="70" class="small-text">• n = number of observations (sample size)</text>
    <text x="400" y="70" class="small-text">• m = number of independent variables</text>
    <text x="70" y="85" class="small-text">• RSS = Residual Sum of Squares</text>
    <text x="400" y="85" class="small-text">• TSS = Total Sum of Squares</text>
  </g>
  
  <!-- Comparison: Regular vs Adjusted R² -->
  <g transform="translate(50, 330)">
    <rect x="0" y="0" width="340" height="160" class="comparison-box"/>
    <text x="170" y="25" text-anchor="middle" class="subtitle-text" fill="#1976d2">Regular R² vs Adjusted R²</text>
    
    <text x="20" y="55" class="label-text" fill="#1976d2">Regular R²:</text>
    <text x="30" y="75" class="small-text">• Always increases with more variables</text>
    <text x="30" y="90" class="small-text">• No penalty for complexity</text>
    <text x="30" y="105" class="small-text">• Can lead to overfitting</text>
    
    <text x="20" y="130" class="label-text" fill="#1976d2">Adjusted R²:</text>
    <text x="30" y="150" class="small-text">• Penalizes unnecessary variables</text>
  </g>
  
  <!-- Example Calculation -->
  <g transform="translate(410, 330)">
    <rect x="0" y="0" width="340" height="160" class="example-box"/>
    <text x="170" y="25" text-anchor="middle" class="subtitle-text" fill="#155724">Marketing Example</text>
    
    <text x="20" y="55" class="label-text" fill="#155724">Given:</text>
    <text x="30" y="75" class="small-text">• n = 200 observations</text>
    <text x="30" y="90" class="small-text">• m = 3 variables (TV, Radio, Newspaper)</text>
    <text x="30" y="105" class="small-text">• R² = 0.897</text>
    
    <text x="20" y="130" class="equation-text">Adjusted R² = 0.896</text>
    <text x="20" y="150" class="small-text">Minimal difference (large n)</text>
  </g>
  
  <!-- When Adjustment Matters -->
  <g transform="translate(50, 510)">
    <text x="350" y="0" text-anchor="middle" class="subtitle-text">When Does the Adjustment Matter?</text>
    
    <!-- Penalty visualization -->
    <g transform="translate(0, 30)">
      <!-- Small sample case -->
      <rect x="0" y="0" width="220" height="50" fill="#fdeaea" stroke="#dc3545" stroke-width="2" rx="5"/>
      <text x="110" y="20" text-anchor="middle" class="label-text" fill="#721c24">Small Sample (n ≈ m)</text>
      <text x="110" y="35" text-anchor="middle" class="small-text">Large penalty</text>
      <text x="110" y="50" text-anchor="middle" class="small-text">Adj R² &lt;&lt; R²</text>
      
      <!-- Arrow -->
      <path d="M 240 25 L 280 25 L 275 20 M 280 25 L 275 30" class="penalty-arrow"/>
      
      <!-- Medium sample case -->
      <rect x="300" y="0" width="220" height="50" fill="#fff3cd" stroke="#ffc107" stroke-width="2" rx="5"/>
      <text x="410" y="20" text-anchor="middle" class="label-text" fill="#856404">Medium Sample</text>
      <text x="410" y="35" text-anchor="middle" class="small-text">Moderate penalty</text>
      <text x="410" y="50" text-anchor="middle" class="small-text">Adj R² &lt; R²</text>
      
      <!-- Arrow -->
      <path d="M 540 25 L 580 25 L 575 20 M 580 25 L 575 30" class="penalty-arrow"/>
      
      <!-- Large sample case -->
      <rect x="600" y="0" width="150" height="50" fill="#e8f5e8" stroke="#28a745" stroke-width="2" rx="5"/>
      <text x="675" y="20" text-anchor="middle" class="label-text" fill="#155724">Large Sample</text>
      <text x="675" y="35" text-anchor="middle" class="small-text">Small penalty</text>
      <text x="675" y="50" text-anchor="middle" class="small-text">Adj R² ≈ R²</text>
    </g>
  </g>
</svg>