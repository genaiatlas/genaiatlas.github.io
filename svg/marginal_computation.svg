<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title-text { font-family: 'Arial', sans-serif; font-size: 24px; font-weight: bold; fill: #2C3E50; }
      .subtitle-text { font-family: 'Arial', sans-serif; font-size: 16px; fill: #555; }
      .node-circle { fill: #4A90E2; stroke: #2E5C8A; stroke-width: 3; }
      .node-target { fill: #E74C3C; stroke: #C0392B; stroke-width: 4; }
      .node-label { font-family: 'Arial', sans-serif; font-size: 14px; fill: white; font-weight: bold; text-anchor: middle; }
      .edge-line { stroke: #999; stroke-width: 2; fill: none; opacity: 0.5; }
      .formula-text { font-family: 'Georgia', serif; font-size: 18px; fill: #2C3E50; }
      .math-text { font-family: 'Courier New', monospace; font-size: 14px; fill: #333; }
      .explanation-text { font-family: 'Arial', sans-serif; font-size: 14px; fill: #555; }
      .highlight-box { fill: #FFF9E6; stroke: #FFA500; stroke-width: 2; rx: 5; }
    </style>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" class="title-text" text-anchor="middle">Marginal Computation</text>
  <text x="400" y="55" class="subtitle-text" text-anchor="middle">Computing P(X_v) from Joint Distribution</text>
  
  <!-- Network Visualization (smaller, on left) -->
  <g transform="translate(0, 80)">
    <text x="150" y="0" class="subtitle-text" text-anchor="middle" font-weight="bold">Full Network</text>
    
    <!-- Edges -->
    <line x1="80" y1="50" x2="150" y2="50" class="edge-line"/>
    <line x1="150" y1="50" x2="220" y2="50" class="edge-line"/>
    <line x1="80" y1="50" x2="115" y2="120" class="edge-line"/>
    <line x1="150" y1="50" x2="150" y2="120" class="edge-line"/>
    <line x1="220" y1="50" x2="185" y2="120" class="edge-line"/>
    <line x1="115" y1="120" x2="150" y2="120" class="edge-line"/>
    <line x1="150" y1="120" x2="185" y2="120" class="edge-line"/>
    <line x1="115" y1="120" x2="150" y2="190" class="edge-line"/>
    <line x1="150" y1="120" x2="150" y2="190" class="edge-line"/>
    <line x1="185" y1="120" x2="150" y2="190" class="edge-line"/>
    
    <!-- Nodes -->
    <circle cx="80" cy="50" r="18" class="node-circle"/>
    <text x="80" y="56" class="node-label" style="font-size: 12px;">X₂</text>
    
    <circle cx="150" cy="50" r="18" class="node-circle"/>
    <text x="150" y="56" class="node-label" style="font-size: 12px;">X₃</text>
    
    <circle cx="220" cy="50" r="18" class="node-circle"/>
    <text x="220" y="56" class="node-label" style="font-size: 12px;">X₄</text>
    
    <circle cx="115" cy="120" r="18" class="node-circle"/>
    <text x="115" y="126" class="node-label" style="font-size: 12px;">X₅</text>
    
    <!-- Target Node -->
    <circle cx="150" cy="120" r="22" class="node-target"/>
    <text x="150" y="127" class="node-label" style="font-size: 13px;">X₁</text>
    
    <circle cx="185" cy="120" r="18" class="node-circle"/>
    <text x="185" y="126" class="node-label" style="font-size: 12px;">X₆</text>
    
    <circle cx="150" cy="190" r="18" class="node-circle"/>
    <text x="150" y="196" class="node-label" style="font-size: 12px;">X₇</text>
    
    <text x="150" y="230" class="explanation-text" text-anchor="middle">Want to compute: P(X₁)</text>
  </g>
  
  <!-- Arrow -->
  <g transform="translate(300, 200)">
    <path d="M 0 0 L 80 0" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
    <text x="40" y="-10" class="explanation-text" text-anchor="middle" font-weight="bold">Marginalize</text>
  </g>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Marginal Formula -->
  <g transform="translate(420, 100)">
    <rect x="0" y="0" width="350" height="180" class="highlight-box"/>
    
    <text x="175" y="30" class="formula-text" text-anchor="middle" font-weight="bold">Marginal Formula</text>
    
    <text x="175" y="65" class="formula-text" text-anchor="middle">P(X₁ = x₁) = </text>
    
    <text x="175" y="100" class="formula-text" text-anchor="middle">Σ P(X₁ = x₁, X₂ = x₂, ..., X_p = x_p)</text>
    <text x="50" y="88" class="math-text">x₂,...,x_p</text>
    
    <line x1="30" y1="110" x2="320" y2="110" stroke="#999" stroke-width="1"/>
    
    <text x="175" y="140" class="math-text" text-anchor="middle">2^(p-1) terms in summation</text>
    <text x="175" y="165" class="explanation-text" text-anchor="middle">(Exponential in number of variables!)</text>
  </g>
  
  <!-- Computational Challenge -->
  <g transform="translate(50, 360)">
    <text x="0" y="0" class="subtitle-text" font-weight="bold">Computational Challenge</text>
    
    <rect x="0" y="15" width="700" height="190" fill="#FFF0F0" stroke="#E74C3C" stroke-width="2" rx="5"/>
    
    <text x="350" y="45" class="explanation-text" text-anchor="middle" font-weight="bold" style="font-size: 16px;">Direct Computation Intractable for Large Networks</text>
    
    <!-- Examples table -->
    <text x="30" y="75" class="math-text" font-weight="bold">Number of Nodes</text>
    <text x="250" y="75" class="math-text" font-weight="bold">Terms in Sum</text>
    <text x="450" y="75" class="math-text" font-weight="bold">Computation Time</text>
    
    <line x1="20" y1="85" x2="680" y2="85" stroke="#CCC" stroke-width="1"/>
    
    <text x="30" y="110" class="math-text">p = 20</text>
    <text x="250" y="110" class="math-text">2^19 ≈ 524,288</text>
    <text x="450" y="110" class="math-text" fill="#27AE60">Feasible</text>
    
    <text x="30" y="135" class="math-text">p = 50</text>
    <text x="250" y="135" class="math-text">2^49 ≈ 5.6 × 10^14</text>
    <text x="450" y="135" class="math-text" fill="#E67E22">Challenging</text>
    
    <text x="30" y="160" class="math-text">p = 100</text>
    <text x="250" y="160" class="math-text">2^99 ≈ 6.3 × 10^29</text>
    <text x="450" y="160" class="math-text" fill="#E74C3C">Impossible</text>
    
    <line x1="20" y1="170" x2="680" y2="170" stroke="#CCC" stroke-width="1"/>
    
    <text x="350" y="193" class="explanation-text" text-anchor="middle" font-style="italic">Need smarter algorithms for efficient inference!</text>
  </g>
</svg>