<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #2c3e50; }
      .subtitle { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #34495e; }
      .label { font-family: Arial, sans-serif; font-size: 12px; fill: #2c3e50; }
      .formula { font-family: Arial, sans-serif; font-size: 14px; fill: #e74c3c; font-weight: bold; }
      .point { fill: #3498db; stroke: #2980b9; stroke-width: 2; }
      .point2 { fill: #e74c3c; stroke: #c0392b; stroke-width: 2; }
      .distance-line { stroke: #27ae60; stroke-width: 3; stroke-dasharray: 5,5; }
      .axis { stroke: #34495e; stroke-width: 2; }
      .grid { stroke: #ecf0f1; stroke-width: 0.5; }
      .background { fill: #f8f9fa; stroke: #dee2e6; stroke-width: 1; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#34495e"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title">Distance Measures in K-Means Clustering</text>
  
  <!-- Euclidean Distance Visualization -->
  <g transform="translate(50, 60)">
    <rect x="0" y="0" width="300" height="180" class="background" rx="10"/>
    <text x="150" y="25" text-anchor="middle" class="subtitle">Euclidean Distance</text>
    
    <!-- Coordinate system -->
    <g transform="translate(50, 150)">
      <!-- Axes -->
      <line x1="0" y1="0" x2="200" y2="0" class="axis" marker-end="url(#arrowhead)"/>
      <line x1="0" y1="0" x2="0" y2="-120" class="axis" marker-end="url(#arrowhead)"/>
      
      <!-- Grid -->
      <defs>
        <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
          <path d="M 20 0 L 0 0 0 20" fill="none" class="grid"/>
        </pattern>
      </defs>
      <rect x="0" y="-120" width="200" height="120" fill="url(#grid)"/>
      
      <!-- Points -->
      <circle cx="40" cy="-80" r="5" class="point"/>
      <circle cx="160" cy="-40" r="5" class="point2"/>
      
      <!-- Distance line -->
      <line x1="40" y1="-80" x2="160" y2="-40" class="distance-line"/>
      
      <!-- Coordinate labels -->
      <text x="40" y="15" text-anchor="middle" class="label">P₁(x₁,y₁)</text>
      <text x="160" y="15" text-anchor="middle" class="label">P₂(x₂,y₂)</text>
      
      <!-- Axis labels -->
      <text x="210" y="5" class="label">x</text>
      <text x="-10" y="-125" class="label">y</text>
      
      <!-- Right triangle visualization -->
      <line x1="40" y1="-80" x2="160" y2="-80" stroke="#95a5a6" stroke-width="1" stroke-dasharray="2,2"/>
      <line x1="160" y1="-80" x2="160" y2="-40" stroke="#95a5a6" stroke-width="1" stroke-dasharray="2,2"/>
      
      <!-- Distance components -->
      <text x="100" y="-70" text-anchor="middle" class="label" style="font-size: 10px;">x₂ - x₁</text>
      <text x="170" y="-60" text-anchor="middle" class="label" style="font-size: 10px;">y₂ - y₁</text>
      <text x="110" y="-50" text-anchor="middle" class="label" style="color: #27ae60; font-weight: bold;">d</text>
    </g>
    
    <text x="150" y="170" text-anchor="middle" class="formula">d = √[(x₂-x₁)² + (y₂-y₁)²]</text>
  </g>
  
  <!-- Squared Euclidean Distance -->
  <g transform="translate(400, 60)">
    <rect x="0" y="0" width="300" height="180" class="background" rx="10"/>
    <text x="150" y="25" text-anchor="middle" class="subtitle">Squared Euclidean Distance</text>
    
    <!-- Feature space representation -->
    <g transform="translate(50, 50)">
      <text x="0" y="0" class="label">For vectors X = [x₁, x₂, ..., xₐ] and Y = [y₁, y₂, ..., yₐ]:</text>
      
      <!-- Vector representation -->
      <g transform="translate(0, 30)">
        <rect x="0" y="0" width="200" height="60" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" rx="5"/>
        <text x="100" y="25" text-anchor="middle" class="formula">d²(X,Y) = Σ(xᵢ - yᵢ)²</text>
        <text x="100" y="45" text-anchor="middle" class="label">i=1 to D</text>
      </g>
      
      <!-- Advantages -->
      <text x="0" y="110" class="label" style="font-weight: bold;">Advantages in K-means:</text>
      <text x="0" y="125" class="label">• Computationally more efficient</text>
      <text x="0" y="140" class="label">• Same relative ordering as Euclidean</text>
      <text x="0" y="155" class="label">• Differentiable for optimization</text>
    </g>
  </g>
  
  <!-- Feature Vector Representation -->
  <g transform="translate(50, 280)">
    <rect x="0" y="0" width="700" height="180" class="background" rx="10"/>
    <text x="350" y="25" text-anchor="middle" class="subtitle">Multi-dimensional Distance Calculation</text>
    
    <!-- Data points table -->
    <g transform="translate(50, 50)">
      <text x="0" y="0" class="label" style="font-weight: bold;">Example: 3D Feature Vectors</text>
      
      <!-- Table headers -->
      <rect x="0" y="20" width="300" height="25" fill="#34495e" stroke="#2c3e50" stroke-width="1"/>
      <text x="50" y="37" text-anchor="middle" class="label" style="fill: white;">Point</text>
      <text x="120" y="37" text-anchor="middle" class="label" style="fill: white;">Feature 1</text>
      <text x="190" y="37" text-anchor="middle" class="label" style="fill: white;">Feature 2</text>
      <text x="250" y="37" text-anchor="middle" class="label" style="fill: white;">Feature 3</text>
      
      <!-- Data rows -->
      <rect x="0" y="45" width="300" height="20" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
      <text x="50" y="58" text-anchor="middle" class="label">X</text>
      <text x="120" y="58" text-anchor="middle" class="label">2.1</text>
      <text x="190" y="58" text-anchor="middle" class="label">3.5</text>
      <text x="250" y="58" text-anchor="middle" class="label">1.8</text>
      
      <rect x="0" y="65" width="300" height="20" fill="#f8f9fa" stroke="#bdc3c7" stroke-width="1"/>
      <text x="50" y="78" text-anchor="middle" class="label">Y</text>
      <text x="120" y="78" text-anchor="middle" class="label">1.5</text>
      <text x="190" y="78" text-anchor="middle" class="label">4.2</text>
      <text x="250" y="78" text-anchor="middle" class="label">2.3</text>
    </g>
    
    <!-- Calculation -->
    <g transform="translate(400, 50)">
      <text x="0" y="0" class="label" style="font-weight: bold;">Distance Calculation:</text>
      
      <text x="0" y="25" class="label">d²(X,Y) = (2.1-1.5)² + (3.5-4.2)² + (1.8-2.3)²</text>
      <text x="0" y="45" class="label">       = (0.6)² + (-0.7)² + (-0.5)²</text>
      <text x="0" y="65" class="label">       = 0.36 + 0.49 + 0.25</text>
      <text x="0" y="85" class="label" style="font-weight: bold; color: #e74c3c;">       = 1.10</text>
      
      <text x="0" y="110" class="label">Euclidean distance: d = √1.10 ≈ 1.05</text>
    </g>
    
    <!-- Scalability note -->
    <g transform="translate(50, 150)">
      <rect x="0" y="0" width="600" height="25" fill="#e8f5e8" stroke="#27ae60" stroke-width="1" rx="5"/>
      <text x="300" y="17" text-anchor="middle" class="label" style="color: #27ae60; font-weight: bold;">
        This calculation scales to any number of dimensions D
      </text>
    </g>
  </g>
</svg>