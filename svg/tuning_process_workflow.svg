<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="step1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E3F2FD;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2196F3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="step2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E8F5E8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4CAF50;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="step3Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFF3E0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF9800;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="step4Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FCE4EC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E91E63;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="step5Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F3E5F5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9C27B0;stop-opacity:1" />
    </linearGradient>
    <marker id="processArrow" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#333">
    5-Step Hyperparameter Tuning Process
  </text>
  
  <!-- Step 1: Identify Hyperparameters -->
  <rect x="50" y="70" width="160" height="120" rx="10" fill="url(#step1Grad)" stroke="#1976D2" stroke-width="2"/>
  <circle cx="70" cy="90" r="12" fill="white"/>
  <text x="70" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1976D2">1</text>
  
  <text x="130" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Identify
  </text>
  <text x="130" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Hyperparameters
  </text>
  <text x="130" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">
    Research algorithm
  </text>
  <text x="130" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">
    Most impactful params
  </text>
  <text x="130" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">
    Domain knowledge
  </text>
  <text x="130" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">
    Literature review
  </text>
  
  <!-- Arrow 1 -->
  <path d="M 220 130 L 260 130" stroke="#333" stroke-width="3" fill="none" marker-end="url(#processArrow)"/>
  
  <!-- Step 2: Determine Ranges -->
  <rect x="270" y="70" width="160" height="120" rx="10" fill="url(#step2Grad)" stroke="#4CAF50" stroke-width="2"/>
  <circle cx="290" cy="90" r="12" fill="white"/>
  <text x="290" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2E7D32">2</text>
  
  <text x="350" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Determine
  </text>
  <text x="350" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Ranges
  </text>
  <text x="350" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">
    Set parameter bounds
  </text>
  <text x="350" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">
    Use default values
  </text>
  <text x="350" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">
    Consider constraints
  </text>
  <text x="350" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">
    Log scale for some
  </text>
  
  <!-- Arrow 2 -->
  <path d="M 440 130 L 480 130" stroke="#333" stroke-width="3" fill="none" marker-end="url(#processArrow)"/>
  
  <!-- Step 3: Choose Search Method -->
  <rect x="490" y="70" width="160" height="120" rx="10" fill="url(#step3Grad)" stroke="#F57C00" stroke-width="2"/>
  <circle cx="510" cy="90" r="12" fill="white"/>
  <text x="510" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#E65100">3</text>
  
  <text x="570" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Choose Search
  </text>
  <text x="570" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Method
  </text>
  <text x="570" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">
    Grid Search
  </text>
  <text x="570" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">
    Random Search
  </text>
  <text x="570" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">
    Bayesian Optimization
  </text>
  <text x="570" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">
    Budget considerations
  </text>
  
  <!-- Arrow 3 -->
  <path d="M 660 130 L 700 130" stroke="#333" stroke-width="3" fill="none" marker-end="url(#processArrow)"/>
  
  <!-- Step 4: Train and Evaluate -->
  <rect x="710" y="70" width="160" height="120" rx="10" fill="url(#step4Grad)" stroke="#C2185B" stroke-width="2"/>
  <circle cx="730" cy="90" r="12" fill="white"/>
  <text x="730" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#C2185B">4</text>
  
  <text x="790" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Train and
  </text>
  <text x="790" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Evaluate
  </text>
  <text x="790" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">
    Cross-validation
  </text>
  <text x="790" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">
    Multiple metrics
  </text>
  <text x="790" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">
    Performance tracking
  </text>
  <text x="790" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">
    Validation splits
  </text>
  
  <!-- Curved arrow down -->
  <path d="M 790 200 Q 850 250 790 300" stroke="#333" stroke-width="3" fill="none" marker-end="url(#processArrow)"/>
  
  <!-- Step 5: Select Best Parameters -->
  <rect x="710" y="310" width="160" height="120" rx="10" fill="url(#step5Grad)" stroke="#7B1FA2" stroke-width="2"/>
  <circle cx="730" cy="330" r="12" fill="white"/>
  <text x="730" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#7B1FA2">5</text>
  
  <text x="790" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Select Best
  </text>
  <text x="790" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Parameters
  </text>
  <text x="790" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">
    Optimize target metric
  </text>
  <text x="790" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">
    Consider trade-offs
  </text>
  <text x="790" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">
    Statistical significance
  </text>
  <text x="790" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">
    Final validation
  </text>
  
  <!-- Process Flow Details -->
  <text x="100" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">
    Key Considerations at Each Step
  </text>
  
  <!-- Step 1 Details -->
  <rect x="50" y="270" width="160" height="80" rx="8" fill="#E3F2FD" stroke="#2196F3" stroke-width="1"/>
  <text x="130" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1976D2">
    Research Phase
  </text>
  <text x="60" y="305" font-family="Arial, sans-serif" font-size="9" fill="#1976D2">
    • Algorithm documentation
  </text>
  <text x="60" y="320" font-family="Arial, sans-serif" font-size="9" fill="#1976D2">
    • Sensitivity analysis
  </text>
  <text x="60" y="335" font-family="Arial, sans-serif" font-size="9" fill="#1976D2">
    • Problem-specific params
  </text>
  
  <!-- Step 2 Details -->
  <rect x="230" y="270" width="160" height="80" rx="8" fill="#E8F5E8" stroke="#4CAF50" stroke-width="1"/>
  <text x="310" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2E7D32">
    Range Definition
  </text>
  <text x="240" y="305" font-family="Arial, sans-serif" font-size="9" fill="#2E7D32">
    • Start with defaults
  </text>
  <text x="240" y="320" font-family="Arial, sans-serif" font-size="9" fill="#2E7D32">
    • Expand systematically
  </text>
  <text x="240" y="335" font-family="Arial, sans-serif" font-size="9" fill="#2E7D32">
    • Resource constraints
  </text>
  
  <!-- Step 3 Details -->
  <rect x="410" y="270" width="160" height="80" rx="8" fill="#FFF3E0" stroke="#FF9800" stroke-width="1"/>
  <text x="490" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#E65100">
    Search Strategy
  </text>
  <text x="420" y="305" font-family="Arial, sans-serif" font-size="9" fill="#E65100">
    • Computational budget
  </text>
  <text x="420" y="320" font-family="Arial, sans-serif" font-size="9" fill="#E65100">
    • Parameter space size
  </text>
  <text x="420" y="335" font-family="Arial, sans-serif" font-size="9" fill="#E65100">
    • Optimization efficiency
  </text>
  
  <!-- Iteration Loop -->
  <text x="500" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">
    Iterative Refinement Process
  </text>
  
  <rect x="200" y="500" width="600" height="60" rx="10" fill="#F5F5F5" stroke="#ddd" stroke-width="1"/>
  <text x="210" y="520" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">
    Continuous Improvement Cycle:
  </text>
  <text x="220" y="535" font-family="Arial, sans-serif" font-size="11" fill="#333">
    1. Analyze results from current search  2. Refine parameter ranges based on findings
  </text>
  <text x="220" y="550" font-family="Arial, sans-serif" font-size="11" fill="#333">
    3. Adjust search strategy if needed  4. Re-run with improved configuration  5. Validate on hold-out set
  </text>
  
  <!-- Curved arrows showing iteration -->
  <path d="M 650 370 Q 600 450 500 500" stroke="#666" stroke-width="2" fill="none" stroke-dasharray="5,5"/>
  <path d="M 400 500 Q 300 450 350 370" stroke="#666" stroke-width="2" fill="none" stroke-dasharray="5,5"/>
</svg>