<svg viewBox="0 0 900 650" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="900" height="650" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="450" y="40" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Sample Variability Framework
  </text>
  
  <text x="450" y="70" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#5a6c7d">
    Understanding How Sample Statistics Vary Across Different Samples
  </text>
  
  <!-- Population box at top -->
  <ellipse cx="450" cy="130" rx="180" ry="50" fill="#3498db" stroke="#2c3e50" stroke-width="2"/>
  <text x="450" y="125" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
    Population
  </text>
  <text x="450" y="145" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="white">
    Parameters: μ, σ² (unknown)
  </text>
  
  <!-- Arrows to samples -->
  <path d="M 350 170 L 150 240" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)" stroke-dasharray="5,5"/>
  <path d="M 420 170 L 350 240" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)" stroke-dasharray="5,5"/>
  <path d="M 480 170 L 550 240" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)" stroke-dasharray="5,5"/>
  <path d="M 550 170 L 750 240" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)" stroke-dasharray="5,5"/>
  
  <text x="450" y="210" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d" font-style="italic">
    Random sampling
  </text>
  
  <!-- Sample 1 -->
  <rect x="50" y="240" width="140" height="80" fill="#9b59b6" stroke="#2c3e50" stroke-width="2" rx="8"/>
  <text x="120" y="265" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">
    Sample 1
  </text>
  <text x="120" y="285" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    n = 50
  </text>
  <text x="120" y="305" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    x̄₁ = 102.3, s₁² = 15.2
  </text>
  
  <!-- Sample 2 -->
  <rect x="280" y="240" width="140" height="80" fill="#9b59b6" stroke="#2c3e50" stroke-width="2" rx="8"/>
  <text x="350" y="265" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">
    Sample 2
  </text>
  <text x="350" y="285" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    n = 50
  </text>
  <text x="350" y="305" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    x̄₂ = 98.7, s₂² = 18.9
  </text>
  
  <!-- Sample 3 -->
  <rect x="480" y="240" width="140" height="80" fill="#9b59b6" stroke="#2c3e50" stroke-width="2" rx="8"/>
  <text x="550" y="265" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">
    Sample 3
  </text>
  <text x="550" y="285" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    n = 50
  </text>
  <text x="550" y="305" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    x̄₃ = 100.5, s₃² = 16.3
  </text>
  
  <!-- Sample 4 (dots representation) -->
  <rect x="680" y="240" width="140" height="80" fill="#9b59b6" stroke="#2c3e50" stroke-width="2" rx="8"/>
  <text x="750" y="265" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">
    Sample ...
  </text>
  <text x="750" y="285" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    n = 50
  </text>
  <text x="750" y="305" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    x̄ₖ = ..., sₖ² = ...
  </text>
  
  <!-- Arrows down to sampling distribution -->
  <path d="M 120 320 L 120 380" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 350 320 L 350 380" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 550 320 L 550 380" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 750 320 L 750 380" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <text x="250" y="360" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d" font-style="italic">
    Collect statistics
  </text>
  
  <!-- Sampling Distribution box -->
  <rect x="200" y="380" width="620" height="140" fill="#e67e22" stroke="#2c3e50" stroke-width="3" rx="10"/>
  <text x="510" y="410" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">
    Sampling Distribution of X̄
  </text>
  <text x="510" y="440" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="white">
    Distribution of sample means across all possible samples
  </text>
  <text x="510" y="470" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">
    Mean: E[X̄] = μ
  </text>
  <text x="510" y="495" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">
    Standard Error: SE(X̄) = σ/√n
  </text>
  
  <!-- Central Limit Theorem box -->
  <rect x="50" y="550" width="380" height="80" fill="white" stroke="#16a085" stroke-width="2" rx="8"/>
  <text x="240" y="575" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#16a085">
    Central Limit Theorem
  </text>
  <text x="240" y="600" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">
    As n increases, the sampling distribution of X̄
  </text>
  <text x="240" y="617" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">
    approaches a normal distribution, regardless of population shape
  </text>
  
  <!-- Key Insights box -->
  <rect x="470" y="550" width="380" height="80" fill="white" stroke="#c0392b" stroke-width="2" rx="8"/>
  <text x="660" y="575" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#c0392b">
    Key Insights
  </text>
  <text x="660" y="600" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">
    • Sample statistics vary randomly across samples
  </text>
  <text x="660" y="617" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">
    • Larger n → smaller SE → more precise estimates
  </text>
  
  <!-- Visualization area on right -->
  <rect x="50" y="380" width="130" height="140" fill="white" stroke="#34495e" stroke-width="2" rx="5"/>
  <text x="115" y="400" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Sample Means
  </text>
  
  <!-- Simple histogram representation -->
  <rect x="70" y="470" width="10" height="30" fill="#9b59b6"/>
  <rect x="85" y="450" width="10" height="50" fill="#9b59b6"/>
  <rect x="100" y="430" width="10" height="70" fill="#9b59b6"/>
  <rect x="115" y="420" width="10" height="80" fill="#9b59b6"/>
  <rect x="130" y="440" width="10" height="60" fill="#9b59b6"/>
  <rect x="145" y="460" width="10" height="40" fill="#9b59b6"/>
  <rect x="160" y="480" width="10" height="20" fill="#9b59b6"/>
  
  <line x1="70" y1="505" x2="170" y2="505" stroke="#2c3e50" stroke-width="1"/>
  <text x="115" y="515" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#5a6c7d">
    x̄ values
  </text>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#2c3e50"/>
    </marker>
  </defs>
</svg>