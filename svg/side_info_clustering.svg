<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="600" y="40" font-size="24" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Side Information Clustering Approach
  </text>
  
  <!-- Step 1: Initial Pools -->
  <g id="initial-pools">
    <text x="150" y="100" font-size="18" font-weight="bold" fill="#2c3e50">Step 1: Initial Data</text>
    
    <!-- User Pool -->
    <rect x="50" y="120" width="200" height="180" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="8"/>
    <text x="150" y="150" font-size="16" font-weight="bold" text-anchor="middle" fill="#1976d2">Large User Pool</text>
    
    <!-- User icons -->
    <circle cx="80" cy="180" r="15" fill="#64b5f6"/>
    <circle cx="130" cy="180" r="15" fill="#64b5f6"/>
    <circle cx="180" cy="180" r="15" fill="#64b5f6"/>
    <circle cx="220" cy="180" r="15" fill="#64b5f6"/>
    <circle cx="80" cy="230" r="15" fill="#64b5f6"/>
    <circle cx="130" cy="230" r="15" fill="#64b5f6"/>
    <circle cx="180" cy="230" r="15" fill="#64b5f6"/>
    <circle cx="220" cy="230" r="15" fill="#64b5f6"/>
    <circle cx="105" cy="270" r="15" fill="#64b5f6"/>
    <circle cx="155" cy="270" r="15" fill="#64b5f6"/>
    <circle cx="205" cy="270" r="15" fill="#64b5f6"/>
    
    <text x="150" y="290" font-size="12" text-anchor="middle" fill="#1976d2">+ Demographics</text>
    
    <!-- Item Pool -->
    <rect x="350" y="120" width="200" height="180" fill="#fff3e0" stroke="#f57c00" stroke-width="2" rx="8"/>
    <text x="450" y="150" font-size="16" font-weight="bold" text-anchor="middle" fill="#f57c00">Large Item Pool</text>
    
    <!-- Item icons -->
    <rect x="375" y="170" width="30" height="40" fill="#ffb74d" rx="3"/>
    <rect x="425" y="170" width="30" height="40" fill="#ffb74d" rx="3"/>
    <rect x="475" y="170" width="30" height="40" fill="#ffb74d" rx="3"/>
    <rect x="515" y="170" width="30" height="40" fill="#ffb74d" rx="3"/>
    <rect x="375" y="225" width="30" height="40" fill="#ffb74d" rx="3"/>
    <rect x="425" y="225" width="30" height="40" fill="#ffb74d" rx="3"/>
    <rect x="475" y="225" width="30" height="40" fill="#ffb74d" rx="3"/>
    <rect x="515" y="225" width="30" height="40" fill="#ffb74d" rx="3"/>
    
    <text x="450" y="290" font-size="12" text-anchor="middle" fill="#f57c00">+ Metadata</text>
  </g>
  
  <!-- Arrow down -->
  <path d="M 300 320 L 300 370" stroke="#666" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="320" y="350" font-size="14" fill="#666">Clustering with Side Info</text>
  
  <!-- Step 2: Clustered Groups -->
  <g id="clustered-groups">
    <text x="150" y="400" font-size="18" font-weight="bold" fill="#2c3e50">Step 2: Homogeneous Clusters</text>
    
    <!-- User Clusters -->
    <g id="user-clusters">
      <rect x="30" y="420" width="100" height="120" fill="#bbdefb" stroke="#1976d2" stroke-width="2" rx="5"/>
      <text x="80" y="445" font-size="14" font-weight="bold" text-anchor="middle" fill="#1976d2">Group 1</text>
      <circle cx="55" cy="470" r="12" fill="#42a5f5"/>
      <circle cx="105" cy="470" r="12" fill="#42a5f5"/>
      <circle cx="55" cy="505" r="12" fill="#42a5f5"/>
      <circle cx="105" cy="505" r="12" fill="#42a5f5"/>
      <text x="80" y="535" font-size="10" text-anchor="middle" fill="#555">Similar users</text>
      
      <rect x="150" y="420" width="100" height="120" fill="#c8e6c9" stroke="#388e3c" stroke-width="2" rx="5"/>
      <text x="200" y="445" font-size="14" font-weight="bold" text-anchor="middle" fill="#388e3c">Group 2</text>
      <circle cx="175" cy="470" r="12" fill="#66bb6a"/>
      <circle cx="225" cy="470" r="12" fill="#66bb6a"/>
      <circle cx="175" cy="505" r="12" fill="#66bb6a"/>
      <circle cx="225" cy="505" r="12" fill="#66bb6a"/>
      <text x="200" y="535" font-size="10" text-anchor="middle" fill="#555">Similar users</text>
      
      <rect x="270" y="420" width="100" height="120" fill="#f8bbd0" stroke="#c2185b" stroke-width="2" rx="5"/>
      <text x="320" y="445" font-size="14" font-weight="bold" text-anchor="middle" fill="#c2185b">Group 3</text>
      <circle cx="295" cy="470" r="12" fill="#ec407a"/>
      <circle cx="345" cy="470" r="12" fill="#ec407a"/>
      <circle cx="295" cy="505" r="12" fill="#ec407a"/>
      <circle cx="345" cy="505" r="12" fill="#ec407a"/>
      <text x="320" y="535" font-size="10" text-anchor="middle" fill="#555">Similar users</text>
    </g>
    
    <!-- Item Clusters -->
    <g id="item-clusters">
      <rect x="450" y="420" width="100" height="90" fill="#ffe0b2" stroke="#e65100" stroke-width="2" rx="5"/>
      <text x="500" y="445" font-size="14" font-weight="bold" text-anchor="middle" fill="#e65100">Type A</text>
      <rect x="470" y="460" width="20" height="30" fill="#ff9800" rx="2"/>
      <rect x="510" y="460" width="20" height="30" fill="#ff9800" rx="2"/>
      <text x="500" y="505" font-size="10" text-anchor="middle" fill="#555">Similar items</text>
      
      <rect x="570" y="420" width="100" height="90" fill="#d1c4e9" stroke="#512da8" stroke-width="2" rx="5"/>
      <text x="620" y="445" font-size="14" font-weight="bold" text-anchor="middle" fill="#512da8">Type B</text>
      <rect x="590" y="460" width="20" height="30" fill="#7e57c2" rx="2"/>
      <rect x="630" y="460" width="20" height="30" fill="#7e57c2" rx="2"/>
      <text x="620" y="505" font-size="10" text-anchor="middle" fill="#555">Similar items</text>
      
      <rect x="690" y="420" width="100" height="90" fill="#b2dfdb" stroke="#00695c" stroke-width="2" rx="5"/>
      <text x="740" y="445" font-size="14" font-weight="bold" text-anchor="middle" fill="#00695c">Type C</text>
      <rect x="710" y="460" width="20" height="30" fill="#26a69a" rx="2"/>
      <rect x="750" y="460" width="20" height="30" fill="#26a69a" rx="2"/>
      <text x="740" y="505" font-size="10" text-anchor="middle" fill="#555">Similar items</text>
      
      <rect x="810" y="420" width="100" height="90" fill="#ffccbc" stroke="#bf360c" stroke-width="2" rx="5"/>
      <text x="860" y="445" font-size="14" font-weight="bold" text-anchor="middle" fill="#bf360c">Type D</text>
      <rect x="830" y="460" width="20" height="30" fill="#ff7043" rx="2"/>
      <rect x="870" y="460" width="20" height="30" fill="#ff7043" rx="2"/>
      <text x="860" y="505" font-size="10" text-anchor="middle" fill="#555">Similar items</text>
    </g>
  </g>
  
  <!-- Arrow down -->
  <path d="M 450 560 L 450 590" stroke="#666" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="470" y="580" font-size="14" fill="#666">Apply CF within clusters</text>
  
  <!-- Step 3: Recommendation Matrix -->
  <g id="recommendation-matrix">
    <text x="450" y="620" font-size="18" font-weight="bold" fill="#2c3e50">Step 3: Localized Recommendations (3×4 = 12 Models)</text>
    
    <!-- Matrix representation -->
    <rect x="200" y="640" width="600" height="130" fill="#fafafa" stroke="#424242" stroke-width="2" rx="5"/>
    
    <!-- Column headers -->
    <text x="290" y="665" font-size="13" font-weight="bold" text-anchor="middle" fill="#e65100">Type A</text>
    <text x="440" y="665" font-size="13" font-weight="bold" text-anchor="middle" fill="#512da8">Type B</text>
    <text x="590" y="665" font-size="13" font-weight="bold" text-anchor="middle" fill="#00695c">Type C</text>
    <text x="740" y="665" font-size="13" font-weight="bold" text-anchor="middle" fill="#bf360c">Type D</text>
    
    <!-- Row labels and cells -->
    <text x="220" y="700" font-size="13" font-weight="bold" fill="#1976d2">G1</text>
    <rect x="250" y="680" width="80" height="30" fill="#e3f2fd" stroke="#1976d2" stroke-width="1" rx="3"/>
    <text x="290" y="700" font-size="11" text-anchor="middle" fill="#333">CF Model</text>
    <rect x="400" y="680" width="80" height="30" fill="#e3f2fd" stroke="#1976d2" stroke-width="1" rx="3"/>
    <text x="440" y="700" font-size="11" text-anchor="middle" fill="#333">CF Model</text>
    <rect x="550" y="680" width="80" height="30" fill="#e3f2fd" stroke="#1976d2" stroke-width="1" rx="3"/>
    <text x="590" y="700" font-size="11" text-anchor="middle" fill="#333">CF Model</text>
    <rect x="700" y="680" width="80" height="30" fill="#e3f2fd" stroke="#1976d2" stroke-width="1" rx="3"/>
    <text x="740" y="700" font-size="11" text-anchor="middle" fill="#333">CF Model</text>
    
    <text x="220" y="735" font-size="13" font-weight="bold" fill="#388e3c">G2</text>
    <rect x="250" y="715" width="80" height="30" fill="#f1f8e9" stroke="#388e3c" stroke-width="1" rx="3"/>
    <text x="290" y="735" font-size="11" text-anchor="middle" fill="#333">CF Model</text>
    <rect x="400" y="715" width="80" height="30" fill="#f1f8e9" stroke="#388e3c" stroke-width="1" rx="3"/>
    <text x="440" y="735" font-size="11" text-anchor="middle" fill="#333">CF Model</text>
    <rect x="550" y="715" width="80" height="30" fill="#f1f8e9" stroke="#388e3c" stroke-width="1" rx="3"/>
    <text x="590" y="735" font-size="11" text-anchor="middle" fill="#333">CF Model</text>
    <rect x="700" y="715" width="80" height="30" fill="#f1f8e9" stroke="#388e3c" stroke-width="1" rx="3"/>
    <text x="740" y="735" font-size="11" text-anchor="middle" fill="#333">CF Model</text>
    
    <text x="220" y="765" font-size="13" font-weight="bold" fill="#c2185b">G3</text>
    <rect x="250" y="750" width="80" height="30" fill="#fce4ec" stroke="#c2185b" stroke-width="1" rx="3"/>
    <text x="290" y="765" font-size="11" text-anchor="middle" fill="#333">CF Model</text>
    <rect x="400" y="750" width="80" height="30" fill="#fce4ec" stroke="#c2185b" stroke-width="1" rx="3"/>
    <text x="440" y="765" font-size="11" text-anchor="middle" fill="#333">CF Model</text>
    <rect x="550" y="750" width="80" height="30" fill="#fce4ec" stroke="#c2185b" stroke-width="1" rx="3"/>
    <text x="590" y="765" font-size="11" text-anchor="middle" fill="#333">CF Model</text>
    <rect x="700" y="750" width="80" height="30" fill="#fce4ec" stroke="#c2185b" stroke-width="1" rx="3"/>
    <text x="740" y="765" font-size="11" text-anchor="middle" fill="#333">CF Model</text>
  </g>
  
  <!-- Legend -->
  <g id="legend">
    <rect x="920" y="120" width="250" height="200" fill="#f5f5f5" stroke="#666" stroke-width="1" rx="5"/>
    <text x="1045" y="145" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Key Benefits</text>
    
    <text x="935" y="175" font-size="12" fill="#333">✓ More homogeneous groups</text>
    <text x="935" y="200" font-size="12" fill="#333">✓ Better prediction accuracy</text>
    <text x="935" y="225" font-size="12" fill="#333">✓ Handles cold start better</text>
    <text x="935" y="250" font-size="12" fill="#333">✓ Utilizes rich side data</text>
    <text x="935" y="275" font-size="12" fill="#333">✓ More interpretable clusters</text>
    <text x="935" y="300" font-size="12" fill="#333">✓ Scalable approach</text>
  </g>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#666"/>
    </marker>
  </defs>
</svg>