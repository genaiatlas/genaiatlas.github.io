<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'Arial', sans-serif; font-size: 20px; font-weight: bold; fill: #2c3e50; }
      .subtitle { font-family: 'Arial', sans-serif; font-size: 14px; fill: #34495e; }
      .axis-label { font-family: 'Arial', sans-serif; font-size: 12px; fill: #2c3e50; }
      .bias-curve { stroke: #e74c3c; stroke-width: 3; fill: none; }
      .variance-curve { stroke: #3498db; stroke-width: 3; fill: none; }
      .total-error-curve { stroke: #2c3e50; stroke-width: 4; fill: none; }
      .irreducible-error { stroke: #95a5a6; stroke-width: 2; stroke-dasharray: 5,5; }
      .optimal-line { stroke: #27ae60; stroke-width: 2; stroke-dasharray: 8,4; }
      .grid-line { stroke: #ecf0f1; stroke-width: 1; }
      .legend-box { fill: #ffffff; stroke: #bdc3c7; stroke-width: 1; }
      .decomposition { font-family: 'Times New Roman', serif; font-size: 14px; fill: #2c3e50; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title">Bias-Variance Decomposition of Prediction Error</text>
  
  <!-- Grid lines -->
  <g class="grid-line">
    <!-- Vertical grid lines -->
    <line x1="100" y1="60" x2="100" y2="360"/>
    <line x1="180" y1="60" x2="180" y2="360"/>
    <line x1="260" y1="60" x2="260" y2="360"/>
    <line x1="340" y1="60" x2="340" y2="360"/>
    <line x1="420" y1="60" x2="420" y2="360"/>
    <line x1="500" y1="60" x2="500" y2="360"/>
    <line x1="580" y1="60" x2="580" y2="360"/>
    <line x1="660" y1="60" x2="660" y2="360"/>
    <!-- Horizontal grid lines -->
    <line x1="100" y1="120" x2="660" y2="120"/>
    <line x1="100" y1="180" x2="660" y2="180"/>
    <line x1="100" y1="240" x2="660" y2="240"/>
    <line x1="100" y1="300" x2="660" y2="300"/>
  </g>
  
  <!-- Axes -->
  <line x1="100" y1="60" x2="100" y2="370" stroke="#34495e" stroke-width="2"/>
  <line x1="90" y1="360" x2="670" y2="360" stroke="#34495e" stroke-width="2"/>
  
  <!-- Axis labels -->
  <text x="380" y="390" text-anchor="middle" class="axis-label">Model Complexity</text>
  <text x="50" y="210" text-anchor="middle" class="axis-label" transform="rotate(-90 50 210)">Error</text>
  
  <!-- Complexity labels -->
  <text x="140" y="380" text-anchor="middle" class="axis-label">Simple</text>
  <text x="380" y="380" text-anchor="middle" class="axis-label">Optimal</text>
  <text x="620" y="380" text-anchor="middle" class="axis-label">Complex</text>
  
  <!-- Irreducible Error (constant line) -->
  <line x1="100" y1="320" x2="660" y2="320" class="irreducible-error"/>
  
  <!-- Bias² curve (decreasing) -->
  <path d="M 100 280 C 200 260 300 240 400 220 C 500 200 600 185 660 180" class="bias-curve"/>
  
  <!-- Variance curve (increasing) -->
  <path d="M 100 180 C 200 185 300 200 400 220 C 500 260 600 320 660 380" class="variance-curve"/>
  
  <!-- Total Error curve (U-shaped) -->
  <path d="M 100 310 C 200 290 300 250 380 210 C 420 200 460 210 500 240 C 550 280 600 330 660 380" class="total-error-curve"/>
  
  <!-- Optimal complexity line -->
  <line x1="380" y1="60" x2="380" y2="360" class="optimal-line"/>
  
  <!-- Optimal point marker -->
  <circle cx="380" cy="210" r="5" fill="#27ae60" stroke="white" stroke-width="2"/>
  
  <!-- Mathematical decomposition -->
  <rect x="470" y="80" width="320" height="120" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2" rx="8"/>
  <text x="630" y="105" text-anchor="middle" class="subtitle">Error Decomposition</text>
  
  <text x="485" y="130" class="decomposition">Total Error = Bias² + Variance + σ²</text>
  <text x="485" y="150" class="decomposition">where:</text>
  <text x="500" y="170" class="decomposition">• Bias² = (E[ŷ] - y)²</text>
  <text x="500" y="185" class="decomposition">• Variance = E[(ŷ - E[ŷ])²]</text>
  
  <!-- Legend -->
  <rect x="480" y="220" width="180" height="120" class="legend-box"/>
  <text x="570" y="240" text-anchor="middle" class="subtitle">Error Components</text>
  
  <line x1="495" y1="255" x2="525" y2="255" class="bias-curve"/>
  <text x="535" y="260" class="subtitle">Bias²</text>
  
  <line x1="495" y1="275" x2="525" y2="275" class="variance-curve"/>
  <text x="535" y="280" class="subtitle">Variance</text>
  
  <line x1="495" y1="295" x2="525" y2="295" class="total-error-curve"/>
  <text x="535" y="300" class="subtitle">Total Error</text>
  
  <line x1="495" y1="315" x2="525" y2="315" class="irreducible-error"/>
  <text x="535" y="320" class="subtitle">Irreducible Error (σ²)</text>
  
  <!-- Key insights box -->
  <rect x="100" y="390" width="600" height="100" fill="#e8f6f3" stroke="#16a085" stroke-width="2" rx="8"/>
  <text x="400" y="410" text-anchor="middle" class="subtitle" fill="#16a085">Key Insights from the Bias-Variance Tradeoff</text>
  
  <text x="120" y="430" class="axis-label" fill="#16a085">• Simple models: High bias (systematic error), low variance (consistent)</text>
  <text x="120" y="445" class="axis-label" fill="#16a085">• Complex models: Low bias (flexible), high variance (sensitive to data)</text>
  <text x="120" y="460" class="axis-label" fill="#16a085">• Optimal complexity: Balances bias and variance for minimum total error</text>
  <text x="120" y="475" class="axis-label" fill="#16a085">• Irreducible error: Lower bound determined by data noise (cannot be reduced)</text>
  
  <!-- Region labels -->
  <text x="200" y="90" text-anchor="middle" class="subtitle" fill="#e74c3c">High Bias Region</text>
  <text x="200" y="105" text-anchor="middle" class="axis-label" fill="#e74c3c">(Underfitting)</text>
  
  <text x="380" y="90" text-anchor="middle" class="subtitle" fill="#27ae60">Sweet Spot</text>
  <text x="380" y="105" text-anchor="middle" class="axis-label" fill="#27ae60">(Optimal)</text>
  
  <text x="560" y="90" text-anchor="middle" class="subtitle" fill="#3498db">High Variance Region</text>
  <text x="560" y="105" text-anchor="middle" class="axis-label" fill="#3498db">(Overfitting)</text>
</svg>