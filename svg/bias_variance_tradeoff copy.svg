<svg width="650" height="450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .chart-title { font-family: 'Arial', sans-serif; font-size: 18px; font-weight: bold; text-anchor: middle; }
      .axis-label { font-family: 'Arial', sans-serif; font-size: 14px; text-anchor: middle; }
      .legend-text { font-family: 'Arial', sans-serif; font-size: 12px; }
      .equation-text { font-family: 'Arial', sans-serif; font-size: 13px; }
      .grid-line { stroke: #e8e8e8; stroke-width: 1; }
      .axis-line { stroke: #333; stroke-width: 2; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="650" height="450" fill="#fafafa"/>
  
  <!-- Chart Title -->
  <text x="325" y="30" class="chart-title">Bias-Variance Tradeoff in Model Complexity</text>
  
  <!-- Grid Lines -->
  <g class="grid">
    <!-- Horizontal grid lines -->
    <line x1="80" y1="80" x2="520" y2="80" class="grid-line"/>
    <line x1="80" y1="120" x2="520" y2="120" class="grid-line"/>
    <line x1="80" y1="160" x2="520" y2="160" class="grid-line"/>
    <line x1="80" y1="200" x2="520" y2="200" class="grid-line"/>
    <line x1="80" y1="240" x2="520" y2="240" class="grid-line"/>
    <line x1="80" y1="280" x2="520" y2="280" class="grid-line"/>
    
    <!-- Vertical grid lines -->
    <line x1="140" y1="60" x2="140" y2="300" class="grid-line"/>
    <line x1="200" y1="60" x2="200" y2="300" class="grid-line"/>
    <line x1="260" y1="60" x2="260" y2="300" class="grid-line"/>
    <line x1="320" y1="60" x2="320" y2="300" class="grid-line"/>
    <line x1="380" y1="60" x2="380" y2="300" class="grid-line"/>
    <line x1="440" y1="60" x2="440" y2="300" class="grid-line"/>
    <line x1="500" y1="60" x2="500" y2="300" class="grid-line"/>
  </g>
  
  <!-- Axes -->
  <line x1="80" y1="60" x2="80" y2="300" class="axis-line"/>
  <line x1="80" y1="300" x2="520" y2="300" class="axis-line"/>
  
  <!-- Bias Curve (decreasing) -->
  <path d="M 80 100 Q 150 110 220 130 Q 290 150 360 180 Q 430 220 500 260" 
        stroke="#e74c3c" stroke-width="3" fill="none"/>
  
  <!-- Variance Curve (increasing) -->
  <path d="M 80 260 Q 150 250 220 230 Q 290 200 360 160 Q 430 110 500 80" 
        stroke="#3498db" stroke-width="3" fill="none"/>
  
  <!-- Total Error Curve (U-shaped) -->
  <path d="M 80 240 Q 150 220 220 190 Q 290 170 360 180 Q 430 200 500 240" 
        stroke="#2ecc71" stroke-width="4" fill="none"/>
  
  <!-- Irreducible Error (constant line) -->
  <line x1="80" y1="270" x2="520" y2="270" stroke="#95a5a6" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Optimal Point -->
  <circle cx="290" cy="170" r="8" fill="#27ae60" stroke="#fff" stroke-width="3"/>
  <text x="300" y="155" class="legend-text" fill="#27ae60" font-weight="bold">Optimal</text>
  <text x="300" y="168" class="legend-text" fill="#27ae60" font-weight="bold">Complexity</text>
  
  <!-- Region Labels -->
  <g transform="translate(100, 350)">
    <rect x="0" y="0" width="120" height="40" fill="rgba(231, 76, 60, 0.1)" stroke="none"/>
    <text x="60" y="20" class="legend-text" text-anchor="middle" fill="#e74c3c">High Bias</text>
    <text x="60" y="32" class="legend-text" text-anchor="middle" fill="#e74c3c">Underfitting</text>
  </g>
  
  <g transform="translate(380, 350)">
    <rect x="0" y="0" width="120" height="40" fill="rgba(52, 152, 219, 0.1)" stroke="none"/>
    <text x="60" y="20" class="legend-text" text-anchor="middle" fill="#3498db">High Variance</text>
    <text x="60" y="32" class="legend-text" text-anchor="middle" fill="#3498db">Overfitting</text>
  </g>
  
  <!-- Y-axis labels -->
  <text x="70" y="85" class="legend-text" text-anchor="end">High</text>
  <text x="70" y="185" class="legend-text" text-anchor="end">Medium</text>
  <text x="70" y="285" class="legend-text" text-anchor="end">Low</text>
  
  <!-- X-axis labels -->
  <text x="80" y="320" class="legend-text" text-anchor="middle">Low</text>
  <text x="520" y="320" class="legend-text" text-anchor="middle">High</text>
  
  <!-- Axis Labels -->
  <text x="300" y="340" class="axis-label">Model Complexity</text>
  <text x="25" y="180" class="axis-label" transform="rotate(-90 25 180)">Prediction Error</text>
  
  <!-- Legend -->
  <g transform="translate(540, 80)">
    <rect x="0" y="0" width="100" height="120" fill="white" stroke="#ccc" stroke-width="1"/>
    <text x="50" y="15" class="legend-text" text-anchor="middle" font-weight="bold">Components</text>
    <line x1="10" y1="30" x2="30" y2="30" stroke="#e74c3c" stroke-width="3"/>
    <text x="35" y="35" class="legend-text">Bias²</text>
    <line x1="10" y1="50" x2="30" y2="50" stroke="#3498db" stroke-width="3"/>
    <text x="35" y="55" class="legend-text">Variance</text>
    <line x1="10" y1="70" x2="30" y2="70" stroke="#2ecc71" stroke-width="3"/>
    <text x="35" y="75" class="legend-text">Total Error</text>
    <line x1="10" y1="90" x2="30" y2="90" stroke="#95a5a6" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="35" y="95" class="legend-text">Irreducible</text>
    <text x="35" y="107" class="legend-text">Error</text>
  </g>
  
  <!-- Mathematical Formula -->
  <g transform="translate(80, 380)">
    <rect x="0" y="0" width="450" height="50" fill="white" stroke="#ccc" stroke-width="1" rx="5"/>
    <text x="10" y="20" class="equation-text" font-weight="bold">Error Decomposition:</text>
    <text x="10" y="38" class="equation-text">E[(y - ŷ)²] = Bias²[ŷ] + Var[ŷ] + σ² (irreducible noise)</text>
  </g>
</svg>