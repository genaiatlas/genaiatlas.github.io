<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1400" height="1000" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="700" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Retrieval &amp; Indexing Overview
  </text>
  <text x="700" y="70" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#495057">
    Efficient Document Storage and Retrieval Strategies
  </text>
  
  <!-- Left Side: Indexing -->
  <g id="indexing-section">
    <rect x="50" y="100" width="650" height="850" rx="15" fill="#d0ebff" stroke="#1c7ed6" stroke-width="4"/>
    <text x="375" y="140" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      🗂️ INDEXING
    </text>
    <text x="375" y="165" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#495057">
      Organize Documents for Efficient Search
    </text>
    
    <!-- 1. Chunk Optimization -->
    <rect x="80" y="190" width="590" height="165" rx="10" fill="#fff" stroke="#1c7ed6" stroke-width="3"/>
    <text x="375" y="215" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      1. Chunk Optimization
    </text>
    <rect x="100" y="230" width="260" height="110" rx="5" fill="#f8f9fa" stroke="#1c7ed6" stroke-width="2"/>
    <text x="230" y="250" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#495057">
      Splitting Strategies
    </text>
    <text x="115" y="270" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Semantic Splitter
    </text>
    <text x="115" y="287" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Fixed Size Chunks
    </text>
    <text x="115" y="304" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Sliding Window
    </text>
    <text x="115" y="321" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Document Structure
    </text>
    
    <rect x="380" y="230" width="270" height="110" rx="5" fill="#f8f9fa" stroke="#1c7ed6" stroke-width="2"/>
    <text x="515" y="250" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#495057">
      Key Considerations
    </text>
    <text x="395" y="270" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Chunk size (100-1000 tokens)
    </text>
    <text x="395" y="287" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Overlap (10-20%)
    </text>
    <text x="395" y="304" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Metadata preservation
    </text>
    <text x="395" y="321" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Context boundaries
    </text>
    
    <!-- 2. Multi-Representation -->
    <rect x="80" y="375" width="590" height="165" rx="10" fill="#fff" stroke="#1c7ed6" stroke-width="3"/>
    <text x="375" y="400" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      2. Multi-Representation Indexing
    </text>
    <rect x="100" y="415" width="260" height="110" rx="5" fill="#f8f9fa" stroke="#1c7ed6" stroke-width="2"/>
    <text x="230" y="435" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#495057">
      Approaches
    </text>
    <text x="115" y="455" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Parent Document
    </text>
    <text x="115" y="472" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Dense X Retrieval
    </text>
    <text x="115" y="489" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Summary Index
    </text>
    <text x="115" y="506" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Dual Representation
    </text>
    
    <rect x="380" y="415" width="270" height="110" rx="5" fill="#f8f9fa" stroke="#1c7ed6" stroke-width="2"/>
    <text x="515" y="435" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#495057">
      Benefits
    </text>
    <text x="395" y="455" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Index summaries, retrieve full
    </text>
    <text x="395" y="472" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Better context preservation
    </text>
    <text x="395" y="489" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Efficient search + rich context
    </text>
    <text x="395" y="506" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Reduced noise
    </text>
    
    <!-- 3. Specialized Embeddings -->
    <rect x="80" y="560" width="590" height="165" rx="10" fill="#fff" stroke="#1c7ed6" stroke-width="3"/>
    <text x="375" y="585" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      3. Specialized Embeddings
    </text>
    <rect x="100" y="600" width="260" height="110" rx="5" fill="#f8f9fa" stroke="#1c7ed6" stroke-width="2"/>
    <text x="230" y="620" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#495057">
      Embedding Types
    </text>
    <text x="115" y="640" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Fine-Tuned Models
    </text>
    <text x="115" y="657" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • ColBERT (Token-level)
    </text>
    <text x="115" y="674" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Domain-Specific
    </text>
    <text x="115" y="691" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Multi-Modal
    </text>
    
    <rect x="380" y="600" width="270" height="110" rx="5" fill="#f8f9fa" stroke="#1c7ed6" stroke-width="2"/>
    <text x="515" y="620" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#495057">
      Use Cases
    </text>
    <text x="395" y="640" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Legal, medical, technical docs
    </text>
    <text x="395" y="657" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Fine-grained matching
    </text>
    <text x="395" y="674" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Industry-specific retrieval
    </text>
    <text x="395" y="691" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Images + text
    </text>
    
    <!-- 4. Hierarchical Indexing -->
    <rect x="80" y="745" width="590" height="185" rx="10" fill="#fff" stroke="#1c7ed6" stroke-width="3"/>
    <text x="375" y="770" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      4. Hierarchical Indexing (RAPTOR)
    </text>
    <rect x="100" y="785" width="260" height="130" rx="5" fill="#f8f9fa" stroke="#1c7ed6" stroke-width="2"/>
    <text x="230" y="805" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#495057">
      Tree Structure
    </text>
    <text x="115" y="825" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Level 1: Original chunks
    </text>
    <text x="115" y="842" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Level 2: Cluster summaries
    </text>
    <text x="115" y="859" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Level 3: Higher abstractions
    </text>
    <text x="115" y="876" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Level N: Document summary
    </text>
    <text x="115" y="893" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Progressive retrieval
    </text>
    
    <rect x="380" y="785" width="270" height="130" rx="5" fill="#f8f9fa" stroke="#1c7ed6" stroke-width="2"/>
    <text x="515" y="805" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#495057">
      Advantages
    </text>
    <text x="395" y="825" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Multi-level abstraction
    </text>
    <text x="395" y="842" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Coarse-to-fine search
    </text>
    <text x="395" y="859" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Better long documents
    </text>
    <text x="395" y="876" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Contextual understanding
    </text>
    <text x="395" y="893" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      • Scalable to large corpora
    </text>
  </g>
  
  <!-- Right Side: Retrieval -->
  <g id="retrieval-section">
    <rect x="730" y="100" width="620" height="850" rx="15" fill="#e7f5ff" stroke="#1971c2" stroke-width="4"/>
    <text x="1040" y="140" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      🔍 RETRIEVAL
    </text>
    <text x="1040" y="165" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#495057">
      Find and Rank Relevant Documents
    </text>
    
    <!-- Ranking Methods -->
    <rect x="760" y="190" width="560" height="280" rx="10" fill="#fff" stroke="#1971c2" stroke-width="3"/>
    <text x="1040" y="215" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      1. Ranking Methods
    </text>
    
    <rect x="780" y="230" width="250" height="90" rx="5" fill="#f8f9fa" stroke="#1971c2" stroke-width="2"/>
    <text x="905" y="250" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#495057">
      Re-Rank
    </text>
    <text x="795" y="270" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      Reorder initial results with
    </text>
    <text x="795" y="285" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      sophisticated cross-encoder models
    </text>
    <text x="795" y="300" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      (Cohere, BGE, ColBERT)
    </text>
    
    <rect x="1050" y="230" width="250" height="90" rx="5" fill="#f8f9fa" stroke="#1971c2" stroke-width="2"/>
    <text x="1175" y="250" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#495057">
      RankGPT
    </text>
    <text x="1065" y="270" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      Use LLMs to intelligently rank
    </text>
    <text x="1065" y="285" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      documents based on relevance
    </text>
    <text x="1065" y="300" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      and query understanding
    </text>
    
    <rect x="780" y="335" width="250" height="90" rx="5" fill="#f8f9fa" stroke="#1971c2" stroke-width="2"/>
    <text x="905" y="355" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#495057">
      RAG-Fusion
    </text>
    <text x="795" y="375" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      Merge results from multiple
    </text>
    <text x="795" y="390" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      queries using Reciprocal Rank
    </text>
    <text x="795" y="405" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      Fusion (RRF) algorithm
    </text>
    
    <rect x="1050" y="335" width="250" height="90" rx="5" fill="#f8f9fa" stroke="#1971c2" stroke-width="2"/>
    <text x="1175" y="355" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#495057">
      Hybrid Search
    </text>
    <text x="1065" y="375" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      Combine dense (semantic) and
    </text>
    <text x="1065" y="390" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      sparse (keyword/BM25) retrieval
    </text>
    <text x="1065" y="405" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      for comprehensive results
    </text>
    
    <rect x="780" y="440" width="520" height="20" rx="5" fill="#fff9db" stroke="#fab005" stroke-width="2"/>
    <text x="1040" y="455" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#495057">
      Key Metric: NDCG, MRR, Precision@K, Recall@K
    </text>
    
    <!-- Refinement Techniques -->
    <rect x="760" y="490" width="560" height="220" rx="10" fill="#fff" stroke="#1971c2" stroke-width="3"/>
    <text x="1040" y="515" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      2. Refinement Techniques
    </text>
    
    <rect x="780" y="530" width="250" height="165" rx="5" fill="#f8f9fa" stroke="#1971c2" stroke-width="2"/>
    <text x="905" y="550" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#495057">
      Document Filtering
    </text>
    <text x="795" y="570" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Remove low-quality docs
    </text>
    <text x="795" y="587" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Relevance thresholding
    </text>
    <text x="795" y="604" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Diversity optimization
    </text>
    <text x="795" y="621" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Duplicate removal
    </text>
    <text x="795" y="638" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Metadata-based filtering
    </text>
    <text x="795" y="655" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Temporal filtering (recency)
    </text>
    <text x="795" y="672" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Source credibility checks
    </text>
    
    <rect x="1050" y="530" width="250" height="165" rx="5" fill="#f8f9fa" stroke="#1971c2" stroke-width="2"/>
    <text x="1175" y="550" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#495057">
      Context Optimization
    </text>
    <text x="1065" y="570" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Compress retrieved context
    </text>
    <text x="1065" y="587" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Extract key sentences
    </text>
    <text x="1065" y="604" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Summarization
    </text>
    <text x="1065" y="621" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Token window management
    </text>
    <text x="1065" y="638" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Semantic chunking
    </text>
    <text x="1065" y="655" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Reorder for coherence
    </text>
    <text x="1065" y="672" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Highlight relevance
    </text>
    
    <!-- CRAG -->
    <rect x="760" y="730" width="560" height="200" rx="10" fill="#fff9db" stroke="#fab005" stroke-width="3"/>
    <text x="1040" y="755" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      3. CRAG (Corrective RAG)
    </text>
    <text x="1040" y="775" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#495057">
      Active Retrieval with Quality Assessment
    </text>
    
    <rect x="780" y="790" width="520" height="125" rx="5" fill="#fff" stroke="#fab005" stroke-width="2"/>
    <text x="1040" y="810" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#495057">
      CRAG Workflow
    </text>
    <text x="795" y="830" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      1. Retrieve initial documents
    </text>
    <text x="795" y="847" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      2. Evaluate retrieval quality (confidence scoring)
    </text>
    <text x="795" y="864" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      3. If low confidence → Web search or re-retrieve with modified query
    </text>
    <text x="795" y="881" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      4. If high confidence → Proceed with generation
    </text>
    <text x="795" y="898" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      5. Iterative refinement until quality threshold met
    </text>
  </g>
  
  <!-- Arrow connecting Indexing to Retrieval -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#495057"/>
    </marker>
  </defs>
  <line x1="700" y1="525" x2="720" y2="525" stroke="#495057" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="710" y="515" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#495057">
    →
  </text>
</svg>