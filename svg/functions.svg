<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="675" fill="#f8fafc"/>
  
  <!-- Fast Track Ribbon -->
  <polygon points="1050,0 1200,0 1200,80 1050,60" fill="#3b82f6"/>
  <text x="1125" y="35" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">FAST TRACK</text>
  
  <!-- Title -->
  <text x="600" y="80" text-anchor="middle" fill="#1e293b" font-family="Arial, sans-serif" font-size="36" font-weight="bold">Functions</text>
  
  <!-- Basic Function -->
  <rect x="80" y="130" width="260" height="140" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" rx="8"/>
  <text x="210" y="160" text-anchor="middle" fill="#16a34a" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Basic Function</text>
  <rect x="120" y="180" width="180" height="80" fill="#ffffff" stroke="#d1d5db" stroke-width="1" rx="4"/>
  <text x="130" y="200" fill="#374151" font-family="Courier, monospace" font-size="14">def greet():</text>
  <text x="140" y="220" fill="#374151" font-family="Courier, monospace" font-size="14">print("Hello!")</text>
  <text x="140" y="240" fill="#374151" font-family="Courier, monospace" font-size="14">return None</text>
  
  <!-- Function with Parameters -->
  <rect x="360" y="130" width="260" height="140" fill="#fef3c7" stroke="#d97706" stroke-width="2" rx="8"/>
  <text x="490" y="160" text-anchor="middle" fill="#d97706" font-family="Arial, sans-serif" font-size="18" font-weight="bold">With Parameters</text>
  <rect x="400" y="180" width="180" height="80" fill="#ffffff" stroke="#d1d5db" stroke-width="1" rx="4"/>
  <text x="410" y="200" fill="#374151" font-family="Courier, monospace" font-size="14">def greet(name):</text>
  <text x="420" y="220" fill="#374151" font-family="Courier, monospace" font-size="14">msg = f"Hi {name}"</text>
  <text x="420" y="240" fill="#374151" font-family="Courier, monospace" font-size="14">return msg</text>
  
  <!-- Function with Return -->
  <rect x="640" y="130" width="260" height="140" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" rx="8"/>
  <text x="770" y="160" text-anchor="middle" fill="#0284c7" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Return Values</text>
  <rect x="680" y="180" width="180" height="80" fill="#ffffff" stroke="#d1d5db" stroke-width="1" rx="4"/>
  <text x="690" y="200" fill="#374151" font-family="Courier, monospace" font-size="14">def add(a, b):</text>
  <text x="700" y="220" fill="#374151" font-family="Courier, monospace" font-size="14">result = a + b</text>
  <text x="700" y="240" fill="#374151" font-family="Courier, monospace" font-size="14">return result</text>
  
  <!-- Function with Defaults -->
  <rect x="920" y="130" width="260" height="140" fill="#fce7f3" stroke="#db2777" stroke-width="2" rx="8"/>
  <text x="1050" y="160" text-anchor="middle" fill="#db2777" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Default Parameters</text>
  <rect x="960" y="180" width="180" height="80" fill="#ffffff" stroke="#d1d5db" stroke-width="1" rx="4"/>
  <text x="970" y="200" fill="#374151" font-family="Courier, monospace" font-size="12">def greet(name="World"):</text>
  <text x="980" y="220" fill="#374151" font-family="Courier, monospace" font-size="12">return f"Hello {name}!"</text>
  <text x="980" y="240" fill="#6b7280" font-family="Courier, monospace" font-size="12"># greet() → "Hello World!"</text>
  
  <!-- Function Flow Diagram -->
  <rect x="150" y="320" width="900" height="280" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="12"/>
  <text x="600" y="355" text-anchor="middle" fill="#1e293b" font-family="Arial, sans-serif" font-size="24" font-weight="bold">Function Flow</text>
  
  <!-- Input -->
  <rect x="200" y="380" width="120" height="60" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="8"/>
  <text x="260" y="405" text-anchor="middle" fill="#1e40af" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Input</text>
  <text x="260" y="425" text-anchor="middle" fill="#1e40af" font-family="Arial, sans-serif" font-size="12">Parameters</text>
  
  <!-- Arrow 1 -->
  <path d="M 320 410 L 380 410" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrow)"/>
  
  <!-- Processing -->
  <rect x="380" y="380" width="120" height="60" fill="#dcfce7" stroke="#16a34a" stroke-width="2" rx="8"/>
  <text x="440" y="405" text-anchor="middle" fill="#15803d" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Process</text>
  <text x="440" y="425" text-anchor="middle" fill="#15803d" font-family="Arial, sans-serif" font-size="12">Logic</text>
  
  <!-- Arrow 2 -->
  <path d="M 500 410 L 560 410" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow)"/>
  
  <!-- Output -->
  <rect x="560" y="380" width="120" height="60" fill="#fef3c7" stroke="#d97706" stroke-width="2" rx="8"/>
  <text x="620" y="405" text-anchor="middle" fill="#b45309" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Output</text>
  <text x="620" y="425" text-anchor="middle" fill="#b45309" font-family="Arial, sans-serif" font-size="12">Return</text>
  
  <!-- Arrow 3 -->
  <path d="M 680 410 L 740 410" stroke="#d97706" stroke-width="3" marker-end="url(#arrow)"/>
  
  <!-- Reuse -->
  <rect x="740" y="380" width="120" height="60" fill="#fce7f3" stroke="#db2777" stroke-width="2" rx="8"/>
  <text x="800" y="405" text-anchor="middle" fill="#be185d" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Reuse</text>
  <text x="800" y="425" text-anchor="middle" fill="#be185d" font-family="Arial, sans-serif" font-size="12">Call Again</text>
  
  <!-- Benefits -->
  <text x="300" y="480" fill="#374151" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Key Benefits:</text>
  
  <circle cx="220" cy="510" r="4" fill="#16a34a"/>
  <text x="235" y="515" fill="#374151" font-family="Arial, sans-serif" font-size="14">Reusability - Write once, use many times</text>
  
  <circle cx="220" cy="535" r="4" fill="#16a34a"/>
  <text x="235" y="540" fill="#374151" font-family="Arial, sans-serif" font-size="14">Organization - Break complex problems into smaller pieces</text>
  
  <circle cx="220" cy="560" r="4" fill="#16a34a"/>
  <text x="235" y="565" fill="#374151" font-family="Arial, sans-serif" font-size="14">Testing - Easier to test individual functions</text>
  
  <!-- Best Practices -->
  <text x="700" y="480" fill="#374151" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Best Practices:</text>
  
  <circle cx="620" cy="510" r="4" fill="#3b82f6"/>
  <text x="635" y="515" fill="#374151" font-family="Arial, sans-serif" font-size="14">Use descriptive names (calculate_tax vs calc)</text>
  
  <circle cx="620" cy="535" r="4" fill="#3b82f6"/>
  <text x="635" y="540" fill="#374151" font-family="Arial, sans-serif" font-size="14">Keep functions focused on one task</text>
  
  <circle cx="620" cy="560" r="4" fill="#3b82f6"/>
  <text x="635" y="565" fill="#374151" font-family="Arial, sans-serif" font-size="14">Return values instead of printing when possible</text>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <polygon points="0,0 0,6 9,3" fill="#374151"/>
    </marker>
  </defs>
</svg>