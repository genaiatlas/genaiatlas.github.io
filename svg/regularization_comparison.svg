<svg width="1000" height="700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #333; }
      .subtitle { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #333; }
      .label { font-family: Arial, sans-serif; font-size: 12px; fill: #333; }
      .small-label { font-family: Arial, sans-serif; font-size: 10px; fill: #333; }
      .equation { font-family: Arial, sans-serif; font-size: 11px; fill: #333; }
      .axis { stroke: #333; stroke-width: 2; }
      .grid { stroke: #ddd; stroke-width: 0.5; }
      .ridge-line { stroke: #1976d2; stroke-width: 3; fill: none; }
      .lasso-line { stroke: #f57c00; stroke-width: 3; fill: none; }
      .ols-line { stroke: #388e3c; stroke-width: 3; fill: none; }
      .ridge-box { fill: #e3f2fd; stroke: #1976d2; stroke-width: 2; rx: 5; }
      .lasso-box { fill: #fff3e0; stroke: #f57c00; stroke-width: 2; rx: 5; }
      .comparison-box { fill: #f8f9fa; stroke: #dee2e6; stroke-width: 1; rx: 5; }
    </style>
  </defs>
  
  <!-- Title -->
  <text x="500" y="25" text-anchor="middle" class="title">Regularization Techniques: Ridge vs Lasso</text>
  
  <!-- Ridge Regression Section -->
  <g transform="translate(50, 50)">
    <rect x="0" y="0" width="400" height="250" class="ridge-box" />
    <text x="200" y="25" text-anchor="middle" class="subtitle">Ridge Regression (L2)</text>
    
    <!-- Ridge equation -->
    <text x="20" y="50" class="equation">Cost Function:</text>
    <text x="20" y="70" class="equation">J(θ) = MSE + α∑θⱼ²</text>
    
    <!-- Ridge coefficient path -->
    <g transform="translate(20, 85)">
      <text x="160" y="0" text-anchor="middle" class="label">Coefficient Paths</text>
      <!-- Axes -->
      <line x1="20" y1="100" x2="300" y2="100" class="axis" />
      <line x1="20" y1="15" x2="20" y2="100" class="axis" />
      <text x="160" y="115" text-anchor="middle" class="small-label">α (Lambda)</text>
      <text x="10" y="55" text-anchor="middle" class="small-label" transform="rotate(-90 10 55)">θ</text>
      
      <!-- Coefficient curves (shrinking but not zero) -->
      <path d="M 40 30 Q 100 35 140 50 Q 200 65 280 75" class="ridge-line" />
      <path d="M 40 45 Q 100 48 140 55 Q 200 65 280 70" class="ridge-line" />
      <path d="M 40 60 Q 100 58 140 60 Q 200 65 280 68" class="ridge-line" />
      <path d="M 40 75 Q 100 70 140 65 Q 200 65 280 65" class="ridge-line" />
      
      <text x="290" y="79" class="small-label">θ₁</text>
      <text x="290" y="74" class="small-label">θ₂</text>
      <text x="290" y="72" class="small-label">θ₃</text>
      <text x="290" y="69" class="small-label">θ₄</text>
    </g>
    
    <!-- Ridge characteristics -->
    <text x="20" y="195" class="label">Characteristics:</text>
    <text x="20" y="208" class="small-label">• Shrinks coefficients toward zero</text>
    <text x="20" y="220" class="small-label">• Never eliminates features</text>
    <text x="20" y="232" class="small-label">• Good when all features relevant</text>
  </g>
  
  <!-- Lasso Regression Section -->
  <g transform="translate(450, 50)">
    <rect x="0" y="0" width="400" height="250" class="lasso-box" />
    <text x="200" y="20" text-anchor="middle" class="subtitle">Lasso Regression (L1)</text>
    
    <!-- Lasso equation -->
    <text x="20" y="40" class="equation">Cost Function:</text>
    <text x="20" y="55" class="equation">J(θ) = MSE + α∑|θⱼ|</text>
    
    <!-- Lasso coefficient path -->
    <g transform="translate(20, 85)">
      <text x="160" y="0" text-anchor="middle" class="label">Coefficient Paths</text>
      <!-- Axes -->
      <line x1="20" y1="100" x2="300" y2="100" class="axis" />
      <line x1="20" y1="15" x2="20" y2="100" class="axis" />
      <text x="160" y="115" text-anchor="middle" class="small-label">α (Lambda)</text>
      <text x="10" y="55" text-anchor="middle" class="small-label" transform="rotate(-90 10 55)">θ</text>
      
      <!-- Coefficient curves (some going to zero) -->
      <path d="M 40 30 Q 100 35 130 50 L 280 75" class="lasso-line" />
      <path d="M 40 45 Q 100 48 120 60 L 160 65 L 280 65" class="lasso-line" />
      <path d="M 40 60 Q 80 58 100 65 L 280 65" class="lasso-line" />
      <path d="M 40 75 Q 70 70 90 65 L 280 65" class="lasso-line" />
      
      <!-- Zero lines for eliminated features -->
      <line x1="120" y1="65" x2="280" y2="65" stroke="#ff5722" stroke-width="2" stroke-dasharray="2,2" />
      <line x1="100" y1="65" x2="280" y2="65" stroke="#ff5722" stroke-width="2" stroke-dasharray="2,2" />
      
      <text x="290" y="79" class="small-label">θ₁</text>
      <text x="290" y="69" class="small-label">θ₂=0</text>
      <text x="290" y="74" class="small-label">θ₃=0</text>
      <text x="290" y="72" class="small-label">θ₄</text>
    </g>
    
    <!-- Lasso characteristics -->
    <text x="20" y="195" class="label">Characteristics:</text>
    <text x="20" y="208" class="small-label">• Sets coefficients exactly to zero</text>
    <text x="20" y="220" class="small-label">• Automatic feature selection</text>
    <text x="20" y="232" class="small-label">• Creates sparse models</text>
  </g>
  
  <!-- Geometric Interpretation -->
  <g transform="translate(50, 350)">
    <text x="400" y="0" text-anchor="middle" class="subtitle">Geometric Interpretation</text>
    
    <!-- Ridge constraint (circle) -->
    <g transform="translate(100, 30)">
      <text x="100" y="0" text-anchor="middle" class="label">Ridge (L2) Constraint</text>
      <circle cx="100" cy="80" r="60" fill="none" stroke="#1976d2" stroke-width="3" />
      <circle cx="100" cy="80" r="3" fill="#1976d2" />
      <!-- Contour ellipses -->
      <ellipse cx="100" cy="80" rx="30" ry="20" fill="none" stroke="#666" stroke-width="1" stroke-dasharray="2,2" />
      <ellipse cx="100" cy="80" rx="45" ry="30" fill="none" stroke="#666" stroke-width="1" stroke-dasharray="2,2" />
      <ellipse cx="100" cy="80" rx="60" ry="40" fill="none" stroke="#666" stroke-width="1" stroke-dasharray="2,2" />
      
      <!-- Optimal point -->
      <circle cx="140" cy="100" r="3" fill="#f44336" />
      <text x="145" y="105" class="small-label">Optimal θ</text>
      
      <!-- Axes -->
      <line x1="100" y1="20" x2="100" y2="140" stroke="#333" stroke-width="1" />
      <line x1="40" y1="80" x2="160" y2="80" stroke="#333" stroke-width="1" />
      <text x="165" y="85" class="small-label">θ₁</text>
      <text x="105" y="15" class="small-label">θ₂</text>
      
      <text x="100" y="160" text-anchor="middle" class="small-label">θ₁² + θ₂² ≤ t</text>
    </g>
    
    <!-- Lasso constraint (diamond) -->
    <g transform="translate(500, 30)">
      <text x="100" y="0" text-anchor="middle" class="label">Lasso (L1) Constraint</text>
      <polygon points="100,20 160,80 100,140 40,80" fill="none" stroke="#f57c00" stroke-width="3" />
      <circle cx="100" cy="80" r="3" fill="#f57c00" />
      <!-- Contour ellipses -->
      <ellipse cx="100" cy="80" rx="30" ry="20" fill="none" stroke="#666" stroke-width="1" stroke-dasharray="2,2" />
      <ellipse cx="100" cy="80" rx="45" ry="30" fill="none" stroke="#666" stroke-width="1" stroke-dasharray="2,2" />
      <ellipse cx="100" cy="80" rx="60" ry="40" fill="none" stroke="#666" stroke-width="1" stroke-dasharray="2,2" />
      
      <!-- Optimal point (on corner) -->
      <circle cx="100" cy="140" r="3" fill="#f44336" />
      <text x="105" y="155" class="small-label">Optimal θ (θ₂=0)</text>
      
      <!-- Axes -->
      <line x1="100" y1="20" x2="100" y2="140" stroke="#333" stroke-width="1" />
      <line x1="40" y1="80" x2="160" y2="80" stroke="#333" stroke-width="1" />
      <text x="165" y="85" class="small-label">θ₁</text>
      <text x="105" y="15" class="small-label">θ₂</text>
      
      <text x="100" y="160" text-anchor="middle" class="small-label">|θ₁| + |θ₂| ≤ t</text>
    </g>
  </g>
  
  <!-- Comparison Table -->
  <g transform="translate(50, 580)">
    <rect x="0" y="0" width="800" height="100" class="comparison-box" />
    <text x="400" y="20" text-anchor="middle" class="subtitle">Ridge vs Lasso Comparison</text>
    
    <!-- Table headers -->
    <text x="100" y="40" text-anchor="middle" class="label" font-weight="bold">Aspect</text>
    <text x="300" y="40" text-anchor="middle" class="label" font-weight="bold">Ridge (L2)</text>
    <text x="600" y="40" text-anchor="middle" class="label" font-weight="bold">Lasso (L1)</text>
    
    <!-- Table rows -->
    <line x1="50" y1="45" x2="750" y2="45" stroke="#333" stroke-width="1" />
    
    <text x="100" y="60" text-anchor="middle" class="small-label">Penalty Term</text>
    <text x="300" y="60" text-anchor="middle" class="small-label">Sum of squared coefficients</text>
    <text x="600" y="60" text-anchor="middle" class="small-label">Sum of absolute coefficients</text>
    
    <text x="100" y="75" text-anchor="middle" class="small-label">Feature Selection</text>
    <text x="300" y="75" text-anchor="middle" class="small-label">No (shrinks toward zero)</text>
    <text x="600" y="75" text-anchor="middle" class="small-label">Yes (sets to exactly zero)</text>
    
    <text x="100" y="90" text-anchor="middle" class="small-label">Best Use Case</text>
    <text x="300" y="90" text-anchor="middle" class="small-label">All features relevant</text>
    <text x="600" y="90" text-anchor="middle" class="small-label">Sparse feature set desired</text>
  </g>
</svg>