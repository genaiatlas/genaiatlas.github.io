<svg viewBox="0 0 1400 1050" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1400" height="1050" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="700" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Query Construction Best Practices
  </text>
  <text x="700" y="70" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#495057">
    Building Robust and Reliable Query Generation Systems
  </text>
  
  <!-- Practice 1: Schema-Aware Design -->
  <g id="practice1">
    <rect x="50" y="100" width="650" height="220" rx="10" fill="#d3f9d8" stroke="#37b24d" stroke-width="3"/>
    <text x="375" y="130" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      📚 Practice 1: Schema-Aware Design
    </text>
    
    <rect x="80" y="150" width="590" height="155" rx="5" fill="#fff" stroke="#37b24d" stroke-width="2"/>
    <text x="375" y="175" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#495057">
      Maintain Rich Schema Documentation
    </text>
    
    <text x="100" y="200" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      ✓ Keep schema descriptions up-to-date with every change
    </text>
    <text x="100" y="218" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      ✓ Use semantic layer to abstract complex schemas with business terms
    </text>
    <text x="100" y="236" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      ✓ Version control schema definitions alongside code
    </text>
    <text x="100" y="254" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      ✓ Document relationships, constraints, and join conditions
    </text>
    <text x="100" y="272" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      ✓ Regularly validate query templates against schema changes
    </text>
    <text x="100" y="290" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      ✓ Include example queries and common patterns in documentation
    </text>
  </g>
  
  <!-- Practice 2: Error Handling -->
  <g id="practice2">
    <rect x="730" y="100" width="620" height="220" rx="10" fill="#ffc9c9" stroke="#f03e3e" stroke-width="3"/>
    <text x="1040" y="130" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      🛡️ Practice 2: Robust Error Handling
    </text>
    
    <rect x="760" y="150" width="560" height="155" rx="5" fill="#fff" stroke="#f03e3e" stroke-width="2"/>
    <text x="1040" y="175" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#495057">
      Graceful Degradation &amp; Recovery
    </text>
    
    <text x="780" y="200" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      ✓ Implement fallback strategies for complex queries that fail
    </text>
    <text x="780" y="218" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      ✓ Provide clear, actionable error messages to users
    </text>
    <text x="780" y="236" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      ✓ Auto-retry with simplified query on initial failure
    </text>
    <text x="780" y="254" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      ✓ Ask users to rephrase when query is too ambiguous
    </text>
    <text x="780" y="272" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      ✓ Log all errors with context for debugging and improvement
    </text>
    <text x="780" y="290" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      ✓ Surface partial results when full query cannot complete
    </text>
  </g>
  
  <!-- Practice 3: Query Optimization -->
  <g id="practice3">
    <rect x="50" y="350" width="650" height="220" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="3"/>
    <text x="375" y="380" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      ⚡ Practice 3: Performance Optimization
    </text>
    
    <rect x="80" y="400" width="590" height="155" rx="5" fill="#fff" stroke="#1971c2" stroke-width="2"/>
    <text x="375" y="425" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#495057">
      Ensure Fast Query Execution
    </text>
    
    <text x="100" y="450" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      ✓ Always include LIMIT clause unless explicitly requested otherwise
    </text>
    <text x="100" y="468" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      ✓ Recommend indexes for frequently queried columns
    </text>
    <text x="100" y="486" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      ✓ Use EXPLAIN to analyze query plans before execution
    </text>
    <text x="100" y="504" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      ✓ Cache frequently executed queries and their results
    </text>
    <text x="100" y="522" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      ✓ Optimize join order and avoid unnecessary cartesian products
    </text>
    <text x="100" y="540" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      ✓ Set execution timeout limits to prevent runaway queries
    </text>
  </g>
  
  <!-- Practice 4: Testing & Validation -->
  <g id="practice4">
    <rect x="730" y="350" width="620" height="220" rx="10" fill="#fff3bf" stroke="#f59f00" stroke-width="3"/>
    <text x="1040" y="380" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      🧪 Practice 4: Comprehensive Testing
    </text>
    
    <rect x="760" y="400" width="560" height="155" rx="5" fill="#fff" stroke="#f59f00" stroke-width="2"/>
    <text x="1040" y="425" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#495057">
      Validate Before Production
    </text>
    
    <text x="780" y="450" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      ✓ Maintain comprehensive unit test suite for query components
    </text>
    <text x="780" y="468" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      ✓ Run integration tests for end-to-end query generation
    </text>
    <text x="780" y="486" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      ✓ Build benchmark suite of test queries covering edge cases
    </text>
    <text x="780" y="504" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      ✓ Validate syntax and semantics before executing queries
    </text>
    <text x="780" y="522" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      ✓ Test against production schema in staging environment
    </text>
    <text x="780" y="540" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      ✓ Continuously evaluate accuracy with user feedback
    </text>
  </g>
  
  <!-- Practice 5: Monitoring -->
  <g id="practice5">
    <rect x="50" y="600" width="650" height="220" rx="10" fill="#e9d5ff" stroke="#9333ea" stroke-width="3"/>
    <text x="375" y="630" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      📊 Practice 5: Monitoring &amp; Analytics
    </text>
    
    <rect x="80" y="650" width="590" height="155" rx="5" fill="#fff" stroke="#9333ea" stroke-width="2"/>
    <text x="375" y="675" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#495057">
      Track Performance &amp; Quality
    </text>
    
    <text x="100" y="700" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      ✓ Log all generated and executed queries with timestamps
    </text>
    <text x="100" y="718" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      ✓ Monitor query execution time and resource usage
    </text>
    <text x="100" y="736" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      ✓ Track success rate (successful queries / total attempts)
    </text>
    <text x="100" y="754" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      ✓ Collect user feedback on query result quality
    </text>
    <text x="100" y="772" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      ✓ Set up alerts for anomalies (high failure rate, slow queries)
    </text>
    <text x="100" y="790" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      ✓ Analyze common patterns to improve template library
    </text>
  </g>
  
  <!-- Practice 6: Security -->
  <g id="practice6">
    <rect x="730" y="600" width="620" height="220" rx="10" fill="#ffe3e3" stroke="#c92a2a" stroke-width="3"/>
    <text x="1040" y="630" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      🔐 Practice 6: Security First
    </text>
    
    <rect x="760" y="650" width="560" height="155" rx="5" fill="#fff" stroke="#c92a2a" stroke-width="2"/>
    <text x="1040" y="675" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#495057">
      Prevent Security Vulnerabilities
    </text>
    
    <text x="780" y="700" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      ✓ Use parameterized queries EXCLUSIVELY (no string concatenation)
    </text>
    <text x="780" y="718" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      ✓ Implement strict input validation and sanitization
    </text>
    <text x="780" y="736" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      ✓ Whitelist allowed operations (SELECT, WITH only)
    </text>
    <text x="780" y="754" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      ✓ Check user permissions before query execution
    </text>
    <text x="780" y="772" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      ✓ Use read-only database connections when possible
    </text>
    <text x="780" y="790" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      ✓ Audit all queries and log security-relevant events
    </text>
  </g>
  
  <!-- Implementation Checklist -->
  <g id="checklist">
    <rect x="50" y="850" width="1300" height="180" rx="10" fill="#d0bfff" stroke="#7950f2" stroke-width="3"/>
    <text x="700" y="880" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      ✅ Pre-Production Checklist
    </text>
    
    <rect x="80" y="900" width="600" height="115" rx="5" fill="#fff" stroke="#7950f2" stroke-width="2"/>
    <text x="380" y="922" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#495057">
      Before Deployment
    </text>
    <text x="100" y="942" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      □ Schema documentation complete and accurate
    </text>
    <text x="100" y="958" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      □ All test suites passing (unit, integration, e2e)
    </text>
    <text x="100" y="974" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      □ Security validation passed (no SQL injection risks)
    </text>
    <text x="100" y="990" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      □ Performance benchmarks meet SLA requirements
    </text>
    <text x="100" y="1006" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      □ Monitoring and alerting configured
    </text>
    
    <rect x="700" y="900" width="620" height="115" rx="5" fill="#fff" stroke="#7950f2" stroke-width="2"/>
    <text x="1010" y="922" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#495057">
      After Deployment
    </text>
    <text x="720" y="942" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      □ Monitor query success rate and execution times
    </text>
    <text x="720" y="958" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      □ Review error logs daily for first week
    </text>
    <text x="720" y="974" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      □ Collect user feedback and iterate on common failures
    </text>
    <text x="720" y="990" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      □ Update documentation based on real-world usage patterns
    </text>
    <text x="720" y="1006" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      □ Regular performance optimization reviews (weekly → monthly)
    </text>
  </g>
</svg>