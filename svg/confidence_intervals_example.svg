<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
    <!-- Background and title -->
    <rect x="0" y="0" width="800" height="500" fill="#f8f9fa" rx="10" ry="10"/>
    <text x="400" y="40" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold">Confidence Intervals Example</text>
    
    <!-- Error covariance matrix title -->
    <text x="400" y="80" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">Error Covariance Matrix</text>
    
    <!-- Covariance matrix table -->
    <rect x="150" y="100" width="500" height="160" fill="white" stroke="#424242" stroke-width="1"/>
    
    <!-- Table headers -->
    <rect x="150" y="100" width="100" height="40" fill="#e0e0e0" stroke="#424242" stroke-width="1"/>
    <text x="200" y="125" font-family="Arial" font-size="14" text-anchor="middle">const</text>
    
    <rect x="250" y="100" width="100" height="40" fill="#e0e0e0" stroke="#424242" stroke-width="1"/>
    <text x="300" y="125" font-family="Arial" font-size="14" text-anchor="middle">TV</text>
    
    <rect x="350" y="100" width="100" height="40" fill="#e0e0e0" stroke="#424242" stroke-width="1"/>
    <text x="400" y="125" font-family="Arial" font-size="14" text-anchor="middle">Radio</text>
    
    <rect x="450" y="100" width="100" height="40" fill="#e0e0e0" stroke="#424242" stroke-width="1"/>
    <text x="500" y="125" font-family="Arial" font-size="14" text-anchor="middle">Newspaper</text>
    
    <rect x="550" y="100" width="100" height="40" fill="#e0e0e0" stroke="#424242" stroke-width="1"/>
    
    <!-- Row headers -->
    <rect x="150" y="140" width="100" height="30" fill="#e0e0e0" stroke="#424242" stroke-width="1"/>
    <text x="200" y="160" font-family="Arial" font-size="14" text-anchor="middle">const</text>
    
    <rect x="150" y="170" width="100" height="30" fill="#e0e0e0" stroke="#424242" stroke-width="1"/>
    <text x="200" y="190" font-family="Arial" font-size="14" text-anchor="middle">TV</text>
    
    <rect x="150" y="200" width="100" height="30" fill="#e0e0e0" stroke="#424242" stroke-width="1"/>
    <text x="200" y="220" font-family="Arial" font-size="14" text-anchor="middle">Radio</text>
    
    <rect x="150" y="230" width="100" height="30" fill="#e0e0e0" stroke="#424242" stroke-width="1"/>
    <text x="200" y="250" font-family="Arial" font-size="14" text-anchor="middle">Newspaper</text>
    
    <!-- Coefficient and standard error section -->
    <rect x="150" y="290" width="500" height="160" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" rx="10" ry="10"/>
    <text x="400" y="320" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">Coefficients and Confidence Intervals</text>
    
    <!-- Headers -->
    <text x="220" y="350" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">coef</text>
    <text x="320" y="350" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">std err</text>
    <text x="480" y="350" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">[0.025    0.975]</text>
    
    <!-- Divider line -->
    <line x1="170" y1="360" x2="630" y2="360" stroke="#2e7d32" stroke-width="1" stroke-dasharray="5,5"/>
    
    <!-- Coefficient values -->
    <text x="170" y="380" font-family="Arial" font-size="14" text-anchor="start">Intercept</text>
    <text x="220" y="380" font-family="Arial" font-size="14" text-anchor="middle">2.9389</text>
    <text x="320" y="380" font-family="Arial" font-size="14" text-anchor="middle">0.312</text>
    <text x="430" y="380" font-family="Arial" font-size="14" text-anchor="middle">2.324</text>
    <text x="530" y="380" font-family="Arial" font-size="14" text-anchor="middle">3.554</text>
    
    <text x="170" y="410" font-family="Arial" font-size="14" text-anchor="start">TV</text>
    <text x="220" y="410" font-family="Arial" font-size="14" text-anchor="middle">0.0458</text>
    <text x="320" y="410" font-family="Arial" font-size="14" text-anchor="middle">0.001</text>
    <text x="430" y="410" font-family="Arial" font-size="14" text-anchor="middle">0.043</text>
    <text x="530" y="410" font-family="Arial" font-size="14" text-anchor="middle">0.049</text>
    
    <text x="170" y="440" font-family="Arial" font-size="14" text-anchor="start">Radio</text>
    <text x="220" y="440" font-family="Arial" font-size="14" text-anchor="middle">0.1885</text>
    <text x="320" y="440" font-family="Arial" font-size="14" text-anchor="middle">0.009</text>
    <text x="430" y="440" font-family="Arial" font-size="14" text-anchor="middle">0.172</text>
    <text x="530" y="440" font-family="Arial" font-size="14" text-anchor="middle">0.206</text>
    
    <text x="170" y="470" font-family="Arial" font-size="14" text-anchor="start">Newspaper</text>
    <text x="220" y="470" font-family="Arial" font-size="14" text-anchor="middle">-0.0010</text>
    <text x="320" y="470" font-family="Arial" font-size="14" text-anchor="middle">0.006</text>
    <text x="430" y="470" font-family="Arial" font-size="14" text-anchor="middle">-0.013</text>
    <text x="530" y="470" font-family="Arial" font-size="14" text-anchor="middle">0.011</text>
    
    <!-- Visual indicators of significance -->
    <circle cx="650" y="380" r="10" fill="#4caf50" stroke="none"/>
    <text x="670" y="380" font-family="Arial" font-size="14" text-anchor="start" fill="#4caf50" font-weight="bold">Significant</text>
    
    <circle cx="650" y="410" r="10" fill="#4caf50" stroke="none"/>
    <circle cx="650" y="440" r="10" fill="#4caf50" stroke="none"/>
    
    <circle cx="650" y="470" r="10" fill="#f44336" stroke="none"/>
    <text x="670" y="470" font-family="Arial" font-size="14" text-anchor="start" fill="#f44336" font-weight="bold">Not significant</text>
    
    <!-- Explanatory note -->
    <text x="400" y="495" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">Note: Zero is inside the confidence interval for Newspaper, indicating it may not be significant.</text>
</svg>