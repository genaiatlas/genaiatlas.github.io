<svg viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1400" height="900" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="700" y="40" font-size="28" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Network Representation Methods
  </text>
  
  <!-- Left Side: Adjacency List -->
  <g id="adjacency-list">
    <rect x="50" y="80" width="600" height="750" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="10"/>
    
    <text x="350" y="120" font-size="22" font-weight="bold" text-anchor="middle" fill="#0d47a1">
      Adjacency List
    </text>
    
    <!-- Example Network Diagram -->
    <g id="network-viz" transform="translate(150, 160)">
      <!-- Nodes -->
      <circle cx="150" cy="50" r="25" fill="#42a5f5" stroke="#1976d2" stroke-width="2"/>
      <text x="150" y="58" font-size="18" font-weight="bold" text-anchor="middle" fill="white">1</text>
      
      <circle cx="50" cy="150" r="25" fill="#42a5f5" stroke="#1976d2" stroke-width="2"/>
      <text x="50" y="158" font-size="18" font-weight="bold" text-anchor="middle" fill="white">2</text>
      
      <circle cx="250" cy="150" r="25" fill="#42a5f5" stroke="#1976d2" stroke-width="2"/>
      <text x="250" y="158" font-size="18" font-weight="bold" text-anchor="middle" fill="white">3</text>
      
      <circle cx="150" cy="250" r="25" fill="#42a5f5" stroke="#1976d2" stroke-width="2"/>
      <text x="150" y="258" font-size="18" font-weight="bold" text-anchor="middle" fill="white">4</text>
      
      <!-- Edges -->
      <line x1="135" y1="70" x2="65" y2="135" stroke="#666" stroke-width="2"/>
      <line x1="165" y1="70" x2="235" y2="135" stroke="#666" stroke-width="2"/>
      <line x1="70" y1="160" x2="130" y2="240" stroke="#666" stroke-width="2"/>
      <line x1="230" y1="160" x2="170" y2="240" stroke="#666" stroke-width="2"/>
      <line x1="65" y1="165" x2="235" y2="165" stroke="#666" stroke-width="2"/>
    </g>
    
    <!-- List Representation -->
    <g id="list-data" transform="translate(80, 450)">
      <text x="0" y="0" font-size="18" font-weight="bold" fill="#0d47a1">Node → Neighbors</text>
      
      <rect x="0" y="15" width="500" height="40" fill="white" stroke="#1976d2" stroke-width="1"/>
      <text x="10" y="40" font-size="16" font-weight="bold" fill="#333">1</text>
      <text x="80" y="40" font-size="16" fill="#666">→ [2, 3]</text>
      
      <rect x="0" y="55" width="500" height="40" fill="white" stroke="#1976d2" stroke-width="1"/>
      <text x="10" y="80" font-size="16" font-weight="bold" fill="#333">2</text>
      <text x="80" y="80" font-size="16" fill="#666">→ [1, 3, 4]</text>
      
      <rect x="0" y="95" width="500" height="40" fill="white" stroke="#1976d2" stroke-width="1"/>
      <text x="10" y="120" font-size="16" font-weight="bold" fill="#333">3</text>
      <text x="80" y="120" font-size="16" fill="#666">→ [1, 2, 4]</text>
      
      <rect x="0" y="135" width="500" height="40" fill="white" stroke="#1976d2" stroke-width="1"/>
      <text x="10" y="160" font-size="16" font-weight="bold" fill="#333">4</text>
      <text x="80" y="160" font-size="16" fill="#666">→ [2, 3]</text>
    </g>
    
    <!-- Advantages -->
    <g transform="translate(80, 670)">
      <text x="0" y="0" font-size="14" font-weight="bold" fill="#0d47a1">✓ Memory efficient (sparse)</text>
      <text x="0" y="25" font-size="14" font-weight="bold" fill="#0d47a1">✓ Fast neighbor lookup</text>
      <text x="0" y="50" font-size="14" font-weight="bold" fill="#d32f2f">✗ Hard to count paths</text>
    </g>
  </g>
  
  <!-- Right Side: Adjacency Matrix -->
  <g id="adjacency-matrix">
    <rect x="750" y="80" width="600" height="750" fill="#fff3e0" stroke="#f57c00" stroke-width="2" rx="10"/>
    
    <text x="1050" y="120" font-size="22" font-weight="bold" text-anchor="middle" fill="#e65100">
      Adjacency Matrix
    </text>
    
    <!-- Matrix Representation -->
    <g id="matrix-viz" transform="translate(850, 180)">
      <text x="0" y="-10" font-size="14" font-weight="bold" fill="#333">A =</text>
      
      <!-- Matrix Border -->
      <rect x="40" y="-20" width="320" height="320" fill="white" stroke="#f57c00" stroke-width="2"/>
      
      <!-- Column Headers -->
      <text x="80" y="-30" font-size="14" font-weight="bold" fill="#666" text-anchor="middle">1</text>
      <text x="160" y="-30" font-size="14" font-weight="bold" fill="#666" text-anchor="middle">2</text>
      <text x="240" y="-30" font-size="14" font-weight="bold" fill="#666" text-anchor="middle">3</text>
      <text x="320" y="-30" font-size="14" font-weight="bold" fill="#666" text-anchor="middle">4</text>
      
      <!-- Row Headers -->
      <text x="20" y="20" font-size="14" font-weight="bold" fill="#666" text-anchor="middle">1</text>
      <text x="20" y="100" font-size="14" font-weight="bold" fill="#666" text-anchor="middle">2</text>
      <text x="20" y="180" font-size="14" font-weight="bold" fill="#666" text-anchor="middle">3</text>
      <text x="20" y="260" font-size="14" font-weight="bold" fill="#666" text-anchor="middle">4</text>
      
      <!-- Matrix Grid Lines -->
      <line x1="40" y1="60" x2="360" y2="60" stroke="#ddd" stroke-width="1"/>
      <line x1="40" y1="140" x2="360" y2="140" stroke="#ddd" stroke-width="1"/>
      <line x1="40" y1="220" x2="360" y2="220" stroke="#ddd" stroke-width="1"/>
      
      <line x1="120" y1="-20" x2="120" y2="300" stroke="#ddd" stroke-width="1"/>
      <line x1="200" y1="-20" x2="200" y2="300" stroke="#ddd" stroke-width="1"/>
      <line x1="280" y1="-20" x2="280" y2="300" stroke="#ddd" stroke-width="1"/>
      
      <!-- Row 1 -->
      <text x="80" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#999">0</text>
      <rect x="130" y="5" width="60" height="50" fill="#ffccbc"/>
      <text x="160" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#d84315">1</text>
      <rect x="210" y="5" width="60" height="50" fill="#ffccbc"/>
      <text x="240" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#d84315">1</text>
      <text x="320" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#999">0</text>
      
      <!-- Row 2 -->
      <rect x="50" y="85" width="60" height="50" fill="#ffccbc"/>
      <text x="80" y="110" font-size="20" font-weight="bold" text-anchor="middle" fill="#d84315">1</text>
      <text x="160" y="110" font-size="20" font-weight="bold" text-anchor="middle" fill="#999">0</text>
      <rect x="210" y="85" width="60" height="50" fill="#ffccbc"/>
      <text x="240" y="110" font-size="20" font-weight="bold" text-anchor="middle" fill="#d84315">1</text>
      <rect x="290" y="85" width="60" height="50" fill="#ffccbc"/>
      <text x="320" y="110" font-size="20" font-weight="bold" text-anchor="middle" fill="#d84315">1</text>
      
      <!-- Row 3 -->
      <rect x="50" y="165" width="60" height="50" fill="#ffccbc"/>
      <text x="80" y="190" font-size="20" font-weight="bold" text-anchor="middle" fill="#d84315">1</text>
      <rect x="130" y="165" width="60" height="50" fill="#ffccbc"/>
      <text x="160" y="190" font-size="20" font-weight="bold" text-anchor="middle" fill="#d84315">1</text>
      <text x="240" y="190" font-size="20" font-weight="bold" text-anchor="middle" fill="#999">0</text>
      <rect x="290" y="165" width="60" height="50" fill="#ffccbc"/>
      <text x="320" y="190" font-size="20" font-weight="bold" text-anchor="middle" fill="#d84315">1</text>
      
      <!-- Row 4 -->
      <text x="80" y="270" font-size="20" font-weight="bold" text-anchor="middle" fill="#999">0</text>
      <rect x="130" y="245" width="60" height="50" fill="#ffccbc"/>
      <text x="160" y="270" font-size="20" font-weight="bold" text-anchor="middle" fill="#d84315">1</text>
      <rect x="210" y="245" width="60" height="50" fill="#ffccbc"/>
      <text x="240" y="270" font-size="20" font-weight="bold" text-anchor="middle" fill="#d84315">1</text>
      <text x="320" y="270" font-size="20" font-weight="bold" text-anchor="middle" fill="#999">0</text>
    </g>
    
    <!-- Properties -->
    <g transform="translate(850, 550)">
      <text x="0" y="0" font-size="16" font-weight="bold" fill="#e65100">Key Properties:</text>
      <text x="0" y="30" font-size="14" fill="#333">• A<tspan baseline-shift="sub" font-size="11">ij</tspan> = 1 if edge exists from i to j</text>
      <text x="0" y="55" font-size="14" fill="#333">• A<tspan baseline-shift="sub" font-size="11">ij</tspan> = A<tspan baseline-shift="sub" font-size="11">ji</tspan> for undirected graphs</text>
      <text x="0" y="80" font-size="14" fill="#333">• Symmetric matrix for undirected</text>
    </g>
    
    <!-- Advantages -->
    <g transform="translate(850, 680)">
      <text x="0" y="0" font-size="14" font-weight="bold" fill="#e65100">✓ Mathematical operations</text>
      <text x="0" y="25" font-size="14" font-weight="bold" fill="#e65100">✓ Fast edge existence check</text>
      <text x="0" y="50" font-size="14" font-weight="bold" fill="#e65100">✓ Easy to count paths (A<tspan baseline-shift="super" font-size="10">k</tspan>)</text>
      <text x="0" y="75" font-size="14" font-weight="bold" fill="#d32f2f">✗ O(n²) memory usage</text>
    </g>
  </g>
  
  <!-- Bottom Comparison -->
  <g transform="translate(700, 860)">
    <text x="0" y="0" font-size="16" font-weight="bold" text-anchor="middle" fill="#555">
      Choose based on: Network density, required operations, memory constraints
    </text>
  </g>
</svg>