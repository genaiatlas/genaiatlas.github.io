<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="500" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">Multi-Class Neural Network Architecture</text>
  
  <!-- Input Layer -->
  <g id="input-layer">
    <text x="100" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#34495e">Input Layer</text>
    <circle cx="100" cy="120" r="15" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    <text x="125" y="125" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">x₁</text>
    <circle cx="100" cy="160" r="15" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    <text x="125" y="165" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">x₂</text>
    <circle cx="100" cy="200" r="15" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    <text x="125" y="205" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">x₃</text>
    <text x="100" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#7f8c8d">⋮</text>
    <circle cx="100" cy="270" r="15" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    <text x="125" y="275" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">xₙ</text>
  </g>
  
  <!-- Hidden Layer 1 -->
  <g id="hidden-layer-1">
    <text x="300" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#34495e">Hidden Layer 1</text>
    <circle cx="300" cy="110" r="15" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
    <circle cx="300" cy="150" r="15" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
    <circle cx="300" cy="190" r="15" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
    <circle cx="300" cy="230" r="15" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
    <circle cx="300" cy="270" r="15" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
    <circle cx="300" cy="310" r="15" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
    <text x="325" y="190" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">ReLU</text>
  </g>
  
  <!-- Hidden Layer 2 -->
  <g id="hidden-layer-2">
    <text x="500" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#34495e">Hidden Layer 2</text>
    <circle cx="500" cy="130" r="15" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
    <circle cx="500" cy="170" r="15" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
    <circle cx="500" cy="210" r="15" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
    <circle cx="500" cy="250" r="15" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
    <text x="525" y="200" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">ReLU</text>
  </g>
  
  <!-- Output Layer -->
  <g id="output-layer">
    <text x="700" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#34495e">Output Layer</text>
    <circle cx="700" cy="110" r="15" fill="#27ae60" stroke="#229954" stroke-width="2"/>
    <text x="720" y="115" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Class 0</text>
    <circle cx="700" cy="140" r="15" fill="#27ae60" stroke="#229954" stroke-width="2"/>
    <text x="720" y="145" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Class 1</text>
    <circle cx="700" cy="170" r="15" fill="#27ae60" stroke="#229954" stroke-width="2"/>
    <text x="720" y="175" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Class 2</text>
    <text x="700" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#7f8c8d">⋮</text>
    <circle cx="700" cy="230" r="15" fill="#27ae60" stroke="#229954" stroke-width="2"/>
    <text x="720" y="235" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Class N</text>
    <text x="700" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#e67e22" font-weight="bold">Softmax</text>
  </g>
  
  <!-- Connections from Input to Hidden Layer 1 -->
  <g stroke="#7f8c8d" stroke-width="1" opacity="0.6">
    <line x1="115" y1="120" x2="285" y2="110"/>
    <line x1="115" y1="120" x2="285" y2="150"/>
    <line x1="115" y1="120" x2="285" y2="190"/>
    <line x1="115" y1="160" x2="285" y2="110"/>
    <line x1="115" y1="160" x2="285" y2="150"/>
    <line x1="115" y1="160" x2="285" y2="230"/>
    <line x1="115" y1="200" x2="285" y2="190"/>
    <line x1="115" y1="200" x2="285" y2="230"/>
    <line x1="115" y1="270" x2="285" y2="270"/>
    <line x1="115" y1="270" x2="285" y2="310"/>
  </g>
  
  <!-- Connections from Hidden Layer 1 to Hidden Layer 2 -->
  <g stroke="#7f8c8d" stroke-width="1" opacity="0.6">
    <line x1="315" y1="110" x2="485" y2="130"/>
    <line x1="315" y1="150" x2="485" y2="170"/>
    <line x1="315" y1="190" x2="485" y2="210"/>
    <line x1="315" y1="230" x2="485" y2="250"/>
    <line x1="315" y1="270" x2="485" y2="130"/>
    <line x1="315" y1="310" x2="485" y2="250"/>
  </g>
  
  <!-- Connections from Hidden Layer 2 to Output Layer -->
  <g stroke="#7f8c8d" stroke-width="1" opacity="0.6">
    <line x1="515" y1="130" x2="685" y2="110"/>
    <line x1="515" y1="130" x2="685" y2="140"/>
    <line x1="515" y1="170" x2="685" y2="170"/>
    <line x1="515" y1="210" x2="685" y2="230"/>
    <line x1="515" y1="250" x2="685" y2="110"/>
    <line x1="515" y1="250" x2="685" y2="230"/>
  </g>
  
  <!-- Mathematical notation -->
  <g font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">
    <text x="200" y="350" text-anchor="middle">z⁽¹⁾ = W⁽¹⁾ᵀx + b⁽¹⁾</text>
    <text x="200" y="370" text-anchor="middle">a⁽¹⁾ = ReLU(z⁽¹⁾)</text>
    
    <text x="400" y="350" text-anchor="middle">z⁽²⁾ = W⁽²⁾ᵀa⁽¹⁾ + b⁽²⁾</text>
    <text x="400" y="370" text-anchor="middle">a⁽²⁾ = ReLU(z⁽²⁾)</text>
    
    <text x="600" y="350" text-anchor="middle">z⁽³⁾ = W⁽³⁾ᵀa⁽²⁾ + b⁽³⁾</text>
    <text x="600" y="370" text-anchor="middle">ŷ = Softmax(z⁽³⁾)</text>
  </g>
  
  <!-- Probability outputs -->
  <g font-family="Arial, sans-serif" font-size="10" fill="#27ae60">
    <text x="750" y="115">P(y=0|x)</text>
    <text x="750" y="145">P(y=1|x)</text>
    <text x="750" y="175">P(y=2|x)</text>
    <text x="750" y="235">P(y=N|x)</text>
  </g>
  
  <!-- Layer dimensions -->
  <g font-family="Arial, sans-serif" font-size="10" fill="#95a5a6" text-anchor="middle">
    <text x="100" y="330">n features</text>
    <text x="300" y="330">128 units</text>
    <text x="500" y="330">64 units</text>
    <text x="700" y="330">K classes</text>
  </g>
  
  <!-- Arrow indicating flow -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/>
    </marker>
  </defs>
  <line x1="50" y1="400" x2="750" y2="400" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="400" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Forward Propagation</text>
  
  <!-- Legend -->
  <g transform="translate(50, 450)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Legend:</text>
    <circle cx="60" cy="-5" r="8" fill="#3498db" stroke="#2980b9" stroke-width="1"/>
    <text x="75" y="0" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Input</text>
    <circle cx="120" cy="-5" r="8" fill="#e74c3c" stroke="#c0392b" stroke-width="1"/>
    <text x="135" y="0" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Hidden</text>
    <circle cx="180" cy="-5" r="8" fill="#27ae60" stroke="#229954" stroke-width="1"/>
    <text x="195" y="0" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Output</text>
  </g>
</svg>