<svg viewBox="0 0 900 750" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="900" height="750" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="450" y="35" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    SLM Architecture (Small Language Model)
  </text>
  
  <text x="450" y="60" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d" font-style="italic">
    Efficient, Lightweight Models for Resource-Constrained Environments
  </text>
  
  <!-- Comparison: Large vs Small -->
  <g transform="translate(50, 100)">
    <!-- Large LLM -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="350" height="200" fill="#e74c3c" stroke="#c0392b" stroke-width="2" rx="8" opacity="0.3"/>
      <text x="175" y="30" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#c0392b">
        Large LLM (175B+ params)
      </text>
      
      <!-- Multiple layers stacked -->
      <rect x="50" y="50" width="250" height="25" fill="#c0392b" opacity="0.8" rx="3"/>
      <rect x="50" y="80" width="250" height="25" fill="#c0392b" opacity="0.7" rx="3"/>
      <rect x="50" y="110" width="250" height="25" fill="#c0392b" opacity="0.6" rx="3"/>
      <rect x="50" y="140" width="250" height="25" fill="#c0392b" opacity="0.5" rx="3"/>
      <text x="175" y="180" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#c0392b">
        Heavy • Slow • High Memory
      </text>
    </g>
    
    <!-- Arrow -->
    <g transform="translate(375, 100)">
      <text x="0" y="-10" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#f39c12">
        Optimization
      </text>
      <line x1="-25" y1="0" x2="75" y2="0" stroke="#f39c12" stroke-width="3" marker-end="url(#arrow)"/>
      <text x="0" y="20" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#7f8c8d">
        Pruning
      </text>
      <text x="0" y="32" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#7f8c8d">
        Quantization
      </text>
      <text x="0" y="44" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#7f8c8d">
        Distillation
      </text>
    </g>
    
    <!-- Small LLM -->
    <g transform="translate(450, 0)">
      <rect x="0" y="0" width="350" height="200" fill="#27ae60" stroke="#229954" stroke-width="3" rx="8"/>
      <text x="175" y="30" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#27ae60">
        Small LLM (1-7B params)
      </text>
      
      <!-- Fewer, more efficient layers -->
      <rect x="75" y="70" width="200" height="20" fill="#27ae60" opacity="0.9" rx="3"/>
      <rect x="75" y="100" width="200" height="20" fill="#27ae60" opacity="0.8" rx="3"/>
      <rect x="75" y="130" width="200" height="20" fill="#27ae60" opacity="0.7" rx="3"/>
      <text x="175" y="170" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#27ae60" font-weight="bold">
        ⚡ Fast • 💾 Low Memory • 📱 Edge Ready
      </text>
    </g>
  </g>
  
  <!-- Optimization Techniques -->
  <g transform="translate(100, 340)">
    <text x="350" y="0" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Optimization Techniques
    </text>
    
    <!-- Technique 1 -->
    <g transform="translate(0, 30)">
      <rect x="0" y="0" width="340" height="80" fill="#ebf5fb" stroke="#3498db" stroke-width="2" rx="5"/>
      <text x="170" y="25" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#3498db">
        Parameter Reduction
      </text>
      <text x="170" y="45" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">
        Fewer parameters while maintaining
      </text>
      <text x="170" y="60" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">
        capability through efficient architectures
      </text>
    </g>
    
    <!-- Technique 2 -->
    <g transform="translate(360, 30)">
      <rect x="0" y="0" width="340" height="80" fill="#fef5e7" stroke="#f39c12" stroke-width="2" rx="5"/>
      <text x="170" y="25" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#f39c12">
        Quantization
      </text>
      <text x="170" y="45" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">
        Reduced precision (FP32 → INT8)
      </text>
      <text x="170" y="60" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">
        for faster inference
      </text>
    </g>
    
    <!-- Technique 3 -->
    <g transform="translate(0, 130)">
      <rect x="0" y="0" width="340" height="80" fill="#d5f4e6" stroke="#27ae60" stroke-width="2" rx="5"/>
      <text x="170" y="25" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">
        Pruning
      </text>
      <text x="170" y="45" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">
        Remove unnecessary connections
      </text>
      <text x="170" y="60" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">
        and network weights
      </text>
    </g>
    
    <!-- Technique 4 -->
    <g transform="translate(360, 130)">
      <rect x="0" y="0" width="340" height="80" fill="#f4ecf7" stroke="#9b59b6" stroke-width="2" rx="5"/>
      <text x="170" y="25" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#9b59b6">
        Knowledge Distillation
      </text>
      <text x="170" y="45" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">
        Learn from larger teacher models
      </text>
      <text x="170" y="60" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">
        to compress knowledge
      </text>
    </g>
  </g>
  
  <!-- Performance Comparison Table -->
  <g transform="translate(50, 600)">
    <text x="400" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Performance Comparison
    </text>
    
    <rect x="0" y="10" width="800" height="120" fill="white" stroke="#95a5a6" stroke-width="2" rx="5"/>
    
    <!-- Headers -->
    <rect x="0" y="10" width="200" height="30" fill="#34495e" rx="5 5 0 0"/>
    <rect x="200" y="10" width="200" height="30" fill="#e74c3c"/>
    <rect x="400" y="10" width="200" height="30" fill="#f39c12"/>
    <rect x="600" y="10" width="200" height="30" fill="#27ae60" rx="0 5 0 0"/>
    
    <text x="100" y="30" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="white">Metric</text>
    <text x="300" y="30" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="white">Large LLM</text>
    <text x="500" y="30" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="white">Medium LLM</text>
    <text x="700" y="30" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="white">SLM</text>
    
    <!-- Row 1: Parameters -->
    <rect x="0" y="40" width="200" height="30" fill="#ecf0f1"/>
    <text x="100" y="60" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#34495e">Parameters</text>
    <text x="300" y="60" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#34495e">175B+</text>
    <text x="500" y="60" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#34495e">7-70B</text>
    <text x="700" y="60" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#27ae60" font-weight="bold">1-7B</text>
    
    <!-- Row 2: Speed -->
    <rect x="0" y="70" width="200" height="30" fill="#ecf0f1"/>
    <text x="100" y="90" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#34495e">Inference Speed</text>
    <text x="300" y="90" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#34495e">Slow</text>
    <text x="500" y="90" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#34495e">Moderate</text>
    <text x="700" y="90" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#27ae60" font-weight="bold">Fast ⚡</text>
    
    <!-- Row 3: Memory -->
    <rect x="0" y="100" width="200" height="30" fill="#ecf0f1" rx="0 0 0 5"/>
    <text x="100" y="120" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#34495e">Memory Usage</text>
    <text x="300" y="120" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#34495e">High</text>
    <text x="500" y="120" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#34495e">Medium</text>
    <text x="700" y="120" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#27ae60" font-weight="bold" rx="0 0 5 0">Low 💾</text>
  </g>
  
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#f39c12"/>
    </marker>
  </defs>
</svg>