<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradCompact" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#388E3C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradOptimized" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9800;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F57C00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradEfficient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196F3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1976D2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradDistilled" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9C27B0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7B1FA2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#333">Small Language Model (SLM)</text>
  <text x="400" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#666">Efficient &amp; Resource-Optimized Architecture</text>
  
  <!-- Input -->
  <rect x="350" y="520" width="100" height="40" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="5"/>
  <text x="400" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1976d2">Input Text</text>
  
  <!-- Comparison: Large vs Small -->
  <g id="size-comparison">
    <!-- Large Model (Grayed out) -->
    <rect x="50" y="400" width="150" height="100" fill="#e0e0e0" stroke="#999" stroke-width="2" rx="8" opacity="0.6"/>
    <text x="125" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#666">Large LLM</text>
    <text x="125" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">175B+ Parameters</text>
    <text x="125" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">High Memory</text>
    <text x="125" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">Slow Inference</text>
    <text x="125" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">Cloud-Only</text>
    
    <!-- Arrow pointing to SLM -->
    <path d="M 200 450 L 250 450" stroke="#4CAF50" stroke-width="3" marker-end="url(#arrowhead-green)"/>
    <text x="225" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#4CAF50">Optimize</text>
  </g>
  
  <!-- Core SLM Architecture -->
  <rect x="300" y="350" width="200" height="120" fill="url(#gradCompact)" stroke="#333" stroke-width="2" rx="10"/>
  <text x="400" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">Compact SLM Core</text>
  <text x="400" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#E8F5E8">Llama-7B Architecture</text>
  <text x="400" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#E8F5E8">1-7B Parameters</text>
  <text x="400" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#E8F5E8">Reduced Layers</text>
  <text x="400" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#E8F5E8">Optimized Attention</text>
  
  <!-- Optimization Techniques -->
  <g id="optimization-techniques">
    <!-- Quantization -->
    <rect x="550" y="380" width="140" height="60" fill="url(#gradOptimized)" stroke="#333" stroke-width="2" rx="6"/>
    <text x="620" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Quantization</text>
    <text x="620" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#FFF3E0">FP16/INT8</text>
    <text x="620" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#FFF3E0">50% Memory ↓</text>
    
    <!-- Pruning -->
    <rect x="110" y="280" width="140" height="60" fill="url(#gradEfficient)" stroke="#333" stroke-width="2" rx="6"/>
    <text x="180" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Pruning</text>
    <text x="180" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#E3F2FD">Remove Weights</text>
    <text x="180" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#E3F2FD">Sparse Networks</text>
    
    <!-- Knowledge Distillation -->
    <rect x="550" y="280" width="140" height="60" fill="url(#gradDistilled)" stroke="#333" stroke-width="2" rx="6"/>
    <text x="620" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Distillation</text>
    <text x="620" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#F3E5F5">Teacher → Student</text>
    <text x="620" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#F3E5F5">Knowledge Transfer</text>
  </g>
  
  <!-- Performance Metrics -->
  <rect x="280" y="200" width="240" height="80" fill="#fff" stroke="#333" stroke-width="2" rx="8"/>
  <text x="400" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">SLM Performance</text>
  <text x="300" y="240" font-family="Arial, sans-serif" font-size="11" fill="#333">✓ 10x Faster Inference</text>
  <text x="300" y="255" font-family="Arial, sans-serif" font-size="11" fill="#333">✓ 90% Less Memory</text>
  <text x="420" y="240" font-family="Arial, sans-serif" font-size="11" fill="#333">✓ Edge Deployment</text>
  <text x="420" y="255" font-family="Arial, sans-serif" font-size="11" fill="#333">✓ Real-time Response</text>
  <text x="360" y="270" font-family="Arial, sans-serif" font-size="11" fill="#333">✓ 85%+ Capability Retention</text>
  
  <!-- Output -->
  <rect x="350" y="120" width="100" height="40" fill="#e8f5e8" stroke="#4caf50" stroke-width="2" rx="5"/>
  <text x="400" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4caf50">Fast Output</text>
  
  <!-- Deployment Targets -->
  <g id="deployment-targets">
    <rect x="20" y="150" width="200" height="120" fill="#f0f8ff" stroke="#2196F3" stroke-width="1" rx="5" opacity="0.9"/>
    <text x="120" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1976D2">Deployment Targets</text>
    
    <!-- Mobile -->
    <rect x="40" y="180" width="50" height="30" fill="#E8F5E8" stroke="#4CAF50" stroke-width="1" rx="3"/>
    <text x="65" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">Mobile</text>
    
    <!-- Edge -->
    <rect x="100" y="180" width="50" height="30" fill="#FFF3E0" stroke="#FF9800" stroke-width="1" rx="3"/>
    <text x="125" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">Edge</text>
    
    <!-- IoT -->
    <rect x="160" y="180" width="50" height="30" fill="#F3E5F5" stroke="#9C27B0" stroke-width="1" rx="3"/>
    <text x="185" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">IoT</text>
    
    <!-- Embedded -->
    <rect x="70" y="220" width="80" height="30" fill="#FFEBEE" stroke="#F44336" stroke-width="1" rx="3"/>
    <text x="110" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">Embedded</text>
    
    <text x="120" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Local Processing</text>
  </g>
  
  <!-- Efficiency Chart -->
  <g id="efficiency-chart">
    <rect x="580" y="150" width="200" height="120" fill="#fff8e1" stroke="#FFC107" stroke-width="1" rx="5" opacity="0.9"/>
    <text x="680" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#F57C00">Efficiency Gains</text>
    
    <!-- Memory bar -->
    <rect x="600" y="185" width="20" height="60" fill="#f44336"/>
    <rect x="600" y="225" width="20" height="20" fill="#4caf50"/>
    <text x="610" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">Memory</text>
    
    <!-- Speed bar -->
    <rect x="640" y="185" width="20" height="60" fill="#f44336"/>
    <rect x="640" y="239" width="20" height="6" fill="#4caf50"/>
    <text x="650" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">Latency</text>
    
    <!-- Cost bar -->
    <rect x="680" y="185" width="20" height="60" fill="#f44336"/>
    <rect x="680" y="230" width="20" height="15" fill="#4caf50"/>
    <text x="690" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">Cost</text>
    
    <!-- Legend -->
    <rect x="720" y="190" width="15" height="10" fill="#f44336"/>
    <text x="740" y="199" font-family="Arial, sans-serif" font-size="8" fill="#333">Large LLM</text>
    <rect x="720" y="205" width="15" height="10" fill="#4caf50"/>
    <text x="740" y="214" font-family="Arial, sans-serif" font-size="8" fill="#333">SLM</text>
  </g>
  
  <!-- Arrows -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4CAF50" />
    </marker>
    <marker id="arrowhead-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#FF9800" />
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2196F3" />
    </marker>
    <marker id="arrowhead-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9C27B0" />
    </marker>
  </defs>
  
  <!-- Main flow -->
  <path d="M 400 520 L 400 470" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Optimization connections -->
  <path d="M 550 410 L 500 410" stroke="#FF9800" stroke-width="2" marker-end="url(#arrowhead-orange)"/>
  <path d="M 250 310 L 300 380" stroke="#2196F3" stroke-width="2" marker-end="url(#arrowhead-blue)"/>
  <path d="M 550 310 L 500 380" stroke="#9C27B0" stroke-width="2" marker-end="url(#arrowhead-purple)"/>
  
  <!-- To performance -->
  <path d="M 400 350 L 400 280" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- To output -->
  <path d="M 400 200 L 400 160" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Formula box -->
  <g id="formula-box">
    <rect x="100" y="80" width="200" height="60" fill="#f0f0f0" stroke="#666" stroke-width="1" rx="5" opacity="0.9"/>
    <text x="200" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Compression Ratio</text>
    <text x="200" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">Original Params</text>
    <text x="200" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">Compressed Params</text>
  </g>
</svg>