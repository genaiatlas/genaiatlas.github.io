<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="appGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EC4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F97316;stop-opacity:1" />
    </linearGradient>
    <filter id="appShadow">
      <feDropShadow dx="3" dy="3" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="600" fill="#F8FAFC"/>
  
  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" font-size="28" font-weight="bold" fill="#1F2937">
    Recommendation System Applications
  </text>
  
  <!-- Central Hub -->
  <g transform="translate(500, 300)">
    <circle cx="0" cy="0" r="80" fill="url(#appGrad1)" filter="url(#appShadow)"/>
    <text x="0" y="0" text-anchor="middle" font-size="16" font-weight="bold" fill="white">
      RecSys
    </text>
    <text x="0" y="20" text-anchor="middle" font-size="14" fill="white">
      Engine
    </text>
  </g>
  
  <!-- Social Networks - Top Left -->
  <g transform="translate(200, 150)">
    <rect x="-80" y="-40" width="160" height="80" fill="#3B82F6" rx="8" filter="url(#appShadow)"/>
    <text x="0" y="-10" text-anchor="middle" font-size="16" font-weight="bold" fill="white">
      Social Networks
    </text>
    <text x="0" y="10" text-anchor="middle" font-size="12" fill="#DBEAFE">
      Friend suggestions
    </text>
    <text x="0" y="25" text-anchor="middle" font-size="12" fill="#DBEAFE">
      LinkedIn, Facebook
    </text>
  </g>
  
  <!-- E-commerce - Top Right -->
  <g transform="translate(800, 150)">
    <rect x="-80" y="-40" width="160" height="80" fill="#10B981" rx="8" filter="url(#appShadow)"/>
    <text x="0" y="-10" text-anchor="middle" font-size="16" font-weight="bold" fill="white">
      E-commerce
    </text>
    <text x="0" y="10" text-anchor="middle" font-size="12" fill="#D1FAE5">
      Product recommendations
    </text>
    <text x="0" y="25" text-anchor="middle" font-size="12" fill="#D1FAE5">
      Amazon, eBay
    </text>
  </g>
  
  <!-- Entertainment - Bottom Left -->
  <g transform="translate(200, 450)">
    <rect x="-80" y="-40" width="160" height="80" fill="#8B5CF6" rx="8" filter="url(#appShadow)"/>
    <text x="0" y="-10" text-anchor="middle" font-size="16" font-weight="bold" fill="white">
      Entertainment
    </text>
    <text x="0" y="10" text-anchor="middle" font-size="12" fill="#EDE9FE">
      Movies, Music
    </text>
    <text x="0" y="25" text-anchor="middle" font-size="12" fill="#EDE9FE">
      Netflix, Spotify
    </text>
  </g>
  
  <!-- Dating Apps - Bottom Right -->
  <g transform="translate(800, 450)">
    <rect x="-80" y="-40" width="160" height="80" fill="#EF4444" rx="8" filter="url(#appShadow)"/>
    <text x="0" y="-10" text-anchor="middle" font-size="16" font-weight="bold" fill="white">
      Dating Apps
    </text>
    <text x="0" y="10" text-anchor="middle" font-size="12" fill="#FEE2E2">
      Partner matching
    </text>
    <text x="0" y="25" text-anchor="middle" font-size="12" fill="#FEE2E2">
      Tinder, Match
    </text>
  </g>
  
  <!-- Crowdsourcing - Upper Middle -->
  <g transform="translate(420, 120)">
    <rect x="-70" y="-25" width="140" height="50" fill="#F59E0B" rx="6" filter="url(#appShadow)"/>
    <text x="0" y="0" text-anchor="middle" font-size="14" font-weight="bold" fill="white">
      Crowdsourcing
    </text>
    <text x="0" y="17" text-anchor="middle" font-size="11" fill="#FEF3C7">
      Label aggregation
    </text>
  </g>
  
  <!-- Policy Evaluation - Upper Middle -->
  <g transform="translate(580, 120)">
    <rect x="-70" y="-25" width="140" height="50" fill="#14B8A6" rx="6" filter="url(#appShadow)"/>
    <text x="0" y="0" text-anchor="middle" font-size="14" font-weight="bold" fill="white">
      Policy Evaluation
    </text>
    <text x="0" y="17" text-anchor="middle" font-size="11" fill="#CCFBF1">
      Synthetic controls
    </text>
  </g>
  
  <!-- Ranking Systems - Lower Middle -->
  <g transform="translate(420, 480)">
    <rect x="-70" y="-25" width="140" height="50" fill="#6366F1" rx="6" filter="url(#appShadow)"/>
    <text x="0" y="0" text-anchor="middle" font-size="14" font-weight="bold" fill="white">
      Ranking Systems
    </text>
    <text x="0" y="17" text-anchor="middle" font-size="11" fill="#E0E7FF">
      Sports, Gaming
    </text>
  </g>
  
  <!-- News and Content - Lower Middle -->
  <g transform="translate(580, 480)">
    <rect x="-70" y="-25" width="140" height="50" fill="#DC2626" rx="6" filter="url(#appShadow)"/>
    <text x="0" y="0" text-anchor="middle" font-size="14" font-weight="bold" fill="white">
      News and Content
    </text>
    <text x="0" y="17" text-anchor="middle" font-size="11" fill="#FEE2E2">
      Article curation
    </text>
  </g>
  
  <!-- Connecting Lines -->
  <g stroke="#CBD5E1" stroke-width="2" fill="none" stroke-dasharray="5,5">
    <!-- From center to main categories -->
    <line x1="440" y1="260" x2="260" y2="180"/>
    <line x1="560" y1="260" x2="740" y2="180"/>
    <line x1="440" y1="340" x2="260" y2="420"/>
    <line x1="560" y1="340" x2="740" y2="420"/>
    
    <!-- From center to secondary categories -->
    <line x1="480" y1="240" x2="440" y2="145"/>
    <line x1="520" y1="240" x2="560" y2="145"/>
    <line x1="480" y1="360" x2="440" y2="455"/>
    <line x1="520" y1="360" x2="560" y2="455"/>
  </g>
  
  <!-- Key Metrics -->
  <g transform="translate(100, 60)">
    <rect x="0" y="0" width="800" height="30" fill="#F0F9FF" stroke="#0EA5E9" stroke-width="1" rx="4"/>
    <text x="400" y="20" text-anchor="middle" font-size="14" fill="#0C4A6E">
      Common Goals: User Engagement | Click-Through Rate | Conversion | Retention | User Satisfaction
    </text>
  </g>
  
  <!-- Matrix Types Legend -->
  <g transform="translate(100, 540)">
    <rect x="0" y="0" width="800" height="40" fill="#FFF7ED" stroke="#F97316" stroke-width="1" rx="4"/>
    <text x="20" y="25" font-size="14" fill="#7C2D12">
      Matrix Types: Binary (0/1) | Ratings (1-5) | Implicit Feedback | Temporal | Multi-dimensional Tensors
    </text>
  </g>
</svg>