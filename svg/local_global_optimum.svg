<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="500" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">Local vs Global Optimum in K-Means</text>
  
  <!-- Objective Function Landscape -->
  <g transform="translate(50, 70)">
    <text x="300" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#34495e">K-Means Objective Function Landscape</text>
    
    <!-- Main curve representing objective function -->
    <g transform="translate(50, 30)">
      <!-- Axes -->
      <line x1="0" y1="200" x2="500" y2="200" stroke="#2c3e50" stroke-width="2"/>
      <line x1="0" y1="0" x2="0" y2="220" stroke="#2c3e50" stroke-width="2"/>
      
      <!-- Objective function curve with multiple local minima -->
      <path d="M 0 80 Q 50 50 80 70 Q 110 90 140 60 Q 170 30 200 50 Q 230 70 260 40 Q 290 20 320 30 Q 350 40 380 60 Q 410 80 440 90 Q 470 100 500 120" 
            stroke="#3498db" stroke-width="3" fill="none"/>
      
      <!-- Local minimum 1 -->
      <circle cx="80" cy="70" r="6" fill="#e74c3c"/>
      <text x="80" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c">Local Min 1</text>
      <path d="M 80 60 L 80 50 L 85 55 M 80 50 L 75 55" stroke="#e74c3c" stroke-width="2" fill="none"/>
      
      <!-- Local minimum 2 -->
      <circle cx="140" cy="60" r="6" fill="#e74c3c"/>
      <text x="140" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c">Local Min 2</text>
      <path d="M 140 50 L 140 40 L 145 45 M 140 40 L 135 45" stroke="#e74c3c" stroke-width="2" fill="none"/>
      
      <!-- Global minimum -->
      <circle cx="260" cy="40" r="8" fill="#27ae60"/>
      <text x="260" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#27ae60">Global Minimum</text>
      <path d="M 260 25 L 260 10 L 267 17 M 260 10 L 253 17" stroke="#27ae60" stroke-width="3" fill="none"/>
      
      <!-- Local minimum 3 -->
      <circle cx="320" cy="30" r="6" fill="#e74c3c"/>
      <text x="320" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c">Local Min 3</text>
      <path d="M 320 20 L 320 10 L 325 15 M 320 10 L 315 15" stroke="#e74c3c" stroke-width="2" fill="none"/>
      
      <!-- Axis labels -->
      <text x="250" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Parameter Space (Cluster Centers)</text>
      <text x="-15" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50" transform="rotate(-90, -15, 100)">Objective Function Value</text>
      
      <!-- Grid lines for reference -->
      <g opacity="0.3">
        <line x1="0" y1="50" x2="500" y2="50" stroke="#bdc3c7" stroke-width="1"/>
        <line x1="0" y1="100" x2="500" y2="100" stroke="#bdc3c7" stroke-width="1"/>
        <line x1="0" y1="150" x2="500" y2="150" stroke="#bdc3c7" stroke-width="1"/>
        <line x1="100" y1="0" x2="100" y2="200" stroke="#bdc3c7" stroke-width="1"/>
        <line x1="200" y1="0" x2="200" y2="200" stroke="#bdc3c7" stroke-width="1"/>
        <line x1="300" y1="0" x2="300" y2="200" stroke="#bdc3c7" stroke-width="1"/>
        <line x1="400" y1="0" x2="400" y2="200" stroke="#bdc3c7" stroke-width="1"/>
      </g>
    </g>
  </g>
  
  <!-- Problem Illustration -->
  <g transform="translate(50, 330)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e74c3c">The Local Optimum Problem:</text>
    
    <g transform="translate(0, 25)">
      <circle cx="8" cy="0" r="4" fill="#e74c3c"/>
      <text x="20" y="5" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">K-Means may converge to any local minimum depending on initialization</text>
    </g>
    
    <g transform="translate(0, 45)">
      <circle cx="8" cy="0" r="4" fill="#e74c3c"/>
      <text x="20" y="5" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Different starting points lead to different final solutions</text>
    </g>
    
    <g transform="translate(0, 65)">
      <circle cx="8" cy="0" r="4" fill="#e74c3c"/>
      <text x="20" y="5" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">No guarantee of finding the global optimum</text>
    </g>
  </g>
  
  <!-- Solutions Section -->
  <g transform="translate(450, 330)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#27ae60">Solutions:</text>
    
    <!-- Multiple Random Initializations -->
    <g transform="translate(0, 25)">
      <rect x="0" y="-10" width="300" height="30" fill="#d4edda" stroke="#27ae60" stroke-width="1" rx="3"/>
      <text x="10" y="5" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#155724">1. Multiple Random Initializations</text>
      <text x="10" y="20" font-family="Arial, sans-serif" font-size="10" fill="#155724">Run K-Means 10+ times, select best result</text>
    </g>
    
    <!-- K-Means++ -->
    <g transform="translate(0, 60)">
      <rect x="0" y="-10" width="300" height="30" fill="#cce5ff" stroke="#007bff" stroke-width="1" rx="3"/>
      <text x="10" y="5" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#004085">2. Smart Initialization (K-Means++)</text>
      <text x="10" y="20" font-family="Arial, sans-serif" font-size="10" fill="#004085">Choose initial centroids to be far apart</text>
    </g>
    
    <!-- Deterministic Methods -->
    <g transform="translate(0, 95)">
      <rect x="0" y="-10" width="300" height="30" fill="#fff3cd" stroke="#ffc107" stroke-width="1" rx="3"/>
      <text x="10" y="5" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#856404">3. Alternative Algorithms</text>
      <text x="10" y="20" font-family="Arial, sans-serif" font-size="10" fill="#856404">Use deterministic methods (Hierarchical, DBSCAN)</text>
    </g>
  </g>
  
  <!-- Algorithm Comparison -->
  <g transform="translate(600, 90)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#34495e">Algorithm Behavior:</text>
    
    <!-- Single run illustration -->
    <g transform="translate(0, 25)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Single K-Means Run:</text>
      
      <!-- Start point -->
      <circle cx="0" cy="20" r="4" fill="#f39c12"/>
      <text x="10" y="25" font-family="Arial, sans-serif" font-size="10" fill="#f39c12">Random Start</text>
      
      <!-- Path to local minimum -->
      <path d="M 0 20 Q 15 15 30 25 Q 45 35 60 30" stroke="#f39c12" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
      
      <!-- Local minimum result -->
      <circle cx="60" cy="30" r="4" fill="#e74c3c"/>
      <text x="70" y="35" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c">Local Min</text>
    </g>
    
    <!-- Multiple runs illustration -->
    <g transform="translate(0, 70)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Multiple Runs:</text>
      
      <!-- Multiple start points -->
      <circle cx="0" cy="20" r="3" fill="#f39c12"/>
      <circle cx="20" cy="25" r="3" fill="#f39c12"/>
      <circle cx="40" cy="15" r="3" fill="#f39c12"/>
      <circle cx="60" cy="30" r="3" fill="#f39c12"/>
      <text x="70" y="35" font-family="Arial, sans-serif" font-size="10" fill="#f39c12">Random Starts</text>
      
      <!-- Paths to different minima -->
      <path d="M 0 20 L 15 40" stroke="#f39c12" stroke-width="1" fill="none"/>
      <path d="M 20 25 L 35 45" stroke="#f39c12" stroke-width="1" fill="none"/>
      <path d="M 40 15 L 55 35" stroke="#f39c12" stroke-width="1" fill="none"/>
      <path d="M 60 30 L 75 50" stroke="#f39c12" stroke-width="1" fill="none"/>
      
      <!-- Best result -->
      <circle cx="55" cy="35" r="5" fill="#27ae60"/>
      <text x="65" y="40" font-family="Arial, sans-serif" font-size="10" fill="#27ae60">Best Result</text>
    </g>
    
    <!-- K-Means++ illustration -->
    <g transform="translate(0, 115)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">K-Means++:</text>
      
      <!-- Strategic start points -->
      <circle cx="0" cy="20" r="3" fill="#007bff"/>
      <circle cx="30" cy="20" r="3" fill="#007bff"/>
      <circle cx="60" cy="20" r="3" fill="#007bff"/>
      <text x="70" y="25" font-family="Arial, sans-serif" font-size="10" fill="#007bff">Smart Starts</text>
      
      <!-- Direct path to good solution -->
      <path d="M 30 20 L 45 35" stroke="#007bff" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
      
      <!-- Good result -->
      <circle cx="45" cy="35" r="5" fill="#27ae60"/>
      <text x="55" y="40" font-family="Arial, sans-serif" font-size="10" fill="#27ae60">Better Result</text>
    </g>
  </g>
  
  <!-- Mathematical Formula -->
  <g transform="translate(50, 450)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#34495e">K-Means Objective Function:</text>
    <text x="200" y="0" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">J = Σᵢ Σⱼ ||xᵢ - μⱼ||² · I(cᵢ = j)</text>
    <text x="200" y="20" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">Where μⱼ are cluster centers and I(cᵢ = j) is the assignment indicator</text>
  </g>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#34495e"/>
    </marker>
  </defs>
</svg>