<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #2c3e50; }
      .subtitle { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #34495e; }
      .text { font-family: Arial, sans-serif; font-size: 11px; fill: #2c3e50; }
      .axis-text { font-family: Arial, sans-serif; font-size: 10px; fill: #7f8c8d; }
      .data-point { fill: #3498db; stroke: #2980b9; stroke-width: 1; opacity: 0.8; }
      .pc1-line { stroke: #e74c3c; stroke-width: 3; fill: none; }
      .pc2-line { stroke: #27ae60; stroke-width: 3; fill: none; }
      .projection-line { stroke: #95a5a6; stroke-width: 1; stroke-dasharray: 2,2; opacity: 0.6; }
      .projected-point { fill: #e74c3c; stroke: #c0392b; stroke-width: 1; }
      .axis { stroke: #7f8c8d; stroke-width: 1; }
      .grid-line { stroke: #ecf0f1; stroke-width: 0.5; opacity: 0.3; }
      .variance-box { fill: #f8f9fa; stroke: #6c757d; stroke-width: 1; }
      .explanation-box { fill: #e8f4fd; stroke: #3498db; stroke-width: 2; }
    </style>
  </defs>

  <text x="450" y="25" class="title" text-anchor="middle">Principal Component Analysis (PCA): Dimensionality Reduction</text>

  <!-- Original 2D Data -->
  <g transform="translate(100, 80)">
    <text x="100" y="-10" class="subtitle" text-anchor="middle">Original 2D Data</text>
    
    <!-- Grid -->
    <g opacity="0.3">
      <line x1="0" y1="0" x2="200" y2="0" class="grid-line"/>
      <line x1="0" y1="50" x2="200" y2="50" class="grid-line"/>
      <line x1="0" y1="100" x2="200" y2="100" class="grid-line"/>
      <line x1="0" y1="150" x2="200" y2="150" class="grid-line"/>
      <line x1="0" y1="200" x2="200" y2="200" class="grid-line"/>
      <line x1="50" y1="0" x2="50" y2="200" class="grid-line"/>
      <line x1="100" y1="0" x2="100" y2="200" class="grid-line"/>
      <line x1="150" y1="0" x2="150" y2="200" class="grid-line"/>
      <line x1="200" y1="0" x2="200" y2="200" class="grid-line"/>
    </g>
    
    <!-- Axes -->
    <line x1="0" y1="200" x2="220" y2="200" class="axis"/>
    <line x1="0" y1="0" x2="0" y2="220" class="axis"/>
    <text x="210" y="210" class="axis-text">X₁</text>
    <text x="-10" y="10" class="axis-text">X₂</text>
    
    <!-- Data points (correlated) -->
    <circle cx="40" cy="170" r="3" class="data-point"/>
    <circle cx="50" cy="160" r="3" class="data-point"/>
    <circle cx="60" cy="150" r="3" class="data-point"/>
    <circle cx="70" cy="140" r="3" class="data-point"/>
    <circle cx="80" cy="130" r="3" class="data-point"/>
    <circle cx="90" cy="120" r="3" class="data-point"/>
    <circle cx="100" cy="110" r="3" class="data-point"/>
    <circle cx="110" cy="100" r="3" class="data-point"/>
    <circle cx="120" cy="90" r="3" class="data-point"/>
    <circle cx="130" cy="80" r="3" class="data-point"/>
    <circle cx="140" cy="70" r="3" class="data-point"/>
    <circle cx="150" cy="60" r="3" class="data-point"/>
    <circle cx="160" cy="50" r="3" class="data-point"/>
    
    <!-- Additional scattered points -->
    <circle cx="45" cy="155" r="3" class="data-point"/>
    <circle cx="75" cy="125" r="3" class="data-point"/>
    <circle cx="105" cy="95" r="3" class="data-point"/>
    <circle cx="135" cy="65" r="3" class="data-point"/>
    <circle cx="55" cy="145" r="3" class="data-point"/>
    <circle cx="85" cy="115" r="3" class="data-point"/>
    <circle cx="115" cy="85" r="3" class="data-point"/>
    <circle cx="145" cy="55" r="3" class="data-point"/>
    
    <!-- Principal Components -->
    <line x1="20" y1="180" x2="180" y2="40" class="pc1-line"/>
    <line x1="60" y1="40" x2="140" y2="180" class="pc2-line"/>
    
    <!-- Labels for PCs -->
    <text x="160" y="35" class="text" fill="#e74c3c" font-weight="bold">PC1 (85% variance)</text>
    <text x="145" y="185" class="text" fill="#27ae60" font-weight="bold">PC2 (15% variance)</text>
  </g>

  <!-- Arrow -->
  <g transform="translate(350, 180)">
    <path d="M 0,0 L 60,0 M 50,-5 L 60,0 L 50,5" stroke="#8e44ad" stroke-width="2" fill="none"/>
    <text x="30" y="-10" class="text" text-anchor="middle" fill="#8e44ad" font-weight="bold">PCA</text>
    <text x="30" y="20" class="text" text-anchor="middle" fill="#8e44ad">Transform</text>
  </g>

  <!-- Projected 1D Data -->
  <g transform="translate(450, 80)">
    <text x="100" y="-10" class="subtitle" text-anchor="middle">Reduced to 1D (PC1 only)</text>
    
    <!-- 1D axis (PC1) -->
    <line x1="0" y1="100" x2="200" y2="100" class="axis"/>
    <text x="210" y="105" class="axis-text">PC1</text>
    
    <!-- Projected points on PC1 -->
    <circle cx="30" r="3" cy="100" class="projected-point"/>
    <circle cx="40" r="3" cy="100" class="projected-point"/>
    <circle cx="50" r="3" cy="100" class="projected-point"/>
    <circle cx="60" r="3" cy="100" class="projected-point"/>
    <circle cx="70" r="3" cy="100" class="projected-point"/>
    <circle cx="80" r="3" cy="100" class="projected-point"/>
    <circle cx="90" r="3" cy="100" class="projected-point"/>
    <circle cx="100" r="3" cy="100" class="projected-point"/>
    <circle cx="110" r="3" cy="100" class="projected-point"/>
    <circle cx="120" r="3" cy="100" class="projected-point"/>
    <circle cx="130" r="3" cy="100" class="projected-point"/>
    <circle cx="140" r="3" cy="100" class="projected-point"/>
    <circle cx="150" r="3" cy="100" class="projected-point"/>
    <circle cx="35" r="3" cy="100" class="projected-point"/>
    <circle cx="65" r="3" cy="100" class="projected-point"/>
    <circle cx="95" r="3" cy="100" class="projected-point"/>
    <circle cx="125" r="3" cy="100" class="projected-point"/>
    <circle cx="45" r="3" cy="100" class="projected-point"/>
    <circle cx="75" r="3" cy="100" class="projected-point"/>
    <circle cx="105" r="3" cy="100" class="projected-point"/>
    <circle cx="135" r="3" cy="100" class="projected-point"/>
    
    <!-- Show projection lines from original to projected -->
    <g opacity="0.4">
      <line x1="-310" y1="70" x2="30" y2="100" class="projection-line"/>
      <line x1="-300" y1="60" x2="40" y2="100" class="projection-line"/>
      <line x1="-290" y1="50" x2="50" y2="100" class="projection-line"/>
      <line x1="-280" y1="40" x2="60" y2="100" class="projection-line"/>
    </g>
    
    <text x="100" y="130" class="text" text-anchor="middle">85% of original variance preserved</text>
    <text x="100" y="145" class="text" text-anchor="middle">with 50% reduction in dimensions</text>
  </g>

  <!-- Variance Explanation -->
  <g transform="translate(50, 320)">
    <rect x="-10" y="-10" width="350" height="120" class="variance-box" rx="5"/>
    <text x="10" y="10" class="subtitle">Variance Explained</text>
    
    <!-- Variance bars -->
    <rect x="20" y="25" width="170" height="15" fill="#e74c3c" opacity="0.8"/>
    <rect x="20" y="45" width="30" height="15" fill="#27ae60" opacity="0.8"/>
    <rect x="20" y="65" width="10" height="15" fill="#f39c12" opacity="0.8"/>
    
    <text x="200" y="37" class="text">PC1: 85% variance</text>
    <text x="200" y="57" class="text">PC2: 15% variance</text>
    <text x="200" y="77" class="text">PC3+: ~0% variance</text>
    
    <text x="20" y="100" class="text">Cumulative: PC1 captures 85% of total data variation</text>
  </g>

  <!-- Mathematical Steps -->
  <g transform="translate(450, 320)">
    <rect x="-10" y="-10" width="400" height="120" class="explanation-box" rx="5"/>
    <text x="10" y="10" class="subtitle">PCA Algorithm Steps</text>
    
    <text x="20" y="30" class="text">1. Standardize the data (mean=0, std=1)</text>
    <text x="20" y="45" class="text">2. Compute covariance matrix C = X'X/(n-1)</text>
    <text x="20" y="60" class="text">3. Find eigenvalues λ and eigenvectors v of C</text>
    <text x="20" y="75" class="text">4. Sort eigenvectors by eigenvalue (descending)</text>
    <text x="20" y="90" class="text">5. Project data onto top k eigenvectors (PCs)</text>
  </g>

  <!-- Covariance Matrix Example -->
  <g transform="translate(50, 460)">
    <text x="0" y="0" class="subtitle">Covariance Matrix and Eigenvectors</text>
    
    <g transform="translate(0, 20)">
      <text x="0" y="20" class="text">Original Covariance Matrix C:</text>
      <text x="50" y="40" class="text">⎡ 2.5  1.8 ⎤</text>
      <text x="0" y="45" class="text">C =</text>
      <text x="50" y="55" class="text">⎣ 1.8  2.2 ⎦</text>
      
      <text x="200" y="20" class="text">Eigenvalues: λ₁ = 4.1, λ₂ = 0.6</text>
      <text x="200" y="40" class="text">Eigenvectors: v₁ = [0.72, 0.69]</text>
      <text x="200" y="55" class="text">             v₂ = [-0.69, 0.72]</text>
    </g>
    
    <g transform="translate(0, 90)">
      <text x="0" y="0" class="text" font-weight="bold">Key Insights:</text>
      <text x="10" y="20" class="text">• Eigenvectors become the new coordinate axes (Principal Components)</text>
      <text x="10" y="35" class="text">• Eigenvalues represent variance along each PC</text>
      <text x="10" y="50" class="text">• PC1 captures maximum variance, PC2 captures remaining orthogonal variance</text>
      <text x="10" y="65" class="text">• Data projection: X_new = X_original × Eigenvectors</text>
    </g>
  </g>

  <!-- Applications -->
  <g transform="translate(500, 460)">
    <rect x="-10" y="-10" width="360" height="180" fill="#f0f8ff" stroke="#4169e1" stroke-width="1" rx="5"/>
    <text x="10" y="10" class="subtitle">PCA Applications</text>
    
    <text x="20" y="35" class="text" font-weight="bold">Data Visualization:</text>
    <text x="30" y="50" class="text">• Reduce high-dimensional data to 2D/3D for plotting</text>
    <text x="30" y="65" class="text">• Identify clusters and patterns in data</text>
    
    <text x="20" y="90" class="text" font-weight="bold">Feature Engineering:</text>
    <text x="30" y="105" class="text">• Remove redundant features (dimensionality reduction)</text>
    <text x="30" y="120" class="text">• Speed up machine learning algorithms</text>
    
    <text x="20" y="145" class="text" font-weight="bold">Noise Reduction:</text>
    <text x="30" y="160" class="text">• Filter out low-variance components (noise)</text>
  </g>
</svg>