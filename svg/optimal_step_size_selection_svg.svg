<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <linearGradient id="optimalGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f44336"/>
      <stop offset="50%" style="stop-color:#4caf50"/>
      <stop offset="100%" style="stop-color:#2196f3"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="700" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1565c0">
    Optimal Step Size Selection Strategy
  </text>
  
  <!-- Top Section: Step Size Range -->
  <rect x="50" y="60" width="800" height="120" fill="white" stroke="#ddd" stroke-width="1" rx="8"/>
  <text x="450" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">
    Step Size Spectrum
  </text>
  
  <!-- Step Size Bar -->
  <rect x="100" y="110" width="700" height="30" fill="url(#optimalGradient)" rx="15"/>
  
  <!-- Step Size Labels -->
  <text x="100" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#f44336" font-weight="bold">
    Too Large
  </text>
  <text x="450" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#4caf50" font-weight="bold">
    Optimal Zone
  </text>
  <text x="800" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2196f3" font-weight="bold">
    Too Small
  </text>
  
  <!-- Specific Values -->
  <text x="150" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">η = 10.0</text>
  <text x="250" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">η = 1.0</text>
  <text x="350" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">η = 0.5</text>
  <text x="450" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#4caf50" font-weight="bold">η = 0.1</text>
  <text x="550" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">η = 0.01</text>
  <text x="650" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">η = 0.001</text>
  <text x="750" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">η = 0.0001</text>
  
  <!-- Middle Section: Detection Methods -->
  <rect x="50" y="200" width="800" height="180" fill="white" stroke="#ddd" stroke-width="1" rx="8"/>
  <text x="450" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">
    How to Detect Step Size Issues
  </text>
  
  <!-- Detection Grid -->
  <g id="detectionGrid">
    <!-- Too Small Detection -->
    <rect x="70" y="240" width="240" height="120" fill="#e3f2fd" stroke="#2196f3" stroke-width="1" rx="5"/>
    <text x="190" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2196f3">
      Step Size Too Small
    </text>
    
    <!-- Loss curve visualization -->
    <path d="M 90 280 Q 120 275 150 272 Q 180 270 210 268 Q 240 267 270 266" 
          stroke="#2196f3" stroke-width="3" fill="none"/>
    
    <text x="80" y="300" font-family="Arial, sans-serif" font-size="11" fill="#333">Signs:</text>
    <text x="80" y="315" font-family="Arial, sans-serif" font-size="10" fill="#333">• Very slow loss decrease</text>
    <text x="80" y="330" font-family="Arial, sans-serif" font-size="10" fill="#333">• Smooth, gradual curve</text>
    <text x="80" y="345" font-family="Arial, sans-serif" font-size="10" fill="#333">• High training time</text>
    
    <!-- Optimal Detection -->
    <rect x="330" y="240" width="240" height="120" fill="#e8f5e8" stroke="#4caf50" stroke-width="1" rx="5"/>
    <text x="450" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4caf50">
      Optimal Step Size
    </text>
    
    <!-- Optimal loss curve -->
    <path d="M 350 300 Q 370 280 390 270 Q 410 265 430 263 Q 450 262 470 262" 
          stroke="#4caf50" stroke-width="3" fill="none"/>
    
    <text x="340" y="300" font-family="Arial, sans-serif" font-size="11" fill="#333">Signs:</text>
    <text x="340" y="315" font-family="Arial, sans-serif" font-size="10" fill="#333">• Rapid early decrease</text>
    <text x="340" y="330" font-family="Arial, sans-serif" font-size="10" fill="#333">• Stable convergence</text>
    <text x="340" y="345" font-family="Arial, sans-serif" font-size="10" fill="#333">• Efficient training</text>
    
    <!-- Too Large Detection -->
    <rect x="590" y="240" width="240" height="120" fill="#ffebee" stroke="#f44336" stroke-width="1" rx="5"/>
    <text x="710" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f44336">
      Step Size Too Large
    </text>
    
    <!-- Oscillating loss curve -->
    <path d="M 610 290 L 630 270 L 650 310 L 670 260 L 690 320 L 710 250 L 730 330 L 750 280 L 770 300" 
          stroke="#f44336" stroke-width="3" fill="none"/>
    
    <text x="600" y="300" font-family="Arial, sans-serif" font-size="11" fill="#333">Signs:</text>
    <text x="600" y="315" font-family="Arial, sans-serif" font-size="10" fill="#333">• Oscillating loss</text>
    <text x="600" y="330" font-family="Arial, sans-serif" font-size="10" fill="#333">• Erratic behavior</text>
    <text x="600" y="345" font-family="Arial, sans-serif" font-size="10" fill="#333">• No clear progress</text>
  </g>
  
  <!-- Bottom Section: Selection Algorithm -->
  <rect x="50" y="400" width="800" height="250" fill="white" stroke="#ddd" stroke-width="1" rx="8"/>
  <text x="450" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">
    Step Size Selection Algorithm
  </text>
  
  <!-- Flowchart -->
  <g id="flowchart">
    <!-- Step 1 -->
    <rect x="150" y="450" width="150" height="40" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="5"/>
    <text x="225" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1976d2">
      Start with η = 0.01
    </text>
    
    <!-- Arrow 1 -->
    <line x1="300" y1="470" x2="340" y2="470" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Step 2 -->
    <rect x="350" y="450" width="150" height="40" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="5"/>
    <text x="425" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ff9800">
      Train for few epochs
    </text>
    
    <!-- Arrow 2 -->
    <line x1="500" y1="470" x2="540" y2="470" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Step 3 -->
    <rect x="550" y="450" width="150" height="40" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2" rx="5"/>
    <text x="625" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#9c27b0">
      Analyze loss curve
    </text>
    
    <!-- Decision Diamond -->
    <polygon points="425,520 465,540 425,560 385,540" fill="#ffecb3" stroke="#ffa000" stroke-width="2"/>
    <text x="425" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffa000">
      Good?
    </text>
    
    <!-- Decision Arrows -->
    <line x1="425" y1="500" x2="425" y2="520" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Yes branch -->
    <line x1="465" y1="540" x2="500" y2="540" stroke="#4caf50" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="480" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#4caf50" font-weight="bold">Yes</text>
    
    <rect x="510" y="520" width="120" height="40" fill="#e8f5e8" stroke="#4caf50" stroke-width="2" rx="5"/>
    <text x="570" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#4caf50">
      Use this η
    </text>
    
    <!-- No branch -->
    <line x1="385" y1="540" x2="320" y2="540" stroke="#f44336" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="350" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#f44336" font-weight="bold">No</text>
    
    <!-- Adjustment options -->
    <rect x="200" y="520" width="120" height="40" fill="#ffebee" stroke="#f44336" stroke-width="2" rx="5"/>
    <text x="260" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#f44336">
      Too oscillating?
    </text>
    <text x="260" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#f44336">
      η ← η / 2
    </text>
    
    <rect x="60" y="520" width="120" height="40" fill="#e3f2fd" stroke="#2196f3" stroke-width="2" rx="5"/>
    <text x="120" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2196f3">
      Too slow?
    </text>
    <text x="120" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2196f3">
      η ← η × 2
    </text>
    
    <!-- Return arrows -->
    <line x1="120" y1="520" x2="120" y2="480" stroke="#2196f3" stroke-width="2" stroke-dasharray="3,3"/>
    <line x1="120" y1="480" x2="225" y2="480" stroke="#2196f3" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arrowhead)"/>
    
    <line x1="260" y1="520" x2="260" y2="480" stroke="#f44336" stroke-width="2" stroke-dasharray="3,3"/>
    <line x1="260" y1="480" x2="225" y2="480" stroke="#f44336" stroke-width="2" stroke-dasharray="3,3"/>
  </g>
  
  <!-- Best Practices Box -->
  <rect x="100" y="590" width="700" height="80" fill="#f1f8e9" stroke="#689f38" stroke-width="2" rx="8"/>
  <text x="450" y="615" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#689f38">
    🎯 Best Practices for Step Size Selection
  </text>
  
  <g id="bestPractices">
    <text x="120" y="635" font-family="Arial, sans-serif" font-size="12" fill="#333">
      1. Start Conservative: Begin with η = 0.01 for SGD, η = 0.001 for Adam
    </text>
    <text x="120" y="650" font-family="Arial, sans-serif" font-size="12" fill="#333">
      2. Grid Search: Try [0.1, 0.01, 0.001] and pick the best performer
    </text>
    <text x="120" y="665" font-family="Arial, sans-serif" font-size="12" fill="#333">
      3. Learning Rate Scheduling: Use decay/warmup for better convergence
    </text>
  </g>
</svg>