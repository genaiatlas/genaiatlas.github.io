<svg viewBox="0 0 1200 850" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="850" fill="#f8f9fa"/>
  <text x="600" y="40" font-family="Arial" font-size="28" font-weight="bold" text-anchor="middle">Multi-Query Approach</text>
  
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" fill="#495057"/></marker></defs>
  
  <rect x="300" y="80" width="600" height="70" rx="10" fill="#fff3bf" stroke="#f59f00" stroke-width="3"/>
  <text x="600" y="110" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Original Query</text>
  <text x="600" y="132" font-family="Arial" font-size="12" text-anchor="middle" font-style="italic">"What are the health benefits of intermittent fasting?"</text>
  
  <line x1="600" y1="150" x2="600" y2="185" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  
  <rect x="250" y="195" width="700" height="70" rx="10" fill="#9333ea" stroke="#7950f2" stroke-width="3"/>
  <text x="600" y="225" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="white">LLM Query Generator</text>
  <text x="600" y="245" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Generate 3-5 query variations</text>
  
  <line x1="600" y1="265" x2="600" y2="300" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  
  <g id="variations">
    <rect x="50" y="310" width="250" height="90" rx="8" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
    <text x="175" y="335" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Variation 1</text>
    <text x="65" y="360" font-family="Arial" font-size="10" font-style="italic">"How does intermittent</text>
    <text x="65" y="377" font-family="Arial" font-size="10" font-style="italic">fasting improve health?"</text>
    
    <rect x="325" y="310" width="250" height="90" rx="8" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
    <text x="450" y="335" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Variation 2</text>
    <text x="340" y="360" font-family="Arial" font-size="10" font-style="italic">"Positive effects of periodic</text>
    <text x="340" y="377" font-family="Arial" font-size="10" font-style="italic">fasting on the body?"</text>
    
    <rect x="600" y="310" width="250" height="90" rx="8" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
    <text x="725" y="335" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Variation 3</text>
    <text x="615" y="360" font-family="Arial" font-size="10" font-style="italic">"Medical advantages of</text>
    <text x="615" y="377" font-family="Arial" font-size="10" font-style="italic">time-restricted eating?"</text>
    
    <rect x="875" y="310" width="250" height="90" rx="8" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
    <text x="1000" y="335" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Variation 4</text>
    <text x="890" y="360" font-family="Arial" font-size="10" font-style="italic">"Benefits of fasting</text>
    <text x="890" y="377" font-family="Arial" font-size="10" font-style="italic">intermittently for wellness?"</text>
  </g>
  
  <text x="600" y="430" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#495057">↓ Parallel Retrieval ↓</text>
  
  <g id="retrieval">
    <rect x="50" y="460" width="250" height="80" rx="5" fill="#d3f9d8" stroke="#37b24d" stroke-width="2"/>
    <text x="175" y="485" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">Results Set 1</text>
    <text x="65" y="505" font-family="Arial" font-size="9">Docs: [A, B, C, D, E]</text>
    
    <rect x="325" y="460" width="250" height="80" rx="5" fill="#d3f9d8" stroke="#37b24d" stroke-width="2"/>
    <text x="450" y="485" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">Results Set 2</text>
    <text x="340" y="505" font-family="Arial" font-size="9">Docs: [B, D, F, G, H]</text>
    
    <rect x="600" y="460" width="250" height="80" rx="5" fill="#d3f9d8" stroke="#37b24d" stroke-width="2"/>
    <text x="725" y="485" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">Results Set 3</text>
    <text x="615" y="505" font-family="Arial" font-size="9">Docs: [A, C, I, J, K]</text>
    
    <rect x="875" y="460" width="250" height="80" rx="5" fill="#d3f9d8" stroke="#37b24d" stroke-width="2"/>
    <text x="1000" y="485" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">Results Set 4</text>
    <text x="890" y="505" font-family="Arial" font-size="9">Docs: [D, E, L, M, N]</text>
  </g>
  
  <line x1="600" y1="540" x2="600" y2="575" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  
  <rect x="200" y="585" width="800" height="90" rx="10" fill="#ffdeeb" stroke="#e64980" stroke-width="3"/>
  <text x="600" y="615" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Result Aggregation &amp; Deduplication</text>
  <text x="600" y="640" font-family="Arial" font-size="12" text-anchor="middle">Union: [A, B, C, D, E, F, G, H, I, J, K, L, M, N]</text>
  <text x="600" y="660" font-family="Arial" font-size="11" text-anchor="middle" fill="#495057">Weighted by frequency: D(4), A(3), B(3), E(3)...</text>
  
  <line x1="600" y1="675" x2="600" y2="710" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  
  <rect x="250" y="720" width="700" height="100" rx="10" fill="#51cf66" stroke="#2f9e44" stroke-width="3"/>
  <text x="600" y="750" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Final Ranked Documents</text>
  <text x="600" y="775" font-family="Arial" font-size="12" text-anchor="middle" fill="white">✓ Comprehensive coverage from multiple perspectives</text>
  <text x="600" y="795" font-family="Arial" font-size="12" text-anchor="middle" fill="white">✓ Documents appearing in multiple queries ranked higher</text>
</svg>