<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="800" fill="#f5f7fa"/>
  
  <!-- Title -->
  <text x="600" y="40" font-size="26" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Collaborative Filtering Methods
  </text>
  
  <!-- User-Based CF Section -->
  <g id="user-based">
    <rect x="50" y="80" width="500" height="320" rx="10" fill="#e3f2fd" stroke="#2196f3" stroke-width="2"/>
    <text x="300" y="110" font-size="18" font-weight="bold" text-anchor="middle" fill="#1565c0">User-Based Collaborative Filtering</text>
    
    <!-- User similarity matrix visualization -->
    <text x="90" y="140" font-size="14" fill="#424242">Step 1: Find Similar Users</text>
    
    <!-- User circles -->
    <circle cx="120" cy="180" r="25" fill="#4caf50" stroke="#2e7d32" stroke-width="2"/>
    <text x="120" y="185" font-size="12" text-anchor="middle" fill="white">U1</text>
    
    <circle cx="200" cy="180" r="25" fill="#ffc107" stroke="#f57c00" stroke-width="2"/>
    <text x="200" y="185" font-size="12" text-anchor="middle" fill="white">U2</text>
    
    <circle cx="280" cy="180" r="25" fill="#ffc107" stroke="#f57c00" stroke-width="2"/>
    <text x="280" y="185" font-size="12" text-anchor="middle" fill="white">U3</text>
    
    <circle cx="360" cy="180" r="25" fill="#e0e0e0" stroke="#9e9e9e" stroke-width="2"/>
    <text x="360" y="185" font-size="12" text-anchor="middle" fill="#424242">U4</text>
    
    <circle cx="440" cy="180" r="25" fill="#e0e0e0" stroke="#9e9e9e" stroke-width="2"/>
    <text x="440" y="185" font-size="12" text-anchor="middle" fill="#424242">U5</text>
    
    <!-- Similarity lines -->
    <line x1="145" y1="180" x2="175" y2="180" stroke="#4caf50" stroke-width="3"/>
    <line x1="145" y1="180" x2="255" y2="180" stroke="#4caf50" stroke-width="3"/>
    <text x="160" y="170" font-size="10" fill="#2e7d32">0.85</text>
    <text x="200" y="170" font-size="10" fill="#2e7d32">0.78</text>
    
    <!-- Rating Matrix -->
    <text x="90" y="250" font-size="14" fill="#424242">Step 2: Aggregate Neighbor Ratings</text>
    
    <rect x="90" y="270" width="400" height="100" rx="5" fill="white" stroke="#90a4ae" stroke-width="1"/>
    
    <!-- Matrix headers -->
    <text x="130" y="295" font-size="12" font-weight="bold" fill="#424242">User</text>
    <text x="200" y="295" font-size="12" font-weight="bold" fill="#424242">Item1</text>
    <text x="270" y="295" font-size="12" font-weight="bold" fill="#424242">Item2</text>
    <text x="340" y="295" font-size="12" font-weight="bold" fill="#424242">Item3</text>
    <text x="410" y="295" font-size="12" font-weight="bold" fill="#424242">Item4</text>
    
    <!-- Matrix values -->
    <text x="130" y="315" font-size="12" fill="#4caf50">U1</text>
    <text x="210" y="315" font-size="12" text-anchor="middle" fill="#424242">5</text>
    <text x="280" y="315" font-size="12" text-anchor="middle" fill="#424242">?</text>
    <text x="350" y="315" font-size="12" text-anchor="middle" fill="#424242">4</text>
    <text x="420" y="315" font-size="12" text-anchor="middle" fill="#424242">?</text>
    
    <text x="130" y="335" font-size="12" fill="#ffc107">U2</text>
    <text x="210" y="335" font-size="12" text-anchor="middle" fill="#424242">5</text>
    <text x="280" y="335" font-size="12" text-anchor="middle" fill="#424242">4</text>
    <text x="350" y="335" font-size="12" text-anchor="middle" fill="#424242">3</text>
    <text x="420" y="335" font-size="12" text-anchor="middle" fill="#424242">5</text>
    
    <text x="130" y="355" font-size="12" fill="#ffc107">U3</text>
    <text x="210" y="355" font-size="12" text-anchor="middle" fill="#424242">4</text>
    <text x="280" y="355" font-size="12" text-anchor="middle" fill="#424242">5</text>
    <text x="350" y="355" font-size="12" text-anchor="middle" fill="#424242">4</text>
    <text x="420" y="355" font-size="12" text-anchor="middle" fill="#424242">4</text>
  </g>
  
  <!-- Item-Based CF Section -->
  <g id="item-based">
    <rect x="650" y="80" width="500" height="320" rx="10" fill="#fce4ec" stroke="#e91e63" stroke-width="2"/>
    <text x="900" y="110" font-size="18" font-weight="bold" text-anchor="middle" fill="#880e4f">Item-Based Collaborative Filtering</text>
    
    <!-- Item similarity -->
    <text x="690" y="140" font-size="14" fill="#424242">Step 1: Calculate Item Similarities</text>
    
    <!-- Item rectangles -->
    <rect x="710" y="160" width="60" height="40" rx="5" fill="#9c27b0" stroke="#6a1b9a" stroke-width="2"/>
    <text x="740" y="185" font-size="12" text-anchor="middle" fill="white">I1</text>
    
    <rect x="790" y="160" width="60" height="40" rx="5" fill="#9c27b0" stroke="#6a1b9a" stroke-width="2"/>
    <text x="820" y="185" font-size="12" text-anchor="middle" fill="white">I2</text>
    
    <rect x="870" y="160" width="60" height="40" rx="5" fill="#e0e0e0" stroke="#9e9e9e" stroke-width="2"/>
    <text x="900" y="185" font-size="12" text-anchor="middle" fill="#424242">I3</text>
    
    <rect x="950" y="160" width="60" height="40" rx="5" fill="#9c27b0" stroke="#6a1b9a" stroke-width="2"/>
    <text x="980" y="185" font-size="12" text-anchor="middle" fill="white">I4</text>
    
    <rect x="1030" y="160" width="60" height="40" rx="5" fill="#e0e0e0" stroke="#9e9e9e" stroke-width="2"/>
    <text x="1060" y="185" font-size="12" text-anchor="middle" fill="#424242">I5</text>
    
    <!-- Similarity connections -->
    <path d="M 770 180 Q 800 150, 820 180" stroke="#9c27b0" stroke-width="2" fill="none"/>
    <text x="795" y="145" font-size="10" fill="#6a1b9a">0.92</text>
    
    <path d="M 770 180 Q 875 150, 980 180" stroke="#9c27b0" stroke-width="2" fill="none"/>
    <text x="875" y="145" font-size="10" fill="#6a1b9a">0.81</text>
    
    <!-- Item-Item Similarity Matrix -->
    <text x="690" y="250" font-size="14" fill="#424242">Step 2: Predict Using Similar Items</text>
    
    <rect x="690" y="270" width="400" height="100" rx="5" fill="white" stroke="#90a4ae" stroke-width="1"/>
    
    <!-- Matrix content -->
    <text x="730" y="295" font-size="12" font-weight="bold" fill="#424242">Item</text>
    <text x="800" y="295" font-size="12" font-weight="bold" fill="#424242">I1</text>
    <text x="860" y="295" font-size="12" font-weight="bold" fill="#424242">I2</text>
    <text x="920" y="295" font-size="12" font-weight="bold" fill="#424242">I3</text>
    <text x="980" y="295" font-size="12" font-weight="bold" fill="#424242">I4</text>
    <text x="1040" y="295" font-size="12" font-weight="bold" fill="#424242">I5</text>
    
    <text x="730" y="315" font-size="12" fill="#9c27b0">I1</text>
    <text x="810" y="315" font-size="12" text-anchor="middle" fill="#424242">1.0</text>
    <text x="870" y="315" font-size="12" text-anchor="middle" fill="#9c27b0">0.92</text>
    <text x="930" y="315" font-size="12" text-anchor="middle" fill="#424242">0.45</text>
    <text x="990" y="315" font-size="12" text-anchor="middle" fill="#9c27b0">0.81</text>
    <text x="1050" y="315" font-size="12" text-anchor="middle" fill="#424242">0.33</text>
  </g>
  
  <!-- Matrix Factorization Section -->
  <g id="matrix-factorization">
    <rect x="50" y="440" width="1100" height="320" rx="10" fill="#f1f8e9" stroke="#689f38" stroke-width="2"/>
    <text x="600" y="470" font-size="18" font-weight="bold" text-anchor="middle" fill="#33691e">Matrix Factorization (SVD)</text>
    
    <!-- Original Matrix -->
    <text x="150" y="510" font-size="14" font-weight="bold" text-anchor="middle" fill="#424242">R (User-Item Matrix)</text>
    <rect x="80" y="530" width="140" height="140" rx="5" fill="white" stroke="#8bc34a" stroke-width="2"/>
    
    <!-- Matrix R values -->
    <g font-size="11" fill="#424242">
      <text x="100" y="555">5  ?  4  1  ?</text>
      <text x="100" y="575">4  5  ?  2  4</text>
      <text x="100" y="595">?  3  5  4  3</text>
      <text x="100" y="615">1  ?  2  5  ?</text>
      <text x="100" y="635">3  4  ?  ?  5</text>
    </g>
    
    <!-- Equals sign -->
    <text x="250" y="600" font-size="24" fill="#424242">≈</text>
    
    <!-- User Matrix -->
    <text x="350" y="510" font-size="14" font-weight="bold" text-anchor="middle" fill="#424242">U (User Factors)</text>
    <rect x="300" y="530" width="100" height="140" rx="5" fill="white" stroke="#8bc34a" stroke-width="2"/>
    
    <!-- Matrix U representation -->
    <g font-size="11" fill="#424242">
      <text x="315" y="555">0.8  0.2  0.3</text>
      <text x="315" y="575">0.7  0.4  0.2</text>
      <text x="315" y="595">0.3  0.9  0.1</text>
      <text x="315" y="615">0.2  0.3  0.8</text>
      <text x="315" y="635">0.5  0.5  0.4</text>
    </g>
    
    <!-- Times sign -->
    <text x="430" y="600" font-size="24" fill="#424242">×</text>
    
    <!-- Sigma Matrix -->
    <text x="520" y="510" font-size="14" font-weight="bold" text-anchor="middle" fill="#424242">Σ (Singular Values)</text>
    <rect x="470" y="530" width="100" height="100" rx="5" fill="white" stroke="#8bc34a" stroke-width="2"/>
    
    <!-- Diagonal values -->
    <g font-size="11" fill="#424242">
      <text x="485" y="555">4.2  0   0</text>
      <text x="485" y="575">0   3.1  0</text>
      <text x="485" y="595">0   0   2.3</text>
    </g>
    
    <!-- Times sign -->
    <text x="600" y="600" font-size="24" fill="#424242">×</text>
    
    <!-- Item Matrix -->
    <text x="730" y="510" font-size="14" font-weight="bold" text-anchor="middle" fill="#424242">V^T (Item Factors)</text>
    <rect x="650" y="530" width="160" height="100" rx="5" fill="white" stroke="#8bc34a" stroke-width="2"/>
    
    <!-- Matrix V^T representation -->
    <g font-size="11" fill="#424242">
      <text x="665" y="555">0.6  0.3  0.5  0.2  0.4</text>
      <text x="665" y="575">0.2  0.8  0.3  0.4  0.1</text>
      <text x="665" y="595">0.4  0.2  0.1  0.7  0.5</text>
    </g>
    
    <!-- Result Arrow -->
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
        <polygon points="0 0, 10 3, 0 6" fill="#689f38"/>
      </marker>
    </defs>
    
    <path d="M 850 580 L 950 580" stroke="#689f38" stroke-width="2" marker-end="url(#arrow)"/>
    
    <!-- Reconstructed Matrix -->
    <text x="1030" y="510" font-size="14" font-weight="bold" text-anchor="middle" fill="#424242">R̂ (Predicted)</text>
    <rect x="960" y="530" width="140" height="140" rx="5" fill="white" stroke="#ff5722" stroke-width="2"/>
    
    <!-- Predicted values -->
    <g font-size="11" fill="#424242">
      <text x="980" y="555">5.0 <tspan fill="#ff5722">3.8</tspan> 4.1 1.0 <tspan fill="#ff5722">3.2</tspan></text>
      <text x="980" y="575">4.0 4.9 <tspan fill="#ff5722">3.5</tspan> 2.1 4.0</text>
      <text x="980" y="595"><tspan fill="#ff5722">3.7</tspan> 3.0 4.8 3.9 3.1</text>
      <text x="980" y="615">1.1 <tspan fill="#ff5722">2.5</tspan> 2.0 4.9 <tspan fill="#ff5722">4.2</tspan></text>
      <text x="980" y="635">3.0 3.9 <tspan fill="#ff5722">4.3</tspan> <tspan fill="#ff5722">3.6</tspan> 5.0</text>
    </g>
    
    <text x="1030" y="695" font-size="12" text-anchor="middle" fill="#ff5722">Red = Predicted Values</text>
    
    <!-- Latent Factors Explanation -->
    <rect x="870" y="695" width="280" height="50" rx="5" fill="#fff9c4" stroke="#f57f17" stroke-width="1"/>
    <text x="1010" y="715" font-size="12" text-anchor="middle" fill="#424242">Latent Factors represent hidden</text>
    <text x="1010" y="730" font-size="12" text-anchor="middle" fill="#424242">features (genre, mood, style)</text>
  </g>
</svg>