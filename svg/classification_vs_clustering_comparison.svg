<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="500" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">Classification vs Clustering</text>
  
  <!-- Dividing line -->
  <line x1="400" y1="50" x2="400" y2="480" stroke="#bdc3c7" stroke-width="2" stroke-dasharray="10,5"/>
  
  <!-- Classification Section (Left) -->
  <g id="classification">
    <rect x="20" y="60" width="360" height="400" fill="#ecf0f1" stroke="#34495e" stroke-width="1" rx="10"/>
    
    <!-- Section Title -->
    <text x="200" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2980b9">Classification (Supervised)</text>
    
    <!-- Labeled Training Data -->
    <text x="30" y="110" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#34495e">Training Data (with labels):</text>
    
    <!-- Lannister Family (Red) -->
    <g transform="translate(40, 120)">
      <circle cx="0" cy="0" r="6" fill="#e74c3c"/>
      <circle cx="15" cy="5" r="6" fill="#e74c3c"/>
      <circle cx="10" cy="-8" r="6" fill="#e74c3c"/>
      <text x="25" y="5" font-family="Arial, sans-serif" font-size="12" fill="#c0392b">Lannister</text>
    </g>
    
    <!-- Stark Family (Blue) -->
    <g transform="translate(40, 150)">
      <circle cx="0" cy="0" r="6" fill="#3498db"/>
      <circle cx="15" cy="5" r="6" fill="#3498db"/>
      <circle cx="10" cy="-8" r="6" fill="#3498db"/>
      <text x="25" y="5" font-family="Arial, sans-serif" font-size="12" fill="#2980b9">Stark</text>
    </g>
    
    <!-- Targaryen Family (Green) -->
    <g transform="translate(40, 180)">
      <circle cx="0" cy="0" r="6" fill="#27ae60"/>
      <circle cx="15" cy="5" r="6" fill="#27ae60"/>
      <circle cx="10" cy="-8" r="6" fill="#27ae60"/>
      <text x="25" y="5" font-family="Arial, sans-serif" font-size="12" fill="#229954">Targaryen</text>
    </g>
    
    <!-- Arrow -->
    <path d="M 180 220 L 180 240" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Model Training -->
    <rect x="130" y="250" width="140" height="40" fill="#3498db" rx="5"/>
    <text x="200" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Train Classifier</text>
    
    <!-- Arrow -->
    <path d="M 180 300 L 180 320" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- New Data -->
    <text x="30" y="340" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#34495e">New Data (predict labels):</text>
    <circle cx="50" cy="360" r="6" fill="#95a5a6"/>
    <circle cx="70" cy="365" r="6" fill="#95a5a6"/>
    <text x="85" y="365" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">Unknown artifacts</text>
    
    <!-- Arrow -->
    <path d="M 180 380 L 180 400" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Result -->
    <text x="30" y="420" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#34495e">Prediction:</text>
    <circle cx="50" cy="435" r="6" fill="#e74c3c"/>
    <text x="65" y="440" font-family="Arial, sans-serif" font-size="12" fill="#c0392b">Lannister</text>
    <circle cx="140" cy="435" r="6" fill="#27ae60"/>
    <text x="155" y="440" font-family="Arial, sans-serif" font-size="12" fill="#229954">Targaryen</text>
  </g>
  
  <!-- Clustering Section (Right) -->
  <g id="clustering">
    <rect x="420" y="60" width="360" height="400" fill="#ecf0f1" stroke="#34495e" stroke-width="1" rx="10"/>
    
    <!-- Section Title -->
    <text x="600" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#e74c3c">Clustering (Unsupervised)</text>
    
    <!-- Unlabeled Data -->
    <text x="430" y="110" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#34495e">Unlabeled Data:</text>
    
    <!-- Random scattered points -->
    <g transform="translate(440, 120)">
      <circle cx="10" cy="10" r="5" fill="#95a5a6"/>
      <circle cx="25" cy="15" r="5" fill="#95a5a6"/>
      <circle cx="15" cy="2" r="5" fill="#95a5a6"/>
      <circle cx="60" cy="30" r="5" fill="#95a5a6"/>
      <circle cx="75" cy="35" r="5" fill="#95a5a6"/>
      <circle cx="65" cy="22" r="5" fill="#95a5a6"/>
      <circle cx="100" cy="5" r="5" fill="#95a5a6"/>
      <circle cx="115" cy="10" r="5" fill="#95a5a6"/>
      <circle cx="105" cy="-3" r="5" fill="#95a5a6"/>
    </g>
    
    <!-- Arrow -->
    <path d="M 580 220 L 580 240" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Clustering Algorithm -->
    <rect x="530" y="250" width="140" height="40" fill="#e74c3c" rx="5"/>
    <text x="600" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Find Clusters</text>
    
    <!-- Arrow -->
    <path d="M 580 300 L 580 320" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Discovered Clusters -->
    <text x="430" y="340" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#34495e">Discovered Patterns:</text>
    
    <!-- Cluster 1 -->
    <g transform="translate(440, 350)">
      <ellipse cx="17" cy="12" rx="20" ry="15" fill="#e74c3c" opacity="0.3"/>
      <circle cx="10" cy="10" r="5" fill="#e74c3c"/>
      <circle cx="25" cy="15" r="5" fill="#e74c3c"/>
      <circle cx="15" cy="2" r="5" fill="#e74c3c"/>
      <text x="45" y="15" font-family="Arial, sans-serif" font-size="10" fill="#c0392b">Group 1</text>
    </g>
    
    <!-- Cluster 2 -->
    <g transform="translate(540, 350)">
      <ellipse cx="17" cy="12" rx="20" ry="15" fill="#3498db" opacity="0.3"/>
      <circle cx="10" cy="10" r="5" fill="#3498db"/>
      <circle cx="25" cy="15" r="5" fill="#3498db"/>
      <circle cx="15" cy="2" r="5" fill="#3498db"/>
      <text x="45" y="15" font-family="Arial, sans-serif" font-size="10" fill="#2980b9">Group 2</text>
    </g>
    
    <!-- Cluster 3 -->
    <g transform="translate(640, 350)">
      <ellipse cx="17" cy="12" rx="20" ry="15" fill="#27ae60" opacity="0.3"/>
      <circle cx="10" cy="10" r="5" fill="#27ae60"/>
      <circle cx="25" cy="15" r="5" fill="#27ae60"/>
      <circle cx="15" cy="2" r="5" fill="#27ae60"/>
      <text x="45" y="15" font-family="Arial, sans-serif" font-size="10" fill="#229954">Group 3</text>
    </g>
    
    <!-- Result Text -->
    <text x="430" y="420" font-family="Arial, sans-serif" font-size="12" fill="#34495e">Natural groupings discovered</text>
    <text x="430" y="435" font-family="Arial, sans-serif" font-size="12" fill="#34495e">without prior knowledge</text>
  </g>
  
  <!-- Key Differences Box -->
  <rect x="50" y="470" width="700" height="20" fill="#3498db" opacity="0.1"/>
  <text x="60" y="485" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Key Difference: Classification uses labeled examples to predict, Clustering discovers hidden patterns without labels</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e"/>
    </marker>
  </defs>
</svg>