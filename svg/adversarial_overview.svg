<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: bold; }
      .label-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: 600; }
      .desc-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; }
      .math-text { font-family: 'Times New Roman', serif; font-size: 14px; font-style: italic; }
      .gradient-bg { fill: url(#bgGradient); }
      .card { fill: white; stroke: #e0e0e0; stroke-width: 2; rx: 8; ry: 8; }
      .arrow { stroke: #2196F3; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .plus-sign { fill: #FF5722; stroke: #FF5722; stroke-width: 2; }
      .equals-sign { fill: #4CAF50; stroke: #4CAF50; stroke-width: 2; }
    </style>
    <defs>
      <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
      </linearGradient>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#2196F3" />
      </marker>
    </defs>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" class="gradient-bg"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title-text" fill="#1565C0">Adversarial Examples: The Invisible Attack</text>
  
  <!-- Original Image Card -->
  <rect x="50" y="70" width="120" height="140" class="card"/>
  <circle cx="110" cy="120" r="25" fill="#4CAF50" stroke="#388E3C" stroke-width="2"/>
  <circle cx="105" cy="115" r="8" fill="white"/>
  <circle cx="115" cy="115" r="8" fill="white"/>
  <circle cx="103" cy="113" r="3" fill="black"/>
  <circle cx="117" cy="113" r="3" fill="black"/>
  <path d="M95,135 Q110,145 125,135" stroke="#2E7D32" stroke-width="3" fill="none"/>
  <text x="110" y="180" text-anchor="middle" class="label-text" fill="#1B5E20">Original Image</text>
  <text x="110" y="195" text-anchor="middle" class="desc-text" fill="#4CAF50">✓ 99.7% Dog</text>

  <!-- Plus Sign -->
  <g class="plus-sign">
    <line x1="200" y1="140" x2="230" y2="140" stroke-width="4"/>
    <line x1="215" y1="125" x2="215" y2="155" stroke-width="4"/>
  </g>
  <text x="215" y="180" text-anchor="middle" class="desc-text" fill="#FF5722">Add</text>

  <!-- Perturbation Card -->
  <rect x="260" y="70" width="120" height="140" class="card"/>
  <g>
    <!-- Noise pattern -->
    <rect x="270" y="90" width="100" height="80" fill="#f0f0f0" stroke="#ccc"/>
    <circle cx="285" cy="105" r="1.5" fill="#FF5722" opacity="0.6"/>
    <circle cx="295" cy="110" r="1" fill="#2196F3" opacity="0.5"/>
    <circle cx="305" cy="100" r="1.5" fill="#FF9800" opacity="0.6"/>
    <circle cx="315" cy="115" r="1" fill="#9C27B0" opacity="0.5"/>
    <circle cx="325" cy="95" r="1.5" fill="#607D8B" opacity="0.6"/>
    <circle cx="335" cy="120" r="1" fill="#795548" opacity="0.5"/>
    <circle cx="345" cy="105" r="1.5" fill="#E91E63" opacity="0.6"/>
    <circle cx="355" cy="125" r="1" fill="#00BCD4" opacity="0.5"/>
    <circle cx="280" cy="130" r="1" fill="#CDDC39" opacity="0.5"/>
    <circle cx="290" cy="135" r="1.5" fill="#3F51B5" opacity="0.6"/>
    <circle cx="300" cy="140" r="1" fill="#FF5722" opacity="0.5"/>
    <circle cx="310" cy="145" r="1.5" fill="#009688" opacity="0.6"/>
    <circle cx="320" cy="150" r="1" fill="#8BC34A" opacity="0.5"/>
    <circle cx="330" cy="155" r="1.5" fill="#FFC107" opacity="0.6"/>
    <circle cx="340" cy="160" r="1" fill="#673AB7" opacity="0.5"/>
    <circle cx="350" cy="145" r="1.5" fill="#F44336" opacity="0.6"/>
  </g>
  <text x="320" y="180" text-anchor="middle" class="label-text" fill="#D32F2F">Noise Pattern</text>
  <text x="320" y="195" text-anchor="middle" class="desc-text" fill="#FF5722">Imperceptible to Human</text>

  <!-- Equals Sign -->
  <g class="equals-sign">
    <line x1="410" y1="135" x2="440" y2="135" stroke-width="4"/>
    <line x1="410" y1="145" x2="440" y2="145" stroke-width="4"/>
  </g>
  <text x="425" y="180" text-anchor="middle" class="desc-text" fill="#4CAF50">Results in</text>

  <!-- Adversarial Example Card -->
  <rect x="470" y="70" width="120" height="140" class="card"/>
  <!-- Dog with subtle overlay -->
  <circle cx="530" cy="120" r="25" fill="#4CAF50" stroke="#388E3C" stroke-width="2"/>
  <circle cx="525" cy="115" r="8" fill="white"/>
  <circle cx="535" cy="115" r="8" fill="white"/>
  <circle cx="523" cy="113" r="3" fill="black"/>
  <circle cx="537" cy="113" r="3" fill="black"/>
  <path d="M515,135 Q530,145 545,135" stroke="#2E7D32" stroke-width="3" fill="none"/>
  <!-- Subtle noise overlay -->
  <rect x="505" y="95" width="50" height="50" fill="url(#noisePattern)" opacity="0.1"/>
  <text x="530" y="180" text-anchor="middle" class="label-text" fill="#D32F2F">Adversarial Example</text>
  <text x="530" y="195" text-anchor="middle" class="desc-text" fill="#F44336">✗ 94.3% Ostrich</text>

  <!-- Arrow showing attack -->
  <path d="M600 140 Q650 100 700 140" class="arrow"/>
  <text x="650" y="120" text-anchor="middle" class="desc-text" fill="#2196F3">Neural Network</text>
  <text x="650" y="135" text-anchor="middle" class="desc-text" fill="#2196F3">Fooled!</text>

  <!-- Mathematical Formula -->
  <rect x="50" y="240" width="700" height="120" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1" rx="8"/>
  <text x="400" y="265" text-anchor="middle" class="label-text" fill="#495057">Mathematical Representation</text>
  
  <text x="150" y="290" class="math-text" fill="#212529">Original Image:</text>
  <text x="300" y="290" class="math-text" fill="#212529">X</text>
  
  <text x="150" y="315" class="math-text" fill="#212529">Perturbation:</text>
  <text x="300" y="315" class="math-text" fill="#212529">R (where ||R|| ≤ ε)</text>
  
  <text x="150" y="340" class="math-text" fill="#212529">Adversarial Example:</text>
  <text x="300" y="340" class="math-text" fill="#212529">X' = X + R</text>
  
  <text x="450" y="290" class="desc-text" fill="#6c757d">→ Classified as "Dog"</text>
  <text x="450" y="315" class="desc-text" fill="#6c757d">→ Minimal, imperceptible change</text>
  <text x="450" y="340" class="desc-text" fill="#6c757d">→ Classified as "Ostrich"</text>

  <!-- Key Insight Box -->
  <rect x="620" y="240" width="130" height="120" fill="#e3f2fd" stroke="#2196F3" stroke-width="2" rx="8"/>
  <text x="685" y="260" text-anchor="middle" class="label-text" fill="#1976D2">Key Insight</text>
  <text x="630" y="280" class="desc-text" fill="#1565C0">Deep networks learn</text>
  <text x="630" y="295" class="desc-text" fill="#1565C0">highly discontinuous</text>
  <text x="630" y="310" class="desc-text" fill="#1565C0">decision boundaries</text>
  <text x="630" y="330" class="desc-text" fill="#1565C0">that humans cannot</text>
  <text x="630" y="345" class="desc-text" fill="#1565C0">perceive or exploit</text>

  <!-- Noise Pattern Definition for reuse -->
  <defs>
    <pattern id="noisePattern" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.5" fill="#FF5722" opacity="0.3"/>
    </pattern>
  </defs>
</svg>