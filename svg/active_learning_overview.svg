<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="700" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="600" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Active Learning vs Passive Learning in Recommendation Systems
  </text>
  
  <!-- Passive Learning Section -->
  <g id="passive-learning">
    <rect x="50" y="80" width="500" height="280" fill="#fff" stroke="#2c3e50" stroke-width="2" rx="10"/>
    
    <text x="300" y="110" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#e74c3c">
      Passive Learning
    </text>
    
    <!-- Users -->
    <circle cx="120" cy="180" r="25" fill="#3498db" stroke="#2c3e50" stroke-width="2"/>
    <circle cx="200" cy="180" r="25" fill="#3498db" stroke="#2c3e50" stroke-width="2"/>
    <circle cx="280" cy="180" r="25" fill="#3498db" stroke="#2c3e50" stroke-width="2"/>
    <circle cx="360" cy="180" r="25" fill="#3498db" stroke="#2c3e50" stroke-width="2"/>
    <circle cx="440" cy="180" r="25" fill="#3498db" stroke="#2c3e50" stroke-width="2"/>
    
    <text x="300" y="230" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#555">
      Large User Group
    </text>
    
    <!-- Arrow down -->
    <path d="M 300 245 L 300 270" stroke="#2c3e50" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- Batch Processing Box -->
    <rect x="180" y="280" width="240" height="50" fill="#95a5a6" stroke="#2c3e50" stroke-width="2" rx="5"/>
    <text x="300" y="310" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">
      Collect All Feedback
    </text>
    
    <!-- Arrow down -->
    <path d="M 300 330 L 300 350" stroke="#2c3e50" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- Active Learning Section -->
  <g id="active-learning">
    <rect x="650" y="80" width="500" height="280" fill="#fff" stroke="#2c3e50" stroke-width="2" rx="10"/>
    
    <text x="900" y="110" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#27ae60">
      Active Learning
    </text>
    
    <!-- Key Users -->
    <circle cx="800" cy="180" r="30" fill="#2ecc71" stroke="#2c3e50" stroke-width="2"/>
    <circle cx="900" cy="180" r="30" fill="#2ecc71" stroke="#2c3e50" stroke-width="2"/>
    <circle cx="1000" cy="180" r="30" fill="#2ecc71" stroke="#2c3e50" stroke-width="2"/>
    
    <text x="900" y="230" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#555">
      Key Strategic Users
    </text>
    
    <!-- Arrow down -->
    <path d="M 900 245 L 900 270" stroke="#2c3e50" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- Real-time Processing Box -->
    <rect x="780" y="280" width="240" height="50" fill="#27ae60" stroke="#2c3e50" stroke-width="2" rx="5"/>
    <text x="900" y="310" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">
      Immediate Adaptation
    </text>
    
    <!-- Feedback loop arrow -->
    <path d="M 1020 305 Q 1080 305 1080 180 Q 1080 150 1030 150" stroke="#27ae60" stroke-width="3" fill="none" marker-end="url(#arrowhead-green)" stroke-dasharray="5,5"/>
    <text x="1100" y="240" font-family="Arial, sans-serif" font-size="12" fill="#27ae60">
      Real-time
    </text>
    <text x="1100" y="255" font-family="Arial, sans-serif" font-size="12" fill="#27ae60">
      Feedback
    </text>
  </g>
  
  <!-- Comparison Metrics -->
  <g id="comparison">
    <rect x="50" y="400" width="1100" height="260" fill="#fff" stroke="#2c3e50" stroke-width="2" rx="10"/>
    
    <text x="600" y="435" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Key Differences
    </text>
    
    <!-- Headers -->
    <text x="250" y="475" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Metric
    </text>
    <text x="500" y="475" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#e74c3c">
      Passive Learning
    </text>
    <text x="850" y="475" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#27ae60">
      Active Learning
    </text>
    
    <!-- Dividing lines -->
    <line x1="100" y1="485" x2="1100" y2="485" stroke="#bdc3c7" stroke-width="2"/>
    <line x1="375" y1="460" x2="375" y2="640" stroke="#bdc3c7" stroke-width="1"/>
    <line x1="675" y1="460" x2="675" y2="640" stroke="#bdc3c7" stroke-width="1"/>
    
    <!-- Row 1: Speed -->
    <text x="250" y="520" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#555">
      Speed
    </text>
    <text x="500" y="520" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#555">
      Slow (batch processing)
    </text>
    <text x="850" y="520" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#555">
      Fast (real-time)
    </text>
    
    <!-- Row 2: Efficiency -->
    <line x1="100" y1="535" x2="1100" y2="535" stroke="#ecf0f1" stroke-width="1"/>
    <text x="250" y="565" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#555">
      Efficiency
    </text>
    <text x="500" y="565" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#555">
      O(N) queries needed
    </text>
    <text x="850" y="565" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#555">
      O(log N) queries needed
    </text>
    
    <!-- Row 3: Adaptability -->
    <line x1="100" y1="580" x2="1100" y2="580" stroke="#ecf0f1" stroke-width="1"/>
    <text x="250" y="610" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#555">
      Adaptability
    </text>
    <text x="500" y="610" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#555">
      Fixed data collection
    </text>
    <text x="850" y="610" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#555">
      Dynamic adjustment
    </text>
    
    <!-- Row 4: Resource Use -->
    <line x1="100" y1="625" x2="1100" y2="625" stroke="#ecf0f1" stroke-width="1"/>
    <text x="250" y="650" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#555">
      Resource Use
    </text>
    <text x="500" y="650" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#555">
      High (many users)
    </text>
    <text x="850" y="650" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#555">
      Low (targeted users)
    </text>
  </g>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#2c3e50"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#27ae60"/>
    </marker>
  </defs>
</svg>