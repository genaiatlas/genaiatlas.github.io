<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="500" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">Neural Network Architecture for Regression</text>
  
  <!-- Input Layer -->
  <text x="100" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#34495e">Input Layer</text>
  
  <!-- Input neurons -->
  <circle cx="100" cy="120" r="25" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="100" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">X₁</text>
  
  <circle cx="100" cy="180" r="25" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="100" y="186" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">X₂</text>
  
  <circle cx="100" cy="240" r="25" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="100" y="246" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">X₃</text>
  
  <circle cx="100" cy="300" r="25" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="100" y="306" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">X₄</text>
  
  <!-- Hidden Layer 1 -->
  <text x="300" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#34495e">1st Hidden Layer</text>
  
  <!-- Hidden layer 1 neurons -->
  <circle cx="300" cy="140" r="25" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <text x="300" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">H₁</text>
  
  <circle cx="300" cy="200" r="25" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <text x="300" y="206" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">H₂</text>
  
  <circle cx="300" cy="260" r="25" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <text x="300" y="266" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">H₃</text>
  
  <!-- Hidden Layer 2 -->
  <text x="500" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#34495e">2nd Hidden Layer</text>
  
  <!-- Hidden layer 2 neurons -->
  <circle cx="500" cy="160" r="25" fill="#e67e22" stroke="#d35400" stroke-width="2"/>
  <text x="500" y="166" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">H₄</text>
  
  <circle cx="500" cy="240" r="25" fill="#e67e22" stroke="#d35400" stroke-width="2"/>
  <text x="500" y="246" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">H₅</text>
  
  <!-- Output Layer -->
  <text x="700" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#34495e">Output Layer</text>
  
  <!-- Output neuron -->
  <circle cx="700" cy="200" r="25" fill="#27ae60" stroke="#229954" stroke-width="2"/>
  <text x="700" y="206" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">ŷ</text>
  
  <!-- Connections from Input to Hidden Layer 1 -->
  <line x1="125" y1="120" x2="275" y2="140" stroke="#7f8c8d" stroke-width="1.5" opacity="0.7"/>
  <line x1="125" y1="120" x2="275" y2="200" stroke="#7f8c8d" stroke-width="1.5" opacity="0.7"/>
  <line x1="125" y1="120" x2="275" y2="260" stroke="#7f8c8d" stroke-width="1.5" opacity="0.7"/>
  
  <line x1="125" y1="180" x2="275" y2="140" stroke="#7f8c8d" stroke-width="1.5" opacity="0.7"/>
  <line x1="125" y1="180" x2="275" y2="200" stroke="#7f8c8d" stroke-width="1.5" opacity="0.7"/>
  <line x1="125" y1="180" x2="275" y2="260" stroke="#7f8c8d" stroke-width="1.5" opacity="0.7"/>
  
  <line x1="125" y1="240" x2="275" y2="140" stroke="#7f8c8d" stroke-width="1.5" opacity="0.7"/>
  <line x1="125" y1="240" x2="275" y2="200" stroke="#7f8c8d" stroke-width="1.5" opacity="0.7"/>
  <line x1="125" y1="240" x2="275" y2="260" stroke="#7f8c8d" stroke-width="1.5" opacity="0.7"/>
  
  <line x1="125" y1="300" x2="275" y2="140" stroke="#7f8c8d" stroke-width="1.5" opacity="0.7"/>
  <line x1="125" y1="300" x2="275" y2="200" stroke="#7f8c8d" stroke-width="1.5" opacity="0.7"/>
  <line x1="125" y1="300" x2="275" y2="260" stroke="#7f8c8d" stroke-width="1.5" opacity="0.7"/>
  
  <!-- Connections from Hidden Layer 1 to Hidden Layer 2 -->
  <line x1="325" y1="140" x2="475" y2="160" stroke="#7f8c8d" stroke-width="1.5" opacity="0.7"/>
  <line x1="325" y1="140" x2="475" y2="240" stroke="#7f8c8d" stroke-width="1.5" opacity="0.7"/>
  
  <line x1="325" y1="200" x2="475" y2="160" stroke="#7f8c8d" stroke-width="1.5" opacity="0.7"/>
  <line x1="325" y1="200" x2="475" y2="240" stroke="#7f8c8d" stroke-width="1.5" opacity="0.7"/>
  
  <line x1="325" y1="260" x2="475" y2="160" stroke="#7f8c8d" stroke-width="1.5" opacity="0.7"/>
  <line x1="325" y1="260" x2="475" y2="240" stroke="#7f8c8d" stroke-width="1.5" opacity="0.7"/>
  
  <!-- Connections from Hidden Layer 2 to Output -->
  <line x1="525" y1="160" x2="675" y2="200" stroke="#7f8c8d" stroke-width="1.5" opacity="0.7"/>
  <line x1="525" y1="240" x2="675" y2="200" stroke="#7f8c8d" stroke-width="1.5" opacity="0.7"/>
  
  <!-- Bias nodes -->
  <circle cx="100" cy="360" r="20" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
  <text x="100" y="366" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">b₁</text>
  
  <circle cx="300" cy="320" r="20" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
  <text x="300" y="326" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">b₂</text>
  
  <circle cx="500" cy="300" r="20" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
  <text x="500" y="306" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">b₃</text>
  
  <!-- Bias connections -->
  <line x1="120" y1="360" x2="275" y2="140" stroke="#9b59b6" stroke-width="1.5" opacity="0.7"/>
  <line x1="120" y1="360" x2="275" y2="200" stroke="#9b59b6" stroke-width="1.5" opacity="0.7"/>
  <line x1="120" y1="360" x2="275" y2="260" stroke="#9b59b6" stroke-width="1.5" opacity="0.7"/>
  
  <line x1="320" y1="320" x2="475" y2="160" stroke="#9b59b6" stroke-width="1.5" opacity="0.7"/>
  <line x1="320" y1="320" x2="475" y2="240" stroke="#9b59b6" stroke-width="1.5" opacity="0.7"/>
  
  <line x1="520" y1="300" x2="675" y2="200" stroke="#9b59b6" stroke-width="1.5" opacity="0.7"/>
  
  <!-- Mathematical notation -->
  <text x="200" y="400" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Z = Σ(WᵢXᵢ) + b</text>
  <text x="400" y="400" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Output = σ(Z)</text>
  
  <!-- Legend -->
  <rect x="50" y="420" width="700" height="60" fill="none" stroke="#bdc3c7" stroke-width="1"/>
  <text x="400" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Legend</text>
  
  <circle cx="100" cy="455" r="8" fill="#3498db"/>
  <text x="120" y="460" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Input Layer</text>
  
  <circle cx="220" cy="455" r="8" fill="#e74c3c"/>
  <text x="240" y="460" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Hidden Layer 1</text>
  
  <circle cx="360" cy="455" r="8" fill="#e67e22"/>
  <text x="380" y="460" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Hidden Layer 2</text>
  
  <circle cx="520" cy="455" r="8" fill="#27ae60"/>
  <text x="540" y="460" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Output Layer</text>
  
  <circle cx="640" cy="455" r="8" fill="#9b59b6"/>
  <text x="660" y="460" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Bias Nodes</text>
</svg>