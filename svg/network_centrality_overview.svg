<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="600" y="35" font-size="24" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Network Centrality Measures Overview
  </text>
  
  <!-- Small Network Visualization (Left) -->
  <g id="small-network">
    <text x="200" y="80" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Small Network (Visual Analysis)
    </text>
    
    <!-- Hub node (center) -->
    <circle cx="200" cy="200" r="20" fill="#ffd700" stroke="#000" stroke-width="3"/>
    <text x="200" y="207" font-size="14" font-weight="bold" text-anchor="middle" fill="#000">Hub</text>
    
    <!-- Surrounding nodes -->
    <circle cx="120" cy="150" r="12" fill="#e0e0e0" stroke="#000" stroke-width="2"/>
    <circle cx="280" cy="150" r="12" fill="#e0e0e0" stroke="#000" stroke-width="2"/>
    <circle cx="120" cy="250" r="12" fill="#e0e0e0" stroke="#000" stroke-width="2"/>
    <circle cx="280" cy="250" r="12" fill="#e0e0e0" stroke="#000" stroke-width="2"/>
    <circle cx="150" cy="300" r="12" fill="#e0e0e0" stroke="#000" stroke-width="2"/>
    <circle cx="250" cy="300" r="12" fill="#e0e0e0" stroke="#000" stroke-width="2"/>
    
    <!-- Edges -->
    <line x1="120" y1="150" x2="187" y2="186" stroke="#666" stroke-width="2"/>
    <line x1="280" y1="150" x2="213" y2="186" stroke="#666" stroke-width="2"/>
    <line x1="120" y1="250" x2="187" y2="214" stroke="#666" stroke-width="2"/>
    <line x1="280" y1="250" x2="213" y2="214" stroke="#666" stroke-width="2"/>
    <line x1="150" y1="300" x2="187" y2="217" stroke="#666" stroke-width="2"/>
    <line x1="250" y1="300" x2="213" y2="217" stroke="#666" stroke-width="2"/>
    
    <!-- Cluster -->
    <circle cx="300" cy="150" r="15" fill="#ff6b6b" stroke="#000" stroke-width="2"/>
    <circle cx="340" cy="130" r="15" fill="#ff6b6b" stroke="#000" stroke-width="2"/>
    <circle cx="360" cy="170" r="15" fill="#ff6b6b" stroke="#000" stroke-width="2"/>
    <circle cx="320" cy="190" r="15" fill="#ff6b6b" stroke="#000" stroke-width="2"/>
    
    <line x1="300" y1="150" x2="340" y2="130" stroke="#cc0000" stroke-width="2"/>
    <line x1="340" y1="130" x2="360" y2="170" stroke="#cc0000" stroke-width="2"/>
    <line x1="360" y1="170" x2="320" y2="190" stroke="#cc0000" stroke-width="2"/>
    <line x1="320" y1="190" x2="300" y2="150" stroke="#cc0000" stroke-width="2"/>
    <line x1="300" y1="150" x2="360" y2="170" stroke="#cc0000" stroke-width="2"/>
    
    <text x="200" y="350" font-size="13" text-anchor="middle" fill="#555">
      ✓ Easy to spot patterns
    </text>
    <text x="200" y="370" font-size="13" text-anchor="middle" fill="#555">
      ✓ Hubs &amp; clusters visible
    </text>
  </g>
  
  <!-- Large Network Visualization (Right) -->
  <g id="large-network">
    <text x="750" y="80" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Large Network (Computational Analysis)
    </text>
    
    <!-- Hairball representation -->
    <circle cx="750" cy="200" r="110" fill="none" stroke="#999" stroke-width="1" opacity="0.3"/>
    
    <!-- Many small nodes in circular pattern -->
    <g id="hairball">
      <!-- Generate many interconnected nodes -->
      <circle cx="700" cy="150" r="4" fill="#666"/>
      <circle cx="720" cy="140" r="4" fill="#666"/>
      <circle cx="740" cy="145" r="4" fill="#666"/>
      <circle cx="760" cy="150" r="4" fill="#666"/>
      <circle cx="780" cy="160" r="4" fill="#666"/>
      <circle cx="795" cy="175" r="4" fill="#666"/>
      <circle cx="805" cy="195" r="4" fill="#666"/>
      <circle cx="810" cy="215" r="4" fill="#666"/>
      <circle cx="805" cy="235" r="4" fill="#666"/>
      <circle cx="795" cy="250" r="4" fill="#666"/>
      <circle cx="780" cy="265" r="4" fill="#666"/>
      <circle cx="760" cy="275" r="4" fill="#666"/>
      <circle cx="740" cy="280" r="4" fill="#666"/>
      <circle cx="720" cy="275" r="4" fill="#666"/>
      <circle cx="700" cy="265" r="4" fill="#666"/>
      <circle cx="685" cy="250" r="4" fill="#666"/>
      <circle cx="675" cy="230" r="4" fill="#666"/>
      <circle cx="670" cy="210" r="4" fill="#666"/>
      <circle cx="675" cy="190" r="4" fill="#666"/>
      <circle cx="685" cy="170" r="4" fill="#666"/>
      
      <!-- Inner circle nodes -->
      <circle cx="720" cy="180" r="4" fill="#666"/>
      <circle cx="750" cy="175" r="4" fill="#666"/>
      <circle cx="780" cy="185" r="4" fill="#666"/>
      <circle cx="785" cy="210" r="4" fill="#666"/>
      <circle cx="775" cy="235" r="4" fill="#666"/>
      <circle cx="750" cy="245" r="4" fill="#666"/>
      <circle cx="720" cy="240" r="4" fill="#666"/>
      <circle cx="710" cy="215" r="4" fill="#666"/>
      <circle cx="715" cy="190" r="4" fill="#666"/>
      <circle cx="740" cy="205" r="4" fill="#666"/>
      <circle cx="760" cy="210" r="4" fill="#666"/>
      
      <!-- Many crossing lines -->
      <line x1="700" y1="150" x2="780" y2="265" stroke="#999" stroke-width="0.5" opacity="0.3"/>
      <line x1="720" y1="140" x2="805" y2="235" stroke="#999" stroke-width="0.5" opacity="0.3"/>
      <line x1="760" y1="150" x2="675" y2="230" stroke="#999" stroke-width="0.5" opacity="0.3"/>
      <line x1="795" y1="175" x2="685" y2="250" stroke="#999" stroke-width="0.5" opacity="0.3"/>
      <line x1="810" y1="215" x2="670" y2="210" stroke="#999" stroke-width="0.5" opacity="0.3"/>
      <line x1="805" y1="195" x2="720" y2="275" stroke="#999" stroke-width="0.5" opacity="0.3"/>
      <line x1="740" y1="145" x2="750" y2="245" stroke="#999" stroke-width="0.5" opacity="0.3"/>
      <line x1="780" y1="160" x2="700" y2="265" stroke="#999" stroke-width="0.5" opacity="0.3"/>
      <line x1="720" y1="180" x2="785" y2="210" stroke="#999" stroke-width="0.5" opacity="0.3"/>
      <line x1="750" y1="175" x2="720" y2="240" stroke="#999" stroke-width="0.5" opacity="0.3"/>
      <line x1="780" y1="185" x2="710" y2="215" stroke="#999" stroke-width="0.5" opacity="0.3"/>
      <line x1="740" y1="205" x2="795" y2="250" stroke="#999" stroke-width="0.5" opacity="0.3"/>
    </g>
    
    <text x="750" y="340" font-size="14" font-weight="bold" text-anchor="middle" fill="#d32f2f">
      "Hairball Problem"
    </text>
    <text x="750" y="360" font-size="13" text-anchor="middle" fill="#555">
      ✗ Visualization fails
    </text>
    <text x="750" y="380" font-size="13" text-anchor="middle" fill="#555">
      ✓ Need computational methods
    </text>
  </g>
  
  <!-- Computational Solution Box -->
  <g id="solution">
    <rect x="100" y="420" width="1000" height="150" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="10"/>
    
    <text x="600" y="450" font-size="18" font-weight="bold" text-anchor="middle" fill="#1565c0">
      Computational Centrality Measures
    </text>
    
    <!-- Three measures -->
    <g id="degree">
      <rect x="150" y="470" width="250" height="80" fill="#fff" stroke="#4caf50" stroke-width="2" rx="5"/>
      <text x="275" y="495" font-size="15" font-weight="bold" text-anchor="middle" fill="#2e7d32">
        Degree Centrality
      </text>
      <text x="275" y="515" font-size="12" text-anchor="middle" fill="#555">
        # of connections
      </text>
      <text x="275" y="535" font-size="11" text-anchor="middle" fill="#777" font-style="italic">
        Degree(i) = Σⱼ Aᵢⱼ
      </text>
    </g>
    
    <g id="eigenvector">
      <rect x="475" y="470" width="250" height="80" fill="#fff" stroke="#ff9800" stroke-width="2" rx="5"/>
      <text x="600" y="495" font-size="15" font-weight="bold" text-anchor="middle" fill="#e65100">
        Eigenvector Centrality
      </text>
      <text x="600" y="515" font-size="12" text-anchor="middle" fill="#555">
        Quality of connections
      </text>
      <text x="600" y="535" font-size="11" text-anchor="middle" fill="#777" font-style="italic">
        A × x = λ × x
      </text>
    </g>
    
    <g id="pagerank">
      <rect x="800" y="470" width="250" height="80" fill="#fff" stroke="#9c27b0" stroke-width="2" rx="5"/>
      <text x="925" y="495" font-size="15" font-weight="bold" text-anchor="middle" fill="#6a1b9a">
        PageRank
      </text>
      <text x="925" y="515" font-size="12" text-anchor="middle" fill="#555">
        Normalized importance
      </text>
      <text x="925" y="535" font-size="11" text-anchor="middle" fill="#777" font-style="italic">
        PR = (1-d)/N + d·Σ(PR/L)
      </text>
    </g>
  </g>
</svg>