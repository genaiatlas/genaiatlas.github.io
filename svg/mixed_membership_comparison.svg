<svg viewBox="0 0 900 650" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="900" height="650" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">Mixed Membership vs Traditional Clustering</text>
  
  <!-- Traditional Clustering Section -->
  <rect x="50" y="60" width="380" height="280" fill="#ffe6e6" stroke="#e74c3c" stroke-width="2" rx="5"/>
  <text x="240" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#c0392b">Traditional Clustering (K-Means)</text>
  <text x="240" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#e74c3c">Exclusive Membership - Each point belongs to exactly one cluster</text>
  
  <!-- Pet images representation -->
  <g>
    <!-- Cat cluster -->
    <circle cx="130" cy="150" r="35" fill="#f39c12" opacity="0.3" stroke="#f39c12" stroke-width="2"/>
    <text x="130" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#d68910">CAT Cluster</text>
    <!-- Cat images -->
    <rect x="115" y="135" width="12" height="12" fill="#e67e22" rx="2"/>
    <rect x="130" y="140" width="12" height="12" fill="#e67e22" rx="2"/>
    <rect x="123" y="155" width="12" height="12" fill="#e67e22" rx="2"/>
    <rect x="135" y="160" width="12" height="12" fill="#e67e22" rx="2"/>
    <text x="130" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#d68910">Only cats</text>
    
    <!-- Dog cluster -->
    <circle cx="240" cy="150" r="35" fill="#3498db" opacity="0.3" stroke="#3498db" stroke-width="2"/>
    <text x="240" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2980b9">DOG Cluster</text>
    <!-- Dog images -->
    <rect x="225" y="135" width="12" height="12" fill="#2980b9" rx="2"/>
    <rect x="240" y="140" width="12" height="12" fill="#2980b9" rx="2"/>
    <rect x="233" y="155" width="12" height="12" fill="#2980b9" rx="2"/>
    <rect x="245" y="160" width="12" height="12" fill="#2980b9" rx="2"/>
    <text x="240" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2980b9">Only dogs</text>
    
    <!-- Lizard cluster -->
    <circle cx="350" cy="150" r="35" fill="#27ae60" opacity="0.3" stroke="#27ae60" stroke-width="2"/>
    <text x="350" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#229954">LIZARD Cluster</text>
    <!-- Lizard images -->
    <rect x="335" y="135" width="12" height="12" fill="#229954" rx="2"/>
    <rect x="350" y="140" width="12" height="12" fill="#229954" rx="2"/>
    <rect x="343" y="155" width="12" height="12" fill="#229954" rx="2"/>
    <rect x="355" y="160" width="12" height="12" fill="#229954" rx="2"/>
    <text x="350" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#229954">Only lizards</text>
  </g>
  
  <!-- Problem images -->
  <text x="240" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#c0392b">Problems:</text>
  
  <!-- Mixed image (cat + dog) -->
  <rect x="120" y="240" width="40" height="30" fill="#95a5a6" stroke="#7f8c8d" stroke-width="2" rx="3"/>
  <rect x="125" y="245" width="15" height="10" fill="#e67e22" rx="1"/>
  <rect x="145" y="245" width="15" height="10" fill="#2980b9" rx="1"/>
  <text x="140" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Cat + Dog</text>
  <text x="140" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#e74c3c">Forced into one cluster!</text>
  
  <!-- Empty image -->
  <rect x="240" y="240" width="40" height="30" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2" rx="3"/>
  <text x="260" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">No animals</text>
  <text x="260" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#e74c3c">Still needs a cluster!</text>
  
  <!-- Constraint equation -->
  <text x="240" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#c0392b">Constraint: Σₖ zᵢₖ = 1 for all i</text>
  
  <!-- Mixed Membership Section -->
  <rect x="470" y="60" width="380" height="280" fill="#e6f7ff" stroke="#3498db" stroke-width="2" rx="5"/>
  <text x="660" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2980b9">Mixed Membership (Feature Allocation)</text>
  <text x="660" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#3498db">Flexible Membership - Points can belong to multiple/no features</text>
  
  <!-- Feature representation -->
  <g>
    <!-- Cat feature -->
    <rect x="520" y="120" width="60" height="40" fill="#f39c12" opacity="0.3" stroke="#f39c12" stroke-width="2" rx="5"/>
    <text x="550" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#d68910">CAT Feature</text>
    <text x="550" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#d68910">Images with cats</text>
    
    <!-- Dog feature -->
    <rect x="600" y="120" width="60" height="40" fill="#3498db" opacity="0.3" stroke="#3498db" stroke-width="2" rx="5"/>
    <text x="630" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2980b9">DOG Feature</text>
    <text x="630" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2980b9">Images with dogs</text>
    
    <!-- Lizard feature -->
    <rect x="680" y="120" width="60" height="40" fill="#27ae60" opacity="0.3" stroke="#27ae60" stroke-width="2" rx="5"/>
    <text x="710" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#229954">LIZARD Feature</text>
    <text x="710" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#229954">Images with lizards</text>
  </g>
  
  <!-- Example assignments -->
  <text x="660" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2980b9">Flexible Assignments:</text>
  
  <!-- Cat only -->
  <rect x="500" y="210" width="25" height="20" fill="#95a5a6" stroke="#7f8c8d" stroke-width="1" rx="2"/>
  <rect x="503" y="213" width="19" height="14" fill="#e67e22" rx="1"/>
  <text x="512" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">Cat only</text>
  <text x="512" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#27ae60">[1,0,0]</text>
  
  <!-- Cat + Dog -->
  <rect x="570" y="210" width="25" height="20" fill="#95a5a6" stroke="#7f8c8d" stroke-width="1" rx="2"/>
  <rect x="573" y="213" width="9" height="14" fill="#e67e22" rx="1"/>
  <rect x="583" y="213" width="9" height="14" fill="#2980b9" rx="1"/>
  <text x="582" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">Cat + Dog</text>
  <text x="582" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#27ae60">[1,1,0]</text>
  
  <!-- Dog only -->
  <rect x="640" y="210" width="25" height="20" fill="#95a5a6" stroke="#7f8c8d" stroke-width="1" rx="2"/>
  <rect x="643" y="213" width="19" height="14" fill="#2980b9" rx="1"/>
  <text x="652" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">Dog only</text>
  <text x="652" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#27ae60">[0,1,0]</text>
  
  <!-- Lizard only -->
  <rect x="710" y="210" width="25" height="20" fill="#95a5a6" stroke="#7f8c8d" stroke-width="1" rx="2"/>
  <rect x="713" y="213" width="19" height="14" fill="#229954" rx="1"/>
  <text x="722" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">Lizard only</text>
  <text x="722" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#27ae60">[0,0,1]</text>
  
  <!-- No animals -->
  <rect x="780" y="210" width="25" height="20" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" rx="2"/>
  <text x="792" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">No animals</text>
  <text x="792" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#27ae60">[0,0,0]</text>
  
  <!-- Constraint equation -->
  <text x="660" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2980b9">Constraint: zᵢₖ ∈ {0,1}, no sum constraint</text>
  <text x="660" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">Each feature can be present (1) or absent (0) independently</text>
  
  <!-- Comparison Table -->
  <rect x="50" y="370" width="800" height="230" fill="#f5f5f5" stroke="#95a5a6" stroke-width="2" rx="5"/>
  <text x="450" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Detailed Comparison</text>
  
  <!-- Table headers -->
  <rect x="80" y="410" width="120" height="30" fill="#34495e"/>
  <text x="140" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Aspect</text>
  
  <rect x="200" y="410" width="150" height="30" fill="#e74c3c"/>
  <text x="275" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Traditional Clustering</text>
  
  <rect x="350" y="410" width="150" height="30" fill="#3498db"/>
  <text x="425" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Mixed Membership</text>
  
  <rect x="500" y="410" width="150" height="30" fill="#27ae60"/>
  <text x="575" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Real-World Examples</text>
  
  <rect x="650" y="410" width="170" height="30" fill="#9b59b6"/>
  <text x="735" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Algorithms</text>
  
  <!-- Table rows -->
  <g font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
    <!-- Row 1: Membership -->
    <rect x="80" y="440" width="740" height="25" fill="#ecf0f1" opacity="0.5"/>
    <text x="85" y="455" font-weight="bold">Membership</text>
    <text x="205" y="455">Exclusive (one cluster)</text>
    <text x="355" y="455">Multiple/None allowed</text>
    <text x="505" y="455">Medical diagnosis</text>
    <text x="655" y="455">K-Means vs LDA</text>
    
    <!-- Row 2: Matrix constraint -->
    <text x="85" y="480" font-weight="bold">Matrix Constraint</text>
    <text x="205" y="480">Σₖ zᵢₖ = 1</text>
    <text x="355" y="480">zᵢₖ ∈ {0,1}</text>
    <text x="505" y="480">Document topics</text>
    <text x="655" y="480">Mixture vs Admixture</text>
    
    <!-- Row 3: Ambiguous cases -->
    <rect x="80" y="490" width="740" height="25" fill="#ecf0f1" opacity="0.5"/>
    <text x="85" y="505" font-weight="bold">Ambiguous Cases</text>
    <text x="205" y="505">Forced assignment</text>
    <text x="355" y="505">Natural handling</text>
    <text x="505" y="505">Genetic admixture</text>
    <text x="655" y="505">Hard vs Soft clustering</text>
    
    <!-- Row 4: Interpretability -->
    <text x="85" y="530" font-weight="bold">Interpretability</text>
    <text x="205" y="530">Simple clusters</text>
    <text x="355" y="530">Rich feature sets</text>
    <text x="505" y="530">Social identities</text>
    <text x="655" y="530">Centroid vs Topic models</text>
    
    <!-- Row 5: Use cases -->
    <rect x="80" y="540" width="740" height="25" fill="#ecf0f1" opacity="0.5"/>
    <text x="85" y="555" font-weight="bold">Best Use Cases</text>
    <text x="205" y="555">Clear separation</text>
    <text x="355" y="555">Overlapping categories</text>
    <text x="505" y="555">Multi-label problems</text>
    <text x="655" y="555">K-Means vs IBP/LDA</text>
  </g>
  
  <!-- Key insight -->
  <rect x="200" y="580" width="500" height="50" fill="#fff3cd" stroke="#f39c12" stroke-width="2" rx="5"/>
  <text x="450" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f39c12">Key Insight</text>
  <text x="450" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Mixed membership better reflects real-world complexity where entities have multiple characteristics</text>
</svg>