<svg viewBox="0 0 800 650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'Arial', sans-serif; font-size: 24px; font-weight: bold; fill: #2c3e50; }
      .step-title { font-family: 'Arial', sans-serif; font-size: 13px; font-weight: bold; fill: white; }
      .step-desc { font-family: 'Arial', sans-serif; font-size: 10px; fill: white; }
      .section-title { font-family: 'Arial', sans-serif; font-size: 16px; font-weight: bold; fill: #2c3e50; }
      .arrow { stroke: #34495e; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .feedback-arrow { stroke: #e74c3c; stroke-width: 2; fill: none; marker-end: url(#arrowhead-red); stroke-dasharray: 5,5; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e" />
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" class="title">Machine Learning Modeling Process</text>
  
  <!-- Algorithm Selection -->
  <rect x="50" y="80" width="140" height="80" rx="10" fill="#3498db"/>
  <text x="120" y="105" text-anchor="middle" class="step-title">Algorithm Selection</text>
  <text x="120" y="125" text-anchor="middle" class="step-desc">• Problem type analysis</text>
  <text x="120" y="138" text-anchor="middle" class="step-desc">• Data characteristics</text>
  <text x="120" y="151" text-anchor="middle" class="step-desc">• Performance requirements</text>
  
  <!-- Model Training -->
  <rect x="250" y="80" width="140" height="80" rx="10" fill="#2ecc71"/>
  <text x="320" y="105" text-anchor="middle" class="step-title">Model Training</text>
  <text x="320" y="125" text-anchor="middle" class="step-desc">• Fit model to training data</text>
  <text x="320" y="138" text-anchor="middle" class="step-desc">• Learn patterns</text>
  <text x="320" y="151" text-anchor="middle" class="step-desc">• Update parameters</text>
  
  <!-- Hyperparameter Tuning -->
  <rect x="450" y="80" width="140" height="80" rx="10" fill="#f39c12"/>
  <text x="520" y="105" text-anchor="middle" class="step-title">Hyperparameter</text>
  <text x="520" y="120" text-anchor="middle" class="step-title">Tuning</text>
  <text x="520" y="140" text-anchor="middle" class="step-desc">• Grid/Random search</text>
  <text x="520" y="153" text-anchor="middle" class="step-desc">• Cross-validation</text>
  
  <!-- Model Evaluation -->
  <rect x="610" y="80" width="140" height="80" rx="10" fill="#9b59b6"/>
  <text x="680" y="105" text-anchor="middle" class="step-title">Model Evaluation</text>
  <text x="680" y="125" text-anchor="middle" class="step-desc">• Performance metrics</text>
  <text x="680" y="138" text-anchor="middle" class="step-desc">• Validation testing</text>
  <text x="680" y="151" text-anchor="middle" class="step-desc">• Error analysis</text>
  
  <!-- Flow Arrows -->
  <path d="M 190 120 L 240 120" class="arrow"/>
  <path d="M 390 120 L 440 120" class="arrow"/>
  <path d="M 590 120 L 600 120" class="arrow"/>
  
  <!-- Feedback Arrows -->
  <path d="M 610 100 L 600 100 Q 520 60 320 60 Q 120 60 120 80" class="feedback-arrow"/>
  <path d="M 450 100 L 400 100" class="feedback-arrow"/>
  
  <!-- Algorithm Categories -->
  <text x="50" y="220" class="section-title">Algorithm Categories</text>
  
  <!-- Supervised Learning -->
  <rect x="50" y="240" width="180" height="120" rx="8" fill="#ecf0f1" stroke="#bdc3c7"/>
  <text x="140" y="260" text-anchor="middle" style="font-family: Arial; font-size: 14px; font-weight: bold; fill: #2c3e50;">Supervised Learning</text>
  
  <!-- Classification -->
  <rect x="60" y="275" width="75" height="75" rx="5" fill="#3498db"/>
  <text x="97" y="295" text-anchor="middle" style="font-family: Arial; font-size: 11px; font-weight: bold; fill: white;">Classification</text>
  <text x="97" y="310" text-anchor="middle" style="font-family: Arial; font-size: 9px; fill: white;">• Logistic Regression</text>
  <text x="97" y="322" text-anchor="middle" style="font-family: Arial; font-size: 9px; fill: white;">• Random Forest</text>
  <text x="97" y="334" text-anchor="middle" style="font-family: Arial; font-size: 9px; fill: white;">• SVM</text>
  <text x="97" y="346" text-anchor="middle" style="font-family: Arial; font-size: 9px; fill: white;">• Neural Networks</text>
  
  <!-- Regression -->
  <rect x="145" y="275" width="75" height="75" rx="5" fill="#2ecc71"/>
  <text x="182" y="295" text-anchor="middle" style="font-family: Arial; font-size: 11px; font-weight: bold; fill: white;">Regression</text>
  <text x="182" y="310" text-anchor="middle" style="font-family: Arial; font-size: 9px; fill: white;">• Linear Regression</text>
  <text x="182" y="322" text-anchor="middle" style="font-family: Arial; font-size: 9px; fill: white;">• Ridge/Lasso</text>
  <text x="182" y="334" text-anchor="middle" style="font-family: Arial; font-size: 9px; fill: white;">• Gradient Boosting</text>
  <text x="182" y="346" text-anchor="middle" style="font-family: Arial; font-size: 9px; fill: white;">• Deep Learning</text>
  
  <!-- Unsupervised Learning -->
  <rect x="270" y="240" width="180" height="120" rx="8" fill="#ecf0f1" stroke="#bdc3c7"/>
  <text x="360" y="260" text-anchor="middle" style="font-family: Arial; font-size: 14px; font-weight: bold; fill: #2c3e50;">Unsupervised Learning</text>
  
  <!-- Clustering -->
  <rect x="280" y="275" width="75" height="75" rx="5" fill="#f39c12"/>
  <text x="317" y="295" text-anchor="middle" style="font-family: Arial; font-size: 11px; font-weight: bold; fill: white;">Clustering</text>
  <text x="317" y="310" text-anchor="middle" style="font-family: Arial; font-size: 9px; fill: white;">• K-Means</text>
  <text x="317" y="322" text-anchor="middle" style="font-family: Arial; font-size: 9px; fill: white;">• Hierarchical</text>
  <text x="317" y="334" text-anchor="middle" style="font-family: Arial; font-size: 9px; fill: white;">• DBSCAN</text>
  <text x="317" y="346" text-anchor="middle" style="font-family: Arial; font-size: 9px; fill: white;">• Gaussian Mixture</text>
  
  <!-- Dimensionality Reduction -->
  <rect x="365" y="275" width="75" height="75" rx="5" fill="#9b59b6"/>
  <text x="402" y="290" text-anchor="middle" style="font-family: Arial; font-size: 10px; font-weight: bold; fill: white;">Dimensionality</text>
  <text x="402" y="302" text-anchor="middle" style="font-family: Arial; font-size: 10px; font-weight: bold; fill: white;">Reduction</text>
  <text x="402" y="318" text-anchor="middle" style="font-family: Arial; font-size: 9px; fill: white;">• PCA</text>
  <text x="402" y="330" text-anchor="middle" style="font-family: Arial; font-size: 9px; fill: white;">• t-SNE</text>
  <text x="402" y="342" text-anchor="middle" style="font-family: Arial; font-size: 9px; fill: white;">• UMAP</text>
  
  <!-- Reinforcement Learning -->
  <rect x="490" y="240" width="120" height="120" rx="8" fill="#ecf0f1" stroke="#bdc3c7"/>
  <text x="550" y="260" text-anchor="middle" style="font-family: Arial; font-size: 14px; font-weight: bold; fill: #2c3e50;">Reinforcement Learning</text>
  
  <rect x="500" y="275" width="100" height="75" rx="5" fill="#e74c3c"/>
  <text x="550" y="295" text-anchor="middle" style="font-family: Arial; font-size: 11px; font-weight: bold; fill: white;">Agent-Environment</text>
  <text x="550" y="310" text-anchor="middle" style="font-family: Arial; font-size: 9px; fill: white;">• Q-Learning</text>
  <text x="550" y="322" text-anchor="middle" style="font-family: Arial; font-size: 9px; fill: white;">• Policy Gradient</text>
  <text x="550" y="334" text-anchor="middle" style="font-family: Arial; font-size: 9px; fill: white;">• Actor-Critic</text>
  <text x="550" y="346" text-anchor="middle" style="font-family: Arial; font-size: 9px; fill: white;">• Deep RL</text>
  
  <!-- Model Selection Criteria -->
  <text x="50" y="400" class="section-title">Model Selection Criteria</text>
  
  <!-- Criteria boxes -->
  <rect x="50" y="420" width="140" height="60" rx="5" fill="#ecf0f1" stroke="#bdc3c7"/>
  <text x="120" y="440" text-anchor="middle" style="font-family: Arial; font-size: 12px; font-weight: bold; fill: #2c3e50;">Data Size</text>
  <text x="120" y="455" text-anchor="middle" style="font-family: Arial; font-size: 10px; fill: #7f8c8d;">Small: Simple models</text>
  <text x="120" y="468" text-anchor="middle" style="font-family: Arial; font-size: 10px; fill: #7f8c8d;">Large: Complex models</text>
  
  <rect x="210" y="420" width="140" height="60" rx="5" fill="#ecf0f1" stroke="#bdc3c7"/>
  <text x="280" y="440" text-anchor="middle" style="font-family: Arial; font-size: 12px; font-weight: bold; fill: #2c3e50;">Interpretability</text>
  <text x="280" y="455" text-anchor="middle" style="font-family: Arial; font-size: 10px; fill: #7f8c8d;">High: Linear, Trees</text>
  <text x="280" y="468" text-anchor="middle" style="font-family: Arial; font-size: 10px; fill: #7f8c8d;">Low: Ensembles, Neural</text>
  
  <rect x="370" y="420" width="140" height="60" rx="5" fill="#ecf0f1" stroke="#bdc3c7"/>
  <text x="440" y="440" text-anchor="middle" style="font-family: Arial; font-size: 12px; font-weight: bold; fill: #2c3e50;">Performance</text>
  <text x="440" y="455" text-anchor="middle" style="font-family: Arial; font-size: 10px; fill: #7f8c8d;">Speed vs Accuracy</text>
  <text x="440" y="468" text-anchor="middle" style="font-family: Arial; font-size: 10px; fill: #7f8c8d;">Resource constraints</text>
  
  <rect x="530" y="420" width="140" height="60" rx="5" fill="#ecf0f1" stroke="#bdc3c7"/>
  <text x="600" y="440" text-anchor="middle" style="font-family: Arial; font-size: 12px; font-weight: bold; fill: #2c3e50;">Problem Type</text>
  <text x="600" y="455" text-anchor="middle" style="font-family: Arial; font-size: 10px; fill: #7f8c8d;">Classification/Regression</text>
  <text x="600" y="468" text-anchor="middle" style="font-family: Arial; font-size: 10px; fill: #7f8c8d;">Clustering/Prediction</text>
  
  <!-- Key Performance Metrics -->
  <text x="50" y="520" class="section-title">Key Performance Metrics</text>
  
  <!-- Classification Metrics -->
  <text x="50" y="545" style="font-family: Arial; font-size: 13px; font-weight: bold; fill: #2c3e50;">Classification:</text>
  <text x="50" y="560" style="font-family: Arial; font-size: 11px; fill: #2c3e50;">• Accuracy, Precision, Recall, F1-Score</text>
  <text x="50" y="575" style="font-family: Arial; font-size: 11px; fill: #2c3e50;">• ROC-AUC, Confusion Matrix</text>
  
  <!-- Regression Metrics -->
  <text x="300" y="545" style="font-family: Arial; font-size: 13px; font-weight: bold; fill: #2c3e50;">Regression:</text>
  <text x="300" y="560" style="font-family: Arial; font-size: 11px; fill: #2c3e50;">• RMSE, MAE, MAPE</text>
  <text x="300" y="575" style="font-family: Arial; font-size: 11px; fill: #2c3e50;">• R-squared, Adjusted R-squared</text>
  
  <!-- Clustering Metrics -->
  <text x="500" y="545" style="font-family: Arial; font-size: 13px; font-weight: bold; fill: #2c3e50;">Clustering:</text>
  <text x="500" y="560" style="font-family: Arial; font-size: 11px; fill: #2c3e50;">• Silhouette Score, Inertia</text>
  <text x="500" y="575" style="font-family: Arial; font-size: 11px; fill: #2c3e50;">• Calinski-Harabasz Index</text>
  
  <!-- Best Practices -->
  <text x="50" y="610" style="font-family: Arial; font-size: 14px; font-weight: bold; fill: #2c3e50;">Best Practices:</text>
  <text x="180" y="610" style="font-family: Arial; font-size: 12px; fill: #2c3e50;">• Start simple, increase complexity</text>
  <text x="370" y="610" style="font-family: Arial; font-size: 12px; fill: #2c3e50;">• Use cross-validation</text>
  <text x="520" y="610" style="font-family: Arial; font-size: 12px; fill: #2c3e50;">• Track experiments</text>
</svg>