<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
    <!-- Background and title -->
    <rect x="0" y="0" width="800" height="500" fill="#f8f9fa" rx="10" ry="10"/>
    <text x="400" y="40" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold">Estimating Standard Errors</text>
    
    <!-- Formula for covariance matrix -->
    <rect x="200" y="80" width="400" height="80" fill="#e8eaf6" stroke="#3f51b5" stroke-width="2" rx="10" ry="10"/>
    <text x="400" y="110" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">Covariance Matrix Formula</text>
    <text x="400" y="140" font-family="Arial" font-size="18" text-anchor="middle">σ²(XᵀX)⁻¹</text>
    
    <!-- Arrow down -->
    <path d="M 400,170 L 400,200" stroke="#3f51b5" stroke-width="3" fill="none"/>
    <path d="M 395,195 L 400,205 L 405,195 Z" fill="#3f51b5"/>
    
    <!-- Estimating noise variance -->
    <rect x="150" y="210" width="500" height="150" fill="#e0f2f1" stroke="#009688" stroke-width="2" rx="10" ry="10"/>
    <text x="400" y="240" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">Estimating Noise Variance (σ²)</text>
    
    <!-- Noise variance formula -->
    <text x="400" y="280" font-family="Arial" font-size="18" text-anchor="middle">σ̂² = (1/n) Σ(Yi - θ̂ᵀXi)²</text>
    
    <!-- Notes on the formula -->
    <text x="210" y="320" font-family="Arial" font-size="16" text-anchor="start">• (Yi - θ̂ᵀXi) represents prediction error</text>
    <text x="210" y="350" font-family="Arial" font-size="16" text-anchor="start">• Valid when θ̂ ≈ θ* (large sample approximation)</text>
    
    <!-- Arrow down -->
    <path d="M 400,370 L 400,400" stroke="#009688" stroke-width="3" fill="none"/>
    <path d="M 395,395 L 400,405 L 405,395 Z" fill="#009688"/>
    
    <!-- Standard error -->
    <rect x="250" y="410" width="300" height="60" fill="#fff8e1" stroke="#ffc107" stroke-width="2" rx="10" ry="10"/>
    <text x="400" y="440" font-family="Arial" font-size="18" text-anchor="middle">Standard Error (SE) = √Var(θ̂j)</text>
    
    <!-- Process flow -->
    <rect x="50" y="250" width="90" height="60" fill="#ffebee" stroke="#f44336" stroke-width="2" rx="5" ry="5"/>
    <text x="95" y="285" font-family="Arial" font-size="14" text-anchor="middle">Estimate σ²</text>
    
    <path d="M 150,280 L 180,280" stroke="#f44336" stroke-width="2" fill="none"/>
    <path d="M 175,275 L 185,280 L 175,285 Z" fill="#f44336"/>
    
    <rect x="660" y="250" width="90" height="60" fill="#ffebee" stroke="#f44336" stroke-width="2" rx="5" ry="5"/>
    <text x="705" y="275" font-family="Arial" font-size="14" text-anchor="middle">Calculate</text>
    <text x="705" y="295" font-family="Arial" font-size="14" text-anchor="middle">Confidence</text>
    
    <path d="M 600,280 L 650,280" stroke="#f44336" stroke-width="2" fill="none"/>
    <path d="M 645,275 L 655,280 L 645,285 Z" fill="#f44336"/>
</svg>