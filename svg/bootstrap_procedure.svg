<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="originalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bootstrapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="distributionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <dropShadow dx="2" dy="3" stdDeviation="2" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="700" fill="#fafafa"/>
  
  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1f2937">
    How Bootstrap Works
  </text>

  <!-- Step 1: Original Sample -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="280" height="140" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" filter="url(#shadow)"/>
    
    <text x="140" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2937">
      1. Original Sample
    </text>
    
    <rect x="20" y="40" width="240" height="40" rx="4" fill="url(#originalGrad)"/>
    <text x="140" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
      [2.1, 3.5, 1.8, 4.2, 2.9, 3.1, 1.6, 4.8]
    </text>
    
    <rect x="90" y="95" width="100" height="30" rx="4" fill="#f59e0b"/>
    <text x="140" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
      Mean = 3.0
    </text>
  </g>

  <!-- Step 2: The Question -->
  <g transform="translate(380, 80)">
    <rect x="0" y="0" width="280" height="140" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" filter="url(#shadow)"/>
    
    <text x="140" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2937">
      2. The Key Question
    </text>
    
    <text x="140" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#374151">
      How uncertain are we about
    </text>
    <text x="140" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#374151">
      our estimate of 3.0?
    </text>
    
    <text x="140" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#374151">
      What's the standard error?
    </text>
    <text x="140" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#dc2626">
      Bootstrap will tell us!
    </text>
  </g>

  <!-- Step 3: Bootstrap Strategy -->
  <g transform="translate(710, 80)">
    <rect x="0" y="0" width="240" height="140" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" filter="url(#shadow)"/>
    
    <text x="120" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2937">
      3. Bootstrap Strategy
    </text>
    
    <text x="120" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#374151">
      Repeatedly sample WITH
    </text>
    <text x="120" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#374151">
      replacement from our data
    </text>
    <text x="120" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#374151">
      to see how estimates vary
    </text>
    
    <text x="120" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#059669">
      Create 1000+ bootstrap samples
    </text>
    <text x="120" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#059669">
      Each same size as original
    </text>
  </g>

  <!-- Step 4: Bootstrap Samples -->
  <g transform="translate(50, 260)">
    <rect x="0" y="0" width="420" height="180" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" filter="url(#shadow)"/>
    
    <text x="210" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2937">
      4. Bootstrap Sampling Examples
    </text>
    
    <!-- Bootstrap Sample 1 -->
    <rect x="20" y="40" width="240" height="30" rx="4" fill="url(#bootstrapGrad)"/>
    <text x="140" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">
      Sample 1: [2.1, 2.1, 4.2, 1.8, 3.1, 2.9, 4.2, 3.5]
    </text>
    <rect x="280" y="45" width="60" height="20" rx="2" fill="#fef3c7"/>
    <text x="310" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#92400e">
      Mean = 2.99
    </text>
    
    <!-- Bootstrap Sample 2 -->
    <rect x="20" y="80" width="240" height="30" rx="4" fill="url(#bootstrapGrad)"/>
    <text x="140" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">
      Sample 2: [3.1, 4.8, 3.5, 3.1, 2.9, 4.8, 1.6, 3.7]
    </text>
    <rect x="280" y="85" width="60" height="20" rx="2" fill="#fef3c7"/>
    <text x="310" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#92400e">
      Mean = 3.44
    </text>
    
    <!-- Continue indicator -->
    <text x="140" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">
      ... Continue for 1000 samples ...
    </text>
    
    <text x="210" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#059669">
      Key: Sample WITH replacement
    </text>
    <text x="210" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#059669">
      (same values can appear multiple times)
    </text>
  </g>

  <!-- Step 5: Bootstrap Distribution -->
  <g transform="translate(520, 260)">
    <rect x="0" y="0" width="430" height="180" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" filter="url(#shadow)"/>
    
    <text x="215" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2937">
      5. Bootstrap Distribution
    </text>
    
    <!-- Histogram -->
    <g transform="translate(50, 40)">
      <!-- Bars -->
      <rect x="20" y="90" width="15" height="15" fill="url(#distributionGrad)"/>
      <rect x="40" y="80" width="15" height="25" fill="url(#distributionGrad)"/>
      <rect x="60" y="65" width="15" height="40" fill="url(#distributionGrad)"/>
      <rect x="80" y="45" width="15" height="60" fill="url(#distributionGrad)"/>
      <rect x="100" y="30" width="15" height="75" fill="url(#distributionGrad)"/>
      <rect x="120" y="20" width="15" height="85" fill="url(#distributionGrad)"/>
      <rect x="140" y="15" width="15" height="90" fill="url(#distributionGrad)"/>
      <rect x="160" y="20" width="15" height="85" fill="url(#distributionGrad)"/>
      <rect x="180" y="30" width="15" height="75" fill="url(#distributionGrad)"/>
      <rect x="200" y="45" width="15" height="60" fill="url(#distributionGrad)"/>
      <rect x="220" y="65" width="15" height="40" fill="url(#distributionGrad)"/>
      <rect x="240" y="80" width="15" height="25" fill="url(#distributionGrad)"/>
      <rect x="260" y="90" width="15" height="15" fill="url(#distributionGrad)"/>
      
      <!-- Confidence interval -->
      <line x1="85" y1="110" x2="85" y2="120" stroke="#dc2626" stroke-width="3"/>
      <line x1="195" y1="110" x2="195" y2="120" stroke="#dc2626" stroke-width="3"/>
      <line x1="85" y1="115" x2="195" y2="115" stroke="#dc2626" stroke-width="2"/>
      
      <!-- Axes -->
      <line x1="15" y1="110" x2="280" y2="110" stroke="#374151" stroke-width="1"/>
      <text x="140" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#374151">
        Bootstrap Sample Means
      </text>
      
      <!-- Scale -->
      <text x="85" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#dc2626">2.5</text>
      <text x="140" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#374151">3.0</text>
      <text x="195" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#dc2626">3.5</text>
    </g>
    
    <text x="215" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#8b5cf6">
      95% Confidence Interval: [2.5, 3.5]
    </text>
    <text x="215" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#8b5cf6">
      Standard Error ≈ 0.25
    </text>
  </g>

  <!-- Bottom Insight -->
  <g transform="translate(50, 480)">
    <rect x="0" y="0" width="900" height="120" rx="8" fill="#f8fafc" stroke="#6366f1" stroke-width="2" filter="url(#shadow)"/>
    
    <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#4338ca">
      Key Insight: Bootstrap Magic
    </text>
    
    <text x="450" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#374151">
      • Uses only the data you have (no distributional assumptions)
    </text>
    <text x="450" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#374151">
      • Sampling WITH replacement lets same values appear multiple times
    </text>
    <text x="450" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#374151">
      • Bootstrap distribution approximates the true sampling distribution
    </text>
  </g>

  <!-- Flow arrows -->
  <path d="M 330 150 L 380 150" stroke="#6b7280" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 660 150 L 710 150" stroke="#6b7280" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 500 220 L 500 260" stroke="#6b7280" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 470 350 L 520 350" stroke="#6b7280" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
  </defs>

</svg>