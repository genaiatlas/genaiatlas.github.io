<svg viewBox="0 0 900 650" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="900" height="650" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="450" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Routing Strategy Performance Comparison
  </text>
  
  <!-- Comparison table -->
  <rect x="50" y="60" width="800" height="45" fill="#34495e"/>
  <text x="150" y="87" font-size="13" font-weight="bold" fill="white">Strategy</text>
  <text x="320" y="87" font-size="13" font-weight="bold" fill="white">Accuracy</text>
  <text x="450" y="87" font-size="13" font-weight="bold" fill="white">Latency</text>
  <text x="580" y="87" font-size="13" font-weight="bold" fill="white">Cost</text>
  <text x="710" y="87" font-size="13" font-weight="bold" fill="white">Best For</text>
  
  <!-- Row 1: Logical Routing -->
  <rect x="50" y="105" width="800" height="60" fill="white" stroke="#ddd"/>
  <text x="70" y="130" font-size="12" font-weight="bold" fill="#1a1a1a">Logical Routing</text>
  <text x="70" y="148" font-size="10" fill="#666">(Rule-based)</text>
  
  <rect x="300" y="118" width="80" height="25" rx="4" fill="#27ae60"/>
  <text x="340" y="135" font-size="11" font-weight="bold" text-anchor="middle" fill="white">92%</text>
  
  <rect x="430" y="118" width="80" height="25" rx="4" fill="#27ae60"/>
  <text x="470" y="135" font-size="11" font-weight="bold" text-anchor="middle" fill="white">~5ms</text>
  
  <rect x="560" y="118" width="80" height="25" rx="4" fill="#27ae60"/>
  <text x="600" y="135" font-size="11" font-weight="bold" text-anchor="middle" fill="white">$0.001</text>
  
  <text x="660" y="138" font-size="10" fill="#555">• Structured data</text>
  <text x="660" y="152" font-size="10" fill="#555">• Clear categories</text>
  
  <!-- Row 2: Semantic Routing -->
  <rect x="50" y="165" width="800" height="60" fill="#f8f9fa" stroke="#ddd"/>
  <text x="70" y="190" font-size="12" font-weight="bold" fill="#1a1a1a">Semantic Routing</text>
  <text x="70" y="208" font-size="10" fill="#666">(Embedding-based)</text>
  
  <rect x="300" y="178" width="80" height="25" rx="4" fill="#27ae60"/>
  <text x="340" y="195" font-size="11" font-weight="bold" text-anchor="middle" fill="white">95%</text>
  
  <rect x="430" y="178" width="80" height="25" rx="4" fill="#f39c12"/>
  <text x="470" y="195" font-size="11" font-weight="bold" text-anchor="middle" fill="white">~50ms</text>
  
  <rect x="560" y="178" width="80" height="25" rx="4" fill="#f39c12"/>
  <text x="600" y="195" font-size="11" font-weight="bold" text-anchor="middle" fill="white">$0.01</text>
  
  <text x="660" y="198" font-size="10" fill="#555">• Ambiguous queries</text>
  <text x="660" y="212" font-size="10" fill="#555">• Semantic similarity</text>
  
  <!-- Row 3: LLM Routing -->
  <rect x="50" y="225" width="800" height="60" fill="white" stroke="#ddd"/>
  <text x="70" y="250" font-size="12" font-weight="bold" fill="#1a1a1a">LLM Routing</text>
  <text x="70" y="268" font-size="10" fill="#666">(GPT-4 / Claude)</text>
  
  <rect x="300" y="238" width="80" height="25" rx="4" fill="#27ae60"/>
  <text x="340" y="255" font-size="11" font-weight="bold" text-anchor="middle" fill="white">97%</text>
  
  <rect x="430" y="238" width="80" height="25" rx="4" fill="#e74c3c"/>
  <text x="470" y="255" font-size="11" font-weight="bold" text-anchor="middle" fill="white">~800ms</text>
  
  <rect x="560" y="238" width="80" height="25" rx="4" fill="#e74c3c"/>
  <text x="600" y="255" font-size="11" font-weight="bold" text-anchor="middle" fill="white">$0.10</text>
  
  <text x="660" y="258" font-size="10" fill="#555">• Complex reasoning</text>
  <text x="660" y="272" font-size="10" fill="#555">• Nuanced decisions</text>
  
  <!-- Row 4: Hybrid Routing -->
  <rect x="50" y="285" width="800" height="60" fill="#f8f9fa" stroke="#ddd"/>
  <text x="70" y="310" font-size="12" font-weight="bold" fill="#1a1a1a">Hybrid Routing</text>
  <text x="70" y="328" font-size="10" fill="#666">(Combined approach)</text>
  
  <rect x="300" y="298" width="80" height="25" rx="4" fill="#27ae60"/>
  <text x="340" y="315" font-size="11" font-weight="bold" text-anchor="middle" fill="white">96%</text>
  
  <rect x="430" y="298" width="80" height="25" rx="4" fill="#27ae60"/>
  <text x="470" y="315" font-size="11" font-weight="bold" text-anchor="middle" fill="white">~100ms</text>
  
  <rect x="560" y="298" width="80" height="25" rx="4" fill="#f39c12"/>
  <text x="600" y="315" font-size="11" font-weight="bold" text-anchor="middle" fill="white">$0.02</text>
  
  <text x="660" y="318" font-size="10" fill="#555">• Production systems</text>
  <text x="660" y="332" font-size="10" fill="#555">• Balance all factors</text>
  
  <!-- Performance charts -->
  <text x="450" y="380" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Accuracy vs Latency Trade-off
  </text>
  
  <!-- Chart background -->
  <rect x="100" y="400" width="700" height="200" fill="white" stroke="#ddd" stroke-width="2"/>
  
  <!-- Y-axis -->
  <line x1="100" y1="400" x2="100" y2="600" stroke="#666" stroke-width="2"/>
  <text x="85" y="405" font-size="10" text-anchor="end" fill="#666">100%</text>
  <text x="85" y="455" font-size="10" text-anchor="end" fill="#666">95%</text>
  <text x="85" y="505" font-size="10" text-anchor="end" fill="#666">90%</text>
  <text x="85" y="555" font-size="10" text-anchor="end" fill="#666">85%</text>
  <text x="85" y="605" font-size="10" text-anchor="end" fill="#666">80%</text>
  <text x="50" y="510" font-size="11" font-weight="bold" fill="#666" transform="rotate(-90 50 510)">Accuracy</text>
  
  <!-- X-axis -->
  <line x1="100" y1="600" x2="800" y2="600" stroke="#666" stroke-width="2"/>
  <text x="100" y="620" font-size="10" text-anchor="middle" fill="#666">0ms</text>
  <text x="275" y="620" font-size="10" text-anchor="middle" fill="#666">200ms</text>
  <text x="450" y="620" font-size="10" text-anchor="middle" fill="#666">400ms</text>
  <text x="625" y="620" font-size="10" text-anchor="middle" fill="#666">600ms</text>
  <text x="800" y="620" font-size="10" text-anchor="middle" fill="#666">800ms</text>
  <text x="450" y="640" font-size="11" font-weight="bold" text-anchor="middle" fill="#666">Latency</text>
  
  <!-- Data points -->
  <!-- Logical: 92%, 5ms -->
  <circle cx="107" cy="440" r="8" fill="#27ae60" stroke="#1e8449" stroke-width="2"/>
  <text x="107" y="430" font-size="9" font-weight="bold" text-anchor="middle" fill="#27ae60">Logical</text>
  
  <!-- Semantic: 95%, 50ms -->
  <circle cx="143" cy="410" r="8" fill="#3498db" stroke="#2874a6" stroke-width="2"/>
  <text x="143" y="400" font-size="9" font-weight="bold" text-anchor="middle" fill="#3498db">Semantic</text>
  
  <!-- Hybrid: 96%, 100ms -->
  <circle cx="187" cy="405" r="8" fill="#f39c12" stroke="#c87f0a" stroke-width="2"/>
  <text x="187" y="395" font-size="9" font-weight="bold" text-anchor="middle" fill="#f39c12">Hybrid</text>
  
  <!-- LLM: 97%, 800ms -->
  <circle cx="790" cy="400" r="8" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <text x="790" y="390" font-size="9" font-weight="bold" text-anchor="middle" fill="#e74c3c">LLM</text>
  
  <!-- Trend line -->
  <line x1="107" y1="440" x2="790" y2="400" stroke="#bbb" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- Legend -->
  <rect x="630" y="410" width="150" height="75" rx="4" fill="#f8f9fa" stroke="#ddd" stroke-width="1"/>
  <text x="705" y="428" font-size="10" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Color Key</text>
  <circle cx="645" cy="445" r="4" fill="#27ae60"/>
  <text x="655" y="449" font-size="9" fill="#555">Excellent</text>
  <circle cx="645" cy="460" r="4" fill="#f39c12"/>
  <text x="655" y="464" font-size="9" fill="#555">Good</text>
  <circle cx="645" cy="475" r="4" fill="#e74c3c"/>
  <text x="655" y="479" font-size="9" fill="#555">Needs improvement</text>
</svg>