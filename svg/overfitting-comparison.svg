<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title-text { font-family: 'Arial', sans-serif; font-size: 24px; font-weight: bold; fill: #2c3e50; }
      .subtitle-text { font-family: 'Arial', sans-serif; font-size: 18px; font-weight: bold; fill: #34495e; }
      .label-text { font-family: 'Arial', sans-serif; font-size: 14px; fill: #34495e; }
      .small-text { font-family: 'Arial', sans-serif; font-size: 12px; fill: #7f8c8d; }
      .axis-line { stroke: #2c3e50; stroke-width: 2; }
      .grid-line { stroke: #ecf0f1; stroke-width: 1; }
      .data-point { fill: #3498db; stroke: #2980b9; stroke-width: 2; }
      .good-fit-line { stroke: #27ae60; stroke-width: 3; fill: none; }
      .overfit-curve { stroke: #e74c3c; stroke-width: 3; fill: none; }
      .error-box { fill: rgba(231, 76, 60, 0.1); stroke: #e74c3c; stroke-width: 1; rx: 5; }
      .success-box { fill: rgba(39, 174, 96, 0.1); stroke: #27ae60; stroke-width: 1; rx: 5; }
    </style>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title-text">Overfitting vs. Good Fit Comparison</text>
  
  <!-- Left plot: Good Fit (Linear Regression) -->
  <g transform="translate(50, 80)">
    <text x="150" y="0" text-anchor="middle" class="subtitle-text" fill="#27ae60">Good Fit: Linear Regression</text>
    
    <!-- Coordinate system -->
    <g transform="translate(30, 30)">
      <!-- Grid -->
      <rect x="0" y="0" width="240" height="180" fill="none" stroke="#ecf0f1" stroke-width="1"/>
      <line x1="60" y1="0" x2="60" y2="180" class="grid-line"/>
      <line x1="120" y1="0" x2="120" y2="180" class="grid-line"/>
      <line x1="180" y1="0" x2="180" y2="180" class="grid-line"/>
      <line x1="0" y1="45" x2="240" y2="45" class="grid-line"/>
      <line x1="0" y1="90" x2="240" y2="90" class="grid-line"/>
      <line x1="0" y1="135" x2="240" y2="135" class="grid-line"/>
      
      <!-- Axes -->
      <line x1="0" y1="180" x2="240" y2="180" class="axis-line"/>
      <line x1="0" y1="0" x2="0" y2="180" class="axis-line"/>
      
      <!-- Linear regression line -->
      <line x1="20" y1="160" x2="220" y2="20" class="good-fit-line"/>
      
      <!-- Data points -->
      <circle cx="40" cy="145" r="4" class="data-point"/>
      <circle cx="60" cy="135" r="4" class="data-point"/>
      <circle cx="80" cy="115" r="4" class="data-point"/>
      <circle cx="100" cy="105" r="4" class="data-point"/>
      <circle cx="120" cy="85" r="4" class="data-point"/>
      <circle cx="140" cy="75" r="4" class="data-point"/>
      <circle cx="160" cy="65" r="4" class="data-point"/>
      <circle cx="180" cy="45" r="4" class="data-point"/>
      <circle cx="200" cy="35" r="4" class="data-point"/>
      
      <!-- Axis labels -->
      <text x="120" y="200" text-anchor="middle" class="small-text">X</text>
      <text x="-15" y="90" text-anchor="middle" class="small-text" transform="rotate(-90, -15, 90)">Y</text>
    </g>
    
    <!-- Characteristics -->
    <g transform="translate(0, 250)">
      <rect x="0" y="0" width="300" height="120" class="success-box"/>
      <text x="10" y="20" class="label-text" fill="#27ae60">✓ Characteristics:</text>
      <text x="20" y="40" class="small-text">• Simple linear relationship</text>
      <text x="20" y="55" class="small-text">• Moderate training error</text>
      <text x="20" y="70" class="small-text">• Good generalization</text>
      <text x="20" y="85" class="small-text">• Interpretable parameters</text>
      <text x="20" y="100" class="small-text">• Robust to new data</text>
    </g>
  </g>
  
  <!-- Right plot: Overfitting -->
  <g transform="translate(450, 80)">
    <text x="150" y="0" text-anchor="middle" class="subtitle-text" fill="#e74c3c">Overfitting: High-Degree Polynomial</text>
    
    <!-- Coordinate system -->
    <g transform="translate(30, 30)">
      <!-- Grid -->
      <rect x="0" y="0" width="240" height="180" fill="none" stroke="#ecf0f1" stroke-width="1"/>
      <line x1="60" y1="0" x2="60" y2="180" class="grid-line"/>
      <line x1="120" y1="0" x2="120" y2="180" class="grid-line"/>
      <line x1="180" y1="0" x2="180" y2="180" class="grid-line"/>
      <line x1="0" y1="45" x2="240" y2="45" class="grid-line"/>
      <line x1="0" y1="90" x2="240" y2="90" class="grid-line"/>
      <line x1="0" y1="135" x2="240" y2="135" class="grid-line"/>
      
      <!-- Axes -->
      <line x1="0" y1="180" x2="240" y2="180" class="axis-line"/>
      <line x1="0" y1="0" x2="0" y2="180" class="axis-line"/>
      
      <!-- Complex overfitting curve -->
      <path d="M 20 160 Q 40 145 60 135 Q 80 115 100 105 Q 120 85 140 75 Q 160 65 180 45 Q 200 35 220 25" 
            class="overfit-curve" stroke-width="2"/>
      <path d="M 35 150 Q 45 120 55 140 Q 70 110 85 120 Q 110 95 125 90 Q 150 70 165 60 Q 185 40 200 30" 
            class="overfit-curve"/>
      
      <!-- Data points (same as left) -->
      <circle cx="40" cy="145" r="4" class="data-point"/>
      <circle cx="60" cy="135" r="4" class="data-point"/>
      <circle cx="80" cy="115" r="4" class="data-point"/>
      <circle cx="100" cy="105" r="4" class="data-point"/>
      <circle cx="120" cy="85" r="4" class="data-point"/>
      <circle cx="140" cy="75" r="4" class="data-point"/>
      <circle cx="160" cy="65" r="4" class="data-point"/>
      <circle cx="180" cy="45" r="4" class="data-point"/>
      <circle cx="200" cy="35" r="4" class="data-point"/>
      
      <!-- Axis labels -->
      <text x="120" y="200" text-anchor="middle" class="small-text">X</text>
      <text x="-15" y="90" text-anchor="middle" class="small-text" transform="rotate(-90, -15, 90)">Y</text>
    </g>
    
    <!-- Characteristics -->
    <g transform="translate(0, 250)">
      <rect x="0" y="0" width="300" height="120" class="error-box"/>
      <text x="10" y="20" class="label-text" fill="#e74c3c">✗ Problems:</text>
      <text x="20" y="40" class="small-text">• Complex, wiggly curve</text>
      <text x="20" y="55" class="small-text">• Zero training error</text>
      <text x="20" y="70" class="small-text">• Poor generalization</text>
      <text x="20" y="85" class="small-text">• Too many parameters</text>
      <text x="20" y="100" class="small-text">• Memorizes noise</text>
    </g>
  </g>
  
  <!-- Bottom comparison -->
  <g transform="translate(400, 450)">
    <text x="0" y="0" text-anchor="middle" class="label-text">Key Insight: Linear regression constrains complexity to prevent overfitting</text>
  </g>
  
  <!-- Performance comparison table -->
  <g transform="translate(50, 390)">
    <rect x="0" y="0" width="700" height="50" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1" rx="5"/>
    <text x="20" y="20" class="small-text" font-weight="bold">Training Error:</text>
    <text x="150" y="20" class="small-text" fill="#27ae60">Linear: Moderate</text>
    <text x="300" y="20" class="small-text" fill="#e74c3c">Polynomial: Zero</text>
    
    <text x="20" y="35" class="small-text" font-weight="bold">Test Error:</text>
    <text x="150" y="35" class="small-text" fill="#27ae60">Linear: Low</text>
    <text x="300" y="35" class="small-text" fill="#e74c3c">Polynomial: High</text>
  </g>
</svg>