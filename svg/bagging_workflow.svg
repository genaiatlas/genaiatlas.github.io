<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #2c3e50; }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #34495e; }
      .label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #2c3e50; }
      .small-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10px; fill: #2c3e50; }
      .model-text { font-family: 'Courier New', monospace; font-size: 11px; fill: white; font-weight: bold; }
      .arrow { stroke: #3498db; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .predict-arrow { stroke: #27ae60; stroke-width: 2; fill: none; marker-end: url(#arrowhead2); }
      .aggregate-arrow { stroke: #e74c3c; stroke-width: 3; fill: none; marker-end: url(#arrowhead3); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3498db"/>
    </marker>
    <marker id="arrowhead2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#27ae60"/>
    </marker>
    <marker id="arrowhead3" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <polygon points="0 0, 12 4.5, 0 9" fill="#e74c3c"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="450" y="25" text-anchor="middle" class="title">Bagging Workflow: Majority Classifier</text>
  
  <!-- Training Set -->
  <rect x="50" y="50" width="120" height="60" fill="#3498db" rx="8" stroke="#2980b9" stroke-width="2"/>
  <text x="110" y="75" text-anchor="middle" class="subtitle" fill="white">Training Set</text>
  <text x="110" y="95" text-anchor="middle" class="label" fill="white">Original Data</text>
  
  <!-- Bootstrap Sampling -->
  <text x="110" y="140" text-anchor="middle" class="subtitle">Bootstrap Sampling</text>
  
  <!-- Bootstrap samples -->
  <g transform="translate(40, 160)">
    <!-- Sample T1 -->
    <rect x="0" y="0" width="50" height="40" fill="#e67e22" rx="5"/>
    <text x="25" y="18" text-anchor="middle" class="model-text" style="font-size: 10px;">T₁</text>
    <text x="25" y="32" text-anchor="middle" class="small-label" fill="white">Sample 1</text>
    
    <!-- Sample T2 -->
    <rect x="60" y="0" width="50" height="40" fill="#e67e22" rx="5"/>
    <text x="85" y="18" text-anchor="middle" class="model-text" style="font-size: 10px;">T₂</text>
    <text x="85" y="32" text-anchor="middle" class="small-label" fill="white">Sample 2</text>
    
    <!-- Sample T3 -->
    <rect x="120" y="0" width="50" height="40" fill="#e67e22" rx="5"/>
    <text x="145" y="18" text-anchor="middle" class="model-text" style="font-size: 10px;">T₃</text>
    <text x="145" y="32" text-anchor="middle" class="small-label" fill="white">Sample 3</text>
    
    <!-- Dots -->
    <text x="180" y="25" class="label">...</text>
    
    <!-- Sample TL -->
    <rect x="200" y="0" width="50" height="40" fill="#e67e22" rx="5"/>
    <text x="225" y="18" text-anchor="middle" class="model-text" style="font-size: 10px;">T_L</text>
    <text x="225" y="32" text-anchor="middle" class="small-label" fill="white">Sample L</text>
  </g>
  
  <!-- Arrows from training set to bootstrap samples -->
  <line x1="110" y1="110" x2="65" y2="160" class="arrow"/>
  <line x1="110" y1="110" x2="125" y2="160" class="arrow"/>
  <line x1="110" y1="110" x2="185" y2="160" class="arrow"/>
  <line x1="110" y1="110" x2="265" y2="160" class="arrow"/>
  
  <!-- Training arrows down -->
  <line x1="65" y1="200" x2="65" y2="240" class="arrow"/>
  <line x1="125" y1="200" x2="125" y2="240" class="arrow"/>
  <line x1="185" y1="200" x2="185" y2="240" class="arrow"/>
  <line x1="265" y1="200" x2="265" y2="240" class="arrow"/>
  
  <!-- Classification Models -->
  <text x="165" y="230" text-anchor="middle" class="subtitle">Classification Models</text>
  
  <g transform="translate(40, 250)">
    <!-- Model f1 -->
    <rect x="0" y="0" width="50" height="40" fill="#34495e" rx="5"/>
    <text x="25" y="18" text-anchor="middle" class="model-text">f₁</text>
    <text x="25" y="32" text-anchor="middle" class="small-label" fill="white">Model 1</text>
    
    <!-- Model f2 -->
    <rect x="60" y="0" width="50" height="40" fill="#34495e" rx="5"/>
    <text x="85" y="18" text-anchor="middle" class="model-text">f₂</text>
    <text x="85" y="32" text-anchor="middle" class="small-label" fill="white">Model 2</text>
    
    <!-- Model f3 -->
    <rect x="120" y="0" width="50" height="40" fill="#34495e" rx="5"/>
    <text x="145" y="18" text-anchor="middle" class="model-text">f₃</text>
    <text x="145" y="32" text-anchor="middle" class="small-label" fill="white">Model 3</text>
    
    <!-- Dots -->
    <text x="180" y="25" class="label">...</text>
    
    <!-- Model fL -->
    <rect x="200" y="0" width="50" height="40" fill="#34495e" rx="5"/>
    <text x="225" y="18" text-anchor="middle" class="model-text">f_L</text>
    <text x="225" y="32" text-anchor="middle" class="small-label" fill="white">Model L</text>
  </g>
  
  <!-- New Data Input -->
  <rect x="400" y="50" width="120" height="60" fill="#27ae60" rx="8" stroke="#229954" stroke-width="2"/>
  <text x="460" y="75" text-anchor="middle" class="subtitle" fill="white">New Data</text>
  <text x="460" y="95" text-anchor="middle" class="label" fill="white">Test Instance</text>
  
  <!-- Prediction arrows from new data to models -->
  <line x1="460" y1="110" x2="65" y2="250" class="predict-arrow"/>
  <line x1="460" y1="110" x2="125" y2="250" class="predict-arrow"/>
  <line x1="460" y1="110" x2="185" y2="250" class="predict-arrow"/>
  <line x1="460" y1="110" x2="265" y2="250" class="predict-arrow"/>
  
  <!-- Predictions -->
  <text x="165" y="320" text-anchor="middle" class="subtitle">Individual Predictions</text>
  
  <g transform="translate(40, 330)">
    <!-- Prediction y1 -->
    <circle cx="25" cy="25" r="20" fill="#9b59b6"/>
    <text x="25" y="30" text-anchor="middle" class="model-text">ŷ₁</text>
    
    <!-- Prediction y2 -->
    <circle cx="85" cy="25" r="20" fill="#9b59b6"/>
    <text x="85" y="30" text-anchor="middle" class="model-text">ŷ₂</text>
    
    <!-- Prediction y3 -->
    <circle cx="145" cy="25" r="20" fill="#9b59b6"/>
    <text x="145" y="30" text-anchor="middle" class="model-text">ŷ₃</text>
    
    <!-- Dots -->
    <text x="180" y="30" class="label">...</text>
    
    <!-- Prediction yL -->
    <circle cx="225" cy="25" r="20" fill="#9b59b6"/>
    <text x="225" y="30" text-anchor="middle" class="model-text">ŷ_L</text>
  </g>
  
  <!-- Arrows from models to predictions -->
  <line x1="65" y1="290" x2="65" y2="330" class="arrow"/>
  <line x1="125" y1="290" x2="125" y2="330" class="arrow"/>
  <line x1="185" y1="290" x2="185" y2="330" class="arrow"/>
  <line x1="265" y1="290" x2="265" y2="330" class="arrow"/>
  
  <!-- Voting label -->
  <text x="165" y="395" text-anchor="middle" class="subtitle">Majority Voting</text>
  
  <!-- Arrows from predictions to voting -->
  <line x1="65" y1="375" x2="165" y2="420" class="aggregate-arrow"/>
  <line x1="125" y1="375" x2="165" y2="420" class="aggregate-arrow"/>
  <line x1="185" y1="375" x2="165" y2="420" class="aggregate-arrow"/>
  <line x1="265" y1="375" x2="165" y2="420" class="aggregate-arrow"/>
  
  <!-- Final Prediction -->
  <rect x="115" y="430" width="100" height="50" fill="#e74c3c" rx="8" stroke="#c0392b" stroke-width="2"/>
  <text x="165" y="450" text-anchor="middle" class="subtitle" fill="white">Final Prediction</text>
  <text x="165" y="470" text-anchor="middle" class="model-text" style="font-size: 16px;">ŷ</text>
  
  <!-- Mathematical notation panel -->
  <rect x="550" y="160" width="320" height="280" fill="#ecf0f1" rx="10" stroke="#bdc3c7" stroke-width="2"/>
  <text x="710" y="185" text-anchor="middle" class="subtitle">Mathematical Formulation</text>
  
  <!-- Formulas -->
  <text x="570" y="210" class="label">1. Bootstrap Sampling:</text>
  <text x="580" y="230" class="small-label">T_i = Bootstrap sample i (with replacement)</text>
  
  <text x="570" y="255" class="label">2. Model Training:</text>
  <text x="580" y="275" class="small-label">f_i = Train classifier on T_i</text>
  
  <text x="570" y="300" class="label">3. Individual Predictions:</text>
  <text x="580" y="320" class="small-label">ŷ_i = f_i(x) for new instance x</text>
  
  <text x="570" y="345" class="label">4. Majority Voting:</text>
  <text x="580" y="365" class="small-label">ŷ = majority(ŷ₁, ŷ₂, ŷ₃, ..., ŷ_L)</text>
  
  <text x="570" y="390" class="label">5. Error Reduction:</text>
  <text x="580" y="410" class="small-label">P(ensemble error) &lt; P(individual error)</text>
  <text x="580" y="425" class="small-label">when individual error &lt; 0.5</text>
  
  <!-- Example values panel -->
  <rect x="550" y="460" width="320" height="120" fill="#f8f9fa" rx="10" stroke="#bdc3c7" stroke-width="2"/>
  <text x="710" y="485" text-anchor="middle" class="subtitle">Example Scenario</text>
  
  <text x="570" y="510" class="small-label">• Number of models (L) = 25</text>
  <text x="570" y="525" class="small-label">• Individual error rate (ε) = 0.35</text>
  <text x="570" y="540" class="small-label">• Ensemble error ≈ 0.06</text>
  <text x="570" y="555" class="small-label">• Improvement: 83% error reduction</text>
  <text x="570" y="570" class="small-label">• Requirement: Uncorrelated base models</text>
  
</svg>