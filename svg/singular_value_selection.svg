<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="chartGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#3498DB;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#3498DB;stop-opacity:0.3" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#FAFBFC"/>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2C3E50">
    Singular Value Selection: Finding Optimal Rank r
  </text>
  
  <!-- Chart Area -->
  <g transform="translate(100, 100)">
    <!-- Y-axis -->
    <line x1="0" y1="0" x2="0" y2="300" stroke="#34495E" stroke-width="2"/>
    <!-- X-axis -->
    <line x1="0" y1="300" x2="500" y2="300" stroke="#34495E" stroke-width="2"/>
    
    <!-- Y-axis label -->
    <text x="-40" y="150" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#34495E" transform="rotate(-90, -40, 150)">
      Singular Value (s_k)
    </text>
    
    <!-- X-axis label -->
    <text x="250" y="340" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#34495E">
      Index (k)
    </text>
    
    <!-- Grid lines -->
    <g stroke="#ECF0F1" stroke-width="1" stroke-dasharray="2,2">
      <line x1="0" y1="60" x2="500" y2="60"/>
      <line x1="0" y1="120" x2="500" y2="120"/>
      <line x1="0" y1="180" x2="500" y2="180"/>
      <line x1="0" y1="240" x2="500" y2="240"/>
      
      <line x1="50" y1="0" x2="50" y2="300"/>
      <line x1="100" y1="0" x2="100" y2="300"/>
      <line x1="150" y1="0" x2="150" y2="300"/>
      <line x1="200" y1="0" x2="200" y2="300"/>
      <line x1="250" y1="0" x2="250" y2="300"/>
      <line x1="300" y1="0" x2="300" y2="300"/>
      <line x1="350" y1="0" x2="350" y2="300"/>
      <line x1="400" y1="0" x2="400" y2="300"/>
      <line x1="450" y1="0" x2="450" y2="300"/>
    </g>
    
    <!-- Curve area fill -->
    <path d="M 0 30 Q 50 35, 100 45 T 150 80, 200 140, 250 200, 300 240, 350 260, 400 270, 450 275, 500 278 L 500 300 L 0 300 Z" 
          fill="url(#chartGrad)" opacity="0.5"/>
    
    <!-- The curve -->
    <path d="M 0 30 Q 50 35, 100 45 T 150 80, 200 140, 250 200, 300 240, 350 260, 400 270, 450 275, 500 278" 
          stroke="#3498DB" stroke-width="3" fill="none"/>
    
    <!-- Data points -->
    <circle cx="0" cy="30" r="4" fill="#3498DB"/>
    <circle cx="50" cy="35" r="4" fill="#3498DB"/>
    <circle cx="100" cy="45" r="4" fill="#3498DB"/>
    <circle cx="150" cy="80" r="4" fill="#3498DB"/>
    
    <!-- Knee point (highlighted) -->
    <circle cx="200" cy="140" r="8" fill="#E74C3C" filter="url(#glow)"/>
    <line x1="200" y1="140" x2="200" y2="300" stroke="#E74C3C" stroke-width="2" stroke-dasharray="5,3"/>
    
    <!-- Remaining points -->
    <circle cx="250" cy="200" r="4" fill="#3498DB"/>
    <circle cx="300" cy="240" r="4" fill="#3498DB"/>
    <circle cx="350" cy="260" r="4" fill="#3498DB"/>
    <circle cx="400" cy="270" r="4" fill="#3498DB"/>
    <circle cx="450" cy="275" r="4" fill="#3498DB"/>
    <circle cx="500" cy="278" r="4" fill="#3498DB"/>
    
    <!-- Knee point annotation -->
    <g transform="translate(200, 140)">
      <path d="M 0 -20 L 30 -40 L 120 -40" stroke="#E74C3C" stroke-width="1.5" fill="none" marker-end="url(#arrowheadRed)"/>
      <rect x="30" y="-55" width="90" height="30" fill="white" stroke="#E74C3C" stroke-width="1.5" rx="3"/>
      <text x="75" y="-35" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#E74C3C">
        Knee Point
      </text>
      <text x="75" y="-20" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7F8C8D">
        Optimal r
      </text>
    </g>
    
    <!-- Y-axis labels -->
    <text x="-15" y="35" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#7F8C8D">1.0</text>
    <text x="-15" y="95" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#7F8C8D">0.8</text>
    <text x="-15" y="155" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#7F8C8D">0.6</text>
    <text x="-15" y="215" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#7F8C8D">0.4</text>
    <text x="-15" y="275" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#7F8C8D">0.2</text>
    <text x="-15" y="305" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#7F8C8D">0</text>
    
    <!-- X-axis labels -->
    <text x="0" y="320" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7F8C8D">1</text>
    <text x="100" y="320" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7F8C8D">3</text>
    <text x="200" y="320" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#E74C3C" font-weight="bold">5</text>
    <text x="300" y="320" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7F8C8D">7</text>
    <text x="400" y="320" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7F8C8D">9</text>
    <text x="500" y="320" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7F8C8D">11</text>
  </g>
  
  <!-- Decision Process Box -->
  <g transform="translate(630, 150)">
    <rect x="-10" y="-10" width="160" height="200" fill="white" stroke="#95A5A6" stroke-width="2" rx="5"/>
    <text x="75" y="10" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2C3E50">
      Selection Process
    </text>
    
    <text x="10" y="40" font-family="Arial, sans-serif" font-size="12" fill="#34495E">1. Sort s_k descending</text>
    <text x="10" y="65" font-family="Arial, sans-serif" font-size="12" fill="#34495E">2. Plot scree plot</text>
    <text x="10" y="90" font-family="Arial, sans-serif" font-size="12" fill="#E74C3C" font-weight="bold">3. Find knee point</text>
    <text x="10" y="115" font-family="Arial, sans-serif" font-size="12" fill="#34495E">4. Set r = knee index</text>
    <text x="10" y="140" font-family="Arial, sans-serif" font-size="12" fill="#34495E">5. Validate with CV</text>
    
    <rect x="10" y="155" width="130" height="25" fill="#27AE60" opacity="0.2" stroke="#27AE60" stroke-width="1" rx="3"/>
    <text x="75" y="172" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#27AE60">
      r = 5 selected
    </text>
  </g>
  
  <!-- Explanation Text -->
  <g transform="translate(100, 470)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2C3E50">
      Interpretation:
    </text>
    <text x="0" y="30" font-family="Arial, sans-serif" font-size="12" fill="#34495E">
      • Sharp decline indicates meaningful components captured
    </text>
    <text x="0" y="55" font-family="Arial, sans-serif" font-size="12" fill="#34495E">
      • Components after knee point add mostly noise
    </text>
    <text x="0" y="80" font-family="Arial, sans-serif" font-size="12" fill="#34495E">
      • Smooth curve may indicate algorithm unsuitability
    </text>
  </g>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrowheadRed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#E74C3C"/>
    </marker>
  </defs>
</svg>