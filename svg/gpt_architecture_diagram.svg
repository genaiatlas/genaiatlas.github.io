<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2196F3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9800;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F44336;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9C27B0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#673AB7;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#333">GPT Architecture</text>
  <text x="400" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#666">Generative Pretrained Transformer</text>
  
  <!-- Input Layer -->
  <rect x="50" y="520" width="700" height="40" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="5"/>
  <text x="400" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1976d2">Input Embeddings + Positional Encoding</text>
  
  <!-- Transformer Blocks -->
  <g id="transformer-block-1">
    <rect x="100" y="420" width="600" height="80" fill="url(#grad1)" stroke="#333" stroke-width="2" rx="10"/>
    <text x="400" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Transformer Block 1</text>
    
    <!-- Multi-Head Attention -->
    <rect x="120" y="450" width="180" height="25" fill="#fff" stroke="#333" stroke-width="1" rx="3"/>
    <text x="210" y="467" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">Multi-Head Attention</text>
    
    <!-- Feed Forward -->
    <rect x="320" y="450" width="180" height="25" fill="#fff" stroke="#333" stroke-width="1" rx="3"/>
    <text x="410" y="467" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">Feed Forward Network</text>
    
    <!-- Layer Norm -->
    <rect x="520" y="450" width="160" height="25" fill="#fff" stroke="#333" stroke-width="1" rx="3"/>
    <text x="600" y="467" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">Layer Normalization</text>
  </g>
  
  <g id="transformer-block-2">
    <rect x="100" y="320" width="600" height="80" fill="url(#grad2)" stroke="#333" stroke-width="2" rx="10"/>
    <text x="400" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Transformer Block 2</text>
    
    <!-- Multi-Head Attention -->
    <rect x="120" y="350" width="180" height="25" fill="#fff" stroke="#333" stroke-width="1" rx="3"/>
    <text x="210" y="367" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">Multi-Head Attention</text>
    
    <!-- Feed Forward -->
    <rect x="320" y="350" width="180" height="25" fill="#fff" stroke="#333" stroke-width="1" rx="3"/>
    <text x="410" y="367" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">Feed Forward Network</text>
    
    <!-- Layer Norm -->
    <rect x="520" y="350" width="160" height="25" fill="#fff" stroke="#333" stroke-width="1" rx="3"/>
    <text x="600" y="367" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">Layer Normalization</text>
  </g>
  
  <g id="transformer-block-n">
    <rect x="100" y="220" width="600" height="80" fill="url(#grad3)" stroke="#333" stroke-width="2" rx="10"/>
    <text x="400" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Transformer Block N</text>
    
    <!-- Multi-Head Attention -->
    <rect x="120" y="250" width="180" height="25" fill="#fff" stroke="#333" stroke-width="1" rx="3"/>
    <text x="210" y="267" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">Multi-Head Attention</text>
    
    <!-- Feed Forward -->
    <rect x="320" y="250" width="180" height="25" fill="#fff" stroke="#333" stroke-width="1" rx="3"/>
    <text x="410" y="267" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">Feed Forward Network</text>
    
    <!-- Layer Norm -->
    <rect x="520" y="250" width="160" height="25" fill="#fff" stroke="#333" stroke-width="1" rx="3"/>
    <text x="600" y="267" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">Layer Normalization</text>
  </g>
  
  <!-- Dots indicating more layers -->
  <circle cx="400" cy="190" r="3" fill="#333"/>
  <circle cx="400" cy="200" r="3" fill="#333"/>
  <circle cx="400" cy="210" r="3" fill="#333"/>
  
  <!-- Output Layer -->
  <rect x="50" y="120" width="700" height="40" fill="#fff3e0" stroke="#f57c00" stroke-width="2" rx="5"/>
  <text x="400" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f57c00">Language Model Head (Linear + Softmax)</text>
  
  <!-- Output -->
  <rect x="300" y="80" width="200" height="30" fill="#e8f5e8" stroke="#4caf50" stroke-width="2" rx="5"/>
  <text x="400" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4caf50">Generated Text</text>
  
  <!-- Arrows -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
  
  <!-- Flow arrows -->
  <path d="M 400 520 L 400 500" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 400 420 L 400 400" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 400 320 L 400 300" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 400 170 L 400 160" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 400 120 L 400 110" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Attention mechanism detail -->
  <g id="attention-detail">
    <rect x="30" y="90" width="200" height="120" fill="#f0f0f0" stroke="#666" stroke-width="1" rx="5" opacity="0.9"/>
    <text x="130" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Attention Mechanism</text>
    
    <!-- Q, K, V boxes -->
    <rect x="50" y="120" width="30" height="20" fill="#ff9800" rx="2"/>
    <text x="65" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Q</text>
    
    <rect x="90" y="120" width="30" height="20" fill="#ff9800" rx="2"/>
    <text x="105" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">K</text>
    
    <rect x="130" y="120" width="30" height="20" fill="#ff9800" rx="2"/>
    <text x="145" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">V</text>
    
    <!-- Formula -->
    <text x="130" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Attention(Q,K,V) =</text>
    <text x="130" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">softmax(QK^T/√d_k)V</text>
    
    <!-- Output -->
    <rect x="90" y="185" width="80" height="20" fill="#4caf50" rx="2"/>
    <text x="130" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Attention Output</text>
  </g>
</svg>