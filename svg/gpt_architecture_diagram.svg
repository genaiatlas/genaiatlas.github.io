<svg viewBox="0 0 800 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="900" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="35" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    GPT Architecture (Generative Pretrained Transformer)
  </text>
  
  <!-- Input Layer -->
  <g transform="translate(200, 80)">
    <rect x="0" y="0" width="400" height="60" fill="#3498db" stroke="#2980b9" stroke-width="2" rx="5"/>
    <text x="200" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
      Input Layer
    </text>
    <text x="200" y="45" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
      Token Embeddings + Positional Encoding
    </text>
  </g>
  
  <line x1="400" y1="140" x2="400" y2="170" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Transformer Block 1 -->
  <g transform="translate(150, 170)">
    <rect x="0" y="0" width="500" height="150" fill="white" stroke="#27ae60" stroke-width="3" rx="8"/>
    <text x="250" y="25" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#27ae60">
      Transformer Block × N
    </text>
    
    <!-- Multi-Head Attention -->
    <rect x="20" y="40" width="210" height="90" fill="#d5f4e6" stroke="#27ae60" stroke-width="2" rx="5"/>
    <text x="125" y="60" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#27ae60">
      Multi-Head Self-Attention
    </text>
    <text x="125" y="80" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#34495e">
      Q, K, V matrices
    </text>
    <text x="125" y="95" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#34495e">
      Attention(Q,K,V) =
    </text>
    <text x="125" y="110" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#34495e">
      softmax(QK^T/√d_k)V
    </text>
    
    <!-- Feed Forward -->
    <rect x="270" y="40" width="210" height="90" fill="#fef5e7" stroke="#f39c12" stroke-width="2" rx="5"/>
    <text x="375" y="60" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#f39c12">
      Feed-Forward Network
    </text>
    <text x="375" y="80" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#34495e">
      FFN(x) = max(0, xW₁ + b₁)W₂ + b₂
    </text>
    <text x="375" y="100" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#34495e">
      + Layer Normalization
    </text>
    <text x="375" y="115" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#34495e">
      + Residual Connections
    </text>
  </g>
  
  <line x1="400" y1="320" x2="400" y2="350" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Output Layer -->
  <g transform="translate(200, 350)">
    <rect x="0" y="0" width="400" height="60" fill="#9b59b6" stroke="#8e44ad" stroke-width="2" rx="5"/>
    <text x="200" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
      Output Layer
    </text>
    <text x="200" y="45" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
      Linear Projection + Softmax → Next Token Prediction
    </text>
  </g>
  
  <!-- Key Features Panel -->
  <g transform="translate(100, 450)">
    <rect x="0" y="0" width="600" height="200" fill="white" stroke="#3498db" stroke-width="2" rx="8"/>
    <text x="300" y="30" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#3498db">
      Key Features
    </text>
    
    <g transform="translate(30, 50)">
      <circle cx="5" cy="5" r="4" fill="#27ae60"/>
      <text x="20" y="9" font-family="Arial, sans-serif" font-size="11" fill="#34495e">
        <tspan font-weight="bold">Autoregressive Generation:</tspan> Predicts one token at a time
      </text>
      
      <circle cx="5" cy="35" r="4" fill="#27ae60"/>
      <text x="20" y="39" font-family="Arial, sans-serif" font-size="11" fill="#34495e">
        <tspan font-weight="bold">Contextual Understanding:</tspan> Self-attention captures dependencies
      </text>
      
      <circle cx="5" cy="65" r="4" fill="#27ae60"/>
      <text x="20" y="69" font-family="Arial, sans-serif" font-size="11" fill="#34495e">
        <tspan font-weight="bold">Parallelization:</tspan> Efficient training on large datasets
      </text>
      
      <circle cx="5" cy="95" r="4" fill="#27ae60"/>
      <text x="20" y="99" font-family="Arial, sans-serif" font-size="11" fill="#34495e">
        <tspan font-weight="bold">Transfer Learning:</tspan> Pre-train on large corpus, fine-tune for tasks
      </text>
      
      <circle cx="5" cy="125" r="4" fill="#27ae60"/>
      <text x="20" y="129" font-family="Arial, sans-serif" font-size="11" fill="#34495e">
        <tspan font-weight="bold">Scalability:</tspan> Performance improves with model size
      </text>
    </g>
  </g>
  
  <!-- AI Agent Applications -->
  <g transform="translate(100, 680)">
    <rect x="0" y="0" width="600" height="180" fill="#ecf0f1" stroke="#95a5a6" stroke-width="2" rx="8"/>
    <text x="300" y="30" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      AI Agent Applications
    </text>
    
    <g transform="translate(0, 50)">
      <rect x="20" y="0" width="270" height="50" fill="#e8f8f5" stroke="#27ae60" stroke-width="2" rx="5"/>
      <text x="155" y="20" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#27ae60">
        Task Planning
      </text>
      <text x="155" y="37" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#34495e">
        Break down complex objectives
      </text>
      
      <rect x="310" y="0" width="270" height="50" fill="#fef5e7" stroke="#f39c12" stroke-width="2" rx="5"/>
      <text x="445" y="20" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#f39c12">
        Code Generation
      </text>
      <text x="445" y="37" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#34495e">
        Automate software development
      </text>
    </g>
    
    <g transform="translate(0, 110)">
      <rect x="20" y="0" width="270" height="50" fill="#ebf5fb" stroke="#3498db" stroke-width="2" rx="5"/>
      <text x="155" y="20" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#3498db">
        Natural Language Interface
      </text>
      <text x="155" y="37" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#34495e">
        Human-like communication
      </text>
      
      <rect x="310" y="0" width="270" height="50" fill="#f4ecf7" stroke="#9b59b6" stroke-width="2" rx="5"/>
      <text x="445" y="20" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#9b59b6">
        Decision Making
      </text>
      <text x="445" y="37" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#34495e">
        Evaluate and select actions
      </text>
    </g>
  </g>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#34495e"/>
    </marker>
  </defs>
</svg>