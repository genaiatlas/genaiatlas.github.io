<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title-text { font-family: 'Arial', sans-serif; font-size: 24px; font-weight: bold; fill: #2c3e50; }
      .subtitle-text { font-family: 'Arial', sans-serif; font-size: 18px; font-weight: bold; fill: #34495e; }
      .label-text { font-family: 'Arial', sans-serif; font-size: 14px; fill: #34495e; }
      .small-text { font-family: 'Arial', sans-serif; font-size: 12px; fill: #7f8c8d; }
      .equation-text { font-family: 'Times New Roman', serif; font-size: 16px; fill: #2c3e50; }
      .axis-line { stroke: #2c3e50; stroke-width: 2; }
      .grid-line { stroke: #ecf0f1; stroke-width: 1; }
      .data-point { fill: #3498db; stroke: #2980b9; stroke-width: 2; }
      .regression-line { stroke: #28a745; stroke-width: 3; }
      .predicted-point { fill: #28a745; stroke: #1e7e34; stroke-width: 1; }
      .residual-line { stroke: #e74c3c; stroke-width: 2; stroke-dasharray: 3,3; }
      .residual-square { fill: rgba(231, 76, 60, 0.2); stroke: #e74c3c; stroke-width: 1; }
      .formula-box { fill: #e3f2fd; stroke: #2196f3; stroke-width: 2; rx: 8; }
      .highlight-box { fill: #f8f9fa; stroke: #6c757d; stroke-width: 1; rx: 5; }
    </style>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title-text">Residual Sum of Squares (RSS) Visualization</text>
  
  <!-- Main plot -->
  <g transform="translate(80, 70)">
    <text x="200" y="0" text-anchor="middle" class="subtitle-text">Residuals from Regression Line</text>
    
    <!-- Coordinate system -->
    <g transform="translate(50, 30)">
      <!-- Grid -->
      <line x1="0" y1="50" x2="350" y2="50" class="grid-line"/>
      <line x1="0" y1="100" x2="350" y2="100" class="grid-line"/>
      <line x1="0" y1="150" x2="350" y2="150" class="grid-line"/>
      <line x1="0" y1="200" x2="350" y2="200" class="grid-line"/>
      <line x1="0" y1="250" x2="350" y2="250" class="grid-line"/>
      <line x1="0" y1="300" x2="350" y2="300" class="grid-line"/>
      
      <line x1="70" y1="0" x2="70" y2="350" class="grid-line"/>
      <line x1="140" y1="0" x2="140" y2="350" class="grid-line"/>
      <line x1="210" y1="0" x2="210" y2="350" class="grid-line"/>
      <line x1="280" y1="0" x2="280" y2="350" class="grid-line"/>
      
      <!-- Axes -->
      <line x1="0" y1="350" x2="350" y2="350" class="axis-line"/>
      <line x1="0" y1="0" x2="0" y2="350" class="axis-line"/>
      
      <!-- Regression line -->
      <line x1="20" y1="280" x2="330" y2="70" class="regression-line"/>
      
      <!-- Data points with predictions and residuals -->
      <!-- Point 1 -->
      <circle cx="50" cy="260" r="4" class="data-point"/>
      <circle cx="50" cy="248" r="2" class="predicted-point"/>
      <line x1="50" y1="260" x2="50" y2="248" class="residual-line"/>
      <rect x="45" y="248" width="10" height="12" class="residual-square"/>
      <text x="35" y="235" class="small-text">r₁</text>
      
      <!-- Point 2 -->
      <circle cx="90" cy="210" r="4" class="data-point"/>
      <circle cx="90" cy="225" r="2" class="predicted-point"/>
      <line x1="90" y1="210" x2="90" y2="225" class="residual-line"/>
      <rect x="85" y="210" width="10" height="15" class="residual-square"/>
      <text x="75" y="200" class="small-text">r₂</text>
      
      <!-- Point 3 -->
      <circle cx="130" cy="180" r="4" class="data-point"/>
      <circle cx="130" cy="202" r="2" class="predicted-point"/>
      <line x1="130" y1="180" x2="130" y2="202" class="residual-line"/>
      <rect x="125" y="180" width="10" height="22" class="residual-square"/>
      <text x="115" y="170" class="small-text">r₃</text>
      
      <!-- Point 4 -->
      <circle cx="170" cy="160" r="4" class="data-point"/>
      <circle cx="170" cy="179" r="2" class="predicted-point"/>
      <line x1="170" y1="160" x2="170" y2="179" class="residual-line"/>
      <rect x="165" y="160" width="10" height="19" class="residual-square"/>
      <text x="155" y="150" class="small-text">r₄</text>
      
      <!-- Point 5 -->
      <circle cx="210" cy="140" r="4" class="data-point"/>
      <circle cx="210" cy="156" r="2" class="predicted-point"/>
      <line x1="210" y1="140" x2="210" y2="156" class="residual-line"/>
      <rect x="205" y="140" width="10" height="16" class="residual-square"/>
      <text x="195" y="130" class="small-text">r₅</text>
      
      <!-- Point 6 -->
      <circle cx="250" cy="120" r="4" class="data-point"/>
      <circle cx="250" cy="133" r="2" class="predicted-point"/>
      <line x1="250" y1="120" x2="250" y2="133" class="residual-line"/>
      <rect x="245" y="120" width="10" height="13" class="residual-square"/>
      <text x="235" y="110" class="small-text">r₆</text>
      
      <!-- Point 7 -->
      <circle cx="290" cy="100" r="4" class="data-point"/>
      <circle cx="290" cy="110" r="2" class="predicted-point"/>
      <line x1="290" y1="100" x2="290" y2="110" class="residual-line"/>
      <rect x="285" y="100" width="10" height="10" class="residual-square"/>
      <text x="275" y="90" class="small-text">r₇</text>
      
      <!-- Axis labels -->
      <text x="175" y="375" text-anchor="middle" class="label-text">X (Independent Variable)</text>
      <text x="-25" y="175" text-anchor="middle" class="label-text" transform="rotate(-90, -25, 175)">Y (Dependent Variable)</text>
      
      <!-- Regression line label -->
      <text x="340" y="65" class="label-text" fill="#1e7e34">Ŷ = θᵀX</text>
      
      <!-- Legend -->
      <g transform="translate(10, 10)">
        <circle cx="0" cy="0" r="3" class="data-point"/>
        <text x="10" y="4" class="small-text">Observed (Yᵢ)</text>
        
        <circle cx="0" cy="18" r="2" class="predicted-point"/>
        <text x="10" y="22" class="small-text">Predicted (Ŷᵢ)</text>
        
        <line x1="0" y1="30" x2="20" y2="30" class="regression-line"/>
        <text x="25" y="34" class="small-text">Regression line</text>
        
        <line x1="0" y1="45" x2="15" y2="45" class="residual-line"/>
        <text x="20" y="49" class="small-text">Residuals</text>
        
        <rect x="0" y="55" width="8" height="8" class="residual-square"/>
        <text x="15" y="63" class="small-text">Squared residuals</text>
      </g>
    </g>
  </g>
  
  <!-- RSS Formula -->
  <g transform="translate(50, 450)">
    <rect x="0" y="0" width="700" height="120" class="formula-box"/>
    <text x="350" y="30" text-anchor="middle" class="subtitle-text" fill="#1976d2">Residual Sum of Squares Formula</text>
    
    <text x="350" y="60" text-anchor="middle" class="equation-text">RSS = Σᵢ₌₁ⁿ (Yᵢ - Ŷᵢ)² = Σᵢ₌₁ⁿ (Yᵢ - θᵀXᵢ)²</text>
    
    <text x="50" y="85" class="label-text" fill="#1976d2">Where:</text>
    <text x="70" y="100" class="small-text">• Yᵢ = observed value for observation i</text>
    <text x="320" y="100" class="small-text">• Ŷᵢ = predicted value from regression</text>
    <text x="570" y="100" class="small-text">• rᵢ = Yᵢ - Ŷᵢ (residual)</text>
  </g>
  
  <!-- Key Properties -->
  <g transform="translate(450, 70)">
    <rect x="0" y="0" width="300" height="200" class="highlight-box"/>
    <text x="150" y="25" text-anchor="middle" class="subtitle-text">RSS Properties</text>
    
    <text x="20" y="50" class="label-text">🎯 Optimization target</text>
    <text x="30" y="70" class="small-text">• Linear regression minimizes RSS</text>
    <text x="30" y="85" class="small-text">• Best fit = minimum RSS</text>
    
    <text x="20" y="110" class="label-text">📏 Always non-negative</text>
    <text x="30" y="130" class="small-text">• RSS ≥ 0 (squared terms)</text>
    <text x="30" y="145" class="small-text">• RSS = 0 for perfect fit</text>
    
    <text x="20" y="170" class="label-text">📊 Bounded by TSS</text>
    <text x="30" y="190" class="small-text">• RSS ≤ TSS always holds</text>
  </g>
  
  <!-- Model Quality Interpretation -->
  <g transform="translate(450, 290)">
    <rect x="0" y="0" width="300" height="130" class="highlight-box"/>
    <text x="150" y="25" text-anchor="middle" class="subtitle-text">Model Quality</text>
    
    <text x="20" y="50" class="small-text">Smaller RSS = Better Fit</text>
    <text x="20" y="70" class="small-text">• Less unexplained variation</text>
    <text x="20" y="85" class="small-text">• Predictions closer to reality</text>
    <text x="20" y="100" class="small-text">• Higher R² value</text>
    
    <text x="20" y="120" class="small-text">RSS measures what the model</text>
    <text x="20" y="135" class="small-text">couldn't explain</text>
  </g>
</svg>