<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="type1Gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b6b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ff6b6b" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="type2Gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ecdc4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#4ecdc4" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#00000030"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#2c3e50">
    Type 1 vs Type 2 Classification Errors
  </text>

  <!-- Type 1 Error Section -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="300" height="160" rx="10" fill="url(#type1Gradient)" stroke="#ff6b6b" stroke-width="3" filter="url(#shadow)"/>
    
    <text x="150" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#c0392b">
      TYPE 1 ERROR
    </text>
    <text x="150" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#c0392b">
      (False Positive)
    </text>
    
    <line x1="20" y1="75" x2="280" y2="75" stroke="#c0392b" stroke-width="2"/>
    
    <text x="150" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
      Reality: NEGATIVE
    </text>
    <text x="150" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
      Prediction: POSITIVE
    </text>
    
    <text x="150" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">
      "Crying Wolf" - False Alarm
    </text>
  </g>

  <!-- Type 2 Error Section -->
  <g transform="translate(450, 80)">
    <rect x="0" y="0" width="300" height="160" rx="10" fill="url(#type2Gradient)" stroke="#4ecdc4" stroke-width="3" filter="url(#shadow)"/>
    
    <text x="150" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#16a085">
      TYPE 2 ERROR
    </text>
    <text x="150" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#16a085">
      (False Negative)
    </text>
    
    <line x1="20" y1="75" x2="280" y2="75" stroke="#16a085" stroke-width="2"/>
    
    <text x="150" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
      Reality: POSITIVE
    </text>
    <text x="150" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
      Prediction: NEGATIVE
    </text>
    
    <text x="150" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">
      "Missing the Target" - Oversight
    </text>
  </g>

  <!-- Examples Section -->
  <g transform="translate(50, 270)">
    <text x="350" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#2c3e50">
      Real-World Examples
    </text>
    
    <!-- Medical Example -->
    <g transform="translate(0, 40)">
      <circle cx="15" cy="15" r="8" fill="#3498db"/>
      <text x="35" y="20" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">
        Medical Diagnosis
      </text>
      
      <text x="50" y="45" font-family="Arial, sans-serif" font-size="13" fill="#c0392b">
        Type 1: Healthy patient treated for heart attack
      </text>
      <text x="50" y="65" font-family="Arial, sans-serif" font-size="13" fill="#16a085">
        Type 2: Heart attack patient not receiving treatment
      </text>
    </g>
    
    <!-- Security Example -->
    <g transform="translate(0, 90)">
      <circle cx="15" cy="15" r="8" fill="#e74c3c"/>
      <text x="35" y="20" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">
        Security Screening
      </text>
      
      <text x="50" y="45" font-family="Arial, sans-serif" font-size="13" fill="#c0392b">
        Type 1: Innocent person flagged as threat
      </text>
      <text x="50" y="65" font-family="Arial, sans-serif" font-size="13" fill="#16a085">
        Type 2: Actual threat passes through undetected
      </text>
    </g>
    
    <!-- Fraud Example -->
    <g transform="translate(400, 40)">
      <circle cx="15" cy="15" r="8" fill="#f39c12"/>
      <text x="35" y="20" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">
        Fraud Detection
      </text>
      
      <text x="50" y="45" font-family="Arial, sans-serif" font-size="13" fill="#c0392b">
        Type 1: Legitimate transaction blocked
      </text>
      <text x="50" y="65" font-family="Arial, sans-serif" font-size="13" fill="#16a085">
        Type 2: Fraudulent transaction approved
      </text>
    </g>

    <!-- Spam Example -->
    <g transform="translate(400, 90)">
      <circle cx="15" cy="15" r="8" fill="#9b59b6"/>
      <text x="35" y="20" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">
        Spam Detection
      </text>
      
      <text x="50" y="45" font-family="Arial, sans-serif" font-size="13" fill="#c0392b">
        Type 1: Important email marked as spam
      </text>
      <text x="50" y="65" font-family="Arial, sans-serif" font-size="13" fill="#16a085">
        Type 2: Spam email reaches inbox
      </text>
    </g>
  </g>

  <!-- Key Insight -->
  <g transform="translate(100, 420)">
    <rect x="0" y="0" width="600" height="60" rx="5" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2"/>
    <text x="300" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">
      🔑 Key Insight: There's always a trade-off between Type 1 and Type 2 errors
    </text>
    <text x="300" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#7f8c8d">
      Reducing one type of error typically increases the other - balance depends on context!
    </text>
  </g>
</svg>