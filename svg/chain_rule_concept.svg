<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lossGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ee5a24;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="paramGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4834d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#686de0;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">
    Chain Rule: Gradient as Direction of Steepest Ascent
  </text>
  
  <!-- Loss Landscape (3D-like visualization) -->
  <g transform="translate(50, 60)">
    <!-- Mountain-like loss surface -->
    <ellipse cx="150" cy="120" rx="120" ry="80" fill="url(#lossGradient)" opacity="0.7"/>
    <ellipse cx="140" cy="110" rx="100" ry="65" fill="url(#lossGradient)" opacity="0.8"/>
    <ellipse cx="130" cy="100" rx="80" ry="50" fill="url(#lossGradient)" opacity="0.9"/>
    <ellipse cx="120" cy="90" rx="60" ry="35" fill="url(#lossGradient)"/>
    
    <!-- Parameter space axes -->
    <line x1="20" y1="220" x2="280" y2="220" stroke="#34495e" stroke-width="2"/>
    <line x1="20" y1="220" x2="20" y2="60" stroke="#34495e" stroke-width="2"/>
    
    <!-- Axis labels -->
    <text x="150" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">
      Parameter θ₁
    </text>
    <text x="10" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50" transform="rotate(-90, 10, 140)">
      Parameter θ₂
    </text>
    
    <!-- Current point -->
    <circle cx="180" cy="160" r="6" fill="#e74c3c" filter="url(#shadow)"/>
    <text x="190" y="165" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Current Point</text>
    
    <!-- Gradient vector -->
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#27ae60"/>
      </marker>
    </defs>
    <line x1="180" y1="160" x2="230" y2="120" stroke="#27ae60" stroke-width="3" marker-end="url(#arrowhead)"/>
    <text x="210" y="135" font-family="Arial, sans-serif" font-size="11" fill="#27ae60" font-weight="bold">∇L (gradient)</text>
    <text x="210" y="147" font-family="Arial, sans-serif" font-size="10" fill="#27ae60">Direction of steepest ascent</text>
    
    <!-- Gradient descent direction -->
    <line x1="180" y1="160" x2="130" y2="200" stroke="#c0392b" stroke-width="3" marker-end="url(#arrowhead2)" stroke-dasharray="5,5"/>
    <defs>
      <marker id="arrowhead2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#c0392b"/>
      </marker>
    </defs>
    <text x="140" y="185" font-family="Arial, sans-serif" font-size="11" fill="#c0392b" font-weight="bold">-∇L</text>
    <text x="120" y="197" font-family="Arial, sans-serif" font-size="10" fill="#c0392b">Gradient descent</text>
  </g>
  
  <!-- Chain rule formula visualization -->
  <g transform="translate(400, 60)">
    <rect x="0" y="0" width="350" height="280" fill="white" stroke="#bdc3c7" stroke-width="2" rx="10" filter="url(#shadow)"/>
    
    <!-- Formula title -->
    <text x="175" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
      Chain Rule Decomposition
    </text>
    
    <!-- Main formula -->
    <text x="175" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">
      ∂L/∂w = (∂L/∂z) × (∂z/∂a) × (∂a/∂z') × (∂z'/∂w)
    </text>
    
    <!-- Component boxes -->
    <g transform="translate(20, 70)">
      <!-- Error term -->
      <rect x="0" y="0" width="70" height="40" fill="#e74c3c" opacity="0.2" stroke="#e74c3c" rx="5"/>
      <text x="35" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50" font-weight="bold">∂L/∂z</text>
      <text x="35" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">Error</text>
      <text x="35" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">Term</text>
      
      <!-- Output weight -->
      <rect x="85" y="0" width="70" height="40" fill="#f39c12" opacity="0.2" stroke="#f39c12" rx="5"/>
      <text x="120" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50" font-weight="bold">∂z/∂a</text>
      <text x="120" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">Output</text>
      <text x="120" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">Weight</text>
      
      <!-- Activation derivative -->
      <rect x="170" y="0" width="70" height="40" fill="#9b59b6" opacity="0.2" stroke="#9b59b6" rx="5"/>
      <text x="205" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50" font-weight="bold">∂a/∂z'</text>
      <text x="205" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">Activation</text>
      <text x="205" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">Function</text>
      
      <!-- Input connection -->
      <rect x="255" y="0" width="70" height="40" fill="#27ae60" opacity="0.2" stroke="#27ae60" rx="5"/>
      <text x="290" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50" font-weight="bold">∂z'/∂w</text>
      <text x="290" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">Input</text>
      <text x="290" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">Value</text>
    </g>
    
    <!-- Arrows between components -->
    <g transform="translate(20, 90)">
      <text x="72" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#34495e">×</text>
      <text x="157" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#34495e">×</text>
      <text x="242" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#34495e">×</text>
    </g>
    
    <!-- Key insights -->
    <g transform="translate(20, 140)">
      <text x="0" y="15" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50" font-weight="bold">Key Insights:</text>
      <text x="0" y="35" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Zero error → Zero gradient</text>
      <text x="0" y="50" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Inactive ReLU → Zero gradient</text>
      <text x="0" y="65" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Each layer modulates signal</text>
      <text x="0" y="80" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Gradient = Error × Connections</text>
    </g>
    
    <!-- High-dimensional space note -->
    <g transform="translate(20, 240)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d" font-style="italic">
        * In practice: High-dimensional parameter space (thousands to millions of dimensions)
      </text>
    </g>
  </g>
</svg>