<svg viewBox="0 0 800 550" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: bold; }
      .section-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 600; }
      .label-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: 600; }
      .desc-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; }
      .math-text { font-family: 'Times New Roman', serif, font-size: 12px; }
      .small-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10px; }
      .gradient-bg { fill: url(#bgGradient); }
      .network-card { fill: white; stroke: #2196F3; stroke-width: 2; rx: 8; ry: 8; }
      .adversarial-card { fill: #ffebee; stroke: #f44336; stroke-width: 2; rx: 8; ry: 8; }
      .arrow { stroke: #2196F3; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .transfer-arrow { stroke: #ff5722; stroke-width: 3; fill: none; marker-end: url(#transferhead); }
      .attack-arrow { stroke: #f44336; stroke-width: 2; fill: none; marker-end: url(#attackhead); stroke-dasharray: 5,3; }
    </style>
    <defs>
      <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
      </linearGradient>
      <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#2196F3" />
      </marker>
      <marker id="transferhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
        <polygon points="0 0, 10 4, 0 8" fill="#ff5722" />
      </marker>
      <marker id="attackhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#f44336" />
      </marker>
      
      <!-- Neural network layer pattern -->
      <pattern id="layerPattern" x="0" y="0" width="20" height="15" patternUnits="userSpaceOnUse">
        <circle cx="5" cy="7" r="2" fill="#2196F3" opacity="0.6"/>
        <circle cx="15" cy="7" r="2" fill="#2196F3" opacity="0.6"/>
      </pattern>
    </defs>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="550" class="gradient-bg"/>
  
  <!-- Title -->
  <text x="400" y="25" text-anchor="middle" class="title-text" fill="#1565C0">Cross-Network Transferability of Adversarial Examples</text>

  <!-- Step 1: Attacker's Network -->
  <text x="50" y="60" class="section-text" fill="#2E7D32">Step 1: Train Your Own Network</text>
  
  <rect x="50" y="80" width="200" height="120" class="network-card"/>
  <text x="150" y="100" text-anchor="middle" class="label-text" fill="#1976D2">Attacker's Network A</text>
  
  <!-- Neural network visualization -->
  <g>
    <!-- Input layer -->
    <circle cx="80" cy="125" r="4" fill="#4CAF50"/>
    <circle cx="80" cy="140" r="4" fill="#4CAF50"/>
    <circle cx="80" cy="155" r="4" fill="#4CAF50"/>
    
    <!-- Hidden layer 1 -->
    <circle cx="120" cy="115" r="4" fill="#2196F3"/>
    <circle cx="120" cy="130" r="4" fill="#2196F3"/>
    <circle cx="120" cy="145" r="4" fill="#2196F3"/>
    <circle cx="120" cy="160" r="4" fill="#2196F3"/>
    
    <!-- Hidden layer 2 -->
    <circle cx="160" cy="120" r="4" fill="#2196F3"/>
    <circle cx="160" cy="135" r="4" fill="#2196F3"/>
    <circle cx="160" cy="150" r="4" fill="#2196F3"/>
    
    <!-- Output layer -->
    <circle cx="200" cy="140" r="4" fill="#FF5722"/>
    
    <!-- Connections (simplified) -->
    <line x1="84" y1="125" x2="116" y2="115" stroke="#ccc" stroke-width="1"/>
    <line x1="84" y1="140" x2="116" y2="130" stroke="#ccc" stroke-width="1"/>
    <line x1="124" y1="130" x2="156" y2="135" stroke="#ccc" stroke-width="1"/>
    <line x1="164" y1="135" x2="196" y2="140" stroke="#ccc" stroke-width="1"/>
  </g>
  
  <text x="150" y="180" text-anchor="middle" class="desc-text" fill="#388E3C">Architecture: ResNet-18</text>
  <text x="150" y="195" text-anchor="middle" class="desc-text" fill="#388E3C">Dataset: ImageNet subset</text>

  <!-- Step 2: Generate Adversarial Examples -->
  <text x="300" y="60" class="section-text" fill="#E65100">Step 2: Create Adversarial Examples</text>
  
  <rect x="300" y="80" width="200" height="120" class="adversarial-card"/>
  <text x="400" y="100" text-anchor="middle" class="label-text" fill="#D32F2F">Adversarial Generation</text>
  
  <!-- Original image -->
  <rect x="320" y="115" width="40" height="30" fill="#4CAF50" stroke="#388E3C"/>
  <text x="340" y="135" text-anchor="middle" class="small-text" fill="white">Dog</text>
  
  <!-- Plus symbol -->
  <text x="380" y="135" text-anchor="middle" class="label-text" fill="#FF5722">+</text>
  
  <!-- Noise -->
  <rect x="400" y="115" width="40" height="30" fill="#f0f0f0" stroke="#ccc"/>
  <circle cx="410" cy="125" r="1" fill="#ff0000" opacity="0.6"/>
  <circle cx="420" cy="130" r="1" fill="#0000ff" opacity="0.6"/>
  <circle cx="430" cy="125" r="1" fill="#ff8800" opacity="0.6"/>
  <circle cx="415" cy="135" r="1" fill="#8800ff" opacity="0.6"/>
  <circle cx="425" cy="140" r="1" fill="#00ff88" opacity="0.6"/>
  
  <!-- Equals symbol -->
  <text x="460" y="135" text-anchor="middle" class="label-text" fill="#4CAF50">=</text>
  
  <!-- Adversarial result -->
  <rect x="470" y="115" width="25" height="30" fill="#F44336" stroke="#D32F2F"/>
  <text x="482" y="135" text-anchor="middle" class="small-text" fill="white">Bird</text>
  
  <text x="400" y="165" text-anchor="middle" class="desc-text" fill="#D32F2F">Method: FGSM Attack</text>
  <text x="400" y="180" text-anchor="middle" class="desc-text" fill="#D32F2F">Success Rate: 89%</text>
  <text x="400" y="195" text-anchor="middle" class="math-text" fill="#D32F2F">R = ε·sign(∇ₓJ(θ,X,y))</text>

  <!-- Arrow from Step 1 to Step 2 -->
  <path d="M260 140 L290 140" class="arrow"/>
  <text x="275" y="135" text-anchor="middle" class="small-text" fill="#2196F3">Train</text>

  <!-- Step 3: Target Networks -->
  <text x="400" y="250" text-anchor="middle" class="section-text" fill="#7B1FA2">Step 3: Transfer to Different Networks</text>
  
  <!-- Target Network 1 -->
  <rect x="50" y="280" width="150" height="100" class="network-card"/>
  <text x="125" y="300" text-anchor="middle" class="label-text" fill="#1976D2">Target Network B</text>
  <text x="125" y="315" text-anchor="middle" class="desc-text" fill="#1976D2">VGG-16</text>
  <!-- Simple network representation -->
  <rect x="70" y="325" width="110" height="15" fill="url(#layerPattern)"/>
  <rect x="70" y="345" width="110" height="15" fill="url(#layerPattern)"/>
  <text x="125" y="375" text-anchor="middle" class="small-text" fill="#4CAF50">✓ Transfer Success: 73%</text>

  <!-- Target Network 2 -->
  <rect x="220" y="280" width="150" height="100" class="network-card"/>
  <text x="295" y="300" text-anchor="middle" class="label-text" fill="#1976D2">Target Network C</text>
  <text x="295" y="315" text-anchor="middle" class="desc-text" fill="#1976D2">DenseNet-121</text>
  <rect x="240" y="325" width="110" height="15" fill="url(#layerPattern)"/>
  <rect x="240" y="345" width="110" height="15" fill="url(#layerPattern)"/>
  <text x="295" y="375" text-anchor="middle" class="small-text" fill="#4CAF50">✓ Transfer Success: 68%</text>

  <!-- Target Network 3 -->
  <rect x="390" y="280" width="150" height="100" class="network-card"/>
  <text x="465" y="300" text-anchor="middle" class="label-text" fill="#1976D2">Target Network D</text>
  <text x="465" y="315" text-anchor="middle" class="desc-text" fill="#1976D2">Inception-v3</text>
  <rect x="410" y="325" width="110" height="15" fill="url(#layerPattern)"/>
  <rect x="410" y="345" width="110" height="15" fill="url(#layerPattern)"/>
  <text x="465" y="375" text-anchor="middle" class="small-text" fill="#4CAF50">✓ Transfer Success: 81%</text>

  <!-- Target Network 4 -->
  <rect x="560" y="280" width="150" height="100" class="network-card"/>
  <text x="635" y="300" text-anchor="middle" class="label-text" fill="#1976D2">Target Network E</text>
  <text x="635" y="315" text-anchor="middle" class="desc-text" fill="#1976D2">MobileNet-v2</text>
  <rect x="580" y="325" width="110" height="15" fill="url(#layerPattern)"/>
  <rect x="580" y="345" width="110" height="15" fill="url(#layerPattern)"/>
  <text x="635" y="375" text-anchor="middle" class="small-text" fill="#FF9800">~ Transfer Success: 45%</text>

  <!-- Transfer arrows -->
  <path d="M400 210 Q200 240 125 270" class="transfer-arrow"/>
  <path d="M400 210 Q350 240 295 270" class="transfer-arrow"/>
  <path d="M400 210 L465 270" class="transfer-arrow"/>
  <path d="M400 210 Q550 240 635 270" class="transfer-arrow"/>
  
  <text x="250" y="240" text-anchor="middle" class="desc-text" fill="#FF5722">Same adversarial examples</text>
  <text x="550" y="240" text-anchor="middle" class="desc-text" fill="#FF5722">work across networks!</text>

  <!-- Key Insights Box -->
  <rect x="50" y="410" width="700" height="120" fill="#f8f9fa" stroke="#6c757d" stroke-width="1" rx="8"/>
  <text x="400" y="435" text-anchor="middle" class="label-text" fill="#495057">Key Transferability Insights</text>
  
  <!-- Insight boxes -->
  <rect x="70" y="450" width="160" height="65" fill="#e8f5e8" stroke="#4CAF50" stroke-width="1" rx="4"/>
  <text x="150" y="470" text-anchor="middle" class="desc-text" fill="#2E7D32">Universal Patterns</text>
  <text x="80" y="485" class="small-text" fill="#388E3C">Networks learn similar</text>
  <text x="80" y="498" class="small-text" fill="#388E3C">vulnerable features</text>
  <text x="80" y="511" class="small-text" fill="#388E3C">in high-dim space</text>

  <rect x="250" y="450" width="160" height="65" fill="#fff3e0" stroke="#FF9800" stroke-width="1" rx="4"/>
  <text x="330" y="470" text-anchor="middle" class="desc-text" fill="#E65100">Architecture Impact</text>
  <text x="260" y="485" class="small-text" fill="#F57C00">Similar architectures</text>
  <text x="260" y="498" class="small-text" fill="#F57C00">show higher transfer</text>
  <text x="260" y="511" class="small-text" fill="#F57C00">rates (up to 90%)</text>

  <rect x="430" y="450" width="160" height="65" fill="#ffebee" stroke="#F44336" stroke-width="1" rx="4"/>
  <text x="510" y="470" text-anchor="middle" class="desc-text" fill="#C62828">Security Implications</text>
  <text x="440" y="485" class="small-text" fill="#D32F2F">Black-box attacks</text>
  <text x="440" y="498" class="small-text" fill="#D32F2F">without access to</text>
  <text x="440" y="511" class="small-text" fill="#D32F2F">target parameters</text>

  <rect x="610" y="450" width="130" height="65" fill="#e3f2fd" stroke="#2196F3" stroke-width="1" rx="4"/>
  <text x="675" y="470" text-anchor="middle" class="desc-text" fill="#1565C0">Defense Challenge</text>
  <text x="620" y="485" class="small-text" fill="#1976D2">Obscurity doesn't</text>
  <text x="620" y="498" class="small-text" fill="#1976D2">provide security</text>
  <text x="620" y="511" class="small-text" fill="#1976D2">against this attack</text>
</svg>