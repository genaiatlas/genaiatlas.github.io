<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">
    Common Problems in Linear Regression
  </text>
  
  <!-- Central Model Box -->
  <rect x="320" y="80" width="160" height="60" fill="#e3f2fd" stroke="#1976d2" stroke-width="3" rx="10"/>
  <text x="400" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1976d2">
    Linear Regression
  </text>
  <text x="400" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">
    Y = Xθ + ε
  </text>
  
  <!-- Problem Category 1: Mathematical Issues -->
  <rect x="50" y="200" width="300" height="150" fill="#ffebee" stroke="#d32f2f" stroke-width="2" rx="10"/>
  <text x="200" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#d32f2f">
    Mathematical/Technical Issues
  </text>
  
  <!-- Heteroskedasticity -->
  <rect x="70" y="240" width="120" height="80" fill="#fff3e0" stroke="#f57c00" stroke-width="1" rx="5"/>
  <text x="130" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f57c00">
    Heteroskedasticity
  </text>
  <text x="130" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">
    Var(εᵢ) ≠ constant
  </text>
  <text x="130" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">
    Non-constant
  </text>
  <text x="130" y="307" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">
    error variance
  </text>
  
  <!-- Multicollinearity -->
  <rect x="210" y="240" width="120" height="80" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1" rx="5"/>
  <text x="270" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#7b1fa2">
    Multicollinearity
  </text>
  <text x="270" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">
    Corr(Xᵢ, Xⱼ) ≈ 1
  </text>
  <text x="270" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">
    Highly correlated
  </text>
  <text x="270" y="307" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">
    predictors
  </text>
  
  <!-- Problem Category 2: Structural Issues -->
  <rect x="450" y="200" width="300" height="150" fill="#e8f5e8" stroke="#388e3c" stroke-width="2" rx="10"/>
  <text x="600" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#388e3c">
    Structural/Modeling Issues
  </text>
  
  <!-- Omitted Variables -->
  <rect x="470" y="240" width="120" height="80" fill="#e0f2f1" stroke="#00695c" stroke-width="1" rx="5"/>
  <text x="530" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#00695c">
    Omitted Variables
  </text>
  <text x="530" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">
    Missing Z causes
  </text>
  <text x="530" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">
    both X and Y
  </text>
  <text x="530" y="307" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">
    (confounding)
  </text>
  
  <!-- Causality Confusion -->
  <rect x="610" y="240" width="120" height="80" fill="#fce4ec" stroke="#c2185b" stroke-width="1" rx="5"/>
  <text x="670" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#c2185b">
    Causality Issues
  </text>
  <text x="670" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">
    Correlation ≠
  </text>
  <text x="670" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">
    Causation
  </text>
  <text x="670" y="307" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">
    (spurious relations)
  </text>
  
  <!-- Consequences Box -->
  <rect x="150" y="380" width="500" height="100" fill="#fff8e1" stroke="#ff8f00" stroke-width="2" rx="10"/>
  <text x="400" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ff8f00">
    Consequences When Assumptions Are Violated
  </text>
  <text x="180" y="430" font-family="Arial, sans-serif" font-size="12" fill="#333">
    • Standard errors become unreliable → Wrong confidence intervals
  </text>
  <text x="180" y="450" font-family="Arial, sans-serif" font-size="12" fill="#333">
    • Hypothesis tests produce incorrect p-values → False conclusions
  </text>
  <text x="180" y="470" font-family="Arial, sans-serif" font-size="12" fill="#333">
    • Causal interpretations become invalid → Wrong policy decisions
  </text>
  
  <!-- Solution Approach -->
  <rect x="200" y="510" width="400" height="60" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="10"/>
  <text x="400" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1976d2">
    Solution Approach
  </text>
  <text x="400" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">
    1. Detect → 2. Diagnose → 3. Correct → 4. Validate
  </text>
  
  <!-- Arrows connecting elements -->
  <path d="M 350 160 L 200 190" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 450 160 L 600 190" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 200 370 L 300 390" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 600 370 L 500 390" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 400 490 L 400 500" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
</svg>