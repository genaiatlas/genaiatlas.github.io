<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="900" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="600" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Centrality Measures Comparison
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="70" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#7f8c8d">
    Understanding different centrality measures and their applications
  </text>
  
  <!-- Main comparison table -->
  <g id="comparison-table">
    <!-- Table header -->
    <rect x="50" y="100" width="1100" height="50" fill="#2c3e50"/>
    <text x="200" y="133" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
      Measure
    </text>
    <text x="450" y="133" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
      What It Measures
    </text>
    <text x="750" y="133" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
      Best Used For
    </text>
    <text x="1000" y="133" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
      Formula Type
    </text>
    
    <!-- Row 1: Closeness Centrality -->
    <rect x="50" y="150" width="1100" height="120" fill="#e8f4f8"/>
    <text x="200" y="185" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#3498db">
      Closeness
    </text>
    <text x="200" y="210" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#3498db">
      Centrality
    </text>
    
    <g transform="translate(320, 175)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
        • Average geodesic
      </text>
      <text x="0" y="22" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
        distance to all nodes
      </text>
      <text x="0" y="44" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
        • How "central" a node is
      </text>
      <text x="0" y="66" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
        in the network
      </text>
    </g>
    
    <g transform="translate(600, 175)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
        • Airport location
      </text>
      <text x="0" y="22" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
        • Emergency services
      </text>
      <text x="0" y="44" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
        • Information spread
      </text>
      <text x="0" y="66" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
        • Distribution centers
      </text>
    </g>
    
    <text x="1000" y="200" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50">
      Distance-based
    </text>
    <text x="1000" y="225" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d">
      1 / Σ d_ij
    </text>
    
    <!-- Row 2: Betweenness Centrality -->
    <rect x="50" y="270" width="1100" height="120" fill="#ffe6e6"/>
    <text x="200" y="305" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#e74c3c">
      Betweenness
    </text>
    <text x="200" y="330" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#e74c3c">
      Centrality
    </text>
    
    <g transform="translate(320, 295)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
        • Number of shortest
      </text>
      <text x="0" y="22" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
        paths through node
      </text>
      <text x="0" y="44" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
        • Network bottlenecks
      </text>
      <text x="0" y="66" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
        • Information control
      </text>
    </g>
    
    <g transform="translate(600, 295)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
        • Vulnerability analysis
      </text>
      <text x="0" y="22" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
        • Critical infrastructure
      </text>
      <text x="0" y="44" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
        • Social influence
      </text>
      <text x="0" y="66" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
        • Traffic bottlenecks
      </text>
    </g>
    
    <text x="1000" y="320" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50">
      Path-based
    </text>
    <text x="1000" y="345" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d">
      Σ σ_st(v) / σ_st
    </text>
    
    <!-- Row 3: Eigenvector Centrality -->
    <rect x="50" y="390" width="1100" height="120" fill="#e8f5e9"/>
    <text x="200" y="425" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#27ae60">
      Eigenvector
    </text>
    <text x="200" y="450" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#27ae60">
      Centrality
    </text>
    
    <g transform="translate(320, 415)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
        • Importance of
      </text>
      <text x="0" y="22" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
        node's neighbors
      </text>
      <text x="0" y="44" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
        • Quality of connections
      </text>
      <text x="0" y="66" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
        • Recursive influence
      </text>
    </g>
    
    <g transform="translate(600, 415)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
        • Social networks
      </text>
      <text x="0" y="22" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
        • Academic citations
      </text>
      <text x="0" y="44" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
        • Influence detection
      </text>
      <text x="0" y="66" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
        • Marketing targeting
      </text>
    </g>
    
    <text x="1000" y="440" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50">
      Neighbor-based
    </text>
    <text x="1000" y="465" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d">
      Ax = λx
    </text>
    
    <!-- Row 4: PageRank -->
    <rect x="50" y="510" width="1100" height="120" fill="#fff3e0"/>
    <text x="200" y="545" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#f39c12">
      PageRank
    </text>
    <text x="200" y="570" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#f39c12">
      (Directed)
    </text>
    
    <g transform="translate(320, 535)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
        • Probability of random
      </text>
      <text x="0" y="22" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
        walker reaching node
      </text>
      <text x="0" y="44" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
        • Link authority
      </text>
      <text x="0" y="66" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
        • Damping factor
      </text>
    </g>
    
    <g transform="translate(600, 535)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
        • Web page ranking
      </text>
      <text x="0" y="22" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
        • Search engines
      </text>
      <text x="0" y="44" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
        • Link analysis
      </text>
      <text x="0" y="66" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
        • Recommendation systems
      </text>
    </g>
    
    <text x="1000" y="560" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50">
      Random walk
    </text>
    <text x="1000" y="585" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d">
      PR = dM·PR + (1-d)/n
    </text>
  </g>
  
  <!-- Visual comparison of same network with different centralities -->
  <g id="visual-comparison">
    <rect x="50" y="650" width="1100" height="210" fill="white" stroke="#bdc3c7" stroke-width="2" rx="10"/>
    <text x="600" y="685" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Same Network, Different Perspectives
    </text>
    
    <!-- Network 1: Closeness highlighted -->
    <g transform="translate(150, 700)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#3498db">
        Closeness View
      </text>
      <circle cx="0" cy="50" r="25" fill="#3498db" stroke="#2980b9" stroke-width="3"/>
      <circle cx="-40" cy="100" r="15" fill="#95a5a6" stroke="#7f8c8d" stroke-width="2"/>
      <circle cx="40" cy="100" r="15" fill="#95a5a6" stroke="#7f8c8d" stroke-width="2"/>
      <line x1="-25" y1="90" x2="-10" y2="65" stroke="#34495e" stroke-width="2"/>
      <line x1="25" y1="90" x2="10" y2="65" stroke="#34495e" stroke-width="2"/>
      <text x="0" y="135" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d">
        Central node
      </text>
      <text x="0" y="148" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d">
        (min avg distance)
      </text>
    </g>
    
    <!-- Network 2: Betweenness highlighted -->
    <g transform="translate(400, 700)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#e74c3c">
        Betweenness View
      </text>
      <circle cx="-40" cy="70" r="15" fill="#95a5a6" stroke="#7f8c8d" stroke-width="2"/>
      <circle cx="0" cy="70" r="25" fill="#e74c3c" stroke="#c0392b" stroke-width="3"/>
      <circle cx="40" cy="70" r="15" fill="#95a5a6" stroke="#7f8c8d" stroke-width="2"/>
      <line x1="-25" y1="70" x2="-15" y2="70" stroke="#34495e" stroke-width="2"/>
      <line x1="25" y1="70" x2="15" y2="70" stroke="#34495e" stroke-width="2"/>
      <text x="0" y="120" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d">
        Bridge node
      </text>
      <text x="0" y="133" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d">
        (bottleneck)
      </text>
    </g>
    
    <!-- Network 3: Eigenvector highlighted -->
    <g transform="translate(650, 700)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#27ae60">
        Eigenvector View
      </text>
      <circle cx="-30" cy="70" r="18" fill="#27ae60" stroke="#229954" stroke-width="3"/>
      <circle cx="30" cy="70" r="18" fill="#27ae60" stroke="#229954" stroke-width="3"/>
      <circle cx="0" cy="50" r="25" fill="#27ae60" stroke="#229954" stroke-width="4"/>
      <line x1="-15" y1="60" x2="-20" y2="70" stroke="#34495e" stroke-width="2"/>
      <line x1="15" y1="60" x2="20" y2="70" stroke="#34495e" stroke-width="2"/>
      <text x="0" y="120" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d">
        Well-connected
      </text>
      <text x="0" y="133" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d">
        to important nodes
      </text>
    </g>
    
    <!-- Network 4: PageRank highlighted -->
    <g transform="translate(900, 700)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#f39c12">
        PageRank View
      </text>
      <circle cx="0" cy="50" r="25" fill="#f39c12" stroke="#d68910" stroke-width="3"/>
      <circle cx="-40" cy="100" r="12" fill="#95a5a6" stroke="#7f8c8d" stroke-width="2"/>
      <circle cx="40" cy="100" r="12" fill="#95a5a6" stroke="#7f8c8d" stroke-width="2"/>
      <defs>
        <marker id="pr-arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#34495e"/>
        </marker>
      </defs>
      <line x1="-33" y1="93" x2="-10" y2="65" stroke="#34495e" stroke-width="2" marker-end="url(#pr-arrow)"/>
      <line x1="33" y1="93" x2="10" y2="65" stroke="#34495e" stroke-width="2" marker-end="url(#pr-arrow)"/>
      <text x="0" y="135" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d">
        Many incoming
      </text>
      <text x="0" y="148" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d">
        quality links
      </text>
    </g>
  </g>
  
  <!-- Footer note -->
  <text x="600" y="885" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d" font-style="italic">
    Choose centrality measure based on application: distance-based for location, path-based for bottlenecks, neighbor-based for influence
  </text>
</svg>