<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .node { fill: #e8f4f8; stroke: #2196f3; stroke-width: 2; }
      .connection { stroke: #666; stroke-width: 1; opacity: 0.6; }
      .input-node { fill: #e8f5e8; stroke: #4caf50; }
      .output-node { fill: #fff3e0; stroke: #ff9800; }
      .dog-image { fill: #8bc34a; stroke: #4caf50; stroke-width: 2; }
      .text { font-family: 'Segoe UI', sans-serif; font-size: 12px; fill: #333; }
      .title { font-family: 'Segoe UI', sans-serif; font-size: 16px; font-weight: bold; fill: #1976d2; }
      .label { font-family: 'Segoe UI', sans-serif; font-size: 11px; fill: #666; text-anchor: middle; }
    </style>
  </defs>
  
  <!-- Title -->
  <text x="400" y="25" class="title" text-anchor="middle">Deep Neural Network Architecture for ImageNet Classification</text>
  
  <!-- Dog Image Input -->
  <rect x="20" y="160" width="60" height="40" class="dog-image" rx="5"/>
  <text x="50" y="180" class="text" text-anchor="middle">Dog</text>
  <text x="50" y="195" class="text" text-anchor="middle">Image</text>
  <text x="50" y="220" class="text" text-anchor="middle">n inputs</text>
  
  <!-- Input Layer -->
  <g id="input-layer">
    <circle cx="140" cy="120" r="8" class="input-node"/>
    <circle cx="140" cy="145" r="8" class="input-node"/>
    <circle cx="140" cy="170" r="8" class="input-node"/>
    <circle cx="140" cy="195" r="8" class="input-node"/>
    <circle cx="140" cy="220" r="8" class="input-node"/>
    <circle cx="140" cy="245" r="8" class="input-node"/>
    <text x="140" y="90" class="label">Input Layer</text>
    <text x="140" y="275" class="label">(n neurons)</text>
  </g>
  
  <!-- Hidden Layer 1 -->
  <g id="hidden1">
    <circle cx="250" cy="110" r="8" class="node"/>
    <circle cx="250" cy="135" r="8" class="node"/>
    <circle cx="250" cy="160" r="8" class="node"/>
    <circle cx="250" cy="185" r="8" class="node"/>
    <circle cx="250" cy="210" r="8" class="node"/>
    <circle cx="250" cy="235" r="8" class="node"/>
    <circle cx="250" cy="260" r="8" class="node"/>
    <text x="250" y="90" class="label">Hidden Layer 1</text>
  </g>
  
  <!-- Hidden Layer 2 -->
  <g id="hidden2">
    <circle cx="360" cy="115" r="8" class="node"/>
    <circle cx="360" cy="140" r="8" class="node"/>
    <circle cx="360" cy="165" r="8" class="node"/>
    <circle cx="360" cy="190" r="8" class="node"/>
    <circle cx="360" cy="215" r="8" class="node"/>
    <circle cx="360" cy="240" r="8" class="node"/>
    <text x="360" y="90" class="label">Hidden Layer 2</text>
  </g>
  
  <!-- Hidden Layer 3 -->
  <g id="hidden3">
    <circle cx="470" cy="120" r="8" class="node"/>
    <circle cx="470" cy="145" r="8" class="node"/>
    <circle cx="470" cy="170" r="8" class="node"/>
    <circle cx="470" cy="195" r="8" class="node"/>
    <circle cx="470" cy="220" r="8" class="node"/>
    <circle cx="470" cy="245" r="8" class="node"/>
    <text x="470" y="90" class="label">Hidden Layer 3</text>
  </g>
  
  <!-- Output Layer -->
  <g id="output">
    <circle cx="580" cy="130" r="8" class="output-node"/>
    <circle cx="580" cy="155" r="8" class="output-node"/>
    <circle cx="580" cy="180" r="8" class="output-node"/>
    <circle cx="580" cy="205" r="8" class="output-node"/>
    <circle cx="580" cy="230" r="8" class="output-node"/>
    <text x="580" y="90" class="label">Output Layer</text>
    <text x="580" y="275" class="label">(1000 categories)</text>
  </g>
  
  <!-- Output Labels -->
  <g id="output-labels">
    <text x="650" y="135" class="text">Golden Retriever: 1</text>
    <text x="650" y="160" class="text">Lion: 0</text>
    <text x="650" y="185" class="text">Ostrich: 0</text>
    <text x="650" y="210" class="text">Elephant: 0</text>
    <text x="650" y="235" class="text">... (996 more): 0</text>
  </g>
  
  <!-- Connections from dog image to input -->
  <line x1="80" y1="170" x2="132" y2="145" class="connection"/>
  <line x1="80" y1="175" x2="132" y2="170" class="connection"/>
  <line x1="80" y1="185" x2="132" y2="195" class="connection"/>
  <line x1="80" y1="190" x2="132" y2="220" class="connection"/>
  
  <!-- Input to Hidden 1 connections -->
  <line x1="148" y1="120" x2="242" y2="135" class="connection"/>
  <line x1="148" y1="145" x2="242" y2="160" class="connection"/>
  <line x1="148" y1="170" x2="242" y2="185" class="connection"/>
  <line x1="148" y1="195" x2="242" y2="210" class="connection"/>
  <line x1="148" y1="220" x2="242" y2="235" class="connection"/>
  <line x1="148" y1="245" x2="242" y2="260" class="connection"/>
  
  <!-- Sample connections between hidden layers -->
  <line x1="258" y1="135" x2="352" y2="140" class="connection"/>
  <line x1="258" y1="160" x2="352" y2="165" class="connection"/>
  <line x1="258" y1="185" x2="352" y2="190" class="connection"/>
  <line x1="258" y1="210" x2="352" y2="215" class="connection"/>
  
  <line x1="368" y1="140" x2="462" y2="145" class="connection"/>
  <line x1="368" y1="165" x2="462" y2="170" class="connection"/>
  <line x1="368" y1="190" x2="462" y2="195" class="connection"/>
  <line x1="368" y1="215" x2="462" y2="220" class="connection"/>
  
  <!-- Hidden to Output connections -->
  <line x1="478" y1="145" x2="572" y2="155" class="connection"/>
  <line x1="478" y1="170" x2="572" y2="180" class="connection"/>
  <line x1="478" y1="195" x2="572" y2="205" class="connection"/>
  <line x1="478" y1="220" x2="572" y2="230" class="connection"/>
  
  <!-- Arrows -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  
  <!-- Arrow from input to hidden -->
  <line x1="100" y1="180" x2="120" y2="180" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Cost Function Box -->
  <rect x="50" y="320" width="700" height="60" fill="#f5f5f5" stroke="#ddd" rx="5"/>
  <text x="60" y="340" class="title">Quadratic Cost Function:</text>
  <text x="60" y="360" class="text">PENALTY = (a_j - 1)² + Σ(a_i)² where j is the correct category</text>
  <text x="60" y="375" class="text">Goal: Minimize average cost across all training examples</text>
</svg>