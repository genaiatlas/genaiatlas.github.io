<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f7fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#edf2f7;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#00000020"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect x="0" y="0" width="900" height="600" fill="url(#backgroundGradient)"/>
  
  <!-- Title -->
  <text x="450" y="30" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2d3748">
    Linear Classifier vs Decision Tree Comparison
  </text>
  
  <!-- Linear Classifier Section -->
  <rect x="50" y="60" width="380" height="480" rx="10" fill="white" stroke="#cbd5e0" stroke-width="2" filter="url(#shadow)"/>
  
  <text x="240" y="85" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#2b6cb0">
    Linear Classifier
  </text>
  
  <!-- Linear Plot Area -->
  <rect x="80" y="100" width="320" height="240" fill="#f7fafc" stroke="#a0aec0" stroke-width="1"/>
  
  <!-- Grid for Linear Plot -->
  <defs>
    <pattern id="gridLinear" width="32" height="24" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 24" fill="none" stroke="#e2e8f0" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect x="80" y="100" width="320" height="240" fill="url(#gridLinear)"/>
  
  <!-- Linear Axes -->
  <line x1="80" y1="340" x2="400" y2="340" stroke="#4a5568" stroke-width="2"/>
  <line x1="80" y1="340" x2="80" y2="100" stroke="#4a5568" stroke-width="2"/>
  
  <!-- Linear Axis Labels -->
  <text x="240" y="360" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#4a5568">X₁</text>
  <text x="60" y="220" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#4a5568" transform="rotate(-90 60 220)">X₂</text>
  
  <!-- Blue points (Class 1) - Top left -->
  <circle cx="120" cy="130" r="3" fill="#3182ce"/>
  <circle cx="140" cy="140" r="3" fill="#3182ce"/>
  <circle cx="110" cy="150" r="3" fill="#3182ce"/>
  <circle cx="160" cy="160" r="3" fill="#3182ce"/>
  <circle cx="130" cy="170" r="3" fill="#3182ce"/>
  <circle cx="180" cy="180" r="3" fill="#3182ce"/>
  <circle cx="150" cy="190" r="3" fill="#3182ce"/>
  <circle cx="170" cy="200" r="3" fill="#3182ce"/>
  <circle cx="100" cy="180" r="3" fill="#3182ce"/>
  <circle cx="190" cy="210" r="3" fill="#3182ce"/>
  
  <!-- Red points (Class 2) - Bottom right -->
  <circle cx="250" cy="230" r="3" fill="#e53e3e"/>
  <circle cx="270" cy="240" r="3" fill="#e53e3e"/>
  <circle cx="280" cy="250" r="3" fill="#e53e3e"/>
  <circle cx="300" cy="260" r="3" fill="#e53e3e"/>
  <circle cx="320" cy="270" r="3" fill="#e53e3e"/>
  <circle cx="330" cy="280" r="3" fill="#e53e3e"/>
  <circle cx="310" cy="290" r="3" fill="#e53e3e"/>
  <circle cx="290" cy="300" r="3" fill="#e53e3e"/>
  <circle cx="350" cy="310" r="3" fill="#e53e3e"/>
  <circle cx="340" cy="320" r="3" fill="#e53e3e"/>
  
  <!-- Linear Decision Boundary -->
  <line x1="90" y1="120" x2="370" y2="320" stroke="#805ad5" stroke-width="3" stroke-dasharray="5,3"/>
  
  <!-- Linear Formula -->
  <text x="240" y="380" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#553c9a">
    Decision Boundary: aᵀx = 0
  </text>
  <text x="240" y="395" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#6b46c1">
    Linear separation only
  </text>
  
  <!-- Linear Advantages -->
  <rect x="70" y="410" width="340" height="100" rx="5" fill="#edf2f7" stroke="#a0aec0" stroke-width="1"/>
  <text x="240" y="430" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2d3748">
    Linear Classifier Characteristics
  </text>
  <text x="80" y="450" font-family="Arial, sans-serif" font-size="11" fill="#4a5568">
    ✓ Fast training and prediction
  </text>
  <text x="80" y="465" font-family="Arial, sans-serif" font-size="11" fill="#4a5568">
    ✓ Simple interpretation
  </text>
  <text x="80" y="480" font-family="Arial, sans-serif" font-size="11" fill="#4a5568">
    ✗ Limited to linear boundaries
  </text>
  <text x="80" y="495" font-family="Arial, sans-serif" font-size="11" fill="#4a5568">
    ✗ Poor for complex patterns
  </text>
  
  <!-- Decision Tree Section -->
  <rect x="470" y="60" width="380" height="480" rx="10" fill="white" stroke="#cbd5e0" stroke-width="2" filter="url(#shadow)"/>
  
  <text x="660" y="85" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#38a169">
    Decision Tree Classifier
  </text>
  
  <!-- Decision Tree Plot Area -->
  <rect x="500" y="100" width="320" height="240" fill="#f7fafc" stroke="#a0aec0" stroke-width="1"/>
  
  <!-- Grid for Decision Tree Plot -->
  <rect x="500" y="100" width="320" height="240" fill="url(#gridLinear)"/>
  
  <!-- Decision Tree Axes -->
  <line x1="500" y1="340" x2="820" y2="340" stroke="#4a5568" stroke-width="2"/>
  <line x1="500" y1="340" x2="500" y2="100" stroke="#4a5568" stroke-width="2"/>
  
  <!-- Decision Tree Axis Labels -->
  <text x="660" y="360" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#4a5568">X₁</text>
  <text x="480" y="220" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#4a5568" transform="rotate(-90 480 220)">X₂</text>
  
  <!-- Complex pattern data points -->
  <!-- Blue points (Class 1) - Top and bottom regions -->
  <circle cx="540" cy="130" r="3" fill="#3182ce"/>
  <circle cx="560" cy="140" r="3" fill="#3182ce"/>
  <circle cx="580" cy="150" r="3" fill="#3182ce"/>
  <circle cx="600" cy="160" r="3" fill="#3182ce"/>
  <circle cx="620" cy="130" r="3" fill="#3182ce"/>
  <circle cx="640" cy="140" r="3" fill="#3182ce"/>
  <circle cx="660" cy="150" r="3" fill="#3182ce"/>
  <circle cx="680" cy="160" r="3" fill="#3182ce"/>
  <circle cx="700" cy="130" r="3" fill="#3182ce"/>
  <circle cx="720" cy="140" r="3" fill="#3182ce"/>
  
  <!-- Blue points - Bottom region -->
  <circle cx="540" cy="290" r="3" fill="#3182ce"/>
  <circle cx="560" cy="300" r="3" fill="#3182ce"/>
  <circle cx="580" cy="310" r="3" fill="#3182ce"/>
  <circle cx="600" cy="320" r="3" fill="#3182ce"/>
  <circle cx="680" cy="290" r="3" fill="#3182ce"/>
  <circle cx="700" cy="300" r="3" fill="#3182ce"/>
  <circle cx="720" cy="310" r="3" fill="#3182ce"/>
  <circle cx="740" cy="320" r="3" fill="#3182ce"/>
  
  <!-- Red points (Class 2) - Middle region -->
  <circle cx="530" cy="200" r="3" fill="#e53e3e"/>
  <circle cx="550" cy="210" r="3" fill="#e53e3e"/>
  <circle cx="570" cy="220" r="3" fill="#e53e3e"/>
  <circle cx="590" cy="230" r="3" fill="#e53e3e"/>
  <circle cx="610" cy="240" r="3" fill="#e53e3e"/>
  <circle cx="630" cy="250" r="3" fill="#e53e3e"/>
  <circle cx="650" cy="260" r="3" fill="#e53e3e"/>
  <circle cx="670" cy="220" r="3" fill="#e53e3e"/>
  <circle cx="690" cy="230" r="3" fill="#e53e3e"/>
  <circle cx="710" cy="240" r="3" fill="#e53e3e"/>
  <circle cx="730" cy="250" r="3" fill="#e53e3e"/>
  <circle cx="750" cy="260" r="3" fill="#e53e3e"/>
  <circle cx="770" cy="270" r="3" fill="#e53e3e"/>
  <circle cx="790" cy="280" r="3" fill="#e53e3e"/>
  
  <!-- Decision Tree Boundaries (Rectangular) -->
  <!-- Vertical split at X₁ = 0.7 -->
  <line x1="650" y1="100" x2="650" y2="340" stroke="#38a169" stroke-width="3"/>
  <!-- Horizontal split at X₂ = 0.5 for left region -->
  <line x1="500" y1="220" x2="650" y2="220" stroke="#38a169" stroke-width="3"/>
  <!-- Horizontal split at X₂ = 0.3 for right region -->
  <line x1="650" y1="280" x2="820" y2="280" stroke="#38a169" stroke-width="3"/>
  
  <!-- Decision Tree Rules -->
  <text x="660" y="380" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#2f855a">
    Rules: X₁ ≤ 0.7 ∧ X₂ ≤ 0.5 → Blue
  </text>
  <text x="660" y="395" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#38a169">
    Non-linear decision boundaries
  </text>
  
  <!-- Decision Tree Advantages -->
  <rect x="490" y="410" width="340" height="100" rx="5" fill="#f0fff4" stroke="#9ae6b4" stroke-width="1"/>
  <text x="660" y="430" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2d3748">
    Decision Tree Characteristics
  </text>
  <text x="500" y="450" font-family="Arial, sans-serif" font-size="11" fill="#4a5568">
    ✓ Handles complex patterns
  </text>
  <text x="500" y="465" font-family="Arial, sans-serif" font-size="11" fill="#4a5568">
    ✓ Highly interpretable rules
  </text>
  <text x="500" y="480" font-family="Arial, sans-serif" font-size="11" fill="#4a5568">
    ✗ Risk of overfitting
  </text>
  <text x="500" y="495" font-family="Arial, sans-serif" font-size="11" fill="#4a5568">
    ✗ Can be unstable
  </text>
  
  <!-- Comparison Summary -->
  <rect x="100" y="550" width="700" height="40" rx="8" fill="#fef5e7" stroke="#f6ad55" stroke-width="2"/>
  <text x="450" y="570" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#c05621">
    Key Insight: Decision trees excel when data has non-linear, rule-based patterns that linear models cannot capture
  </text>
  <text x="450" y="585" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#9c4221">
    Choose based on data complexity, interpretability needs, and performance requirements
  </text>
</svg>