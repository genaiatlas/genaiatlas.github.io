<svg viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="800" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="500" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Clustering Coefficient
  </text>
  
  <!-- Subtitle -->
  <text x="500" y="70" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#7f8c8d">
    Measuring network transitivity through triangles
  </text>
  
  <!-- Left: Connected Triple (No Triangle) -->
  <g transform="translate(150, 130)">
    <rect x="0" y="0" width="300" height="240" fill="white" stroke="#e74c3c" stroke-width="3" rx="5"/>
    
    <text x="150" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#e74c3c">
      Connected Triple
    </text>
    
    <!-- Three nodes with only 2 connections -->
    <g transform="translate(150, 140)">
      <circle cx="0" cy="-60" r="15" fill="#e74c3c" stroke="white" stroke-width="3"/>
      <text x="0" y="-65" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">A</text>
      
      <circle cx="-70" cy="30" r="15" fill="#3498db" stroke="white" stroke-width="3"/>
      <text x="-70" y="35" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">B</text>
      
      <circle cx="70" cy="30" r="15" fill="#3498db" stroke="white" stroke-width="3"/>
      <text x="70" y="35" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">C</text>
      
      <!-- Connections -->
      <line x1="0" y1="-45" x2="-62" y2="18" stroke="#34495e" stroke-width="3"/>
      <line x1="0" y1="-45" x2="62" y2="18" stroke="#34495e" stroke-width="3"/>
      
      <!-- Missing edge (dashed) -->
      <line x1="-55" y1="30" x2="55" y2="30" stroke="#95a5a6" stroke-width="2" stroke-dasharray="5,5" opacity="0.5"/>
    </g>
    
    <text x="150" y="220" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#34495e">
      B and C not connected
    </text>
  </g>
  
  <!-- Right: Triangle (Closed Triple) -->
  <g transform="translate(550, 130)">
    <rect x="0" y="0" width="300" height="240" fill="white" stroke="#27ae60" stroke-width="3" rx="5"/>
    
    <text x="150" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#27ae60">
      Triangle (Closed)
    </text>
    
    <!-- Three fully connected nodes -->
    <g transform="translate(150, 140)">
      <circle cx="0" cy="-60" r="15" fill="#27ae60" stroke="white" stroke-width="3"/>
      <text x="0" y="-65" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">A</text>
      
      <circle cx="-70" cy="30" r="15" fill="#27ae60" stroke="white" stroke-width="3"/>
      <text x="-70" y="35" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">B</text>
      
      <circle cx="70" cy="30" r="15" fill="#27ae60" stroke="white" stroke-width="3"/>
      <text x="70" y="35" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">C</text>
      
      <!-- All connections -->
      <line x1="0" y1="-45" x2="-62" y2="18" stroke="#34495e" stroke-width="3"/>
      <line x1="0" y1="-45" x2="62" y2="18" stroke="#34495e" stroke-width="3"/>
      <line x1="-55" y1="30" x2="55" y2="30" stroke="#34495e" stroke-width="3"/>
      
      <!-- Triangle highlight -->
      <path d="M 0,-45 L -62,18 L 55,30 Z" fill="#27ae60" opacity="0.2"/>
    </g>
    
    <text x="150" y="220" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#34495e">
      All three connected ✓
    </text>
  </g>
  
  <!-- Social Network Example -->
  <g transform="translate(100, 410)">
    <rect x="0" y="0" width="800" height="170" fill="white" stroke="#9b59b6" stroke-width="2" rx="5"/>
    
    <text x="400" y="35" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#9b59b6">
      Social Network Example: Transitivity
    </text>
    
    <!-- Network diagram -->
    <g transform="translate(200, 100)">
      <circle cx="0" cy="0" r="12" fill="#9b59b6" stroke="white" stroke-width="2"/>
      <text x="0" y="30" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#34495e" font-weight="bold">You</text>
      
      <circle cx="-80" cy="0" r="12" fill="#3498db" stroke="white" stroke-width="2"/>
      <text x="-80" y="30" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#34495e" font-weight="bold">Friend A</text>
      
      <circle cx="80" cy="0" r="12" fill="#3498db" stroke="white" stroke-width="2"/>
      <text x="80" y="30" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#34495e" font-weight="bold">Friend B</text>
      
      <line x1="-68" y1="0" x2="-12" y2="0" stroke="#34495e" stroke-width="2"/>
      <line x1="12" y1="0" x2="68" y2="0" stroke="#34495e" stroke-width="2"/>
      <line x1="-68" y1="0" x2="68" y2="0" stroke="#27ae60" stroke-width="3" opacity="0.7"/>
    </g>
    
    <text x="550" y="80" font-family="Arial, sans-serif" font-size="13" fill="#34495e">
      If you know Friend A,
    </text>
    <text x="550" y="100" font-family="Arial, sans-serif" font-size="13" fill="#34495e">
      and Friend A knows Friend B,
    </text>
    <text x="550" y="120" font-family="Arial, sans-serif" font-size="13" fill="#27ae60" font-weight="bold">
      then you're likely to know
    </text>
    <text x="550" y="140" font-family="Arial, sans-serif" font-size="13" fill="#27ae60" font-weight="bold">
      Friend B too!
    </text>
  </g>
  
  <!-- Formula Section -->
  <g transform="translate(100, 620)">
    <rect x="0" y="0" width="800" height="150" fill="#ecf0f1" stroke="#34495e" stroke-width="2" rx="5"/>
    
    <text x="400" y="35" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Clustering Coefficient Formula
    </text>
    
    <!-- Main formula -->
    <text x="400" y="75" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      C = (# of Triangles) / (# of Connected Triples)
    </text>
    
    <!-- Interpretation -->
    <text x="400" y="105" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#34495e">
      Measures: "Of all my friend's friend pairs, what fraction are friends with each other?"
    </text>
    
    <!-- Range -->
    <text x="200" y="135" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#e74c3c">
      C = 0: No transitivity
    </text>
    <text x="600" y="135" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#27ae60">
      C = 1: Perfect transitivity
    </text>
  </g>
</svg>