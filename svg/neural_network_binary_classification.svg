<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="700" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">Neural Network Architecture for Binary Classification</text>
  
  <!-- Network Architecture -->
  <g transform="translate(100, 100)">
    
    <!-- Input Layer -->
    <g transform="translate(0, 0)">
      <text x="0" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1976d2">Input Layer</text>
      
      <!-- Input nodes -->
      <g id="input-nodes">
        <circle cx="0" cy="20" r="15" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
        <text x="0" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1976d2">x₁</text>
        <text x="-50" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">Amount</text>
        
        <circle cx="0" cy="70" r="15" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
        <text x="0" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1976d2">x₂</text>
        <text x="-50" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">Location</text>
        
        <circle cx="0" cy="120" r="15" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
        <text x="0" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1976d2">x₃</text>
        <text x="-50" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">Time</text>
        
        <circle cx="0" cy="170" r="15" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
        <text x="0" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1976d2">x₄</text>
        <text x="-50" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">History</text>
        
        <text x="0" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">⋮</text>
        
        <circle cx="0" cy="220" r="15" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
        <text x="0" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1976d2">xₙ</text>
        <text x="-50" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">Velocity</text>
      </g>
      
      <text x="0" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">n features</text>
    </g>
    
    <!-- Hidden Layer 1 -->
    <g transform="translate(200, 0)">
      <text x="0" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ff9800">Hidden Layer 1</text>
      
      <!-- Hidden nodes -->
      <circle cx="0" cy="40" r="15" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
      <text x="0" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#ff9800">h₁₁</text>
      
      <circle cx="0" cy="80" r="15" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
      <text x="0" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#ff9800">h₁₂</text>
      
      <circle cx="0" cy="120" r="15" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
      <text x="0" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#ff9800">h₁₃</text>
      
      <circle cx="0" cy="160" r="15" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
      <text x="0" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#ff9800">h₁₄</text>
      
      <circle cx="0" cy="200" r="15" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
      <text x="0" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#ff9800">h₁₅</text>
      
      <text x="0" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">64 nodes</text>
      <text x="0" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">ReLU activation</text>
    </g>
    
    <!-- Hidden Layer 2 -->
    <g transform="translate(400, 0)">
      <text x="0" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4caf50">Hidden Layer 2</text>
      
      <!-- Hidden nodes -->
      <circle cx="0" cy="60" r="15" fill="#e8f5e8" stroke="#4caf50" stroke-width="2"/>
      <text x="0" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#4caf50">h₂₁</text>
      
      <circle cx="0" cy="100" r="15" fill="#e8f5e8" stroke="#4caf50" stroke-width="2"/>
      <text x="0" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#4caf50">h₂₂</text>
      
      <circle cx="0" cy="140" r="15" fill="#e8f5e8" stroke="#4caf50" stroke-width="2"/>
      <text x="0" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#4caf50">h₂₃</text>
      
      <circle cx="0" cy="180" r="15" fill="#e8f5e8" stroke="#4caf50" stroke-width="2"/>
      <text x="0" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#4caf50">h₂₄</text>
      
      <text x="0" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">32 nodes</text>
      <text x="0" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">ReLU activation</text>
    </g>
    
    <!-- Output Layer -->
    <g transform="translate(600, 0)">
      <text x="0" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e91e63">Output Layer</text>
      
      <!-- Output node -->
      <circle cx="0" cy="120" r="20" fill="#fce4ec" stroke="#e91e63" stroke-width="3"/>
      <text x="0" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e91e63">ŷ</text>
      
      <text x="0" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">1 node</text>
      <text x="0" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Sigmoid activation</text>
      <text x="0" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Output ∈ [0, 1]</text>
      
      <text x="70" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e91e63">P(Fraud) = 0.85</text>
      <text x="70" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e91e63">Decision: 1</text>
      <text x="70" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e91e63">(Fraud Detected)</text>
    </g>
    
    <!-- Connections Input to Hidden 1 -->
    <g stroke="#999" stroke-width="1" opacity="0.6">
      <!-- Sample connections from input to first hidden layer -->
      <line x1="15" y1="20" x2="185" y2="40"/>
      <line x1="15" y1="20" x2="185" y2="80"/>
      <line x1="15" y1="20" x2="185" y2="120"/>
      <line x1="15" y1="70" x2="185" y2="40"/>
      <line x1="15" y1="70" x2="185" y2="80"/>
      <line x1="15" y1="70" x2="185" y2="160"/>
      <line x1="15" y1="120" x2="185" y2="120"/>
      <line x1="15" y1="120" x2="185" y2="160"/>
      <line x1="15" y1="170" x2="185" y2="200"/>
      <line x1="15" y1="220" x2="185" y2="40"/>
      <line x1="15" y1="220" x2="185" y2="200"/>
    </g>
    
    <!-- Connections Hidden 1 to Hidden 2 -->
    <g stroke="#999" stroke-width="1" opacity="0.6">
      <line x1="215" y1="40" x2="385" y2="60"/>
      <line x1="215" y1="40" x2="385" y2="100"/>
      <line x1="215" y1="80" x2="385" y2="60"/>
      <line x1="215" y1="80" x2="385" y2="140"/>
      <line x1="215" y1="120" x2="385" y2="100"/>
      <line x1="215" y1="120" x2="385" y2="180"/>
      <line x1="215" y1="160" x2="385" y2="140"/>
      <line x1="215" y1="200" x2="385" y2="180"/>
    </g>
    
    <!-- Connections Hidden 2 to Output -->
    <g stroke="#e91e63" stroke-width="2" opacity="0.8">
      <line x1="415" y1="60" x2="580" y2="120"/>
      <line x1="415" y1="100" x2="580" y2="120"/>
      <line x1="415" y1="140" x2="580" y2="120"/>
      <line x1="415" y1="180" x2="580" y2="120"/>
    </g>
    
  </g>
  
  <!-- Mathematical Formulation -->
  <g transform="translate(50, 420)">
    <rect x="0" y="0" width="900" height="120" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="10"/>
    <text x="450" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">Mathematical Formulation</text>
    
    <!-- Forward Propagation -->
    <g transform="translate(30, 35)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1976d2">Forward Propagation:</text>
      <text x="0" y="20" font-family="Arial, sans-serif" font-size="12" fill="#333">Hidden Layer 1: h₁ = ReLU(W₁ · x + b₁)</text>
      <text x="0" y="35" font-family="Arial, sans-serif" font-size="12" fill="#333">Hidden Layer 2: h₂ = ReLU(W₂ · h₁ + b₂)</text>
      <text x="0" y="50" font-family="Arial, sans-serif" font-size="12" fill="#333">Output: ŷ = σ(W₃ · h₂ + b₃)</text>
      <text x="0" y="70" font-family="Arial, sans-serif" font-size="11" fill="#666">where σ(z) = 1/(1 + e⁻ᶻ) is sigmoid activation</text>
    </g>
    
    <!-- Loss Function -->
    <g transform="translate(450, 35)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#e91e63">Binary Cross-Entropy Loss:</text>
      <text x="0" y="20" font-family="Arial, sans-serif" font-size="12" fill="#333">L(y, ŷ) = -[y log(ŷ) + (1-y) log(1-ŷ)]</text>
      <text x="0" y="40" font-family="Arial, sans-serif" font-size="11" fill="#666">y ∈ {0, 1}: true label</text>
      <text x="0" y="55" font-family="Arial, sans-serif" font-size="11" fill="#666">ŷ ∈ [0, 1]: predicted probability</text>
    </g>
  </g>
  
  <!-- Activation Functions -->
  <g transform="translate(50, 560)">
    <rect x="0" y="0" width="420" height="120" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="10"/>
    <text x="210" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">Activation Functions</text>
    
    <!-- ReLU Graph -->
    <g transform="translate(40, 40)">
      <text x="50" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ff9800">ReLU (Hidden Layers)</text>
      
      <!-- Axes -->
      <line x1="10" y1="40" x2="90" y2="40" stroke="#666" stroke-width="1"/>
      <line x1="50" y1="10" x2="50" y2="60" stroke="#666" stroke-width="1"/>
      
      <!-- ReLU function -->
      <path d="M 10 40 L 50 40 L 90 10" stroke="#ff9800" stroke-width="3" fill="none"/>
      
      <text x="50" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">ReLU(z) = max(0, z)</text>
    </g>
    
    <!-- Sigmoid Graph -->
    <g transform="translate(220, 40)">
      <text x="50" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e91e63">Sigmoid (Output Layer)</text>
      
      <!-- Axes -->
      <line x1="10" y1="40" x2="90" y2="40" stroke="#666" stroke-width="1"/>
      <line x1="50" y1="10" x2="50" y2="60" stroke="#666" stroke-width="1"/>
      
      <!-- Sigmoid function -->
      <path d="M 10 55 Q 30 50, 50 25 Q 70 10, 90 15" stroke="#e91e63" stroke-width="3" fill="none"/>
      
      <text x="50" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">σ(z) = 1/(1 + e⁻ᶻ)</text>
    </g>
  </g>
  
  <!-- Training Process -->
  <g transform="translate(490, 560)">
    <rect x="0" y="0" width="460" height="120" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="10"/>
    <text x="230" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">Training Process</text>
    
    <!-- Backpropagation -->
    <g transform="translate(30, 35)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#9c27b0">Backpropagation:</text>
      <text x="0" y="18" font-family="Arial, sans-serif" font-size="11" fill="#333">1. Forward pass: compute predictions</text>
      <text x="0" y="33" font-family="Arial, sans-serif" font-size="11" fill="#333">2. Compute loss: L(y, ŷ)</text>
      <text x="0" y="48" font-family="Arial, sans-serif" font-size="11" fill="#333">3. Backward pass: ∂L/∂W, ∂L/∂b</text>
      <text x="0" y="63" font-family="Arial, sans-serif" font-size="11" fill="#333">4. Update weights: W ← W - α∇W</text>
    </g>
    
    <!-- Optimization -->
    <g transform="translate(240, 35)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2e7d32">Optimization:</text>
      <text x="0" y="18" font-family="Arial, sans-serif" font-size="11" fill="#333">• Adam optimizer</text>
      <text x="0" y="33" font-family="Arial, sans-serif" font-size="11" fill="#333">• Learning rate: 0.001</text>
      <text x="0" y="48" font-family="Arial, sans-serif" font-size="11" fill="#333">• Batch size: 32</text>
      <text x="0" y="63" font-family="Arial, sans-serif" font-size="11" fill="#333">• Dropout: 0.2 (regularization)</text>
    </g>
  </g>
  
  <!-- Decision Threshold -->
  <g transform="translate(750, 100)">
    <rect x="0" y="0" width="200" height="100" fill="#fff8e1" stroke="#fbc02d" stroke-width="2" rx="10"/>
    <text x="100" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f57c00">Decision Rule</text>
    
    <text x="100" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">if ŷ > 0.5:</text>
    <text x="100" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#d32f2f">    predict "Fraud"</text>
    <text x="100" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">else:</text>
    <text x="100" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#388e3c">    predict "Legitimate"</text>
  </g>
  
  <!-- Performance Metrics -->
  <g transform="translate(750, 220)">
    <rect x="0" y="0" width="200" height="120" fill="#e8f5e8" stroke="#4caf50" stroke-width="2" rx="10"/>
    <text x="100" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2e7d32">Performance</text>
    
    <text x="20" y="40" font-family="Arial, sans-serif" font-size="11" fill="#333">Accuracy: 94.2%</text>
    <text x="20" y="55" font-family="Arial, sans-serif" font-size="11" fill="#333">Precision: 89.7%</text>
    <text x="20" y="70" font-family="Arial, sans-serif" font-size="11" fill="#333">Recall: 91.3%</text>
    <text x="20" y="85" font-family="Arial, sans-serif" font-size="11" fill="#333">F1-Score: 90.5%</text>
    <text x="20" y="100" font-family="Arial, sans-serif" font-size="11" fill="#333">AUC-ROC: 0.96</text>
  </g>
  
  <!-- Architecture Benefits -->
  <g transform="translate(750, 360)">
    <rect x="0" y="0" width="200" height="130" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2" rx="10"/>
    <text x="100" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#7b1fa2">Benefits</text>
    
    <text x="10" y="40" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#9c27b0">✓ Automatic Feature Learning</text>
    <text x="15" y="53" font-family="Arial, sans-serif" font-size="9" fill="#666">No manual feature engineering</text>
    
    <text x="10" y="70" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#9c27b0">✓ Non-linear Boundaries</text>
    <text x="15" y="83" font-family="Arial, sans-serif" font-size="9" fill="#666">Complex pattern recognition</text>
    
    <text x="10" y="100" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#9c27b0">✓ Scalability</text>
    <text x="15" y="113" font-family="Arial, sans-serif" font-size="9" fill="#666">Handles large datasets</text>
  </g>
  
</svg>