<svg viewBox="0 0 900 650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .node { fill: #4A90E2; stroke: #2E5D8A; stroke-width: 2; }
      .input-node { fill: #7ED321; stroke: #5AA016; }
      .output-node { fill: #F5A623; stroke: #D1890B; }
      .gradient-small { fill: #FFEEAA; stroke: #FFD700; stroke-width: 1; }
      .gradient-medium { fill: #FFCC66; stroke: #FF9900; stroke-width: 2; }
      .gradient-large { fill: #FF9966; stroke: #FF6600; stroke-width: 3; }
      .gradient-very-large { fill: #FF6666; stroke: #FF3300; stroke-width: 4; }
      .gradient-explosive { fill: #FF3333; stroke: #FF0000; stroke-width: 5; }
      .gradient-critical { fill: #CC0000; stroke: #990000; stroke-width: 6; }
      .connection { stroke: #666; stroke-width: 1; opacity: 0.3; }
      .backward-flow { stroke: #E74C3C; stroke-width: 3; fill: none; stroke-dasharray: 3,3; }
      .explosion-flow { stroke: #FF0000; stroke-width: 5; fill: none; stroke-dasharray: 2,2; }
      .text-label { font-family: Arial, sans-serif; font-size: 12px; text-anchor: middle; fill: #333; font-weight: bold; }
      .gradient-label { font-family: 'Times New Roman', serif; font-size: 10px; text-anchor: middle; fill: #333; }
      .layer-label { font-family: Arial, sans-serif; font-size: 14px; text-anchor: middle; fill: #333; font-weight: bold; }
      .title-text { font-family: Arial, sans-serif; font-size: 18px; text-anchor: middle; fill: #333; font-weight: bold; }
      .equation-text { font-family: 'Times New Roman', serif; font-size: 12px; text-anchor: middle; fill: #333; }
      .problem-text { font-family: Arial, sans-serif; font-size: 14px; fill: #C0392B; font-weight: bold; }
      .warning-text { font-family: Arial, sans-serif; font-size: 16px; text-anchor: middle; fill: #FF0000; font-weight: bold; }
    </style>
    <marker id="gradient-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#E74C3C" />
    </marker>
    <marker id="explosion-arrow" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto">
      <polygon points="0 0, 12 5, 0 10" fill="#FF0000" />
    </marker>
    <radialGradient id="explosion-gradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FF0000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6666;stop-opacity:0.3" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="650" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>
  
  <!-- Title -->
  <text x="450" y="30" class="title-text">Exploding Gradient Problem in Deep Networks</text>
  
  <!-- Layer Labels -->
  <text x="100" y="70" class="layer-label">Input</text>
  <text x="200" y="70" class="layer-label">Layer 1</text>
  <text x="300" y="70" class="layer-label">Layer 2</text>
  <text x="400" y="70" class="layer-label">Layer 3</text>
  <text x="500" y="70" class="layer-label">Layer 4</text>
  <text x="600" y="70" class="layer-label">Layer 5</text>
  <text x="700" y="70" class="layer-label">Output</text>
  
  <!-- Deep Network Architecture -->
  <!-- Input Layer -->
  <circle cx="100" cy="120" r="12" class="input-node"/>
  <circle cx="100" cy="150" r="12" class="input-node"/>
  <circle cx="100" cy="180" r="12" class="input-node"/>
  
  <!-- Layer 1 -->
  <circle cx="200" cy="105" r="10" class="node"/>
  <circle cx="200" cy="130" r="10" class="node"/>
  <circle cx="200" cy="155" r="10" class="node"/>
  <circle cx="200" cy="180" r="10" class="node"/>
  <circle cx="200" cy="205" r="10" class="node"/>
  
  <!-- Layer 2 -->
  <circle cx="300" cy="105" r="10" class="node"/>
  <circle cx="300" cy="130" r="10" class="node"/>
  <circle cx="300" cy="155" r="10" class="node"/>
  <circle cx="300" cy="180" r="10" class="node"/>
  <circle cx="300" cy="205" r="10" class="node"/>
  
  <!-- Layer 3 -->
  <circle cx="400" cy="105" r="10" class="node"/>
  <circle cx="400" cy="130" r="10" class="node"/>
  <circle cx="400" cy="155" r="10" class="node"/>
  <circle cx="400" cy="180" r="10" class="node"/>
  <circle cx="400" cy="205" r="10" class="node"/>
  
  <!-- Layer 4 -->
  <circle cx="500" cy="105" r="10" class="node"/>
  <circle cx="500" cy="130" r="10" class="node"/>
  <circle cx="500" cy="155" r="10" class="node"/>
  <circle cx="500" cy="180" r="10" class="node"/>
  <circle cx="500" cy="205" r="10" class="node"/>
  
  <!-- Layer 5 -->
  <circle cx="600" cy="105" r="10" class="node"/>
  <circle cx="600" cy="130" r="10" class="node"/>
  <circle cx="600" cy="155" r="10" class="node"/>
  <circle cx="600" cy="180" r="10" class="node"/>
  <circle cx="600" cy="205" r="10" class="node"/>
  
  <!-- Output Layer -->
  <circle cx="700" cy="150" r="12" class="output-node"/>
  
  <!-- Connections (simplified) -->
  <line x1="112" y1="120" x2="188" y2="130" class="connection"/>
  <line x1="112" y1="150" x2="188" y2="155" class="connection"/>
  <line x1="112" y1="180" x2="188" y2="180" class="connection"/>
  
  <line x1="210" y1="130" x2="290" y2="130" class="connection"/>
  <line x1="210" y1="155" x2="290" y2="155" class="connection"/>
  <line x1="210" y1="180" x2="290" y2="180" class="connection"/>
  
  <line x1="310" y1="130" x2="390" y2="130" class="connection"/>
  <line x1="310" y1="155" x2="390" y2="155" class="connection"/>
  <line x1="310" y1="180" x2="390" y2="180" class="connection"/>
  
  <line x1="410" y1="130" x2="490" y2="130" class="connection"/>
  <line x1="410" y1="155" x2="490" y2="155" class="connection"/>
  <line x1="410" y1="180" x2="490" y2="180" class="connection"/>
  
  <line x1="510" y1="130" x2="590" y2="130" class="connection"/>
  <line x1="510" y1="155" x2="590" y2="155" class="connection"/>
  <line x1="510" y1="180" x2="590" y2="180" class="connection"/>
  
  <line x1="610" y1="155" x2="688" y2="150" class="connection"/>
  
  <!-- Gradient Flow Visualization (Exploding) -->
  <line x1="670" y1="250" x2="630" y2="250" class="backward-flow" marker-end="url(#gradient-arrow)"/>
  <line x1="580" y1="250" x2="530" y2="250" class="backward-flow" marker-end="url(#gradient-arrow)"/>
  <line x1="480" y1="250" x2="430" y2="250" class="explosion-flow" marker-end="url(#explosion-arrow)"/>
  <line x1="380" y1="250" x2="330" y2="250" class="explosion-flow" marker-end="url(#explosion-arrow)"/>
  <line x1="280" y1="250" x2="230" y2="250" class="explosion-flow" marker-end="url(#explosion-arrow)"/>
  <line x1="180" y1="250" x2="130" y2="250" class="explosion-flow" marker-end="url(#explosion-arrow)"/>
  
  <!-- Explosion Effect at Early Layers -->
  <circle cx="200" cy="250" r="25" fill="url(#explosion-gradient)" opacity="0.7"/>
  <circle cx="300" cy="250" r="20" fill="url(#explosion-gradient)" opacity="0.6"/>
  <circle cx="400" cy="250" r="15" fill="url(#explosion-gradient)" opacity="0.5"/>
  
  <!-- Gradient Magnitude Visualization (Growing) -->
  <text x="450" y="280" class="text-label">Gradient Magnitude (Backward Flow)</text>
  
  <!-- Small Gradient (Output) -->
  <rect x="680" y="300" width="40" height="10" class="gradient-small" rx="5"/>
  <text x="700" y="307" class="gradient-label">1.0</text>
  <text x="700" y="320" class="gradient-label">Normal</text>
  
  <!-- Medium Gradient -->
  <rect x="580" y="300" width="40" height="20" class="gradient-medium" rx="5"/>
  <text x="600" y="312" class="gradient-label">3.2</text>
  <text x="600" y="330" class="gradient-label">Growing</text>
  
  <!-- Large Gradient -->
  <rect x="480" y="300" width="40" height="35" class="gradient-large" rx="5"/>
  <text x="500" y="320" class="gradient-label">12.8</text>
  <text x="500" y="345" class="gradient-label">Large</text>
  
  <!-- Very Large Gradient -->
  <rect x="380" y="300" width="40" height="50" class="gradient-very-large" rx="5"/>
  <text x="400" y="327" class="gradient-label">51.2</text>
  <text x="400" y="360" class="gradient-label">Very Large</text>
  
  <!-- Explosive Gradient -->
  <rect x="280" y="300" width="40" height="65" class="gradient-explosive" rx="5"/>
  <text x="300" y="335" class="gradient-label">204.8</text>
  <text x="300" y="375" class="gradient-label">Explosive</text>
  
  <!-- Critical Gradient -->
  <rect x="180" y="300" width="40" height="80" class="gradient-critical" rx="5"/>
  <text x="200" y="343" class="gradient-label">819.2</text>
  <text x="200" y="390" class="gradient-label">CRITICAL</text>
  
  <!-- Warning -->
  <text x="450" y="410" class="warning-text">⚠️ UNSTABLE TRAINING ⚠️</text>
  
  <!-- Mathematical Explanation -->
  <rect x="50" y="430" width="800" height="120" fill="#FFF0F0" stroke="#E74C3C" stroke-width="2" rx="10"/>
  <text x="450" y="455" class="title-text" style="fill: #C0392B;">Mathematical Cause</text>
  
  <text x="450" y="480" class="equation-text">Gradient = ∂ℒ/∂W¹ = (∂ℒ/∂a⁶) · (∂a⁶/∂a⁵) · (∂a⁵/∂a⁴) · (∂a⁴/∂a³) · (∂a³/∂a²) · (∂a²/∂a¹) · (∂a¹/∂W¹)</text>
  
  <text x="450" y="505" class="equation-text">If each ∂aᵢ/∂aᵢ₋₁ ≥ 2.0 (large weights), then:</text>
  <text x="450" y="525" class="equation-text">Product ≈ (2.0)⁵ = 32 → Exploding gradient for early layers</text>
  
  <!-- Problem Effects -->
  <rect x="50" y="570" width="380" height="70" fill="#FFCCCC" stroke="#FF6666" stroke-width="2" rx="10"/>
  <text x="240" y="590" class="problem-text">Catastrophic Effects:</text>
  <text x="70" y="605" class="problem-text" style="font-size: 12px;">• Training becomes unstable</text>
  <text x="70" y="620" class="problem-text" style="font-size: 12px;">• Loss oscillates wildly or diverges</text>
  <text x="70" y="635" class="problem-text" style="font-size: 12px;">• NaN values in parameters</text>
  
  <!-- Solutions -->
  <rect x="470" y="570" width="380" height="70" fill="#CCFFCC" stroke="#66FF66" stroke-width="2" rx="10"/>
  <text x="660" y="590" class="problem-text" style="color: #2E7D2E;">Solutions:</text>
  <text x="490" y="605" class="problem-text" style="font-size: 12px; color: #2E7D2E;">• Gradient clipping (||g|| ≤ θ)</text>
  <text x="490" y="620" class="problem-text" style="font-size: 12px; color: #2E7D2E;">• Proper weight initialization</text>
  <text x="490" y="635" class="problem-text" style="font-size: 12px; color: #2E7D2E;">• Lower learning rates</text>
</svg>