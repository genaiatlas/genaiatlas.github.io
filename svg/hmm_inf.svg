<svg viewBox="0 0 800 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#2c3e50">
    HMM Inference: Three Fundamental Problems
  </text>
  
  <!-- Define arrow markers and gradients -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth" fill="#3498db">
      <path d="M0,0 L0,6 L9,3 z"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth" fill="#2ecc71">
      <path d="M0,0 L0,6 L9,3 z"/>
    </marker>
    <linearGradient id="evalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#3498db;stop-opacity:0.4"/>
    </linearGradient>
    <linearGradient id="decodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#e74c3c;stop-opacity:0.4"/>
    </linearGradient>
    <linearGradient id="learnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#2ecc71;stop-opacity:0.4"/>
    </linearGradient>
  </defs>
  
  <!-- Problem 1: Evaluation -->
  <g transform="translate(50, 100)">
    <rect x="0" y="0" width="220" height="160" fill="url(#evalGrad)" stroke="#3498db" stroke-width="2" rx="10"/>
    
    <text x="110" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">1. Evaluation</text>
    <text x="110" y="50" text-anchor="middle" font-size="12" fill="#34495e">Forward-Backward Algorithm</text>
    
    <text x="10" y="75" font-size="13" fill="#2c3e50" font-weight="bold">Given:</text>
    <text x="10" y="95" font-size="11" fill="#34495e">• Model λ = (A, B, π)</text>
    <text x="10" y="110" font-size="11" fill="#34495e">• Observation O = o₁, o₂, ..., oₜ</text>
    
    <text x="10" y="135" font-size="13" fill="#2c3e50" font-weight="bold">Find:</text>
    <text x="10" y="155" font-size="11" fill="#34495e">P(O|λ) = ?</text>
    
    <text x="10" y="180" font-size="12" fill="#3498db" font-weight="bold">α(t,i) = P(O₁...Oₜ, Xₜ=i|λ)</text>
    
    <!-- Visual representation -->
    <g transform="translate(10, 195)">
      <circle cx="20" cy="20" r="8" fill="#3498db" opacity="0.6"/>
      <circle cx="50" cy="20" r="8" fill="#3498db" opacity="0.7"/>
      <circle cx="80" cy="20" r="8" fill="#3498db" opacity="0.8"/>
      <circle cx="110" cy="20" r="8" fill="#3498db" opacity="0.9"/>
      <circle cx="140" cy="20" r="8" fill="#3498db"/>
      
      <path d="M 28 20 L 42 20" stroke="#3498db" stroke-width="1" marker-end="url(#arrow)"/>
      <path d="M 58 20 L 72 20" stroke="#3498db" stroke-width="1" marker-end="url(#arrow)"/>
      <path d="M 88 20 L 102 20" stroke="#3498db" stroke-width="1" marker-end="url(#arrow)"/>
      <path d="M 118 20 L 132 20" stroke="#3498db" stroke-width="1" marker-end="url(#arrow)"/>
      
      <text x="80" y="45" text-anchor="middle" font-size="10" fill="#34495e">Forward Pass</text>
    </g>
  </g>
  
  <!-- Problem 2: Decoding -->
  <g transform="translate(290, 100)">
    <rect x="0" y="0" width="220" height="160" fill="url(#decodeGrad)" stroke="#e74c3c" stroke-width="2" rx="10"/>
    
    <text x="110" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">2. Decoding</text>
    <text x="110" y="50" text-anchor="middle" font-size="12" fill="#34495e">Viterbi Algorithm</text>
    
    <text x="10" y="75" font-size="13" fill="#2c3e50" font-weight="bold">Given:</text>
    <text x="10" y="95" font-size="11" fill="#34495e">• Model λ = (A, B, π)</text>
    <text x="10" y="110" font-size="11" fill="#34495e">• Observation O = o₁, o₂, ..., oₜ</text>
    
    <text x="10" y="135" font-size="13" fill="#2c3e50" font-weight="bold">Find:</text>
    <text x="10" y="155" font-size="11" fill="#34495e">X* = argmax P(X|O,λ)</text>
    
    <text x="10" y="180" font-size="12" fill="#e74c3c" font-weight="bold">δₜ(i) = max P(X₁...Xₜ=i, O|λ)</text>
    
    <!-- Visual representation -->
    <g transform="translate(10, 195)">
      <rect x="15" y="15" width="10" height="10" fill="#e74c3c" opacity="0.6"/>
      <rect x="45" y="15" width="10" height="10" fill="#e74c3c" opacity="0.7"/>
      <rect x="75" y="15" width="10" height="10" fill="#e74c3c" opacity="0.8"/>
      <rect x="105" y="15" width="10" height="10" fill="#e74c3c" opacity="0.9"/>
      <rect x="135" y="15" width="10" height="10" fill="#e74c3c"/>
      
      <path d="M 25 20 L 45 20" stroke="#e74c3c" stroke-width="2"/>
      <path d="M 55 20 L 75 20" stroke="#e74c3c" stroke-width="2"/>
      <path d="M 85 20 L 105 20" stroke="#e74c3c" stroke-width="2"/>
      <path d="M 115 20 L 135 20" stroke="#e74c3c" stroke-width="2"/>
      
      <text x="80" y="45" text-anchor="middle" font-size="10" fill="#34495e">Optimal Path</text>
    </g>
  </g>
  
  <!-- Problem 3: Learning -->
  <g transform="translate(530, 100)">
    <rect x="0" y="0" width="220" height="160" fill="url(#learnGrad)" stroke="#2ecc71" stroke-width="2" rx="10"/>
    
    <text x="110" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">3. Learning</text>
    <text x="110" y="50" text-anchor="middle" font-size="12" fill="#34495e">Baum-Welch (EM)</text>
    
    <text x="10" y="75" font-size="13" fill="#2c3e50" font-weight="bold">Given:</text>
    <text x="10" y="95" font-size="11" fill="#34495e">• Observation O = o₁, o₂, ..., oₜ</text>
    <text x="10" y="110" font-size="11" fill="#34495e">• Initial guess λ₀</text>
    
    <text x="10" y="135" font-size="13" fill="#2c3e50" font-weight="bold">Find:</text>
    <text x="10" y="155" font-size="11" fill="#34495e">λ* = argmax P(O|λ)</text>
    
    <text x="10" y="180" font-size="12" fill="#2ecc71" font-weight="bold">Iterative: E-step → M-step</text>
    
    <!-- Visual representation -->
    <g transform="translate(10, 195)">
      <ellipse cx="80" cy="20" rx="70" ry="15" fill="none" stroke="#2ecc71" stroke-width="2" stroke-dasharray="5,5"/>
      <circle cx="40" cy="20" r="5" fill="#2ecc71"/>
      <circle cx="80" cy="20" r="5" fill="#2ecc71"/>
      <circle cx="120" cy="20" r="5" fill="#2ecc71"/>
      
      <path d="M 45 18 Q 60 10 75 18" stroke="#2ecc71" stroke-width="1" marker-end="url(#arrow-green)"/>
      <path d="M 85 22 Q 100 30 115 22" stroke="#2ecc71" stroke-width="1" marker-end="url(#arrow-green)"/>
      
      <text x="80" y="45" text-anchor="middle" font-size="10" fill="#34495e">EM Iterations</text>
    </g>
  </g>
  
  <!-- Algorithm Details Section -->
  <g transform="translate(50, 320)">
    <rect x="0" y="0" width="700" height="180" fill="#f8f9fa" stroke="#34495e" stroke-width="1" rx="10"/>
    
    <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">Algorithm Details</text>
    
    <!-- Forward Algorithm -->
    <g transform="translate(20, 50)">
      <text x="0" y="0" font-size="14" font-weight="bold" fill="#3498db">Forward Algorithm:</text>
      <text x="0" y="20" font-size="11" fill="#34495e">1. Initialize: α₁(i) = πᵢbᵢ(o₁)</text>
      <text x="0" y="35" font-size="11" fill="#34495e">2. Recurse: αₜ₊₁(j) = [Σᵢ αₜ(i)aᵢⱼ]bⱼ(oₜ₊₁)</text>
      <text x="0" y="50" font-size="11" fill="#34495e">3. Terminate: P(O|λ) = Σᵢ αₜ(i)</text>
    </g>
    
    <!-- Viterbi Algorithm -->
    <g transform="translate(250, 50)">
      <text x="0" y="0" font-size="14" font-weight="bold" fill="#e74c3c">Viterbi Algorithm:</text>
      <text x="0" y="20" font-size="11" fill="#34495e">1. Initialize: δ₁(i) = πᵢbᵢ(o₁)</text>
      <text x="0" y="35" font-size="11" fill="#34495e">2. Recurse: δₜ(j) = maxᵢ[δₜ₋₁(i)aᵢⱼ]bⱼ(oₜ)</text>
      <text x="0" y="50" font-size="11" fill="#34495e">3. Backtrack: Find optimal path</text>
    </g>
    
    <!-- Baum-Welch Algorithm -->
    <g transform="translate(470, 50)">
      <text x="0" y="0" font-size="14" font-weight="bold" fill="#2ecc71">Baum-Welch (EM):</text>
      <text x="0" y="20" font-size="11" fill="#34495e">1. E-step: Compute γₜ(i), ξₜ(i,j)</text>
      <text x="0" y="35" font-size="11" fill="#34495e">2. M-step: Update A, B, π</text>
      <text x="0" y="50" font-size="11" fill="#34495e">3. Iterate until convergence</text>
    </g>
    
    <!-- Complexity -->
    <line x1="20" y1="120" x2="680" y2="120" stroke="#34495e" stroke-width="1" stroke-dasharray="3,3"/>
    
    <text x="350" y="145" text-anchor="middle" font-size="14" font-weight="bold" fill="#34495e">Time Complexity</text>
    <text x="120" y="165" text-anchor="middle" font-size="11" fill="#3498db">O(N²T)</text>
    <text x="350" y="165" text-anchor="middle" font-size="11" fill="#e74c3c">O(N²T)</text>
    <text x="580" y="165" text-anchor="middle" font-size="11" fill="#2ecc71">O(N²T × iterations)</text>
  </g>
  
  <!-- Junction Tree / Message Passing -->
  <g transform="translate(50, 530)">
    <rect x="0" y="0" width="700" height="120" fill="#e8f4fd" stroke="#3498db" stroke-width="1" rx="10"/>
    
    <text x="350" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50">Message Passing in Junction Tree</text>
    
    <!-- Clique nodes -->
    <g transform="translate(100, 50)">
      <!-- Forward messages -->
      <rect x="0" y="0" width="60" height="40" fill="#3498db" opacity="0.3" stroke="#3498db" stroke-width="2" rx="5"/>
      <text x="30" y="25" text-anchor="middle" font-size="11" fill="#2c3e50">{X₁,X₂}</text>
      
      <rect x="100" y="0" width="60" height="40" fill="#3498db" opacity="0.3" stroke="#3498db" stroke-width="2" rx="5"/>
      <text x="130" y="25" text-anchor="middle" font-size="11" fill="#2c3e50">{X₂,X₃}</text>
      
      <rect x="200" y="0" width="60" height="40" fill="#3498db" opacity="0.3" stroke="#3498db" stroke-width="2" rx="5"/>
      <text x="230" y="25" text-anchor="middle" font-size="11" fill="#2c3e50">{X₃,X₄}</text>
      
      <text x="320" y="25" text-anchor="middle" font-size="16" fill="#34495e">...</text>
      
      <rect x="380" y="0" width="60" height="40" fill="#3498db" opacity="0.3" stroke="#3498db" stroke-width="2" rx="5"/>
      <text x="410" y="25" text-anchor="middle" font-size="11" fill="#2c3e50">{Xₜ₋₁,Xₜ}</text>
      
      <!-- Message arrows -->
      <path d="M 60 20 L 100 20" stroke="#3498db" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="80" y="15" text-anchor="middle" font-size="10" fill="#3498db">μ→</text>
      
      <path d="M 160 20 L 200 20" stroke="#3498db" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="180" y="15" text-anchor="middle" font-size="10" fill="#3498db">μ→</text>
      
      <path d="M 380 20 L 340 20" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="360" y="15" text-anchor="middle" font-size="10" fill="#e74c3c">←μ</text>
      
      <text x="250" y="60" text-anchor="middle" font-size="11" fill="#34495e">Forward messages → | ← Backward messages</text>
    </g>
  </g>
  
  <!-- Applications Note -->
  <rect x="50" y="660" width="700" height="25" fill="#fff3cd" stroke="#856404" stroke-width="1" rx="5"/>
  <text x="60" y="677" font-size="12" fill="#856404">
    Applications: Speech Recognition | Part-of-Speech Tagging | Gene Finding | Financial Modeling | Gesture Recognition
  </text>
</svg>