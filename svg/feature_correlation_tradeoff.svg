<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadowLight">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="correlationGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="strengthGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">Feature Selection Trade-off in Random Forest</text>
  
  <!-- Chart Background -->
  <rect x="100" y="80" width="500" height="350" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2" filter="url(#shadowLight)"/>
  
  <!-- Axes -->
  <line x1="120" y1="410" x2="580" y2="410" stroke="#343a40" stroke-width="2"/>
  <line x1="120" y1="410" x2="120" y2="100" stroke="#343a40" stroke-width="2"/>
  
  <!-- X-axis labels -->
  <text x="350" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#495057">Number of Features (m)</text>
  <text x="150" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">1</text>
  <text x="250" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">√p</text>
  <text x="350" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">p/3</text>
  <text x="450" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">p/2</text>
  <text x="550" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">p</text>
  
  <!-- Y-axis labels -->
  <g transform="translate(70,260) rotate(-90)">
    <text x="0" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#495057">Effect on Error</text>
  </g>
  <text x="110" y="120" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">High</text>
  <text x="110" y="260" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">Medium</text>
  <text x="110" y="400" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">Low</text>
  
  <!-- Grid lines -->
  <line x1="150" y1="410" x2="150" y2="100" stroke="#e9ecef" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="250" y1="410" x2="250" y2="100" stroke="#e9ecef" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="350" y1="410" x2="350" y2="100" stroke="#e9ecef" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="450" y1="410" x2="450" y2="100" stroke="#e9ecef" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="550" y1="410" x2="550" y2="100" stroke="#e9ecef" stroke-width="1" stroke-dasharray="5,5"/>
  
  <line x1="120" y1="150" x2="580" y2="150" stroke="#e9ecef" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="120" y1="200" x2="580" y2="200" stroke="#e9ecef" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="120" y1="250" x2="580" y2="250" stroke="#e9ecef" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="120" y1="300" x2="580" y2="300" stroke="#e9ecef" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="120" y1="350" x2="580" y2="350" stroke="#e9ecef" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- Correlation curve (ρ̄) - increases with more features -->
  <path d="M 130 380 Q 200 360 280 320 Q 380 260 480 200 Q 520 170 570 140" 
        stroke="url(#correlationGradient)" stroke-width="4" fill="none"/>
  
  <!-- Strength curve ((1-s²)/s²) - decreases with more features -->
  <path d="M 130 140 Q 200 180 280 240 Q 380 320 480 360 Q 520 380 570 390" 
        stroke="url(#strengthGradient)" stroke-width="4" fill="none"/>
  
  <!-- Total error curve - U-shaped -->
  <path d="M 130 280 Q 200 240 280 220 Q 350 210 400 215 Q 450 225 520 260 Q 550 280 570 310" 
        stroke="#f39c12" stroke-width="6" fill="none"/>
  
  <!-- Optimal point -->
  <circle cx="280" cy="220" r="8" fill="#e74c3c" stroke="#c0392b" stroke-width="3"/>
  <text x="290" y="210" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e74c3c">Optimal</text>
  <text x="290" y="235" font-family="Arial, sans-serif" font-size="11" fill="#e74c3c">(√p features)</text>
  
  <!-- Legend -->
  <rect x="620" y="100" width="160" height="280" fill="#ffffff" stroke="#dee2e6" stroke-width="2" filter="url(#shadowLight)"/>
  <text x="700" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#495057">Legend</text>
  
  <!-- Correlation line legend -->
  <line x1="635" y1="150" x2="665" y2="150" stroke="url(#correlationGradient)" stroke-width="4"/>
  <text x="675" y="155" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e74c3c">ρ̄ (Correlation)</text>
  <text x="635" y="170" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">Between classifiers</text>
  <text x="635" y="185" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">↑ with more features</text>
  
  <!-- Strength line legend -->
  <line x1="635" y1="210" x2="665" y2="210" stroke="url(#strengthGradient)" stroke-width="4"/>
  <text x="675" y="215" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#3498db">(1-s²)/s²</text>
  <text x="635" y="230" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">Classifier weakness</text>
  <text x="635" y="245" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">↓ with more features</text>
  
  <!-- Total error legend -->
  <line x1="635" y1="270" x2="665" y2="270" stroke="#f39c12" stroke-width="6"/>
  <text x="675" y="275" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f39c12">Total Error</text>
  <text x="635" y="290" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">Error ≤ ρ̄ × (1-s²)/s²</text>
  <text x="635" y="305" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">Minimized at √p</text>
  
  <!-- Key insights box -->
  <rect x="630" y="320" width="140" height="50" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="700" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#856404">Sweet Spot</text>
  <text x="700" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#856404">Balance correlation</text>
  <text x="700" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#856404">vs. classifier strength</text>
  
  <!-- Mathematical formula box -->
  <rect x="50" y="480" width="700" height="100" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2" filter="url(#shadowLight)"/>
  <text x="400" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#495057">Generalization Error Formula</text>
  
  <text x="400" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#e74c3c">Error ≤ ρ̄ × (1 - s²)/s²</text>
  
  <text x="150" y="565" font-family="Arial, sans-serif" font-size="12" fill="#495057">Where:</text>
  <text x="150" y="580" font-family="Arial, sans-serif" font-size="12" fill="#e74c3c">• ρ̄ = average correlation between trees</text>
  <text x="450" y="580" font-family="Arial, sans-serif" font-size="12" fill="#3498db">• s = strength of individual classifiers</text>
  
  <!-- Arrows showing trade-off -->
  <path d="M 200 160 L 250 140" stroke="#e74c3c" stroke-width="2" marker-end="url(#redArrow)"/>
  <text x="180" y="150" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c">More correlation</text>
  
  <path d="M 450 350 L 500 370" stroke="#3498db" stroke-width="2" marker-end="url(#blueArrow)"/>
  <text x="460" y="345" font-family="Arial, sans-serif" font-size="10" fill="#3498db">Weaker classifiers</text>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="redArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
    <marker id="blueArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3498db"/>
    </marker>
  </defs>
</svg>