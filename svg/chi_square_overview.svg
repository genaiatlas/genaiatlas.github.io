<svg width="800" height="650" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="650" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">Chi-Square Tests</text>
  
  <!-- Test Formula -->
  <rect x="200" y="50" width="400" height="60" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="10"/>
  <text x="400" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1976d2">χ² = Σ[(Oᵢ - Eᵢ)² / Eᵢ]</text>
  <text x="400" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#666">O = Observed, E = Expected frequencies</text>
  
  <!-- Two Main Types -->
  <text x="400" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">Two Main Types</text>
  
  <!-- Goodness of Fit Test -->
  <rect x="50" y="160" width="320" height="180" fill="#fff3e0" stroke="#f57c00" stroke-width="2" rx="10"/>
  <text x="210" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#f57c00">Goodness of Fit Test</text>
  
  <text x="210" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Purpose:</text>
  <text x="210" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">Test if observed frequencies</text>
  <text x="210" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">match expected distribution</text>
  
  <text x="210" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Example:</text>
  <text x="210" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">Testing if die rolls follow</text>
  <text x="210" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">uniform distribution</text>
  
  <text x="210" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">H₀:</text>
  <text x="210" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">Observed = Expected</text>
  
  <!-- Test of Independence -->
  <rect x="430" y="160" width="320" height="180" fill="#e8f5e8" stroke="#4caf50" stroke-width="2" rx="10"/>
  <text x="590" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#4caf50">Test of Independence</text>
  
  <text x="590" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Purpose:</text>
  <text x="590" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">Test if two categorical</text>
  <text x="590" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">variables are independent</text>
  
  <text x="590" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Example:</text>
  <text x="590" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">Testing if gender and</text>
  <text x="590" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">voting preference related</text>
  
  <text x="590" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">H₀:</text>
  <text x="590" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">Variables are independent</text>
  
  <!-- Expected Frequency Calculation -->
  <text x="400" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">Expected Frequency Calculation</text>
  
  <rect x="150" y="390" width="500" height="60" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2" rx="10"/>
  <text x="400" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#9c27b0">Eᵢⱼ = (Row Total × Column Total) / Grand Total</text>
  <text x="400" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">For independence test contingency tables</text>
  
  <!-- Assumptions -->
  <text x="400" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">Key Assumptions</text>
  
  <rect x="50" y="500" width="700" height="100" fill="#ffebee" stroke="#f44336" stroke-width="2" rx="10"/>
  
  <text x="150" y="525" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f44336">• Independence:</text>
  <text x="280" y="525" font-family="Arial, sans-serif" font-size="12" fill="#333">Observations must be independent</text>
  
  <text x="150" y="545" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f44336">• Expected Frequencies:</text>
  <text x="320" y="545" font-family="Arial, sans-serif" font-size="12" fill="#333">Each cell should have E ≥ 5</text>
  
  <text x="150" y="565" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f44336">• Categorical Data:</text>
  <text x="290" y="565" font-family="Arial, sans-serif" font-size="12" fill="#333">Variables must be categorical</text>
  
  <text x="150" y="585" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f44336">• Sample Size:</text>
  <text x="260" y="585" font-family="Arial, sans-serif" font-size="12" fill="#333">Adequate sample size for reliable results</text>
  
  <!-- Effect Size -->
  <text x="400" y="630" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Effect Size: Cramér's V = √(χ² / (n × min(r-1, c-1)))</text>
</svg>