<svg viewBox="0 0 800 650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="criticalRegion" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e17055;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#fd79a8;stop-opacity:0.7" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="650" fill="#f8f9fa"/>
  
  <!-- Title -->
  <rect x="50" y="20" width="700" height="40" fill="url(#titleGrad)" rx="8"/>
  <text x="400" y="45" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold">
    Hypothesis Testing: Statistical Distribution Analysis
  </text>
  
  <!-- Hypothesis Setup -->
  <rect x="100" y="80" width="600" height="80" fill="#fff3cd" stroke="#ffeaa7" stroke-width="2" rx="8"/>
  <text x="400" y="105" text-anchor="middle" fill="#6c5700" font-family="Arial, sans-serif" font-size="14" font-weight="bold">
    H₀: No difference between treatment and control (μ = 63 deaths)
  </text>
  <text x="400" y="125" text-anchor="middle" fill="#6c5700" font-family="Arial, sans-serif" font-size="14" font-weight="bold">
    H₁: Treatment reduces deaths (μ &lt; 63 deaths)
  </text>
  <text x="400" y="145" text-anchor="middle" fill="#6c5700" font-family="Arial, sans-serif" font-size="12">
    Control Model: X ~ Normal(μ=63, σ=√(np(1-p))) where n=31,000, p=0.002
  </text>
  
  <!-- Distribution Plot Area -->
  <rect x="100" y="180" width="600" height="300" fill="white" stroke="#ddd" stroke-width="1"/>
  
  <!-- X-axis -->
  <line x1="120" y1="460" x2="680" y2="460" stroke="#2d3436" stroke-width="2"/>
  
  <!-- Y-axis -->
  <line x1="120" y1="460" x2="120" y2="200" stroke="#2d3436" stroke-width="2"/>
  
  <!-- X-axis labels -->
  <text x="200" y="480" text-anchor="middle" fill="#2d3436" font-family="Arial, sans-serif" font-size="11">30</text>
  <text x="280" y="480" text-anchor="middle" fill="#2d3436" font-family="Arial, sans-serif" font-size="11">40</text>
  <text x="360" y="480" text-anchor="middle" fill="#2d3436" font-family="Arial, sans-serif" font-size="11">50</text>
  <text x="440" y="480" text-anchor="middle" fill="#2d3436" font-family="Arial, sans-serif" font-size="11">60</text>
  <text x="520" y="480" text-anchor="middle" fill="#2d3436" font-family="Arial, sans-serif" font-size="11">70</text>
  <text x="600" y="480" text-anchor="middle" fill="#2d3436" font-family="Arial, sans-serif" font-size="11">80</text>
  
  <!-- X-axis title -->
  <text x="400" y="510" text-anchor="middle" fill="#2d3436" font-family="Arial, sans-serif" font-size="12" font-weight="bold">
    Number of Deaths
  </text>
  
  <!-- Y-axis title -->
  <text x="60" y="330" text-anchor="middle" fill="#2d3436" font-family="Arial, sans-serif" font-size="12" font-weight="bold" transform="rotate(-90 60 330)">
    Probability Density
  </text>
  
  <!-- Normal distribution curve (centered at 63, around x=520) -->
  <path d="M 200,450 Q 280,400 360,350 Q 440,220 520,210 Q 600,220 680,450" 
        fill="none" stroke="#74b9ff" stroke-width="3"/>
  
  <!-- Fill area under curve for p-value (left tail) -->
  <path d="M 120,460 Q 200,450 280,380 Q 360,350 400,330 L 400,460 Z" 
        fill="url(#criticalRegion)" opacity="0.6"/>
  
  <!-- Observed value line (39 deaths, around x=280) -->
  <line x1="280" y1="200" x2="280" y2="460" stroke="#e17055" stroke-width="3" stroke-dasharray="5,5"/>
  <text x="285" y="195" fill="#e17055" font-family="Arial, sans-serif" font-size="12" font-weight="bold">
    Observed: 39 deaths
  </text>
  
  <!-- Mean line (63 deaths, around x=520) -->
  <line x1="520" y1="200" x2="520" y2="460" stroke="#2d3436" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="525" y="195" fill="#2d3436" font-family="Arial, sans-serif" font-size="12" font-weight="bold">
    Expected: 63 deaths
  </text>
  
  <!-- Critical region annotation -->
  <text x="190" y="240" fill="#e17055" font-family="Arial, sans-serif" font-size="11" font-weight="bold">
    Critical Region
  </text>
  <text x="190" y="255" fill="#e17055" font-family="Arial, sans-serif" font-size="11">
    P(X ≤ 39) = 0.0012
  </text>
  
  <!-- P-value box -->
  <rect x="450" y="530" width="300" height="100" fill="#f8d7da" stroke="#dc3545" stroke-width="2" rx="8"/>
  <text x="600" y="555" text-anchor="middle" fill="#721c24" font-family="Arial, sans-serif" font-size="14" font-weight="bold">
    P-value = 0.0012
  </text>
  <text x="600" y="575" text-anchor="middle" fill="#721c24" font-family="Arial, sans-serif" font-size="12">
    Probability of observing ≤39 deaths
  </text>
  <text x="600" y="590" text-anchor="middle" fill="#721c24" font-family="Arial, sans-serif" font-size="12">
    under null hypothesis
  </text>
  <text x="600" y="610" text-anchor="middle" fill="#721c24" font-family="Arial, sans-serif" font-size="12" font-weight="bold">
    Since 0.0012 &lt; 0.05: REJECT H₀
  </text>
  
  <!-- Decision criteria box -->
  <rect x="50" y="530" width="380" height="100" fill="#d4edda" stroke="#28a745" stroke-width="2" rx="8"/>
  <text x="240" y="555" text-anchor="middle" fill="#155724" font-family="Arial, sans-serif" font-size="14" font-weight="bold">
    Decision Criteria (α = 0.05)
  </text>
  <text x="240" y="575" text-anchor="middle" fill="#155724" font-family="Arial, sans-serif" font-size="12">
    If p-value &lt; α: Reject H₀ (significant effect)
  </text>
  <text x="240" y="590" text-anchor="middle" fill="#155724" font-family="Arial, sans-serif" font-size="12">
    If p-value ≥ α: Fail to reject H₀
  </text>
  <text x="240" y="610" text-anchor="middle" fill="#155724" font-family="Arial, sans-serif" font-size="12" font-weight="bold">
    Conclusion: Treatment is effective
  </text>
</svg>