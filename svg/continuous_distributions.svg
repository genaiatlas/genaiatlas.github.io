<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="24" font-weight="bold" fill="#2c3e50">
    Common Continuous Distributions
  </text>
  
  <!-- Normal Distribution -->
  <rect x="50" y="60" width="350" height="250" fill="#ffffff" stroke="#3498db" stroke-width="2" rx="5"/>
  <text x="225" y="85" text-anchor="middle" font-size="18" font-weight="bold" fill="#3498db">
    Normal Distribution
  </text>
  
  <!-- Normal description -->
  <text x="70" y="105" font-size="12" fill="#2c3e50">The "bell curve" - most important distribution</text>
  <text x="70" y="120" font-size="12" fill="#2c3e50">Parameters: μ (mean), σ² (variance)</text>
  
  <!-- Normal formula box -->
  <rect x="70" y="130" width="310" height="40" fill="#3498db" fill-opacity="0.1" stroke="#3498db" stroke-width="1" rx="3"/>
  <text x="225" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50">
    f(x) = (1/(σ√(2π))) × e^(-(x-μ)²/(2σ²))
  </text>
  
  <!-- Normal curve -->
  <g transform="translate(80, 180)">
    <!-- Axes -->
    <line x1="0" y1="100" x2="270" y2="100" stroke="#2c3e50" stroke-width="1"/>
    <line x1="0" y1="0" x2="0" y2="100" stroke="#2c3e50" stroke-width="1"/>
    
    <!-- Normal curve -->
    <path d="M 30 95 Q 80 60 135 40 Q 190 60 240 95" 
          fill="none" stroke="#3498db" stroke-width="3"/>
    <path d="M 30 95 Q 80 60 135 40 Q 190 60 240 95 L 240 100 L 30 100 Z" 
          fill="#3498db" fill-opacity="0.3"/>
    
    <!-- Mean line -->
    <line x1="135" y1="40" x2="135" y2="100" stroke="#e74c3c" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="135" y="115" text-anchor="middle" font-size="12" fill="#e74c3c">μ</text>
    
    <!-- Standard deviation markers -->
    <line x1="105" y1="95" x2="105" y2="105" stroke="#f39c12" stroke-width="1"/>
    <line x1="165" y1="95" x2="165" y2="105" stroke="#f39c12" stroke-width="1"/>
    <text x="105" y="118" text-anchor="middle" font-size="10" fill="#f39c12">μ-σ</text>
    <text x="165" y="118" text-anchor="middle" font-size="10" fill="#f39c12">μ+σ</text>
    
    <!-- 68-95-99.7 rule areas -->
    <path d="M 105 65 Q 120 45 135 40 Q 150 45 165 65 L 165 100 L 105 100 Z" 
          fill="#2ecc71" fill-opacity="0.4"/>
    <text x="135" y="80" text-anchor="middle" font-size="9" fill="#2ecc71" font-weight="bold">68%</text>
    
    <text x="135" y="130" text-anchor="middle" font-size="10" fill="#2c3e50">68-95-99.7 Rule</text>
  </g>
  
  <!-- Normal properties -->
  <text x="70" y="290" font-size="11" fill="#2c3e50">Properties: Symmetric, μ = median = mode</text>
  <text x="70" y="305" font-size="11" fill="#2c3e50">Standard Normal: μ=0, σ=1, Z = (X-μ)/σ</text>
  
  <!-- Exponential Distribution -->
  <rect x="420" y="60" width="350" height="250" fill="#ffffff" stroke="#e74c3c" stroke-width="2" rx="5"/>
  <text x="595" y="85" text-anchor="middle" font-size="18" font-weight="bold" fill="#e74c3c">
    Exponential Distribution
  </text>
  
  <!-- Exponential description -->
  <text x="440" y="105" font-size="12" fill="#2c3e50">Models time between events (memoryless)</text>
  <text x="440" y="120" font-size="12" fill="#2c3e50">Parameter: λ (rate parameter)</text>
  
  <!-- Exponential formula box -->
  <rect x="440" y="130" width="310" height="40" fill="#e74c3c" fill-opacity="0.1" stroke="#e74c3c" stroke-width="1" rx="3"/>
  <text x="595" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">
    f(x) = λ × e^(-λx) for x ≥ 0
  </text>
  
  <!-- Exponential curve -->
  <g transform="translate(450, 180)">
    <!-- Axes -->
    <line x1="0" y1="100" x2="270" y2="100" stroke="#2c3e50" stroke-width="1"/>
    <line x1="0" y1="0" x2="0" y2="100" stroke="#2c3e50" stroke-width="1"/>
    
    <!-- Exponential curve -->
    <path d="M 0 20 Q 50 40 100 65 Q 150 80 200 90 Q 230 95 270 98" 
          fill="none" stroke="#e74c3c" stroke-width="3"/>
    <path d="M 0 20 Q 50 40 100 65 Q 150 80 200 90 Q 230 95 270 98 L 270 100 L 0 100 Z" 
          fill="#e74c3c" fill-opacity="0.3"/>
    
    <!-- Labels -->
    <text x="0" y="115" text-anchor="middle" font-size="10" fill="#2c3e50">0</text>
    <text x="135" y="115" text-anchor="middle" font-size="10" fill="#2c3e50">x</text>
    <text x="-15" y="50" text-anchor="middle" font-size="10" fill="#2c3e50" transform="rotate(-90, -15, 50)">f(x)</text>
    
    <!-- Rate parameter indication -->
    <text x="30" y="35" font-size="9" fill="#e74c3c">λ = 1</text>
  </g>
  
  <!-- Exponential properties -->
  <text x="440" y="290" font-size="11" fill="#2c3e50">Mean: μ = 1/λ, Variance: σ² = 1/λ²</text>
  <text x="440" y="305" font-size="11" fill="#2c3e50">Memoryless: P(X>s+t|X>s) = P(X>t)</text>
  
  <!-- Uniform Distribution -->
  <rect x="50" y="330" width="350" height="250" fill="#ffffff" stroke="#f39c12" stroke-width="2" rx="5"/>
  <text x="225" y="355" text-anchor="middle" font-size="18" font-weight="bold" fill="#f39c12">
    Uniform Distribution
  </text>
  
  <!-- Uniform description -->
  <text x="70" y="375" font-size="12" fill="#2c3e50">All values equally likely in interval [a,b]</text>
  <text x="70" y="390" font-size="12" fill="#2c3e50">Parameters: a (minimum), b (maximum)</text>
  
  <!-- Uniform formula box -->
  <rect x="70" y="400" width="310" height="40" fill="#f39c12" fill-opacity="0.1" stroke="#f39c12" stroke-width="1" rx="3"/>
  <text x="225" y="420" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">
    f(x) = 1/(b-a) for a ≤ x ≤ b
  </text>
  
  <!-- Uniform distribution -->
  <g transform="translate(80, 450)">
    <!-- Axes -->
    <line x1="0" y1="100" x2="270" y2="100" stroke="#2c3e50" stroke-width="1"/>
    <line x1="0" y1="0" x2="0" y2="100" stroke="#2c3e50" stroke-width="1"/>
    
    <!-- Uniform rectangle -->
    <rect x="50" y="30" width="150" height="70" fill="#f39c12" fill-opacity="0.3" stroke="#f39c12" stroke-width="3"/>
    
    <!-- Vertical lines at endpoints -->
    <line x1="50" y1="30" x2="50" y2="100" stroke="#f39c12" stroke-width="3"/>
    <line x1="200" y1="30" x2="200" y2="100" stroke="#f39c12" stroke-width="3"/>
    
    <!-- Labels -->
    <text x="50" y="115" text-anchor="middle" font-size="10" fill="#2c3e50">a</text>
    <text x="200" y="115" text-anchor="middle" font-size="10" fill="#2c3e50">b</text>
    <text x="125" y="115" text-anchor="middle" font-size="10" fill="#2c3e50">(a+b)/2</text>
    
    <!-- Height label -->
    <text x="25" y="65" text-anchor="middle" font-size="9" fill="#f39c12">1/(b-a)</text>
    <text x="135" y="125" text-anchor="middle" font-size="10" fill="#2c3e50">x</text>
    <text x="-15" y="50" text-anchor="middle" font-size="10" fill="#2c3e50" transform="rotate(-90, -15, 50)">f(x)</text>
  </g>
  
  <!-- Uniform properties -->
  <text x="70" y="560" font-size="11" fill="#2c3e50">Mean: μ = (a+b)/2</text>
  <text x="200" y="560" font-size="11" fill="#2c3e50">Variance: σ² = (b-a)²/12</text>
  <text x="70" y="575" font-size="11" fill="#2c3e50">Used for random number generation</text>
  
  <!-- Comparison and Applications -->
  <rect x="420" y="330" width="350" height="250" fill="#ffffff" stroke="#9b59b6" stroke-width="2" rx="5"/>
  <text x="595" y="355" text-anchor="middle" font-size="18" font-weight="bold" fill="#9b59b6">
    Distribution Applications
  </text>
  
  <!-- Applications table -->
  <g transform="translate(440, 370)">
    <!-- Normal Applications -->
    <text x="10" y="20" font-size="12" font-weight="bold" fill="#3498db">Normal Distribution:</text>
    <text x="10" y="35" font-size="10" fill="#2c3e50">• Heights, weights, test scores</text>
    <text x="10" y="50" font-size="10" fill="#2c3e50">• Measurement errors</text>
    <text x="10" y="65" font-size="10" fill="#2c3e50">• Central Limit Theorem</text>
    <text x="10" y="80" font-size="10" fill="#2c3e50">• Financial returns (approximate)</text>
    
    <!-- Exponential Applications -->
    <text x="10" y="105" font-size="12" font-weight="bold" fill="#e74c3c">Exponential Distribution:</text>
    <text x="10" y="120" font-size="10" fill="#2c3e50">• Time between arrivals</text>
    <text x="10" y="135" font-size="10" fill="#2c3e50">• Component lifetimes</text>
    <text x="10" y="150" font-size="10" fill="#2c3e50">• Radioactive decay</text>
    <text x="10" y="165" font-size="10" fill="#2c3e50">• Service times</text>
    
    <!-- Uniform Applications -->
    <text x="10" y="190" font-size="12" font-weight="bold" fill="#f39c12">Uniform Distribution:</text>
    <text x="10" y="205" font-size="10" fill="#2c3e50">• Random number generation</text>
    <text x="10" y="220" font-size="10" fill="#2c3e50">• Modeling uncertainty</text>
    <text x="10" y="235" font-size="10" fill="#2c3e50">• Starting point for simulation</text>
  </g>
</svg>