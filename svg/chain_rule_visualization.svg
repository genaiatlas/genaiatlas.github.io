<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .function-box { fill: #4A90E2; stroke: #2E5D8A; stroke-width: 2; }
      .input-box { fill: #7ED321; stroke: #5AA016; stroke-width: 2; }
      .output-box { fill: #F5A623; stroke: #D1890B; stroke-width: 2; }
      .loss-box { fill: #E74C3C; stroke: #C0392B; stroke-width: 2; }
      .arrow { stroke: #333; stroke-width: 2; fill: none; }
      .thick-arrow { stroke: #E74C3C; stroke-width: 3; fill: none; }
      .text-label { font-family: Arial, sans-serif; font-size: 14px; text-anchor: middle; fill: #333; font-weight: bold; }
      .math-text { font-family: 'Times New Roman', serif; font-size: 16px; text-anchor: middle; fill: #333; }
      .derivative-text { font-family: 'Times New Roman', serif; font-size: 12px; text-anchor: middle; fill: #666; }
      .title-text { font-family: Arial, sans-serif; font-size: 18px; text-anchor: middle; fill: #333; font-weight: bold; }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#333" />
    </marker>
    <marker id="thick-arrowhead" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#E74C3C" />
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="600" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>
  
  <!-- Title -->
  <text x="450" y="30" class="title-text">Chain Rule in Neural Networks</text>
  
  <!-- Forward Pass Chain -->
  <text x="450" y="70" class="text-label">Forward Pass: Function Composition</text>
  
  <!-- Input -->
  <rect x="20" y="100" width="60" height="40" class="input-box" rx="5"/>
  <text x="50" y="125" class="math-text">x</text>
  
  <!-- Layer 1 -->
  <rect x="140" y="100" width="80" height="40" class="function-box" rx="5"/>
  <text x="180" y="118" class="math-text">f₁(x)</text>
  <text x="180" y="132" class="derivative-text">a₁ = σ(W₁x)</text>
  
  <!-- Layer 2 -->
  <rect x="280" y="100" width="80" height="40" class="function-box" rx="5"/>
  <text x="320" y="118" class="math-text">f₂(a₁)</text>
  <text x="320" y="132" class="derivative-text">a₂ = σ(W₂a₁)</text>
  
  <!-- Layer 3 -->
  <rect x="420" y="100" width="80" height="40" class="function-box" rx="5"/>
  <text x="460" y="118" class="math-text">f₃(a₂)</text>
  <text x="460" y="132" class="derivative-text">a₃ = σ(W₃a₂)</text>
  
  <!-- Output -->
  <rect x="560" y="100" width="80" height="40" class="output-box" rx="5"/>
  <text x="600" y="118" class="math-text">F(x; θ)</text>
  <text x="600" y="132" class="derivative-text">ŷ = a₃</text>
  
  <!-- Loss -->
  <rect x="700" y="100" width="80" height="40" class="loss-box" rx="5"/>
  <text x="740" y="118" class="math-text">ℒ(ŷ, y)</text>
  <text x="740" y="132" class="derivative-text">Loss</text>
  
  <!-- Forward arrows -->
  <line x1="80" y1="120" x2="135" y2="120" class="arrow" marker-end="url(#arrowhead)"/>
  <line x1="220" y1="120" x2="275" y2="120" class="arrow" marker-end="url(#arrowhead)"/>
  <line x1="360" y1="120" x2="415" y2="120" class="arrow" marker-end="url(#arrowhead)"/>
  <line x1="500" y1="120" x2="555" y2="120" class="arrow" marker-end="url(#arrowhead)"/>
  <line x1="640" y1="120" x2="695" y2="120" class="arrow" marker-end="url(#arrowhead)"/>
  
  <!-- Backward Pass Chain -->
  <text x="450" y="250" class="text-label">Backward Pass: Chain Rule Application</text>
  
  <!-- Gradient Flow -->
  <rect x="700" y="280" width="80" height="40" class="loss-box" rx="5"/>
  <text x="740" y="298" class="math-text">∂ℒ/∂ℒ</text>
  <text x="740" y="312" class="derivative-text">= 1</text>
  
  <rect x="560" y="280" width="80" height="40" class="output-box" rx="5"/>
  <text x="600" y="298" class="math-text">∂ℒ/∂ŷ</text>
  <text x="600" y="312" class="derivative-text">∂ℒ/∂a₃</text>
  
  <rect x="420" y="280" width="80" height="40" class="function-box" rx="5"/>
  <text x="460" y="298" class="math-text">∂ℒ/∂a₂</text>
  <text x="460" y="312" class="derivative-text">∂a₃/∂a₂</text>
  
  <rect x="280" y="280" width="80" height="40" class="function-box" rx="5"/>
  <text x="320" y="298" class="math-text">∂ℒ/∂a₁</text>
  <text x="320" y="312" class="derivative-text">∂a₂/∂a₁</text>
  
  <rect x="140" y="280" width="80" height="40" class="function-box" rx="5"/>
  <text x="180" y="298" class="math-text">∂ℒ/∂W₁</text>
  <text x="180" y="312" class="derivative-text">∂a₁/∂W₁</text>
  
  <!-- Backward arrows -->
  <line x1="695" y1="300" x2="645" y2="300" class="thick-arrow" marker-end="url(#thick-arrowhead)"/>
  <line x1="555" y1="300" x2="505" y2="300" class="thick-arrow" marker-end="url(#thick-arrowhead)"/>
  <line x1="415" y1="300" x2="365" y2="300" class="thick-arrow" marker-end="url(#thick-arrowhead)"/>
  <line x1="275" y1="300" x2="225" y2="300" class="thick-arrow" marker-end="url(#thick-arrowhead)"/>
  
  <!-- Chain Rule Equation -->
  <text x="450" y="380" class="text-label">Chain Rule Formula</text>
  
  <!-- Main equation box -->
  <rect x="50" y="400" width="800" height="60" fill="#F8F9FA" stroke="#DEE2E6" stroke-width="2" rx="10"/>
  
  <text x="450" y="425" class="math-text" style="font-size: 18px;">
    ∂ℒ/∂W₁ = (∂ℒ/∂a₃) · (∂a₃/∂a₂) · (∂a₂/∂a₁) · (∂a₁/∂W₁)
  </text>
  
  <text x="450" y="445" class="derivative-text" style="font-size: 14px;">
    Product of local derivatives along the computational path
  </text>
  
  <!-- Efficiency Note -->
  <rect x="100" y="500" width="700" height="80" fill="#E8F5E8" stroke="#7ED321" stroke-width="2" rx="10"/>
  <text x="450" y="525" class="text-label" style="color: #2E7D2E;">Computational Efficiency</text>
  <text x="450" y="545" class="derivative-text" style="color: #2E7D2E;">Forward pass: Compute and store all activations</text>
  <text x="450" y="560" class="derivative-text" style="color: #2E7D2E;">Backward pass: Reuse stored values, compute gradients once</text>
  <text x="450" y="575" class="derivative-text" style="color: #2E7D2E;">Time complexity: O(W) where W is number of weights</text>
</svg>