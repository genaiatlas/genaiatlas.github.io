<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="supervisedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#4CAF50;stop-opacity:0.8"/>
    </linearGradient>
    <linearGradient id="unsupervisedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196F3;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#2196F3;stop-opacity:0.8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    Machine Learning Paradigms
  </text>
  
  <!-- Main Learning Box -->
  <rect x="50" y="80" width="700" height="350" rx="10" fill="none" stroke="#34495e" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="400" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#34495e">
    Machine Learning
  </text>
  
  <!-- Supervised Learning Section -->
  <rect x="80" y="130" width="300" height="280" rx="8" fill="url(#supervisedGrad)" stroke="#4CAF50" stroke-width="2" filter="url(#shadow)"/>
  
  <!-- Supervised Learning Title -->
  <text x="230" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2e7d32">
    Supervised Learning
  </text>
  
  <!-- Supervised Learning Content -->
  <text x="230" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#1b5e20">
    Learning with Examples
  </text>
  
  <!-- Data representation for supervised -->
  <g>
    <rect x="100" y="200" width="260" height="80" rx="5" fill="#ffffff" stroke="#4CAF50" stroke-width="1"/>
    <text x="230" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2e7d32">
      Training Data: (Input, Output) pairs
    </text>
    
    <!-- Example data points -->
    <circle cx="120" cy="240" r="8" fill="#4CAF50"/>
    <text x="135" y="245" font-family="Arial, sans-serif" font-size="10" fill="#2e7d32">Email → Spam</text>
    
    <circle cx="120" cy="255" r="8" fill="#4CAF50"/>
    <text x="135" y="260" font-family="Arial, sans-serif" font-size="10" fill="#2e7d32">Email → Not Spam</text>
    
    <circle cx="250" cy="240" r="8" fill="#4CAF50"/>
    <text x="265" y="245" font-family="Arial, sans-serif" font-size="10" fill="#2e7d32">Image → Cat</text>
    
    <circle cx="250" cy="255" r="8" fill="#4CAF50"/>
    <text x="265" y="260" font-family="Arial, sans-serif" font-size="10" fill="#2e7d32">Image → Dog</text>
  </g>
  
  <!-- Supervised Learning Features -->
  <text x="100" y="305" font-family="Arial, sans-serif" font-size="12" fill="#2e7d32">
    ✓ Clear objectives
  </text>
  <text x="100" y="325" font-family="Arial, sans-serif" font-size="12" fill="#2e7d32">
    ✓ Performance measurable
  </text>
  <text x="100" y="345" font-family="Arial, sans-serif" font-size="12" fill="#2e7d32">
    ✓ Prediction-focused
  </text>
  <text x="100" y="365" font-family="Arial, sans-serif" font-size="12" fill="#2e7d32">
    ✗ Requires labeled data
  </text>
  <text x="100" y="385" font-family="Arial, sans-serif" font-size="12" fill="#2e7d32">
    ✗ Expensive to prepare
  </text>
  
  <!-- Unsupervised Learning Section -->
  <rect x="420" y="130" width="300" height="280" rx="8" fill="url(#unsupervisedGrad)" stroke="#2196F3" stroke-width="2" filter="url(#shadow)"/>
  
  <!-- Unsupervised Learning Title -->
  <text x="570" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1565c0">
    Unsupervised Learning
  </text>
  
  <!-- Unsupervised Learning Content -->
  <text x="570" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#0d47a1">
    Pattern Discovery
  </text>
  
  <!-- Data representation for unsupervised -->
  <g>
    <rect x="440" y="200" width="260" height="80" rx="5" fill="#ffffff" stroke="#2196F3" stroke-width="1"/>
    <text x="570" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1565c0">
      Training Data: Input only
    </text>
    
    <!-- Example data points without labels -->
    <circle cx="460" cy="240" r="8" fill="#2196F3"/>
    <text x="475" y="245" font-family="Arial, sans-serif" font-size="10" fill="#1565c0">Email</text>
    
    <circle cx="460" cy="255" r="8" fill="#2196F3"/>
    <text x="475" y="260" font-family="Arial, sans-serif" font-size="10" fill="#1565c0">Email</text>
    
    <circle cx="590" cy="240" r="8" fill="#2196F3"/>
    <text x="605" y="245" font-family="Arial, sans-serif" font-size="10" fill="#1565c0">Customer</text>
    
    <circle cx="590" cy="255" r="8" fill="#2196F3"/>
    <text x="605" y="260" font-family="Arial, sans-serif" font-size="10" fill="#1565c0">Customer</text>
    
    <!-- Grouping arrows -->
    <path d="M 470 240 Q 520 230 570 240" stroke="#ff9800" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <text x="520" y="228" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#ff9800">group?</text>
  </g>
  
  <!-- Unsupervised Learning Features -->
  <text x="440" y="305" font-family="Arial, sans-serif" font-size="12" fill="#1565c0">
    ✓ No labeling required
  </text>
  <text x="440" y="325" font-family="Arial, sans-serif" font-size="12" fill="#1565c0">
    ✓ Discovers hidden patterns
  </text>
  <text x="440" y="345" font-family="Arial, sans-serif" font-size="12" fill="#1565c0">
    ✓ Exploratory insights
  </text>
  <text x="440" y="365" font-family="Arial, sans-serif" font-size="12" fill="#1565c0">
    ✗ Harder to evaluate
  </text>
  <text x="440" y="385" font-family="Arial, sans-serif" font-size="12" fill="#1565c0">
    ✗ Results interpretation
  </text>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
     refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff9800" />
    </marker>
  </defs>
  
  <!-- Bottom note -->
  <text x="400" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d" font-style="italic">
    Choose based on data availability and problem objectives
  </text>
</svg>