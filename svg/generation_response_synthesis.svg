<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1400" height="1000" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="700" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Response Synthesis Methods
  </text>
  <text x="700" y="70" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#495057">
    Different Approaches to Generate High-Quality Responses
  </text>
  
  <!-- Input -->
  <rect x="50" y="110" width="200" height="100" rx="10" fill="#e9ecef" stroke="#495057" stroke-width="2"/>
  <text x="150" y="145" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    📥 Input
  </text>
  <text x="150" y="168" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#495057">
    Prompt + Context
  </text>
  <text x="150" y="188" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#495057">
    User Query
  </text>
  
  <!-- Arrow -->
  <path d="M 250 160 L 330 160" stroke="#495057" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Synthesis Methods Container -->
  <rect x="330" y="110" width="1020" height="780" rx="15" fill="#d0ebff" stroke="#1c7ed6" stroke-width="4"/>
  <text x="840" y="150" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Response Synthesis Approaches
  </text>
  
  <!-- Method 1: Direct Generation -->
  <g id="direct-generation">
    <rect x="360" y="180" width="460" height="160" rx="10" fill="#fff" stroke="#1c7ed6" stroke-width="3"/>
    <text x="590" y="215" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1c7ed6">
      1️⃣ Direct Generation
    </text>
    <text x="380" y="240" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#868e96">
      Single LLM call with full context
    </text>
    
    <rect x="380" y="255" width="420" height="70" rx="8" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="2"/>
    <text x="400" y="275" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      Process: Prompt + Context → LLM → Response
    </text>
    <text x="400" y="293" font-family="Arial, sans-serif" font-size="11" fill="#37b24d">
      ✓ Fast and straightforward
    </text>
    <text x="400" y="311" font-family="Arial, sans-serif" font-size="11" fill="#37b24d">
      ✓ Best for simple queries
    </text>
  </g>
  
  <!-- Method 2: Iterative Refinement -->
  <g id="iterative-refinement">
    <rect x="360" y="360" width="460" height="190" rx="10" fill="#fff" stroke="#1c7ed6" stroke-width="3"/>
    <text x="590" y="395" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1c7ed6">
      2️⃣ Iterative Refinement
    </text>
    <text x="380" y="420" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#868e96">
      Self-critique and improvement through multiple passes
    </text>
    
    <rect x="380" y="435" width="420" height="100" rx="8" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="2"/>
    <text x="400" y="455" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      Process:
    </text>
    <text x="400" y="473" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      1. Generate initial response
    </text>
    <text x="400" y="491" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      2. Self-critique → Identify improvements
    </text>
    <text x="400" y="509" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      3. Refine response → Repeat if needed
    </text>
    <text x="400" y="527" font-family="Arial, sans-serif" font-size="11" fill="#37b24d">
      ✓ Higher quality but slower
    </text>
  </g>
  
  <!-- Method 3: Multi-Step Reasoning -->
  <g id="multi-step">
    <rect x="360" y="570" width="460" height="150" rx="10" fill="#fff" stroke="#1c7ed6" stroke-width="3"/>
    <text x="590" y="605" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1c7ed6">
      3️⃣ Multi-Step Reasoning
    </text>
    <text x="380" y="630" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#868e96">
      Break complex queries into sub-questions
    </text>
    
    <rect x="380" y="645" width="420" height="60" rx="8" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="2"/>
    <text x="400" y="665" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      Query → Sub-Q1, Sub-Q2, Sub-Q3 → Answer each
    </text>
    <text x="400" y="683" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      → Synthesize final comprehensive response
    </text>
    <text x="400" y="701" font-family="Arial, sans-serif" font-size="11" fill="#37b24d">
      ✓ Ideal for complex, multi-faceted queries
    </text>
  </g>
  
  <!-- Method 4: Ensemble Methods -->
  <g id="ensemble">
    <rect x="360" y="740" width="460" height="130" rx="10" fill="#fff" stroke="#1c7ed6" stroke-width="3"/>
    <text x="590" y="775" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1c7ed6">
      4️⃣ Ensemble Methods
    </text>
    <text x="380" y="800" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#868e96">
      Generate multiple candidates and combine
    </text>
    
    <rect x="380" y="815" width="420" height="40" rx="8" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="2"/>
    <text x="400" y="835" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      Generate N responses → Rank/Vote → Select best
    </text>
    <text x="400" y="851" font-family="Arial, sans-serif" font-size="11" fill="#37b24d">
      ✓ Higher quality but resource-intensive
    </text>
  </g>
  
  <!-- Generation Parameters -->
  <rect x="850" y="180" width="470" height="360" rx="10" fill="#fff3bf" stroke="#fab005" stroke-width="3"/>
  <text x="1085" y="215" font-family="Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    ⚙️ Generation Parameters
  </text>
  
  <!-- Temperature -->
  <g id="temperature">
    <rect x="870" y="235" width="430" height="70" rx="8" fill="#fff" stroke="#fab005" stroke-width="2"/>
    <text x="890" y="258" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fab005">
      Temperature (0.0 - 2.0)
    </text>
    <text x="890" y="276" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      Controls randomness/creativity
    </text>
    <text x="890" y="292" font-family="Arial, sans-serif" font-size="10" fill="#37b24d">
      RAG Recommendation: 0.1-0.3 (low = factual accuracy)
    </text>
  </g>
  
  <!-- Top-p -->
  <g id="top-p">
    <rect x="870" y="315" width="430" height="70" rx="8" fill="#fff" stroke="#fab005" stroke-width="2"/>
    <text x="890" y="338" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fab005">
      Top-p / Nucleus Sampling (0.0 - 1.0)
    </text>
    <text x="890" y="356" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      Controls diversity of token selection
    </text>
    <text x="890" y="372" font-family="Arial, sans-serif" font-size="10" fill="#37b24d">
      RAG Recommendation: 0.9 (balanced diversity)
    </text>
  </g>
  
  <!-- Max Tokens -->
  <g id="max-tokens">
    <rect x="870" y="395" width="430" height="60" rx="8" fill="#fff" stroke="#fab005" stroke-width="2"/>
    <text x="890" y="418" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fab005">
      Max Tokens
    </text>
    <text x="890" y="436" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      Limits response length • Set based on use case
    </text>
  </g>
  
  <!-- Penalties -->
  <g id="penalties">
    <rect x="870" y="465" width="430" height="65" rx="8" fill="#fff" stroke="#fab005" stroke-width="2"/>
    <text x="890" y="488" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fab005">
      Presence/Frequency Penalty (-2.0 to 2.0)
    </text>
    <text x="890" y="506" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      Reduce repetition • Encourage variety
    </text>
    <text x="890" y="522" font-family="Arial, sans-serif" font-size="10" fill="#37b24d">
      RAG Recommendation: 0.5 for presence penalty
    </text>
  </g>
  
  <!-- Edge Case Handling -->
  <rect x="850" y="560" width="470" height="330" rx="10" fill="#fff5f5" stroke="#c92a2a" stroke-width="3"/>
  <text x="1085" y="595" font-family="Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    🚨 Handling Edge Cases
  </text>
  
  <!-- Insufficient Context -->
  <g id="insufficient">
    <rect x="870" y="615" width="430" height="75" rx="8" fill="#fff" stroke="#c92a2a" stroke-width="2"/>
    <text x="890" y="638" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#c92a2a">
      Insufficient Context
    </text>
    <rect x="890" y="648" width="410" height="30" rx="4" fill="#f8f9fa" stroke="#c92a2a" stroke-width="1"/>
    <text x="900" y="663" font-family="Courier, monospace" font-size="8" fill="#495057">
      "I can partially answer... However, I don't
    </text>
    <text x="900" y="673" font-family="Courier, monospace" font-size="8" fill="#495057">
      have sufficient info about [specific gaps]."
    </text>
  </g>
  
  <!-- Contradictory Information -->
  <g id="contradictory">
    <rect x="870" y="700" width="430" height="85" rx="8" fill="#fff" stroke="#c92a2a" stroke-width="2"/>
    <text x="890" y="723" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#c92a2a">
      Contradictory Information
    </text>
    <rect x="890" y="733" width="410" height="40" rx="4" fill="#f8f9fa" stroke="#c92a2a" stroke-width="1"/>
    <text x="900" y="748" font-family="Courier, monospace" font-size="8" fill="#495057">
      "The sources provide different perspectives:
    </text>
    <text x="900" y="758" font-family="Courier, monospace" font-size="8" fill="#495057">
      Source 1: [A]  Source 2: [B]
    </text>
    <text x="900" y="768" font-family="Courier, monospace" font-size="8" fill="#495057">
      Most recent/authoritative suggests [C]."
    </text>
  </g>
  
  <!-- Out of Scope -->
  <g id="out-of-scope">
    <rect x="870" y="795" width="430" height="75" rx="8" fill="#fff" stroke="#c92a2a" stroke-width="2"/>
    <text x="890" y="818" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#c92a2a">
      Out-of-Scope Query
    </text>
    <rect x="890" y="828" width="410" height="30" rx="4" fill="#f8f9fa" stroke="#c92a2a" stroke-width="1"/>
    <text x="900" y="843" font-family="Courier, monospace" font-size="8" fill="#495057">
      "The provided context doesn't contain info
    </text>
    <text x="900" y="853" font-family="Courier, monospace" font-size="8" fill="#495057">
      about [topic]. I can only answer from docs."
    </text>
  </g>
  
  <!-- Decision Matrix -->
  <rect x="50" y="240" width="240" height="350" rx="10" fill="#d3f9d8" stroke="#37b24d" stroke-width="2"/>
  <text x="170" y="270" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    📊 Method Selection
  </text>
  
  <text x="70" y="300" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#37b24d">
    Use Direct Generation:
  </text>
  <text x="70" y="318" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    • Simple factual queries
  </text>
  <text x="70" y="334" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    • Speed is critical
  </text>
  <text x="70" y="350" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    • Cost-sensitive
  </text>
  
  <text x="70" y="380" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#37b24d">
    Use Iterative Refinement:
  </text>
  <text x="70" y="398" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    • Quality > speed
  </text>
  <text x="70" y="414" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    • Complex explanations
  </text>
  <text x="70" y="430" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    • Need high accuracy
  </text>
  
  <text x="70" y="460" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#37b24d">
    Use Multi-Step:
  </text>
  <text x="70" y="478" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    • Multi-faceted queries
  </text>
  <text x="70" y="494" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    • Complex reasoning
  </text>
  <text x="70" y="510" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    • Multiple sub-topics
  </text>
  
  <text x="70" y="540" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#37b24d">
    Use Ensemble:
  </text>
  <text x="70" y="558" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    • Critical applications
  </text>
  <text x="70" y="574" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    • Need highest quality
  </text>
  
  <!-- Arrow to output -->
  <path d="M 840 450 L 840 930" stroke="#1c7ed6" stroke-width="3" fill="none" marker-end="url(#arrowhead2)"/>
  
  <!-- Output -->
  <rect x="540" y="930" width="600" height="50" rx="10" fill="#d3f9d8" stroke="#37b24d" stroke-width="3"/>
  <text x="840" y="962" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    ✅ Synthesized Response - Ready for Formatting &amp; Validation
  </text>
  
  <!-- Best Practice Note -->
  <rect x="50" y="620" width="240" height="270" rx="10" fill="#e9d5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="170" y="650" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#9333ea">
    💡 Best Practices
  </text>
  
  <text x="70" y="680" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    ✓ Set low temperature for
  </text>
  <text x="70" y="695" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    factual accuracy
  </text>
  
  <text x="70" y="720" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    ✓ Use retry logic for API
  </text>
  <text x="70" y="735" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    failures
  </text>
  
  <text x="70" y="760" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    ✓ Stream responses for
  </text>
  <text x="70" y="775" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    better UX
  </text>
  
  <text x="70" y="800" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    ✓ Monitor token usage
  </text>
  <text x="70" y="815" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    and costs
  </text>
  
  <text x="70" y="840" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    ✓ Cache common responses
  </text>
  
  <text x="70" y="865" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    ✓ Handle edge cases
  </text>
  <text x="70" y="880" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    gracefully
  </text>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#495057"/>
    </marker>
    <marker id="arrowhead2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#1c7ed6"/>
    </marker>
  </defs>
</svg>