<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="boxGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fefce8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fde047;stop-opacity:0.3" />
    </linearGradient>
    <linearGradient id="boxGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0fdf4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:0.3" />
    </linearGradient>
    <filter id="shadow">
      <dropshadow dx="2" dy="2" stddeviation="3" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#f8fafc"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="800" height="70" fill="url(#headerGrad)"/>
  <text x="400" y="35" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="bold" dy="0.35em">Problem Definition Framework</text>
  
  <!-- Business Understanding Section -->
  <rect x="50" y="100" width="700" height="120" fill="url(#boxGrad1)" stroke="#475569" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="70" y="125" fill="#1e293b" font-family="Arial, sans-serif" font-size="18" font-weight="bold">1. Business Understanding</text>
  
  <!-- Business boxes -->
  <rect x="70" y="140" width="150" height="70" fill="url(#boxGrad2)" stroke="#ca8a04" stroke-width="1.5" rx="5"/>
  <text x="145" y="155" text-anchor="middle" fill="#713f12" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Business Objectives</text>
  <text x="145" y="170" text-anchor="middle" fill="#713f12" font-family="Arial, sans-serif" font-size="10">• Define Goals</text>
  <text x="145" y="183" text-anchor="middle" fill="#713f12" font-family="Arial, sans-serif" font-size="10">• Set KPIs</text>
  <text x="145" y="196" text-anchor="middle" fill="#713f12" font-family="Arial, sans-serif" font-size="10">• Success Criteria</text>
  
  <rect x="240" y="140" width="150" height="70" fill="url(#boxGrad2)" stroke="#ca8a04" stroke-width="1.5" rx="5"/>
  <text x="315" y="155" text-anchor="middle" fill="#713f12" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Stakeholder Alignment</text>
  <text x="315" y="170" text-anchor="middle" fill="#713f12" font-family="Arial, sans-serif" font-size="10">• Requirements</text>
  <text x="315" y="183" text-anchor="middle" fill="#713f12" font-family="Arial, sans-serif" font-size="10">• Expectations</text>
  <text x="315" y="196" text-anchor="middle" fill="#713f12" font-family="Arial, sans-serif" font-size="10">• Constraints</text>
  
  <rect x="410" y="140" width="150" height="70" fill="url(#boxGrad2)" stroke="#ca8a04" stroke-width="1.5" rx="5"/>
  <text x="485" y="155" text-anchor="middle" fill="#713f12" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Resource Assessment</text>
  <text x="485" y="170" text-anchor="middle" fill="#713f12" font-family="Arial, sans-serif" font-size="10">• Budget</text>
  <text x="485" y="183" text-anchor="middle" fill="#713f12" font-family="Arial, sans-serif" font-size="10">• Timeline</text>
  <text x="485" y="196" text-anchor="middle" fill="#713f12" font-family="Arial, sans-serif" font-size="10">• Team Skills</text>
  
  <rect x="580" y="140" width="150" height="70" fill="url(#boxGrad2)" stroke="#ca8a04" stroke-width="1.5" rx="5"/>
  <text x="655" y="155" text-anchor="middle" fill="#713f12" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Risk Analysis</text>
  <text x="655" y="170" text-anchor="middle" fill="#713f12" font-family="Arial, sans-serif" font-size="10">• Technical Risks</text>
  <text x="655" y="183" text-anchor="middle" fill="#713f12" font-family="Arial, sans-serif" font-size="10">• Business Risks</text>
  <text x="655" y="196" text-anchor="middle" fill="#713f12" font-family="Arial, sans-serif" font-size="10">• Mitigation</text>
  
  <!-- Problem Formulation Section -->
  <rect x="50" y="240" width="700" height="120" fill="url(#boxGrad1)" stroke="#475569" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="70" y="265" fill="#1e293b" font-family="Arial, sans-serif" font-size="18" font-weight="bold">2. Problem Formulation</text>
  
  <!-- Problem formulation boxes -->
  <rect x="70" y="280" width="160" height="70" fill="url(#boxGrad3)" stroke="#16a34a" stroke-width="1.5" rx="5"/>
  <text x="150" y="295" text-anchor="middle" fill="#14532d" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Problem Type</text>
  <text x="150" y="310" text-anchor="middle" fill="#14532d" font-family="Arial, sans-serif" font-size="10">• Classification</text>
  <text x="150" y="323" text-anchor="middle" fill="#14532d" font-family="Arial, sans-serif" font-size="10">• Regression</text>
  <text x="150" y="336" text-anchor="middle" fill="#14532d" font-family="Arial, sans-serif" font-size="10">• Clustering</text>
  
  <rect x="250" y="280" width="160" height="70" fill="url(#boxGrad3)" stroke="#16a34a" stroke-width="1.5" rx="5"/>
  <text x="330" y="295" text-anchor="middle" fill="#14532d" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Target Definition</text>
  <text x="330" y="310" text-anchor="middle" fill="#14532d" font-family="Arial, sans-serif" font-size="10">• Target Variable</text>
  <text x="330" y="323" text-anchor="middle" fill="#14532d" font-family="Arial, sans-serif" font-size="10">• Prediction Horizon</text>
  <text x="330" y="336" text-anchor="middle" fill="#14532d" font-family="Arial, sans-serif" font-size="10">• Success Metrics</text>
  
  <rect x="430" y="280" width="160" height="70" fill="url(#boxGrad3)" stroke="#16a34a" stroke-width="1.5" rx="5"/>
  <text x="510" y="295" text-anchor="middle" fill="#14532d" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Data Requirements</text>
  <text x="510" y="310" text-anchor="middle" fill="#14532d" font-family="Arial, sans-serif" font-size="10">• Data Sources</text>
  <text x="510" y="323" text-anchor="middle" fill="#14532d" font-family="Arial, sans-serif" font-size="10">• Data Quality</text>
  <text x="510" y="336" text-anchor="middle" fill="#14532d" font-family="Arial, sans-serif" font-size="10">• Volume & Velocity</text>
  
  <rect x="610" y="280" width="120" height="70" fill="url(#boxGrad3)" stroke="#16a34a" stroke-width="1.5" rx="5"/>
  <text x="670" y="295" text-anchor="middle" fill="#14532d" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Baseline</text>
  <text x="670" y="310" text-anchor="middle" fill="#14532d" font-family="Arial, sans-serif" font-size="10">• Current State</text>
  <text x="670" y="323" text-anchor="middle" fill="#14532d" font-family="Arial, sans-serif" font-size="10">• Benchmark</text>
  <text x="670" y="336" text-anchor="middle" fill="#14532d" font-family="Arial, sans-serif" font-size="10">• Minimum Viable</text>
  
  <!-- Arrows -->
  <path d="M 400 220 L 400 240" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Success Metrics Box -->
  <rect x="200" y="380" width="400" height="140" fill="#fefce8" stroke="#ca8a04" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="400" y="405" text-anchor="middle" fill="#713f12" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Success Measurement Framework</text>
  
  <!-- Mathematical formulas -->
  <text x="220" y="430" fill="#713f12" font-family="Arial, sans-serif" font-size="12">ROI = (Business Value - Investment) / Investment × 100%</text>
  <text x="220" y="450" fill="#713f12" font-family="Arial, sans-serif" font-size="12">Success Rate = Objectives Met / Total Objectives × 100%</text>
  <text x="220" y="470" fill="#713f12" font-family="Arial, sans-serif" font-size="12">Value Delivery Time = Project Duration / Milestones Achieved</text>
  <text x="220" y="490" fill="#713f12" font-family="Arial, sans-serif" font-size="12">Stakeholder Satisfaction = (Expectations Met / Total Expectations) × 100%</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
  </defs>
  
  <!-- Footer note -->
  <text x="400" y="570" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="11" font-style="italic">Clear problem definition is the foundation of successful data science projects</text>
</svg>