<svg viewBox="0 0 1200 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="1000" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="600" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Penalized Regression Methods: Decision Flowchart
  </text>
  
  <!-- Start: Problem Characteristics -->
  <g transform="translate(450, 80)">
    <rect x="0" y="0" width="300" height="70" fill="#3498db" stroke="#2980b9" stroke-width="3" rx="35"/>
    <text x="150" y="35" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
      START: Your Regression Problem
    </text>
    <text x="150" y="52" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
      High-dimensional setting (p ≥ n)
    </text>
  </g>
  
  <!-- Arrow down -->
  <line x1="600" y1="150" x2="600" y2="200" stroke="#34495e" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Decision 1: Sparsity expectation -->
  <g transform="translate(350, 200)">
    <path d="M 250 0 L 450 50 L 250 100 L 50 50 Z" fill="#f39c12" stroke="#d68910" stroke-width="3"/>
    <text x="250" y="45" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">
      Do you expect a
    </text>
    <text x="250" y="63" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">
      SPARSE model?
    </text>
  </g>
  
  <!-- Left branch: YES (Sparse) -->
  <g transform="translate(200, 250)">
    <line x1="150" y1="50" x2="50" y2="150" stroke="#34495e" stroke-width="3" marker-end="url(#arrowhead)"/>
    <text x="85" y="90" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#27ae60">YES</text>
    <text x="85" y="105" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">(Few important)</text>
    <text x="85" y="118" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">(predictors)</text>
  </g>
  
  <!-- Right branch: NO (Dense) -->
  <g transform="translate(650, 250)">
    <line x1="150" y1="50" x2="250" y2="150" stroke="#34495e" stroke-width="3" marker-end="url(#arrowhead)"/>
    <text x="215" y="90" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e74c3c">NO</text>
    <text x="215" y="105" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">(Many relevant)</text>
    <text x="215" y="118" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">(predictors)</text>
  </g>
  
  <!-- Decision 2a: Need variable selection? (Sparse path) -->
  <g transform="translate(50, 400)">
    <path d="M 150 0 L 300 40 L 150 80 L 0 40 Z" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
    <text x="150" y="35" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">
      Need variable
    </text>
    <text x="150" y="50" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">
      selection?
    </text>
  </g>
  
  <!-- Decision 2b: Sparse + Dense pattern? (Dense path) -->
  <g transform="translate(750, 400)">
    <path d="M 150 0 L 300 40 L 150 80 L 0 40 Z" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
    <text x="150" y="35" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">
      Mixed sparse +
    </text>
    <text x="150" y="50" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">
      dense pattern?
    </text>
  </g>
  
  <!-- Arrows from Decision 2a -->
  <line x1="80" y1="480" x2="80" y2="550" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="50" y="520" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#27ae60">YES</text>
  
  <line x1="320" y1="480" x2="400" y2="550" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="370" y="520" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#e74c3c">NO</text>
  
  <!-- Arrows from Decision 2b -->
  <line x1="780" y1="480" x2="650" y2="550" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="700" y="520" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#27ae60">YES</text>
  
  <line x1="1020" y1="480" x2="1080" y2="550" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="1060" y="520" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#e74c3c">NO</text>
  
  <!-- Method 1: LASSO -->
  <g transform="translate(0, 550)">
    <rect x="0" y="0" width="160" height="180" fill="#27ae60" stroke="#229954" stroke-width="3" rx="8"/>
    <text x="80" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
      LASSO
    </text>
    <text x="80" y="45" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
      (L1 Penalty)
    </text>
    
    <line x1="10" y1="55" x2="150" y2="55" stroke="white" stroke-width="1" opacity="0.5"/>
    
    <text x="10" y="75" font-family="Arial, sans-serif" font-size="10" fill="white">
      ✓ Variable selection
    </text>
    <text x="10" y="92" font-family="Arial, sans-serif" font-size="10" fill="white">
      ✓ Interpretable
    </text>
    <text x="10" y="109" font-family="Arial, sans-serif" font-size="10" fill="white">
      ✓ Sparse solutions
    </text>
    <text x="10" y="126" font-family="Arial, sans-serif" font-size="10" fill="white">
      ✓ Sets β to zero
    </text>
    
    <rect x="5" y="140" width="150" height="35" fill="white" opacity="0.2" rx="3"/>
    <text x="80" y="158" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white" font-weight="bold">
      λΣ|βⱼ|
    </text>
  </g>
  
  <!-- Method 2: Elastic Net -->
  <g transform="translate(330, 550)">
    <rect x="0" y="0" width="160" height="180" fill="#e67e22" stroke="#d35400" stroke-width="3" rx="8"/>
    <text x="80" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
      Elastic Net
    </text>
    <text x="80" y="45" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
      (L1 + L2)
    </text>
    
    <line x1="10" y1="55" x2="150" y2="55" stroke="white" stroke-width="1" opacity="0.5"/>
    
    <text x="10" y="75" font-family="Arial, sans-serif" font-size="10" fill="white">
      ✓ Variable selection
    </text>
    <text x="10" y="92" font-family="Arial, sans-serif" font-size="10" fill="white">
      ✓ Handles correlation
    </text>
    <text x="10" y="109" font-family="Arial, sans-serif" font-size="10" fill="white">
      ✓ Balanced approach
    </text>
    <text x="10" y="126" font-family="Arial, sans-serif" font-size="10" fill="white">
      ✓ Best of both
    </text>
    
    <rect x="5" y="140" width="150" height="35" fill="white" opacity="0.2" rx="3"/>
    <text x="80" y="158" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white" font-weight="bold">
      λ₁Σβⱼ² + λ₂Σ|βⱼ|
    </text>
  </g>
  
  <!-- Method 3: Lava -->
  <g transform="translate(540, 550)">
    <rect x="0" y="0" width="160" height="180" fill="#9b59b6" stroke="#8e44ad" stroke-width="3" rx="8"/>
    <text x="80" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
      LAVA
    </text>
    <text x="80" y="45" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
      (Split: γ + δ)
    </text>
    
    <line x1="10" y1="55" x2="150" y2="55" stroke="white" stroke-width="1" opacity="0.5"/>
    
    <text x="10" y="75" font-family="Arial, sans-serif" font-size="10" fill="white">
      ✓ Least aggressive
    </text>
    <text x="10" y="92" font-family="Arial, sans-serif" font-size="10" fill="white">
      ✓ No variable selection
    </text>
    <text x="10" y="109" font-family="Arial, sans-serif" font-size="10" fill="white">
      ✓ Best for mixed
    </text>
    <text x="10" y="126" font-family="Arial, sans-serif" font-size="10" fill="white">
      ✓ High accuracy
    </text>
    
    <rect x="5" y="140" width="150" height="35" fill="white" opacity="0.2" rx="3"/>
    <text x="80" y="158" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white" font-weight="bold">
      Σγⱼ² + Σ|δⱼ|
    </text>
  </g>
  
  <!-- Method 4: Ridge -->
  <g transform="translate(1000, 550)">
    <rect x="0" y="0" width="160" height="180" fill="#3498db" stroke="#2980b9" stroke-width="3" rx="8"/>
    <text x="80" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
      RIDGE
    </text>
    <text x="80" y="45" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
      (L2 Penalty)
    </text>
    
    <line x1="10" y1="55" x2="150" y2="55" stroke="white" stroke-width="1" opacity="0.5"/>
    
    <text x="10" y="75" font-family="Arial, sans-serif" font-size="10" fill="white">
      ✓ Dense solutions
    </text>
    <text x="10" y="92" font-family="Arial, sans-serif" font-size="10" fill="white">
      ✓ Stable estimates
    </text>
    <text x="10" y="109" font-family="Arial, sans-serif" font-size="10" fill="white">
      ✓ Multicollinearity
    </text>
    <text x="10" y="126" font-family="Arial, sans-serif" font-size="10" fill="white">
      ✓ Shrinks smoothly
    </text>
    
    <rect x="5" y="140" width="150" height="35" fill="white" opacity="0.2" rx="3"/>
    <text x="80" y="158" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white" font-weight="bold">
      λΣβⱼ²
    </text>
  </g>
  
  <!-- Additional consideration boxes -->
  <g transform="translate(50, 770)">
    <rect x="0" y="0" width="200" height="80" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2" rx="5"/>
    <text x="100" y="20" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#34495e">
      When to use:
    </text>
    <text x="10" y="40" font-family="Arial, sans-serif" font-size="9" fill="#34495e">
      • Clear sparse signal
    </text>
    <text x="10" y="55" font-family="Arial, sans-serif" font-size="9" fill="#34495e">
      • Need interpretability
    </text>
    <text x="10" y="70" font-family="Arial, sans-serif" font-size="9" fill="#34495e">
      • Feature identification
    </text>
  </g>
  
  <g transform="translate(280, 770)">
    <rect x="0" y="0" width="200" height="80" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2" rx="5"/>
    <text x="100" y="20" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#34495e">
      When to use:
    </text>
    <text x="10" y="40" font-family="Arial, sans-serif" font-size="9" fill="#34495e">
      • Correlated predictors
    </text>
    <text x="10" y="55" font-family="Arial, sans-serif" font-size="9" fill="#34495e">
      • Uncertain sparsity
    </text>
    <text x="10" y="70" font-family="Arial, sans-serif" font-size="9" fill="#34495e">
      • Need both properties
    </text>
  </g>
  
  <g transform="translate(510, 770)">
    <rect x="0" y="0" width="200" height="80" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2" rx="5"/>
    <text x="100" y="20" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#34495e">
      When to use:
    </text>
    <text x="10" y="40" font-family="Arial, sans-serif" font-size="9" fill="#34495e">
      • Complex patterns
    </text>
    <text x="10" y="55" font-family="Arial, sans-serif" font-size="9" fill="#34495e">
      • Maximum accuracy
    </text>
    <text x="10" y="70" font-family="Arial, sans-serif" font-size="9" fill="#34495e">
      • Mixed signal types
    </text>
  </g>
  
  <g transform="translate(740, 770)">
    <rect x="0" y="0" width="200" height="80" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2" rx="5"/>
    <text x="100" y="20" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#34495e">
      When to use:
    </text>
    <text x="10" y="40" font-family="Arial, sans-serif" font-size="9" fill="#34495e">
      • All features relevant
    </text>
    <text x="10" y="55" font-family="Arial, sans-serif" font-size="9" fill="#34495e">
      • High correlation
    </text>
    <text x="10" y="70" font-family="Arial, sans-serif" font-size="9" fill="#34495e">
      • Stable predictions
    </text>
  </g>
  
  <!-- Bottom summary panel -->
  <g transform="translate(100, 890)">
    <rect x="0" y="0" width="1000" height="90" fill="#fff3cd" stroke="#f39c12" stroke-width="2" rx="8"/>
    <text x="500" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#856404">
      💡 Key Selection Principle
    </text>
    <text x="500" y="48" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">
      The choice depends on your model's structure: SPARSE models → Lasso/Elastic Net | DENSE models → Ridge/Lava
    </text>
    <text x="500" y="66" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">
      Use cross-validation to tune penalty parameters (λ) and compare methods empirically
    </text>
  </g>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#34495e"/>
    </marker>
  </defs>
</svg>