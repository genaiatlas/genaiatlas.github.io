<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="monkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8d6e63;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#5d4037;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="group1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f5e8;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#c8e6c9;stop-opacity:0.9"/>
    </linearGradient>
    <linearGradient id="group2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e3f2fd;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#bbdefb;stop-opacity:0.9"/>
    </linearGradient>
    <linearGradient id="group3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff3e0;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#ffcc02;stop-opacity:0.4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="600" fill="#f5f5f5"/>
  
  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#2c3e50">
    Unsupervised Learning: Monastery Social Network Discovery
  </text>
  
  <!-- Problem Description -->
  <text x="450" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#5d4037" font-style="italic">
    Frank Simpson's 1960s study: Discovering friendship patterns among novice monks
  </text>
  
  <!-- Input Data Section -->
  <rect x="50" y="80" width="350" height="180" rx="10" fill="#ffffff" stroke="#5d4037" stroke-width="2" filter="url(#shadow)"/>
  <text x="225" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#5d4037">
    📊 Input Data: Interaction Records
  </text>
  
  <text x="70" y="130" font-family="Arial, sans-serif" font-size="12" fill="#3e2723">
    • Who talks to whom during meals
  </text>
  <text x="70" y="145" font-family="Arial, sans-serif" font-size="12" fill="#3e2723">
    • Frequency of conversations
  </text>
  <text x="70" y="160" font-family="Arial, sans-serif" font-size="12" fill="#3e2723">
    • Time spent together in activities
  </text>
  <text x="70" y="175" font-family="Arial, sans-serif" font-size="12" fill="#3e2723">
    • Seating arrangements in chapel
  </text>
  <text x="70" y="190" font-family="Arial, sans-serif" font-size="12" fill="#3e2723">
    • Walking partnerships in gardens
  </text>
  
  <text x="225" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#8d6e63">
    🚫 No Predefined Groups or Labels
  </text>
  <text x="225" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#8d6e63">
    Goal: Discover natural social structures
  </text>
  
  <!-- Algorithm Process -->
  <path d="M 420 170 L 480 170" stroke="#9c27b0" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="450" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#9c27b0">
    Network Analysis
  </text>
  <text x="450" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#9c27b0">
    Clustering Algorithm
  </text>
  
  <!-- Discovered Network -->
  <rect x="500" y="80" width="350" height="450" rx="10" fill="#ffffff" stroke="#5d4037" stroke-width="2" filter="url(#shadow)"/>
  <text x="675" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#5d4037">
    🔍 Discovered Social Groups
  </text>
  
  <!-- Group 1: Study Circle (Green) -->
  <ellipse cx="600" cy="180" rx="75" ry="55" fill="url(#group1Grad)" stroke="#4caf50" stroke-width="2" opacity="0.8"/>
  <text x="600" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2e7d32">
    📚 Study Circle
  </text>
  
  <!-- Monks in Group 1 -->
  <circle cx="570" cy="165" r="12" fill="url(#monkGrad)" stroke="#4caf50" stroke-width="2"/>
  <text x="570" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#ffffff" font-weight="bold">A</text>
  
  <circle cx="630" cy="165" r="12" fill="url(#monkGrad)" stroke="#4caf50" stroke-width="2"/>
  <text x="630" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#ffffff" font-weight="bold">B</text>
  
  <circle cx="600" cy="200" r="12" fill="url(#monkGrad)" stroke="#4caf50" stroke-width="2"/>
  <text x="600" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#ffffff" font-weight="bold">C</text>
  
  <!-- Connections within Group 1 -->
  <line x1="582" y1="165" x2="618" y2="165" stroke="#4caf50" stroke-width="2"/>
  <line x1="575" y1="175" x2="595" y2="190" stroke="#4caf50" stroke-width="2"/>
  <line x1="625" y1="175" x2="605" y2="190" stroke="#4caf50" stroke-width="2"/>
  
  <!-- Group 2: Recreation Group (Blue) -->
  <ellipse cx="750" cy="200" rx="70" ry="60" fill="url(#group2Grad)" stroke="#2196f3" stroke-width="2" opacity="0.8"/>
  <text x="750" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1565c0">
    ⛺ Recreation Group
  </text>
  
  <!-- Monks in Group 2 -->
  <circle cx="720" cy="180" r="12" fill="url(#monkGrad)" stroke="#2196f3" stroke-width="2"/>
  <text x="720" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#ffffff" font-weight="bold">D</text>
  
  <circle cx="780" cy="180" r="12" fill="url(#monkGrad)" stroke="#2196f3" stroke-width="2"/>
  <text x="780" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#ffffff" font-weight="bold">E</text>
  
  <circle cx="750" cy="220" r="12" fill="url(#monkGrad)" stroke="#2196f3" stroke-width="2"/>
  <text x="750" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#ffffff" font-weight="bold">F</text>
  
  <circle cx="720" cy="240" r="12" fill="url(#monkGrad)" stroke="#2196f3" stroke-width="2"/>
  <text x="720" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#ffffff" font-weight="bold">G</text>
  
  <!-- Connections within Group 2 -->
  <line x1="732" y1="180" x2="768" y2="180" stroke="#2196f3" stroke-width="2"/>
  <line x1="725" y1="190" x2="745" y2="210" stroke="#2196f3" stroke-width="2"/>
  <line x1="775" y1="190" x2="755" y2="210" stroke="#2196f3" stroke-width="2"/>
  <line x1="732" y1="240" x2="738" y2="220" stroke="#2196f3" stroke-width="2"/>
  
  <!-- Group 3: Work Team (Orange) -->
  <ellipse cx="650" cy="350" rx="65" ry="50" fill="url(#group3Grad)" stroke="#ff9800" stroke-width="2" opacity="0.8"/>
  <text x="650" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#e65100">
    🛠️ Work Team
  </text>
  
  <!-- Monks in Group 3 -->
  <circle cx="620" cy="335" r="12" fill="url(#monkGrad)" stroke="#ff9800" stroke-width="2"/>
  <text x="620" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#ffffff" font-weight="bold">H</text>
  
  <circle cx="680" cy="335" r="12" fill="url(#monkGrad)" stroke="#ff9800" stroke-width="2"/>
  <text x="680" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#ffffff" font-weight="bold">I</text>
  
  <circle cx="650" cy="365" r="12" fill="url(#monkGrad)" stroke="#ff9800" stroke-width="2"/>
  <text x="650" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#ffffff" font-weight="bold">J</text>
  
  <!-- Connections within Group 3 -->
  <line x1="632" y1="335" x2="668" y2="335" stroke="#ff9800" stroke-width="2"/>
  <line x1="625" y1="345" x2="645" y2="355" stroke="#ff9800" stroke-width="2"/>
  <line x1="675" y1="345" x2="655" y2="355" stroke="#ff9800" stroke-width="2"/>
  
  <!-- Bridge connections (weaker) -->
  <line x1="600" y1="210" x2="620" y2="325" stroke="#9e9e9e" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="610" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#9e9e9e">weak</text>
  
  <line x1="720" y1="250" x2="680" y2="325" stroke="#9e9e9e" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="700" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#9e9e9e">bridge</text>
  
  <!-- Legend -->
  <text x="520" y="450" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#5d4037">
    Algorithm Insights:
  </text>
  <line x1="520" y1="465" x2="540" y2="465" stroke="#4caf50" stroke-width="3"/>
  <text x="545" y="470" font-family="Arial, sans-serif" font-size="10" fill="#2e7d32">Strong friendship bonds</text>
  
  <line x1="520" y1="480" x2="540" y2="480" stroke="#9e9e9e" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="545" y="485" font-family="Arial, sans-serif" font-size="10" fill="#9e9e9e">Weak/occasional interactions</text>
  
  <circle cx="530" cy="500" r="8" fill="url(#monkGrad)" stroke="#5d4037" stroke-width="1"/>
  <text x="545" y="505" font-family="Arial, sans-serif" font-size="10" fill="#5d4037">Individual monks (nodes)</text>
  
  <!-- Analysis Section -->
  <rect x="50" y="290" width="350" height="240" rx="10" fill="#ffffff" stroke="#5d4037" stroke-width="2" filter="url(#shadow)"/>
  <text x="225" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#5d4037">
    🔬 Unsupervised Analysis Results
  </text>
  
  <text x="70" y="340" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#3e2723">
    Discovered Patterns:
  </text>
  <text x="80" y="360" font-family="Arial, sans-serif" font-size="11" fill="#5d4037">
    • 3 distinct social clusters emerged naturally
  </text>
  <text x="80" y="375" font-family="Arial, sans-serif" font-size="11" fill="#5d4037">
    • Groups formed around shared interests/activities
  </text>
  <text x="80" y="390" font-family="Arial, sans-serif" font-size="11" fill="#5d4037">
    • Bridge connections between some groups
  </text>
  <text x="80" y="405" font-family="Arial, sans-serif" font-size="11" fill="#5d4037">
    • Varying strength of relationships identified
  </text>
  
  <text x="70" y="430" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#3e2723">
    Key Characteristics:
  </text>
  <text x="80" y="450" font-family="Arial, sans-serif" font-size="11" fill="#5d4037">
    ✓ No predefined group labels required
  </text>
  <text x="80" y="465" font-family="Arial, sans-serif" font-size="11" fill="#5d4037">
    ✓ Natural patterns emerged from interaction data
  </text>
  <text x="80" y="480" font-family="Arial, sans-serif" font-size="11" fill="#5d4037">
    ✓ Revealed hidden social structures
  </text>
  <text x="80" y="495" font-family="Arial, sans-serif" font-size="11" fill="#5d4037">
    ⚠ Results require human interpretation
  </text>
  <text x="80" y="510" font-family="Arial, sans-serif" font-size="11" fill="#5d4037">
    ⚠ Subjective evaluation of group quality
  </text>
  
  <!-- Bottom note -->
  <text x="450" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#7f8c8d">
    Similar applications: Social media networks, customer segmentation, gene interaction networks
  </text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
     refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9c27b0" />
    </marker>
  </defs>
</svg>