<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .axis { stroke: #333; stroke-width: 2; fill: none; }
      .surface { fill: url(#surfaceGradient); stroke: #2196f3; stroke-width: 1; opacity: 0.8; }
      .saddle-surface { fill: url(#saddleGradient); stroke: #e91e63; stroke-width: 1; opacity: 0.8; }
      .gradient-arrow { stroke: #ff9800; stroke-width: 3; }
      .path { stroke: #4caf50; stroke-width: 3; fill: none; stroke-dasharray: 5,5; }
      .stuck-path { stroke: #f44336; stroke-width: 3; fill: none; stroke-dasharray: 3,3; }
      .point { fill: #ff5722; stroke: #d84315; stroke-width: 2; }
      .minimum { fill: #4caf50; stroke: #388e3c; stroke-width: 2; }
      .saddle { fill: #9c27b0; stroke: #7b1fa2; stroke-width: 2; }
      .text { font-family: 'Segoe UI', sans-serif; font-size: 12px; fill: #333; }
      .title { font-family: 'Segoe UI', sans-serif; font-size: 18px; font-weight: bold; fill: #1976d2; }
      .label { font-family: 'Segoe UI', sans-serif; font-size: 11px; fill: #666; }
      .problem-text { font-family: 'Segoe UI', sans-serif; font-size: 11px; fill: #f44336; font-weight: bold; }
      .success-text { font-family: 'Segoe UI', sans-serif; font-size: 11px; fill: #4caf50; font-weight: bold; }
    </style>
    
    <!-- Gradients for 3D effect -->
    <linearGradient id="surfaceGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e3f2fd;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2196f3;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#1565c0;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="saddleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fce4ec;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#e91e63;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#ad1457;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Title -->
  <text x="450" y="25" class="title" text-anchor="middle">High-Dimensional Optimization: Gradients and Saddle Points</text>
  
  <!-- Left side: Convex bowl (successful optimization) -->
  <g id="convex-bowl">
    <!-- 3D axes -->
    <line x1="50" y1="300" x2="250" y2="300" class="axis"/>
    <line x1="150" y1="150" x2="150" y2="350" class="axis"/>
    <line x1="150" y1="300" x2="100" y2="250" class="axis"/>
    
    <!-- Axis labels -->
    <text x="260" y="305" class="label">θ₁</text>
    <text x="135" y="140" class="label">J(θ)</text>
    <text x="85" y="245" class="label">θ₂</text>
    
    <!-- Convex surface (bowl shape) -->
    <ellipse cx="150" cy="260" rx="80" ry="30" class="surface"/>
    <ellipse cx="150" cy="240" rx="60" ry="22" class="surface"/>
    <ellipse cx="150" cy="220" rx="40" ry="15" class="surface"/>
    <ellipse cx="150" cy="200" rx="20" ry="8" class="surface"/>
    
    <!-- Global minimum -->
    <circle cx="150" cy="200" r="4" class="minimum"/>
    <text x="160" y="195" class="success-text">Global Min</text>
    
    <!-- Successful gradient descent path -->
    <path d="M 200 250 Q 180 230 160 210 Q 155 205 150 200" class="path"/>
    
    <!-- Gradient arrows -->
    <defs>
      <marker id="gradient-arrow-3d" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#ff9800"/>
      </marker>
      <marker id="path-arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#4caf50"/>
      </marker>
    </defs>
    
    <line x1="200" y1="250" x2="185" y2="235" class="gradient-arrow" marker-end="url(#gradient-arrow-3d)"/>
    <line x1="175" y1="225" x2="165" y2="215" class="gradient-arrow" marker-end="url(#gradient-arrow-3d)"/>
    
    <text x="50" y="380" class="title">Convex Case</text>
    <text x="50" y="395" class="success-text">✓ Guaranteed convergence</text>
    <text x="50" y="410" class="success-text">✓ Single global minimum</text>
    <text x="50" y="425" class="success-text">✓ Gradient always points toward optimum</text>
  </g>
  
  <!-- Right side: Saddle point landscape (problematic) -->
  <g id="saddle-landscape">
    <!-- 3D axes -->
    <line x1="400" y1="300" x2="600" y2="300" class="axis"/>
    <line x1="500" y1="150" x2="500" y2="350" class="axis"/>
    <line x1="500" y1="300" x2="450" y2="250" class="axis"/>
    
    <!-- Axis labels -->
    <text x="610" y="305" class="label">θ₁</text>
    <text x="485" y="140" class="label">J(θ)</text>
    <text x="435" y="245" class="label">θ₂</text>
    
    <!-- Saddle surface (hyperbolic paraboloid) -->
    <path d="M 420 280 Q 500 200 580 280" class="saddle-surface"/>
    <path d="M 460 240 Q 500 280 540 240" class="saddle-surface"/>
    <path d="M 440 260 Q 500 240 560 260" class="saddle-surface"/>
    
    <!-- Saddle point -->
    <circle cx="500" cy="240" r="4" class="saddle"/>
    <text x="510" y="235" class="problem-text">Saddle Point</text>
    <text x="510" y="248" class="problem-text">(∇J = 0 but not minimum)</text>
    
    <!-- True minimum (hidden) -->
    <circle cx="560" cy="280" r="4" class="minimum"/>
    <text x="565" y="275" class="success-text">True Min</text>
    
    <!-- Stuck optimization path -->
    <path d="M 470 260 Q 485 250 500 240" class="stuck-path"/>
    
    <!-- Arrow showing getting stuck -->
    <defs>
      <marker id="stuck-arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#f44336"/>
      </marker>
    </defs>
    
    <line x1="470" y1="260" x2="485" y2="248" class="stuck-path" marker-end="url(#stuck-arrow)"/>
    <text x="430" y="275" class="problem-text">Gets stuck!</text>
    
    <text x="400" y="380" class="title">Non-Convex Case</text>
    <text x="400" y="395" class="problem-text">✗ Multiple critical points</text>
    <text x="400" y="410" class="problem-text">✗ Can get trapped at saddle points</text>
    <text x="400" y="425" class="problem-text">✗ No convergence guarantee</text>
  </g>
  
  <!-- Deep learning landscape visualization -->
  <g id="deep-learning">
    <rect x="650" y="80" width="220" height="280" fill="#f8f9fa" stroke="#2196f3" stroke-width="2" rx="5"/>
    <text x="760" y="105" class="title" text-anchor="middle">Deep Neural Networks</text>
    
    <!-- Complex landscape illustration -->
    <path d="M 670 140 Q 690 120 710 140 Q 730 160 750 140 Q 770 120 790 140 Q 810 160 830 140" 
          stroke="#e91e63" stroke-width="2" fill="none"/>
    <path d="M 670 180 Q 690 200 710 180 Q 730 160 750 180 Q 770 200 790 180 Q 810 160 830 180" 
          stroke="#e91e63" stroke-width="2" fill="none"/>
    <path d="M 670 220 Q 690 240 710 220 Q 730 200 750 220 Q 770 240 790 220 Q 810 200 830 220" 
          stroke="#e91e63" stroke-width="2" fill="none"/>
    
    <!-- Multiple minima -->
    <circle cx="710" cy="140" r="3" class="minimum"/>
    <circle cx="750" cy="180" r="3" class="minimum"/>
    <circle cx="790" cy="220" r="3" class="minimum"/>
    <circle cx="730" cy="200" r="3" class="saddle"/>
    <circle cx="770" cy="160" r="3" class="saddle"/>
    
    <text x="660" y="260" class="text">Characteristics:</text>
    <text x="660" y="275" class="text">• Millions/billions of parameters</text>
    <text x="660" y="290" class="text">• Highly non-convex</text>
    <text x="660" y="305" class="text">• Many local minima</text>
    <text x="660" y="320" class="text">• Many saddle points</text>
    <text x="660" y="340" class="problem-text">Yet gradient descent works!</text>
    <text x="660" y="355" class="text">(The deep learning mystery)</text>
  </g>
  
  <!-- Bottom explanation -->
  <rect x="50" y="450" width="800" height="45" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="5"/>
  <text x="60" y="470" class="title">Extension to Higher Dimensions</text>
  <text x="60" y="485" class="text">In n-dimensional parameter space: Replace derivatives with gradients (∇J), but same principles apply</text>
</svg>