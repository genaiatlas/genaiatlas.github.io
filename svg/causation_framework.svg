<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">Correlation vs Causation Framework</text>
  
  <!-- Correlation Section -->
  <rect x="50" y="50" width="300" height="150" fill="#ffebee" stroke="#f44336" stroke-width="2" rx="10"/>
  <text x="200" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#d32f2f">Correlation</text>
  
  <!-- Two correlated variables -->
  <circle cx="120" cy="120" r="25" fill="#ff9800" stroke="#f57c00" stroke-width="2"/>
  <text x="120" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">X</text>
  
  <circle cx="280" cy="120" r="25" fill="#2196f3" stroke="#1976d2" stroke-width="2"/>
  <text x="280" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">Y</text>
  
  <!-- Correlation line -->
  <path d="M 145 120 Q 200 100 255 120" stroke="#4caf50" stroke-width="3" fill="none"/>
  <text x="200" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#4caf50">Associated</text>
  
  <text x="200" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#d32f2f">X and Y change together</text>
  <text x="200" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">but direction unclear</text>
  <text x="200" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">X → Y? Y → X? Z → X,Y?</text>
  
  <!-- Causation Section -->
  <rect x="450" y="50" width="300" height="150" fill="#e8f5e8" stroke="#4caf50" stroke-width="2" rx="10"/>
  <text x="600" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#388e3c">Causation</text>
  
  <!-- Causal relationship -->
  <circle cx="520" cy="120" r="25" fill="#ff9800" stroke="#f57c00" stroke-width="2"/>
  <text x="520" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">X</text>
  
  <circle cx="680" cy="120" r="25" fill="#2196f3" stroke="#1976d2" stroke-width="2"/>
  <text x="680" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">Y</text>
  
  <!-- Causal arrow -->
  <path d="M 545 120 L 655 120" stroke="#e74c3c" stroke-width="4" fill="none" marker-end="url(#arrowhead)"/>
  <text x="600" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c">Causes</text>
  
  <text x="600" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#388e3c">X directly influences Y</text>
  <text x="600" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Change in X → Change in Y</text>
  <text x="600" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Can predict interventions</text>
  
  <!-- Confounding Example -->
  <rect x="50" y="220" width="700" height="120" fill="#fff9c4" stroke="#fbc02d" stroke-width="2" rx="10"/>
  <text x="400" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Classic Example: Ice Cream vs Homicides</text>
  
  <!-- Ice cream -->
  <circle cx="150" cy="280" r="20" fill="#ff5722" stroke="#d84315" stroke-width="2"/>
  <text x="150" y="286" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Ice</text>
  <text x="150" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">Cream Sales</text>
  
  <!-- Homicides -->
  <circle cx="350" cy="280" r="20" fill="#9c27b0" stroke="#7b1fa2" stroke-width="2"/>
  <text x="350" y="286" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Crime</text>
  <text x="350" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">Homicides</text>
  
  <!-- Temperature (Confounder) -->
  <circle cx="250" cy="320" r="25" fill="#ff9800" stroke="#f57c00" stroke-width="3"/>
  <text x="250" y="327" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">Temp</text>
  <text x="250" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">Confounding Variable</text>
  
  <!-- Spurious correlation -->
  <path d="M 170 280 Q 250 260 330 280" stroke="#e91e63" stroke-width="2" fill="none" stroke-dasharray="5,5"/>
  <text x="250" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#e91e63">Spurious Correlation</text>
  
  <!-- True causal paths -->
  <path d="M 230 325 L 170 285" stroke="#4caf50" stroke-width="2" fill="none" marker-end="url(#smallarrow)"/>
  <path d="M 270 325 L 330 285" stroke="#4caf50" stroke-width="2" fill="none" marker-end="url(#smallarrow)"/>
  
  <text x="500" y="270" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Correlation ≠ Causation</text>
  <text x="500" y="285" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Both increase in summer</text>
  <text x="500" y="300" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Temperature causes both</text>
  <text x="500" y="315" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Ice cream doesn't cause crime</text>
  
  <!-- Randomized Control Trial -->
  <rect x="50" y="360" width="340" height="180" fill="#e3f2fd" stroke="#2196f3" stroke-width="2" rx="10"/>
  <text x="220" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1976d2">Randomized Control Trial</text>
  <text x="220" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Gold Standard for Causation</text>
  
  <!-- Population -->
  <text x="90" y="430" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Population</text>
  <circle cx="80" cy="445" r="8" fill="#607d8b"/>
  <circle cx="100" cy="445" r="8" fill="#607d8b"/>
  <circle cx="120" cy="445" r="8" fill="#607d8b"/>
  <circle cx="80" cy="465" r="8" fill="#607d8b"/>
  <circle cx="100" cy="465" r="8" fill="#607d8b"/>
  <circle cx="120" cy="465" r="8" fill="#607d8b"/>
  
  <!-- Random assignment arrow -->
  <path d="M 140 455 L 180 455" stroke="#ff9800" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="160" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#ff9800">Random</text>
  <text x="160" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#ff9800">Assignment</text>
  
  <!-- Treatment group -->
  <rect x="200" y="430" width="60" height="50" fill="#c8e6c9" stroke="#4caf50" stroke-width="2" rx="5"/>
  <text x="230" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">Treatment</text>
  <text x="230" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">Group</text>
  <circle cx="215" cy="465" r="4" fill="#4caf50"/>
  <circle cx="230" cy="465" r="4" fill="#4caf50"/>
  <circle cx="245" cy="465" r="4" fill="#4caf50"/>
  
  <!-- Control group -->
  <rect x="280" y="430" width="60" height="50" fill="#ffcdd2" stroke="#f44336" stroke-width="2" rx="5"/>
  <text x="310" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">Control</text>
  <text x="310" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">Group</text>
  <circle cx="295" cy="465" r="4" fill="#f44336"/>
  <circle cx="310" cy="465" r="4" fill="#f44336"/>
  <circle cx="325" cy="465" r="4" fill="#f44336"/>
  
  <!-- RCT Properties -->
  <text x="70" y="500" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">✓ Random assignment ensures no bias</text>
  <text x="70" y="515" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">✓ Groups identical except for treatment</text>
  <text x="70" y="530" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">✓ Difference = causal effect (ATE)</text>
  
  <!-- Conditional Exogeneity -->
  <rect x="410" y="360" width="340" height="180" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2" rx="10"/>
  <text x="580" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#7b1fa2">Conditional Exogeneity</text>
  <text x="580" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Observational Data Approach</text>
  
  <!-- Equation -->
  <text x="580" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#9c27b0">Y = βD + g(Z) + ε</text>
  <text x="580" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">E[ε|D,Z] = 0</text>
  
  <!-- Requirements -->
  <text x="430" y="475" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Requirements:</text>
  <text x="430" y="490" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">• Control for all confounders Z</text>
  <text x="430" y="503" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">• D is "as good as random" given Z</text>
  <text x="430" y="516" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">• No unobserved confounding</text>
  <text x="430" y="529" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">• Burden of proof on researcher</text>
  
  <!-- Comparison -->
  <rect x="50" y="560" width="700" height="30" fill="#e9ecef" stroke="#dee2e6" stroke-width="1" rx="5"/>
  <text x="100" y="578" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#495057">RCT:</text>
  <text x="140" y="578" font-family="Arial, sans-serif" font-size="10" fill="#495057">Strong causal evidence</text>
  
  <text x="350" y="578" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#495057">Observational:</text>
  <text x="440" y="578" font-family="Arial, sans-serif" font-size="10" fill="#495057">Weaker, requires strong assumptions</text>
  
  <!-- Arrow definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
    <marker id="smallarrow" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#4caf50"/>
    </marker>
  </defs>
  
</svg>