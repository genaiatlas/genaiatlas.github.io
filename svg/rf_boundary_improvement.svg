<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
    <radialGradient id="smoothGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#f39c12;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#3498db;stop-opacity:0.8" />
    </radialGradient>
    <pattern id="jaggedPattern" patternUnits="userSpaceOnUse" width="10" height="10">
      <rect width="10" height="10" fill="#ecf0f1"/>
      <path d="M0,5 L5,0 L10,5 L5,10 Z" fill="#e74c3c" opacity="0.6"/>
    </pattern>
  </defs>
  
  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#2c3e50">Random Forest Boundary Improvement</text>
  
  <!-- Single Decision Tree Section -->
  <g id="single-tree">
    <text x="200" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#e74c3c">Single Decision Tree</text>
    
    <!-- Coordinate system for single tree -->
    <rect x="50" y="90" width="300" height="250" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2" filter="url(#shadow)"/>
    
    <!-- Axes -->
    <line x1="70" y1="320" x2="330" y2="320" stroke="#343a40" stroke-width="2"/>
    <line x1="70" y1="320" x2="70" y2="110" stroke="#343a40" stroke-width="2"/>
    
    <!-- True elliptical boundary (ideal) -->
    <ellipse cx="200" cy="205" rx="80" ry="50" fill="none" stroke="#2ecc71" stroke-width="3" stroke-dasharray="8,4"/>
    <text x="290" y="180" font-family="Arial, sans-serif" font-size="11" fill="#2ecc71">True boundary</text>
    
    <!-- Jagged rectangular approximation -->
    <path d="M 120 160 L 180 160 L 180 140 L 220 140 L 220 180 L 280 180 L 280 220 L 240 220 L 240 260 L 200 260 L 200 240 L 160 240 L 160 200 L 120 200 Z" 
          fill="none" stroke="#e74c3c" stroke-width="4"/>
    
    <!-- Data points for single tree -->
    <!-- Red class inside -->
    <circle cx="180" cy="185" r="3" fill="#e74c3c"/>
    <circle cx="200" cy="195" r="3" fill="#e74c3c"/>
    <circle cx="220" cy="205" r="3" fill="#e74c3c"/>
    <circle cx="190" cy="220" r="3" fill="#e74c3c"/>
    <circle cx="210" cy="175" r="3" fill="#e74c3c"/>
    <circle cx="195" cy="210" r="3" fill="#e74c3c"/>
    <circle cx="215" cy="190" r="3" fill="#e74c3c"/>
    
    <!-- Blue class outside -->
    <circle cx="90" cy="130" r="3" fill="#3498db"/>
    <circle cx="100" cy="150" r="3" fill="#3498db"/>
    <circle cx="110" cy="280" r="3" fill="#3498db"/>
    <circle cx="290" cy="140" r="3" fill="#3498db"/>
    <circle cx="300" cy="160" r="3" fill="#3498db"/>
    <circle cx="310" cy="290" r="3" fill="#3498db"/>
    <circle cx="320" cy="300" r="3" fill="#3498db"/>
    <circle cx="80" cy="300" r="3" fill="#3498db"/>
    
    <!-- Misclassified points -->
    <circle cx="150" cy="170" r="4" fill="#e74c3c" stroke="#000" stroke-width="2"/>
    <text x="135" y="165" font-family="Arial, sans-serif" font-size="9" fill="#e74c3c">Misclassified</text>
    
    <circle cx="250" cy="250" r="4" fill="#3498db" stroke="#000" stroke-width="2"/>
    <text x="255" y="245" font-family="Arial, sans-serif" font-size="9" fill="#3498db">Misclassified</text>
    
    <!-- Performance metrics -->
    <rect x="60" y="350" width="280" height="80" fill="#fff" stroke="#e74c3c" stroke-width="2"/>
    <text x="200" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e74c3c">Single Tree Performance</text>
    <text x="70" y="390" font-family="Arial, sans-serif" font-size="12" fill="#34495e">• Rectangular regions only</text>
    <text x="70" y="405" font-family="Arial, sans-serif" font-size="12" fill="#34495e">• Poor curved boundary approximation</text>
    <text x="70" y="420" font-family="Arial, sans-serif" font-size="12" fill="#34495e">• High misclassification at edges</text>
  </g>
  
  <!-- Random Forest Section -->
  <g id="random-forest">
    <text x="700" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#27ae60">Random Forest Ensemble</text>
    
    <!-- Coordinate system for random forest -->
    <rect x="550" y="90" width="300" height="250" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2" filter="url(#shadow)"/>
    
    <!-- Axes -->
    <line x1="570" y1="320" x2="830" y2="320" stroke="#343a40" stroke-width="2"/>
    <line x1="570" y1="320" x2="570" y2="110" stroke="#343a40" stroke-width="2"/>
    
    <!-- True elliptical boundary (ideal) -->
    <ellipse cx="700" cy="205" rx="80" ry="50" fill="none" stroke="#2ecc71" stroke-width="3" stroke-dasharray="8,4"/>
    <text x="790" y="180" font-family="Arial, sans-serif" font-size="11" fill="#2ecc71">True boundary</text>
    
    <!-- Smooth RF approximation -->
    <ellipse cx="700" cy="205" rx="85" ry="55" fill="url(#smoothGradient)" opacity="0.6"/>
    <ellipse cx="700" cy="205" rx="82" ry="52" fill="none" stroke="#27ae60" stroke-width="4"/>
    
    <!-- Data points for random forest -->
    <!-- Red class inside -->
    <circle cx="680" cy="185" r="3" fill="#e74c3c"/>
    <circle cx="700" cy="195" r="3" fill="#e74c3c"/>
    <circle cx="720" cy="205" r="3" fill="#e74c3c"/>
    <circle cx="690" cy="220" r="3" fill="#e74c3c"/>
    <circle cx="710" cy="175" r="3" fill="#e74c3c"/>
    <circle cx="695" cy="210" r="3" fill="#e74c3c"/>
    <circle cx="715" cy="190" r="3" fill="#e74c3c"/>
    
    <!-- Blue class outside -->
    <circle cx="590" cy="130" r="3" fill="#3498db"/>
    <circle cx="600" cy="150" r="3" fill="#3498db"/>
    <circle cx="610" cy="280" r="3" fill="#3498db"/>
    <circle cx="790" cy="140" r="3" fill="#3498db"/>
    <circle cx="800" cy="160" r="3" fill="#3498db"/>
    <circle cx="810" cy="290" r="3" fill="#3498db"/>
    <circle cx="820" cy="300" r="3" fill="#3498db"/>
    <circle cx="580" cy="300" r="3" fill="#3498db"/>
    
    <!-- Correctly classified points that were misclassified in single tree -->
    <circle cx="650" cy="170" r="4" fill="#e74c3c" stroke="#27ae60" stroke-width="2"/>
    <text x="635" y="165" font-family="Arial, sans-serif" font-size="9" fill="#27ae60">Correctly classified</text>
    
    <circle cx="750" cy="250" r="4" fill="#3498db" stroke="#27ae60" stroke-width="2"/>
    <text x="755" y="245" font-family="Arial, sans-serif" font-size="9" fill="#27ae60">Correctly classified</text>
    
    <!-- Performance metrics -->
    <rect x="560" y="350" width="280" height="80" fill="#fff" stroke="#27ae60" stroke-width="2"/>
    <text x="700" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#27ae60">Random Forest Performance</text>
    <text x="570" y="390" font-family="Arial, sans-serif" font-size="12" fill="#34495e">• Smooth boundary approximation</text>
    <text x="570" y="405" font-family="Arial, sans-serif" font-size="12" fill="#34495e">• Better curved boundary fit</text>
    <text x="570" y="420" font-family="Arial, sans-serif" font-size="12" fill="#34495e">• Reduced misclassification</text>
  </g>
  
  <!-- Improvement Arrow -->
  <path d="M 380 215 L 520 215" stroke="#f39c12" stroke-width="6" marker-end="url(#improvementArrow)"/>
  <text x="450" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f39c12">Ensemble</text>
  <text x="450" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f39c12">Voting</text>
  
  <!-- Detailed Explanation -->
  <rect x="50" y="460" width="900" height="220" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2" filter="url(#shadow)"/>
  <text x="500" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">How Random Forest Improves Boundaries</text>
  
  <!-- Three columns explanation -->
  <g id="explanation-columns">
    <!-- Column 1: Individual Trees -->
    <rect x="70" y="510" width="250" height="140" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
    <text x="195" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#856404">1. Individual Trees</text>
    <text x="80" y="555" font-family="Arial, sans-serif" font-size="11" fill="#34495e">Each tree in the forest creates</text>
    <text x="80" y="570" font-family="Arial, sans-serif" font-size="11" fill="#34495e">different rectangular regions:</text>
    <text x="90" y="590" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">• Tree 1: Features {X₁, X₃, X₅}</text>
    <text x="90" y="605" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">• Tree 2: Features {X₂, X₄, X₆}</text>
    <text x="90" y="620" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">• Tree B: Features {X₁, X₄, X₇}</text>
    <text x="80" y="640" font-family="Arial, sans-serif" font-size="11" fill="#34495e">Different feature sets → diverse splits</text>
    
    <!-- Column 2: Voting Process -->
    <rect x="340" y="510" width="250" height="140" fill="#d1ecf1" stroke="#17a2b8" stroke-width="2"/>
    <text x="465" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0c5460">2. Voting Process</text>
    <text x="350" y="555" font-family="Arial, sans-serif" font-size="11" fill="#34495e">For each point (x,y), collect</text>
    <text x="350" y="570" font-family="Arial, sans-serif" font-size="11" fill="#34495e">predictions from all trees:</text>
    <text x="360" y="590" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">Tree 1: Red    (probability 0.7)</text>
    <text x="360" y="605" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">Tree 2: Blue   (probability 0.8)</text>
    <text x="360" y="620" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">Tree B: Red    (probability 0.6)</text>
    <text x="350" y="640" font-family="Arial, sans-serif" font-size="11" fill="#34495e">Final: Majority vote or averaging</text>
    
    <!-- Column 3: Smooth Result -->
    <rect x="610" y="510" width="250" height="140" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
    <text x="735" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#155724">3. Smooth Boundaries</text>
    <text x="620" y="555" font-family="Arial, sans-serif" font-size="11" fill="#34495e">Ensemble voting creates gradual</text>
    <text x="620" y="570" font-family="Arial, sans-serif" font-size="11" fill="#34495e">transitions between regions:</text>
    <text x="630" y="590" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">• Reduces hard edges</text>
    <text x="630" y="605" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">• Better curve approximation</text>
    <text x="630" y="620" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">• Lower misclassification rate</text>
    <text x="620" y="640" font-family="Arial, sans-serif" font-size="11" fill="#34495e">Result: Superior generalization</text>
  </g>
  
  <!-- Mathematical insight -->
  <text x="500" y="680" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#495057">
    <tspan font-weight="bold">Key Insight:</tspan> Voting averages out individual tree biases, creating smoother decision boundaries
  </text>
  
  <!-- Performance comparison box -->
  <rect x="880" y="90" width="110" height="250" fill="#fff" stroke="#6c757d" stroke-width="2"/>
  <text x="935" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#495057">Performance</text>
  <text x="935" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#495057">Comparison</text>
  
  <text x="890" y="155" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#e74c3c">Single Tree:</text>
  <text x="890" y="170" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">Error Rate: 23%</text>
  <text x="890" y="185" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">Boundary: Jagged</text>
  <text x="890" y="200" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">Overfitting: High</text>
  
  <text x="890" y="225" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#27ae60">Random Forest:</text>
  <text x="890" y="240" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">Error Rate: 15%</text>
  <text x="890" y="255" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">Boundary: Smooth</text>
  <text x="890" y="270" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">Overfitting: Low</text>
  
  <text x="935" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#f39c12">Improvement:</text>
  <text x="935" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#27ae60">35% better</text>
  <text x="935" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#27ae60">accuracy</text>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="improvementArrow" markerWidth="15" markerHeight="10" refX="12" refY="5" orient="auto">
      <polygon points="0 0, 15 5, 0 10" fill="#f39c12"/>
    </marker>
  </defs>
</svg>