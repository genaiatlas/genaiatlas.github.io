<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sigmoidGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1976d2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#42a5f5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="derivativeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e91e63;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f06292;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1565c0">
    Sigmoid Activation Function and Its Derivative
  </text>
  
  <!-- Left plot - Sigmoid Function -->
  <g id="sigmoid-plot">
    <!-- Axes -->
    <line x1="50" y1="300" x2="400" y2="300" stroke="#333" stroke-width="2"/>
    <line x1="225" y1="120" x2="225" y2="380" stroke="#333" stroke-width="2"/>
    
    <!-- Grid lines -->
    <g stroke="#e0e0e0" stroke-width="1" opacity="0.5">
      <line x1="125" y1="120" x2="125" y2="380"/>
      <line x1="325" y1="120" x2="325" y2="380"/>
      <line x1="50" y1="180" x2="400" y2="180"/>
      <line x1="50" y1="240" x2="400" y2="240"/>
      <line x1="50" y1="360" x2="400" y2="360"/>
    </g>
    
    <!-- Sigmoid curve -->
    <path d="M 50 360 Q 100 350 150 320 Q 200 280 225 240 Q 250 200 300 180 Q 350 170 400 120" 
          stroke="url(#sigmoidGradient)" stroke-width="4" fill="none"/>
    
    <!-- Axis labels -->
    <text x="225" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#333">x</text>
    <text x="30" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#333" transform="rotate(-90, 30, 250)">σ(x)</text>
    
    <!-- Value labels -->
    <text x="125" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">-2</text>
    <text x="225" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">0</text>
    <text x="325" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">2</text>
    
    <text x="210" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">1</text>
    <text x="210" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">0.5</text>
    <text x="210" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">0</text>
    
    <!-- Function equation -->
    <text x="225" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1976d2">
      σ(x) = 1/(1 + e^(-x))
    </text>
  </g>
  
  <!-- Right plot - Derivative -->
  <g id="derivative-plot">
    <!-- Axes -->
    <line x1="500" y1="300" x2="850" y2="300" stroke="#333" stroke-width="2"/>
    <line x1="675" y1="120" x2="675" y2="380" stroke="#333" stroke-width="2"/>
    
    <!-- Grid lines -->
    <g stroke="#e0e0e0" stroke-width="1" opacity="0.5">
      <line x1="575" y1="120" x2="575" y2="380"/>
      <line x1="775" y1="120" x2="775" y2="380"/>
      <line x1="500" y1="180" x2="850" y2="180"/>
      <line x1="500" y1="240" x2="850" y2="240"/>
      <line x1="500" y1="360" x2="850" y2="360"/>
    </g>
    
    <!-- Derivative curve (bell-shaped) -->
    <path d="M 500 300 Q 550 290 600 270 Q 650 240 675 220 Q 700 240 750 270 Q 800 290 850 300" 
          stroke="url(#derivativeGradient)" stroke-width="4" fill="none"/>
    
    <!-- Axis labels -->
    <text x="675" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#333">x</text>
    <text x="480" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#333" transform="rotate(-90, 480, 250)">σ'(x)</text>
    
    <!-- Value labels -->
    <text x="575" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">-2</text>
    <text x="675" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">0</text>
    <text x="775" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">2</text>
    
    <text x="660" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">0.5</text>
    <text x="660" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">0.25</text>
    <text x="660" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">0</text>
    
    <!-- Maximum point indicator -->
    <circle cx="675" cy="220" r="4" fill="#e91e63"/>
    <text x="675" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e91e63">Max = 0.25</text>
    
    <!-- Function equation -->
    <text x="675" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#e91e63">
      σ'(x) = σ(x)(1 - σ(x))
    </text>
  </g>
  
  <!-- Properties box -->
  <rect x="50" y="430" width="800" height="140" rx="5" fill="#f8f9fa" stroke="#1976d2" stroke-width="2"/>
  <text x="450" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1976d2">
    Sigmoid Function Properties
  </text>
  
  <g font-family="Arial, sans-serif" font-size="14" fill="#333">
    <text x="70" y="485">✓ <tspan font-weight="bold" fill="#4caf50">Smooth and Differentiable:</tspan> Essential for backpropagation</text>
    <text x="70" y="510">✓ <tspan font-weight="bold" fill="#4caf50">Output Range:</tspan> [0, 1] - interpretable as probabilities</text>
    <text x="70" y="535">✗ <tspan font-weight="bold" fill="#f44336">Small Gradients:</tspan> Maximum derivative is only 0.25</text>
    <text x="70" y="560">✗ <tspan font-weight="bold" fill="#f44336">Vanishing Gradients:</tspan> Problematic in deep networks</text>
  </g>
  
  <!-- Comparison with threshold -->
  <rect x="450" y="480" width="380" height="80" rx="3" fill="#fff3e0" stroke="#ff9800" stroke-width="1">
    <text x="640" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ff9800">
      vs. Threshold Function
    </text>
    <text x="460" y="520" font-family="Arial, sans-serif" font-size="11" fill="#333">
      Threshold: Derivative is 0 or undefined
    </text>
    <text x="460" y="535" font-family="Arial, sans-serif" font-size="11" fill="#333">
      Sigmoid: Smooth, continuous derivative
    </text>
    <text x="460" y="550" font-family="Arial, sans-serif" font-size="11" fill="#333">
      → Enables gradient-based optimization
    </text>
  </rect>
</svg>