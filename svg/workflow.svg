<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="700" y="40" font-size="26" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Side Information Enhanced Recommendation Workflow
  </text>
  
  <!-- Phase 1: Data Collection -->
  <g id="phase1">
    <rect x="50" y="80" width="280" height="180" fill="#e3f2fd" stroke="#1976d2" stroke-width="3" rx="10"/>
    <text x="190" y="110" font-size="18" font-weight="bold" text-anchor="middle" fill="#0d47a1">
      Phase 1: Data Collection
    </text>
    
    <!-- Data sources -->
    <rect x="70" y="130" width="240" height="35" fill="white" stroke="#1976d2" stroke-width="1" rx="4"/>
    <text x="90" y="152" font-size="12" fill="#333">Rating Matrix (sparse)</text>
    
    <rect x="70" y="175" width="240" height="35" fill="white" stroke="#1976d2" stroke-width="1" rx="4"/>
    <text x="90" y="197" font-size="12" fill="#333">User Features (demographics)</text>
    
    <rect x="70" y="220" width="240" height="35" fill="white" stroke="#1976d2" stroke-width="1" rx="4"/>
    <text x="90" y="242" font-size="12" fill="#333">Item Features (metadata)</text>
  </g>
  
  <!-- Arrow -->
  <path d="M 330 170 L 390 170" stroke="#666" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Phase 2: Preprocessing -->
  <g id="phase2">
    <rect x="390" y="80" width="280" height="180" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="3" rx="10"/>
    <text x="530" y="110" font-size="18" font-weight="bold" text-anchor="middle" fill="#4a148c">
      Phase 2: Preprocessing
    </text>
    
    <rect x="410" y="130" width="240" height="30" fill="white" stroke="#7b1fa2" stroke-width="1" rx="4"/>
    <text x="430" y="150" font-size="11" fill="#333">Handle missing values</text>
    
    <rect x="410" y="168" width="240" height="30" fill="white" stroke="#7b1fa2" stroke-width="1" rx="4"/>
    <text x="430" y="188" font-size="11" fill="#333">Normalize features</text>
    
    <rect x="410" y="206" width="240" height="30" fill="white" stroke="#7b1fa2" stroke-width="1" rx="4"/>
    <text x="430" y="226" font-size="11" fill="#333">Feature engineering</text>
  </g>
  
  <!-- Arrow -->
  <path d="M 670 170 L 730 170" stroke="#666" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Phase 3: Variable Selection -->
  <g id="phase3">
    <rect x="730" y="80" width="280" height="180" fill="#e8f5e9" stroke="#388e3c" stroke-width="3" rx="10"/>
    <text x="870" y="110" font-size="18" font-weight="bold" text-anchor="middle" fill="#1b5e20">
      Phase 3: Variable Selection
    </text>
    
    <rect x="750" y="130" width="240" height="30" fill="white" stroke="#388e3c" stroke-width="1" rx="4"/>
    <text x="770" y="150" font-size="11" fill="#333">Correlation analysis</text>
    
    <rect x="750" y="168" width="240" height="30" fill="white" stroke="#388e3c" stroke-width="1" rx="4"/>
    <text x="770" y="188" font-size="11" fill="#333">Dimensionality reduction</text>
    
    <rect x="750" y="206" width="240" height="30" fill="white" stroke="#388e3c" stroke-width="1" rx="4"/>
    <text x="770" y="226" font-size="11" fill="#333">L1/L2 regularization</text>
  </g>
  
  <!-- Arrow -->
  <path d="M 1010 170 L 1070 170" stroke="#666" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Phase 4: Clustering -->
  <g id="phase4">
    <rect x="1070" y="80" width="280" height="180" fill="#fff3e0" stroke="#f57c00" stroke-width="3" rx="10"/>
    <text x="1210" y="110" font-size="18" font-weight="bold" text-anchor="middle" fill="#e65100">
      Phase 4: Clustering
    </text>
    
    <rect x="1090" y="130" width="240" height="30" fill="white" stroke="#f57c00" stroke-width="1" rx="4"/>
    <text x="1110" y="150" font-size="11" fill="#333">K-means / Spectral</text>
    
    <rect x="1090" y="168" width="240" height="30" fill="white" stroke="#f57c00" stroke-width="1" rx="4"/>
    <text x="1110" y="188" font-size="11" fill="#333">Cluster users</text>
    
    <rect x="1090" y="206" width="240" height="30" fill="white" stroke="#f57c00" stroke-width="1" rx="4"/>
    <text x="1110" y="226" font-size="11" fill="#333">Cluster items</text>
  </g>
  
  <!-- Vertical arrow down -->
  <path d="M 700 280 L 700 330" stroke="#666" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Phase 5: Similarity Computation -->
  <g id="phase5">
    <rect x="250" y="330" width="900" height="200" fill="#fce4ec" stroke="#c2185b" stroke-width="3" rx="10"/>
    <text x="700" y="365" font-size="20" font-weight="bold" text-anchor="middle" fill="#880e4f">
      Phase 5: Hybrid Similarity Computation
    </text>
    
    <!-- Three boxes for similarity types -->
    <rect x="280" y="390" width="250" height="120" fill="white" stroke="#1976d2" stroke-width="2" rx="6"/>
    <text x="405" y="415" font-size="14" font-weight="bold" text-anchor="middle" fill="#0d47a1">Compute IPR</text>
    <text x="405" y="440" font-size="11" text-anchor="middle" fill="#333">Rating-based similarity</text>
    <text x="405" y="460" font-size="11" text-anchor="middle" fill="#333">using rating matrix</text>
    <rect x="300" y="475" width="210" height="25" fill="#bbdefb" stroke="#1976d2" stroke-width="1" rx="3"/>
    <text x="405" y="492" font-size="10" text-anchor="middle" fill="#0d47a1">IPR = ratings · ratings^T</text>
    
    <rect x="575" y="390" width="250" height="120" fill="white" stroke="#f57c00" stroke-width="2" rx="6"/>
    <text x="700" y="415" font-size="14" font-weight="bold" text-anchor="middle" fill="#e65100">Compute IPS</text>
    <text x="700" y="440" font-size="11" text-anchor="middle" fill="#333">Side info similarity</text>
    <text x="700" y="460" font-size="11" text-anchor="middle" fill="#333">using feature vectors</text>
    <rect x="595" y="475" width="210" height="25" fill="#ffe0b2" stroke="#f57c00" stroke-width="1" rx="3"/>
    <text x="700" y="492" font-size="10" text-anchor="middle" fill="#e65100">IPS = features · features^T</text>
    
    <rect x="870" y="390" width="250" height="120" fill="white" stroke="#7b1fa2" stroke-width="2" rx="6"/>
    <text x="995" y="415" font-size="14" font-weight="bold" text-anchor="middle" fill="#4a148c">Combine</text>
    <text x="995" y="440" font-size="11" text-anchor="middle" fill="#333">Create hybrid measure</text>
    <text x="995" y="460" font-size="11" text-anchor="middle" fill="#333">with parameter t</text>
    <rect x="890" y="475" width="210" height="25" fill="#e1bee7" stroke="#7b1fa2" stroke-width="1" rx="3"/>
    <text x="995" y="492" font-size="10" text-anchor="middle" fill="#4a148c">Sim = IPR + t × IPS</text>
  </g>
  
  <!-- Vertical arrow down -->
  <path d="M 700 550 L 700 600" stroke="#666" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Phase 6: Parameter Tuning -->
  <g id="phase6">
    <rect x="450" y="600" width="500" height="120" fill="#fff9c4" stroke="#f9a825" stroke-width="3" rx="10"/>
    <text x="700" y="635" font-size="18" font-weight="bold" text-anchor="middle" fill="#f57f17">
      Phase 6: Parameter Tuning
    </text>
    
    <rect x="480" y="655" width="200" height="50" fill="white" stroke="#fbc02d" stroke-width="1" rx="4"/>
    <text x="580" y="675" font-size="12" text-anchor="middle" fill="#333">Cross-validation</text>
    <text x="580" y="693" font-size="11" text-anchor="middle" fill="#555">Test different t values</text>
    
    <rect x="720" y="655" width="200" height="50" fill="white" stroke="#fbc02d" stroke-width="1" rx="4"/>
    <text x="820" y="675" font-size="12" text-anchor="middle" fill="#333">Optimize for RMSE</text>
    <text x="820" y="693" font-size="11" text-anchor="middle" fill="#555">Select best t</text>
  </g>
  
  <!-- Vertical arrow down -->
  <path d="M 700 740 L 700 790" stroke="#666" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Phase 7: Recommendation Generation -->
  <g id="phase7">
    <rect x="150" y="790" width="1100" height="180" fill="#c8e6c9" stroke="#2e7d32" stroke-width="3" rx="10"/>
    <text x="700" y="825" font-size="20" font-weight="bold" text-anchor="middle" fill="#1b5e20">
      Phase 7: Generate Recommendations
    </text>
    
    <!-- Steps -->
    <rect x="180" y="850" width="220" height="100" fill="white" stroke="#66bb6a" stroke-width="2" rx="5"/>
    <text x="290" y="875" font-size="13" font-weight="bold" text-anchor="middle" fill="#2e7d32">1. Find Neighbors</text>
    <text x="290" y="895" font-size="11" text-anchor="middle" fill="#333">Use hybrid similarity</text>
    <text x="290" y="913" font-size="11" text-anchor="middle" fill="#333">to find k most similar</text>
    <text x="290" y="931" font-size="11" text-anchor="middle" fill="#333">users/items</text>
    
    <text x="420" y="905" font-size="24" fill="#2e7d32">→</text>
    
    <rect x="460" y="850" width="220" height="100" fill="white" stroke="#66bb6a" stroke-width="2" rx="5"/>
    <text x="570" y="875" font-size="13" font-weight="bold" text-anchor="middle" fill="#2e7d32">2. Weight Ratings</text>
    <text x="570" y="895" font-size="11" text-anchor="middle" fill="#333">Weight neighbor ratings</text>
    <text x="570" y="913" font-size="11" text-anchor="middle" fill="#333">by similarity scores</text>
    <text x="570" y="931" font-size="11" text-anchor="middle" fill="#333">from hybrid measure</text>
    
    <text x="700" y="905" font-size="24" fill="#2e7d32">→</text>
    
    <rect x="740" y="850" width="220" height="100" fill="white" stroke="#66bb6a" stroke-width="2" rx="5"/>
    <text x="850" y="875" font-size="13" font-weight="bold" text-anchor="middle" fill="#2e7d32">3. Predict</text>
    <text x="850" y="895" font-size="11" text-anchor="middle" fill="#333">Compute weighted</text>
    <text x="850" y="913" font-size="11" text-anchor="middle" fill="#333">average to predict</text>
    <text x="850" y="931" font-size="11" text-anchor="middle" fill="#333">unknown ratings</text>
    
    <text x="980" y="905" font-size="24" fill="#2e7d32">→</text>
    
    <rect x="1020" y="850" width="220" height="100" fill="white" stroke="#66bb6a" stroke-width="2" rx="5"/>
    <text x="1130" y="875" font-size="13" font-weight="bold" text-anchor="middle" fill="#2e7d32">4. Rank and Serve</text>
    <text x="1130" y="895" font-size="11" text-anchor="middle" fill="#333">Sort by predicted</text>
    <text x="1130" y="913" font-size="11" text-anchor="middle" fill="#333">rating and return</text>
    <text x="1130" y="931" font-size="11" text-anchor="middle" fill="#333">top-N items</text>
  </g>
  
  <!-- Key Benefits Box -->
  <g id="benefits">
    <rect x="50" y="320" width="180" height="210" fill="#f5f5f5" stroke="#424242" stroke-width="2" rx="8"/>
    <text x="140" y="350" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Key Benefits</text>
    
    <text x="65" y="380" font-size="11" fill="#333">+ Better cold start</text>
    <text x="65" y="405" font-size="11" fill="#333">+ Higher accuracy</text>
    <text x="65" y="430" font-size="11" fill="#333">+ More personalized</text>
    <text x="65" y="455" font-size="11" fill="#333">+ Handles sparsity</text>
    <text x="65" y="480" font-size="11" fill="#333">+ Interpretable groups</text>
    <text x="65" y="505" font-size="11" fill="#333">+ Scalable solution</text>
  </g>
  
  <!-- Technical Notes -->
  <g id="notes">
    <rect x="1170" y="320" width="180" height="210" fill="#f5f5f5" stroke="#424242" stroke-width="2" rx="8"/>
    <text x="1260" y="350" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Optimization</text>
    
    <text x="1185" y="380" font-size="11" fill="#333">* LSH for fast search</text>
    <text x="1185" y="405" font-size="11" fill="#333">* Caching similarities</text>
    <text x="1185" y="430" font-size="11" fill="#333">* Batch processing</text>
    <text x="1185" y="455" font-size="11" fill="#333">* Parallel computing</text>
    <text x="1185" y="480" font-size="11" fill="#333">* Online updates</text>
    <text x="1185" y="505" font-size="11" fill="#333">* A/B testing</text>
  </g>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#666"/>
    </marker>
  </defs>
</svg>