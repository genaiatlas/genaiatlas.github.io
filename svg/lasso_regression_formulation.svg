<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'Arial', sans-serif; font-size: 20px; font-weight: bold; fill: #2c3e50; }
      .subtitle { font-family: 'Arial', sans-serif; font-size: 16px; fill: #34495e; font-weight: bold; }
      .equation { font-family: 'Times New Roman', serif; font-size: 16px; fill: #2c3e50; }
      .large-equation { font-family: 'Times New Roman', serif; font-size: 20px; fill: #2c3e50; }
      .parameter { font-family: 'Times New Roman', serif; font-size: 14px; fill: #e74c3c; font-weight: bold; }
      .description { font-family: 'Arial', sans-serif; font-size: 12px; fill: #34495e; }
      .box { fill: #f8f9fa; stroke: #dee2e6; stroke-width: 2; rx: 8; }
      .highlight-box { fill: #e8f6f3; stroke: #16a085; stroke-width: 2; rx: 8; }
      .sparsity-box { fill: #fef2e7; stroke: #e67e22; stroke-width: 2; rx: 8; }
      .arrow { stroke: #e74c3c; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .l1-norm { fill: #e74c3c; font-weight: bold; }
      .hyperparameter { fill: #e74c3c; font-weight: bold; }
      .zero-coeff { fill: #7f8c8d; font-weight: bold; }
      .nonzero-coeff { fill: #27ae60; font-weight: bold; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c" />
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title">Lasso Regression (L1 Regularization)</text>
  
  <!-- Main Equation Section -->
  <rect x="50" y="60" width="700" height="120" class="box"/>
  <text x="400" y="85" text-anchor="middle" class="subtitle">Objective Function</text>
  
  <!-- Lasso equation -->
  <text x="100" y="120" class="large-equation">min</text>
  <text x="135" y="125" class="parameter" font-size="12px">θ</text>
  
  <text x="170" y="120" class="large-equation">[</text>
  <text x="185" y="120" class="large-equation">∑</text>
  <text x="185" y="135" class="parameter" font-size="10px">i=1</text>
  <text x="175" y="105" class="parameter" font-size="10px">n</text>
  
  <text x="210" y="120" class="large-equation">(Y</text>
  <text x="235" y="125" class="parameter" font-size="12px">i</text>
  <text x="250" y="120" class="large-equation">- θ</text>
  <text x="275" y="105" class="parameter" font-size="12px">T</text>
  <text x="285" y="120" class="large-equation">X</text>
  <text x="300" y="125" class="parameter" font-size="12px">i</text>
  <text x="315" y="120" class="large-equation">)²</text>
  
  <text x="350" y="120" class="large-equation">+</text>
  
  <text x="380" y="120" class="hyperparameter large-equation">α</text>
  
  <text x="410" y="120" class="large-equation">∑</text>
  <text x="410" y="135" class="parameter" font-size="10px">j=1</text>
  <text x="400" y="105" class="parameter" font-size="10px">m</text>
  
  <text x="435" y="120" class="large-equation">|θ</text>
  <text x="455" y="125" class="parameter" font-size="12px">j</text>
  <text x="470" y="120" class="large-equation">|</text>
  
  <text x="490" y="120" class="large-equation">]</text>
  
  <!-- Labels -->
  <text x="250" y="150" text-anchor="middle" class="description">Least Squares Loss</text>
  <path d="M 250 145 Q 250 130 250 115" class="arrow"/>
  
  <text x="450" y="150" text-anchor="middle" class="description">L1 Penalty Term</text>
  <path d="M 450 145 Q 450 130 450 115" class="arrow"/>
  
  <!-- Key Properties Section -->
  <text x="50" y="210" class="subtitle">Unique Properties of Lasso Regression</text>
  
  <!-- Property boxes -->
  <rect x="50" y="230" width="220" height="100" class="sparsity-box"/>
  <text x="160" y="250" text-anchor="middle" class="subtitle" fill="#d68910">Automatic Sparsity</text>
  <text x="70" y="270" class="description">• Sets many coefficients exactly to zero</text>
  <text x="70" y="285" class="description">• Built-in feature selection</text>
  <text x="70" y="300" class="description">• Identifies important variables</text>
  <text x="70" y="315" class="description">• Simpler, interpretable models</text>
  
  <rect x="290" y="230" width="220" height="100" class="highlight-box"/>
  <text x="400" y="250" text-anchor="middle" class="subtitle" fill="#16a085">Geometric Properties</text>
  <text x="310" y="270" class="description">• Diamond-shaped constraint region</text>
  <text x="310" y="285" class="description">• Corner solutions encourage zeros</text>
  <text x="310" y="300" class="description">• Non-differentiable at zero</text>
  <text x="310" y="315" class="description">• Requires iterative algorithms</text>
  
  <rect x="530" y="230" width="220" height="100" class="sparsity-box"/>
  <text x="640" y="250" text-anchor="middle" class="subtitle" fill="#d68910">Variable Selection</text>
  <text x="550" y="270" class="description">• Discovers sparsity patterns</text>
  <text x="550" y="285" class="description">• Handles high-dimensional data</text>
  <text x="550" y="300" class="description">• Robust feature identification</text>
  <text x="550" y="315" class="description">• Strong theoretical guarantees</text>
  
  <!-- Sparsity Illustration -->
  <rect x="50" y="350" width="350" height="130" class="box"/>
  <text x="225" y="375" text-anchor="middle" class="subtitle">Sparsity Pattern Example</text>
  
  <!-- Coefficient vector visualization -->
  <text x="70" y="400" class="equation">θ = [</text>
  <text x="110" y="400" class="nonzero-coeff equation">0.52</text>
  <text x="150" y="400" class="equation">,</text>
  <text x="165" y="400" class="zero-coeff equation">0.00</text>
  <text x="200" y="400" class="equation">,</text>
  <text x="215" y="400" class="nonzero-coeff equation">-0.31</text>
  <text x="260" y="400" class="equation">,</text>
  <text x="275" y="400" class="zero-coeff equation">0.00</text>
  <text x="310" y="400" class="equation">,</text>
  <text x="325" y="400" class="zero-coeff equation">0.00</text>
  <text x="360" y="400" class="equation">]</text>
  
  <!-- Legend -->
  <text x="70" y="425" class="nonzero-coeff">Non-zero coefficients</text>
  <text x="230" y="425" class="zero-coeff">Zero coefficients (selected out)</text>
  
  <!-- Sparsity metrics -->
  <text x="70" y="450" class="description">Active features: 2 out of 5 (40% sparsity)</text>
  <text x="70" y="465" class="description">Model interpretation: Only features 1 and 3 are relevant</text>
  
  <!-- Geometric Visualization -->
  <rect x="420" y="350" width="330" height="130" class="box"/>
  <text x="585" y="375" text-anchor="middle" class="subtitle">Geometric Intuition</text>
  
  <!-- Diamond representing L1 constraint -->
  <polygon points="585,420 615,440 585,460 555,440" fill="none" stroke="#e74c3c" stroke-width="3"/>
  <text x="585" y="445" text-anchor="middle" class="equation" fill="#e74c3c" font-size="10px">||θ||₁ ≤ t</text>
  
  <!-- Elliptical contours for loss function -->
  <ellipse cx="585" cy="440" rx="45" ry="25" fill="none" stroke="#3498db" stroke-width="2" stroke-dasharray="3,3"/>
  <ellipse cx="585" cy="440" rx="60" ry="35" fill="none" stroke="#3498db" stroke-width="1" stroke-dasharray="3,3"/>
  
  <!-- Solution point at corner -->
  <circle cx="555" cy="440" r="3" fill="#27ae60"/>
  <text x="545" y="435" class="description" fill="#27ae60" font-size="10px">Solution</text>
  <text x="535" y="450" class="description" fill="#27ae60" font-size="10px">(corner)</text>
  
  <text x="440" y="470" class="description">Diamond constraint promotes corner solutions → sparsity</text>
  
  <!-- Mathematical Properties -->
  <rect x="50" y="500" width="700" height="80" class="highlight-box"/>
  <text x="400" y="525" text-anchor="middle" class="subtitle" fill="#16a085">Mathematical Foundation</text>
  
  <text x="70" y="550" class="equation">L1 Norm: ||θ||₁ = |θ₁| + |θ₂| + ... + |θₘ|</text>
  <text x="70" y="570" class="equation">Sparsity Mechanism: Non-differentiable penalty at zero drives exact zeros in optimal solution</text>
</svg>