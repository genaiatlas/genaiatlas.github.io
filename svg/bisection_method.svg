<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="800" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="600" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    The Bisection Method: Efficient Preference Discovery
  </text>
  
  <!-- Visual Tree Structure -->
  <g id="tree-structure">
    <!-- Level 0 (Start) -->
    <rect x="550" y="80" width="100" height="50" fill="#3498db" stroke="#2c3e50" stroke-width="2" rx="5"/>
    <text x="600" y="110" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">
      N items
    </text>
    
    <!-- Arrow down -->
    <path d="M 600 130 L 600 160" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    
    <text x="650" y="150" font-family="Arial, sans-serif" font-size="13" fill="#e74c3c" font-weight="bold">
      Question 1
    </text>
    
    <!-- Level 1 -->
    <rect x="350" y="170" width="100" height="50" fill="#5dade2" stroke="#2c3e50" stroke-width="2" rx="5"/>
    <text x="400" y="200" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">
      N/2 items
    </text>
    
    <rect x="750" y="170" width="100" height="50" fill="#5dade2" stroke="#2c3e50" stroke-width="2" rx="5"/>
    <text x="800" y="200" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">
      N/2 items
    </text>
    
    <!-- Arrows from N to N/2 -->
    <path d="M 575 130 L 425 170" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 625 130 L 775 170" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- Arrow down from left N/2 -->
    <path d="M 400 220 L 400 250" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    
    <text x="450" y="240" font-family="Arial, sans-serif" font-size="13" fill="#e74c3c" font-weight="bold">
      Question 2
    </text>
    
    <!-- Level 2 -->
    <rect x="250" y="260" width="100" height="50" fill="#85c1e9" stroke="#2c3e50" stroke-width="2" rx="5"/>
    <text x="300" y="290" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">
      N/4 items
    </text>
    
    <rect x="450" y="260" width="100" height="50" fill="#85c1e9" stroke="#2c3e50" stroke-width="2" rx="5"/>
    <text x="500" y="290" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">
      N/4 items
    </text>
    
    <!-- Arrows from N/2 to N/4 -->
    <path d="M 375 220 L 325 260" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 425 220 L 475 260" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- Arrow down from left N/4 -->
    <path d="M 300 310 L 300 340" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    
    <text x="350" y="330" font-family="Arial, sans-serif" font-size="13" fill="#e74c3c" font-weight="bold">
      Question 3
    </text>
    
    <!-- Level 3 -->
    <rect x="200" y="350" width="90" height="45" fill="#aed6f1" stroke="#2c3e50" stroke-width="2" rx="5"/>
    <text x="245" y="378" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      N/8 items
    </text>
    
    <rect x="310" y="350" width="90" height="45" fill="#aed6f1" stroke="#2c3e50" stroke-width="2" rx="5"/>
    <text x="355" y="378" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      N/8 items
    </text>
    
    <!-- Arrows from N/4 to N/8 -->
    <path d="M 280 310 L 235 350" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 320 310 L 345 350" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- Continuation dots -->
    <text x="245" y="425" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#7f8c8d">
      ⋮
    </text>
    <text x="355" y="425" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#7f8c8d">
      ⋮
    </text>
    
    <!-- Final level -->
    <ellipse cx="245" cy="460" rx="35" ry="25" fill="#2ecc71" stroke="#2c3e50" stroke-width="2"/>
    <text x="245" y="467" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">
      1 item
    </text>
    
    <ellipse cx="355" cy="460" rx="35" ry="25" fill="#2ecc71" stroke="#2c3e50" stroke-width="2"/>
    <text x="355" y="467" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">
      1 item
    </text>
  </g>
  
  <!-- Mathematical Formula Section -->
  <g id="formulas">
    <rect x="650" y="270" width="500" height="240" fill="#fff" stroke="#2c3e50" stroke-width="2" rx="10"/>
    
    <text x="900" y="305" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Mathematical Framework
    </text>
    
    <!-- Formula 1 -->
    <text x="700" y="345" font-family="Arial, sans-serif" font-size="15" fill="#555">
      After K questions:
    </text>
    <text x="900" y="375" font-family="Courier New, monospace" font-size="18" font-weight="bold" text-anchor="middle" fill="#e74c3c">
      Remaining = N / 2^K
    </text>
    
    <!-- Formula 2 -->
    <text x="700" y="415" font-family="Arial, sans-serif" font-size="15" fill="#555">
      To identify one item:
    </text>
    <text x="900" y="445" font-family="Courier New, monospace" font-size="18" font-weight="bold" text-anchor="middle" fill="#27ae60">
      K ≥ log₂(N)
    </text>
    
    <!-- Example -->
    <rect x="680" y="465" width="440" height="35" fill="#ecf0f1" stroke="#95a5a6" stroke-width="1" rx="5"/>
    <text x="900" y="488" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50">
      Example: N = 1,000,000 → Need only 20 questions
    </text>
  </g>
  
  <!-- Comparison Table -->
  <g id="comparison-table">
    <rect x="50" y="530" width="1100" height="240" fill="#fff" stroke="#2c3e50" stroke-width="2" rx="10"/>
    
    <text x="600" y="565" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Efficiency Comparison: Bisection vs Sequential
    </text>
    
    <!-- Table headers -->
    <rect x="100" y="585" width="300" height="40" fill="#34495e" stroke="#2c3e50" stroke-width="1"/>
    <text x="250" y="612" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#fff">
      Number of Candidates (N)
    </text>
    
    <rect x="400" y="585" width="300" height="40" fill="#3498db" stroke="#2c3e50" stroke-width="1"/>
    <text x="550" y="612" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#fff">
      Bisection Method
    </text>
    
    <rect x="700" y="585" width="300" height="40" fill="#e74c3c" stroke="#2c3e50" stroke-width="1"/>
    <text x="850" y="612" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#fff">
      Sequential Method
    </text>
    
    <!-- Row 1: 100 -->
    <rect x="100" y="625" width="300" height="35" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
    <text x="250" y="648" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50">
      100
    </text>
    
    <rect x="400" y="625" width="300" height="35" fill="#d6eaf8" stroke="#bdc3c7" stroke-width="1"/>
    <text x="550" y="648" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50">
      7 questions
    </text>
    
    <rect x="700" y="625" width="300" height="35" fill="#fadbd8" stroke="#bdc3c7" stroke-width="1"/>
    <text x="850" y="648" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50">
      100 questions
    </text>
    
    <!-- Row 2: 1,000 -->
    <rect x="100" y="660" width="300" height="35" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
    <text x="250" y="683" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50">
      1,000
    </text>
    
    <rect x="400" y="660" width="300" height="35" fill="#d6eaf8" stroke="#bdc3c7" stroke-width="1"/>
    <text x="550" y="683" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50">
      10 questions
    </text>
    
    <rect x="700" y="660" width="300" height="35" fill="#fadbd8" stroke="#bdc3c7" stroke-width="1"/>
    <text x="850" y="683" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50">
      1,000 questions
    </text>
    
    <!-- Row 3: 1,000,000 -->
    <rect x="100" y="695" width="300" height="35" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
    <text x="250" y="718" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50">
      1,000,000
    </text>
    
    <rect x="400" y="695" width="300" height="35" fill="#d6eaf8" stroke="#bdc3c7" stroke-width="1"/>
    <text x="550" y="718" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#27ae60">
      20 questions
    </text>
    
    <rect x="700" y="695" width="300" height="35" fill="#fadbd8" stroke="#bdc3c7" stroke-width="1"/>
    <text x="850" y="718" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#c0392b">
      1,000,000 questions
    </text>
    
    <!-- Row 4: 50,000,000 (Tinder) -->
    <rect x="100" y="730" width="300" height="35" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
    <text x="250" y="753" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50">
      50,000,000 (Tinder)
    </text>
    
    <rect x="400" y="730" width="300" height="35" fill="#d6eaf8" stroke="#bdc3c7" stroke-width="1"/>
    <text x="550" y="753" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#27ae60">
      26 questions
    </text>
    
    <rect x="700" y="730" width="300" height="35" fill="#fadbd8" stroke="#bdc3c7" stroke-width="1"/>
    <text x="850" y="753" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#c0392b">
      50,000,000 questions
    </text>
  </g>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#2c3e50"/>
    </marker>
  </defs>
</svg>