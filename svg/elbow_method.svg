<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #2c3e50; }
      .subtitle { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #34495e; }
      .label { font-family: Arial, sans-serif; font-size: 12px; fill: #2c3e50; }
      .axis-label { font-family: Arial, sans-serif; font-size: 14px; fill: #2c3e50; font-weight: bold; }
      .plot-line { stroke: #e74c3c; stroke-width: 3; fill: none; }
      .plot-point { fill: #3498db; stroke: #2980b9; stroke-width: 2; }
      .elbow-point { fill: #27ae60; stroke: #229954; stroke-width: 3; }
      .axis { stroke: #34495e; stroke-width: 2; }
      .grid { stroke: #ecf0f1; stroke-width: 0.5; }
      .background { fill: #f8f9fa; stroke: #dee2e6; stroke-width: 1; }
      .annotation { fill: #27ae60; font-family: Arial, sans-serif; font-size: 12px; font-weight: bold; }
      .arrow { stroke: #27ae60; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#27ae60"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title">Elbow Method for Optimal K Selection</text>
  
  <!-- Main Plot -->
  <g transform="translate(100, 80)">
    <rect x="0" y="0" width="450" height="350" class="background" rx="10"/>
    <text x="225" y="25" text-anchor="middle" class="subtitle">Within-Cluster Sum of Squares vs Number of Clusters</text>
    
    <!-- Plot area -->
    <g transform="translate(50, 300)">
      <!-- Axes -->
      <line x1="0" y1="0" x2="350" y2="0" class="axis"/>
      <line x1="0" y1="0" x2="0" y2="-220" class="axis"/>
      
      <!-- Grid lines -->
      <g class="grid">
        <line x1="0" y1="-50" x2="350" y2="-50"/>
        <line x1="0" y1="-100" x2="350" y2="-100"/>
        <line x1="0" y1="-150" x2="350" y2="-150"/>
        <line x1="0" y1="-200" x2="350" y2="-200"/>
        
        <line x1="50" y1="0" x2="50" y2="-220"/>
        <line x1="100" y1="0" x2="100" y2="-220"/>
        <line x1="150" y1="0" x2="150" y2="-220"/>
        <line x1="200" y1="0" x2="200" y2="-220"/>
        <line x1="250" y1="0" x2="250" y2="-220"/>
        <line x1="300" y1="0" x2="300" y2="-220"/>
      </g>
      
      <!-- Axis labels -->
      <text x="175" y="25" text-anchor="middle" class="axis-label">Number of Clusters (K)</text>
      <text x="-35" y="-110" text-anchor="middle" class="axis-label" transform="rotate(-90, -35, -110)">WCSS</text>
      
      <!-- Tick labels -->
      <text x="50" y="15" text-anchor="middle" class="label">1</text>
      <text x="100" y="15" text-anchor="middle" class="label">2</text>
      <text x="150" y="15" text-anchor="middle" class="label">3</text>
      <text x="200" y="15" text-anchor="middle" class="label">4</text>
      <text x="250" y="15" text-anchor="middle" class="label">5</text>
      <text x="300" y="15" text-anchor="middle" class="label">6</text>
      
      <text x="-10" y="-45" text-anchor="end" class="label">50</text>
      <text x="-10" y="-95" text-anchor="end" class="label">100</text>
      <text x="-10" y="-145" text-anchor="end" class="label">150</text>
      <text x="-10" y="-195" text-anchor="end" class="label">200</text>
      
      <!-- Data points and line -->
      <circle cx="50" cy="-190" r="6" class="plot-point"/>
      <circle cx="100" cy="-120" r="6" class="elbow-point"/>
      <circle cx="150" cy="-85" r="6" class="plot-point"/>
      <circle cx="200" cy="-70" r="6" class="plot-point"/>
      <circle cx="250" cy="-60" r="6" class="plot-point"/>
      <circle cx="300" cy="-55" r="6" class="plot-point"/>
      
      <!-- Connecting line -->
      <path d="M 50 -190 L 100 -120 L 150 -85 L 200 -70 L 250 -60 L 300 -55" class="plot-line"/>
      
      <!-- Elbow annotation -->
      <path d="M 130 -140 L 100 -120" class="arrow"/>
      <text x="135" y="-135" class="annotation">Elbow Point</text>
      <text x="135" y="-122" class="annotation">K = 2</text>
      
      <!-- Rapid decrease annotation -->
      <text x="10" y="-155" class="label" style="color: #e74c3c; font-weight: bold;">Rapid</text>
      <text x="10" y="-140" class="label" style="color: #e74c3c; font-weight: bold;">Decrease</text>
      
      <!-- Slow decrease annotation -->
      <text x="260" y="-100" class="label" style="color: #e67e22; font-weight: bold;">Slow</text>
      <text x="260" y="-85" class="label" style="color: #e67e22; font-weight: bold;">Decrease</text>
    </g>
  </g>
  
  <!-- Method Explanation -->
  <g transform="translate(100, 450)">
    <rect x="0" y="0" width="600" height="120" fill="#e8f5e8" stroke="#27ae60" stroke-width="2" rx="10"/>
    <text x="300" y="25" text-anchor="middle" class="subtitle" style="color: #27ae60;">How the Elbow Method Works</text>
    
    <g transform="translate(20, 40)">
      <text x="0" y="0" class="label"><tspan style="font-weight: bold;">1. Run K-means for different K values:</tspan> K = 1, 2, 3, 4, 5, 6...</text>
      <text x="0" y="20" class="label"><tspan style="font-weight: bold;">2. Calculate WCSS for each K:</tspan> Within-Cluster Sum of Squares</text>
      <text x="0" y="40" class="label"><tspan style="font-weight: bold;">3. Plot WCSS vs K:</tspan> Look for the "elbow" where decrease slows</text>
      <text x="0" y="60" class="label"><tspan style="font-weight: bold;">4. Choose K at the elbow:</tspan> Balance between fit and complexity</text>
    </g>
  </g>
  
  <!-- Alternative Methods Panel -->
  <g transform="translate(580, 80)">
    <rect x="0" y="0" width="200" height="350" class="background" rx="10"/>
    <text x="100" y="25" text-anchor="middle" class="subtitle">Alternative Methods</text>
    
    <!-- AIC/BIC Method -->
    <g transform="translate(20, 50)">
      <rect x="0" y="0" width="160" height="80" fill="#fff5f5" stroke="#e74c3c" stroke-width="1" rx="5"/>
      <text x="80" y="15" text-anchor="middle" class="label" style="font-weight: bold;">AIC/BIC Methods</text>
      
      <!-- Mini plot -->
      <g transform="translate(20, 25)">
        <line x1="0" y1="40" x2="120" y2="40" stroke="#95a5a6" stroke-width="1"/>
        <line x1="0" y1="40" x2="0" y2="0" stroke="#95a5a6" stroke-width="1"/>
        
        <!-- AIC curve with minimum -->
        <path d="M 10 35 Q 40 20 60 15 Q 80 12 120 18" stroke="#e74c3c" stroke-width="2" fill="none"/>
        <circle cx="60" cy="15" r="3" fill="#e74c3c"/>
        
        <text x="60" y="55" text-anchor="middle" class="label" style="font-size: 10px;">Minimum</text>
      </g>
    </g>
    
    <!-- Gap Statistic -->
    <g transform="translate(20, 150)">
      <rect x="0" y="0" width="160" height="80" fill="#f0f8ff" stroke="#3498db" stroke-width="1" rx="5"/>
      <text x="80" y="15" text-anchor="middle" class="label" style="font-weight: bold;">Gap Statistic</text>
      
      <text x="10" y="35" class="label" style="font-size: 10px;">Compare to random</text>
      <text x="10" y="50" class="label" style="font-size: 10px;">reference distribution</text>
      <text x="10" y="65" class="label" style="font-size: 10px;">Gap(k) = E[log(W)] - log(W)</text>
    </g>
    
    <!-- Silhouette Analysis -->
    <g transform="translate(20, 250)">
      <rect x="0" y="0" width="160" height="80" fill="#f5f0ff" stroke="#9b59b6" stroke-width="1" rx="5"/>
      <text x="80" y="15" text-anchor="middle" class="label" style="font-weight: bold;">Silhouette Analysis</text>
      
      <text x="10" y="35" class="label" style="font-size: 10px;">Measure cluster</text>
      <text x="10" y="50" class="label" style="font-size: 10px;">cohesion and</text>
      <text x="10" y="65" class="label" style="font-size: 10px;">separation</text>
    </g>
  </g>
  
  <!-- Key Insights -->
  <g transform="translate(580, 450)">
    <rect x="0" y="0" width="200" height="120" fill="#fff8e1" stroke="#f39c12" stroke-width="2" rx="10"/>
    <text x="100" y="20" text-anchor="middle" class="subtitle" style="color: #e67e22;">Key Insights</text>
    
    <g transform="translate(10, 35)">
      <text x="0" y="0" class="label">• WCSS always decreases</text>
      <text x="0" y="15" class="label">  as K increases</text>
      <text x="0" y="35" class="label">• K = N would give</text>
      <text x="0" y="50" class="label">  WCSS = 0 (useless)</text>
      <text x="0" y="70" class="label">• Elbow = best trade-off</text>
    </g>
  </g>
</svg>