<svg viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">
  <rect width="1400" height="900" fill="#f8f9fa"/>
  <text x="700" y="40" font-family="Arial" font-size="28" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Query Translation Techniques Overview</text>
  
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" fill="#495057"/></marker></defs>
  
  <rect x="450" y="80" width="500" height="70" rx="10" fill="#ffdeeb" stroke="#e64980" stroke-width="3"/>
  <text x="700" y="108" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Original Query</text>
  <text x="700" y="132" font-family="Arial" font-size="13" text-anchor="middle" font-style="italic" fill="#868e96">"What are the health benefits of meditation?"</text>
  
  <line x1="700" y1="150" x2="700" y2="185" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  
  <rect x="350" y="195" width="700" height="60" rx="10" fill="#9333ea" stroke="#7950f2" stroke-width="3"/>
  <text x="700" y="230" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="white">Query Translation Engine</text>
  
  <g id="techniques">
    <rect x="80" y="300" width="240" height="120" rx="8" fill="#fff3bf" stroke="#f59f00" stroke-width="2"/>
    <text x="200" y="330" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">1️⃣ Multi-Query</text>
    <text x="100" y="355" font-family="Arial" font-size="10">• Multiple variations</text>
    <text x="100" y="375" font-family="Arial" font-size="10">• Different phrasings</text>
    <text x="100" y="395" font-family="Arial" font-size="10">• Parallel retrieval</text>
    
    <rect x="350" y="300" width="240" height="120" rx="8" fill="#d0bfff" stroke="#7950f2" stroke-width="2"/>
    <text x="470" y="330" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">2️⃣ Step-Back</text>
    <text x="370" y="355" font-family="Arial" font-size="10">• Higher-level question</text>
    <text x="370" y="375" font-family="Arial" font-size="10">• Foundational context</text>
    <text x="370" y="395" font-family="Arial" font-size="10">• Background retrieval</text>
    
    <rect x="620" y="300" width="240" height="120" rx="8" fill="#d3f9d8" stroke="#37b24d" stroke-width="2"/>
    <text x="740" y="330" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">3️⃣ RAG-Fusion</text>
    <text x="640" y="355" font-family="Arial" font-size="10">• Multi-query + RRF</text>
    <text x="640" y="375" font-family="Arial" font-size="10">• Result merging</text>
    <text x="640" y="395" font-family="Arial" font-size="10">• Comprehensive</text>
    
    <rect x="890" y="300" width="240" height="120" rx="8" fill="#ffc9c9" stroke="#f03e3e" stroke-width="2"/>
    <text x="1010" y="330" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">4️⃣ Decomposition</text>
    <text x="910" y="355" font-family="Arial" font-size="10">• Break into sub-Q</text>
    <text x="910" y="375" font-family="Arial" font-size="10">• Sequential answering</text>
    <text x="910" y="395" font-family="Arial" font-size="10">• Multi-hop reasoning</text>
    
    <rect x="1160" y="300" width="200" height="120" rx="8" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
    <text x="1260" y="330" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">5️⃣ HyDE</text>
    <text x="1180" y="355" font-family="Arial" font-size="10">• Generate hypothesis</text>
    <text x="1180" y="375" font-family="Arial" font-size="10">• Embed answer</text>
    <text x="1180" y="395" font-family="Arial" font-size="10">• Search similarity</text>
  </g>
  
  <line x1="700" y1="255" x2="200" y2="295" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="700" y1="255" x2="470" y2="295" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="700" y1="255" x2="740" y2="295" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="700" y1="255" x2="1010" y2="295" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="700" y1="255" x2="1260" y2="295" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
  
  <rect x="50" y="480" width="1300" height="180" rx="10" fill="#fff9db" stroke="#fab005" stroke-width="3"/>
  <text x="700" y="510" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">📊 Comparison Summary</text>
  <text x="80" y="545" font-family="Arial" font-size="11" fill="#495057"><tspan font-weight="bold">Multi-Query:</tspan> Best for ambiguous queries | Complexity: Low | Cost: Medium</text>
  <text x="80" y="570" font-family="Arial" font-size="11" fill="#495057"><tspan font-weight="bold">Step-Back:</tspan> Best for complex questions needing context | Complexity: Low | Cost: Low</text>
  <text x="80" y="595" font-family="Arial" font-size="11" fill="#495057"><tspan font-weight="bold">RAG-Fusion:</tspan> Best for comprehensive coverage | Complexity: Medium | Cost: High</text>
  <text x="80" y="620" font-family="Arial" font-size="11" fill="#495057"><tspan font-weight="bold">Decomposition:</tspan> Best for multi-step reasoning | Complexity: High | Cost: Very High</text>
  <text x="80" y="645" font-family="Arial" font-size="11" fill="#495057"><tspan font-weight="bold">HyDE:</tspan> Best for query-document mismatch | Complexity: Low | Cost: Medium</text>
  
  <rect x="50" y="700" width="1300" height="170" rx="10" fill="#d0ebff" stroke="#1c7ed6" stroke-width="3"/>
  <text x="700" y="730" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">✅ Selection Guide</text>
  <text x="80" y="760" font-family="Arial" font-size="11" fill="#495057">• Query is ambiguous or vague → <tspan font-weight="bold" fill="#f59f00">Multi-Query</tspan> or <tspan font-weight="bold" fill="#37b24d">RAG-Fusion</tspan></text>
  <text x="80" y="785" font-family="Arial" font-size="11" fill="#495057">• Need background knowledge → <tspan font-weight="bold" fill="#7950f2">Step-Back Prompting</tspan></text>
  <text x="80" y="810" font-family="Arial" font-size="11" fill="#495057">• Complex multi-part question → <tspan font-weight="bold" fill="#f03e3e">Query Decomposition</tspan></text>
  <text x="80" y="835" font-family="Arial" font-size="11" fill="#495057">• Query-document vocabulary mismatch → <tspan font-weight="bold" fill="#1971c2">HyDE</tspan></text>
  <text x="80" y="860" font-family="Arial" font-size="11" fill="#495057">• Comprehensive research needed → <tspan font-weight="bold" fill="#37b24d">RAG-Fusion</tspan></text>
</svg>