<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="500" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    Neural Network Regularization Techniques Overview
  </text>
  
  <!-- Central Neural Network -->
  <g id="neural-network" transform="translate(350, 100)">
    <!-- Input Layer -->
    <circle cx="0" cy="60" r="12" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    <circle cx="0" cy="100" r="12" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    <circle cx="0" cy="140" r="12" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    
    <!-- Hidden Layer -->
    <circle cx="80" cy="40" r="12" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
    <circle cx="80" cy="80" r="12" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
    <circle cx="80" cy="120" r="12" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
    <circle cx="80" cy="160" r="12" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
    
    <!-- Output Layer -->
    <circle cx="160" cy="80" r="12" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
    <circle cx="160" cy="120" r="12" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
    
    <!-- Connections -->
    <g stroke="#34495e" stroke-width="1" opacity="0.6">
      <line x1="12" y1="60" x2="68" y2="40"/>
      <line x1="12" y1="60" x2="68" y2="80"/>
      <line x1="12" y1="60" x2="68" y2="120"/>
      <line x1="12" y1="60" x2="68" y2="160"/>
      
      <line x1="12" y1="100" x2="68" y2="40"/>
      <line x1="12" y1="100" x2="68" y2="80"/>
      <line x1="12" y1="100" x2="68" y2="120"/>
      <line x1="12" y1="100" x2="68" y2="160"/>
      
      <line x1="12" y1="140" x2="68" y2="40"/>
      <line x1="12" y1="140" x2="68" y2="80"/>
      <line x1="12" y1="140" x2="68" y2="120"/>
      <line x1="12" y1="140" x2="68" y2="160"/>
      
      <line x1="92" y1="40" x2="148" y2="80"/>
      <line x1="92" y1="40" x2="148" y2="120"/>
      <line x1="92" y1="80" x2="148" y2="80"/>
      <line x1="92" y1="80" x2="148" y2="120"/>
      <line x1="92" y1="120" x2="148" y2="80"/>
      <line x1="92" y1="120" x2="148" y2="120"/>
      <line x1="92" y1="160" x2="148" y2="80"/>
      <line x1="92" y1="160" x2="148" y2="120"/>
    </g>
    
    <!-- Layer Labels -->
    <text x="0" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Input</text>
    <text x="80" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Hidden</text>
    <text x="160" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Output</text>
  </g>
  
  <!-- Regularization Technique Boxes -->
  
  <!-- Weight Decay -->
  <g id="weight-decay" transform="translate(50, 80)">
    <rect width="120" height="80" rx="8" fill="#e8f4f8" stroke="#3498db" stroke-width="2"/>
    <text x="60" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2980b9">Weight Decay</text>
    <text x="60" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#34495e">λ||W||²</text>
    <text x="60" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Penalty Term</text>
    <path d="M 120 40 L 340 140" stroke="#3498db" stroke-width="2" marker-end="url(#arrowhead-blue)" fill="none"/>
  </g>
  
  <!-- Early Stopping -->
  <g id="early-stopping" transform="translate(50, 280)">
    <rect width="120" height="80" rx="8" fill="#f0f8e8" stroke="#2ecc71" stroke-width="2"/>
    <text x="60" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#27ae60">Early Stopping</text>
    <path d="M 20 40 L 100 40 L 100 60 L 20 60 Z" fill="none" stroke="#27ae60" stroke-width="1"/>
    <path d="M 20 50 L 40 45 L 60 55 L 80 50 L 100 60" fill="none" stroke="#e74c3c" stroke-width="2"/>
    <line x1="70" y1="35" x2="70" y2="65" stroke="#2ecc71" stroke-width="2" stroke-dasharray="3,3"/>
    <path d="M 120 40 L 340 200" stroke="#2ecc71" stroke-width="2" marker-end="url(#arrowhead-green)" fill="none"/>
  </g>
  
  <!-- Data Augmentation -->
  <g id="data-augmentation" transform="translate(630, 80)">
    <rect width="120" height="80" rx="8" fill="#fff3e0" stroke="#f39c12" stroke-width="2"/>
    <text x="60" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#d35400">Data</text>
    <text x="60" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#d35400">Augmentation</text>
    <g transform="translate(30, 45)">
      <rect width="15" height="15" fill="#f39c12" transform="rotate(0)"/>
      <rect width="15" height="15" fill="#f39c12" transform="translate(25, 0) rotate(15)"/>
      <rect width="15" height="15" fill="#f39c12" transform="translate(45, 0) rotate(30)"/>
    </g>
    <path d="M 630 140 L 520 140" stroke="#f39c12" stroke-width="2" marker-end="url(#arrowhead-orange)" fill="none"/>
  </g>
  
  <!-- Dropout -->
  <g id="dropout" transform="translate(630, 200)">
    <rect width="120" height="80" rx="8" fill="#f8e8f8" stroke="#9b59b6" stroke-width="2"/>
    <text x="60" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#8e44ad">Dropout</text>
    <g transform="translate(25, 35)">
      <circle cx="15" cy="10" r="6" fill="#9b59b6"/>
      <circle cx="35" cy="10" r="6" fill="none" stroke="#9b59b6" stroke-width="2" stroke-dasharray="2,2"/>
      <circle cx="55" cy="10" r="6" fill="#9b59b6"/>
      <line x1="30" y1="5" x2="40" y2="15" stroke="#e74c3c" stroke-width="2"/>
      <line x1="40" y1="5" x2="30" y2="15" stroke="#e74c3c" stroke-width="2"/>
    </g>
    <text x="60" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Random Deactivation</text>
    <path d="M 630 240 L 520 180" stroke="#9b59b6" stroke-width="2" marker-end="url(#arrowhead-purple)" fill="none"/>
  </g>
  
  <!-- Batch Normalization -->
  <g id="batch-norm" transform="translate(630, 320)">
    <rect width="120" height="80" rx="8" fill="#e8f5e8" stroke="#27ae60" stroke-width="2"/>
    <text x="60" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#229954">Batch</text>
    <text x="60" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#229954">Normalization</text>
    <text x="60" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#34495e">μ = 0, σ = 1</text>
    <path d="M 20 60 L 100 60" stroke="#27ae60" stroke-width="2"/>
    <circle cx="35" cy="60" r="2" fill="#27ae60"/>
    <circle cx="50" cy="60" r="2" fill="#27ae60"/>
    <circle cx="65" cy="60" r="2" fill="#27ae60"/>
    <circle cx="80" cy="60" r="2" fill="#27ae60"/>
    <path d="M 630 360 L 520 220" stroke="#27ae60" stroke-width="2" marker-end="url(#arrowhead-green2)" fill="none"/>
  </g>
  
  <!-- Problem Statement -->
  <g id="problem" transform="translate(50, 400)">
    <rect width="200" height="60" rx="8" fill="#fdeaea" stroke="#e74c3c" stroke-width="2"/>
    <text x="100" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#c0392b">Overfitting Problem</text>
    <text x="100" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#e74c3c">High Training Accuracy</text>
    <text x="100" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#e74c3c">Low Validation Accuracy</text>
  </g>
  
  <!-- Solution -->
  <g id="solution" transform="translate(550, 400)">
    <rect width="200" height="60" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
    <text x="100" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#229954">Better Generalization</text>
    <text x="100" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#27ae60">Balanced Performance</text>
    <text x="100" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#27ae60">Robust Predictions</text>
  </g>
  
  <!-- Arrow from problem to solution -->
  <path d="M 250 430 L 550 430" stroke="#34495e" stroke-width="3" marker-end="url(#arrowhead-dark)" fill="none"/>
  <text x="400" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Regularization Techniques</text>
  
  <!-- Define arrow markers -->
  <defs>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3498db"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2ecc71"/>
    </marker>
    <marker id="arrowhead-green2" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#27ae60"/>
    </marker>
    <marker id="arrowhead-orange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f39c12"/>
    </marker>
    <marker id="arrowhead-purple" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9b59b6"/>
    </marker>
    <marker id="arrowhead-dark" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e"/>
    </marker>
  </defs>
</svg>