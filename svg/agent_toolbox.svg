<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1400" height="1000" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="700" y="50" font-size="32" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Agent Toolbox Ecosystem
  </text>
  <text x="700" y="85" font-size="16" text-anchor="middle" fill="#666">
    Tools and Capabilities for AI Development Partners
  </text>
  
  <!-- Central Agent -->
  <g transform="translate(700, 350)">
    <circle cx="0" cy="0" r="80" fill="#3498db" opacity="0.9"/>
    <text x="0" y="-10" font-size="24" font-weight="bold" text-anchor="middle" fill="white">
      AI Agent
    </text>
    <text x="0" y="20" font-size="14" text-anchor="middle" fill="white">
      Development
    </text>
    <text x="0" y="40" font-size="14" text-anchor="middle" fill="white">
      Partner
    </text>
  </g>
  
  <!-- Local Commands Category -->
  <g transform="translate(200, 150)">
    <rect x="0" y="0" width="260" height="200" fill="#27ae60" rx="10" opacity="0.9"/>
    <text x="130" y="35" font-size="18" font-weight="bold" text-anchor="middle" fill="white">
      🖥️ Local Commands
    </text>
    
    <text x="20" y="70" font-size="13" font-weight="bold" fill="white">Testing:</text>
    <text x="30" y="90" font-size="11" fill="white">pytest, jest, mocha</text>
    
    <text x="20" y="115" font-size="13" font-weight="bold" fill="white">Linting:</text>
    <text x="30" y="135" font-size="11" fill="white">ruff, eslint, pylint</text>
    
    <text x="20" y="160" font-size="13" font-weight="bold" fill="white">Formatting:</text>
    <text x="30" y="180" font-size="11" fill="white">black, prettier, gofmt</text>
  </g>
  <line x1="460" y1="250" x2="630" y2="310" stroke="#27ae60" stroke-width="3"/>
  
  <!-- DevOps Tools Category -->
  <g transform="translate(940, 150)">
    <rect x="0" y="0" width="260" height="200" fill="#e74c3c" rx="10" opacity="0.9"/>
    <text x="130" y="35" font-size="18" font-weight="bold" text-anchor="middle" fill="white">
      ⚙️ DevOps Tools
    </text>
    
    <text x="20" y="70" font-size="13" font-weight="bold" fill="white">Source Control:</text>
    <text x="30" y="90" font-size="11" fill="white">git, gh (GitHub CLI)</text>
    
    <text x="20" y="115" font-size="13" font-weight="bold" fill="white">Observability:</text>
    <text x="30" y="135" font-size="11" fill="white">Sentry, Logfire, Datadog</text>
    
    <text x="20" y="160" font-size="13" font-weight="bold" fill="white">Infrastructure:</text>
    <text x="30" y="180" font-size="11" fill="white">Terraform, AWS CLI, kubectl</text>
  </g>
  <line x1="940" y1="250" x2="770" y2="310" stroke="#e74c3c" stroke-width="3"/>
  
  <!-- MCP Servers Category -->
  <g transform="translate(200, 550)">
    <rect x="0" y="0" width="260" height="220" fill="#9b59b6" rx="10" opacity="0.9"/>
    <text x="130" y="35" font-size="18" font-weight="bold" text-anchor="middle" fill="white">
      🔌 MCP Servers
    </text>
    <text x="130" y="55" font-size="11" text-anchor="middle" fill="white">
      Model Context Protocol
    </text>
    
    <text x="20" y="85" font-size="13" font-weight="bold" fill="white">Browser:</text>
    <text x="30" y="105" font-size="11" fill="white">Playwright automation</text>
    
    <text x="20" y="130" font-size="13" font-weight="bold" fill="white">API Testing:</text>
    <text x="30" y="150" font-size="11" fill="white">Postman integration</text>
    
    <text x="20" y="175" font-size="13" font-weight="bold" fill="white">Cloud Services:</text>
    <text x="30" y="195" font-size="11" fill="white">GitHub, Stripe, Supabase</text>
  </g>
  <line x1="460" y1="660" x2="630" y2="390" stroke="#9b59b6" stroke-width="3"/>
  
  <!-- Custom Tools Category -->
  <g transform="translate(940, 550)">
    <rect x="0" y="0" width="260" height="220" fill="#f39c12" rx="10" opacity="0.9"/>
    <text x="130" y="35" font-size="18" font-weight="bold" text-anchor="middle" fill="white">
      🛠️ Custom Tools
    </text>
    
    <text x="20" y="75" font-size="13" font-weight="bold" fill="white">Prompts:</text>
    <text x="30" y="95" font-size="11" fill="white">Slash commands (/explain)</text>
    <text x="30" y="115" font-size="11" fill="white">Reusable prompt templates</text>
    
    <text x="20" y="145" font-size="13" font-weight="bold" fill="white">Sub-agents / Modes:</text>
    <text x="30" y="165" font-size="11" fill="white">Pre-configured personas</text>
    <text x="30" y="185" font-size="11" fill="white">Specialized workflows</text>
  </g>
  <line x1="940" y1="660" x2="770" y2="390" stroke="#f39c12" stroke-width="3"/>
  
  <!-- Capability Circles -->
  
  <!-- Self-Correction -->
  <g transform="translate(520, 500)">
    <circle cx="0" cy="0" r="60" fill="#16a085" opacity="0.85"/>
    <text x="0" y="-5" font-size="13" font-weight="bold" text-anchor="middle" fill="white">
      Self-
    </text>
    <text x="0" y="12" font-size="13" font-weight="bold" text-anchor="middle" fill="white">
      Correction
    </text>
  </g>
  
  <!-- Planning -->
  <g transform="translate(880, 500)">
    <circle cx="0" cy="0" r="60" fill="#d35400" opacity="0.85"/>
    <text x="0" y="5" font-size="13" font-weight="bold" text-anchor="middle" fill="white">
      Planning
    </text>
  </g>
  
  <!-- Iteration -->
  <g transform="translate(520, 200)">
    <circle cx="0" cy="0" r="60" fill="#8e44ad" opacity="0.85"/>
    <text x="0" y="5" font-size="13" font-weight="bold" text-anchor="middle" fill="white">
      Iteration
    </text>
  </g>
  
  <!-- Execution -->
  <g transform="translate(880, 200)">
    <circle cx="0" cy="0" r="60" fill="#c0392b" opacity="0.85"/>
    <text x="0" y="5" font-size="13" font-weight="bold" text-anchor="middle" fill="white">
      Execution
    </text>
  </g>
  
  <!-- Key Benefits Box -->
  <g transform="translate(50, 820)">
    <rect x="0" y="0" width="600" height="150" fill="#e8f4f8" rx="10" stroke="#3498db" stroke-width="2"/>
    <text x="300" y="35" font-size="18" font-weight="bold" text-anchor="middle" fill="#1f618d">
      💡 Key Benefits
    </text>
    
    <text x="30" y="70" font-size="13" fill="#2874a6">✓ Full development lifecycle participation</text>
    <text x="30" y="95" font-size="13" fill="#2874a6">✓ Automated testing and quality assurance</text>
    <text x="30" y="120" font-size="13" fill="#2874a6">✓ Environment interaction capabilities</text>
  </g>
  
  <!-- Team Collaboration Box -->
  <g transform="translate(750, 820)">
    <rect x="0" y="0" width="600" height="150" fill="#fef5e7" rx="10" stroke="#f39c12" stroke-width="2"/>
    <text x="300" y="35" font-size="18" font-weight="bold" text-anchor="middle" fill="#9c640c">
      🤝 Team Collaboration
    </text>
    
    <text x="30" y="70" font-size="13" fill="#a04000">✓ Share custom tools and workflows</text>
    <text x="30" y="95" font-size="13" fill="#a04000">✓ Standardize best practices</text>
    <text x="30" y="120" font-size="13" fill="#a04000">✓ Onboard new team members faster</text>
  </g>
  
  <!-- Transformation Note -->
  <g transform="translate(350, 905)">
    <text x="350" y="30" font-size="15" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Agents evolve from code generators → true development assistants
    </text>
  </g>
</svg>