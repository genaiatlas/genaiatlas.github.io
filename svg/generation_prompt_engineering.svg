<svg viewBox="0 0 1400 1050" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1400" height="1050" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="700" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Prompt Engineering for RAG
  </text>
  <text x="700" y="70" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#495057">
    Crafting Effective Prompts for High-Quality Generation
  </text>
  
  <!-- Prompt Structure -->
  <rect x="50" y="110" width="580" height="850" rx="15" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="4"/>
  <text x="340" y="150" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    📝 Prompt Structure
  </text>
  
  <!-- 1. System Instructions -->
  <g id="system-instructions">
    <rect x="80" y="180" width="520" height="140" rx="10" fill="#fff" stroke="#1c7ed6" stroke-width="3"/>
    <text x="340" y="210" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1c7ed6">
      1️⃣ System Instructions
    </text>
    <text x="100" y="235" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="#868e96">
      Define role, behavior, and constraints
    </text>
    <rect x="100" y="245" width="480" height="60" rx="5" fill="#f8f9fa" stroke="#1c7ed6" stroke-width="1"/>
    <text x="110" y="262" font-family="Courier, monospace" font-size="9" fill="#495057">
      You are a helpful assistant that answers questions
    </text>
    <text x="110" y="277" font-family="Courier, monospace" font-size="9" fill="#495057">
      based SOLELY on the provided context. Be accurate,
    </text>
    <text x="110" y="292" font-family="Courier, monospace" font-size="9" fill="#495057">
      concise, and always cite your sources.
    </text>
  </g>
  
  <!-- 2. Context Injection -->
  <g id="context-injection">
    <rect x="80" y="340" width="520" height="190" rx="10" fill="#fff" stroke="#1c7ed6" stroke-width="3"/>
    <text x="340" y="370" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1c7ed6">
      2️⃣ Context Injection
    </text>
    <text x="100" y="395" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="#868e96">
      Present retrieved documents with clear structure
    </text>
    <rect x="100" y="405" width="480" height="110" rx="5" fill="#f8f9fa" stroke="#1c7ed6" stroke-width="1"/>
    <text x="110" y="422" font-family="Courier, monospace" font-size="9" fill="#495057">
      Context Documents:
    </text>
    <text x="110" y="437" font-family="Courier, monospace" font-size="9" fill="#495057">
      ---
    </text>
    <text x="110" y="452" font-family="Courier, monospace" font-size="9" fill="#495057">
      Document 1 (Source: research.pdf, Date: 2024-01):
    </text>
    <text x="110" y="467" font-family="Courier, monospace" font-size="9" fill="#495057">
      [Content of document 1...]
    </text>
    <text x="110" y="482" font-family="Courier, monospace" font-size="9" fill="#495057">
      
    </text>
    <text x="110" y="497" font-family="Courier, monospace" font-size="9" fill="#495057">
      Document 2 (Source: blog.com, Date: 2024-02):
    </text>
    <text x="110" y="512" font-family="Courier, monospace" font-size="9" fill="#495057">
      [Content of document 2...]
    </text>
  </g>
  
  <!-- 3. Task Instructions -->
  <g id="task-instructions">
    <rect x="80" y="550" width="520" height="150" rx="10" fill="#fff" stroke="#1c7ed6" stroke-width="3"/>
    <text x="340" y="580" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1c7ed6">
      3️⃣ Task Instructions
    </text>
    <text x="100" y="605" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="#868e96">
      Specify what the LLM should do
    </text>
    <rect x="100" y="615" width="480" height="70" rx="5" fill="#f8f9fa" stroke="#1c7ed6" stroke-width="1"/>
    <text x="110" y="632" font-family="Courier, monospace" font-size="9" fill="#495057">
      Instructions:
    </text>
    <text x="110" y="647" font-family="Courier, monospace" font-size="9" fill="#495057">
      - Answer using ONLY information from the context
    </text>
    <text x="110" y="662" font-family="Courier, monospace" font-size="9" fill="#495057">
      - Cite document number for each claim [1][2]
    </text>
    <text x="110" y="677" font-family="Courier, monospace" font-size="9" fill="#495057">
      - If unsure, say "insufficient information"
    </text>
  </g>
  
  <!-- 4. User Query -->
  <g id="user-query">
    <rect x="80" y="720" width="520" height="110" rx="10" fill="#fff" stroke="#1c7ed6" stroke-width="3"/>
    <text x="340" y="750" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1c7ed6">
      4️⃣ User Query
    </text>
    <text x="100" y="775" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="#868e96">
      Present the actual question clearly
    </text>
    <rect x="100" y="785" width="480" height="30" rx="5" fill="#f8f9fa" stroke="#1c7ed6" stroke-width="1"/>
    <text x="110" y="802" font-family="Courier, monospace" font-size="9" fill="#495057">
      Question: [User's query goes here]
    </text>
  </g>
  
  <!-- 5. Output Format -->
  <g id="output-format">
    <rect x="80" y="850" width="520" height="90" rx="10" fill="#fff" stroke="#1c7ed6" stroke-width="3"/>
    <text x="340" y="880" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1c7ed6">
      5️⃣ Output Format (Optional)
    </text>
    <rect x="100" y="895" width="480" height="30" rx="5" fill="#f8f9fa" stroke="#1c7ed6" stroke-width="1"/>
    <text x="110" y="912" font-family="Courier, monospace" font-size="9" fill="#495057">
      Answer: [LLM generates response here]
    </text>
  </g>
  
  <!-- Advanced Techniques -->
  <rect x="650" y="110" width="700" height="850" rx="15" fill="#fff3bf" stroke="#fab005" stroke-width="4"/>
  <text x="1000" y="150" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    🚀 Advanced Techniques
  </text>
  
  <!-- Chain-of-Thought -->
  <g id="cot">
    <rect x="680" y="180" width="640" height="125" rx="10" fill="#fff" stroke="#fab005" stroke-width="2"/>
    <text x="1000" y="210" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fab005">
      Chain-of-Thought Prompting
    </text>
    <text x="700" y="235" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      Encourage step-by-step reasoning before answering:
    </text>
    <rect x="700" y="245" width="600" height="48" rx="5" fill="#f8f9fa" stroke="#fab005" stroke-width="1"/>
    <text x="710" y="262" font-family="Courier, monospace" font-size="9" fill="#495057">
      Think step-by-step:
    </text>
    <text x="710" y="277" font-family="Courier, monospace" font-size="9" fill="#495057">
      1. Identify relevant information  2. Analyze relationships
    </text>
  </g>
  
  <!-- Few-Shot Examples -->
  <g id="few-shot">
    <rect x="680" y="320" width="640" height="155" rx="10" fill="#fff" stroke="#fab005" stroke-width="2"/>
    <text x="1000" y="350" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fab005">
      Few-Shot Examples
    </text>
    <text x="700" y="375" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      Provide examples of desired responses:
    </text>
    <rect x="700" y="385" width="600" height="78" rx="5" fill="#f8f9fa" stroke="#fab005" stroke-width="1"/>
    <text x="710" y="402" font-family="Courier, monospace" font-size="9" fill="#495057">
      Example Query: What is RAG?
    </text>
    <text x="710" y="417" font-family="Courier, monospace" font-size="9" fill="#495057">
      Example Answer: Based on the provided context, RAG
    </text>
    <text x="710" y="432" font-family="Courier, monospace" font-size="9" fill="#495057">
      (Retrieval-Augmented Generation) combines retrieval
    </text>
    <text x="710" y="447" font-family="Courier, monospace" font-size="9" fill="#495057">
      and generation... [cite: doc1, doc2]
    </text>
  </g>
  
  <!-- Constrained Generation -->
  <g id="constrained">
    <rect x="680" y="490" width="640" height="155" rx="10" fill="#fff" stroke="#fab005" stroke-width="2"/>
    <text x="1000" y="520" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fab005">
      Constrained Generation
    </text>
    <text x="700" y="545" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      Limit the LLM's behavior for grounding and accuracy:
    </text>
    <rect x="700" y="555" width="600" height="78" rx="5" fill="#f8f9fa" stroke="#fab005" stroke-width="1"/>
    <text x="710" y="572" font-family="Courier, monospace" font-size="9" fill="#495057">
      - Grounding: "Answer ONLY using provided context"
    </text>
    <text x="710" y="587" font-family="Courier, monospace" font-size="9" fill="#495057">
      - Attribution: "Cite document number for each claim"
    </text>
    <text x="710" y="602" font-family="Courier, monospace" font-size="9" fill="#495057">
      - Uncertainty: "If unsure, say 'I don't have enough
    </text>
    <text x="710" y="617" font-family="Courier, monospace" font-size="9" fill="#495057">
      information'"
    </text>
  </g>
  
  <!-- Output Formatting -->
  <g id="output-format-spec">
    <rect x="680" y="660" width="640" height="175" rx="10" fill="#fff" stroke="#fab005" stroke-width="2"/>
    <text x="1000" y="690" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fab005">
      Structured Output Format
    </text>
    <text x="700" y="715" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      Specify exact structure for the response:
    </text>
    <rect x="700" y="725" width="600" height="98" rx="5" fill="#f8f9fa" stroke="#fab005" stroke-width="1"/>
    <text x="710" y="742" font-family="Courier, monospace" font-size="9" fill="#495057">
      Provide your answer in the following format:
    </text>
    <text x="710" y="757" font-family="Courier, monospace" font-size="9" fill="#495057">
      - Summary: [1-2 sentences]
    </text>
    <text x="710" y="772" font-family="Courier, monospace" font-size="9" fill="#495057">
      - Detailed Answer: [comprehensive response]
    </text>
    <text x="710" y="787" font-family="Courier, monospace" font-size="9" fill="#495057">
      - Key Points: [bullet list]
    </text>
    <text x="710" y="802" font-family="Courier, monospace" font-size="9" fill="#495057">
      - Sources: [list cited documents]
    </text>
  </g>
  
  <!-- Best Practices -->
  <g id="best-practices">
    <rect x="680" y="850" width="640" height="110" rx="10" fill="#d3f9d8" stroke="#37b24d" stroke-width="3"/>
    <text x="1000" y="880" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#37b24d">
      💡 Prompt Engineering Best Practices
    </text>
    <text x="700" y="905" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      ✓ Be explicit and specific • ✓ Use delimiters to separate sections • ✓ Provide structure
    </text>
    <text x="700" y="923" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      ✓ Include examples when possible • ✓ Test iteratively • ✓ Set clear expectations
    </text>
    <text x="700" y="941" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      ✓ Define behavior for edge cases • ✓ Use consistent formatting • ✓ Optimize for clarity
    </text>
  </g>
  
  <!-- Output Arrow -->
  <path d="M 340 960 L 340 1010" stroke="#1c7ed6" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Result -->
  <rect x="180" y="1010" width="320" height="30" rx="8" fill="#d3f9d8" stroke="#37b24d" stroke-width="3"/>
  <text x="340" y="1032" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#37b24d">
    ✅ Well-Engineered Prompt → Quality Response
  </text>
  
  <!-- Key Insight -->
  <rect x="550" y="1000" width="800" height="40" rx="10" fill="#e9d5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="950" y="1025" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#9333ea">
    🎯 Key Insight: The quality of your prompt directly determines the quality of your response
  </text>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#1c7ed6"/>
    </marker>
  </defs>
</svg>