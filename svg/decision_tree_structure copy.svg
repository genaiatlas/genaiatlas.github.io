<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .node-text { font-family: 'Arial', sans-serif; font-size: 11px; text-anchor: middle; }
      .feature-text { font-family: 'Arial', sans-serif; font-size: 10px; text-anchor: middle; font-weight: bold; }
      .title-text { font-family: 'Arial', sans-serif; font-size: 16px; text-anchor: middle; font-weight: bold; }
      .edge-label { font-family: 'Arial', sans-serif; font-size: 9px; text-anchor: middle; }
      .death-node { fill: #ff8c69; stroke: #ff6347; stroke-width: 2; }
      .survival-node { fill: #87ceeb; stroke: #4682b4; stroke-width: 2; }
      .mixed-node { fill: #f0e68c; stroke: #daa520; stroke-width: 2; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="#fafafa"/>
  
  <!-- Title -->
  <text x="400" y="25" class="title-text">Titanic Survival Decision Tree Structure</text>
  
  <!-- Root Node (Sex) -->
  <rect x="350" y="50" width="100" height="50" class="mixed-node" rx="5"/>
  <text x="400" y="70" class="feature-text">Sex</text>
  <text x="400" y="85" class="node-text">samples = 891</text>
  <text x="400" y="95" class="node-text">entropy = 0.507</text>
  
  <!-- Level 1 - Male Branch -->
  <rect x="200" y="130" width="90" height="45" class="death-node" rx="5"/>
  <text x="245" y="148" class="feature-text">Age</text>
  <text x="245" y="160" class="node-text">samples = 577</text>
  <text x="245" y="170" class="node-text">deaths = 468</text>
  
  <!-- Level 1 - Female Branch -->
  <rect x="510" y="130" width="90" height="45" class="survival-node" rx="5"/>
  <text x="555" y="148" class="feature-text">Pclass</text>
  <text x="555" y="160" class="node-text">samples = 314</text>
  <text x="555" y="170" class="node-text">survived = 233</text>
  
  <!-- Level 2 - Male Age branches -->
  <rect x="120" y="210" width="80" height="40" class="death-node" rx="5"/>
  <text x="160" y="228" class="feature-text">Pclass</text>
  <text x="160" y="240" class="node-text">samples = 165</text>
  
  <rect x="280" y="210" width="80" height="40" class="mixed-node" rx="5"/>
  <text x="320" y="228" class="feature-text">FamilySize</text>
  <text x="320" y="240" class="node-text">samples = 412</text>
  
  <!-- Level 2 - Female Pclass branches -->
  <rect x="450" y="210" width="80" height="40" class="survival-node" rx="5"/>
  <text x="490" y="228" class="feature-text">Age</text>
  <text x="490" y="240" class="node-text">samples = 216</text>
  
  <rect x="610" y="210" width="80" height="40" class="mixed-node" rx="5"/>
  <text x="650" y="228" class="feature-text">Embarked</text>
  <text x="650" y="240" class="node-text">samples = 98</text>
  
  <!-- Level 3 - Leaf examples -->
  <rect x="80" y="290" width="70" height="35" class="death-node" rx="5"/>
  <text x="115" y="305" class="node-text">Class 3</text>
  <text x="115" y="318" class="node-text">Death: 89%</text>
  
  <rect x="170" y="290" width="70" height="35" class="survival-node" rx="5"/>
  <text x="205" y="305" class="node-text">Class 1</text>
  <text x="205" y="318" class="node-text">Survival: 63%</text>
  
  <rect x="260" y="290" width="70" height="35" class="death-node" rx="5"/>
  <text x="295" y="305" class="node-text">Large Fam</text>
  <text x="295" y="318" class="node-text">Death: 84%</text>
  
  <rect x="350" y="290" width="70" height="35" class="mixed-node" rx="5"/>
  <text x="385" y="305" class="node-text">Small Fam</text>
  <text x="385" y="318" class="node-text">Mixed</text>
  
  <rect x="430" y="290" width="70" height="35" class="survival-node" rx="5"/>
  <text x="465" y="305" class="node-text">Young</text>
  <text x="465" y="318" class="node-text">Survival: 91%</text>
  
  <rect x="520" y="290" width="70" height="35" class="survival-node" rx="5"/>
  <text x="555" y="305" class="node-text">Adult</text>
  <text x="555" y="318" class="node-text">Survival: 85%</text>
  
  <rect x="610" y="290" width="70" height="35" class="mixed-node" rx="5"/>
  <text x="645" y="305" class="node-text">Southampton</text>
  <text x="645" y="318" class="node-text">Mixed</text>
  
  <rect x="700" y="290" width="70" height="35" class="survival-node" rx="5"/>
  <text x="735" y="305" class="node-text">Other Ports</text>
  <text x="735" y="318" class="node-text">Survival: 78%</text>
  
  <!-- Connections -->
  <!-- Root to Level 1 -->
  <line x1="400" y1="100" x2="245" y2="130" stroke="#333" stroke-width="2"/>
  <line x1="400" y1="100" x2="555" y2="130" stroke="#333" stroke-width="2"/>
  
  <!-- Level 1 to Level 2 -->
  <line x1="245" y1="175" x2="160" y2="210" stroke="#333" stroke-width="2"/>
  <line x1="245" y1="175" x2="320" y2="210" stroke="#333" stroke-width="2"/>
  <line x1="555" y1="175" x2="490" y2="210" stroke="#333" stroke-width="2"/>
  <line x1="555" y1="175" x2="650" y2="210" stroke="#333" stroke-width="2"/>
  
  <!-- Level 2 to Level 3 -->
  <line x1="160" y1="250" x2="115" y2="290" stroke="#333" stroke-width="1.5"/>
  <line x1="160" y1="250" x2="205" y2="290" stroke="#333" stroke-width="1.5"/>
  <line x1="320" y1="250" x2="295" y2="290" stroke="#333" stroke-width="1.5"/>
  <line x1="320" y1="250" x2="385" y2="290" stroke="#333" stroke-width="1.5"/>
  <line x1="490" y1="250" x2="465" y2="290" stroke="#333" stroke-width="1.5"/>
  <line x1="490" y1="250" x2="555" y2="290" stroke="#333" stroke-width="1.5"/>
  <line x1="650" y1="250" x2="645" y2="290" stroke="#333" stroke-width="1.5"/>
  <line x1="650" y1="250" x2="735" y2="290" stroke="#333" stroke-width="1.5"/>
  
  <!-- Edge Labels -->
  <text x="320" y="125" class="edge-label">Male</text>
  <text x="480" y="125" class="edge-label">Female</text>
  <text x="200" y="210" class="edge-label">< 25</text>
  <text x="285" y="210" class="edge-label">≥ 25</text>
  <text x="470" y="210" class="edge-label">Class 1,2</text>
  <text x="600" y="210" class="edge-label">Class 3</text>
  
  <!-- Legend -->
  <g transform="translate(50, 380)">
    <text x="0" y="0" class="feature-text">Legend:</text>
    <rect x="0" y="10" width="20" height="15" class="death-node"/>
    <text x="25" y="22" class="node-text">Higher Death Rate</text>
    <rect x="150" y="10" width="20" height="15" class="survival-node"/>
    <text x="175" y="22" class="node-text">Higher Survival Rate</text>
    <rect x="300" y="10" width="20" height="15" class="mixed-node"/>
    <text x="325" y="22" class="node-text">Mixed Outcomes</text>
  </g>
  
  <!-- Key Insight -->
  <g transform="translate(450, 380)">
    <rect x="0" y="0" width="300" height="80" fill="white" stroke="#ccc" stroke-width="1" rx="5"/>
    <text x="150" y="15" class="feature-text">Key Insight</text>
    <text x="10" y="35" class="node-text">• Gender is the primary discriminating factor</text>
    <text x="10" y="50" class="node-text">• Female passengers had significantly higher survival rates</text>
    <text x="10" y="65" class="node-text">• Age and class provide secondary discrimination</text>
  </g>
</svg>