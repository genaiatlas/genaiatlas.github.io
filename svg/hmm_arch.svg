<svg viewBox="0 0 800 650" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#2c3e50">
    Hidden Markov Model Architecture
  </text>
  
  <!-- Define arrow markers -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth" fill="#3498db">
      <path d="M0,0 L0,6 L9,3 z"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth" fill="#e74c3c">
      <path d="M0,0 L0,6 L9,3 z"/>
    </marker>
    <!-- Gradient for hidden layer -->
    <linearGradient id="hiddenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:0.9"/>
    </linearGradient>
    <!-- Gradient for observable layer -->
    <linearGradient id="obsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#27ae60;stop-opacity:0.9"/>
    </linearGradient>
  </defs>
  
  <!-- Hidden States Layer -->
  <text x="70" y="150" font-size="16" font-weight="bold" fill="#34495e">Hidden States</text>
  <text x="70" y="170" font-size="12" fill="#7f8c8d">(Markov Chain)</text>
  
  <!-- Hidden state nodes -->
  <g id="hidden-states">
    <!-- X1 -->
    <circle cx="200" cy="150" r="35" fill="url(#hiddenGrad)"/>
    <text x="200" y="155" text-anchor="middle" font-size="18" fill="white" font-weight="bold">X₁</text>
    
    <!-- X2 -->
    <circle cx="350" cy="150" r="35" fill="url(#hiddenGrad)"/>
    <text x="350" y="155" text-anchor="middle" font-size="18" fill="white" font-weight="bold">X₂</text>
    
    <!-- X3 -->
    <circle cx="500" cy="150" r="35" fill="url(#hiddenGrad)"/>
    <text x="500" y="155" text-anchor="middle" font-size="18" fill="white" font-weight="bold">X₃</text>
    
    <!-- Xt -->
    <circle cx="650" cy="150" r="35" fill="url(#hiddenGrad)"/>
    <text x="650" y="155" text-anchor="middle" font-size="18" fill="white" font-weight="bold">Xₜ</text>
    
    <!-- Dots indicating continuation -->
    <text x="575" y="155" text-anchor="middle" font-size="24" fill="#34495e">...</text>
  </g>
  
  <!-- Transition arrows between hidden states -->
  <g id="transitions">
    <path d="M 235 150 L 315 150" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="275" y="140" text-anchor="middle" font-size="12" fill="#34495e">a₁₂</text>
    
    <path d="M 385 150 L 465 150" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="425" y="140" text-anchor="middle" font-size="12" fill="#34495e">a₂₃</text>
    
    <!-- Self loops -->
    <ellipse cx="200" cy="100" rx="30" ry="20" stroke="#34495e" stroke-width="2" fill="none" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
    <text x="200" y="80" text-anchor="middle" font-size="11" fill="#34495e">a₁₁</text>
    
    <ellipse cx="350" cy="100" rx="30" ry="20" stroke="#34495e" stroke-width="2" fill="none" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
    <text x="350" y="80" text-anchor="middle" font-size="11" fill="#34495e">a₂₂</text>
  </g>
  
  <!-- Observable States Layer -->
  <text x="70" y="350" font-size="16" font-weight="bold" fill="#34495e">Observable</text>
  <text x="70" y="370" font-size="12" fill="#7f8c8d">(Emissions)</text>
  
  <!-- Observable state nodes -->
  <g id="observable-states">
    <!-- O1 -->
    <rect x="165" y="320" width="70" height="50" rx="10" fill="url(#obsGrad)"/>
    <text x="200" y="350" text-anchor="middle" font-size="18" fill="white" font-weight="bold">O₁</text>
    
    <!-- O2 -->
    <rect x="315" y="320" width="70" height="50" rx="10" fill="url(#obsGrad)"/>
    <text x="350" y="350" text-anchor="middle" font-size="18" fill="white" font-weight="bold">O₂</text>
    
    <!-- O3 -->
    <rect x="465" y="320" width="70" height="50" rx="10" fill="url(#obsGrad)"/>
    <text x="500" y="350" text-anchor="middle" font-size="18" fill="white" font-weight="bold">O₃</text>
    
    <!-- Ot -->
    <rect x="615" y="320" width="70" height="50" rx="10" fill="url(#obsGrad)"/>
    <text x="650" y="350" text-anchor="middle" font-size="18" fill="white" font-weight="bold">Oₜ</text>
  </g>
  
  <!-- Emission arrows -->
  <g id="emissions">
    <path d="M 200 185 L 200 315" stroke="#e74c3c" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow-red)"/>
    <text x="220" y="250" font-size="12" fill="#e74c3c">b₁(o₁)</text>
    
    <path d="M 350 185 L 350 315" stroke="#e74c3c" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow-red)"/>
    <text x="370" y="250" font-size="12" fill="#e74c3c">b₂(o₂)</text>
    
    <path d="M 500 185 L 500 315" stroke="#e74c3c" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow-red)"/>
    <text x="520" y="250" font-size="12" fill="#e74c3c">b₃(o₃)</text>
    
    <path d="M 650 185 L 650 315" stroke="#e74c3c" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow-red)"/>
    <text x="670" y="250" font-size="12" fill="#e74c3c">bₜ(oₜ)</text>
  </g>
  
  <!-- Model Parameters Box -->
  <g transform="translate(50, 430)">
    <rect x="0" y="0" width="700" height="120" fill="#f8f9fa" stroke="#34495e" stroke-width="1" rx="5"/>
    
    <text x="10" y="25" font-size="16" font-weight="bold" fill="#2c3e50">HMM Parameters λ = (A, B, π)</text>
    
    <!-- Transition Matrix A -->
    <text x="20" y="50" font-size="14" fill="#34495e">
      <tspan font-weight="bold">A (Transition Matrix):</tspan> P(Xₜ₊₁ = j | Xₜ = i) = aᵢⱼ
    </text>
    
    <!-- Emission Matrix B -->
    <text x="20" y="75" font-size="14" fill="#34495e">
      <tspan font-weight="bold">B (Emission Matrix):</tspan> P(Oₜ = k | Xₜ = j) = bⱼ(k)
    </text>
    
    <!-- Initial Distribution -->
    <text x="20" y="100" font-size="14" fill="#34495e">
      <tspan font-weight="bold">π (Initial Distribution):</tspan> P(X₁ = i) = πᵢ
    </text>
    
    <!-- Separation line -->
    <line x1="360" y1="35" x2="360" y2="110" stroke="#34495e" stroke-width="1" stroke-dasharray="3,3"/>
    
    <!-- Key Properties -->
    <text x="380" y="50" font-size="13" fill="#34495e">
      <tspan font-weight="bold">Markov Property:</tspan> Hidden states form Markov chain
    </text>
    
    <text x="380" y="75" font-size="13" fill="#34495e">
      <tspan font-weight="bold">Output Independence:</tspan> Oₜ depends only on Xₜ
    </text>
    
    <text x="380" y="100" font-size="13" fill="#34495e">
      <tspan font-weight="bold">Hidden Nature:</tspan> States X are not directly observable
    </text>
  </g>
  
  <!-- Example Application -->
  <g transform="translate(50, 570)">
    <rect x="0" y="0" width="700" height="50" fill="#e8f4fd" stroke="#3498db" stroke-width="1" rx="5"/>
    <text x="10" y="20" font-size="13" font-weight="bold" fill="#2c3e50">Portfolio Example:</text>
    <text x="10" y="40" font-size="12" fill="#34495e">
      Hidden States = {Bull Market, Bear Market, Stable} | Observable = {Portfolio Returns, Volume, Volatility}
    </text>
  </g>
</svg>