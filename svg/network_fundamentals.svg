<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 28px; font-weight: bold; fill: #2c3e50; }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: 600; fill: #34495e; }
      .label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #2c3e50; }
      .small-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #555; }
      .node { fill: #3498db; stroke: #2c3e50; stroke-width: 2; }
      .edge { stroke: #95a5a6; stroke-width: 2; fill: none; }
      .highlight-node { fill: #e74c3c; stroke: #c0392b; stroke-width: 2; }
      .box { fill: #ecf0f1; stroke: #34495e; stroke-width: 2; rx: 10; }
      .formula-box { fill: #fff; stroke: #3498db; stroke-width: 2; rx: 5; }
    </style>
  </defs>
  
  <!-- Title -->
  <text x="600" y="40" class="title" text-anchor="middle">Network Fundamentals: Basic Concepts</text>
  
  <!-- Left Section: Simple Network Example -->
  <rect x="50" y="80" width="500" height="280" class="box"/>
  <text x="300" y="110" class="subtitle" text-anchor="middle">Basic Network Structure</text>
  
  <!-- Nodes -->
  <circle cx="150" cy="180" r="20" class="node"/>
  <text x="150" y="185" class="label" text-anchor="middle" fill="white">A</text>
  
  <circle cx="280" cy="150" r="20" class="node"/>
  <text x="280" y="155" class="label" text-anchor="middle" fill="white">B</text>
  
  <circle cx="400" cy="180" r="20" class="node"/>
  <text x="400" y="185" class="label" text-anchor="middle" fill="white">C</text>
  
  <circle cx="220" cy="280" r="20" class="node"/>
  <text x="220" y="285" class="label" text-anchor="middle" fill="white">D</text>
  
  <circle cx="350" cy="300" r="20" class="node"/>
  <text x="350" y="305" class="label" text-anchor="middle" fill="white">E</text>
  
  <!-- Edges -->
  <line x1="170" y1="180" x2="260" y2="150" class="edge"/>
  <line x1="300" y1="150" x2="380" y2="180" class="edge"/>
  <line x1="150" y1="200" x2="220" y2="260" class="edge"/>
  <line x1="240" y1="280" x2="330" y2="300" class="edge"/>
  <line x1="280" y1="170" x2="220" y2="260" class="edge"/>
  <line x1="400" y1="200" x2="350" y2="280" class="edge"/>
  
  <!-- Labels -->
  <text x="300" y="340" class="small-label" text-anchor="middle">Circles = Nodes (Vertices)</text>
  <text x="300" y="355" class="small-label" text-anchor="middle">Lines = Edges (Connections)</text>
  
  <!-- Right Section: Components -->
  <rect x="600" y="80" width="550" height="280" class="box"/>
  <text x="875" y="110" class="subtitle" text-anchor="middle">Network Components</text>
  
  <!-- Component 1: Node -->
  <circle cx="700" cy="160" r="25" class="highlight-node"/>
  <text x="700" y="165" class="label" text-anchor="middle" fill="white">N</text>
  <text x="770" y="165" class="label" text-anchor="start">Node (Vertex)</text>
  <text x="770" y="182" class="small-label" text-anchor="start">• Individual entity</text>
  <text x="770" y="197" class="small-label" text-anchor="start">• Can represent person, page, gene</text>
  
  <!-- Component 2: Edge -->
  <circle cx="650" cy="250" r="15" class="node"/>
  <circle cx="750" cy="250" r="15" class="node"/>
  <line x1="665" y1="250" x2="735" y2="250" class="edge" stroke-width="3" stroke="#e74c3c"/>
  <text x="770" y="255" class="label" text-anchor="start">Edge (Link)</text>
  <text x="770" y="272" class="small-label" text-anchor="start">• Connection between nodes</text>
  <text x="770" y="287" class="small-label" text-anchor="start">• Represents relationship</text>
  
  <!-- Component 3: Degree -->
  <circle cx="700" cy="330" r="20" class="node"/>
  <line x1="680" y1="320" x2="650" y2="305" class="edge" stroke-width="2"/>
  <line x1="700" y1="310" x2="700" y2="280" class="edge" stroke-width="2"/>
  <line x1="720" y1="320" x2="750" y2="305" class="edge" stroke-width="2"/>
  <text x="770" y="335" class="label" text-anchor="start">Degree = 3</text>
  <text x="770" y="352" class="small-label" text-anchor="start">• Number of connections</text>
  
  <!-- Bottom Section: Mathematical Representation -->
  <rect x="50" y="400" width="1100" height="260" class="box"/>
  <text x="600" y="430" class="subtitle" text-anchor="middle">Mathematical Representation</text>
  
  <!-- Graph Formula -->
  <rect x="100" y="460" width="480" height="120" class="formula-box"/>
  <text x="340" y="490" class="label" text-anchor="middle" font-weight="bold" font-size="20">G = (V, E)</text>
  <text x="340" y="520" class="small-label" text-anchor="middle">Where:</text>
  <text x="340" y="540" class="small-label" text-anchor="middle">G = Graph (Network)</text>
  <text x="340" y="555" class="small-label" text-anchor="middle">V = {v₁, v₂, v₃, ..., vₙ} Set of vertices (nodes)</text>
  <text x="340" y="570" class="small-label" text-anchor="middle">E = {e₁, e₂, e₃, ..., eₘ} Set of edges (connections)</text>
  
  <!-- Example -->
  <rect x="620" y="460" width="500" height="180" class="formula-box"/>
  <text x="870" y="490" class="label" text-anchor="middle" font-weight="bold">Example Network</text>
  
  <text x="870" y="520" class="small-label" text-anchor="middle">V = {A, B, C, D, E}</text>
  <text x="870" y="540" class="small-label" text-anchor="middle">E = {(A,B), (B,C), (A,D), (D,E), (B,D), (C,E)}</text>
  
  <text x="870" y="570" class="small-label" text-anchor="middle" font-weight="bold">Number of nodes: |V| = 5</text>
  <text x="870" y="590" class="small-label" text-anchor="middle" font-weight="bold">Number of edges: |E| = 6</text>
  
  <text x="870" y="620" class="small-label" text-anchor="middle" fill="#e74c3c">Key: Connections create value and complexity</text>
</svg>