<svg viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="800" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="500" y="35" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Network Classification: Types and Structures
  </text>
  
  <!-- Directed vs Undirected -->
  <g id="directed-undirected">
    <!-- Undirected Network -->
    <g id="undirected">
      <text x="160" y="85" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">
        Undirected Network
      </text>
      <text x="160" y="105" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d">
        (Facebook, Internet)
      </text>
      
      <circle cx="120" cy="145" r="20" fill="#3498db" stroke="#2c3e50" stroke-width="2"/>
      <circle cx="200" cy="145" r="20" fill="#3498db" stroke="#2c3e50" stroke-width="2"/>
      <circle cx="160" cy="210" r="20" fill="#3498db" stroke="#2c3e50" stroke-width="2"/>
      
      <line x1="140" y1="145" x2="180" y2="145" stroke="#34495e" stroke-width="3"/>
      <line x1="135" y1="160" x2="148" y2="195" stroke="#34495e" stroke-width="3"/>
      <line x1="185" y1="160" x2="172" y2="195" stroke="#34495e" stroke-width="3"/>
    </g>
    
    <!-- Directed Network -->
    <g id="directed">
      <text x="400" y="85" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">
        Directed Network
      </text>
      <text x="400" y="105" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d">
        (Twitter, Web, Citations)
      </text>
      
      <circle cx="360" cy="145" r="20" fill="#e74c3c" stroke="#2c3e50" stroke-width="2"/>
      <circle cx="440" cy="145" r="20" fill="#e74c3c" stroke="#2c3e50" stroke-width="2"/>
      <circle cx="400" cy="210" r="20" fill="#e74c3c" stroke="#2c3e50" stroke-width="2"/>
      
      <!-- Arrows -->
      <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
          <polygon points="0 0, 10 3, 0 6" fill="#34495e"/>
        </marker>
      </defs>
      
      <line x1="380" y1="145" x2="415" y2="145" stroke="#34495e" stroke-width="3" marker-end="url(#arrowhead)"/>
      <line x1="375" y1="160" x2="388" y2="193" stroke="#34495e" stroke-width="3" marker-end="url(#arrowhead)"/>
      <line x1="425" y1="160" x2="412" y2="193" stroke="#34495e" stroke-width="3" marker-end="url(#arrowhead)"/>
    </g>
  </g>
  
  <!-- Simple Network -->
  <g id="simple-network">
    <text x="160" y="280" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Simple Network
    </text>
    <text x="160" y="300" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d">
      (No self-loops, no multiple edges)
    </text>
    
    <circle cx="100" cy="350" r="18" fill="#16a085" stroke="#2c3e50" stroke-width="2"/>
    <circle cx="180" cy="340" r="18" fill="#16a085" stroke="#2c3e50" stroke-width="2"/>
    <circle cx="220" cy="380" r="18" fill="#16a085" stroke="#2c3e50" stroke-width="2"/>
    <circle cx="140" cy="400" r="18" fill="#16a085" stroke="#2c3e50" stroke-width="2"/>
    
    <line x1="117" y1="348" x2="163" y2="342" stroke="#34495e" stroke-width="2"/>
    <line x1="195" y1="353" x2="208" y2="367" stroke="#34495e" stroke-width="2"/>
    <line x1="155" y1="397" x2="203" y2="387" stroke="#34495e" stroke-width="2"/>
    <line x1="112" y1="365" x2="128" y2="387" stroke="#34495e" stroke-width="2"/>
  </g>
  
  <!-- Tree -->
  <g id="tree">
    <text x="400" y="280" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Tree (No Cycles)
    </text>
    <text x="400" y="300" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d">
      (Phylogenetic trees, Hierarchies)
    </text>
    
    <!-- Root -->
    <circle cx="400" cy="330" r="18" fill="#f39c12" stroke="#2c3e50" stroke-width="2"/>
    
    <!-- Level 2 -->
    <circle cx="350" cy="380" r="15" fill="#f39c12" stroke="#2c3e50" stroke-width="2"/>
    <circle cx="450" cy="380" r="15" fill="#f39c12" stroke="#2c3e50" stroke-width="2"/>
    
    <!-- Level 3 -->
    <circle cx="330" cy="420" r="12" fill="#f39c12" stroke="#2c3e50" stroke-width="2"/>
    <circle cx="370" cy="420" r="12" fill="#f39c12" stroke="#2c3e50" stroke-width="2"/>
    <circle cx="470" cy="420" r="12" fill="#f39c12" stroke="#2c3e50" stroke-width="2"/>
    
    <!-- Tree edges -->
    <line x1="392" y1="345" x2="357" y2="370" stroke="#34495e" stroke-width="2"/>
    <line x1="408" y1="345" x2="443" y2="370" stroke="#34495e" stroke-width="2"/>
    <line x1="342" y1="393" x2="335" y2="410" stroke="#34495e" stroke-width="2"/>
    <line x1="358" y1="393" x2="365" y2="410" stroke="#34495e" stroke-width="2"/>
    <line x1="457" y1="393" x2="468" y2="410" stroke="#34495e" stroke-width="2"/>
  </g>
  
  <!-- DAG -->
  <g id="dag">
    <text x="730" y="85" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Directed Acyclic Graph (DAG)
    </text>
    <text x="730" y="105" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d">
      (Food webs, Citations)
    </text>
    
    <!-- Top node -->
    <circle cx="730" cy="140" r="18" fill="#c0392b" stroke="#2c3e50" stroke-width="2"/>
    <text x="730" y="145" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">🦁</text>
    
    <!-- Middle nodes -->
    <circle cx="680" cy="195" r="16" fill="#c0392b" stroke="#2c3e50" stroke-width="2"/>
    <text x="680" y="199" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">🦓</text>
    
    <circle cx="780" cy="195" r="16" fill="#c0392b" stroke="#2c3e50" stroke-width="2"/>
    <text x="780" y="199" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">🦌</text>
    
    <!-- Bottom node -->
    <circle cx="730" cy="245" r="16" fill="#27ae60" stroke="#2c3e50" stroke-width="2"/>
    <text x="730" y="249" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">🌿</text>
    
    <!-- Directed edges (predation) -->
    <line x1="720" y1="155" x2="690" y2="182" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="740" y1="155" x2="770" y2="182" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="690" y1="210" x2="722" y2="233" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="770" y1="210" x2="738" y2="233" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- Bipartite Graph -->
  <g id="bipartite">
    <text x="730" y="310" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Bipartite Graph
    </text>
    <text x="730" y="330" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d">
      (Users ↔ Movies, Recommendation Systems)
    </text>
    
    <!-- Left partition (Users) -->
    <text x="650" y="360" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#8e44ad">
      Users
    </text>
    
    <circle cx="650" cy="385" r="15" fill="#9b59b6" stroke="#2c3e50" stroke-width="2"/>
    <text x="650" y="389" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">👤</text>
    
    <circle cx="650" cy="425" r="15" fill="#9b59b6" stroke="#2c3e50" stroke-width="2"/>
    <text x="650" y="429" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">👤</text>
    
    <circle cx="650" cy="465" r="15" fill="#9b59b6" stroke="#2c3e50" stroke-width="2"/>
    <text x="650" y="469" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">👤</text>
    
    <!-- Right partition (Movies) -->
    <text x="810" y="360" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#d35400">
      Movies
    </text>
    
    <circle cx="810" cy="385" r="15" fill="#e67e22" stroke="#2c3e50" stroke-width="2"/>
    <text x="810" y="389" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">🎬</text>
    
    <circle cx="810" cy="425" r="15" fill="#e67e22" stroke="#2c3e50" stroke-width="2"/>
    <text x="810" y="429" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">🎬</text>
    
    <circle cx="810" cy="465" r="15" fill="#e67e22" stroke="#2c3e50" stroke-width="2"/>
    <text x="810" y="469" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">🎬</text>
    
    <!-- Edges between partitions -->
    <line x1="665" y1="385" x2="795" y2="385" stroke="#34495e" stroke-width="2"/>
    <line x1="665" y1="385" x2="795" y2="425" stroke="#34495e" stroke-width="2"/>
    <line x1="665" y1="425" x2="795" y2="425" stroke="#34495e" stroke-width="2"/>
    <line x1="665" y1="425" x2="795" y2="465" stroke="#34495e" stroke-width="2"/>
    <line x1="665" y1="465" x2="795" y2="385" stroke="#34495e" stroke-width="2"/>
  </g>
  
  <!-- Comparison Table -->
  <g id="comparison-table">
    <rect x="50" y="520" width="900" height="260" fill="white" stroke="#34495e" stroke-width="2" rx="10"/>
    
    <text x="500" y="555" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Network Type Comparison
    </text>
    
    <!-- Table Headers -->
    <text x="150" y="590" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#34495e">Network Type</text>
    <text x="350" y="590" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#34495e">Directed?</text>
    <text x="500" y="590" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#34495e">Cycles?</text>
    <text x="700" y="590" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#34495e">Example</text>
    
    <!-- Row 1 -->
    <text x="150" y="620" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#34495e">World Wide Web</text>
    <text x="350" y="620" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#27ae60">✓ Yes</text>
    <text x="500" y="620" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#27ae60">✓ Yes</text>
    <text x="700" y="620" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d">Pages + Hyperlinks</text>
    
    <!-- Row 2 -->
    <text x="150" y="645" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#34495e">Facebook</text>
    <text x="350" y="645" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#e74c3c">✗ No</text>
    <text x="500" y="645" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#27ae60">✓ Yes</text>
    <text x="700" y="645" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d">Users + Friendships</text>
    
    <!-- Row 3 -->
    <text x="150" y="670" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#34495e">Twitter</text>
    <text x="350" y="670" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#27ae60">✓ Yes</text>
    <text x="500" y="670" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#27ae60">✓ Yes</text>
    <text x="700" y="670" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d">Users + Follows</text>
    
    <!-- Row 4 -->
    <text x="150" y="695" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#34495e">Food Web</text>
    <text x="350" y="695" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#27ae60">✓ Yes</text>
    <text x="500" y="695" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#e74c3c">✗ DAG</text>
    <text x="700" y="695" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d">Species + Predation</text>
    
    <!-- Row 5 -->
    <text x="150" y="720" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#34495e">Citation Network</text>
    <text x="350" y="720" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#27ae60">✓ Yes</text>
    <text x="500" y="720" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#e74c3c">✗ DAG</text>
    <text x="700" y="720" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d">Papers + Citations</text>
    
    <!-- Row 6 -->
    <text x="150" y="745" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#34495e">Power Grid</text>
    <text x="350" y="745" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#e74c3c">✗ No</text>
    <text x="500" y="745" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#27ae60">✓ Yes</text>
    <text x="700" y="745" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d">Stations + Lines</text>
    
    <!-- Row 7 -->
    <text x="150" y="770" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#34495e">Recommendation</text>
    <text x="350" y="770" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#e74c3c">✗ No</text>
    <text x="500" y="770" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#e74c3c">✗ Bipartite</text>
    <text x="700" y="770" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d">Users ↔ Items</text>
  </g>
</svg>