<svg width="900" height="700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 24px; font-weight: bold; fill: #2c3e50; }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #34495e; }
      .formula { font-family: 'Times New Roman', serif; font-size: 28px; fill: #e74c3c; font-weight: bold; }
      .text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #34495e; }
      .label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #7f8c8d; }
      .neuron { fill: #3498db; stroke: #2980b9; stroke-width: 2; }
      .neuron-inactive { fill: #ecf0f1; stroke: #bdc3c7; stroke-width: 2; }
      .weight-line { stroke: #e74c3c; stroke-width: 2; }
      .activation-line { stroke: #27ae60; stroke-width: 3; }
      .box { fill: #f8f9fa; stroke: #e9ecef; stroke-width: 2; rx: 8; }
      .highlight-box { fill: #fff3cd; stroke: #ffc107; stroke-width: 2; rx: 8; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="700" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="450" y="35" class="title" text-anchor="middle">He Initialization for ReLU Networks</text>
  
  <!-- Main formula -->
  <rect x="200" y="60" width="500" height="80" class="highlight-box"/>
  <text x="450" y="90" class="subtitle" text-anchor="middle">He Initialization Formula</text>
  <text x="450" y="120" class="formula" text-anchor="middle">Variance = 2 / n_inputs</text>
  
  <!-- Why this formula works -->
  <g transform="translate(50, 170)">
    <text x="400" y="20" class="subtitle" text-anchor="middle">Why This Formula Works for ReLU</text>
    
    <!-- ReLU visualization -->
    <rect x="0" y="40" width="350" height="200" class="box"/>
    <text x="175" y="65" class="subtitle" text-anchor="middle" fill="#e74c3c">ReLU Activation Effect</text>
    
    <!-- Input layer -->
    <g transform="translate(30, 100)">
      <text x="0" y="-10" class="text">Input Layer</text>
      <circle cx="0" cy="10" r="8" class="neuron"/>
      <circle cx="0" cy="35" r="8" class="neuron"/>
      <circle cx="0" cy="60" r="8" class="neuron"/>
      <circle cx="0" cy="85" r="8" class="neuron"/>
      <text x="15" y="50" class="label">n inputs</text>
    </g>
    
    <!-- Weights -->
    <g transform="translate(80, 100)">
      <line x1="-40" y1="10" x2="40" y2="10" class="weight-line"/>
      <line x1="-40" y1="35" x2="40" y2="25" class="weight-line"/>
      <line x1="-40" y1="60" x2="40" y2="40" class="weight-line"/>
      <line x1="-40" y1="85" x2="40" y2="55" class="weight-line"/>
      <text x="0" y="-5" class="text" text-anchor="middle">Weights</text>
      <text x="0" y="75" class="label" text-anchor="middle">w ~ N(0, 2/n)</text>
    </g>
    
    <!-- Hidden layer with ReLU -->
    <g transform="translate(160, 100)">
      <text x="0" y="-10" class="text">Hidden Layer</text>
      <circle cx="0" cy="10" r="8" class="neuron"/>
      <circle cx="0" cy="25" r="8" class="neuron-inactive"/>
      <circle cx="0" cy="40" r="8" class="neuron"/>
      <circle cx="0" cy="55" r="8" class="neuron-inactive"/>
      <text x="15" y="35" class="label">~50% active</text>
      <text x="15" y="50" class="label">~50% zero</text>
    </g>
    
    <!-- Mathematical reasoning -->
    <rect x="400" y="40" width="400" height="200" class="box"/>
    <text x="600" y="65" class="subtitle" text-anchor="middle">Mathematical Reasoning</text>
    
    <text x="420" y="95" class="text" font-weight="bold">Problem:</text>
    <text x="420" y="115" class="text">• ReLU zeros out ~50% of neurons</text>
    <text x="420" y="135" class="text">• Remaining variance is halved</text>
    <text x="420" y="155" class="text">• Need to compensate for this reduction</text>
    
    <text x="420" y="185" class="text" font-weight="bold">Solution:</text>
    <text x="420" y="205" class="text">• Double the initial variance</text>
    <text x="420" y="225" class="text">• 2/n instead of 1/n (Xavier)</text>
  </g>
  
  <!-- Implementation example -->
  <g transform="translate(50, 410)">
    <text x="400" y="20" class="subtitle" text-anchor="middle">Implementation Example</text>
    
    <rect x="0" y="40" width="800" height="180" class="box"/>
    
    <!-- Layer sizes -->
    <text x="20" y="70" class="text" font-weight="bold">Example Network Architecture:</text>
    
    <!-- Layer 1 -->
    <rect x="50" y="90" width="120" height="60" fill="#e3f2fd" stroke="#2196f3" stroke-width="2" rx="5"/>
    <text x="110" y="115" class="text" text-anchor="middle" font-weight="bold">Layer 1</text>
    <text x="110" y="135" class="text" text-anchor="middle">784 → 256</text>
    
    <!-- Layer 2 -->
    <rect x="200" y="90" width="120" height="60" fill="#e8f5e8" stroke="#4caf50" stroke-width="2" rx="5"/>
    <text x="260" y="115" class="text" text-anchor="middle" font-weight="bold">Layer 2</text>
    <text x="260" y="135" class="text" text-anchor="middle">256 → 128</text>
    
    <!-- Layer 3 -->
    <rect x="350" y="90" width="120" height="60" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="5"/>
    <text x="410" y="115" class="text" text-anchor="middle" font-weight="bold">Layer 3</text>
    <text x="410" y="135" class="text" text-anchor="middle">128 → 10</text>
    
    <!-- Formulas -->
    <rect x="500" y="80" width="280" height="80" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2" rx="5"/>
    <text x="640" y="100" class="text" text-anchor="middle" font-weight="bold">He Initialization:</text>
    <text x="520" y="120" class="text">Layer 1: σ² = 2/784 = 0.0026</text>
    <text x="520" y="135" class="text">Layer 2: σ² = 2/256 = 0.0078</text>
    <text x="520" y="150" class="text">Layer 3: σ² = 2/128 = 0.0156</text>
  </g>
  
  <!-- Comparison table -->
  <g transform="translate(50, 630)">
    <text x="400" y="20" class="subtitle" text-anchor="middle">Initialization Methods Comparison</text>
    
    <!-- Table headers -->
    <rect x="0" y="30" width="160" height="30" fill="#34495e"/>
    <rect x="160" y="30" width="160" height="30" fill="#34495e"/>
    <rect x="320" y="30" width="160" height="30" fill="#34495e"/>
    <rect x="480" y="30" width="160" height="30" fill="#34495e"/>
    <rect x="640" y="30" width="160" height="30" fill="#34495e"/>
    
    <text x="80" y="50" class="text" text-anchor="middle" fill="white" font-weight="bold">Method</text>
    <text x="240" y="50" class="text" text-anchor="middle" fill="white" font-weight="bold">Formula</text>
    <text x="400" y="50" class="text" text-anchor="middle" fill="white" font-weight="bold">Best For</text>
    <text x="560" y="50" class="text" text-anchor="middle" fill="white" font-weight="bold">Pros</text>
    <text x="720" y="50" class="text" text-anchor="middle" fill="white" font-weight="bold">Cons</text>
    
    <!-- Table rows -->
    <!-- Xavier row -->
    <rect x="0" y="60" width="160" height="30" fill="#ecf0f1"/>
    <rect x="160" y="60" width="160" height="30" fill="#ecf0f1"/>
    <rect x="320" y="60" width="160" height="30" fill="#ecf0f1"/>
    <rect x="480" y="60" width="160" height="30" fill="#ecf0f1"/>
    <rect x="640" y="60" width="160" height="30" fill="#ecf0f1"/>
    
    <text x="80" y="80" class="label" text-anchor="middle">Xavier</text>
    <text x="240" y="80" class="label" text-anchor="middle">σ² = 1/n_in</text>
    <text x="400" y="80" class="label" text-anchor="middle">Sigmoid/Tanh</text>
    <text x="560" y="80" class="label" text-anchor="middle">Theory-backed</text>
    <text x="720" y="80" class="label" text-anchor="middle">Poor for ReLU</text>
    
    <!-- He row -->
    <rect x="0" y="90" width="160" height="30" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
    <rect x="160" y="90" width="160" height="30" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
    <rect x="320" y="90" width="160" height="30" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
    <rect x="480" y="90" width="160" height="30" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
    <rect x="640" y="90" width="160" height="30" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
    
    <text x="80" y="110" class="text" text-anchor="middle" font-weight="bold">He (MSRA)</text>
    <text x="240" y="110" class="text" text-anchor="middle" font-weight="bold">σ² = 2/n_in</text>
    <text x="400" y="110" class="text" text-anchor="middle" font-weight="bold">ReLU networks</text>
    <text x="560" y="110" class="text" text-anchor="middle" font-weight="bold">Optimal for ReLU</text>
    <text x="720" y="110" class="text" text-anchor="middle" font-weight="bold">ReLU-specific</text>
  </g>
</svg>