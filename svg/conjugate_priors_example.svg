<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="priorBeta" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4285f4;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#4285f4;stop-opacity:0.3"/>
    </linearGradient>
    <linearGradient id="posteriorBeta" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34a853;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#34a853;stop-opacity:0.3"/>
    </linearGradient>
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#fafafa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1a1a1a">
    Conjugate Priors: Beta-Binomial Example
  </text>
  
  <!-- Example Setup -->
  <rect x="50" y="50" width="700" height="50" rx="5" fill="#e3f2fd" stroke="#1976d2" stroke-width="1"/>
  <text x="400" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1a1a1a">
    Prior: Beta(α, β) + Likelihood: Binomial(n, θ) → Posterior: Beta(α + s, β + f)
  </text>
  <text x="400" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">
    where s = successes, f = failures = n - s
  </text>
  
  <!-- Left Panel: Before Data -->
  <rect x="50" y="120" width="340" height="200" rx="8" fill="white" stroke="#dee2e6" stroke-width="2"/>
  <text x="220" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a1a1a">
    Before Data: Prior Beta(2, 5)
  </text>
  
  <!-- Prior distribution curve -->
  <path d="M 80 280 Q 120 200 160 170 Q 200 160 240 180 Q 280 220 320 280 Q 340 300 360 300" 
        fill="url(#priorBeta)" stroke="#4285f4" stroke-width="3"/>
  
  <!-- Prior stats -->
  <text x="220" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">
    Mean = α/(α+β) = 2/7 ≈ 0.29
  </text>
  <text x="220" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">
    Effective sample size = α+β = 7
  </text>
  <text x="220" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">
    θ (success probability)
  </text>
  
  <!-- Right Panel: After Data -->
  <rect x="410" y="120" width="340" height="200" rx="8" fill="white" stroke="#dee2e6" stroke-width="2"/>
  <text x="580" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a1a1a">
    After Data: Posterior Beta(12, 8)
  </text>
  
  <!-- Posterior distribution curve -->
  <path d="M 440 300 Q 480 250 520 200 Q 560 160 600 150 Q 640 160 680 200 Q 720 250 720 300" 
        fill="url(#posteriorBeta)" stroke="#34a853" stroke-width="3"/>
  
  <!-- Posterior stats -->
  <text x="580" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">
    Mean = 12/20 = 0.6
  </text>
  <text x="580" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">
    Effective sample size = 20
  </text>
  <text x="580" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">
    θ (success probability)
  </text>
  
  <!-- Update arrow -->
  <polygon points="400,220 430,215 430,225" fill="#666"/>
  <line x1="400" y1="220" x2="430" y2="220" stroke="#666" stroke-width="3"/>
  <text x="415" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#666">
    Observe: 10 successes, 3 failures
  </text>
  
  <!-- Update Formula -->
  <rect x="150" y="340" width="500" height="80" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="400" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a1a1a">
    Conjugate Update Rule
  </text>
  <text x="400" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#333">
    Prior: Beta(2, 5) → Data: 10 successes, 3 failures
  </text>
  <text x="400" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#333">
    Posterior: Beta(2+10, 5+3) = Beta(12, 8)
  </text>
  
  <!-- Common Conjugate Pairs Table -->
  <rect x="50" y="440" width="700" height="140" rx="8" fill="url(#tableGrad)" stroke="#6c757d" stroke-width="1"/>
  <text x="400" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1a1a1a">
    Common Conjugate Prior Pairs
  </text>
  
  <!-- Table Headers -->
  <text x="100" y="485" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Likelihood</text>
  <text x="230" y="485" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Parameter</text>
  <text x="340" y="485" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Conjugate Prior</text>
  <text x="500" y="485" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Posterior</text>
  <text x="650" y="485" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Update Rule</text>
  
  <line x1="70" y1="490" x2="730" y2="490" stroke="#6c757d" stroke-width="1"/>
  
  <!-- Table Rows -->
  <!-- Binomial -->
  <text x="100" y="510" font-family="Arial, sans-serif" font-size="11" fill="#333">Binomial(n,θ)</text>
  <text x="230" y="510" font-family="Arial, sans-serif" font-size="11" fill="#333">θ (prob)</text>
  <text x="340" y="510" font-family="Arial, sans-serif" font-size="11" fill="#333">Beta(α,β)</text>
  <text x="500" y="510" font-family="Arial, sans-serif" font-size="11" fill="#333">Beta(α+s, β+f)</text>
  <text x="650" y="510" font-family="Arial, sans-serif" font-size="10" fill="#333">s=successes, f=fails</text>
  
  <!-- Poisson -->
  <text x="100" y="530" font-family="Arial, sans-serif" font-size="11" fill="#333">Poisson(λ)</text>
  <text x="230" y="530" font-family="Arial, sans-serif" font-size="11" fill="#333">λ (rate)</text>
  <text x="340" y="530" font-family="Arial, sans-serif" font-size="11" fill="#333">Gamma(α,β)</text>
  <text x="500" y="530" font-family="Arial, sans-serif" font-size="11" fill="#333">Gamma(α+Σx, β+n)</text>
  <text x="650" y="530" font-family="Arial, sans-serif" font-size="10" fill="#333">Σx=sum, n=count</text>
  
  <!-- Normal -->
  <text x="100" y="550" font-family="Arial, sans-serif" font-size="11" fill="#333">Normal(μ,σ²)</text>
  <text x="230" y="550" font-family="Arial, sans-serif" font-size="11" fill="#333">μ (mean)</text>
  <text x="340" y="550" font-family="Arial, sans-serif" font-size="11" fill="#333">Normal(μ₀,σ₀²)</text>
  <text x="500" y="550" font-family="Arial, sans-serif" font-size="11" fill="#333">Normal(μₙ,σₙ²)</text>
  <text x="650" y="550" font-family="Arial, sans-serif" font-size="10" fill="#333">Weighted average</text>
  
  <!-- Multinomial -->
  <text x="100" y="570" font-family="Arial, sans-serif" font-size="11" fill="#333">Multinomial(θ)</text>
  <text x="230" y="570" font-family="Arial, sans-serif" font-size="11" fill="#333">θ (probs)</text>
  <text x="340" y="570" font-family="Arial, sans-serif" font-size="11" fill="#333">Dirichlet(α)</text>
  <text x="500" y="570" font-family="Arial, sans-serif" font-size="11" fill="#333">Dirichlet(α+counts)</text>
  <text x="650" y="570" font-family="Arial, sans-serif" font-size="10" fill="#333">Add observed counts</text>
</svg>