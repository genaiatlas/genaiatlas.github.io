<svg viewBox="0 0 800 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="700" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">Softmax Activation Function Visualization</text>
  
  <!-- Mathematical Formula Section -->
  <g id="formula-section">
    <rect x="50" y="50" width="700" height="80" fill="#ffffff" stroke="#bdc3c7" stroke-width="2" rx="10"/>
    <text x="400" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Softmax Formula</text>
    
    <!-- Main formula -->
    <text x="400" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#2c3e50">
      a
    </text>
    <text x="410" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">j</text>
    <text x="430" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#2c3e50"> = </text>
    <text x="460" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#e74c3c">exp(z</text>
    <text x="490" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#e74c3c">j</text>
    <text x="500" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#e74c3c">)</text>
    <text x="520" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#2c3e50"> / </text>
    <text x="540" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#3498db">Σ</text>
    <text x="550" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#3498db">K</text>
    <text x="565" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#3498db">k=1</text>
    <text x="590" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#3498db">exp(z</text>
    <text x="615" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#3498db">k</text>
    <text x="625" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#3498db">)</text>
    
    <text x="400" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">
      where a_j is the probability for class j, and z_j is the raw output (logit) for class j
    </text>
  </g>
  
  <!-- Step-by-step Process -->
  <g id="step-process">
    <text x="400" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Step-by-Step Process</text>
    
    <!-- Input logits -->
    <g transform="translate(50, 190)">
      <rect x="0" y="0" width="140" height="100" fill="#ecf0f1" stroke="#34495e" stroke-width="2" rx="10"/>
      <text x="70" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#34495e">Input Logits</text>
      <text x="70" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">(Raw outputs)</text>
      
      <text x="20" y="60" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">z₀ = 1.2</text>
      <text x="20" y="75" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">z₁ = 0.8</text>
      <text x="20" y="90" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">z₂ = 2.1</text>
    </g>
    
    <!-- Arrow 1 -->
    <defs>
      <marker id="arrow1" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
      </marker>
    </defs>
    <line x1="210" y1="240" x2="250" y2="240" stroke="#e74c3c" stroke-width="3" marker-end="url(#arrow1)"/>
    <text x="230" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c">exp()</text>
    
    <!-- Exponential values -->
    <g transform="translate(270, 190)">
      <rect x="0" y="0" width="140" height="100" fill="#fadbd8" stroke="#e74c3c" stroke-width="2" rx="10"/>
      <text x="70" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e74c3c">Exponentials</text>
      <text x="70" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">(Always positive)</text>
      
      <text x="20" y="60" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">exp(1.2) = 3.32</text>
      <text x="20" y="75" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">exp(0.8) = 2.23</text>
      <text x="20" y="90" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">exp(2.1) = 8.17</text>
    </g>
    
    <!-- Arrow 2 -->
    <defs>
      <marker id="arrow2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#3498db"/>
      </marker>
    </defs>
    <line x1="430" y1="240" x2="470" y2="240" stroke="#3498db" stroke-width="3" marker-end="url(#arrow2)"/>
    <text x="450" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#3498db">Σ = 13.72</text>
    <text x="450" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#3498db">Normalize</text>
    
    <!-- Final probabilities -->
    <g transform="translate(490, 190)">
      <rect x="0" y="0" width="140" height="100" fill="#d6eaf8" stroke="#3498db" stroke-width="2" rx="10"/>
      <text x="70" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#3498db">Probabilities</text>
      <text x="70" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">(Sum = 1.0)</text>
      
      <text x="20" y="60" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">P₀ = 0.24</text>
      <text x="20" y="75" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">P₁ = 0.16</text>
      <text x="20" y="90" font-family="Arial, sans-serif" font-size="11" fill="#27ae60" font-weight="bold">P₂ = 0.60</text>
    </g>
    
    <!-- Arrow 3 -->
    <defs>
      <marker id="arrow3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#27ae60"/>
      </marker>
    </defs>
    <line x1="650" y1="240" x2="690" y2="240" stroke="#27ae60" stroke-width="3" marker-end="url(#arrow3)"/>
    <text x="670" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#27ae60">argmax</text>
    
    <!-- Prediction -->
    <g transform="translate(710, 220)">
      <circle cx="0" cy="0" r="25" fill="#27ae60" stroke="#229954" stroke-width="2"/>
      <text x="0" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Class 2</text>
      <text x="0" y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#ffffff">Winner</text>
      <text x="0" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#27ae60">Prediction</text>
    </g>
  </g>
  
  <!-- Visual Comparison Chart -->
  <g id="comparison-chart" transform="translate(50, 320)">
    <text x="350" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Before vs After Softmax</text>
    
    <!-- Before Softmax (Raw Logits) -->
    <g transform="translate(0, 30)">
      <text x="150" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#34495e">Raw Logits (z)</text>
      
      <!-- Bar chart for logits -->
      <g transform="translate(50, 20)">
      <!-- Class 0: z=1.2 -->
      <rect x="0" y="80" width="30" height="40" fill="#e74c3c" rx="3"/>
      <text x="15" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">0</text>
      <text x="15" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">1.2</text>
      
      <!-- Class 1: z=0.8 -->
      <rect x="50" y="88" width="30" height="32" fill="#e74c3c" rx="3"/>
      <text x="65" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">1</text>
      <text x="65" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">0.8</text>
      
      <!-- Class 2: z=2.1 -->
      <rect x="100" y="36" width="30" height="84" fill="#e74c3c" rx="3"/>
      <text x="115" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">2</text>
      <text x="115" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">2.1</text>
        
        <!-- Y-axis -->
        <line x1="-10" y1="20" x2="-10" y2="120" stroke="#7f8c8d" stroke-width="1"/>
        <text x="-15" y="25" text-anchor="end" font-family="Arial, sans-serif" font-size="8" fill="#7f8c8d">2.5</text>
        <text x="-15" y="70" text-anchor="end" font-family="Arial, sans-serif" font-size="8" fill="#7f8c8d">1.0</text>
        <text x="-15" y="115" text-anchor="end" font-family="Arial, sans-serif" font-size="8" fill="#7f8c8d">0.0</text>
      </g>
    </g>
    
    <!-- Arrow -->
    <defs>
      <marker id="arrow4" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#f39c12"/>
      </marker>
    </defs>
    <line x1="320" y1="100" x2="370" y2="100" stroke="#f39c12" stroke-width="4" marker-end="url(#arrow4)"/>
    <text x="345" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f39c12">Softmax</text>
    
    <!-- After Softmax (Probabilities) -->
    <g transform="translate(400, 30)">
      <text x="150" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#34495e">Probabilities (P)</text>
      
      <!-- Bar chart for probabilities -->
      <g transform="translate(50, 20)">
      <!-- Class 0: P=0.24 -->
      <rect x="0" y="91" width="30" height="29" fill="#3498db" rx="3"/>
      <text x="15" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">0</text>
      <text x="15" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">0.24</text>
      
      <!-- Class 1: P=0.16 -->
      <rect x="50" y="100" width="30" height="20" fill="#3498db" rx="3"/>
      <text x="65" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">1</text>
      <text x="65" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">0.16</text>
      
      <!-- Class 2: P=0.60 -->
      <rect x="100" y="48" width="30" height="72" fill="#27ae60" rx="3"/>
      <text x="115" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">2</text>
      <text x="115" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#27ae60" font-weight="bold">0.60</text>
        
        <!-- Y-axis -->
        <line x1="-10" y1="20" x2="-10" y2="120" stroke="#7f8c8d" stroke-width="1"/>
        <text x="-15" y="25" text-anchor="end" font-family="Arial, sans-serif" font-size="8" fill="#7f8c8d">1.0</text>
        <text x="-15" y="70" text-anchor="end" font-family="Arial, sans-serif" font-size="8" fill="#7f8c8d">0.5</text>
        <text x="-15" y="115" text-anchor="end" font-family="Arial, sans-serif" font-size="8" fill="#7f8c8d">0.0</text>
        
        <!-- Sum indicator -->
        <text x="75" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#27ae60">Sum = 1.00 ✓</text>
      </g>
    </g>
  </g>
  
  <!-- Key Properties -->
  <g id="properties" transform="translate(50, 500)">
    <rect x="0" y="0" width="700" height="140" fill="#f4f6f7" stroke="#bdc3c7" stroke-width="2" rx="10"/>
    <text x="350" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Key Properties of Softmax</text>
    
    <g transform="translate(40, 50)">
      <!-- Property 1 -->
      <circle cx="10" cy="5" r="6" fill="#3498db"/>
      <text x="10" y="9" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#ffffff">1</text>
      <text x="25" y="9" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50"><tspan font-weight="bold">Normalization:</tspan> All outputs sum to 1.0 (valid probability distribution)</text>
      
      <!-- Property 2 -->
      <circle cx="10" cy="30" r="6" fill="#e74c3c"/>
      <text x="10" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#ffffff">2</text>
      <text x="25" y="34" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50"><tspan font-weight="bold">Monotonic:</tspan> Higher input logits → Higher output probabilities</text>
      
      <!-- Property 3 -->
      <circle cx="10" cy="55" r="6" fill="#27ae60"/>
      <text x="10" y="59" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#ffffff">3</text>
      <text x="25" y="59" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50"><tspan font-weight="bold">Differentiable:</tspan> Smooth gradients for backpropagation training</text>
      
      <!-- Property 4 -->
      <circle cx="10" cy="80" r="6" fill="#f39c12"/>
      <text x="10" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#ffffff">4</text>
      <text x="25" y="84" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50"><tspan font-weight="bold">Exponential:</tspan> Amplifies differences between logits (winner-takes-more)</text>
    </g>
    
    <!-- Temperature scaling info -->
    <g transform="translate(400, 50)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#7f8c8d">Temperature Scaling:</text>
      <text x="0" y="20" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">T &gt; 1: Softer probabilities</text>
      <text x="0" y="35" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">T &lt; 1: Sharper probabilities</text>
      <text x="0" y="50" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">T = 1: Standard softmax</text>
      <text x="0" y="70" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Formula: softmax(z/T)</text>
    </g>
  </g>
  
  <!-- Implementation Note -->
  <g id="implementation" transform="translate(50, 660)">
    <text x="350" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#e67e22" font-weight="bold">
      Implementation Tip: Subtract max(logits) before exp() to prevent numerical overflow
    </text>
    <text x="350" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">
      Numerically stable: exp(z - max(z)) / Sum exp(z_k - max(z))
    </text>
  </g>
</svg>