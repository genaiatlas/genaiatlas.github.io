<svg viewBox="0 0 900 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="900" height="900" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="450" y="35" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    HLM Architecture (Hierarchical Language Model)
  </text>
  
  <text x="450" y="60" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d" font-style="italic">
    Multi-Level Processing for Complex Task Coordination
  </text>
  
  <!-- Executive Layer (Top) -->
  <g transform="translate(250, 100)">
    <rect x="0" y="0" width="400" height="120" fill="#e74c3c" stroke="#c0392b" stroke-width="3" rx="8"/>
    <text x="200" y="30" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="white">
      Executive Layer (High-Level)
    </text>
    <text x="200" y="55" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
      🎯 Strategic Planning &amp; Goal Setting
    </text>
    <text x="200" y="75" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
      • Resource allocation
    </text>
    <text x="200" y="92" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
      • Performance monitoring
    </text>
    <text x="200" y="108" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
      • Strategy adjustment
    </text>
  </g>
  
  <!-- Arrows down from Executive -->
  <line x1="350" y1="220" x2="350" y2="270" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="220" x2="450" y2="270" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="550" y1="220" x2="550" y2="270" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Coordination Layer (Middle) -->
  <g transform="translate(100, 270)">
    <rect x="0" y="0" width="700" height="140" fill="#f39c12" stroke="#d68910" stroke-width="3" rx="8"/>
    <text x="350" y="30" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="white">
      Coordination Layer (Mid-Level)
    </text>
    <text x="350" y="55" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
      ⚙️ Task Orchestration &amp; Resource Management
    </text>
    
    <!-- Sub-components -->
    <g transform="translate(20, 70)">
      <rect x="0" y="0" width="200" height="55" fill="#fef5e7" stroke="#f39c12" stroke-width="2" rx="3"/>
      <text x="100" y="20" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#f39c12">
        Task Scheduling
      </text>
      <text x="100" y="37" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#34495e">
        Priority management
      </text>
      
      <rect x="230" y="0" width="210" height="55" fill="#fef5e7" stroke="#f39c12" stroke-width="2" rx="3"/>
      <text x="335" y="20" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#f39c12">
        Inter-Agent Comm.
      </text>
      <text x="335" y="37" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#34495e">
        Collaboration protocols
      </text>
      
      <rect x="470" y="0" width="200" height="55" fill="#fef5e7" stroke="#f39c12" stroke-width="2" rx="3"/>
      <text x="570" y="20" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#f39c12">
        Quality Control
      </text>
      <text x="570" y="37" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#34495e">
        Validation checks
      </text>
    </g>
  </g>
  
  <!-- Arrows down from Coordination -->
  <line x1="250" y1="410" x2="250" y2="460" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="410" x2="450" y2="460" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="650" y1="410" x2="650" y2="460" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Execution Layer (Bottom) -->
  <g transform="translate(50, 460)">
    <rect x="0" y="0" width="800" height="160" fill="#27ae60" stroke="#229954" stroke-width="3" rx="8"/>
    <text x="400" y="30" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="white">
      Execution Layer (Low-Level)
    </text>
    <text x="400" y="55" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
      🔧 Detailed Action Implementation
    </text>
    
    <!-- Execution units -->
    <g transform="translate(30, 75)">
      <rect x="0" y="0" width="170" height="65" fill="#d5f4e6" stroke="#27ae60" stroke-width="2" rx="3"/>
      <text x="85" y="20" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#27ae60">
        Action Execution
      </text>
      <text x="85" y="37" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#34495e">
        Direct commands
      </text>
      <text x="85" y="52" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#34495e">
        Implementation
      </text>
      
      <rect x="195" y="0" width="170" height="65" fill="#d5f4e6" stroke="#27ae60" stroke-width="2" rx="3"/>
      <text x="280" y="20" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#27ae60">
        Error Handling
      </text>
      <text x="280" y="37" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#34495e">
        Exception recovery
      </text>
      <text x="280" y="52" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#34495e">
        Retry logic
      </text>
      
      <rect x="390" y="0" width="170" height="65" fill="#d5f4e6" stroke="#27ae60" stroke-width="2" rx="3"/>
      <text x="475" y="20" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#27ae60">
        Monitoring
      </text>
      <text x="475" y="37" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#34495e">
        Real-time tracking
      </text>
      <text x="475" y="52" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#34495e">
        Status reporting
      </text>
      
      <rect x="585" y="0" width="170" height="65" fill="#d5f4e6" stroke="#27ae60" stroke-width="2" rx="3"/>
      <text x="670" y="20" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#27ae60">
        Feedback Loop
      </text>
      <text x="670" y="37" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#34495e">
        Result collection
      </text>
      <text x="670" y="52" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#34495e">
        Performance data
      </text>
    </g>
  </g>
  
  <!-- Upward feedback arrows -->
  <line x1="750" y1="460" x2="750" y2="410" stroke="#9b59b6" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow-feedback)"/>
  <line x1="780" y1="270" x2="780" y2="220" stroke="#9b59b6" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow-feedback)"/>
  <text x="795" y="335" font-family="Arial, sans-serif" font-size="9" fill="#9b59b6" transform="rotate(90, 795, 335)">Feedback</text>
  
  <!-- Mathematical Formula -->
  <g transform="translate(150, 660)">
    <rect x="0" y="0" width="600" height="60" fill="#ebf5fb" stroke="#3498db" stroke-width="2" rx="5"/>
    <text x="300" y="25" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#3498db">
      Hierarchical Processing
    </text>
    <text x="300" y="45" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">
      Hₗ(x) = LLMₗ(concat(x, Hₗ₋₁(x), Cₗ))  for layers l ∈ {1, 2, ..., L}
    </text>
  </g>
  
  <!-- Benefits Panel -->
  <g transform="translate(100, 750)">
    <rect x="0" y="0" width="700" height="120" fill="#fff3cd" stroke="#f39c12" stroke-width="2" rx="5"/>
    <text x="350" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#856404">
      💡 Key Benefits
    </text>
    
    <g transform="translate(30, 40)">
      <circle cx="5" cy="5" r="4" fill="#27ae60"/>
      <text x="20" y="9" font-family="Arial, sans-serif" font-size="10" fill="#34495e">
        <tspan font-weight="bold">Scalability:</tspan> Handle increasingly complex multi-step tasks
      </text>
      
      <circle cx="5" cy="28" r="4" fill="#27ae60"/>
      <text x="20" y="32" font-family="Arial, sans-serif" font-size="10" fill="#34495e">
        <tspan font-weight="bold">Modularity:</tspan> Independent development and optimization of layers
      </text>
      
      <circle cx="5" cy="51" r="4" fill="#27ae60"/>
      <text x="20" y="55" font-family="Arial, sans-serif" font-size="10" fill="#34495e">
        <tspan font-weight="bold">Robustness:</tspan> Fault tolerance through hierarchical redundancy
      </text>
      
      <circle cx="5" cy="74" r="4" fill="#27ae60"/>
      <text x="20" y="78" font-family="Arial, sans-serif" font-size="10" fill="#34495e">
        <tspan font-weight="bold">Interpretability:</tspan> Clear separation of reasoning levels for understanding
      </text>
    </g>
  </g>
  
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#34495e"/>
    </marker>
    <marker id="arrow-feedback" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#9b59b6"/>
    </marker>
  </defs>
</svg>