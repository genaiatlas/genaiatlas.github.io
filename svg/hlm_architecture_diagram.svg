<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradExecutive" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4F46E5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradCoordination" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradExecution" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#111827">Hierarchical Language Model</text>
  <text x="400" y="65" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#6b7280">Multi-Level Processing Architecture</text>
  
  <!-- Task Input -->
  <rect x="250" y="100" width="300" height="40" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" rx="8"/>
  <text x="400" y="125" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#374151">Complex Multi-Step Task</text>
  
  <!-- Executive Layer -->
  <rect x="150" y="180" width="500" height="70" fill="url(#gradExecutive)" stroke="#4F46E5" stroke-width="2" rx="12"/>
  <text x="180" y="205" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="white">Executive Layer</text>
  <text x="180" y="225" font-family="Inter, Arial, sans-serif" font-size="14" fill="#e0e7ff">Strategic Planning</text>
  <text x="180" y="240" font-family="Inter, Arial, sans-serif" font-size="14" fill="#e0e7ff">Goal Prioritization</text>
  
  <rect x="450" y="190" width="180" height="20" fill="white" fill-opacity="0.2" rx="4"/>
  <text x="540" y="204" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="white">Resource Allocation</text>
  
  <rect x="450" y="220" width="180" height="20" fill="white" fill-opacity="0.2" rx="4"/>
  <text x="540" y="234" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="white">High-Level Decisions</text>
  
  <!-- Coordination Layer -->
  <rect x="100" y="280" width="600" height="70" fill="url(#gradCoordination)" stroke="#D97706" stroke-width="2" rx="12"/>
  <text x="130" y="305" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="white">Coordination Layer</text>
  <text x="130" y="325" font-family="Inter, Arial, sans-serif" font-size="14" fill="#fef3c7">Task Scheduling</text>
  <text x="130" y="340" font-family="Inter, Arial, sans-serif" font-size="14" fill="#fef3c7">Dependency Management</text>
  
  <rect x="350" y="290" width="160" height="20" fill="white" fill-opacity="0.2" rx="4"/>
  <text x="430" y="304" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="white">Quality Control</text>
  
  <rect x="350" y="320" width="160" height="20" fill="white" fill-opacity="0.2" rx="4"/>
  <text x="430" y="334" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="white">Load Balancing</text>
  
  <rect x="520" y="290" width="160" height="20" fill="white" fill-opacity="0.2" rx="4"/>
  <text x="600" y="304" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="white">Communication</text>
  
  <rect x="520" y="320" width="160" height="20" fill="white" fill-opacity="0.2" rx="4"/>
  <text x="600" y="334" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="white">Synchronization</text>
  
  <!-- Execution Layer -->
  <rect x="50" y="380" width="700" height="70" fill="url(#gradExecution)" stroke="#059669" stroke-width="2" rx="12"/>
  <text x="80" y="405" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="white">Execution Layer</text>
  <text x="80" y="425" font-family="Inter, Arial, sans-serif" font-size="14" fill="#d1fae5">Implementation</text>
  <text x="80" y="440" font-family="Inter, Arial, sans-serif" font-size="14" fill="#d1fae5">Error Handling</text>
  
  <rect x="250" y="390" width="120" height="20" fill="white" fill-opacity="0.2" rx="4"/>
  <text x="310" y="404" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="white">Worker 1</text>
  
  <rect x="380" y="390" width="120" height="20" fill="white" fill-opacity="0.2" rx="4"/>
  <text x="440" y="404" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="white">Worker 2</text>
  
  <rect x="510" y="390" width="120" height="20" fill="white" fill-opacity="0.2" rx="4"/>
  <text x="570" y="404" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="white">Worker 3</text>
  
  <rect x="640" y="390" width="100" height="20" fill="white" fill-opacity="0.2" rx="4"/>
  <text x="690" y="404" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="white">Monitor</text>
  
  <rect x="250" y="420" width="120" height="20" fill="white" fill-opacity="0.2" rx="4"/>
  <text x="310" y="434" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="white">Real-time</text>
  
  <rect x="380" y="420" width="120" height="20" fill="white" fill-opacity="0.2" rx="4"/>
  <text x="440" y="434" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="white">Feedback</text>
  
  <rect x="510" y="420" width="120" height="20" fill="white" fill-opacity="0.2" rx="4"/>
  <text x="570" y="434" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="white">Direct Action</text>
  
  <rect x="640" y="420" width="100" height="20" fill="white" fill-opacity="0.2" rx="4"/>
  <text x="690" y="434" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="white">Status</text>
  
  <!-- Output -->
  <rect x="250" y="480" width="300" height="40" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" rx="8"/>
  <text x="400" y="505" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#166534">Coordinated Results</text>
  
  <!-- Flow Arrows -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 z" fill="#374151"/>
    </marker>
  </defs>
  
  <!-- Vertical flow -->
  <path d="M 400 140 L 400 180" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 400 250 L 400 280" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 400 350 L 400 380" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 400 450 L 400 480" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
  
  <!-- Layer Labels -->
  <text x="50" y="220" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#6366F1">L3</text>
  <text x="50" y="320" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#F59E0B">L2</text>
  <text x="50" y="420" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#10B981">L1</text>
  
  <!-- Side Information -->
  <rect x="550" y="100" width="200" height="60" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" rx="8"/>
  <text x="650" y="120" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#374151">Key Benefits</text>
  <text x="570" y="140" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6b7280">• Scalable task decomposition</text>
  <text x="570" y="155" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6b7280">• Clear separation of concerns</text>
  
  <rect x="50" y="100" width="180" height="60" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" rx="8"/>
  <text x="140" y="120" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#374151">Processing Model</text>
  <text x="60" y="140" font-family="JetBrains Mono, monospace" font-size="11" fill="#6b7280">H_l(x) = LLM_l(x, context)</text>
  <text x="60" y="155" font-family="Inter, Arial, sans-serif" font-size="10" fill="#9ca3af">where l ∈ {1,2,3}</text>
</svg>