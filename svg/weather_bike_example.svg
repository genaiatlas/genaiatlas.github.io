<svg viewBox="0 0 1100 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="550" y="35" font-size="26" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Weather and Bike Example
  </text>
  
  <!-- Background -->
  <rect x="50" y="60" width="1000" height="600" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2" rx="10"/>
  
  <!-- Weather States Section -->
  <text x="80" y="100" font-size="20" font-weight="bold" fill="#2c3e50">Hidden States: Weather</text>
  <rect x="70" y="120" width="960" height="200" fill="#e3f2fd" stroke="#2196F3" stroke-width="2" rx="8"/>
  
  <!-- Sunny State -->
  <g id="sunny1">
    <circle cx="200" cy="220" r="45" fill="#FFD54F" stroke="#F9A825" stroke-width="3"/>
    <text x="200" y="215" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">☀️</text>
    <text x="200" y="235" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Sunny</text>
  </g>
  
  <!-- Rainy State -->
  <g id="rainy1">
    <circle cx="400" cy="220" r="45" fill="#90CAF9" stroke="#1976D2" stroke-width="3"/>
    <text x="400" y="215" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">🌧️</text>
    <text x="400" y="235" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Rainy</text>
  </g>
  
  <!-- Transition Probabilities -->
  <defs>
    <marker id="arrow1" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/>
    </marker>
  </defs>
  
  <!-- Sunny to Sunny (self-loop) -->
  <path d="M 245 210 Q 280 160 245 180" stroke="#1565C0" stroke-width="2.5" fill="none" marker-end="url(#arrow1)"/>
  <text x="270" y="175" font-size="13" font-weight="bold" fill="#1565C0">0.8</text>
  
  <!-- Sunny to Rainy -->
  <path d="M 245 220 L 355 220" stroke="#1565C0" stroke-width="2.5" fill="none" marker-end="url(#arrow1)"/>
  <text x="300" y="210" font-size="13" font-weight="bold" fill="#1565C0">0.2</text>
  
  <!-- Rainy to Rainy (self-loop) -->
  <path d="M 445 210 Q 480 160 445 180" stroke="#1565C0" stroke-width="2.5" fill="none" marker-end="url(#arrow1)"/>
  <text x="470" y="175" font-size="13" font-weight="bold" fill="#1565C0">0.8</text>
  
  <!-- Rainy to Sunny -->
  <path d="M 355 230 L 245 230" stroke="#1565C0" stroke-width="2.5" fill="none" marker-end="url(#arrow1)"/>
  <text x="300" y="250" font-size="13" font-weight="bold" fill="#1565C0">0.2</text>
  
  <!-- Transition Matrix -->
  <rect x="600" y="140" width="400" height="150" fill="white" stroke="#2196F3" stroke-width="2" rx="5"/>
  <text x="800" y="165" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">Transition Matrix A</text>
  
  <text x="650" y="200" font-size="13" text-anchor="end" fill="#666">From Sunny:</text>
  <text x="670" y="200" font-size="13" fill="#333">P(Sunny|Sunny) = 0.8</text>
  <text x="670" y="220" font-size="13" fill="#333">P(Rainy|Sunny) = 0.2</text>
  
  <text x="650" y="255" font-size="13" text-anchor="end" fill="#666">From Rainy:</text>
  <text x="670" y="255" font-size="13" fill="#333">P(Sunny|Rainy) = 0.2</text>
  <text x="670" y="275" font-size="13" fill="#333">P(Rainy|Rainy) = 0.8</text>
  
  <!-- Observations Section -->
  <text x="80" y="360" font-size="20" font-weight="bold" fill="#2c3e50">Observations: Transportation Choice</text>
  <rect x="70" y="380" width="960" height="200" fill="#fff3e0" stroke="#FF9800" stroke-width="2" rx="8"/>
  
  <!-- Drive -->
  <g id="drive">
    <circle cx="200" cy="480" r="45" fill="#FF9800" stroke="#F57C00" stroke-width="3"/>
    <text x="200" y="475" font-size="16" font-weight="bold" text-anchor="middle" fill="white">🚗</text>
    <text x="200" y="495" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Drive</text>
  </g>
  
  <!-- Bike -->
  <g id="bike">
    <circle cx="400" cy="480" r="45" fill="#FF9800" stroke="#F57C00" stroke-width="3"/>
    <text x="400" y="475" font-size="16" font-weight="bold" text-anchor="middle" fill="white">🚴</text>
    <text x="400" y="495" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Bike</text>
  </g>
  
  <!-- Emission Probabilities -->
  <rect x="600" y="400" width="400" height="150" fill="white" stroke="#FF9800" stroke-width="2" rx="5"/>
  <text x="800" y="425" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">Emission Matrix B</text>
  
  <text x="650" y="460" font-size="13" text-anchor="end" fill="#666">If Sunny:</text>
  <text x="670" y="460" font-size="13" fill="#333">P(Drive|Sunny) = 0.2</text>
  <text x="670" y="480" font-size="13" fill="#333">P(Bike|Sunny) = 0.8</text>
  
  <text x="650" y="515" font-size="13" text-anchor="end" fill="#666">If Rainy:</text>
  <text x="670" y="515" font-size="13" fill="#333">P(Drive|Rainy) = 0.9</text>
  <text x="670" y="535" font-size="13" fill="#333">P(Bike|Rainy) = 0.1</text>
  
  <!-- Emission arrows -->
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#F57C00"/>
    </marker>
  </defs>
  
  <path d="M 200 265 L 200 435" stroke="#F57C00" stroke-width="2.5" fill="none" marker-end="url(#arrow2)" stroke-dasharray="5,5"/>
  <text x="215" y="355" font-size="12" font-weight="bold" fill="#F57C00">Emit</text>
  
  <path d="M 400 265 L 400 435" stroke="#F57C00" stroke-width="2.5" fill="none" marker-end="url(#arrow2)" stroke-dasharray="5,5"/>
  <text x="415" y="355" font-size="12" font-weight="bold" fill="#F57C00">Emit</text>
  
  <!-- Key Insight -->
  <rect x="70" y="610" width="960" height="40" fill="#e8f5e9" stroke="#4CAF50" stroke-width="2" rx="5"/>
  <text x="550" y="635" font-size="15" font-weight="bold" text-anchor="middle" fill="#2e7d32">
    🎯 Goal: Observe transportation choices (Drive/Bike) to infer hidden weather states (Sunny/Rainy)
  </text>
  
</svg>