<svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
     refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
    <linearGradient id="originalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="metricGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="constraintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e67e22;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="2" flood-color="#00000030"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="500" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#2c3e50">
    Metric Learning Process: From Constraints to Embeddings
  </text>
  
  <!-- Step 1: Original Data -->
  <g id="step1">
    <rect x="50" y="70" width="150" height="120" fill="url(#originalGrad)" stroke="#2c3e50" stroke-width="2" rx="10" filter="url(#shadow)"/>
    
    <text x="125" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
      Step 1: Original Data
    </text>
    
    <!-- Data points before metric learning -->
    <g id="original-points">
      <!-- Digit 0 cluster -->
      <circle cx="80" cy="120" r="4" fill="white" stroke="#2c3e50" stroke-width="1"/>
      <circle cx="85" cy="125" r="4" fill="white" stroke="#2c3e50" stroke-width="1"/>
      <circle cx="90" cy="115" r="4" fill="white" stroke="#2c3e50" stroke-width="1"/>
      <text x="85" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">0</text>
      
      <!-- Digit 1 cluster -->
      <circle cx="110" cy="140" r="4" fill="white" stroke="#2c3e50" stroke-width="1"/>
      <circle cx="115" cy="135" r="4" fill="white" stroke="#2c3e50" stroke-width="1"/>
      <circle cx="120" cy="145" r="4" fill="white" stroke="#2c3e50" stroke-width="1"/>
      <text x="115" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">1</text>
      
      <!-- Mixed points -->
      <circle cx="140" cy="125" r="4" fill="white" stroke="#2c3e50" stroke-width="1"/>
      <circle cx="160" cy="140" r="4" fill="white" stroke="#2c3e50" stroke-width="1"/>
      <circle cx="170" cy="120" r="4" fill="white" stroke="#2c3e50" stroke-width="1"/>
    </g>
    
    <text x="125" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
      Mixed digit clusters
    </text>
    <text x="125" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">
      Poor separation
    </text>
  </g>
  
  <!-- Arrow 1 -->
  <path d="M 210 130 L 250 130" stroke="#34495e" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="230" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">
    Add constraints
  </text>
  
  <!-- Step 2: Constraint Information -->
  <g id="step2">
    <rect x="270" y="70" width="150" height="120" fill="url(#constraintGrad)" stroke="#2c3e50" stroke-width="2" rx="10" filter="url(#shadow)"/>
    
    <text x="345" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
      Step 2: Constraints
    </text>
    
    <!-- Must-link constraints -->
    <g id="must-link">
      <text x="345" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">
        Must-Link (Similar)
      </text>
      <circle cx="290" cy="125" r="3" fill="#2ecc71"/>
      <circle cx="310" cy="125" r="3" fill="#2ecc71"/>
      <line x1="290" y1="125" x2="310" y2="125" stroke="#2ecc71" stroke-width="2"/>
      <text x="300" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">
        Same digit (0,0)
      </text>
      
      <circle cx="330" cy="125" r="3" fill="#2ecc71"/>
      <circle cx="350" cy="125" r="3" fill="#2ecc71"/>
      <line x1="330" y1="125" x2="350" y2="125" stroke="#2ecc71" stroke-width="2"/>
      <text x="340" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">
        Same digit (1,1)
      </text>
    </g>
    
    <!-- Cannot-link constraints -->
    <g id="cannot-link">
      <text x="345" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">
        Cannot-Link (Different)
      </text>
      <circle cx="290" cy="170" r="3" fill="#e74c3c"/>
      <circle cx="310" cy="170" r="3" fill="#3498db"/>
      <path d="M 290 170 L 310 170" stroke="#e74c3c" stroke-width="2" stroke-dasharray="3,3"/>
      <text x="300" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">
        Different digits (0,1)
      </text>
    </g>
  </g>
  
  <!-- Arrow 2 -->
  <path d="M 430 130 L 470 130" stroke="#34495e" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="450" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">
    Optimize metric
  </text>
  
  <!-- Step 3: Metric Learning Algorithm -->
  <g id="step3">
    <rect x="490" y="70" width="170" height="120" fill="#9b59b6" stroke="#2c3e50" stroke-width="2" rx="10" filter="url(#shadow)"/>
    
    <text x="575" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
      Step 3: Metric Learning
    </text>
    
    <!-- Optimization function -->
    <rect x="510" y="105" width="130" height="70" fill="#8e44ad" stroke="#2c3e50" stroke-width="1" rx="5"/>
    <text x="575" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">
      Objective Function
    </text>
    <text x="575" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">
      min Σ d²(xi, xj) +
    </text>
    <text x="575" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">
      λ Σ max(0, m - d²(xi, xk))
    </text>
    <text x="575" y="161" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">
      (i,j)∈S     (i,k)∈D
    </text>
    <text x="575" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#ecf0f1">
      S: similar pairs, D: different pairs
    </text>
  </g>
  
  <!-- Arrow 3 -->
  <path d="M 670 130 L 710 130" stroke="#34495e" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="690" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">
    Transform data
  </text>
  
  <!-- Step 4: Learned Embedding -->
  <g id="step4">
    <rect x="730" y="70" width="150" height="120" fill="url(#metricGrad)" stroke="#2c3e50" stroke-width="2" rx="10" filter="url(#shadow)"/>
    
    <text x="805" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
      Step 4: Learned Space
    </text>
    
    <!-- Improved clustering -->
    <g id="learned-points">
      <!-- Well-separated digit 0 cluster -->
      <circle cx="750" cy="120" r="4" fill="#2ecc71" stroke="#2c3e50" stroke-width="1"/>
      <circle cx="755" cy="115" r="4" fill="#2ecc71" stroke="#2c3e50" stroke-width="1"/>
      <circle cx="760" cy="125" r="4" fill="#2ecc71" stroke="#2c3e50" stroke-width="1"/>
      <text x="755" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">0</text>
      <ellipse cx="755" cy="120" rx="12" ry="8" fill="none" stroke="#2ecc71" stroke-width="1" stroke-dasharray="2,2"/>
      
      <!-- Well-separated digit 1 cluster -->
      <circle cx="830" cy="150" r="4" fill="#3498db" stroke="#2c3e50" stroke-width="1"/>
      <circle cx="835" cy="145" r="4" fill="#3498db" stroke="#2c3e50" stroke-width="1"/>
      <circle cx="840" cy="155" r="4" fill="#3498db" stroke="#2c3e50" stroke-width="1"/>
      <text x="835" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">1</text>
      <ellipse cx="835" cy="150" rx="12" ry="8" fill="none" stroke="#3498db" stroke-width="1" stroke-dasharray="2,2"/>
    </g>
    
    <text x="805" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
      Clear separation
    </text>
    <text x="805" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">
      Better clustering
    </text>
  </g>
  
  <!-- Mathematical Formulation Section -->
  <g id="formulation">
    <rect x="50" y="220" width="900" height="150" fill="#ffffff" stroke="#2c3e50" stroke-width="2" rx="10" filter="url(#shadow)"/>
    
    <text x="500" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">
      Mathematical Formulation
    </text>
    
    <!-- Distance Learning -->
    <g id="distance-learning">
      <rect x="70" y="260" width="250" height="90" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" rx="5"/>
      <text x="195" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">
        Distance Metric Learning
      </text>
      
      <text x="195" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
        Learn matrix M such that:
      </text>
      <text x="195" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
        d²ₘ(x,y) = (x-y)ᵀM(x-y)
      </text>
      <text x="195" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">
        where M ⪰ 0 (positive semidefinite)
      </text>
      <text x="195" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">
        Mahalanobis distance generalization
      </text>
    </g>
    
    <!-- Constraint Types -->
    <g id="constraint-types">
      <rect x="340" y="260" width="250" height="90" fill="#e8f6f3" stroke="#1abc9c" stroke-width="1" rx="5"/>
      <text x="465" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">
        Constraint Types
      </text>
      
      <text x="370" y="300" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
        <tspan font-weight="bold">Must-link:</tspan> d(xi, xj) ≤ u
      </text>
      <text x="370" y="315" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
        <tspan font-weight="bold">Cannot-link:</tspan> d(xi, xk) ≥ l
      </text>
      <text x="370" y="330" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">
        u: upper bound, l: lower bound
      </text>
      <text x="370" y="345" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">
        Typically: u &lt; l for separation
      </text>
    </g>
    
    <!-- Applications -->
    <g id="applications">
      <rect x="610" y="260" width="320" height="90" fill="#fef9e7" stroke="#f39c12" stroke-width="1" rx="5"/>
      <text x="770" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">
        Real-World Applications
      </text>
      
      <text x="630" y="300" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
        • <tspan font-weight="bold">Face Recognition:</tspan> Same person closer
      </text>
      <text x="630" y="315" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
        • <tspan font-weight="bold">Document Retrieval:</tspan> Similar topics together
      </text>
      <text x="630" y="330" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
        • <tspan font-weight="bold">Recommendation:</tspan> User preference learning
      </text>
      <text x="630" y="345" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
        • <tspan font-weight="bold">Image Search:</tspan> Visual similarity enhancement
      </text>
    </g>
  </g>
  
  <!-- Algorithm Flow -->
  <g id="algorithm-flow">
    <rect x="50" y="390" width="900" height="80" fill="#f4f6f7" stroke="#85929e" stroke-width="1" rx="5"/>
    
    <text x="500" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
      Algorithm Steps
    </text>
    
    <!-- Step boxes -->
    <rect x="70" y="420" width="140" height="40" fill="#3498db" rx="5"/>
    <text x="140" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">
      1. Collect Constraints
    </text>
    <text x="140" y="448" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">
      Expert knowledge/labels
    </text>
    
    <path d="M 220 440 L 240 440" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    
    <rect x="250" y="420" width="140" height="40" fill="#e74c3c" rx="5"/>
    <text x="320" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">
      2. Define Objective
    </text>
    <text x="320" y="448" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">
      Constraint satisfaction
    </text>
    
    <path d="M 400 440 L 420 440" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    
    <rect x="430" y="420" width="140" height="40" fill="#f39c12" rx="5"/>
    <text x="500" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">
      3. Optimize Metric
    </text>
    <text x="500" y="448" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">
      Gradient descent/SDP
    </text>
    
    <path d="M 580 440 L 600 440" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    
    <rect x="610" y="420" width="140" height="40" fill="#27ae60" rx="5"/>
    <text x="680" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">
      4. Transform Data
    </text>
    <text x="680" y="448" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">
      Apply learned metric
    </text>
    
    <path d="M 760 440 L 780 440" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    
    <rect x="790" y="420" width="140" height="40" fill="#8e44ad" rx="5"/>
    <text x="860" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">
      5. Evaluate Results
    </text>
    <text x="860" y="448" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">
      Classification accuracy
    </text>
  </g>
</svg>