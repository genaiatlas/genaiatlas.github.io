<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="500" y="40" font-size="28" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Recommendation Systems: Core Workflow
  </text>
  
  <!-- User Section -->
  <g>
    <rect x="50" y="100" width="200" height="150" rx="10" fill="#e3f2fd" stroke="#1976d2" stroke-width="3"/>
    <text x="150" y="130" font-size="20" font-weight="bold" text-anchor="middle" fill="#1976d2">USERS</text>
    
    <!-- User icons -->
    <circle cx="90" cy="170" r="15" fill="#1976d2"/>
    <circle cx="90" cy="160" r="8" fill="#e3f2fd"/>
    <rect x="78" y="168" width="24" height="20" rx="12" fill="#1976d2"/>
    
    <circle cx="150" cy="170" r="15" fill="#1976d2"/>
    <circle cx="150" cy="160" r="8" fill="#e3f2fd"/>
    <rect x="138" y="168" width="24" height="20" rx="12" fill="#1976d2"/>
    
    <circle cx="210" cy="170" r="15" fill="#1976d2"/>
    <circle cx="210" cy="160" r="8" fill="#e3f2fd"/>
    <rect x="198" y="168" width="24" height="20" rx="12" fill="#1976d2"/>
    
    <text x="150" y="220" font-size="14" text-anchor="middle" fill="#424242">500K+ Users</text>
  </g>
  
  <!-- Items Section -->
  <g>
    <rect x="750" y="100" width="200" height="150" rx="10" fill="#fce4ec" stroke="#c2185b" stroke-width="3"/>
    <text x="850" y="130" font-size="20" font-weight="bold" text-anchor="middle" fill="#c2185b">ITEMS</text>
    
    <!-- Item icons -->
    <rect x="775" y="150" width="40" height="50" rx="3" fill="#c2185b"/>
    <rect x="780" y="155" width="30" height="35" rx="2" fill="#fce4ec"/>
    
    <rect x="830" y="150" width="40" height="50" rx="3" fill="#c2185b"/>
    <rect x="835" y="155" width="30" height="35" rx="2" fill="#fce4ec"/>
    
    <rect x="885" y="150" width="40" height="50" rx="3" fill="#c2185b"/>
    <rect x="890" y="155" width="30" height="35" rx="2" fill="#fce4ec"/>
    
    <text x="850" y="220" font-size="14" text-anchor="middle" fill="#424242">17K+ Movies</text>
  </g>
  
  <!-- Interaction Data -->
  <g>
    <rect x="350" y="100" width="300" height="150" rx="10" fill="#fff3e0" stroke="#f57c00" stroke-width="3"/>
    <text x="500" y="130" font-size="20" font-weight="bold" text-anchor="middle" fill="#f57c00">INTERACTION DATA</text>
    
    <text x="500" y="160" font-size="16" text-anchor="middle" fill="#424242">(User, Item, Rating)</text>
    <text x="500" y="185" font-size="14" text-anchor="middle" fill="#666">
      (Bob, Titanic, 4)
    </text>
    <text x="500" y="205" font-size="14" text-anchor="middle" fill="#666">
      (Emily, Goodfellas, 3)
    </text>
    <text x="500" y="225" font-size="14" text-anchor="middle" fill="#666">
      100M+ triplets
    </text>
  </g>
  
  <!-- Arrows from users and items to data -->
  <path d="M 250 175 L 350 175" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 750 175 L 650 175" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- ML Algorithm Box -->
  <g>
    <rect x="300" y="300" width="400" height="120" rx="10" fill="#e8f5e9" stroke="#388e3c" stroke-width="3"/>
    <text x="500" y="335" font-size="22" font-weight="bold" text-anchor="middle" fill="#388e3c">ML ALGORITHM</text>
    <text x="500" y="365" font-size="15" text-anchor="middle" fill="#424242">Matrix Factorization</text>
    <text x="500" y="390" font-size="15" text-anchor="middle" fill="#424242">Collaborative Filtering</text>
    <text x="500" y="410" font-size="14" text-anchor="middle" fill="#666">Learn latent factors U and V</text>
  </g>
  
  <!-- Arrow from data to algorithm -->
  <path d="M 500 250 L 500 300" stroke="#666" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Predictions Box -->
  <g>
    <rect x="300" y="470" width="400" height="100" rx="10" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="3"/>
    <text x="500" y="500" font-size="22" font-weight="bold" text-anchor="middle" fill="#7b1fa2">PREDICTIONS</text>
    <text x="500" y="530" font-size="15" text-anchor="middle" fill="#424242">Fill missing ratings</text>
    <text x="500" y="555" font-size="15" text-anchor="middle" fill="#424242">Recommend top-rated items</text>
  </g>
  
  <!-- Arrow from algorithm to predictions -->
  <path d="M 500 420 L 500 470" stroke="#666" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#666"/>
    </marker>
  </defs>
  
  <!-- Annotations -->
  <text x="50" y="290" font-size="13" fill="#666" font-style="italic">Input: Sparse observations</text>
  <text x="50" y="450" font-size="13" fill="#666" font-style="italic">Process: Learn patterns</text>
  <text x="50" y="590" font-size="13" fill="#666" font-style="italic">Output: Complete predictions</text>
</svg>