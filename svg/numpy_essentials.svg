<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="675" fill="#f8fafc"/>
  
  <!-- Fast Track Ribbon -->
  <polygon points="1050,0 1200,0 1200,80 1050,60" fill="#3b82f6"/>
  <text x="1125" y="35" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">FAST TRACK</text>
  
  <!-- Title -->
  <text x="600" y="80" text-anchor="middle" fill="#1e293b" font-family="Arial, sans-serif" font-size="36" font-weight="bold">NumPy Essentials</text>
  
  <!-- Speed Comparison -->
  <rect x="100" y="120" width="1000" height="140" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="12"/>
  <text x="600" y="150" text-anchor="middle" fill="#1e293b" font-family="Arial, sans-serif" font-size="24" font-weight="bold">Speed Comparison</text>
  
  <!-- Python List -->
  <rect x="150" y="170" width="200" height="70" fill="#fef2f2" stroke="#dc2626" stroke-width="2" rx="8"/>
  <text x="250" y="195" text-anchor="middle" fill="#dc2626" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Python List</text>
  <text x="250" y="215" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="14">[1, 2, 3, 4, 5]</text>
  <text x="250" y="230" text-anchor="middle" fill="#6b7280" font-family="Arial, sans-serif" font-size="12">Slow • General purpose</text>
  
  <!-- VS -->
  <text x="400" y="210" text-anchor="middle" fill="#6b7280" font-family="Arial, sans-serif" font-size="24" font-weight="bold">VS</text>
  
  <!-- NumPy Array -->
  <rect x="450" y="170" width="200" height="70" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" rx="8"/>
  <text x="550" y="195" text-anchor="middle" fill="#16a34a" font-family="Arial, sans-serif" font-size="16" font-weight="bold">NumPy Array</text>
  <text x="550" y="215" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="14">np.array([1,2,3,4,5])</text>
  <text x="550" y="230" text-anchor="middle" fill="#6b7280" font-family="Arial, sans-serif" font-size="12">Fast • Numerical</text>
  
  <!-- Speed indicators -->
  <rect x="700" y="180" width="350" height="50" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" rx="6"/>
  <text x="875" y="200" text-anchor="middle" fill="#92400e" font-family="Arial, sans-serif" font-size="14" font-weight="bold">🚀 NumPy is 50-100x FASTER!</text>
  <text x="875" y="218" text-anchor="middle" fill="#92400e" font-family="Arial, sans-serif" font-size="12">For mathematical operations on large datasets</text>
  
  <!-- Core Operations -->
  <rect x="80" y="280" width="260" height="160" fill="#f0f9ff" stroke="#0284c7" stroke-width="2" rx="8"/>
  <text x="210" y="310" text-anchor="middle" fill="#0284c7" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Array Creation</text>
  <rect x="120" y="325" width="180" height="105" fill="#ffffff" stroke="#d1d5db" stroke-width="1" rx="4"/>
  <text x="130" y="345" fill="#374151" font-family="Courier, monospace" font-size="12">import numpy as np</text>
  <text x="130" y="365" fill="#374151" font-family="Courier, monospace" font-size="12">arr = np.array([1,2,3])</text>
  <text x="130" y="385" fill="#374151" font-family="Courier, monospace" font-size="12">zeros = np.zeros(5)</text>
  <text x="130" y="405" fill="#374151" font-family="Courier, monospace" font-size="12">ones = np.ones((3,3))</text>
  <text x="130" y="425" fill="#374151" font-family="Courier, monospace" font-size="12">range = np.arange(10)</text>
  
  <!-- Math Operations -->
  <rect x="360" y="280" width="260" height="160" fill="#ecfdf5" stroke="#059669" stroke-width="2" rx="8"/>
  <text x="490" y="310" text-anchor="middle" fill="#059669" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Math Operations</text>
  <rect x="400" y="325" width="180" height="105" fill="#ffffff" stroke="#d1d5db" stroke-width="1" rx="4"/>
  <text x="410" y="345" fill="#374151" font-family="Courier, monospace" font-size="12">arr * 2    # Multiply</text>
  <text x="410" y="365" fill="#374151" font-family="Courier, monospace" font-size="12">arr + 5    # Add</text>
  <text x="410" y="385" fill="#374151" font-family="Courier, monospace" font-size="12">np.sqrt(arr) # Square root</text>
  <text x="410" y="405" fill="#374151" font-family="Courier, monospace" font-size="12">arr.sum()  # Sum all</text>
  <text x="410" y="425" fill="#374151" font-family="Courier, monospace" font-size="12">arr.mean() # Average</text>
  
  <!-- Array Info -->
  <rect x="640" y="280" width="260" height="160" fill="#fef3c7" stroke="#d97706" stroke-width="2" rx="8"/>
  <text x="770" y="310" text-anchor="middle" fill="#d97706" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Array Properties</text>
  <rect x="680" y="325" width="180" height="105" fill="#ffffff" stroke="#d1d5db" stroke-width="1" rx="4"/>
  <text x="690" y="345" fill="#374151" font-family="Courier, monospace" font-size="12">arr.shape   # (3,)</text>
  <text x="690" y="365" fill="#374151" font-family="Courier, monospace" font-size="12">arr.size    # 3</text>
  <text x="690" y="385" fill="#374151" font-family="Courier, monospace" font-size="12">arr.dtype   # int64</text>
  <text x="690" y="405" fill="#374151" font-family="Courier, monospace" font-size="12">arr.ndim    # 1</text>
  <text x="690" y="425" fill="#374151" font-family="Courier, monospace" font-size="12">len(arr)    # 3</text>
  
  <!-- Broadcasting -->
  <rect x="920" y="280" width="260" height="160" fill="#fce7f3" stroke="#db2777" stroke-width="2" rx="8"/>
  <text x="1050" y="310" text-anchor="middle" fill="#db2777" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Broadcasting</text>
  <rect x="960" y="325" width="180" height="105" fill="#ffffff" stroke="#d1d5db" stroke-width="1" rx="4"/>
  <text x="970" y="345" fill="#374151" font-family="Courier, monospace" font-size="11"># Different shapes work!</text>
  <text x="970" y="365" fill="#374151" font-family="Courier, monospace" font-size="12">arr + 10    # Scalar</text>
  <text x="970" y="385" fill="#374151" font-family="Courier, monospace" font-size="12">arr + [1,2,3] # Vector</text>
  <text x="970" y="405" fill="#374151" font-family="Courier, monospace" font-size="11">matrix + vector</text>
  <text x="970" y="425" fill="#6b7280" font-family="Courier, monospace" font-size="11"># Auto-aligns shapes</text>
  
  <!-- Why NumPy Section -->
  <rect x="150" y="470" width="900" height="140" fill="#f1f5f9" stroke="#64748b" stroke-width="1" rx="12"/>
  <text x="600" y="500" text-anchor="middle" fill="#1e293b" font-family="Arial, sans-serif" font-size="20" font-weight="bold">Why Use NumPy?</text>
  
  <!-- Reason boxes -->
  <rect x="200" y="520" width="180" height="60" fill="#dbeafe" stroke="#3b82f6" stroke-width="1" rx="6"/>
  <text x="290" y="540" text-anchor="middle" fill="#1e40af" font-family="Arial, sans-serif" font-size="13" font-weight="bold">⚡ Performance</text>
  <text x="290" y="555" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="11">Vectorized operations</text>
  <text x="290" y="568" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="11">Written in C</text>
  
  <rect x="410" y="520" width="180" height="60" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="6"/>
  <text x="500" y="540" text-anchor="middle" fill="#15803d" font-family="Arial, sans-serif" font-size="13" font-weight="bold">🧮 Mathematics</text>
  <text x="500" y="555" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="11">Linear algebra</text>
  <text x="500" y="568" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="11">Statistics</text>
  
  <rect x="620" y="520" width="180" height="60" fill="#fef3c7" stroke="#d97706" stroke-width="1" rx="6"/>
  <text x="710" y="540" text-anchor="middle" fill="#b45309" font-family="Arial, sans-serif" font-size="13" font-weight="bold">🔗 Ecosystem</text>
  <text x="710" y="555" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="11">Foundation for Pandas</text>
  <text x="710" y="568" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="11">Scikit-learn, Matplotlib</text>
  
  <rect x="830" y="520" width="180" height="60" fill="#fce7f3" stroke="#db2777" stroke-width="1" rx="6"/>
  <text x="920" y="540" text-anchor="middle" fill="#be185d" font-family="Arial, sans-serif" font-size="13" font-weight="bold">💾 Memory</text>
  <text x="920" y="555" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="11">Efficient storage</text>
  <text x="920" y="568" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="11">Less RAM usage</text>
</svg>