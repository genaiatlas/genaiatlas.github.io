<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="matrixGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498DB;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#2980B9;stop-opacity:0.3"/>
    </linearGradient>
    <linearGradient id="eigenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E74C3C;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#C0392B;stop-opacity:0.3"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#27AE60"/>
    </marker>
    <marker id="orangeArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#F39C12"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="700" fill="#FAFAFA"/>
  
  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2C3E50">
    Eigen Decomposition: Geometric Interpretation of Linear Transformations
  </text>
  
  <!-- Matrix A visualization -->
  <g transform="translate(80, 80)">
    <text x="60" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2C3E50">Matrix A</text>
    <rect x="20" y="10" width="80" height="60" fill="url(#matrixGrad)" stroke="#3498DB" stroke-width="2" rx="5"/>
    <text x="60" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">a₁₁  a₁₂</text>
    <text x="60" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">a₂₁  a₂₂</text>
  </g>
  
  <!-- Equals sign -->
  <text x="220" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#34495E">=</text>
  
  <!-- Eigendecomposition: V Λ V^T -->
  <g transform="translate(260, 80)">
    <!-- V matrix -->
    <text x="40" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#E74C3C">V</text>
    <rect x="10" y="10" width="60" height="60" fill="url(#eigenGrad)" stroke="#E74C3C" stroke-width="2" rx="5"/>
    <text x="40" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2C3E50">v₁₁  v₁₂</text>
    <text x="40" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2C3E50">v₂₁  v₂₂</text>
    
    <!-- Lambda matrix -->
    <text x="110" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#27AE60">Λ</text>
    <rect x="80" y="10" width="60" height="60" fill="#D5F5D5" stroke="#27AE60" stroke-width="2" rx="5"/>
    <text x="110" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2C3E50">λ₁   0</text>
    <text x="110" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2C3E50">0   λ₂</text>
    
    <!-- V^T matrix -->
    <text x="180" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#E74C3C">V^T</text>
    <rect x="150" y="10" width="60" height="60" fill="url(#eigenGrad)" stroke="#E74C3C" stroke-width="2" rx="5"/>
    <text x="180" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2C3E50">v₁₁  v₂₁</text>
    <text x="180" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2C3E50">v₁₂  v₂₂</text>
  </g>
  
  <!-- Geometric visualization -->
  <g transform="translate(650, 80)">
    <text x="120" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2C3E50">Geometric View</text>
    
    <!-- Coordinate system -->
    <line x1="50" y1="150" x2="190" y2="150" stroke="#666" stroke-width="1" marker-end="url(#arrowhead)"/>
    <line x1="120" y1="200" x2="120" y2="60" stroke="#666" stroke-width="1" marker-end="url(#arrowhead)"/>
    
    <!-- Original unit circle -->
    <circle cx="120" cy="150" r="40" fill="none" stroke="#3498DB" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="85" y="125" font-family="Arial, sans-serif" font-size="10" fill="#3498DB">Unit Circle</text>
    
    <!-- Transformed ellipse -->
    <ellipse cx="120" cy="150" rx="60" ry="25" fill="none" stroke="#E74C3C" stroke-width="3"/>
    <text x="75" y="180" font-family="Arial, sans-serif" font-size="10" fill="#E74C3C">Transformed</text>
    
    <!-- Eigenvectors -->
    <line x1="120" y1="150" x2="180" y2="150" stroke="#27AE60" stroke-width="3" marker-end="url(#greenArrow)"/>
    <line x1="120" y1="150" x2="120" y2="125" stroke="#F39C12" stroke-width="3" marker-end="url(#orangeArrow)"/>
    
    <!-- Labels -->
    <text x="185" y="155" font-family="Arial, sans-serif" font-size="11" fill="#27AE60" font-weight="bold">v₁ (λ₁)</text>
    <text x="125" y="120" font-family="Arial, sans-serif" font-size="11" fill="#F39C12" font-weight="bold">v₂ (λ₂)</text>
  </g>
  
  <!-- Mathematical properties -->
  <g transform="translate(50, 250)">
    <rect x="0" y="0" width="900" height="400" fill="#F8F9FA" stroke="#DDD" stroke-width="1" rx="8" filter="url(#shadow)"/>
    
    <text x="20" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2C3E50">Eigendecomposition Properties and Applications</text>
    
    <!-- Left column -->
    <g transform="translate(30, 60)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#3498DB">Fundamental Equation:</text>
      <text x="0" y="25" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50">A v = λ v</text>
      <text x="0" y="45" font-family="Arial, sans-serif" font-size="12" fill="#666">where v ≠ 0 (eigenvector), λ ∈ ℝ (eigenvalue)</text>
      
      <text x="0" y="80" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#E74C3C">Matrix Form:</text>
      <text x="0" y="105" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50">A = V Λ V⁻¹</text>
      <text x="0" y="125" font-family="Arial, sans-serif" font-size="12" fill="#666">For symmetric matrices: A = V Λ V^T</text>
      
      <text x="0" y="160" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#27AE60">Characteristic Polynomial:</text>
      <text x="0" y="185" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50">det(A - λI) = 0</text>
      <text x="0" y="205" font-family="Arial, sans-serif" font-size="12" fill="#666">Roots give eigenvalues</text>
      
      <text x="0" y="240" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8E44AD">Geometric Interpretation:</text>
      <text x="0" y="265" font-family="Arial, sans-serif" font-size="12" fill="#333">• Eigenvectors: Principal axes of transformation</text>
      <text x="0" y="280" font-family="Arial, sans-serif" font-size="12" fill="#333">• Eigenvalues: Scaling factors along each axis</text>
      <text x="0" y="295" font-family="Arial, sans-serif" font-size="12" fill="#333">• Largest eigenvalue: Direction of maximum stretch</text>
      <text x="0" y="310" font-family="Arial, sans-serif" font-size="12" fill="#333">• Eigenvectors are orthogonal (for symmetric A)</text>
    </g>
    
    <!-- Right column -->
    <g transform="translate(450, 60)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#D35400">Covariance Matrix Context:</text>
      <text x="0" y="25" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50">C = V Λ V^T</text>
      <text x="0" y="45" font-family="Arial, sans-serif" font-size="12" fill="#666">Eigenvalues = Principal variances</text>
      <text x="0" y="60" font-family="Arial, sans-serif" font-size="12" fill="#666">Eigenvectors = Principal directions</text>
      
      <text x="0" y="95" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#C0392B">Applications in ML:</text>
      <text x="0" y="120" font-family="Arial, sans-serif" font-size="12" fill="#333">• PCA: Dimensionality reduction</text>
      <text x="0" y="135" font-family="Arial, sans-serif" font-size="12" fill="#333">• Spectral clustering: Graph partitioning</text>
      <text x="0" y="150" font-family="Arial, sans-serif" font-size="12" fill="#333">• PageRank: Web ranking algorithm</text>
      <text x="0" y="165" font-family="Arial, sans-serif" font-size="12" fill="#333">• Face recognition: Eigenfaces</text>
      <text x="0" y="180" font-family="Arial, sans-serif" font-size="12" fill="#333">• Vibration analysis: Modal analysis</text>
      
      <text x="0" y="215" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#16A085">Computational Notes:</text>
      <text x="0" y="240" font-family="Arial, sans-serif" font-size="12" fill="#333">• QR algorithm: Standard method</text>
      <text x="0" y="255" font-family="Arial, sans-serif" font-size="12" fill="#333">• Power iteration: Largest eigenvalue</text>
      <text x="0" y="270" font-family="Arial, sans-serif" font-size="12" fill="#333">• SVD: Numerically stable alternative</text>
      <text x="0" y="285" font-family="Arial, sans-serif" font-size="12" fill="#333">• Sparse methods: Large matrices</text>
      <text x="0" y="300" font-family="Arial, sans-serif" font-size="12" fill="#333">• Complexity: O(n³) for dense matrices</text>
    </g>
  </g>
</svg>