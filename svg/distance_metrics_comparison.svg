<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">Distance Metrics Comparison: L1 vs L2</text>
  
  <!-- L2 Distance (Euclidean) Section -->
  <g transform="translate(50, 70)">
    <text x="150" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#3498db">L2 Distance (Euclidean)</text>
    
    <!-- Coordinate system -->
    <g transform="translate(50, 30)">
      <!-- Axes -->
      <line x1="0" y1="150" x2="200" y2="150" stroke="#2c3e50" stroke-width="1"/>
      <line x1="100" y1="0" x2="100" y2="200" stroke="#2c3e50" stroke-width="1"/>
      
      <!-- Points -->
      <circle cx="100" cy="150" r="4" fill="#e74c3c"/>
      <circle cx="150" cy="100" r="4" fill="#27ae60"/>
      
      <!-- Direct line (Euclidean distance) -->
      <line x1="100" y1="150" x2="150" y2="100" stroke="#3498db" stroke-width="3"/>
      
      <!-- Distance calculation visualization -->
      <line x1="100" y1="150" x2="150" y2="150" stroke="#95a5a6" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="150" y1="150" x2="150" y2="100" stroke="#95a5a6" stroke-width="1" stroke-dasharray="3,3"/>
      
      <!-- Labels -->
      <text x="85" y="165" font-family="Arial, sans-serif" font-size="12" fill="#e74c3c">A</text>
      <text x="165" y="95" font-family="Arial, sans-serif" font-size="12" fill="#27ae60">B</text>
      <text x="115" y="130" font-family="Arial, sans-serif" font-size="10" fill="#3498db">√[(x₂-x₁)² + (y₂-y₁)²]</text>
      
      <!-- Distance components -->
      <text x="125" y="165" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">Δx = 50</text>
      <text x="155" y="125" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">Δy = 50</text>
    </g>
    
    <!-- Formula -->
    <g transform="translate(0, 220)">
      <rect x="0" y="0" width="300" height="40" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" rx="3"/>
      <text x="10" y="15" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Formula:</text>
      <text x="10" y="30" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">d₂(x,y) = √(Σ(xᵢ - yᵢ)²)</text>
    </g>
    
    <!-- Properties -->
    <g transform="translate(0, 270)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#34495e">Properties:</text>
      <text x="0" y="20" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">• Shortest path between points</text>
      <text x="0" y="35" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">• Sensitive to outliers (squared terms)</text>
      <text x="0" y="50" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">• Used in standard K-Means</text>
      <text x="0" y="65" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">• Assumes spherical clusters</text>
    </g>
  </g>
  
  <!-- L1 Distance (Manhattan) Section -->
  <g transform="translate(450, 70)">
    <text x="150" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#e67e22">L1 Distance (Manhattan)</text>
    
    <!-- Coordinate system -->
    <g transform="translate(50, 30)">
      <!-- Axes -->
      <line x1="0" y1="150" x2="200" y2="150" stroke="#2c3e50" stroke-width="1"/>
      <line x1="100" y1="0" x2="100" y2="200" stroke="#2c3e50" stroke-width="1"/>
      
      <!-- Points -->
      <circle cx="100" cy="150" r="4" fill="#e74c3c"/>
      <circle cx="150" cy="100" r="4" fill="#27ae60"/>
      
      <!-- Manhattan path -->
      <path d="M 100 150 L 150 150 L 150 100" stroke="#e67e22" stroke-width="3" fill="none"/>
      
      <!-- Grid lines for visualization -->
      <g opacity="0.3">
        <line x1="0" y1="100" x2="200" y2="100" stroke="#bdc3c7" stroke-width="1"/>
        <line x1="0" y1="50" x2="200" y2="50" stroke="#bdc3c7" stroke-width="1"/>
        <line x1="50" y1="0" x2="50" y2="200" stroke="#bdc3c7" stroke-width="1"/>
        <line x1="150" y1="0" x2="150" y2="200" stroke="#bdc3c7" stroke-width="1"/>
      </g>
      
      <!-- Labels -->
      <text x="85" y="165" font-family="Arial, sans-serif" font-size="12" fill="#e74c3c">A</text>
      <text x="165" y="95" font-family="Arial, sans-serif" font-size="12" fill="#27ae60">B</text>
      <text x="115" y="165" font-family="Arial, sans-serif" font-size="10" fill="#e67e22">|x₂-x₁|</text>
      <text x="155" y="125" font-family="Arial, sans-serif" font-size="10" fill="#e67e22">|y₂-y₁|</text>
      
      <!-- Distance components -->
      <text x="125" y="145" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">50</text>
      <text x="160" y="125" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">50</text>
    </g>
    
    <!-- Formula -->
    <g transform="translate(0, 220)">
      <rect x="0" y="0" width="300" height="40" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" rx="3"/>
      <text x="10" y="15" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Formula:</text>
      <text x="10" y="30" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">d₁(x,y) = Σ|xᵢ - yᵢ|</text>
    </g>
    
    <!-- Properties -->
    <g transform="translate(0, 270)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#34495e">Properties:</text>
      <text x="0" y="20" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">• City-block distance</text>
      <text x="0" y="35" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">• Less sensitive to outliers</text>
      <text x="0" y="50" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">• Used in K-Medoids</text>
      <text x="0" y="65" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">• Better for high dimensions</text>
    </g>
  </g>
  
  <!-- Outlier Sensitivity Comparison -->
  <g transform="translate(50, 400)">
    <text x="300" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#8e44ad">Outlier Sensitivity Comparison</text>
    
    <!-- Normal data distribution -->
    <g transform="translate(0, 30)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#34495e">Normal Data Points:</text>
      <circle cx="100" cy="20" r="3" fill="#3498db"/>
      <circle cx="110" cy="25" r="3" fill="#3498db"/>
      <circle cx="120" cy="22" r="3" fill="#3498db"/>
      <circle cx="130" cy="18" r="3" fill="#3498db"/>
      <text x="150" y="25" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Cluster center calculation similar for both metrics</text>
    </g>
    
    <!-- With outlier -->
    <g transform="translate(0, 70)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#34495e">With Outlier:</text>
      <circle cx="100" cy="20" r="3" fill="#3498db"/>
      <circle cx="110" cy="25" r="3" fill="#3498db"/>
      <circle cx="120" cy="22" r="3" fill="#3498db"/>
      <circle cx="130" cy="18" r="3" fill="#3498db"/>
      <circle cx="200" cy="50" r="4" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
      <text x="210" y="55" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c">Outlier</text>
      
      <!-- Impact arrows -->
      <g transform="translate(0, 40)">
        <text x="0" y="0" font-family="Arial, sans-serif" font-size="11" fill="#3498db">L2 (Euclidean): Severely pulls cluster center →</text>
        <text x="0" y="20" font-family="Arial, sans-serif" font-size="11" fill="#e67e22">L1 (Manhattan): Less affected by outlier →</text>
      </g>
    </g>
  </g>
  
  <!-- Algorithm Comparison Table -->
  <g transform="translate(400, 430)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#34495e">Algorithm Comparison:</text>
    
    <!-- Table -->
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="350" height="100" fill="#ffffff" stroke="#bdc3c7" stroke-width="1"/>
      
      <!-- Headers -->
      <line x1="0" y1="25" x2="350" y2="25" stroke="#bdc3c7" stroke-width="1"/>
      <line x1="120" y1="0" x2="120" y2="100" stroke="#bdc3c7" stroke-width="1"/>
      <line x1="230" y1="0" x2="230" y2="100" stroke="#bdc3c7" stroke-width="1"/>
      
      <text x="10" y="18" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">Feature</text>
      <text x="135" y="18" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">L2 (K-Means)</text>
      <text x="245" y="18" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">L1 (K-Medoids)</text>
      
      <!-- Rows -->
      <line x1="0" y1="45" x2="350" y2="45" stroke="#ecf0f1" stroke-width="1"/>
      <line x1="0" y1="65" x2="350" y2="65" stroke="#ecf0f1" stroke-width="1"/>
      <line x1="0" y1="85" x2="350" y2="85" stroke="#ecf0f1" stroke-width="1"/>
      
      <text x="10" y="38" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Outlier sensitivity</text>
      <text x="135" y="38" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">High</text>
      <text x="245" y="38" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Low</text>
      
      <text x="10" y="58" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Cluster center</text>
      <text x="135" y="58" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Mean</text>
      <text x="245" y="58" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Medoid</text>
      
      <text x="10" y="78" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Computational cost</text>
      <text x="135" y="78" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Lower</text>
      <text x="245" y="78" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Higher</text>
      
      <text x="10" y="98" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Best for</text>
      <text x="125" y="98" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">Clean data</text>
      <text x="235" y="98" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">Noisy data</text>
    </g>
  </g>
</svg>