<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="900" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#2c3e50">
    High vs Low Variance Directions in Data
  </text>
  
  <!-- High Variance Section -->
  <g transform="translate(50, 70)">
    <rect x="0" y="0" width="380" height="220" fill="#e8f5e8" stroke="#27ae60" stroke-width="2" rx="10"/>
    <text x="190" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#27ae60">
      High Variance Direction
    </text>
    
    <!-- Coordinate system -->
    <line x1="50" y1="180" x2="330" y2="180" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="50" y1="180" x2="50" y2="60" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Data points spread horizontally -->
    <circle cx="80" cy="175" r="4" fill="#e74c3c"/>
    <circle cx="120" cy="170" r="4" fill="#e74c3c"/>
    <circle cx="160" cy="185" r="4" fill="#e74c3c"/>
    <circle cx="200" cy="175" r="4" fill="#e74c3c"/>
    <circle cx="240" cy="180" r="4" fill="#e74c3c"/>
    <circle cx="280" cy="170" r="4" fill="#e74c3c"/>
    <circle cx="100" cy="190" r="4" fill="#e74c3c"/>
    <circle cx="260" cy="185" r="4" fill="#e74c3c"/>
    
    <!-- Variance indicator -->
    <line x1="70" y1="200" x2="290" y2="200" stroke="#27ae60" stroke-width="4"/>
    <text x="180" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#27ae60" font-weight="bold">Large Spread</text>
    
    <!-- Benefits list -->
    <text x="20" y="240" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Benefits:</text>
    <text x="25" y="260" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• Discriminates between samples</text>
    <text x="25" y="280" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• Contains useful information</text>
    <text x="25" y="300" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• Should be preserved</text>
  </g>
  
  <!-- Low Variance Section -->
  <g transform="translate(470, 70)">
    <rect x="0" y="0" width="380" height="220" fill="#fdf2f2" stroke="#e74c3c" stroke-width="2" rx="10"/>
    <text x="190" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#e74c3c">
      Low Variance Direction
    </text>
    
    <!-- Coordinate system -->
    <line x1="50" y1="180" x2="330" y2="180" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="50" y1="180" x2="50" y2="60" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Data points clustered tightly -->
    <circle cx="180" cy="175" r="4" fill="#3498db"/>
    <circle cx="185" cy="170" r="4" fill="#3498db"/>
    <circle cx="175" cy="185" r="4" fill="#3498db"/>
    <circle cx="190" cy="175" r="4" fill="#3498db"/>
    <circle cx="170" cy="180" r="4" fill="#3498db"/>
    <circle cx="195" cy="180" r="4" fill="#3498db"/>
    <circle cx="182" cy="190" r="4" fill="#3498db"/>
    <circle cx="188" cy="185" r="4" fill="#3498db"/>
    
    <!-- Variance indicator -->
    <line x1="165" y1="200" x2="200" y2="200" stroke="#e74c3c" stroke-width="4"/>
    <text x="182" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#e74c3c" font-weight="bold">Small Spread</text>
    
    <!-- Problems list -->
    <text x="20" y="240" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Problems:</text>
    <text x="25" y="260" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• No discrimination power</text>
    <text x="25" y="280" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• Little useful information</text>
    <text x="25" y="300" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• Can be safely removed</text>
  </g>
  
  <!-- Real-world examples -->
  <g transform="translate(50, 340)">
    <rect x="0" y="0" width="800" height="180" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" rx="5"/>
    <text x="20" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Real-World Examples</text>
    
    <!-- Customer Analysis Example -->
    <g transform="translate(20, 40)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#27ae60">High Variance: Customer Age</text>
      <rect x="0" y="10" width="300" height="20" fill="#d5f4e6" stroke="#27ae60"/>
      <text x="10" y="25" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">18</text>
      <text x="150" y="25" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">40</text>
      <text x="290" y="25" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">65</text>
      
      <!-- Data points across age range -->
      <circle cx="30" cy="20" r="3" fill="#27ae60"/>
      <circle cx="80" cy="20" r="3" fill="#27ae60"/>
      <circle cx="130" cy="20" r="3" fill="#27ae60"/>
      <circle cx="180" cy="20" r="3" fill="#27ae60"/>
      <circle cx="230" cy="20" r="3" fill="#27ae60"/>
      <circle cx="270" cy="20" r="3" fill="#27ae60"/>
      
      <text x="0" y="50" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">
        Ages vary significantly → Useful for customer segmentation
      </text>
    </g>
    
    <g transform="translate(420, 40)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e74c3c">Low Variance: Country (All US)</text>
      <rect x="0" y="10" width="300" height="20" fill="#fadbd8" stroke="#e74c3c"/>
      <text x="10" y="25" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">US</text>
      <text x="150" y="25" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">US</text>
      <text x="290" y="25" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">US</text>
      
      <!-- All data points at same location -->
      <circle cx="150" cy="20" r="3" fill="#e74c3c"/>
      <circle cx="152" cy="20" r="3" fill="#e74c3c"/>
      <circle cx="148" cy="20" r="3" fill="#e74c3c"/>
      <circle cx="154" cy="20" r="3" fill="#e74c3c"/>
      <circle cx="146" cy="20" r="3" fill="#e74c3c"/>
      <circle cx="156" cy="20" r="3" fill="#e74c3c"/>
      
      <text x="0" y="50" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">
        All customers in same country → No discriminating value
      </text>
    </g>
    
    <!-- Gene Expression Example -->
    <g transform="translate(20, 90)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#27ae60">High Variance: Disease-Related Genes</text>
      <text x="0" y="20" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">
        • Expression levels vary between healthy/diseased samples
      </text>
      <text x="0" y="35" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">
        • Critical for diagnosis and understanding disease mechanisms
      </text>
    </g>
    
    <g transform="translate(420, 90)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e74c3c">Low Variance: Housekeeping Genes</text>
      <text x="0" y="20" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">
        • Stable expression across all samples
      </text>
      <text x="0" y="35" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">
        • Used for normalization, not analysis
      </text>
    </g>
  </g>
  
  <!-- Bottom insight -->
  <g transform="translate(50, 540)">
    <rect x="0" y="0" width="800" height="40" fill="#3498db" fill-opacity="0.1" stroke="#3498db" stroke-width="1" rx="5"/>
    <text x="400" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
      PCA Principle: Keep high-variance directions, discard low-variance directions to preserve meaningful information
    </text>
  </g>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e"/>
    </marker>
  </defs>
</svg>