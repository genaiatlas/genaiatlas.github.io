<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="plotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f1f5f9;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="brexitGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fecaca;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="usaGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#dbeafe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="meGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#e9d5ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9333ea;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="euroGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#d1fae5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="africaGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fed7aa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="mixedGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1f2937">
    Spectral Embedding: 2D Visualization of Article Clusters
  </text>
  
  <!-- Main plot area -->
  <g transform="translate(100, 80)">
    <rect x="0" y="0" width="500" height="400" rx="8" fill="url(#plotGrad)" stroke="#e2e8f0" stroke-width="2"/>
    
    <!-- Axes -->
    <line x1="40" y1="360" x2="460" y2="360" stroke="#374151" stroke-width="2"/>
    <line x1="40" y1="40" x2="40" y2="360" stroke="#374151" stroke-width="2"/>
    
    <!-- Axis labels -->
    <text x="250" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#374151">Eigenvector 2</text>
    <text x="15" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#374151" transform="rotate(-90, 15, 200)">Eigenvector 3</text>
    
    <!-- Grid lines -->
    <g stroke="#e5e7eb" stroke-width="1" opacity="0.5">
      <line x1="140" y1="40" x2="140" y2="360"/>
      <line x1="240" y1="40" x2="240" y2="360"/>
      <line x1="340" y1="40" x2="340" y2="360"/>
      <line x1="40" y1="140" x2="460" y2="140"/>
      <line x1="40" y1="240" x2="460" y2="240"/>
    </g>
    
    <!-- Data points representing articles -->
    
    <!-- Brexit cluster (bottom left) -->
    <circle cx="80" cy="320" r="8" fill="url(#brexitGrad)" stroke="#991b1b" stroke-width="2"/>
    <circle cx="95" cy="305" r="8" fill="url(#brexitGrad)" stroke="#991b1b" stroke-width="2"/>
    <circle cx="110" cy="290" r="8" fill="url(#brexitGrad)" stroke="#991b1b" stroke-width="2"/>
    <circle cx="70" cy="285" r="8" fill="url(#brexitGrad)" stroke="#991b1b" stroke-width="2"/>
    <circle cx="85" cy="275" r="8" fill="url(#brexitGrad)" stroke="#991b1b" stroke-width="2"/>
    <circle cx="100" cy="330" r="8" fill="url(#brexitGrad)" stroke="#991b1b" stroke-width="2"/>
    <circle cx="115" y="315" r="8" fill="url(#brexitGrad)" stroke="#991b1b" stroke-width="2"/>
    
    <!-- Brexit label -->
    <text x="92" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#991b1b">Brexit</text>
    
    <!-- USA/Trump cluster (right side) -->
    <circle cx="380" cy="180" r="8" fill="url(#usaGrad)" stroke="#1d4ed8" stroke-width="2"/>
    <circle cx="395" cy="165" r="8" fill="url(#usaGrad)" stroke="#1d4ed8" stroke-width="2"/>
    <circle cx="410" cy="190" r="8" fill="url(#usaGrad)" stroke="#1d4ed8" stroke-width="2"/>
    <circle cx="370" cy="200" r="8" fill="url(#usaGrad)" stroke="#1d4ed8" stroke-width="2"/>
    <circle cx="385" cy="210" r="8" fill="url(#usaGrad)" stroke="#1d4ed8" stroke-width="2"/>
    <circle cx="400" cy="175" r="8" fill="url(#usaGrad)" stroke="#1d4ed8" stroke-width="2"/>
    <circle cx="365" cy="185" r="8" fill="url(#usaGrad)" stroke="#1d4ed8" stroke-width="2"/>
    <circle cx="415" cy="205" r="8" fill="url(#usaGrad)" stroke="#1d4ed8" stroke-width="2"/>
    
    <!-- USA label -->
    <text x="390" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1d4ed8">USA/Trump</text>
    
    <!-- Middle East cluster (purple, right-center) -->
    <circle cx="350" cy="120" r="8" fill="url(#meGrad)" stroke="#7c3aed" stroke-width="2"/>
    <circle cx="365" cy="110" r="8" fill="url(#meGrad)" stroke="#7c3aed" stroke-width="2"/>
    <circle cx="340" cy="135" r="8" fill="url(#meGrad)" stroke="#7c3aed" stroke-width="2"/>
    <circle cx="375" cy="125" r="8" fill="url(#meGrad)" stroke="#7c3aed" stroke-width="2"/>
    <circle cx="355" cy="100" r="8" fill="url(#meGrad)" stroke="#7c3aed" stroke-width="2"/>
    
    <!-- Middle East label -->
    <text x="360" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#7c3aed">Middle East</text>
    
    <!-- Euro 2016 cluster (top left, green) -->
    <circle cx="120" cy="80" r="8" fill="url(#euroGrad)" stroke="#047857" stroke-width="2"/>
    <circle cx="135" cy="70" r="8" fill="url(#euroGrad)" stroke="#047857" stroke-width="2"/>
    <circle cx="105" cy="90" r="8" fill="url(#euroGrad)" stroke="#047857" stroke-width="2"/>
    <circle cx="140" cy="95" r="8" fill="url(#euroGrad)" stroke="#047857" stroke-width="2"/>
    <circle cx="110" cy="65" r="8" fill="url(#euroGrad)" stroke="#047857" stroke-width="2"/>
    
    <!-- Euro 2016 label -->
    <text x="122" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#047857">Euro 2016</text>
    
    <!-- Africa cluster (orange, scattered) -->
    <circle cx="280" cy="90" r="8" fill="url(#africaGrad)" stroke="#c2410c" stroke-width="2"/>
    <circle cx="295" cy="105" r="8" fill="url(#africaGrad)" stroke="#c2410c" stroke-width="2"/>
    <circle cx="265" cy="100" r="8" fill="url(#africaGrad)" stroke="#c2410c" stroke-width="2"/>
    <circle cx="285" cy="115" r="8" fill="url(#africaGrad)" stroke="#c2410c" stroke-width="2"/>
    
    <!-- Africa label -->
    <text x="282" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#c2410c">Africa</text>
    
    <!-- Mixed/Cross-topic articles (center, yellow) -->
    <circle cx="220" cy="180" r="8" fill="url(#mixedGrad)" stroke="#d97706" stroke-width="2"/>
    <circle cx="235" cy="170" r="8" fill="url(#mixedGrad)" stroke="#d97706" stroke-width="2"/>
    <circle cx="205" cy="190" r="8" fill="url(#mixedGrad)" stroke="#d97706" stroke-width="2"/>
    
    <!-- Mixed topic label -->
    <text x="220" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#d97706">Mixed Topics</text>
    
    <!-- Special highlight: Syrian Musicians article -->
    <circle cx="190" cy="200" r="10" fill="none" stroke="#000000" stroke-width="3" stroke-dasharray="5,5"/>
    <line x1="190" y1="200" x2="140" y2="240" stroke="#000000" stroke-width="2"/>
    <text x="90" y="245" font-family="Arial, sans-serif" font-size="10" fill="#374151">Syrian Musicians</text>
    <text x="90" y="255" font-family="Arial, sans-serif" font-size="10" fill="#374151">(Cross-topic)</text>
  </g>
  
  <!-- Legend -->
  <g transform="translate(650, 120)">
    <rect x="0" y="0" width="300" height="280" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <text x="150" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2937">Cluster Legend</text>
    
    <!-- Legend items -->
    <g transform="translate(20, 50)">
      <!-- Brexit -->
      <circle cx="10" cy="0" r="6" fill="url(#brexitGrad)" stroke="#991b1b" stroke-width="2"/>
      <text x="25" y="5" font-family="Arial, sans-serif" font-size="12" fill="#374151">Brexit - EU referendum articles</text>
      
      <!-- USA -->
      <circle cx="10" cy="30" r="6" fill="url(#usaGrad)" stroke="#1d4ed8" stroke-width="2"/>
      <text x="25" y="35" font-family="Arial, sans-serif" font-size="12" fill="#374151">USA/Trump - American politics</text>
      
      <!-- Middle East -->
      <circle cx="10" cy="60" r="6" fill="url(#meGrad)" stroke="#7c3aed" stroke-width="2"/>
      <text x="25" y="65" font-family="Arial, sans-serif" font-size="12" fill="#374151">Middle East - Conflicts, Syria</text>
      
      <!-- Euro 2016 -->
      <circle cx="10" cy="90" r="6" fill="url(#euroGrad)" stroke="#047857" stroke-width="2"/>
      <text x="25" y="95" font-family="Arial, sans-serif" font-size="12" fill="#374151">Euro 2016 - Football/Sports</text>
      
      <!-- Africa -->
      <circle cx="10" cy="120" r="6" fill="url(#africaGrad)" stroke="#c2410c" stroke-width="2"/>
      <text x="25" y="125" font-family="Arial, sans-serif" font-size="12" fill="#374151">Africa - Regional news</text>
      
      <!-- Mixed -->
      <circle cx="10" cy="150" r="6" fill="url(#mixedGrad)" stroke="#d97706" stroke-width="2"/>
      <text x="25" y="155" font-family="Arial, sans-serif" font-size="12" fill="#374151">Mixed Topics - Cross-cutting</text>
      
      <!-- Special case -->
      <circle cx="10" cy="180" r="8" fill="none" stroke="#000000" stroke-width="2" stroke-dasharray="3,3"/>
      <text x="25" y="185" font-family="Arial, sans-serif" font-size="12" fill="#374151">Cross-topic positioning</text>
    </g>
    
    <!-- Key insights -->
    <g transform="translate(20, 240)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#374151">Key Insights:</text>
      <text x="0" y="15" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">✓ Clear spatial separation by topic</text>
      <text x="0" y="30" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">✓ Cross-topic articles positioned centrally</text>
    </g>
  </g>
  
  <!-- Algorithm description -->
  <g transform="translate(50, 520)">
    <rect x="0" y="0" width="900" height="140" rx="8" fill="#1f2937" stroke="#374151" stroke-width="2"/>
    <text x="450" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">Spectral Clustering Algorithm Steps</text>
    
    <g transform="translate(30, 40)">
      <text x="0" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#60a5fa">1. Laplacian Matrix:</text>
      <text x="200" y="20" font-family="monospace" font-size="12" fill="#e5e7eb">L = D - W</text>
      <text x="280" y="20" font-family="Arial, sans-serif" font-size="12" fill="#e5e7eb">(D = degree matrix, W = similarity matrix)</text>
      
      <text x="0" y="45" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#60a5fa">2. Eigendecomposition:</text>
      <text x="200" y="45" font-family="monospace" font-size="12" fill="#e5e7eb">Find eigenvectors v₂, v₃ of smallest eigenvalues</text>
      
      <text x="0" y="70" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#60a5fa">3. Embedding:</text>
      <text x="200" y="70" font-family="monospace" font-size="12" fill="#e5e7eb">Map article i to coordinates (v₂[i], v₃[i])</text>
      
      <text x="0" y="95" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#60a5fa">4. K-means Clustering:</text>
      <text x="200" y="95" font-family="monospace" font-size="12" fill="#e5e7eb">Apply k-means (k=7) to embedded coordinates</text>
    </g>
  </g>
  
  <!-- Performance metrics -->
  <g transform="translate(750, 420)">
    <rect x="0" y="0" width="200" height="80" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="100" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#047857">Performance</text>
    <text x="100" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#047857">7 clusters identified</text>
    <text x="100" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#047857">85% tag agreement</text>
    <text x="100" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#047857">Clear topic separation</text>
  </g>
</svg>