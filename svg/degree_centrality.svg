<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="700" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="600" y="35" font-size="24" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Degree Centrality: Number of Adjacent Edges
  </text>
  
  <!-- Network Visualization -->
  <g id="network">
    <!-- Central node with highest degree -->
    <circle cx="400" cy="250" r="35" fill="#ff5252" stroke="#b71c1c" stroke-width="3"/>
    <text x="400" y="258" font-size="18" font-weight="bold" text-anchor="middle" fill="#fff">A</text>
    
    <!-- Surrounding nodes -->
    <circle cx="300" cy="150" r="25" fill="#90caf9" stroke="#1976d2" stroke-width="2"/>
    <text x="300" y="157" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">B</text>
    
    <circle cx="500" cy="150" r="25" fill="#90caf9" stroke="#1976d2" stroke-width="2"/>
    <text x="500" y="157" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">C</text>
    
    <circle cx="250" cy="250" r="25" fill="#90caf9" stroke="#1976d2" stroke-width="2"/>
    <text x="250" y="257" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">D</text>
    
    <circle cx="550" cy="250" r="25" fill="#90caf9" stroke="#1976d2" stroke-width="2"/>
    <text x="550" y="257" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">E</text>
    
    <circle cx="300" cy="350" r="25" fill="#90caf9" stroke="#1976d2" stroke-width="2"/>
    <text x="300" y="357" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">F</text>
    
    <circle cx="500" cy="350" r="25" fill="#90caf9" stroke="#1976d2" stroke-width="2"/>
    <text x="500" y="357" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">G</text>
    
    <!-- Peripheral nodes -->
    <circle cx="150" cy="200" r="20" fill="#e0e0e0" stroke="#757575" stroke-width="2"/>
    <text x="150" y="207" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">H</text>
    
    <circle cx="600" cy="300" r="20" fill="#e0e0e0" stroke="#757575" stroke-width="2"/>
    <text x="600" y="307" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">I</text>
    
    <!-- Edges from central node A -->
    <line x1="370" y1="230" x2="315" y2="165" stroke="#ff5252" stroke-width="3" opacity="0.7"/>
    <line x1="430" y1="230" x2="485" y2="165" stroke="#ff5252" stroke-width="3" opacity="0.7"/>
    <line x1="365" y1="250" x2="275" y2="250" stroke="#ff5252" stroke-width="3" opacity="0.7"/>
    <line x1="435" y1="250" x2="525" y2="250" stroke="#ff5252" stroke-width="3" opacity="0.7"/>
    <line x1="370" y1="270" x2="315" y2="335" stroke="#ff5252" stroke-width="3" opacity="0.7"/>
    <line x1="430" y1="270" x2="485" y2="335" stroke="#ff5252" stroke-width="3" opacity="0.7"/>
    
    <!-- Other edges -->
    <line x1="250" y1="250" x2="165" y2="210" stroke="#999" stroke-width="2"/>
    <line x1="550" y1="250" x2="590" y2="290" stroke="#999" stroke-width="2"/>
    <line x1="300" y1="350" x2="300" y2="175" stroke="#999" stroke-width="2"/>
    <line x1="500" y1="350" x2="500" y2="175" stroke="#999" stroke-width="2"/>
  </g>
  
  <!-- Degree count labels -->
  <g id="degree-labels">
    <text x="400" y="310" font-size="14" font-weight="bold" text-anchor="middle" fill="#b71c1c">
      Degree = 6
    </text>
    
    <text x="300" y="125" font-size="12" text-anchor="middle" fill="#1976d2">Deg = 2</text>
    <text x="500" y="125" font-size="12" text-anchor="middle" fill="#1976d2">Deg = 2</text>
    <text x="220" y="250" font-size="12" text-anchor="middle" fill="#1976d2">Deg = 2</text>
    <text x="580" y="250" font-size="12" text-anchor="middle" fill="#1976d2">Deg = 2</text>
    <text x="270" y="380" font-size="12" text-anchor="middle" fill="#1976d2">Deg = 2</text>
    <text x="530" y="380" font-size="12" text-anchor="middle" fill="#1976d2">Deg = 2</text>
    <text x="130" y="180" font-size="12" text-anchor="middle" fill="#757575">Deg = 1</text>
    <text x="620" y="320" font-size="12" text-anchor="middle" fill="#757575">Deg = 1</text>
  </g>
  
  <!-- Adjacency Matrix Calculation -->
  <g id="matrix">
    <rect x="750" y="100" width="400" height="280" fill="#fff" stroke="#333" stroke-width="2" rx="5"/>
    
    <text x="950" y="130" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Adjacency Matrix A
    </text>
    
    <!-- Matrix -->
    <g id="matrix-grid">
      <text x="780" y="165" font-size="11" fill="#666">A B C D E F G H I</text>
      
      <!-- Row A (node with degree 6) -->
      <text x="760" y="190" font-size="11" font-weight="bold" fill="#b71c1c">A</text>
      <text x="810" y="190" font-size="11" fill="#333">0 1 1 1 1 1 1 0 0</text>
      
      <!-- Other rows -->
      <text x="760" y="210" font-size="11" fill="#333">B</text>
      <text x="810" y="210" font-size="11" fill="#333">1 0 0 0 0 1 0 0 0</text>
      
      <text x="760" y="230" font-size="11" fill="#333">C</text>
      <text x="810" y="230" font-size="11" fill="#333">1 0 0 0 0 0 1 0 0</text>
      
      <text x="760" y="250" font-size="11" fill="#333">D</text>
      <text x="810" y="250" font-size="11" fill="#333">1 0 0 0 0 0 0 1 0</text>
      
      <text x="760" y="270" font-size="11" fill="#333">E</text>
      <text x="810" y="270" font-size="11" fill="#333">1 0 0 0 0 0 0 0 1</text>
      
      <text x="760" y="290" font-size="11" fill="#333">F</text>
      <text x="810" y="290" font-size="11" fill="#333">1 1 0 0 0 0 0 0 0</text>
      
      <text x="760" y="310" font-size="11" fill="#333">G</text>
      <text x="810" y="310" font-size="11" fill="#333">1 0 1 0 0 0 0 0 0</text>
      
      <text x="760" y="330" font-size="11" fill="#333">H</text>
      <text x="810" y="330" font-size="11" fill="#333">0 0 0 1 0 0 0 0 0</text>
      
      <text x="760" y="350" font-size="11" fill="#333">I</text>
      <text x="810" y="350" font-size="11" fill="#333">0 0 0 0 1 0 0 0 0</text>
    </g>
    
    <!-- Arrow and sum -->
    <path d="M 1000 190 L 1050 190 L 1045 185 M 1050 190 L 1045 195" 
          stroke="#b71c1c" stroke-width="2" fill="none"/>
    <text x="1070" y="195" font-size="14" font-weight="bold" fill="#b71c1c">Σ = 6</text>
  </g>
  
  <!-- Formula Box -->
  <g id="formula">
    <rect x="750" y="410" width="400" height="120" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="5"/>
    
    <text x="950" y="440" font-size="16" font-weight="bold" text-anchor="middle" fill="#1565c0">
      Degree Centrality Formula
    </text>
    
    <text x="950" y="470" font-size="18" text-anchor="middle" fill="#1a1a1a" font-family="serif" font-style="italic">
      Degree(i) = Σⱼ Aᵢⱼ
    </text>
    
    <text x="950" y="495" font-size="13" text-anchor="middle" fill="#555">
      Sum all entries in row i of adjacency matrix
    </text>
    
    <text x="950" y="515" font-size="13" text-anchor="middle" fill="#555">
      Higher degree = More connections = Higher centrality
    </text>
  </g>
  
  <!-- Bottom explanation -->
  <g id="explanation">
    <rect x="50" y="550" width="1100" height="120" fill="#fff3e0" stroke="#f57c00" stroke-width="2" rx="5"/>
    
    <text x="600" y="580" font-size="16" font-weight="bold" text-anchor="middle" fill="#e65100">
      Use Case: Social Network Marketing
    </text>
    
    <text x="600" y="605" font-size="13" text-anchor="middle" fill="#555">
      Give free concert ticket to person with highest degree (most friends)
    </text>
    
    <text x="600" y="625" font-size="13" text-anchor="middle" fill="#555">
      Assumption: More connections → Greater influence → Higher cascade potential
    </text>
    
    <text x="600" y="650" font-size="12" text-anchor="middle" fill="#777" font-style="italic">
      Limitation: Does not consider the quality or importance of connections
    </text>
  </g>
</svg>