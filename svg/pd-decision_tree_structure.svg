<svg viewBox="0 0 900 650" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="900" height="650" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="450" y="30" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#2c3e50">Decision Tree Structure and Information Gain</text>
  
  <!-- Root Node -->
  <circle cx="450" cy="90" r="35" fill="#3498db" stroke="#2980b9" stroke-width="3"/>
  <text x="450" y="85" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Sugar Level</text>
  <text x="450" y="100" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">IG = 0.68</text>
  
  <!-- Root node branches -->
  <line x1="420" y1="115" x2="300" y2="180" stroke="#34495e" stroke-width="3"/>
  <line x1="480" y1="115" x2="600" y2="180" stroke="#34495e" stroke-width="3"/>
  
  <!-- Branch labels -->
  <text x="360" y="150" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#34495e">≤ 140</text>
  <text x="540" y="150" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#34495e">&gt; 140</text>
  
  <!-- Level 2 - Left side -->
  <circle cx="300" cy="200" r="30" fill="#e74c3c" stroke="#c0392b" stroke-width="3"/>
  <text x="300" y="195" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">Calories</text>
  <text x="300" y="210" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">IG = 0.45</text>
  
  <!-- Level 2 - Right side (Leaf) -->
  <rect x="570" y="175" width="60" height="50" fill="#27ae60" stroke="#229954" stroke-width="3" rx="10"/>
  <text x="600" y="195" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Diabetic</text>
  <text x="600" y="210" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Yes (8/8)</text>
  
  <!-- Level 2 branches -->
  <line x1="275" y1="225" x2="200" y2="290" stroke="#34495e" stroke-width="2"/>
  <line x1="325" y1="225" x2="400" y2="290" stroke="#34495e" stroke-width="2"/>
  
  <!-- Branch labels Level 2 -->
  <text x="237" y="260" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">High</text>
  <text x="363" y="260" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">Low/Mod</text>
  
  <!-- Level 3 - Leaf Nodes -->
  <rect x="170" y="290" width="60" height="50" fill="#27ae60" stroke="#229954" stroke-width="3" rx="10"/>
  <text x="200" y="310" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">Diabetic</text>
  <text x="200" y="325" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">Yes (4/5)</text>
  
  <rect x="370" y="290" width="60" height="50" fill="#95a5a6" stroke="#7f8c8d" stroke-width="3" rx="10"/>
  <text x="400" y="305" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="white">Non-Diabetic</text>
  <text x="400" y="320" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">No (3/4)</text>
  
  <!-- Information Gain Calculation Box -->
  <g transform="translate(50, 380)">
    <rect x="0" y="0" width="400" height="250" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2" rx="10"/>
    <text x="200" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">Information Gain Calculation</text>
    
    <!-- Entropy Formula -->
    <text x="20" y="50" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Entropy Formula:</text>
    <text x="20" y="70" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">H(Y) = -Σ p_i log₂(p_i)</text>
    
    <!-- Information Gain Formula -->
    <text x="20" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Information Gain:</text>
    <text x="20" y="120" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">IG = H(Y) - H(Y|X)</text>
    
    <!-- Example calculation -->
    <text x="20" y="150" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e74c3c">Example (Sugar Level):</text>
    <text x="20" y="170" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">H(Diabetic) = -(5/10)log₂(5/10) - (5/10)log₂(5/10) = 1.0</text>
    <text x="20" y="190" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">H(Diabetic|Sugar) = 0.32</text>
    <text x="20" y="210" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">IG(Sugar Level) = 1.0 - 0.32 = 0.68</text>
    
    <text x="20" y="235" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="#7f8c8d">Highest IG → Selected as root node</text>
  </g>
  
  <!-- Feature Comparison Table -->
  <g transform="translate(480, 380)">
    <rect x="0" y="0" width="350" height="180" fill="#ffffff" stroke="#bdc3c7" stroke-width="2" rx="10"/>
    <text x="175" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">Feature Information Gain</text>
    
    <!-- Table headers -->
    <rect x="20" y="40" width="310" height="30" fill="#34495e"/>
    <text x="50" y="60" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Feature</text>
    <text x="175" y="60" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Information Gain</text>
    <text x="280" y="60" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Rank</text>
    
    <!-- Table rows -->
    <rect x="20" y="70" width="310" height="25" fill="#3498db" fill-opacity="0.1"/>
    <text x="50" y="87" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">Sugar Level</text>
    <text x="175" y="87" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">0.68</text>
    <text x="280" y="87" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#e74c3c">1st</text>
    
    <rect x="20" y="95" width="310" height="25" fill="#e8e8e8"/>
    <text x="50" y="112" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">Calories Intake</text>
    <text x="175" y="112" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">0.37</text>
    <text x="280" y="112" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">2nd</text>
    
    <rect x="20" y="120" width="310" height="25" fill="#e8e8e8"/>
    <text x="50" y="137" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">Daily Activity</text>
    <text x="175" y="137" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">0.40</text>
    <text x="280" y="137" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">3rd</text>
  </g>
  
  <!-- Tree Construction Process -->
  <g transform="translate(480, 580)">
    <rect x="0" y="0" width="350" height="60" fill="#f39c12" fill-opacity="0.1" stroke="#f39c12" stroke-width="2" rx="10"/>
    <text x="175" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#d68910">Tree Construction Process</text>
    <text x="20" y="40" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">1. Calculate entropy for target variable</text>
    <text x="20" y="55" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">2. Find feature with highest information gain → Split on that feature</text>
  </g>
  
  <!-- Legend -->
  <g transform="translate(50, 580)">
    <rect x="0" y="0" width="350" height="60" fill="#ffffff" stroke="#bdc3c7" stroke-width="2" rx="10"/>
    <text x="175" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">Node Types</text>
    
    <circle cx="40" cy="40" r="12" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    <text x="70" y="45" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Decision Node</text>
    
    <rect x="140" y="32" width="24" height="16" fill="#27ae60" stroke="#229954" stroke-width="2" rx="3"/>
    <text x="180" y="43" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Leaf Node (Pure)</text>
    
    <rect x="270" y="32" width="24" height="16" fill="#95a5a6" stroke="#7f8c8d" stroke-width="2" rx="3"/>
    <text x="310" y="43" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Leaf Node (Impure)</text>
  </g>
</svg>