<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#64748b" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="sigmoidGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGradient)"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1e293b">Logistic Regression: Bridge to Machine Learning</text>
  
  <!-- Main content area -->
  <rect x="40" y="50" width="720" height="530" fill="white" stroke="#cbd5e1" stroke-width="2" rx="10" filter="url(#shadow)"/>
  
  <!-- Sigmoid function visualization -->
  <g transform="translate(80, 80)">
    <text x="160" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">Sigmoid Function (Logistic Curve)</text>
    
    <!-- Plot area -->
    <rect x="20" y="30" width="300" height="200" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    
    <!-- Grid lines -->
    <g stroke="#e2e8f0" stroke-width="0.5">
      <line x1="70" y1="30" x2="70" y2="230"/>
      <line x1="120" y1="30" x2="120" y2="230"/>
      <line x1="170" y1="30" x2="170" y2="230"/>
      <line x1="220" y1="30" x2="220" y2="230"/>
      <line x1="270" y1="30" x2="270" y2="230"/>
      <line x1="20" y1="80" x2="320" y2="80"/>
      <line x1="20" y1="130" x2="320" y2="130"/>
      <line x1="20" y1="180" x2="320" y2="180"/>
    </g>
    
    <!-- Axes -->
    <line x1="20" y1="230" x2="320" y2="230" stroke="#475569" stroke-width="2"/>
    <line x1="170" y1="30" x2="170" y2="230" stroke="#475569" stroke-width="2"/>
    
    <!-- Sigmoid curve -->
    <path d="M 30,220 Q 60,215 90,200 Q 120,180 150,130 Q 180,80 210,50 Q 240,35 270,32 Q 300,31 310,30" 
          fill="none" stroke="url(#sigmoidGradient)" stroke-width="4"/>
    
    <!-- Data points -->
    <g fill="#3b82f6">
      <circle cx="60" cy="210" r="3"/>
      <circle cx="80" cy="205" r="3"/>
      <circle cx="100" cy="190" r="3"/>
      <circle cx="120" cy="170" r="3"/>
      <circle cx="140" cy="145" r="3"/>
      <circle cx="160" cy="115" r="3"/>
      <circle cx="180" cy="85" r="3"/>
      <circle cx="200" cy="60" r="3"/>
      <circle cx="220" cy="45" r="3"/>
      <circle cx="240" cy="38" r="3"/>
      <circle cx="260" cy="35" r="3"/>
      <circle cx="280" cy="33" r="3"/>
    </g>
    
    <!-- Labels -->
    <text x="340" y="135" font-family="Arial, sans-serif" font-size="12" fill="#475569">X</text>
    <text x="175" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">P(Y=1)</text>
    
    <!-- Probability annotations -->
    <text x="25" y="40" font-family="Arial, sans-serif" font-size="10" fill="#16a34a" font-weight="bold">P = 1</text>
    <text x="25" y="135" font-family="Arial, sans-serif" font-size="10" fill="#f59e0b" font-weight="bold">P = 0.5</text>
    <text x="25" y="225" font-family="Arial, sans-serif" font-size="10" fill="#dc2626" font-weight="bold">P = 0</text>
    
    <!-- Decision boundary line -->
    <line x1="20" y1="130" x2="320" y2="130" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="250" y="125" font-family="Arial, sans-serif" font-size="10" fill="#f59e0b" font-weight="bold">Decision Boundary</text>
  </g>
  
  <!-- Mathematical formulation -->
  <g transform="translate(400, 80)">
    <text x="160" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">Mathematical Formulation</text>
    
    <rect x="20" y="30" width="300" height="200" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="5"/>
    
    <g font-family="Arial, sans-serif" font-size="12" fill="#1e293b">
      <text x="170" y="55" text-anchor="middle" font-weight="bold">Logistic Function:</text>
      <text x="170" y="80" text-anchor="middle" font-size="14">p = 1 / (1 + e^(-z))</text>
      
      <text x="170" y="110" text-anchor="middle" font-weight="bold">Linear Combination:</text>
      <text x="170" y="130" text-anchor="middle" font-size="14">z = β₀ + β₁X₁ + β₂X₂ + ... + βₖXₖ</text>
      
      <text x="170" y="160" text-anchor="middle" font-weight="bold">Logit (Log-odds):</text>
      <text x="170" y="180" text-anchor="middle" font-size="14">logit(p) = ln(p/(1-p)) = z</text>
      
      <text x="170" y="210" text-anchor="middle" font-weight="bold" fill="#dc2626">Odds Ratio: e^β</text>
    </g>
  </g>
  
  <!-- ML Algorithm Comparison -->
  <g transform="translate(80, 320)">
    <text x="300" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">Bridge to Machine Learning Algorithms</text>
    
    <!-- Algorithm boxes -->
    <g transform="translate(0, 40)">
      <!-- Logistic Regression -->
      <rect x="0" y="0" width="120" height="80" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" rx="5"/>
      <text x="60" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">Logistic</text>
      <text x="60" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">Regression</text>
      <text x="60" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#475569">Linear boundary</text>
      <text x="60" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#475569">Probabilistic</text>
      
      <!-- Decision Trees -->
      <rect x="140" y="0" width="120" height="80" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" rx="5"/>
      <text x="200" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">Decision</text>
      <text x="200" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">Trees</text>
      <text x="200" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#475569">Non-linear</text>
      <text x="200" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#475569">Interpretable</text>
      
      <!-- SVM -->
      <rect x="280" y="0" width="120" height="80" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="5"/>
      <text x="340" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">Support Vector</text>
      <text x="340" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">Machines</text>
      <text x="340" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#475569">Margin-based</text>
      <text x="340" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#475569">Kernel tricks</text>
      
      <!-- Neural Networks -->
      <rect x="420" y="0" width="120" height="80" fill="#fdf2f8" stroke="#ec4899" stroke-width="2" rx="5"/>
      <text x="480" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">Neural</text>
      <text x="480" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">Networks</text>
      <text x="480" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#475569">Deep learning</text>
      <text x="480" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#475569">Complex patterns</text>
    </g>
    
    <!-- Arrows showing progression -->
    <g stroke="#64748b" stroke-width="2" fill="#64748b">
      <path d="M 125,130 L 135,130 L 130,125 M 135,130 L 130,135"/>
      <path d="M 265,130 L 275,130 L 270,125 M 275,130 L 270,135"/>
      <path d="M 405,130 L 415,130 L 410,125 M 415,130 L 410,135"/>
    </g>
    
    <text x="130" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#64748b">Increasing</text>
    <text x="270" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#64748b">Complexity</text>
    <text x="410" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#64748b">&amp; Power</text>
  </g>
  
  <!-- Evaluation metrics section -->
  <g transform="translate(80, 480)">
    <text x="300" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">Classification Evaluation Metrics</text>
    
    <!-- Confusion Matrix -->
    <g transform="translate(0, 30)">
      <text x="80" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">Confusion Matrix</text>
      
      <rect x="40" y="20" width="40" height="20" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <text x="60" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#16a34a" font-weight="bold">TP</text>
      
      <rect x="80" y="20" width="40" height="20" fill="#fecaca" stroke="#dc2626" stroke-width="1"/>
      <text x="100" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#dc2626" font-weight="bold">FP</text>
      
      <rect x="40" y="40" width="40" height="20" fill="#fecaca" stroke="#dc2626" stroke-width="1"/>
      <text x="60" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#dc2626" font-weight="bold">FN</text>
      
      <rect x="80" y="40" width="40" height="20" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
      <text x="100" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#16a34a" font-weight="bold">TN</text>
    </g>
    
    <!-- Metrics -->
    <g transform="translate(180, 30)" font-family="Arial, sans-serif" font-size="11" fill="#475569">
      <text x="0" y="15" font-weight="bold" fill="#1e293b">Key Metrics:</text>
      <text x="0" y="30"><tspan font-weight="bold">Accuracy:</tspan> (TP + TN) / (TP + TN + FP + FN)</text>
      <text x="0" y="45"><tspan font-weight="bold">Precision:</tspan> TP / (TP + FP)</text>
      <text x="0" y="60"><tspan font-weight="bold">Recall:</tspan> TP / (TP + FN)</text>
    </g>
    
    <g transform="translate(420, 30)" font-family="Arial, sans-serif" font-size="11" fill="#475569">
      <text x="0" y="15" font-weight="bold" fill="#1e293b">Advanced:</text>
      <text x="0" y="30"><tspan font-weight="bold">F1-Score:</tspan> 2 × (Precision × Recall) / (Precision + Recall)</text>
      <text x="0" y="45"><tspan font-weight="bold">AUC-ROC:</tspan> Area Under ROC Curve</text>
      <text x="0" y="60"><tspan font-weight="bold">Log-Loss:</tspan> -[y×log(p) + (1-y)×log(1-p)]</text>
    </g>
  </g>
</svg>