<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fdf2f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fce7f3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="histGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="scatterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" fill="#831843" font-family="Arial, sans-serif" font-size="28" font-weight="bold">Data Visualization Types</text>
  <text x="600" y="65" text-anchor="middle" fill="#831843" font-family="Arial, sans-serif" font-size="16">Transforming Statistics into Insights</text>
  
  <!-- Histogram -->
  <g transform="translate(50, 100)">
    <rect x="0" y="0" width="270" height="300" rx="10" fill="white" stroke="#3b82f6" stroke-width="2"/>
    <rect x="0" y="0" width="270" height="40" rx="10" fill="url(#histGrad)"/>
    <text x="135" y="25" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">HISTOGRAM</text>
    
    <!-- Histogram bars -->
    <g transform="translate(20, 60)">
      <rect x="0" y="140" width="25" height="60" fill="#3b82f6" opacity="0.7"/>
      <rect x="30" y="120" width="25" height="80" fill="#3b82f6" opacity="0.7"/>
      <rect x="60" y="80" width="25" height="120" fill="#3b82f6" opacity="0.7"/>
      <rect x="90" y="100" width="25" height="100" fill="#3b82f6" opacity="0.7"/>
      <rect x="120" y="110" width="25" height="90" fill="#3b82f6" opacity="0.7"/>
      <rect x="150" y="130" width="25" height="70" fill="#3b82f6" opacity="0.7"/>
      <rect x="180" y="150" width="25" height="50" fill="#3b82f6" opacity="0.7"/>
      <rect x="210" y="170" width="25" height="30" fill="#3b82f6" opacity="0.7"/>
      
      <!-- Axes -->
      <line x1="0" y1="200" x2="240" y2="200" stroke="#374151" stroke-width="2"/>
      <line x1="0" y1="60" x2="0" y2="200" stroke="#374151" stroke-width="2"/>
      
      <!-- Labels -->
      <text x="120" y="220" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">Values</text>
      <text x="-15" y="130" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12" transform="rotate(-90, -15, 130)">Frequency</text>
    </g>
    
    <text x="135" y="270" text-anchor="middle" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Best for: Distribution shape</text>
    <text x="135" y="285" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="10">Shows frequency of values</text>
  </g>
  
  <!-- Box Plot -->
  <g transform="translate(350, 100)">
    <rect x="0" y="0" width="270" height="300" rx="10" fill="white" stroke="#10b981" stroke-width="2"/>
    <rect x="0" y="0" width="270" height="40" rx="10" fill="url(#boxGrad)"/>
    <text x="135" y="25" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">BOX PLOT</text>
    
    <!-- Box plot elements -->
    <g transform="translate(20, 80)">
      <!-- Number line -->
      <line x1="20" y1="120" x2="220" y2="120" stroke="#374151" stroke-width="2"/>
      
      <!-- Left whisker -->
      <line x1="40" y1="120" x2="80" y2="120" stroke="#374151" stroke-width="2"/>
      <line x1="80" y1="110" x2="80" y2="130" stroke="#374151" stroke-width="2"/>
      
      <!-- Box -->
      <rect x="80" y="100" width="80" height="40" fill="#10b981" opacity="0.3" stroke="#10b981" stroke-width="2"/>
      
      <!-- Median line -->
      <line x1="120" y1="100" x2="120" y2="140" stroke="#374151" stroke-width="3"/>
      
      <!-- Right whisker -->
      <line x1="160" y1="120" x2="180" y2="120" stroke="#374151" stroke-width="2"/>
      <line x1="180" y1="110" x2="180" y2="130" stroke="#374151" stroke-width="2"/>
      
      <!-- Outliers -->
      <circle cx="200" cy="120" r="3" fill="#ef4444"/>
      <circle cx="210" cy="120" r="3" fill="#ef4444"/>
      
      <!-- Labels -->
      <text x="40" y="150" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="9">Min</text>
      <text x="80" y="150" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="9">Q1</text>
      <text x="120" y="150" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="9">Median</text>
      <text x="160" y="150" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="9">Q3</text>
      <text x="180" y="150" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="9">Max</text>
      <text x="205" y="150" text-anchor="middle" fill="#ef4444" font-family="Arial, sans-serif" font-size="9">Outliers</text>
    </g>
    
    <text x="135" y="270" text-anchor="middle" fill="#059669" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Best for: Summary statistics</text>
    <text x="135" y="285" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="10">Shows quartiles and outliers</text>
  </g>
  
  <!-- Scatter Plot -->
  <g transform="translate(650, 100)">
    <rect x="0" y="0" width="270" height="300" rx="10" fill="white" stroke="#f59e0b" stroke-width="2"/>
    <rect x="0" y="0" width="270" height="40" rx="10" fill="url(#scatterGrad)"/>
    <text x="135" y="25" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">SCATTER PLOT</text>
    
    <!-- Scatter plot points -->
    <g transform="translate(30, 60)">
      <!-- Axes -->
      <line x1="0" y1="180" x2="200" y2="180" stroke="#374151" stroke-width="2"/>
      <line x1="0" y1="40" x2="0" y2="180" stroke="#374151" stroke-width="2"/>
      
      <!-- Data points with trend -->
      <circle cx="20" cy="160" r="4" fill="#f59e0b" opacity="0.7"/>
      <circle cx="30" cy="150" r="4" fill="#f59e0b" opacity="0.7"/>
      <circle cx="45" cy="140" r="4" fill="#f59e0b" opacity="0.7"/>
      <circle cx="55" cy="130" r="4" fill="#f59e0b" opacity="0.7"/>
      <circle cx="70" cy="125" r="4" fill="#f59e0b" opacity="0.7"/>
      <circle cx="85" cy="115" r="4" fill="#f59e0b" opacity="0.7"/>
      <circle cx="100" cy="100" r="4" fill="#f59e0b" opacity="0.7"/>
      <circle cx="115" cy="95" r="4" fill="#f59e0b" opacity="0.7"/>
      <circle cx="130" cy="85" r="4" fill="#f59e0b" opacity="0.7"/>
      <circle cx="145" cy="80" r="4" fill="#f59e0b" opacity="0.7"/>
      <circle cx="160" cy="70" r="4" fill="#f59e0b" opacity="0.7"/>
      <circle cx="175" cy="65" r="4" fill="#f59e0b" opacity="0.7"/>
      <circle cx="190" cy="55" r="4" fill="#f59e0b" opacity="0.7"/>
      
      <!-- Trend line -->
      <line x1="10" y1="170" x2="190" y2="50" stroke="#d97706" stroke-width="2" stroke-dasharray="3,3"/>
      
      <!-- Labels -->
      <text x="100" y="200" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">Variable X</text>
      <text x="-15" y="110" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12" transform="rotate(-90, -15, 110)">Variable Y</text>
    </g>
    
    <text x="135" y="270" text-anchor="middle" fill="#d97706" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Best for: Relationships</text>
    <text x="135" y="285" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="10">Shows correlation patterns</text>
  </g>
  
  <!-- Q-Q Plot -->
  <g transform="translate(950, 100)">
    <rect x="0" y="0" width="220" height="300" rx="10" fill="white" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="0" y="0" width="220" height="40" rx="10" fill="#8b5cf6" fill-opacity="0.8"/>
    <text x="110" y="25" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Q-Q PLOT</text>
    
    <!-- Q-Q plot -->
    <g transform="translate(20, 60)">
      <!-- Axes -->
      <line x1="0" y1="180" x2="160" y2="180" stroke="#374151" stroke-width="2"/>
      <line x1="0" y1="40" x2="0" y2="180" stroke="#374151" stroke-width="2"/>
      
      <!-- Theoretical line -->
      <line x1="10" y1="170" x2="150" y2="50" stroke="#374151" stroke-width="2"/>
      
      <!-- Sample points -->
      <circle cx="20" cy="165" r="3" fill="#8b5cf6"/>
      <circle cx="35" cy="150" r="3" fill="#8b5cf6"/>
      <circle cx="50" cy="135" r="3" fill="#8b5cf6"/>
      <circle cx="65" cy="120" r="3" fill="#8b5cf6"/>
      <circle cx="80" cy="105" r="3" fill="#8b5cf6"/>
      <circle cx="95" cy="90" r="3" fill="#8b5cf6"/>
      <circle cx="110" cy="75" r="3" fill="#8b5cf6"/>
      <circle cx="125" cy="60" r="3" fill="#8b5cf6"/>
      <circle cx="140" cy="55" r="3" fill="#8b5cf6"/>
      
      <!-- Labels -->
      <text x="80" y="200" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="11">Theoretical Quantiles</text>
      <text x="-15" y="110" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="11" transform="rotate(-90, -15, 110)">Sample Quantiles</text>
    </g>
    
    <text x="110" y="270" text-anchor="middle" fill="#7c3aed" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Best for: Normality test</text>
    <text x="110" y="285" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="10">Compares to theoretical</text>
  </g>
  
  <!-- Violin Plot -->
  <g transform="translate(200, 430)">
    <rect x="0" y="0" width="270" height="280" rx="10" fill="white" stroke="#ec4899" stroke-width="2"/>
    <rect x="0" y="0" width="270" height="40" rx="10" fill="#ec4899" fill-opacity="0.8"/>
    <text x="135" y="25" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">VIOLIN PLOT</text>
    
    <!-- Violin plot -->
    <g transform="translate(50, 60)">
      <!-- Violin shape -->
      <path d="M 85 40 Q 60 60 70 80 Q 50 100 70 120 Q 60 140 85 160 Q 110 140 100 120 Q 120 100 100 80 Q 110 60 85 40" 
            fill="#ec4899" opacity="0.3" stroke="#ec4899" stroke-width="2"/>
      
      <!-- Box plot inside -->
      <rect x="75" y="90" width="20" height="40" fill="#ec4899" opacity="0.5" stroke="#ec4899" stroke-width="1"/>
      <line x1="85" y1="100" x2="85" y2="120" stroke="#374151" stroke-width="2"/>
      
      <!-- Labels -->
      <text x="85" y="180" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">Values</text>
    </g>
    
    <text x="135" y="250" text-anchor="middle" fill="#be185d" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Best for: Distribution shape + summary</text>
    <text x="135" y="265" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="10">Combines density and quartiles</text>
  </g>
  
  <!-- Correlation Heatmap -->
  <g transform="translate(500, 430)">
    <rect x="0" y="0" width="270" height="280" rx="10" fill="white" stroke="#06b6d4" stroke-width="2"/>
    <rect x="0" y="0" width="270" height="40" rx="10" fill="#06b6d4" fill-opacity="0.8"/>
    <text x="135" y="25" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">HEATMAP</text>
    
    <!-- Heatmap grid -->
    <g transform="translate(40, 60)">
      <!-- Grid cells with different colors for correlation values -->
      <rect x="0" y="0" width="40" height="40" fill="#ef4444" opacity="1"/>
      <rect x="45" y="0" width="40" height="40" fill="#3b82f6" opacity="0.5"/>
      <rect x="90" y="0" width="40" height="40" fill="#10b981" opacity="0.3"/>
      <rect x="135" y="0" width="40" height="40" fill="#f59e0b" opacity="0.7"/>
      
      <rect x="0" y="45" width="40" height="40" fill="#3b82f6" opacity="0.5"/>
      <rect x="45" y="45" width="40" height="40" fill="#ef4444" opacity="1"/>
      <rect x="90" y="45" width="40" height="40" fill="#8b5cf6" opacity="0.4"/>
      <rect x="135" y="45" width="40" height="40" fill="#06b6d4" opacity="0.6"/>
      
      <rect x="0" y="90" width="40" height="40" fill="#10b981" opacity="0.3"/>
      <rect x="45" y="90" width="40" height="40" fill="#8b5cf6" opacity="0.4"/>
      <rect x="90" y="90" width="40" height="40" fill="#ef4444" opacity="1"/>
      <rect x="135" y="90" width="40" height="40" fill="#374151" opacity="0.2"/>
      
      <rect x="0" y="135" width="40" height="40" fill="#f59e0b" opacity="0.7"/>
      <rect x="45" y="135" width="40" height="40" fill="#06b6d4" opacity="0.6"/>
      <rect x="90" y="135" width="40" height="40" fill="#374151" opacity="0.2"/>
      <rect x="135" y="135" width="40" height="40" fill="#ef4444" opacity="1"/>
      
      <!-- Grid lines -->
      <line x1="0" y1="0" x2="175" y2="0" stroke="white" stroke-width="1"/>
      <line x1="0" y1="45" x2="175" y2="45" stroke="white" stroke-width="1"/>
      <line x1="0" y1="90" x2="175" y2="90" stroke="white" stroke-width="1"/>
      <line x1="0" y1="135" x2="175" y2="135" stroke="white" stroke-width="1"/>
      <line x1="0" y1="175" x2="175" y2="175" stroke="white" stroke-width="1"/>
      
      <line x1="0" y1="0" x2="0" y2="175" stroke="white" stroke-width="1"/>
      <line x1="45" y1="0" x2="45" y2="175" stroke="white" stroke-width="1"/>
      <line x1="90" y1="0" x2="90" y2="175" stroke="white" stroke-width="1"/>
      <line x1="135" y1="0" x2="135" y2="175" stroke="white" stroke-width="1"/>
      <line x1="175" y1="0" x2="175" y2="175" stroke="white" stroke-width="1"/>
      
      <!-- Labels -->
      <text x="20" y="25" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">1</text>
      <text x="65" y="25" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">0.3</text>
      <text x="110" y="25" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">0.1</text>
      <text x="155" y="25" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">0.6</text>
    </g>
    
    <text x="135" y="250" text-anchor="middle" fill="#0891b2" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Best for: Correlation matrices</text>
    <text x="135" y="265" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="10">Shows relationship strength</text>
  </g>
  
  <!-- Selection Guide -->
  <g transform="translate(50, 740)">
    <rect x="0" y="0" width="1100" height="50" rx="10" fill="white" stroke="#6b7280" stroke-width="2"/>
    <text x="550" y="20" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Visualization Selection Guide</text>
    <text x="550" y="40" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">Distribution → Histogram/Box Plot  |  Relationships → Scatter/Heatmap  |  Normality → Q-Q Plot  |  Detailed Distribution → Violin Plot</text>
  </g>
</svg>