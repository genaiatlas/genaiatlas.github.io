<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="900" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="600" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Beer Mapper: Geometric Bisection in Preference Space
  </text>
  
  <!-- Main beer space visualization -->
  <g id="beer-space">
    <rect x="50" y="80" width="700" height="500" fill="#fff" stroke="#2c3e50" stroke-width="3" rx="10"/>
    
    <!-- Axes -->
    <line x1="400" y1="100" x2="400" y2="560" stroke="#7f8c8d" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="70" y1="330" x2="730" y2="330" stroke="#7f8c8d" stroke-width="2" stroke-dasharray="5,5"/>
    
    <!-- Axis labels -->
    <text x="400" y="75" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      ← Light                    Heavy →
    </text>
    <text x="25" y="335" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50" transform="rotate(-90 25 335)">
      ← Mild                    Hoppy →
    </text>
    
    <!-- Beer regions -->
    <!-- Light Lagers (bottom-left) -->
    <ellipse cx="200" cy="450" rx="80" ry="60" fill="#f9e79f" fill-opacity="0.3" stroke="#f39c12" stroke-width="2"/>
    <text x="200" y="455" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#d68910">
      Light Lagers
    </text>
    
    <!-- Pale Ales (top-left) -->
    <ellipse cx="220" cy="180" rx="85" ry="65" fill="#f8c471" fill-opacity="0.3" stroke="#e67e22" stroke-width="2"/>
    <text x="220" y="185" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ca6f1e">
      Pale Ales
    </text>
    
    <!-- IPAs (top-right) -->
    <ellipse cx="580" cy="160" rx="90" ry="70" fill="#f5b7b1" fill-opacity="0.3" stroke="#e74c3c" stroke-width="2"/>
    <text x="580" y="165" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#c0392b">
      IPAs
    </text>
    
    <!-- Stouts (bottom-right) -->
    <ellipse cx="580" cy="470" rx="85" ry="65" fill="#d7bde2" fill-opacity="0.3" stroke="#8e44ad" stroke-width="2"/>
    <text x="580" y="475" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#7d3c98">
      Stouts
    </text>
    
    <!-- Wheat Beers (center-left) -->
    <ellipse cx="250" cy="300" rx="70" ry="55" fill="#aed6f1" fill-opacity="0.3" stroke="#3498db" stroke-width="2"/>
    <text x="250" y="305" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#2874a6">
      Wheat
    </text>
    
    <!-- Amber Ales (center-right) -->
    <ellipse cx="530" cy="320" rx="75" ry="60" fill="#f5cba7" fill-opacity="0.3" stroke="#dc7633" stroke-width="2"/>
    <text x="530" y="325" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#af601a">
      Amber Ales
    </text>
    
    <!-- Individual beer points -->
    <!-- Beer A (IPA) -->
    <circle cx="600" cy="180" r="12" fill="#e74c3c" stroke="#2c3e50" stroke-width="2"/>
    <text x="600" y="155" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#e74c3c">
      Beer A
    </text>
    
    <!-- Beer B (Light Lager) -->
    <circle cx="180" cy="480" r="12" fill="#f39c12" stroke="#2c3e50" stroke-width="2"/>
    <text x="180" y="510" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#f39c12">
      Beer B
    </text>
    
    <!-- Dividing line between A and B -->
    <line x1="150" y1="140" x2="650" y2="520" stroke="#e74c3c" stroke-width="3" stroke-dasharray="10,5"/>
    
    <!-- Shaded region (user prefers Beer A side) -->
    <polygon points="650,520 730,560 730,100 650,140" fill="#e74c3c" fill-opacity="0.1"/>
    
    <!-- Arrow pointing to preferred region -->
    <path d="M 680 330 L 630 330" stroke="#27ae60" stroke-width="4" fill="none" marker-end="url(#arrowhead-green)"/>
    <text x="690" y="320" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#27ae60">
      Preferred
    </text>
    <text x="690" y="335" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#27ae60">
      Region
    </text>
  </g>
  
  <!-- Process Steps -->
  <g id="process-steps">
    <rect x="800" y="80" width="350" height="500" fill="#fff" stroke="#2c3e50" stroke-width="2" rx="10"/>
    
    <text x="975" y="115" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Bisection Process
    </text>
    
    <!-- Step 1 -->
    <circle cx="830" cy="160" r="20" fill="#3498db" stroke="#2c3e50" stroke-width="2"/>
    <text x="830" y="168" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">
      1
    </text>
    <text x="870" y="155" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
      <tspan x="870" dy="0" font-weight="bold">Select two beers</tspan>
      <tspan x="870" dy="18">Choose beers that split the</tspan>
      <tspan x="870" dy="16">space into equal halves</tspan>
    </text>
    
    <!-- Step 2 -->
    <circle cx="830" cy="240" r="20" fill="#9b59b6" stroke="#2c3e50" stroke-width="2"/>
    <text x="830" y="248" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">
      2
    </text>
    <text x="870" y="230" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
      <tspan x="870" dy="0" font-weight="bold">User chooses preferred</tspan>
      <tspan x="870" dy="18">"Which beer do you prefer:</tspan>
      <tspan x="870" dy="16">Beer A or Beer B?"</tspan>
    </text>
    
    <!-- Step 3 -->
    <circle cx="830" cy="320" r="20" fill="#e74c3c" stroke="#2c3e50" stroke-width="2"/>
    <text x="830" y="328" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">
      3
    </text>
    <text x="870" y="305" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
      <tspan x="870" dy="0" font-weight="bold">Eliminate half of space</tspan>
      <tspan x="870" dy="18">Remove beers on the non-</tspan>
      <tspan x="870" dy="16">preferred side of dividing line</tspan>
    </text>
    
    <!-- Step 4 -->
    <circle cx="830" cy="400" r="20" fill="#27ae60" stroke="#2c3e50" stroke-width="2"/>
    <text x="830" y="408" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">
      4
    </text>
    <text x="870" y="385" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
      <tspan x="870" dy="0" font-weight="bold">Select new pair</tspan>
      <tspan x="870" dy="18">Choose two beers from the</tspan>
      <tspan x="870" dy="16">remaining preferred region</tspan>
    </text>
    
    <!-- Step 5 -->
    <circle cx="830" cy="480" r="20" fill="#f39c12" stroke="#2c3e50" stroke-width="2"/>
    <text x="830" y="488" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">
      5
    </text>
    <text x="870" y="465" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
      <tspan x="870" dy="0" font-weight="bold">Repeat until converged</tspan>
      <tspan x="870" dy="18">Continue until favorite beer</tspan>
      <tspan x="870" dy="16">is identified</tspan>
    </text>
    
    <!-- Cycle arrow -->
    <path d="M 1120 500 Q 1150 400 1120 300" stroke="#95a5a6" stroke-width="3" fill="none" marker-end="url(#arrowhead-gray)" stroke-dasharray="8,4"/>
    <text x="1145" y="400" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">
      Loop
    </text>
  </g>
  
  <!-- Example Iteration -->
  <g id="example-iteration">
    <rect x="50" y="620" width="1100" height="240" fill="#fff" stroke="#2c3e50" stroke-width="2" rx="10"/>
    
    <text x="600" y="655" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Example: Finding Your Favorite Beer
    </text>
    
    <!-- Iteration table -->
    <text x="100" y="695" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
      Iteration
    </text>
    <text x="250" y="695" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
      Candidates Remaining
    </text>
    <text x="480" y="695" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
      Comparison
    </text>
    <text x="800" y="695" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
      User Choice
    </text>
    <text x="1000" y="695" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
      Result
    </text>
    
    <!-- Iteration 1 -->
    <rect x="80" y="710" width="1050" height="35" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
    <text x="100" y="733" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
      1
    </text>
    <text x="250" y="733" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
      1000 beers
    </text>
    <text x="480" y="733" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
      IPA vs Lager
    </text>
    <text x="800" y="733" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#e74c3c">
      IPA ✓
    </text>
    <text x="1000" y="733" font-family="Arial, sans-serif" font-size="13" fill="#555">
      Eliminate 500 beers
    </text>
    
    <!-- Iteration 2 -->
    <rect x="80" y="745" width="1050" height="35" fill="#fff" stroke="#bdc3c7" stroke-width="1"/>
    <text x="100" y="768" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
      2
    </text>
    <text x="250" y="768" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
      500 beers
    </text>
    <text x="480" y="768" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
      Pale Ale vs IPA
    </text>
    <text x="800" y="768" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#e74c3c">
      IPA ✓
    </text>
    <text x="1000" y="768" font-family="Arial, sans-serif" font-size="13" fill="#555">
      Eliminate 250 beers
    </text>
    
    <!-- Iteration 3 -->
    <rect x="80" y="780" width="1050" height="35" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
    <text x="100" y="803" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
      3
    </text>
    <text x="250" y="803" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
      250 beers
    </text>
    <text x="480" y="803" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
      Hoppy IPA vs Balanced IPA
    </text>
    <text x="800" y="803" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#e74c3c">
      Hoppy ✓
    </text>
    <text x="1000" y="803" font-family="Arial, sans-serif" font-size="13" fill="#555">
      Eliminate 125 beers
    </text>
    
    <!-- Continuation -->
    <text x="600" y="838" font-family="Arial, sans-serif" font-size="16" fill="#7f8c8d">
      ... continues until narrowed to 1 favorite beer
    </text>
  </g>
  
  <!-- Key Insights Box -->
  <g id="insights">
    <rect x="800" y="620" width="350" height="240" fill="#e8f8f5" stroke="#27ae60" stroke-width="2" rx="10"/>
    
    <text x="975" y="655" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#27ae60">
      💡 Key Insights
    </text>
    
    <text x="820" y="690" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
      <tspan x="820" dy="0">✓ Each comparison eliminates ~50%</tspan>
      <tspan x="835" dy="22">of remaining candidates</tspan>
      
      <tspan x="820" dy="35">✓ Logarithmic efficiency: 1000 beers</tspan>
      <tspan x="835" dy="22">requires only ~10 comparisons</tspan>
      
      <tspan x="820" dy="35">✓ Strategic pair selection is crucial</tspan>
      <tspan x="835" dy="22">for optimal performance</tspan>
      
      <tspan x="820" dy="35">✓ Geometric representation enables</tspan>
      <tspan x="835" dy="22">intuitive preference modeling</tspan>
    </text>
  </g>
  
  <!-- Legend -->
  <g id="legend">
    <text x="50" y="610" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#7f8c8d">
      * Beer features derived from expert ratings on RateBeer.com
    </text>
  </g>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#27ae60"/>
    </marker>
    <marker id="arrowhead-gray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#95a5a6"/>
    </marker>
  </defs>
</svg>