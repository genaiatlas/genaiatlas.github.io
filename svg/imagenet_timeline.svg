<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="450" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">ImageNet Competition: Error Rate Evolution</text>
  
  <!-- Y-axis -->
  <line x1="80" y1="60" x2="80" y2="350" stroke="#34495e" stroke-width="2"/>
  <!-- X-axis -->
  <line x1="80" y1="350" x2="720" y2="350" stroke="#34495e" stroke-width="2"/>
  
  <!-- Y-axis labels (Error Rate %) -->
  <text x="70" y="65" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">30%</text>
  <text x="70" y="110" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">25%</text>
  <text x="70" y="155" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">20%</text>
  <text x="70" y="200" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">15%</text>
  <text x="70" y="245" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">10%</text>
  <text x="70" y="290" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">5%</text>
  <text x="70" y="335" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">0%</text>
  
  <!-- Y-axis title -->
  <text x="25" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50" transform="rotate(-90, 25, 200)">Top-5 Error Rate (%)</text>
  
  <!-- X-axis labels (Years) -->
  <text x="150" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">2010</text>
  <text x="250" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">2012</text>
  <text x="350" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">2014</text>
  <text x="450" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">2016</text>
  <text x="550" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">2018</text>
  <text x="650" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">2020</text>
  
  <!-- X-axis title -->
  <text x="400" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Year</text>
  
  <!-- Grid lines -->
  <g stroke="#ecf0f1" stroke-width="1" opacity="0.7">
    <line x1="80" y1="110" x2="720" y2="110"/>
    <line x1="80" y1="155" x2="720" y2="155"/>
    <line x1="80" y1="200" x2="720" y2="200"/>
    <line x1="80" y1="245" x2="720" y2="245"/>
    <line x1="80" y1="290" x2="720" y2="290"/>
  </g>
  
  <!-- Traditional Methods Era (2010-2012) -->
  <path d="M 150 110 L 200 115 L 250 120" stroke="#e74c3c" stroke-width="4" fill="none"/>
  <circle cx="150" cy="110" r="6" fill="#e74c3c"/>
  <circle cx="200" cy="115" r="6" fill="#e74c3c"/>
  <circle cx="250" cy="120" r="6" fill="#e74c3c"/>
  
  <!-- Deep Learning Revolution (2012-2020) -->
  <path d="M 250 200 L 300 245 L 350 270 L 400 290 L 450 300 L 500 305 L 550 308 L 600 310 L 650 312" stroke="#27ae60" stroke-width="4" fill="none"/>
  <circle cx="250" cy="200" r="8" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
  <circle cx="300" cy="245" r="6" fill="#27ae60"/>
  <circle cx="350" cy="270" r="6" fill="#27ae60"/>
  <circle cx="400" cy="290" r="6" fill="#27ae60"/>
  <circle cx="450" cy="300" r="6" fill="#27ae60"/>
  <circle cx="500" cy="305" r="6" fill="#27ae60"/>
  <circle cx="550" cy="308" r="6" fill="#27ae60"/>
  <circle cx="600" cy="310" r="6" fill="#27ae60"/>
  <circle cx="650" cy="312" r="6" fill="#27ae60"/>
  
  <!-- Human Performance Line -->
  <line x1="200" y1="290" x2="650" y2="290" stroke="#9b59b6" stroke-width="3" stroke-dasharray="10,5"/>
  
  <!-- Key Milestone Annotations -->
  <!-- AlexNet 2012 -->
  <rect x="230" y="160" width="100" height="35" rx="5" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
  <text x="280" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">AlexNet 2012</text>
  <text x="280" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">~15.3% Error</text>
  <line x1="250" y1="195" x2="250" y2="200" stroke="#e67e22" stroke-width="2"/>
  
  <!-- Human Performance Label -->
  <rect x="470" y="265" width="80" height="25" rx="3" fill="#9b59b6" stroke="#8e44ad" stroke-width="1"/>
  <text x="510" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">Human Level</text>
  <text x="510" y="287" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">~5-6%</text>
  
  <!-- Current State Label -->
  <rect x="570" y="320" width="100" height="25" rx="3" fill="#27ae60" stroke="#229954" stroke-width="1"/>
  <text x="620" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">Current Best</text>
  <text x="620" y="342" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">&lt;3% Error</text>
  
  <!-- Legend -->
  <rect x="500" y="60" width="200" height="80" rx="5" fill="white" stroke="#bdc3c7" stroke-width="1"/>
  <text x="600" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Legend</text>
  
  <line x1="520" y1="95" x2="540" y2="95" stroke="#e74c3c" stroke-width="3"/>
  <text x="550" y="99" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Traditional Methods</text>
  
  <line x1="520" y1="110" x2="540" y2="110" stroke="#27ae60" stroke-width="3"/>
  <text x="550" y="114" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Deep Learning Era</text>
  
  <line x1="520" y1="125" x2="540" y2="125" stroke="#9b59b6" stroke-width="3" stroke-dasharray="5,3"/>
  <text x="550" y="129" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Human Performance</text>
  
  <!-- Dataset Info -->
  <rect x="100" y="380" width="200" height="60" rx="5" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
  <text x="200" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#2c3e50">ImageNet Dataset</text>
  <text x="200" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#34495e">1M training images</text>
  <text x="200" y="422" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#34495e">1000 categories</text>
  <text x="200" y="434" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#34495e">Top-5 accuracy metric</text>
</svg>