<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Header -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">Model Evaluation Criterion for Lead Conversion</text>
  <text x="400" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#7f8c8d">Understanding Prediction Errors and Business Impact</text>
  
  <!-- Confusion Matrix Section -->
  <text x="50" y="90" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Confusion Matrix - Prediction Outcomes</text>
  
  <!-- Matrix Grid -->
  <!-- Headers -->
  <rect x="200" y="110" width="120" height="40" fill="#34495e" stroke="#2c3e50" stroke-width="2"/>
  <text x="260" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Predicted: Convert</text>
  
  <rect x="320" y="110" width="120" height="40" fill="#34495e" stroke="#2c3e50" stroke-width="2"/>
  <text x="380" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Predicted: No Convert</text>
  
  <!-- Row Headers -->
  <rect x="50" y="150" width="150" height="40" fill="#34495e" stroke="#2c3e50" stroke-width="2"/>
  <text x="125" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Actually Converts</text>
  
  <rect x="50" y="190" width="150" height="40" fill="#34495e" stroke="#2c3e50" stroke-width="2"/>
  <text x="125" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Doesn't Convert</text>
  
  <!-- Matrix Cells -->
  <!-- True Positive -->
  <rect x="200" y="150" width="120" height="40" fill="#27ae60" stroke="#2c3e50" stroke-width="2"/>
  <text x="260" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">TRUE POSITIVE</text>
  <text x="260" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Correct Prediction</text>
  
  <!-- False Negative -->
  <rect x="320" y="150" width="120" height="40" fill="#e74c3c" stroke="#2c3e50" stroke-width="2"/>
  <text x="380" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">FALSE NEGATIVE</text>
  <text x="380" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">MISSED OPPORTUNITY</text>
  
  <!-- False Positive -->
  <rect x="200" y="190" width="120" height="40" fill="#f39c12" stroke="#2c3e50" stroke-width="2"/>
  <text x="260" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">FALSE POSITIVE</text>
  <text x="260" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Wasted Resources</text>
  
  <!-- True Negative -->
  <rect x="320" y="190" width="120" height="40" fill="#27ae60" stroke="#2c3e50" stroke-width="2"/>
  <text x="380" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">TRUE NEGATIVE</text>
  <text x="380" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Correct Prediction</text>
  
  <!-- Business Impact Section -->
  <text x="50" y="280" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Business Impact Analysis</text>
  
  <!-- False Negative Impact -->
  <rect x="50" y="300" width="300" height="120" fill="#ffeaea" stroke="#e74c3c" stroke-width="3" rx="8"/>
  <text x="200" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e74c3c">FALSE NEGATIVE (High Cost Error)</text>
  <text x="60" y="340" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">What happens: Predict "Won't Convert" but they would</text>
  <text x="60" y="360" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">• Lost potential customer</text>
  <text x="60" y="375" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">• Lost revenue opportunity ($2,000+ per customer)</text>
  <text x="60" y="390" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">• Lost lifetime value ($5,000+)</text>
  <text x="60" y="405" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">• Competitor advantage</text>
  
  <!-- False Positive Impact -->
  <rect x="380" y="300" width="300" height="120" fill="#d5f4e6" stroke="#27ae60" stroke-width="3" rx="8"/>
  <text x="530" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#27ae60">FALSE POSITIVE (Lower Cost Error)</text>
  <text x="390" y="340" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">What happens: Predict "Will Convert" but they won't</text>
  <text x="390" y="360" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">• Wasted sales efforts</text>
  <text x="390" y="375" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">• Marketing spend inefficiency ($200)</text>
  <text x="390" y="390" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">• Time investment lost ($500)</text>
  <text x="390" y="405" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">• Total cost: ~$700 per false positive</text>
  
  <!-- Cost Comparison -->
  <rect x="50" y="450" width="680" height="60" fill="#fff3cd" stroke="#ffeaa7" stroke-width="2" rx="8"/>
  <text x="400" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#856404">Cost Comparison</text>
  <text x="400" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#856404">Missing 1 converting customer ($5,000 loss) = 7x more costly than pursuing 10 false positives ($700 each)</text>
  
  <!-- Solution Section -->
  <rect x="50" y="540" width="680" height="140" fill="#e8f4fd" stroke="#3498db" stroke-width="3" rx="8"/>
  <text x="400" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Solution: Maximize RECALL</text>
  <text x="400" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">Primary Goal: Minimize False Negatives (Missed Conversions)</text>
  
  <!-- Recall Formula -->
  <rect x="200" y="600" width="400" height="40" fill="#2c3e50" rx="8"/>
  <text x="400" y="625" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">RECALL = True Positives / (True Positives + False Negatives)</text>
  
  <text x="400" y="660" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Translation: Out of all leads that actually convert, how many did we correctly identify?</text>
  
  <!-- Target Metrics -->
  <text x="50" y="720" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Target Metrics for ExtraaLearn</text>
  <text x="60" y="745" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• Primary: Recall ≥ 85% (catch 85% of converting leads)</text>
  <text x="60" y="765" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• Secondary: Precision ≥ 60% (60% of predictions are correct)</text>
  <text x="60" y="785" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• Balance: F1-Score for overall model health</text>
  
  <!-- Model Optimization Strategy -->
  <text x="50" y="825" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Model Optimization Strategy</text>
  <text x="60" y="850" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">1. Lower classification threshold (0.5 → 0.3) to catch more potential converters</text>
  <text x="60" y="870" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">2. Use class weights to penalize missing converting leads more heavily</text>
  <text x="60" y="890" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">3. Apply cost-sensitive learning with business cost ratios</text>
  
  <!-- Business Outcome -->
  <rect x="50" y="920" width="680" height="60" fill="#f0fff4" stroke="#27ae60" stroke-width="3" rx="8"/>
  <text x="400" y="945" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#27ae60">Business Outcome</text>
  <text x="400" y="965" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#27ae60">Better to pursue 10 non-converting leads than to miss 1 converting lead</text>
</svg>