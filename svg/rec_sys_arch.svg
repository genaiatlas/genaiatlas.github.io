<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="600" y="40" font-size="28" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Production Recommendation System Architecture
  </text>
  
  <!-- User Layer -->
  <rect x="50" y="80" width="1100" height="120" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="10"/>
  <text x="600" y="110" font-size="20" font-weight="bold" text-anchor="middle" fill="#1565c0">
    End Users (Millions to Billions)
  </text>
  
  <!-- User Icons -->
  <g transform="translate(200, 130)">
    <circle cx="0" cy="0" r="25" fill="#42a5f5"/>
    <circle cx="0" cy="-15" r="12" fill="#fff"/>
    <path d="M -20,10 Q -20,0 0,0 Q 20,0 20,10" fill="#fff"/>
  </g>
  <g transform="translate(400, 130)">
    <circle cx="0" cy="0" r="25" fill="#42a5f5"/>
    <circle cx="0" cy="-15" r="12" fill="#fff"/>
    <path d="M -20,10 Q -20,0 0,0 Q 20,0 20,10" fill="#fff"/>
  </g>
  <g transform="translate(600, 130)">
    <circle cx="0" cy="0" r="25" fill="#42a5f5"/>
    <circle cx="0" cy="-15" r="12" fill="#fff"/>
    <path d="M -20,10 Q -20,0 0,0 Q 20,0 20,10" fill="#fff"/>
  </g>
  <g transform="translate(800, 130)">
    <circle cx="0" cy="0" r="25" fill="#42a5f5"/>
    <circle cx="0" cy="-15" r="12" fill="#fff"/>
    <path d="M -20,10 Q -20,0 0,0 Q 20,0 20,10" fill="#fff"/>
  </g>
  <g transform="translate(1000, 130)">
    <circle cx="0" cy="0" r="25" fill="#42a5f5"/>
    <circle cx="0" cy="-15" r="12" fill="#fff"/>
    <path d="M -20,10 Q -20,0 0,0 Q 20,0 20,10" fill="#fff"/>
  </g>
  
  <!-- Arrows down to Sensing Platform -->
  <path d="M 600,200 L 600,250" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Sensing Platform -->
  <rect x="150" y="250" width="900" height="140" fill="#fff3e0" stroke="#f57c00" stroke-width="3" rx="10"/>
  <text x="600" y="285" font-size="22" font-weight="bold" text-anchor="middle" fill="#e65100">
    Sensing Platform: APIs &amp; Load Balancers
  </text>
  
  <!-- API Components -->
  <rect x="200" y="305" width="180" height="70" fill="#ffb74d" stroke="#f57c00" stroke-width="2" rx="5"/>
  <text x="290" y="330" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">Web API</text>
  <text x="290" y="350" font-size="12" text-anchor="middle" fill="#fff">RESTful/GraphQL</text>
  <text x="290" y="365" font-size="11" text-anchor="middle" fill="#fff">100k+ req/sec</text>
  
  <rect x="420" y="305" width="180" height="70" fill="#ffb74d" stroke="#f57c00" stroke-width="2" rx="5"/>
  <text x="510" y="330" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">Mobile API</text>
  <text x="510" y="350" font-size="12" text-anchor="middle" fill="#fff">iOS/Android</text>
  <text x="510" y="365" font-size="11" text-anchor="middle" fill="#fff">Real-time updates</text>
  
  <rect x="640" y="305" width="180" height="70" fill="#ffb74d" stroke="#f57c00" stroke-width="2" rx="5"/>
  <text x="730" y="330" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">Load Balancer</text>
  <text x="730" y="350" font-size="12" text-anchor="middle" fill="#fff">Traffic Distribution</text>
  <text x="730" y="365" font-size="11" text-anchor="middle" fill="#fff">Fault Tolerance</text>
  
  <rect x="860" y="305" width="160" height="70" fill="#ffb74d" stroke="#f57c00" stroke-width="2" rx="5"/>
  <text x="940" y="330" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">UI Interface</text>
  <text x="940" y="350" font-size="12" text-anchor="middle" fill="#fff">JavaScript</text>
  <text x="940" y="365" font-size="11" text-anchor="middle" fill="#fff">React/Vue/Angular</text>
  
  <!-- Arrows to Storage Layer -->
  <path d="M 300,390 L 300,450" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 600,390 L 600,450" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 900,390 L 900,450" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Storage & Computation Infrastructure -->
  <rect x="150" y="450" width="900" height="180" fill="#e8f5e9" stroke="#388e3c" stroke-width="3" rx="10"/>
  <text x="600" y="485" font-size="22" font-weight="bold" text-anchor="middle" fill="#2e7d32">
    Storage &amp; Computation Infrastructure
  </text>
  
  <!-- Storage Components -->
  <rect x="180" y="505" width="150" height="110" fill="#66bb6a" stroke="#388e3c" stroke-width="2" rx="5"/>
  <text x="255" y="530" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">Kafka</text>
  <text x="255" y="550" font-size="11" text-anchor="middle" fill="#fff">Pub-Sub</text>
  <text x="255" y="565" font-size="11" text-anchor="middle" fill="#fff">Real-time</text>
  <text x="255" y="580" font-size="11" text-anchor="middle" fill="#fff">Streaming</text>
  <text x="255" y="595" font-size="11" text-anchor="middle" fill="#fff">High Volume</text>
  
  <rect x="350" y="505" width="150" height="110" fill="#66bb6a" stroke="#388e3c" stroke-width="2" rx="5"/>
  <text x="425" y="530" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">HDFS</text>
  <text x="425" y="550" font-size="11" text-anchor="middle" fill="#fff">Distributed</text>
  <text x="425" y="565" font-size="11" text-anchor="middle" fill="#fff">File System</text>
  <text x="425" y="580" font-size="11" text-anchor="middle" fill="#fff">Parquet Format</text>
  <text x="425" y="595" font-size="11" text-anchor="middle" fill="#fff">Archival</text>
  
  <rect x="520" y="505" width="150" height="110" fill="#66bb6a" stroke="#388e3c" stroke-width="2" rx="5"/>
  <text x="595" y="530" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">Cassandra</text>
  <text x="595" y="550" font-size="11" text-anchor="middle" fill="#fff">NoSQL DB</text>
  <text x="595" y="565" font-size="11" text-anchor="middle" fill="#fff">Random Access</text>
  <text x="595" y="580" font-size="11" text-anchor="middle" fill="#fff">Low Latency</text>
  <text x="595" y="595" font-size="11" text-anchor="middle" fill="#fff">High Availability</text>
  
  <rect x="690" y="505" width="150" height="110" fill="#66bb6a" stroke="#388e3c" stroke-width="2" rx="5"/>
  <text x="765" y="530" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">Spark SQL</text>
  <text x="765" y="550" font-size="11" text-anchor="middle" fill="#fff">Structured</text>
  <text x="765" y="565" font-size="11" text-anchor="middle" fill="#fff">Queries</text>
  <text x="765" y="580" font-size="11" text-anchor="middle" fill="#fff">Analytics</text>
  <text x="765" y="595" font-size="11" text-anchor="middle" fill="#fff">Distributed</text>
  
  <rect x="860" y="505" width="160" height="110" fill="#66bb6a" stroke="#388e3c" stroke-width="2" rx="5"/>
  <text x="940" y="530" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">Spark/Hadoop</text>
  <text x="940" y="550" font-size="11" text-anchor="middle" fill="#fff">MapReduce</text>
  <text x="940" y="565" font-size="11" text-anchor="middle" fill="#fff">Parallel</text>
  <text x="940" y="580" font-size="11" text-anchor="middle" fill="#fff">Processing</text>
  <text x="940" y="595" font-size="11" text-anchor="middle" fill="#fff">Scalable</text>
  
  <!-- Arrows to Intelligence Layer -->
  <path d="M 300,630 L 300,680" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 600,630 L 600,680" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 900,630 L 900,680" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Intelligence Processing Layer -->
  <rect x="150" y="680" width="900" height="100" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="3" rx="10"/>
  <text x="600" y="715" font-size="22" font-weight="bold" text-anchor="middle" fill="#6a1b9a">
    Intelligence Processing Algorithms
  </text>
  
  <!-- Algorithm Components -->
  <rect x="200" y="735" width="180" height="30" fill="#ab47bc" stroke="#7b1fa2" stroke-width="2" rx="5"/>
  <text x="290" y="755" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">Collaborative Filtering</text>
  
  <rect x="410" y="735" width="180" height="30" fill="#ab47bc" stroke="#7b1fa2" stroke-width="2" rx="5"/>
  <text x="500" y="755" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">Matrix Factorization</text>
  
  <rect x="620" y="735" width="180" height="30" fill="#ab47bc" stroke="#7b1fa2" stroke-width="2" rx="5"/>
  <text x="710" y="755" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">Neural Networks</text>
  
  <rect x="830" y="735" width="180" height="30" fill="#ab47bc" stroke="#7b1fa2" stroke-width="2" rx="5"/>
  <text x="920" y="755" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">Ensemble Methods</text>
  
  <!-- Feedback Loop -->
  <path d="M 1050,340 Q 1120,400 1120,560 Q 1120,680 1050,720" stroke="#d32f2f" stroke-width="3" fill="none" marker-end="url(#arrowhead-red)" stroke-dasharray="8,4"/>
  <text x="1135" y="540" font-size="14" font-weight="bold" fill="#d32f2f">Feedback</text>
  <text x="1135" y="560" font-size="14" font-weight="bold" fill="#d32f2f">Loop</text>
  
  <path d="M 1050,720 Q 1120,620 1120,480 Q 1120,360 1050,340" stroke="#d32f2f" stroke-width="3" fill="none" marker-end="url(#arrowhead-red)" stroke-dasharray="8,4"/>
  
  <!-- Arrow definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#d32f2f"/>
    </marker>
  </defs>
</svg>