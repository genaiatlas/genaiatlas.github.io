<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0fdf4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dcfce7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="rangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="iqrGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="stdGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="700" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" fill="#065f46" font-family="Arial, sans-serif" font-size="28" font-weight="bold">Measures of Variability</text>
  <text x="500" y="65" text-anchor="middle" fill="#065f46" font-family="Arial, sans-serif" font-size="16">How Spread Out Is Your Data?</text>
  
  <!-- Box Plot Visualization -->
  <g transform="translate(100, 120)">
    <text x="400" y="-10" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Box Plot: Visualizing Variability</text>
    
    <!-- Number line -->
    <line x1="0" y1="100" x2="800" y2="100" stroke="#374151" stroke-width="2"/>
    
    <!-- Scale marks and labels -->
    <g>
      <line x1="50" y1="95" x2="50" y2="105" stroke="#374151" stroke-width="1"/>
      <text x="50" y="120" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">0</text>
      
      <line x1="150" y1="95" x2="150" y2="105" stroke="#374151" stroke-width="1"/>
      <text x="150" y="120" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">2</text>
      
      <line x1="250" y1="95" x2="250" y2="105" stroke="#374151" stroke-width="1"/>
      <text x="250" y="120" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">4</text>
      
      <line x1="350" y1="95" x2="350" y2="105" stroke="#374151" stroke-width="1"/>
      <text x="350" y="120" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">6</text>
      
      <line x1="450" y1="95" x2="450" y2="105" stroke="#374151" stroke-width="1"/>
      <text x="450" y="120" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">8</text>
      
      <line x1="550" y1="95" x2="550" y2="105" stroke="#374151" stroke-width="1"/>
      <text x="550" y="120" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">10</text>
      
      <line x1="650" y1="95" x2="650" y2="105" stroke="#374151" stroke-width="1"/>
      <text x="650" y="120" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">12</text>
      
      <line x1="750" y1="95" x2="750" y2="105" stroke="#374151" stroke-width="1"/>
      <text x="750" y="120" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">14</text>
    </g>
    
    <!-- Range indicator -->
    <line x1="150" y1="60" x2="650" y2="60" stroke="#ef4444" stroke-width="4"/>
    <circle cx="150" cy="60" r="4" fill="#ef4444"/>
    <circle cx="650" cy="60" r="4" fill="#ef4444"/>
    <text x="400" y="45" text-anchor="middle" fill="#dc2626" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Range = 12 - 2 = 10</text>
    <text x="130" y="55" text-anchor="middle" fill="#dc2626" font-family="Arial, sans-serif" font-size="10">Min</text>
    <text x="670" y="55" text-anchor="middle" fill="#dc2626" font-family="Arial, sans-serif" font-size="10">Max</text>
    
    <!-- Box plot elements -->
    <!-- Left whisker -->
    <line x1="150" y1="100" x2="225" y2="100" stroke="#374151" stroke-width="2"/>
    <line x1="225" y1="90" x2="225" y2="110" stroke="#374151" stroke-width="2"/>
    
    <!-- Box (IQR) -->
    <rect x="225" y="80" width="250" height="40" fill="#93c5fd" fill-opacity="0.5" stroke="#1d4ed8" stroke-width="2"/>
    
    <!-- Median line -->
    <line x1="350" y1="80" x2="350" y2="120" stroke="#374151" stroke-width="3"/>
    
    <!-- Right whisker -->
    <line x1="475" y1="100" x2="575" y2="100" stroke="#374151" stroke-width="2"/>
    <line x1="575" y1="90" x2="575" y2="110" stroke="#374151" stroke-width="2"/>
    
    <!-- Outliers -->
    <circle cx="650" cy="100" r="3" fill="#f59e0b"/>
    
    <!-- IQR labels -->
    <text x="300" y="75" text-anchor="middle" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="11" font-weight="bold">IQR</text>
    <text x="225" y="140" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="10">Q1</text>
    <text x="350" y="140" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="10">Q2 (Median)</text>
    <text x="475" y="140" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="10">Q3</text>
    <text x="650" y="140" text-anchor="middle" fill="#f59e0b" font-family="Arial, sans-serif" font-size="10">Outlier</text>
  </g>
  
  <!-- Standard Deviation Visualization -->
  <g transform="translate(100, 280)">
    <text x="400" y="-10" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Standard Deviation: Distance from Mean</text>
    
    <!-- Normal curve approximation -->
    <path d="M 50 120 Q 200 40 350 50 Q 450 45 550 50 Q 700 40 750 120" 
          fill="none" stroke="#10b981" stroke-width="3" opacity="0.7"/>
    
    <!-- Mean line -->
    <line x1="400" y1="40" x2="400" y2="130" stroke="#374151" stroke-width="3"/>
    <text x="400" y="35" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12" font-weight="bold">μ</text>
    
    <!-- Standard deviation intervals -->
    <!-- -2σ to +2σ -->
    <line x1="200" y1="120" x2="600" y2="120" stroke="#10b981" stroke-width="2" opacity="0.5"/>
    <text x="200" y="135" text-anchor="middle" fill="#059669" font-family="Arial, sans-serif" font-size="10">μ-2σ</text>
    <text x="600" y="135" text-anchor="middle" fill="#059669" font-family="Arial, sans-serif" font-size="10">μ+2σ</text>
    
    <!-- -1σ to +1σ -->
    <line x1="300" y1="110" x2="500" y2="110" stroke="#10b981" stroke-width="3"/>
    <text x="300" y="150" text-anchor="middle" fill="#059669" font-family="Arial, sans-serif" font-size="10">μ-σ</text>
    <text x="500" y="150" text-anchor="middle" fill="#059669" font-family="Arial, sans-serif" font-size="10">μ+σ</text>
    
    <!-- Percentages -->
    <text x="400" y="100" text-anchor="middle" fill="#065f46" font-family="Arial, sans-serif" font-size="11" font-weight="bold">68%</text>
    <text x="400" y="125" text-anchor="middle" fill="#065f46" font-family="Arial, sans-serif" font-size="11" font-weight="bold">95%</text>
  </g>
  
  <!-- Measures Cards -->
  <g transform="translate(50, 430)">
    <!-- Range Card -->
    <rect x="0" y="0" width="220" height="220" rx="10" fill="white" stroke="#ef4444" stroke-width="2"/>
    <rect x="0" y="0" width="220" height="40" rx="10" fill="url(#rangeGrad)"/>
    <text x="110" y="25" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">RANGE</text>
    
    <text x="15" y="65" fill="#dc2626" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Formula:</text>
    <text x="15" y="85" fill="#374151" font-family="Arial, sans-serif" font-size="12">Range = Max - Min</text>
    
    <text x="15" y="110" fill="#dc2626" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Properties:</text>
    <text x="15" y="125" fill="#374151" font-family="Arial, sans-serif" font-size="11">• Simple to calculate</text>
    <text x="15" y="140" fill="#374151" font-family="Arial, sans-serif" font-size="11">• Uses only 2 data points</text>
    <text x="15" y="155" fill="#374151" font-family="Arial, sans-serif" font-size="11">• Very sensitive to outliers</text>
    <text x="15" y="170" fill="#374151" font-family="Arial, sans-serif" font-size="11">• Easy to interpret</text>
    
    <text x="15" y="195" fill="#dc2626" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Best for:</text>
    <text x="15" y="210" fill="#374151" font-family="Arial, sans-serif" font-size="11">• Quick assessments</text>
    
    <!-- IQR Card -->
    <rect x="240" y="0" width="220" height="220" rx="10" fill="white" stroke="#3b82f6" stroke-width="2"/>
    <rect x="240" y="0" width="220" height="40" rx="10" fill="url(#iqrGrad)"/>
    <text x="350" y="25" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">IQR</text>
    
    <text x="255" y="65" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Formula:</text>
    <text x="255" y="85" fill="#374151" font-family="Arial, sans-serif" font-size="12">IQR = Q3 - Q1</text>
    
    <text x="255" y="110" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Properties:</text>
    <text x="255" y="125" fill="#374151" font-family="Arial, sans-serif" font-size="11">• Robust to outliers</text>
    <text x="255" y="140" fill="#374151" font-family="Arial, sans-serif" font-size="11">• Focuses on middle 50%</text>
    <text x="255" y="155" fill="#374151" font-family="Arial, sans-serif" font-size="11">• Used in box plots</text>
    <text x="255" y="170" fill="#374151" font-family="Arial, sans-serif" font-size="11">• Outlier detection</text>
    
    <text x="255" y="195" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Best for:</text>
    <text x="255" y="210" fill="#374151" font-family="Arial, sans-serif" font-size="11">• Skewed distributions</text>
    
    <!-- Standard Deviation Card -->
    <rect x="480" y="0" width="220" height="220" rx="10" fill="white" stroke="#10b981" stroke-width="2"/>
    <rect x="480" y="0" width="220" height="40" rx="10" fill="url(#stdGrad)"/>
    <text x="590" y="25" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">STD DEVIATION</text>
    
    <text x="495" y="65" fill="#059669" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Formula:</text>
    <text x="495" y="85" fill="#374151" font-family="Arial, sans-serif" font-size="11">σ = √(Σ(x-μ)²/N)</text>
    
    <text x="495" y="110" fill="#059669" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Properties:</text>
    <text x="495" y="125" fill="#374151" font-family="Arial, sans-serif" font-size="11">• Uses all data points</text>
    <text x="495" y="140" fill="#374151" font-family="Arial, sans-serif" font-size="11">• Same units as data</text>
    <text x="495" y="155" fill="#374151" font-family="Arial, sans-serif" font-size="11">• Related to normal dist.</text>
    <text x="495" y="170" fill="#374151" font-family="Arial, sans-serif" font-size="11">• Foundation for inference</text>
    
    <text x="495" y="195" fill="#059669" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Best for:</text>
    <text x="495" y="210" fill="#374151" font-family="Arial, sans-serif" font-size="11">• Normal distributions</text>
    
    <!-- Coefficient of Variation Card -->
    <rect x="720" y="0" width="220" height="220" rx="10" fill="white" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="720" y="0" width="220" height="40" rx="10" fill="#8b5cf6" fill-opacity="0.8"/>
    <text x="830" y="25" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">CV</text>
    
    <text x="735" y="65" fill="#7c3aed" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Formula:</text>
    <text x="735" y="85" fill="#374151" font-family="Arial, sans-serif" font-size="12">CV = (σ/μ) × 100%</text>
    
    <text x="735" y="110" fill="#7c3aed" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Properties:</text>
    <text x="735" y="125" fill="#374151" font-family="Arial, sans-serif" font-size="11">• Unitless measure</text>
    <text x="735" y="140" fill="#374151" font-family="Arial, sans-serif" font-size="11">• Relative variability</text>
    <text x="735" y="155" fill="#374151" font-family="Arial, sans-serif" font-size="11">• Enables comparison</text>
    <text x="735" y="170" fill="#374151" font-family="Arial, sans-serif" font-size="11">• Scale independent</text>
    
    <text x="735" y="195" fill="#7c3aed" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Best for:</text>
    <text x="735" y="210" fill="#374151" font-family="Arial, sans-serif" font-size="11">• Different scales</text>
  </g>
</svg>