<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="processGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="articleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f3f4f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e5e7eb;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1f2937">
    Spectral Clustering Process for News Article Classification
  </text>
  
  <!-- Step 1: News Articles -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="120" height="100" rx="8" fill="url(#articleGrad)" stroke="#6b7280" stroke-width="2"/>
    <text x="60" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#374151">News Articles</text>
    <text x="60" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">60 articles from:</text>
    <text x="60" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">Guardian, BBC</text>
    <text x="60" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">Independent, CNN</text>
  </g>
  
  <!-- Arrow 1 -->
  <path d="M 190 130 L 230 130" stroke="#3b82f6" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Step 2: Entity Extraction -->
  <g transform="translate(250, 80)">
    <rect x="0" y="0" width="120" height="100" rx="8" fill="url(#processGrad)" stroke="#1d4ed8" stroke-width="2"/>
    <text x="60" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Entity</text>
    <text x="60" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Extraction</text>
    <text x="60" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#dbeafe">PERSON, ORG</text>
    <text x="60" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#dbeafe">LOCATION</text>
  </g>
  
  <!-- Arrow 2 -->
  <path d="M 390 130 L 430 130" stroke="#3b82f6" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Step 3: TF-IDF Vectorization -->
  <g transform="translate(450, 80)">
    <rect x="0" y="0" width="120" height="100" rx="8" fill="url(#processGrad)" stroke="#1d4ed8" stroke-width="2"/>
    <text x="60" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">TF-IDF</text>
    <text x="60" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Vectors</text>
    <text x="60" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#dbeafe">1063 dimensions</text>
    <text x="60" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#dbeafe">per article</text>
  </g>
  
  <!-- Arrow 3 -->
  <path d="M 590 130 L 630 130" stroke="#3b82f6" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Step 4: Similarity Graph -->
  <g transform="translate(650, 80)">
    <rect x="0" y="0" width="120" height="100" rx="8" fill="url(#processGrad)" stroke="#1d4ed8" stroke-width="2"/>
    <text x="60" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Similarity</text>
    <text x="60" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Graph</text>
    <text x="60" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#dbeafe">k-NN (k=10)</text>
    <text x="60" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#dbeafe">connections</text>
  </g>
  
  <!-- Arrow 4 (downward) -->
  <path d="M 710 200 L 710 240" stroke="#3b82f6" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Step 5: Laplacian Eigendecomposition -->
  <g transform="translate(650, 260)">
    <rect x="0" y="0" width="120" height="100" rx="8" fill="url(#processGrad)" stroke="#1d4ed8" stroke-width="2"/>
    <text x="60" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Laplacian</text>
    <text x="60" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Eigenvectors</text>
    <text x="60" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#dbeafe">L = D - W</text>
    <text x="60" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#dbeafe">Spectral embedding</text>
  </g>
  
  <!-- Arrow 5 (leftward) -->
  <path d="M 630 310 L 590 310" stroke="#3b82f6" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Step 6: K-means Clustering -->
  <g transform="translate(450, 260)">
    <rect x="0" y="0" width="120" height="100" rx="8" fill="url(#processGrad)" stroke="#1d4ed8" stroke-width="2"/>
    <text x="60" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">K-means</text>
    <text x="60" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Clustering</text>
    <text x="60" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#dbeafe">7 clusters</text>
    <text x="60" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#dbeafe">identified</text>
  </g>
  
  <!-- Arrow 6 (leftward) -->
  <path d="M 430 310 L 390 310" stroke="#3b82f6" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Step 7: Final Clusters -->
  <g transform="translate(250, 260)">
    <rect x="0" y="0" width="120" height="100" rx="8" fill="#10b981" stroke="#059669" stroke-width="2"/>
    <text x="60" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Topic</text>
    <text x="60" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Clusters</text>
    <text x="60" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#d1fae5">Brexit, USA</text>
    <text x="60" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#d1fae5">Middle East, etc.</text>
  </g>
  
  <!-- Mathematical Formulas -->
  <g transform="translate(50, 420)">
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#374151">Key Mathematical Components:</text>
    
    <!-- TF-IDF Formula -->
    <text x="0" y="50" font-family="Arial, sans-serif" font-size="14" fill="#374151">1. TF-IDF:</text>
    <text x="100" y="50" font-family="monospace" font-size="14" fill="#1f2937">TF-IDF(t,d) = (count(t,d) / |entities(d)|) × (1 / df(t))</text>
    
    <!-- Similarity Formula -->
    <text x="0" y="80" font-family="Arial, sans-serif" font-size="14" fill="#374151">2. Similarity:</text>
    <text x="100" y="80" font-family="monospace" font-size="14" fill="#1f2937">sim(A₁,A₂) = exp(-Σ(x₁ⱼ - x₂ⱼ)²)</text>
    
    <!-- Laplacian Formula -->
    <text x="0" y="110" font-family="Arial, sans-serif" font-size="14" fill="#374151">3. Laplacian:</text>
    <text x="100" y="110" font-family="monospace" font-size="14" fill="#1f2937">L = D - W (D = degree matrix, W = adjacency)</text>
  </g>
  
  <!-- Result Summary -->
  <g transform="translate(550, 420)">
    <rect x="0" y="0" width="400" height="140" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <text x="200" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">Results Summary</text>
    
    <text x="20" y="50" font-family="Arial, sans-serif" font-size="13" fill="#334155">✓ Successfully identified 7 distinct topic clusters</text>
    <text x="20" y="70" font-family="Arial, sans-serif" font-size="13" fill="#334155">✓ High correspondence with original news tags</text>
    <text x="20" y="90" font-family="Arial, sans-serif" font-size="13" fill="#334155">✓ Clear spatial separation in 2D embedding</text>
    <text x="20" y="110" font-family="Arial, sans-serif" font-size="13" fill="#334155">✓ Cross-topic articles positioned appropriately</text>
  </g>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
     refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6" />
    </marker>
  </defs>
</svg>