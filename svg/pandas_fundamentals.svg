<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="675" fill="#f8fafc"/>
  
  <!-- Fast Track Ribbon -->
  <polygon points="1050,0 1200,0 1200,80 1050,60" fill="#3b82f6"/>
  <text x="1125" y="35" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">FAST TRACK</text>
  
  <!-- Title -->
  <text x="600" y="80" text-anchor="middle" fill="#1e293b" font-family="Arial, sans-serif" font-size="36" font-weight="bold">Pandas Fundamentals</text>
  
  <!-- Core Data Structures -->
  <rect x="80" y="120" width="540" height="180" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="12"/>
  <text x="350" y="150" text-anchor="middle" fill="#1e293b" font-family="Arial, sans-serif" font-size="24" font-weight="bold">Core Data Structures</text>
  
  <!-- Series -->
  <rect x="120" y="170" width="220" height="110" fill="#f0f9ff" stroke="#0284c7" stroke-width="2" rx="8"/>
  <text x="230" y="195" text-anchor="middle" fill="#0284c7" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Series (1D)</text>
  <rect x="140" y="210" width="180" height="60" fill="#ffffff" stroke="#d1d5db" stroke-width="1" rx="4"/>
  <text x="150" y="230" fill="#374151" font-family="Courier, monospace" font-size="12">s = pd.Series([1,2,3])</text>
  <text x="150" y="250" fill="#6b7280" font-family="Courier, monospace" font-size="11">0    1</text>
  <text x="150" y="263" fill="#6b7280" font-family="Courier, monospace" font-size="11">1    2</text>
  
  <!-- DataFrame -->
  <rect x="360" y="170" width="220" height="110" fill="#ecfdf5" stroke="#059669" stroke-width="2" rx="8"/>
  <text x="470" y="195" text-anchor="middle" fill="#059669" font-family="Arial, sans-serif" font-size="18" font-weight="bold">DataFrame (2D)</text>
  <rect x="380" y="210" width="180" height="60" fill="#ffffff" stroke="#d1d5db" stroke-width="1" rx="4"/>
  <text x="390" y="230" fill="#374151" font-family="Courier, monospace" font-size="11">df = pd.DataFrame(data)</text>
  <text x="390" y="250" fill="#6b7280" font-family="Courier, monospace" font-size="10">   Name  Age</text>
  <text x="390" y="263" fill="#6b7280" font-family="Courier, monospace" font-size="10">0  Alice  25</text>
  
  <!-- DataFrame Visual -->
  <rect x="660" y="120" width="500" height="180" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="12"/>
  <text x="910" y="150" text-anchor="middle" fill="#1e293b" font-family="Arial, sans-serif" font-size="24" font-weight="bold">DataFrame Structure</text>
  
  <!-- Table representation -->
  <rect x="700" y="170" width="420" height="110" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" rx="4"/>
  
  <!-- Header -->
  <rect x="700" y="170" width="420" height="25" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="720" y="187" fill="#374151" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Index</text>
  <text x="810" y="187" fill="#374151" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Name</text>
  <text x="920" y="187" fill="#374151" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Age</text>
  <text x="1020" y="187" fill="#374151" font-family="Arial, sans-serif" font-size="12" font-weight="bold">City</text>
  
  <!-- Rows -->
  <text x="720" y="212" fill="#6b7280" font-family="Arial, sans-serif" font-size="12">0</text>
  <text x="810" y="212" fill="#374151" font-family="Arial, sans-serif" font-size="12">Alice</text>
  <text x="920" y="212" fill="#374151" font-family="Arial, sans-serif" font-size="12">25</text>
  <text x="1020" y="212" fill="#374151" font-family="Arial, sans-serif" font-size="12">NYC</text>
  
  <text x="720" y="237" fill="#6b7280" font-family="Arial, sans-serif" font-size="12">1</text>
  <text x="810" y="237" fill="#374151" font-family="Arial, sans-serif" font-size="12">Bob</text>
  <text x="920" y="237" fill="#374151" font-family="Arial, sans-serif" font-size="12">30</text>
  <text x="1020" y="237" fill="#374151" font-family="Arial, sans-serif" font-size="12">LA</text>
  
  <text x="720" y="262" fill="#6b7280" font-family="Arial, sans-serif" font-size="12">2</text>
  <text x="810" y="262" fill="#374151" font-family="Arial, sans-serif" font-size="12">Carol</text>
  <text x="920" y="262" fill="#374151" font-family="Arial, sans-serif" font-size="12">35</text>
  <text x="1020" y="262" fill="#374151" font-family="Arial, sans-serif" font-size="12">Chicago</text>
  
  <!-- Essential Operations -->
  <rect x="80" y="320" width="280" height="160" fill="#fef3c7" stroke="#d97706" stroke-width="2" rx="8"/>
  <text x="220" y="350" text-anchor="middle" fill="#d97706" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Data Inspection</text>
  <rect x="110" y="365" width="220" height="105" fill="#ffffff" stroke="#d1d5db" stroke-width="1" rx="4"/>
  <text x="120" y="385" fill="#374151" font-family="Courier, monospace" font-size="12">df.head()     # First 5</text>
  <text x="120" y="405" fill="#374151" font-family="Courier, monospace" font-size="12">df.info()     # Data types</text>
  <text x="120" y="425" fill="#374151" font-family="Courier, monospace" font-size="12">df.describe() # Statistics</text>
  <text x="120" y="445" fill="#374151" font-family="Courier, monospace" font-size="12">df.shape      # (rows, cols)</text>
  <text x="120" y="465" fill="#374151" font-family="Courier, monospace" font-size="12">df.columns    # Column names</text>
  
  <!-- Data Selection -->
  <rect x="380" y="320" width="280" height="160" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" rx="8"/>
  <text x="520" y="350" text-anchor="middle" fill="#0284c7" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Data Selection</text>
  <rect x="410" y="365" width="220" height="105" fill="#ffffff" stroke="#d1d5db" stroke-width="1" rx="4"/>
  <text x="420" y="385" fill="#374151" font-family="Courier, monospace" font-size="12">df['Name']    # Column</text>
  <text x="420" y="405" fill="#374151" font-family="Courier, monospace" font-size="12">df.loc[0]     # Row by label</text>
  <text x="420" y="425" fill="#374151" font-family="Courier, monospace" font-size="12">df.iloc[0]    # Row by position</text>
  <text x="420" y="445" fill="#374151" font-family="Courier, monospace" font-size="12">df[df.Age>25] # Filter</text>
  <text x="420" y="465" fill="#374151" font-family="Courier, monospace" font-size="12">df[['Name','Age']] # Multi-col</text>
  
  <!-- Data Manipulation -->
  <rect x="680" y="320" width="280" height="160" fill="#fce7f3" stroke="#db2777" stroke-width="2" rx="8"/>
  <text x="820" y="350" text-anchor="middle" fill="#db2777" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Data Manipulation</text>
  <rect x="710" y="365" width="220" height="105" fill="#ffffff" stroke="#d1d5db" stroke-width="1" rx="4"/>
  <text x="720" y="385" fill="#374151" font-family="Courier, monospace" font-size="12">df.groupby('City') # Group</text>
  <text x="720" y="405" fill="#374151" font-family="Courier, monospace" font-size="12">df.sort_values('Age') # Sort</text>
  <text x="720" y="425" fill="#374151" font-family="Courier, monospace" font-size="12">df.drop_duplicates() # Unique</text>
  <text x="720" y="445" fill="#374151" font-family="Courier, monospace" font-size="12">df.fillna(0)  # Handle NaN</text>
  <text x="720" y="465" fill="#374151" font-family="Courier, monospace" font-size="12">df.merge(df2) # Join tables</text>
  
  <!-- Reading Data -->
  <rect x="980" y="320" width="180" height="160" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" rx="8"/>
  <text x="1070" y="350" text-anchor="middle" fill="#16a34a" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Reading Data</text>
  <rect x="1000" y="365" width="140" height="105" fill="#ffffff" stroke="#d1d5db" stroke-width="1" rx="4"/>
  <text x="1010" y="385" fill="#374151" font-family="Courier, monospace" font-size="10">pd.read_csv()</text>
  <text x="1010" y="405" fill="#374151" font-family="Courier, monospace" font-size="10">pd.read_excel()</text>
  <text x="1010" y="425" fill="#374151" font-family="Courier, monospace" font-size="10">pd.read_json()</text>
  <text x="1010" y="445" fill="#374151" font-family="Courier, monospace" font-size="10">pd.read_sql()</text>
  <text x="1010" y="465" fill="#374151" font-family="Courier, monospace" font-size="10">pd.read_html()</text>
  
  <!-- Key Benefits -->
  <rect x="150" y="510" width="900" height="120" fill="#f1f5f9" stroke="#64748b" stroke-width="1" rx="12"/>
  <text x="600" y="540" text-anchor="middle" fill="#1e293b" font-family="Arial, sans-serif" font-size="20" font-weight="bold">Why Pandas?</text>
  
  <!-- Benefit boxes -->
  <rect x="200" y="560" width="160" height="50" fill="#dbeafe" stroke="#3b82f6" stroke-width="1" rx="6"/>
  <text x="280" y="580" text-anchor="middle" fill="#1e40af" font-family="Arial, sans-serif" font-size="12" font-weight="bold">📊 Data Analysis</text>
  <text x="280" y="595" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="10">Excel-like operations</text>
  
  <rect x="380" y="560" width="160" height="50" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="6"/>
  <text x="460" y="580" text-anchor="middle" fill="#15803d" font-family="Arial, sans-serif" font-size="12" font-weight="bold">🔧 Data Cleaning</text>
  <text x="460" y="595" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="10">Handle missing values</text>
  
  <rect x="560" y="560" width="160" height="50" fill="#fef3c7" stroke="#d97706" stroke-width="1" rx="6"/>
  <text x="640" y="580" text-anchor="middle" fill="#b45309" font-family="Arial, sans-serif" font-size="12" font-weight="bold">📈 Time Series</text>
  <text x="640" y="595" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="10">Powerful date handling</text>
  
  <rect x="740" y="560" width="160" height="50" fill="#fce7f3" stroke="#db2777" stroke-width="1" rx="6"/>
  <text x="820" y="580" text-anchor="middle" fill="#be185d" font-family="Arial, sans-serif" font-size="12" font-weight="bold">💾 File I/O</text>
  <text x="820" y="595" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="10">Read/write any format</text>
</svg>