<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rmseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFEBEE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F44336;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="maeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E8F5E8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4CAF50;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="r2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E3F2FD;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2196F3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="mapeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFF3E0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF9800;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#333">
    Regression Metrics: Characteristics and Applications
  </text>
  
  <!-- RMSE Section -->
  <rect x="50" y="60" width="220" height="250" rx="12" fill="url(#rmseGrad)" stroke="#D32F2F" stroke-width="2"/>
  <text x="160" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
    RMSE
  </text>
  <text x="160" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
    Root Mean Square Error
  </text>
  
  <!-- RMSE Formula -->
  <rect x="70" y="120" width="180" height="30" rx="5" fill="rgba(255,255,255,0.9)"/>
  <text x="160" y="138" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#D32F2F">
    RMSE = √(Σ(yᵢ - ŷᵢ)² / n)
  </text>
  
  <!-- RMSE Characteristics -->
  <text x="70" y="170" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">
    Characteristics:
  </text>
  <text x="75" y="185" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Heavily penalizes large errors
  </text>
  <text x="75" y="200" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Same units as target variable
  </text>
  <text x="75" y="215" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Sensitive to outliers
  </text>
  <text x="75" y="230" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Always positive
  </text>
  
  <text x="70" y="250" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">
    Best for:
  </text>
  <text x="75" y="265" font-family="Arial, sans-serif" font-size="10" fill="white">
    • When large errors are costly
  </text>
  <text x="75" y="280" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Normal distributed errors
  </text>
  <text x="75" y="295" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Optimization objectives
  </text>
  
  <!-- MAE Section -->
  <rect x="290" y="60" width="220" height="250" rx="12" fill="url(#maeGrad)" stroke="#388E3C" stroke-width="2"/>
  <text x="400" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
    MAE
  </text>
  <text x="400" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
    Mean Absolute Error
  </text>
  
  <!-- MAE Formula -->
  <rect x="310" y="120" width="180" height="30" rx="5" fill="rgba(255,255,255,0.9)"/>
  <text x="400" y="138" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#388E3C">
    MAE = Σ|yᵢ - ŷᵢ| / n
  </text>
  
  <!-- MAE Characteristics -->
  <text x="310" y="170" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">
    Characteristics:
  </text>
  <text x="315" y="185" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Linear penalty for errors
  </text>
  <text x="315" y="200" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Robust to outliers
  </text>
  <text x="315" y="215" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Easy to interpret
  </text>
  <text x="315" y="230" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Same units as target
  </text>
  
  <text x="310" y="250" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">
    Best for:
  </text>
  <text x="315" y="265" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Presence of outliers
  </text>
  <text x="315" y="280" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Equal error importance
  </text>
  <text x="315" y="295" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Interpretable results
  </text>
  
  <!-- R-squared Section -->
  <rect x="530" y="60" width="220" height="250" rx="12" fill="url(#r2Grad)" stroke="#1976D2" stroke-width="2"/>
  <text x="640" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
    R-squared
  </text>
  <text x="640" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
    Coefficient of Determination
  </text>
  
  <!-- R-squared Formula -->
  <rect x="550" y="120" width="180" height="30" rx="5" fill="rgba(255,255,255,0.9)"/>
  <text x="640" y="138" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1976D2">
    R² = 1 - (SSres / SStot)
  </text>
  
  <!-- R-squared Characteristics -->
  <text x="550" y="170" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">
    Characteristics:
  </text>
  <text x="555" y="185" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Proportion of variance explained
  </text>
  <text x="555" y="200" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Scale independent
  </text>
  <text x="555" y="215" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Range: (-∞, 1]
  </text>
  <text x="555" y="230" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Higher is better
  </text>
  
  <text x="550" y="250" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">
    Best for:
  </text>
  <text x="555" y="265" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Model comparison
  </text>
  <text x="555" y="280" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Variance explanation
  </text>
  <text x="555" y="295" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Goodness of fit
  </text>
  
  <!-- MAPE Section -->
  <rect x="770" y="60" width="220" height="250" rx="12" fill="url(#mapeGrad)" stroke="#F57C00" stroke-width="2"/>
  <text x="880" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
    MAPE
  </text>
  <text x="880" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
    Mean Absolute Percentage Error
  </text>
  
  <!-- MAPE Formula -->
  <rect x="790" y="120" width="180" height="30" rx="5" fill="rgba(255,255,255,0.9)"/>
  <text x="880" y="138" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#F57C00">
    MAPE = Σ|yᵢ - ŷᵢ|/|yᵢ| / n × 100
  </text>
  
  <!-- MAPE Characteristics -->
  <text x="790" y="170" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">
    Characteristics:
  </text>
  <text x="795" y="185" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Percentage-based metric
  </text>
  <text x="795" y="200" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Scale independent
  </text>
  <text x="795" y="215" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Easy to communicate
  </text>
  <text x="795" y="230" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Undefined at y=0
  </text>
  
  <text x="790" y="250" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">
    Best for:
  </text>
  <text x="795" y="265" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Business reporting
  </text>
  <text x="795" y="280" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Cross-scale comparison
  </text>
  <text x="795" y="295" font-family="Arial, sans-serif" font-size="10" fill="white">
    • Stakeholder communication
  </text>
  
  <!-- Comparison Chart -->
  <text x="500" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">
    Metric Sensitivity Comparison
  </text>
  
  <!-- Error Sensitivity Chart -->
  <rect x="100" y="370" width="800" height="80" rx="10" fill="#F5F5F5" stroke="#ddd" stroke-width="1"/>
  
  <!-- Chart Labels -->
  <text x="120" y="390" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">
    Outlier Sensitivity:
  </text>
  
  <!-- Sensitivity bars -->
  <text x="120" y="415" font-family="Arial, sans-serif" font-size="11" fill="#D32F2F" font-weight="bold">RMSE</text>
  <rect x="170" y="407" width="100" height="12" rx="6" fill="#F44336"/>
  <text x="280" y="417" font-family="Arial, sans-serif" font-size="10" fill="#333">High (squares errors)</text>
  
  <text x="400" y="415" font-family="Arial, sans-serif" font-size="11" fill="#388E3C" font-weight="bold">MAE</text>
  <rect x="440" y="407" width="60" height="12" rx="6" fill="#4CAF50"/>
  <text x="510" y="417" font-family="Arial, sans-serif" font-size="10" fill="#333">Low (linear penalty)</text>
  
  <text x="120" y="435" font-family="Arial, sans-serif" font-size="11" fill="#1976D2" font-weight="bold">R²</text>
  <rect x="170" y="427" width="70" height="12" rx="6" fill="#2196F3"/>
  <text x="250" y="437" font-family="Arial, sans-serif" font-size="10" fill="#333">Medium (variance based)</text>
  
  <text x="400" y="435" font-family="Arial, sans-serif" font-size="11" fill="#F57C00" font-weight="bold">MAPE</text>
  <rect x="450" y="427" width="80" height="12" rx="6" fill="#FF9800"/>
  <text x="540" y="437" font-family="Arial, sans-serif" font-size="10" fill="#333">Variable (depends on scale)</text>
  
  <!-- Usage Guidelines -->
  <text x="500" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">
    Selection Guidelines
  </text>
  
  <rect x="50" y="500" width="900" height="80" rx="10" fill="#F9F9F9" stroke="#ddd" stroke-width="1"/>
  <text x="70" y="520" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">
    Metric Selection Framework:
  </text>
  <text x="80" y="540" font-family="Arial, sans-serif" font-size="11" fill="#333">
    • RMSE: Use when large errors are particularly problematic (e.g., safety-critical applications)
  </text>
  <text x="80" y="555" font-family="Arial, sans-serif" font-size="11" fill="#333">
    • MAE: Choose when outliers exist and all errors should be weighted equally
  </text>
  <text x="80" y="570" font-family="Arial, sans-serif" font-size="11" fill="#333">
    • R²: Apply for model comparison and understanding explained variance (beware of overfitting)
  </text>
  
  <!-- Additional note -->
  <text x="500" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-style="italic" fill="#666">
    Recommendation: Use multiple metrics together for comprehensive model evaluation
  </text>
</svg>