<svg viewBox="0 0 1400 950" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1400" height="950" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="700" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Embedding Generation Process
  </text>
  
  <!-- Markers -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#495057"/>
    </marker>
  </defs>
  
  <!-- Input Text -->
  <g id="input">
    <rect x="50" y="80" width="500" height="100" rx="10" fill="#fff3bf" stroke="#f59f00" stroke-width="3"/>
    <text x="300" y="110" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Input Text Chunk
    </text>
    <text x="300" y="140" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#495057" font-style="italic">
      "Transformers use self-attention mechanisms
    </text>
    <text x="300" y="160" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#495057" font-style="italic">
      to process sequences in parallel."
    </text>
  </g>
  
  <!-- Arrow -->
  <line x1="300" y1="180" x2="300" y2="230" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  
  <!-- Tokenization -->
  <g id="tokenization">
    <rect x="50" y="230" width="500" height="110" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="3"/>
    <text x="300" y="260" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Tokenization
    </text>
    <rect x="70" y="275" width="460" height="50" rx="5" fill="#fff" stroke="#1971c2" stroke-width="2"/>
    <text x="300" y="305" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#495057">
      [Transform] [##ers] [use] [self] [-] [attention] [mechanisms] [to] [process] [sequences]
    </text>
  </g>
  
  <!-- Arrow -->
  <line x1="300" y1="340" x2="300" y2="390" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  
  <!-- Embedding Model -->
  <g id="model">
    <rect x="50" y="390" width="500" height="140" rx="10" fill="#d0bfff" stroke="#7950f2" stroke-width="3"/>
    <text x="300" y="420" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Embedding Model
    </text>
    <text x="300" y="445" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#495057">
      Neural Network (Transformer-based)
    </text>
    <rect x="70" y="460" width="460" height="55" rx="5" fill="#fff" stroke="#7950f2" stroke-width="2"/>
    <text x="300" y="480" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#495057">
      Parameters: ~100M - 1B+
    </text>
    <text x="300" y="500" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#495057">
      Examples: BERT, Ada-002, BGE, E5, Sentence-BERT
    </text>
  </g>
  
  <!-- Arrow -->
  <line x1="300" y1="530" x2="300" y2="580" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  
  <!-- Dense Vector Output -->
  <g id="output">
    <rect x="50" y="580" width="500" height="180" rx="10" fill="#c3fae8" stroke="#12b886" stroke-width="3"/>
    <text x="300" y="610" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Dense Vector Embedding
    </text>
    <text x="300" y="635" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#495057">
      Dimensions: 384, 768, 1536, or 3072
    </text>
    
    <rect x="70" y="650" width="460" height="95" rx="5" fill="#fff" stroke="#12b886" stroke-width="2"/>
    <text x="300" y="670" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#495057">
      [0.024, -0.156, 0.891, ..., 0.432, -0.221]
    </text>
    <text x="300" y="690" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#868e96">
      ↑ Sample vector (1536 dimensions)
    </text>
    <text x="300" y="715" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#495057" font-weight="bold">
      Semantic meaning captured in high-dimensional space
    </text>
    <text x="300" y="735" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#495057">
      Similar texts → Similar vectors (measured by cosine similarity)
    </text>
  </g>
  
  <!-- Model Comparison Table -->
  <g id="models-table">
    <rect x="600" y="80" width="750" height="680" rx="10" fill="#fff" stroke="#868e96" stroke-width="2"/>
    <text x="975" y="115" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Popular Embedding Models
    </text>
    
    <!-- Table Header -->
    <rect x="620" y="135" width="180" height="35" fill="#e9ecef" stroke="#868e96" stroke-width="1"/>
    <text x="710" y="158" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Model
    </text>
    
    <rect x="800" y="135" width="100" height="35" fill="#e9ecef" stroke="#868e96" stroke-width="1"/>
    <text x="850" y="158" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Dimensions
    </text>
    
    <rect x="900" y="135" width="110" height="35" fill="#e9ecef" stroke="#868e96" stroke-width="1"/>
    <text x="955" y="158" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Max Tokens
    </text>
    
    <rect x="1010" y="135" width="120" height="35" fill="#e9ecef" stroke="#868e96" stroke-width="1"/>
    <text x="1070" y="158" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Provider
    </text>
    
    <rect x="1130" y="135" width="90" height="35" fill="#e9ecef" stroke="#868e96" stroke-width="1"/>
    <text x="1175" y="158" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Cost
    </text>
    
    <!-- Row 1: text-embedding-3-large -->
    <rect x="620" y="170" width="180" height="40" fill="#e7f5ff" stroke="#868e96" stroke-width="1"/>
    <text x="710" y="194" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#495057">
      text-embedding-3-large
    </text>
    <rect x="800" y="170" width="100" height="40" fill="#fff" stroke="#868e96" stroke-width="1"/>
    <text x="850" y="194" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#495057">
