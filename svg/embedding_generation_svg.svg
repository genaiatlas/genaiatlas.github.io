    </text>
    
    <!-- Best Practices Section -->
    <rect x="630" y="430" width="710" height="315" rx="5" fill="#f8f9fa" stroke="#868e96" stroke-width="2"/>
    <text x="985" y="460" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Embedding Best Practices
    </text>
    
    <text x="650" y="490" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1a1a1a">
      1. Consistency
    </text>
    <text x="670" y="510" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Use the same model for both indexing and querying
    </text>
    <text x="670" y="528" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Document model version for reproducibility
    </text>
    
    <text x="650" y="558" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1a1a1a">
      2. Batch Processing
    </text>
    <text x="670" y="578" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Process multiple chunks in batches (16-256 chunks)
    </text>
    <text x="670" y="596" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Reduces API calls and improves throughput
    </text>
    
    <text x="650" y="626" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1a1a1a">
      3. Normalization
    </text>
    <text x="670" y="646" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Normalize embeddings to unit length (L2 normalization)
    </text>
    <text x="670" y="664" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Enables faster similarity computation
    </text>
    
    <text x="650" y="694" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1a1a1a">
      4. Caching
    </text>
    <text x="670" y="714" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Cache frequently accessed embeddings
    </text>
    <text x="670" y="732" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Avoid recomputing during development and testing
    </text>
  </g>
  
  <!-- Bottom Note -->
  <g id="note">
    <rect x="50" y="790" width="1300" height="140" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
    <text x="700" y="825" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Understanding Vector Similarity
    </text>
    <text x="700" y="855" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#495057">
      Cosine Similarity = (A · B) / (||A|| × ||B||)
    </text>
    <text x="700" y="880" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#495057">
      Range: [-1, 1] where 1 = identical meaning, 0 = unrelated, -1 = opposite meaning
    </text>
    <text x="700" y="905" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#495057">
      Typical RAG threshold: 0.7-0.8 for relevant documents
    </text>
  </g>
</svg>