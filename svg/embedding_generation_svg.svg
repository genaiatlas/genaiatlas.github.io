    <!-- Row 2: text-embedding-3-small -->
    <rect x="620" y="210" width="180" height="40" fill="#e7f5ff" stroke="#868e96" stroke-width="1"/>
    <text x="710" y="234" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#495057">
      text-embedding-3-small
    </text>
    <rect x="800" y="210" width="100" height="40" fill="#fff" stroke="#868e96" stroke-width="1"/>
    <text x="850" y="234" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#495057">
      1536
    </text>
    <rect x="900" y="210" width="110" height="40" fill="#fff" stroke="#868e96" stroke-width="1"/>
    <text x="955" y="234" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#495057">
      8191
    </text>
    <rect x="1010" y="210" width="120" height="40" fill="#fff" stroke="#868e96" stroke-width="1"/>
    <text x="1070" y="234" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#495057">
      OpenAI
    </text>
    <rect x="1130" y="210" width="90" height="40" fill="#fff" stroke="#868e96" stroke-width="1"/>
    <text x="1175" y="234" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#495057">
      $$
    </text>
    
    <!-- Row 3: ada-002 -->
    <rect x="620" y="250" width="180" height="40" fill="#fff9db" stroke="#868e96" stroke-width="1"/>
    <text x="710" y="274" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#495057">
      text-embedding-ada-002
    </text>
    <rect x="800" y="250" width="100" height="40" fill="#fff" stroke="#868e96" stroke-width="1"/>
    <text x="850" y="274" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#495057">
      1536
    </text>
    <rect x="900" y="250" width="110" height="40" fill="#fff" stroke="#868e96" stroke-width="1"/>
    <text x="955" y="274" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#495057">
      8191
    </text>
    <rect x="1010" y="250" width="120" height="40" fill="#fff" stroke="#868e96" stroke-width="1"/>
    <text x="1070" y="274" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#495057">
      OpenAI
    </text>
    <rect x="1130" y="250" width="90" height="40" fill="#fff" stroke="#868e96" stroke-width="1"/>
    <text x="1175" y="274" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#495057">
      $$
    </text>
    
    <!-- Row 4: bge-large -->
    <rect x="620" y="290" width="180" height="40" fill="#d0bfff" stroke="#868e96" stroke-width="1"/>
    <text x="710" y="314" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#495057">
      bge-large-en-v1.5
    </text>
    <rect x="800" y="290" width="100" height="40" fill="#fff" stroke="#868e96" stroke-width="1"/>
    <text x="850" y="314" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#495057">
      1024
    </text>
    <rect x="900" y="290" width="110" height="40" fill="#fff" stroke="#868e96" stroke-width="1"/>
    <text x="955" y="314" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#495057">
      512
    </text>
    <rect x="1010" y="290" width="120" height="40" fill="#fff" stroke="#868e96" stroke-width="1"/>
    <text x="1070" y="314" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#495057">
      Open Source
    </text>
    <rect x="1130" y="290" width="90" height="40" fill="#fff" stroke="#868e96" stroke-width="1"/>
    <text x="1175" y="314" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#495057">
      Free
    </text>
    
    <!-- Row 5: e5-large -->
    <rect x="620" y="330" width="180" height="40" fill="#d0bfff" stroke="#868e96" stroke-width="1"/>
    <text x="710" y="354" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#495057">
      e5-large-v2
    </text>
    <rect x="800" y="330" width="100" height="40" fill="#fff" stroke="#868e96" stroke-width="1"/>
    <text x="850" y="354" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#495057">
      1024
    </text>
    <rect x="900" y="330" width="110" height="40" fill="#fff" stroke="#868e96" stroke-width="1"/>
    <text x="955" y="354" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#495057">
      512
    </text>
    <rect x="1010" y="330" width="120" height="40" fill="#fff" stroke="#868e96" stroke-width="1"/>
    <text x="1070" y="354" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#495057">
      Open Source
    </text>
    <rect x="1130" y="330" width="90" height="40" fill="#fff" stroke="#868e96" stroke-width="1"/>
    <text x="1175" y="354" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#495057">
      Free
    </text>
    
    <!-- Row 6: all-MiniLM -->
    <rect x="620" y="370" width="180" height="40" fill="#c3fae8" stroke="#868e96" stroke-width="1"/>
    <text x="710" y="394" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#495057">
      all-MiniLM-L6-v2
    </text>
    <rect x="800" y="370" width="100" height="40" fill="#fff" stroke="#868e96" stroke-width="1"/>
    <text x="850" y="394" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#495057">
      384
    </text>
    <rect x="900" y="370" width="110" height="40" fill="#fff" stroke="#868e96" stroke-width="1"/>
    <text x="955" y="394" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#495057">
      256
    </text>
    <rect x="1010" y="370" width="120" height="40" fill="#fff" stroke="#868e96" stroke-width="1"/>
    <text x="1070" y="394" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#495057">
