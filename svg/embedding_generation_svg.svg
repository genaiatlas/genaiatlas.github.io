    </text>
    <rect x="900" y="170" width="110" height="40" fill="#fff" stroke="#868e96" stroke-width="1"/>
    <text x="955" y="194" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#495057">
