    </text>
    <rect x="1130" y="370" width="90" height="40" fill="#fff" stroke="#868e96" stroke-width="1"/>
    <text x="1175" y="394" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#495057">
