<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600">
  <defs>
    <linearGradient id="layer1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4285f4;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#1a73e8;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="layer2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#34a853;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#137333;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="layer3Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ea4335;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#d33b2c;stop-opacity:0.9" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="3" dy="3" stdDeviation="2" flood-color="rgba(0,0,0,0.2)"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="600" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="500" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#202124">
    Hierarchical Feature Learning: From Simple Edges to Complex Objects
  </text>

  <!-- Input Image (Car) -->
  <rect x="50" y="100" width="120" height="80" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="8" filter="url(#shadow)"/>
  <text x="110" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1976d2">
    Input Image
  </text>
  <text x="110" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1976d2">
    Car Photo
  </text>
  <text x="110" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">
    28×28×3 pixels
  </text>
  
  <!-- Simple car outline in input -->
  <rect x="85" y="105" width="50" height="25" fill="none" stroke="#1976d2" stroke-width="1" rx="3"/>
  <circle cx="95" cy="140" r="4" fill="none" stroke="#1976d2" stroke-width="1"/>
  <circle cx="125" cy="140" r="4" fill="none" stroke="#1976d2" stroke-width="1"/>

  <!-- Arrow 1 -->
  <path d="M 180 140 L 220 140" stroke="#5f6368" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="200" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#5f6368">Forward</text>

  <!-- Layer 1: Edge Detection -->
  <rect x="240" y="80" width="160" height="120" fill="url(#layer1Grad)" stroke="#1a73e8" stroke-width="3" rx="10" filter="url(#shadow)"/>
  <text x="320" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
    Hidden Layer 1
  </text>
  <text x="320" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    Edge Detection
  </text>

  <!-- Edge examples -->
  <g fill="white" stroke="white" stroke-width="2">
    <line x1="260" y1="140" x2="290" y2="140"/> <!-- Horizontal edge -->
    <line x1="275" y1="150" x2="275" y2="180"/> <!-- Vertical edge -->
    <line x1="310" y1="140" x2="340" y2="170"/> <!-- Diagonal edge -->
    <path d="M 350 140 Q 365 130 380 140" fill="none"/> <!-- Curved edge -->
  </g>
  
  <text x="275" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1a73e8">Horizontal</text>
  <text x="275" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1a73e8">Vertical</text>
  <text x="325" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1a73e8">Diagonal</text>
  <text x="365" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1a73e8">Curved</text>

  <!-- Arrow 2 -->
  <path d="M 410 140 L 450 140" stroke="#5f6368" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Layer 2: Object Parts -->
  <rect x="470" y="80" width="160" height="120" fill="url(#layer2Grad)" stroke="#137333" stroke-width="3" rx="10" filter="url(#shadow)"/>
  <text x="550" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
    Hidden Layer 2
  </text>
  <text x="550" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    Object Parts
  </text>

  <!-- Object parts examples -->
  <g fill="white" stroke="white" stroke-width="2">
    <!-- Wheel -->
    <circle cx="510" cy="150" r="12" fill="none"/>
    <text x="510" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Wheel</text>
    
    <!-- Car body -->
    <rect x="540" y="140" width="25" height="15" rx="3" fill="none"/>
    <text x="552" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Body</text>
    
    <!-- Window -->
    <rect x="580" y="145" width="15" height="10" rx="2" fill="none"/>
    <text x="587" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Window</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M 640 140 L 680 140" stroke="#5f6368" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Layer 3: Complete Objects -->
  <rect x="700" y="80" width="160" height="120" fill="url(#layer3Grad)" stroke="#d33b2c" stroke-width="3" rx="10" filter="url(#shadow)"/>
  <text x="780" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
    Hidden Layer 3
  </text>
  <text x="780" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    Complete Objects
  </text>

  <!-- Complete car -->
  <g fill="white" stroke="white" stroke-width="2">
    <rect x="740" y="140" width="40" height="20" rx="4" fill="none"/>
    <circle cx="750" cy="170" r="6" fill="none"/>
    <circle cx="770" cy="170" r="6" fill="none"/>
    <rect x="745" y="145" width="12" height="8" rx="1" fill="none"/>
    <rect x="763" y="145" width="12" height="8" rx="1" fill="none"/>
  </g>
  <text x="760" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Car</text>

  <!-- Mathematical representation section -->
  <rect x="100" y="250" width="800" height="100" fill="#ffffff" stroke="#e0e0e0" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="500" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#202124">
    Mathematical Representation of Hierarchical Learning
  </text>

  <!-- Mathematical formulas -->
  <text x="200" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#1a73e8" font-weight="bold">
    Layer 1: Edges
  </text>
  <text x="200" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1a73e8">
    h¹ = σ(W¹x + b¹)
  </text>

  <text x="500" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#137333" font-weight="bold">
    Layer 2: Parts
  </text>
  <text x="500" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#137333">
    h² = σ(W²h¹ + b²)
  </text>

  <text x="800" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#d33b2c" font-weight="bold">
    Layer 3: Objects
  </text>
  <text x="800" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#d33b2c">
    h³ = σ(W³h² + b³)
  </text>

  <!-- Complexity progression -->
  <rect x="50" y="380" width="900" height="180" fill="#f1f3f4" stroke="#dadce0" stroke-width="1" rx="10"/>
  <text x="500" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#202124">
    Feature Complexity Progression
  </text>

  <!-- Complexity bars -->
  <rect x="100" y="430" width="50" height="20" fill="#4285f4" rx="5"/>
  <text x="125" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Low</text>
  <text x="125" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5f6368">Simple Features</text>
  
  <rect x="250" y="430" width="100" height="20" fill="#34a853" rx="5"/>
  <text x="300" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Medium</text>
  <text x="300" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5f6368">Composite Features</text>
  
  <rect x="450" y="430" width="150" height="20" fill="#ea4335" rx="5"/>
  <text x="525" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">High</text>
  <text x="525" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5f6368">Abstract Concepts</text>

  <!-- Example progression -->
  <text x="150" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#202124">
    Examples by Layer:
  </text>
  
  <text x="150" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#4285f4">
    Layer 1: Lines, curves, edges
  </text>
  
  <text x="400" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#34a853">
    Layer 2: Wheels, doors, windows
  </text>
  
  <text x="700" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ea4335">
    Layer 3: Cars, trucks, motorcycles
  </text>

  <!-- Key insight box -->
  <rect x="700" y="430" width="250" height="80" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="8"/>
  <text x="825" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e65100">
    🔑 Key Insight
  </text>
  <text x="825" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5f6368">
    Each layer builds upon previous
  </text>
  <text x="825" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5f6368">
    layers, creating increasingly
  </text>
  <text x="825" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5f6368">
    complex representations
  </text>

  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#5f6368" />
    </marker>
  </defs>
</svg>