<svg viewBox="0 0 900 650" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="900" height="650" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="450" y="35" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Standard Error: Quantifying Estimate Uncertainty
  </text>
  
  <!-- Formula box -->
  <g transform="translate(250, 60)">
    <rect x="0" y="0" width="400" height="50" fill="#ecf0f1" stroke="#95a5a6" stroke-width="2" rx="5"/>
    <text x="200" y="30" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#2c3e50">
      SE(β̂) = √Var(β̂) = σ / √n   (for simple case)
    </text>
  </g>
  
  <!-- Main visualization: Three sampling distributions with different sample sizes -->
  
  <!-- Small sample size (n=10) -->
  <g transform="translate(100, 150)">
    <text x="100" y="0" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#e74c3c">
      Small Sample (n = 10)
    </text>
    
    <!-- Wide distribution curve -->
    <ellipse cx="100" cy="100" rx="70" ry="40" fill="#e74c3c" opacity="0.2" stroke="#c0392b" stroke-width="2"/>
    
    <!-- Sample estimates -->
    <circle cx="50" cy="100" r="3" fill="#e74c3c" opacity="0.7"/>
    <circle cx="70" cy="95" r="3" fill="#e74c3c" opacity="0.7"/>
    <circle cx="85" cy="105" r="3" fill="#e74c3c" opacity="0.7"/>
    <circle cx="100" cy="100" r="3" fill="#e74c3c" opacity="0.7"/>
    <circle cx="115" cy="102" r="3" fill="#e74c3c" opacity="0.7"/>
    <circle cx="130" cy="98" r="3" fill="#e74c3c" opacity="0.7"/>
    <circle cx="150" cy="103" r="3" fill="#e74c3c" opacity="0.7"/>
    
    <!-- True parameter -->
    <line x1="100" y1="80" x2="100" y2="150" stroke="#34495e" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="100" y="170" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">β (true)</text>
    
    <!-- Standard error indicator -->
    <line x1="30" y1="100" x2="170" y2="100" stroke="#e74c3c" stroke-width="2" opacity="0.5">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </line>
    <text x="100" y="190" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#e74c3c" font-weight="bold">
      SE = 0.95 (Large)
    </text>
    <text x="100" y="205" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">
      High uncertainty
    </text>
  </g>
  
  <!-- Medium sample size (n=50) -->
  <g transform="translate(400, 150)">
    <text x="100" y="0" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#f39c12">
      Medium Sample (n = 50)
    </text>
    
    <!-- Narrower distribution curve -->
    <ellipse cx="100" cy="100" rx="45" ry="35" fill="#f39c12" opacity="0.2" stroke="#d68910" stroke-width="2"/>
    
    <!-- Sample estimates -->
    <circle cx="65" cy="100" r="3" fill="#f39c12" opacity="0.7"/>
    <circle cx="80" cy="98" r="3" fill="#f39c12" opacity="0.7"/>
    <circle cx="90" cy="103" r="3" fill="#f39c12" opacity="0.7"/>
    <circle cx="100" cy="100" r="3" fill="#f39c12" opacity="0.7"/>
    <circle cx="110" cy="101" r="3" fill="#f39c12" opacity="0.7"/>
    <circle cx="120" cy="99" r="3" fill="#f39c12" opacity="0.7"/>
    <circle cx="135" cy="102" r="3" fill="#f39c12" opacity="0.7"/>
    
    <!-- True parameter -->
    <line x1="100" y1="80" x2="100" y2="150" stroke="#34495e" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="100" y="170" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">β (true)</text>
    
    <!-- Standard error indicator -->
    <line x1="55" y1="100" x2="145" y2="100" stroke="#f39c12" stroke-width="2" opacity="0.5">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </line>
    <text x="100" y="190" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#f39c12" font-weight="bold">
      SE = 0.42 (Medium)
    </text>
    <text x="100" y="205" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">
      Moderate uncertainty
    </text>
  </g>
  
  <!-- Large sample size (n=200) -->
  <g transform="translate(700, 150)">
    <text x="100" y="0" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#27ae60">
      Large Sample (n = 200)
    </text>
    
    <!-- Narrow distribution curve -->
    <ellipse cx="100" cy="100" rx="25" ry="30" fill="#27ae60" opacity="0.2" stroke="#229954" stroke-width="2"/>
    
    <!-- Sample estimates -->
    <circle cx="80" cy="100" r="3" fill="#27ae60" opacity="0.7"/>
    <circle cx="88" cy="99" r="3" fill="#27ae60" opacity="0.7"/>
    <circle cx="95" cy="102" r="3" fill="#27ae60" opacity="0.7"/>
    <circle cx="100" cy="100" r="3" fill="#27ae60" opacity="0.7"/>
    <circle cx="105" cy="101" r="3" fill="#27ae60" opacity="0.7"/>
    <circle cx="112" cy="99" r="3" fill="#27ae60" opacity="0.7"/>
    <circle cx="120" cy="100" r="3" fill="#27ae60" opacity="0.7"/>
    
    <!-- True parameter -->
    <line x1="100" y1="80" x2="100" y2="150" stroke="#34495e" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="100" y="170" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">β (true)</text>
    
    <!-- Standard error indicator -->
    <line x1="75" y1="100" x2="125" y2="100" stroke="#27ae60" stroke-width="2" opacity="0.5">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </line>
    <text x="100" y="190" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#27ae60" font-weight="bold">
      SE = 0.21 (Small)
    </text>
    <text x="100" y="205" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">
      Low uncertainty
    </text>
  </g>
  
  <!-- Arrow showing progression -->
  <g transform="translate(0, 380)">
    <line x1="150" y1="0" x2="750" y2="0" stroke="#95a5a6" stroke-width="3" marker-end="url(#arrow-progression)"/>
    <text x="450" y="25" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#7f8c8d" font-style="italic">
      As sample size increases, standard error decreases
    </text>
  </g>
  
  <!-- Key insights box -->
  <g transform="translate(100, 430)">
    <rect x="0" y="0" width="700" height="180" fill="white" stroke="#3498db" stroke-width="2" rx="8"/>
    
    <text x="350" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Key Insights About Standard Error
    </text>
    
    <g transform="translate(30, 50)">
      <!-- Point 1 -->
      <circle cx="0" cy="0" r="4" fill="#3498db"/>
      <text x="15" y="5" font-family="Arial, sans-serif" font-size="12" fill="#34495e">
        <tspan font-weight="bold">Standard Error measures precision:</tspan> How much our estimate typically varies from sample to sample
      </text>
      
      <!-- Point 2 -->
      <circle cx="0" cy="35" r="4" fill="#3498db"/>
      <text x="15" y="40" font-family="Arial, sans-serif" font-size="12" fill="#34495e">
        <tspan font-weight="bold">Decreases with sample size:</tspan> SE ∝ 1/√n, so quadrupling sample size halves the SE
      </text>
      
      <!-- Point 3 -->
      <circle cx="0" cy="70" r="4" fill="#3498db"/>
      <text x="15" y="75" font-family="Arial, sans-serif" font-size="12" fill="#34495e">
        <tspan font-weight="bold">Used for confidence intervals:</tspan> CI = β̂ ± (critical value × SE)
      </text>
      
      <!-- Point 4 -->
      <circle cx="0" cy="105" r="4" fill="#3498db"/>
      <text x="15" y="110" font-family="Arial, sans-serif" font-size="12" fill="#34495e">
        <tspan font-weight="bold">Smaller SE = More reliable estimate:</tspan> Greater confidence in our findings
      </text>
    </g>
  </g>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrow-progression" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#95a5a6"/>
    </marker>
  </defs>
</svg>