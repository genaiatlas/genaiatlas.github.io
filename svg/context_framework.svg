<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1400" height="1000" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="700" y="50" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#1e293b" text-anchor="middle">Context Framework</text>
  <text x="700" y="85" font-family="Arial, sans-serif" font-size="16" fill="#64748b" text-anchor="middle">Comprehensive Context Architecture for AI-Assisted Development</text>
  
  <!-- Central AI System -->
  <g transform="translate(500, 380)">
    <rect width="400" height="140" rx="20" fill="#6366f1" stroke="#4f46e5" stroke-width="4"/>
    <text x="200" y="50" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle">AI Coding</text>
    <text x="200" y="80" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle">Assistant</text>
    <text x="200" y="110" font-family="Arial, sans-serif" font-size="15" fill="#c7d2fe" text-anchor="middle">(Generic Model + Your Context)</text>
  </g>
  
  <!-- Connection indicator box -->
  <g transform="translate(530, 540)">
    <rect width="340" height="60" rx="12" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
    <text x="170" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#5b21b6" text-anchor="middle">Four Context Layers</text>
    <text x="170" y="45" font-family="Arial, sans-serif" font-size="13" fill="#6d28d9" text-anchor="middle">Working together to enable AI</text>
  </g>
  
  <!-- Project Reality Context (Top Left) -->
  <g transform="translate(60, 130)">
    <rect width="400" height="200" rx="15" fill="#dbeafe" stroke="#3b82f6" stroke-width="3"/>
    
    <text x="35" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1e40af">📁 Project Reality</text>
    
    <g transform="translate(25, 60)">
      <circle cx="8" cy="8" r="5" fill="#3b82f6"/>
      <text x="25" y="13" font-family="Arial, sans-serif" font-size="15" fill="#1e293b">Code Structure &amp; Organization</text>
      
      <circle cx="8" cy="38" r="5" fill="#3b82f6"/>
      <text x="25" y="43" font-family="Arial, sans-serif" font-size="15" fill="#1e293b">Naming Conventions</text>
      
      <circle cx="8" cy="68" r="5" fill="#3b82f6"/>
      <text x="25" y="73" font-family="Arial, sans-serif" font-size="15" fill="#1e293b">Coding Style &amp; Patterns</text>
      
      <circle cx="8" cy="98" r="5" fill="#3b82f6"/>
      <text x="25" y="103" font-family="Arial, sans-serif" font-size="15" fill="#1e293b">Technology Stack</text>
      
      <circle cx="8" cy="128" r="5" fill="#3b82f6"/>
      <text x="25" y="133" font-family="Arial, sans-serif" font-size="15" fill="#1e293b">Module Boundaries</text>
    </g>
  </g>
  
  <!-- Process & Workflow Context (Top Right) -->
  <g transform="translate(940, 130)">
    <rect width="400" height="200" rx="15" fill="#dcfce7" stroke="#22c55e" stroke-width="3"/>
    
    <text x="35" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#15803d">⚙️ Process &amp; Workflow</text>
    
    <g transform="translate(25, 60)">
      <circle cx="8" cy="8" r="5" fill="#22c55e"/>
      <text x="25" y="13" font-family="Arial, sans-serif" font-size="15" fill="#1e293b">Branching Model</text>
      
      <circle cx="8" cy="38" r="5" fill="#22c55e"/>
      <text x="25" y="43" font-family="Arial, sans-serif" font-size="15" fill="#1e293b">PR Requirements</text>
      
      <circle cx="8" cy="68" r="5" fill="#22c55e"/>
      <text x="25" y="73" font-family="Arial, sans-serif" font-size="15" fill="#1e293b">Release Process</text>
      
      <circle cx="8" cy="98" r="5" fill="#22c55e"/>
      <text x="25" y="103" font-family="Arial, sans-serif" font-size="15" fill="#1e293b">Deployment Steps</text>
      
      <circle cx="8" cy="128" r="5" fill="#22c55e"/>
      <text x="25" y="133" font-family="Arial, sans-serif" font-size="15" fill="#1e293b">Quality Gates</text>
    </g>
  </g>
  
  <!-- References & Documentation (Bottom Left) -->
  <g transform="translate(60, 670)">
    <rect width="400" height="200" rx="15" fill="#fce7f3" stroke="#ec4899" stroke-width="3"/>
    
    <text x="35" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#be185d">📚 References &amp; Docs</text>
    
    <g transform="translate(25, 60)">
      <circle cx="8" cy="8" r="5" fill="#ec4899"/>
      <text x="25" y="13" font-family="Arial, sans-serif" font-size="15" fill="#1e293b">Library Documentation</text>
      
      <circle cx="8" cy="38" r="5" fill="#ec4899"/>
      <text x="25" y="43" font-family="Arial, sans-serif" font-size="15" fill="#1e293b">API Specifications</text>
      
      <circle cx="8" cy="68" r="5" fill="#ec4899"/>
      <text x="25" y="73" font-family="Arial, sans-serif" font-size="15" fill="#1e293b">Requirements &amp; Stories</text>
      
      <circle cx="8" cy="98" r="5" fill="#ec4899"/>
      <text x="25" y="103" font-family="Arial, sans-serif" font-size="15" fill="#1e293b">Architecture Decisions</text>
      
      <circle cx="8" cy="128" r="5" fill="#ec4899"/>
      <text x="25" y="133" font-family="Arial, sans-serif" font-size="15" fill="#1e293b">Best Practices</text>
    </g>
  </g>
  
  <!-- Delivery Mechanisms (Bottom Right) -->
  <g transform="translate(940, 670)">
    <rect width="400" height="200" rx="15" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
    
    <text x="35" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#b45309">🔧 Delivery Mechanisms</text>
    
    <g transform="translate(25, 60)">
      <circle cx="8" cy="8" r="5" fill="#f59e0b"/>
      <text x="25" y="13" font-family="Arial, sans-serif" font-size="15" fill="#1e293b">Rule Files (AGENTS.md, .ruler)</text>
      
      <circle cx="8" cy="38" r="5" fill="#f59e0b"/>
      <text x="25" y="43" font-family="Arial, sans-serif" font-size="15" fill="#1e293b">MCP Servers</text>
      
      <circle cx="8" cy="68" r="5" fill="#f59e0b"/>
      <text x="25" y="73" font-family="Arial, sans-serif" font-size="15" fill="#1e293b">CLI Utilities</text>
      
      <circle cx="8" cy="98" r="5" fill="#f59e0b"/>
      <text x="25" y="103" font-family="Arial, sans-serif" font-size="15" fill="#1e293b">IDE Extensions</text>
      
      <circle cx="8" cy="128" r="5" fill="#f59e0b"/>
      <text x="25" y="133" font-family="Arial, sans-serif" font-size="15" fill="#1e293b">Version Control Hooks</text>
    </g>
  </g>
  
  <!-- Connection Lines -->
  <line x1="350" y1="330" x2="530" y2="420" stroke="#3b82f6" stroke-width="3" stroke-dasharray="8,5" opacity="0.5"/>
  <line x1="1050" y1="330" x2="870" y2="420" stroke="#22c55e" stroke-width="3" stroke-dasharray="8,5" opacity="0.5"/>
  <line x1="350" y1="670" x2="530" y2="520" stroke="#ec4899" stroke-width="3" stroke-dasharray="8,5" opacity="0.5"/>
  <line x1="1050" y1="670" x2="870" y2="520" stroke="#f59e0b" stroke-width="3" stroke-dasharray="8,5" opacity="0.5"/>
  
  <!-- Best Practices Banner -->
  <g transform="translate(170, 920)">
    <rect width="1060" height="70" rx="12" fill="#8b5cf6" opacity="0.95"/>
    <text x="530" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">Context Management Best Practices</text>
    <text x="530" y="47" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">✓ Version control all context files  •  ✓ Keep context current as project evolves</text>
    <text x="530" y="65" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">✓ Make context discoverable  •  ✓ Treat context as part of the codebase</text>
  </g>
</svg>