<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nodeGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4F80FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E5BFF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="leafGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB84F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF9B2E;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">
    Basic Decision Tree Structure
  </text>
  
  <!-- Root Node -->
  <ellipse cx="400" cy="100" rx="80" ry="40" fill="url(#nodeGradient)" stroke="#1E3A8A" stroke-width="2"/>
  <text x="400" y="90" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
    Root Node
  </text>
  <text x="400" y="105" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">
    (Test on Attribute)
  </text>
  <text x="400" y="118" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    Age ≥ 30?
  </text>
  
  <!-- Branches from Root -->
  <line x1="360" y1="130" x2="280" y2="180" stroke="#666" stroke-width="3"/>
  <line x1="440" y1="130" x2="520" y2="180" stroke="#666" stroke-width="3"/>
  
  <!-- Branch Labels -->
  <text x="310" y="150" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#666">Yes</text>
  <text x="490" y="150" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#666">No</text>
  
  <!-- Internal Nodes -->
  <ellipse cx="280" cy="200" rx="70" ry="35" fill="url(#nodeGradient)" stroke="#1E3A8A" stroke-width="2"/>
  <text x="280" y="195" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">
    Internal Node
  </text>
  <text x="280" y="208" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
    Children ≤ 2?
  </text>
  
  <ellipse cx="520" cy="200" rx="70" ry="35" fill="url(#nodeGradient)" stroke="#1E3A8A" stroke-width="2"/>
  <text x="520" y="195" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">
    Internal Node
  </text>
  <text x="520" y="208" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
    Income ≥ $50k?
  </text>
  
  <!-- Branches from Internal Nodes -->
  <line x1="240" y1="230" x2="180" y2="280" stroke="#666" stroke-width="2"/>
  <line x1="320" y1="230" x2="380" y2="280" stroke="#666" stroke-width="2"/>
  <line x1="480" y1="230" x2="420" y2="280" stroke="#666" stroke-width="2"/>
  <line x1="560" y1="230" x2="620" y2="280" stroke="#666" stroke-width="2"/>
  
  <!-- Branch Labels -->
  <text x="200" y="250" font-family="Arial, sans-serif" font-size="11" fill="#666">Yes</text>
  <text x="360" y="250" font-family="Arial, sans-serif" font-size="11" fill="#666">No</text>
  <text x="440" y="250" font-family="Arial, sans-serif" font-size="11" fill="#666">Yes</text>
  <text x="600" y="250" font-family="Arial, sans-serif" font-size="11" fill="#666">No</text>
  
  <!-- Leaf Nodes -->
  <rect x="150" y="285" width="60" height="40" rx="8" fill="url(#leafGradient)" stroke="#B45309" stroke-width="2"/>
  <text x="180" y="300" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">
    Leaf
  </text>
  <text x="180" y="315" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
    Approve
  </text>
  
  <rect x="350" y="285" width="60" height="40" rx="8" fill="url(#leafGradient)" stroke="#B45309" stroke-width="2"/>
  <text x="380" y="300" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">
    Leaf
  </text>
  <text x="380" y="315" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
    Deny
  </text>
  
  <rect x="390" y="285" width="60" height="40" rx="8" fill="url(#leafGradient)" stroke="#B45309" stroke-width="2"/>
  <text x="420" y="300" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">
    Leaf
  </text>
  <text x="420" y="315" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
    Approve
  </text>
  
  <rect x="590" y="285" width="60" height="40" rx="8" fill="url(#leafGradient)" stroke="#B45309" stroke-width="2"/>
  <text x="620" y="300" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">
    Leaf
  </text>
  <text x="620" y="315" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
    Deny
  </text>
  
  <!-- Legend -->
  <rect x="50" y="380" width="700" height="180" fill="#f8f9fa" stroke="#ddd" stroke-width="1" rx="8"/>
  <text x="400" y="400" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">
    Decision Tree Components
  </text>
  
  <!-- Legend Items -->
  <ellipse cx="120" cy="430" rx="30" ry="18" fill="url(#nodeGradient)" stroke="#1E3A8A" stroke-width="1"/>
  <text x="170" y="435" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">
    Internal Nodes: Tests on attributes (features)
  </text>
  
  <rect x="105" y="450" width="30" height="20" rx="4" fill="url(#leafGradient)" stroke="#B45309" stroke-width="1"/>
  <text x="170" y="463" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">
    Leaf Nodes: Final classification decisions
  </text>
  
  <line x1="105" y1="485" x2="135" y2="485" stroke="#666" stroke-width="2"/>
  <text x="170" y="488" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">
    Branches: Outcomes of tests (Yes/No, categories)
  </text>
  
  <text x="70" y="515" font-family="Arial, sans-serif" font-size="12" fill="#555">
    • Path from root to leaf = Classification rule
  </text>
  <text x="70" y="530" font-family="Arial, sans-serif" font-size="12" fill="#555">
    • Decision tree learns mapping f: χ → y
  </text>
  <text x="70" y="545" font-family="Arial, sans-serif" font-size="12" fill="#555">
    • Transparent, explainable decisions
  </text>
</svg>