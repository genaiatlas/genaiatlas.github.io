<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 24px; font-weight: bold; fill: #2c3e50; }
      .equation { font-family: 'Times New Roman', serif; font-size: 32px; fill: #34495e; }
      .label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; fill: #7f8c8d; }
      .arrow { stroke: #e74c3c; stroke-width: 2; fill: #e74c3c; }
      .box { fill: #ecf0f1; stroke: #bdc3c7; stroke-width: 2; rx: 8; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="400" y="40" class="title" text-anchor="middle">Gradient Descent Weight Update Equation</text>
  
  <!-- Main equation -->
  <text x="400" y="120" class="equation" text-anchor="middle">w<tspan baseline-shift="sub" font-size="24">ij</tspan><tspan baseline-shift="super" font-size="20">t+1</tspan> ← w<tspan baseline-shift="sub" font-size="24">ij</tspan><tspan baseline-shift="super" font-size="20">t</tspan> - η ∂L/∂w<tspan baseline-shift="sub" font-size="24">ij</tspan></text>
  
  <!-- Component boxes and labels -->
  
  <!-- New weight -->
  <rect x="50" y="160" width="120" height="60" class="box"/>
  <text x="110" y="185" class="label" text-anchor="middle" font-weight="bold">New Weight</text>
  <text x="110" y="205" class="label" text-anchor="middle">w<tspan baseline-shift="sub" font-size="12">ij</tspan><tspan baseline-shift="super" font-size="10">t+1</tspan></text>
  
  <!-- Current weight -->
  <rect x="220" y="160" width="120" height="60" class="box"/>
  <text x="280" y="185" class="label" text-anchor="middle" font-weight="bold">Current Weight</text>
  <text x="280" y="205" class="label" text-anchor="middle">w<tspan baseline-shift="sub" font-size="12">ij</tspan><tspan baseline-shift="super" font-size="10">t</tspan></text>
  
  <!-- Learning rate -->
  <rect x="390" y="160" width="120" height="60" class="box"/>
  <text x="450" y="185" class="label" text-anchor="middle" font-weight="bold">Learning Rate</text>
  <text x="450" y="205" class="label" text-anchor="middle">η (step size)</text>
  
  <!-- Gradient -->
  <rect x="560" y="160" width="140" height="60" class="box"/>
  <text x="630" y="185" class="label" text-anchor="middle" font-weight="bold">Gradient</text>
  <text x="630" y="205" class="label" text-anchor="middle">∂L/∂w<tspan baseline-shift="sub" font-size="12">ij</tspan> (direction)</text>
  
  <!-- Arrows pointing to equation components -->
  <path d="M 110 160 Q 110 140 140 125" class="arrow" marker-end="url(#arrowhead)"/>
  <path d="M 280 160 Q 280 140 240 125" class="arrow" marker-end="url(#arrowhead)"/>
  <path d="M 450 160 Q 450 140 410 125" class="arrow" marker-end="url(#arrowhead)"/>
  <path d="M 630 160 Q 630 140 580 125" class="arrow" marker-end="url(#arrowhead)"/>
  
  <!-- Process flow -->
  <rect x="100" y="280" width="600" height="80" fill="#e8f5e8" stroke="#27ae60" stroke-width="2" rx="10"/>
  <text x="400" y="305" class="label" text-anchor="middle" font-weight="bold" fill="#27ae60">Weight Update Process:</text>
  <text x="400" y="325" class="label" text-anchor="middle">1. Calculate gradient of loss function</text>
  <text x="400" y="345" class="label" text-anchor="middle">2. Scale by learning rate η</text>
  <text x="400" y="365" class="label" text-anchor="middle">3. Subtract from current weight to get new weight</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
     refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
  </defs>
</svg>