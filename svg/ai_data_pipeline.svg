<svg width="800" height="700" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="700" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1e293b">
    AI Data Science Pipeline
  </text>
  
  <!-- Data Sources Section -->
  <rect x="50" y="80" width="160" height="200" rx="10" fill="#6366f1" stroke="#4f46e5" stroke-width="2"/>
  <text x="130" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    Data Sources
  </text>
  
  <!-- Structured Data -->
  <rect x="70" y="120" width="120" height="30" rx="5" fill="#8b5cf6" stroke="#7c3aed" stroke-width="1"/>
  <text x="130" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Structured Data
  </text>
  
  <!-- Unstructured Data -->
  <rect x="70" y="160" width="120" height="30" rx="5" fill="#8b5cf6" stroke="#7c3aed" stroke-width="1"/>
  <text x="130" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Unstructured Data
  </text>
  
  <!-- Streaming Data -->
  <rect x="70" y="200" width="120" height="30" rx="5" fill="#8b5cf6" stroke="#7c3aed" stroke-width="1"/>
  <text x="130" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Streaming Data
  </text>
  
  <!-- External APIs -->
  <rect x="70" y="240" width="120" height="30" rx="5" fill="#8b5cf6" stroke="#7c3aed" stroke-width="1"/>
  <text x="130" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    External APIs
  </text>
  
  <!-- Data Processing Section -->
  <rect x="250" y="80" width="160" height="200" rx="10" fill="#059669" stroke="#047857" stroke-width="2"/>
  <text x="330" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    Data Processing
  </text>
  
  <!-- Data Cleaning -->
  <rect x="270" y="120" width="120" height="30" rx="5" fill="#10b981" stroke="#047857" stroke-width="1"/>
  <text x="330" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Data Cleaning
  </text>
  
  <!-- Feature Engineering -->
  <rect x="270" y="160" width="120" height="30" rx="5" fill="#10b981" stroke="#047857" stroke-width="1"/>
  <text x="330" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Feature Engineering
  </text>
  
  <!-- Data Validation -->
  <rect x="270" y="200" width="120" height="30" rx="5" fill="#10b981" stroke="#047857" stroke-width="1"/>
  <text x="330" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Data Validation
  </text>
  
  <!-- ETL Processes -->
  <rect x="270" y="240" width="120" height="30" rx="5" fill="#10b981" stroke="#047857" stroke-width="1"/>
  <text x="330" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    ETL Processes
  </text>
  
  <!-- Model Development Section -->
  <rect x="450" y="80" width="160" height="200" rx="10" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
  <text x="530" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    Model Development
  </text>
  
  <!-- Algorithm Selection -->
  <rect x="470" y="120" width="120" height="30" rx="5" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
  <text x="530" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Algorithm Selection
  </text>
  
  <!-- Model Training -->
  <rect x="470" y="160" width="120" height="30" rx="5" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
  <text x="530" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Model Training
  </text>
  
  <!-- Cross Validation -->
  <rect x="470" y="200" width="120" height="30" rx="5" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
  <text x="530" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Cross Validation
  </text>
  
  <!-- Hyperparameter Tuning -->
  <rect x="470" y="240" width="120" height="30" rx="5" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
  <text x="530" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Hyperparameter
  </text>
  
  <!-- Model Deployment Section -->
  <rect x="650" y="80" width="130" height="200" rx="10" fill="#ef4444" stroke="#dc2626" stroke-width="2"/>
  <text x="715" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    Deployment
  </text>
  
  <!-- Model Serving -->
  <rect x="665" y="120" width="100" height="30" rx="5" fill="#f87171" stroke="#dc2626" stroke-width="1"/>
  <text x="715" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Model Serving
  </text>
  
  <!-- API Integration -->
  <rect x="665" y="160" width="100" height="30" rx="5" fill="#f87171" stroke="#dc2626" stroke-width="1"/>
  <text x="715" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    API Integration
  </text>
  
  <!-- A/B Testing -->
  <rect x="665" y="200" width="100" height="30" rx="5" fill="#f87171" stroke="#dc2626" stroke-width="1"/>
  <text x="715" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    A/B Testing
  </text>
  
  <!-- Monitoring -->
  <rect x="665" y="240" width="100" height="30" rx="5" fill="#f87171" stroke="#dc2626" stroke-width="1"/>
  <text x="715" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Monitoring
  </text>
  
  <!-- Mathematical Model Section -->
  <rect x="100" y="320" width="600" height="120" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="400" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#334155">
    Cross-Validation Performance Model
  </text>
  <text x="400" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#475569">
    CV Score = (1/k) × Sum[i=1 to k] Performance(fold_i)
  </text>
  <text x="120" y="395" font-family="Arial, sans-serif" font-size="11" fill="#64748b">
    Where: k = Number of folds in cross-validation
  </text>
  <text x="120" y="410" font-family="Arial, sans-serif" font-size="11" fill="#64748b">
    Performance(fold_i) = Model performance metric on fold i (accuracy, F1-score, AUC, etc.)
  </text>
  <text x="120" y="425" font-family="Arial, sans-serif" font-size="11" fill="#64748b">
    Typical k values: 5-fold or 10-fold cross-validation for robust model evaluation
  </text>
  
  <!-- Technology Stack Section -->
  <rect x="50" y="460" width="700" height="100" rx="10" fill="#8b5cf6" stroke="#7c3aed" stroke-width="2"/>
  <text x="400" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
    Technology Stack
  </text>
  
  <!-- Data Processing Tools -->
  <text x="80" y="510" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Data Processing:
  </text>
  <text x="80" y="525" font-family="Arial, sans-serif" font-size="11" fill="white">
    Apache Spark, Pandas, Dask, Kafka
  </text>
  
  <!-- ML Frameworks -->
  <text x="300" y="510" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    ML Frameworks:
  </text>
  <text x="300" y="525" font-family="Arial, sans-serif" font-size="11" fill="white">
    TensorFlow, PyTorch, Scikit-learn, XGBoost
  </text>
  
  <!-- Cloud Platforms -->
  <text x="520" y="510" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Cloud Platforms:
  </text>
  <text x="520" y="525" font-family="Arial, sans-serif" font-size="11" fill="white">
    AWS, GCP, Azure, Kubernetes
  </text>
  
  <!-- Monitoring Tools -->
  <text x="80" y="545" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Monitoring:
  </text>
  <text x="80" y="555" font-family="Arial, sans-serif" font-size="11" fill="white">
    MLflow, Weights and Biases, Neptune
  </text>
  
  <!-- Deployment Tools -->
  <text x="300" y="545" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Deployment:
  </text>
  <text x="300" y="555" font-family="Arial, sans-serif" font-size="11" fill="white">
    Docker, Kubernetes, Seldon, KServe
  </text>
  
  <!-- Data Storage -->
  <text x="520" y="545" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Storage:
  </text>
  <text x="520" y="555" font-family="Arial, sans-serif" font-size="11" fill="white">
    Data Lakes, NoSQL, Vector DBs
  </text>
  
  <!-- Pipeline Stages -->
  <rect x="50" y="580" width="700" height="80" rx="10" fill="#64748b" stroke="#475569" stroke-width="2"/>
  <text x="400" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
    Pipeline Stages and Best Practices
  </text>
  <text x="80" y="625" font-family="Arial, sans-serif" font-size="11" fill="white">
    1. Data Ingestion → 2. Preprocessing → 3. Feature Engineering → 4. Model Training
  </text>
  <text x="80" y="640" font-family="Arial, sans-serif" font-size="11" fill="white">
    5. Model Evaluation → 6. Deployment → 7. Monitoring → 8. Feedback Loop
  </text>
  <text x="80" y="655" font-family="Arial, sans-serif" font-size="11" fill="white">
    Key Principles: Version Control, Automated Testing, CI/CD, Model Reproducibility
  </text>
  
  <!-- Flow Arrows -->
  <!-- Data Sources to Processing -->
  <path d="M 210 180 L 250 180" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Processing to Model Development -->
  <path d="M 410 180 L 450 180" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Model Development to Deployment -->
  <path d="M 610 180 L 650 180" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Feedback Loop -->
  <path d="M 650 260 Q 400 300 210 260" stroke="#ef4444" stroke-width="2" fill="none" stroke-dasharray="5,5" marker-end="url(#redarrowhead)"/>
  <text x="400" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#ef4444">
    Feedback Loop
  </text>
  
  <!-- Arrow marker definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
    <marker id="redarrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ef4444"/>
    </marker>
  </defs>
</svg>