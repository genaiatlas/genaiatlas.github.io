<svg viewBox="0 0 1000 850" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="850" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="500" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Hyperparameter Tuning Process Workflow
  </text>
  
  <!-- Step 1: Identify -->
  <g transform="translate(100, 80)">
    <!-- Circle with number -->
    <circle cx="50" cy="50" r="40" fill="#3498db" stroke="#2980b9" stroke-width="3"/>
    <text x="50" y="60" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="white">1</text>
    
    <!-- Box with content -->
    <rect x="110" y="10" width="700" height="80" fill="white" stroke="#3498db" stroke-width="3" rx="8"/>
    <text x="460" y="35" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#3498db">
      Identify the Hyperparameters
    </text>
    <text x="460" y="55" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">
      Research literature • Domain knowledge • Sensitivity analysis
    </text>
    <text x="460" y="72" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d" font-style="italic">
      Which parameters have the most significant impact on performance?
    </text>
  </g>
  
  <!-- Arrow -->
  <line x1="150" y1="190" x2="150" y2="230" stroke="#95a5a6" stroke-width="3" marker-end="url(#arrowhead-lg)"/>
  
  <!-- Step 2: Determine Range -->
  <g transform="translate(100, 240)">
    <!-- Circle with number -->
    <circle cx="50" cy="50" r="40" fill="#27ae60" stroke="#229954" stroke-width="3"/>
    <text x="50" y="60" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="white">2</text>
    
    <!-- Box with content -->
    <rect x="110" y="10" width="700" height="80" fill="white" stroke="#27ae60" stroke-width="3" rx="8"/>
    <text x="460" y="35" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#27ae60">
      Determine the Range of Values
    </text>
    <text x="460" y="55" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">
      Literature review • Default values • Log scale • Domain constraints
    </text>
    <text x="460" y="72" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d" font-style="italic">
      Example: learning_rate: [0.001, 0.01, 0.1, 1.0] | max_depth: [3, 5, 10, 15]
    </text>
  </g>
  
  <!-- Arrow -->
  <line x1="150" y1="350" x2="150" y2="390" stroke="#95a5a6" stroke-width="3" marker-end="url(#arrowhead-lg)"/>
  
  <!-- Step 3: Choose Method -->
  <g transform="translate(100, 400)">
    <!-- Circle with number -->
    <circle cx="50" cy="50" r="40" fill="#f39c12" stroke="#d68910" stroke-width="3"/>
    <text x="50" y="60" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="white">3</text>
    
    <!-- Box with content -->
    <rect x="110" y="10" width="700" height="80" fill="white" stroke="#f39c12" stroke-width="3" rx="8"/>
    <text x="460" y="35" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#f39c12">
      Choose a Search Method
    </text>
    <text x="460" y="55" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">
      Grid Search • Random Search • Bayesian Optimization • Evolutionary Algorithms
    </text>
    <text x="460" y="72" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d" font-style="italic">
      Select based on computational budget and parameter space dimensionality
    </text>
  </g>
  
  <!-- Arrow -->
  <line x1="150" y1="510" x2="150" y2="550" stroke="#95a5a6" stroke-width="3" marker-end="url(#arrowhead-lg)"/>
  
  <!-- Step 4: Train and Evaluate -->
  <g transform="translate(100, 560)">
    <!-- Circle with number -->
    <circle cx="50" cy="50" r="40" fill="#e74c3c" stroke="#c0392b" stroke-width="3"/>
    <text x="50" y="60" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="white">4</text>
    
    <!-- Box with content -->
    <rect x="110" y="10" width="700" height="80" fill="white" stroke="#e74c3c" stroke-width="3" rx="8"/>
    <text x="460" y="35" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#e74c3c">
      Train and Evaluate Models
    </text>
    <text x="460" y="55" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">
      Cross-validation • Train-validation split • Multiple metrics • Statistical tests
    </text>
    <text x="460" y="72" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d" font-style="italic">
      Evaluate each hyperparameter combination using k-fold cross-validation
    </text>
  </g>
  
  <!-- Arrow -->
  <line x1="150" y1="670" x2="150" y2="710" stroke="#95a5a6" stroke-width="3" marker-end="url(#arrowhead-lg)"/>
  
  <!-- Step 5: Select Best -->
  <g transform="translate(100, 720)">
    <!-- Circle with number -->
    <circle cx="50" cy="50" r="40" fill="#9b59b6" stroke="#8e44ad" stroke-width="3"/>
    <text x="50" y="60" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="white">5</text>
    
    <!-- Box with content -->
    <rect x="110" y="10" width="700" height="80" fill="white" stroke="#9b59b6" stroke-width="3" rx="8"/>
    <text x="460" y="35" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#9b59b6">
      Select Best Hyperparameters
    </text>
    <text x="460" y="55" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">
      Primary metric • Secondary metrics • Computational cost • Robustness
    </text>
    <text x="460" y="72" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d" font-style="italic">
      Choose configuration that optimizes target metric while considering practical constraints
    </text>
  </g>
  
  <!-- Side panel: Key Considerations -->
  <g transform="translate(850, 150)">
    <rect x="0" y="0" width="130" height="520" fill="#ecf0f1" stroke="#95a5a6" stroke-width="2" rx="5"/>
    
    <text x="65" y="25" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#34495e">
      Key Tips
    </text>
    
    <!-- Tip 1 -->
    <g transform="translate(10, 45)">
      <circle cx="5" cy="5" r="3" fill="#3498db"/>
      <text x="15" y="9" font-family="Arial, sans-serif" font-size="9" fill="#34495e">
        Start with most
      </text>
      <text x="15" y="19" font-family="Arial, sans-serif" font-size="9" fill="#34495e">
        impactful params
      </text>
    </g>
    
    <!-- Tip 2 -->
    <g transform="translate(10, 105)">
      <circle cx="5" cy="5" r="3" fill="#27ae60"/>
      <text x="15" y="9" font-family="Arial, sans-serif" font-size="9" fill="#34495e">
        Use log scale for
      </text>
      <text x="15" y="19" font-family="Arial, sans-serif" font-size="9" fill="#34495e">
        learning rates
      </text>
    </g>
    
    <!-- Tip 3 -->
    <g transform="translate(10, 165)">
      <circle cx="5" cy="5" r="3" fill="#f39c12"/>
      <text x="15" y="9" font-family="Arial, sans-serif" font-size="9" fill="#34495e">
        Consider time
      </text>
      <text x="15" y="19" font-family="Arial, sans-serif" font-size="9" fill="#34495e">
        constraints
      </text>
    </g>
    
    <!-- Tip 4 -->
    <g transform="translate(10, 225)">
      <circle cx="5" cy="5" r="3" fill="#e74c3c"/>
      <text x="15" y="9" font-family="Arial, sans-serif" font-size="9" fill="#34495e">
        Use k-fold CV
      </text>
      <text x="15" y="19" font-family="Arial, sans-serif" font-size="9" fill="#34495e">
        (k=5 or k=10)
      </text>
    </g>
    
    <!-- Tip 5 -->
    <g transform="translate(10, 285)">
      <circle cx="5" cy="5" r="3" fill="#9b59b6"/>
      <text x="15" y="9" font-family="Arial, sans-serif" font-size="9" fill="#34495e">
        Balance accuracy
      </text>
      <text x="15" y="19" font-family="Arial, sans-serif" font-size="9" fill="#34495e">
        vs complexity
      </text>
    </g>
    
    <!-- Best Practice Box -->
    <rect x="5" y="320" width="120" height="190" fill="white" stroke="#3498db" stroke-width="2" rx="3"/>
    <text x="65" y="340" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#3498db">
      Best Practice
    </text>
    <text x="65" y="360" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#34495e">
      Always separate
    </text>
    <text x="65" y="372" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#34495e">
      your data into:
    </text>
    <text x="65" y="392" font-family="Arial, sans-serif" font-size="8" font-weight="bold" text-anchor="middle" fill="#27ae60">
      Training Set
    </text>
    <text x="65" y="404" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="#7f8c8d">
      (model learning)
    </text>
    <text x="65" y="424" font-family="Arial, sans-serif" font-size="8" font-weight="bold" text-anchor="middle" fill="#f39c12">
      Validation Set
    </text>
    <text x="65" y="436" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="#7f8c8d">
      (hyperparameter
    </text>
    <text x="65" y="446" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="#7f8c8d">
      tuning)
    </text>
    <text x="65" y="466" font-family="Arial, sans-serif" font-size="8" font-weight="bold" text-anchor="middle" fill="#e74c3c">
      Test Set
    </text>
    <text x="65" y="478" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="#7f8c8d">
      (final unbiased
    </text>
    <text x="65" y="488" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="#7f8c8d">
      evaluation)
    </text>
  </g>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead-lg" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#95a5a6"/>
    </marker>
  </defs>
</svg>