<svg width="900" height="700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title-text { font-family: 'Arial', sans-serif; font-size: 28px; font-weight: bold; fill: #2c3e50; }
      .subtitle-text { font-family: 'Arial', sans-serif; font-size: 18px; font-weight: bold; fill: #34495e; }
      .header-text { font-family: 'Arial', sans-serif; font-size: 16px; font-weight: bold; fill: #2c3e50; }
      .formula-text { font-family: 'Arial', sans-serif; font-size: 20px; font-weight: bold; fill: #8e44ad; }
      .value-text { font-family: 'Arial', sans-serif; font-size: 16px; font-weight: bold; fill: #2c3e50; }
      .desc-text { font-family: 'Arial', sans-serif; font-size: 14px; fill: #2c3e50; }
      .scenario-text { font-family: 'Arial', sans-serif; font-size: 12px; fill: #34495e; }
    </style>
    
    <!-- Gradient for balance scale -->
    <linearGradient id="scaleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#27ae60;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8e44ad;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3498db;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="700" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" class="title-text">F1-Score: The Harmonic Mean Balance</text>
  
  <!-- Main formula -->
  <rect x="200" y="60" width="500" height="60" fill="#ecf0f1" stroke="#8e44ad" stroke-width="3" rx="10"/>
  <text x="450" y="85" text-anchor="middle" class="formula-text">F1 = 2 × (Precision × Recall) / (Precision + Recall)</text>
  <text x="450" y="105" text-anchor="middle" class="desc-text">Harmonic mean penalizes extreme values more than arithmetic mean</text>
  
  <!-- Balance Scale Visualization -->
  <text x="450" y="150" text-anchor="middle" class="subtitle-text">Visual Balance Scale</text>
  
  <!-- Scale base -->
  <rect x="400" y="170" width="100" height="20" fill="#34495e" rx="5"/>
  <rect x="445" y="190" width="10" height="30" fill="#34495e"/>
  
  <!-- Scale arm -->
  <rect x="300" y="215" width="300" height="8" fill="url(#scaleGradient)" rx="4"/>
  
  <!-- Precision side -->
  <rect x="280" y="200" width="80" height="40" fill="#27ae60" stroke="#1e8449" stroke-width="2" rx="5"/>
  <text x="320" y="218" text-anchor="middle" class="value-text" fill="white">PRECISION</text>
  <text x="320" y="235" text-anchor="middle" class="scenario-text" fill="white">Accuracy Focus</text>
  
  <!-- Recall side -->
  <rect x="540" y="200" width="80" height="40" fill="#3498db" stroke="#2980b9" stroke-width="2" rx="5"/>
  <text x="580" y="218" text-anchor="middle" class="value-text" fill="white">RECALL</text>
  <text x="580" y="235" text-anchor="middle" class="scenario-text" fill="white">Coverage Focus</text>
  
  <!-- F1 center -->
  <circle cx="450" cy="220" r="25" fill="#8e44ad" stroke="#6c3483" stroke-width="3"/>
  <text x="450" y="225" text-anchor="middle" class="value-text" fill="white">F1</text>
  
  <!-- Scenario examples -->
  <text x="450" y="280" text-anchor="middle" class="subtitle-text">F1-Score Behavior in Different Scenarios</text>
  
  <!-- Scenario 1: Perfect Balance -->
  <rect x="50" y="300" width="250" height="120" fill="#e8f5e8" stroke="#27ae60" stroke-width="2" rx="5"/>
  <text x="175" y="320" text-anchor="middle" class="header-text" fill="#27ae60">Perfect Balance</text>
  <text x="70" y="340" class="desc-text">Precision = 0.8, Recall = 0.8</text>
  <text x="70" y="360" class="desc-text">F1 = 2 × (0.8 × 0.8) / (0.8 + 0.8) = 0.8</text>
  <text x="70" y="380" class="desc-text" font-weight="bold">Result: Balanced performance</text>
  <text x="70" y="400" class="desc-text" font-style="italic">F1 equals both metrics when equal</text>
  
  <!-- Scenario 2: High Precision, Low Recall -->
  <rect x="325" y="300" width="250" height="120" fill="#fff3e0" stroke="#e67e22" stroke-width="2" rx="5"/>
  <text x="450" y="320" text-anchor="middle" class="header-text" fill="#e67e22">Precision Dominant</text>
  <text x="345" y="340" class="desc-text">Precision = 0.9, Recall = 0.3</text>
  <text x="345" y="360" class="desc-text">F1 = 2 × (0.9 × 0.3) / (0.9 + 0.3) = 0.45</text>
  <text x="345" y="380" class="desc-text" font-weight="bold">Result: Heavily penalized</text>
  <text x="345" y="400" class="desc-text" font-style="italic">Low recall drags down F1</text>
  
  <!-- Scenario 3: Low Precision, High Recall -->
  <rect x="600" y="300" width="250" height="120" fill="#e3f2fd" stroke="#3498db" stroke-width="2" rx="5"/>
  <text x="725" y="320" text-anchor="middle" class="header-text" fill="#3498db">Recall Dominant</text>
  <text x="620" y="340" class="desc-text">Precision = 0.3, Recall = 0.9</text>
  <text x="620" y="360" class="desc-text">F1 = 2 × (0.3 × 0.9) / (0.3 + 0.9) = 0.45</text>
  <text x="620" y="380" class="desc-text" font-weight="bold">Result: Heavily penalized</text>
  <text x="620" y="400" class="desc-text" font-style="italic">Low precision drags down F1</text>
  
  <!-- Comparison table -->
  <rect x="100" y="450" width="700" height="180" fill="#f8f9fa" stroke="#34495e" stroke-width="2" rx="5"/>
  <text x="450" y="475" text-anchor="middle" class="subtitle-text">F1-Score vs Arithmetic Mean Comparison</text>
  
  <!-- Table headers -->
  <rect x="120" y="490" width="120" height="30" fill="#34495e"/>
  <rect x="240" y="490" width="100" height="30" fill="#34495e"/>
  <rect x="340" y="490" width="100" height="30" fill="#34495e"/>
  <rect x="440" y="490" width="120" height="30" fill="#34495e"/>
  <rect x="560" y="490" width="120" height="30" fill="#34495e"/>
  <rect x="680" y="490" width="100" height="30" fill="#34495e"/>
  
  <text x="180" y="508" text-anchor="middle" class="scenario-text" fill="white" font-weight="bold">Scenario</text>
  <text x="290" y="508" text-anchor="middle" class="scenario-text" fill="white" font-weight="bold">Precision</text>
  <text x="390" y="508" text-anchor="middle" class="scenario-text" fill="white" font-weight="bold">Recall</text>
  <text x="500" y="508" text-anchor="middle" class="scenario-text" fill="white" font-weight="bold">F1-Score</text>
  <text x="620" y="508" text-anchor="middle" class="scenario-text" fill="white" font-weight="bold">Arithmetic Mean</text>
  <text x="730" y="508" text-anchor="middle" class="scenario-text" fill="white" font-weight="bold">Difference</text>
  
  <!-- Table rows -->
  <!-- Row 1 -->
  <text x="180" y="538" text-anchor="middle" class="scenario-text">Perfect</text>
  <text x="290" y="538" text-anchor="middle" class="scenario-text">1.0</text>
  <text x="390" y="538" text-anchor="middle" class="scenario-text">1.0</text>
  <text x="500" y="538" text-anchor="middle" class="scenario-text" fill="#27ae60" font-weight="bold">1.0</text>
  <text x="620" y="538" text-anchor="middle" class="scenario-text">1.0</text>
  <text x="730" y="538" text-anchor="middle" class="scenario-text">0.0</text>
  
  <!-- Row 2 -->
  <text x="180" y="558" text-anchor="middle" class="scenario-text">Balanced</text>
  <text x="290" y="558" text-anchor="middle" class="scenario-text">0.8</text>
  <text x="390" y="558" text-anchor="middle" class="scenario-text">0.8</text>
  <text x="500" y="558" text-anchor="middle" class="scenario-text" fill="#27ae60" font-weight="bold">0.8</text>
  <text x="620" y="558" text-anchor="middle" class="scenario-text">0.8</text>
  <text x="730" y="558" text-anchor="middle" class="scenario-text">0.0</text>
  
  <!-- Row 3 -->
  <text x="180" y="578" text-anchor="middle" class="scenario-text">Extreme</text>
  <text x="290" y="578" text-anchor="middle" class="scenario-text">1.0</text>
  <text x="390" y="578" text-anchor="middle" class="scenario-text">0.1</text>
  <text x="500" y="578" text-anchor="middle" class="scenario-text" fill="#e74c3c" font-weight="bold">0.18</text>
  <text x="620" y="578" text-anchor="middle" class="scenario-text">0.55</text>
  <text x="730" y="578" text-anchor="middle" class="scenario-text" fill="#e74c3c">-0.37</text>
  
  <!-- Row 4 -->
  <text x="180" y="598" text-anchor="middle" class="scenario-text">Moderate</text>
  <text x="290" y="598" text-anchor="middle" class="scenario-text">0.6</text>
  <text x="390" y="598" text-anchor="middle" class="scenario-text">0.4</text>
  <text x="500" y="598" text-anchor="middle" class="scenario-text" fill="#f39c12" font-weight="bold">0.48</text>
  <text x="620" y="598" text-anchor="middle" class="scenario-text">0.5</text>
  <text x="730" y="598" text-anchor="middle" class="scenario-text">-0.02</text>
  
  <!-- Key insight -->
  <text x="450" y="655" text-anchor="middle" class="header-text" fill="#8e44ad">Key Insight: F1-Score is more conservative than arithmetic mean</text>
  <text x="450" y="675" text-anchor="middle" class="desc-text">The harmonic mean heavily penalizes models with one very low metric</text>
  <text x="450" y="690" text-anchor="middle" class="desc-text" font-style="italic">This encourages balanced performance across both precision and recall</text>
</svg>