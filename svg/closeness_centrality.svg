<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="700" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="500" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Closeness Centrality: Airport Location Problem
  </text>
  
  <!-- Subtitle -->
  <text x="500" y="70" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#7f8c8d">
    Finding the optimal location with minimum average travel time
  </text>
  
  <!-- Left Side: Network Diagram -->
  <g id="network">
    <!-- Region background -->
    <rect x="50" y="100" width="400" height="500" fill="#e8f4f8" stroke="#3498db" stroke-width="2" rx="10"/>
    <text x="250" y="130" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      City Network
    </text>
    
    <!-- Cities (nodes) -->
    <circle id="cityA" cx="150" cy="200" r="30" fill="#e74c3c" stroke="#c0392b" stroke-width="3"/>
    <text x="150" y="210" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">A</text>
    
    <circle id="cityB" cx="350" cy="200" r="30" fill="#3498db" stroke="#2980b9" stroke-width="3"/>
    <text x="350" y="210" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">B</text>
    
    <circle id="cityC" cx="150" cy="350" r="30" fill="#3498db" stroke="#2980b9" stroke-width="3"/>
    <text x="150" y="360" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">C</text>
    
    <circle id="cityD" cx="350" cy="350" r="30" fill="#3498db" stroke="#2980b9" stroke-width="3"/>
    <text x="350" y="360" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">D</text>
    
    <circle id="cityE" cx="250" cy="500" r="30" fill="#3498db" stroke="#2980b9" stroke-width="3"/>
    <text x="250" y="510" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">E</text>
    
    <!-- Edges with weights -->
    <line x1="180" y1="200" x2="320" y2="200" stroke="#34495e" stroke-width="3"/>
    <text x="250" y="190" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#e74c3c">25</text>
    
    <line x1="150" y1="230" x2="150" y2="320" stroke="#34495e" stroke-width="3"/>
    <text x="130" y="280" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#e74c3c">30</text>
    
    <line x1="350" y1="230" x2="350" y2="320" stroke="#34495e" stroke-width="3"/>
    <text x="370" y="280" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#e74c3c">20</text>
    
    <line x1="170" y1="220" x2="330" y2="330" stroke="#34495e" stroke-width="3"/>
    <text x="250" y="270" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#e74c3c">35</text>
    
    <line x1="180" y1="350" x2="320" y2="350" stroke="#34495e" stroke-width="3"/>
    <text x="250" y="340" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#e74c3c">15</text>
    
    <line x1="170" y1="370" x2="230" y2="480" stroke="#34495e" stroke-width="3"/>
    <text x="180" y="430" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#e74c3c">22</text>
    
    <line x1="330" y1="370" x2="270" y2="480" stroke="#34495e" stroke-width="3"/>
    <text x="320" y="430" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#e74c3c">18</text>
    
    <!-- Legend for highlighted city -->
    <text x="250" y="560" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#e74c3c" font-weight="bold">
      City A: Highest Closeness Centrality
    </text>
  </g>
  
  <!-- Right Side: Calculations -->
  <g id="calculations">
    <!-- Calculation box -->
    <rect x="500" y="100" width="450" height="500" fill="white" stroke="#bdc3c7" stroke-width="2" rx="10"/>
    <text x="725" y="130" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Average Geodesic Distance
    </text>
    
    <!-- Formula -->
    <rect x="520" y="150" width="410" height="80" fill="#ecf0f1" rx="5"/>
    <text x="725" y="175" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Average Distance =
    </text>
    <text x="725" y="205" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#e74c3c">
      (1/(n-1)) × Σ d_ij
    </text>
    
    <!-- Table Header -->
    <rect x="520" y="250" width="410" height="30" fill="#3498db"/>
    <text x="570" y="272" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">City</text>
    <text x="680" y="272" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Σ Distances</text>
    <text x="830" y="272" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Average</text>
    
    <!-- Table Rows -->
    <!-- City A (Best) -->
    <rect x="520" y="280" width="410" height="40" fill="#ffe6e6"/>
    <text x="570" y="305" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">A</text>
    <text x="680" y="305" font-family="Arial, sans-serif" font-size="16" fill="#2c3e50">25+30+45+52 = 152</text>
    <text x="830" y="305" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#e74c3c">38.0</text>
    
    <!-- City B -->
    <rect x="520" y="320" width="410" height="40" fill="#f8f9fa"/>
    <text x="570" y="345" font-family="Arial, sans-serif" font-size="16" fill="#2c3e50">B</text>
    <text x="680" y="345" font-family="Arial, sans-serif" font-size="16" fill="#2c3e50">25+35+20+38 = 118</text>
    <text x="830" y="345" font-family="Arial, sans-serif" font-size="16" fill="#2c3e50">39.3</text>
    
    <!-- City C -->
    <rect x="520" y="360" width="410" height="40" fill="#f8f9fa"/>
    <text x="570" y="385" font-family="Arial, sans-serif" font-size="16" fill="#2c3e50">C</text>
    <text x="680" y="385" font-family="Arial, sans-serif" font-size="16" fill="#2c3e50">30+50+15+22 = 117</text>
    <text x="830" y="385" font-family="Arial, sans-serif" font-size="16" fill="#2c3e50">39.0</text>
    
    <!-- City D -->
    <rect x="520" y="400" width="410" height="40" fill="#f8f9fa"/>
    <text x="570" y="425" font-family="Arial, sans-serif" font-size="16" fill="#2c3e50">D</text>
    <text x="680" y="425" font-family="Arial, sans-serif" font-size="16" fill="#2c3e50">45+20+15+18 = 98</text>
    <text x="830" y="425" font-family="Arial, sans-serif" font-size="16" fill="#2c3e50">32.7</text>
    
    <!-- City E -->
    <rect x="520" y="440" width="410" height="40" fill="#f8f9fa"/>
    <text x="570" y="465" font-family="Arial, sans-serif" font-size="16" fill="#2c3e50">E</text>
    <text x="680" y="465" font-family="Arial, sans-serif" font-size="16" fill="#2c3e50">52+38+22+18 = 130</text>
    <text x="830" y="465" font-family="Arial, sans-serif" font-size="16" fill="#2c3e50">43.3</text>
    
    <!-- Conclusion -->
    <rect x="520" y="500" width="410" height="80" fill="#d5f4e6" stroke="#27ae60" stroke-width="2" rx="5"/>
    <text x="725" y="525" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#27ae60">
      Optimal Location: City A
    </text>
    <text x="725" y="550" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50">
      Minimum average geodesic distance
    </text>
    <text x="725" y="570" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50">
      Best accessibility to all other cities
    </text>
  </g>
  
  <!-- Arrow indicating optimal choice -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#27ae60"/>
    </marker>
  </defs>
  <line x1="180" y1="200" x2="480" y2="290" stroke="#27ae60" stroke-width="3" marker-end="url(#arrowhead)" stroke-dasharray="5,5"/>
  
  <!-- Footer Note -->
  <text x="500" y="680" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d" font-style="italic">
    Closeness centrality identifies the most central node based on average shortest path distances
  </text>
</svg>