<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title-text { font-family: 'Arial', sans-serif; font-size: 24px; font-weight: bold; fill: #2c3e50; }
      .section-text { font-family: 'Arial', sans-serif; font-size: 18px; font-weight: bold; fill: #34495e; }
      .label-text { font-family: 'Arial', sans-serif; font-size: 12px; fill: #2c3e50; }
      .score-text { font-family: 'Arial', sans-serif; font-size: 16px; font-weight: bold; }
      .good-community { fill: #3498db; stroke: #2980b9; stroke-width: 2; }
      .bad-community { fill: #e74c3c; stroke: #c0392b; stroke-width: 2; }
      .neutral-node { fill: #95a5a6; stroke: #7f8c8d; stroke-width: 2; }
      .strong-edge { stroke: #2c3e50; stroke-width: 4; }
      .weak-edge { stroke: #7f8c8d; stroke-width: 2; stroke-dasharray: 5,3; }
      .community-boundary { fill: none; stroke-width: 3; stroke-dasharray: 15,5; opacity: 0.8; }
      .good-boundary { stroke: #27ae60; }
      .bad-boundary { stroke: #e74c3c; }
      .excellent { fill: #27ae60; }
      .poor { fill: #e74c3c; }
    </style>
  </defs>
  
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" class="title-text">Community Quality Comparison</text>
  
  <!-- High Modularity Example -->
  <text x="200" y="70" text-anchor="middle" class="section-text">High Modularity (Q = 0.85)</text>
  
  <!-- Community 1 (Left) -->
  <ellipse cx="120" cy="150" rx="60" ry="50" class="community-boundary good-boundary"/>
  <circle cx="100" cy="130" r="10" class="good-community"/>
  <circle cx="140" cy="130" r="10" class="good-community"/>
  <circle cx="120" cy="170" r="10" class="good-community"/>
  <circle cx="100" cy="170" r="10" class="good-community"/>
  
  <!-- Strong internal connections -->
  <line x1="100" y1="130" x2="140" y2="130" class="strong-edge"/>
  <line x1="100" y1="130" x2="120" y2="170" class="strong-edge"/>
  <line x1="140" y1="130" x2="120" y2="170" class="strong-edge"/>
  <line x1="100" y1="170" x2="120" y2="170" class="strong-edge"/>
  <line x1="100" y1="130" x2="100" y2="170" class="strong-edge"/>
  <line x1="140" y1="130" x2="100" y2="170" class="strong-edge"/>
  
  <!-- Community 2 (Right) -->
  <ellipse cx="280" cy="150" rx="60" ry="50" class="community-boundary good-boundary"/>
  <circle cx="260" cy="130" r="10" class="good-community"/>
  <circle cx="300" cy="130" r="10" class="good-community"/>
  <circle cx="280" cy="170" r="10" class="good-community"/>
  <circle cx="300" cy="170" r="10" class="good-community"/>
  
  <!-- Strong internal connections -->
  <line x1="260" y1="130" x2="300" y2="130" class="strong-edge"/>
  <line x1="260" y1="130" x2="280" y2="170" class="strong-edge"/>
  <line x1="300" y1="130" x2="280" y2="170" class="strong-edge"/>
  <line x1="280" y1="170" x2="300" y2="170" class="strong-edge"/>
  <line x1="300" y1="130" x2="300" y2="170" class="strong-edge"/>
  
  <!-- Weak inter-community connection -->
  <line x1="140" y1="130" x2="260" y2="130" class="weak-edge"/>
  
  <!-- Labels for high modularity -->
  <text x="120" y="230" text-anchor="middle" class="label-text">Dense internal</text>
  <text x="120" y="245" text-anchor="middle" class="label-text">connections</text>
  <text x="280" y="230" text-anchor="middle" class="label-text">Clear community</text>
  <text x="280" y="245" text-anchor="middle" class="label-text">boundaries</text>
  
  <!-- Score box -->
  <rect x="150" y="260" width="100" height="30" fill="#27ae60" opacity="0.2" stroke="#27ae60"/>
  <text x="200" y="280" text-anchor="middle" class="score-text excellent">Q = 0.85</text>
  
  <!-- Low Modularity Example -->
  <text x="700" y="70" text-anchor="middle" class="section-text">Low Modularity (Q = 0.12)</text>
  
  <!-- Poor Community 1 -->
  <ellipse cx="620" cy="150" rx="60" ry="50" class="community-boundary bad-boundary"/>
  <circle cx="600" cy="130" r="10" class="bad-community"/>
  <circle cx="640" cy="130" r="10" class="bad-community"/>
  <circle cx="620" cy="170" r="10" class="bad-community"/>
  
  <!-- Weak internal connections -->
  <line x1="600" y1="130" x2="640" y2="130" class="weak-edge"/>
  <line x1="600" y1="130" x2="620" y2="170" class="weak-edge"/>
  
  <!-- Poor Community 2 -->
  <ellipse cx="780" cy="150" rx="60" ry="50" class="community-boundary bad-boundary"/>
  <circle cx="760" cy="130" r="10" class="bad-community"/>
  <circle cx="800" cy="130" r="10" class="bad-community"/>
  <circle cx="780" cy="170" r="10" class="bad-community"/>
  
  <!-- Many inter-community connections -->
  <line x1="640" y1="130" x2="760" y2="130" class="strong-edge"/>
  <line x1="620" y1="170" x2="780" y2="170" class="strong-edge"/>
  <line x1="600" y1="130" x2="760" y2="130" class="weak-edge"/>
  <line x1="640" y1="130" x2="780" y2="170" class="weak-edge"/>
  
  <!-- Labels for low modularity -->
  <text x="620" y="230" text-anchor="middle" class="label-text">Sparse internal</text>
  <text x="620" y="245" text-anchor="middle" class="label-text">connections</text>
  <text x="780" y="230" text-anchor="middle" class="label-text">Many external</text>
  <text x="780" y="245" text-anchor="middle" class="label-text">connections</text>
  
  <!-- Score box -->
  <rect x="650" y="260" width="100" height="30" fill="#e74c3c" opacity="0.2" stroke="#e74c3c"/>
  <text x="700" y="280" text-anchor="middle" class="score-text poor">Q = 0.12</text>
  
  <!-- Baseline Comparison -->
  <text x="450" y="340" text-anchor="middle" class="section-text">Random Baseline for Comparison</text>
  
  <!-- Random graph representation -->
  <rect x="300" y="360" width="300" height="120" fill="none" stroke="#95a5a6" stroke-width="2" stroke-dasharray="10,5"/>
  <text x="450" y="380" text-anchor="middle" class="label-text">Expected connections in random graph with same degree sequence</text>
  
  <!-- Random nodes -->
  <circle cx="350" cy="420" r="8" class="neutral-node"/>
  <circle cx="400" cy="400" r="8" class="neutral-node"/>
  <circle cx="450" cy="420" r="8" class="neutral-node"/>
  <circle cx="500" cy="400" r="8" class="neutral-node"/>
  <circle cx="550" cy="420" r="8" class="neutral-node"/>
  <circle cx="400" cy="450" r="8" class="neutral-node"/>
  <circle cx="500" cy="450" r="8" class="neutral-node"/>
  
  <!-- Random edges -->
  <line x1="350" y1="420" x2="400" y2="400" stroke="#bdc3c7" stroke-width="2"/>
  <line x1="400" y1="400" x2="450" y2="420" stroke="#bdc3c7" stroke-width="2"/>
  <line x1="450" y1="420" x2="500" y2="400" stroke="#bdc3c7" stroke-width="2"/>
  <line x1="500" y1="400" x2="550" y2="420" stroke="#bdc3c7" stroke-width="2"/>
  <line x1="350" y1="420" x2="400" y2="450" stroke="#bdc3c7" stroke-width="2"/>
  <line x1="500" y1="450" x2="550" y2="420" stroke="#bdc3c7" stroke-width="2"/>
  
  <!-- Explanation text -->
  <text x="450" y="510" text-anchor="middle" class="label-text">Modularity = Actual edges - Expected edges from random baseline</text>
  <text x="450" y="525" text-anchor="middle" class="label-text">Good communities have many more internal edges than expected by chance</text>
  
  <!-- Key -->
  <rect x="50" y="530" width="200" height="60" fill="none" stroke="#34495e" stroke-width="1"/>
  <text x="150" y="550" text-anchor="middle" class="section-text">Legend</text>
  <line x1="70" y1="560" x2="100" y2="560" class="strong-edge"/>
  <text x="110" y="565" class="label-text">Strong connections</text>
  <line x1="70" y1="575" x2="100" y2="575" class="weak-edge"/>
  <text x="110" y="580" class="label-text">Weak/External connections</text>
  
</svg>