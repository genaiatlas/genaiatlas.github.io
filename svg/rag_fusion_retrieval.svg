<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <rect width="1000" height="700" fill="#f8f9fa"/>
  <text x="500" y="30" font-size="26" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    RAG-Fusion: Multi-Query Retrieval
  </text>
  
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#666"/>
    </marker>
  </defs>
  
  <!-- Original Query -->
  <rect x="350" y="60" width="300" height="60" rx="8" fill="#4a90e2" stroke="#2e5c8a" stroke-width="2"/>
  <text x="500" y="85" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Original Query</text>
  <text x="500" y="105" font-size="11" text-anchor="middle" fill="white">How to optimize neural networks?</text>
  
  <!-- LLM Generation -->
  <line x1="500" y1="120" x2="500" y2="160" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  
  <rect x="300" y="160" width="400" height="70" rx="8" fill="#f39c12" stroke="#c87f0a" stroke-width="2"/>
  <text x="500" y="185" font-size="15" font-weight="bold" text-anchor="middle" fill="white">LLM Query Generator</text>
  <text x="500" y="208" font-size="10" text-anchor="middle" fill="white">Generate 3-5 query variations from different perspectives</text>
  
  <!-- Generated Queries -->
  <line x1="250" y1="230" x2="150" y2="270" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="230" x2="350" y2="270" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="230" x2="500" y2="270" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="230" x2="650" y2="270" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="750" y1="230" x2="850" y2="270" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Query 1 -->
  <rect x="30" y="270" width="240" height="60" rx="6" fill="#9b59b6" stroke="#7d3c98" stroke-width="2"/>
  <text x="150" y="290" font-size="10" font-weight="bold" text-anchor="middle" fill="white">Query 1</text>
  <text x="150" y="306" font-size="9" text-anchor="middle" fill="white">Neural network training</text>
  <text x="150" y="320" font-size="9" text-anchor="middle" fill="white">optimization techniques</text>
  
  <!-- Query 2 -->
  <rect x="285" y="270" width="230" height="60" rx="6" fill="#9b59b6" stroke="#7d3c98" stroke-width="2"/>
  <text x="400" y="290" font-size="10" font-weight="bold" text-anchor="middle" fill="white">Query 2</text>
  <text x="400" y="306" font-size="9" text-anchor="middle" fill="white">Improve deep learning</text>
  <text x="400" y="320" font-size="9" text-anchor="middle" fill="white">model performance</text>
  
  <!-- Query 3 -->
  <rect x="430" y="270" width="240" height="60" rx="6" fill="#9b59b6" stroke="#7d3c98" stroke-width="2"/>
  <text x="550" y="290" font-size="10" font-weight="bold" text-anchor="middle" fill="white">Query 3 (Original)</text>
  <text x="550" y="306" font-size="9" text-anchor="middle" fill="white">How to optimize</text>
  <text x="550" y="320" font-size="9" text-anchor="middle" fill="white">neural networks?</text>
  
  <!-- Query 4 -->
  <rect x="585" y="270" width="230" height="60" rx="6" fill="#9b59b6" stroke="#7d3c98" stroke-width="2"/>
  <text x="700" y="290" font-size="10" font-weight="bold" text-anchor="middle" fill="white">Query 4</text>
  <text x="700" y="306" font-size="9" text-anchor="middle" fill="white">Best practices for</text>
  <text x="700" y="320" font-size="9" text-anchor="middle" fill="white">hyperparameter tuning</text>
  
  <!-- Query 5 -->
  <rect x="730" y="270" width="240" height="60" rx="6" fill="#9b59b6" stroke="#7d3c98" stroke-width="2"/>
  <text x="850" y="290" font-size="10" font-weight="bold" text-anchor="middle" fill="white">Query 5</text>
  <text x="850" y="306" font-size="9" text-anchor="middle" fill="white">Speedup neural</text>
  <text x="850" y="320" font-size="9" text-anchor="middle" fill="white">network convergence</text>
  
  <!-- Parallel Retrieval -->
  <line x1="150" y1="330" x2="200" y2="380" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="330" x2="350" y2="380" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="550" y1="330" x2="500" y2="380" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="700" y1="330" x2="650" y2="380" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="850" y1="330" x2="800" y2="380" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  
  <text x="150" y="360" font-size="9" fill="#666">3 docs</text>
  <text x="400" y="360" font-size="9" fill="#666">4 docs</text>
  <text x="550" y="360" font-size="9" fill="#666">3 docs</text>
  <text x="700" y="360" font-size="9" fill="#666">5 docs</text>
  <text x="850" y="360" font-size="9" fill="#666">2 docs</text>
  
  <!-- RRF Fusion -->
  <rect x="200" y="380" width="600" height="90" rx="8" fill="#27ae60" stroke="#1e8449" stroke-width="2"/>
  <text x="500" y="410" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Reciprocal Rank Fusion (RRF)</text>
  <text x="500" y="433" font-size="11" text-anchor="middle" fill="white">Score(doc) = sum 1/(k + rank_i) across all query results</text>
  <text x="500" y="453" font-size="10" text-anchor="middle" fill="white">Combine and deduplicate: 17 unique documents to fused ranking</text>
  
  <!-- Final Results -->
  <line x1="500" y1="470" x2="500" y2="510" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  
  <rect x="250" y="510" width="500" height="80" rx="8" fill="#3498db" stroke="#2874a6" stroke-width="2"/>
  <text x="500" y="540" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Fused and Ranked Results</text>
  <text x="500" y="563" font-size="10" text-anchor="middle" fill="white">Top 10 documents with combined scores</text>
  <text x="500" y="580" font-size="9" text-anchor="middle" fill="white">Better coverage and diversity than single query retrieval</text>
  
  <!-- Benefits Box -->
  <rect x="30" y="610" width="440" height="75" rx="6" fill="white" stroke="#27ae60" stroke-width="2"/>
  <text x="250" y="635" font-size="13" font-weight="bold" text-anchor="middle" fill="#27ae60">Benefits</text>
  <g transform="translate(40, 645)">
    <text x="0" y="0" font-size="9" fill="#555">+ Higher recall: Captures diverse relevant documents</text>
    <text x="0" y="15" font-size="9" fill="#555">+ Handles ambiguity: Multiple perspectives covered</text>
    <text x="0" y="30" font-size="9" fill="#555">+ Robustness: Reduces impact of poor query formulation</text>
  </g>
  
  <!-- Trade-offs Box -->
  <rect x="530" y="610" width="440" height="75" rx="6" fill="white" stroke="#e74c3c" stroke-width="2"/>
  <text x="750" y="635" font-size="13" font-weight="bold" text-anchor="middle" fill="#e74c3c">Trade-offs</text>
  <g transform="translate(540, 645)">
    <text x="0" y="0" font-size="9" fill="#555">- Increased latency: Multiple retrievals + LLM generation</text>
    <text x="0" y="15" font-size="9" fill="#555">- Higher cost: 5x retrieval calls + LLM token usage</text>
    <text x="0" y="30" font-size="9" fill="#555">- Complexity: More components to maintain</text>
  </g>
</svg>