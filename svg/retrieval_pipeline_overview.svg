<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <rect width="1000" height="700" fill="#f8f9fa"/>
  
  <text x="500" y="30" font-size="26" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Retrieval Pipeline Overview
  </text>
  
  <!-- Query Input -->
  <rect x="400" y="60" width="200" height="60" rx="8" fill="#4a90e2" stroke="#2e5c8a" stroke-width="2"/>
  <text x="500" y="85" font-size="14" font-weight="bold" text-anchor="middle" fill="white">User Query</text>
  <text x="500" y="105" font-size="12" text-anchor="middle" fill="white">"How to train neural networks?"</text>
  
  <!-- Stage 1: Initial Retrieval -->
  <line x1="500" y1="120" x2="500" y2="160" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#666"/>
    </marker>
  </defs>
  
  <rect x="250" y="160" width="500" height="100" rx="8" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <text x="500" y="185" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Stage 1: Initial Retrieval</text>
  <text x="500" y="208" font-size="11" text-anchor="middle" fill="white">Fast, broad search to capture candidates</text>
  
  <g transform="translate(270, 220)">
    <rect x="0" y="0" width="150" height="30" rx="4" fill="white" fill-opacity="0.2"/>
    <text x="75" y="20" font-size="10" font-weight="bold" text-anchor="middle" fill="white">Vector Search</text>
    
    <rect x="170" y="0" width="130" height="30" rx="4" fill="white" fill-opacity="0.2"/>
    <text x="235" y="20" font-size="10" font-weight="bold" text-anchor="middle" fill="white">BM25 Search</text>
    
    <rect x="320" y="0" width="150" height="30" rx="4" fill="white" fill-opacity="0.2"/>
    <text x="395" y="20" font-size="10" font-weight="bold" text-anchor="middle" fill="white">Hybrid Approach</text>
  </g>
  
  <text x="780" y="215" font-size="10" fill="white" font-weight="bold">Top 100-1000</text>
  
  <!-- Stage 2: Ranking -->
  <line x1="500" y1="260" x2="500" y2="300" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  
  <rect x="250" y="300" width="500" height="100" rx="8" fill="#f39c12" stroke="#c87f0a" stroke-width="2"/>
  <text x="500" y="325" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Stage 2: Ranking &amp; Filtering</text>
  <text x="500" y="348" font-size="11" text-anchor="middle" fill="white">Score and order candidates by relevance</text>
  
  <g transform="translate(270, 360)">
    <rect x="0" y="0" width="145" height="30" rx="4" fill="white" fill-opacity="0.2"/>
    <text x="72" y="20" font-size="10" font-weight="bold" text-anchor="middle" fill="white">BM25 Scoring</text>
    
    <rect x="160" y="0" width="145" height="30" rx="4" fill="white" fill-opacity="0.2"/>
    <text x="232" y="20" font-size="10" font-weight="bold" text-anchor="middle" fill="white">Metadata Filter</text>
    
    <rect x="320" y="0" width="145" height="30" rx="4" fill="white" fill-opacity="0.2"/>
    <text x="392" y="20" font-size="10" font-weight="bold" text-anchor="middle" fill="white">Diversity Check</text>
  </g>
  
  <text x="780" y="355" font-size="10" fill="white" font-weight="bold">Top 50-100</text>
  
  <!-- Stage 3: Re-Ranking -->
  <line x1="500" y1="400" x2="500" y2="440" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  
  <rect x="250" y="440" width="500" height="100" rx="8" fill="#27ae60" stroke="#1e8449" stroke-width="2"/>
  <text x="500" y="465" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Stage 3: Re-Ranking</text>
  <text x="500" y="488" font-size="11" text-anchor="middle" fill="white">Deep semantic analysis of top candidates</text>
  
  <g transform="translate(270, 500)">
    <rect x="0" y="0" width="145" height="30" rx="4" fill="white" fill-opacity="0.2"/>
    <text x="72" y="20" font-size="10" font-weight="bold" text-anchor="middle" fill="white">Cross-Encoder</text>
    
    <rect x="160" y="0" width="145" height="30" rx="4" fill="white" fill-opacity="0.2"/>
    <text x="232" y="20" font-size="10" font-weight="bold" text-anchor="middle" fill="white">ColBERT</text>
    
    <rect x="320" y="0" width="145" height="30" rx="4" fill="white" fill-opacity="0.2"/>
    <text x="392" y="20" font-size="10" font-weight="bold" text-anchor="middle" fill="white">RankGPT</text>
  </g>
  
  <text x="780" y="495" font-size="10" fill="white" font-weight="bold">Top 5-20</text>
  
  <!-- Final Results -->
  <line x1="500" y1="540" x2="500" y2="580" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  
  <rect x="300" y="580" width="400" height="80" rx="8" fill="#3498db" stroke="#2874a6" stroke-width="2"/>
  <text x="500" y="610" font-size="15" font-weight="bold" text-anchor="middle" fill="white">Final Ranked Documents</text>
  <text x="500" y="635" font-size="11" text-anchor="middle" fill="white">High-quality, relevant results ready for generation</text>
  <text x="500" y="653" font-size="10" text-anchor="middle" fill="white">Scores: [0.95, 0.91, 0.88, 0.84, 0.79]</text>
  
  <!-- Performance Metrics Sidebar -->
  <rect x="30" y="160" width="180" height="200" rx="6" fill="white" stroke="#ddd" stroke-width="2"/>
  <text x="120" y="185" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Performance Metrics</text>
  
  <g transform="translate(40, 200)">
    <text x="0" y="0" font-size="10" font-weight="bold" fill="#e74c3c">Stage 1:</text>
    <text x="0" y="15" font-size="9" fill="#666">• Latency: 10-50ms</text>
    <text x="0" y="28" font-size="9" fill="#666">• Recall: 0.85-0.95</text>
    
    <text x="0" y="50" font-size="10" font-weight="bold" fill="#f39c12">Stage 2:</text>
    <text x="0" y="65" font-size="9" fill="#666">• Latency: 5-20ms</text>
    <text x="0" y="78" font-size="9" fill="#666">• Precision: 0.70-0.80</text>
    
    <text x="0" y="100" font-size="10" font-weight="bold" fill="#27ae60">Stage 3:</text>
    <text x="0" y="115" font-size="9" fill="#666">• Latency: 50-200ms</text>
    <text x="0" y="128" font-size="9" fill="#666">• Precision: 0.90-0.98</text>
    
    <text x="0" y="150" font-size="10" font-weight="bold" fill="#1a1a1a">Total: 65-270ms</text>
  </g>
  
  <!-- Trade-offs Box -->
  <rect x="790" y="160" width="180" height="200" rx="6" fill="white" stroke="#ddd" stroke-width="2"/>
  <text x="880" y="185" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Trade-offs</text>
  
  <g transform="translate(800, 200)">
    <text x="0" y="0" font-size="10" font-weight="bold" fill="#1a1a1a">Speed vs Accuracy</text>
    <text x="0" y="18" font-size="9" fill="#666">Fast retrieval:</text>
    <text x="0" y="31" font-size="9" fill="#666">• Lower precision</text>
    <text x="0" y="44" font-size="9" fill="#666">• Higher recall</text>
    
    <text x="0" y="62" font-size="9" fill="#666">Slow re-ranking:</text>
    <text x="0" y="75" font-size="9" fill="#666">• Higher precision</text>
    <text x="0" y="88" font-size="9" fill="#666">• Better quality</text>
    
    <text x="0" y="110" font-size="10" font-weight="bold" fill="#1a1a1a">Optimize by:</text>
    <text x="0" y="125" font-size="9" fill="#666">• Caching</text>
    <text x="0" y="138" font-size="9" fill="#666">• Batch processing</text>
    <text x="0" y="151" font-size="9" fill="#666">• Index optimization</text>
  </g>
</svg>