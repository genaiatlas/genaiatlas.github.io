<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'Arial', sans-serif; font-size: 20px; font-weight: bold; fill: #2c3e50; }
      .subtitle { font-family: 'Arial', sans-serif; font-size: 14px; fill: #34495e; }
      .axis-label { font-family: 'Arial', sans-serif; font-size: 12px; fill: #2c3e50; }
      .data-point { fill: #2c3e50; stroke: white; stroke-width: 2; }
      .linear-line { stroke: #3498db; stroke-width: 3; fill: none; }
      .quadratic-line { stroke: #27ae60; stroke-width: 3; fill: none; }
      .overfit-line { stroke: #e74c3c; stroke-width: 2; fill: none; }
      .grid-line { stroke: #ecf0f1; stroke-width: 1; }
      .legend-box { fill: #ffffff; stroke: #bdc3c7; stroke-width: 1; }
      .warning { fill: #e74c3c; font-weight: bold; }
      .good { fill: #27ae60; font-weight: bold; }
      .caution { fill: #f39c12; font-weight: bold; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title">Polynomial Overfitting: The Danger of Too Many Features</text>
  
  <!-- Grid lines -->
  <g class="grid-line">
    <line x1="80" y1="60" x2="80" y2="360"/>
    <line x1="80" y1="360" x2="380" y2="360"/>
    <!-- Vertical grid lines -->
    <line x1="130" y1="60" x2="130" y2="360"/>
    <line x1="180" y1="60" x2="180" y2="360"/>
    <line x1="230" y1="60" x2="230" y2="360"/>
    <line x1="280" y1="60" x2="280" y2="360"/>
    <line x1="330" y1="60" x2="330" y2="360"/>
    <!-- Horizontal grid lines -->
    <line x1="80" y1="110" x2="380" y2="110"/>
    <line x1="80" y1="160" x2="380" y2="160"/>
    <line x1="80" y1="210" x2="380" y2="210"/>
    <line x1="80" y1="260" x2="380" y2="260"/>
    <line x1="80" y1="310" x2="380" y2="310"/>
  </g>
  
  <!-- Axes -->
  <line x1="80" y1="60" x2="80" y2="370" stroke="#34495e" stroke-width="2"/>
  <line x1="70" y1="360" x2="390" y2="360" stroke="#34495e" stroke-width="2"/>
  
  <!-- Axis labels -->
  <text x="230" y="385" text-anchor="middle" class="axis-label">X (Input Feature)</text>
  <text x="40" y="210" text-anchor="middle" class="axis-label" transform="rotate(-90 40 210)">Y (Target)</text>
  
  <!-- True data points (10 points) -->
  <circle cx="100" cy="320" r="5" class="data-point"/>
  <circle cx="130" cy="300" r="5" class="data-point"/>
  <circle cx="160" cy="270" r="5" class="data-point"/>
  <circle cx="190" cy="230" r="5" class="data-point"/>
  <circle cx="220" cy="180" r="5" class="data-point"/>
  <circle cx="250" cy="150" r="5" class="data-point"/>
  <circle cx="280" cy="140" r="5" class="data-point"/>
  <circle cx="310" cy="160" r="5" class="data-point"/>
  <circle cx="340" cy="200" r="5" class="data-point"/>
  <circle cx="370" cy="280" r="5" class="data-point"/>
  
  <!-- Linear fit (degree 1) - underfitting -->
  <path d="M 80 340 L 380 120" class="linear-line"/>
  
  <!-- Quadratic fit (degree 2) - good fit -->
  <path d="M 80 320 Q 140 280 200 180 T 380 250" class="quadratic-line"/>
  
  <!-- High-degree polynomial (degree 9) - overfitting -->
  <path d="M 80 320 C 90 330 110 290 130 300 S 150 250 160 270 S 180 200 190 230 S 210 160 220 180 S 240 130 250 150 S 270 120 280 140 S 300 180 310 160 S 330 220 340 200 S 360 300 380 280" class="overfit-line"/>
  
  <!-- Legend -->
  <rect x="420" y="60" width="350" height="280" class="legend-box"/>
  <text x="595" y="85" text-anchor="middle" class="subtitle">Model Comparison</text>
  
  <!-- Linear model info -->
  <line x1="440" y1="110" x2="470" y2="110" class="linear-line"/>
  <text x="480" y="115" class="subtitle">Linear Model (Degree 1)</text>
  <text x="440" y="130" class="caution">• High Bias, Low Variance</text>
  <text x="440" y="145" class="caution">• R² ≈ 0.60 - Underfitting</text>
  <text x="440" y="160" class="caution">• Too simple for the data</text>
  
  <!-- Quadratic model info -->
  <line x1="440" y1="180" x2="470" y2="180" class="quadratic-line"/>
  <text x="480" y="185" class="subtitle">Quadratic Model (Degree 2)</text>
  <text x="440" y="200" class="good">• Balanced Bias-Variance</text>
  <text x="440" y="215" class="good">• R² ≈ 0.92 - Good Fit</text>
  <text x="440" y="230" class="good">• Captures true relationship</text>
  
  <!-- Overfitted model info -->
  <line x1="440" y1="250" x2="470" y2="250" class="overfit-line"/>
  <text x="480" y="255" class="subtitle">High-Degree Polynomial (Degree 9)</text>
  <text x="440" y="270" class="warning">• Low Bias, High Variance</text>
  <text x="440" y="285" class="warning">• R² = 1.00 - Perfect Training Fit</text>
  <text x="440" y="300" class="warning">• Overfitting - Poor Generalization</text>
  
  <!-- Key insight box -->
  <rect x="80" y="400" width="690" height="180" fill="#fff3cd" stroke="#ffc107" stroke-width="2" rx="8"/>
  <text x="425" y="425" text-anchor="middle" class="subtitle" fill="#856404">⚠️ The Overfitting Paradox</text>
  
  <text x="100" y="450" class="subtitle" fill="#856404">With 10 data points, we can fit:</text>
  <text x="120" y="470" class="axis-label" fill="#856404">• Degree 1: Underfits (too simple)</text>
  <text x="120" y="485" class="axis-label" fill="#856404">• Degree 2-3: Optimal complexity (good generalization)</text>
  <text x="120" y="500" class="axis-label" fill="#856404">• Degree 9: Perfect training fit but nonsensical curves</text>
  <text x="120" y="515" class="axis-label" fill="#856404">• Degree 20: Mathematically possible but completely meaningless</text>
  
  <text x="100" y="540" class="subtitle" fill="#856404">Rule of Thumb: Use 10-20 data points per parameter to avoid overfitting</text>
  <text x="100" y="560" class="subtitle" fill="#856404">Solution: Cross-validation, regularization, or more data</text>
  
  <!-- Data points legend -->
  <circle cx="450" cy="320" r="5" class="data-point"/>
  <text x="465" y="325" class="subtitle">Training Data Points (n=10)</text>
</svg>