<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #2c3e50; }
      .step-title { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #34495e; }
      .label { font-family: Arial, sans-serif; font-size: 12px; fill: #2c3e50; }
      .center { fill: #e74c3c; stroke: #c0392b; stroke-width: 2; }
      .point { fill: #3498db; stroke: #2980b9; stroke-width: 1; }
      .point-assigned { fill: #27ae60; stroke: #229954; stroke-width: 1; }
      .arrow { stroke: #e67e22; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .grid { stroke: #ecf0f1; stroke-width: 0.5; }
      .step-box { fill: #f8f9fa; stroke: #dee2e6; stroke-width: 1; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e67e22"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title">K-Means Algorithm: Step-by-Step Process</text>
  
  <!-- Step 1: Initialization -->
  <g transform="translate(50, 60)">
    <rect x="0" y="0" width="160" height="120" class="step-box" rx="5"/>
    <text x="80" y="20" text-anchor="middle" class="step-title">Step 1: Initialize</text>
    
    <!-- Grid -->
    <g transform="translate(20, 30)">
      <defs>
        <pattern id="grid1" width="20" height="20" patternUnits="userSpaceOnUse">
          <path d="M 20 0 L 0 0 0 20" fill="none" class="grid"/>
        </pattern>
      </defs>
      <rect width="120" height="80" fill="url(#grid1)"/>
      
      <!-- Random initial centers -->
      <circle cx="30" cy="25" r="6" class="center"/>
      <circle cx="70" cy="50" r="6" class="center"/>
      <circle cx="90" cy="20" r="6" class="center"/>
      
      <!-- Data points -->
      <circle cx="25" cy="35" r="3" class="point"/>
      <circle cx="35" cy="30" r="3" class="point"/>
      <circle cx="65" cy="45" r="3" class="point"/>
      <circle cx="75" cy="55" r="3" class="point"/>
      <circle cx="85" cy="25" r="3" class="point"/>
      <circle cx="95" cy="15" r="3" class="point"/>
    </g>
    
    <text x="80" y="115" text-anchor="middle" class="label">Random centers μ₁, μ₂, μ₃</text>
  </g>
  
  <!-- Arrow 1 -->
  <path d="M 220 120 L 270 120" class="arrow"/>
  
  <!-- Step 2: Assignment -->
  <g transform="translate(290, 60)">
    <rect x="0" y="0" width="160" height="120" class="step-box" rx="5"/>
    <text x="80" y="20" text-anchor="middle" class="step-title">Step 2: Assign Points</text>
    
    <g transform="translate(20, 30)">
      <rect width="120" height="80" fill="url(#grid1)"/>
      
      <!-- Centers -->
      <circle cx="30" cy="25" r="6" class="center"/>
      <circle cx="70" cy="50" r="6" class="center"/>
      <circle cx="90" cy="20" r="6" class="center"/>
      
      <!-- Assigned points with different colors -->
      <circle cx="25" cy="35" r="3" style="fill: #e74c3c;"/>
      <circle cx="35" cy="30" r="3" style="fill: #e74c3c;"/>
      <circle cx="65" cy="45" r="3" style="fill: #f39c12;"/>
      <circle cx="75" cy="55" r="3" style="fill: #f39c12;"/>
      <circle cx="85" cy="25" r="3" style="fill: #9b59b6;"/>
      <circle cx="95" cy="15" r="3" style="fill: #9b59b6;"/>
      
      <!-- Assignment lines -->
      <line x1="30" y1="25" x2="25" y2="35" stroke="#e74c3c" stroke-width="1" opacity="0.5"/>
      <line x1="30" y1="25" x2="35" y2="30" stroke="#e74c3c" stroke-width="1" opacity="0.5"/>
      <line x1="70" y1="50" x2="65" y2="45" stroke="#f39c12" stroke-width="1" opacity="0.5"/>
      <line x1="70" y1="50" x2="75" y2="55" stroke="#f39c12" stroke-width="1" opacity="0.5"/>
      <line x1="90" y1="20" x2="85" y2="25" stroke="#9b59b6" stroke-width="1" opacity="0.5"/>
      <line x1="90" y1="20" x2="95" y2="15" stroke="#9b59b6" stroke-width="1" opacity="0.5"/>
    </g>
    
    <text x="80" y="115" text-anchor="middle" class="label">Assign to nearest center</text>
  </g>
  
  <!-- Arrow 2 -->
  <path d="M 460 120 L 510 120" class="arrow"/>
  
  <!-- Step 3: Update Centers -->
  <g transform="translate(530, 60)">
    <rect x="0" y="0" width="160" height="120" class="step-box" rx="5"/>
    <text x="80" y="20" text-anchor="middle" class="step-title">Step 3: Update Centers</text>
    
    <g transform="translate(20, 30)">
      <rect width="120" height="80" fill="url(#grid1)"/>
      
      <!-- New centers (moved to means) -->
      <circle cx="30" cy="32" r="6" class="center"/>
      <circle cx="70" cy="50" r="6" class="center"/>
      <circle cx="90" cy="18" r="6" class="center"/>
      
      <!-- Points remain same color -->
      <circle cx="25" cy="35" r="3" style="fill: #e74c3c;"/>
      <circle cx="35" cy="30" r="3" style="fill: #e74c3c;"/>
      <circle cx="65" cy="45" r="3" style="fill: #f39c12;"/>
      <circle cx="75" cy="55" r="3" style="fill: #f39c12;"/>
      <circle cx="85" cy="25" r="3" style="fill: #9b59b6;"/>
      <circle cx="95" cy="15" r="3" style="fill: #9b59b6;"/>
      
      <!-- Show movement with arrows -->
      <path d="M 30 25 L 30 32" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowhead)"/>
      <path d="M 90 20 L 90 18" stroke="#9b59b6" stroke-width="2" marker-end="url(#arrowhead)"/>
    </g>
    
    <text x="80" y="115" text-anchor="middle" class="label">μₖ = mean of assigned points</text>
  </g>
  
  <!-- Convergence Arrow -->
  <path d="M 400 200 Q 350 250 400 300" class="arrow"/>
  <text x="320" y="260" class="label">Repeat until</text>
  <text x="320" y="275" class="label">convergence</text>
  
  <!-- Final Result -->
  <g transform="translate(290, 320)">
    <rect x="0" y="0" width="200" height="140" class="step-box" rx="5"/>
    <text x="100" y="20" text-anchor="middle" class="step-title">Final Clustering Result</text>
    
    <g transform="translate(40, 30)">
      <rect width="120" height="90" fill="url(#grid1)"/>
      
      <!-- Final optimized centers -->
      <circle cx="30" cy="32" r="6" class="center"/>
      <circle cx="70" cy="50" r="6" class="center"/>
      <circle cx="87" cy="20" r="6" class="center"/>
      
      <!-- Final point assignments -->
      <circle cx="25" cy="35" r="3" style="fill: #e74c3c;"/>
      <circle cx="35" cy="30" r="3" style="fill: #e74c3c;"/>
      <circle cx="65" cy="45" r="3" style="fill: #f39c12;"/>
      <circle cx="75" cy="55" r="3" style="fill: #f39c12;"/>
      <circle cx="85" cy="25" r="3" style="fill: #9b59b6;"/>
      <circle cx="90" cy="15" r="3" style="fill: #9b59b6;"/>
      
      <!-- Cluster boundaries (ellipses) -->
      <ellipse cx="30" cy="32" rx="12" ry="8" fill="none" stroke="#e74c3c" stroke-width="1" stroke-dasharray="3,3" opacity="0.7"/>
      <ellipse cx="70" cy="50" rx="12" ry="8" fill="none" stroke="#f39c12" stroke-width="1" stroke-dasharray="3,3" opacity="0.7"/>
      <ellipse cx="87" cy="20" rx="12" ry="8" fill="none" stroke="#9b59b6" stroke-width="1" stroke-dasharray="3,3" opacity="0.7"/>
    </g>
    
    <text x="100" y="135" text-anchor="middle" class="label">Optimized cluster centers</text>
  </g>
  
  <!-- Algorithm Properties -->
  <g transform="translate(50, 480)">
    <text x="0" y="0" class="step-title">Algorithm Properties:</text>
    <text x="0" y="20" class="label">• Always converges in finite time</text>
    <text x="0" y="35" class="label">• Minimizes within-cluster sum of squares</text>
    <text x="0" y="50" class="label">• Result depends on initial center placement</text>
    <text x="0" y="65" class="label">• Easily parallelizable for large datasets</text>
  </g>
  
  <!-- Mathematical Formula -->
  <g transform="translate(450, 480)">
    <text x="0" y="0" class="step-title">Objective Function:</text>
    <text x="0" y="25" class="label" style="font-size: 14px;">J = Σ   Σ     ||xₙ - μₖ||²</text>
    <text x="35" y="40" class="label" style="font-size: 10px;">k=1  n∈Sₖ</text>
    <text x="15" y="40" class="label" style="font-size: 10px;">K</text>
  </g>
</svg>