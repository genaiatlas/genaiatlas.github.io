<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="800" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="600" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Floyd-Warshall Algorithm: Dynamic Programming Approach
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="70" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#7f8c8d">
    Computing all-pairs shortest paths by incrementally adding intermediate nodes
  </text>
  
  <!-- Markers definition -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#e74c3c"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#27ae60"/>
    </marker>
  </defs>
  
  <!-- Step 1: Initial 3-node network -->
  <g id="step1">
    <rect x="50" y="100" width="320" height="300" fill="#e8f4f8" stroke="#3498db" stroke-width="2" rx="10"/>
    <text x="210" y="130" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Step 1: 3-Node Network
    </text>
    
    <!-- Nodes -->
    <circle cx="120" cy="200" r="25" fill="#3498db" stroke="#2980b9" stroke-width="3"/>
    <text x="120" y="208" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">1</text>
    
    <circle cx="300" cy="200" r="25" fill="#3498db" stroke="#2980b9" stroke-width="3"/>
    <text x="300" y="208" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">2</text>
    
    <circle cx="210" cy="320" r="25" fill="#3498db" stroke="#2980b9" stroke-width="3"/>
    <text x="210" y="328" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">3</text>
    
    <!-- Edges with weights -->
    <line x1="145" y1="200" x2="275" y2="200" stroke="#34495e" stroke-width="3"/>
    <text x="210" y="190" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#e74c3c">30</text>
    
    <line x1="135" y1="220" x2="195" y2="305" stroke="#34495e" stroke-width="3"/>
    <text x="150" y="270" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#e74c3c">15</text>
    
    <line x1="285" y1="220" x2="225" y2="305" stroke="#34495e" stroke-width="3"/>
    <text x="270" y="270" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#e74c3c">20</text>
    
    <!-- Distance table -->
    <rect x="70" y="360" width="260" height="30" fill="#3498db"/>
    <text x="90" y="380" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">Path</text>
    <text x="180" y="380" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">Distance</text>
    <text x="270" y="380" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">Route</text>
    
    <rect x="70" y="390" width="260" height="2" fill="white"/>
    
    <text x="90" y="410" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">1 to 2</text>
    <text x="180" y="410" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">30</text>
    <text x="270" y="410" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Direct</text>
  </g>
  
  <!-- Arrow between steps -->
  <line x1="380" y1="250" x2="430" y2="250" stroke="#e74c3c" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="405" y="240" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#e74c3c">Add</text>
  <text x="405" y="260" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#e74c3c">Node 4</text>
  
  <!-- Step 2: Adding 4th node -->
  <g id="step2">
    <rect x="440" y="100" width="340" height="300" fill="#fff4e6" stroke="#f39c12" stroke-width="2" rx="10"/>
    <text x="610" y="130" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Step 2: Adding Node 4
    </text>
    
    <!-- Original 3 nodes -->
    <circle cx="510" cy="200" r="25" fill="#3498db" stroke="#2980b9" stroke-width="3"/>
    <text x="510" y="208" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">1</text>
    
    <circle cx="710" cy="200" r="25" fill="#3498db" stroke="#2980b9" stroke-width="3"/>
    <text x="710" y="208" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">2</text>
    
    <circle cx="510" cy="320" r="25" fill="#3498db" stroke="#2980b9" stroke-width="3"/>
    <text x="510" y="328" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">3</text>
    
    <!-- New node -->
    <circle cx="710" cy="320" r="25" fill="#e74c3c" stroke="#c0392b" stroke-width="3"/>
    <text x="710" y="328" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">4</text>
    
    <!-- Old edge (faded) -->
    <line x1="535" y1="200" x2="685" y2="200" stroke="#bdc3c7" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="610" y="190" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#95a5a6">30</text>
    
    <!-- New edges -->
    <line x1="535" y1="210" x2="685" y2="310" stroke="#34495e" stroke-width="3"/>
    <text x="610" y="270" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#e74c3c">20</text>
    
    <line x1="710" y1="225" x2="710" y2="295" stroke="#34495e" stroke-width="3"/>
    <text x="730" y="260" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#e74c3c">16</text>
    
    <line x1="535" y1="320" x2="685" y2="320" stroke="#34495e" stroke-width="3"/>
    <text x="610" y="340" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#e74c3c">10</text>
    
    <line x1="685" y1="310" x2="535" y2="210" stroke="#95a5a6" stroke-width="2"/>
    <line x1="510" y1="225" x2="510" y2="295" stroke="#95a5a6" stroke-width="2"/>
    <text x="490" y="260" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#7f8c8d">15</text>
  </g>
  
  <!-- Arrow between steps 2 and 3 -->
  <line x1="790" y1="250" x2="840" y2="250" stroke="#27ae60" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="815" y="240" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#27ae60">Update</text>
  <text x="815" y="260" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#27ae60">Paths</text>
  
  <!-- Step 3: Updated distances -->
  <g id="step3">
    <rect x="850" y="100" width="300" height="300" fill="#e8f8f5" stroke="#27ae60" stroke-width="2" rx="10"/>
    <text x="1000" y="130" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Step 3: Updated Paths
    </text>
    
    <!-- Comparison table -->
    <rect x="870" y="150" width="260" height="30" fill="#27ae60"/>
    <text x="900" y="170" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Path</text>
    <text x="990" y="170" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Old</text>
    <text x="1060" y="170" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">New</text>
    
    <!-- Row 1 -->
    <rect x="870" y="180" width="260" height="30" fill="#d5f4e6"/>
    <text x="900" y="200" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">1 to 2</text>
    <text x="990" y="200" font-family="Arial, sans-serif" font-size="12" fill="#95a5a6">30</text>
    <text x="1060" y="200" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#27ae60">25</text>
    
    <!-- Explanation -->
    <text x="900" y="220" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">via node 4</text>
    
    <rect x="870" y="230" width="260" height="160" fill="white" stroke="#bdc3c7" stroke-width="1"/>
    <text x="1000" y="255" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Dynamic Programming Logic:
    </text>
    <text x="1000" y="280" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">
      d[1][2] = min(
    </text>
    <text x="1000" y="300" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">
      d[1][2] = 30,
    </text>
    <text x="1000" y="320" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#e74c3c">
      d[1][4] + d[4][2] = 20+16 = 36
    </text>
    <text x="1000" y="340" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">
      )
    </text>
    <text x="1000" y="365" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#27ae60">
      Result: d[1][2] = 25
    </text>
  </g>
  
  <!-- Bottom: Algorithm overview -->
  <g id="algorithm">
    <rect x="50" y="440" width="1100" height="320" fill="white" stroke="#bdc3c7" stroke-width="2" rx="10"/>
    <text x="600" y="475" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Floyd-Warshall Algorithm
    </text>
    
    <!-- Pseudocode -->
    <rect x="80" y="500" width="520" height="240" fill="#ecf0f1" stroke="#95a5a6" stroke-width="1" rx="5"/>
    <text x="340" y="525" font-family="Courier New, monospace" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Algorithm Pseudocode:
    </text>
    <text x="100" y="555" font-family="Courier New, monospace" font-size="13" fill="#2c3e50">
      1. Initialize distance matrix from adjacency
    </text>
    <text x="100" y="580" font-family="Courier New, monospace" font-size="13" fill="#2c3e50">
      2. for k = 1 to n:
    </text>
    <text x="130" y="605" font-family="Courier New, monospace" font-size="13" fill="#2c3e50">
      for i = 1 to n:
    </text>
    <text x="160" y="630" font-family="Courier New, monospace" font-size="13" fill="#2c3e50">
      for j = 1 to n:
    </text>
    <text x="190" y="655" font-family="Courier New, monospace" font-size="13" fill="#e74c3c">
      if d[i][k] + d[k][j] &lt; d[i][j]:
    </text>
    <text x="220" y="680" font-family="Courier New, monospace" font-size="13" fill="#27ae60">
      d[i][j] = d[i][k] + d[k][j]
    </text>
    <text x="100" y="710" font-family="Courier New, monospace" font-size="13" fill="#2c3e50">
      3. Return distance matrix d
    </text>
    
    <!-- Complexity analysis -->
    <rect x="640" y="500" width="480" height="240" fill="#fff5e6" stroke="#f39c12" stroke-width="2" rx="5"/>
    <text x="880" y="530" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Complexity Analysis
    </text>
    
    <text x="670" y="565" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e74c3c">
      Time Complexity:
    </text>
    <text x="690" y="590" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
      • Three nested loops: O(n³)
    </text>
    <text x="690" y="613" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
      • Constant work per iteration
    </text>
    
    <text x="670" y="645" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#3498db">
      Space Complexity:
    </text>
    <text x="690" y="670" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
      • Distance matrix: O(n²)
    </text>
    <text x="690" y="693" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
      • In-place updates possible
    </text>
    
    <text x="670" y="725" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#27ae60">
      Key Advantage:
    </text>
    <text x="690" y="750" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
      • Computes all-pairs shortest paths
    </text>
  </g>
  
  <!-- Footer Note -->
  <text x="600" y="785" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d" font-style="italic">
    Floyd-Warshall builds optimal solutions for large graphs from solutions of smaller subgraphs
  </text>
</svg>