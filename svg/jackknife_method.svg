<svg viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="originalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="removedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="jackknifeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="influenceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <dropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#374151"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="800" fill="#fafafa"/>
  
  <!-- Title -->
  <text x="500" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#1f2937">
    Jackknife Method: Leave-One-Out Resampling
  </text>
  
  <!-- Subtitle -->
  <text x="500" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">
    Visual Process and Influence Diagnostics
  </text>

  <!-- Original Data Points -->
  <text x="50" y="90" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2937">
    1. Original Sample (n = 8 observations)
  </text>
  
  <!-- Data points visualization -->
  <g transform="translate(50, 105)">
    <circle cx="40" cy="15" r="12" fill="url(#originalGrad)" stroke="#1d4ed8" stroke-width="2"/>
    <text x="40" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">x₁</text>
    <text x="40" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#374151">2.1</text>
    
    <circle cx="110" cy="15" r="12" fill="url(#originalGrad)" stroke="#1d4ed8" stroke-width="2"/>
    <text x="110" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">x₂</text>
    <text x="110" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#374151">3.5</text>
    
    <circle cx="180" cy="15" r="12" fill="url(#originalGrad)" stroke="#1d4ed8" stroke-width="2"/>
    <text x="180" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">x₃</text>
    <text x="180" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#374151">1.8</text>
    
    <circle cx="250" cy="15" r="12" fill="url(#originalGrad)" stroke="#1d4ed8" stroke-width="2"/>
    <text x="250" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">x₄</text>
    <text x="250" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#374151">4.2</text>
    
    <circle cx="320" cy="15" r="12" fill="url(#originalGrad)" stroke="#1d4ed8" stroke-width="2"/>
    <text x="320" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">x₅</text>
    <text x="320" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#374151">2.9</text>
    
    <circle cx="390" cy="15" r="12" fill="url(#originalGrad)" stroke="#1d4ed8" stroke-width="2"/>
    <text x="390" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">x₆</text>
    <text x="390" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#374151">3.1</text>
    
    <circle cx="460" cy="15" r="12" fill="url(#originalGrad)" stroke="#1d4ed8" stroke-width="2"/>
    <text x="460" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">x₇</text>
    <text x="460" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#374151">1.6</text>
    
    <circle cx="530" cy="15" r="12" fill="url(#originalGrad)" stroke="#1d4ed8" stroke-width="2"/>
    <text x="530" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">x₈</text>
    <text x="530" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#374151">4.8</text>
    
    <!-- Original statistic -->
    <rect x="600" y="0" width="120" height="30" rx="4" fill="url(#influenceGrad)" filter="url(#shadow)"/>
    <text x="660" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
      θ̂ = 3.0
    </text>
  </g>

  <!-- Jackknife Process Visualization -->
  <text x="50" y="190" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2937">
    2. Leave-One-Out Process
  </text>
  
  <!-- Jackknife Sample 1 (remove x₁) -->
  <g transform="translate(50, 210)">
    <text x="0" y="15" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#dc2626">
      Remove x₁:
    </text>
    
    <circle cx="40" cy="15" r="12" fill="url(#removedGrad)" stroke="#dc2626" stroke-width="3" stroke-dasharray="3,3"/>
    <text x="40" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">X</text>
    
    <circle cx="110" cy="15" r="12" fill="url(#jackknifeGrad)" stroke="#059669" stroke-width="2"/>
    <text x="110" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">x₂</text>
    
    <circle cx="180" cy="15" r="12" fill="url(#jackknifeGrad)" stroke="#059669" stroke-width="2"/>
    <text x="180" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">x₃</text>
    
    <circle cx="250" cy="15" r="12" fill="url(#jackknifeGrad)" stroke="#059669" stroke-width="2"/>
    <text x="250" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">x₄</text>
    
    <circle cx="320" cy="15" r="12" fill="url(#jackknifeGrad)" stroke="#059669" stroke-width="2"/>
    <text x="320" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">x₅</text>
    
    <circle cx="390" cy="15" r="12" fill="url(#jackknifeGrad)" stroke="#059669" stroke-width="2"/>
    <text x="390" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">x₆</text>
    
    <circle cx="460" cy="15" r="12" fill="url(#jackknifeGrad)" stroke="#059669" stroke-width="2"/>
    <text x="460" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">x₇</text>
    
    <circle cx="530" cy="15" r="12" fill="url(#jackknifeGrad)" stroke="#059669" stroke-width="2"/>
    <text x="530" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">x₈</text>
    
    <path d="M 550 15 L 590 15" stroke="#374151" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <rect x="600" y="0" width="120" height="30" rx="4" fill="#f59e0b" filter="url(#shadow)"/>
    <text x="660" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
      θ̂₍₁₎ = 3.13
    </text>
  </g>

  <!-- Jackknife Sample 2 (remove x₂) -->
  <g transform="translate(50, 260)">
    <text x="0" y="15" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#dc2626">
      Remove x₂:
    </text>
    
    <circle cx="40" cy="15" r="12" fill="url(#jackknifeGrad)" stroke="#059669" stroke-width="2"/>
    <text x="40" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">x₁</text>
    
    <circle cx="110" cy="15" r="12" fill="url(#removedGrad)" stroke="#dc2626" stroke-width="3" stroke-dasharray="3,3"/>
    <text x="110" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">X</text>
    
    <circle cx="180" cy="15" r="12" fill="url(#jackknifeGrad)" stroke="#059669" stroke-width="2"/>
    <text x="180" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">x₃</text>
    
    <circle cx="250" cy="15" r="12" fill="url(#jackknifeGrad)" stroke="#059669" stroke-width="2"/>
    <text x="250" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">x₄</text>
    
    <circle cx="320" cy="15" r="12" fill="url(#jackknifeGrad)" stroke="#059669" stroke-width="2"/>
    <text x="320" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">x₅</text>
    
    <circle cx="390" cy="15" r="12" fill="url(#jackknifeGrad)" stroke="#059669" stroke-width="2"/>
    <text x="390" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">x₆</text>
    
    <circle cx="460" cy="15" r="12" fill="url(#jackknifeGrad)" stroke="#059669" stroke-width="2"/>
    <text x="460" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">x₇</text>
    
    <circle cx="530" cy="15" r="12" fill="url(#jackknifeGrad)" stroke="#059669" stroke-width="2"/>
    <text x="530" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">x₈</text>
    
    <path d="M 550 15 L 590 15" stroke="#374151" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <rect x="600" y="0" width="120" height="30" rx="4" fill="#f59e0b" filter="url(#shadow)"/>
    <text x="660" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
      θ̂₍₂₎ = 2.93
    </text>
  </g>

  <!-- Continue indicator -->
  <g transform="translate(400, 310)">
    <text x="0" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#6b7280">⋮</text>
    <text x="0" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">Continue for all n observations</text>
  </g>

  <!-- Influence Plot -->
  <g transform="translate(50, 350)">
    <rect x="0" y="0" width="400" height="200" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <text x="200" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2937">
      3. Influence Diagnostics
    </text>
    
    <!-- Axes -->
    <line x1="40" y1="170" x2="360" y2="170" stroke="#374151" stroke-width="2"/>
    <line x1="40" y1="50" x2="40" y2="170" stroke="#374151" stroke-width="2"/>
    
    <!-- Axis labels -->
    <text x="200" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#374151">
      Observation Index
    </text>
    <text x="20" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#374151" transform="rotate(-90 20 110)">
      Influence |θ̂ - θ̂₍ᵢ₎|
    </text>
    
    <!-- Influence bars -->
    <rect x="60" y="155" width="25" height="15" fill="#f59e0b"/>  <!-- x₁: moderate influence -->
    <rect x="100" y="162" width="25" height="8" fill="#10b981"/>   <!-- x₂: low influence -->
    <rect x="140" y="150" width="25" height="20" fill="#f59e0b"/>  <!-- x₃: moderate influence -->
    <rect x="180" y="130" width="25" height="40" fill="#ef4444"/> <!-- x₄: high influence -->
    <rect x="220" y="160" width="25" height="10" fill="#10b981"/>  <!-- x₅: low influence -->
    <rect x="260" y="158" width="25" height="12" fill="#10b981"/>  <!-- x₆: low influence -->
    <rect x="300" y="145" width="25" height="25" fill="#f59e0b"/>  <!-- x₇: moderate influence -->
    <rect x="340" y="120" width="25" height="50" fill="#ef4444"/> <!-- x₈: high influence -->
    
    <!-- Observation labels -->
    <text x="72" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#374151">x₁</text>
    <text x="112" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#374151">x₂</text>
    <text x="152" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#374151">x₃</text>
    <text x="192" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#374151">x₄</text>
    <text x="232" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#374151">x₅</text>
    <text x="272" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#374151">x₆</text>
    <text x="312" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#374151">x₇</text>
    <text x="352" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#374151">x₈</text>
    
    <!-- Legend -->
    <rect x="280" y="55" width="12" height="12" fill="#10b981"/>
    <text x="300" y="65" font-family="Arial, sans-serif" font-size="10" fill="#374151">Low Influence</text>
    <rect x="280" y="75" width="12" height="12" fill="#f59e0b"/>
    <text x="300" y="85" font-family="Arial, sans-serif" font-size="10" fill="#374151">Moderate</text>
    <rect x="280" y="95" width="12" height="12" fill="#ef4444"/>
    <text x="300" y="105" font-family="Arial, sans-serif" font-size="10" fill="#374151">High Influence</text>
  </g>

  <!-- Jackknife Estimates Summary -->
  <g transform="translate(480, 350)">
    <rect x="0" y="0" width="470" height="200" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <text x="235" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2937">
      4. Jackknife Estimates
    </text>
    
    <!-- All jackknife statistics -->
    <text x="20" y="50" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#374151">
      Leave-One-Out Statistics:
    </text>
    <text x="30" y="70" font-family="Arial, sans-serif" font-size="11" fill="#1f2937">
      θ̂₍₁₎ = 3.13    θ̂₍₂₎ = 2.93    θ̂₍₃₎ = 3.17    θ̂₍₄₎ = 2.80
    </text>
    <text x="30" y="85" font-family="Arial, sans-serif" font-size="11" fill="#1f2937">
      θ̂₍₅₎ = 2.86    θ̂₍₆₎ = 2.99    θ̂₍₇₎ = 3.20    θ̂₍₈₎ = 2.74
    </text>
    
    <!-- Jackknife mean -->
    <rect x="20" y="100" width="430" height="25" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
    <text x="235" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#92400e">
      Jackknife Mean: θ̄₍.₎ = (1/n) sum of θ̂₍ᵢ₎ = 2.98
    </text>
    
    <!-- Bias estimation -->
    <text x="20" y="145" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#374151">
      Bias Correction:
    </text>
    <text x="30" y="165" font-family="Arial, sans-serif" font-size="11" fill="#1f2937">
      Bias = (n-1)(θ̄₍.₎ - θ̂) = 7 × (2.98 - 3.0) = -0.14
    </text>
    <text x="30" y="180" font-family="Arial, sans-serif" font-size="11" fill="#1f2937">
      Bias-Corrected: θ̂_BC = θ̂ - Bias = 3.0 + 0.14 = 3.14
    </text>
  </g>

  <!-- Key Insights -->
  <g transform="translate(50, 570)">
    <rect x="0" y="0" width="400" height="180" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="200" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#047857">
      Key Insights
    </text>
    
    <text x="20" y="50" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#047857">
      Influence Patterns:
    </text>
    <text x="30" y="70" font-family="Arial, sans-serif" font-size="11" fill="#047857">
      • Observations x₄ and x₈ are most influential (outliers)
    </text>
    <text x="30" y="85" font-family="Arial, sans-serif" font-size="11" fill="#047857">
      • Removing them changes the statistic substantially
    </text>
    
    <text x="20" y="110" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#047857">
      Bias Detection:
    </text>
    <text x="30" y="130" font-family="Arial, sans-serif" font-size="11" fill="#047857">
      • Small negative bias detected (-0.14)
    </text>
    <text x="30" y="145" font-family="Arial, sans-serif" font-size="11" fill="#047857">
      • Bias-corrected estimate: 3.14 vs original 3.0
    </text>
    
    <text x="20" y="170" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#047857">
      Practical Use: Identify problematic data points
    </text>
  </g>

  <!-- Applications & Comparisons -->
  <g transform="translate(480, 570)">
    <rect x="0" y="0" width="470" height="180" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="235" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#dc2626">
      Applications and Comparisons
    </text>
    
    <text x="20" y="50" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#dc2626">
      Jackknife vs Bootstrap:
    </text>
    <text x="30" y="70" font-family="Arial, sans-serif" font-size="11" fill="#dc2626">
      • Jackknife: Deterministic (always n calculations)
    </text>
    <text x="30" y="85" font-family="Arial, sans-serif" font-size="11" fill="#dc2626">
      • Bootstrap: Stochastic (typically B = 1000+ calculations)
    </text>
    
    <text x="20" y="110" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#dc2626">
      When to Use Jackknife:
    </text>
    <text x="30" y="130" font-family="Arial, sans-serif" font-size="11" fill="#dc2626">
      • Influence diagnostics and outlier detection
    </text>
    <text x="30" y="145" font-family="Arial, sans-serif" font-size="11" fill="#dc2626">
      • Bias estimation for smooth statistics
    </text>
    <text x="30" y="160" font-family="Arial, sans-serif" font-size="11" fill="#dc2626">
      • Leave-one-out cross-validation (LOOCV)
    </text>
  </g>

</svg>