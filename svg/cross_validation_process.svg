<svg width="900" height="700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #333; }
      .subtitle { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #333; }
      .label { font-family: Arial, sans-serif; font-size: 12px; fill: #333; }
      .small-label { font-family: Arial, sans-serif; font-size: 10px; fill: #333; }
      .fold { fill: #e3f2fd; stroke: #1976d2; stroke-width: 2; }
      .train { fill: #4caf50; }
      .validate { fill: #ff9800; }
      .test { fill: #f44336; }
      .arrow { stroke: #666; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .process-box { fill: #f8f9fa; stroke: #dee2e6; stroke-width: 2; rx: 8; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="450" y="25" text-anchor="middle" class="title">K-Fold Cross-Validation Process</text>
  
  <!-- Original Dataset -->
  <g transform="translate(50, 50)">
    <text x="250" y="0" text-anchor="middle" class="subtitle">1. Original Dataset (1000 samples)</text>
    <rect x="0" y="10" width="500" height="40" class="fold" />
    <text x="250" y="35" text-anchor="middle" class="label">Complete Dataset</text>
  </g>
  
  <!-- Dataset Split -->
  <g transform="translate(50, 120)">
    <text x="250" y="0" text-anchor="middle" class="subtitle">2. Split into K=5 Folds (200 samples each)</text>
    
    <!-- 5 folds -->
    <rect x="0" y="20" width="100" height="30" class="fold" />
    <text x="50" y="40" text-anchor="middle" class="small-label">Fold 1</text>
    
    <rect x="100" y="20" width="100" height="30" class="fold" />
    <text x="150" y="40" text-anchor="middle" class="small-label">Fold 2</text>
    
    <rect x="200" y="20" width="100" height="30" class="fold" />
    <text x="250" y="40" text-anchor="middle" class="small-label">Fold 3</text>
    
    <rect x="300" y="20" width="100" height="30" class="fold" />
    <text x="350" y="40" text-anchor="middle" class="small-label">Fold 4</text>
    
    <rect x="400" y="20" width="100" height="30" class="fold" />
    <text x="450" y="40" text-anchor="middle" class="small-label">Fold 5</text>
  </g>
  
  <!-- Cross-validation iterations -->
  <g transform="translate(50, 200)">
    <text x="350" y="0" text-anchor="middle" class="subtitle">3. Cross-Validation Iterations</text>
    
    <!-- Iteration 1 -->
    <g transform="translate(0, 25)">
      <text x="0" y="12" class="label">Iter 1:</text>
      <rect x="80" y="0" width="70" height="18" class="validate" />
      <text x="115" y="12" text-anchor="middle" class="small-label">Validate</text>
      <rect x="150" y="0" width="70" height="18" class="train" />
      <rect x="220" y="0" width="70" height="18" class="train" />
      <rect x="290" y="0" width="70" height="18" class="train" />
      <rect x="360" y="0" width="70" height="18" class="train" />
      <text x="290" y="12" text-anchor="middle" class="small-label">Train</text>
      <text x="480" y="12" class="small-label">Score₁</text>
    </g>
    
    <!-- Iteration 2 -->
    <g transform="translate(0, 50)">
      <text x="0" y="12" class="label">Iter 2:</text>
      <rect x="80" y="0" width="70" height="18" class="train" />
      <rect x="150" y="0" width="70" height="18" class="validate" />
      <text x="185" y="12" text-anchor="middle" class="small-label">Validate</text>
      <rect x="220" y="0" width="70" height="18" class="train" />
      <rect x="290" y="0" width="70" height="18" class="train" />
      <rect x="360" y="0" width="70" height="18" class="train" />
      <text x="320" y="12" text-anchor="middle" class="small-label">Train</text>
      <text x="480" y="12" class="small-label">Score₂</text>
    </g>
    
    <!-- Iteration 3 -->
    <g transform="translate(0, 75)">
      <text x="0" y="12" class="label">Iter 3:</text>
      <rect x="80" y="0" width="70" height="18" class="train" />
      <rect x="150" y="0" width="70" height="18" class="train" />
      <rect x="220" y="0" width="70" height="18" class="validate" />
      <text x="255" y="12" text-anchor="middle" class="small-label">Validate</text>
      <rect x="290" y="0" width="70" height="18" class="train" />
      <rect x="360" y="0" width="70" height="18" class="train" />
      <text x="350" y="12" text-anchor="middle" class="small-label">Train</text>
      <text x="480" y="12" class="small-label">Score₃</text>
    </g>
    
    <!-- Iteration 4 -->
    <g transform="translate(0, 100)">
      <text x="0" y="12" class="label">Iter 4:</text>
      <rect x="80" y="0" width="70" height="18" class="train" />
      <rect x="150" y="0" width="70" height="18" class="train" />
      <rect x="220" y="0" width="70" height="18" class="train" />
      <rect x="290" y="0" width="70" height="18" class="validate" />
      <text x="325" y="12" text-anchor="middle" class="small-label">Validate</text>
      <rect x="360" y="0" width="70" height="18" class="train" />
      <text x="250" y="12" text-anchor="middle" class="small-label">Train</text>
      <text x="480" y="12" class="small-label">Score₄</text>
    </g>
    
    <!-- Iteration 5 -->
    <g transform="translate(0, 125)">
      <text x="0" y="12" class="label">Iter 5:</text>
      <rect x="80" y="0" width="70" height="18" class="train" />
      <rect x="150" y="0" width="70" height="18" class="train" />
      <rect x="220" y="0" width="70" height="18" class="train" />
      <rect x="290" y="0" width="70" height="18" class="train" />
      <rect x="360" y="0" width="70" height="18" class="validate" />
      <text x="395" y="12" text-anchor="middle" class="small-label">Validate</text>
      <text x="250" y="12" text-anchor="middle" class="small-label">Train</text>
      <text x="480" y="12" class="small-label">Score₅</text>
    </g>
  </g>
  
  <!-- Final aggregation -->
  <g transform="translate(50, 380)">
    <text x="250" y="0" text-anchor="middle" class="subtitle">4. Aggregate Results</text>
    
    <rect x="50" y="15" width="400" height="60" class="process-box" />
    <text x="250" y="30" text-anchor="middle" class="label">Final CV Score = (Score₁ + Score₂ + Score₃ + Score₄ + Score₅) / 5</text>
    <text x="250" y="45" text-anchor="middle" class="label">Standard Deviation = √(Σ(Scoreᵢ - Mean)² / (K-1))</text>
    <text x="250" y="60" text-anchor="middle" class="label">Confidence Interval = Mean ± (t-value × std_error)</text>
  </g>
  
  <!-- Benefits -->
  <g transform="translate(550, 200)">
    <rect x="0" y="0" width="280" height="220" class="process-box" />
    <text x="140" y="18" text-anchor="middle" class="subtitle">Benefits of Cross-Validation</text>
    
    <text x="20" y="40" class="label" font-weight="bold" fill="#4caf50">✓ Robust Estimation:</text>
    <text x="30" y="55" class="small-label">Every sample used for both</text>
    <text x="30" y="67" class="small-label">training and validation</text>
    
    <text x="20" y="85" class="label" font-weight="bold" fill="#4caf50">✓ Reduced Variance:</text>
    <text x="30" y="100" class="small-label">More stable performance</text>
    <text x="30" y="112" class="small-label">estimates than single split</text>
    
    <text x="20" y="130" class="label" font-weight="bold" fill="#ff9800">✓ Overfitting Detection:</text>
    <text x="30" y="145" class="small-label">Identifies models that</text>
    <text x="30" y="157" class="small-label">don't generalize well</text>
    
    <text x="20" y="175" class="label" font-weight="bold" fill="#2196f3">✓ Model Selection:</text>
    <text x="30" y="190" class="small-label">Compare algorithms and</text>
    <text x="30" y="202" class="small-label">hyperparameters reliably</text>
  </g>
  
  <!-- Legend -->
  <g transform="translate(50, 520)">
    <text x="0" y="0" class="subtitle">Legend:</text>
    
    <rect x="0" y="10" width="30" height="15" class="train" />
    <text x="35" y="22" class="label">Training Data (80% of dataset)</text>
    
    <rect x="200" y="10" width="30" height="15" class="validate" />
    <text x="235" y="22" class="label">Validation Data (20% of dataset)</text>
    
    <rect x="450" y="10" width="30" height="15" class="test" />
    <text x="485" y="22" class="label">Test Data (held out separately)</text>
  </g>
  
  <!-- Common K values -->
  <g transform="translate(50, 580)">
    <rect x="0" y="0" width="800" height="100" class="process-box" />
    <text x="400" y="20" text-anchor="middle" class="subtitle">Common K Values and Trade-offs</text>
    
    <text x="20" y="45" class="label"><tspan font-weight="bold">K = 5:</tspan> Good balance of computational efficiency and reliable estimates</text>
    <text x="20" y="60" class="label"><tspan font-weight="bold">K = 10:</tspan> More thorough validation but higher computational cost</text>
    <text x="20" y="75" class="label"><tspan font-weight="bold">K = n (LOOCV):</tspan> Maximum data usage but very expensive for large datasets</text>
    <text x="20" y="90" class="label"><tspan font-weight="bold">Stratified CV:</tspan> Maintains class distribution in each fold (for classification)</text>
  </g>
</svg>