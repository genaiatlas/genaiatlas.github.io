<svg viewBox="0 0 1100 750" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="550" y="35" font-size="24" font-weight="bold" text-anchor="middle" fill="#2C3E50">
    Outer Product: Creating Preference Patterns
  </text>
  
  <!-- Section 1: Binary Outer Product -->
  <g id="binary-outer-product">
    <text x="300" y="75" font-size="16" font-weight="bold" text-anchor="middle" fill="#34495E">
      Binary Indicators (0s and 1s)
    </text>
    
    <!-- User Vector U (column) -->
    <g id="user-vector-binary">
      <text x="80" y="115" font-size="13" font-weight="bold" text-anchor="middle" fill="#E74C3C">U</text>
      <rect x="60" y="125" width="40" height="200" fill="#FFE5E5" stroke="#E74C3C" stroke-width="2"/>
      
      <rect x="65" y="135" width="30" height="28" fill="white" stroke="#BDC3C7"/>
      <text x="80" y="153" font-size="11" text-anchor="middle" fill="#7F8C8D">0</text>
      
      <rect x="65" y="168" width="30" height="28" fill="white" stroke="#BDC3C7"/>
      <text x="80" y="186" font-size="11" text-anchor="middle" fill="#7F8C8D">0</text>
      
      <rect x="65" y="201" width="30" height="28" fill="#E74C3C" stroke="#C0392B" stroke-width="2"/>
      <text x="80" y="219" font-size="13" font-weight="bold" text-anchor="middle" fill="white">1</text>
      
      <rect x="65" y="234" width="30" height="28" fill="#E74C3C" stroke="#C0392B" stroke-width="2"/>
      <text x="80" y="252" font-size="13" font-weight="bold" text-anchor="middle" fill="white">1</text>
      
      <rect x="65" y="267" width="30" height="28" fill="#E74C3C" stroke="#C0392B" stroke-width="2"/>
      <text x="80" y="285" font-size="13" font-weight="bold" text-anchor="middle" fill="white">1</text>
      
      <rect x="65" y="300" width="30" height="20" fill="white" stroke="#BDC3C7"/>
      <text x="80" y="314" font-size="11" text-anchor="middle" fill="#7F8C8D">0</text>
      
      <text x="80" y="345" font-size="10" text-anchor="middle" fill="#E74C3C" font-style="italic">Biker users</text>
    </g>
    
    <!-- Outer product symbol -->
    <text x="125" y="230" font-size="28" font-weight="bold" text-anchor="middle" fill="#34495E">⊗</text>
    
    <!-- Movie Vector V (row) -->
    <g id="movie-vector-binary">
      <text x="300" y="115" font-size="13" font-weight="bold" text-anchor="middle" fill="#2980B9">V</text>
      <rect x="160" y="205" width="280" height="40" fill="#E5F4FF" stroke="#2980B9" stroke-width="2"/>
      
      <rect x="168" y="212" width="35" height="26" fill="white" stroke="#BDC3C7"/>
      <text x="185" y="229" font-size="11" text-anchor="middle" fill="#7F8C8D">0</text>
      
      <rect x="208" y="212" width="35" height="26" fill="white" stroke="#BDC3C7"/>
      <text x="225" y="229" font-size="11" text-anchor="middle" fill="#7F8C8D">0</text>
      
      <rect x="248" y="212" width="35" height="26" fill="#2980B9" stroke="#1F6391" stroke-width="2"/>
      <text x="265" y="229" font-size="13" font-weight="bold" text-anchor="middle" fill="white">1</text>
      
      <rect x="288" y="212" width="35" height="26" fill="#2980B9" stroke="#1F6391" stroke-width="2"/>
      <text x="305" y="229" font-size="13" font-weight="bold" text-anchor="middle" fill="white">1</text>
      
      <rect x="328" y="212" width="35" height="26" fill="#2980B9" stroke="#1F6391" stroke-width="2"/>
      <text x="345" y="229" font-size="13" font-weight="bold" text-anchor="middle" fill="white">1</text>
      
      <rect x="368" y="212" width="35" height="26" fill="white" stroke="#BDC3C7"/>
      <text x="385" y="229" font-size="11" text-anchor="middle" fill="#7F8C8D">0</text>
      
      <rect x="408" y="212" width="25" height="26" fill="white" stroke="#BDC3C7"/>
      <text x="420" y="229" font-size="11" text-anchor="middle" fill="#7F8C8D">0</text>
      
      <text x="300" y="263" font-size="10" text-anchor="middle" fill="#2980B9" font-style="italic">Dance movies</text>
    </g>
    
    <!-- Equals sign -->
    <text x="470" y="230" font-size="28" font-weight="bold" text-anchor="middle" fill="#34495E">=</text>
    
    <!-- Result Matrix -->
    <g id="result-matrix-binary">
      <rect x="510" y="125" width="280" height="200" fill="#FADBD8" stroke="#E74C3C" stroke-width="2"/>
      
      <!-- Rows with 0s -->
      <text x="545" y="155" font-size="10" fill="#7F8C8D">0 0 0 0 0 0 0</text>
      <text x="545" y="180" font-size="10" fill="#7F8C8D">0 0 0 0 0 0 0</text>
      
      <!-- Block of 1s -->
      <rect x="590" y="195" width="115" height="85" fill="#E74C3C" opacity="0.8"/>
      <text x="647" y="225" font-size="11" font-weight="bold" text-anchor="middle" fill="white">1 1 1</text>
      <text x="647" y="245" font-size="11" font-weight="bold" text-anchor="middle" fill="white">1 1 1</text>
      <text x="647" y="265" font-size="11" font-weight="bold" text-anchor="middle" fill="white">1 1 1</text>
      
      <text x="545" y="235" font-size="10" fill="#7F8C8D">0 0</text>
      <text x="720" y="235" font-size="10" fill="#7F8C8D">0 0</text>
      
      <!-- Bottom row with 0s -->
      <text x="545" y="310" font-size="10" fill="#7F8C8D">0 0 0 0 0 0 0</text>
      
      <text x="650" y="345" font-size="10" text-anchor="middle" fill="#555" font-style="italic">Preference block</text>
    </g>
  </g>
  
  <!-- Divider Line -->
  <line x1="50" y1="380" x2="1050" y2="380" stroke="#BDC3C7" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Section 2: Computation Illustration -->
  <g id="computation-illustration">
    <text x="550" y="420" font-size="16" font-weight="bold" text-anchor="middle" fill="#34495E">
      How Outer Product Works: Entry-by-Entry Multiplication
    </text>
    
    <!-- Example computation boxes -->
    <g id="example-1">
      <rect x="80" y="450" width="280" height="100" fill="#F8F9FA" stroke="#34495E" stroke-width="2" rx="5"/>
      <text x="220" y="475" font-size="13" font-weight="bold" text-anchor="middle" fill="#2C3E50">
        Position (3, 3) - Biker + Dance
      </text>
      <text x="220" y="500" font-size="12" text-anchor="middle" fill="#555">
        [U ⊗ V]₃,₃ = U₃ × V₃
      </text>
      <text x="220" y="522" font-size="14" font-weight="bold" text-anchor="middle" fill="#E74C3C">
        = 1 × 1 = 1
      </text>
      <text x="220" y="542" font-size="10" text-anchor="middle" fill="#7F8C8D" font-style="italic">
        Strong preference captured
      </text>
    </g>
    
    <g id="example-2">
      <rect x="410" y="450" width="280" height="100" fill="#F8F9FA" stroke="#34495E" stroke-width="2" rx="5"/>
      <text x="550" y="475" font-size="13" font-weight="bold" text-anchor="middle" fill="#2C3E50">
        Position (1, 3) - Non-Biker + Dance
      </text>
      <text x="550" y="500" font-size="12" text-anchor="middle" fill="#555">
        [U ⊗ V]₁,₃ = U₁ × V₃
      </text>
      <text x="550" y="522" font-size="14" font-weight="bold" text-anchor="middle" fill="#7F8C8D">
        = 0 × 1 = 0
      </text>
      <text x="550" y="542" font-size="10" text-anchor="middle" fill="#7F8C8D" font-style="italic">
        No special preference
      </text>
    </g>
    
    <g id="example-3">
      <rect x="740" y="450" width="280" height="100" fill="#F8F9FA" stroke="#34495E" stroke-width="2" rx="5"/>
      <text x="880" y="475" font-size="13" font-weight="bold" text-anchor="middle" fill="#2C3E50">
        Position (3, 1) - Biker + Non-Dance
      </text>
      <text x="880" y="500" font-size="12" text-anchor="middle" fill="#555">
        [U ⊗ V]₃,₁ = U₃ × V₁
      </text>
      <text x="880" y="522" font-size="14" font-weight="bold" text-anchor="middle" fill="#7F8C8D">
        = 1 × 0 = 0
      </text>
      <text x="880" y="542" font-size="10" text-anchor="middle" fill="#7F8C8D" font-style="italic">
        No special preference
      </text>
    </g>
  </g>
  
  <!-- Properties Box -->
  <g id="properties-box">
    <rect x="100" y="580" width="900" height="140" fill="#E8F8F5" stroke="#27AE60" stroke-width="2" rx="8"/>
    
    <text x="550" y="610" font-size="15" font-weight="bold" text-anchor="middle" fill="#27AE60">
      ⚙️ Outer Product Properties
    </text>
    
    <g id="property-1">
      <circle cx="130" cy="640" r="5" fill="#27AE60"/>
      <text x="150" y="645" font-size="12" text-anchor="start" fill="#555">
        <tspan font-weight="bold">Dimensionality:</tspan> If U has m entries and V has n entries, U ⊗ V produces an m × n matrix
      </text>
    </g>
    
    <g id="property-2">
      <circle cx="130" cy="670" r="5" fill="#27AE60"/>
      <text x="150" y="675" font-size="12" text-anchor="start" fill="#555">
        <tspan font-weight="bold">Pattern Creation:</tspan> Creates rectangular blocks of values - perfect for capturing user-item groups
      </text>
    </g>
    
    <g id="property-3">
      <circle cx="130" cy="700" r="5" fill="#27AE60"/>
      <text x="150" y="705" font-size="12" text-anchor="start" fill="#555">
        <tspan font-weight="bold">Flexibility:</tspan> Vectors don't need to be binary - can use continuous values, negative values (polarization)
      </text>
    </g>
  </g>
</svg>