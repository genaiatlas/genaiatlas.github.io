<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="900" height="700" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="450" y="40" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Sampling Distribution of Regression Coefficients
  </text>
  
  <text x="450" y="70" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#5a6c7d">
    Understanding Uncertainty in Coefficient Estimates
  </text>
  
  <!-- Main normal distribution for coefficient -->
  <g transform="translate(450, 300)">
    <!-- Normal curve -->
    <path d="M -200 150 Q -180 50, -160 80 Q -140 110, -120 130 Q -100 140, -80 145 Q -60 148, -40 149 Q -20 149.5, 0 150 Q 20 149.5, 40 149 Q 60 148, 80 145 Q 100 140, 120 130 Q 140 110, 160 80 Q 180 50, 200 150" 
          fill="none" stroke="#3498db" stroke-width="3"/>
    
    <!-- Fill under curve -->
    <path d="M -200 150 Q -180 50, -160 80 Q -140 110, -120 130 Q -100 140, -80 145 Q -60 148, -40 149 Q -20 149.5, 0 150 Q 20 149.5, 40 149 Q 60 148, 80 145 Q 100 140, 120 130 Q 140 110, 160 80 Q 180 50, 200 150 L 200 150 L -200 150 Z" 
          fill="#3498db" opacity="0.2"/>
    
    <!-- Confidence interval shading (95%) -->
    <path d="M -80 145 Q -60 148, -40 149 Q -20 149.5, 0 150 Q 20 149.5, 40 149 Q 60 148, 80 145 L 80 150 L -80 150 Z" 
          fill="#27ae60" opacity="0.4"/>
    
    <!-- Axes -->
    <line x1="-220" y1="150" x2="220" y2="150" stroke="#2c3e50" stroke-width="2"/>
    <line x1="0" y1="150" x2="0" y2="-50" stroke="#2c3e50" stroke-width="1" stroke-dasharray="3,3"/>
    
    <!-- True parameter marker -->
    <circle cx="0" cy="150" r="5" fill="#e74c3c"/>
    <text x="0" y="175" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#e74c3c">
      β*
    </text>
    <text x="0" y="190" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#5a6c7d">
      (true value)
    </text>
    
    <!-- Confidence interval bounds -->
    <line x1="-80" y1="145" x2="-80" y2="160" stroke="#27ae60" stroke-width="2"/>
    <line x1="80" y1="145" x2="80" y2="160" stroke="#27ae60" stroke-width="2"/>
    
    <text x="-80" y="180" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#27ae60">
      β̂ - 2SE
    </text>
    <text x="80" y="180" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#27ae60">
      β̂ + 2SE
    </text>
    
    <!-- Sample estimate marker -->
    <line x1="20" y1="149" x2="20" y2="200" stroke="#9b59b6" stroke-width="2"/>
    <circle cx="20" cy="149" r="4" fill="#9b59b6"/>
    <text x="20" y="215" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#9b59b6">
      β̂
    </text>
    <text x="20" y="230" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#5a6c7d">
      (estimate from sample)
    </text>
    
    <!-- 95% CI label -->
    <text x="0" y="-30" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#27ae60">
      95% Confidence Interval
    </text>
    <line x1="-80" y1="-20" x2="80" y2="-20" stroke="#27ae60" stroke-width="2"/>
    <line x1="-80" y1="-25" x2="-80" y2="-15" stroke="#27ae60" stroke-width="2"/>
    <line x1="80" y1="-25" x2="80" y2="-15" stroke="#27ae60" stroke-width="2"/>
    
    <!-- Standard error markers -->
    <line x1="-40" y1="155" x2="-40" y2="145" stroke="#e67e22" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="40" y1="155" x2="40" y2="145" stroke="#e67e22" stroke-width="1" stroke-dasharray="2,2"/>
    
    <text x="-20" y="135" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#e67e22">
      -SE
    </text>
    <text x="20" y="135" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#e67e22">
      +SE
    </text>
    
    <!-- Distribution label -->
    <text x="0" y="-60" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#3498db">
      β̂ ~ N(β*, SE²)
    </text>
  </g>
  
  <!-- Formula box -->
  <rect x="50" y="100" width="320" height="160" fill="white" stroke="#3498db" stroke-width="2" rx="8"/>
  <text x="210" y="130" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Coefficient Distribution
  </text>
  <text x="210" y="160" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#2c3e50">
    β̂ⱼ ~ N(β*ⱼ, σ²ⱼ)
  </text>
  <text x="210" y="185" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#5a6c7d">
    Standard Error: SE(β̂ⱼ) = σⱼ
  </text>
  <text x="210" y="210" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#5a6c7d">
    From covariance matrix:
  </text>
  <text x="210" y="230" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#5a6c7d">
    Var(β̂) = σ²(X'X)⁻¹
  </text>
  <text x="210" y="250" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#5a6c7d">
    where σⱼ² is the jth diagonal element
  </text>
  
  <!-- Hypothesis testing box -->
  <rect x="530" y="100" width="320" height="160" fill="white" stroke="#e74c3c" stroke-width="2" rx="8"/>
  <text x="690" y="130" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Hypothesis Testing
  </text>
  <text x="690" y="160" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#2c3e50">
    H₀: β*ⱼ = 0  vs  H₁: β*ⱼ ≠ 0
  </text>
  <text x="690" y="185" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#5a6c7d">
    Test statistic:
  </text>
  <text x="690" y="210" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#2c3e50">
    t = β̂ⱼ / SE(β̂ⱼ)
  </text>
  <text x="690" y="235" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#5a6c7d">
    Reject H₀ if CI doesn't contain 0
  </text>
  <text x="690" y="252" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#5a6c7d">
    or if |t| &gt; t(α/2, n-p-1)
  </text>
  
  <!-- Key properties box -->
  <rect x="50" y="520" width="380" height="140" fill="white" stroke="#9b59b6" stroke-width="2" rx="8"/>
  <text x="240" y="550" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Key Properties
  </text>
  <text x="240" y="580" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">
    • Unbiased: E[β̂] = β*
  </text>
  <text x="240" y="605" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">
    • Efficient: Minimum variance among linear unbiased estimators
  </text>
  <text x="240" y="630" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">
    • Consistent: β̂ → β* as n → ∞
  </text>
  <text x="240" y="650" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">
    • Normal (approximately) by CLT for large n
  </text>
  
  <!-- Interpretation box -->
  <rect x="470" y="520" width="380" height="140" fill="white" stroke="#27ae60" stroke-width="2" rx="8"/>
  <text x="660" y="550" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Interpretation
  </text>
  <text x="660" y="580" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2c3e50">
    95% CI: [β̂ⱼ - 2SE, β̂ⱼ + 2SE]
  </text>
  <text x="660" y="605" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#5a6c7d">
    Interpretation: We are 95% confident that the
  </text>
  <text x="660" y="625" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#5a6c7d">
    true parameter β*ⱼ lies within this interval.
  </text>
  <text x="660" y="645" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#5a6c7d">
    Smaller SE → more precise estimate
  </text>
</svg>