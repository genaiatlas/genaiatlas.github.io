<svg viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="linearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="logisticGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#b91c1c;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="quantileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:0.8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="800" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1e293b">
    Regression Types: Linear vs Logistic vs Quantile Regression
  </text>
  
  <!-- Linear vs Logistic Comparison -->
  <text x="300" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">
    Function Forms Comparison
  </text>
  
  <!-- Linear Regression Plot -->
  <rect x="50" y="100" width="250" height="180" fill="white" stroke="#64748b" stroke-width="2"/>
  <text x="175" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#3b82f6">
    Linear Regression
  </text>
  
  <!-- Linear regression line -->
  <line x1="70" y1="260" x2="280" y2="140" stroke="#3b82f6" stroke-width="3"/>
  
  <!-- Data points for linear -->
  <circle cx="90" cy="245" r="3" fill="#dc2626"/>
  <circle cx="120" cy="220" r="3" fill="#dc2626"/>
  <circle cx="150" cy="200" r="3" fill="#dc2626"/>
  <circle cx="180" cy="185" r="3" fill="#dc2626"/>
  <circle cx="210" cy="170" r="3" fill="#dc2626"/>
  <circle cx="240" cy="155" r="3" fill="#dc2626"/>
  <circle cx="270" cy="145" r="3" fill="#dc2626"/>
  
  <!-- Axes for linear -->
  <line x1="70" y1="260" x2="280" y2="260" stroke="#64748b" stroke-width="1"/>
  <line x1="70" y1="140" x2="70" y2="260" stroke="#64748b" stroke-width="1"/>
  <text x="175" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b">X</text>
  <text x="60" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b">Y</text>
  
  <!-- Logistic Regression Plot -->
  <rect x="350" y="100" width="250" height="180" fill="white" stroke="#64748b" stroke-width="2"/>
  <text x="475" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">
    Logistic Regression
  </text>
  
  <!-- Logistic regression curve -->
  <path d="M 370 260 Q 400 260 430 230 T 490 180 T 550 150 T 580 140" 
        stroke="#dc2626" stroke-width="3" fill="none"/>
  
  <!-- Data points for logistic (binary) -->
  <circle cx="390" cy="260" r="3" fill="#1e40af"/>
  <circle cx="420" cy="260" r="3" fill="#1e40af"/>
  <circle cx="450" cy="240" r="3" fill="#059669"/>
  <circle cx="480" cy="180" r="3" fill="#059669"/>
  <circle cx="510" cy="150" r="3" fill="#059669"/>
  <circle cx="540" cy="140" r="3" fill="#059669"/>
  <circle cx="570" cy="140" r="3" fill="#059669"/>
  
  <!-- Axes for logistic -->
  <line x1="370" y1="260" x2="580" y2="260" stroke="#64748b" stroke-width="1"/>
  <line x1="370" y1="140" x2="370" y2="260" stroke="#64748b" stroke-width="1"/>
  <text x="475" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b">X</text>
  <text x="360" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b">P(Y=1)</text>
  
  <!-- Y=1 and Y=0 labels -->
  <text x="590" y="145" font-family="Arial, sans-serif" font-size="10" fill="#64748b">Y=1</text>
  <text x="590" y="265" font-family="Arial, sans-serif" font-size="10" fill="#64748b">Y=0</text>
  
  <!-- Mathematical Functions -->
  <rect x="650" y="100" width="300" height="180" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
  <text x="800" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">
    Mathematical Forms
  </text>
  
  <text x="670" y="150" font-family="Arial, sans-serif" font-size="12" fill="#3b82f6" font-weight="bold">
    Linear:
  </text>
  <text x="730" y="150" font-family="Arial, sans-serif" font-size="12" fill="#334155">
    Y = β₀ + β₁X + ε
  </text>
  
  <text x="670" y="175" font-family="Arial, sans-serif" font-size="12" fill="#dc2626" font-weight="bold">
    Logistic:
  </text>
  <text x="730" y="175" font-family="Arial, sans-serif" font-size="12" fill="#334155">
    P(Y=1) = exp(β₀ + β₁X) / (1 + exp(β₀ + β₁X))
  </text>
  
  <text x="670" y="210" font-family="Arial, sans-serif" font-size="11" fill="#64748b">
    • Linear: Range (-∞, +∞)
  </text>
  <text x="670" y="225" font-family="Arial, sans-serif" font-size="11" fill="#64748b">
    • Logistic: Range [0, 1]
  </text>
  <text x="670" y="240" font-family="Arial, sans-serif" font-size="11" fill="#64748b">
    • Linear: Estimates conditional mean
  </text>
  <text x="670" y="255" font-family="Arial, sans-serif" font-size="11" fill="#64748b">
    • Logistic: Estimates probability
  </text>
  
  <!-- Loss Functions Section -->
  <text x="500" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">
    Loss Functions Comparison
  </text>
  
  <!-- Squared Loss -->
  <rect x="50" y="350" width="200" height="120" rx="6" fill="url(#linearGrad)" filter="url(#shadow)"/>
  <text x="150" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    Squared Loss (L2)
  </text>
  <text x="150" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="white">
    L(y, ŷ) = (y - ŷ)²
  </text>
  <text x="150" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    • Estimates conditional mean
  </text>
  <text x="150" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    • Sensitive to outliers
  </text>
  <text x="150" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    • Closed-form solution
  </text>
  
  <!-- Absolute Loss -->
  <rect x="280" y="350" width="200" height="120" rx="6" fill="url(#logisticGrad)" filter="url(#shadow)"/>
  <text x="380" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    Absolute Loss (L1)
  </text>
  <text x="380" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="white">
    L(y, ŷ) = |y - ŷ|
  </text>
  <text x="380" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    • Estimates conditional median
  </text>
  <text x="380" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    • Robust to outliers
  </text>
  <text x="380" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    • Linear programming
  </text>
  
  <!-- Quantile Loss -->
  <rect x="510" y="350" width="200" height="120" rx="6" fill="url(#quantileGrad)" filter="url(#shadow)"/>
  <text x="610" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    Quantile Loss
  </text>
  <text x="610" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="white">
    L(y, ŷ) = ρτ(y - ŷ)
  </text>
  <text x="610" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    • Estimates conditional quantiles
  </text>
  <text x="610" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    • Asymmetric weighting
  </text>
  <text x="610" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    • Analyzes distribution tails
  </text>
  
  <!-- Check Function Visualization -->
  <rect x="750" y="350" width="200" height="120" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="850" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#92400e">
    Check Function ρτ
  </text>
  <text x="850" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#92400e">
    ρτ(u) = τ max(u,0) +
  </text>
  <text x="850" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#92400e">
    (1-τ) max(-u,0)
  </text>
  <text x="850" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#92400e">
    τ = 0.5 → Median regression
  </text>
  <text x="850" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#92400e">
    τ = 0.9 → 90th percentile
  </text>
  
  <!-- Quantile Regression Visualization -->
  <text x="500" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">
    Quantile Regression Example
  </text>
  
  <!-- Main plot area -->
  <rect x="200" y="540" width="600" height="200" fill="white" stroke="#64748b" stroke-width="2"/>
  
  <!-- Scatter points with varying spread -->
  <circle cx="220" cy="630" r="2" fill="#64748b"/>
  <circle cx="225" cy="640" r="2" fill="#64748b"/>
  <circle cx="240" cy="620" r="2" fill="#64748b"/>
  <circle cx="260" cy="610" r="2" fill="#64748b"/>
  <circle cx="280" cy="600" r="2" fill="#64748b"/>
  <circle cx="300" cy="590" r="2" fill="#64748b"/>
  <circle cx="320" cy="580" r="2" fill="#64748b"/>
  <circle cx="340" cy="570" r="2" fill="#64748b"/>
  <circle cx="360" cy="560" r="2" fill="#64748b"/>
  <circle cx="380" cy="550" r="2" fill="#64748b"/>
  <circle cx="400" cy="580" r="2" fill="#64748b"/>
  <circle cx="420" cy="570" r="2" fill="#64748b"/>
  <circle cx="440" cy="560" r="2" fill="#64748b"/>
  <circle cx="460" cy="550" r="2" fill="#64748b"/>
  <circle cx="480" cy="540" r="2" fill="#64748b"/>
  <circle cx="500" cy="530" r="2" fill="#64748b"/>
  <circle cx="520" cy="520" r="2" fill="#64748b"/>
  <circle cx="540" cy="510" r="2" fill="#64748b"/>
  <circle cx="560" cy="500" r="2" fill="#64748b"/>
  <circle cx="580" cy="490" r="2" fill="#64748b"/>
  
  <!-- Additional points for spread -->
  <circle cx="300" cy="650" r="2" fill="#64748b"/>
  <circle cx="350" cy="620" r="2" fill="#64748b"/>
  <circle cx="400" cy="610" r="2" fill="#64748b"/>
  <circle cx="450" cy="590" r="2" fill="#64748b"/>
  <circle cx="500" cy="570" r="2" fill="#64748b"/>
  <circle cx="550" cy="550" r="2" fill="#64748b"/>
  <circle cx="600" cy="530" r="2" fill="#64748b"/>
  
  <circle cx="280" cy="660" r="2" fill="#64748b"/>
  <circle cx="320" cy="630" r="2" fill="#64748b"/>
  <circle cx="360" cy="600" r="2" fill="#64748b"/>
  <circle cx="400" cy="640" r="2" fill="#64748b"/>
  <circle cx="440" cy="620" r="2" fill="#64748b"/>
  <circle cx="480" cy="590" r="2" fill="#64748b"/>
  <circle cx="520" cy="570" r="2" fill="#64748b"/>
  <circle cx="560" cy="540" r="2" fill="#64748b"/>
  <circle cx="600" cy="520" r="2" fill="#64748b"/>
  
  <!-- Quantile regression lines -->
  <!-- 10th percentile (τ = 0.1) -->
  <line x1="220" y1="680" x2="780" y2="580" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- 50th percentile (median, τ = 0.5) -->
  <line x1="220" y1="630" x2="780" y2="500" stroke="#059669" stroke-width="3"/>
  
  <!-- 90th percentile (τ = 0.9) -->
  <line x1="220" y1="580" x2="780" y2="420" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Axes -->
  <line x1="220" y1="720" x2="780" y2="720" stroke="#64748b" stroke-width="1"/>
  <line x1="220" y1="480" x2="220" y2="720" stroke="#64748b" stroke-width="1"/>
  
  <!-- Axis labels -->
  <text x="500" y="755" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">X</text>
  <text x="185" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b" transform="rotate(-90, 185, 600)">Y</text>
  
  <!-- Legend -->
  <rect x="820" y="540" width="150" height="100" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1"/>
  <text x="895" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">
    Quantile Lines
  </text>
  
  <line x1="830" y1="575" x2="860" y2="575" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="870" y="580" font-family="Arial, sans-serif" font-size="11" fill="#dc2626">τ = 0.1 (10th)</text>
  
  <line x1="830" y1="595" x2="860" y2="595" stroke="#059669" stroke-width="3"/>
  <text x="870" y="600" font-family="Arial, sans-serif" font-size="11" fill="#059669">τ = 0.5 (Median)</text>
  
  <line x1="830" y1="615" x2="860" y2="615" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="870" y="620" font-family="Arial, sans-serif" font-size="11" fill="#3b82f6">τ = 0.9 (90th)</text>
  
  <!-- Applications note -->
  <text x="500" y="780" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#64748b">
    Applications: Risk management (tail analysis), Healthcare (birth weights), Supply chain (demand forecasting)
  </text>
</svg>