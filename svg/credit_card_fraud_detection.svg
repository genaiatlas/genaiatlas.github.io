<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="700" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">Credit Card Fraud Detection System</text>
  
  <!-- Transaction Input -->
  <g transform="translate(80, 100)">
    <rect x="-40" y="-30" width="80" height="60" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="10"/>
    <text x="0" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1976d2">💳 Transaction</text>
    <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1976d2">$500.00</text>
    <text x="0" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1976d2">Starbucks, NYC</text>
  </g>
  
  <!-- Arrow 1 -->
  <path d="M 140 130 L 200 130" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="170" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">&lt; 10ms</text>
  
  <!-- Feature Extraction -->
  <g transform="translate(240, 100)">
    <rect x="-50" y="-40" width="100" height="80" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="10"/>
    <text x="0" y="-25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f57c00">Feature</text>
    <text x="0" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f57c00">Extraction</text>
    <text x="0" y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">• Amount: $500</text>
    <text x="0" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">• Location: NYC</text>
    <text x="0" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">• Time: 2:30 PM</text>
  </g>
  
  <!-- Arrow 2 -->
  <path d="M 310 130 L 370 130" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="340" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">~30ms</text>
  
  <!-- Risk Scoring Model -->
  <g transform="translate(420, 100)">
    <rect x="-60" y="-50" width="120" height="100" fill="#e8f5e8" stroke="#4caf50" stroke-width="2" rx="10"/>
    <text x="0" y="-35" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2e7d32">ML Model</text>
    <text x="0" y="-20" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2e7d32">Risk Scoring</text>
    
    <!-- Mini neural network visualization -->
    <g transform="translate(0, 0)">
      <circle cx="-30" cy="-5" r="4" fill="#4caf50" opacity="0.7"/>
      <circle cx="-30" cy="8" r="4" fill="#4caf50" opacity="0.7"/>
      <circle cx="-30" cy="21" r="4" fill="#4caf50" opacity="0.7"/>
      
      <circle cx="0" cy="2" r="4" fill="#4caf50" opacity="0.7"/>
      <circle cx="0" cy="15" r="4" fill="#4caf50" opacity="0.7"/>
      
      <circle cx="30" cy="8" r="4" fill="#4caf50" opacity="0.7"/>
      
      <!-- Connections -->
      <line x1="-26" y1="-5" x2="-4" y2="2" stroke="#4caf50" stroke-width="1" opacity="0.5"/>
      <line x1="-26" y1="8" x2="-4" y2="2" stroke="#4caf50" stroke-width="1" opacity="0.5"/>
      <line x1="-26" y1="21" x2="-4" y2="15" stroke="#4caf50" stroke-width="1" opacity="0.5"/>
      <line x1="4" y1="2" x2="26" y2="8" stroke="#4caf50" stroke-width="2" opacity="0.7"/>
      <line x1="4" y1="15" x2="26" y2="8" stroke="#4caf50" stroke-width="1" opacity="0.5"/>
    </g>
    
    <text x="0" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Risk Score: 0.85</text>
  </g>
  
  <!-- Arrow 3 -->
  <path d="M 500 130 L 560 130" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="530" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">&lt; 5ms</text>
  
  <!-- Decision Engine -->
  <g transform="translate(620, 100)">
    <rect x="-60" y="-40" width="120" height="80" fill="#fce4ec" stroke="#e91e63" stroke-width="2" rx="10"/>
    <text x="0" y="-20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#c2185b">Decision</text>
    <text x="0" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#c2185b">Engine</text>
    <text x="0" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Threshold: 0.5</text>
    <text x="0" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#c2185b">0.85 &gt; 0.5 → FRAUD</text>
  </g>
  
  <!-- Decision Split Arrow -->
  <path d="M 700 130 L 760 130" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Decision Split -->
  <g transform="translate(780, 130)">
    <circle cx="0" cy="0" r="15" fill="#666"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">?</text>
  </g>
  
  <!-- Arrow to Block -->
  <path d="M 790 120 L 830 80" stroke="#d32f2f" stroke-width="3" fill="none" marker-end="url(#arrowhead_red)"/>
  <text x="815" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#d32f2f" transform="rotate(-30 815 95)">BLOCK</text>
  
  <!-- Arrow to Approve -->
  <path d="M 790 140 L 830 180" stroke="#388e3c" stroke-width="3" fill="none" marker-end="url(#arrowhead_green)"/>
  <text x="815" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#388e3c" transform="rotate(30 815 170)">APPROVE</text>
  
  <!-- Block Result -->
  <g transform="translate(880, 60)">
    <rect x="-40" y="-20" width="80" height="40" fill="#ffebee" stroke="#d32f2f" stroke-width="2" rx="5"/>
    <text x="0" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#d32f2f">❌ BLOCKED</text>
    <text x="0" y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#d32f2f">Transaction Denied</text>
  </g>
  
  <!-- Approve Result -->
  <g transform="translate(880, 200)">
    <rect x="-40" y="-20" width="80" height="40" fill="#e8f5e8" stroke="#388e3c" stroke-width="2" rx="5"/>
    <text x="0" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#388e3c">✅ APPROVED</text>
    <text x="0" y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#388e3c">Transaction Processed</text>
  </g>
  
  <!-- Feature Details Section -->
  <g transform="translate(50, 280)">
    <rect x="0" y="0" width="400" height="180" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="10"/>
    <text x="200" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">Key Features for Fraud Detection</text>
    
    <!-- Transaction Features -->
    <g transform="translate(20, 40)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1976d2">Transaction Features:</text>
      <text x="0" y="18" font-family="Arial, sans-serif" font-size="11" fill="#666">• Amount: Unusual high/low amounts</text>
      <text x="0" y="32" font-family="Arial, sans-serif" font-size="11" fill="#666">• Merchant: Category, reputation, location</text>
      <text x="0" y="46" font-family="Arial, sans-serif" font-size="11" fill="#666">• Time: Hour of day, day of week</text>
      <text x="0" y="60" font-family="Arial, sans-serif" font-size="11" fill="#666">• Currency: Domestic vs international</text>
    </g>
    
    <!-- Behavioral Features -->
    <g transform="translate(200, 40)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#388e3c">Behavioral Features:</text>
      <text x="0" y="18" font-family="Arial, sans-serif" font-size="11" fill="#666">• Velocity: Transactions per hour</text>
      <text x="0" y="32" font-family="Arial, sans-serif" font-size="11" fill="#666">• Location: Distance from home</text>
      <text x="0" y="46" font-family="Arial, sans-serif" font-size="11" fill="#666">• Pattern: Deviation from normal</text>
      <text x="0" y="60" font-family="Arial, sans-serif" font-size="11" fill="#666">• History: Previous fraud incidents</text>
    </g>
    
    <!-- Risk Factors -->
    <g transform="translate(20, 110)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#e91e63">High Risk Indicators:</text>
      <text x="0" y="18" font-family="Arial, sans-serif" font-size="11" fill="#666">• Multiple transactions in different locations</text>
      <text x="0" y="32" font-family="Arial, sans-serif" font-size="11" fill="#666">• Round number amounts ($100, $500, $1000)</text>
      <text x="0" y="46" font-family="Arial, sans-serif" font-size="11" fill="#666">• Transactions at unusual hours (3-6 AM)</text>
      <text x="0" y="60" font-family="Arial, sans-serif" font-size="11" fill="#666">• Card-not-present transactions</text>
    </g>
  </g>
  
  <!-- Error Types Section -->
  <g transform="translate(500, 280)">
    <rect x="0" y="0" width="450" height="180" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="10"/>
    <text x="225" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">Classification Errors &amp; Consequences</text>
    
    <!-- Type I Error -->
    <g transform="translate(20, 40)">
      <rect x="0" y="0" width="180" height="80" fill="#ffebee" stroke="#d32f2f" stroke-width="1" rx="5"/>
      <text x="90" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#d32f2f">Type I Error (False Positive)</text>
      <text x="10" y="30" font-family="Arial, sans-serif" font-size="10" fill="#666">Legitimate → Flagged as Fraud</text>
      <text x="10" y="45" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#d32f2f">Consequences:</text>
      <text x="10" y="58" font-family="Arial, sans-serif" font-size="9" fill="#666">• Customer inconvenience</text>
      <text x="10" y="70" font-family="Arial, sans-serif" font-size="9" fill="#666">• Lost sales, poor experience</text>
    </g>
    
    <!-- Type II Error -->
    <g transform="translate(220, 40)">
      <rect x="0" y="0" width="180" height="80" fill="#fff3e0" stroke="#ff9800" stroke-width="1" rx="5"/>
      <text x="90" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f57c00">Type II Error (False Negative)</text>
      <text x="10" y="30" font-family="Arial, sans-serif" font-size="10" fill="#666">Fraud → Approved as Legitimate</text>
      <text x="10" y="45" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#f57c00">Consequences:</text>
      <text x="10" y="58" font-family="Arial, sans-serif" font-size="9" fill="#666">• Financial loss</text>
      <text x="10" y="70" font-family="Arial, sans-serif" font-size="9" fill="#666">• Security breach</text>
    </g>
    
    <!-- Performance Metrics -->
    <g transform="translate(20, 130)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1976d2">Typical Performance Targets:</text>
      <text x="0" y="18" font-family="Arial, sans-serif" font-size="11" fill="#666">• Precision: 85-95% (minimize false positives)</text>
      <text x="0" y="32" font-family="Arial, sans-serif" font-size="11" fill="#666">• Recall: 70-85% (catch most fraud)</text>
      <text x="220" y="18" font-family="Arial, sans-serif" font-size="11" fill="#666">• Response time: &lt; 100ms</text>
      <text x="220" y="32" font-family="Arial, sans-serif" font-size="11" fill="#666">• Throughput: 10,000+ TPS</text>
    </g>
  </g>
  
  <!-- Real-world Scenarios -->
  <g transform="translate(50, 490)">
    <rect x="0" y="0" width="900" height="120" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="10"/>
    <text x="450" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">Real-World Scenarios</text>
    
    <!-- Scenario 1 -->
    <g transform="translate(30, 35)">
      <rect x="0" y="0" width="200" height="70" fill="#e3f2fd" stroke="#1976d2" stroke-width="1" rx="5"/>
      <text x="10" y="15" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1976d2">✈️ Vacation False Positive</text>
      <text x="10" y="30" font-family="Arial, sans-serif" font-size="9" fill="#666">Amsterdam coffee purchase blocked</text>
      <text x="10" y="42" font-family="Arial, sans-serif" font-size="9" fill="#666">Reason: Unusual foreign location</text>
      <text x="10" y="54" font-family="Arial, sans-serif" font-size="9" fill="#666">Solution: Travel notification</text>
    </g>
    
    <!-- Scenario 2 -->
    <g transform="translate(250, 35)">
      <rect x="0" y="0" width="200" height="70" fill="#e8f5e8" stroke="#388e3c" stroke-width="1" rx="5"/>
      <text x="10" y="15" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#388e3c">🎯 Successful Fraud Block</text>
      <text x="10" y="30" font-family="Arial, sans-serif" font-size="9" fill="#666">Multiple high-value purchases</text>
      <text x="10" y="42" font-family="Arial, sans-serif" font-size="9" fill="#666">User in different state simultaneously</text>
      <text x="10" y="54" font-family="Arial, sans-serif" font-size="9" fill="#666">Saved customer from $2,400 loss</text>
    </g>
    
    <!-- Scenario 3 -->
    <g transform="translate(470, 35)">
      <rect x="0" y="0" width="200" height="70" fill="#fff3e0" stroke="#ff9800" stroke-width="1" rx="5"/>
      <text x="10" y="15" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#f57c00">⚡ High-Speed Processing</text>
      <text x="10" y="30" font-family="Arial, sans-serif" font-size="9" fill="#666">Black Friday: 50,000 TPS</text>
      <text x="10" y="42" font-family="Arial, sans-serif" font-size="9" fill="#666">Average response: 45ms</text>
      <text x="10" y="54" font-family="Arial, sans-serif" font-size="9" fill="#666">99.8% uptime maintained</text>
    </g>
    
    <!-- Scenario 4 -->
    <g transform="translate(690, 35)">
      <rect x="0" y="0" width="180" height="70" fill="#fce4ec" stroke="#e91e63" stroke-width="1" rx="5"/>
      <text x="10" y="15" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#c2185b">🔄 Adaptive Learning</text>
      <text x="10" y="30" font-family="Arial, sans-serif" font-size="9" fill="#666">Weekly pattern analysis</text>
      <text x="10" y="42" font-family="Arial, sans-serif" font-size="9" fill="#666">Dynamic threshold adjustment</text>
      <text x="10" y="54" font-family="Arial, sans-serif" font-size="9" fill="#666">Continuous model retraining</text>
    </g>
  </g>
  
  <!-- Performance Timeline -->
  <g transform="translate(50, 630)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Processing Timeline (Real-Time):</text>
    <text x="20" y="20" font-family="Arial, sans-serif" font-size="12" fill="#1976d2">1. Card Swipe/Insert</text>
    <text x="180" y="20" font-family="Arial, sans-serif" font-size="12" fill="#ff9800">2. Extract Features (10ms)</text>
    <text x="350" y="20" font-family="Arial, sans-serif" font-size="12" fill="#4caf50">3. ML Score (30ms)</text>
    <text x="500" y="20" font-family="Arial, sans-serif" font-size="12" fill="#e91e63">4. Decision (5ms)</text>
    <text x="620" y="20" font-family="Arial, sans-serif" font-size="12" fill="#9c27b0">5. Response (5ms)</text>
    <text x="750" y="20" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Total: ≤ 50ms</text>
    
    <!-- Timeline visualization -->
    <line x1="20" y1="35" x2="850" y2="35" stroke="#ccc" stroke-width="2"/>
    <circle cx="20" cy="35" r="4" fill="#1976d2"/>
    <circle cx="180" cy="35" r="4" fill="#ff9800"/>
    <circle cx="350" cy="35" r="4" fill="#4caf50"/>
    <circle cx="500" cy="35" r="4" fill="#e91e63"/>
    <circle cx="620" cy="35" r="4" fill="#9c27b0"/>
    <circle cx="750" cy="35" r="5" fill="#333"/>
  </g>
  
  <!-- Arrow marker definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
            refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowhead_red" markerWidth="10" markerHeight="7" 
            refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d32f2f"/>
    </marker>
    <marker id="arrowhead_green" markerWidth="10" markerHeight="7" 
            refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#388e3c"/>
    </marker>
  </defs>
</svg>