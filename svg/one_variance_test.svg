<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="500" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Chi-Square Test for Single Variance
  </text>
  
  <!-- Subtitle -->
  <text x="400" y="70" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#5a6c7d">
    H₀: σ² = σ₀²  vs  H₁: σ² ≠ σ₀²
  </text>
  
  <!-- Chi-square distribution curve -->
  <path d="M 100 400 Q 150 200, 200 250 T 300 320 T 400 360 T 500 380 T 600 390 T 700 395" 
        fill="none" stroke="#3498db" stroke-width="3"/>
  
  <!-- Fill rejection region (right tail) -->
  <path d="M 580 375 Q 600 380, 620 385 Q 640 388, 660 390 Q 680 392, 700 393 L 700 400 L 580 400 Z" 
        fill="#e74c3c" opacity="0.3"/>
  
  <!-- Fill rejection region (left tail) -->
  <path d="M 100 400 Q 110 380, 120 360 Q 130 340, 140 320 L 140 400 Z" 
        fill="#e74c3c" opacity="0.3"/>
  
  <!-- Axes -->
  <line x1="80" y1="400" x2="720" y2="400" stroke="#2c3e50" stroke-width="2"/>
  <line x1="80" y1="400" x2="80" y2="100" stroke="#2c3e50" stroke-width="2"/>
  
  <!-- Axis labels -->
  <text x="400" y="440" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50">
    χ² statistic
  </text>
  <text x="30" y="250" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50" transform="rotate(-90 30 250)">
    Probability Density
  </text>
  
  <!-- Critical values -->
  <line x1="140" y1="320" x2="140" y2="410" stroke="#e74c3c" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="580" y1="375" x2="580" y2="410" stroke="#e74c3c" stroke-width="2" stroke-dasharray="5,5"/>
  
  <text x="140" y="430" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#e74c3c">
    χ²₁₋α/₂
  </text>
  <text x="580" y="430" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#e74c3c">
    χ²α/₂
  </text>
  
  <!-- Test statistic formula box -->
  <rect x="520" y="120" width="250" height="120" fill="white" stroke="#3498db" stroke-width="2" rx="5"/>
  <text x="645" y="150" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Test Statistic:
  </text>
  <text x="645" y="180" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#2c3e50">
    χ² = (n - 1)s²/σ₀²
  </text>
  <text x="645" y="210" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#5a6c7d">
    where n = sample size
  </text>
  <text x="645" y="230" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#5a6c7d">
    s² = sample variance
  </text>
  
  <!-- Rejection regions label -->
  <text x="110" y="300" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#e74c3c" font-weight="bold">
    Reject
  </text>
  <text x="650" y="365" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#e74c3c" font-weight="bold">
    Reject
  </text>
  <text x="360" y="340" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#27ae60" font-weight="bold">
    Do Not Reject H₀
  </text>
  
  <!-- Alpha annotation -->
  <text x="120" y="460" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#e74c3c">
    α/2
  </text>
  <text x="640" y="460" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#e74c3c">
    α/2
  </text>
</svg>