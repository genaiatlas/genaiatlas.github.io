<svg viewBox="0 0 800 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', sans-serif; font-size: 18px; font-weight: bold; fill: #2c3e50; }
      .step-number { font-family: 'Segoe UI', sans-serif; font-size: 16px; font-weight: bold; fill: white; }
      .header { font-family: 'Segoe UI', sans-serif; font-size: 13px; font-weight: bold; fill: #34495e; }
      .text { font-family: 'Segoe UI', sans-serif; font-size: 11px; fill: #2c3e50; }
      .small-text { font-family: 'Segoe UI', sans-serif; font-size: 9px; fill: #7f8c8d; }
      .math { font-family: 'Times New Roman', serif; font-size: 11px; fill: #8e44ad; }
      .step-box { fill: #3498db; stroke: #2980b9; stroke-width: 2; }
      .content-box { fill: #ecf0f1; stroke: #bdc3c7; stroke-width: 1; }
      .arrow { stroke: #34495e; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="25" class="title" text-anchor="middle">Seven Steps of Hypothesis Testing</text>

  <!-- Step 1 -->
  <circle cx="80" cy="70" r="20" class="step-box"/>
  <text x="80" y="76" class="step-number" text-anchor="middle">1</text>
  <rect x="120" y="50" width="280" height="40" class="content-box" rx="5"/>
  <text x="130" y="65" class="header">State the Hypotheses</text>
  <text x="130" y="80" class="text">Formulate H₀ and H₁ based on research question</text>

  <!-- Step 2 -->
  <circle cx="80" cy="130" r="20" class="step-box"/>
  <text x="80" y="136" class="step-number" text-anchor="middle">2</text>
  <rect x="120" y="110" width="280" height="40" class="content-box" rx="5"/>
  <text x="130" y="125" class="header">Choose Significance Level (α)</text>
  <text x="130" y="140" class="text">Typically α = 0.05, 0.01, or 0.10</text>

  <!-- Step 3 -->
  <circle cx="80" cy="190" r="20" class="step-box"/>
  <text x="80" y="196" class="step-number" text-anchor="middle">3</text>
  <rect x="120" y="170" width="280" height="40" class="content-box" rx="5"/>
  <text x="130" y="185" class="header">Select Test Statistic</text>
  <text x="130" y="200" class="text">Choose appropriate distribution (Z, t, χ², F)</text>

  <!-- Step 4 -->
  <circle cx="80" cy="250" r="20" class="step-box"/>
  <text x="80" y="256" class="step-number" text-anchor="middle">4</text>
  <rect x="120" y="230" width="280" height="40" class="content-box" rx="5"/>
  <text x="130" y="245" class="header">Calculate Test Statistic</text>
  <text x="130" y="260" class="text">Compute from sample data using appropriate formula</text>

  <!-- Step 5 -->
  <circle cx="480" cy="70" r="20" class="step-box"/>
  <text x="480" y="76" class="step-number" text-anchor="middle">5</text>
  <rect x="520" y="50" width="260" height="40" class="content-box" rx="5"/>
  <text x="530" y="65" class="header">Determine P-value</text>
  <text x="530" y="80" class="text">Find probability of observed or more extreme results</text>

  <!-- Step 6 -->
  <circle cx="480" cy="130" r="20" class="step-box"/>
  <text x="480" y="136" class="step-number" text-anchor="middle">6</text>
  <rect x="520" y="110" width="260" height="40" class="content-box" rx="5"/>
  <text x="530" y="125" class="header">Make Decision</text>
  <text x="530" y="140" class="text">Compare p-value to α and reject or fail to reject H₀</text>

  <!-- Step 7 -->
  <circle cx="480" cy="190" r="20" class="step-box"/>
  <text x="480" y="196" class="step-number" text-anchor="middle">7</text>
  <rect x="520" y="170" width="260" height="40" class="content-box" rx="5"/>
  <text x="530" y="185" class="header">Interpret Results</text>
  <text x="530" y="200" class="text">State conclusion in context of the problem</text>

  <!-- Arrows connecting steps -->
  <line x1="100" y1="80" x2="100" y2="110" class="arrow"/>
  <line x1="100" y1="140" x2="100" y2="170" class="arrow"/>
  <line x1="100" y1="200" x2="100" y2="230" class="arrow"/>
  <line x1="410" y1="250" x2="460" y2="80" class="arrow"/>
  <line x1="500" y1="80" x2="500" y2="110" class="arrow"/>
  <line x1="500" y1="140" x2="500" y2="170" class="arrow"/>

  <!-- Detailed Examples Section -->
  <rect x="50" y="290" width="700" height="180" class="content-box" rx="8"/>
  <text x="400" y="310" class="header" text-anchor="middle">Example: Testing Population Mean</text>

  <!-- Example content -->
  <text x="70" y="330" class="text">Research Question: Is the average height of students different from 170 cm?</text>
  
  <text x="70" y="350" class="text">Step 1: H₀: μ = 170 cm vs H₁: μ ≠ 170 cm (two-tailed test)</text>
  <text x="70" y="365" class="text">Step 2: Choose α = 0.05</text>
  <text x="70" y="380" class="text">Step 3: Use t-test (population standard deviation unknown)</text>

  <text x="70" y="400" class="math">Step 4: Calculate t = (X̄ - μ₀)/(s/√n)</text>
  <text x="70" y="415" class="text">        If X̄ = 172.5, s = 8.2, n = 25: t = (172.5 - 170)/(8.2/√25) = 1.52</text>

  <text x="70" y="435" class="text">Step 5: P-value = 2 × P(t₂₄ > 1.52) ≈ 0.141 (two-tailed)</text>
  <text x="70" y="450" class="text">Step 6: Since p-value (0.141) > α (0.05), fail to reject H₀</text>
  <text x="70" y="465" class="text">Step 7: Insufficient evidence that average height differs from 170 cm</text>

  <!-- Decision Flowchart -->
  <rect x="50" y="490" width="700" height="180" class="content-box" rx="8"/>
  <text x="400" y="510" class="header" text-anchor="middle">Decision Flowchart</text>

  <!-- Flowchart elements -->
  <rect x="150" y="530" width="120" height="40" fill="#f39c12" stroke="#e67e22" stroke-width="2" rx="5"/>
  <text x="210" y="545" class="text" text-anchor="middle">Calculate</text>
  <text x="210" y="560" class="text" text-anchor="middle">p-value</text>

  <polygon points="350,530 380,550 350,570 320,550" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <text x="350" y="545" class="text" text-anchor="middle" fill="white">p ≤ α?</text>
  <text x="350" y="560" class="text" text-anchor="middle" fill="white">Decision</text>

  <rect x="450" y="490" width="120" height="40" fill="#27ae60" stroke="#229954" stroke-width="2" rx="5"/>
  <text x="510" y="505" class="text" text-anchor="middle" fill="white">Reject H₀</text>
  <text x="510" y="520" class="text" text-anchor="middle" fill="white">Significant result</text>

  <rect x="450" y="570" width="120" height="40" fill="#27ae60" stroke="#229954" stroke-width="2" rx="5"/>
  <text x="510" y="585" class="text" text-anchor="middle" fill="white">Fail to reject H₀</text>
  <text x="510" y="600" class="text" text-anchor="middle" fill="white">Not significant</text>

  <!-- Flowchart arrows -->
  <line x1="270" y1="550" x2="320" y2="550" class="arrow"/>
  <line x1="380" y1="540" x2="450" y2="510" class="arrow"/>
  <line x1="380" y1="560" x2="450" y2="590" class="arrow"/>

  <!-- Labels -->
  <text x="415" y="490" class="small-text">Yes</text>
  <text x="415" y="615" class="small-text">No</text>

  <!-- Important Notes -->
  <rect x="50" y="630" width="700" height="50" fill="#fff3cd" stroke="#ffeaa7" stroke-width="2" rx="5"/>
  <text x="60" y="645" class="text">⚠️ Important: Always check assumptions before conducting the test</text>
  <text x="60" y="660" class="text">✓ Independence ✓ Normality ✓ Equal variances (when applicable) ✓ Random sampling</text>
  <text x="60" y="675" class="text">📊 Consider practical significance alongside statistical significance</text>

</svg>