<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="600" y="40" font-size="28" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Graphical Model Basics for Recommendation Systems
  </text>
  
  <!-- Left Side: Graph Structure -->
  <g id="graph-structure">
    <text x="300" y="90" font-size="20" font-weight="bold" text-anchor="middle" fill="#34495e">
      Graph Structure
    </text>
    
    <!-- Nodes (Movies) -->
    <circle cx="200" cy="200" r="45" fill="#3498db" stroke="#2c3e50" stroke-width="3"/>
    <text x="200" y="210" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
      Casablanca
    </text>
    
    <circle cx="400" cy="200" r="45" fill="#3498db" stroke="#2c3e50" stroke-width="3"/>
    <text x="400" y="210" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
      Godfather
    </text>
    
    <circle cx="200" cy="350" r="45" fill="#3498db" stroke="#2c3e50" stroke-width="3"/>
    <text x="200" y="350" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
      Iron Man
    </text>
    <text x="200" y="365" font-size="12" text-anchor="middle" fill="white">
    </text>
    
    <circle cx="400" cy="350" r="45" fill="#3498db" stroke="#2c3e50" stroke-width="3"/>
    <text x="400" y="355" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
      Batman
    </text>
    
    <!-- Edges showing relationships -->
    <line x1="235" y1="215" x2="365" y2="215" stroke="#e74c3c" stroke-width="4"/>
    <text x="300" y="190" font-size="12" text-anchor="middle" fill="#e74c3c" font-weight="bold">
      Strong +
    </text>
    
    <line x1="215" y1="240" x2="215" y2="305" stroke="#95a5a6" stroke-width="3"/>
    <text x="180" y="275" font-size="12" text-anchor="middle" fill="#95a5a6" font-weight="bold">
      Weak
    </text>
    
    <line x1="385" y1="240" x2="385" y2="305" stroke="#e74c3c" stroke-width="4"/>
    <text x="420" y="275" font-size="12" text-anchor="middle" fill="#e74c3c" font-weight="bold">
      Strong +
    </text>
    
    <line x1="235" y1="365" x2="365" y2="365" stroke="#27ae60" stroke-width="3"/>
    <text x="300" y="390" font-size="12" text-anchor="middle" fill="#27ae60" font-weight="bold">
      Moderate +
    </text>
    
    <!-- Legend for nodes -->
    <rect x="100" y="420" width="300" height="120" fill="#ecf0f1" stroke="#34495e" stroke-width="2" rx="5"/>
    <text x="250" y="445" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Graph Components
    </text>
    <text x="120" y="470" font-size="13" fill="#2c3e50">
      • Nodes = Movies/Items
    </text>
    <text x="120" y="495" font-size="13" fill="#2c3e50">
      • Edges = Preference Correlations
    </text>
    <text x="120" y="520" font-size="13" fill="#2c3e50">
      • Values = +1 (like) or -1 (dislike)
    </text>
  </g>
  
  <!-- Right Side: User Preferences -->
  <g id="user-preferences">
    <text x="850" y="90" font-size="20" font-weight="bold" text-anchor="middle" fill="#34495e">
      User Preference Examples
    </text>
    
    <!-- User 1 -->
    <rect x="650" y="120" width="400" height="80" fill="#e8f5e9" stroke="#27ae60" stroke-width="2" rx="5"/>
    <text x="670" y="145" font-size="14" font-weight="bold" fill="#27ae60">
      User 1 (Classic Film Lover):
    </text>
    <text x="670" y="170" font-size="12" fill="#2c3e50">
      Casablanca: +1  |  Godfather: +1
    </text>
    <text x="670" y="190" font-size="12" fill="#2c3e50">
      Iron Man: -1  |  Batman: -1
    </text>
    
    <!-- User 2 -->
    <rect x="650" y="220" width="400" height="80" fill="#fff3e0" stroke="#f39c12" stroke-width="2" rx="5"/>
    <text x="670" y="245" font-size="14" font-weight="bold" fill="#f39c12">
      User 2 (Action Fan):
    </text>
    <text x="670" y="270" font-size="12" fill="#2c3e50">
      Casablanca: -1  |  Godfather: -1
    </text>
    <text x="670" y="290" font-size="12" fill="#2c3e50">
      Iron Man: +1  |  Batman: +1
    </text>
    
    <!-- User 3 -->
    <rect x="650" y="320" width="400" height="80" fill="#e3f2fd" stroke="#2196f3" stroke-width="2" rx="5"/>
    <text x="670" y="345" font-size="14" font-weight="bold" fill="#2196f3">
      User 3 (Mixed Preferences):
    </text>
    <text x="670" y="370" font-size="12" fill="#2c3e50">
      Casablanca: +1  |  Godfather: +1
    </text>
    <text x="670" y="390" font-size="12" fill="#2c3e50">
      Iron Man: +1  |  Batman: -1
    </text>
  </g>
  
  <!-- Distribution Captured -->
  <g id="distribution-info">
    <rect x="650" y="430" width="400" height="140" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2" rx="5"/>
    <text x="850" y="455" font-size="16" font-weight="bold" text-anchor="middle" fill="#9c27b0">
      What the Model Captures
    </text>
    <text x="670" y="485" font-size="13" fill="#2c3e50">
      ✓ Joint probability distribution over all preferences
    </text>
    <text x="670" y="510" font-size="13" fill="#2c3e50">
      ✓ Correlation patterns between movies
    </text>
    <text x="670" y="535" font-size="13" fill="#2c3e50">
      ✓ Complex multi-way dependencies
    </text>
    <text x="670" y="560" font-size="13" fill="#2c3e50">
      ✓ Population-level preference relationships
    </text>
  </g>
  
  <!-- Bottom: Key Insight -->
  <rect x="100" y="600" width="1000" height="150" fill="#fef5e7" stroke="#f39c12" stroke-width="3" rx="8"/>
  <text x="600" y="635" font-size="18" font-weight="bold" text-anchor="middle" fill="#e67e22">
    Key Insight: Graphical Structure Enables Efficient Computation
  </text>
  <text x="600" y="670" font-size="14" text-anchor="middle" fill="#2c3e50">
    Instead of computing over all 2^n possible preference combinations,
  </text>
  <text x="600" y="695" font-size="14" text-anchor="middle" fill="#2c3e50">
    the graph structure allows us to use belief propagation algorithms
  </text>
  <text x="600" y="720" font-size="14" text-anchor="middle" fill="#2c3e50">
    that exploit conditional independence for tractable inference.
  </text>
</svg>