<svg viewBox="0 0 1200 850" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="600" y="35" font-size="24" font-weight="bold" text-anchor="middle" fill="#2C3E50">
    SVD Reconstruction: From Patterns to Predictions
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="60" font-size="14" text-anchor="middle" fill="#7F8C8D">
    How Singular Value Decomposition recovers user-item preference structures
  </text>
  
  <!-- Section 1: SVD Formula -->
  <g id="svd-formula">
    <rect x="100" y="85" width="1000" height="80" fill="#EBF5FB" stroke="#2980B9" stroke-width="2" rx="8"/>
    
    <text x="600" y="115" font-size="16" font-weight="bold" text-anchor="middle" fill="#2980B9">
      SVD Decomposition Formula
    </text>
    
    <text x="600" y="145" font-size="18" font-weight="bold" text-anchor="middle" fill="#2C3E50">
      M ≈ σ₁(U₁ ⊗ V₁) + σ₂(U₂ ⊗ V₂) + σ₃(U₃ ⊗ V₃) + ... + σₖ(Uₖ ⊗ Vₖ)
    </text>
  </g>
  
  <!-- Section 2: Component Breakdown -->
  <g id="components">
    <text x="600" y="205" font-size="16" font-weight="bold" text-anchor="middle" fill="#34495E">
      Individual Pattern Components
    </text>
    
    <!-- Pattern 1: Dominant pattern -->
    <g id="pattern1">
      <rect x="80" y="225" width="320" height="160" fill="#FADBD8" stroke="#E74C3C" stroke-width="2" rx="5"/>
      
      <text x="240" y="255" font-size="14" font-weight="bold" text-anchor="middle" fill="#E74C3C">
        Pattern 1: Bikers × Dance
      </text>
      
      <!-- Visual representation -->
      <rect x="110" y="270" width="100" height="80" fill="#E74C3C" opacity="0.7"/>
      <text x="160" y="315" font-size="12" font-weight="bold" text-anchor="middle" fill="white">
        Strong
      </text>
      <text x="160" y="330" font-size="12" font-weight="bold" text-anchor="middle" fill="white">
        Preference
      </text>
      
      <text x="280" y="295" font-size="13" font-weight="bold" text-anchor="middle" fill="#2C3E50">
        σ₁ = 25.3
      </text>
      <text x="280" y="315" font-size="10" text-anchor="middle" fill="#555">
        (Largest)
      </text>
      <text x="280" y="335" font-size="10" text-anchor="middle" fill="#7F8C8D">
        Most important
      </text>
      <text x="280" y="350" font-size="10" text-anchor="middle" fill="#7F8C8D">
        pattern
      </text>
      
      <text x="240" y="375" font-size="10" font-style="italic" text-anchor="middle" fill="#555">
        Explains ~40% of variance
      </text>
    </g>
    
    <!-- Pattern 2: Secondary pattern -->
    <g id="pattern2">
      <rect x="440" y="225" width="320" height="160" fill="#EBDEF0" stroke="#9B59B6" stroke-width="2" rx="5"/>
      
      <text x="600" y="255" font-size="14" font-weight="bold" text-anchor="middle" fill="#9B59B6">
        Pattern 2: Teens × Pop
      </text>
      
      <!-- Visual representation -->
      <rect x="470" y="270" width="100" height="80" fill="#9B59B6" opacity="0.7"/>
      <text x="520" y="315" font-size="12" font-weight="bold" text-anchor="middle" fill="white">
        Medium
      </text>
      <text x="520" y="330" font-size="12" font-weight="bold" text-anchor="middle" fill="white">
        Preference
      </text>
      
      <text x="640" y="295" font-size="13" font-weight="bold" text-anchor="middle" fill="#2C3E50">
        σ₂ = 18.7
      </text>
      <text x="640" y="315" font-size="10" text-anchor="middle" fill="#555">
        (Second)
      </text>
      <text x="640" y="335" font-size="10" text-anchor="middle" fill="#7F8C8D">
        Important but
      </text>
      <text x="640" y="350" font-size="10" text-anchor="middle" fill="#7F8C8D">
        less dominant
      </text>
      
      <text x="600" y="375" font-size="10" font-style="italic" text-anchor="middle" fill="#555">
        Explains ~25% of variance
      </text>
    </g>
    
    <!-- Pattern 3: Tertiary pattern -->
    <g id="pattern3">
      <rect x="800" y="225" width="320" height="160" fill="#E8F8F5" stroke="#27AE60" stroke-width="2" rx="5"/>
      
      <text x="960" y="255" font-size="14" font-weight="bold" text-anchor="middle" fill="#27AE60">
        Pattern 3: Action Fans
      </text>
      
      <!-- Visual representation -->
      <rect x="830" y="270" width="100" height="80" fill="#27AE60" opacity="0.6"/>
      <text x="880" y="315" font-size="11" font-weight="bold" text-anchor="middle" fill="white">
        Moderate
      </text>
      <text x="880" y="330" font-size="11" font-weight="bold" text-anchor="middle" fill="white">
        Preference
      </text>
      
      <text x="1000" y="295" font-size="13" font-weight="bold" text-anchor="middle" fill="#2C3E50">
        σ₃ = 12.1
      </text>
      <text x="1000" y="315" font-size="10" text-anchor="middle" fill="#555">
        (Third)
      </text>
      <text x="1000" y="335" font-size="10" text-anchor="middle" fill="#7F8C8D">
        Weaker
      </text>
      <text x="1000" y="350" font-size="10" text-anchor="middle" fill="#7F8C8D">
        contribution
      </text>
      
      <text x="960" y="375" font-size="10" font-style="italic" text-anchor="middle" fill="#555">
        Explains ~15% of variance
      </text>
    </g>
  </g>
  
  <!-- Section 3: Reconstruction Process -->
  <g id="reconstruction">
    <text x="600" y="430" font-size="16" font-weight="bold" text-anchor="middle" fill="#34495E">
      Reconstruction Process: Summing Patterns
    </text>
    
    <!-- Step 1 -->
    <g id="step1">
      <rect x="100" y="455" width="140" height="100" fill="#FADBD8" stroke="#E74C3C" stroke-width="2"/>
      <text x="170" y="480" font-size="11" font-weight="bold" text-anchor="middle" fill="#E74C3C">σ₁(U₁ ⊗ V₁)</text>
      <rect x="120" y="490" width="40" height="40" fill="#E74C3C" opacity="0.8"/>
      <text x="170" y="545" font-size="9" text-anchor="middle" fill="#555">Pattern 1</text>
    </g>
    
    <!-- Plus sign -->
    <text x="260" y="510" font-size="24" font-weight="bold" text-anchor="middle" fill="#34495E">+</text>
    
    <!-- Step 2 -->
    <g id="step2">
      <rect x="300" y="455" width="140" height="100" fill="#EBDEF0" stroke="#9B59B6" stroke-width="2"/>
      <text x="370" y="480" font-size="11" font-weight="bold" text-anchor="middle" fill="#9B59B6">σ₂(U₂ ⊗ V₂)</text>
      <rect x="340" y="490" width="30" height="40" fill="#9B59B6" opacity="0.7"/>
      <text x="370" y="545" font-size="9" text-anchor="middle" fill="#555">Pattern 2</text>
    </g>
    
    <!-- Plus sign -->
    <text x="460" y="510" font-size="24" font-weight="bold" text-anchor="middle" fill="#34495E">+</text>
    
    <!-- Step 3 -->
    <g id="step3">
      <rect x="500" y="455" width="140" height="100" fill="#E8F8F5" stroke="#27AE60" stroke-width="2"/>
      <text x="570" y="480" font-size="11" font-weight="bold" text-anchor="middle" fill="#27AE60">σ₃(U₃ ⊗ V₃)</text>
      <rect x="545" y="500" width="25" height="30" fill="#27AE60" opacity="0.6"/>
      <text x="570" y="545" font-size="9" text-anchor="middle" fill="#555">Pattern 3</text>
    </g>
    
    <!-- Plus more -->
    <text x="660" y="510" font-size="24" font-weight="bold" text-anchor="middle" fill="#7F8C8D">+ ...</text>
    
    <!-- Equals -->
    <text x="740" y="510" font-size="24" font-weight="bold" text-anchor="middle" fill="#34495E">=</text>
    
    <!-- Final matrix -->
    <g id="final-matrix">
      <rect x="800" y="455" width="300" height="100" fill="#F8F9FA" stroke="#2C3E50" stroke-width="3"/>
      <text x="950" y="480" font-size="13" font-weight="bold" text-anchor="middle" fill="#2C3E50">
        Reconstructed Matrix M̂
      </text>
      
      <!-- Visual grid -->
      <line x1="820" y1="495" x2="1080" y2="495" stroke="#BDC3C7" stroke-width="1" opacity="0.5"/>
      <line x1="820" y1="515" x2="1080" y2="515" stroke="#BDC3C7" stroke-width="1" opacity="0.5"/>
      <line x1="820" y1="535" x2="1080" y2="535" stroke="#BDC3C7" stroke-width="1" opacity="0.5"/>
      
      <line x1="870" y1="490" x2="870" y2="545" stroke="#BDC3C7" stroke-width="1" opacity="0.5"/>
      <line x1="920" y1="490" x2="920" y2="545" stroke="#BDC3C7" stroke-width="1" opacity="0.5"/>
      <line x1="970" y1="490" x2="970" y2="545" stroke="#BDC3C7" stroke-width="1" opacity="0.5"/>
      <line x1="1020" y1="490" x2="1020" y2="545" stroke="#BDC3C7" stroke-width="1" opacity="0.5"/>
      
      <text x="950" y="525" font-size="11" text-anchor="middle" fill="#27AE60">Predicted Ratings</text>
    </g>
  </g>
  
  <!-- Section 4: Singular Value Importance -->
  <g id="singular-values">
    <text x="300" y="600" font-size="16" font-weight="bold" text-anchor="middle" fill="#34495E">
      Singular Value Scree Plot
    </text>
    
    <rect x="100" y="620" width="400" height="200" fill="#F8F9FA" stroke="#34495E" stroke-width="2" rx="5"/>
    
    <!-- Axes -->
    <line x1="130" y1="790" x2="470" y2="790" stroke="#2C3E50" stroke-width="2"/>
    <line x1="130" y1="640" x2="130" y2="790" stroke="#2C3E50" stroke-width="2"/>
    
    <!-- Y-axis label -->
    <text x="115" y="710" font-size="11" text-anchor="middle" fill="#555" transform="rotate(-90 115 710)">
      Singular Value (σ)
    </text>
    
    <!-- X-axis label -->
    <text x="300" y="810" font-size="11" text-anchor="middle" fill="#555">
      Component Index
    </text>
    
    <!-- Scree plot points and line -->
    <circle cx="160" cy="660" r="6" fill="#E74C3C"/>
    <text x="160" y="652" font-size="9" text-anchor="middle" fill="#E74C3C">25.3</text>
    
    <circle cx="210" cy="690" r="6" fill="#9B59B6"/>
    <text x="210" y="682" font-size="9" text-anchor="middle" fill="#9B59B6">18.7</text>
    
    <circle cx="260" cy="715" r="6" fill="#27AE60"/>
    <text x="260" y="707" font-size="9" text-anchor="middle" fill="#27AE60">12.1</text>
    
    <circle cx="310" cy="740" r="5" fill="#F39C12"/>
    <text x="310" y="732" font-size="8" text-anchor="middle" fill="#F39C12">8.2</text>
    
    <circle cx="360" cy="758" r="4" fill="#7F8C8D"/>
    <text x="360" y="750" font-size="8" text-anchor="middle" fill="#7F8C8D">5.1</text>
    
    <circle cx="410" cy="770" r="3" fill="#95A5A6"/>
    <circle cx="440" cy="777" r="2" fill="#BDC3C7"/>
    
    <!-- Connect with line -->
    <polyline points="160,660 210,690 260,715 310,740 360,758 410,770 440,777" 
              stroke="#3498DB" stroke-width="2" fill="none"/>
    
    <!-- Elbow marker -->
    <path d="M 260 710 Q 260 690 280 690" stroke="#E74C3C" stroke-width="2" fill="none" 
          stroke-dasharray="4,2"/>
    <text x="320" y="695" font-size="10" font-weight="bold" text-anchor="start" fill="#E74C3C">
      "Elbow" → k ≈ 3-4
    </text>
    
    <text x="150" y="637" font-size="9" text-anchor="start" fill="#555">1</text>
    <text x="200" y="637" font-size="9" text-anchor="start" fill="#555">2</text>
    <text x="250" y="637" font-size="9" text-anchor="start" fill="#555">3</text>
    <text x="300" y="637" font-size="9" text-anchor="start" fill="#555">4</text>
    <text x="350" y="637" font-size="9" text-anchor="start" fill="#555">5</text>
    <text x="410" y="637" font-size="9" text-anchor="start" fill="#7F8C8D">...</text>
  </g>
  
  <!-- Section 5: Prediction Example -->
  <g id="prediction-example">
    <text x="850" y="600" font-size="16" font-weight="bold" text-anchor="middle" fill="#34495E">
      Prediction for User i, Movie j
    </text>
    
    <rect x="600" y="620" width="500" height="200" fill="#FEF9E7" stroke="#F39C12" stroke-width="2" rx="8"/>
    
    <text x="850" y="655" font-size="14" font-weight="bold" text-anchor="middle" fill="#2C3E50">
      R̂ᵢⱼ = Σₖ σₖ · Uᵢₖ · Vₖⱼ
    </text>
    
    <text x="850" y="685" font-size="12" text-anchor="middle" fill="#555">
      = σ₁·Uᵢ₁·V₁ⱼ + σ₂·Uᵢ₂·V₂ⱼ + σ₃·Uᵢ₃·V₃ⱼ + ...
    </text>
    
    <text x="650" y="720" font-size="11" font-weight="bold" text-anchor="start" fill="#E74C3C">
      Example: Biker (User 5) rating Dance Movie (Movie 12)
    </text>
    
    <text x="650" y="745" font-size="11" text-anchor="start" fill="#555">
      = 25.3 × 0.8 × 0.9 + 18.7 × 0.1 × 0.2 + 12.1 × (-0.3) × 0.1
    </text>
    
    <text x="650" y="768" font-size="13" font-weight="bold" text-anchor="start" fill="#27AE60">
      = 18.2 + 0.4 - 0.4 = 18.2
    </text>
    
    <text x="650" y="793" font-size="10" font-style="italic" text-anchor="start" fill="#7F8C8D">
      Dominant pattern (bikers × dance) contributes most to the prediction
    </text>
  </g>
  
  <!-- Key Properties Box -->
  <g id="properties-box">
    <rect x="100" y="840" width="1000" height="0" fill="#E8F8F5" stroke="#27AE60" stroke-width="0" rx="8"/>
  </g>
</svg>