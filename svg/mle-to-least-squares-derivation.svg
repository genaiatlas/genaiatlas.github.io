<svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title-text { font-family: 'Arial', sans-serif; font-size: 24px; font-weight: bold; fill: #2c3e50; }
      .step-title { font-family: 'Arial', sans-serif; font-size: 16px; font-weight: bold; fill: #2c3e50; }
      .equation-text { font-family: 'Times New Roman', serif; font-size: 14px; fill: #2c3e50; }
      .label-text { font-family: 'Arial', sans-serif; font-size: 12px; fill: #34495e; }
      .small-text { font-family: 'Arial', sans-serif; font-size: 11px; fill: #7f8c8d; }
      .step-box { fill: #f8f9fa; stroke: #6c757d; stroke-width: 2; rx: 8; }
      .highlight-box { fill: #fff3cd; stroke: #ffc107; stroke-width: 2; rx: 5; }
      .result-box { fill: #d4edda; stroke: #28a745; stroke-width: 2; rx: 5; }
      .arrow { stroke: #007bff; stroke-width: 2; fill: #007bff; }
    </style>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title-text">MLE to Least Squares Derivation</text>
  
  <!-- Step 1: Starting Point -->
  <g transform="translate(50, 60)">
    <rect x="0" y="0" width="700" height="80" class="step-box"/>
    <text x="20" y="25" class="step-title">Step 1: Maximum Likelihood Setup</text>
    <text x="20" y="45" class="equation-text">L(θ₀, θ₁) = ∏ᵢ₌₁ⁿ (1/√(2πσ²)) exp{-(Yᵢ - θ₀ - θ₁Xᵢ)²/(2σ²)}</text>
    <text x="20" y="65" class="label-text">Goal: max L(θ₀, θ₁) - Find parameters that maximize likelihood</text>
  </g>
  
  <!-- Arrow 1 -->
  <g transform="translate(400, 140)">
    <path d="M 0 0 L 0 20 L -5 15 M 0 20 L 5 15" class="arrow"/>
  </g>
  
  <!-- Step 2: Log Transformation -->
  <g transform="translate(50, 160)">
    <rect x="0" y="0" width="700" height="100" class="step-box"/>
    <text x="20" y="25" class="step-title">Step 2: Log-Likelihood Transformation</text>
    <text x="20" y="50" class="equation-text">log L(θ₀, θ₁) = log[∏ᵢ₌₁ⁿ (1/√(2πσ²)) exp{-(Yᵢ - θ₀ - θ₁Xᵢ)²/(2σ²)}]</text>
    <text x="20" y="70" class="equation-text">= Σᵢ₌₁ⁿ [log(1/√(2πσ²)) - (Yᵢ - θ₀ - θ₁Xᵢ)²/(2σ²)]</text>
    <text x="20" y="90" class="label-text">Log converts product to sum, easier to differentiate</text>
  </g>
  
  <!-- Arrow 2 -->
  <g transform="translate(400, 260)">
    <path d="M 0 0 L 0 20 L -5 15 M 0 20 L 5 15" class="arrow"/>
  </g>
  
  <!-- Step 3: Constant Term Separation -->
  <g transform="translate(50, 280)">
    <rect x="0" y="0" width="700" height="100" class="highlight-box"/>
    <text x="20" y="25" class="step-title">Step 3: Separate Constants</text>
    <text x="20" y="50" class="equation-text">log L(θ₀, θ₁) = -n/2 log(2πσ²) - (1/2σ²) Σᵢ₌₁ⁿ (Yᵢ - θ₀ - θ₁Xᵢ)²</text>
    <text x="20" y="75" class="small-text">Constant term: -n/2 log(2πσ²) doesn't depend on θ₀, θ₁</text>
    <text x="20" y="90" class="label-text">For optimization, we can ignore constants!</text>
  </g>
  
  <!-- Arrow 3 -->
  <g transform="translate(400, 380)">
    <path d="M 0 0 L 0 20 L -5 15 M 0 20 L 5 15" class="arrow"/>
  </g>
  
  <!-- Step 4: Optimization Focus -->
  <g transform="translate(50, 400)">
    <rect x="0" y="0" width="700" height="80" class="step-box"/>
    <text x="20" y="25" class="step-title">Step 4: Focus on Variable Terms</text>
    <text x="20" y="50" class="equation-text">max log L(θ₀, θ₁) ≡ max [-(1/2σ²) Σᵢ₌₁ⁿ (Yᵢ - θ₀ - θ₁Xᵢ)²]</text>
    <text x="20" y="70" class="label-text">Only the sum of squares term affects optimization</text>
  </g>
  
  <!-- Arrow 4 -->
  <g transform="translate(400, 480)">
    <path d="M 0 0 L 0 20 L -5 15 M 0 20 L 5 15" class="arrow"/>
  </g>
  
  <!-- Step 5: Sign Flip -->
  <g transform="translate(50, 500)">
    <rect x="0" y="0" width="700" height="80" class="step-box"/>
    <text x="20" y="25" class="step-title">Step 5: Maximization to Minimization</text>
    <text x="20" y="50" class="equation-text">max [-(1/2σ²) Σᵢ₌₁ⁿ (Yᵢ - θ₀ - θ₁Xᵢ)²] ≡ min [Σᵢ₌₁ⁿ (Yᵢ - θ₀ - θ₁Xᵢ)²]</text>
    <text x="20" y="70" class="label-text">Negative coefficient makes maximization → minimization</text>
  </g>
  
  <!-- Arrow 5 -->
  <g transform="translate(400, 580)">
    <path d="M 0 0 L 0 20 L -5 15 M 0 20 L 5 15" class="arrow"/>
  </g>
  
  <!-- Step 6: Final Result -->
  <g transform="translate(150, 600)">
    <rect x="0" y="0" width="500" height="100" class="result-box"/>
    <text x="250" y="25" text-anchor="middle" class="step-title" fill="#155724">Result: Least Squares Objective</text>
    <text x="250" y="55" text-anchor="middle" class="equation-text">min Σᵢ₌₁ⁿ (Yᵢ - θ₀ - θ₁Xᵢ)²</text>
    <text x="250" y="80" text-anchor="middle" class="label-text" fill="#155724">Identical to standard linear regression!</text>
  </g>
  
  <!-- Side annotations -->
  <g transform="translate(520, 150)">
    <rect x="0" y="0" width="200" height="200" fill="#e3f2fd" stroke="#2196f3" stroke-width="2" rx="8"/>
    <text x="10" y="20" class="step-title" fill="#1976d2">Key Insights:</text>
    
    <text x="10" y="45" class="small-text">✓ Log preserves order</text>
    <text x="15" y="60" class="small-text">max f(x) = max log f(x)</text>
    
    <text x="10" y="80" class="small-text">✓ Constants don't affect</text>
    <text x="15" y="95" class="small-text">optimization</text>
    
    <text x="10" y="115" class="small-text">✓ Negative coefficient</text>
    <text x="15" y="130" class="small-text">flips max → min</text>
    
    <text x="10" y="150" class="small-text">✓ σ² cancels out in</text>
    <text x="15" y="165" class="small-text">optimization</text>
    
    <text x="10" y="185" class="small-text">✓ Normal assumption</text>
    <text x="15" y="200" class="small-text">→ least squares</text>
  </g>
  
  <!-- Mathematical equivalence summary -->
  <g transform="translate(50, 720)">
    <rect x="0" y="0" width="700" height="60" fill="#f8f9fa" stroke="#6c757d" stroke-width="2" rx="8"/>
    <text x="350" y="25" text-anchor="middle" class="step-title">Mathematical Equivalence</text>
    <text x="350" y="45" text-anchor="middle" class="equation-text">
      MLE under Normal assumptions ≡ Least Squares Minimization
    </text>
  </g>
</svg>