<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="400" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="600" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">CNN Architecture: From Input to Classification</text>
  
  <!-- Input Image -->
  <g transform="translate(50, 80)">
    <!-- Image representation -->
    <rect width="80" height="80" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
    <rect width="80" height="80" fill="#e74c3c" opacity="0.8" transform="translate(-5, -5)"/>
    <rect width="80" height="80" fill="#e74c3c" opacity="0.6" transform="translate(-10, -10)"/>
    
    <!-- Labels -->
    <text x="40" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Input Image</text>
    <text x="40" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">256×256×3</text>
  </g>
  
  <!-- Arrow 1 -->
  <path d="M 160 120 L 200 120" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Convolution Layer 1 -->
  <g transform="translate(220, 70)">
    <!-- Multiple feature maps -->
    <rect width="60" height="60" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    <rect width="60" height="60" fill="#3498db" opacity="0.8" transform="translate(10, 0)"/>
    <rect width="60" height="60" fill="#3498db" opacity="0.6" transform="translate(20, 0)"/>
    <rect width="60" height="60" fill="#3498db" opacity="0.4" transform="translate(30, 0)"/>
    
    <!-- Filter representation -->
    <rect x="15" y="70" width="25" height="25" fill="#f39c12" stroke="#e67e22" stroke-width="1"/>
    <text x="27" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">3×3</text>
    
    <!-- Labels -->
    <text x="45" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Conv Layer</text>
    <text x="45" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">32 filters</text>
  </g>
  
  <!-- Arrow 2 -->
  <path d="M 320 120 L 360 120" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Pooling Layer -->
  <g transform="translate(380, 80)">
    <!-- Pooled feature maps -->
    <rect width="50" height="50" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
    <rect width="50" height="50" fill="#9b59b6" opacity="0.8" transform="translate(8, 0)"/>
    <rect width="50" height="50" fill="#9b59b6" opacity="0.6" transform="translate(16, 0)"/>
    
    <!-- Max pooling indicator -->
    <circle cx="25" cy="65" r="8" fill="#e74c3c"/>
    <text x="25" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white" font-weight="bold">MAX</text>
    
    <!-- Labels -->
    <text x="25" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">MaxPool</text>
    <text x="25" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">2×2</text>
  </g>
  
  <!-- Arrow 3 -->
  <path d="M 450 120 L 490 120" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Convolution Layer 2 -->
  <g transform="translate(510, 70)">
    <!-- More feature maps -->
    <rect width="55" height="55" fill="#27ae60" stroke="#229954" stroke-width="2"/>
    <rect width="55" height="55" fill="#27ae60" opacity="0.8" transform="translate(8, 0)"/>
    <rect width="55" height="55" fill="#27ae60" opacity="0.6" transform="translate(16, 0)"/>
    <rect width="55" height="55" fill="#27ae60" opacity="0.4" transform="translate(24, 0)"/>
    <rect width="55" height="55" fill="#27ae60" opacity="0.2" transform="translate(32, 0)"/>
    
    <!-- Labels -->
    <text x="40" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Conv Layer</text>
    <text x="40" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">64 filters</text>
  </g>
  
  <!-- Arrow 4 -->
  <path d="M 620 120 L 660 120" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Flattening -->
  <g transform="translate(680, 85)">
    <!-- Flattened representation -->
    <rect width="15" height="90" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
    <text x="7" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" transform="rotate(-90, 7, 105)">Flatten</text>
    <text x="7" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">Vector</text>
  </g>
  
  <!-- Arrow 5 -->
  <path d="M 720 120 L 760 120" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Fully Connected Layers -->
  <g transform="translate(780, 70)">
    <!-- Input layer -->
    <circle cx="20" cy="20" r="6" fill="#e74c3c"/>
    <circle cx="20" cy="40" r="6" fill="#e74c3c"/>
    <circle cx="20" cy="60" r="6" fill="#e74c3c"/>
    <circle cx="20" cy="80" r="6" fill="#e74c3c"/>
    <text x="20" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="8">...</text>
    
    <!-- Hidden layer -->
    <circle cx="70" cy="15" r="6" fill="#3498db"/>
    <circle cx="70" cy="35" r="6" fill="#3498db"/>
    <circle cx="70" cy="55" r="6" fill="#3498db"/>
    <circle cx="70" cy="75" r="6" fill="#3498db"/>
    
    <!-- Output layer -->
    <circle cx="120" cy="25" r="6" fill="#27ae60"/>
    <circle cx="120" cy="45" r="6" fill="#27ae60"/>
    <circle cx="120" cy="65" r="6" fill="#27ae60"/>
    
    <!-- Connections -->
    <line x1="26" y1="20" x2="64" y2="15" stroke="#7f8c8d" stroke-width="1"/>
    <line x1="26" y1="20" x2="64" y2="35" stroke="#7f8c8d" stroke-width="1"/>
    <line x1="26" y1="40" x2="64" y2="15" stroke="#7f8c8d" stroke-width="1"/>
    <line x1="26" y1="40" x2="64" y2="55" stroke="#7f8c8d" stroke-width="1"/>
    <line x1="76" y1="35" x2="114" y2="25" stroke="#7f8c8d" stroke-width="1"/>
    <line x1="76" y1="55" x2="114" y2="45" stroke="#7f8c8d" stroke-width="1"/>
    
    <!-- Labels -->
    <text x="70" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Fully Connected</text>
    <text x="70" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">Classification</text>
  </g>
  
  <!-- Arrow 6 -->
  <path d="M 930 120 L 970 120" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Output -->
  <g transform="translate(990, 80)">
    <!-- Probability bars -->
    <rect x="0" y="0" width="40" height="15" fill="#e74c3c"/>
    <text x="50" y="12" font-family="Arial, sans-serif" font-size="10">Cat: 0.8</text>
    
    <rect x="0" y="20" width="25" height="15" fill="#f39c12"/>
    <text x="50" y="32" font-family="Arial, sans-serif" font-size="10">Dog: 0.15</text>
    
    <rect x="0" y="40" width="10" height="15" fill="#3498db"/>
    <text x="50" y="52" font-family="Arial, sans-serif" font-size="10">Car: 0.05</text>
    
    <!-- Labels -->
    <text x="70" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Predictions</text>
  </g>
  
  <!-- Key concepts -->
  <g transform="translate(50, 220)">
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Key Concepts:</text>
    
    <circle cx="20" cy="45" r="8" fill="#3498db"/>
    <text x="35" y="50" font-family="Arial, sans-serif" font-size="12">Convolution: Local feature detection with shared parameters</text>
    
    <circle cx="20" cy="70" r="8" fill="#9b59b6"/>
    <text x="35" y="75" font-family="Arial, sans-serif" font-size="12">Pooling: Spatial dimension reduction and translation invariance</text>
    
    <circle cx="20" cy="95" r="8" fill="#e74c3c"/>
    <text x="35" y="100" font-family="Arial, sans-serif" font-size="12">Fully Connected: Final classification based on learned features</text>
    
    <!-- Parameter efficiency -->
    <rect x="0" y="120" width="700" height="80" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" rx="5"/>
    <text x="350" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Parameter Efficiency Comparison</text>
    
    <text x="20" y="165" font-family="Arial, sans-serif" font-size="12" fill="#e74c3c" font-weight="bold">Traditional Network: 256×256×3 → 1,000 units = 196,608,000 parameters</text>
    <text x="20" y="185" font-family="Arial, sans-serif" font-size="12" fill="#27ae60" font-weight="bold">CNN Network: Same task with ~50,000 parameters (99.97% reduction!)</text>
  </g>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
            refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e"/>
    </marker>
  </defs>
</svg>