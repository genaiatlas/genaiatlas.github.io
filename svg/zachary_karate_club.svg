<svg viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title-text { font-family: 'Arial', sans-serif; font-size: 26px; font-weight: bold; fill: #2c3e50; }
      .section-text { font-family: 'Arial', sans-serif; font-size: 18px; font-weight: bold; fill: #34495e; }
      .label-text { font-family: 'Arial', sans-serif; font-size: 14px; fill: #2c3e50; }
      .highlight-text { font-family: 'Arial', sans-serif; font-size: 16px; font-weight: bold; fill: #8e44ad; }
      .result-text { font-family: 'Arial', sans-serif; font-size: 18px; font-weight: bold; fill: #e74c3c; }
      .small-text { font-family: 'Arial', sans-serif; font-size: 11px; fill: #2c3e50; }
      .instructor-node { fill: #e74c3c; stroke: #c0392b; stroke-width: 3; }
      .admin-node { fill: #f39c12; stroke: #e67e22; stroke-width: 3; }
      .group1-node { fill: #3498db; stroke: #2980b9; stroke-width: 2; }
      .group2-node { fill: #2ecc71; stroke: #27ae60; stroke-width: 2; }
      .friendship-edge { stroke: #7f8c8d; stroke-width: 2; opacity: 0.7; }
      .strong-friendship { stroke: #2c3e50; stroke-width: 3; opacity: 0.8; }
      .predicted-boundary { stroke: #9b59b6; stroke-width: 4; stroke-dasharray: 15,10; fill: none; opacity: 0.8; }
      .actual-boundary { stroke: #e74c3c; stroke-width: 3; fill: none; }
      .success-box { fill: #d5f4e6; stroke: #27ae60; stroke-width: 2; }
      .timeline-box { fill: #fef9e7; stroke: #f39c12; stroke-width: 2; }
    </style>
  </defs>
  
  <!-- Title -->
  <text x="500" y="35" text-anchor="middle" class="title-text">Zachary's Karate Club: The Famous Validation</text>
  
  <!-- Timeline -->
  <rect x="50" y="60" width="900" height="70" class="timeline-box"/>
  <text x="500" y="80" text-anchor="middle" class="section-text">Timeline of Events</text>
  
  <!-- Timeline events -->
  <circle cx="150" cy="105" r="8" fill="#3498db"/>
  <text x="150" y="125" text-anchor="middle" class="small-text">1970</text>
  <text x="150" y="140" text-anchor="middle" class="small-text">Data Collection</text>
  
  <circle cx="350" cy="105" r="8" fill="#f39c12"/>
  <text x="350" y="125" text-anchor="middle" class="small-text">1972</text>
  <text x="350" y="140" text-anchor="middle" class="small-text">Dispute Begins</text>
  
  <circle cx="550" cy="105" r="8" fill="#e74c3c"/>
  <text x="550" y="125" text-anchor="middle" class="small-text">1973</text>
  <text x="550" y="140" text-anchor="middle" class="small-text">Club Splits</text>
  
  <circle cx="750" cy="105" r="8" fill="#9b59b6"/>
  <text x="750" y="125" text-anchor="middle" class="small-text">2003</text>
  <text x="750" y="140" text-anchor="middle" class="small-text">Modularity Analysis</text>
  
  <!-- Network Visualization -->
  <text x="300" y="180" text-anchor="middle" class="section-text">Original Network (1970-72)</text>
  
  <!-- Central nodes (instructor and administrator) -->
  <circle cx="250" cy="250" r="15" class="instructor-node"/>
  <circle cx="350" cy="250" r="15" class="admin-node"/>
  <text x="230" y="240" class="small-text">Mr. Hi</text>
  <text x="235" y="255" class="small-text">(Instructor)</text>
  <text x="330" y="240" class="small-text">John A.</text>
  <text x="325" y="255" class="small-text">(Administrator)</text>
  
  <!-- Group 1 members (around instructor) -->
  <circle cx="180" cy="200" r="8" class="group1-node"/>
  <circle cx="150" cy="250" r="8" class="group1-node"/>
  <circle cx="180" cy="300" r="8" class="group1-node"/>
  <circle cx="200" cy="320" r="8" class="group1-node"/>
  <circle cx="220" cy="180" r="8" class="group1-node"/>
  <circle cx="160" cy="180" r="8" class="group1-node"/>
  <circle cx="120" cy="230" r="8" class="group1-node"/>
  <circle cx="130" cy="280" r="8" class="group1-node"/>
  <circle cx="190" cy="350" r="8" class="group1-node"/>
  <circle cx="240" cy="340" r="8" class="group1-node"/>
  <circle cx="260" cy="320" r="8" class="group1-node"/>
  <circle cx="280" cy="290" r="8" class="group1-node"/>
  <circle cx="290" cy="210" r="8" class="group1-node"/>
  <circle cx="270" cy="180" r="8" class="group1-node"/>
  <circle cx="250" cy="160" r="8" class="group1-node"/>
  <circle cx="210" cy="160" r="8" class="group1-node"/>
  <circle cx="140" cy="320" r="8" class="group1-node"/>
  
  <!-- Group 2 members (around administrator) -->
  <circle cx="420" cy="200" r="8" class="group2-node"/>
  <circle cx="450" cy="250" r="8" class="group2-node"/>
  <circle cx="420" cy="300" r="8" class="group2-node"/>
  <circle cx="400" cy="320" r="8" class="group2-node"/>
  <circle cx="380" cy="180" r="8" class="group2-node"/>
  <circle cx="460" cy="180" r="8" class="group2-node"/>
  <circle cx="480" cy="230" r="8" class="group2-node"/>
  <circle cx="470" cy="280" r="8" class="group2-node"/>
  <circle cx="410" cy="350" r="8" class="group2-node"/>
  <circle cx="360" cy="340" r="8" class="group2-node"/>
  <circle cx="340" cy="320" r="8" class="group2-node"/>
  <circle cx="320" cy="290" r="8" class="group2-node"/>
  <circle cx="310" cy="210" r="8" class="group2-node"/>
  <circle cx="330" cy="180" r="8" class="group2-node"/>
  <circle cx="350" cy="160" r="8" class="group2-node"/>
  <circle cx="390" cy="160" r="8" class="group2-node"/>
  <circle cx="460" cy="320" r="8" class="group2-node"/>
  
  <!-- Key friendships -->
  <line x1="250" y1="250" x2="180" y2="200" class="strong-friendship"/>
  <line x1="250" y1="250" x2="150" y2="250" class="strong-friendship"/>
  <line x1="250" y1="250" x2="290" y2="210" class="strong-friendship"/>
  <line x1="350" y1="250" x2="420" y2="200" class="strong-friendship"/>
  <line x1="350" y1="250" x2="450" y2="250" class="strong-friendship"/>
  <line x1="350" y1="250" x2="380" y2="180" class="strong-friendship"/>
  
  <!-- Some inter-group connections -->
  <line x1="180" y1="200" x2="220" y2="180" class="friendship-edge"/>
  <line x1="420" y1="200" x2="460" y2="180" class="friendship-edge"/>
  <line x1="290" y1="210" x2="310" y2="210" class="friendship-edge"/>
  
  <!-- Few cross-group edges -->
  <line x1="250" y1="250" x2="350" y2="250" class="friendship-edge"/>
  <line x1="280" y1="290" x2="320" y2="290" class="friendship-edge"/>
  
  <!-- Modularity clustering prediction -->
  <ellipse cx="220" cy="250" rx="85" ry="110" class="predicted-boundary"/>
  <ellipse cx="380" cy="250" rx="85" ry="110" class="predicted-boundary"/>
  
  <text x="140" y="380" class="label-text">Predicted Community 1</text>
  <text x="440" y="380" class="label-text">Predicted Community 2</text>
  
  <!-- Results -->
  <text x="700" y="180" text-anchor="middle" class="section-text">Modularity Analysis Results</text>
  
  <rect x="550" y="200" width="300" height="200" class="success-box"/>
  
  <text x="700" y="225" text-anchor="middle" class="highlight-text">Algorithm Performance</text>
  
  <text x="570" y="250" class="label-text">• Network size: 34 nodes, 78 edges</text>
  <text x="570" y="270" class="label-text">• Modularity score: Q = 0.381</text>
  <text x="570" y="290" class="label-text">• Communities detected: 2</text>
  <text x="570" y="310" class="label-text">• Prediction accuracy: 100%</text>
  
  <text x="700" y="340" text-anchor="middle" class="result-text">Perfect Match!</text>
  <text x="570" y="365" class="label-text">Modularity clustering exactly predicted</text>
  <text x="570" y="380" class="label-text">the real-world split that occurred later</text>
  
  <!-- Actual Split Visualization -->
  <text x="300" y="450" text-anchor="middle" class="section-text">Actual Split (1973)</text>
  
  <!-- Two separate clubs -->
  <rect x="100" y="470" width="150" height="120" fill="none" stroke="#e74c3c" stroke-width="3"/>
  <text x="175" y="490" text-anchor="middle" class="highlight-text">Mr. Hi's Club</text>
  <circle cx="130" cy="520" r="6" class="group1-node"/>
  <circle cx="160" cy="520" r="6" class="group1-node"/>
  <circle cx="190" cy="520" r="6" class="group1-node"/>
  <circle cx="220" cy="520" r="6" class="group1-node"/>
  <circle cx="130" cy="550" r="6" class="group1-node"/>
  <circle cx="160" cy="550" r="6" class="group1-node"/>
  <circle cx="190" cy="550" r="6" class="group1-node"/>
  <circle cx="220" cy="550" r="6" class="group1-node"/>
  <text x="175" y="575" text-anchor="middle" class="small-text">17 members</text>
  
  <rect x="350" y="470" width="150" height="120" fill="none" stroke="#e74c3c" stroke-width="3"/>
  <text x="425" y="490" text-anchor="middle" class="highlight-text">John A.'s Club</text>
  <circle cx="380" cy="520" r="6" class="group2-node"/>
  <circle cx="410" cy="520" r="6" class="group2-node"/>
  <circle cx="440" cy="520" r="6" class="group2-node"/>
  <circle cx="470" cy="520" r="6" class="group2-node"/>
  <circle cx="380" cy="550" r="6" class="group2-node"/>
  <circle cx="410" cy="550" r="6" class="group2-node"/>
  <circle cx="440" cy="550" r="6" class="group2-node"/>
  <circle cx="470" cy="550" r="6" class="group2-node"/>
  <text x="425" y="575" text-anchor="middle" class="small-text">17 members</text>
  
  <!-- Why it worked -->
  <text x="700" y="450" text-anchor="middle" class="section-text">Why Modularity Worked</text>
  
  <rect x="550" y="470" width="300" height="160" fill="#f8f9fa" stroke="#34495e" stroke-width="1"/>
  <text x="570" y="495" class="label-text">✓ Clear community structure existed</text>
  <text x="570" y="515" class="label-text">✓ Dense internal friendships</text>
  <text x="570" y="535" class="label-text">✓ Sparse inter-group connections</text>
  <text x="570" y="555" class="label-text">✓ Leadership conflicts aligned with</text>
  <text x="575" y="570" class="label-text">   network structure</text>
  <text x="570" y="590" class="label-text">✓ Social dynamics matched</text>
  <text x="575" y="605" class="label-text">   mathematical prediction</text>
  
  <!-- Impact -->
  <rect x="100" y="650" width="800" height="70" fill="#e8f6f3" stroke="#27ae60" stroke-width="2"/>
  <text x="500" y="675" text-anchor="middle" class="section-text">Scientific Impact</text>
  <text x="500" y="700" text-anchor="middle" class="label-text">This study validated modularity clustering as a powerful tool for community detection</text>
  <text x="500" y="715" text-anchor="middle" class="label-text">and demonstrated that network structure can predict real-world social dynamics</text>
  
  <!-- Legend -->
  <rect x="50" y="740" width="200" height="50" fill="none" stroke="#34495e" stroke-width="1"/>
  <text x="150" y="755" text-anchor="middle" class="small-text">Legend</text>
  <circle cx="70" cy="770" r="5" class="instructor-node"/>
  <text x="85" y="775" class="small-text">Key leaders</text>
  <circle cx="70" cy="780" r="4" class="group1-node"/>
  <text x="85" y="785" class="small-text">Group 1</text>
  <circle cx="140" cy="780" r="4" class="group2-node"/>
  <text x="155" y="785" class="small-text">Group 2</text>
  
</svg>