<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="900" height="700" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">Forward and Backward Propagation</text>
  <text x="450" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">Information Flow in Neural Network Training</text>
  
  <!-- Dividing line -->
  <line x1="450" y1="70" x2="450" y2="650" stroke="#bdc3c7" stroke-width="2" stroke-dasharray="10,5"/>
  
  <!-- Forward Propagation Side -->
  <rect x="50" y="80" width="380" height="550" rx="15" fill="#e8f8fd" stroke="#3498db" stroke-width="3"/>
  <text x="240" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2980b9">Forward Propagation</text>
  <text x="240" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2980b9">Input to Hidden to Output</text>
  
  <!-- Forward Pass Network -->
  <!-- Input Layer -->
  <circle cx="120" cy="180" r="20" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <text x="120" y="186" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">x1</text>
  
  <circle cx="120" cy="230" r="20" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <text x="120" y="236" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">x2</text>
  
  <!-- Hidden Layer -->
  <circle cx="240" cy="180" r="20" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="240" y="186" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">h1</text>
  
  <circle cx="240" cy="230" r="20" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="240" y="236" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">h2</text>
  
  <circle cx="240" cy="280" r="20" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="240" y="286" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">h3</text>
  
  <!-- Output Layer -->
  <circle cx="360" cy="205" r="20" fill="#27ae60" stroke="#229954" stroke-width="2"/>
  <text x="360" y="211" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">y</text>
  
  <!-- Forward connections -->
  <g stroke="#3498db" stroke-width="2" marker-end="url(#forward-arrow)">
    <line x1="140" y1="180" x2="220" y2="180"/>
    <line x1="140" y1="180" x2="220" y2="230"/>
    <line x1="140" y1="180" x2="220" y2="280"/>
    <line x1="140" y1="230" x2="220" y2="180"/>
    <line x1="140" y1="230" x2="220" y2="230"/>
    <line x1="140" y1="230" x2="220" y2="280"/>
    
    <line x1="260" y1="180" x2="340" y2="205"/>
    <line x1="260" y1="230" x2="340" y2="205"/>
    <line x1="260" y1="280" x2="340" y2="205"/>
  </g>
  
  <!-- Forward Process Steps -->
  <rect x="70" y="320" width="340" height="280" rx="10" fill="#ffffff" stroke="#3498db" stroke-width="2"/>
  <text x="240" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Forward Pass Steps</text>
  
  <text x="90" y="370" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">Step 1: Linear Combination</text>
  <text x="90" y="385" font-family="Arial, sans-serif" font-size="10" fill="#34495e">z = W · a + b</text>
  
  <text x="90" y="410" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">Step 2: Activation</text>
  <text x="90" y="425" font-family="Arial, sans-serif" font-size="10" fill="#34495e">a = sigma(z)</text>
  
  <text x="90" y="450" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">Step 3: Loss Calculation</text>
  <text x="90" y="465" font-family="Arial, sans-serif" font-size="10" fill="#34495e">L = 0.5 * (y_pred - y_true)²</text>
  
  <text x="90" y="490" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">Example Computation:</text>
  <text x="90" y="510" font-family="Arial, sans-serif" font-size="9" fill="#34495e">z1 = w11*x1 + w12*x2 + b1</text>
  <text x="90" y="525" font-family="Arial, sans-serif" font-size="9" fill="#34495e">a1 = ReLU(z1)</text>
  <text x="90" y="540" font-family="Arial, sans-serif" font-size="9" fill="#34495e">y_pred = w21*a1 + w22*a2 + w23*a3 + b2</text>
  
  <rect x="90" y="555" width="300" height="35" rx="5" fill="#d5e8fc" stroke="#3498db" stroke-width="1"/>
  <text x="240" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#2c3e50">Forward: Data flows left to right</text>
  <text x="240" y="583" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">Prediction generation phase</text>
  
  <!-- Backward Propagation Side -->
  <rect x="470" y="80" width="380" height="550" rx="15" fill="#fef2e8" stroke="#f39c12" stroke-width="3"/>
  <text x="660" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#e67e22">Backward Propagation</text>
  <text x="660" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#e67e22">Output to Hidden to Input</text>
  
  <!-- Backward Pass Network -->
  <!-- Input Layer (for backward) -->
  <circle cx="540" cy="180" r="20" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <text x="540" y="186" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="white">dL/dx1</text>
  
  <circle cx="540" cy="230" r="20" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <text x="540" y="236" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="white">dL/dx2</text>
  
  <!-- Hidden Layer (for backward) -->
  <circle cx="660" cy="180" r="20" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
  <text x="660" y="186" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="white">dL/dh1</text>
  
  <circle cx="660" cy="230" r="20" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
  <text x="660" y="236" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="white">dL/dh2</text>
  
  <circle cx="660" cy="280" r="20" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
  <text x="660" y="286" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="white">dL/dh3</text>
  
  <!-- Output Layer (for backward) -->
  <circle cx="780" cy="205" r="20" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <text x="780" y="211" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="white">dL/dy</text>
  
  <!-- Backward connections -->
  <g stroke="#f39c12" stroke-width="2" marker-start="url(#backward-arrow)">
    <line x1="760" y1="205" x2="680" y2="180"/>
    <line x1="760" y1="205" x2="680" y2="230"/>
    <line x1="760" y1="205" x2="680" y2="280"/>
    
    <line x1="640" y1="180" x2="560" y2="180"/>
    <line x1="640" y1="180" x2="560" y2="230"/>
    <line x1="640" y1="230" x2="560" y2="180"/>
    <line x1="640" y1="230" x2="560" y2="230"/>
    <line x1="640" y1="280" x2="560" y2="180"/>
    <line x1="640" y1="280" x2="560" y2="230"/>
  </g>
  
  <!-- Backward Process Steps -->
  <rect x="490" y="320" width="340" height="280" rx="10" fill="#ffffff" stroke="#f39c12" stroke-width="2"/>
  <text x="660" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Backward Pass Steps</text>
  
  <text x="510" y="370" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">Step 1: Output Error</text>
  <text x="510" y="385" font-family="Arial, sans-serif" font-size="10" fill="#34495e">delta_out = (a_out - y) * sigma_prime(z_out)</text>
  
  <text x="510" y="410" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">Step 2: Hidden Errors</text>
  <text x="510" y="425" font-family="Arial, sans-serif" font-size="10" fill="#34495e">delta_h = W_T * delta_next * sigma_prime(z_h)</text>
  
  <text x="510" y="450" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">Step 3: Gradient Computation</text>
  <text x="510" y="465" font-family="Arial, sans-serif" font-size="10" fill="#34495e">dJ/dW = delta * a_prev_T</text>
  
  <text x="510" y="490" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">Step 4: Weight Update</text>
  <text x="510" y="505" font-family="Arial, sans-serif" font-size="10" fill="#34495e">W = W - alpha * dJ/dW</text>
  <text x="510" y="520" font-family="Arial, sans-serif" font-size="10" fill="#34495e">b = b - alpha * dJ/db</text>
  
  <rect x="510" y="540" width="300" height="45" rx="5" fill="#fce4b6" stroke="#f39c12" stroke-width="1"/>
  <text x="660" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#2c3e50">Backward: Gradients flow right to left</text>
  <text x="660" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">Parameter optimization phase</text>
  <text x="660" y="583" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">Chain rule enables gradient computation</text>
  
  <!-- Training Cycle -->
  <ellipse cx="450" cy="680" rx="150" ry="30" fill="none" stroke="#9b59b6" stroke-width="3" stroke-dasharray="15,5"/>
  <text x="450" y="675" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#8e44ad">Training Cycle</text>
  <text x="450" y="690" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#8e44ad">Forward - Loss - Backward - Update - Repeat</text>
  
  <!-- Gradient Flow Arrows -->
  <path d="M 430 160 Q 450 140 470 160" stroke="#9b59b6" stroke-width="3" fill="none" marker-end="url(#gradient-arrow)"/>
  <text x="450" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#8e44ad">Error Signal</text>
  
  <!-- Arrow marker definitions -->
  <defs>
    <marker id="forward-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3498db"/>
    </marker>
    <marker id="backward-arrow" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto">
      <polygon points="8 0, 0 3, 8 6" fill="#f39c12"/>
    </marker>
    <marker id="gradient-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#9b59b6"/>
    </marker>
  </defs>
</svg>