<svg viewBox="0 0 900 650" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="650" fill="#f8f9fa"/>
  <text x="450" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Re-Ranking Workflow
  </text>
  
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#666"/>
    </marker>
  </defs>
  
  <!-- Initial candidates -->
  <rect x="50" y="70" width="800" height="80" rx="8" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <text x="450" y="95" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Initial Retrieval (Fast)</text>
  <text x="450" y="115" font-size="11" text-anchor="middle" fill="white">Vector/BM25 search returns 100 candidates</text>
  <text x="450" y="135" font-size="10" text-anchor="middle" fill="white">Scores: [0.82, 0.79, 0.76, 0.74, 0.71... 0.51]</text>
  
  <!-- Arrow -->
  <line x1="450" y1="150" x2="450" y2="190" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="470" y="175" font-size="10" fill="#666">Top 20 selected</text>
  
  <!-- Re-ranker -->
  <rect x="150" y="190" width="600" height="120" rx="8" fill="#3498db" stroke="#2874a6" stroke-width="2"/>
  <text x="450" y="220" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Cross-Encoder Re-Ranker</text>
  <text x="450" y="240" font-size="11" text-anchor="middle" fill="white">Deep semantic analysis of query-document pairs</text>
  
  <!-- Processing boxes -->
  <g transform="translate(170, 255)">
    <rect x="0" y="0" width="110" height="40" rx="4" fill="white" fill-opacity="0.2"/>
    <text x="55" y="15" font-size="9" text-anchor="middle" fill="white">Pair 1</text>
    <text x="55" y="28" font-size="8" text-anchor="middle" fill="white">Query + Doc₁</text>
    <text x="55" y="37" font-size="8" font-weight="bold" text-anchor="middle" fill="white">0.94</text>
    
    <rect x="120" y="0" width="110" height="40" rx="4" fill="white" fill-opacity="0.2"/>
    <text x="175" y="15" font-size="9" text-anchor="middle" fill="white">Pair 2</text>
    <text x="175" y="28" font-size="8" text-anchor="middle" fill="white">Query + Doc₂</text>
    <text x="175" y="37" font-size="8" font-weight="bold" text-anchor="middle" fill="white">0.91</text>
    
    <rect x="240" y="0" width="110" height="40" rx="4" fill="white" fill-opacity="0.2"/>
    <text x="295" y="15" font-size="9" text-anchor="middle" fill="white">Pair 3</text>
    <text x="295" y="28" font-size="8" text-anchor="middle" fill="white">Query + Doc₃</text>
    <text x="295" y="37" font-size="8" font-weight="bold" text-anchor="middle" fill="white">0.88</text>
    
    <rect x="360" y="0" width="110" height="40" rx="4" fill="white" fill-opacity="0.2"/>
    <text x="415" y="15" font-size="9" text-anchor="middle" fill="white">... 17 more</text>
    <text x="415" y="28" font-size="8" text-anchor="middle" fill="white">pairs scored</text>
  </g>
  
  <!-- Arrow -->
  <line x1="450" y1="310" x2="450" y2="350" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Re-ranked results -->
  <rect x="50" y="350" width="800" height="100" rx="8" fill="#27ae60" stroke="#1e8449" stroke-width="2"/>
  <text x="450" y="375" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Re-Ranked Results (High Quality)</text>
  <text x="450" y="395" font-size="11" text-anchor="middle" fill="white">Top 10 documents re-ordered by relevance</text>
  <text x="450" y="415" font-size="10" text-anchor="middle" fill="white">New Scores: [0.94, 0.91, 0.88, 0.85, 0.82, 0.78, 0.75, 0.71, 0.68, 0.65]</text>
  <text x="450" y="435" font-size="9" text-anchor="middle" fill="white" font-style="italic">Document order changed significantly!</text>
  
  <!-- Comparison box -->
  <rect x="50" y="480" width="400" height="150" rx="8" fill="white" stroke="#ddd" stroke-width="2"/>
  <text x="250" y="510" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Before Re-Ranking</text>
  
  <g transform="translate(70, 525)">
    <text x="0" y="0" font-size="10" fill="#666">Rank 1: Doc 5 (0.82) ❌ Less relevant</text>
    <text x="0" y="18" font-size="10" fill="#666">Rank 2: Doc 12 (0.79)</text>
    <text x="0" y="36" font-size="10" fill="#666">Rank 3: Doc 3 (0.76)</text>
    <text x="0" y="54" font-size="10" fill="#666">Rank 4: Doc 18 (0.74)</text>
    <text x="0" y="72" font-size="10" fill="#666">Rank 5: Doc 1 (0.71) ✅ Most relevant</text>
    <text x="0" y="95" font-size="9" fill="#e74c3c" font-style="italic">Issue: Most relevant doc at rank 5!</text>
  </g>
  
  <!-- After re-ranking box -->
  <rect x="470" y="480" width="380" height="150" rx="8" fill="white" stroke="#ddd" stroke-width="2"/>
  <text x="660" y="510" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">After Re-Ranking</text>
  
  <g transform="translate(490, 525)">
    <text x="0" y="0" font-size="10" fill="#666">Rank 1: Doc 1 (0.94) ✅ Most relevant</text>
    <text x="0" y="18" font-size="10" fill="#666">Rank 2: Doc 3 (0.91)</text>
    <text x="0" y="36" font-size="10" fill="#666">Rank 3: Doc 18 (0.88)</text>
    <text x="0" y="54" font-size="10" fill="#666">Rank 4: Doc 7 (0.85)</text>
    <text x="0" y="72" font-size="10" fill="#666">Rank 5: Doc 12 (0.82)</text>
    <text x="0" y="95" font-size="9" fill="#27ae60" font-style="italic">✓ Best document now at rank 1!</text>
  </g>
  
  <!-- Arrow between boxes -->
  <line x1="450" y1="555" x2="470" y2="555" stroke="#3498db" stroke-width="3" marker-end="url(#arrow)"/>
</svg>