<svg viewBox="0 0 800 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="popGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#74b9ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0984e3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="treatmentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fd79a8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e84393;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="controlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00cec9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00b894;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="700" fill="#f8f9fa"/>
  
  <!-- Title -->
  <rect x="50" y="20" width="700" height="40" fill="url(#titleGrad)" rx="8"/>
  <text x="400" y="45" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold">
    HIP Study Design: Randomized Controlled Trial
  </text>
  
  <!-- Population Box -->
  <rect x="200" y="80" width="400" height="80" fill="url(#popGrad)" rx="10"/>
  <text x="400" y="105" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">
    Health Insurance Plan (HIP) New York
  </text>
  <text x="400" y="125" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14">
    ~700,000 enrolled members
  </text>
  <text x="400" y="145" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14">
    62,000 women (age 40-64) randomly selected
  </text>
  
  <!-- Randomization Arrow -->
  <polygon points="380,180 420,180 420,200 440,185 420,170 420,180" fill="#e17055"/>
  <text x="360" y="195" text-anchor="middle" fill="#e17055" font-family="Arial, sans-serif" font-size="12" font-weight="bold">
    RANDOM ASSIGNMENT
  </text>
  
  <!-- Equal Split -->
  <text x="400" y="220" text-anchor="middle" fill="#2d3436" font-family="Arial, sans-serif" font-size="14" font-weight="bold">
    Equal Random Assignment
  </text>
  
  <!-- Treatment Group -->
  <rect x="80" y="250" width="280" height="200" fill="url(#treatmentGrad)" rx="10"/>
  <text x="220" y="275" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">
    TREATMENT GROUP
  </text>
  <text x="220" y="295" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">
    31,000 women
  </text>
  
  <!-- Treatment Details -->
  <text x="220" y="320" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">
    Intervention:
  </text>
  <text x="220" y="340" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11">
    • Invited for mammography
  </text>
  <text x="220" y="355" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11">
    • 4 screening sessions per year
  </text>
  <text x="220" y="370" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11">
    • Clinical breast examination
  </text>
  <text x="220" y="385" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11">
    • Regular follow-up
  </text>
  
  <!-- Treatment Subgroups -->
  <text x="220" y="410" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">
    Actual Participation:
  </text>
  <text x="220" y="430" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11">
    20,200 screened | 10,800 refused
  </text>
  
  <!-- Control Group -->
  <rect x="440" y="250" width="280" height="200" fill="url(#controlGrad)" rx="10"/>
  <text x="580" y="275" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">
    CONTROL GROUP
  </text>
  <text x="580" y="295" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">
    31,000 women
  </text>
  
  <!-- Control Details -->
  <text x="580" y="320" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">
    Intervention:
  </text>
  <text x="580" y="340" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11">
    • Standard healthcare only
  </text>
  <text x="580" y="355" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11">
    • No mammography invitation
  </text>
  <text x="580" y="370" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11">
    • Continue usual care
  </text>
  <text x="580" y="385" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11">
    • Regular follow-up
  </text>
  
  <!-- Control Note -->
  <text x="580" y="410" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">
    Status Quo:
  </text>
  <text x="580" y="430" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11">
    No change to existing practices
  </text>
  
  <!-- Follow-up Period -->
  <rect x="150" y="480" width="500" height="60" fill="#fff3cd" stroke="#ffeaa7" stroke-width="2" rx="8"/>
  <text x="400" y="505" text-anchor="middle" fill="#6c5700" font-family="Arial, sans-serif" font-size="14" font-weight="bold">
    Follow-up Period: 5 Years (1963-1968)
  </text>
  <text x="400" y="525" text-anchor="middle" fill="#6c5700" font-family="Arial, sans-serif" font-size="12">
    Primary outcome: Breast cancer mortality in both groups
  </text>
  
  <!-- Key Design Principles -->
  <rect x="100" y="560" width="600" height="120" fill="#e8f4fd" stroke="#74b9ff" stroke-width="2" rx="8"/>
  <text x="400" y="585" text-anchor="middle" fill="#2d3436" font-family="Arial, sans-serif" font-size="16" font-weight="bold">
    Key Design Principles
  </text>
  
  <text x="200" y="610" text-anchor="middle" fill="#2d3436" font-family="Arial, sans-serif" font-size="12" font-weight="bold">
    ✓ Randomization
  </text>
  <text x="200" y="625" text-anchor="middle" fill="#2d3436" font-family="Arial, sans-serif" font-size="11">
    Eliminates selection bias
  </text>
  
  <text x="400" y="610" text-anchor="middle" fill="#2d3436" font-family="Arial, sans-serif" font-size="12" font-weight="bold">
    ✓ Control Group
  </text>
  <text x="400" y="625" text-anchor="middle" fill="#2d3436" font-family="Arial, sans-serif" font-size="11">
    Provides comparison baseline
  </text>
  
  <text x="600" y="610" text-anchor="middle" fill="#2d3436" font-family="Arial, sans-serif" font-size="12" font-weight="bold">
    ✓ Large Sample
  </text>
  <text x="600" y="625" text-anchor="middle" fill="#2d3436" font-family="Arial, sans-serif" font-size="11">
    Ensures statistical power
  </text>
  
  <text x="300" y="650" text-anchor="middle" fill="#2d3436" font-family="Arial, sans-serif" font-size="12" font-weight="bold">
    ✓ Intention-to-Treat
  </text>
  <text x="300" y="665" text-anchor="middle" fill="#2d3436" font-family="Arial, sans-serif" font-size="11">
    Compare entire assigned groups
  </text>
  
  <text x="500" y="650" text-anchor="middle" fill="#2d3436" font-family="Arial, sans-serif" font-size="12" font-weight="bold">
    ✓ Objective Outcome
  </text>
  <text x="500" y="665" text-anchor="middle" fill="#2d3436" font-family="Arial, sans-serif" font-size="11">
    Mortality (hard endpoint)
  </text>
</svg>