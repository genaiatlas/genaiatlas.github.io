<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="600" fill="#F9FAFB"/>
  
  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" font-size="28" font-weight="bold" fill="#1F2937">
    Matrix Completion for Recommendations
  </text>
  
  <!-- User-Item Matrix -->
  <g transform="translate(150, 100)">
    <!-- Matrix Background -->
    <rect x="0" y="0" width="400" height="300" fill="white" stroke="#E5E7EB" stroke-width="2" rx="5" filter="url(#shadow)"/>
    
    <!-- Grid Lines -->
    <g stroke="#E5E7EB" stroke-width="1">
      <line x1="100" y1="0" x2="100" y2="300"/>
      <line x1="200" y1="0" x2="200" y2="300"/>
      <line x1="300" y1="0" x2="300" y2="300"/>
      <line x1="0" y1="75" x2="400" y2="75"/>
      <line x1="0" y1="150" x2="400" y2="150"/>
      <line x1="0" y1="225" x2="400" y2="225"/>
    </g>
    
    <!-- Matrix Values -->
    <g font-size="24" text-anchor="middle" font-family="monospace">
      <!-- Row 1 -->
      <text x="50" y="45" fill="#10B981">5</text>
      <text x="150" y="45" fill="#6B7280">?</text>
      <text x="250" y="45" fill="#10B981">4</text>
      <text x="350" y="45" fill="#6B7280">?</text>
      
      <!-- Row 2 -->
      <text x="50" y="120" fill="#6B7280">?</text>
      <text x="150" y="120" fill="#10B981">3</text>
      <text x="250" y="120" fill="#6B7280">?</text>
      <text x="350" y="120" fill="#10B981">5</text>
      
      <!-- Row 3 -->
      <text x="50" y="195" fill="#10B981">2</text>
      <text x="150" y="195" fill="#6B7280">?</text>
      <text x="250" y="195" fill="#6B7280">?</text>
      <text x="350" y="195" fill="#10B981">4</text>
      
      <!-- Row 4 -->
      <text x="50" y="270" fill="#6B7280">?</text>
      <text x="150" y="270" fill="#10B981">4</text>
      <text x="250" y="270" fill="#10B981">3</text>
      <text x="350" y="270" fill="#6B7280">?</text>
    </g>
    
    <!-- Labels -->
    <text x="-30" y="40" text-anchor="middle" font-size="14" fill="#4B5563">User 1</text>
    <text x="-30" y="115" text-anchor="middle" font-size="14" fill="#4B5563">User 2</text>
    <text x="-30" y="190" text-anchor="middle" font-size="14" fill="#4B5563">User 3</text>
    <text x="-30" y="265" text-anchor="middle" font-size="14" fill="#4B5563">User 4</text>
    
    <text x="50" y="-15" text-anchor="middle" font-size="14" fill="#4B5563">Item 1</text>
    <text x="150" y="-15" text-anchor="middle" font-size="14" fill="#4B5563">Item 2</text>
    <text x="250" y="-15" text-anchor="middle" font-size="14" fill="#4B5563">Item 3</text>
    <text x="350" y="-15" text-anchor="middle" font-size="14" fill="#4B5563">Item 4</text>
  </g>
  
  <!-- Arrow -->
  <g transform="translate(580, 220)">
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
        <polygon points="0 0, 10 3, 0 6" fill="#4F46E5"/>
      </marker>
    </defs>
    <line x1="0" y1="30" x2="80" y2="30" stroke="#4F46E5" stroke-width="3" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- Completed Matrix -->
  <g transform="translate(700, 100)">
    <rect x="0" y="0" width="200" height="300" fill="white" stroke="#4F46E5" stroke-width="2" rx="5" filter="url(#shadow)"/>
    
    <!-- Grid Lines -->
    <g stroke="#E5E7EB" stroke-width="1">
      <line x1="50" y1="0" x2="50" y2="300"/>
      <line x1="100" y1="0" x2="100" y2="300"/>
      <line x1="150" y1="0" x2="150" y2="300"/>
      <line x1="0" y1="75" x2="200" y2="75"/>
      <line x1="0" y1="150" x2="200" y2="150"/>
      <line x1="0" y1="225" x2="200" y2="225"/>
    </g>
    
    <!-- Completed Values -->
    <g font-size="14" text-anchor="middle" font-family="monospace">
      <!-- All cells filled -->
      <text x="25" y="45" fill="#10B981">5</text>
      <text x="75" y="45" fill="#EF4444">3.2</text>
      <text x="125" y="45" fill="#10B981">4</text>
      <text x="175" y="45" fill="#EF4444">4.5</text>
      
      <text x="25" y="120" fill="#EF4444">2.8</text>
      <text x="75" y="120" fill="#10B981">3</text>
      <text x="125" y="120" fill="#EF4444">3.7</text>
      <text x="175" y="120" fill="#10B981">5</text>
      
      <text x="25" y="195" fill="#10B981">2</text>
      <text x="75" y="195" fill="#EF4444">2.5</text>
      <text x="125" y="195" fill="#EF4444">3.1</text>
      <text x="175" y="195" fill="#10B981">4</text>
      
      <text x="25" y="270" fill="#EF4444">4.2</text>
      <text x="75" y="270" fill="#10B981">4</text>
      <text x="125" y="270" fill="#10B981">3</text>
      <text x="175" y="270" fill="#EF4444">3.8</text>
    </g>
    
    <text x="100" y="-15" text-anchor="middle" font-size="16" font-weight="bold" fill="#4F46E5">
      Predicted Values
    </text>
  </g>
  
  <!-- Statistics Box -->
  <g transform="translate(150, 430)">
    <rect x="0" y="0" width="700" height="120" fill="url(#grad1)" rx="8" filter="url(#shadow)"/>
    <text x="350" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="white">
      Key Statistics
    </text>
    <text x="120" y="65" font-size="16" fill="white">• Known entries: ~0.01-6% of matrix</text>
    <text x="120" y="90" font-size="16" fill="white">• Prediction task: Fill missing ~94-99.99% values</text>
    <text x="450" y="65" font-size="16" fill="white">• Low-rank assumption</text>
    <text x="450" y="90" font-size="16" fill="white">• Collaborative filtering patterns</text>
  </g>
</svg>