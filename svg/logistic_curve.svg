<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gridGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#00000020"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#gridGradient)"/>
  
  <!-- Grid lines -->
  <defs>
    <pattern id="grid" width="50" height="40" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 40" fill="none" stroke="#dee2e6" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)" opacity="0.8"/>
  
  <!-- Axes -->
  <line x1="100" y1="50" x2="100" y2="450" stroke="#495057" stroke-width="2"/>
  <line x1="100" y1="350" x2="700" y2="350" stroke="#495057" stroke-width="2"/>
  
  <!-- Axis labels -->
  <text x="400" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#212529">X (Predictor Variable)</text>
  <text x="25" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#212529" transform="rotate(-90, 25, 250)">P(Y=1|X)</text>
  
  <!-- X-axis tick marks and labels -->
  <g font-family="Arial, sans-serif" font-size="12" fill="#495057">
    <line x1="200" y1="345" x2="200" y2="355" stroke="#495057" stroke-width="1"/>
    <text x="200" y="370" text-anchor="middle">-4</text>
    
    <line x1="300" y1="345" x2="300" y2="355" stroke="#495057" stroke-width="1"/>
    <text x="300" y="370" text-anchor="middle">-2</text>
    
    <line x1="400" y1="345" x2="400" y2="355" stroke="#495057" stroke-width="1"/>
    <text x="400" y="370" text-anchor="middle">0</text>
    
    <line x1="500" y1="345" x2="500" y2="355" stroke="#495057" stroke-width="1"/>
    <text x="500" y="370" text-anchor="middle">2</text>
    
    <line x1="600" y1="345" x2="600" y2="355" stroke="#495057" stroke-width="1"/>
    <text x="600" y="370" text-anchor="middle">4</text>
  </g>
  
  <!-- Y-axis tick marks and labels -->
  <g font-family="Arial, sans-serif" font-size="12" fill="#495057">
    <line x1="95" y1="350" x2="105" y2="350" stroke="#495057" stroke-width="1"/>
    <text x="85" y="355" text-anchor="end">0.0</text>
    
    <line x1="95" y1="290" x2="105" y2="290" stroke="#495057" stroke-width="1"/>
    <text x="85" y="295" text-anchor="end">0.2</text>
    
    <line x1="95" y1="230" x2="105" y2="230" stroke="#495057" stroke-width="1"/>
    <text x="85" y="235" text-anchor="end">0.4</text>
    
    <line x1="95" y1="170" x2="105" y2="170" stroke="#495057" stroke-width="1"/>
    <text x="85" y="175" text-anchor="end">0.6</text>
    
    <line x1="95" y1="110" x2="105" y2="110" stroke="#495057" stroke-width="1"/>
    <text x="85" y="115" text-anchor="end">0.8</text>
    
    <line x1="95" y1="50" x2="105" y2="50" stroke="#495057" stroke-width="1"/>
    <text x="85" y="55" text-anchor="end">1.0</text>
  </g>
  
  <!-- Logistic curve -->
  <path d="M 100,349.9 
           C 120,349.8 140,349.6 160,349.2
           C 180,348.4 200,346.8 220,344.0
           C 240,339.6 260,333.2 280,324.0
           C 300,312.0 320,296.4 340,276.8
           C 360,254.4 380,228.8 400,200.0
           C 420,171.2 440,145.6 460,123.2
           C 480,103.6 500,88.0 520,76.0
           C 540,66.8 560,60.4 580,56.0
           C 600,53.2 620,51.6 640,50.8
           C 660,50.4 680,50.2 700,50.1" 
           fill="none" stroke="#0d6efd" stroke-width="4" filter="url(#shadow)"/>
  
  <!-- Horizontal reference lines -->
  <line x1="100" y1="50" x2="700" y2="50" stroke="#dc3545" stroke-width="1" stroke-dasharray="5,5" opacity="0.7"/>
  <line x1="100" y1="200" x2="700" y2="200" stroke="#28a745" stroke-width="1" stroke-dasharray="5,5" opacity="0.7"/>
  <line x1="100" y1="350" x2="700" y2="350" stroke="#dc3545" stroke-width="1" stroke-dasharray="5,5" opacity="0.7"/>
  
  <!-- Reference line labels -->
  <text x="710" y="55" font-family="Arial, sans-serif" font-size="12" fill="#dc3545" font-weight="bold">P = 1.0</text>
  <text x="710" y="205" font-family="Arial, sans-serif" font-size="12" fill="#28a745" font-weight="bold">P = 0.5</text>
  <text x="710" y="355" font-family="Arial, sans-serif" font-size="12" fill="#dc3545" font-weight="bold">P = 0.0</text>
  
  <!-- Key points -->
  <circle cx="400" cy="200" r="6" fill="#fd7e14" stroke="white" stroke-width="2"/>
  <text x="415" y="195" font-family="Arial, sans-serif" font-size="12" fill="#fd7e14" font-weight="bold">Inflection Point</text>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#212529">Logistic Function: P(Y=1|X) = e^(β₀ + βX) / (1 + e^(β₀ + βX))</text>
  
  <!-- Formula box -->
  <rect x="520" y="80" width="260" height="140" fill="white" stroke="#6c757d" stroke-width="1" rx="8" opacity="0.95" filter="url(#shadow)"/>
  <text x="650" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#212529">Key Properties:</text>
  <text x="530" y="130" font-family="Arial, sans-serif" font-size="12" fill="#495057">• Output range: [0, 1]</text>
  <text x="530" y="145" font-family="Arial, sans-serif" font-size="12" fill="#495057">• S-shaped (sigmoid) curve</text>
  <text x="530" y="160" font-family="Arial, sans-serif" font-size="12" fill="#495057">• Smooth and differentiable</text>
  <text x="530" y="175" font-family="Arial, sans-serif" font-size="12" fill="#495057">• Monotonically increasing</text>
  <text x="530" y="190" font-family="Arial, sans-serif" font-size="12" fill="#495057">• Symmetric around P = 0.5</text>
  <text x="530" y="205" font-family="Arial, sans-serif" font-size="12" fill="#495057">• Asymptotes at 0 and 1</text>
</svg>