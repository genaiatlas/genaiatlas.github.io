<svg width="900" height="650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title-text { font-family: 'Arial', sans-serif; font-size: 18px; font-weight: bold; text-anchor: middle; fill: #34495e; }
      .section-title { font-family: 'Arial', sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; fill: #2c3e50; }
      .node-text { font-family: 'Arial', sans-serif; font-size: 10px; text-anchor: middle; fill: white; }
      .value-text { font-family: 'Arial', sans-serif; font-size: 11px; text-anchor: middle; fill: #2c3e50; }
      .formula-text { font-family: 'Arial', sans-serif; font-size: 14px; text-anchor: middle; fill: #2c3e50; }
      .label-text { font-family: 'Arial', sans-serif; font-size: 10px; text-anchor: start; fill: #7f8c8d; }
      .bootstrap-text { font-family: 'Arial', sans-serif; font-size: 9px; text-anchor: middle; fill: #2c3e50; }
    </style>
    
    <!-- Arrow marker -->
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" 
       refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c" />
      </marker>
    </defs>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="650" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="450" y="30" class="title-text">Random Forest: Bootstrap Aggregation (Bagging)</text>
  
  <!-- Original Dataset -->
  <text x="150" y="65" class="section-title">Original Dataset</text>
  <rect x="50" y="80" width="200" height="100" fill="#3498db" stroke="#2980b9" stroke-width="2" rx="5"/>
  
  <!-- Data points in original dataset -->
  <circle cx="80" cy="105" r="4" fill="#e74c3c"/>
  <circle cx="110" cy="105" r="4" fill="#27ae60"/>
  <circle cx="140" cy="105" r="4" fill="#f39c12"/>
  <circle cx="170" cy="105" r="4" fill="#9b59b6"/>
  <circle cx="200" cy="105" r="4" fill="#1abc9c"/>
  <circle cx="220" cy="105" r="4" fill="#e67e22"/>
  
  <circle cx="80" cy="125" r="4" fill="#34495e"/>
  <circle cx="110" cy="125" r="4" fill="#e74c3c"/>
  <circle cx="140" cy="125" r="4" fill="#27ae60"/>
  <circle cx="170" cy="125" r="4" fill="#f39c12"/>
  <circle cx="200" cy="125" r="4" fill="#9b59b6"/>
  <circle cx="220" cy="125" r="4" fill="#1abc9c"/>
  
  <circle cx="80" cy="145" r="4" fill="#e67e22"/>
  <circle cx="110" cy="145" r="4" fill="#34495e"/>
  <circle cx="140" cy="145" r="4" fill="#e74c3c"/>
  <circle cx="170" cy="145" r="4" fill="#27ae60"/>
  <circle cx="200" cy="145" r="4" fill="#f39c12"/>
  <circle cx="220" cy="145" r="4" fill="#9b59b6"/>
  
  <text x="150" y="170" class="value-text">n = 12,697 observations</text>
  
  <!-- Bootstrap Arrow -->
  <line x1="270" y1="130" x2="320" y2="130" stroke="#e74c3c" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="295" y="120" class="bootstrap-text">Bootstrap</text>
  <text x="295" y="145" class="bootstrap-text">Sampling</text>
  
  <!-- Bootstrap Samples -->
  <text x="450" y="65" class="section-title">Bootstrap Samples</text>
  
  <!-- Sample 1 - improved spacing -->
  <rect x="340" y="90" width="85" height="65" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" rx="3"/>
  <text x="382" y="85" class="bootstrap-text">Sample 1</text>
  <circle cx="355" cy="108" r="3" fill="#e74c3c"/>
  <circle cx="370" cy="108" r="3" fill="#e74c3c"/>
  <circle cx="385" cy="108" r="3" fill="#27ae60"/>
  <circle cx="400" cy="108" r="3" fill="#f39c12"/>
  <circle cx="415" cy="108" r="3" fill="#9b59b6"/>
  <circle cx="355" cy="123" r="3" fill="#27ae60"/>
  <circle cx="370" cy="123" r="3" fill="#e74c3c"/>
  <circle cx="385" cy="123" r="3" fill="#1abc9c"/>
  <circle cx="400" cy="123" r="3" fill="#f39c12"/>
  <circle cx="415" cy="123" r="3" fill="#9b59b6"/>
  <circle cx="355" cy="138" r="3" fill="#e67e22"/>
  <circle cx="370" cy="138" r="3" fill="#34495e"/>
  <circle cx="385" cy="138" r="3" fill="#e74c3c"/>
  <circle cx="400" cy="138" r="3" fill="#27ae60"/>
  <circle cx="415" cy="138" r="3" fill="#f39c12"/>
  
  <!-- Sample 2 -->
  <rect x="445" y="90" width="85" height="65" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" rx="3"/>
  <text x="487" y="85" class="bootstrap-text">Sample 2</text>
  <circle cx="460" cy="108" r="3" fill="#27ae60"/>
  <circle cx="475" cy="108" r="3" fill="#f39c12"/>
  <circle cx="490" cy="108" r="3" fill="#1abc9c"/>
  <circle cx="505" cy="108" r="3" fill="#e67e22"/>
  <circle cx="520" cy="108" r="3" fill="#34495e"/>
  <circle cx="460" cy="123" r="3" fill="#f39c12"/>
  <circle cx="475" cy="123" r="3" fill="#27ae60"/>
  <circle cx="490" cy="123" r="3" fill="#9b59b6"/>
  <circle cx="505" cy="123" r="3" fill="#1abc9c"/>
  <circle cx="520" cy="123" r="3" fill="#e74c3c"/>
  <circle cx="460" cy="138" r="3" fill="#27ae60"/>
  <circle cx="475" cy="138" r="3" fill="#f39c12"/>
  <circle cx="490" cy="138" r="3" fill="#9b59b6"/>
  <circle cx="505" cy="138" r="3" fill="#e67e22"/>
  <circle cx="520" cy="138" r="3" fill="#34495e"/>
  
  <!-- Sample 3 (dots) -->
  <text x="570" y="125" class="value-text">...</text>
  
  <!-- Sample B -->
  <rect x="600" y="90" width="85" height="65" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" rx="3"/>
  <text x="642" y="85" class="bootstrap-text">Sample B</text>
  <circle cx="615" cy="108" r="3" fill="#9b59b6"/>
  <circle cx="630" cy="108" r="3" fill="#e67e22"/>
  <circle cx="645" cy="108" r="3" fill="#34495e"/>
  <circle cx="660" cy="108" r="3" fill="#e74c3c"/>
  <circle cx="675" cy="108" r="3" fill="#1abc9c"/>
  <circle cx="615" cy="123" r="3" fill="#9b59b6"/>
  <circle cx="630" cy="123" r="3" fill="#f39c12"/>
  <circle cx="645" cy="123" r="3" fill="#27ae60"/>
  <circle cx="660" cy="123" r="3" fill="#e67e22"/>
  <circle cx="675" cy="123" r="3" fill="#34495e"/>
  <circle cx="615" cy="138" r="3" fill="#1abc9c"/>
  <circle cx="630" cy="138" r="3" fill="#9b59b6"/>
  <circle cx="645" cy="138" r="3" fill="#f39c12"/>
  <circle cx="660" cy="138" r="3" fill="#27ae60"/>
  <circle cx="675" cy="138" r="3" fill="#e74c3c"/>
  
  <!-- Tree Training Arrow -->
  <line x1="450" y1="170" x2="450" y2="200" stroke="#e74c3c" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="470" y="185" class="bootstrap-text">Train Deep Trees</text>
  
  <!-- Individual Trees -->
  <text x="450" y="230" class="section-title">Individual Decision Trees</text>
  
  <!-- Tree 1 -->
  <g transform="translate(300, 250)">
    <rect x="25" y="0" width="50" height="20" rx="3" fill="#3498db" stroke="#2980b9" stroke-width="1"/>
    <text x="50" y="13" class="node-text" font-size="8px">Split 1</text>
    
    <circle cx="30" cy="35" r="10" fill="#27ae60" stroke="#229954" stroke-width="1"/>
    <text x="30" y="40" class="node-text" font-size="8px">18</text>
    
    <circle cx="70" cy="35" r="10" fill="#27ae60" stroke="#229954" stroke-width="1"/>
    <text x="70" y="40" class="node-text" font-size="8px">23</text>
    
    <line x1="40" y1="20" x2="32" y2="25" stroke="#34495e" stroke-width="1"/>
    <line x1="60" y1="20" x2="68" y2="25" stroke="#34495e" stroke-width="1"/>
    
    <text x="50" y="60" class="bootstrap-text">Tree 1</text>
    <text x="50" y="75" class="bootstrap-text">ĝ₁(Z)</text>
  </g>
  
  <!-- Tree 2 -->
  <g transform="translate(420, 250)">
    <rect x="25" y="0" width="50" height="20" rx="3" fill="#3498db" stroke="#2980b9" stroke-width="1"/>
    <text x="50" y="13" class="node-text" font-size="8px">Split 2</text>
    
    <circle cx="30" cy="35" r="10" fill="#27ae60" stroke="#229954" stroke-width="1"/>
    <text x="30" y="40" class="node-text" font-size="8px">16</text>
    
    <circle cx="70" cy="35" r="10" fill="#27ae60" stroke="#229954" stroke-width="1"/>
    <text x="70" y="40" class="node-text" font-size="8px">26</text>
    
    <line x1="40" y1="20" x2="32" y2="25" stroke="#34495e" stroke-width="1"/>
    <line x1="60" y1="20" x2="68" y2="25" stroke="#34495e" stroke-width="1"/>
    
    <text x="50" y="60" class="bootstrap-text">Tree 2</text>
    <text x="50" y="75" class="bootstrap-text">ĝ₂(Z)</text>
  </g>
  
  <!-- Dots -->
  <text x="530" y="290" class="value-text">...</text>
  
  <!-- Tree B -->
  <g transform="translate(560, 250)">
    <rect x="25" y="0" width="50" height="20" rx="3" fill="#3498db" stroke="#2980b9" stroke-width="1"/>
    <text x="50" y="13" class="node-text" font-size="8px">Split B</text>
    
    <circle cx="30" cy="35" r="10" fill="#27ae60" stroke="#229954" stroke-width="1"/>
    <text x="30" y="40" class="node-text" font-size="8px">19</text>
    
    <circle cx="70" cy="35" r="10" fill="#27ae60" stroke="#229954" stroke-width="1"/>
    <text x="70" y="40" class="node-text" font-size="8px">22</text>
    
    <line x1="40" y1="20" x2="32" y2="25" stroke="#34495e" stroke-width="1"/>
    <line x1="60" y1="20" x2="68" y2="25" stroke="#34495e" stroke-width="1"/>
    
    <text x="50" y="60" class="bootstrap-text">Tree B</text>
    <text x="50" y="75" class="bootstrap-text">ĝ_B(Z)</text>
  </g>
  
  <!-- Aggregation Arrow -->
  <line x1="450" y1="340" x2="450" y2="370" stroke="#e74c3c" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="480" y="355" class="bootstrap-text">Average Predictions</text>
  
  <!-- Final Prediction -->
  <rect x="350" y="380" width="200" height="60" fill="#2ecc71" stroke="#27ae60" stroke-width="3" rx="5"/>
  <text x="450" y="400" class="section-title">Random Forest Prediction</text>
  <text x="450" y="420" class="formula-text">ĝ_RF(Z) = (1/B) Σ ĝ_b(Z)</text>
  
  <!-- Mathematical Formula Box -->
  <rect x="50" y="460" width="800" height="80" fill="#e8f4f8" stroke="#5dade2" stroke-width="2" rx="5"/>
  <text x="450" y="485" class="section-title">Bootstrap Aggregation Formula</text>
  
  <text x="450" y="510" class="formula-text">ĝ_random_forest(Z) = (1/B) Σ_{b=1}^B ĝ_b(Z)</text>
  <text x="450" y="530" class="value-text">where each ĝ_b(Z) is trained on bootstrap sample b</text>
  
  <!-- Advantages Box -->
  <rect x="50" y="560" width="400" height="80" fill="#d4edda" stroke="#28a745" stroke-width="2" rx="5"/>
  <text x="250" y="580" class="section-title">Random Forest Advantages</text>
  
  <text x="60" y="600" class="label-text">• Reduces overfitting through averaging</text>
  <text x="60" y="615" class="label-text">• Handles high-dimensional data well</text>
  <text x="60" y="630" class="label-text">• Provides feature importance measures</text>
  
  <!-- Key Properties Box -->
  <rect x="470" y="560" width="380" height="80" fill="#fff3cd" stroke="#ffc107" stroke-width="2" rx="5"/>
  <text x="660" y="580" class="section-title">Key Properties</text>
  
  <text x="480" y="600" class="label-text">• Trees grown deep (low bias, high variance)</text>
  <text x="480" y="615" class="label-text">• Bootstrap sampling creates diversity</text>
  <text x="480" y="630" class="label-text">• Averaging reduces variance significantly</text>
  
</svg>