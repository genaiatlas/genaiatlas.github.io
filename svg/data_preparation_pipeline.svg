<svg viewBox="0 0 800 650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'Arial', sans-serif; font-size: 24px; font-weight: bold; fill: #2c3e50; }
      .step-title { font-family: 'Arial', sans-serif; font-size: 13px; font-weight: bold; fill: white; }
      .step-desc { font-family: 'Arial', sans-serif; font-size: 10px; fill: white; }
      .section-title { font-family: 'Arial', sans-serif; font-size: 16px; font-weight: bold; fill: #2c3e50; }
      .arrow { stroke: #34495e; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .pipeline-flow { stroke: #3498db; stroke-width: 4; fill: none; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" class="title">Data Preparation Pipeline</text>
  
  <!-- Raw Data Input -->
  <rect x="50" y="80" width="120" height="70" rx="10" fill="#95a5a6"/>
  <text x="110" y="105" text-anchor="middle" class="step-title">Raw Data</text>
  <text x="110" y="125" text-anchor="middle" class="step-desc">• Missing values</text>
  <text x="110" y="138" text-anchor="middle" class="step-desc">• Inconsistent formats</text>
  
  <!-- Data Cleaning -->
  <rect x="220" y="80" width="130" height="70" rx="10" fill="#e74c3c"/>
  <text x="285" y="100" text-anchor="middle" class="step-title">Data Cleaning</text>
  <text x="285" y="120" text-anchor="middle" class="step-desc">• Handle missing values</text>
  <text x="285" y="133" text-anchor="middle" class="step-desc">• Remove duplicates</text>
  <text x="285" y="146" text-anchor="middle" class="step-desc">• Fix inconsistencies</text>
  
  <!-- Data Transformation -->
  <rect x="400" y="80" width="130" height="70" rx="10" fill="#f39c12"/>
  <text x="465" y="100" text-anchor="middle" class="step-title">Data Transformation</text>
  <text x="465" y="120" text-anchor="middle" class="step-desc">• Normalize/standardize</text>
  <text x="465" y="133" text-anchor="middle" class="step-desc">• Encode categories</text>
  <text x="465" y="146" text-anchor="middle" class="step-desc">• Handle outliers</text>
  
  <!-- Feature Engineering -->
  <rect x="580" y="80" width="130" height="70" rx="10" fill="#9b59b6"/>
  <text x="645" y="100" text-anchor="middle" class="step-title">Feature Engineering</text>
  <text x="645" y="120" text-anchor="middle" class="step-desc">• Create new features</text>
  <text x="645" y="133" text-anchor="middle" class="step-desc">• Feature selection</text>
  <text x="645" y="146" text-anchor="middle" class="step-desc">• Dimensionality reduction</text>
  
  <!-- Pipeline Flow Arrows -->
  <path d="M 170 115 L 210 115" class="arrow"/>
  <path d="M 350 115 L 390 115" class="arrow"/>
  <path d="M 530 115 L 570 115" class="arrow"/>
  
  <!-- Data Splitting -->
  <rect x="320" y="220" width="160" height="70" rx="10" fill="#2ecc71"/>
  <text x="400" y="245" text-anchor="middle" class="step-title">Data Splitting</text>
  <text x="400" y="265" text-anchor="middle" class="step-desc">Split into train/validation/test sets</text>
  <text x="400" y="278" text-anchor="middle" class="step-desc">Maintain temporal order if relevant</text>
  
  <!-- Arrow from Feature Engineering to Data Splitting -->
  <path d="M 645 150 Q 645 185 480 220" class="arrow"/>
  
  <!-- Split Outputs -->
  <rect x="100" y="350" width="120" height="60" rx="8" fill="#3498db"/>
  <text x="160" y="375" text-anchor="middle" class="step-title">Training Set</text>
  <text x="160" y="395" text-anchor="middle" class="step-desc">60-70% of data</text>
  
  <rect x="250" y="350" width="120" height="60" rx="8" fill="#3498db"/>
  <text x="310" y="375" text-anchor="middle" class="step-title">Validation Set</text>
  <text x="310" y="395" text-anchor="middle" class="step-desc">15-20% of data</text>
  
  <rect x="400" y="350" width="120" height="60" rx="8" fill="#3498db"/>
  <text x="460" y="375" text-anchor="middle" class="step-title">Test Set</text>
  <text x="460" y="395" text-anchor="middle" class="step-desc">15-20% of data</text>
  
  <!-- Arrows to split outputs -->
  <path d="M 360 290 L 220 350" class="arrow"/>
  <path d="M 400 290 L 310 350" class="arrow"/>
  <path d="M 440 290 L 460 350" class="arrow"/>
  
  <!-- Common Cleaning Techniques -->
  <text x="50" y="480" class="section-title">Common Data Cleaning Techniques</text>
  
  <!-- Missing Values Box -->
  <rect x="50" y="500" width="200" height="80" rx="5" fill="#ecf0f1" stroke="#bdc3c7"/>
  <text x="150" y="520" text-anchor="middle" style="font-family: Arial; font-size: 12px; font-weight: bold; fill: #2c3e50;">Missing Values</text>
  <text x="150" y="535" text-anchor="middle" style="font-family: Arial; font-size: 10px; fill: #7f8c8d;">• Remove rows/columns</text>
  <text x="150" y="548" text-anchor="middle" style="font-family: Arial; font-size: 10px; fill: #7f8c8d;">• Mean/median imputation</text>
  <text x="150" y="561" text-anchor="middle" style="font-family: Arial; font-size: 10px; fill: #7f8c8d;">• Forward/backward fill</text>
  <text x="150" y="574" text-anchor="middle" style="font-family: Arial; font-size: 10px; fill: #7f8c8d;">• Advanced imputation</text>
  
  <!-- Outliers Box -->
  <rect x="270" y="500" width="200" height="80" rx="5" fill="#ecf0f1" stroke="#bdc3c7"/>
  <text x="370" y="520" text-anchor="middle" style="font-family: Arial; font-size: 12px; font-weight: bold; fill: #2c3e50;">Outlier Handling</text>
  <text x="370" y="535" text-anchor="middle" style="font-family: Arial; font-size: 10px; fill: #7f8c8d;">• Statistical detection (IQR, Z-score)</text>
  <text x="370" y="548" text-anchor="middle" style="font-family: Arial; font-size: 10px; fill: #7f8c8d;">• Visual identification</text>
  <text x="370" y="561" text-anchor="middle" style="font-family: Arial; font-size: 10px; fill: #7f8c8d;">• Remove or transform</text>
  <text x="370" y="574" text-anchor="middle" style="font-family: Arial; font-size: 10px; fill: #7f8c8d;">• Business validation</text>
  
  <!-- Feature Engineering Box -->
  <rect x="490" y="500" width="200" height="80" rx="5" fill="#ecf0f1" stroke="#bdc3c7"/>
  <text x="590" y="520" text-anchor="middle" style="font-family: Arial; font-size: 12px; font-weight: bold; fill: #2c3e50;">Feature Engineering</text>
  <text x="590" y="535" text-anchor="middle" style="font-family: Arial; font-size: 10px; fill: #7f8c8d;">• Create derived features</text>
  <text x="590" y="548" text-anchor="middle" style="font-family: Arial; font-size: 10px; fill: #7f8c8d;">• Polynomial features</text>
  <text x="590" y="561" text-anchor="middle" style="font-family: Arial; font-size: 10px; fill: #7f8c8d;">• Interaction terms</text>
  <text x="590" y="574" text-anchor="middle" style="font-family: Arial; font-size: 10px; fill: #7f8c8d;">• Domain knowledge</text>
  
  <!-- Best Practices -->
  <text x="50" y="620" style="font-family: Arial; font-size: 14px; font-weight: bold; fill: #2c3e50;">Best Practices:</text>
  <text x="180" y="620" style="font-family: Arial; font-size: 12px; fill: #2c3e50;">• Document all transformations</text>
  <text x="350" y="620" style="font-family: Arial; font-size: 12px; fill: #2c3e50;">• Preserve original data</text>
  <text x="480" y="620" style="font-family: Arial; font-size: 12px; fill: #2c3e50;">• Validate each step</text>
  <text x="580" y="620" style="font-family: Arial; font-size: 12px; fill: #2c3e50;">• Automate pipeline</text>
</svg>