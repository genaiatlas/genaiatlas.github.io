<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="discreteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="continuousGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="35" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Probability Distributions: Discrete vs Continuous
  </text>
  
  <!-- Discrete Distribution -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="350" height="240" rx="10" fill="#ffffff" stroke="#3498db" stroke-width="2" filter="url(#shadow)"/>
    
    <text x="175" y="30" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#2980b9">
      Discrete Distribution (PMF)
    </text>
    
    <text x="175" y="50" font-family="Arial" font-size="12" text-anchor="middle" fill="#7f8c8d">
      Probability Mass Function
    </text>
    
    <!-- Bar Chart -->
    <g transform="translate(30, 80)">
      <!-- Axes -->
      <line x1="20" y1="120" x2="300" y2="120" stroke="#333" stroke-width="2"/>
      <line x1="20" y1="120" x2="20" y2="20" stroke="#333" stroke-width="2"/>
      
      <!-- Bars -->
      <rect x="50" y="80" width="30" height="40" fill="url(#discreteGrad)"/>
      <rect x="100" y="60" width="30" height="60" fill="url(#discreteGrad)"/>
      <rect x="150" y="40" width="30" height="80" fill="url(#discreteGrad)"/>
      <rect x="200" y="60" width="30" height="60" fill="url(#discreteGrad)"/>
      <rect x="250" y="80" width="30" height="40" fill="url(#discreteGrad)"/>
      
      <!-- Labels -->
      <text x="65" y="135" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">1</text>
      <text x="115" y="135" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">2</text>
      <text x="165" y="135" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">3</text>
      <text x="215" y="135" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">4</text>
      <text x="265" y="135" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">5</text>
      
      <!-- Y-axis label -->
      <text x="10" y="15" font-family="Arial" font-size="11" text-anchor="middle" fill="#666">P(X)</text>
      <text x="150" y="155" font-family="Arial" font-size="11" text-anchor="middle" fill="#666">X</text>
    </g>
    
    <!-- Properties -->
    <g transform="translate(20, 210)">
      <text x="0" y="0" font-family="Arial" font-size="13" font-weight="bold" fill="#2c3e50">Properties:</text>
      <text x="10" y="20" font-family="Arial" font-size="11" fill="#555">• P(X = x) ≥ 0 for all x</text>
      <text x="10" y="35" font-family="Arial" font-size="11" fill="#555">• Σ P(X = x) = 1</text>
      <text x="10" y="50" font-family="Arial" font-size="11" fill="#555">• Countable outcomes</text>
      
      <text x="180" y="0" font-family="Arial" font-size="13" font-weight="bold" fill="#2c3e50">Examples:</text>
      <text x="190" y="20" font-family="Arial" font-size="11" fill="#555">• Coin flips</text>
      <text x="190" y="35" font-family="Arial" font-size="11" fill="#555">• Die rolls</text>
      <text x="190" y="50" font-family="Arial" font-size="11" fill="#555">• Count data</text>
    </g>
  </g>
  
  <!-- Continuous Distribution -->
  <g transform="translate(420, 80)">
    <rect x="0" y="0" width="350" height="240" rx="10" fill="#ffffff" stroke="#e74c3c" stroke-width="2" filter="url(#shadow)"/>
    
    <text x="175" y="30" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#c0392b">
      Continuous Distribution (PDF)
    </text>
    
    <text x="175" y="50" font-family="Arial" font-size="12" text-anchor="middle" fill="#7f8c8d">
      Probability Density Function
    </text>
    
    <!-- Normal Distribution Curve -->
    <g transform="translate(30, 80)">
      <!-- Axes -->
      <line x1="20" y1="120" x2="300" y2="120" stroke="#333" stroke-width="2"/>
      <line x1="20" y1="120" x2="20" y2="20" stroke="#333" stroke-width="2"/>
      
      <!-- Bell Curve Path -->
      <path d="M 30 115 Q 60 110, 90 95 T 150 40 T 210 95 Q 240 110, 270 115"
            fill="none" stroke="#e74c3c" stroke-width="3"/>
      
      <!-- Area under curve -->
      <path d="M 30 120 L 30 115 Q 60 110, 90 95 T 150 40 T 210 95 Q 240 110, 270 115 L 270 120 Z"
            fill="url(#continuousGrad)" fill-opacity="0.3"/>
      
      <!-- Mean line -->
      <line x1="150" y1="40" x2="150" y2="120" stroke="#e74c3c" stroke-width="1" stroke-dasharray="5,5" opacity="0.7"/>
      
      <!-- Labels -->
      <text x="150" y="135" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">μ</text>
      <text x="90" y="135" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">μ-σ</text>
      <text x="210" y="135" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">μ+σ</text>
      
      <!-- Y-axis label -->
      <text x="10" y="15" font-family="Arial" font-size="11" text-anchor="middle" fill="#666">f(x)</text>
      <text x="150" y="155" font-family="Arial" font-size="11" text-anchor="middle" fill="#666">X</text>
    </g>
    
    <!-- Properties -->
    <g transform="translate(20, 210)">
      <text x="0" y="0" font-family="Arial" font-size="13" font-weight="bold" fill="#2c3e50">Properties:</text>
      <text x="10" y="20" font-family="Arial" font-size="11" fill="#555">• f(x) ≥ 0 for all x</text>
      <text x="10" y="35" font-family="Arial" font-size="11" fill="#555">• ∫ f(x)dx = 1</text>
      <text x="10" y="50" font-family="Arial" font-size="11" fill="#555">• Uncountable outcomes</text>
      
      <text x="180" y="0" font-family="Arial" font-size="13" font-weight="bold" fill="#2c3e50">Examples:</text>
      <text x="190" y="20" font-family="Arial" font-size="11" fill="#555">• Height, weight</text>
      <text x="190" y="35" font-family="Arial" font-size="11" fill="#555">• Temperature</text>
      <text x="190" y="50" font-family="Arial" font-size="11" fill="#555">• Time measurements</text>
    </g>
  </g>
  
  <!-- Joint & Conditional Distributions -->
  <g transform="translate(50, 350)">
    <rect x="0" y="0" width="700" height="220" rx="10" fill="#ffffff" stroke="#9b59b6" stroke-width="2" filter="url(#shadow)"/>
    
    <text x="350" y="30" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#8e44ad">
      Joint &amp; Conditional Distributions
    </text>
    
    <!-- Joint Distribution -->
    <g transform="translate(30, 50)">
      <text x="0" y="0" font-family="Arial" font-size="16" font-weight="bold" fill="#2c3e50">
        Joint Distribution
      </text>
      <text x="0" y="20" font-family="Arial" font-size="12" fill="#555">
        P(X, Y) - Simultaneous behavior
      </text>
      
      <!-- 2D Heatmap representation -->
      <g transform="translate(0, 30)">
        <rect x="0" y="0" width="40" height="40" fill="#ecf0f1"/>
        <rect x="40" y="0" width="40" height="40" fill="#bdc3c7"/>
        <rect x="80" y="0" width="40" height="40" fill="#95a5a6"/>
        
        <rect x="0" y="40" width="40" height="40" fill="#bdc3c7"/>
        <rect x="40" y="40" width="40" height="40" fill="#7f8c8d"/>
        <rect x="80" y="40" width="40" height="40" fill="#bdc3c7"/>
        
        <rect x="0" y="80" width="40" height="40" fill="#95a5a6"/>
        <rect x="40" y="80" width="40" height="40" fill="#bdc3c7"/>
        <rect x="80" y="80" width="40" height="40" fill="#ecf0f1"/>
        
        <text x="60" y="-10" font-family="Arial" font-size="11" text-anchor="middle" fill="#666">Y</text>
        <text x="-20" y="60" font-family="Arial" font-size="11" text-anchor="middle" fill="#666">X</text>
      </g>
    </g>
    
    <!-- Conditional Distribution -->
    <g transform="translate(250, 50)">
      <text x="0" y="0" font-family="Arial" font-size="16" font-weight="bold" fill="#2c3e50">
        Conditional Distribution (CPD)
      </text>
      <text x="0" y="20" font-family="Arial" font-size="12" fill="#555">
        P(Z|X,Y) - Distribution given conditions
      </text>
      
      <!-- Student Grade Example Table -->
      <g transform="translate(0, 35)">
        <rect x="0" y="0" width="400" height="100" fill="#f9f9f9" stroke="#ddd" stroke-width="1"/>
        
        <!-- Headers -->
        <rect x="0" y="0" width="100" height="25" fill="#ecf0f1"/>
        <text x="50" y="17" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#2c3e50">
          Intelligence
        </text>
        
        <rect x="100" y="0" width="100" height="25" fill="#ecf0f1"/>
        <text x="150" y="17" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#2c3e50">
          Difficulty
        </text>
        
        <rect x="200" y="0" width="200" height="25" fill="#ecf0f1"/>
        <text x="300" y="17" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#2c3e50">
          P(Grade | I, D)
        </text>
        
        <!-- Example rows -->
        <text x="50" y="45" font-family="Arial" font-size="10" text-anchor="middle" fill="#555">High (I₁)</text>
        <text x="150" y="45" font-family="Arial" font-size="10" text-anchor="middle" fill="#555">Easy (D₀)</text>
        <text x="300" y="45" font-family="Arial" font-size="10" text-anchor="middle" fill="#555">
          G₁:0.7  G₂:0.2  G₃:0.1
        </text>
        
        <text x="50" y="65" font-family="Arial" font-size="10" text-anchor="middle" fill="#555">High (I₁)</text>
        <text x="150" y="65" font-family="Arial" font-size="10" text-anchor="middle" fill="#555">Hard (D₁)</text>
        <text x="300" y="65" font-family="Arial" font-size="10" text-anchor="middle" fill="#555">
          G₁:0.4  G₂:0.4  G₃:0.2
        </text>
        
        <text x="50" y="85" font-family="Arial" font-size="10" text-anchor="middle" fill="#555">Low (I₀)</text>
        <text x="150" y="85" font-family="Arial" font-size="10" text-anchor="middle" fill="#555">Easy (D₀)</text>
        <text x="300" y="85" font-family="Arial" font-size="10" text-anchor="middle" fill="#555">
          G₁:0.2  G₂:0.3  G₃:0.5
        </text>
      </g>
    </g>
  </g>
</svg>