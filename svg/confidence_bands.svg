<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">
    Confidence Bands Around Regression Line
  </text>
  
  <!-- Plot area -->
  <rect x="100" y="80" width="500" height="350" fill="white" stroke="#ddd" stroke-width="1"/>
  
  <!-- Axes -->
  <line x1="100" y1="430" x2="600" y2="430" stroke="#333" stroke-width="2"/>
  <line x1="100" y1="80" x2="100" y2="430" stroke="#333" stroke-width="2"/>
  
  <!-- X-axis labels -->
  <text x="150" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">X₁</text>
  <text x="250" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">X₂</text>
  <text x="350" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">X₃</text>
  <text x="450" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">X₄</text>
  <text x="550" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">X₅</text>
  
  <!-- Y-axis label -->
  <text x="85" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666" transform="rotate(-90, 85, 255)">Y</text>
  
  <!-- Scatter points -->
  <circle cx="130" cy="380" r="3" fill="#1976d2" opacity="0.6"/>
  <circle cx="145" cy="370" r="3" fill="#1976d2" opacity="0.6"/>
  <circle cx="160" cy="350" r="3" fill="#1976d2" opacity="0.6"/>
  <circle cx="180" cy="340" r="3" fill="#1976d2" opacity="0.6"/>
  <circle cx="200" cy="320" r="3" fill="#1976d2" opacity="0.6"/>
  <circle cx="220" cy="310" r="3" fill="#1976d2" opacity="0.6"/>
  <circle cx="240" cy="300" r="3" fill="#1976d2" opacity="0.6"/>
  <circle cx="270" cy="280" r="3" fill="#1976d2" opacity="0.6"/>
  <circle cx="300" cy="260" r="3" fill="#1976d2" opacity="0.6"/>
  <circle cx="320" cy="250" r="3" fill="#1976d2" opacity="0.6"/>
  <circle cx="350" cy="240" r="3" fill="#1976d2" opacity="0.6"/>
  <circle cx="380" cy="220" r="3" fill="#1976d2" opacity="0.6"/>
  <circle cx="420" cy="200" r="3" fill="#1976d2" opacity="0.6"/>
  <circle cx="450" cy="180" r="3" fill="#1976d2" opacity="0.6"/>
  <circle cx="480" cy="160" r="3" fill="#1976d2" opacity="0.6"/>
  <circle cx="520" cy="140" r="3" fill="#1976d2" opacity="0.6"/>
  <circle cx="550" cy="120" r="3" fill="#1976d2" opacity="0.6"/>
  
  <!-- True regression line (unknown) -->
  <line x1="120" y1="390" x2="580" y2="110" stroke="#d32f2f" stroke-width="2" stroke-dasharray="5,5" opacity="0.7"/>
  
  <!-- Estimated regression line -->
  <line x1="120" y1="385" x2="580" y2="115" stroke="#2e7d32" stroke-width="3"/>
  
  <!-- Confidence band (upper) -->
  <path d="M 120 365 Q 200 300 350 220 Q 450 160 580 95" stroke="#7b1fa2" stroke-width="2" fill="none"/>
  
  <!-- Confidence band (lower) -->
  <path d="M 120 405 Q 200 340 350 260 Q 450 200 580 135" stroke="#7b1fa2" stroke-width="2" fill="none"/>
  
  <!-- Confidence band fill -->
  <path d="M 120 365 Q 200 300 350 220 Q 450 160 580 95 L 580 135 Q 450 200 350 260 Q 200 340 120 405 Z" fill="#7b1fa2" opacity="0.2"/>
  
  <!-- Confidence interval indicators -->
  <line x1="350" y1="220" x2="350" y2="260" stroke="#7b1fa2" stroke-width="2"/>
  <line x1="345" y1="220" x2="355" y2="220" stroke="#7b1fa2" stroke-width="2"/>
  <line x1="345" y1="260" x2="355" y2="260" stroke="#7b1fa2" stroke-width="2"/>
  
  <!-- Legend -->
  <rect x="630" y="100" width="150" height="140" fill="white" stroke="#ddd" stroke-width="1" rx="5"/>
  <text x="705" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Legend</text>
  
  <!-- Data points -->
  <circle cx="645" cy="140" r="3" fill="#1976d2" opacity="0.6"/>
  <text x="660" y="145" font-family="Arial, sans-serif" font-size="10" fill="#333">Data points</text>
  
  <!-- True line -->
  <line x1="645" y1="160" x2="660" y2="160" stroke="#d32f2f" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="665" y="165" font-family="Arial, sans-serif" font-size="10" fill="#333">True line (θ*)</text>
  
  <!-- Estimated line -->
  <line x1="645" y1="180" x2="660" y2="180" stroke="#2e7d32" stroke-width="2"/>
  <text x="665" y="185" font-family="Arial, sans-serif" font-size="10" fill="#333">Estimated line (θ̂)</text>
  
  <!-- Confidence band -->
  <rect x="645" y="195" width="15" height="8" fill="#7b1fa2" opacity="0.2" stroke="#7b1fa2" stroke-width="1"/>
  <text x="665" y="205" font-family="Arial, sans-serif" font-size="10" fill="#333">95% Confidence</text>
  <text x="665" y="217" font-family="Arial, sans-serif" font-size="10" fill="#333">Band</text>
  
  <!-- Key insights box -->
  <rect x="100" y="460" width="500" height="100" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="10"/>
  <text x="350" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1976d2">
    Key Properties of Confidence Bands
  </text>
  <text x="120" y="510" font-family="Arial, sans-serif" font-size="12" fill="#333">
    • Band width varies with X (narrower in center, wider at extremes)
  </text>
  <text x="120" y="530" font-family="Arial, sans-serif" font-size="12" fill="#333">
    • Shows uncertainty about the true regression line θ*ᵀX
  </text>
  <text x="120" y="550" font-family="Arial, sans-serif" font-size="12" fill="#333">
    • Individual prediction intervals would be wider (include σ² noise)
  </text>
  
  <!-- Width annotation -->
  <text x="355" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7b1fa2">
    CI width
  </text>
</svg>