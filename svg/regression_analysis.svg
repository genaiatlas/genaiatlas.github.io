<svg width="1200" height="675" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="675" fill="#f8f9fa"/>
  
  <!-- Fast Track Ribbon -->
  <polygon points="1050,0 1200,0 1200,150" fill="#e74c3c"/>
  <text x="1125" y="75" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" transform="rotate(45 1125 75)">FAST TRACK</text>
  
  <!-- Title -->
  <text x="600" y="50" fill="#2c3e50" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle">Regression Analysis in Python</text>
  
  <!-- Regression Types -->
  <rect x="50" y="100" width="270" height="100" fill="#3498db" stroke="#2c3e50" stroke-width="2" rx="10"/>
  <text x="185" y="130" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Linear Regression</text>
  <text x="185" y="150" fill="white" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">sklearn.LinearRegression</text>
  <text x="185" y="170" fill="white" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Simple relationships</text>
  <text x="185" y="190" fill="white" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">y = mx + b</text>
  
  <rect x="340" y="100" width="270" height="100" fill="#27ae60" stroke="#2c3e50" stroke-width="2" rx="10"/>
  <text x="475" y="130" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Ridge Regression</text>
  <text x="475" y="150" fill="white" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">sklearn.Ridge</text>
  <text x="475" y="170" fill="white" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">L2 regularization</text>
  <text x="475" y="190" fill="white" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Multicollinearity</text>
  
  <rect x="630" y="100" width="270" height="100" fill="#f39c12" stroke="#2c3e50" stroke-width="2" rx="10"/>
  <text x="765" y="130" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Lasso Regression</text>
  <text x="765" y="150" fill="white" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">sklearn.Lasso</text>
  <text x="765" y="170" fill="white" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">L1 regularization</text>
  <text x="765" y="190" fill="white" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Feature selection</text>
  
  <rect x="920" y="100" width="270" height="100" fill="#9b59b6" stroke="#2c3e50" stroke-width="2" rx="10"/>
  <text x="1055" y="130" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">OLS Regression</text>
  <text x="1055" y="150" fill="white" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">statsmodels.OLS</text>
  <text x="1055" y="170" fill="white" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Statistical inference</text>
  <text x="1055" y="190" fill="white" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">p-values, CI</text>
  
  <!-- Workflow -->
  <text x="100" y="250" fill="#2c3e50" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Regression Workflow:</text>
  
  <rect x="50" y="270" width="180" height="60" fill="#ecf0f1" stroke="#34495e" stroke-width="1" rx="5"/>
  <text x="140" y="290" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">1. Data Prep</text>
  <text x="140" y="310" fill="#7f8c8d" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Clean, scale, split</text>
  
  <rect x="250" y="270" width="180" height="60" fill="#ecf0f1" stroke="#34495e" stroke-width="1" rx="5"/>
  <text x="340" y="290" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">2. Fit Model</text>
  <text x="340" y="310" fill="#7f8c8d" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">model.fit(X, y)</text>
  
  <rect x="450" y="270" width="180" height="60" fill="#ecf0f1" stroke="#34495e" stroke-width="1" rx="5"/>
  <text x="540" y="290" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">3. Predict</text>
  <text x="540" y="310" fill="#7f8c8d" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">model.predict(X)</text>
  
  <rect x="650" y="270" width="180" height="60" fill="#ecf0f1" stroke="#34495e" stroke-width="1" rx="5"/>
  <text x="740" y="290" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">4. Evaluate</text>
  <text x="740" y="310" fill="#7f8c8d" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">R², RMSE, MAE</text>
  
  <rect x="850" y="270" width="180" height="60" fill="#ecf0f1" stroke="#34495e" stroke-width="1" rx="5"/>
  <text x="940" y="290" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">5. Diagnose</text>
  <text x="940" y="310" fill="#7f8c8d" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Residual plots</text>
  
  <!-- Arrows -->
  <path d="M 230 300 L 250 300" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 430 300 L 450 300" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 630 300 L 650 300" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 830 300 L 850 300" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Code Example -->
  <rect x="50" y="360" width="1100" height="160" fill="#2c3e50" stroke="#34495e" stroke-width="2" rx="5"/>
  <text x="70" y="390" fill="#f39c12" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Example Code:</text>
  <text x="70" y="420" fill="#ecf0f1" font-family="monospace" font-size="14">from sklearn.linear_model import LinearRegression</text>
  <text x="70" y="440" fill="#ecf0f1" font-family="monospace" font-size="14">from sklearn.metrics import r2_score, mean_squared_error</text>
  <text x="70" y="460" fill="#ecf0f1" font-family="monospace" font-size="14">model = LinearRegression()</text>
  <text x="70" y="480" fill="#ecf0f1" font-family="monospace" font-size="14">model.fit(X_train, y_train)</text>
  <text x="70" y="500" fill="#ecf0f1" font-family="monospace" font-size="14">predictions = model.predict(X_test)</text>
  
  <!-- Model Comparison -->
  <rect x="50" y="550" width="350" height="100" fill="#e8f8f5" stroke="#27ae60" stroke-width="2" rx="5"/>
  <text x="70" y="580" fill="#27ae60" font-family="Arial, sans-serif" font-size="16" font-weight="bold">sklearn vs statsmodels:</text>
  <text x="70" y="600" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12">• sklearn: ML focus, prediction</text>
  <text x="70" y="620" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12">• statsmodels: Statistics focus</text>
  <text x="70" y="640" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12">• Use statsmodels for inference</text>
  
  <!-- Evaluation Metrics -->
  <rect x="420" y="550" width="350" height="100" fill="#fef9e7" stroke="#f39c12" stroke-width="2" rx="5"/>
  <text x="440" y="580" fill="#f39c12" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Evaluation Metrics:</text>
  <text x="440" y="600" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12">• R² (coefficient of determination)</text>
  <text x="440" y="620" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12">• RMSE (root mean square error)</text>
  <text x="440" y="640" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12">• MAE (mean absolute error)</text>
  
  <!-- Diagnostics -->
  <rect x="790" y="550" width="360" height="100" fill="#fdedec" stroke="#e74c3c" stroke-width="2" rx="5"/>
  <text x="810" y="580" fill="#e74c3c" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Diagnostics:</text>
  <text x="810" y="600" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12">• Residual vs fitted plots</text>
  <text x="810" y="620" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12">• Q-Q plots for normality</text>
  <text x="810" y="640" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12">• Cook's distance for outliers</text>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/>
    </marker>
  </defs>
</svg>