<svg viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1400" height="900" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="700" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Metadata Enrichment for Enhanced Retrieval
  </text>
  <text x="700" y="70" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#495057">
    Adding Context and Structure to Document Chunks
  </text>
  
  <!-- Raw Document Input -->
  <rect x="50" y="110" width="200" height="100" rx="10" fill="#e9ecef" stroke="#495057" stroke-width="2"/>
  <text x="150" y="145" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    📄 Raw Document
  </text>
  <text x="150" y="170" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#495057">
    Text content only
  </text>
  <text x="150" y="190" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#868e96">
    No structure
  </text>
  
  <!-- Arrow -->
  <path d="M 250 160 L 340 160" stroke="#495057" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Metadata Enrichment Process -->
  <rect x="340" y="110" width="720" height="670" rx="15" fill="#d0ebff" stroke="#1c7ed6" stroke-width="4"/>
  <text x="700" y="150" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Metadata Enrichment Pipeline
  </text>
  
  <!-- 1. Structural Metadata -->
  <g id="structural">
    <rect x="370" y="180" width="320" height="140" rx="10" fill="#fff" stroke="#1c7ed6" stroke-width="2"/>
    <text x="530" y="210" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      1️⃣ Structural Metadata
    </text>
    <text x="390" y="240" font-family="Arial, sans-serif" font-size="13" fill="#495057">
      • Document ID &amp; Source
    </text>
    <text x="390" y="262" font-family="Arial, sans-serif" font-size="13" fill="#495057">
      • Section/Chapter numbers
    </text>
    <text x="390" y="284" font-family="Arial, sans-serif" font-size="13" fill="#495057">
      • Page numbers &amp; positions
    </text>
    <text x="390" y="306" font-family="Arial, sans-serif" font-size="13" fill="#495057">
      • Hierarchy levels
    </text>
  </g>
  
  <!-- 2. Temporal Metadata -->
  <g id="temporal">
    <rect x="710" y="180" width="320" height="140" rx="10" fill="#fff" stroke="#1c7ed6" stroke-width="2"/>
    <text x="870" y="210" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      2️⃣ Temporal Metadata
    </text>
    <text x="730" y="240" font-family="Arial, sans-serif" font-size="13" fill="#495057">
      • Creation date/time
    </text>
    <text x="730" y="262" font-family="Arial, sans-serif" font-size="13" fill="#495057">
      • Last modified date
    </text>
    <text x="730" y="284" font-family="Arial, sans-serif" font-size="13" fill="#495057">
      • Version information
    </text>
    <text x="730" y="306" font-family="Arial, sans-serif" font-size="13" fill="#495057">
      • Temporal relevance
    </text>
  </g>
  
  <!-- 3. Semantic Metadata -->
  <g id="semantic">
    <rect x="370" y="340" width="320" height="160" rx="10" fill="#fff" stroke="#1c7ed6" stroke-width="2"/>
    <text x="530" y="370" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      3️⃣ Semantic Metadata
    </text>
    <text x="390" y="400" font-family="Arial, sans-serif" font-size="13" fill="#495057">
      • Keywords extraction
    </text>
    <text x="390" y="422" font-family="Arial, sans-serif" font-size="13" fill="#495057">
      • Topic classification
    </text>
    <text x="390" y="444" font-family="Arial, sans-serif" font-size="13" fill="#495057">
      • Entity recognition (NER)
    </text>
    <text x="390" y="466" font-family="Arial, sans-serif" font-size="13" fill="#495057">
      • Concept extraction
    </text>
    <text x="390" y="488" font-family="Arial, sans-serif" font-size="13" fill="#495057">
      • Summary generation
    </text>
  </g>
  
  <!-- 4. Statistical Metadata -->
  <g id="statistical">
    <rect x="710" y="340" width="320" height="160" rx="10" fill="#fff" stroke="#1c7ed6" stroke-width="2"/>
    <text x="870" y="370" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      4️⃣ Statistical Metadata
    </text>
    <text x="730" y="400" font-family="Arial, sans-serif" font-size="13" fill="#495057">
      • Word/character count
    </text>
    <text x="730" y="422" font-family="Arial, sans-serif" font-size="13" fill="#495057">
      • Reading time estimate
    </text>
    <text x="730" y="444" font-family="Arial, sans-serif" font-size="13" fill="#495057">
      • Complexity scores
    </text>
    <text x="730" y="466" font-family="Arial, sans-serif" font-size="13" fill="#495057">
      • Token counts
    </text>
    <text x="730" y="488" font-family="Arial, sans-serif" font-size="13" fill="#495057">
      • Density metrics
    </text>
  </g>
  
  <!-- 5. Relational Metadata -->
  <g id="relational">
    <rect x="370" y="520" width="320" height="140" rx="10" fill="#fff" stroke="#1c7ed6" stroke-width="2"/>
    <text x="530" y="550" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      5️⃣ Relational Metadata
    </text>
    <text x="390" y="580" font-family="Arial, sans-serif" font-size="13" fill="#495057">
      • Parent document links
    </text>
    <text x="390" y="602" font-family="Arial, sans-serif" font-size="13" fill="#495057">
      • Related chunks
    </text>
    <text x="390" y="624" font-family="Arial, sans-serif" font-size="13" fill="#495057">
      • Cross-references
    </text>
    <text x="390" y="646" font-family="Arial, sans-serif" font-size="13" fill="#495057">
      • Citation networks
    </text>
  </g>
  
  <!-- 6. Quality Metadata -->
  <g id="quality">
    <rect x="710" y="520" width="320" height="140" rx="10" fill="#fff" stroke="#1c7ed6" stroke-width="2"/>
    <text x="870" y="550" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      6️⃣ Quality Metadata
    </text>
    <text x="730" y="580" font-family="Arial, sans-serif" font-size="13" fill="#495057">
      • Authority/credibility score
    </text>
    <text x="730" y="602" font-family="Arial, sans-serif" font-size="13" fill="#495057">
      • Freshness indicator
    </text>
    <text x="730" y="624" font-family="Arial, sans-serif" font-size="13" fill="#495057">
      • Completeness score
    </text>
    <text x="730" y="646" font-family="Arial, sans-serif" font-size="13" fill="#495057">
      • Verification status
    </text>
  </g>
  
  <!-- Custom Metadata -->
  <g id="custom">
    <rect x="370" y="680" width="660" height="80" rx="10" fill="#fff9db" stroke="#fab005" stroke-width="2"/>
    <text x="700" y="710" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      ⚙️ Custom Domain Metadata
    </text>
    <text x="700" y="740" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#495057">
      Industry-specific fields • User-defined attributes • Business logic tags
    </text>
  </g>
  
  <!-- Arrow to output -->
  <path d="M 1060 445 L 1150 445" stroke="#1c7ed6" stroke-width="3" fill="none" marker-end="url(#arrowhead2)"/>
  
  <!-- Enriched Output -->
  <rect x="1150" y="270" width="200" height="350" rx="10" fill="#d3f9d8" stroke="#37b24d" stroke-width="3"/>
  <text x="1250" y="305" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    ✅ Enriched Chunk
  </text>
  <text x="1170" y="340" font-family="Arial, sans-serif" font-size="11" fill="#495057">
    {
  </text>
  <text x="1180" y="360" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    "content": "...",
  </text>
  <text x="1180" y="378" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    "doc_id": "xyz",
  </text>
  <text x="1180" y="396" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    "section": "3.2",
  </text>
  <text x="1180" y="414" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    "created": "2025-01",
  </text>
  <text x="1180" y="432" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    "keywords": [...],
  </text>
  <text x="1180" y="450" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    "entities": [...],
  </text>
  <text x="1180" y="468" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    "topic": "ML",
  </text>
  <text x="1180" y="486" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    "word_count": 150,
  </text>
  <text x="1180" y="504" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    "parent_link": "...",
  </text>
  <text x="1180" y="522" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    "quality": 0.95,
  </text>
  <text x="1180" y="540" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    "custom_field": "..."
  </text>
  <text x="1170" y="560" font-family="Arial, sans-serif" font-size="11" fill="#495057">
    }
  </text>
  <text x="1250" y="590" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#37b24d">
    Ready for indexing!
  </text>
  
  <!-- Benefits Section -->
  <rect x="50" y="700" width="320" height="170" rx="10" fill="#fff3bf" stroke="#fcc419" stroke-width="2"/>
  <text x="210" y="730" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    💡 Benefits of Metadata Enrichment
  </text>
  <text x="70" y="760" font-family="Arial, sans-serif" font-size="12" fill="#495057">
    ✓ Better filtering and pre-filtering
  </text>
  <text x="70" y="782" font-family="Arial, sans-serif" font-size="12" fill="#495057">
    ✓ Improved ranking and relevance
  </text>
  <text x="70" y="804" font-family="Arial, sans-serif" font-size="12" fill="#495057">
    ✓ Enhanced user experience
  </text>
  <text x="70" y="826" font-family="Arial, sans-serif" font-size="12" fill="#495057">
    ✓ Temporal &amp; domain awareness
  </text>
  <text x="70" y="848" font-family="Arial, sans-serif" font-size="12" fill="#495057">
    ✓ Better context for generation
  </text>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#495057"/>
    </marker>
    <marker id="arrowhead2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#1c7ed6"/>
    </marker>
  </defs>
</svg>