<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-size="24" font-weight="bold" fill="#2c3e50">
    Probability Fundamentals
  </text>
  
  <!-- Sample Space (Large Rectangle) -->
  <rect x="80" y="70" width="500" height="320" fill="#ffffff" stroke="#3498db" stroke-width="3"/>
  <text x="100" y="95" font-size="18" font-weight="bold" fill="#3498db">Sample Space (Ω)</text>
  <text x="100" y="115" font-size="12" fill="#7f8c8d">Set of all possible outcomes</text>
  
  <!-- Event A (Circle) -->
  <circle cx="250" cy="220" r="65" fill="#e74c3c" fill-opacity="0.3" stroke="#e74c3c" stroke-width="2"/>
  <text x="220" y="190" text-anchor="middle" font-size="16" font-weight="bold" fill="#e74c3c">A</text>
  
  <!-- Event B (Circle) -->
  <circle cx="380" cy="240" r="55" fill="#f39c12" fill-opacity="0.3" stroke="#f39c12" stroke-width="2"/>
  <text x="420" y="210" text-anchor="middle" font-size="16" font-weight="bold" fill="#f39c12">B</text>
  
  <!-- Intersection A ∩ B -->
  <path d="M 315 215 A 65 65 0 0 1 330 265 A 55 55 0 0 1 315 215" fill="#9b59b6" fill-opacity="0.6" stroke="#9b59b6" stroke-width="2"/>
  <text x="325" y="245" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">A∩B</text>
  
  <!-- Union A ∪ B outline -->
  <path d="M 185 220 A 65 65 0 1 1 315 220 A 55 55 0 1 1 435 240 A 55 55 0 1 1 325 240 A 65 65 0 0 1 185 220" 
        fill="none" stroke="#27ae60" stroke-width="3" stroke-dasharray="5,3"/>
  <text x="300" y="320" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">A ∪ B (Union)</text>
  
  <!-- Complement A' region -->
  <text x="450" y="150" font-size="14" font-weight="bold" fill="#7f8c8d">A'</text>
  <text x="430" y="165" font-size="11" fill="#7f8c8d">(Complement)</text>
  
  <!-- Sample points -->
  <circle cx="200" cy="250" r="2" fill="#2c3e50"/>
  <circle cx="270" cy="200" r="2" fill="#2c3e50"/>
  <circle cx="350" cy="260" r="2" fill="#2c3e50"/>
  <circle cx="400" cy="220" r="2" fill="#2c3e50"/>
  <circle cx="150" cy="180" r="2" fill="#2c3e50"/>
  <circle cx="500" cy="300" r="2" fill="#2c3e50"/>
  <text x="150" y="175" font-size="9" fill="#2c3e50">ω</text>
  
  <!-- Legend -->
  <rect x="600" y="70" width="180" height="160" fill="#ffffff" stroke="#bdc3c7" stroke-width="1" rx="5"/>
  <text x="610" y="90" font-size="14" font-weight="bold" fill="#2c3e50">Legend:</text>
  
  <circle cx="620" cy="105" r="8" fill="#e74c3c" fill-opacity="0.3" stroke="#e74c3c"/>
  <text x="635" y="110" font-size="11" fill="#2c3e50">Event A</text>
  
  <circle cx="620" cy="125" r="8" fill="#f39c12" fill-opacity="0.3" stroke="#f39c12"/>
  <text x="635" y="130" font-size="11" fill="#2c3e50">Event B</text>
  
  <circle cx="620" cy="145" r="8" fill="#9b59b6" fill-opacity="0.6" stroke="#9b59b6"/>
  <text x="635" y="150" font-size="11" fill="#2c3e50">A ∩ B (Intersection)</text>
  
  <path d="M 610 165 L 630 165" stroke="#27ae60" stroke-width="3" stroke-dasharray="3,2"/>
  <text x="635" y="170" font-size="11" fill="#2c3e50">A ∪ B (Union)</text>
  
  <text x="635" y="190" font-size="11" fill="#7f8c8d">A' (Complement)</text>
  
  <circle cx="620" cy="205" r="2" fill="#2c3e50"/>
  <text x="635" y="210" font-size="11" fill="#2c3e50">Sample points (ω)</text>
  
  <!-- Key Concepts Box -->
  <rect x="80" y="410" width="500" height="120" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" rx="5"/>
  <text x="90" y="430" font-size="14" font-weight="bold" fill="#2c3e50">Key Concepts:</text>
  
  <text x="90" y="450" font-size="12" fill="#2c3e50">• <tspan font-weight="bold">Sample Space (Ω):</tspan> Set of all possible outcomes</text>
  <text x="90" y="470" font-size="12" fill="#2c3e50">• <tspan font-weight="bold">Event:</tspan> Subset of sample space (A, B)</text>
  <text x="90" y="490" font-size="12" fill="#2c3e50">• <tspan font-weight="bold">Intersection (A ∩ B):</tspan> Outcomes in both A and B</text>
  <text x="90" y="510" font-size="12" fill="#2c3e50">• <tspan font-weight="bold">Union (A ∪ B):</tspan> Outcomes in A or B (or both)</text>
  
  <!-- Probability Rules Box -->
  <rect x="80" y="545" width="700" height="45" fill="#3498db" fill-opacity="0.1" stroke="#3498db" stroke-width="2" rx="5"/>
  <text x="90" y="565" font-size="13" font-weight="bold" fill="#2c3e50">Basic Probability Rules:</text>
  <text x="90" y="580" font-size="11" fill="#2c3e50">P(A ∪ B) = P(A) + P(B) - P(A ∩ B)  •  P(A') = 1 - P(A)  •  0 ≤ P(A) ≤ 1  •  P(Ω) = 1</text>
</svg>