<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    Batch Normalization Process Flow
  </text>
  
  <!-- Step 1: Input Batch -->
  <g id="step1" transform="translate(50, 80)">
    <rect width="120" height="100" rx="8" fill="#e8f4f8" stroke="#3498db" stroke-width="2"/>
    <text x="60" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2980b9">
      Input Batch
    </text>
    <text x="60" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#34495e">
      {x1, x2, ..., xm}
    </text>
    
    <!-- Sample data visualization -->
    <g transform="translate(20, 45)">
      <rect x="0" y="0" width="15" height="8" fill="#3498db" opacity="0.7"/>
      <rect x="20" y="0" width="25" height="8" fill="#3498db" opacity="0.7"/>
      <rect x="50" y="0" width="18" height="8" fill="#3498db" opacity="0.7"/>
      <rect x="0" y="12" width="30" height="8" fill="#3498db" opacity="0.7"/>
      <rect x="35" y="12" width="22" height="8" fill="#3498db" opacity="0.7"/>
      <text x="40" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">
        Varied Scales
      </text>
    </g>
  </g>
  
  <!-- Arrow 1 -->
  <path d="M 170 130 L 220 130" stroke="#34495e" stroke-width="3" marker-end="url(#arrowhead)" fill="none"/>
  <text x="195" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Calculate</text>
  
  <!-- Step 2: Compute Mean and Variance -->
  <g id="step2" transform="translate(240, 80)">
    <rect width="140" height="100" rx="8" fill="#fff3e0" stroke="#f39c12" stroke-width="2"/>
    <text x="70" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#d35400">
      Compute Statistics
    </text>
    
    <!-- Mean formula -->
    <text x="70" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#34495e">
      μ = (1/m) Σxi
    </text>
    
    <!-- Variance formula -->
    <text x="70" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#34495e">
      σ² = (1/m) Σ(xi - μ)²
    </text>
    
    <text x="70" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#f39c12">
      Batch-wise Statistics
    </text>
  </g>
  
  <!-- Arrow 2 -->
  <path d="M 380 130 L 430 130" stroke="#34495e" stroke-width="3" marker-end="url(#arrowhead)" fill="none"/>
  <text x="405" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Normalize</text>
  
  <!-- Step 3: Normalize -->
  <g id="step3" transform="translate(450, 80)">
    <rect width="120" height="100" rx="8" fill="#f0f8e8" stroke="#2ecc71" stroke-width="2"/>
    <text x="60" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#27ae60">
      Normalize
    </text>
    
    <!-- Normalization formula -->
    <text x="60" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#34495e">
      x̂ = (x - μ) /
    </text>
    <text x="60" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#34495e">
      √(σ² + ε)
    </text>
    
    <text x="60" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#27ae60">
      μ = 0, σ = 1
    </text>
  </g>
  
  <!-- Arrow 3 -->
  <path d="M 570 130 L 620 130" stroke="#34495e" stroke-width="3" marker-end="url(#arrowhead)" fill="none"/>
  <text x="595" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Scale and Shift</text>
  
  <!-- Step 4: Scale and Shift -->
  <g id="step4" transform="translate(640, 80)">
    <rect width="120" height="100" rx="8" fill="#f8e8f8" stroke="#9b59b6" stroke-width="2"/>
    <text x="60" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#8e44ad">
      Scale and Shift
    </text>
    
    <!-- Final formula -->
    <text x="60" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#34495e">
      y = γx̂ + β
    </text>
    
    <text x="60" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#9b59b6">
      Learnable Parameters
    </text>
    <text x="60" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#9b59b6">
      γ (scale), β (shift)
    </text>
  </g>
  
  <!-- Before/After Visualization -->
  <g id="before-after" transform="translate(100, 220)">
    
    <!-- Before Batch Norm -->
    <g id="before">
      <text x="150" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#e74c3c">
        Before Batch Normalization
      </text>
      
      <rect x="50" y="20" width="200" height="120" rx="8" fill="#fdeaea" stroke="#e74c3c" stroke-width="2"/>
      
      <!-- Distribution visualization - spread out -->
      <g transform="translate(75, 60)">
        <!-- Histogram bars -->
        <rect x="10" y="60" width="8" height="20" fill="#e74c3c"/>
        <rect x="25" y="45" width="8" height="35" fill="#e74c3c"/>
        <rect x="40" y="30" width="8" height="50" fill="#e74c3c"/>
        <rect x="55" y="35" width="8" height="45" fill="#e74c3c"/>
        <rect x="70" y="40" width="8" height="40" fill="#e74c3c"/>
        <rect x="85" y="50" width="8" height="30" fill="#e74c3c"/>
        <rect x="100" y="60" width="8" height="20" fill="#e74c3c"/>
        <rect x="115" y="70" width="8" height="10" fill="#e74c3c"/>
        <rect x="130" y="65" width="8" height="15" fill="#e74c3c"/>
        <rect x="145" y="50" width="8" height="30" fill="#e74c3c"/>
        
        <!-- Mean and std labels -->
        <line x1="80" y1="10" x2="80" y2="90" stroke="#c0392b" stroke-width="2" stroke-dasharray="3,3"/>
        <text x="85" y="15" font-family="Arial, sans-serif" font-size="10" fill="#c0392b">μ ≠ 0</text>
        
        <!-- Spread indicators -->
        <path d="M 20 100 L 140 100" stroke="#c0392b" stroke-width="1"/>
        <path d="M 20 95 L 20 105" stroke="#c0392b" stroke-width="1"/>
        <path d="M 140 95 L 140 105" stroke="#c0392b" stroke-width="1"/>
        <text x="80" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#c0392b">Large σ</text>
      </g>
    </g>
    
    <!-- Arrow -->
    <path d="M 250 80 L 350 80" stroke="#f39c12" stroke-width="4" marker-end="url(#arrowhead-orange)" fill="none"/>
    <text x="300" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#d35400">
      Batch Norm
    </text>
    
    <!-- After Batch Norm -->
    <g id="after" transform="translate(350, 0)">
      <text x="150" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#27ae60">
        After Batch Normalization
      </text>
      
      <rect x="50" y="20" width="200" height="120" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
      
      <!-- Distribution visualization - normalized -->
      <g transform="translate(75, 60)">
        <!-- Histogram bars - normal distribution -->
        <rect x="20" y="70" width="8" height="10" fill="#27ae60"/>
        <rect x="35" y="60" width="8" height="20" fill="#27ae60"/>
        <rect x="50" y="45" width="8" height="35" fill="#27ae60"/>
        <rect x="65" y="30" width="8" height="50" fill="#27ae60"/>
        <rect x="80" y="20" width="8" height="60" fill="#27ae60"/>
        <rect x="95" y="30" width="8" height="50" fill="#27ae60"/>
        <rect x="110" y="45" width="8" height="35" fill="#27ae60"/>
        <rect x="125" y="60" width="8" height="20" fill="#27ae60"/>
        <rect x="140" y="70" width="8" height="10" fill="#27ae60"/>
        
        <!-- Mean line at center -->
        <line x1="84" y1="10" x2="84" y2="90" stroke="#229954" stroke-width="2" stroke-dasharray="3,3"/>
        <text x="89" y="15" font-family="Arial, sans-serif" font-size="10" fill="#229954">μ = 0</text>
        
        <!-- Standard deviation indicators -->
        <path d="M 50 100 L 118 100" stroke="#229954" stroke-width="1"/>
        <path d="M 50 95 L 50 105" stroke="#229954" stroke-width="1"/>
        <path d="M 118 95 L 118 105" stroke="#229954" stroke-width="1"/>
        <text x="84" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#229954">σ = 1</text>
      </g>
    </g>
  </g>
  
  <!-- Mathematical Details Box -->
  <g id="math-details" transform="translate(50, 380)">
    <rect width="700" height="120" rx="8" fill="#f1f2f6" stroke="#57606f" stroke-width="2"/>
    
    <text x="350" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">
      Mathematical Formulation
    </text>
    
    <!-- Step by step formulas -->
    <g transform="translate(30, 40)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#3498db">
        1. Batch Mean:
      </text>
      <text x="0" y="18" font-family="Arial, sans-serif" font-size="12" fill="#34495e">
        μ = (1/m) Σxi (i=1 to m)
      </text>
      
      <text x="180" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f39c12">
        2. Batch Variance:
      </text>
      <text x="180" y="18" font-family="Arial, sans-serif" font-size="12" fill="#34495e">
        σ² = (1/m) Σ(xi - μ)² (i=1 to m)
      </text>
      
      <text x="380" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2ecc71">
        3. Normalize:
      </text>
      <text x="380" y="18" font-family="Arial, sans-serif" font-size="12" fill="#34495e">
        x̂i = (xi - μ) / √(σ² + ε)
      </text>
      
      <text x="550" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#9b59b6">
        4. Scale and Shift:
      </text>
      <text x="550" y="18" font-family="Arial, sans-serif" font-size="12" fill="#34495e">
        yi = γx̂i + β
      </text>
      
      <!-- Parameter explanations -->
      <text x="0" y="50" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">
        Parameters: m = batch size, ε = small constant (10^-8), γ = learnable scale, β = learnable shift
      </text>
    </g>
  </g>
  
  <!-- Benefits Box -->
  <g id="benefits" transform="translate(50, 520)">
    <rect width="350" height="60" rx="8" fill="#e8f5e8" stroke="#27ae60" stroke-width="2"/>
    
    <text x="175" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#229954">
      Key Benefits
    </text>
    
    <text x="20" y="40" font-family="Arial, sans-serif" font-size="11" fill="#34495e">
      • Faster convergence and training stability • Reduces internal covariate shift
    </text>
    
    <text x="20" y="52" font-family="Arial, sans-serif" font-size="11" fill="#34495e">
      • Acts as regularization • Less sensitive to weight initialization
    </text>
  </g>
  
  <!-- Implementation Notes -->
  <g id="implementation" transform="translate(420, 520)">
    <rect width="330" height="60" rx="8" fill="#fff3e0" stroke="#f39c12" stroke-width="2"/>
    
    <text x="165" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#d35400">
      Implementation Notes
    </text>
    
    <text x="20" y="40" font-family="Arial, sans-serif" font-size="11" fill="#34495e">
      • Applied before or after activation function • Different behavior in training vs inference
    </text>
    
    <text x="20" y="52" font-family="Arial, sans-serif" font-size="11" fill="#34495e">
      • Running statistics maintained for inference • γ and β initialized to 1 and 0
    </text>
  </g>
  
  <!-- Define arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e"/>
    </marker>
    <marker id="arrowhead-orange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f39c12"/>
    </marker>
  </defs>
</svg>