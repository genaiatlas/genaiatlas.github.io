<svg viewBox="0 0 900 750" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #2c3e50; }
      .subtitle { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #34495e; }
      .text { font-family: Arial, sans-serif; font-size: 11px; fill: #2c3e50; }
      .formula-text { font-family: 'Courier New', monospace; font-size: 12px; fill: #2c3e50; }
      .euclidean-path { stroke: #e74c3c; stroke-width: 3; fill: none; }
      .manhattan-path { stroke: #3498db; stroke-width: 3; fill: none; }
      .grid-line { stroke: #ecf0f1; stroke-width: 0.5; opacity: 0.5; }
      .axis { stroke: #7f8c8d; stroke-width: 1; }
      .point { stroke: #2c3e50; stroke-width: 2; }
      .point-a { fill: #27ae60; }
      .point-b { fill: #e67e22; }
      .scaling-box { fill: #f8f9fa; stroke: #6c757d; stroke-width: 1; }
      .comparison-box { fill: #e8f6f3; stroke: #16a085; stroke-width: 2; }
      .before-data { fill: #e74c3c; opacity: 0.7; }
      .after-data { fill: #27ae60; opacity: 0.7; }
    </style>
  </defs>

  <text x="450" y="25" class="title" text-anchor="middle">Distance Measures and Data Scaling in Machine Learning</text>

  <!-- Distance Measures Comparison -->
  <g transform="translate(50, 50)">
    <text x="150" y="0" class="subtitle" text-anchor="middle">Distance Measures Comparison</text>
    
    <!-- Grid -->
    <g opacity="0.3">
      <line x1="0" y1="0" x2="300" y2="0" class="grid-line"/>
      <line x1="0" y1="50" x2="300" y2="50" class="grid-line"/>
      <line x1="0" y1="100" x2="300" y2="100" class="grid-line"/>
      <line x1="0" y1="150" x2="300" y2="150" class="grid-line"/>
      <line x1="0" y1="200" x2="300" y2="200" class="grid-line"/>
      <line x1="50" y1="0" x2="50" y2="200" class="grid-line"/>
      <line x1="100" y1="0" x2="100" y2="200" class="grid-line"/>
      <line x1="150" y1="0" x2="150" y2="200" class="grid-line"/>
      <line x1="200" y1="0" x2="200" y2="200" class="grid-line"/>
      <line x1="250" y1="0" x2="250" y2="200" class="grid-line"/>
      <line x1="300" y1="0" x2="300" y2="200" class="grid-line"/>
    </g>
    
    <!-- Axes -->
    <line x1="0" y1="200" x2="320" y2="200" class="axis"/>
    <line x1="0" y1="0" x2="0" y2="220" class="axis"/>
    <text x="310" y="210" class="text">X</text>
    <text x="-10" y="10" class="text">Y</text>
    
    <!-- Points A and B -->
    <circle cx="50" cy="150" r="5" class="point point-a"/>
    <text x="55" y="145" class="text" font-weight="bold">A (1,2)</text>
    <circle cx="200" cy="50" r="5" class="point point-b"/>
    <text x="205" y="45" class="text" font-weight="bold">B (4,5)</text>
    
    <!-- Euclidean Distance (straight line) -->
    <line x1="50" y1="150" x2="200" y2="50" class="euclidean-path"/>
    <text x="115" y="90" class="text" fill="#e74c3c" font-weight="bold">Euclidean</text>
    <text x="115" y="105" class="text" fill="#e74c3c">d = 4.24</text>
    
    <!-- Manhattan Distance (L-shaped path) -->
    <path d="M 50,150 L 200,150 L 200,50" class="manhattan-path" stroke-dasharray="5,5"/>
    <text x="220" y="100" class="text" fill="#3498db" font-weight="bold">Manhattan</text>
    <text x="220" y="115" class="text" fill="#3498db">d = 6.0</text>
    
    <!-- Distance calculations -->
    <g transform="translate(0, 240)">
      <text x="0" y="0" class="subtitle">Distance Formulas:</text>
      <text x="10" y="20" class="text" font-weight="bold" fill="#e74c3c">Euclidean Distance:</text>
      <text x="10" y="35" class="formula-text">d = √[(x₂-x₁)² + (y₂-y₁)²]</text>
      <text x="10" y="50" class="formula-text">d = √[(4-1)² + (5-2)²] = √[9 + 9] = 4.24</text>
      
      <text x="10" y="75" class="text" font-weight="bold" fill="#3498db">Manhattan Distance:</text>
      <text x="10" y="90" class="formula-text">d = |x₂-x₁| + |y₂-y₁|</text>
      <text x="10" y="105" class="formula-text">d = |4-1| + |5-2| = 3 + 3 = 6.0</text>
    </g>
  </g>

  <!-- Scaling Comparison -->
  <g transform="translate(450, 50)">
    <text x="200" y="0" class="subtitle" text-anchor="middle">Data Scaling Impact</text>
    
    <!-- Before Scaling -->
    <g>
      <text x="0" y="25" class="text" font-weight="bold">Before Scaling:</text>
      <text x="0" y="40" class="text">Age: [25, 30, 35, 40, 45]</text>
      <text x="0" y="55" class="text">Income: [30000, 50000, 70000, 90000, 110000]</text>
      
      <!-- Visualization bars -->
      <text x="0" y="80" class="text">Relative impact on distance:</text>
      <rect x="20" y="85" width="30" height="10" class="before-data"/>
      <text x="55" y="94" class="text">Age (small range)</text>
      <rect x="20" y="100" width="200" height="10" class="before-data"/>
      <text x="225" y="109" class="text">Income (dominates!)</text>
    </g>
    
    <!-- After Scaling -->
    <g transform="translate(0, 140)">
      <text x="0" y="0" class="text" font-weight="bold">After Scaling:</text>
      <text x="0" y="15" class="text">Age: [-1.4, -0.7, 0, 0.7, 1.4]</text>
      <text x="0" y="30" class="text">Income: [-1.4, -0.7, 0, 0.7, 1.4]</text>
      
      <!-- Visualization bars -->
      <text x="0" y="55" class="text">Relative impact on distance:</text>
      <rect x="20" y="60" width="80" height="10" class="after-data"/>
      <text x="105" y="69" class="text">Age (balanced)</text>
      <rect x="20" y="75" width="80" height="10" class="after-data"/>
      <text x="105" y="84" class="text">Income (balanced)</text>
    </g>
  </g>

  <!-- Scaling Methods -->
  <g transform="translate(50, 420)">
    <rect x="-10" y="-10" width="380" height="200" class="scaling-box" rx="5"/>
    <text x="10" y="10" class="subtitle">Data Scaling Methods</text>
    
    <!-- Normalization -->
    <text x="20" y="35" class="text" font-weight="bold" fill="#e74c3c">1. Normalization (Min-Max Scaling)</text>
    <text x="30" y="50" class="formula-text">y = (x - min) / (max - min)</text>
    <text x="30" y="65" class="text">• Scales data to range [0, 1]</text>
    <text x="30" y="80" class="text">• Preserves relationships between data points</text>
    <text x="30" y="95" class="text">• Sensitive to outliers</text>
    
    <!-- Standardization -->
    <text x="20" y="120" class="text" font-weight="bold" fill="#3498db">2. Standardization (Z-score)</text>
    <text x="30" y="135" class="formula-text">y = (x - mean) / std_dev</text>
    <text x="30" y="150" class="text">• Centers data around 0 with std = 1</text>
    <text x="30" y="165" class="text">• Less sensitive to outliers</text>
    <text x="30" y="180" class="text">• Assumes normal distribution</text>
  </g>

  <!-- When to Use Which -->
  <g transform="translate(450, 420)">
    <rect x="-10" y="-10" width="400" height="200" class="comparison-box" rx="5"/>
    <text x="10" y="10" class="subtitle">When to Use Each Distance Measure</text>
    
    <text x="20" y="35" class="text" font-weight="bold" fill="#e74c3c">Euclidean Distance:</text>
    <text x="30" y="50" class="text">• Continuous numerical features</text>
    <text x="30" y="65" class="text">• When actual spatial distance matters</text>
    <text x="30" y="80" class="text">• K-means clustering, KNN</text>
    
    <text x="20" y="105" class="text" font-weight="bold" fill="#3498db">Manhattan Distance:</text>
    <text x="30" y="120" class="text">• High-dimensional sparse data</text>
    <text x="30" y="135" class="text">• When features have different units</text>
    <text x="30" y="150" class="text">• More robust to outliers</text>
    <text x="30" y="165" class="text">• Recommendation systems</text>
  </g>

  <!-- Example with Code -->
  <g transform="translate(50, 640)">
    <text x="0" y="0" class="subtitle">Python Implementation Example</text>
    <rect x="-5" y="5" width="800" height="85" fill="#f8f9fa" stroke="#dee2e6" rx="3"/>
    
    <text x="5" y="25" class="formula-text"># Distance calculation</text>
    <text x="5" y="40" class="formula-text">from scipy.spatial.distance import euclidean, cityblock</text>
    <text x="5" y="55" class="formula-text">euclidean([1,2], [4,5]) = 4.24   # Euclidean distance</text>
    <text x="5" y="70" class="formula-text">cityblock([1,2], [4,5]) = 6.0    # Manhattan distance</text>
    
    <text x="450" y="25" class="formula-text"># Scaling methods</text>
    <text x="450" y="40" class="formula-text">from sklearn.preprocessing import StandardScaler, MinMaxScaler</text>
    <text x="450" y="55" class="formula-text">scaler = StandardScaler().fit_transform(data)</text>
    <text x="450" y="70" class="formula-text">normalizer = MinMaxScaler().fit_transform(data)</text>
  </g>
</svg>