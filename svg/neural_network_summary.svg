<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1e293b">Neural Network Building Blocks: Summary</text>
  
  <!-- Main summary boxes -->
  <g id="summary-boxes">
    <!-- What is a Neuron? -->
    <rect x="50" y="70" width="700" height="80" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="3"/>
    <text x="400" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1e40af">🧠 What is a Neuron in a Neural Network?</text>
    <text x="70" y="115" font-family="Arial, sans-serif" font-size="14" fill="#1e40af">🎯 <tspan font-weight="bold">Acts as a linear classifier</tspan> - separates data into different categories</text>
    <text x="70" y="135" font-family="Arial, sans-serif" font-size="14" fill="#1e40af">🔍 <tspan font-weight="bold">Functions as a pattern detector</tspan> - recognizes specific features in input data</text>
  </g>
  
  <!-- Three-step process -->
  <g id="three-steps">
    <text x="400" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">⚙️ Three-Step Neuron Process</text>
    
    <!-- Step 1 -->
    <rect x="50" y="210" width="200" height="100" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="150" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#92400e">1️⃣ Multiply</text>
    <text x="65" y="255" font-family="Arial, sans-serif" font-size="12" fill="#78716c">Input × Weight</text>
    <text x="65" y="275" font-family="Arial, sans-serif" font-size="11" fill="#78716c">x₁×w₁, x₂×w₂, ...</text>
    <text x="65" y="295" font-family="Arial, sans-serif" font-size="10" fill="#a16207">Weight determines input importance</text>
    
    <!-- Step 2 -->
    <rect x="300" y="210" width="200" height="100" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="400" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#166534">2️⃣ Sum</text>
    <text x="315" y="255" font-family="Arial, sans-serif" font-size="12" fill="#15803d">Add all products</text>
    <text x="315" y="275" font-family="Arial, sans-serif" font-size="11" fill="#15803d">Z = Σ(xᵢ × wᵢ)</text>
    <text x="315" y="295" font-family="Arial, sans-serif" font-size="10" fill="#166534">Combines weighted evidence</text>
    
    <!-- Step 3 -->
    <rect x="550" y="210" width="200" height="100" rx="8" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
    <text x="650" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#be185d">3️⃣ Activate</text>
    <text x="565" y="255" font-family="Arial, sans-serif" font-size="12" fill="#be0a5b">Apply function</text>
    <text x="565" y="275" font-family="Arial, sans-serif" font-size="11" fill="#be0a5b">f(Z) → output</text>
    <text x="565" y="295" font-family="Arial, sans-serif" font-size="10" fill="#be185d">Introduces non-linearity</text>
  </g>
  
  <!-- Mathematical representation -->
  <g id="math-representation">
    <rect x="50" y="340" width="700" height="60" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="400" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">📐 Mathematical Representation</text>
    <text x="400" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#475569">Output = f(X₁×W₁ + X₂×W₂ + X₃×W₃ + ... + Xₙ×Wₙ)</text>
  </g>
  
  <!-- Key components -->
  <g id="key-components">
    <text x="400" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">🔧 Key Components</text>
    
    <!-- Weights -->
    <rect x="60" y="460" width="160" height="80" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="140" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#92400e">Weights (W)</text>
    <text x="75" y="500" font-family="Arial, sans-serif" font-size="10" fill="#78716c">• Learned parameters</text>
    <text x="75" y="515" font-family="Arial, sans-serif" font-size="10" fill="#78716c">• Control input importance</text>
    <text x="75" y="530" font-family="Arial, sans-serif" font-size="10" fill="#78716c">• Positive/negative values</text>
    
    <!-- Inputs -->
    <rect x="240" y="460" width="160" height="80" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="320" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e40af">Inputs (X)</text>
    <text x="255" y="500" font-family="Arial, sans-serif" font-size="10" fill="#475569">• Feature values</text>
    <text x="255" y="515" font-family="Arial, sans-serif" font-size="10" fill="#475569">• Data points</text>
    <text x="255" y="530" font-family="Arial, sans-serif" font-size="10" fill="#475569">• Vector representation</text>
    
    <!-- Activation -->
    <rect x="420" y="460" width="160" height="80" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="500" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#166534">Activation (f)</text>
    <text x="435" y="500" font-family="Arial, sans-serif" font-size="10" fill="#15803d">• ReLU, Sigmoid, Tanh</text>
    <text x="435" y="515" font-family="Arial, sans-serif" font-size="10" fill="#15803d">• Non-linear transformation</text>
    <text x="435" y="530" font-family="Arial, sans-serif" font-size="10" fill="#15803d">• Enables complexity</text>
    
    <!-- Output -->
    <rect x="600" y="460" width="140" height="80" rx="8" fill="#fecaca" stroke="#ef4444" stroke-width="2"/>
    <text x="670" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#991b1b">Output</text>
    <text x="615" y="500" font-family="Arial, sans-serif" font-size="10" fill="#7f1d1d">• Classification: 0/1</text>
    <text x="615" y="515" font-family="Arial, sans-serif" font-size="10" fill="#7f1d1d">• Regression: real #</text>
    <text x="615" y="530" font-family="Arial, sans-serif" font-size="10" fill="#7f1d1d">• Pattern decision</text>
  </g>
  
  <!-- Final takeaway -->
  <g id="final-takeaway">
    <rect x="50" y="560" width="700" height="30" rx="8" fill="#8b5cf6" stroke="#7c3aed" stroke-width="2"/>
    <text x="400" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">💡 A neuron sums up weighted 'evidence' from inputs to make intelligent decisions</text>
  </g>
  
  <!-- Arrows showing flow -->
  <g id="flow-arrows" fill="#6b7280">
    <polygon points="250,260 270,250 270,255 290,255 290,265 270,265 270,270" />
    <polygon points="500,260 520,250 520,255 540,255 540,265 520,265 520,270" />
  </g>
</svg>