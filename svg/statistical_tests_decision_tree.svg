<svg width="900" height="700" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="900" height="700" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    Statistical Tests Decision Tree
  </text>
  
  <!-- Start node -->
  <rect x="375" y="60" width="150" height="50" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="10"/>
  <text x="450" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1976d2">
    What type of data?
  </text>
  <text x="450" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1976d2">
    Quantitative/Categorical
  </text>
  
  <!-- Quantitative branch -->
  <rect x="150" y="150" width="150" height="50" fill="#fff3e0" stroke="#f57c00" stroke-width="2" rx="10"/>
  <text x="225" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f57c00">
    Quantitative Data
  </text>
  <text x="225" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#f57c00">
    (Continuous/Discrete)
  </text>
  
  <!-- Categorical branch -->
  <rect x="600" y="150" width="150" height="50" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2" rx="10"/>
  <text x="675" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#9c27b0">
    Categorical Data
  </text>
  <text x="675" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#9c27b0">
    (Nominal/Ordinal)
  </text>
  
  <!-- Quantitative subdivisions -->
  <!-- One sample -->
  <rect x="50" y="240" width="120" height="60" fill="#e8f5e8" stroke="#4caf50" stroke-width="2" rx="5"/>
  <text x="110" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2e7d32">
    One Sample
  </text>
  <text x="110" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2e7d32">
    Compare to value
  </text>
  <text x="110" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2e7d32">
    One-sample t-test
  </text>
  
  <!-- Two samples -->
  <rect x="180" y="240" width="120" height="60" fill="#e8f5e8" stroke="#4caf50" stroke-width="2" rx="5"/>
  <text x="240" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2e7d32">
    Two Samples
  </text>
  <text x="240" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2e7d32">
    Independent/Paired
  </text>
  <text x="240" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2e7d32">
    Two-sample t-test
  </text>
  
  <!-- Multiple samples -->
  <rect x="310" y="240" width="120" height="60" fill="#e8f5e8" stroke="#4caf50" stroke-width="2" rx="5"/>
  <text x="370" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2e7d32">
    Multiple Groups
  </text>
  <text x="370" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2e7d32">
    3+ groups
  </text>
  <text x="370" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2e7d32">
    ANOVA
  </text>
  
  <!-- Categorical subdivisions -->
  <!-- Goodness of fit -->
  <rect x="520" y="240" width="120" height="60" fill="#ffebee" stroke="#f44336" stroke-width="2" rx="5"/>
  <text x="580" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#d32f2f">
    Goodness of Fit
  </text>
  <text x="580" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#d32f2f">
    One variable
  </text>
  <text x="580" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#d32f2f">
    Chi-square test
  </text>
  
  <!-- Independence -->
  <rect x="650" y="240" width="120" height="60" fill="#ffebee" stroke="#f44336" stroke-width="2" rx="5"/>
  <text x="710" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#d32f2f">
    Independence
  </text>
  <text x="710" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#d32f2f">
    Two variables
  </text>
  <text x="710" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#d32f2f">
    Chi-square test
  </text>
  
  <!-- Detailed test boxes -->
  <!-- One-sample tests -->
  <rect x="20" y="340" width="80" height="80" fill="#f0f4c3" stroke="#827717" stroke-width="1" rx="3"/>
  <text x="60" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#827717">
    Normal data
  </text>
  <text x="60" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#827717">
    σ known: z-test
  </text>
  <text x="60" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#827717">
    σ unknown: t-test
  </text>
  <text x="60" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#827717">
    Non-normal:
  </text>
  <text x="60" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#827717">
    Wilcoxon
  </text>
  
  <!-- Two-sample tests -->
  <rect x="120" y="340" width="80" height="80" fill="#f0f4c3" stroke="#827717" stroke-width="1" rx="3"/>
  <text x="160" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#827717">
    Independent
  </text>
  <text x="160" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#827717">
    Equal var: t-test
  </text>
  <text x="160" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#827717">
    Unequal: Welch
  </text>
  <text x="160" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#827717">
    Non-normal:
  </text>
  <text x="160" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#827717">
    Mann-Whitney
  </text>
  
  <rect x="220" y="340" width="80" height="80" fill="#f0f4c3" stroke="#827717" stroke-width="1" rx="3"/>
  <text x="260" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#827717">
    Paired
  </text>
  <text x="260" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#827717">
    Normal:
  </text>
  <text x="260" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#827717">
    Paired t-test
  </text>
  <text x="260" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#827717">
    Non-normal:
  </text>
  <text x="260" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#827717">
    Wilcoxon signed
  </text>
  
  <!-- ANOVA tests -->
  <rect x="320" y="340" width="80" height="80" fill="#f0f4c3" stroke="#827717" stroke-width="1" rx="3"/>
  <text x="360" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#827717">
    One-way
  </text>
  <text x="360" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#827717">
    One factor
  </text>
  <text x="360" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#827717">
    F-test
  </text>
  <text x="360" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#827717">
    Non-normal:
  </text>
  <text x="360" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#827717">
    Kruskal-Wallis
  </text>
  
  <rect x="420" y="340" width="80" height="80" fill="#f0f4c3" stroke="#827717" stroke-width="1" rx="3"/>
  <text x="460" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#827717">
    Two-way
  </text>
  <text x="460" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#827717">
    Two factors
  </text>
  <text x="460" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#827717">
    F-test
  </text>
  <text x="460" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#827717">
    Interactions
  </text>
  
  <!-- Chi-square tests -->
  <rect x="550" y="340" width="80" height="80" fill="#fce4ec" stroke="#ad1457" stroke-width="1" rx="3"/>
  <text x="590" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ad1457">
    χ² Goodness
  </text>
  <text x="590" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#ad1457">
    Observed vs
  </text>
  <text x="590" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#ad1457">
    Expected
  </text>
  <text x="590" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#ad1457">
    frequencies
  </text>
  
  <rect x="650" y="340" width="80" height="80" fill="#fce4ec" stroke="#ad1457" stroke-width="1" rx="3"/>
  <text x="690" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ad1457">
    χ² Independence
  </text>
  <text x="690" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#ad1457">
    Contingency
  </text>
  <text x="690" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#ad1457">
    table analysis
  </text>
  <text x="690" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#ad1457">
    Association test
  </text>
  
  <!-- Decision criteria box -->
  <rect x="50" y="500" width="800" height="150" fill="#f5f5f5" stroke="#757575" stroke-width="1" rx="5"/>
  <text x="450" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#424242">
    Key Decision Criteria
  </text>
  
  <text x="70" y="550" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">
    1. Data Type:
  </text>
  <text x="170" y="550" font-family="Arial, sans-serif" font-size="12" fill="#666">
    Quantitative (means, medians) vs Categorical (frequencies, proportions)
  </text>
  
  <text x="70" y="570" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">
    2. Sample Size:
  </text>
  <text x="170" y="570" font-family="Arial, sans-serif" font-size="12" fill="#666">
    Large (n≥30): CLT applies, normal approximations. Small: Exact distributions needed
  </text>
  
  <text x="70" y="590" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">
    3. Distribution:
  </text>
  <text x="170" y="590" font-family="Arial, sans-serif" font-size="12" fill="#666">
    Normal: Parametric tests. Non-normal: Non-parametric alternatives
  </text>
  
  <text x="70" y="610" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">
    4. Independence:
  </text>
  <text x="170" y="610" font-family="Arial, sans-serif" font-size="12" fill="#666">
    Independent samples vs Paired/Matched samples
  </text>
  
  <text x="70" y="630" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">
    5. Variance:
  </text>
  <text x="170" y="630" font-family="Arial, sans-serif" font-size="12" fill="#666">
    Equal variances: Pooled tests. Unequal: Welch corrections or separate variance tests
  </text>
  
  <!-- Arrows -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  
  <!-- Main branches -->
  <path d="M 420 110 L 260 150" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 480 110 L 640 150" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  
  <!-- Quantitative sub-branches -->
  <path d="M 200 200 L 110 240" stroke="#666" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
  <path d="M 225 200 L 240 240" stroke="#666" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
  <path d="M 250 200 L 370 240" stroke="#666" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
  
  <!-- Categorical sub-branches -->
  <path d="M 650 200 L 580 240" stroke="#666" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
  <path d="M 700 200 L 710 240" stroke="#666" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
</svg>