<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Routing Decision Tree
  </text>
  
  <!-- Root Node -->
  <rect x="320" y="60" width="160" height="60" rx="8" fill="#4a90e2" stroke="#2e5c8a" stroke-width="2"/>
  <text x="400" y="85" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Incoming Query</text>
  <text x="400" y="105" font-size="12" text-anchor="middle" fill="white">"How do I reset password?"</text>
  
  <!-- Level 1: Query Type Classification -->
  <line x1="400" y1="120" x2="400" y2="160" stroke="#666" stroke-width="2"/>
  <rect x="300" y="160" width="200" height="50" rx="8" fill="#f39c12" stroke="#c87f0a" stroke-width="2"/>
  <text x="400" y="180" font-size="13" font-weight="bold" text-anchor="middle" fill="white">Analyze Query Type</text>
  <text x="400" y="198" font-size="11" text-anchor="middle" fill="white">Technical? Factual? Opinion?</text>
  
  <!-- Branch 1: Technical -->
  <line x1="320" y1="210" x2="150" y2="260" stroke="#666" stroke-width="2"/>
  <text x="220" y="240" font-size="11" fill="#666">Technical</text>
  <rect x="50" y="260" width="200" height="50" rx="8" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <text x="150" y="280" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Check Domain</text>
  <text x="150" y="298" font-size="10" text-anchor="middle" fill="white">Engineering? Support? API?</text>
  
  <!-- Branch 2: Factual -->
  <line x1="400" y1="210" x2="400" y2="260" stroke="#666" stroke-width="2"/>
  <text x="410" y="240" font-size="11" fill="#666">Factual</text>
  <rect x="300" y="260" width="200" height="50" rx="8" fill="#27ae60" stroke="#1e8449" stroke-width="2"/>
  <text x="400" y="280" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Check Recency</text>
  <text x="400" y="298" font-size="10" text-anchor="middle" fill="white">Current? Historical?</text>
  
  <!-- Branch 3: Opinion -->
  <line x1="480" y1="210" x2="650" y2="260" stroke="#666" stroke-width="2"/>
  <text x="580" y="240" font-size="11" fill="#666">Opinion</text>
  <rect x="550" y="260" width="200" height="50" rx="8" fill="#9b59b6" stroke="#7d3c98" stroke-width="2"/>
  <text x="650" y="280" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Check Scope</text>
  <text x="650" y="298" font-size="10" text-anchor="middle" fill="white">Personal? Expert? General?</text>
  
  <!-- Level 3: Final Routing Decisions -->
  <!-- Technical -> Engineering Docs -->
  <line x1="100" y1="310" x2="70" y2="360" stroke="#666" stroke-width="2"/>
  <rect x="10" y="360" width="120" height="60" rx="6" fill="#3498db" stroke="#2874a6" stroke-width="2"/>
  <text x="70" y="380" font-size="11" font-weight="bold" text-anchor="middle" fill="white">📚 Engineering</text>
  <text x="70" y="395" font-size="10" text-anchor="middle" fill="white">Docs</text>
  <text x="70" y="410" font-size="9" text-anchor="middle" fill="white">Score: 0.92</text>
  
  <!-- Technical -> Support KB -->
  <line x1="150" y1="310" x2="150" y2="360" stroke="#666" stroke-width="2"/>
  <rect x="90" y="360" width="120" height="60" rx="6" fill="#3498db" stroke="#2874a6" stroke-width="2"/>
  <text x="150" y="380" font-size="11" font-weight="bold" text-anchor="middle" fill="white">💬 Support KB</text>
  <text x="150" y="395" font-size="10" text-anchor="middle" fill="white">(Primary)</text>
  <text x="150" y="410" font-size="9" text-anchor="middle" fill="white">Score: 0.95</text>
  
  <!-- Technical -> API Docs -->
  <line x1="200" y1="310" x2="230" y2="360" stroke="#666" stroke-width="2"/>
  <rect x="170" y="360" width="120" height="60" rx="6" fill="#3498db" stroke="#2874a6" stroke-width="2"/>
  <text x="230" y="380" font-size="11" font-weight="bold" text-anchor="middle" fill="white">⚙️ API Docs</text>
  <text x="230" y="395" font-size="10" text-anchor="middle" fill="white">Secondary</text>
  <text x="230" y="410" font-size="9" text-anchor="middle" fill="white">Score: 0.78</text>
  
  <!-- Factual -> News DB -->
  <line x1="350" y1="310" x2="340" y2="360" stroke="#666" stroke-width="2"/>
  <rect x="280" y="360" width="120" height="60" rx="6" fill="#27ae60" stroke="#1e8449" stroke-width="2"/>
  <text x="340" y="380" font-size="11" font-weight="bold" text-anchor="middle" fill="white">📰 News DB</text>
  <text x="340" y="395" font-size="10" text-anchor="middle" fill="white">If Recent</text>
  <text x="340" y="410" font-size="9" text-anchor="middle" fill="white">Score: 0.88</text>
  
  <!-- Factual -> Knowledge Base -->
  <line x1="450" y1="310" x2="460" y2="360" stroke="#666" stroke-width="2"/>
  <rect x="400" y="360" width="120" height="60" rx="6" fill="#27ae60" stroke="#1e8449" stroke-width="2"/>
  <text x="460" y="380" font-size="11" font-weight="bold" text-anchor="middle" fill="white">📖 Knowledge</text>
  <text x="460" y="395" font-size="10" text-anchor="middle" fill="white">Base</text>
  <text x="460" y="410" font-size="9" text-anchor="middle" fill="white">Score: 0.91</text>
  
  <!-- Opinion -> Reviews -->
  <line x1="600" y1="310" x2="570" y2="360" stroke="#666" stroke-width="2"/>
  <rect x="510" y="360" width="120" height="60" rx="6" fill="#9b59b6" stroke="#7d3c98" stroke-width="2"/>
  <text x="570" y="380" font-size="11" font-weight="bold" text-anchor="middle" fill="white">⭐ Reviews</text>
  <text x="570" y="395" font-size="10" text-anchor="middle" fill="white">User Opinion</text>
  <text x="570" y="410" font-size="9" text-anchor="middle" fill="white">Score: 0.85</text>
  
  <!-- Opinion -> Expert Articles -->
  <line x1="700" y1="310" x2="710" y2="360" stroke="#666" stroke-width="2"/>
  <rect x="650" y="360" width="120" height="60" rx="6" fill="#9b59b6" stroke="#7d3c98" stroke-width="2"/>
  <text x="710" y="380" font-size="11" font-weight="bold" text-anchor="middle" fill="white">👨‍🏫 Expert</text>
  <text x="710" y="395" font-size="10" text-anchor="middle" fill="white">Articles</text>
  <text x="710" y="410" font-size="9" text-anchor="middle" fill="white">Score: 0.79</text>
  
  <!-- Decision Criteria Box -->
  <rect x="20" y="450" width="760" height="130" rx="8" fill="white" stroke="#ddd" stroke-width="2"/>
  <text x="400" y="475" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Decision Criteria at Each Node
  </text>
  
  <!-- Criteria Grid -->
  <g transform="translate(40, 490)">
    <!-- Query Type -->
    <rect x="0" y="0" width="220" height="70" rx="4" fill="#f8f9fa" stroke="#ddd"/>
    <text x="110" y="18" font-size="11" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Query Type</text>
    <text x="5" y="33" font-size="9" fill="#555">• Keywords: error, how-to, why</text>
    <text x="5" y="46" font-size="9" fill="#555">• Intent: action, info, opinion</text>
    <text x="5" y="59" font-size="9" fill="#555">• Complexity: simple, complex</text>
    
    <!-- Domain -->
    <rect x="240" y="0" width="220" height="70" rx="4" fill="#f8f9fa" stroke="#ddd"/>
    <text x="350" y="18" font-size="11" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Domain</text>
    <text x="245" y="33" font-size="9" fill="#555">• Technical terms present</text>
    <text x="245" y="46" font-size="9" fill="#555">• Domain classification score</text>
    <text x="245" y="59" font-size="9" fill="#555">• Historical routing success</text>
    
    <!-- Confidence -->
    <rect x="480" y="0" width="240" height="70" rx="4" fill="#f8f9fa" stroke="#ddd"/>
    <text x="600" y="18" font-size="11" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Confidence &amp; Fallback</text>
    <text x="485" y="33" font-size="9" fill="#555">• Threshold: 0.7 for single route</text>
    <text x="485" y="46" font-size="9" fill="#555">• Multi-route if 0.5 &lt; score &lt; 0.7</text>
    <text x="485" y="59" font-size="9" fill="#555">• Default fallback if all &lt; 0.5</text>
  </g>
</svg>