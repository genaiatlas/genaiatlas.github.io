<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="stepGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:0.6" />
    </linearGradient>
    <linearGradient id="stepGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:0.6" />
    </linearGradient>
    <linearGradient id="stepGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:0.6" />
    </linearGradient>
    <linearGradient id="stepGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0.6" />
    </linearGradient>
    <linearGradient id="stepGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:0.6" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="3" dy="3" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="700" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="500" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1e293b">
    t-SNE Algorithm Workflow: Step-by-Step Process
  </text>
  
  <!-- Step 1: Initialize -->
  <g transform="translate(80,80)">
    <rect x="0" y="0" width="180" height="100" rx="10" fill="url(#stepGrad1)" stroke="#1d4ed8" stroke-width="2" filter="url(#shadow)"/>
    
    <text x="90" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
      Step 1: Initialize
    </text>
    <text x="90" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
      • Compute pairwise distances
    </text>
    <text x="90" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
      • Calculate P probabilities
    </text>
    <text x="90" y="71" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
      • PCA initialization (optional)
    </text>
    <text x="90" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
      • Set hyperparameters
    </text>
  </g>
  
  <!-- Arrow 1 -->
  <g transform="translate(270,125)">
    <path d="M 0 0 L 40 0" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
  
  <!-- Step 2: Compute Q probabilities -->
  <g transform="translate(320,80)">
    <rect x="0" y="0" width="180" height="100" rx="10" fill="url(#stepGrad2)" stroke="#047857" stroke-width="2" filter="url(#shadow)"/>
    
    <text x="90" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
      Step 2: Compute Q
    </text>
    <text x="90" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
      • Calculate low-dim distances
    </text>
    <text x="90" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
      • Apply t-distribution
    </text>
    <text x="90" y="71" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
      • Normalize probabilities
    </text>
    <text x="90" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
      qᵢⱼ = (1+||yᵢ-yⱼ||²)⁻¹/Z
    </text>
  </g>
  
  <!-- Arrow 2 -->
  <g transform="translate(510,125)">
    <path d="M 0 0 L 40 0" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
  
  <!-- Step 3: Calculate KL divergence -->
  <g transform="translate(560,80)">
    <rect x="0" y="0" width="180" height="100" rx="10" fill="url(#stepGrad3)" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
    
    <text x="90" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
      Step 3: KL Divergence
    </text>
    <text x="90" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
      • Measure P vs Q difference
    </text>
    <text x="90" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
      • Compute gradients
    </text>
    <text x="90" y="71" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
      • ∂KL/∂yᵢ for each point
    </text>
    <text x="90" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
      Cost = Σᵢⱼ pᵢⱼ log(pᵢⱼ/qᵢⱼ)
    </text>
  </g>
  
  <!-- Arrow 3 (down) -->
  <g transform="translate(650,190)">
    <path d="M 0 0 L 0 40" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
  
  <!-- Step 4: Update positions -->
  <g transform="translate(560,240)">
    <rect x="0" y="0" width="180" height="100" rx="10" fill="url(#stepGrad4)" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
    
    <text x="90" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
      Step 4: Update
    </text>
    <text x="90" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
      • Gradient descent step
    </text>
    <text x="90" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
      • Apply momentum
    </text>
    <text x="90" y="71" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
      • yᵢ ← yᵢ - η∇KL + αΔyᵢ
    </text>
    <text x="90" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
      • Early exaggeration (if t&lt;250)
    </text>
  </g>
  
  <!-- Arrow 4 (left) -->
  <g transform="translate(310,285)">
    <path d="M 240 0 L 0 0" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="120" y="-8" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">
      Iterate until convergence
    </text>
  </g>
  
  <!-- Step 5: Convergence check -->
  <g transform="translate(120,240)">
    <rect x="0" y="0" width="180" height="100" rx="10" fill="url(#stepGrad5)" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
    
    <text x="90" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
      Step 5: Converged?
    </text>
    <text x="90" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
      • Check KL divergence
    </text>
    <text x="90" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
      • Max iterations reached?
    </text>
    <text x="90" y="71" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
      • Gradient magnitude small?
    </text>
    <text x="90" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
      If No → Continue loop
    </text>
  </g>
  
  <!-- Arrow 5 (down to result) -->
  <g transform="translate(210,350)">
    <path d="M 0 0 L 0 30" stroke="#047857" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="15" y="15" font-family="Arial, sans-serif" font-size="11" fill="#047857" font-weight="bold">
      Yes
    </text>
  </g>
  
  <!-- Final Result -->
  <g transform="translate(120,390)">
    <rect x="0" y="0" width="180" height="80" rx="10" fill="#dcfce7" stroke="#10b981" stroke-width="3"/>
    
    <text x="90" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#047857">
      Final Embedding
    </text>
    <text x="90" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#065f46">
      2D coordinates that preserve
    </text>
    <text x="90" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#065f46">
      local neighborhood structure
    </text>
  </g>
  
  <!-- Hyperparameters panel -->
  <g transform="translate(80,500)">
    <rect x="0" y="0" width="250" height="160" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    
    <text x="125" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#92400e">
      Key Hyperparameters
    </text>
    
    <text x="15" y="50" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#92400e">
      Perplexity (5-50):
    </text>
    <text x="20" y="65" font-family="Arial, sans-serif" font-size="11" fill="#92400e">
      • Effective # of neighbors
    </text>
    <text x="20" y="78" font-family="Arial, sans-serif" font-size="11" fill="#92400e">
      • Higher = more global structure
    </text>
    
    <text x="15" y="100" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#92400e">
      Learning Rate (10-1000):
    </text>
    <text x="20" y="115" font-family="Arial, sans-serif" font-size="11" fill="#92400e">
      • Gradient descent step size
    </text>
    <text x="20" y="128" font-family="Arial, sans-serif" font-size="11" fill="#92400e">
      • Too high = poor convergence
    </text>
    
    <text x="15" y="150" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#92400e">
      Max Iterations (1000+)
    </text>
  </g>
  
  <!-- Tips panel -->
  <g transform="translate(370,500)">
    <rect x="0" y="0" width="300" height="160" rx="10" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
    
    <text x="150" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0c4a6e">
      Implementation Tips
    </text>
    
    <text x="15" y="50" font-family="Arial, sans-serif" font-size="12" fill="#0c4a6e">
      • Run multiple times with different seeds
    </text>
    <text x="15" y="65" font-family="Arial, sans-serif" font-size="12" fill="#0c4a6e">
      • Use PCA for initialization (more stable)
    </text>
    <text x="15" y="80" font-family="Arial, sans-serif" font-size="12" fill="#0c4a6e">
      • Monitor KL divergence for convergence
    </text>
    <text x="15" y="95" font-family="Arial, sans-serif" font-size="12" fill="#0c4a6e">
      • Start with perplexity = 30 for most datasets
    </text>
    <text x="15" y="110" font-family="Arial, sans-serif" font-size="12" fill="#0c4a6e">
      • Early exaggeration helps cluster separation
    </text>
    <text x="15" y="125" font-family="Arial, sans-serif" font-size="12" fill="#0c4a6e">
      • Scale data before applying t-SNE
    </text>
    <text x="15" y="140" font-family="Arial, sans-serif" font-size="12" fill="#0c4a6e">
      • Choose result with lowest final KL value
    </text>
  </g>
  
  <!-- Complexity note -->
  <g transform="translate(720,500)">
    <rect x="0" y="0" width="240" height="160" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    
    <text x="120" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#991b1b">
      Computational Complexity
    </text>
    
    <text x="15" y="50" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#991b1b">
      Time Complexity:
    </text>
    <text x="20" y="65" font-family="Arial, sans-serif" font-size="11" fill="#991b1b">
      O(n²) per iteration
    </text>
    <text x="20" y="78" font-family="Arial, sans-serif" font-size="11" fill="#991b1b">
      Improvements: Barnes-Hut O(n log n)
    </text>
    
    <text x="15" y="100" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#991b1b">
      Memory:
    </text>
    <text x="20" y="115" font-family="Arial, sans-serif" font-size="11" fill="#991b1b">
      O(n²) for pairwise distances
    </text>
    
    <text x="15" y="140" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#991b1b">
      Scalability:
    </text>
    <text x="20" y="155" font-family="Arial, sans-serif" font-size="11" fill="#991b1b">
      Challenging for n &gt; 10,000
    </text>
  </g>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#374151"/>
    </marker>
  </defs>
</svg>