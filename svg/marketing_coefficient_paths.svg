<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'Arial', sans-serif; font-size: 20px; font-weight: bold; fill: #2c3e50; }
      .subtitle { font-family: 'Arial', sans-serif; font-size: 14px; fill: #34495e; font-weight: bold; }
      .axis-label { font-family: 'Arial', sans-serif; font-size: 12px; fill: #2c3e50; }
      .feature-label { font-family: 'Arial', sans-serif; font-size: 16px; fill: #2c3e50; font-weight: bold; }
      .description { font-family: 'Arial', sans-serif; font-size: 11px; fill: #34495e; }
      .grid-line { stroke: #ecf0f1; stroke-width: 1; }
      .axis-line { stroke: #34495e; stroke-width: 2; }
      .tv-curve { stroke: #3498db; stroke-width: 3; fill: none; }
      .radio-curve { stroke: #e74c3c; stroke-width: 3; fill: none; }
      .newspaper-curve { stroke: #f39c12; stroke-width: 3; fill: none; }
      .interaction-curve { stroke: #27ae60; stroke-width: 3; fill: none; }
      .zero-line { stroke: #95a5a6; stroke-width: 1; stroke-dasharray: 3,3; }
      .box { fill: #f8f9fa; stroke: #dee2e6; stroke-width: 2; rx: 8; }
      .highlight-box { fill: #fff3cd; stroke: #ffc107; stroke-width: 2; rx: 8; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="400" y="25" text-anchor="middle" class="title">Lasso Coefficient Paths: Marketing Example</text>
  
  <!-- TV Coefficient Plot -->
  <g transform="translate(50, 60)">
    <rect x="0" y="0" width="160" height="120" fill="none" stroke="#bdc3c7" stroke-width="1"/>
    
    <!-- Grid lines -->
    <line x1="0" y1="20" x2="160" y2="20" class="grid-line"/>
    <line x1="0" y1="40" x2="160" y2="40" class="grid-line"/>
    <line x1="0" y1="60" x2="160" y2="60" class="grid-line"/>
    <line x1="0" y1="80" x2="160" y2="80" class="grid-line"/>
    <line x1="0" y1="100" x2="160" y2="100" class="grid-line"/>
    
    <line x1="32" y1="0" x2="32" y2="120" class="grid-line"/>
    <line x1="64" y1="0" x2="64" y2="120" class="grid-line"/>
    <line x1="96" y1="0" x2="96" y2="120" class="grid-line"/>
    <line x1="128" y1="0" x2="128" y2="120" class="grid-line"/>
    
    <!-- Axes -->
    <line x1="0" y1="0" x2="0" y2="120" class="axis-line"/>
    <line x1="0" y1="120" x2="160" y2="120" class="axis-line"/>
    
    <!-- TV coefficient curve (starts high, decreases gradually) -->
    <path d="M 0 10 C 20 12 40 18 60 30 C 80 45 100 65 120 80 L 140 95 L 160 100" class="tv-curve"/>
    
    <!-- Labels -->
    <text x="80" y="15" text-anchor="middle" class="feature-label" fill="#3498db">TV</text>
    <text x="80" y="135" text-anchor="middle" class="axis-label">α</text>
    <text x="-15" y="60" text-anchor="middle" class="axis-label" transform="rotate(-90 -15 60)">θ̂</text>
    
    <!-- Axis values -->
    <text x="0" y="135" text-anchor="middle" class="description">0</text>
    <text x="32" y="135" text-anchor="middle" class="description">1</text>
    <text x="64" y="135" text-anchor="middle" class="description">2</text>
    <text x="96" y="135" text-anchor="middle" class="description">3</text>
    <text x="128" y="135" text-anchor="middle" class="description">4</text>
    <text x="160" y="135" text-anchor="middle" class="description">5</text>
    
    <text x="-5" y="5" text-anchor="end" class="description">0.020</text>
    <text x="-5" y="25" text-anchor="end" class="description">0.018</text>
    <text x="-5" y="45" text-anchor="end" class="description">0.016</text>
    <text x="-5" y="65" text-anchor="end" class="description">0.014</text>
    <text x="-5" y="85" text-anchor="end" class="description">0.012</text>
    <text x="-5" y="105" text-anchor="end" class="description">0.010</text>
  </g>
  
  <!-- Newspaper Coefficient Plot -->
  <g transform="translate(250, 60)">
    <rect x="0" y="0" width="160" height="120" fill="none" stroke="#bdc3c7" stroke-width="1"/>
    
    <!-- Grid lines -->
    <line x1="0" y1="20" x2="160" y2="20" class="grid-line"/>
    <line x1="0" y1="40" x2="160" y2="40" class="grid-line"/>
    <line x1="0" y1="60" x2="160" y2="60" class="grid-line"/>
    <line x1="0" y1="80" x2="160" y2="80" class="grid-line"/>
    <line x1="0" y1="100" x2="160" y2="100" class="grid-line"/>
    
    <line x1="32" y1="0" x2="32" y2="120" class="grid-line"/>
    <line x1="64" y1="0" x2="64" y2="120" class="grid-line"/>
    <line x1="96" y1="0" x2="96" y2="120" class="grid-line"/>
    <line x1="128" y1="0" x2="128" y2="120" class="grid-line"/>
    
    <!-- Axes -->
    <line x1="0" y1="0" x2="0" y2="120" class="axis-line"/>
    <line x1="0" y1="120" x2="160" y2="120" class="axis-line"/>
    
    <!-- Zero line -->
    <line x1="0" y1="100" x2="160" y2="100" class="zero-line"/>
    
    <!-- Newspaper coefficient curve (quickly goes to zero) -->
    <path d="M 0 20 C 15 25 25 40 32 60 C 40 80 50 95 64 100 L 160 100" class="newspaper-curve"/>
    
    <!-- Labels -->
    <text x="80" y="15" text-anchor="middle" class="feature-label" fill="#f39c12">Newspaper</text>
    <text x="80" y="135" text-anchor="middle" class="axis-label">α</text>
    
    <!-- Axis values -->
    <text x="0" y="135" text-anchor="middle" class="description">0</text>
    <text x="32" y="135" text-anchor="middle" class="description">1</text>
    <text x="64" y="135" text-anchor="middle" class="description">2</text>
    <text x="96" y="135" text-anchor="middle" class="description">3</text>
    <text x="128" y="135" text-anchor="middle" class="description">4</text>
    <text x="160" y="135" text-anchor="middle" class="description">5</text>
    
    <text x="-5" y="5" text-anchor="end" class="description">0.0016</text>
    <text x="-5" y="25" text-anchor="end" class="description">0.0014</text>
    <text x="-5" y="45" text-anchor="end" class="description">0.0012</text>
    <text x="-5" y="65" text-anchor="end" class="description">0.0010</text>
    <text x="-5" y="85" text-anchor="end" class="description">0.0008</text>
    <text x="-5" y="105" text-anchor="end" class="description">0.0000</text>
  </g>
  
  <!-- Radio Coefficient Plot -->
  <g transform="translate(50, 220)">
    <rect x="0" y="0" width="160" height="120" fill="none" stroke="#bdc3c7" stroke-width="1"/>
    
    <!-- Grid lines -->
    <line x1="0" y1="20" x2="160" y2="20" class="grid-line"/>
    <line x1="0" y1="40" x2="160" y2="40" class="grid-line"/>
    <line x1="0" y1="60" x2="160" y2="60" class="grid-line"/>
    <line x1="0" y1="80" x2="160" y2="80" class="grid-line"/>
    <line x1="0" y1="100" x2="160" y2="100" class="grid-line"/>
    
    <line x1="32" y1="0" x2="32" y2="120" class="grid-line"/>
    <line x1="64" y1="0" x2="64" y2="120" class="grid-line"/>
    <line x1="96" y1="0" x2="96" y2="120" class="grid-line"/>
    <line x1="128" y1="0" x2="128" y2="120" class="grid-line"/>
    
    <!-- Axes -->
    <line x1="0" y1="0" x2="0" y2="120" class="axis-line"/>
    <line x1="0" y1="120" x2="160" y2="120" class="axis-line"/>
    
    <!-- Zero line -->
    <line x1="0" y1="120" x2="160" y2="120" class="zero-line"/>
    
    <!-- Radio coefficient curve (decreases to zero) -->
    <path d="M 0 10 C 20 15 40 30 60 50 C 80 75 100 95 120 110 L 160 120" class="radio-curve"/>
    
    <!-- Labels -->
    <text x="80" y="15" text-anchor="middle" class="feature-label" fill="#e74c3c">Radio</text>
    <text x="80" y="135" text-anchor="middle" class="axis-label">α</text>
    <text x="-15" y="60" text-anchor="middle" class="axis-label" transform="rotate(-90 -15 60)">θ̂</text>
    
    <!-- Axis values -->
    <text x="0" y="135" text-anchor="middle" class="description">0</text>
    <text x="32" y="135" text-anchor="middle" class="description">1</text>
    <text x="64" y="135" text-anchor="middle" class="description">2</text>
    <text x="96" y="135" text-anchor="middle" class="description">3</text>
    <text x="128" y="135" text-anchor="middle" class="description">4</text>
    <text x="160" y="135" text-anchor="middle" class="description">5</text>
    
    <text x="-5" y="5" text-anchor="end" class="description">0.030</text>
    <text x="-5" y="25" text-anchor="end" class="description">0.025</text>
    <text x="-5" y="45" text-anchor="end" class="description">0.020</text>
    <text x="-5" y="65" text-anchor="end" class="description">0.015</text>
    <text x="-5" y="85" text-anchor="end" class="description">0.010</text>
    <text x="-5" y="105" text-anchor="end" class="description">0.005</text>
    <text x="-5" y="125" text-anchor="end" class="description">0.000</text>
  </g>
  
  <!-- TV x Radio Interaction Plot -->
  <g transform="translate(250, 220)">
    <rect x="0" y="0" width="160" height="120" fill="none" stroke="#bdc3c7" stroke-width="1"/>
    
    <!-- Grid lines -->
    <line x1="0" y1="20" x2="160" y2="20" class="grid-line"/>
    <line x1="0" y1="40" x2="160" y2="40" class="grid-line"/>
    <line x1="0" y1="60" x2="160" y2="60" class="grid-line"/>
    <line x1="0" y1="80" x2="160" y2="80" class="grid-line"/>
    <line x1="0" y1="100" x2="160" y2="100" class="grid-line"/>
    
    <line x1="32" y1="0" x2="32" y2="120" class="grid-line"/>
    <line x1="64" y1="0" x2="64" y2="120" class="grid-line"/>
    <line x1="96" y1="0" x2="96" y2="120" class="grid-line"/>
    <line x1="128" y1="0" x2="128" y2="120" class="grid-line"/>
    
    <!-- Axes -->
    <line x1="0" y1="0" x2="0" y2="120" class="axis-line"/>
    <line x1="0" y1="120" x2="160" y2="120" class="axis-line"/>
    
    <!-- TV x Radio interaction curve (survives longest) -->
    <path d="M 0 120 L 40 120 C 50 118 60 115 70 110 C 80 100 90 85 100 65 C 110 40 120 20 140 10 L 160 5" class="interaction-curve"/>
    
    <!-- Labels -->
    <text x="80" y="15" text-anchor="middle" class="feature-label" fill="#27ae60">TV × Radio</text>
    <text x="80" y="135" text-anchor="middle" class="axis-label">α</text>
    
    <!-- Axis values -->
    <text x="0" y="135" text-anchor="middle" class="description">0</text>
    <text x="32" y="135" text-anchor="middle" class="description">1</text>
    <text x="64" y="135" text-anchor="middle" class="description">2</text>
    <text x="96" y="135" text-anchor="middle" class="description">3</text>
    <text x="128" y="135" text-anchor="middle" class="description">4</text>
    <text x="160" y="135" text-anchor="middle" class="description">5</text>
    
    <text x="-5" y="5" text-anchor="end" class="description">0.00125</text>
    <text x="-5" y="25" text-anchor="end" class="description">0.00120</text>
    <text x="-5" y="45" text-anchor="end" class="description">0.00115</text>
    <text x="-5" y="65" text-anchor="end" class="description">0.00110</text>
    <text x="-5" y="85" text-anchor="end" class="description">0.00105</text>
    <text x="-5" y="105" text-anchor="end" class="description">0.00100</text>
    <text x="-5" y="125" text-anchor="end" class="description">0.00095</text>
  </g>
  
  <!-- Variable Selection Analysis -->
  <rect x="450" y="60" width="300" height="280" class="box"/>
  <text x="600" y="85" text-anchor="middle" class="subtitle">Variable Selection Pattern</text>
  
  <!-- Timeline of elimination -->
  <text x="470" y="110" class="description" font-weight="bold">Order of Variable Elimination:</text>
  
  <circle cx="480" cy="130" r="3" fill="#f39c12"/>
  <text x="495" y="135" class="description">1. Newspaper (α ≈ 1.5)</text>
  <text x="495" y="147" class="description" font-size="10px">   Least predictive power</text>
  
  <circle cx="480" cy="165" r="3" fill="#e74c3c"/>
  <text x="495" y="170" class="description">2. Radio (α ≈ 3.5)</text>
  <text x="495" y="182" class="description" font-size="10px">   Effect captured by interaction</text>
  
  <circle cx="480" cy="200" r="3" fill="#3498db"/>
  <text x="495" y="205" class="description">3. TV (α ≈ 4.5)</text>
  <text x="495" y="217" class="description" font-size="10px">   Individual effect less important</text>
  
  <circle cx="480" cy="235" r="3" fill="#27ae60"/>
  <text x="495" y="240" class="description">4. TV × Radio (survives longest)</text>
  <text x="495" y="252" class="description" font-size="10px">   Most important predictor</text>
  
  <!-- Model Evolution Table -->
  <rect x="470" y="270" width="260" height="60" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1" rx="4"/>
  <text x="600" y="285" text-anchor="middle" class="description" font-weight="bold">Active Variables by α Range</text>
  
  <text x="480" y="300" class="description" font-size="10px">α = 0.0: [TV, Radio, Newspaper, TV×Radio]</text>
  <text x="480" y="312" class="description" font-size="10px">α = 2.0: [TV, TV×Radio]</text>
  <text x="480" y="324" class="description" font-size="10px">α > 5.0: [TV×Radio only]</text>
  
  <!-- Key Insights -->
  <rect x="50" y="360" width="700" height="100" class="highlight-box"/>
  <text x="400" y="385" text-anchor="middle" class="subtitle" fill="#856404">Key Insights from Coefficient Paths</text>
  
  <text x="70" y="410" class="description">• <span style="font-weight: bold;">Feature Importance Ranking:</span> Interaction term (TV×Radio) is most robust, surviving highest α values</text>
  <text x="70" y="425" class="description">• <span style="font-weight: bold;">Automatic Selection:</span> Lasso automatically identifies that interaction matters more than individual effects</text>
  <text x="70" y="440" class="description">• <span style="font-weight: bold;">Sparsity Pattern:</span> At α = 2.0, model simplifies to just TV and TV×Radio (2 out of 4 features)</text>
  <text x="70" y="455" class="description">• <span style="font-weight: bold;">Practical Guideline:</span> Use cross-validation to find optimal α balancing sparsity and prediction accuracy</text>
  
  <!-- Bottom note -->
  <rect x="50" y="480" width="700" height="50" class="box"/>
  <text x="400" y="500" text-anchor="middle" class="subtitle">Implementation Note</text>
  <text x="70" y="520" class="description">This demonstrates how Lasso naturally discovers that advertising channels work synergistically (TV × Radio interaction)</text>
  <text x="70" y="535" class="description">rather than just additively, providing both statistical modeling and business insights.</text>
</svg>