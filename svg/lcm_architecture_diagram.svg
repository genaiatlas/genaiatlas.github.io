<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="brainGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#6366F1;stop-opacity:0.3" />
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#fafafa"/>
  
  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="bold" fill="#1f2937">Large Concept Model</text>
  <text x="400" y="80" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#6b7280">Abstract Reasoning through Conceptual Understanding</text>
  
  <!-- Central Brain/Network -->
  <circle cx="400" cy="300" r="120" fill="url(#brainGrad)" stroke="#6366F1" stroke-width="3" filter="url(#glow)"/>
  
  <!-- Concept Nodes floating around the brain -->
  <g id="concept-constellation">
    <!-- Core Concepts -->
    <circle cx="280" cy="200" r="25" fill="#F59E0B" stroke="white" stroke-width="3" filter="url(#glow)"/>
    <text x="280" y="207" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="bold" fill="white">Ideas</text>
    
    <circle cx="520" cy="180" r="25" fill="#EF4444" stroke="white" stroke-width="3" filter="url(#glow)"/>
    <text x="520" y="187" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="bold" fill="white">Logic</text>
    
    <circle cx="600" cy="300" r="25" fill="#10B981" stroke="white" stroke-width="3" filter="url(#glow)"/>
    <text x="600" y="307" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="bold" fill="white">Facts</text>
    
    <circle cx="520" cy="420" r="25" fill="#8B5CF6" stroke="white" stroke-width="3" filter="url(#glow)"/>
    <text x="520" y="427" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="bold" fill="white">Patterns</text>
    
    <circle cx="280" cy="400" r="25" fill="#06B6D4" stroke="white" stroke-width="3" filter="url(#glow)"/>
    <text x="280" y="407" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="bold" fill="white">Context</text>
    
    <circle cx="200" cy="300" r="25" fill="#F97316" stroke="white" stroke-width="3" filter="url(#glow)"/>
    <text x="200" y="307" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="bold" fill="white">Memory</text>
  </g>
  
  <!-- Connecting Lines (Neural Network Style) -->
  <g id="neural-connections" opacity="0.6">
    <path d="M 280 225 Q 340 250 380 280" stroke="#6366F1" stroke-width="2" fill="none"/>
    <path d="M 495 180 Q 450 220 420 260" stroke="#6366F1" stroke-width="2" fill="none"/>
    <path d="M 575 300 Q 520 300 480 300" stroke="#6366F1" stroke-width="2" fill="none"/>
    <path d="M 495 420 Q 450 380 420 340" stroke="#6366F1" stroke-width="2" fill="none"/>
    <path d="M 280 375 Q 340 350 380 320" stroke="#6366F1" stroke-width="2" fill="none"/>
    <path d="M 225 300 Q 290 300 320 300" stroke="#6366F1" stroke-width="2" fill="none"/>
    
    <!-- Cross connections -->
    <path d="M 280 225 Q 400 150 495 180" stroke="#6366F1" stroke-width="1" fill="none" opacity="0.4"/>
    <path d="M 520 205 Q 560 250 575 300" stroke="#6366F1" stroke-width="1" fill="none" opacity="0.4"/>
    <path d="M 575 325 Q 560 370 495 420" stroke="#6366F1" stroke-width="1" fill="none" opacity="0.4"/>
    <path d="M 495 420 Q 400 450 280 375" stroke="#6366F1" stroke-width="1" fill="none" opacity="0.4"/>
    <path d="M 255 400 Q 200 350 225 300" stroke="#6366F1" stroke-width="1" fill="none" opacity="0.4"/>
    <path d="M 225 275 Q 200 200 255 225" stroke="#6366F1" stroke-width="1" fill="none" opacity="0.4"/>
  </g>
  
  <!-- Central LCM Label -->
  <text x="400" y="295" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="bold" fill="white">LCM</text>
  <text x="400" y="315" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="white">Core</text>
  
  <!-- Input/Output -->
  <rect x="300" y="500" width="200" height="40" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" rx="20"/>
  <text x="400" y="525" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#475569">Abstract Questions</text>
  
  <rect x="300" y="120" width="200" height="40" fill="#dcfce7" stroke="#16a34a" stroke-width="2" rx="20"/>
  <text x="400" y="145" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#166534">Novel Insights</text>
  
  <!-- Key Capabilities -->
  <g id="capabilities">
    <rect x="50" y="180" width="120" height="240" fill="white" stroke="#e5e7eb" stroke-width="2" rx="12" opacity="0.95"/>
    <text x="110" y="200" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="bold" fill="#374151">What LCM Does</text>
    
    <text x="60" y="230" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6b7280">🔗 Connects Ideas</text>
    <text x="60" y="250" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6b7280">🎯 Finds Patterns</text>
    <text x="60" y="270" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6b7280">🔄 Makes Analogies</text>
    <text x="60" y="290" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6b7280">⚡ Transfers Knowledge</text>
    <text x="60" y="310" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6b7280">🎨 Generates Ideas</text>
    <text x="60" y="330" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6b7280">🔍 Abstracts Concepts</text>
    <text x="60" y="350" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6b7280">🧩 Solves Creatively</text>
    <text x="60" y="370" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6b7280">💡 Discovers Insights</text>
    <text x="60" y="390" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6b7280">🌟 Reasons Abstractly</text>
    
    <rect x="630" y="180" width="120" height="240" fill="white" stroke="#e5e7eb" stroke-width="2" rx="12" opacity="0.95"/>
    <text x="690" y="200" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="bold" fill="#374151">Real Applications</text>
    
    <text x="640" y="230" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6b7280">🔬 Scientific Research</text>
    <text x="640" y="250" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6b7280">💊 Drug Discovery</text>
    <text x="640" y="270" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6b7280">📚 Educational AI</text>
    <text x="640" y="290" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6b7280">🎨 Creative Writing</text>
    <text x="640" y="310" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6b7280">🏢 Business Strategy</text>
    <text x="640" y="330" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6b7280">🔧 Engineering Design</text>
    <text x="640" y="350" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6b7280">📊 Data Analysis</text>
    <text x="640" y="370" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6b7280">🤖 AI Reasoning</text>
    <text x="640" y="390" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6b7280">🧠 Knowledge Synthesis</text>
  </g>
  
  <!-- Simple Flow Arrows -->
  <defs>
    <marker id="simple-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 z" fill="#6b7280"/>
    </marker>
  </defs>
  
  <path d="M 400 500 Q 400 450 400 420" stroke="#6b7280" stroke-width="2" marker-end="url(#simple-arrow)" fill="none"/>
  <path d="M 400 180 Q 400 170 400 160" stroke="#6b7280" stroke-width="2" marker-end="url(#simple-arrow)" fill="none"/>
  
  <!-- Core Philosophy -->
  <text x="400" y="560" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-style="italic" fill="#6b7280">"Understanding through Connection, Reasoning through Abstraction"</text>
</svg>