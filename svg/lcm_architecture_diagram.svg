<svg viewBox="0 0 1000 850" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="850" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="500" y="35" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    LCM Architecture (Large Concept Model)
  </text>
  
  <text x="500" y="60" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d" font-style="italic">
    Learning and Manipulating Abstract Concepts
  </text>
  
  <!-- Input -->
  <g transform="translate(350, 100)">
    <rect x="0" y="0" width="300" height="60" fill="#3498db" stroke="#2980b9" stroke-width="2" rx="5"/>
    <text x="150" y="25" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">
      Input Data / Text
    </text>
    <text x="150" y="45" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
      Documents, descriptions, examples
    </text>
  </g>
  
  <line x1="500" y1="160" x2="500" y2="190" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Concept Extraction -->
  <g transform="translate(250, 190)">
    <rect x="0" y="0" width="500" height="80" fill="#f39c12" stroke="#d68910" stroke-width="2" rx="5"/>
    <text x="250" y="25" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">
      Concept Extraction
    </text>
    <text x="250" y="48" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
      Identify abstract concepts from input data
    </text>
    <text x="250" y="65" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
      Concept(c) = {e₁, e₂, ..., eₙ} ⊂ ℝᵈ
    </text>
  </g>
  
  <line x1="500" y1="270" x2="500" y2="300" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Concept Space -->
  <g transform="translate(100, 300)">
    <rect x="0" y="0" width="800" height="230" fill="white" stroke="#9b59b6" stroke-width="3" rx="8"/>
    <text x="400" y="30" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#9b59b6">
      Conceptual Semantic Space
    </text>
    
    <!-- Concept nodes -->
    <!-- Concept 1: AI -->
    <g transform="translate(150, 60)">
      <circle cx="0" cy="0" r="35" fill="#3498db" opacity="0.3" stroke="#3498db" stroke-width="2"/>
      <text x="0" y="5" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#3498db">
        AI
      </text>
    </g>
    
    <!-- Concept 2: Learning -->
    <g transform="translate(350, 80)">
      <circle cx="0" cy="0" r="32" fill="#27ae60" opacity="0.3" stroke="#27ae60" stroke-width="2"/>
      <text x="0" y="5" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#27ae60">
        Learning
      </text>
    </g>
    
    <!-- Concept 3: Intelligence -->
    <g transform="translate(250, 150)">
      <circle cx="0" cy="0" r="38" fill="#e74c3c" opacity="0.3" stroke="#e74c3c" stroke-width="2"/>
      <text x="0" y="5" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#e74c3c">
        Intelligence
      </text>
    </g>
    
    <!-- Concept 4: Cognition -->
    <g transform="translate(550, 100)">
      <circle cx="0" cy="0" r="30" fill="#f39c12" opacity="0.3" stroke="#f39c12" stroke-width="2"/>
      <text x="0" y="5" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#f39c12">
        Cognition
      </text>
    </g>
    
    <!-- Concept 5: Reasoning -->
    <g transform="translate(450, 170)">
      <circle cx="0" cy="0" r="28" fill="#9b59b6" opacity="0.3" stroke="#9b59b6" stroke-width="2"/>
      <text x="0" y="5" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#9b59b6">
        Reasoning
      </text>
    </g>
    
    <!-- Concept 6: Knowledge -->
    <g transform="translate(650, 150)">
      <circle cx="0" cy="0" r="32" fill="#16a085" opacity="0.3" stroke="#16a085" stroke-width="2"/>
      <text x="0" y="5" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#16a085">
        Knowledge
      </text>
    </g>
    
    <!-- Relationships between concepts -->
    <line x1="185" y1="60" x2="320" y2="80" stroke="#7f8c8d" stroke-width="2" opacity="0.5"/>
    <line x1="150" y1="95" x2="220" y2="135" stroke="#7f8c8d" stroke-width="2" opacity="0.5"/>
    <line x1="280" y1="150" x2="380" y2="100" stroke="#7f8c8d" stroke-width="2" opacity="0.5"/>
    <line x1="380" y1="95" x2="520" y2="100" stroke="#7f8c8d" stroke-width="2" opacity="0.5"/>
    <line x1="285" y1="168" x2="422" y2="175" stroke="#7f8c8d" stroke-width="2" opacity="0.5"/>
    <line x1="480" y1="172" x2="620" y2="155" stroke="#7f8c8d" stroke-width="2" opacity="0.5"/>
    <line x1="575" y1="115" x2="630" y2="140" stroke="#7f8c8d" stroke-width="2" opacity="0.5"/>
    
    <text x="400" y="215" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d" font-style="italic">
      Concepts connected by learned relationships
    </text>
  </g>
  
  <line x1="500" y1="530" x2="500" y2="560" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Concept Operations -->
  <g transform="translate(100, 560)">
    <text x="400" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Conceptual Operations
    </text>
    
    <g transform="translate(0, 20)">
      <!-- Composition -->
      <rect x="0" y="0" width="190" height="80" fill="#ebf5fb" stroke="#3498db" stroke-width="2" rx="5"/>
      <text x="95" y="22" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#3498db">
        Composition
      </text>
      <text x="95" y="42" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#34495e">
        Combine multiple
      </text>
      <text x="95" y="57" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#34495e">
        concepts into new
      </text>
      <text x="95" y="72" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#34495e">
        abstractions
      </text>
      
      <!-- Abstraction -->
      <rect x="210" y="0" width="190" height="80" fill="#d5f4e6" stroke="#27ae60" stroke-width="2" rx="5"/>
      <text x="305" y="22" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#27ae60">
        Abstraction
      </text>
      <text x="305" y="42" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#34495e">
        Generalize from
      </text>
      <text x="305" y="57" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#34495e">
        specific instances to
      </text>
      <text x="305" y="72" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#34495e">
        broader categories
      </text>
      
      <!-- Analogy -->
      <rect x="420" y="0" width="190" height="80" fill="#fef5e7" stroke="#f39c12" stroke-width="2" rx="5"/>
      <text x="515" y="22" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#f39c12">
        Analogy
      </text>
      <text x="515" y="42" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#34495e">
        Find similarities
      </text>
      <text x="515" y="57" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#34495e">
        across different
      </text>
      <text x="515" y="72" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#34495e">
        domains
      </text>
      
      <!-- Transfer -->
      <rect x="630" y="0" width="190" height="80" fill="#f4ecf7" stroke="#9b59b6" stroke-width="2" rx="5"/>
      <text x="725" y="22" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#9b59b6">
        Transfer
      </text>
      <text x="725" y="42" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#34495e">
        Apply knowledge
      </text>
      <text x="725" y="57" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#34495e">
        from one domain to
      </text>
      <text x="725" y="72" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#34495e">
        another
      </text>
    </g>
  </g>
  
  <!-- Applications Panel -->
  <g transform="translate(100, 680)">
    <rect x="0" y="0" width="800" height="140" fill="#ecf0f1" stroke="#95a5a6" stroke-width="2" rx="5"/>
    <text x="400" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      AI Agent Applications
    </text>
    
    <g transform="translate(30, 45)">
      <circle cx="5" cy="5" r="4" fill="#3498db"/>
      <text x="20" y="9" font-family="Arial, sans-serif" font-size="10" fill="#34495e">
        <tspan font-weight="bold">🔬 Scientific Discovery:</tspan> Hypothesis generation and theory development
      </text>
      
      <circle cx="5" cy="28" r="4" fill="#27ae60"/>
      <text x="20" y="32" font-family="Arial, sans-serif" font-size="10" fill="#34495e">
        <tspan font-weight="bold">💡 Creative Problem Solving:</tspan> Novel solution generation through concept combination
      </text>
      
      <circle cx="5" cy="51" r="4" fill="#f39c12"/>
      <text x="20" y="55" font-family="Arial, sans-serif" font-size="10" fill="#34495e">
        <tspan font-weight="bold">🎓 Educational Systems:</tspan> Adaptive learning based on conceptual understanding
      </text>
      
      <circle cx="5" cy="74" r="4" fill="#9b59b6"/>
      <text x="20" y="78" font-family="Arial, sans-serif" font-size="10" fill="#34495e">
        <tspan font-weight="bold">📚 Knowledge Management:</tspan> Organizing and retrieving information by concepts
      </text>
      
      <circle cx="5" cy="97" r="4" fill="#e74c3c"/>
      <text x="20" y="101" font-family="Arial, sans-serif" font-size="10" fill="#34495e">
        <tspan font-weight="bold">🧠 Cross-Domain Reasoning:</tspan> Apply insights from one field to solve problems in another
      </text>
    </g>
  </g>
  
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#34495e"/>
    </marker>
  </defs>
</svg>