<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tensorGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#EF4444;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="tensorGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="tensorGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#14B8A6;stop-opacity:0.8" />
    </linearGradient>
    <filter id="tensorShadow">
      <feDropShadow dx="3" dy="3" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="600" fill="#F8FAFC"/>
  
  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" font-size="28" font-weight="bold" fill="#1F2937">
    Tensor Representation for Time-Varying Recommendations
  </text>
  
  <!-- 3D Tensor Visualization -->
  <g transform="translate(200, 120)">
    <!-- Time slice 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="200" height="200" fill="url(#tensorGrad1)" stroke="#DC2626" stroke-width="2" rx="4" filter="url(#tensorShadow)"/>
      <text x="100" y="-15" text-anchor="middle" font-size="16" font-weight="bold" fill="#DC2626">t = 1</text>
      
      <!-- Grid -->
      <g stroke="white" stroke-width="0.5" opacity="0.5">
        <line x1="50" y1="0" x2="50" y2="200"/>
        <line x1="100" y1="0" x2="100" y2="200"/>
        <line x1="150" y1="0" x2="150" y2="200"/>
        <line x1="0" y1="50" x2="200" y2="50"/>
        <line x1="0" y1="100" x2="200" y2="100"/>
        <line x1="0" y1="150" x2="200" y2="150"/>
      </g>
      
      <!-- Sample values -->
      <g font-size="14" text-anchor="middle" fill="white" font-weight="bold">
        <text x="25" y="30">5</text>
        <text x="75" y="30">?</text>
        <text x="125" y="30">3</text>
        <text x="175" y="30">?</text>
        <text x="25" y="80">?</text>
        <text x="75" y="80">4</text>
        <text x="125" y="80">?</text>
        <text x="175" y="80">2</text>
      </g>
    </g>
    
    <!-- Time slice 2 -->
    <g transform="translate(120, 60)">
      <rect x="0" y="0" width="200" height="200" fill="url(#tensorGrad2)" stroke="#3B82F6" stroke-width="2" rx="4" filter="url(#tensorShadow)"/>
      <text x="100" y="-15" text-anchor="middle" font-size="16" font-weight="bold" fill="#3B82F6">t = 2</text>
      
      <!-- Grid -->
      <g stroke="white" stroke-width="0.5" opacity="0.5">
        <line x1="50" y1="0" x2="50" y2="200"/>
        <line x1="100" y1="0" x2="100" y2="200"/>
        <line x1="150" y1="0" x2="150" y2="200"/>
        <line x1="0" y1="50" x2="200" y2="50"/>
        <line x1="0" y1="100" x2="200" y2="100"/>
        <line x1="0" y1="150" x2="200" y2="150"/>
      </g>
      
      <!-- Sample values -->
      <g font-size="14" text-anchor="middle" fill="white" font-weight="bold">
        <text x="25" y="30">4</text>
        <text x="75" y="30">?</text>
        <text x="125" y="30">?</text>
        <text x="175" y="30">5</text>
        <text x="25" y="80">3</text>
        <text x="75" y="80">?</text>
        <text x="125" y="80">4</text>
        <text x="175" y="80">?</text>
      </g>
    </g>
    
    <!-- Time slice 3 -->
    <g transform="translate(240, 120)">
      <rect x="0" y="0" width="200" height="200" fill="url(#tensorGrad3)" stroke="#10B981" stroke-width="2" rx="4" filter="url(#tensorShadow)"/>
      <text x="100" y="-15" text-anchor="middle" font-size="16" font-weight="bold" fill="#10B981">t = T</text>
      
      <!-- Grid -->
      <g stroke="white" stroke-width="0.5" opacity="0.5">
        <line x1="50" y1="0" x2="50" y2="200"/>
        <line x1="100" y1="0" x2="100" y2="200"/>
        <line x1="150" y1="0" x2="150" y2="200"/>
        <line x1="0" y1="50" x2="200" y2="50"/>
        <line x1="0" y1="100" x2="200" y2="100"/>
        <line x1="0" y1="150" x2="200" y2="150"/>
      </g>
      
      <!-- Sample values -->
      <g font-size="14" text-anchor="middle" fill="white" font-weight="bold">
        <text x="25" y="30">?</text>
        <text x="75" y="30">3</text>
        <text x="125" y="30">?</text>
        <text x="175" y="30">4</text>
        <text x="25" y="80">5</text>
        <text x="75" y="80">?</text>
        <text x="125" y="80">?</text>
        <text x="175" y="80">3</text>
      </g>
    </g>
    
    <!-- Connecting lines to show 3D structure -->
    <g stroke="#6B7280" stroke-width="1" stroke-dasharray="3,3" fill="none">
      <line x1="0" y1="0" x2="120" y2="60"/>
      <line x1="200" y1="0" x2="320" y2="60"/>
      <line x1="0" y1="200" x2="120" y2="260"/>
      <line x1="200" y1="200" x2="320" y2="260"/>
      
      <line x1="120" y1="60" x2="240" y2="120"/>
      <line x1="320" y1="60" x2="440" y2="120"/>
      <line x1="120" y1="260" x2="240" y2="320"/>
      <line x1="320" y1="260" x2="440" y2="320"/>
    </g>
    
    <!-- Axis Labels -->
    <text x="-40" y="100" text-anchor="middle" font-size="16" fill="#4B5563" transform="rotate(-90 -40 100)">Users</text>
    <text x="100" y="240" text-anchor="middle" font-size="16" fill="#4B5563">Items</text>
    <text x="370" y="180" text-anchor="middle" font-size="16" fill="#4B5563">Time</text>
  </g>
  
  <!-- Mathematical Notation -->
  <g transform="translate(700, 200)">
    <rect x="-20" y="-20" width="280" height="150" fill="white" stroke="#E5E7EB" stroke-width="2" rx="8" filter="url(#tensorShadow)"/>
    <text x="120" y="10" text-anchor="middle" font-size="18" font-weight="bold" fill="#1F2937">
      Mathematical Formulation
    </text>
    <text x="10" y="45" font-size="16" font-family="monospace" fill="#4B5563">
      L(i,j,t) = likelihood
    </text>
    <text x="10" y="70" font-size="14" fill="#6B7280">
      i: user dimension
    </text>
    <text x="10" y="90" font-size="14" fill="#6B7280">
      j: item dimension  
    </text>
    <text x="10" y="110" font-size="14" fill="#6B7280">
      t: time dimension
    </text>
  </g>
  
  <!-- Key Features -->
  <g transform="translate(100, 470)">
    <rect x="0" y="0" width="800" height="100" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2" rx="8"/>
    <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1E40AF">
      Key Tensor Properties
    </text>
    <text x="50" y="60" font-size="15" fill="#3730A3">• Captures temporal dynamics of user preferences</text>
    <text x="50" y="80" font-size="15" fill="#3730A3">• Enables time-aware predictions</text>
    <text x="450" y="60" font-size="15" fill="#3730A3">• Handles multi-dimensional relationships</text>
    <text x="450" y="80" font-size="15" fill="#3730A3">• Supports contextual recommendations</text>
  </g>
</svg>