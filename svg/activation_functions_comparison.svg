<svg viewBox="0 0 1000 750" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="750" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#2c3e50">Activation Functions Comparison</text>
  <text x="500" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#7f8c8d">Mathematical Functions that Introduce Nonlinearity</text>
  
  <!-- Sigmoid Function -->
  <rect x="50" y="80" width="200" height="280" rx="10" fill="#e8f8fd" stroke="#3498db" stroke-width="2"/>
  <text x="150" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2980b9">Sigmoid σ(z)</text>
  
  <!-- Sigmoid plot area -->
  <rect x="70" y="130" width="160" height="120" fill="#ffffff" stroke="#bdc3c7" stroke-width="1"/>
  
  <!-- Sigmoid curve -->
  <path d="M 80 240 Q 100 235 120 225 Q 140 210 160 180 Q 180 150 200 145 Q 220 140 240 135" 
        stroke="#3498db" stroke-width="3" fill="none"/>
  
  <!-- Sigmoid axes -->
  <line x1="80" y1="250" x2="220" y2="250" stroke="#7f8c8d" stroke-width="1"/>
  <line x1="150" y1="130" x2="150" y2="250" stroke="#7f8c8d" stroke-width="1"/>
  
  <!-- Sigmoid labels -->
  <text x="225" y="255" font-family="Arial, sans-serif" font-size="8" fill="#7f8c8d">z</text>
  <text x="75" y="135" font-family="Arial, sans-serif" font-size="8" fill="#7f8c8d">1</text>
  <text x="75" y="255" font-family="Arial, sans-serif" font-size="8" fill="#7f8c8d">0</text>
  
  <!-- Sigmoid properties -->
  <text x="150" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">σ(z) = 1/(1+e⁻ᶻ)</text>
  <text x="70" y="290" font-family="Arial, sans-serif" font-size="9" fill="#34495e">Range: (0, 1)</text>
  <text x="70" y="305" font-family="Arial, sans-serif" font-size="9" fill="#27ae60">✓ Smooth gradient</text>
  <text x="70" y="320" font-family="Arial, sans-serif" font-size="9" fill="#27ae60">✓ Probabilistic</text>
  <text x="70" y="335" font-family="Arial, sans-serif" font-size="9" fill="#e74c3c">✗ Vanishing gradient</text>
  <text x="70" y="350" font-family="Arial, sans-serif" font-size="9" fill="#e74c3c">✗ Not zero-centered</text>
  
  <!-- Tanh Function -->
  <rect x="270" y="80" width="200" height="280" rx="10" fill="#e8f6e8" stroke="#27ae60" stroke-width="2"/>
  <text x="370" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#229954">Tanh</text>
  
  <!-- Tanh plot area -->
  <rect x="290" y="130" width="160" height="120" fill="#ffffff" stroke="#bdc3c7" stroke-width="1"/>
  
  <!-- Tanh curve -->
  <path d="M 300 240 Q 320 235 340 220 Q 360 190 380 190 Q 400 190 420 160 Q 440 145 460 140" 
        stroke="#27ae60" stroke-width="3" fill="none"/>
  
  <!-- Tanh axes -->
  <line x1="300" y1="250" x2="440" y2="250" stroke="#7f8c8d" stroke-width="1"/>
  <line x1="370" y1="130" x2="370" y2="250" stroke="#7f8c8d" stroke-width="1"/>
  <line x1="300" y1="190" x2="440" y2="190" stroke="#7f8c8d" stroke-width="1" stroke-dasharray="2,2"/>
  
  <!-- Tanh labels -->
  <text x="445" y="255" font-family="Arial, sans-serif" font-size="8" fill="#7f8c8d">z</text>
  <text x="295" y="135" font-family="Arial, sans-serif" font-size="8" fill="#7f8c8d">1</text>
  <text x="295" y="195" font-family="Arial, sans-serif" font-size="8" fill="#7f8c8d">0</text>
  <text x="295" y="255" font-family="Arial, sans-serif" font-size="8" fill="#7f8c8d">-1</text>
  
  <!-- Tanh properties -->
  <text x="370" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">tanh(z) = (eᶻ-e⁻ᶻ)/(eᶻ+e⁻ᶻ)</text>
  <text x="290" y="290" font-family="Arial, sans-serif" font-size="9" fill="#34495e">Range: (-1, 1)</text>
  <text x="290" y="305" font-family="Arial, sans-serif" font-size="9" fill="#27ae60">✓ Zero-centered</text>
  <text x="290" y="320" font-family="Arial, sans-serif" font-size="9" fill="#27ae60">✓ Stronger gradients</text>
  <text x="290" y="335" font-family="Arial, sans-serif" font-size="9" fill="#e74c3c">✗ Vanishing gradient</text>
  <text x="290" y="350" font-family="Arial, sans-serif" font-size="9" fill="#e74c3c">✗ Expensive computation</text>
  
  <!-- ReLU Function -->
  <rect x="490" y="80" width="200" height="280" rx="10" fill="#fff5e6" stroke="#f39c12" stroke-width="2"/>
  <text x="590" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#e67e22">ReLU</text>
  
  <!-- ReLU plot area -->
  <rect x="510" y="130" width="160" height="120" fill="#ffffff" stroke="#bdc3c7" stroke-width="1"/>
  
  <!-- ReLU curve -->
  <path d="M 520 240 L 580 240 L 580 140 L 660 140" stroke="#f39c12" stroke-width="3" fill="none"/>
  
  <!-- ReLU axes -->
  <line x1="520" y1="250" x2="660" y2="250" stroke="#7f8c8d" stroke-width="1"/>
  <line x1="590" y1="130" x2="590" y2="250" stroke="#7f8c8d" stroke-width="1"/>
  
  <!-- ReLU labels -->
  <text x="665" y="255" font-family="Arial, sans-serif" font-size="8" fill="#7f8c8d">z</text>
  <text x="515" y="135" font-family="Arial, sans-serif" font-size="8" fill="#7f8c8d">max</text>
  <text x="585" y="265" font-family="Arial, sans-serif" font-size="8" fill="#7f8c8d">0</text>
  
  <!-- ReLU properties -->
  <text x="590" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">f(z) = max(0, z)</text>
  <text x="510" y="290" font-family="Arial, sans-serif" font-size="9" fill="#34495e">Range: [0, ∞)</text>
  <text x="510" y="305" font-family="Arial, sans-serif" font-size="9" fill="#27ae60">✓ Computationally efficient</text>
  <text x="510" y="320" font-family="Arial, sans-serif" font-size="9" fill="#27ae60">✓ No vanishing gradient</text>
  <text x="510" y="335" font-family="Arial, sans-serif" font-size="9" fill="#27ae60">✓ Sparse representation</text>
  <text x="510" y="350" font-family="Arial, sans-serif" font-size="9" fill="#e74c3c">✗ Dying ReLU problem</text>
  
  <!-- Softmax Function -->
  <rect x="710" y="80" width="240" height="280" rx="10" fill="#f4e8fd" stroke="#9b59b6" stroke-width="2"/>
  <text x="830" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#8e44ad">Softmax</text>
  
  <!-- Softmax visualization (probability distribution) -->
  <rect x="730" y="130" width="200" height="120" fill="#ffffff" stroke="#bdc3c7" stroke-width="1"/>
  
  <!-- Bar chart representation -->
  <rect x="750" y="200" width="20" height="40" fill="#9b59b6" opacity="0.7"/>
  <rect x="780" y="180" width="20" height="60" fill="#9b59b6" opacity="0.8"/>
  <rect x="810" y="160" width="20" height="80" fill="#9b59b6"/>
  <rect x="840" y="190" width="20" height="50" fill="#9b59b6" opacity="0.6"/>
  <rect x="870" y="210" width="20" height="30" fill="#9b59b6" opacity="0.5"/>
  
  <!-- Softmax labels -->
  <text x="760" y="265" font-family="Arial, sans-serif" font-size="7" fill="#7f8c8d">0.1</text>
  <text x="790" y="265" font-family="Arial, sans-serif" font-size="7" fill="#7f8c8d">0.2</text>
  <text x="815" y="265" font-family="Arial, sans-serif" font-size="7" fill="#7f8c8d">0.4</text>
  <text x="845" y="265" font-family="Arial, sans-serif" font-size="7" fill="#7f8c8d">0.2</text>
  <text x="875" y="265" font-family="Arial, sans-serif" font-size="7" fill="#7f8c8d">0.1</text>
  
  <!-- Softmax properties -->
  <text x="830" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">σ(zᵢ) = eᶻⁱ/Σⱼeᶻʲ</text>
  <text x="730" y="305" font-family="Arial, sans-serif" font-size="9" fill="#34495e">Range: (0, 1), Σ = 1</text>
  <text x="730" y="320" font-family="Arial, sans-serif" font-size="9" fill="#27ae60">✓ Probability distribution</text>
  <text x="730" y="335" font-family="Arial, sans-serif" font-size="9" fill="#27ae60">✓ Multi-class classification</text>
  <text x="730" y="350" font-family="Arial, sans-serif" font-size="9" fill="#e74c3c">✗ Numerically unstable</text>
  
  <!-- Advanced Functions Row -->
  
  <!-- Leaky ReLU -->
  <rect x="50" y="380" width="200" height="280" rx="10" fill="#e6f3ff" stroke="#2196f3" stroke-width="2"/>
  <text x="150" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1976d2">Leaky ReLU</text>
  
  <!-- Leaky ReLU plot -->
  <rect x="70" y="430" width="160" height="120" fill="#ffffff" stroke="#bdc3c7" stroke-width="1"/>
  <path d="M 80 540 L 140 545 L 150 540 L 220 460" stroke="#2196f3" stroke-width="3" fill="none"/>
  
  <!-- Leaky ReLU axes -->
  <line x1="80" y1="550" x2="220" y2="550" stroke="#7f8c8d" stroke-width="1"/>
  <line x1="150" y1="430" x2="150" y2="550" stroke="#7f8c8d" stroke-width="1"/>
  
  <!-- Leaky ReLU properties -->
  <text x="150" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">f(z) = max(αz, z)</text>
  <text x="70" y="590" font-family="Arial, sans-serif" font-size="9" fill="#34495e">α = 0.01 (small slope)</text>
  <text x="70" y="605" font-family="Arial, sans-serif" font-size="9" fill="#27ae60">✓ Fixes dying ReLU</text>
  <text x="70" y="620" font-family="Arial, sans-serif" font-size="9" fill="#27ae60">✓ Non-zero gradient</text>
  <text x="70" y="635" font-family="Arial, sans-serif" font-size="9" fill="#f39c12">~ Still not zero-centered</text>
  <text x="70" y="650" font-family="Arial, sans-serif" font-size="9" fill="#34495e">Range: (-∞, ∞)</text>
  
  <!-- Swish -->
  <rect x="270" y="380" width="200" height="280" rx="10" fill="#fff0e6" stroke="#ff5722" stroke-width="2"/>
  <text x="370" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#d84315">Swish</text>
  
  <!-- Swish plot -->
  <rect x="290" y="430" width="160" height="120" fill="#ffffff" stroke="#bdc3c7" stroke-width="1"/>
  <path d="M 300 540 Q 320 535 340 525 Q 360 510 380 490 Q 400 470 420 450 Q 440 440 450 435" 
        stroke="#ff5722" stroke-width="3" fill="none"/>
  
  <!-- Swish axes -->
  <line x1="300" y1="550" x2="440" y2="550" stroke="#7f8c8d" stroke-width="1"/>
  <line x1="370" y1="430" x2="370" y2="550" stroke="#7f8c8d" stroke-width="1"/>
  
  <!-- Swish properties -->
  <text x="370" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">f(z) = z · σ(z)</text>
  <text x="290" y="590" font-family="Arial, sans-serif" font-size="9" fill="#34495e">Self-gated function</text>
  <text x="290" y="605" font-family="Arial, sans-serif" font-size="9" fill="#27ae60">✓ Smooth and non-monotonic</text>
  <text x="290" y="620" font-family="Arial, sans-serif" font-size="9" fill="#27ae60">✓ Better than ReLU</text>
  <text x="290" y="635" font-family="Arial, sans-serif" font-size="9" fill="#e74c3c">✗ More computation</text>
  <text x="290" y="650" font-family="Arial, sans-serif" font-size="9" fill="#34495e">Used in modern networks</text>
  
  <!-- GELU -->
  <rect x="490" y="380" width="200" height="280" rx="10" fill="#f0f8e6" stroke="#689f38" stroke-width="2"/>
  <text x="590" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#558b2f">GELU</text>
  
  <!-- GELU plot -->
  <rect x="510" y="430" width="160" height="120" fill="#ffffff" stroke="#bdc3c7" stroke-width="1"/>
  <path d="M 520 540 Q 535 535 550 525 Q 570 505 590 485 Q 610 465 630 450 Q 650 440 670 438" 
        stroke="#689f38" stroke-width="3" fill="none"/>
  
  <!-- GELU axes -->
  <line x1="520" y1="550" x2="660" y2="550" stroke="#7f8c8d" stroke-width="1"/>
  <line x1="590" y1="430" x2="590" y2="550" stroke="#7f8c8d" stroke-width="1"/>
  
  <!-- GELU properties -->
  <text x="590" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">f(z) = z · Φ(z)</text>
  <text x="510" y="590" font-family="Arial, sans-serif" font-size="9" fill="#34495e">Φ = Gaussian CDF</text>
  <text x="510" y="605" font-family="Arial, sans-serif" font-size="9" fill="#27ae60">✓ Smooth approximation</text>
  <text x="510" y="620" font-family="Arial, sans-serif" font-size="9" fill="#27ae60">✓ Probabilistic interpretation</text>
  <text x="510" y="635" font-family="Arial, sans-serif" font-size="9" fill="#27ae60">✓ Used in Transformers</text>
  <text x="510" y="650" font-family="Arial, sans-serif" font-size="9" fill="#34495e">State-of-the-art choice</text>
  
  <!-- Comparison Summary -->
  <rect x="710" y="380" width="240" height="280" rx="10" fill="#f8f9fa" stroke="#6c757d" stroke-width="2"/>
  <text x="830" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#495057">Selection Guide</text>
  
  <!-- Usage recommendations -->
  <rect x="730" y="430" width="200" height="220" rx="5" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  
  <text x="830" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">When to Use</text>
  
  <text x="740" y="470" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#3498db">Sigmoid:</text>
  <text x="740" y="485" font-family="Arial, sans-serif" font-size="9" fill="#34495e">• Binary classification output</text>
  <text x="740" y="498" font-family="Arial, sans-serif" font-size="9" fill="#34495e">• When probability needed</text>
  
  <text x="740" y="515" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#27ae60">Tanh:</text>
  <text x="740" y="530" font-family="Arial, sans-serif" font-size="9" fill="#34495e">• RNN/LSTM hidden layers</text>
  <text x="740" y="543" font-family="Arial, sans-serif" font-size="9" fill="#34495e">• Need zero-centered output</text>
  
  <text x="740" y="560" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#f39c12">ReLU:</text>
  <text x="740" y="575" font-family="Arial, sans-serif" font-size="9" fill="#34495e">• Hidden layers (default choice)</text>
  <text x="740" y="588" font-family="Arial, sans-serif" font-size="9" fill="#34495e">• Convolutional networks</text>
  
  <text x="740" y="605" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#9b59b6">Softmax:</text>
  <text x="740" y="620" font-family="Arial, sans-serif" font-size="9" fill="#34495e">• Multi-class classification</text>
  <text x="740" y="633" font-family="Arial, sans-serif" font-size="9" fill="#34495e">• Output layer only</text>
  
  <!-- Performance note -->
  <rect x="50" y="680" width="900" height="50" rx="5" fill="#e8f5e5" stroke="#4caf50" stroke-width="2"/>
  <text x="500" y="700" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Modern Trend: ReLU variants dominate hidden layers, while Softmax remains standard for multi-class outputs</text>
  <text x="500" y="720" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#388e3c">GELU and Swish are increasingly popular in state-of-the-art architectures like Transformers</text>
</svg>