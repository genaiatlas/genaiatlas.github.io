<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="categoryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f97316;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="resultGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="4" flood-color="#00000025"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="900" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="600" y="40" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#1e293b">
    AI Model Selection Framework
  </text>
  
  <!-- Start Decision -->
  <g transform="translate(600, 100)">
    <ellipse rx="120" ry="40" fill="url(#primaryGrad)" stroke="#4f46e5" stroke-width="2" filter="url(#dropShadow)"/>
    <text x="0" y="-5" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">What do you need?</text>
    <text x="0" y="12" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Select primary use case</text>
  </g>
  
  <!-- Main Categories Row -->
  <!-- Content Creation -->
  <g transform="translate(200, 220)">
    <rect x="-80" y="-25" width="160" height="50" rx="25" fill="url(#categoryGrad)" stroke="#d97706" stroke-width="2" filter="url(#dropShadow)"/>
    <text x="0" y="-5" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">Content Creation</text>
    <text x="0" y="10" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">Writing, Marketing</text>
  </g>
  
  <!-- Technical Work -->
  <g transform="translate(450, 220)">
    <rect x="-80" y="-25" width="160" height="50" rx="25" fill="url(#categoryGrad)" stroke="#d97706" stroke-width="2" filter="url(#dropShadow)"/>
    <text x="0" y="-5" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">Technical Work</text>
    <text x="0" y="10" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">Coding, Development</text>
  </g>
  
  <!-- Research -->
  <g transform="translate(700, 220)">
    <rect x="-80" y="-25" width="160" height="50" rx="25" fill="url(#categoryGrad)" stroke="#d97706" stroke-width="2" filter="url(#dropShadow)"/>
    <text x="0" y="-5" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">Research</text>
    <text x="0" y="10" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">Analysis, Documents</text>
  </g>
  
  <!-- Social Media -->
  <g transform="translate(950, 220)">
    <rect x="-80" y="-25" width="160" height="50" rx="25" fill="url(#categoryGrad)" stroke="#d97706" stroke-width="2" filter="url(#dropShadow)"/>
    <text x="0" y="-5" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">Social Media</text>
    <text x="0" y="10" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">Trends, Engagement</text>
  </g>
  
  <!-- Connection Lines from Start -->
  <g stroke="#94a3b8" stroke-width="2" fill="none">
    <path d="M 530 130 Q 400 150 250 190"/>
    <path d="M 580 130 Q 520 150 475 190"/>
    <path d="M 620 130 Q 680 150 725 190"/>
    <path d="M 670 130 Q 800 150 900 190"/>
  </g>
  
  <!-- Decision Questions Row -->
  <!-- Content: Team vs Individual -->
  <g transform="translate(150, 350)">
    <rect x="-50" y="-15" width="100" height="30" rx="15" fill="#fbbf24" stroke="#f59e0b" stroke-width="1"/>
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Team Work?</text>
  </g>
  
  <g transform="translate(250, 350)">
    <rect x="-50" y="-15" width="100" height="30" rx="15" fill="#fbbf24" stroke="#f59e0b" stroke-width="1"/>
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Social Focus?</text>
  </g>
  
  <!-- Technical: Budget vs Features -->
  <g transform="translate(400, 350)">
    <rect x="-50" y="-15" width="100" height="30" rx="15" fill="#fbbf24" stroke="#f59e0b" stroke-width="1"/>
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Low Cost?</text>
  </g>
  
  <g transform="translate(500, 350)">
    <rect x="-50" y="-15" width="100" height="30" rx="15" fill="#fbbf24" stroke="#f59e0b" stroke-width="1"/>
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Full Stack?</text>
  </g>
  
  <!-- Research: Length vs Ecosystem -->
  <g transform="translate(650, 350)">
    <rect x="-50" y="-15" width="100" height="30" rx="15" fill="#fbbf24" stroke="#f59e0b" stroke-width="1"/>
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Long Docs?</text>
  </g>
  
  <g transform="translate(750, 350)">
    <rect x="-50" y="-15" width="100" height="30" rx="15" fill="#fbbf24" stroke="#f59e0b" stroke-width="1"/>
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Google Tools?</text>
  </g>
  
  <!-- Connection Lines to Questions -->
  <g stroke="#94a3b8" stroke-width="1" fill="none">
    <line x1="200" y1="245" x2="175" y2="325"/>
    <line x1="200" y1="245" x2="225" y2="325"/>
    <line x1="450" y1="245" x2="425" y2="325"/>
    <line x1="450" y1="245" x2="475" y2="325"/>
    <line x1="700" y1="245" x2="675" y2="325"/>
    <line x1="700" y1="245" x2="725" y2="325"/>
  </g>
  
  <!-- Final Recommendations Row -->
  <!-- Gemini -->
  <g transform="translate(150, 480)">
    <rect x="-60" y="-30" width="120" height="60" rx="10" fill="url(#resultGrad)" stroke="#059669" stroke-width="2" filter="url(#dropShadow)"/>
    <circle cx="0" cy="-10" r="6" fill="#4285f4"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Gemini</text>
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">Team Collaboration</text>
  </g>
  
  <!-- Grok -->
  <g transform="translate(250, 480)">
    <rect x="-60" y="-30" width="120" height="60" rx="10" fill="url(#resultGrad)" stroke="#059669" stroke-width="2" filter="url(#dropShadow)"/>
    <circle cx="0" cy="-10" r="6" fill="#374151"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Grok</text>
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">Social Trends</text>
  </g>
  
  <!-- DeepSeek -->
  <g transform="translate(400, 480)">
    <rect x="-60" y="-30" width="120" height="60" rx="10" fill="url(#resultGrad)" stroke="#059669" stroke-width="2" filter="url(#dropShadow)"/>
    <circle cx="0" cy="-10" r="6" fill="#1e40af"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">DeepSeek</text>
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">Cost Effective</text>
  </g>
  
  <!-- ChatGPT -->
  <g transform="translate(500, 480)">
    <rect x="-60" y="-30" width="120" height="60" rx="10" fill="url(#resultGrad)" stroke="#059669" stroke-width="2" filter="url(#dropShadow)"/>
    <circle cx="0" cy="-10" r="6" fill="#10a37f"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">ChatGPT</text>
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">Full Featured</text>
  </g>
  
  <!-- Claude -->
  <g transform="translate(650, 480)">
    <rect x="-60" y="-30" width="120" height="60" rx="10" fill="url(#resultGrad)" stroke="#059669" stroke-width="2" filter="url(#dropShadow)"/>
    <circle cx="0" cy="-10" r="6" fill="#d97706"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Claude</text>
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">Deep Analysis</text>
  </g>
  
  <!-- Gemini Research -->
  <g transform="translate(750, 480)">
    <rect x="-60" y="-30" width="120" height="60" rx="10" fill="url(#resultGrad)" stroke="#059669" stroke-width="2" filter="url(#dropShadow)"/>
    <circle cx="0" cy="-10" r="6" fill="#4285f4"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Gemini</text>
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">Google Integration</text>
  </g>
  
  <!-- Grok Direct -->
  <g transform="translate(950, 380)">
    <rect x="-60" y="-30" width="120" height="60" rx="10" fill="url(#resultGrad)" stroke="#059669" stroke-width="2" filter="url(#dropShadow)"/>
    <circle cx="0" cy="-10" r="6" fill="#374151"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Grok</text>
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">Real-time Social</text>
  </g>
  
  <!-- Connection Lines to Results -->
  <g stroke="#94a3b8" stroke-width="1" fill="none">
    <line x1="150" y1="365" x2="150" y2="450"/>
    <line x1="250" y1="365" x2="250" y2="450"/>
    <line x1="400" y1="365" x2="400" y2="450"/>
    <line x1="500" y1="365" x2="500" y2="450"/>
    <line x1="650" y1="365" x2="650" y2="450"/>
    <line x1="750" y1="365" x2="750" y2="450"/>
    <line x1="950" y1="245" x2="950" y2="350"/>
  </g>
  
  <!-- Yes/No Labels -->
  <g font-family="Arial, sans-serif" font-size="9" fill="#6b7280">
    <text x="125" y="340">Yes</text>
    <text x="225" y="340">No</text>
    <text x="375" y="340">Yes</text>
    <text x="475" y="340">No</text>
    <text x="625" y="340">Yes</text>
    <text x="725" y="340">No</text>
  </g>
  
  <!-- Summary Box -->
  <g transform="translate(50, 600)">
    <rect x="0" y="0" width="1100" height="250" fill="white" stroke="#e2e8f0" stroke-width="2" rx="10" filter="url(#dropShadow)"/>
    <text x="550" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1e293b">
      Key Selection Factors
    </text>
    
    <!-- Budget Column -->
    <g transform="translate(80, 60)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#374151">Budget Priority</text>
      <g font-family="Arial, sans-serif" font-size="11" fill="#64748b">
        <text x="0" y="25">Most Affordable: DeepSeek</text>
        <text x="0" y="45">Best Free Access: Gemini</text>
        <text x="0" y="65">Premium Value: ChatGPT Plus</text>
        <text x="0" y="85">Enterprise: Custom pricing available</text>
      </g>
    </g>
    
    <!-- Integration Column -->
    <g transform="translate(320, 60)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#374151">Platform Integration</text>
      <g font-family="Arial, sans-serif" font-size="11" fill="#64748b">
        <text x="0" y="25">Google Workspace: Gemini</text>
        <text x="0" y="45">Third-party APIs: ChatGPT</text>
        <text x="0" y="65">Social Media: Grok (X platform)</text>
        <text x="0" y="85">Custom Development: All models</text>
      </g>
    </g>
    
    <!-- Performance Column -->
    <g transform="translate(580, 60)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#374151">Performance Focus</text>
      <g font-family="Arial, sans-serif" font-size="11" fill="#64748b">
        <text x="0" y="25">Speed: DeepSeek, Grok</text>
        <text x="0" y="45">Accuracy: Claude</text>
        <text x="0" y="65">Versatility: ChatGPT</text>
        <text x="0" y="85">Context Length: Claude</text>
      </g>
    </g>
    
    <!-- Use Case Column -->
    <g transform="translate(820, 60)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#374151">Best Use Cases</text>
      <g font-family="Arial, sans-serif" font-size="11" fill="#64748b">
        <text x="0" y="25">Content Creation: ChatGPT</text>
        <text x="0" y="45">Code Development: DeepSeek</text>
        <text x="0" y="65">Research Analysis: Claude</text>
        <text x="0" y="85">Social Media: Grok</text>
      </g>
    </g>
    
    <!-- Bottom Summary -->
    <g transform="translate(80, 170)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">Quick Decision Guide:</text>
      <g font-family="Arial, sans-serif" font-size="11" fill="#475569">
        <text x="0" y="25">Need everything? → ChatGPT | Budget conscious? → DeepSeek | Google user? → Gemini</text>
        <text x="0" y="45">Long documents? → Claude | Social media? → Grok | Team collaboration? → Gemini</text>
      </g>
    </g>
  </g>
  
  <!-- Legend -->
  <g transform="translate(50, 50)">
    <g font-family="Arial, sans-serif" font-size="11" fill="#64748b">
      <text x="0" y="0">Decision Framework: Select your primary need → Answer key questions → Get model recommendation</text>
    </g>
  </g>
</svg>