<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">Bootstrap Sampling Process</text>
  
  <!-- Original Dataset -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="200" height="300" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="10"/>
    <text x="100" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1976d2">Original Dataset D</text>
    <text x="100" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1976d2">n = 12 samples</text>
    
    <!-- Data points -->
    <g font-family="Arial, sans-serif" font-size="11" fill="#424242">
      <text x="20" y="70">X₁: Thai, Hungry=No, Rain=Yes → Wait</text>
      <text x="20" y="90">X₂: Thai, Hungry=Yes, Rain=No → No</text>
      <text x="20" y="110">X₃: Burger, Hungry=No, Rain=No → Yes</text>
      <text x="20" y="130">X₄: Thai, Hungry=Yes, Rain=No → Yes</text>
      <text x="20" y="150">X₅: French, Hungry=No, Rain=Yes → No</text>
      <text x="20" y="170">X₆: Italian, Hungry=Yes, Rain=Yes → Yes</text>
      <text x="20" y="190">X₇: Burger, Hungry=No, Rain=No → No</text>
      <text x="20" y="210">X₈: Thai, Hungry=Yes, Rain=Yes → Yes</text>
      <text x="20" y="230">X₉: Burger, Hungry=Yes, Rain=No → No</text>
      <text x="20" y="250">X₁₀: Italian, Hungry=Yes, Rain=Yes → No</text>
      <text x="20" y="270">X₁₁: Thai, Hungry=No, Rain=No → No</text>
      <text x="20" y="290">X₁₂: Burger, Hungry=Yes, Rain=No → Yes</text>
    </g>
  </g>
  
  <!-- Arrow 1 -->
  <path d="M 270 180 Q 320 160 370 140" stroke="#e74c3c" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="320" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#e74c3c">Sample with</text>
  <text x="320" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#e74c3c">replacement</text>
  
  <!-- Bootstrap Sample 1 -->
  <g transform="translate(380, 60)">
    <rect x="0" y="0" width="160" height="160" fill="#fff3e0" stroke="#f57c00" stroke-width="2" rx="8"/>
    <text x="80" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f57c00">Bootstrap B₁</text>
    <text x="80" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#f57c00">k = 5 samples</text>
    
    <g font-family="Arial, sans-serif" font-size="10" fill="#424242">
      <text x="15" y="60">X₁₁ (selected)</text>
      <text x="15" y="80">X₁₂ (selected)</text>
      <text x="15" y="100">X₇ (selected)</text>
      <text x="15" y="120">X₂ (selected)</text>
      <text x="15" y="140">X₁₂ (duplicate!)</text>
    </g>
  </g>
  
  <!-- Arrow 2 -->
  <path d="M 270 200 Q 320 200 370 200" stroke="#e74c3c" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Bootstrap Sample 2 -->
  <g transform="translate(380, 180)">
    <rect x="0" y="0" width="160" height="160" fill="#fff3e0" stroke="#f57c00" stroke-width="2" rx="8"/>
    <text x="80" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f57c00">Bootstrap B₂</text>
    <text x="80" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#f57c00">k = 5 samples</text>
    
    <g font-family="Arial, sans-serif" font-size="10" fill="#424242">
      <text x="15" y="60">X₅ (selected)</text>
      <text x="15" y="80">X₄ (selected)</text>
      <text x="15" y="100">X₆ (selected)</text>
      <text x="15" y="120">X₈ (selected)</text>
      <text x="15" y="140">X₇ (selected)</text>
    </g>
  </g>
  
  <!-- Arrow 3 -->
  <path d="M 270 250 Q 320 270 370 290" stroke="#e74c3c" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Bootstrap Sample 3 -->
  <g transform="translate(380, 300)">
    <rect x="0" y="0" width="160" height="160" fill="#fff3e0" stroke="#f57c00" stroke-width="2" rx="8"/>
    <text x="80" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f57c00">Bootstrap B₃</text>
    <text x="80" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#f57c00">k = 5 samples</text>
    
    <g font-family="Arial, sans-serif" font-size="10" fill="#424242">
      <text x="15" y="60">X₉ (selected)</text>
      <text x="15" y="80">X₁₀ (selected)</text>
      <text x="15" y="100">X₄ (selected)</text>
      <text x="15" y="120">X₂ (selected)</text>
      <text x="15" y="140">X₁₀ (duplicate!)</text>
    </g>
  </g>
  
  <!-- Arrow to Decision Trees -->
  <path d="M 560 200 Q 610 200 660 200" stroke="#27ae60" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="610" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#27ae60">Train separate</text>
  <text x="610" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#27ae60">decision trees</text>
  
  <!-- Decision Trees -->
  <g transform="translate(680, 80)">
    <rect x="0" y="0" width="250" height="400" fill="#e8f5e8" stroke="#27ae60" stroke-width="2" rx="10"/>
    <text x="125" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#27ae60">Decision Trees</text>
    
    <!-- Tree 1 -->
    <g transform="translate(20, 50)">
      <circle cx="100" cy="30" r="15" fill="#4caf50" stroke="#2e7d32"/>
      <text x="100" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Type</text>
      <text x="50" y="65" font-family="Arial, sans-serif" font-size="9" fill="#424242">Thai</text>
      <text x="150" y="65" font-family="Arial, sans-serif" font-size="9" fill="#424242">Burger</text>
      <rect x="35" y="70" width="30" height="20" fill="#ff5722" rx="3"/>
      <text x="50" y="83" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">Leave</text>
      <rect x="135" y="70" width="30" height="20" fill="#2196f3" rx="3"/>
      <text x="150" y="83" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">Wait</text>
      <line x1="85" y1="40" x2="50" y2="70" stroke="#424242" stroke-width="1"/>
      <line x1="115" y1="40" x2="150" y2="70" stroke="#424242" stroke-width="1"/>
      <text x="100" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#27ae60">Tree 1 (Loss: 0.55)</text>
    </g>
    
    <!-- Tree 2 -->
    <g transform="translate(20, 170)">
      <circle cx="100" cy="30" r="15" fill="#4caf50" stroke="#2e7d32"/>
      <text x="100" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Hungry</text>
      <text x="50" y="65" font-family="Arial, sans-serif" font-size="9" fill="#424242">Yes</text>
      <text x="150" y="65" font-family="Arial, sans-serif" font-size="9" fill="#424242">No</text>
      <rect x="35" y="70" width="30" height="20" fill="#2196f3" rx="3"/>
      <text x="50" y="83" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">Wait</text>
      <rect x="135" y="70" width="30" height="20" fill="#ff5722" rx="3"/>
      <text x="150" y="83" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">Leave</text>
      <line x1="85" y1="40" x2="50" y2="70" stroke="#424242" stroke-width="1"/>
      <line x1="115" y1="40" x2="150" y2="70" stroke="#424242" stroke-width="1"/>
      <text x="100" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#27ae60">Tree 2 (Loss: 0.0)</text>
    </g>
    
    <!-- Tree 3 -->
    <g transform="translate(20, 290)">
      <circle cx="100" cy="30" r="15" fill="#4caf50" stroke="#2e7d32"/>
      <text x="100" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Rain</text>
      <text x="50" y="65" font-family="Arial, sans-serif" font-size="9" fill="#424242">Yes</text>
      <text x="150" y="65" font-family="Arial, sans-serif" font-size="9" fill="#424242">No</text>
      <rect x="35" y="70" width="30" height="20" fill="#2196f3" rx="3"/>
      <text x="50" y="83" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">Wait</text>
      <rect x="135" y="70" width="30" height="20" fill="#ff5722" rx="3"/>
      <text x="150" y="83" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">Leave</text>
      <line x1="85" y1="40" x2="50" y2="70" stroke="#424242" stroke-width="1"/>
      <line x1="115" y1="40" x2="150" y2="70" stroke="#424242" stroke-width="1"/>
      <text x="100" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#27ae60">Tree 3 (Loss: 0.4)</text>
    </g>
  </g>
  
  <!-- Mathematical Formula -->
  <g transform="translate(50, 480)">
    <rect x="0" y="0" width="900" height="80" fill="#fff" stroke="#9e9e9e" stroke-width="1" rx="5" stroke-dasharray="5,5"/>
    <text x="20" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#424242">Bootstrap Sampling Formula:</text>
    <text x="20" y="50" font-family="Arial, sans-serif" font-size="12" fill="#424242">P(sample i selected at least once) = 1 - (1 - 1/n)ᵏ ≈ 1 - e^(-k/n)</text>
    <text x="20" y="70" font-family="Arial, sans-serif" font-size="12" fill="#424242">For n=12, k=5: P ≈ 0.34 (about 1/3 of original samples appear in each bootstrap)</text>
  </g>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
  </defs>
</svg>