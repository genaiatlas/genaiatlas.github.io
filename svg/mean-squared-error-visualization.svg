<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title-text { font-family: 'Arial', sans-serif; font-size: 24px; font-weight: bold; fill: #2c3e50; }
      .equation-text { font-family: 'Times New Roman', serif; font-size: 18px; fill: #2c3e50; }
      .label-text { font-family: 'Arial', sans-serif; font-size: 14px; fill: #34495e; }
      .small-text { font-family: 'Arial', sans-serif; font-size: 12px; fill: #7f8c8d; }
      .axis-line { stroke: #2c3e50; stroke-width: 2; }
      .grid-line { stroke: #ecf0f1; stroke-width: 1; }
      .data-point { fill: #3498db; stroke: #2980b9; stroke-width: 2; }
      .regression-line { stroke: #e74c3c; stroke-width: 3; fill: none; }
      .error-line { stroke: #e67e22; stroke-width: 2; stroke-dasharray: 3,3; }
      .error-square { fill: rgba(231, 76, 60, 0.2); stroke: #e74c3c; stroke-width: 1; }
      .highlight-box { fill: #f8f9fa; stroke: #e9ecef; stroke-width: 2; rx: 5; }
    </style>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title-text">Mean Squared Error Visualization</text>
  
  <!-- Left side: Error visualization -->
  <g transform="translate(50, 80)">
    <text x="150" y="0" text-anchor="middle" class="label-text">Individual Squared Errors</text>
    
    <!-- Coordinate system -->
    <g transform="translate(50, 50)">
      <!-- Grid lines -->
      <line x1="0" y1="20" x2="250" y2="20" class="grid-line"/>
      <line x1="0" y1="60" x2="250" y2="60" class="grid-line"/>
      <line x1="0" y1="100" x2="250" y2="100" class="grid-line"/>
      <line x1="0" y1="140" x2="250" y2="140" class="grid-line"/>
      <line x1="0" y1="180" x2="250" y2="180" class="grid-line"/>
      
      <line x1="50" y1="0" x2="50" y2="200" class="grid-line"/>
      <line x1="100" y1="0" x2="100" y2="200" class="grid-line"/>
      <line x1="150" y1="0" x2="150" y2="200" class="grid-line"/>
      <line x1="200" y1="0" x2="200" y2="200" class="grid-line"/>
      
      <!-- Axes -->
      <line x1="0" y1="200" x2="250" y2="200" class="axis-line"/>
      <line x1="0" y1="0" x2="0" y2="200" class="axis-line"/>
      
      <!-- Axis labels -->
      <text x="125" y="220" text-anchor="middle" class="small-text">X</text>
      <text x="-15" y="105" text-anchor="middle" class="small-text" transform="rotate(-90, -15, 105)">Y</text>
      
      <!-- Regression line -->
      <line x1="20" y1="170" x2="230" y2="30" class="regression-line"/>
      
      <!-- Data points and errors -->
      <!-- Point 1 -->
      <circle cx="60" cy="120" r="4" class="data-point"/>
      <line x1="60" y1="120" x2="60" y2="154" class="error-line"/>
      <rect x="56" y="120" width="8" height="34" class="error-square"/>
      <text x="70" y="115" class="small-text">e₁²</text>
      
      <!-- Point 2 -->
      <circle cx="100" cy="80" r="4" class="data-point"/>
      <line x1="100" y1="80" x2="100" y2="130" class="error-line"/>
      <rect x="96" y="80" width="8" height="50" class="error-square"/>
      <text x="110" y="75" class="small-text">e₂²</text>
      
      <!-- Point 3 -->
      <circle cx="140" cy="110" r="4" class="data-point"/>
      <line x1="140" y1="110" x2="140" y2="106" class="error-line"/>
      <rect x="136" y="106" width="8" height="4" class="error-square"/>
      <text x="150" y="105" class="small-text">e₃²</text>
      
      <!-- Point 4 -->
      <circle cx="180" cy="60" r="4" class="data-point"/>
      <line x1="180" y1="60" x2="180" y2="82" class="error-line"/>
      <rect x="176" y="60" width="8" height="22" class="error-square"/>
      <text x="190" y="55" class="small-text">e₄²</text>
      
      <!-- Point 5 -->
      <circle cx="220" cy="50" r="4" class="data-point"/>
      <line x1="220" y1="50" x2="220" y2="58" class="error-line"/>
      <rect x="216" y="50" width="8" height="8" class="error-square"/>
      <text x="230" y="45" class="small-text">e₅²</text>
      
      <!-- Legend -->
      <g transform="translate(10, 10)">
        <circle cx="0" cy="0" r="3" class="data-point"/>
        <text x="10" y="4" class="small-text">Actual data</text>
        <line x1="0" y1="15" x2="20" y2="15" class="regression-line"/>
        <text x="25" y="19" class="small-text">Prediction line</text>
        <rect x="0" y="25" width="8" height="8" class="error-square"/>
        <text x="15" y="33" class="small-text">Squared error</text>
      </g>
    </g>
  </g>
  
  <!-- Right side: Mathematical formulation -->
  <g transform="translate(450, 80)">
    <text x="150" y="0" text-anchor="middle" class="label-text">Mathematical Formulation</text>
    
    <!-- Individual error -->
    <g transform="translate(0, 40)">
      <rect x="-10" y="-15" width="320" height="35" class="highlight-box"/>
      <text x="10" y="5" class="equation-text">Error for point i: eᵢ = ŷᵢ - yᵢ</text>
    </g>
    
    <!-- Squared error -->
    <g transform="translate(0, 90)">
      <rect x="-10" y="-15" width="320" height="35" class="highlight-box"/>
      <text x="10" y="5" class="equation-text">Squared error: eᵢ² = (ŷᵢ - yᵢ)²</text>
    </g>
    
    <!-- Sum of squared errors -->
    <g transform="translate(0, 140)">
      <rect x="-10" y="-15" width="320" height="35" class="highlight-box"/>
      <text x="10" y="5" class="equation-text">Sum of squares: SSE = Σᵢ₌₁ⁿ (ŷᵢ - yᵢ)²</text>
    </g>
    
    <!-- Mean squared error -->
    <g transform="translate(0, 190)">
      <rect x="-10" y="-15" width="320" height="35" class="highlight-box"/>
      <text x="10" y="5" class="equation-text">Mean squared error: MSE = (1/n)Σᵢ₌₁ⁿ (ŷᵢ - yᵢ)²</text>
    </g>
    
    <!-- Why squared errors? -->
    <g transform="translate(0, 250)">
      <text x="0" y="0" class="label-text">Why Squared Errors?</text>
      <text x="0" y="25" class="small-text">✓ Penalizes large errors more heavily</text>
      <text x="0" y="45" class="small-text">✓ Always positive (no cancellation)</text>
      <text x="0" y="65" class="small-text">✓ Mathematically convenient (differentiable)</text>
      <text x="0" y="85" class="small-text">✓ Leads to closed-form solutions</text>
      <text x="0" y="105" class="small-text">✓ Statistical optimality under normality</text>
    </g>
  </g>
  
  <!-- Bottom: Objective function -->
  <g transform="translate(400, 520)">
    <rect x="-350" y="-25" width="700" height="50" class="highlight-box"/>
    <text x="0" y="5" text-anchor="middle" class="equation-text">Objective: min θ (1/n) Σᵢ₌₁ⁿ (θᵀxᵢ - yᵢ)²</text>
  </g>
</svg>