<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
    <!-- Coordinate system -->
    <line x1="100" y1="300" x2="700" y2="300" stroke="black" stroke-width="2"/>
    <!-- y-axis (optional, not shown in original) -->
    <line x1="400" y1="50" x2="400" y2="320" stroke="black" stroke-width="1" stroke-dasharray="5,5"/>
    
    <!-- Normal distribution curve -->
    <path d="M 100,300 
             Q 150,290 200,260 
             Q 250,230 300,180 
             Q 350,130 400,100 
             Q 450,130 500,180 
             Q 550,230 600,260 
             Q 650,290 700,300" 
          fill="none" stroke="#4B6CB7" stroke-width="3"/>
    
    <!-- Confidence interval indicators -->
    <line x1="300" y1="300" x2="300" y2="180" stroke="#FF5370" stroke-width="2"/>
    <line x1="500" y1="300" x2="500" y2="180" stroke="#FF5370" stroke-width="2"/>
    
    <!-- Red interval line -->
    <line x1="300" y1="300" x2="500" y2="300" stroke="#FF5370" stroke-width="4"/>
    
    <!-- Center indicator for θ*j -->
    <line x1="400" y1="300" x2="400" y2="310" stroke="black" stroke-width="2"/>
    <circle cx="400" cy="300" r="5" fill="#FF5370"/>
    
    <!-- Labels -->
    <text x="290" y="320" font-family="Arial" font-size="14" text-anchor="middle">θ̂j - 2σj</text>
    <text x="510" y="320" font-family="Arial" font-size="14" text-anchor="middle">θ̂j + 2σj</text>
    <text x="400" y="330" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">θ*j</text>
    
    <!-- Probability labels -->
    <text x="250" y="200" font-family="Arial" font-size="14" text-anchor="middle">2.5%</text>
    <text x="550" y="200" font-family="Arial" font-size="14" text-anchor="middle">2.5%</text>
    <text x="400" y="80" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold">0.95</text>
    
    <!-- Title -->
    <text x="400" y="40" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">95% Confidence Interval</text>
    
    <!-- Additional notation -->
    <text x="400" y="380" font-family="Arial" font-size="16" text-anchor="middle" font-style="italic">P(θ*j ∈ CI) ≈ 0.95</text>
</svg>