<svg viewBox="0 0 1400 1050" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1400" height="1050" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="700" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Output Formatting Strategies
  </text>
  <text x="700" y="70" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#495057">
    Structuring Responses for Optimal Readability and Usability
  </text>
  
  <!-- Input: Raw Response -->
  <rect x="50" y="110" width="200" height="80" rx="10" fill="#e9ecef" stroke="#495057" stroke-width="2"/>
  <text x="150" y="140" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    📝 Raw Response
  </text>
  <text x="150" y="165" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#868e96">
    Unformatted text
  </text>
  <text x="150" y="180" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#868e96">
    from LLM
  </text>
  
  <!-- Arrow -->
  <path d="M 250 150 L 320 150" stroke="#495057" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Formatting Pipeline -->
  <rect x="320" y="110" width="1030" height="850" rx="15" fill="#d0ebff" stroke="#1c7ed6" stroke-width="4"/>
  <text x="835" y="150" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Output Formatting Pipeline
  </text>
  
  <!-- Format 1: Structured Response -->
  <g id="structured">
    <rect x="350" y="180" width="470" height="200" rx="10" fill="#fff" stroke="#1c7ed6" stroke-width="3"/>
    <text x="585" y="215" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1c7ed6">
      1️⃣ Structured Response Format
    </text>
    
    <rect x="370" y="235" width="430" height="130" rx="8" fill="#f8f9fa" stroke="#1c7ed6" stroke-width="1"/>
    <text x="380" y="252" font-family="Courier, monospace" font-size="9" font-weight="bold" fill="#1c7ed6">
      Summary:
    </text>
    <text x="380" y="267" font-family="Courier, monospace" font-size="9" fill="#495057">
      [2-3 sentence overview of the answer]
    </text>
    
    <text x="380" y="287" font-family="Courier, monospace" font-size="9" font-weight="bold" fill="#1c7ed6">
      Detailed Answer:
    </text>
    <text x="380" y="302" font-family="Courier, monospace" font-size="9" fill="#495057">
      • Point 1: [explanation with details]
    </text>
    <text x="380" y="317" font-family="Courier, monospace" font-size="9" fill="#495057">
      • Point 2: [explanation with details]
    </text>
    
    <text x="380" y="337" font-family="Courier, monospace" font-size="9" font-weight="bold" fill="#1c7ed6">
      Conclusion:
    </text>
    <text x="380" y="352" font-family="Courier, monospace" font-size="9" fill="#495057">
      [Key takeaway or recommendation]
    </text>
  </g>
  
  <!-- Format 2: Markdown Formatting -->
  <g id="markdown">
    <rect x="850" y="180" width="470" height="200" rx="10" fill="#fff" stroke="#1c7ed6" stroke-width="3"/>
    <text x="1085" y="215" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1c7ed6">
      2️⃣ Markdown Enhancement
    </text>
    
    <rect x="870" y="235" width="430" height="130" rx="8" fill="#f8f9fa" stroke="#1c7ed6" stroke-width="1"/>
    <text x="880" y="252" font-family="Courier, monospace" font-size="9" fill="#495057">
      # Main Heading
    </text>
    <text x="880" y="267" font-family="Courier, monospace" font-size="9" fill="#495057">
      **Bold** for emphasis, *italic* for definitions
    </text>
    <text x="880" y="282" font-family="Courier, monospace" font-size="9" fill="#495057">
      `code blocks` for technical content
    </text>
    <text x="880" y="297" font-family="Courier, monospace" font-size="9" fill="#495057">
      > Blockquotes for citations
    </text>
    <text x="880" y="312" font-family="Courier, monospace" font-size="9" fill="#495057">
      - Bullet lists for clarity
    </text>
    <text x="880" y="327" font-family="Courier, monospace" font-size="9" fill="#495057">
      | Tables | For | Comparisons |
    </text>
    <text x="880" y="342" font-family="Courier, monospace" font-size="9" fill="#495057">
      [Links](url) for references
    </text>
    <text x="880" y="357" font-family="Courier, monospace" font-size="9" fill="#37b24d">
      ✓ Enhanced readability!
    </text>
  </g>
  
  <!-- Format 3: Citation Formats -->
  <g id="citations">
    <rect x="350" y="400" width="970" height="240" rx="10" fill="#fff" stroke="#fab005" stroke-width="3"/>
    <text x="835" y="435" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#fab005">
      3️⃣ Citation Formats
    </text>
    
    <!-- Inline Citations -->
    <rect x="370" y="455" width="290" height="165" rx="8" fill="#fff9db" stroke="#fab005" stroke-width="2"/>
    <text x="515" y="480" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#fab005">
      Inline Citations
    </text>
    <rect x="385" y="490" width="260" height="110" rx="5" fill="#f8f9fa" stroke="#fab005" stroke-width="1"/>
    <text x="395" y="507" font-family="Courier, monospace" font-size="8" fill="#495057">
      RAG combines retrieval and
    </text>
    <text x="395" y="522" font-family="Courier, monospace" font-size="8" fill="#495057">
      generation [1]. It improves
    </text>
    <text x="395" y="537" font-family="Courier, monospace" font-size="8" fill="#495057">
      accuracy [2,3] and reduces
    </text>
    <text x="395" y="552" font-family="Courier, monospace" font-size="8" fill="#495057">
      hallucinations [1,4].
    </text>
    <text x="395" y="567" font-family="Courier, monospace" font-size="8" fill="#495057">
      
    </text>
    <text x="395" y="582" font-family="Courier, monospace" font-size="8" font-weight="bold" fill="#fab005">
      Sources:
    </text>
    <text x="395" y="595" font-family="Courier, monospace" font-size="7" fill="#495057">
      [1] Smith et al., 2024
    </text>
  
    <!-- Footnote Citations -->
    <rect x="680" y="455" width="290" height="165" rx="8" fill="#fff9db" stroke="#fab005" stroke-width="2"/>
    <text x="825" y="480" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#fab005">
      Footnote Citations
    </text>
    <rect x="695" y="490" width="260" height="110" rx="5" fill="#f8f9fa" stroke="#fab005" stroke-width="1"/>
    <text x="705" y="507" font-family="Courier, monospace" font-size="8" fill="#495057">
      RAG systems retrieve docs¹
    </text>
    <text x="705" y="522" font-family="Courier, monospace" font-size="8" fill="#495057">
      before generating responses².
    </text>
    <text x="705" y="537" font-family="Courier, monospace" font-size="8" fill="#495057">
      This improves accuracy³.
    </text>
    <text x="705" y="552" font-family="Courier, monospace" font-size="8" fill="#495057">
      ---
    </text>
    <text x="705" y="567" font-family="Courier, monospace" font-size="7" fill="#495057">
      ¹ "Intro to RAG", paper.pdf
    </text>
    <text x="705" y="580" font-family="Courier, monospace" font-size="7" fill="#495057">
      ² "Generation", blog.html
    </text>
    <text x="705" y="593" font-family="Courier, monospace" font-size="7" fill="#495057">
      ³ "RAG Eval", journal.pdf
    </text>
    
    <!-- Bracketed References -->
    <rect x="990" y="455" width="310" height="165" rx="8" fill="#fff9db" stroke="#fab005" stroke-width="2"/>
    <text x="1145" y="480" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#fab005">
      Bracketed References
    </text>
    <rect x="1005" y="490" width="280" height="110" rx="5" fill="#f8f9fa" stroke="#fab005" stroke-width="1"/>
    <text x="1015" y="507" font-family="Courier, monospace" font-size="8" fill="#495057">
      According to recent research
    </text>
    <text x="1015" y="522" font-family="Courier, monospace" font-size="8" fill="#495057">
      [research-paper.pdf], RAG
    </text>
    <text x="1015" y="537" font-family="Courier, monospace" font-size="8" fill="#495057">
      systems show 40% improvement
    </text>
    <text x="1015" y="552" font-family="Courier, monospace" font-size="8" fill="#495057">
      in accuracy [benchmark.pdf,
    </text>
    <text x="1015" y="567" font-family="Courier, monospace" font-size="8" fill="#495057">
      page 12].
    </text>
    <text x="1015" y="595" font-family="Courier, monospace" font-size="7" fill="#37b24d">
      ✓ Most explicit format
    </text>
  </g>
  
  <!-- Format 4: Visual Enhancement -->
  <g id="visual">
    <rect x="350" y="660" width="470" height="130" rx="10" fill="#fff" stroke="#37b24d" stroke-width="3"/>
    <text x="585" y="695" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#37b24d">
      4️⃣ Visual Enhancement
    </text>
    
    <rect x="370" y="715" width="430" height="60" rx="8" fill="#d3f9d8" stroke="#37b24d" stroke-width="1"/>
    <text x="380" y="732" font-family="Courier, monospace" font-size="9" fill="#495057">
      ✅ Benefits: • Improved accuracy • Reduced hallucinations
    </text>
    <text x="380" y="747" font-family="Courier, monospace" font-size="9" fill="#495057">
      ⚠️ Limitations: • Context window • Retrieval dependency
    </text>
    <text x="380" y="762" font-family="Courier, monospace" font-size="9" fill="#495057">
      💡 Tip: Use emojis strategically for scannable content
    </text>
  </g>
  
  <!-- Format 5: Hierarchical Structure -->
  <g id="hierarchical">
    <rect x="850" y="660" width="470" height="130" rx="10" fill="#fff" stroke="#37b24d" stroke-width="3"/>
    <text x="1085" y="695" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#37b24d">
      5️⃣ Hierarchical Structure
    </text>
    
    <rect x="870" y="715" width="430" height="60" rx="8" fill="#d3f9d8" stroke="#37b24d" stroke-width="1"/>
    <text x="880" y="732" font-family="Courier, monospace" font-size="9" fill="#495057">
      # Main Topic
    </text>
    <text x="880" y="747" font-family="Courier, monospace" font-size="9" fill="#495057">
        ## Subtopic 1  →  ### Detail A  →  ### Detail B
    </text>
    <text x="880" y="762" font-family="Courier, monospace" font-size="9" fill="#495057">
        ## Subtopic 2  →  ### Detail C
    </text>
  </g>
  
  <!-- Best Practices Section -->
  <rect x="350" y="810" width="970" height="130" rx="10" fill="#e9d5ff" stroke="#9333ea" stroke-width="3"/>
  <text x="835" y="845" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#9333ea">
    💡 Formatting Best Practices
  </text>
  
  <text x="370" y="875" font-family="Arial, sans-serif" font-size="11" fill="#495057">
    ✓ Consistent style throughout • ✓ Clear hierarchy and logical organization • ✓ Use white space for readability
  </text>
  <text x="370" y="895" font-family="Arial, sans-serif" font-size="11" fill="#495057">
    ✓ Scannable content (bullets, headers) • ✓ Accessible formatting (proper contrast, semantic markup)
  </text>
  <text x="370" y="915" font-family="Arial, sans-serif" font-size="11" fill="#495057">
    ✓ Mobile-friendly layout • ✓ Appropriate formatting for audience • ✓ Balance aesthetics with clarity
  </text>
  
  <!-- Output Arrow -->
  <path d="M 835 960 L 835 1000" stroke="#37b24d" stroke-width="3" fill="none" marker-end="url(#arrowhead2)"/>
  
  <!-- Final Output -->
  <rect x="535" y="1000" width="600" height="40" rx="10" fill="#d3f9d8" stroke="#37b24d" stroke-width="3"/>
  <text x="835" y="1027" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#37b24d">
    ✅ Well-Formatted Response - Ready for Delivery
  </text>
  
  <!-- Format Comparison -->
  <rect x="50" y="220" width="240" height="370" rx="10" fill="#fff3bf" stroke="#fcc419" stroke-width="2"/>
  <text x="170" y="255" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    📊 Format Comparison
  </text>
  
  <text x="70" y="285" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#495057">
    Simple Text:
  </text>
  <text x="70" y="303" font-family="Arial, sans-serif" font-size="9" fill="#495057">
    Fast, no frills
  </text>
  <text x="70" y="318" font-family="Arial, sans-serif" font-size="9" fill="#e03131">
    ✗ Hard to scan
  </text>
  
  <text x="70" y="345" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#495057">
    Structured:
  </text>
  <text x="70" y="363" font-family="Arial, sans-serif" font-size="9" fill="#37b24d">
    ✓ Clear sections
  </text>
  <text x="70" y="378" font-family="Arial, sans-serif" font-size="9" fill="#37b24d">
    ✓ Easy navigation
  </text>
  
  <text x="70" y="405" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#495057">
    Markdown:
  </text>
  <text x="70" y="423" font-family="Arial, sans-serif" font-size="9" fill="#37b24d">
    ✓ Rich formatting
  </text>
  <text x="70" y="438" font-family="Arial, sans-serif" font-size="9" fill="#37b24d">
    ✓ Professional look
  </text>
  
  <text x="70" y="465" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#495057">
    With Citations:
  </text>
  <text x="70" y="483" font-family="Arial, sans-serif" font-size="9" fill="#37b24d">
    ✓ Credible
  </text>
  <text x="70" y="498" font-family="Arial, sans-serif" font-size="9" fill="#37b24d">
    ✓ Verifiable
  </text>
  
  <text x="70" y="525" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#495057">
    Visual Enhancement:
  </text>
  <text x="70" y="543" font-family="Arial, sans-serif" font-size="9" fill="#37b24d">
    ✓ Eye-catching
  </text>
  <text x="70" y="558" font-family="Arial, sans-serif" font-size="9" fill="#37b24d">
    ✓ Quick insights
  </text>
  <text x="70" y="573" font-family="Arial, sans-serif" font-size="9" fill="#e03131">
    ✗ Can be overused
  </text>
  
  <!-- Key Insight -->
  <rect x="50" y="620" width="240" height="340" rx="10" fill="#d3f9d8" stroke="#37b24d" stroke-width="2"/>
  <text x="170" y="655" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#37b24d">
    🎯 Key Insights
  </text>
  
  <text x="70" y="685" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#495057">
    Format for Audience:
  </text>
  <text x="70" y="703" font-family="Arial, sans-serif" font-size="9" fill="#495057">
    • Technical users: Code
  </text>
  <text x="70" y="718" font-family="Arial, sans-serif" font-size="9" fill="#495057">
    blocks, precise citations
  </text>
  <text x="70" y="733" font-family="Arial, sans-serif" font-size="9" fill="#495057">
    • General users: Simple,
  </text>
  <text x="70" y="748" font-family="Arial, sans-serif" font-size="9" fill="#495057">
    scannable format
  </text>
  
  <text x="70" y="775" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#495057">
    Balance is Key:
  </text>
  <text x="70" y="793" font-family="Arial, sans-serif" font-size="9" fill="#495057">
    Too much formatting =
  </text>
  <text x="70" y="808" font-family="Arial, sans-serif" font-size="9" fill="#495057">
    visual clutter
  </text>
  <text x="70" y="823" font-family="Arial, sans-serif" font-size="9" fill="#495057">
    Too little = hard to read
  </text>
  
  <text x="70" y="850" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#495057">
    Always Include:
  </text>
  <text x="70" y="868" font-family="Arial, sans-serif" font-size="9" fill="#495057">
    1. Clear structure
  </text>
  <text x="70" y="883" font-family="Arial, sans-serif" font-size="9" fill="#495057">
    2. Proper citations
  </text>
  <text x="70" y="898" font-family="Arial, sans-serif" font-size="9" fill="#495057">
    3. White space
  </text>
  <text x="70" y="913" font-family="Arial, sans-serif" font-size="9" fill="#495057">
    4. Logical flow
  </text>
  <text x="70" y="928" font-family="Arial, sans-serif" font-size="9" fill="#495057">
    5. Emphasis on key
  </text>
  <text x="70" y="943" font-family="Arial, sans-serif" font-size="9" fill="#495057">
    points
  </text>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#495057"/>
    </marker>
    <marker id="arrowhead2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#37b24d"/>
    </marker>
  </defs>
</svg>