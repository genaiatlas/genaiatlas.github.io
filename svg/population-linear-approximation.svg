<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title-text { font-family: 'Arial', sans-serif; font-size: 24px; font-weight: bold; fill: #2c3e50; }
      .label-text { font-family: 'Arial', sans-serif; font-size: 14px; fill: #34495e; }
      .small-text { font-family: 'Arial', sans-serif; font-size: 12px; fill: #7f8c8d; }
      .equation-text { font-family: 'Times New Roman', serif; font-size: 14px; fill: #2c3e50; }
      .axis-line { stroke: #2c3e50; stroke-width: 2; }
      .grid-line { stroke: #ecf0f1; stroke-width: 1; }
      .data-point { fill: #3498db; stroke: #2980b9; stroke-width: 1; opacity: 0.7; }
      .nonlinear-curve { stroke: #e74c3c; stroke-width: 3; fill: none; }
      .linear-approx { stroke: #27ae60; stroke-width: 3; fill: none; stroke-dasharray: 5,5; }
      .highlight-box { fill: #f8f9fa; stroke: #6c757d; stroke-width: 1; rx: 5; }
    </style>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title-text">Population Linear Approximation</text>
  
  <!-- Main plot -->
  <g transform="translate(100, 70)">
    <text x="200" y="0" text-anchor="middle" class="label-text">True Population Relationship vs Linear Approximation</text>
    
    <!-- Coordinate system -->
    <g transform="translate(50, 30)">
      <!-- Grid -->
      <line x1="0" y1="50" x2="300" y2="50" class="grid-line"/>
      <line x1="0" y1="100" x2="300" y2="100" class="grid-line"/>
      <line x1="0" y1="150" x2="300" y2="150" class="grid-line"/>
      <line x1="0" y1="200" x2="300" y2="200" class="grid-line"/>
      <line x1="0" y1="250" x2="300" y2="250" class="grid-line"/>
      
      <line x1="75" y1="0" x2="75" y2="300" class="grid-line"/>
      <line x1="150" y1="0" x2="150" y2="300" class="grid-line"/>
      <line x1="225" y1="0" x2="225" y2="300" class="grid-line"/>
      
      <!-- Axes -->
      <line x1="0" y1="300" x2="300" y2="300" class="axis-line"/>
      <line x1="0" y1="0" x2="0" y2="300" class="axis-line"/>
      
      <!-- Axis labels -->
      <text x="150" y="320" text-anchor="middle" class="small-text">X (Feature)</text>
      <text x="-20" y="150" text-anchor="middle" class="small-text" transform="rotate(-90, -20, 150)">Y (Target)</text>
      
      <!-- Population data points (scattered) -->
      <circle cx="30" cy="220" r="2" class="data-point"/>
      <circle cx="35" cy="210" r="2" class="data-point"/>
      <circle cx="40" cy="205" r="2" class="data-point"/>
      <circle cx="45" cy="195" r="2" class="data-point"/>
      <circle cx="50" cy="180" r="2" class="data-point"/>
      <circle cx="55" cy="175" r="2" class="data-point"/>
      <circle cx="60" cy="160" r="2" class="data-point"/>
      <circle cx="65" cy="155" r="2" class="data-point"/>
      <circle cx="70" cy="145" r="2" class="data-point"/>
      <circle cx="75" cy="140" r="2" class="data-point"/>
      <circle cx="80" cy="130" r="2" class="data-point"/>
      <circle cx="85" cy="125" r="2" class="data-point"/>
      <circle cx="90" cy="115" r="2" class="data-point"/>
      <circle cx="95" cy="110" r="2" class="data-point"/>
      <circle cx="100" cy="105" r="2" class="data-point"/>
      <circle cx="105" cy="100" r="2" class="data-point"/>
      <circle cx="110" cy="95" r="2" class="data-point"/>
      <circle cx="115" cy="92" r="2" class="data-point"/>
      <circle cx="120" cy="90" r="2" class="data-point"/>
      <circle cx="125" cy="88" r="2" class="data-point"/>
      <circle cx="130" cy="87" r="2" class="data-point"/>
      <circle cx="135" cy="86" r="2" class="data-point"/>
      <circle cx="140" cy="85" r="2" class="data-point"/>
      <circle cx="145" cy="85" r="2" class="data-point"/>
      <circle cx="150" cy="85" r="2" class="data-point"/>
      <circle cx="155" cy="86" r="2" class="data-point"/>
      <circle cx="160" cy="87" r="2" class="data-point"/>
      <circle cx="165" cy="89" r="2" class="data-point"/>
      <circle cx="170" cy="92" r="2" class="data-point"/>
      <circle cx="175" cy="95" r="2" class="data-point"/>
      <circle cx="180" cy="100" r="2" class="data-point"/>
      <circle cx="185" cy="105" r="2" class="data-point"/>
      <circle cx="190" cy="112" r="2" class="data-point"/>
      <circle cx="195" cy="120" r="2" class="data-point"/>
      <circle cx="200" cy="130" r="2" class="data-point"/>
      <circle cx="205" cy="142" r="2" class="data-point"/>
      <circle cx="210" cy="155" r="2" class="data-point"/>
      <circle cx="215" cy="170" r="2" class="data-point"/>
      <circle cx="220" cy="190" r="2" class="data-point"/>
      <circle cx="225" cy="210" r="2" class="data-point"/>
      <circle cx="230" cy="235" r="2" class="data-point"/>
      <circle cx="235" cy="260" r="2" class="data-point"/>
      <circle cx="240" cy="280" r="2" class="data-point"/>
      
      <!-- Additional scattered points for realism -->
      <circle cx="45" cy="200" r="2" class="data-point"/>
      <circle cx="65" cy="150" r="2" class="data-point"/>
      <circle cx="85" cy="120" r="2" class="data-point"/>
      <circle cx="105" cy="105" r="2" class="data-point"/>
      <circle cx="125" cy="95" r="2" class="data-point"/>
      <circle cx="145" cy="90" r="2" class="data-point"/>
      <circle cx="165" cy="95" r="2" class="data-point"/>
      <circle cx="185" cy="110" r="2" class="data-point"/>
      <circle cx="205" cy="150" r="2" class="data-point"/>
      <circle cx="225" cy="200" r="2" class="data-point"/>
      
      <!-- True nonlinear relationship (cubic curve) -->
      <path d="M 20 240 Q 80 120 150 85 Q 220 100 270 250" class="nonlinear-curve"/>
      
      <!-- Best linear approximation -->
      <line x1="20" y1="200" x2="270" y2="120" class="linear-approx"/>
      
      <!-- Legend -->
      <g transform="translate(10, 10)">
        <circle cx="0" cy="0" r="2" class="data-point"/>
        <text x="10" y="4" class="small-text">Population data</text>
        
        <line x1="0" y1="15" x2="20" y2="15" class="nonlinear-curve" stroke-width="2"/>
        <text x="25" y="19" class="small-text">True relationship f(X)</text>
        
        <line x1="0" y1="30" x2="20" y2="30" class="linear-approx" stroke-width="2"/>
        <text x="25" y="34" class="small-text">Best linear approx θᵀX</text>
      </g>
    </g>
  </g>
  
  <!-- Explanation boxes -->
  <g transform="translate(450, 70)">
    <rect x="0" y="0" width="300" height="120" class="highlight-box"/>
    <text x="10" y="20" class="label-text">Linear Approximation Goal:</text>
    <text x="20" y="40" class="small-text">Find θ that minimizes:</text>
    <text x="20" y="60" class="equation-text">E[(θᵀX - Y)²] over population</text>
    <text x="20" y="85" class="small-text">Subject to linear constraint:</text>
    <text x="20" y="105" class="equation-text">g(X) = θ₀ + θ₁X₁ + ... + θₘXₘ</text>
  </g>
  
  <g transform="translate(450, 210)">
    <rect x="0" y="0" width="300" height="100" class="highlight-box"/>
    <text x="10" y="20" class="label-text">Key Insights:</text>
    <text x="20" y="40" class="small-text">• True relationship may be complex</text>
    <text x="20" y="55" class="small-text">• Linear model is an approximation</text>
    <text x="20" y="70" class="small-text">• Optimizes average performance</text>
    <text x="20" y="85" class="small-text">• Robust to model misspecification</text>
  </g>
  
  <g transform="translate(450, 330)">
    <rect x="0" y="0" width="300" height="80" class="highlight-box"/>
    <text x="10" y="20" class="label-text">Practical Implications:</text>
    <text x="20" y="40" class="small-text">• Focus on prediction accuracy</text>
    <text x="20" y="55" class="small-text">• Weaker assumptions about world</text>
    <text x="20" y="70" class="small-text">• Good for complex phenomena</text>
  </g>
  
  <!-- Bottom equation -->
  <g transform="translate(400, 450)">
    <text x="0" y="0" text-anchor="middle" class="equation-text">
      Empirical approximation: min θ (1/n) Σᵢ₌₁ⁿ (θᵀXᵢ - Yᵢ)²
    </text>
  </g>
</svg>