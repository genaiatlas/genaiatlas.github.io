<svg viewBox="0 0 900 650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="forwardGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4caf50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#81c784;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="backwardGradient" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#f44336;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ef5350;stop-opacity:1" />
    </linearGradient>
    <marker id="forwardArrow" markerWidth="10" markerHeight="7" 
            refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4caf50" />
    </marker>
    <marker id="backwardArrow" markerWidth="10" markerHeight="7" 
            refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f44336" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1565c0">
    Backpropagation: Forward and Backward Pass
  </text>
  
  <!-- Input Layer -->
  <g id="input-layer">
    <circle cx="100" cy="200" r="25" fill="#e3f2fd" stroke="#1976d2" stroke-width="3"/>
    <circle cx="100" cy="280" r="25" fill="#e3f2fd" stroke="#1976d2" stroke-width="3"/>
    <circle cx="100" cy="360" r="25" fill="#e3f2fd" stroke="#1976d2" stroke-width="3"/>
    <text x="100" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1976d2">Input Layer</text>
    <text x="100" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">x₁</text>
    <text x="100" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">x₂</text>
    <text x="100" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">x₃</text>
  </g>
  
  <!-- Hidden Layer 1 -->
  <g id="hidden-layer-1">
    <circle cx="300" cy="180" r="25" fill="#fff3e0" stroke="#ff9800" stroke-width="3"/>
    <circle cx="300" cy="240" r="25" fill="#fff3e0" stroke="#ff9800" stroke-width="3"/>
    <circle cx="300" cy="300" r="25" fill="#fff3e0" stroke="#ff9800" stroke-width="3"/>
    <circle cx="300" cy="360" r="25" fill="#fff3e0" stroke="#ff9800" stroke-width="3"/>
    <text x="300" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ff9800">Hidden Layer 1</text>
    <text x="300" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">h₁</text>
    <text x="300" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">h₂</text>
    <text x="300" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">h₃</text>
    <text x="300" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">h₄</text>
  </g>
  
  <!-- Hidden Layer 2 -->
  <g id="hidden-layer-2">
    <circle cx="500" cy="220" r="25" fill="#fce4ec" stroke="#e91e63" stroke-width="3"/>
    <circle cx="500" cy="300" r="25" fill="#fce4ec" stroke="#e91e63" stroke-width="3"/>
    <text x="500" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e91e63">Hidden Layer 2</text>
    <text x="500" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">h₅</text>
    <text x="500" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">h₆</text>
  </g>
  
  <!-- Output Layer -->
  <g id="output-layer">
    <circle cx="700" cy="260" r="25" fill="#e8f5e8" stroke="#4caf50" stroke-width="3"/>
    <text x="700" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4caf50">Output Layer</text>
    <text x="700" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">y</text>
  </g>
  
  <!-- Cost Function -->
  <rect x="760" y="235" width="100" height="50" rx="25" fill="#ffebee" stroke="#d32f2f" stroke-width="3"/>
  <text x="810" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#d32f2f">Cost Function</text>
  
  <!-- Forward Pass Arrows -->
  <g stroke="#4caf50" stroke-width="3" marker-end="url(#forwardArrow)" opacity="0.8">
    <!-- Input to Hidden 1 -->
    <line x1="125" y1="200" x2="275" y2="180"/>
    <line x1="125" y1="200" x2="275" y2="240"/>
    <line x1="125" y1="280" x2="275" y2="240"/>
    <line x1="125" y1="280" x2="275" y2="300"/>
    <line x1="125" y1="360" x2="275" y2="300"/>
    <line x1="125" y1="360" x2="275" y2="360"/>
    
    <!-- Hidden 1 to Hidden 2 -->
    <line x1="325" y1="180" x2="475" y2="220"/>
    <line x1="325" y1="240" x2="475" y2="220"/>
    <line x1="325" y1="300" x2="475" y2="300"/>
    <line x1="325" y1="360" x2="475" y2="300"/>
    
    <!-- Hidden 2 to Output -->
    <line x1="525" y1="220" x2="675" y2="260"/>
    <line x1="525" y1="300" x2="675" y2="260"/>
    
    <!-- Output to Cost -->
    <line x1="725" y1="260" x2="760" y2="260"/>
  </g>
  
  <!-- Backward Pass Arrows -->
  <g stroke="#f44336" stroke-width="3" marker-end="url(#backwardArrow)" opacity="0.8">
    <!-- Cost to Output -->
    <line x1="760" y1="270" x2="725" y2="270"/>
    
    <!-- Output to Hidden 2 -->
    <line x1="675" y1="270" x2="525" y2="230"/>
    <line x1="675" y1="270" x2="525" y2="310"/>
    
    <!-- Hidden 2 to Hidden 1 -->
    <line x1="475" y1="230" x2="325" y2="190"/>
    <line x1="475" y1="230" x2="325" y2="250"/>
    <line x1="475" y1="310" x2="325" y2="310"/>
    <line x1="475" y1="310" x2="325" y2="370"/>
    
    <!-- Hidden 1 to Input -->
    <line x1="275" y1="190" x2="125" y2="210"/>
    <line x1="275" y1="250" x2="125" y2="210"/>
    <line x1="275" y1="250" x2="125" y2="290"/>
    <line x1="275" y1="310" x2="125" y2="290"/>
    <line x1="275" y1="370" x2="125" y2="370"/>
  </g>
  
  <!-- Legend -->
  <g id="legend">
    <rect x="50" y="450" width="800" height="180" rx="10" fill="#f8f9fa" stroke="#666" stroke-width="2"/>
    <text x="450" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#333">
      Backpropagation Process
    </text>
    
    <!-- Forward Pass Description -->
    <rect x="80" y="490" width="350" height="120" rx="5" fill="#e8f5e8" stroke="#4caf50" stroke-width="1"/>
    <text x="255" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4caf50">
      Forward Pass
    </text>
    <g font-family="Arial, sans-serif" font-size="12" fill="#333">
      <text x="90" y="530">1. Input data flows left to right</text>
      <text x="90" y="550">2. Each layer applies: z = Wx + b</text>
      <text x="90" y="570">3. Activation function: a = σ(z)</text>
      <text x="90" y="590">4. Final output generates cost C</text>
    </g>
    
    <!-- Backward Pass Description -->
    <rect x="470" y="490" width="350" height="120" rx="5" fill="#ffebee" stroke="#f44336" stroke-width="1"/>
    <text x="645" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f44336">
      Backward Pass (Backpropagation)
    </text>
    <g font-family="Arial, sans-serif" font-size="12" fill="#333">
      <text x="480" y="530">1. Gradients flow right to left</text>
      <text x="480" y="550">2. Chain rule: ∂C/∂W = ∂C/∂a × ∂a/∂z × ∂z/∂W</text>
      <text x="480" y="570">3. Update weights: W := W - α∇W</text>
      <text x="480" y="590">4. Process continues layer by layer</text>
    </g>
  </g>
  
  <!-- Mathematical notation -->
  <g font-family="Arial, sans-serif" font-size="11" fill="#666">
    <text x="450" y="420">Key: σ = activation function, W = weights, b = biases, α = learning rate, C = cost function</text>
  </g>
</svg>