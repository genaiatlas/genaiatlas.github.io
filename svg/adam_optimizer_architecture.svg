<svg viewBox="0 0 850 650" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="850" height="650" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="425" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">
    Adam Optimizer: Combining Momentum + Adaptive Learning Rates
  </text>
  
  <!-- Input gradient -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="120" height="60" fill="#ecf0f1" stroke="#95a5a6" stroke-width="2" rx="5"/>
    <text x="60" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">
      Input Gradient
    </text>
    <text x="60" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">
      ∇J(θ)
    </text>
  </g>
  
  <!-- Branching arrows -->
  <path d="M 170 110 Q 200 110 230 110" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 170 110 Q 200 90 230 70" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 170 110 Q 200 130 230 150" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- First moment estimation (Momentum component) -->
  <g transform="translate(240, 40)">
    <rect x="0" y="0" width="160" height="80" fill="#e8f4fd" stroke="#3498db" stroke-width="2" rx="5"/>
    <text x="80" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#3498db">
      First Moment (m)
    </text>
    <text x="80" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">
      Momentum Component
    </text>
    <text x="80" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">
      mₜ = β₁·mₜ₋₁ + (1-β₁)·∇J(θ)
    </text>
    <text x="80" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">
      β₁ = 0.9 (typical)
    </text>
  </g>
  
  <!-- Second moment estimation (Adagrad component) -->
  <g transform="translate(240, 130)">
    <rect x="0" y="0" width="160" height="80" fill="#fef9e7" stroke="#f39c12" stroke-width="2" rx="5"/>
    <text x="80" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f39c12">
      Second Moment (v)
    </text>
    <text x="80" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">
      Adaptive Component
    </text>
    <text x="80" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">
      vₜ = β₂·vₜ₋₁ + (1-β₂)·(∇J(θ))²
    </text>
    <text x="80" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">
      β₂ = 0.999 (typical)
    </text>
  </g>
  
  <!-- Arrows to bias correction -->
  <path d="M 410 80 Q 450 80 490 80" fill="none" stroke="#3498db" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 410 170 Q 450 170 490 170" fill="none" stroke="#f39c12" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Bias correction -->
  <g transform="translate(500, 60)">
    <rect x="0" y="0" width="160" height="60" fill="#e8f5e8" stroke="#27ae60" stroke-width="2" rx="5"/>
    <text x="80" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#27ae60">
      Bias Correction
    </text>
    <text x="80" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">
      m̂ₜ = mₜ/(1-β₁ᵗ)
    </text>
    <text x="80" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">
      v̂ₜ = vₜ/(1-β₂ᵗ)
    </text>
  </g>
  
  <g transform="translate(500, 150)">
    <rect x="0" y="0" width="160" height="60" fill="#e8f5e8" stroke="#27ae60" stroke-width="2" rx="5"/>
    <text x="80" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">
      Corrects initialization
    </text>
    <text x="80" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">
      bias towards zero
    </text>
  </g>
  
  <!-- Arrows to final update -->
  <path d="M 580 90 Q 620 125 620 160 Q 620 195 580 230" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Parameter update -->
  <g transform="translate(480, 240)">
    <rect x="0" y="0" width="180" height="80" fill="#fdf2f2" stroke="#e74c3c" stroke-width="2" rx="5"/>
    <text x="90" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e74c3c">
      Parameter Update
    </text>
    <text x="90" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">
      θₜ₊₁ = θₜ - η · m̂ₜ/(√v̂ₜ + ε)
    </text>
    <text x="90" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">
      ε = 1e-8 (numerical stability)
    </text>
  </g>
  
  <!-- Comparison with other optimizers -->
  <g transform="translate(50, 360)">
    <rect x="0" y="0" width="750" height="160" fill="#f4f4f4" stroke="#95a5a6" stroke-width="1" rx="5"/>
    
    <text x="20" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">
      Adam vs Other Optimizers: Component Breakdown
    </text>
    
    <!-- SGD -->
    <g transform="translate(20, 40)">
      <text x="0" y="15" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e74c3c">SGD:</text>
      <rect x="60" y="0" width="100" height="20" fill="#fdf2f2" stroke="#e74c3c" stroke-width="1" rx="3"/>
      <text x="110" y="14" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Raw Gradients</text>
    </g>
    
    <!-- SGD + Momentum -->
    <g transform="translate(20, 70)">
      <text x="0" y="15" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#3498db">SGD + Momentum:</text>
      <rect x="120" y="0" width="100" height="20" fill="#e8f4fd" stroke="#3498db" stroke-width="1" rx="3"/>
      <text x="170" y="14" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">First Moment</text>
    </g>
    
    <!-- Adagrad -->
    <g transform="translate(20, 100)">
      <text x="0" y="15" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f39c12">Adagrad:</text>
      <rect x="80" y="0" width="100" height="20" fill="#fdf2f2" stroke="#e74c3c" stroke-width="1" rx="3"/>
      <text x="130" y="14" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Raw Gradients</text>
      <text x="190" y="14" font-family="Arial, sans-serif" font-size="12" fill="#333">+</text>
      <rect x="210" y="0" width="100" height="20" fill="#fef9e7" stroke="#f39c12" stroke-width="1" rx="3"/>
      <text x="260" y="14" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Adaptive Rates</text>
    </g>
    
    <!-- Adam -->
    <g transform="translate(20, 130)">
      <text x="0" y="15" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#9b59b6">Adam:</text>
      <rect x="50" y="0" width="100" height="20" fill="#e8f4fd" stroke="#3498db" stroke-width="1" rx="3"/>
      <text x="100" y="14" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">First Moment</text>
      <text x="160" y="14" font-family="Arial, sans-serif" font-size="12" fill="#333">+</text>
      <rect x="180" y="0" width="100" height="20" fill="#fef9e7" stroke="#f39c12" stroke-width="1" rx="3"/>
      <text x="230" y="14" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Second Moment</text>
      <text x="290" y="14" font-family="Arial, sans-serif" font-size="12" fill="#333">+</text>
      <rect x="310" y="0" width="100" height="20" fill="#e8f5e8" stroke="#27ae60" stroke-width="1" rx="3"/>
      <text x="360" y="14" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Bias Correction</text>
    </g>
  </g>
  
  <!-- Key advantages -->
  <g transform="translate(50, 540)">
    <rect x="0" y="0" width="750" height="80" fill="#e8f5e8" stroke="#27ae60" stroke-width="1" rx="5"/>
    
    <text x="20" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#27ae60">
      Why Adam Excels: Key Advantages
    </text>
    
    <text x="40" y="45" font-family="Arial, sans-serif" font-size="11" fill="#333">
      • Combines momentum smoothing with adaptive learning rates
    </text>
    <text x="400" y="45" font-family="Arial, sans-serif" font-size="11" fill="#333">
      • Bias correction prevents initialization issues
    </text>
    <text x="40" y="65" font-family="Arial, sans-serif" font-size="11" fill="#333">
      • Works well with default hyperparameters across problems
    </text>
    <text x="400" y="65" font-family="Arial, sans-serif" font-size="11" fill="#333">
      • Robust performance in most deep learning applications
    </text>
  </g>
  
  <!-- Mathematical detail box -->
  <g transform="translate(680, 80)">
    <rect x="0" y="0" width="150" height="240" fill="#fff" stroke="#95a5a6" stroke-width="1" rx="5"/>
    <text x="75" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">
      Default Values
    </text>
    
    <text x="20" y="45" font-family="Arial, sans-serif" font-size="11" fill="#333">
      Learning rate:
    </text>
    <text x="20" y="60" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#e74c3c">
      η = 0.001
    </text>
    
    <text x="20" y="85" font-family="Arial, sans-serif" font-size="11" fill="#333">
      First moment decay:
    </text>
    <text x="20" y="100" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#3498db">
      β₁ = 0.9
    </text>
    
    <text x="20" y="125" font-family="Arial, sans-serif" font-size="11" fill="#333">
      Second moment decay:
    </text>
    <text x="20" y="140" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#f39c12">
      β₂ = 0.999
    </text>
    
    <text x="20" y="165" font-family="Arial, sans-serif" font-size="11" fill="#333">
      Numerical stability:
    </text>
    <text x="20" y="180" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#27ae60">
      ε = 1e-8
    </text>
    
    <text x="20" y="210" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d" font-style="italic">
      These defaults work well
    </text>
    <text x="20" y="225" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d" font-style="italic">
      for most applications!
    </text>
  </g>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="currentColor"/>
    </marker>
  </defs>
</svg>