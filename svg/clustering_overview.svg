<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Clustering-Based Recommendation Systems
  </text>
  
  <!-- Main container -->
  <rect x="50" y="80" width="700" height="400" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2" rx="10"/>
  
  <!-- Cluster 1 - Yellow/Orange cluster -->
  <g id="cluster1">
    <circle cx="200" cy="200" r="80" fill="#ffeb3b" fill-opacity="0.3" stroke="#f57c00" stroke-width="2"/>
    <rect x="170" y="170" width="12" height="12" fill="#ff9800"/>
    <rect x="190" y="180" width="12" height="12" fill="#ff9800"/>
    <rect x="210" y="175" width="12" height="12" fill="#ff9800"/>
    <rect x="180" y="195" width="12" height="12" fill="#ff9800"/>
    <rect x="200" y="200" width="12" height="12" fill="#ff9800"/>
    <rect x="220" y="190" width="12" height="12" fill="#ff9800"/>
    <rect x="185" y="215" width="12" height="12" fill="#ff9800"/>
    <rect x="205" y="220" width="12" height="12" fill="#ff9800"/>
    <text x="200" y="280" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#f57c00">
      Cluster A
    </text>
    <text x="200" y="300" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666">
      Action Movies
    </text>
  </g>
  
  <!-- Cluster 2 - Blue cluster -->
  <g id="cluster2">
    <circle cx="400" cy="250" r="80" fill="#2196f3" fill-opacity="0.3" stroke="#1565c0" stroke-width="2"/>
    <rect x="370" y="220" width="12" height="12" fill="#1976d2"/>
    <rect x="390" y="230" width="12" height="12" fill="#1976d2"/>
    <rect x="410" y="225" width="12" height="12" fill="#1976d2"/>
    <rect x="380" y="245" width="12" height="12" fill="#1976d2"/>
    <rect x="400" y="250" width="12" height="12" fill="#1976d2"/>
    <rect x="420" y="240" width="12" height="12" fill="#1976d2"/>
    <rect x="385" y="265" width="12" height="12" fill="#1976d2"/>
    <rect x="405" y="270" width="12" height="12" fill="#1976d2"/>
    <text x="400" y="350" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1565c0">
      Cluster B
    </text>
    <text x="400" y="370" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666">
      Drama Films
    </text>
  </g>
  
  <!-- Cluster 3 - Red cluster -->
  <g id="cluster3">
    <circle cx="600" cy="200" r="80" fill="#f44336" fill-opacity="0.3" stroke="#c62828" stroke-width="2"/>
    <rect x="570" y="170" width="12" height="12" fill="#d32f2f"/>
    <rect x="590" y="180" width="12" height="12" fill="#d32f2f"/>
    <rect x="610" y="175" width="12" height="12" fill="#d32f2f"/>
    <rect x="580" y="195" width="12" height="12" fill="#d32f2f"/>
    <rect x="600" y="200" width="12" height="12" fill="#d32f2f"/>
    <rect x="620" y="190" width="12" height="12" fill="#d32f2f"/>
    <rect x="585" y="215" width="12" height="12" fill="#d32f2f"/>
    <rect x="605" y="220" width="12" height="12" fill="#d32f2f"/>
    <text x="600" y="280" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#c62828">
      Cluster C
    </text>
    <text x="600" y="300" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666">
      Comedy Films
    </text>
  </g>
  
  <!-- Key Concepts Box -->
  <g id="concepts">
    <rect x="100" y="420" width="600" height="120" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" rx="8"/>
    <text x="400" y="450" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2e7d32">
      Key Clustering Principles
    </text>
    <text x="120" y="480" font-family="Arial, sans-serif" font-size="13" fill="#424242">
      • Within-cluster similarity: Users/items in same cluster have similar preferences
    </text>
    <text x="120" y="505" font-family="Arial, sans-serif" font-size="13" fill="#424242">
      • Cross-cluster diversity: Different clusters represent distinct preference patterns
    </text>
    <text x="120" y="530" font-family="Arial, sans-serif" font-size="13" fill="#424242">
      • Localized predictions: Recommendations based on cluster-specific patterns
    </text>
  </g>
  
  <!-- Legend -->
  <g id="legend">
    <rect x="50" y="330" width="15" height="15" fill="#ff9800"/>
    <rect x="50" y="355" width="15" height="15" fill="#1976d2"/>
    <rect x="50" y="380" width="15" height="15" fill="#d32f2f"/>
    <text x="75" y="342" font-family="Arial, sans-serif" font-size="12" fill="#666">Users/Items</text>
    <text x="75" y="367" font-family="Arial, sans-serif" font-size="12" fill="#666">in Cluster</text>
  </g>
</svg>