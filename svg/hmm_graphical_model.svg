<svg viewBox="0 0 1100 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="550" y="35" font-size="26" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    HMM Graphical Model Structure
  </text>
  
  <!-- Background -->
  <rect x="50" y="60" width="1000" height="600" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2" rx="10"/>
  
  <!-- Hidden States Layer -->
  <text x="80" y="100" font-size="18" font-weight="bold" fill="#2c3e50">Hidden State Sequence (Markov Chain)</text>
  <rect x="70" y="115" width="960" height="180" fill="#e3f2fd" stroke="#2196F3" stroke-width="2" rx="8"/>
  
  <!-- Hidden State Nodes -->
  <circle cx="150" cy="205" r="40" fill="#2196F3" stroke="#1565C0" stroke-width="3"/>
  <text x="150" y="202" font-size="16" font-weight="bold" text-anchor="middle" fill="white">X₁</text>
  <text x="150" y="220" font-size="12" text-anchor="middle" fill="white">Weather</text>
  <text x="150" y="235" font-size="11" text-anchor="middle" fill="white">Day 1</text>
  
  <circle cx="320" cy="205" r="40" fill="#2196F3" stroke="#1565C0" stroke-width="3"/>
  <text x="320" y="202" font-size="16" font-weight="bold" text-anchor="middle" fill="white">X₂</text>
  <text x="320" y="220" font-size="12" text-anchor="middle" fill="white">Weather</text>
  <text x="320" y="235" font-size="11" text-anchor="middle" fill="white">Day 2</text>
  
  <circle cx="490" cy="205" r="40" fill="#2196F3" stroke="#1565C0" stroke-width="3"/>
  <text x="490" y="202" font-size="16" font-weight="bold" text-anchor="middle" fill="white">X₃</text>
  <text x="490" y="220" font-size="12" text-anchor="middle" fill="white">Weather</text>
  <text x="490" y="235" font-size="11" text-anchor="middle" fill="white">Day 3</text>
  
  <circle cx="660" cy="205" r="40" fill="#2196F3" stroke="#1565C0" stroke-width="3"/>
  <text x="660" y="202" font-size="16" font-weight="bold" text-anchor="middle" fill="white">X₄</text>
  <text x="660" y="220" font-size="12" text-anchor="middle" fill="white">Weather</text>
  <text x="660" y="235" font-size="11" text-anchor="middle" fill="white">Day 4</text>
  
  <!-- Dots for continuation -->
  <circle cx="780" cy="205" r="4" fill="#1565C0"/>
  <circle cx="805" cy="205" r="4" fill="#1565C0"/>
  <circle cx="830" cy="205" r="4" fill="#1565C0"/>
  
  <circle cx="900" cy="205" r="40" fill="#2196F3" stroke="#1565C0" stroke-width="3"/>
  <text x="900" y="202" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Xₜ</text>
  <text x="900" y="220" font-size="12" text-anchor="middle" fill="white">Weather</text>
  <text x="900" y="235" font-size="11" text-anchor="middle" fill="white">Day t</text>
  
  <!-- Transition Arrows -->
  <defs>
    <marker id="arrowblue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/>
    </marker>
  </defs>
  
  <path d="M 190 205 L 280 205" stroke="#1565C0" stroke-width="3" fill="none" marker-end="url(#arrowblue)"/>
  <path d="M 360 205 L 450 205" stroke="#1565C0" stroke-width="3" fill="none" marker-end="url(#arrowblue)"/>
  <path d="M 530 205 L 620 205" stroke="#1565C0" stroke-width="3" fill="none" marker-end="url(#arrowblue)"/>
  <path d="M 700 205 L 745 205" stroke="#1565C0" stroke-width="3" fill="none" marker-end="url(#arrowblue)"/>
  <path d="M 855 205 L 860 205" stroke="#1565C0" stroke-width="3" fill="none" marker-end="url(#arrowblue)"/>
  
  <!-- Observable States Layer -->
  <text x="80" y="350" font-size="18" font-weight="bold" fill="#2c3e50">Observable Sequence</text>
  <rect x="70" y="365" width="960" height="180" fill="#fff3e0" stroke="#FF9800" stroke-width="2" rx="8"/>
  
  <!-- Observable Nodes -->
  <rect x="115" y="430" width="70" height="70" fill="#FF9800" stroke="#F57C00" stroke-width="3" rx="5"/>
  <text x="150" y="455" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Y₁</text>
  <text x="150" y="473" font-size="11" text-anchor="middle" fill="white">Transport</text>
  <text x="150" y="488" font-size="11" text-anchor="middle" fill="white">Choice</text>
  
  <rect x="285" y="430" width="70" height="70" fill="#FF9800" stroke="#F57C00" stroke-width="3" rx="5"/>
  <text x="320" y="455" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Y₂</text>
  <text x="320" y="473" font-size="11" text-anchor="middle" fill="white">Transport</text>
  <text x="320" y="488" font-size="11" text-anchor="middle" fill="white">Choice</text>
  
  <rect x="455" y="430" width="70" height="70" fill="#FF9800" stroke="#F57C00" stroke-width="3" rx="5"/>
  <text x="490" y="455" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Y₃</text>
  <text x="490" y="473" font-size="11" text-anchor="middle" fill="white">Transport</text>
  <text x="490" y="488" font-size="11" text-anchor="middle" fill="white">Choice</text>
  
  <rect x="625" y="430" width="70" height="70" fill="#FF9800" stroke="#F57C00" stroke-width="3" rx="5"/>
  <text x="660" y="455" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Y₄</text>
  <text x="660" y="473" font-size="11" text-anchor="middle" fill="white">Transport</text>
  <text x="660" y="488" font-size="11" text-anchor="middle" fill="white">Choice</text>
  
  <!-- Dots for continuation -->
  <circle cx="780" cy="465" r="4" fill="#F57C00"/>
  <circle cx="805" cy="465" r="4" fill="#F57C00"/>
  <circle cx="830" cy="465" r="4" fill="#F57C00"/>
  
  <rect x="865" y="430" width="70" height="70" fill="#FF9800" stroke="#F57C00" stroke-width="3" rx="5"/>
  <text x="900" y="455" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Yₜ</text>
  <text x="900" y="473" font-size="11" text-anchor="middle" fill="white">Transport</text>
  <text x="900" y="488" font-size="11" text-anchor="middle" fill="white">Choice</text>
  
  <!-- Emission Arrows -->
  <defs>
    <marker id="arroworange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#F57C00"/>
    </marker>
  </defs>
  
  <path d="M 150 245 L 150 430" stroke="#F57C00" stroke-width="2.5" fill="none" marker-end="url(#arroworange)"/>
  <path d="M 320 245 L 320 430" stroke="#F57C00" stroke-width="2.5" fill="none" marker-end="url(#arroworange)"/>
  <path d="M 490 245 L 490 430" stroke="#F57C00" stroke-width="2.5" fill="none" marker-end="url(#arroworange)"/>
  <path d="M 660 245 L 660 430" stroke="#F57C00" stroke-width="2.5" fill="none" marker-end="url(#arroworange)"/>
  <path d="M 900 245 L 900 430" stroke="#F57C00" stroke-width="2.5" fill="none" marker-end="url(#arroworange)"/>
  
  <!-- Properties Box -->
  <rect x="70" y="570" width="960" height="75" fill="#e8f5e9" stroke="#4CAF50" stroke-width="2" rx="5"/>
  
  <text x="550" y="595" font-size="16" font-weight="bold" text-anchor="middle" fill="#2e7d32">
    Key Properties
  </text>
  
  <text x="90" y="620" font-size="13" fill="#2e7d32">
    • Tree Structure (No Cycles)
  </text>
  
  <text x="350" y="620" font-size="13" fill="#2e7d32">
    • Markov Property: P(Xₜ₊₁ | X₁:ₜ) = P(Xₜ₊₁ | Xₜ)
  </text>
  
  <text x="750" y="620" font-size="13" fill="#2e7d32">
    • Conditional Independence: P(Yₜ | X₁:T) = P(Yₜ | Xₜ)
  </text>
  
  <text x="550" y="638" font-size="13" font-style="italic" text-anchor="middle" fill="#1b5e20">
    Future is independent of the past given the present
  </text>
  
</svg>