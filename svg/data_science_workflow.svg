<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="phase1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="phase2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="phase3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="phase4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
    </linearGradient>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
     refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#374151" />
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="700" fill="#f9fafb"/>
  
  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#111827">
    Data Science Workflow Process
  </text>
  
  <!-- Phase 1: Problem Definition -->
  <rect x="50" y="100" width="180" height="120" rx="15" fill="url(#phase1)" stroke="#1e40af" stroke-width="2"/>
  <text x="140" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
    PHASE 1
  </text>
  <text x="140" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    Problem Definition
  </text>
  <text x="140" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
    • Business Understanding
  </text>
  <text x="140" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
    • Success Metrics
  </text>
  <text x="140" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
    • Feasibility Assessment
  </text>
  
  <!-- Phase 2: Data Collection -->
  <rect x="360" y="100" width="180" height="120" rx="15" fill="url(#phase2)" stroke="#047857" stroke-width="2"/>
  <text x="450" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
    PHASE 2
  </text>
  <text x="450" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    Data Collection
  </text>
  <text x="450" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
    • Data Sources
  </text>
  <text x="450" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
    • Data Quality Check
  </text>
  <text x="450" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
    • Initial Exploration
  </text>
  
  <!-- Phase 3: Data Preparation -->
  <rect x="670" y="100" width="180" height="120" rx="15" fill="url(#phase3)" stroke="#b45309" stroke-width="2"/>
  <text x="760" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
    PHASE 3
  </text>
  <text x="760" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    Data Preparation
  </text>
  <text x="760" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
    • Data Cleaning
  </text>
  <text x="760" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
    • Feature Engineering
  </text>
  <text x="760" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
    • Data Transformation
  </text>
  
  <!-- Phase 4: Model Development -->
  <rect x="360" y="300" width="180" height="120" rx="15" fill="url(#phase4)" stroke="#b91c1c" stroke-width="2"/>
  <text x="450" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
    PHASE 4
  </text>
  <text x="450" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    Model Development
  </text>
  <text x="450" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
    • Algorithm Selection
  </text>
  <text x="450" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
    • Training &amp; Validation
  </text>
  <text x="450" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
    • Performance Tuning
  </text>
  
  <!-- Phase 5: Evaluation -->
  <rect x="50" y="500" width="180" height="120" rx="15" fill="url(#phase1)" stroke="#1e40af" stroke-width="2"/>
  <text x="140" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
    PHASE 5
  </text>
  <text x="140" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    Model Evaluation
  </text>
  <text x="140" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
    • Performance Metrics
  </text>
  <text x="140" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
    • Business Impact
  </text>
  <text x="140" y="595" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
    • Validation Testing
  </text>
  
  <!-- Phase 6: Deployment -->
  <rect x="670" y="500" width="180" height="120" rx="15" fill="url(#phase2)" stroke="#047857" stroke-width="2"/>
  <text x="760" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
    PHASE 6
  </text>
  <text x="760" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    Deployment
  </text>
  <text x="760" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
    • Production Setup
  </text>
  <text x="760" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
    • Monitoring Systems
  </text>
  <text x="760" y="595" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
    • Continuous Updates
  </text>
  
  <!-- Flow Arrows -->
  <line x1="230" y1="160" x2="360" y2="160" stroke="#374151" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line x1="540" y1="160" x2="670" y2="160" stroke="#374151" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line x1="760" y1="220" x2="760" y2="280" stroke="#374151" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line x1="760" y1="280" x2="540" y2="310" stroke="#374151" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line x1="360" y1="360" x2="230" y2="520" stroke="#374151" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line x1="540" y1="360" x2="670" y2="520" stroke="#374151" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Feedback Loop -->
  <path d="M 140 500 Q 80 350 140 220" stroke="#9333ea" stroke-width="3" fill="none" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <text x="30" y="360" font-family="Arial, sans-serif" font-size="12" fill="#9333ea" font-weight="bold">
    Iterative
  </text>
  <text x="30" y="375" font-family="Arial, sans-serif" font-size="12" fill="#9333ea" font-weight="bold">
    Feedback
  </text>
  
  <!-- Key Characteristics -->
  <rect x="360" y="450" width="180" height="40" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="450" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#374151">
    Key Characteristics
  </text>
  <text x="450" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">
    Iterative • Collaborative • Data-Driven
  </text>
</svg>