<svg viewBox="0 0 800 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title-text { font-family: 'Arial', sans-serif; font-size: 24px; font-weight: bold; fill: #2c3e50; }
      .subtitle-text { font-family: 'Arial', sans-serif; font-size: 18px; font-weight: bold; fill: #34495e; }
      .label-text { font-family: 'Arial', sans-serif; font-size: 14px; fill: #34495e; }
      .small-text { font-family: 'Arial', sans-serif; font-size: 12px; fill: #7f8c8d; }
      .equation-text { font-family: 'Times New Roman', serif; font-size: 16px; fill: #2c3e50; }
      .step-box { fill: #f8f9fa; stroke: #6c757d; stroke-width: 2; rx: 8; }
      .formula-box { fill: #e8f5e8; stroke: #28a745; stroke-width: 2; rx: 8; }
      .example-box { fill: #fff3cd; stroke: #ffc107; stroke-width: 2; rx: 8; }
      .interpretation-box { fill: #e3f2fd; stroke: #2196f3; stroke-width: 2; rx: 8; }
      .arrow { stroke: #6c757d; stroke-width: 2; fill: #6c757d; }
      .flow-arrow { stroke: #007bff; stroke-width: 3; fill: #007bff; }
    </style>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title-text">R-Squared Calculation Process</text>
  
  <!-- Step 1: Calculate TSS -->
  <g transform="translate(50, 70)">
    <rect x="0" y="0" width="700" height="80" class="step-box"/>
    <text x="20" y="25" class="subtitle-text">Step 1: Calculate Total Sum of Squares (TSS)</text>
    <text x="20" y="50" class="equation-text">TSS = Σᵢ₌₁ⁿ (Yᵢ - Ȳ)²</text>
    <text x="20" y="70" class="label-text">Measures total variation in Y around its mean</text>
  </g>
  
  <!-- Arrow 1 -->
  <g transform="translate(400, 150)">
    <path d="M 0 0 L 0 20 L -5 15 M 0 20 L 5 15" class="flow-arrow"/>
  </g>
  
  <!-- Step 2: Calculate RSS -->
  <g transform="translate(50, 170)">
    <rect x="0" y="0" width="700" height="80" class="step-box"/>
    <text x="20" y="25" class="subtitle-text">Step 2: Calculate Residual Sum of Squares (RSS)</text>
    <text x="20" y="50" class="equation-text">RSS = Σᵢ₌₁ⁿ (Yᵢ - Ŷᵢ)² = Σᵢ₌₁ⁿ (Yᵢ - θᵀXᵢ)²</text>
    <text x="20" y="70" class="label-text">Measures unexplained variation after regression</text>
  </g>
  
  <!-- Arrow 2 -->
  <g transform="translate(400, 250)">
    <path d="M 0 0 L 0 20 L -5 15 M 0 20 L 5 15" class="flow-arrow"/>
  </g>
  
  <!-- Step 3: R² Formula -->
  <g transform="translate(150, 270)">
    <rect x="0" y="0" width="500" height="100" class="formula-box"/>
    <text x="250" y="25" text-anchor="middle" class="subtitle-text" fill="#155724">Step 3: Calculate R-Squared</text>
    
    <text x="250" y="55" text-anchor="middle" class="equation-text">R² = 1 - RSS/TSS</text>
    
    <text x="20" y="80" class="label-text" fill="#155724">Alternative formula:</text>
    <text x="250" y="95" text-anchor="middle" class="equation-text">R² = (TSS - RSS)/TSS</text>
  </g>
  
  <!-- Numerical Example -->
  <g transform="translate(50, 400)">
    <rect x="0" y="0" width="700" height="180" class="example-box"/>
    <text x="350" y="25" text-anchor="middle" class="subtitle-text" fill="#856404">Numerical Example</text>
    
    <!-- Example data -->
    <text x="50" y="55" class="label-text" fill="#856404">Sample Data: Y = [10, 12, 14, 16, 18], Mean(Y) = 14</text>
    <text x="50" y="75" class="label-text" fill="#856404">Predictions: Ŷ = [10.5, 12.2, 13.8, 15.9, 17.6]</text>
    
    <!-- TSS calculation -->
    <text x="50" y="105" class="equation-text">TSS = (10-14)² + (12-14)² + (14-14)² + (16-14)² + (18-14)²</text>
    <text x="50" y="125" class="equation-text">TSS = 16 + 4 + 0 + 4 + 16 = 40</text>
    
    <!-- RSS calculation -->
    <text x="400" y="105" class="equation-text">RSS = (10-10.5)² + (12-12.2)² + (14-13.8)² + (16-15.9)² + (18-17.6)²</text>
    <text x="400" y="125" class="equation-text">RSS = 0.25 + 0.04 + 0.04 + 0.01 + 0.16 = 0.5</text>
    
    <!-- R² calculation -->
    <text x="250" y="155" class="equation-text">R² = 1 - RSS/TSS = 1 - 0.5/40 = 1 - 0.0125 = 0.9875</text>
    <text x="250" y="175" class="label-text" fill="#856404">Result: 98.75% of variance explained</text>
  </g>
  
  <!-- Interpretation Scale -->
  <g transform="translate(50, 600)">
    <rect x="0" y="0" width="700" height="80" class="interpretation-box"/>
    <text x="350" y="25" text-anchor="middle" class="subtitle-text" fill="#1976d2">R² Interpretation Guide</text>
    
    <!-- Scale -->
    <text x="50" y="50" class="small-text">R² = 0.0 (0%)</text>
    <text x="50" y="65" class="small-text">No explanation</text>
    
    <text x="180" y="50" class="small-text">R² = 0.25 (25%)</text>
    <text x="180" y="65" class="small-text">Weak</text>
    
    <text x="320" y="50" class="small-text">R² = 0.50 (50%)</text>
    <text x="320" y="65" class="small-text">Moderate</text>
    
    <text x="460" y="50" class="small-text">R² = 0.75 (75%)</text>
    <text x="460" y="65" class="small-text">Strong</text>
    
    <text x="600" y="50" class="small-text">R² = 1.0 (100%)</text>
    <text x="600" y="65" class="small-text">Perfect fit</text>
    
    <!-- Scale bar -->
    <rect x="50" y="30" width="600" height="10" fill="url(#r2gradient)" stroke="#333" stroke-width="1"/>
    
    <!-- Scale markers -->
    <line x1="50" y1="25" x2="50" y2="45" stroke="#333" stroke-width="1"/>
    <line x1="200" y1="25" x2="200" y2="45" stroke="#333" stroke-width="1"/>
    <line x1="350" y1="25" x2="350" y2="45" stroke="#333" stroke-width="1"/>
    <line x1="500" y1="25" x2="500" y2="45" stroke="#333" stroke-width="1"/>
    <line x1="650" y1="25" x2="650" y2="45" stroke="#333" stroke-width="1"/>
  </g>
  
  <!-- Gradient definition for scale -->
  <defs>
    <linearGradient id="r2gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#dc3545;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#ffc107;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fd7e14;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#20c997;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#28a745;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>