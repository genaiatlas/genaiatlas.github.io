<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title-text { font-family: 'Arial', sans-serif; font-size: 24px; font-weight: bold; fill: #2c3e50; }
      .equation-text { font-family: 'Times New Roman', serif; font-size: 20px; fill: #2c3e50; }
      .label-text { font-family: 'Arial', sans-serif; font-size: 16px; fill: #34495e; }
      .description-text { font-family: 'Arial', sans-serif; font-size: 14px; fill: #7f8c8d; }
      .highlight-box { fill: #f8f9fa; stroke: #e9ecef; stroke-width: 2; rx: 8; }
      .connection-line { stroke: #3498db; stroke-width: 2; stroke-dasharray: 5,5; }
    </style>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title-text">Linear Regression Mathematical Notation</text>
  
  <!-- Linear Equation -->
  <g transform="translate(400, 80)">
    <rect x="-250" y="-25" width="500" height="50" class="highlight-box"/>
    <text x="0" y="5" text-anchor="middle" class="equation-text">Ŷ = θ₀ + θ₁X₁ + θ₂X₂ + ... + θₘXₘ</text>
  </g>
  
  <!-- Compact Vector Form -->
  <g transform="translate(400, 160)">
    <rect x="-150" y="-25" width="300" height="50" class="highlight-box"/>
    <text x="0" y="5" text-anchor="middle" class="equation-text">Ŷ = θᵀX</text>
  </g>
  
  <!-- Vector Definitions -->
  <g transform="translate(100, 250)">
    <text x="0" y="0" class="label-text">Where:</text>
    
    <!-- Theta vector -->
    <text x="0" y="30" class="equation-text">θ = (θ₀, θ₁, θ₂, ..., θₘ)ᵀ</text>
    <text x="250" y="30" class="description-text">Parameter vector</text>
    
    <!-- X vector -->
    <text x="0" y="60" class="equation-text">X = (1, X₁, X₂, ..., Xₘ)ᵀ</text>
    <text x="250" y="60" class="description-text">Augmented feature vector</text>
    
    <!-- Dimensions -->
    <text x="0" y="100" class="label-text">Dimensions:</text>
    <text x="0" y="130" class="description-text">• θ ∈ ℝᵐ⁺¹ (m+1 parameters including intercept)</text>
    <text x="0" y="150" class="description-text">• X ∈ ℝᵐ⁺¹ (m features plus constant term)</text>
    <text x="0" y="170" class="description-text">• Ŷ ∈ ℝ (scalar prediction)</text>
  </g>
  
  <!-- Matrix Form -->
  <g transform="translate(400, 350)">
    <text x="0" y="0" text-anchor="middle" class="label-text">Matrix Form for All Data Points:</text>
    <rect x="-180" y="15" width="360" height="40" class="highlight-box"/>
    <text x="0" y="40" text-anchor="middle" class="equation-text">Ŷ = Xθ</text>
    
    <!-- Matrix dimensions -->
    <text x="-150" y="80" class="description-text">X: n × (m+1)</text>
    <text x="-50" y="80" class="description-text">θ: (m+1) × 1</text>
    <text x="50" y="80" class="description-text">Ŷ: n × 1</text>
  </g>
  
  <!-- Connection lines -->
  <line x1="400" y1="105" x2="400" y2="135" class="connection-line"/>
  
  <!-- Annotations -->
  <g transform="translate(550, 250)">
    <rect x="-10" y="-10" width="240" height="120" class="highlight-box"/>
    <text x="0" y="10" class="label-text">Key Benefits:</text>
    <text x="0" y="35" class="description-text">✓ Compact notation</text>
    <text x="0" y="55" class="description-text">✓ Matrix operations</text>
    <text x="0" y="75" class="description-text">✓ Efficient computation</text>
    <text x="0" y="95" class="description-text">✓ Scalable to high dimensions</text>
  </g>
</svg>