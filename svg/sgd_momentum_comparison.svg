<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">
    SGD vs Momentum: Optimization Path Comparison
  </text>
  
  <!-- SGD Section -->
  <g transform="translate(50, 70)">
    <text x="150" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#e74c3c">
      Standard SGD
    </text>
    
    <!-- Loss landscape background -->
    <rect x="20" y="30" width="260" height="200" fill="#fdf2f2" stroke="#e74c3c" stroke-width="2" rx="5"/>
    
    <!-- Contour lines representing loss landscape -->
    <ellipse cx="150" cy="130" rx="100" ry="60" fill="none" stroke="#ecf0f1" stroke-width="2"/>
    <ellipse cx="150" cy="130" rx="70" ry="40" fill="none" stroke="#ecf0f1" stroke-width="2"/>
    <ellipse cx="150" cy="130" rx="40" ry="25" fill="none" stroke="#ecf0f1" stroke-width="2"/>
    <ellipse cx="150" cy="130" rx="20" ry="12" fill="none" stroke="#ecf0f1" stroke-width="2"/>
    
    <!-- Global minimum -->
    <circle cx="150" cy="130" r="4" fill="#27ae60"/>
    <text x="150" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#27ae60">
      Global Min
    </text>
    
    <!-- SGD noisy path -->
    <path d="M 80 80 Q 90 95 85 110 Q 120 115 105 135 Q 130 140 125 155 Q 145 150 140 130 Q 148 135 150 130"
          fill="none" stroke="#e74c3c" stroke-width="3" stroke-dasharray="none"/>
    
    <!-- Starting point -->
    <circle cx="80" cy="80" r="5" fill="#e74c3c"/>
    <text x="80" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c">
      Start
    </text>
    
    <!-- Noise indicators -->
    <circle cx="85" cy="110" r="2" fill="#e74c3c" opacity="0.7"/>
    <circle cx="105" cy="135" r="2" fill="#e74c3c" opacity="0.7"/>
    <circle cx="125" cy="155" r="2" fill="#e74c3c" opacity="0.7"/>
    <circle cx="140" cy="130" r="2" fill="#e74c3c" opacity="0.7"/>
    
    <!-- Mathematical formula -->
    <text x="150" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">
      θₜ₊₁ = θₜ - η∇J(θₜ)
    </text>
    
    <!-- Characteristics -->
    <text x="30" y="285" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">
      • High variance updates
    </text>
    <text x="30" y="300" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">
      • Oscillating path
    </text>
    <text x="30" y="315" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">
      • Slow convergence
    </text>
  </g>
  
  <!-- VS indicator -->
  <text x="400" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#9b59b6">
    VS
  </text>
  
  <!-- Momentum Section -->
  <g transform="translate(450, 70)">
    <text x="150" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#3498db">
      SGD with Momentum
    </text>
    
    <!-- Loss landscape background -->
    <rect x="20" y="30" width="260" height="200" fill="#e8f4fd" stroke="#3498db" stroke-width="2" rx="5"/>
    
    <!-- Contour lines representing loss landscape -->
    <ellipse cx="150" cy="130" rx="100" ry="60" fill="none" stroke="#ecf0f1" stroke-width="2"/>
    <ellipse cx="150" cy="130" rx="70" ry="40" fill="none" stroke="#ecf0f1" stroke-width="2"/>
    <ellipse cx="150" cy="130" rx="40" ry="25" fill="none" stroke="#ecf0f1" stroke-width="2"/>
    <ellipse cx="150" cy="130" rx="20" ry="12" fill="none" stroke="#ecf0f1" stroke-width="2"/>
    
    <!-- Global minimum -->
    <circle cx="150" cy="130" r="4" fill="#27ae60"/>
    <text x="150" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#27ae60">
      Global Min
    </text>
    
    <!-- Smooth momentum path -->
    <path d="M 80 80 Q 100 95 115 115 Q 130 125 140 128 Q 145 129 150 130"
          fill="none" stroke="#3498db" stroke-width="3"/>
    
    <!-- Starting point -->
    <circle cx="80" cy="80" r="5" fill="#3498db"/>
    <text x="80" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#3498db">
      Start
    </text>
    
    <!-- Velocity vectors -->
    <path d="M 100 95 L 110 100" stroke="#f39c12" stroke-width="2" marker-end="url(#arrowhead)"/>
    <path d="M 115 115 L 130 118" stroke="#f39c12" stroke-width="2" marker-end="url(#arrowhead)"/>
    <path d="M 140 128 L 148 129" stroke="#f39c12" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Mathematical formulas -->
    <text x="150" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">
      vₜ = β·vₜ₋₁ + (1-β)·∇J(θₜ)
    </text>
    <text x="150" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">
      θₜ₊₁ = θₜ - η·vₜ
    </text>
    
    <!-- Characteristics -->
    <text x="30" y="295" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">
      • Smooth trajectory
    </text>
    <text x="30" y="310" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">
      • Reduced oscillations
    </text>
    <text x="30" y="325" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">
      • Faster convergence
    </text>
  </g>
  
  <!-- Detailed comparison section -->
  <g transform="translate(50, 380)">
    <rect x="0" y="0" width="700" height="180" fill="#ecf0f1" stroke="#95a5a6" stroke-width="1" rx="5"/>
    
    <text x="20" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">
      Momentum Mechanism Explained
    </text>
    
    <!-- Exponential smoothing visualization -->
    <g transform="translate(20, 40)">
      <text x="0" y="15" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#34495e">
        Exponential Weighted Average:
      </text>
      
      <!-- Timeline -->
      <line x1="20" y1="40" x2="320" y2="40" stroke="#7f8c8d" stroke-width="2"/>
      
      <!-- Time steps -->
      <circle cx="50" cy="40" r="3" fill="#e74c3c"/>
      <text x="50" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">t-2</text>
      
      <circle cx="120" cy="40" r="3" fill="#e74c3c"/>
      <text x="120" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">t-1</text>
      
      <circle cx="190" cy="40" r="3" fill="#e74c3c"/>
      <text x="190" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">t</text>
      
      <circle cx="260" cy="40" r="4" fill="#3498db"/>
      <text x="260" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#3498db">current</text>
      
      <!-- Weights -->
      <text x="50" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c">β²</text>
      <text x="120" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c">β</text>
      <text x="190" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c">(1-β)</text>
      
      <!-- Formula -->
      <text x="350" y="45" font-family="Arial, sans-serif" font-size="12" fill="#333">
        v = β²·∇J₍ₜ₋₂₎ + β·∇J₍ₜ₋₁₎ + (1-β)·∇J₍ₜ₎
      </text>
    </g>
    
    <!-- Benefits comparison -->
    <g transform="translate(20, 100)">
      <text x="0" y="15" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#34495e">
        Key Benefits of Momentum:
      </text>
      
      <text x="20" y="35" font-family="Arial, sans-serif" font-size="11" fill="#27ae60">
        ✓ Noise Reduction: Smooths out gradient fluctuations
      </text>
      <text x="350" y="35" font-family="Arial, sans-serif" font-size="11" fill="#27ae60">
        ✓ Acceleration: Builds up speed in consistent directions
      </text>
      <text x="20" y="55" font-family="Arial, sans-serif" font-size="11" fill="#27ae60">
        ✓ Stability: Reduces oscillations in narrow valleys
      </text>
      <text x="350" y="55" font-family="Arial, sans-serif" font-size="11" fill="#27ae60">
        ✓ Efficiency: Typically β = 0.9 works well in practice
      </text>
    </g>
  </g>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="currentColor"/>
    </marker>
  </defs>
</svg>