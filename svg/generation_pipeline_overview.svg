<svg viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1400" height="900" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="700" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Generation Pipeline Overview
  </text>
  <text x="700" y="70" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#495057">
    From Retrieved Context to High-Quality Response
  </text>
  
  <!-- Input: Retrieved Documents -->
  <rect x="50" y="120" width="200" height="120" rx="10" fill="#e9ecef" stroke="#495057" stroke-width="2"/>
  <text x="150" y="150" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    📄 Input
  </text>
  <text x="150" y="175" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#495057">
    Retrieved Documents
  </text>
  <text x="70" y="200" font-family="Arial, sans-serif" font-size="10" fill="#868e96">
    • Doc 1: [content...]
  </text>
  <text x="70" y="218" font-family="Arial, sans-serif" font-size="10" fill="#868e96">
    • Doc 2: [content...]
  </text>
  <text x="70" y="236" font-family="Arial, sans-serif" font-size="10" fill="#868e96">
    • User Query
  </text>
  
  <!-- Arrow -->
  <path d="M 250 180 L 310 180" stroke="#495057" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Stage 1: Context Assembly -->
  <rect x="310" y="120" width="200" height="120" rx="10" fill="#fff5f5" stroke="#c92a2a" stroke-width="3"/>
  <text x="410" y="150" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    1️⃣ Context Assembly
  </text>
  <text x="330" y="180" font-family="Arial, sans-serif" font-size="11" fill="#495057">
    • Re-rank documents
  </text>
  <text x="330" y="197" font-family="Arial, sans-serif" font-size="11" fill="#495057">
    • Filter by relevance
  </text>
  <text x="330" y="214" font-family="Arial, sans-serif" font-size="11" fill="#495057">
    • Structure context
  </text>
  <text x="330" y="231" font-family="Arial, sans-serif" font-size="11" fill="#495057">
    • Manage token budget
  </text>
  
  <!-- Arrow -->
  <path d="M 510 180 L 570 180" stroke="#c92a2a" stroke-width="3" fill="none" marker-end="url(#arrowhead2)"/>
  
  <!-- Stage 2: Prompt Engineering -->
  <rect x="570" y="120" width="200" height="120" rx="10" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="3"/>
  <text x="670" y="150" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    2️⃣ Prompt Engineering
  </text>
  <text x="590" y="180" font-family="Arial, sans-serif" font-size="11" fill="#495057">
    • System instructions
  </text>
  <text x="590" y="197" font-family="Arial, sans-serif" font-size="11" fill="#495057">
    • Context injection
  </text>
  <text x="590" y="214" font-family="Arial, sans-serif" font-size="11" fill="#495057">
    • Task specification
  </text>
  <text x="590" y="231" font-family="Arial, sans-serif" font-size="11" fill="#495057">
    • User query
  </text>
  
  <!-- Arrow -->
  <path d="M 770 180 L 830 180" stroke="#1c7ed6" stroke-width="3" fill="none" marker-end="url(#arrowhead3)"/>
  
  <!-- Stage 3: Response Synthesis -->
  <rect x="830" y="120" width="200" height="120" rx="10" fill="#d3f9d8" stroke="#37b24d" stroke-width="3"/>
  <text x="930" y="150" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    3️⃣ Response Synthesis
  </text>
  <text x="850" y="180" font-family="Arial, sans-serif" font-size="11" fill="#495057">
    • LLM generation
  </text>
  <text x="850" y="197" font-family="Arial, sans-serif" font-size="11" fill="#495057">
    • Parameter tuning
  </text>
  <text x="850" y="214" font-family="Arial, sans-serif" font-size="11" fill="#495057">
    • Token streaming
  </text>
  <text x="850" y="231" font-family="Arial, sans-serif" font-size="11" fill="#495057">
    • Response creation
  </text>
  
  <!-- Arrow -->
  <path d="M 1030 180 L 1090 180" stroke="#37b24d" stroke-width="3" fill="none" marker-end="url(#arrowhead4)"/>
  
  <!-- Stage 4: Output Formatting -->
  <rect x="1090" y="120" width="260" height="120" rx="10" fill="#fff9db" stroke="#fab005" stroke-width="3"/>
  <text x="1220" y="150" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    4️⃣ Output Formatting
  </text>
  <text x="1110" y="180" font-family="Arial, sans-serif" font-size="11" fill="#495057">
    • Structure response (sections)
  </text>
  <text x="1110" y="197" font-family="Arial, sans-serif" font-size="11" fill="#495057">
    • Add markdown formatting
  </text>
  <text x="1110" y="214" font-family="Arial, sans-serif" font-size="11" fill="#495057">
    • Include source citations
  </text>
  <text x="1110" y="231" font-family="Arial, sans-serif" font-size="11" fill="#495057">
    • Enhance readability
  </text>
  
  <!-- Arrow Down -->
  <path d="M 700 240 L 700 310" stroke="#495057" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Stage 5: Quality Control -->
  <rect x="470" y="310" width="460" height="160" rx="10" fill="#e9d5ff" stroke="#9333ea" stroke-width="3"/>
  <text x="700" y="345" font-family="Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    5️⃣ Quality Control &amp; Validation
  </text>
  
  <rect x="490" y="365" width="200" height="90" rx="8" fill="#fff" stroke="#9333ea" stroke-width="2"/>
  <text x="590" y="390" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#9333ea">
    Automated Checks
  </text>
  <text x="510" y="413" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    • Factual accuracy
  </text>
  <text x="510" y="428" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    • Hallucination detection
  </text>
  <text x="510" y="443" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    • Safety filters
  </text>
  
  <rect x="710" y="365" width="200" height="90" rx="8" fill="#fff" stroke="#9333ea" stroke-width="2"/>
  <text x="810" y="390" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#9333ea">
    Quality Metrics
  </text>
  <text x="730" y="413" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    • Relevance scoring
  </text>
  <text x="730" y="428" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    • Coherence check
  </text>
  <text x="730" y="443" font-family="Arial, sans-serif" font-size="10" fill="#495057">
    • Citation validation
  </text>
  
  <!-- Arrow Down -->
  <path d="M 700 470 L 700 530" stroke="#9333ea" stroke-width="3" fill="none" marker-end="url(#arrowhead5)"/>
  
  <!-- Decision Diamond -->
  <g id="quality-check">
    <polygon points="700,530 780,580 700,630 620,580" fill="#fff3bf" stroke="#fcc419" stroke-width="3"/>
    <text x="700" y="575" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Quality
    </text>
    <text x="700" y="595" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Pass?
    </text>
  </g>
  
  <!-- No Path - Regenerate -->
  <path d="M 620 580 L 400 580 L 400 300 L 470 300" stroke="#e03131" stroke-width="2" stroke-dasharray="5,5" fill="none" marker-end="url(#arrowhead6)"/>
  <text x="500" y="560" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e03131">
    ❌ No - Regenerate
  </text>
  
  <!-- Yes Path -->
  <path d="M 700 630 L 700 700" stroke="#37b24d" stroke-width="3" fill="none" marker-end="url(#arrowhead4)"/>
  <text x="740" y="670" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#37b24d">
    ✅ Yes
  </text>
  
  <!-- Final Output -->
  <rect x="500" y="700" width="400" height="160" rx="10" fill="#d3f9d8" stroke="#37b24d" stroke-width="4"/>
  <text x="700" y="735" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    ✅ Final Response
  </text>
  <rect x="520" y="755" width="360" height="85" rx="5" fill="#fff" stroke="#37b24d" stroke-width="1"/>
  <text x="540" y="778" font-family="Arial, sans-serif" font-size="11" fill="#495057">
    • Accurate and grounded in context
  </text>
  <text x="540" y="795" font-family="Arial, sans-serif" font-size="11" fill="#495057">
    • Well-formatted and readable
  </text>
  <text x="540" y="812" font-family="Arial, sans-serif" font-size="11" fill="#495057">
    • Properly cited sources
  </text>
  <text x="540" y="829" font-family="Arial, sans-serif" font-size="11" fill="#495057">
    • Quality validated ✓
  </text>
  
  <!-- Key Metrics Box -->
  <rect x="50" y="320" width="350" height="250" rx="10" fill="#fff3bf" stroke="#fcc419" stroke-width="2"/>
  <text x="225" y="355" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    📊 Key Pipeline Metrics
  </text>
  
  <text x="70" y="390" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#495057">
    Performance:
  </text>
  <text x="70" y="410" font-family="Arial, sans-serif" font-size="11" fill="#495057">
    • Latency: Time to first token
  </text>
  <text x="70" y="427" font-family="Arial, sans-serif" font-size="11" fill="#495057">
    • Throughput: Responses per second
  </text>
  <text x="70" y="444" font-family="Arial, sans-serif" font-size="11" fill="#495057">
    • Token efficiency: Cost per query
  </text>
  
  <text x="70" y="475" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#495057">
    Quality:
  </text>
  <text x="70" y="495" font-family="Arial, sans-serif" font-size="11" fill="#495057">
    • Faithfulness: Alignment with sources
  </text>
  <text x="70" y="512" font-family="Arial, sans-serif" font-size="11" fill="#495057">
    • Relevance: Answers the query
  </text>
  <text x="70" y="529" font-family="Arial, sans-serif" font-size="11" fill="#495057">
    • Citation accuracy: Proper attribution
  </text>
  <text x="70" y="546" font-family="Arial, sans-serif" font-size="11" fill="#495057">
    • User satisfaction: Feedback ratings
  </text>
  
  <!-- Best Practices -->
  <rect x="1000" y="320" width="350" height="250" rx="10" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="2"/>
  <text x="1175" y="355" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    💡 Best Practices
  </text>
  
  <text x="1020" y="385" font-family="Arial, sans-serif" font-size="11" fill="#495057">
    ✓ Keep context concise and relevant
  </text>
  <text x="1020" y="405" font-family="Arial, sans-serif" font-size="11" fill="#495057">
    ✓ Use clear, explicit prompts
  </text>
  <text x="1020" y="425" font-family="Arial, sans-serif" font-size="11" fill="#495057">
    ✓ Set appropriate temperature (0.1-0.3)
  </text>
  <text x="1020" y="445" font-family="Arial, sans-serif" font-size="11" fill="#495057">
    ✓ Implement retry logic for failures
  </text>
  <text x="1020" y="465" font-family="Arial, sans-serif" font-size="11" fill="#495057">
    ✓ Validate all responses before delivery
  </text>
  <text x="1020" y="485" font-family="Arial, sans-serif" font-size="11" fill="#495057">
    ✓ Monitor quality metrics continuously
  </text>
  <text x="1020" y="505" font-family="Arial, sans-serif" font-size="11" fill="#495057">
    ✓ Collect user feedback for improvement
  </text>
  <text x="1020" y="525" font-family="Arial, sans-serif" font-size="11" fill="#495057">
    ✓ Cache common responses
  </text>
  <text x="1020" y="545" font-family="Arial, sans-serif" font-size="11" fill="#495057">
    ✓ Stream responses for better UX
  </text>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#495057"/>
    </marker>
    <marker id="arrowhead2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#c92a2a"/>
    </marker>
    <marker id="arrowhead3" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#1c7ed6"/>
    </marker>
    <marker id="arrowhead4" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#37b24d"/>
    </marker>
    <marker id="arrowhead5" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#9333ea"/>
    </marker>
    <marker id="arrowhead6" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#e03131"/>
    </marker>
  </defs>
</svg>