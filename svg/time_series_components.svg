<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="trendGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E74C3C;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#C0392B;stop-opacity:0.9"/>
    </linearGradient>
    <linearGradient id="seasonalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498DB;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#2980B9;stop-opacity:0.9"/>
    </linearGradient>
    <linearGradient id="cyclicalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#27AE60;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#229954;stop-opacity:0.9"/>
    </linearGradient>
    <linearGradient id="irregularGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F39C12;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#D68910;stop-opacity:0.9"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="700" fill="#FAFAFA"/>
  
  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2C3E50">
    Time Series Decomposition: Trend, Seasonal, Cyclical and Irregular Components
  </text>
  
  <!-- Original time series -->
  <g transform="translate(50, 60)">
    <text x="200" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2C3E50">
      Original Time Series Y(t)
    </text>
    
    <!-- Axes -->
    <line x1="20" y1="80" x2="380" y2="80" stroke="#34495E" stroke-width="1"/>
    <line x1="20" y1="20" x2="20" y2="80" stroke="#34495E" stroke-width="1"/>
    
    <!-- Combined time series curve -->
    <path d="M 30 60 Q 50 40, 70 50 Q 90 30, 110 45 Q 130 25, 150 40 Q 170 20, 190 35 Q 210 15, 230 30 Q 250 10, 270 25 Q 290 35, 310 45 Q 330 55, 350 65 Q 370 75, 390 70" 
          stroke="#34495E" stroke-width="3" fill="none"/>
    
    <!-- Axis labels -->
    <text x="390" y="85" font-family="Arial, sans-serif" font-size="12" fill="#666">Time</text>
    <text x="15" y="15" font-family="Arial, sans-serif" font-size="12" fill="#666">Value</text>
    
    <!-- Equation -->
    <text x="200" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50">
      Y(t) = T(t) + S(t) + C(t) + ε(t)
    </text>
  </g>
  
  <!-- Decomposition arrow -->
  <g transform="translate(480, 120)">
    <path d="M 0 0 L 0 40" stroke="#34495E" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
    <text x="10" y="25" font-family="Arial, sans-serif" font-size="12" fill="#34495E">Decompose</text>
  </g>
  
  <!-- Component plots -->
  <g transform="translate(50, 180)">
    
    <!-- Trend component -->
    <g transform="translate(0, 0)">
      <text x="100" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#E74C3C">
        Trend T(t)
      </text>
      
      <!-- Axes -->
      <line x1="10" y1="60" x2="190" y2="60" stroke="#666" stroke-width="1"/>
      <line x1="10" y1="10" x2="10" y2="60" stroke="#666" stroke-width="1"/>
      
      <!-- Trend curve -->
      <path d="M 20 50 Q 60 45, 100 35 Q 140 25, 180 15" 
            stroke="#E74C3C" stroke-width="3" fill="none"/>
      
      <text x="100" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">
        Long-term direction
      </text>
    </g>
    
    <!-- Seasonal component -->
    <g transform="translate(220, 0)">
      <text x="100" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#3498DB">
        Seasonal S(t)
      </text>
      
      <!-- Axes -->
      <line x1="10" y1="35" x2="190" y2="35" stroke="#666" stroke-width="1"/>
      <line x1="10" y1="10" x2="10" y2="60" stroke="#666" stroke-width="1"/>
      
      <!-- Seasonal pattern -->
      <path d="M 20 35 Q 30 20, 40 35 Q 50 50, 60 35 Q 70 20, 80 35 Q 90 50, 100 35 Q 110 20, 120 35 Q 130 50, 140 35 Q 150 20, 160 35 Q 170 50, 180 35" 
            stroke="#3498DB" stroke-width="3" fill="none"/>
      
      <text x="100" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">
        Regular periodic pattern
      </text>
    </g>
    
    <!-- Cyclical component -->
    <g transform="translate(440, 0)">
      <text x="100" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#27AE60">
        Cyclical C(t)
      </text>
      
      <!-- Axes -->
      <line x1="10" y1="35" x2="190" y2="35" stroke="#666" stroke-width="1"/>
      <line x1="10" y1="10" x2="10" y2="60" stroke="#666" stroke-width="1"/>
      
      <!-- Cyclical pattern -->
      <path d="M 20 35 Q 50 15, 80 35 Q 110 55, 140 35 Q 170 15, 180 25" 
            stroke="#27AE60" stroke-width="3" fill="none"/>
      
      <text x="100" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">
        Irregular long waves
      </text>
    </g>
    
    <!-- Irregular component -->
    <g transform="translate(660, 0)">
      <text x="100" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#F39C12">
        Irregular ε(t)
      </text>
      
      <!-- Axes -->
      <line x1="10" y1="35" x2="190" y2="35" stroke="#666" stroke-width="1"/>
      <line x1="10" y1="10" x2="10" y2="60" stroke="#666" stroke-width="1"/>
      
      <!-- Random fluctuations -->
      <path d="M 20 35 L 25 30 L 30 40 L 35 32 L 40 38 L 45 28 L 50 42 L 55 33 L 60 37 L 65 31 L 70 39 L 75 29 L 80 41 L 85 34 L 90 36 L 95 32 L 100 38 L 105 30 L 110 40 L 115 33 L 120 37 L 125 31 L 130 39 L 135 35 L 140 33 L 145 37 L 150 32 L 155 38 L 160 34 L 165 36 L 170 31 L 175 39 L 180 35" 
            stroke="#F39C12" stroke-width="2" fill="none"/>
      
      <text x="100" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">
        Random noise
      </text>
    </g>
  </g>
  
  <!-- Mathematical details -->
  <g transform="translate(50, 320)">
    <rect x="0" y="0" width="900" height="350" fill="#F8F9FA" stroke="#DDD" stroke-width="1" rx="8" filter="url(#shadow)"/>
    
    <text x="20" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2C3E50">Time Series Components: Mathematical Framework</text>
    
    <!-- Left column: Definitions -->
    <g transform="translate(30, 60)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#E74C3C">Additive Model:</text>
      <text x="0" y="25" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50">Y(t) = T(t) + S(t) + C(t) + ε(t)</text>
      
      <text x="0" y="60" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#3498DB">Multiplicative Model:</text>
      <text x="0" y="85" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50">Y(t) = T(t) × S(t) × C(t) × ε(t)</text>
      
      <text x="0" y="120" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#27AE60">Component Definitions:</text>
      <text x="0" y="145" font-family="Arial, sans-serif" font-size="13" fill="#333">• T(t): Long-term trend or direction</text>
      <text x="0" y="160" font-family="Arial, sans-serif" font-size="13" fill="#333">• S(t): Seasonal patterns (fixed period)</text>
      <text x="0" y="175" font-family="Arial, sans-serif" font-size="13" fill="#333">• C(t): Cyclical fluctuations (variable period)</text>
      <text x="0" y="190" font-family="Arial, sans-serif" font-size="13" fill="#333">• ε(t): Irregular/random component</text>
      
      <text x="0" y="225" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8E44AD">Seasonal vs Cyclical:</text>
      <text x="0" y="250" font-family="Arial, sans-serif" font-size="12" fill="#333">• Seasonal: Fixed period (daily, weekly, annual)</text>
      <text x="0" y="265" font-family="Arial, sans-serif" font-size="12" fill="#333">• Cyclical: Variable period (business cycles)</text>
      <text x="0" y="280" font-family="Arial, sans-serif" font-size="12" fill="#333">• Seasonal: Predictable timing</text>
      <text x="0" y="295" font-family="Arial, sans-serif" font-size="12" fill="#333">• Cyclical: Unpredictable duration</text>
    </g>
    
    <!-- Right column: Methods and applications -->
    <g transform="translate(450, 60)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#D35400">Decomposition Methods:</text>
      <text x="0" y="25" font-family="Arial, sans-serif" font-size="13" fill="#333">• Classical Decomposition</text>
      <text x="0" y="40" font-family="Arial, sans-serif" font-size="13" fill="#333">• X-11/X-13 ARIMA-SEATS</text>
      <text x="0" y="55" font-family="Arial, sans-serif" font-size="13" fill="#333">• STL (Seasonal-Trend Loess)</text>
      <text x="0" y="70" font-family="Arial, sans-serif" font-size="13" fill="#333">• Hodrick-Prescott Filter</text>
      <text x="0" y="85" font-family="Arial, sans-serif" font-size="13" fill="#333">• Wavelet Decomposition</text>
      
      <text x="0" y="120" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#C0392B">Applications:</text>
      <text x="0" y="145" font-family="Arial, sans-serif" font-size="13" fill="#333">• Economic forecasting</text>
      <text x="0" y="160" font-family="Arial, sans-serif" font-size="13" fill="#333">• Sales prediction</text>
      <text x="0" y="175" font-family="Arial, sans-serif" font-size="13" fill="#333">• Resource planning</text>
      <text x="0" y="190" font-family="Arial, sans-serif" font-size="13" fill="#333">• Anomaly detection</text>
      <text x="0" y="205" font-family="Arial, sans-serif" font-size="13" fill="#333">• Deseasonalization</text>
      
      <text x="0" y="240" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#16A085">Stationarity Concepts:</text>
      <text x="0" y="265" font-family="Arial, sans-serif" font-size="12" fill="#333">• Constant mean: E[Y(t)] = μ</text>
      <text x="0" y="280" font-family="Arial, sans-serif" font-size="12" fill="#333">• Constant variance: Var[Y(t)] = σ²</text>
      <text x="0" y="295" font-family="Arial, sans-serif" font-size="12" fill="#333">• Autocovariance depends only on lag</text>
      <text x="0" y="310" font-family="Arial, sans-serif" font-size="12" fill="#333">• Remove trend/seasonal for stationarity</text>
    </g>
  </g>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495E"/>
    </marker>
  </defs>
</svg>