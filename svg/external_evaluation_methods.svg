<svg width="900" height="600" viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="600" fill="url(#bgGradient)"/>
  
  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    External Evaluation Methods
  </text>
  <text x="450" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#7f8c8d">
    Comparing Algorithm Output to Ground Truth Clustering
  </text>
  
  <!-- Ground Truth Section -->
  <rect x="80" y="90" width="300" height="220" rx="10" fill="#27ae60" stroke="#229954" stroke-width="3" filter="url(#shadow)" opacity="0.1"/>
  <text x="230" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#229954">
    Ground Truth Clustering
  </text>
  
  <!-- Ground truth data points -->
  <g id="groundTruth">
    <!-- Cluster A (Green) -->
    <circle cx="150" cy="150" r="8" fill="#27ae60"/>
    <circle cx="170" cy="160" r="8" fill="#27ae60"/>
    <circle cx="160" cy="180" r="8" fill="#27ae60"/>
    <circle cx="140" cy="170" r="8" fill="#27ae60"/>
    
    <!-- Cluster B (Blue) -->
    <circle cx="250" cy="140" r="8" fill="#3498db"/>
    <circle cx="270" cy="150" r="8" fill="#3498db"/>
    <circle cx="260" cy="170" r="8" fill="#3498db"/>
    <circle cx="280" cy="160" r="8" fill="#3498db"/>
    
    <!-- Cluster C (Red) -->
    <circle cx="200" cy="230" r="8" fill="#e74c3c"/>
    <circle cx="220" cy="240" r="8" fill="#e74c3c"/>
    <circle cx="210" cy="260" r="8" fill="#e74c3c"/>
    <circle cx="190" cy="250" r="8" fill="#e74c3c"/>
  </g>
  
  <!-- Algorithm Output Section -->
  <rect x="520" y="90" width="300" height="220" rx="10" fill="#9b59b6" stroke="#8e44ad" stroke-width="3" filter="url(#shadow)" opacity="0.1"/>
  <text x="670" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#8e44ad">
    Algorithm Clustering Output
  </text>
  
  <!-- Algorithm output data points -->
  <g id="algorithmOutput">
    <!-- Cluster 1 (Purple) -->
    <circle cx="590" cy="150" r="8" fill="#9b59b6"/>
    <circle cx="610" cy="160" r="8" fill="#9b59b6"/>
    <circle cx="600" cy="180" r="8" fill="#9b59b6"/>
    <circle cx="580" cy="170" r="8" fill="#9b59b6"/>
    
    <!-- Cluster 2 (Orange) -->
    <circle cx="690" cy="140" r="8" fill="#f39c12"/>
    <circle cx="710" cy="150" r="8" fill="#f39c12"/>
    <circle cx="700" cy="170" r="8" fill="#f39c12"/>
    <circle cx="720" cy="160" r="8" fill="#f39c12"/>
    
    <!-- Cluster 3 (Teal) - with one misclassified point -->
    <circle cx="640" cy="230" r="8" fill="#1abc9c"/>
    <circle cx="660" cy="240" r="8" fill="#1abc9c"/>
    <circle cx="650" cy="260" r="8" fill="#1abc9c"/>
    <circle cx="720" cy="250" r="8" fill="#1abc9c"/> <!-- This point should be in cluster 2 -->
  </g>
  
  <!-- Comparison Arrow -->
  <path d="M 390 200 L 510 200" stroke="#34495e" stroke-width="4" fill="none" marker-end="url(#arrowhead)"/>
  <text x="450" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#34495e">
    Compare
  </text>
  
  <!-- Rand Index Calculation -->
  <rect x="150" y="340" width="600" height="180" rx="10" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">
    Rand Index Calculation
  </text>
  
  <!-- Confusion Matrix -->
  <rect x="200" y="380" width="200" height="120" rx="5" fill="#fff" stroke="#bdc3c7" stroke-width="2"/>
  <text x="300" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">
    Pair-wise Comparison
  </text>
  
  <!-- Matrix headers -->
  <text x="250" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#2c3e50">
    Same Cluster (GT)
  </text>
  <text x="350" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#2c3e50">
    Diff Cluster (GT)
  </text>
  
  <text x="170" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#2c3e50">
    Same (Alg)
  </text>
  <text x="170" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#2c3e50">
    Diff (Alg)
  </text>
  
  <!-- Matrix cells -->
  <rect x="220" y="415" width="60" height="30" fill="#27ae60" stroke="#229954" stroke-width="1"/>
  <text x="250" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">TP</text>
  
  <rect x="320" y="415" width="60" height="30" fill="#e74c3c" stroke="#c0392b" stroke-width="1"/>
  <text x="350" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">FP</text>
  
  <rect x="220" y="445" width="60" height="30" fill="#e74c3c" stroke="#c0392b" stroke-width="1"/>
  <text x="250" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">FN</text>
  
  <rect x="320" y="445" width="60" height="30" fill="#27ae60" stroke="#229954" stroke-width="1"/>
  <text x="350" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">TN</text>
  
  <!-- Rand Index Formula -->
  <rect x="450" y="380" width="250" height="120" rx="5" fill="#fff" stroke="#3498db" stroke-width="2"/>
  <text x="575" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
    Rand Index Formula
  </text>
  
  <text x="575" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#2c3e50">
    RI = (TP + TN) / (TP + TN + FP + FN)
  </text>
  
  <text x="575" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">
    Range: [0, 1]
  </text>
  <text x="575" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">
    1 = Perfect agreement
  </text>
  <text x="575" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">
    0 = No agreement
  </text>
  
  <!-- Adjusted Rand Index -->
  <rect x="200" y="530" width="500" height="50" rx="8" fill="#f8f9fa" stroke="#34495e" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
    Adjusted Rand Index (ARI): Corrects for chance clustering
  </text>
  <text x="450" y="568" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">
    ARI = (RI - Expected_RI) / (Max_RI - Expected_RI) | Range: [-1, 1]
  </text>
  
  <!-- Legend -->
  <rect x="50" y="530" width="120" height="50" rx="5" fill="#fff" stroke="#bdc3c7" stroke-width="1"/>
  <text x="110" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#2c3e50">
    Legend
  </text>
  <text x="110" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">
    GT = Ground Truth
  </text>
  <text x="110" y="573" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">
    Alg = Algorithm
  </text>
  
  <rect x="750" y="530" width="120" height="50" rx="5" fill="#fff" stroke="#bdc3c7" stroke-width="1"/>
  <text x="810" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#2c3e50">
    Other Metrics
  </text>
  <text x="810" y="558" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">
    • Normalized MI
  </text>
  <text x="810" y="571" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">
    • Fowlkes-Mallows
  </text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#34495e"/>
    </marker>
  </defs>
</svg>