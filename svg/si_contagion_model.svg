<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="800" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="600" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    SI Contagion Model: Propagation Dynamics
  </text>
  
  <!-- Time Step 0 -->
  <g id="step0">
    <text x="200" y="100" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#34495e">
      t = 0 (Initial)
    </text>
    
    <!-- Central active node -->
    <circle cx="200" cy="180" r="25" fill="#e74c3c" stroke="#c0392b" stroke-width="3"/>
    <text x="200" y="186" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">
      A
    </text>
    
    <!-- Surrounding inactive nodes -->
    <circle cx="120" cy="140" r="20" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    <circle cx="280" cy="140" r="20" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    <circle cx="280" cy="220" r="20" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    <circle cx="200" cy="260" r="20" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    <circle cx="120" cy="220" r="20" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    
    <!-- Edges -->
    <line x1="200" y1="180" x2="130" y2="150" stroke="#95a5a6" stroke-width="2"/>
    <line x1="200" y1="180" x2="270" y2="150" stroke="#95a5a6" stroke-width="2"/>
    <line x1="200" y1="180" x2="270" y2="210" stroke="#95a5a6" stroke-width="2"/>
    <line x1="200" y1="180" x2="200" y2="240" stroke="#95a5a6" stroke-width="2"/>
    <line x1="200" y1="180" x2="130" y2="210" stroke="#95a5a6" stroke-width="2"/>
  </g>
  
  <!-- Arrow 1 -->
  <g id="arrow1">
    <line x1="330" y1="180" x2="380" y2="180" stroke="#2c3e50" stroke-width="3" marker-end="url(#arrowhead)"/>
    <text x="355" y="165" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#e74c3c" font-weight="bold">
      p
    </text>
  </g>
  
  <!-- Time Step 1 -->
  <g id="step1">
    <text x="500" y="100" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#34495e">
      t = 1 (After 1st spread)
    </text>
    
    <!-- Active nodes -->
    <circle cx="500" cy="180" r="25" fill="#e74c3c" stroke="#c0392b" stroke-width="3"/>
    <text x="500" y="186" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">
      A
    </text>
    <circle cx="420" cy="140" r="20" fill="#27ae60" stroke="#229954" stroke-width="3"/>
    <circle cx="580" cy="140" r="20" fill="#27ae60" stroke="#229954" stroke-width="3"/>
    
    <!-- Inactive/failed nodes -->
    <circle cx="580" cy="220" r="20" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    <circle cx="500" cy="260" r="20" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    <circle cx="420" cy="220" r="20" fill="#27ae60" stroke="#229954" stroke-width="3"/>
    
    <!-- Edges -->
    <line x1="500" y1="180" x2="430" y2="150" stroke="#95a5a6" stroke-width="2"/>
    <line x1="500" y1="180" x2="570" y2="150" stroke="#95a5a6" stroke-width="2"/>
    <line x1="500" y1="180" x2="570" y2="210" stroke="#95a5a6" stroke-width="2"/>
    <line x1="500" y1="180" x2="500" y2="240" stroke="#95a5a6" stroke-width="2"/>
    <line x1="500" y1="180" x2="430" y2="210" stroke="#95a5a6" stroke-width="2"/>
    
    <!-- Propagation indicators -->
    <text x="450" y="128" font-family="Arial, sans-serif" font-size="10" fill="#27ae60" font-weight="bold">✓</text>
    <text x="550" y="128" font-family="Arial, sans-serif" font-size="10" fill="#27ae60" font-weight="bold">✓</text>
    <text x="450" y="208" font-family="Arial, sans-serif" font-size="10" fill="#27ae60" font-weight="bold">✓</text>
    <text x="550" y="208" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c" font-weight="bold">✗</text>
    <text x="500" y="248" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c" font-weight="bold">✗</text>
  </g>
  
  <!-- Arrow 2 -->
  <g id="arrow2">
    <line x1="630" y1="180" x2="680" y2="180" stroke="#2c3e50" stroke-width="3" marker-end="url(#arrowhead)"/>
    <text x="655" y="165" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#e74c3c" font-weight="bold">
      p
    </text>
  </g>
  
  <!-- Time Step 2 -->
  <g id="step2">
    <text x="850" y="100" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#34495e">
      t = 2 (Continued spread)
    </text>
    
    <!-- All active nodes -->
    <circle cx="850" cy="180" r="25" fill="#e74c3c" stroke="#c0392b" stroke-width="3"/>
    <text x="850" y="186" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">
      A
    </text>
    <circle cx="770" cy="140" r="20" fill="#27ae60" stroke="#229954" stroke-width="3"/>
    <circle cx="930" cy="140" r="20" fill="#27ae60" stroke="#229954" stroke-width="3"/>
    <circle cx="930" cy="220" r="20" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    <circle cx="850" cy="260" r="20" fill="#27ae60" stroke="#229954" stroke-width="3"/>
    <circle cx="770" cy="220" r="20" fill="#27ae60" stroke="#229954" stroke-width="3"/>
    
    <!-- Edges -->
    <line x1="850" y1="180" x2="780" y2="150" stroke="#95a5a6" stroke-width="2"/>
    <line x1="850" y1="180" x2="920" y2="150" stroke="#95a5a6" stroke-width="2"/>
    <line x1="850" y1="180" x2="920" y2="210" stroke="#95a5a6" stroke-width="2"/>
    <line x1="850" y1="180" x2="850" y2="240" stroke="#95a5a6" stroke-width="2"/>
    <line x1="850" y1="180" x2="780" y2="210" stroke="#95a5a6" stroke-width="2"/>
    
    <!-- New propagation indicators -->
    <text x="880" y="248" font-family="Arial, sans-serif" font-size="10" fill="#27ae60" font-weight="bold">✓</text>
    <text x="900" y="208" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c" font-weight="bold">✗</text>
  </g>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#2c3e50"/>
    </marker>
  </defs>
  
  <!-- Model Explanation -->
  <g id="explanation">
    <rect x="50" y="340" width="1100" height="420" fill="#ffffff" stroke="#bdc3c7" stroke-width="2" rx="10"/>
    
    <text x="600" y="380" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      SI Model Mechanics
    </text>
    
    <!-- Key properties box -->
    <rect x="100" y="410" width="480" height="320" fill="#ecf0f1" stroke="#95a5a6" stroke-width="2" rx="5"/>
    <text x="340" y="440" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Model Properties
    </text>
    
    <text x="120" y="470" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">
      <tspan x="120" dy="0">• <tspan font-weight="bold">States:</tspan> Inactive (Susceptible) or Active (Infected)</tspan>
      <tspan x="120" dy="30">• <tspan font-weight="bold">Propagation:</tspan> Each active node attempts to</tspan>
      <tspan x="130" dy="20">activate each inactive neighbor independently</tspan>
      <tspan x="120" dy="30">• <tspan font-weight="bold">Probability:</tspan> Each attempt succeeds with</tspan>
      <tspan x="130" dy="20">probability p (0 ≤ p ≤ 1)</tspan>
      <tspan x="120" dy="30">• <tspan font-weight="bold">One Shot:</tspan> Each node gets one attempt per</tspan>
      <tspan x="130" dy="20">neighbor</tspan>
      <tspan x="120" dy="30">• <tspan font-weight="bold">Monotonic:</tspan> Once active, nodes remain active</tspan>
      <tspan x="120" dy="30">• <tspan font-weight="bold">Termination:</tspan> Process stops when no new</tspan>
      <tspan x="130" dy="20">activations occur</tspan>
    </text>
    
    <!-- Legend box -->
    <rect x="620" y="410" width="480" height="320" fill="#ecf0f1" stroke="#95a5a6" stroke-width="2" rx="5"/>
    <text x="860" y="440" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Node States
    </text>
    
    <circle cx="680" cy="480" r="18" fill="#e74c3c" stroke="#c0392b" stroke-width="3"/>
    <text x="720" y="486" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">
      <tspan font-weight="bold">Active (Seed):</tspan> Initially active nodes
    </text>
    
    <circle cx="680" cy="540" r="18" fill="#27ae60" stroke="#229954" stroke-width="3"/>
    <text x="720" y="546" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">
      <tspan font-weight="bold">Active (Infected):</tspan> Newly activated nodes
    </text>
    
    <circle cx="680" cy="600" r="18" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    <text x="720" y="606" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">
      <tspan font-weight="bold">Inactive:</tspan> Not yet activated
    </text>
    
    <text x="720" y="660" font-family="Arial, sans-serif" font-size="14" fill="#27ae60" font-weight="bold">
      ✓ Successful activation (probability p)
    </text>
    
    <text x="720" y="690" font-family="Arial, sans-serif" font-size="14" fill="#e74c3c" font-weight="bold">
      ✗ Failed activation (probability 1-p)
    </text>
  </g>
  
  <!-- Formula -->
  <rect x="380" y="340" width="440" height="50" fill="#3498db" rx="5"/>
  <text x="600" y="370" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">
    P(node u activated | neighbor v active) = p
  </text>
</svg>