<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="500" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">
    Latent Variables: The Hidden Drivers of Apparent Relationships
  </text>
  
  <!-- What we observe (top) -->
  <g transform="translate(200, 80)">
    <rect width="400" height="80" fill="#ffebee" stroke="#d32f2f" stroke-width="2" rx="10"/>
    <text x="200" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#d32f2f">
      What We Observe (Apparent Relationship)
    </text>
    
    <!-- Observable variables -->
    <circle cx="100" cy="50" r="25" fill="#1976d2" stroke="#333" stroke-width="2"/>
    <text x="100" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">X</text>
    <text x="100" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Predictor</text>
    
    <path d="M 140 50 L 260 50" stroke="#d32f2f" stroke-width="4" marker-end="url(#arrowhead-red)"/>
    <text x="200" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#d32f2f">
      Strong Correlation
    </text>
    
    <circle cx="300" cy="50" r="25" fill="#ff9800" stroke="#333" stroke-width="2"/>
    <text x="300" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Y</text>
    <text x="300" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Outcome</text>
  </g>
  
  <!-- What actually happens (bottom) -->
  <g transform="translate(200, 220)">
    <rect width="400" height="200" fill="#e8f5e8" stroke="#388e3c" stroke-width="2" rx="10"/>
    <text x="200" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#388e3c">
      What Actually Happens (True Causal Structure)
    </text>
    
    <!-- Latent variable -->
    <circle cx="200" cy="70" r="30" fill="#7b1fa2" stroke="#333" stroke-width="3"/>
    <text x="200" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">Z</text>
    <text x="200" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#7b1fa2">
      Latent Variable
    </text>
    <text x="200" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">
      (Hidden Confounder)
    </text>
    
    <!-- Causal arrows from Z -->
    <path d="M 175 85 L 125 130" stroke="#388e3c" stroke-width="3" marker-end="url(#arrowhead-green)"/>
    <path d="M 225 85 L 275 130" stroke="#388e3c" stroke-width="3" marker-end="url(#arrowhead-green)"/>
    
    <!-- Observable variables (true model) -->
    <circle cx="100" cy="150" r="25" fill="#1976d2" stroke="#333" stroke-width="2"/>
    <text x="100" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">X</text>
    
    <circle cx="300" cy="150" r="25" fill="#ff9800" stroke="#333" stroke-width="2"/>
    <text x="300" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Y</text>
    
    <!-- Spurious correlation (dashed) -->
    <path d="M 130 150 L 270 150" stroke="#d32f2f" stroke-width="2" stroke-dasharray="10,5" opacity="0.7"/>
    <text x="200" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#d32f2f">
      Spurious correlation
    </text>
    
    <!-- Labels for causal arrows -->
    <text x="135" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#388e3c">
      Z causes X
    </text>
    <text x="265" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#388e3c">
      Z causes Y
    </text>
  </g>
  
  <!-- Examples box -->
  <g transform="translate(50, 450)">
    <rect width="700" height="40" fill="#fff3e0" stroke="#f57c00" stroke-width="2" rx="5"/>
    <text x="350" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f57c00">
      Common Examples
    </text>
    <text x="175" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">
      Market Size → (Advertising, Sales)
    </text>
    <text x="350" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">
      Wealth → (Chocolate, Nobel Prizes)
    </text>
    <text x="575" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">
      Health → (Exercise, Longevity)
    </text>
  </g>
  
  <!-- Key insight -->
  <g transform="translate(100, 180)">
    <text x="300" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#7b1fa2">
      Key Insight: X and Y appear related because both depend on hidden variable Z
    </text>
  </g>
  
  <!-- Arrow marker definitions -->
  <defs>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d32f2f"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#388e3c"/>
    </marker>
  </defs>
</svg>