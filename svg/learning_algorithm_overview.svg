<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1400" height="1000" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="700" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Learning Directed Graphical Models: Algorithm Overview
  </text>
  
  <!-- Two Approaches -->
  <g id="approaches">
    <!-- Interventional Data -->
    <rect x="50" y="70" width="630" height="220" fill="#e8f5e9" stroke="#388e3c" stroke-width="2" rx="10"/>
    <text x="365" y="105" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#2e7d32">
      Approach 1: Interventional Data
    </text>
    
    <rect x="80" y="125" width="570" height="80" fill="#c8e6c9" stroke="#388e3c" stroke-width="1" rx="5"/>
    <text x="90" y="148" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1b5e20">
      Method:
    </text>
    <text x="100" y="170" font-family="Arial, sans-serif" font-size="12" fill="#424242">
      • Intervene on variable A (set its value, knock out gene, etc.)
    </text>
    <text x="100" y="190" font-family="Arial, sans-serif" font-size="12" fill="#424242">
      • Observe changes in other variables
    </text>
    
    <rect x="80" y="215" width="270" height="60" fill="#a5d6a7" stroke="#388e3c" stroke-width="1" rx="5"/>
    <text x="90" y="238" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1b5e20">
      ✅ Advantages:
    </text>
    <text x="100" y="258" font-family="Arial, sans-serif" font-size="11" fill="#424242">
      • Strong causal evidence
    </text>
    <text x="100" y="271" font-family="Arial, sans-serif" font-size="11" fill="#424242">
      • Clear edge directions
    </text>
    
    <rect x="380" y="215" width="270" height="60" fill="#ffcdd2" stroke="#c62828" stroke-width="1" rx="5"/>
    <text x="390" y="238" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#b71c1c">
      ❌ Disadvantages:
    </text>
    <text x="400" y="258" font-family="Arial, sans-serif" font-size="11" fill="#424242">
      • Expensive/time-consuming
    </text>
    <text x="400" y="271" font-family="Arial, sans-serif" font-size="11" fill="#424242">
      • Often impossible/unethical
    </text>
    
    <!-- Observational Data -->
    <rect x="720" y="70" width="630" height="220" fill="#fff3e0" stroke="#f57c00" stroke-width="2" rx="10"/>
    <text x="1035" y="105" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#e65100">
      Approach 2: Observational Data
    </text>
    
    <rect x="750" y="125" width="570" height="80" fill="#ffe0b2" stroke="#f57c00" stroke-width="1" rx="5"/>
    <text x="760" y="148" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e65100">
      Method:
    </text>
    <text x="770" y="170" font-family="Arial, sans-serif" font-size="12" fill="#424242">
      • Use naturally occurring data (no intervention)
    </text>
    <text x="770" y="190" font-family="Arial, sans-serif" font-size="12" fill="#424242">
      • Learn from conditional independence patterns
    </text>
    
    <rect x="750" y="215" width="270" height="60" fill="#c8e6c9" stroke="#388e3c" stroke-width="1" rx="5"/>
    <text x="760" y="238" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1b5e20">
      ✅ Advantages:
    </text>
    <text x="770" y="258" font-family="Arial, sans-serif" font-size="11" fill="#424242">
      • Readily available
    </text>
    <text x="770" y="271" font-family="Arial, sans-serif" font-size="11" fill="#424242">
      • No ethical concerns
    </text>
    
    <rect x="1050" y="215" width="270" height="60" fill="#ffecb3" stroke="#f9a825" stroke-width="1" rx="5"/>
    <text x="1060" y="238" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f57f17">
      ⚠️ Limitations:
    </text>
    <text x="1070" y="258" font-family="Arial, sans-serif" font-size="11" fill="#424242">
      • Weak causal inference
    </text>
    <text x="1070" y="271" font-family="Arial, sans-serif" font-size="11" fill="#424242">
      • Many challenges (see below)
    </text>
  </g>
  
  <!-- Learning Algorithm from Observational Data -->
  <g id="algorithm">
    <rect x="50" y="320" width="1300" height="640" fill="#e3f2fd" stroke="#1976d2" stroke-width="3" rx="10"/>
    <text x="700" y="360" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#0d47a1">
      Learning Algorithm from Observational Data
    </text>
    
    <!-- Step 1 -->
    <rect x="90" y="390" width="580" height="140" fill="#bbdefb" stroke="#1976d2" stroke-width="2" rx="8"/>
    <text x="100" y="420" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0d47a1">
      Step 1: Start with Complete Undirected Graph
    </text>
    
    <text x="110" y="450" font-family="Arial, sans-serif" font-size="13" fill="#424242">
      • Initialize: All nodes connected to all other nodes
    </text>
    <text x="110" y="473" font-family="Arial, sans-serif" font-size="13" fill="#424242">
      • n nodes → n(n-1)/2 edges initially
    </text>
    
    <!-- Visual -->
    <circle cx="280" cy="500" r="15" fill="#90caf9" stroke="#1976d2" stroke-width="2"/>
    <circle cx="350" cy="500" r="15" fill="#90caf9" stroke="#1976d2" stroke-width="2"/>
    <circle cx="420" cy="500" r="15" fill="#90caf9" stroke="#1976d2" stroke-width="2"/>
    <circle cx="490" cy="500" r="15" fill="#90caf9" stroke="#1976d2" stroke-width="2"/>
    <line x1="280" y1="500" x2="350" y2="500" stroke="#1976d2" stroke-width="2"/>
    <line x1="350" y1="500" x2="420" y2="500" stroke="#1976d2" stroke-width="2"/>
    <line x1="420" y1="500" x2="490" y2="500" stroke="#1976d2" stroke-width="2"/>
    <line x1="280" y1="500" x2="420" y2="500" stroke="#1976d2" stroke-width="2"/>
    <line x1="280" y1="500" x2="490" y2="500" stroke="#1976d2" stroke-width="2"/>
    <line x1="350" y1="500" x2="490" y2="500" stroke="#1976d2" stroke-width="2"/>
    
    <!-- Arrow -->
    <polygon points="680,460 720,460 720,450 750,470 720,490 720,480 680,480" fill="#1976d2"/>
    
    <!-- Step 2 -->
    <rect x="770" y="390" width="550" height="140" fill="#90caf9" stroke="#1976d2" stroke-width="2" rx="8"/>
    <text x="780" y="420" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0d47a1">
      Step 2: Test Conditional Independence
    </text>
    
    <text x="790" y="450" font-family="Arial, sans-serif" font-size="13" fill="#424242">
      • For each pair (i, j): Test if i ⊥ j | S
    </text>
    <text x="790" y="473" font-family="Arial, sans-serif" font-size="13" fill="#424242">
      • S = subset of other variables
    </text>
    <text x="790" y="496" font-family="Arial, sans-serif" font-size="13" fill="#424242">
      • If independent: Remove edge between i and j
    </text>
    
    <!-- Visual -->
    <circle cx="960" cy="505" r="15" fill="#90caf9" stroke="#1976d2" stroke-width="2"/>
    <circle cx="1030" cy="505" r="15" fill="#90caf9" stroke="#1976d2" stroke-width="2"/>
    <circle cx="1100" cy="505" r="15" fill="#90caf9" stroke="#1976d2" stroke-width="2"/>
    <circle cx="1170" cy="505" r="15" fill="#90caf9" stroke="#1976d2" stroke-width="2"/>
    <line x1="960" y1="505" x2="1030" y2="505" stroke="#1976d2" stroke-width="2"/>
    <line x1="1030" y1="505" x2="1100" y2="505" stroke="#1976d2" stroke-width="2"/>
    <line x1="1100" y1="505" x2="1170" y2="505" stroke="#1976d2" stroke-width="2"/>
    <line x1="1030" y1="505" x2="1170" y2="505" stroke="#1976d2" stroke-width="2" stroke-dasharray="5,5" opacity="0.3"/>
    <text x="1100" y="495" font-family="Arial, sans-serif" font-size="11" fill="#c62828">removed</text>
    
    <!-- Arrow down -->
    <polygon points="375,540 375,570 365,570 385,600 405,570 395,570 395,540" fill="#1976d2"/>
    
    <!-- Step 3 -->
    <rect x="90" y="620" width="580" height="140" fill="#64b5f6" stroke="#1976d2" stroke-width="2" rx="8"/>
    <text x="100" y="650" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0d47a1">
      Step 3: Identify and Orient V-Structures
    </text>
    
    <text x="110" y="680" font-family="Arial, sans-serif" font-size="13" fill="#424242">
      • Find triplets: i and j independent, but dependent | k
    </text>
    <text x="110" y="703" font-family="Arial, sans-serif" font-size="13" fill="#424242">
      • This means: k is descendant of both i and j
    </text>
    <text x="110" y="726" font-family="Arial, sans-serif" font-size="13" fill="#424242">
      • Orient as: i → k ← j (V-structure)
    </text>
    
    <!-- Visual -->
    <defs>
      <marker id="arrow-algo" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
        <polygon points="0 0, 10 3, 0 6" fill="#1976d2"/>
      </marker>
    </defs>
    <circle cx="320" cy="735" r="15" fill="#90caf9" stroke="#1976d2" stroke-width="2"/>
    <circle cx="420" cy="735" r="15" fill="#90caf9" stroke="#1976d2" stroke-width="2"/>
    <circle cx="370" cy="735" r="15" fill="#ffb74d" stroke="#f57c00" stroke-width="2"/>
    <line x1="335" y1="735" x2="355" y2="735" stroke="#1976d2" stroke-width="3" marker-end="url(#arrow-algo)"/>
    <line x1="405" y1="735" x2="385" y2="735" stroke="#1976d2" stroke-width="3" marker-end="url(#arrow-algo)"/>
    
    <!-- Arrow -->
    <polygon points="680,690 720,690 720,680 750,700 720,720 720,710 680,710" fill="#1976d2"/>
    
    <!-- Step 4 -->
    <rect x="770" y="620" width="550" height="140" fill="#42a5f5" stroke="#1976d2" stroke-width="2" rx="8"/>
    <text x="780" y="650" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0d47a1">
      Step 4: Propagate Edge Orientations
    </text>
    
    <text x="790" y="680" font-family="Arial, sans-serif" font-size="13" fill="#424242">
      • Use acyclicity constraint (no cycles)
    </text>
    <text x="790" y="703" font-family="Arial, sans-serif" font-size="13" fill="#424242">
      • Orient additional edges to avoid creating cycles
    </text>
    <text x="790" y="726" font-family="Arial, sans-serif" font-size="13" fill="#424242">
      • Some edges may remain undirected
    </text>
    
    <!-- Visual -->
    <circle cx="960" cy="735" r="15" fill="#90caf9" stroke="#1976d2" stroke-width="2"/>
    <circle cx="1030" cy="735" r="15" fill="#90caf9" stroke="#1976d2" stroke-width="2"/>
    <circle cx="1100" cy="735" r="15" fill="#90caf9" stroke="#1976d2" stroke-width="2"/>
    <line x1="975" y1="735" x2="1015" y2="735" stroke="#1976d2" stroke-width="3" marker-end="url(#arrow-algo)"/>
    <line x1="1045" y1="735" x2="1085" y2="735" stroke="#1976d2" stroke-width="3" marker-end="url(#arrow-algo)"/>
    
    <!-- Result -->
    <rect x="90" y="800" width="1230" height="140" fill="#1e88e5" stroke="#0d47a1" stroke-width="3" rx="8"/>
    <text x="705" y="835" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#fff">
      Result: Partially Directed Graph
    </text>
    
    <rect x="120" y="855" width="560" height="65" fill="#bbdefb" stroke="#1976d2" stroke-width="1" rx="5"/>
    <text x="130" y="880" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0d47a1">
      What We Learn:
    </text>
    <text x="140" y="903" font-family="Arial, sans-serif" font-size="12" fill="#424242">
      • V-structures (colliders) are identifiable
    </text>
    <text x="140" y="921" font-family="Arial, sans-serif" font-size="12" fill="#424242">
      • Skeleton (undirected connections) is learned
    </text>
    
    <rect x="720" y="855" width="580" height="65" fill="#ffecb3" stroke="#f9a825" stroke-width="1" rx="5"/>
    <text x="730" y="880" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f57f17">
      Limitations:
    </text>
    <text x="740" y="903" font-family="Arial, sans-serif" font-size="12" fill="#424242">
      • Some edges remain undirected (need domain knowledge)
    </text>
    <text x="740" y="921" font-family="Arial, sans-serif" font-size="12" fill="#424242">
      • Subject to challenges: hidden variables, cancellation, etc.
    </text>
  </g>
</svg>