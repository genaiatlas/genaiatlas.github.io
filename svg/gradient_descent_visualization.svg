<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="gd-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3498db"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">Gradient Descent Optimization</text>
  <text x="450" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">Finding the Minimum of a Cost Function</text>
  
  <!-- Main optimization landscape -->
  <rect x="50" y="80" width="500" height="350" rx="10" fill="#ffffff" stroke="#bdc3c7" stroke-width="2"/>
  
  <!-- Axes -->
  <line x1="80" y1="400" x2="520" y2="400" stroke="#34495e" stroke-width="2"/>
  <line x1="80" y1="400" x2="80" y2="120" stroke="#34495e" stroke-width="2"/>
  
  <!-- Axis labels -->
  <text x="550" y="405" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Parameter</text>
  <text x="25" y="260" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50" transform="rotate(-90, 25, 260)">Cost</text>
  
  <!-- Cost function curve (quadratic) -->
  <path d="M 100 350 Q 200 200 300 130 Q 400 200 500 350" stroke="#e74c3c" stroke-width="4" fill="none"/>
  
  <!-- Global minimum point -->
  <circle cx="300" cy="130" r="6" fill="#27ae60" stroke="#229954" stroke-width="2"/>
  <text x="300" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#27ae60">Global Minimum</text>
  <text x="300" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#27ae60">Optimal Point</text>
  
  <!-- Gradient descent path -->
  <circle cx="450" cy="300" r="4" fill="#3498db"/>
  <text x="470" y="305" font-family="Arial, sans-serif" font-size="8" fill="#3498db">Start</text>
  
  <circle cx="420" cy="240" r="4" fill="#3498db"/>
  <circle cx="380" cy="190" r="4" fill="#3498db"/>
  <circle cx="350" cy="155" r="4" fill="#3498db"/>
  <circle cx="325" cy="140" r="4" fill="#3498db"/>
  <circle cx="310" cy="132" r="4" fill="#3498db"/>
  <circle cx="302" cy="131" r="4" fill="#3498db"/>
  
  <!-- Path arrows -->
  <line x1="445" y1="295" x2="425" y2="245" stroke="#3498db" stroke-width="2" marker-end="url(#gd-arrow)"/>
  <line x1="415" y1="235" x2="385" y2="195" stroke="#3498db" stroke-width="2" marker-end="url(#gd-arrow)"/>
  <line x1="375" y1="185" x2="355" y2="160" stroke="#3498db" stroke-width="2" marker-end="url(#gd-arrow)"/>
  <line x1="345" y1="150" x2="330" y2="145" stroke="#3498db" stroke-width="2" marker-end="url(#gd-arrow)"/>
  <line x1="320" y1="138" x2="315" y2="134" stroke="#3498db" stroke-width="2" marker-end="url(#gd-arrow)"/>
  <line x1="308" y1="133" x2="305" y2="132" stroke="#3498db" stroke-width="2" marker-end="url(#gd-arrow)"/>
  
  <!-- Tangent line showing gradient -->
  <line x1="430" y1="270" x2="470" y2="330" stroke="#f39c12" stroke-width="3"/>
  <text x="475" y="335" font-family="Arial, sans-serif" font-size="9" fill="#f39c12">gradient</text>
  
  <!-- Learning rate illustration -->
  <rect x="570" y="80" width="300" height="350" rx="10" fill="#ecf0f1" stroke="#95a5a6" stroke-width="2"/>
  <text x="720" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Learning Rate Effects</text>
  
  <!-- Small learning rate -->
  <rect x="590" y="130" width="120" height="80" rx="5" fill="#d5e8fc" stroke="#3498db" stroke-width="1"/>
  <text x="650" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">Small Rate</text>
  <path d="M 600 190 L 605 185 L 610 180 L 615 175 L 620 170 L 625 165 L 630 161 L 635 158 L 640 156 L 645 154 L 650 153 L 655 152 L 660 151.5 L 665 151.2 L 670 151" stroke="#3498db" stroke-width="2" fill="none"/>
  <text x="650" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#34495e">Slow, Stable</text>
  
  <!-- Optimal learning rate -->
  <rect x="720" y="130" width="120" height="80" rx="5" fill="#d5f4e6" stroke="#27ae60" stroke-width="1"/>
  <text x="780" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">Good Rate</text>
  <path d="M 730 190 L 740 175 L 750 165 L 760 158 L 770 154 L 780 152 L 790 151 L 800 150.5 L 810 150.2" stroke="#27ae60" stroke-width="2" fill="none"/>
  <text x="780" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#34495e">Fast, Stable</text>
  
  <!-- Large learning rate -->
  <rect x="590" y="230" width="120" height="80" rx="5" fill="#fee8e8" stroke="#e74c3c" stroke-width="1"/>
  <text x="650" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">Large Rate</text>
  <path d="M 600 290 Q 620 250 640 285 Q 660 260 680 295 Q 690 270 700 300" stroke="#e74c3c" stroke-width="2" fill="none"/>
  <text x="650" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#34495e">Oscillating</text>
  
  <!-- Too large learning rate -->
  <rect x="720" y="230" width="120" height="80" rx="5" fill="#fdeaea" stroke="#c0392b" stroke-width="1"/>
  <text x="780" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">Too Large</text>
  <path d="M 730 280 Q 740 240 750 290 Q 760 230 770 295 Q 780 220 790 300 Q 800 210 810 305" stroke="#c0392b" stroke-width="2" fill="none"/>
  <text x="780" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#34495e">Diverging</text>
  
  <!-- Algorithm box -->
  <rect x="570" y="330" width="300" height="90" rx="5" fill="#ffffff" stroke="#34495e" stroke-width="2"/>
  <text x="720" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Update Rule</text>
  
  <text x="590" y="370" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">theta = theta - alpha * gradient</text>
  
  <text x="590" y="390" font-family="Arial, sans-serif" font-size="10" fill="#34495e">Where alpha = learning rate (step size)</text>
  
  <!-- Mathematical foundation -->
  <rect x="50" y="450" width="500" height="120" rx="10" fill="#f8f9fa" stroke="#bdc3c7" stroke-width="2"/>
  <text x="300" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Gradient Computation</text>
  
  <text x="70" y="500" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">For Mean Squared Error:</text>
  <text x="70" y="515" font-family="Arial, sans-serif" font-size="11" fill="#34495e">Cost = 0.5 * mean((prediction - actual)^2)</text>
  
  <text x="70" y="535" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">Gradient:</text>
  <text x="70" y="550" font-family="Arial, sans-serif" font-size="11" fill="#34495e">gradient = mean((prediction - actual) * input)</text>
  
  <!-- Convergence indicator -->
  <rect x="350" y="490" width="180" height="70" rx="5" fill="#e8f8fd" stroke="#3498db" stroke-width="1"/>
  <text x="440" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">Convergence Criteria</text>
  <text x="440" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#34495e">Gradient approaches zero</text>
  <text x="440" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#34495e">or max iterations reached</text>
  <text x="440" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">Small threshold epsilon</text>
  
  <!-- Variants box -->
  <rect x="570" y="450" width="300" height="120" rx="10" fill="#f8f9fa" stroke="#9b59b6" stroke-width="2"/>
  <text x="720" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Algorithm Variants</text>
  
  <text x="590" y="495" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#8e44ad">Batch GD:</text>
  <text x="670" y="495" font-family="Arial, sans-serif" font-size="10" fill="#34495e">Uses entire dataset</text>
  
  <text x="590" y="510" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#8e44ad">Stochastic GD:</text>
  <text x="685" y="510" font-family="Arial, sans-serif" font-size="10" fill="#34495e">One sample at a time</text>
  
  <text x="590" y="525" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#8e44ad">Mini-batch GD:</text>
  <text x="690" y="525" font-family="Arial, sans-serif" font-size="10" fill="#34495e">Small batches</text>
  
  <text x="590" y="545" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#8e44ad">Momentum:</text>
  <text x="660" y="545" font-family="Arial, sans-serif" font-size="10" fill="#34495e">Accelerates convergence</text>
  
  <text x="590" y="560" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#8e44ad">Adam:</text>
  <text x="630" y="560" font-family="Arial, sans-serif" font-size="10" fill="#34495e">Adaptive learning rates</text>
</svg>