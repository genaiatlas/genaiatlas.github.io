<svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="500" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">Feature Encoding Process: From Raw Data to Predictions</text>
  
  <!-- Raw Data Section -->
  <g id="raw-data">
    <rect x="50" y="80" width="150" height="300" fill="#ecf0f1" stroke="#95a5a6" stroke-width="2" rx="10"/>
    <text x="125" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Raw Data</text>
    
    <!-- Image representation -->
    <rect x="70" y="130" width="50" height="40" fill="#3498db" opacity="0.7"/>
    <rect x="130" y="130" width="50" height="40" fill="#e74c3c" opacity="0.7"/>
    <text x="125" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Images</text>
    
    <!-- Text representation -->
    <rect x="70" y="200" width="110" height="5" fill="#8e44ad" opacity="0.6"/>
    <rect x="70" y="210" width="90" height="5" fill="#8e44ad" opacity="0.4"/>
    <rect x="70" y="220" width="100" height="5" fill="#8e44ad" opacity="0.3"/>
    <text x="125" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Text</text>
    
    <!-- Molecular structure -->
    <g id="molecule-raw">
      <circle cx="90" cy="270" r="4" fill="#e74c3c"/>
      <circle cx="105" cy="260" r="4" fill="#3498db"/>
      <circle cx="120" cy="270" r="4" fill="#2ecc71"/>
      <circle cx="135" cy="255" r="4" fill="#f39c12"/>
      <circle cx="150" cy="275" r="4" fill="#9b59b6"/>
      
      <!-- Bonds -->
      <line x1="90" y1="270" x2="105" y2="260" stroke="#34495e" stroke-width="1"/>
      <line x1="105" y1="260" x2="120" y2="270" stroke="#34495e" stroke-width="1"/>
      <line x1="120" y1="270" x2="135" y2="255" stroke="#34495e" stroke-width="1"/>
      <line x1="135" y1="255" x2="150" y2="275" stroke="#34495e" stroke-width="1"/>
    </g>
    <text x="125" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Molecules</text>
    
    <!-- Sensor data -->
    <polyline points="70,320 85,310 100,325 115,315 130,330 145,320 160,335 175,325" 
              fill="none" stroke="#27ae60" stroke-width="2"/>
    <text x="125" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Sensor Data</text>
  </g>
  
  <!-- Feature Extraction Arrow -->
  <g id="extraction-arrow">
    <line x1="220" y1="230" x2="280" y2="230" stroke="#34495e" stroke-width="3" marker-end="url(#arrowhead)"/>
    <text x="250" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#34495e">Feature</text>
    <text x="250" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#34495e">Extraction</text>
  </g>
  
  <!-- Feature Vectors Section -->
  <g id="feature-vectors">
    <rect x="300" y="80" width="150" height="300" fill="#e8f6f3" stroke="#16a085" stroke-width="2" rx="10"/>
    <text x="375" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#16a085">Feature Vectors</text>
    
    <!-- Vector representations -->
    <g id="vectors">
      <!-- Image features -->
      <rect x="320" y="130" width="10" height="40" fill="#3498db"/>
      <rect x="335" y="130" width="10" height="35" fill="#e74c3c"/>
      <rect x="350" y="130" width="10" height="45" fill="#f39c12"/>
      <rect x="365" y="130" width="10" height="30" fill="#2ecc71"/>
      <rect x="380" y="130" width="10" height="40" fill="#9b59b6"/>
      <rect x="395" y="130" width="10" height="35" fill="#e67e22"/>
      <rect x="410" y="130" width="10" height="42" fill="#34495e"/>
      <rect x="425" y="130" width="10" height="38" fill="#95a5a6"/>
      <text x="375" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">φ(image)</text>
      
      <!-- Text features -->
      <rect x="320" y="210" width="8" height="25" fill="#8e44ad"/>
      <rect x="332" y="210" width="8" height="30" fill="#8e44ad"/>
      <rect x="344" y="210" width="8" height="20" fill="#8e44ad"/>
      <rect x="356" y="210" width="8" height="35" fill="#8e44ad"/>
      <rect x="368" y="210" width="8" height="15" fill="#8e44ad"/>
      <rect x="380" y="210" width="8" height="28" fill="#8e44ad"/>
      <rect x="392" y="210" width="8" height="22" fill="#8e44ad"/>
      <rect x="404" y="210" width="8" height="32" fill="#8e44ad"/>
      <rect x="416" y="210" width="8" height="18" fill="#8e44ad"/>
      <rect x="428" y="210" width="8" height="26" fill="#8e44ad"/>
      <text x="375" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">φ(text)</text>
      
      <!-- Molecular features -->
      <rect x="320" y="270" width="6" height="30" fill="#e74c3c"/>
      <rect x="330" y="270" width="6" height="25" fill="#3498db"/>
      <rect x="340" y="270" width="6" height="35" fill="#2ecc71"/>
      <rect x="350" y="270" width="6" height="20" fill="#f39c12"/>
      <rect x="360" y="270" width="6" height="28" fill="#9b59b6"/>
      <rect x="370" y="270" width="6" height="32" fill="#e67e22"/>
      <rect x="380" y="270" width="6" height="18" fill="#34495e"/>
      <rect x="390" y="270" width="6" height="26" fill="#95a5a6"/>
      <rect x="400" y="270" width="6" height="22" fill="#16a085"/>
      <rect x="410" y="270" width="6" height="30" fill="#f1c40f"/>
      <rect x="420" y="270" width="6" height="24" fill="#c0392b"/>
      <rect x="430" y="270" width="6" height="28" fill="#8e44ad"/>
      <text x="375" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">φ(molecule)</text>
    </g>
  </g>
  
  <!-- Model Training Arrow -->
  <g id="model-arrow">
    <line x1="470" y1="230" x2="530" y2="230" stroke="#34495e" stroke-width="3" marker-end="url(#arrowhead)"/>
    <text x="500" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#34495e">Model</text>
    <text x="500" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#34495e">Training</text>
  </g>
  
  <!-- Neural Network Section -->
  <g id="neural-network-section">
    <rect x="550" y="80" width="200" height="300" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="10"/>
    <text x="650" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ff9800">Neural Network</text>
    
    <!-- Simplified network diagram -->
    <g id="mini-network">
      <!-- Input layer -->
      <circle cx="580" cy="150" r="12" fill="#3498db" stroke="#2980b9" stroke-width="1"/>
      <circle cx="580" cy="180" r="12" fill="#3498db" stroke="#2980b9" stroke-width="1"/>
      <circle cx="580" cy="210" r="12" fill="#3498db" stroke="#2980b9" stroke-width="1"/>
      <circle cx="580" cy="240" r="12" fill="#3498db" stroke="#2980b9" stroke-width="1"/>
      
      <!-- Hidden layer -->
      <circle cx="650" cy="140" r="12" fill="#e74c3c" stroke="#c0392b" stroke-width="1"/>
      <circle cx="650" cy="170" r="12" fill="#e74c3c" stroke="#c0392b" stroke-width="1"/>
      <circle cx="650" cy="200" r="12" fill="#e74c3c" stroke="#c0392b" stroke-width="1"/>
      <circle cx="650" cy="230" r="12" fill="#e74c3c" stroke="#c0392b" stroke-width="1"/>
      <circle cx="650" cy="260" r="12" fill="#e74c3c" stroke="#c0392b" stroke-width="1"/>
      
      <!-- Output layer -->
      <circle cx="720" cy="180" r="12" fill="#f39c12" stroke="#e67e22" stroke-width="1"/>
      <circle cx="720" cy="220" r="12" fill="#f39c12" stroke="#e67e22" stroke-width="1"/>
      
      <!-- Connections (simplified) -->
      <g opacity="0.4">
        <line x1="592" y1="150" x2="638" y2="140" stroke="#34495e" stroke-width="1"/>
        <line x1="592" y1="150" x2="638" y2="170" stroke="#34495e" stroke-width="1"/>
        <line x1="592" y1="150" x2="638" y2="200" stroke="#34495e" stroke-width="1"/>
        <line x1="592" y1="180" x2="638" y2="170" stroke="#34495e" stroke-width="1"/>
        <line x1="592" y1="180" x2="638" y2="200" stroke="#34495e" stroke-width="1"/>
        <line x1="592" y1="210" x2="638" y2="230" stroke="#34495e" stroke-width="1"/>
        <line x1="592" y1="240" x2="638" y2="260" stroke="#34495e" stroke-width="1"/>
        
        <line x1="662" y1="170" x2="708" y2="180" stroke="#34495e" stroke-width="1"/>
        <line x1="662" y1="200" x2="708" y2="180" stroke="#34495e" stroke-width="1"/>
        <line x1="662" y1="230" x2="708" y2="220" stroke="#34495e" stroke-width="1"/>
        <line x1="662" y1="260" x2="708" y2="220" stroke="#34495e" stroke-width="1"/>
      </g>
    </g>
    
    <!-- Learning equations -->
    <text x="585" y="300" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">θ = argmin L(θ, X, y)</text>
    <text x="585" y="320" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Learns φ(x) and f jointly</text>
    <text x="585" y="340" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">End-to-end optimization</text>
  </g>
  
  <!-- Prediction Arrow -->
  <g id="prediction-arrow">
    <line x1="770" y1="230" x2="830" y2="230" stroke="#34495e" stroke-width="3" marker-end="url(#arrowhead)"/>
    <text x="800" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#34495e">Make</text>
    <text x="800" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#34495e">Predictions</text>
  </g>
  
  <!-- Output Section -->
  <g id="output">
    <rect x="850" y="80" width="120" height="300" fill="#e8f5e8" stroke="#27ae60" stroke-width="2" rx="10"/>
    <text x="910" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#27ae60">Predictions</text>
    
    <!-- Categories -->
    <rect x="870" y="130" width="80" height="20" fill="#2ecc71" opacity="0.8"/>
    <text x="910" y="143" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff">Category</text>
    
    <!-- Sentiment -->
    <circle cx="885" cy="175" r="10" fill="#e74c3c"/>
    <circle cx="910" cy="175" r="10" fill="#f39c12"/>
    <circle cx="935" cy="175" r="10" fill="#2ecc71"/>
    <text x="910" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Sentiment</text>
    
    <!-- Properties -->
    <rect x="870" y="210" width="15" height="30" fill="#3498db"/>
    <rect x="890" y="210" width="15" height="25" fill="#e74c3c"/>
    <rect x="910" y="210" width="15" height="35" fill="#f39c12"/>
    <rect x="930" y="210" width="15" height="20" fill="#2ecc71"/>
    <text x="910" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Properties</text>
    
    <!-- Probability -->
    <text x="910" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">P(y|x) = 0.87</text>
    <text x="910" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Confidence</text>
  </g>
  
  <!-- Traditional vs Neural comparison -->
  <g id="comparison">
    <rect x="300" y="420" width="400" height="60" fill="#f4f4f4" stroke="#7f8c8d" stroke-width="1" rx="5"/>
    <text x="500" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Key Advantage: Automatic Feature Learning</text>
    <text x="320" y="455" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Traditional: Manual feature engineering → Fixed φ(x) → Train classifier</text>
    <text x="320" y="470" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Neural Networks: Learn optimal φ(x) and classifier simultaneously</text>
  </g>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e" />
    </marker>
  </defs>
</svg>