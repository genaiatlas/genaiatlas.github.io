<svg width="800" height="700" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="700" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1e293b">
    Retail AI Applications
  </text>
  
  <!-- Customer Experience Section -->
  <rect x="50" y="80" width="300" height="180" rx="10" fill="#10b981" stroke="#047857" stroke-width="2"/>
  <text x="200" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
    Customer Experience
  </text>
  
  <!-- Personalization -->
  <circle cx="120" cy="140" r="25" fill="#34d399" stroke="#047857" stroke-width="2"/>
  <text x="120" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#047857">
    P
  </text>
  <text x="120" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Personalization
  </text>
  
  <!-- Recommendations -->
  <circle cx="200" cy="140" r="25" fill="#34d399" stroke="#047857" stroke-width="2"/>
  <text x="200" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#047857">
    R
  </text>
  <text x="200" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Recommendations
  </text>
  
  <!-- Chatbots -->
  <circle cx="280" cy="140" r="25" fill="#34d399" stroke="#047857" stroke-width="2"/>
  <text x="280" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#047857">
    C
  </text>
  <text x="280" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Chatbots
  </text>
  
  <!-- Dynamic Pricing -->
  <circle cx="160" cy="210" r="25" fill="#34d399" stroke="#047857" stroke-width="2"/>
  <text x="160" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#047857">
    D
  </text>
  <text x="160" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Dynamic Pricing
  </text>
  
  <!-- Supply Chain Section -->
  <rect x="450" y="80" width="300" height="180" rx="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="600" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
    Supply Chain Optimization
  </text>
  
  <!-- Demand Forecasting -->
  <circle cx="520" cy="140" r="25" fill="#60a5fa" stroke="#1e40af" stroke-width="2"/>
  <text x="520" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1e40af">
    F
  </text>
  <text x="520" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Demand Forecast
  </text>
  
  <!-- Inventory Management -->
  <circle cx="600" cy="140" r="25" fill="#60a5fa" stroke="#1e40af" stroke-width="2"/>
  <text x="600" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1e40af">
    I
  </text>
  <text x="600" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Inventory Mgmt
  </text>
  
  <!-- Warehouse Automation -->
  <circle cx="680" cy="140" r="25" fill="#60a5fa" stroke="#1e40af" stroke-width="2"/>
  <text x="680" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1e40af">
    W
  </text>
  <text x="680" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Warehouse
  </text>
  
  <!-- Route Optimization -->
  <circle cx="560" cy="210" r="25" fill="#60a5fa" stroke="#1e40af" stroke-width="2"/>
  <text x="560" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1e40af">
    O
  </text>
  <text x="560" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Route Optimization
  </text>
  
  <!-- Quality Control -->
  <circle cx="640" cy="210" r="25" fill="#60a5fa" stroke="#1e40af" stroke-width="2"/>
  <text x="640" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1e40af">
    Q
  </text>
  <text x="640" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Quality Control
  </text>
  
  <!-- Data Analytics Section -->
  <rect x="250" y="300" width="300" height="120" rx="10" fill="#8b5cf6" stroke="#7c3aed" stroke-width="2"/>
  <text x="400" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
    Data Analytics and Insights
  </text>
  
  <!-- Customer Analytics -->
  <circle cx="320" cy="360" r="25" fill="#a78bfa" stroke="#7c3aed" stroke-width="2"/>
  <text x="320" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#7c3aed">
    CA
  </text>
  <text x="320" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Customer Analytics
  </text>
  
  <!-- Sales Forecasting -->
  <circle cx="400" cy="360" r="25" fill="#a78bfa" stroke="#7c3aed" stroke-width="2"/>
  <text x="400" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#7c3aed">
    SF
  </text>
  <text x="400" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Sales Forecasting
  </text>
  
  <!-- Market Intelligence -->
  <circle cx="480" cy="360" r="25" fill="#a78bfa" stroke="#7c3aed" stroke-width="2"/>
  <text x="480" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#7c3aed">
    MI
  </text>
  <text x="480" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Market Intelligence
  </text>
  
  <!-- Mathematical Model -->
  <rect x="50" y="450" width="350" height="120" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="225" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#334155">
    Demand Forecasting Model
  </text>
  <text x="225" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">
    D(t) = α × S(t-1) + β × T(t) + γ × E(t) + ε
  </text>
  <text x="70" y="525" font-family="Arial, sans-serif" font-size="10" fill="#64748b">
    Where: D(t) = Predicted demand at time t
  </text>
  <text x="70" y="540" font-family="Arial, sans-serif" font-size="10" fill="#64748b">
    S(t-1) = Historical sales, T(t) = Trend component
  </text>
  <text x="70" y="555" font-family="Arial, sans-serif" font-size="10" fill="#64748b">
    E(t) = External factors, α,β,γ = Weights, ε = Error
  </text>
  
  <!-- Key Performance Metrics -->
  <rect x="450" y="450" width="300" height="120" rx="10" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
  <text x="600" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    Key Performance Metrics
  </text>
  <text x="470" y="500" font-family="Arial, sans-serif" font-size="11" fill="white">
    • Inventory turnover: +15-25%
  </text>
  <text x="470" y="520" font-family="Arial, sans-serif" font-size="11" fill="white">
    • Customer satisfaction: +20-30%
  </text>
  <text x="470" y="540" font-family="Arial, sans-serif" font-size="11" fill="white">
    • Operational costs: -10-20%
  </text>
  <text x="470" y="560" font-family="Arial, sans-serif" font-size="11" fill="white">
    • Forecast accuracy: 85-95%
  </text>
  
  <!-- Technology Stack -->
  <rect x="50" y="590" width="700" height="80" rx="10" fill="#64748b" stroke="#475569" stroke-width="2"/>
  <text x="400" y="615" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    Technology Stack
  </text>
  <text x="400" y="635" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Machine Learning: TensorFlow, PyTorch, Scikit-learn | Cloud: AWS, GCP, Azure
  </text>
  <text x="400" y="650" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    Data: Spark, Kafka, NoSQL | Analytics: Tableau, PowerBI | APIs: REST, GraphQL
  </text>
  
  <!-- Connection Lines -->
  <line x1="350" y1="180" x2="390" y2="300" stroke="#64748b" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="450" y1="180" x2="410" y2="300" stroke="#64748b" stroke-width="2" stroke-dasharray="5,5"/>
</svg>