<svg width="800" height="900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 24px; font-weight: bold; fill: #000; }
      .section-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #000; }
      .label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #000; }
      .small-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #000; }
      .mini-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10px; fill: #000; }
      
      .info-box { fill: none; stroke: #000; stroke-width: 2; rx: 8; }
      .random-forest-box { fill: none; stroke: #000; stroke-width: 2; rx: 8; }
      .benefits-box { fill: none; stroke: #000; stroke-width: 2; rx: 8; }
      .math-box { fill: none; stroke: #000; stroke-width: 2; rx: 8; }
      
      .tree-node { fill: none; stroke: #000; stroke-width: 1; }
      .tree-leaf { fill: none; stroke: #000; stroke-width: 1; }
    </style>
    
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="900" fill="#fff"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" class="title">Ensemble Methods: Key Concepts</text>
  
  <!-- Random Forest Enhancement Box -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="700" height="280" class="random-forest-box" filter="url(#shadow)"/>
    <text x="350" y="30" text-anchor="middle" class="section-title">Random Forest Enhancement</text>
    
    <text x="30" y="60" class="label" font-weight="bold">Key Difference from Basic Bagging:</text>
    <text x="30" y="85" class="small-label">• Random Forest adds an extra layer of randomness by using only a random subset of features at each split</text>
    <text x="30" y="105" class="small-label">• For Classification: Uses √(total features) features per split ≈ √10 = 3 features</text>
    <text x="30" y="125" class="small-label">• For Regression: Uses total_features/3 features per split ≈ 10/3 = 3 features</text>
    
    <text x="30" y="155" class="label" font-weight="bold">Feature Selection Example (with 10 features):</text>
    <text x="50" y="180" class="small-label">• Tree 1 at root split: randomly selects {Feature 1, 4, 7} → chooses best split among these 3</text>
    <text x="50" y="200" class="small-label">• Tree 2 at root split: randomly selects {Feature 2, 5, 9} → chooses best split among these 3</text>
    <text x="50" y="220" class="small-label">• Tree 3 at root split: randomly selects {Feature 3, 6, 8} → chooses best split among these 3</text>
    
    <text x="350" y="250" text-anchor="middle" class="label" font-weight="bold">
      Result: More diverse trees → Reduced correlation → Better ensemble performance
    </text>
  </g>
  
  <!-- Comparison Visualization -->
  <g transform="translate(50, 390)">
    <rect x="0" y="0" width="700" height="180" class="info-box" filter="url(#shadow)"/>
    <text x="350" y="25" text-anchor="middle" class="section-title">Bagging vs Random Forest</text>
    
    <g transform="translate(50, 50)">
      <text x="125" y="0" text-anchor="middle" class="label" font-weight="bold">Basic Bagging</text>
      <rect x="0" y="10" width="250" height="80" fill="none" stroke="#000" stroke-width="1" rx="4"/>
      <text x="125" y="30" text-anchor="middle" class="small-label">• Uses all features at each split</text>
      <text x="125" y="50" text-anchor="middle" class="small-label">• Trees differ only by bootstrap samples</text>
      <text x="125" y="70" text-anchor="middle" class="small-label">• Higher correlation between trees</text>
    </g>
    
    <g transform="translate(400, 50)">
      <text x="125" y="0" text-anchor="middle" class="label" font-weight="bold">Random Forest</text>
      <rect x="0" y="10" width="250" height="80" fill="none" stroke="#000" stroke-width="1" rx="4"/>
      <text x="125" y="30" text-anchor="middle" class="small-label">• Uses random subset at each split</text>
      <text x="125" y="50" text-anchor="middle" class="small-label">• Trees differ by samples AND features</text>
      <text x="125" y="70" text-anchor="middle" class="small-label">• Lower correlation between trees</text>
    </g>
    
    <!-- Arrow -->
    <path d="M 300 90 Q 350 70 400 90" stroke="#000" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
    <text x="350" y="60" text-anchor="middle" class="mini-label" font-weight="bold">IMPROVEMENT</text>
    
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000" />
    </marker>
  </g>
  
  <!-- Benefits Box -->
  <g transform="translate(50, 600)">
    <rect x="0" y="0" width="700" height="120" class="benefits-box" filter="url(#shadow)"/>
    <text x="350" y="25" text-anchor="middle" class="section-title">Ensemble Benefits</text>
    
    <g transform="translate(50, 45)">
      <text x="0" y="0" class="label" font-weight="bold">1. Variance Reduction:</text>
      <text x="20" y="20" class="small-label">• Individual models overfit in different ways due to different training data</text>
      <text x="20" y="35" class="small-label">• Averaging predictions cancels out individual model errors</text>
    </g>
    
    <g transform="translate(370, 45)">
      <text x="0" y="0" class="label" font-weight="bold">2. Improved Accuracy:</text>
      <text x="20" y="20" class="small-label">• Ensemble typically outperforms any single model</text>
      <text x="20" y="35" class="small-label">• Reduces both bias and variance components</text>
    </g>
  </g>
  
  <!-- Mathematical Foundation Box -->
  <g transform="translate(50, 750)">
    <rect x="0" y="0" width="700" height="120" class="math-box" filter="url(#shadow)"/>
    <text x="350" y="25" text-anchor="middle" class="section-title">Mathematical Foundation</text>
    
    <text x="50" y="50" class="label" font-weight="bold">For N independent models with individual variance σ²:</text>
    <text x="80" y="75" class="small-label">Variance(Ensemble) = σ² ÷ N</text>
    
    <text x="350" y="100" text-anchor="middle" class="small-label" font-weight="bold">
      Example: 100 trees → 100× variance reduction → Much more stable predictions!
    </text>
  </g>
</svg>