<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="900" height="700" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">Convex vs Non-Convex Functions</text>
  <text x="450" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">Optimization Landscapes in Machine Learning</text>
  
  <!-- Convex Function -->
  <rect x="50" y="80" width="250" height="280" rx="10" fill="#e8f5e5" stroke="#4caf50" stroke-width="3"/>
  <text x="175" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#388e3c">Convex Function</text>
  
  <!-- Convex plot area -->
  <rect x="80" y="130" width="190" height="150" fill="#ffffff" stroke="#bdc3c7" stroke-width="2"/>
  
  <!-- Convex curve (parabola) -->
  <path d="M 90 270 Q 175 160 260 270" stroke="#4caf50" stroke-width="4" fill="none"/>
  
  <!-- Global minimum point -->
  <circle cx="175" cy="160" r="5" fill="#d32f2f" stroke="#b71c1c" stroke-width="2"/>
  <text x="175" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#d32f2f">Global Min</text>
  
  <!-- Convex axes -->
  <line x1="90" y1="270" x2="260" y2="270" stroke="#7f8c8d" stroke-width="1"/>
  <line x1="175" y1="130" x2="175" y2="270" stroke="#7f8c8d" stroke-width="1"/>
  
  <!-- Convex properties -->
  <text x="175" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">f(x) = x² - 1</text>
  <text x="70" y="320" font-family="Arial, sans-serif" font-size="10" fill="#34495e">Properties:</text>
  <text x="70" y="335" font-family="Arial, sans-serif" font-size="10" fill="#27ae60">✓ Single global minimum</text>
  <text x="70" y="350" font-family="Arial, sans-serif" font-size="10" fill="#27ae60">✓ No local minima</text>
  <text x="70" y="365" font-family="Arial, sans-serif" font-size="10" fill="#27ae60">✓ Guaranteed convergence</text>
  
  <!-- Non-Convex Function -->
  <rect x="320" y="80" width="250" height="280" rx="10" fill="#ffebee" stroke="#f44336" stroke-width="3"/>
  <text x="445" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#c62828">Non-Convex Function</text>
  
  <!-- Non-convex plot area -->
  <rect x="350" y="130" width="190" height="150" fill="#ffffff" stroke="#bdc3c7" stroke-width="2"/>
  
  <!-- Non-convex curve (wavy function) -->
  <path d="M 360 220 Q 380 160 400 190 Q 420 220 440 180 Q 460 140 480 170 Q 500 200 520 160 Q 530 150 540 165" stroke="#f44336" stroke-width="4" fill="none"/>
  
  <!-- Local minima points -->
  <circle cx="400" cy="190" r="4" fill="#ff9800" stroke="#f57c00" stroke-width="2"/>
  <text x="400" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#ff9800">Local Min</text>
  
  <circle cx="480" cy="170" r="4" fill="#ff9800" stroke="#f57c00" stroke-width="2"/>
  <text x="480" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#ff9800">Local Min</text>
  
  <!-- Global minimum -->
  <circle cx="530" cy="150" r="5" fill="#d32f2f" stroke="#b71c1c" stroke-width="2"/>
  <text x="530" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#d32f2f">Global Min</text>
  
  <!-- Non-convex axes -->
  <line x1="360" y1="270" x2="530" y2="270" stroke="#7f8c8d" stroke-width="1"/>
  <line x1="445" y1="130" x2="445" y2="270" stroke="#7f8c8d" stroke-width="1"/>
  
  <!-- Non-convex properties -->
  <text x="445" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Complex function</text>
  <text x="340" y="320" font-family="Arial, sans-serif" font-size="10" fill="#34495e">Properties:</text>
  <text x="340" y="335" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c">✗ Multiple local minima</text>
  <text x="340" y="350" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c">✗ May get stuck</text>
  <text x="340" y="365" font-family="Arial, sans-serif" font-size="10" fill="#f39c12">⚠ Requires smart initialization</text>
  
  <!-- Concave Function -->
  <rect x="590" y="80" width="250" height="280" rx="10" fill="#e3f2fd" stroke="#2196f3" stroke-width="3"/>
  <text x="715" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1565c0">Concave Function</text>
  
  <!-- Concave plot area -->
  <rect x="620" y="130" width="190" height="150" fill="#ffffff" stroke="#bdc3c7" stroke-width="2"/>
  
  <!-- Concave curve (inverted parabola) -->
  <path d="M 630 170 Q 715 260 800 170" stroke="#2196f3" stroke-width="4" fill="none"/>
  
  <!-- Global maximum point -->
  <circle cx="715" cy="260" r="5" fill="#d32f2f" stroke="#b71c1c" stroke-width="2"/>
  <text x="715" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#d32f2f">Global Max</text>
  
  <!-- Concave axes -->
  <line x1="630" y1="270" x2="800" y2="270" stroke="#7f8c8d" stroke-width="1"/>
  <line x1="715" y1="130" x2="715" y2="270" stroke="#7f8c8d" stroke-width="1"/>
  
  <!-- Concave properties -->
  <text x="715" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">f(x) = -x²</text>
  <text x="610" y="320" font-family="Arial, sans-serif" font-size="10" fill="#34495e">Properties:</text>
  <text x="610" y="335" font-family="Arial, sans-serif" font-size="10" fill="#2196f3">✓ Single global maximum</text>
  <text x="610" y="350" font-family="Arial, sans-serif" font-size="10" fill="#2196f3">✓ Negative of convex</text>
  <text x="610" y="365" font-family="Arial, sans-serif" font-size="10" fill="#ff5722">⚠ For maximization problems</text>
  
  <!-- Optimization Challenges Section -->
  <rect x="50" y="390" width="800" height="280" rx="10" fill="#fafafa" stroke="#9e9e9e" stroke-width="2"/>
  <text x="450" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">Optimization Challenges and Solutions</text>
  
  <!-- Challenge 1: Local Minima -->
  <rect x="80" y="440" width="240" height="140" rx="5" fill="#ffebee" stroke="#e57373" stroke-width="1"/>
  <text x="200" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#c62828">Local Minima Problem</text>
  
  <text x="95" y="485" font-family="Arial, sans-serif" font-size="11" fill="#34495e">In non-convex functions:</text>
  <text x="95" y="500" font-family="Arial, sans-serif" font-size="10" fill="#34495e">• Gradient descent can get stuck</text>
  <text x="95" y="515" font-family="Arial, sans-serif" font-size="10" fill="#34495e">• May never reach global minimum</text>
  <text x="95" y="530" font-family="Arial, sans-serif" font-size="10" fill="#34495e">• Depends on initialization</text>
  
  <text x="95" y="550" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#d32f2f">Solutions:</text>
  <text x="95" y="565" font-family="Arial, sans-serif" font-size="10" fill="#27ae60">✓ Random restarts</text>
  <text x="200" y="565" font-family="Arial, sans-serif" font-size="10" fill="#27ae60">✓ Momentum</text>
  
  <!-- Challenge 2: Gradient Descent Behavior -->
  <rect x="340" y="440" width="240" height="140" rx="5" fill="#e8f5e5" stroke="#81c784" stroke-width="1"/>
  <text x="460" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2e7d32">Gradient Descent Behavior</text>
  
  <!-- Small visualization of gradient descent paths -->
  <rect x="360" y="480" width="200" height="60" fill="#ffffff" stroke="#bdc3c7" stroke-width="1"/>
  
  <!-- Convex path -->
  <path d="M 370 530 Q 385 510 400 500 Q 415 495 430 493" stroke="#4caf50" stroke-width="2" fill="none"/>
  <text x="400" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#4caf50">Convex: Direct path</text>
  
  <!-- Non-convex path -->
  <path d="M 450 530 Q 465 520 480 525 Q 495 530 510 510 Q 525 490 540 500" stroke="#f44336" stroke-width="2" fill="none"/>
  <text x="495" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#f44336">Non-convex: Zigzag path</text>
  
  <!-- Deep Learning Context -->
  <rect x="600" y="440" width="240" height="140" rx="5" fill="#fff3e0" stroke="#ffb74d" stroke-width="1"/>
  <text x="720" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ef6c00">Deep Learning Reality</text>
  
  <text x="615" y="485" font-family="Arial, sans-serif" font-size="11" fill="#34495e">Neural networks are non-convex:</text>
  <text x="615" y="500" font-family="Arial, sans-serif" font-size="10" fill="#34495e">• Loss landscapes are complex</text>
  <text x="615" y="515" font-family="Arial, sans-serif" font-size="10" fill="#34495e">• Many local minima exist</text>
  <text x="615" y="530" font-family="Arial, sans-serif" font-size="10" fill="#34495e">• But many are good enough</text>
  
  <text x="615" y="550" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ff9800">Modern insight:</text>
  <text x="615" y="565" font-family="Arial, sans-serif" font-size="10" fill="#4caf50">Local minima often have similar quality</text>
  
  <!-- Mathematical Definitions -->
  <rect x="50" y="595" width="800" height="80" rx="5" fill="#ffffff" stroke="#607d8b" stroke-width="2"/>
  <text x="450" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Mathematical Definitions</text>
  
  <text x="70" y="640" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#4caf50">Convex:</text>
  <text x="130" y="640" font-family="Arial, sans-serif" font-size="10" fill="#34495e">Line segment between points lies above curve</text>
  
  <text x="450" y="640" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#f44336">Non-convex:</text>
  <text x="530" y="640" font-family="Arial, sans-serif" font-size="10" fill="#34495e">Violates convexity condition</text>
  
  <text x="70" y="660" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2196f3">Concave:</text>
  <text x="130" y="660" font-family="Arial, sans-serif" font-size="10" fill="#34495e">Line segment between points lies below curve</text>
  
  <text x="450" y="660" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#9c27b0">Implications:</text>
  <text x="540" y="660" font-family="Arial, sans-serif" font-size="10" fill="#34495e">Convex guarantees global optimum</text>
</svg>