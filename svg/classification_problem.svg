<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <dropShadow dx="2" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="#f8f9fa"/>
  
  <!-- Grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e0e0e0" stroke-width="1"/>
    </pattern>
  </defs>
  <rect x="100" y="100" width="400" height="300" fill="url(#grid)" opacity="0.5"/>
  
  <!-- Axes -->
  <line x1="100" y1="400" x2="500" y2="400" stroke="#333" stroke-width="2"/>
  <line x1="100" y1="400" x2="100" y2="100" stroke="#333" stroke-width="2"/>
  
  <!-- Axis labels -->
  <text x="300" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">x₁</text>
  <text x="70" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333" transform="rotate(-90, 70, 250)">x₂</text>
  
  <!-- Axis tick marks and labels -->
  <line x1="200" y1="395" x2="200" y2="405" stroke="#333" stroke-width="2"/>
  <text x="200" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">-2</text>
  
  <line x1="300" y1="395" x2="300" y2="405" stroke="#333" stroke-width="2"/>
  <text x="300" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">0</text>
  
  <line x1="400" y1="395" x2="400" y2="405" stroke="#333" stroke-width="2"/>
  <text x="400" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">2</text>
  
  <line x1="95" y1="300" x2="105" y2="300" stroke="#333" stroke-width="2"/>
  <text x="85" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">0</text>
  
  <line x1="95" y1="200" x2="105" y2="200" stroke="#333" stroke-width="2"/>
  <text x="85" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">2</text>
  
  <line x1="95" y1="350" x2="105" y2="350" stroke="#333" stroke-width="2"/>
  <text x="85" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">-2</text>
  
  <!-- Red data points (class 0) - clusters -->
  <!-- Bottom left cluster -->
  <circle cx="180" cy="360" r="6" fill="#f44336" stroke="#d32f2f" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="170" cy="370" r="6" fill="#f44336" stroke="#d32f2f" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="190" cy="370" r="6" fill="#f44336" stroke="#d32f2f" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="175" cy="350" r="6" fill="#f44336" stroke="#d32f2f" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="185" cy="350" r="6" fill="#f44336" stroke="#d32f2f" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="165" cy="355" r="6" fill="#f44336" stroke="#d32f2f" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="195" cy="355" r="6" fill="#f44336" stroke="#d32f2f" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="160" cy="365" r="6" fill="#f44336" stroke="#d32f2f" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="200" cy="365" r="6" fill="#f44336" stroke="#d32f2f" stroke-width="2" filter="url(#shadow)"/>
  
  <!-- Top right cluster -->
  <circle cx="420" cy="140" r="6" fill="#f44336" stroke="#d32f2f" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="410" cy="130" r="6" fill="#f44336" stroke="#d32f2f" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="430" cy="130" r="6" fill="#f44336" stroke="#d32f2f" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="415" cy="150" r="6" fill="#f44336" stroke="#d32f2f" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="425" cy="150" r="6" fill="#f44336" stroke="#d32f2f" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="405" cy="145" r="6" fill="#f44336" stroke="#d32f2f" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="435" cy="145" r="6" fill="#f44336" stroke="#d32f2f" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="400" cy="135" r="6" fill="#f44336" stroke="#d32f2f" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="440" cy="135" r="6" fill="#f44336" stroke="#d32f2f" stroke-width="2" filter="url(#shadow)"/>
  
  <!-- Blue data points (class 1) - center cluster -->
  <circle cx="320" cy="250" r="6" fill="#2196f3" stroke="#1976d2" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="310" cy="240" r="6" fill="#2196f3" stroke="#1976d2" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="330" cy="240" r="6" fill="#2196f3" stroke="#1976d2" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="315" cy="260" r="6" fill="#2196f3" stroke="#1976d2" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="325" cy="260" r="6" fill="#2196f3" stroke="#1976d2" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="305" cy="255" r="6" fill="#2196f3" stroke="#1976d2" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="335" cy="255" r="6" fill="#2196f3" stroke="#1976d2" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="300" cy="245" r="6" fill="#2196f3" stroke="#1976d2" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="340" cy="245" r="6" fill="#2196f3" stroke="#1976d2" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="295" cy="265" r="6" fill="#2196f3" stroke="#1976d2" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="345" cy="265" r="6" fill="#2196f3" stroke="#1976d2" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="310" cy="270" r="6" fill="#2196f3" stroke="#1976d2" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="330" cy="270" r="6" fill="#2196f3" stroke="#1976d2" stroke-width="2" filter="url(#shadow)"/>
  
  <!-- Failed linear separator (diagonal line) -->
  <line x1="150" y1="150" x2="450" y2="350" stroke="#ff5722" stroke-width="3" stroke-dasharray="10,5" opacity="0.7"/>
  
  <!-- Legend -->
  <rect x="550" y="130" width="200" height="120" fill="white" stroke="#ccc" stroke-width="1" rx="5" filter="url(#shadow)"/>
  <text x="650" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Legend</text>
  
  <circle cx="570" cy="170" r="6" fill="#f44336" stroke="#d32f2f" stroke-width="2"/>
  <text x="590" y="175" font-family="Arial, sans-serif" font-size="12" fill="#333">Class 0 (Red)</text>
  
  <circle cx="570" cy="195" r="6" fill="#2196f3" stroke="#1976d2" stroke-width="2"/>
  <text x="590" y="200" font-family="Arial, sans-serif" font-size="12" fill="#333">Class 1 (Blue)</text>
  
  <line x1="565" y1="220" x2="585" y2="220" stroke="#ff5722" stroke-width="3" stroke-dasharray="5,3"/>
  <text x="590" y="225" font-family="Arial, sans-serif" font-size="12" fill="#333">Failed Linear Separator</text>
  
  <!-- Problem statement -->
  <text x="550" y="300" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#d32f2f">Problem:</text>
  <text x="550" y="320" font-family="Arial, sans-serif" font-size="12" fill="#333">No single straight line</text>
  <text x="550" y="335" font-family="Arial, sans-serif" font-size="12" fill="#333">can separate the classes</text>
  <text x="550" y="350" font-family="Arial, sans-serif" font-size="12" fill="#333">in this feature space.</text>
  
  <text x="550" y="380" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2e7d32">Solution:</text>
  <text x="550" y="400" font-family="Arial, sans-serif" font-size="12" fill="#333">Create a new representation</text>
  <text x="550" y="415" font-family="Arial, sans-serif" font-size="12" fill="#333">where linear separation</text>
  <text x="550" y="430" font-family="Arial, sans-serif" font-size="12" fill="#333">becomes possible.</text>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#333">The Classification Challenge: Linearly Inseparable Data</text>
  <text x="400" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#666">Two classes that cannot be separated by a single linear decision boundary</text>
</svg>