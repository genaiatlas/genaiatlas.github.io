<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1400" height="1000" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="700" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Self-Query Retriever Architecture
  </text>
  <text x="700" y="70" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#495057">
    Automatic Separation of Semantic Content and Metadata Filters
  </text>
  
  <!-- User Input -->
  <g id="input">
    <rect x="250" y="100" width="900" height="80" rx="10" fill="#fff3bf" stroke="#f59f00" stroke-width="3"/>
    <text x="700" y="130" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#495057">
      Natural Language Query
    </text>
    <text x="700" y="155" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#868e96" font-style="italic">
      "Show me Python tutorials about machine learning published after 2023"
    </text>
  </g>
  
  <!-- Arrow -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#495057"/>
    </marker>
  </defs>
  <line x1="700" y1="180" x2="700" y2="215" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  
  <!-- Self-Query Decomposer -->
  <g id="decomposer">
    <rect x="200" y="225" width="1000" height="180" rx="10" fill="#e9d5ff" stroke="#9333ea" stroke-width="3"/>
    <text x="700" y="255" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      🤖 LLM-Powered Query Decomposer
    </text>
    <text x="700" y="280" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#495057">
      Automatically extracts semantic content and metadata filters
    </text>
    
    <rect x="230" y="295" width="940" height="95" rx="5" fill="#fff" stroke="#9333ea" stroke-width="2"/>
    <text x="700" y="320" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#495057">
      LLM Processing with Schema Context
    </text>
    <text x="250" y="345" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      Input to LLM:
    </text>
    <text x="270" y="363" font-family="Arial, sans-serif" font-size="10" fill="#868e96">
      • Natural language query
    </text>
    <text x="270" y="378" font-family="Arial, sans-serif" font-size="10" fill="#868e96">
      • Metadata schema (fields: document_type, programming_language, topic, publish_date)
    </text>
    
    <text x="750" y="345" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      Output from LLM:
    </text>
    <text x="770" y="363" font-family="Arial, sans-serif" font-size="10" fill="#37b24d">
      • Semantic query string
    </text>
    <text x="770" y="378" font-family="Arial, sans-serif" font-size="10" fill="#f03e3e">
      • Structured metadata filters
    </text>
  </g>
  
  <line x1="500" y1="405" x2="350" y2="455" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="900" y1="405" x2="1050" y2="455" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  
  <!-- Left: Semantic Component -->
  <g id="semantic">
    <rect x="50" y="465" width="550" height="250" rx="10" fill="#d3f9d8" stroke="#37b24d" stroke-width="3"/>
    <text x="325" y="495" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Semantic Query Component
    </text>
    
    <rect x="80" y="515" width="490" height="80" rx="5" fill="#fff" stroke="#37b24d" stroke-width="2"/>
    <text x="325" y="540" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#495057">
      Extracted Content Query
    </text>
    <text x="325" y="565" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7950f2" font-style="italic">
      "Python tutorials about machine learning"
    </text>
    <text x="100" y="585" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      (Metadata terms removed for better semantic matching)
    </text>
    
    <rect x="80" y="610" width="490" height="90" rx="5" fill="#f8f9fa" stroke="#37b24d" stroke-width="2"/>
    <text x="325" y="633" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#495057">
      Processing Steps
    </text>
    <text x="100" y="655" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      1. Convert to embedding vector
    </text>
    <text x="100" y="672" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      2. Perform semantic similarity search
    </text>
    <text x="100" y="689" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      3. Retrieve top-K candidate documents
    </text>
  </g>
  
  <!-- Right: Metadata Component -->
  <g id="metadata">
    <rect x="800" y="465" width="550" height="250" rx="10" fill="#ffc9c9" stroke="#f03e3e" stroke-width="3"/>
    <text x="1075" y="495" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Metadata Filter Component
    </text>
    
    <rect x="830" y="515" width="490" height="110" rx="5" fill="#fff" stroke="#f03e3e" stroke-width="2"/>
    <text x="1075" y="540" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#495057">
      Extracted Structured Filters
    </text>
    <text x="850" y="563" font-family="Courier New, monospace" font-size="10" fill="#495057">
      {
    </text>
    <text x="870" y="580" font-family="Courier New, monospace" font-size="10" fill="#495057">
        "document_type": {"$eq": "tutorial"},
    </text>
    <text x="870" y="597" font-family="Courier New, monospace" font-size="10" fill="#495057">
        "programming_language": {"$eq": "python"},
    </text>
    <text x="870" y="614" font-family="Courier New, monospace" font-size="10" fill="#495057">
        "publish_date": {"$gt": "2023-01-01"}
    </text>
    <text x="850" y="631" font-family="Courier New, monospace" font-size="10" fill="#495057">
      }
    </text>
    
    <rect x="830" y="640" width="490" height="60" rx="5" fill="#f8f9fa" stroke="#f03e3e" stroke-width="2"/>
    <text x="1075" y="663" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#495057">
      Processing Steps
    </text>
    <text x="850" y="685" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      1. Parse metadata constraints | 2. Apply filters to search results
    </text>
  </g>
  
  <line x1="325" y1="715" x2="550" y2="765" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1075" y1="715" x2="850" y2="765" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  
  <!-- Combined Retrieval -->
  <g id="combined">
    <rect x="250" y="775" width="900" height="200" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="3"/>
    <text x="700" y="805" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Combined Retrieval Execution
    </text>
    
    <rect x="280" y="825" width="840" height="135" rx="5" fill="#fff" stroke="#1971c2" stroke-width="2"/>
    <text x="700" y="850" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#495057">
      Hybrid Search: Semantic + Metadata Filtering
    </text>
    
    <text x="300" y="875" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      Step 1: Vector search with semantic query
    </text>
    <text x="320" y="893" font-family="Arial, sans-serif" font-size="10" fill="#868e96">
      → Retrieve 100 candidates based on "Python tutorials about machine learning"
    </text>
    
    <text x="300" y="918" font-family="Arial, sans-serif" font-size="11" fill="#495057">
      Step 2: Apply metadata filters
    </text>
    <text x="320" y="936" font-family="Arial, sans-serif" font-size="10" fill="#868e96">
      → Filter to only tutorials, Python language, published after 2023
    </text>
    
    <text x="300" y="953" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#37b24d">
      Result: 12 highly relevant documents matching all criteria
    </text>
  </g>
  
  <!-- Benefits Box -->
  <g id="benefits">
    <rect x="50" y="735" width="140" height="240" rx="8" fill="#fff9db" stroke="#fab005" stroke-width="2"/>
    <text x="120" y="760" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#495057">
      ✅ Benefits
    </text>
    <text x="65" y="785" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • No manual
    </text>
    <text x="65" y="800" font-family="Arial, sans-serif" font-size="10" fill="#495057">
        filter syntax
    </text>
    <text x="65" y="820" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Automatic
    </text>
    <text x="65" y="835" font-family="Arial, sans-serif" font-size="10" fill="#495057">
        extraction
    </text>
    <text x="65" y="855" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Higher
    </text>
    <text x="65" y="870" font-family="Arial, sans-serif" font-size="10" fill="#495057">
        precision
    </text>
    <text x="65" y="890" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Better
    </text>
    <text x="65" y="905" font-family="Arial, sans-serif" font-size="10" fill="#495057">
        performance
    </text>
    <text x="65" y="925" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • User-friendly
    </text>
    <text x="65" y="940" font-family="Arial, sans-serif" font-size="10" fill="#495057">
        interface
    </text>
    <text x="65" y="960" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      • Scalable to
    </text>
    <text x="65" y="975" font-family="Arial, sans-serif" font-size="10" fill="#495057">
        large datasets
    </text>
  </g>
  
  <!-- Comparison Box -->
  <g id="comparison">
    <rect x="1210" y="735" width="140" height="240" rx="8" fill="#d0bfff" stroke="#7950f2" stroke-width="2"/>
    <text x="1280" y="760" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#495057">
      📊 vs Manual
    </text>
    <text x="1225" y="785" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      Manual Filtering:
    </text>
    <text x="1230" y="802" font-family="Arial, sans-serif" font-size="9" fill="#868e96">
      Explicit filter
    </text>
    <text x="1230" y="815" font-family="Arial, sans-serif" font-size="9" fill="#868e96">
      syntax required
    </text>
    <text x="1230" y="832" font-family="Arial, sans-serif" font-size="9" fill="#868e96">
      User must know
    </text>
    <text x="1230" y="845" font-family="Arial, sans-serif" font-size="9" fill="#868e96">
      schema
    </text>
    
    <text x="1225" y="870" font-family="Arial, sans-serif" font-size="10" fill="#495057">
      Self-Query:
    </text>
    <text x="1230" y="887" font-family="Arial, sans-serif" font-size="9" fill="#37b24d">
      Natural language
    </text>
    <text x="1230" y="900" font-family="Arial, sans-serif" font-size="9" fill="#37b24d">
      Auto extraction
    </text>
    <text x="1230" y="917" font-family="Arial, sans-serif" font-size="9" fill="#37b24d">
      No schema
    </text>
    <text x="1230" y="930" font-family="Arial, sans-serif" font-size="9" fill="#37b24d">
      knowledge needed
    </text>
    
    <text x="1280" y="955" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#7950f2">
      Accuracy Gain:
    </text>
    <text x="1280" y="972" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#7950f2">
      +25-40%
    </text>
  </g>
</svg>