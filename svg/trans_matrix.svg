<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#2c3e50">
    Transition Matrix Visualization
  </text>
  
  <!-- Matrix Grid -->
  <g transform="translate(200, 120)">
    <!-- Headers -->
    <text x="-30" y="50" text-anchor="end" font-size="16" font-weight="bold" fill="#34495e">From \ To</text>
    
    <!-- Column headers -->
    <text x="50" y="-10" text-anchor="middle" font-size="16" font-weight="bold" fill="#3498db">Playing</text>
    <text x="150" y="-10" text-anchor="middle" font-size="16" font-weight="bold" fill="#2ecc71">Eating</text>
    <text x="250" y="-10" text-anchor="middle" font-size="16" font-weight="bold" fill="#9b59b6">Sleeping</text>
    <text x="350" y="-10" text-anchor="middle" font-size="16" font-weight="bold" fill="#e74c3c">Crying</text>
    
    <!-- Row headers -->
    <text x="-10" y="55" text-anchor="end" font-size="16" font-weight="bold" fill="#3498db">Playing</text>
    <text x="-10" y="155" text-anchor="end" font-size="16" font-weight="bold" fill="#2ecc71">Eating</text>
    <text x="-10" y="255" text-anchor="end" font-size="16" font-weight="bold" fill="#9b59b6">Sleeping</text>
    <text x="-10" y="355" text-anchor="end" font-size="16" font-weight="bold" fill="#e74c3c">Crying</text>
    
    <!-- Matrix cells -->
    <!-- Row 1: Playing -->
    <rect x="0" y="20" width="80" height="80" fill="#f39c12" opacity="0.2" stroke="#34495e" stroke-width="1"/>
    <text x="40" y="65" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">0.20</text>
    
    <rect x="100" y="20" width="80" height="80" fill="#f39c12" opacity="0.3" stroke="#34495e" stroke-width="1"/>
    <text x="140" y="65" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">0.30</text>
    
    <rect x="200" y="20" width="80" height="80" fill="#f39c12" opacity="0.2" stroke="#34495e" stroke-width="1"/>
    <text x="240" y="65" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">0.20</text>
    
    <rect x="300" y="20" width="80" height="80" fill="#f39c12" opacity="0.3" stroke="#34495e" stroke-width="1"/>
    <text x="340" y="65" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">0.30</text>
    
    <!-- Row 2: Eating -->
    <rect x="0" y="120" width="80" height="80" fill="#3498db" opacity="0.25" stroke="#34495e" stroke-width="1"/>
    <text x="40" y="165" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">0.25</text>
    
    <rect x="100" y="120" width="80" height="80" fill="#3498db" opacity="0.25" stroke="#34495e" stroke-width="1"/>
    <text x="140" y="165" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">0.25</text>
    
    <rect x="200" y="120" width="80" height="80" fill="#3498db" opacity="0.35" stroke="#34495e" stroke-width="1"/>
    <text x="240" y="165" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">0.35</text>
    
    <rect x="300" y="120" width="80" height="80" fill="#3498db" opacity="0.15" stroke="#34495e" stroke-width="1"/>
    <text x="340" y="165" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">0.15</text>
    
    <!-- Row 3: Sleeping -->
    <rect x="0" y="220" width="80" height="80" fill="#2ecc71" opacity="0.15" stroke="#34495e" stroke-width="1"/>
    <text x="40" y="265" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">0.15</text>
    
    <rect x="100" y="220" width="80" height="80" fill="#2ecc71" opacity="0.25" stroke="#34495e" stroke-width="1"/>
    <text x="140" y="265" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">0.25</text>
    
    <rect x="200" y="220" width="80" height="80" fill="#2ecc71" opacity="0.30" stroke="#34495e" stroke-width="1"/>
    <text x="240" y="265" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">0.30</text>
    
    <rect x="300" y="220" width="80" height="80" fill="#2ecc71" opacity="0.30" stroke="#34495e" stroke-width="1"/>
    <text x="340" y="265" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">0.30</text>
    
    <!-- Row 4: Crying -->
    <rect x="0" y="320" width="80" height="80" fill="#e74c3c" opacity="0.10" stroke="#34495e" stroke-width="1"/>
    <text x="40" y="365" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">0.10</text>
    
    <rect x="100" y="320" width="80" height="80" fill="#e74c3c" opacity="0.20" stroke="#34495e" stroke-width="1"/>
    <text x="140" y="365" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">0.20</text>
    
    <rect x="200" y="320" width="80" height="80" fill="#e74c3c" opacity="0.40" stroke="#34495e" stroke-width="1"/>
    <text x="240" y="365" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">0.40</text>
    
    <rect x="300" y="320" width="80" height="80" fill="#e74c3c" opacity="0.30" stroke="#34495e" stroke-width="1"/>
    <text x="340" y="365" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">0.30</text>
    
    <!-- Sum indicators -->
    <text x="420" y="65" font-size="14" fill="#7f8c8d">Σ = 1.00</text>
    <text x="420" y="165" font-size="14" fill="#7f8c8d">Σ = 1.00</text>
    <text x="420" y="265" font-size="14" fill="#7f8c8d">Σ = 1.00</text>
    <text x="420" y="365" font-size="14" fill="#7f8c8d">Σ = 1.00</text>
  </g>
  
  <!-- Mathematical Notation -->
  <g transform="translate(100, 540)">
    <rect x="0" y="0" width="600" height="40" fill="#ecf0f1" stroke="#34495e" stroke-width="1" rx="5"/>
    <text x="10" y="25" font-size="16" fill="#34495e">
      P = [p<tspan baseline-shift="sub" font-size="12">ij</tspan>] where p<tspan baseline-shift="sub" font-size="12">ij</tspan> = P(X<tspan baseline-shift="sub" font-size="12">t+1</tspan> = j | X<tspan baseline-shift="sub" font-size="12">t</tspan> = i)
    </text>
    <text x="400" y="25" font-size="14" fill="#7f8c8d">
      Row Stochastic: Σ<tspan baseline-shift="sub" font-size="12">j</tspan> p<tspan baseline-shift="sub" font-size="12">ij</tspan> = 1
    </text>
  </g>
  
  <!-- Color Legend -->
  <g transform="translate(620, 180)">
    <text x="0" y="-10" font-size="14" font-weight="bold" fill="#34495e">Probability Scale:</text>
    
    <rect x="0" y="0" width="30" height="20" fill="#f39c12" opacity="0.1"/>
    <text x="35" y="15" font-size="12" fill="#34495e">0.10</text>
    
    <rect x="0" y="25" width="30" height="20" fill="#f39c12" opacity="0.2"/>
    <text x="35" y="40" font-size="12" fill="#34495e">0.20</text>
    
    <rect x="0" y="50" width="30" height="20" fill="#f39c12" opacity="0.3"/>
    <text x="35" y="65" font-size="12" fill="#34495e">0.30</text>
    
    <rect x="0" y="75" width="30" height="20" fill="#f39c12" opacity="0.4"/>
    <text x="35" y="90" font-size="12" fill="#34495e">0.40</text>
    
    <text x="0" y="120" font-size="11" fill="#7f8c8d">Higher opacity =</text>
    <text x="0" y="135" font-size="11" fill="#7f8c8d">Higher probability</text>
  </g>
</svg>