<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#2c3e50">Sigmoid Function for Logistic Regression</text>
  
  <!-- Coordinate system -->
  <g transform="translate(100, 100)">
    
    <!-- Grid lines -->
    <defs>
      <pattern id="grid" width="50" height="40" patternUnits="userSpaceOnUse">
        <path d="M 50 0 L 0 0 0 40" fill="none" stroke="#e0e0e0" stroke-width="1"/>
      </pattern>
    </defs>
    <rect width="600" height="400" fill="url(#grid)"/>
    
    <!-- Axes -->
    <line x1="0" y1="200" x2="600" y2="200" stroke="#34495e" stroke-width="2"/>
    <line x1="300" y1="0" x2="300" y2="400" stroke="#34495e" stroke-width="2"/>
    
    <!-- X-axis labels -->
    <text x="50" y="220" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#34495e">-5</text>
    <text x="150" y="220" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#34495e">-2</text>
    <text x="250" y="220" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#34495e">-1</text>
    <text x="300" y="220" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#34495e">0</text>
    <text x="350" y="220" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#34495e">1</text>
    <text x="450" y="220" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#34495e">2</text>
    <text x="550" y="220" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#34495e">5</text>
    
    <!-- Y-axis labels -->
    <text x="285" y="60" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#34495e">1.0</text>
    <text x="285" y="120" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#34495e">0.75</text>
    <text x="285" y="160" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#34495e">0.5</text>
    <text x="285" y="240" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#34495e">0.25</text>
    <text x="285" y="360" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#34495e">0.0</text>
    
    <!-- Sigmoid curve -->
    <path d="M 10 355 
             Q 50 350, 100 340
             Q 150 320, 200 280
             Q 250 220, 300 160
             Q 350 100, 400 80
             Q 450 65, 500 60
             Q 550 58, 590 57" 
          fill="none" stroke="#3498db" stroke-width="4"/>
    
    <!-- Key points -->
    <circle cx="300" cy="160" r="6" fill="#e74c3c"/>
    <circle cx="200" cy="280" r="5" fill="#27ae60"/>
    <circle cx="400" cy="80" r="5" fill="#27ae60"/>
    
    <!-- Threshold line -->
    <line x1="0" y1="160" x2="600" y2="160" stroke="#e74c3c" stroke-width="2" stroke-dasharray="5,5"/>
    
    <!-- Region labels -->
    <text x="150" y="320" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#e74c3c">Class 0</text>
    <text x="150" y="340" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#e74c3c">P(y=1) &lt; 0.5</text>
    
    <text x="450" y="120" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#27ae60">Class 1</text>
    <text x="450" y="140" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#27ae60">P(y=1) &gt; 0.5</text>
    
    <!-- Key point labels -->
    <text x="320" y="150" font-family="Arial, sans-serif" font-size="12" fill="#e74c3c">(0, 0.5)</text>
    
  </g>
  
  <!-- Formula box -->
  <rect x="500" y="450" width="280" height="120" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2" rx="10"/>
  <text x="640" y="475" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">Sigmoid Function</text>
  
  <text x="520" y="500" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">h(x) = 1 / (1 + e^(-z))</text>
  <text x="520" y="525" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">where z = θ₀ + θ₁x₁ + θ₂x₂ + ...</text>
  
  <text x="520" y="550" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• Maps any real value to (0,1)</text>
  <text x="520" y="565" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• Output represents probability</text>
  
  <!-- Linear vs Logistic comparison -->
  <rect x="20" y="450" width="450" height="120" fill="#ffffff" stroke="#bdc3c7" stroke-width="2" rx="10"/>
  <text x="245" y="475" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">Linear vs Logistic Regression</text>
  
  <text x="40" y="500" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e74c3c">Linear Regression Problems:</text>
  <text x="40" y="520" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">• Outputs not bounded between 0 and 1</text>
  <text x="40" y="535" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">• Cannot interpret as probabilities</text>
  <text x="40" y="550" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">• Sensitive to outliers</text>
  
  <text x="250" y="500" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#27ae60">Logistic Regression Solution:</text>
  <text x="250" y="520" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">• Always outputs between 0 and 1</text>
  <text x="250" y="535" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">• Probabilistic interpretation</text>
  <text x="250" y="550" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">• Robust S-shaped curve</text>
  
  <!-- Axis labels -->
  <text x="400" y="530" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#34495e">Input (z)</text>
  <text x="50" y="320" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#34495e" transform="rotate(-90 50 320)">Probability P(y=1)</text>
</svg>