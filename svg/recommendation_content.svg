<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="contentGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
    <filter id="contentShadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="600" fill="#FAFAFA"/>
  
  <!-- Title -->
  <text x="500" y="35" text-anchor="middle" font-size="26" font-weight="bold" fill="#1F2937">
    Content-Based Filtering Architecture
  </text>
  
  <!-- User Features Box -->
  <g transform="translate(80, 100)">
    <rect x="0" y="0" width="200" height="180" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2" rx="8" filter="url(#contentShadow)"/>
    <text x="100" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#92400E">
      User Features
    </text>
    <text x="20" y="60" font-size="14" fill="#78350F">• Age: 28</text>
    <text x="20" y="85" font-size="14" fill="#78350F">• Gender: Female</text>
    <text x="20" y="110" font-size="14" fill="#78350F">• Location: NYC</text>
    <text x="20" y="135" font-size="14" fill="#78350F">• Interests: Sci-Fi</text>
    <text x="20" y="160" font-size="14" fill="#78350F">• History: [4.5, 3.2, ...]</text>
  </g>
  
  <!-- Item Features Box -->
  <g transform="translate(80, 320)">
    <rect x="0" y="0" width="200" height="180" fill="#DCFCE7" stroke="#22C55E" stroke-width="2" rx="8" filter="url(#contentShadow)"/>
    <text x="100" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#14532D">
      Item Features
    </text>
    <text x="20" y="60" font-size="14" fill="#15803D">• Genre: Action/Sci-Fi</text>
    <text x="20" y="85" font-size="14" fill="#15803D">• Year: 2023</text>
    <text x="20" y="110" font-size="14" fill="#15803D">• Director: Nolan</text>
    <text x="20" y="135" font-size="14" fill="#15803D">• Rating: PG-13</text>
    <text x="20" y="160" font-size="14" fill="#15803D">• Duration: 148 min</text>
  </g>
  
  <!-- Feature Engineering -->
  <g transform="translate(350, 150)">
    <rect x="0" y="0" width="220" height="300" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2" rx="8" filter="url(#contentShadow)"/>
    <text x="110" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#4C1D95">
      Feature Engineering
    </text>
    
    <!-- Structured Features -->
    <text x="15" y="60" font-size="14" font-weight="bold" fill="#5B21B6">Structured:</text>
    <text x="20" y="80" font-size="13" fill="#6D28D9">• One-hot encoding</text>
    <text x="20" y="100" font-size="13" fill="#6D28D9">• Normalization</text>
    <text x="20" y="120" font-size="13" fill="#6D28D9">• Binning</text>
    
    <!-- Unstructured Features -->
    <text x="15" y="155" font-size="14" font-weight="bold" fill="#5B21B6">Unstructured:</text>
    <text x="20" y="175" font-size="13" fill="#6D28D9">• TF-IDF vectors</text>
    <text x="20" y="195" font-size="13" fill="#6D28D9">• Word embeddings</text>
    <text x="20" y="215" font-size="13" fill="#6D28D9">• PCA reduction</text>
    
    <!-- Combined Vector -->
    <rect x="15" y="240" width="190" height="45" fill="#7C3AED" rx="6"/>
    <text x="110" y="268" text-anchor="middle" font-size="14" font-weight="bold" fill="white">
      Combined Feature Vector
    </text>
  </g>
  
  <!-- Model Box -->
  <g transform="translate(620, 180)">
    <rect x="0" y="0" width="200" height="240" fill="url(#contentGrad1)" rx="8" filter="url(#contentShadow)"/>
    <text x="100" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="white">
      ML Model
    </text>
    
    <text x="100" y="70" text-anchor="middle" font-size="16" fill="white">
      f(x_i, y_j) = L_ij
    </text>
    
    <g transform="translate(20, 100)">
      <rect x="0" y="0" width="160" height="35" fill="white" fill-opacity="0.2" rx="4"/>
      <text x="80" y="23" text-anchor="middle" font-size="14" fill="white">
        Regression/Classification
      </text>
    </g>
    
    <g transform="translate(20, 145)">
      <rect x="0" y="0" width="160" height="35" fill="white" fill-opacity="0.2" rx="4"/>
      <text x="80" y="23" text-anchor="middle" font-size="14" fill="white">
        Neural Networks
      </text>
    </g>
    
    <g transform="translate(20, 190)">
      <rect x="0" y="0" width="160" height="35" fill="white" fill-opacity="0.2" rx="4"/>
      <text x="80" y="23" text-anchor="middle" font-size="14" fill="white">
        Gradient Boosting
      </text>
    </g>
  </g>
  
  <!-- Prediction Output -->
  <g transform="translate(870, 250)">
    <rect x="0" y="0" width="100" height="100" fill="#FEE2E2" stroke="#EF4444" stroke-width="2" rx="50"/>
    <text x="50" y="45" text-anchor="middle" font-size="24" font-weight="bold" fill="#991B1B">
      4.2
    </text>
    <text x="50" y="70" text-anchor="middle" font-size="14" fill="#991B1B">
      Predicted
    </text>
  </g>
  
  <!-- Arrows -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#6B7280"/>
    </marker>
  </defs>
  
  <g stroke="#6B7280" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="285" y1="190" x2="345" y2="190"/>
    <line x1="285" y1="410" x2="345" y2="410"/>
    <path d="M 345 410 Q 320 350, 345 300"/>
    <line x1="575" y1="300" x2="615" y2="300"/>
    <line x1="825" y1="300" x2="865" y2="300"/>
  </g>
  
  <!-- Process Labels -->
  <text x="315" y="180" font-size="12" fill="#6B7280">extract</text>
  <text x="315" y="430" font-size="12" fill="#6B7280">extract</text>
  <text x="590" y="290" font-size="12" fill="#6B7280">train</text>
  <text x="840" y="290" font-size="12" fill="#6B7280">predict</text>
  
  <!-- Key Benefits Box -->
  <g transform="translate(100, 530)">
    <rect x="0" y="0" width="800" height="50" fill="#F0F9FF" stroke="#0EA5E9" stroke-width="2" rx="6"/>
    <text x="20" y="30" font-size="15" fill="#0C4A6E">
      ✓ Handles cold-start problems  ✓ Explainable predictions  ✓ Domain knowledge integration  ✓ No interaction history needed
    </text>
  </g>
</svg>