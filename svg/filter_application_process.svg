<svg viewBox="0 0 1400 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1400" height="700" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="700" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#2c3e50">Filter Application Process: Feature Detection</text>
  
  <!-- Original Image -->
  <g transform="translate(50, 80)">
    <text x="100" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Original Image</text>
    
    <!-- Simple building silhouette -->
    <rect x="0" y="0" width="200" height="150" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2"/>
    
    <!-- Building outline -->
    <rect x="30" y="40" width="40" height="80" fill="#7f8c8d"/>
    <rect x="80" y="20" width="60" height="100" fill="#7f8c8d"/>
    <rect x="150" y="50" width="35" height="70" fill="#7f8c8d"/>
    
    <!-- Windows -->
    <rect x="35" y="50" width="8" height="8" fill="#3498db"/>
    <rect x="47" y="50" width="8" height="8" fill="#3498db"/>
    <rect x="35" y="65" width="8" height="8" fill="#3498db"/>
    <rect x="47" y="65" width="8" height="8" fill="#3498db"/>
    
    <rect x="90" y="35" width="10" height="10" fill="#3498db"/>
    <rect x="110" y="35" width="10" height="10" fill="#3498db"/>
    <rect x="90" y="55" width="10" height="10" fill="#3498db"/>
    <rect x="110" y="55" width="10" height="10" fill="#3498db"/>
    
    <rect x="155" y="60" width="6" height="6" fill="#3498db"/>
    <rect x="165" y="60" width="6" height="6" fill="#3498db"/>
    <rect x="155" y="75" width="6" height="6" fill="#3498db"/>
    <rect x="165" y="75" width="6" height="6" fill="#3498db"/>
    
    <!-- Strong vertical edges -->
    <line x1="30" y1="40" x2="30" y2="120" stroke="#2c3e50" stroke-width="3"/>
    <line x1="70" y1="40" x2="70" y2="120" stroke="#2c3e50" stroke-width="3"/>
    <line x1="80" y1="20" x2="80" y2="120" stroke="#2c3e50" stroke-width="3"/>
    <line x1="140" y1="20" x2="140" y2="120" stroke="#2c3e50" stroke-width="3"/>
    <line x1="150" y1="50" x2="150" y2="120" stroke="#2c3e50" stroke-width="3"/>
    <line x1="185" y1="50" x2="185" y2="120" stroke="#2c3e50" stroke-width="3"/>
  </g>
  
  <!-- Arrows -->
  <path d="M 280 155 L 340 155" stroke="#34495e" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Filter 1: Vertical Edge Detector -->
  <g transform="translate(360, 100)">
    <text x="45" y="-15" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e74c3c">Vertical Edge Filter</text>
    
    <g stroke="#e74c3c" stroke-width="2">
      <rect x="0" y="0" width="30" height="30" fill="#fff5f5"/><text x="15" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">1</text>
      <rect x="30" y="0" width="30" height="30" fill="#fff5f5"/><text x="45" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">0</text>
      <rect x="60" y="0" width="30" height="30" fill="#fff5f5"/><text x="75" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">-1</text>
      
      <rect x="0" y="30" width="30" height="30" fill="#fff5f5"/><text x="15" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">1</text>
      <rect x="30" y="30" width="30" height="30" fill="#fff5f5"/><text x="45" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">0</text>
      <rect x="60" y="30" width="30" height="30" fill="#fff5f5"/><text x="75" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">-1</text>
      
      <rect x="0" y="60" width="30" height="30" fill="#fff5f5"/><text x="15" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">1</text>
      <rect x="30" y="60" width="30" height="30" fill="#fff5f5"/><text x="45" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">0</text>
      <rect x="60" y="60" width="30" height="30" fill="#fff5f5"/><text x="75" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">-1</text>
    </g>
  </g>
  
  <!-- Arrow to output -->
  <path d="M 480 155 L 540 155" stroke="#34495e" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Output 1: Vertical Edges Detected -->
  <g transform="translate(560, 80)">
    <text x="75" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e74c3c">Vertical Edges Detected</text>
    
    <rect x="0" y="0" width="150" height="120" fill="#2c3e50" stroke="#34495e" stroke-width="2"/>
    
    <!-- Bright vertical lines where edges were detected -->
    <line x1="22" y1="10" x2="22" y2="110" stroke="#ffffff" stroke-width="4"/>
    <line x1="52" y1="10" x2="52" y2="110" stroke="#ffffff" stroke-width="4"/>
    <line x1="60" y1="5" x2="60" y2="110" stroke="#ffffff" stroke-width="4"/>
    <line x1="105" y1="5" x2="105" y2="110" stroke="#ffffff" stroke-width="4"/>
    <line x1="113" y1="15" x2="113" y2="110" stroke="#ffffff" stroke-width="4"/>
    <line x1="140" y1="15" x2="140" y2="110" stroke="#ffffff" stroke-width="4"/>
    
    <text x="75" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Strong vertical edges highlighted</text>
  </g>
  
  <!-- Filter 2: Horizontal Edge Detector -->
  <g transform="translate(360, 280)">
    <text x="45" y="-15" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f39c12">Horizontal Edge Filter</text>
    
    <g stroke="#e67e22" stroke-width="2">
      <rect x="0" y="0" width="30" height="30" fill="#fefaf2"/><text x="15" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">1</text>
      <rect x="30" y="0" width="30" height="30" fill="#fefaf2"/><text x="45" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">1</text>
      <rect x="60" y="0" width="30" height="30" fill="#fefaf2"/><text x="75" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">1</text>
      
      <rect x="0" y="30" width="30" height="30" fill="#fefaf2"/><text x="15" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">0</text>
      <rect x="30" y="30" width="30" height="30" fill="#fefaf2"/><text x="45" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">0</text>
      <rect x="60" y="30" width="30" height="30" fill="#fefaf2"/><text x="75" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">0</text>
      
      <rect x="0" y="60" width="30" height="30" fill="#fefaf2"/><text x="15" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">-1</text>
      <rect x="30" y="60" width="30" height="30" fill="#fefaf2"/><text x="45" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">-1</text>
      <rect x="60" y="60" width="30" height="30" fill="#fefaf2"/><text x="75" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">-1</text>
    </g>
  </g>
  
  <!-- Arrow to output -->
  <path d="M 480 335 L 540 335" stroke="#34495e" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Output 2: Horizontal Edges Detected -->
  <g transform="translate(560, 260)">
    <text x="75" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f39c12">Horizontal Edges Detected</text>
    
    <rect x="0" y="0" width="150" height="120" fill="#2c3e50" stroke="#34495e" stroke-width="2"/>
    
    <!-- Bright horizontal lines where roof edges were detected -->
    <line x1="15" y1="30" x2="55" y2="30" stroke="#ffffff" stroke-width="3"/>
    <line x1="65" y1="15" x2="120" y2="15" stroke="#ffffff" stroke-width="3"/>
    <line x1="125" y1="40" x2="145" y2="40" stroke="#ffffff" stroke-width="3"/>
    
    <!-- Ground line -->
    <line x1="0" y1="110" x2="150" y2="110" stroke="#ffffff" stroke-width="4"/>
    
    <text x="75" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Rooftops and ground edge highlighted</text>
  </g>
  
  <!-- Filter 3: Blur Filter -->
  <g transform="translate(360, 460)">
    <text x="45" y="-15" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#9b59b6">Blur Filter (Low-pass)</text>
    
    <g stroke="#8e44ad" stroke-width="2">
      <rect x="0" y="0" width="30" height="30" fill="#f4f1f8"/><text x="15" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold">1/9</text>
      <rect x="30" y="0" width="30" height="30" fill="#f4f1f8"/><text x="45" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold">1/9</text>
      <rect x="60" y="0" width="30" height="30" fill="#f4f1f8"/><text x="75" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold">1/9</text>
      
      <rect x="0" y="30" width="30" height="30" fill="#f4f1f8"/><text x="15" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold">1/9</text>
      <rect x="30" y="30" width="30" height="30" fill="#f4f1f8"/><text x="45" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold">1/9</text>
      <rect x="60" y="30" width="30" height="30" fill="#f4f1f8"/><text x="75" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold">1/9</text>
      
      <rect x="0" y="60" width="30" height="30" fill="#f4f1f8"/><text x="15" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold">1/9</text>
      <rect x="30" y="60" width="30" height="30" fill="#f4f1f8"/><text x="45" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold">1/9</text>
      <rect x="60" y="60" width="30" height="30" fill="#f4f1f8"/><text x="75" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold">1/9</text>
    </g>
  </g>
  
  <!-- Arrow to output -->
  <path d="M 480 515 L 540 515" stroke="#34495e" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Output 3: Blurred/Smoothed Image -->
  <g transform="translate(560, 440)">
    <text x="75" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#9b59b6">Smoothed Features</text>
    
    <rect x="0" y="0" width="150" height="120" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2"/>
    
    <!-- Blurred building shapes -->
    <rect x="25" y="35" width="50" height="85" fill="#95a5a6" rx="5"/>
    <rect x="75" y="15" width="70" height="105" fill="#95a5a6" rx="5"/>
    <rect x="145" y="45" width="45" height="75" fill="#95a5a6" rx="5"/>
    
    <!-- Smooth gradient effects -->
    <defs>
      <radialGradient id="blur1" cx="50%" cy="50%" r="50%">
        <stop offset="0%" style="stop-color:#bdc3c7"/>
        <stop offset="100%" style="stop-color:#95a5a6"/>
      </radialGradient>
    </defs>
    
    <text x="75" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Sharp edges removed, general shapes preserved</text>
  </g>
  
  <!-- Feature combination section -->
  <g transform="translate(800, 80)">
    <text x="250" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">Multiple Filters = Rich Feature Maps</text>
    
    <!-- Combined feature visualization -->
    <rect x="0" y="20" width="500" height="300" fill="#f8f9fa" stroke="#bdc3c7" stroke-width="2" rx="10"/>
    
    <!-- Layer 1: Multiple filters -->
    <g transform="translate(20, 50)">
      <text x="0" y="15" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Layer 1: 32 Filters</text>
      
      <!-- Feature map representations -->
      <rect x="50" y="0" width="40" height="40" fill="#e74c3c" opacity="0.8"/>
      <rect x="100" y="0" width="40" height="40" fill="#f39c12" opacity="0.8"/>
      <rect x="150" y="0" width="40" height="40" fill="#9b59b6" opacity="0.8"/>
      <rect x="200" y="0" width="40" height="40" fill="#27ae60" opacity="0.8"/>
      <text x="250" y="25" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">... 28 more filters</text>
      
      <text x="50" y="55" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Vertical</text>
      <text x="100" y="55" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Horizontal</text>
      <text x="150" y="55" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Diagonal</text>
      <text x="200" y="55" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Corners</text>
    </g>
    
    <!-- Arrow down -->
    <path d="M 250 130 L 250 170" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Layer 2: Complex patterns -->
    <g transform="translate(20, 180)">
      <text x="0" y="15" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Layer 2: 64 Filters (Complex Patterns)</text>
      
      <rect x="50" y="0" width="35" height="35" fill="#e74c3c" opacity="0.7"/>
      <rect x="95" y="0" width="35" height="35" fill="#3498db" opacity="0.7"/>
      <rect x="140" y="0" width="35" height="35" fill="#f39c12" opacity="0.7"/>
      <rect x="185" y="0" width="35" height="35" fill="#27ae60" opacity="0.7"/>
      <text x="230" y="20" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">... 60 more</text>
      
      <text x="50" y="50" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Windows</text>
      <text x="95" y="50" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Doors</text>
      <text x="140" y="50" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Roofs</text>
      <text x="185" y="50" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Walls</text>
    </g>
    
    <!-- Arrow down -->
    <path d="M 250 260 L 250 300" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Final recognition -->
    <g transform="translate(170, 310)">
      <rect x="0" y="0" width="120" height="40" fill="#2c3e50" rx="5"/>
      <text x="60" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" font-weight="bold">Building: 95%</text>
      <text x="60" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#ecf0f1">House: 3%, Car: 2%</text>
    </g>
  </g>
  
  <!-- Mathematical insight box -->
  <g transform="translate(800, 420)">
    <rect x="0" y="0" width="500" height="240" fill="#eef7ff" stroke="#3498db" stroke-width="2" rx="10"/>
    <text x="250" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Filter Learning Process</text>
    
    <!-- Step by step -->
    <text x="20" y="55" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#e74c3c">1. Initialization:</text>
    <text x="40" y="75" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• Filters start with random small values</text>
    <text x="40" y="90" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• Network doesn't know what features to detect</text>
    
    <text x="20" y="115" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f39c12">2. Training (Backpropagation):</text>
    <text x="40" y="135" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• Gradients flow back through network</text>
    <text x="40" y="150" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• Filter values adjust to minimize classification error</text>
    
    <text x="20" y="175" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#27ae60">3. Specialization:</text>
    <text x="40" y="195" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• Each filter automatically learns to detect specific features</text>
    <text x="40" y="210" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• No manual feature engineering required!</text>
  </g>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
            refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e"/>
    </marker>
  </defs>
</svg>