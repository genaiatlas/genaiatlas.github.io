<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="700" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="500" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Power Law Distribution
  </text>
  
  <!-- Subtitle -->
  <text x="500" y="70" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#7f8c8d">
    Linear relationship on logarithmic scale
  </text>
  
  <!-- Left plot: Regular scale -->
  <g transform="translate(80, 120)">
    <rect x="0" y="0" width="380" height="450" fill="white" stroke="#34495e" stroke-width="2" rx="5"/>
    
    <text x="190" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Regular Scale
    </text>
    
    <!-- Axes -->
    <line x1="50" y1="380" x2="350" y2="380" stroke="#34495e" stroke-width="2"/>
    <line x1="50" y1="80" x2="50" y2="380" stroke="#34495e" stroke-width="2"/>
    
    <!-- Labels -->
    <text x="200" y="420" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#34495e">
      Degree (k)
    </text>
    <text x="20" y="230" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#34495e" transform="rotate(-90, 20, 230)">
      P(k)
    </text>
    
    <!-- Power law curve (steep decline) -->
    <path d="M 55 90 Q 100 120, 150 220 Q 200 290, 250 340 Q 300 365, 345 375" 
          fill="none" stroke="#e74c3c" stroke-width="3"/>
    
    <!-- Fill -->
    <path d="M 55 90 Q 100 120, 150 220 Q 200 290, 250 340 Q 300 365, 345 375 L 345 380 L 55 380 Z" 
          fill="#e74c3c" opacity="0.15"/>
    
    <!-- Annotation -->
    <text x="190" y="170" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#e74c3c" font-weight="bold">
      Steep decline
    </text>
    <text x="190" y="190" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#e74c3c">
      (Hard to see pattern)
    </text>
  </g>
  
  <!-- Right plot: Log-log scale -->
  <g transform="translate(540, 120)">
    <rect x="0" y="0" width="380" height="450" fill="white" stroke="#34495e" stroke-width="2" rx="5"/>
    
    <text x="190" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Log-Log Scale
    </text>
    
    <!-- Axes -->
    <line x1="50" y1="380" x2="350" y2="380" stroke="#34495e" stroke-width="2"/>
    <line x1="50" y1="80" x2="50" y2="380" stroke="#34495e" stroke-width="2"/>
    
    <!-- Labels -->
    <text x="200" y="420" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#34495e">
      log(k)
    </text>
    <text x="20" y="230" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#34495e" transform="rotate(-90, 20, 230)">
      log(P(k))
    </text>
    
    <!-- Linear relationship on log-log scale -->
    <line x1="60" y1="100" x2="340" y2="360" stroke="#27ae60" stroke-width="3"/>
    
    <!-- Points on the line -->
    <circle cx="80" cy="120" r="5" fill="#27ae60"/>
    <circle cx="120" cy="160" r="5" fill="#27ae60"/>
    <circle cx="180" cy="220" r="5" fill="#27ae60"/>
    <circle cx="240" cy="280" r="5" fill="#27ae60"/>
    <circle cx="300" cy="330" r="5" fill="#27ae60"/>
    
    <!-- Annotation -->
    <text x="250" y="160" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#27ae60" font-weight="bold">
      Linear on
    </text>
    <text x="250" y="180" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#27ae60" font-weight="bold">
      log-log plot!
    </text>
    
    <!-- Slope annotation -->
    <line x1="150" y1="190" x2="220" y2="260" stroke="#e67e22" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="185" y="235" font-family="Arial, sans-serif" font-size="12" fill="#e67e22" font-weight="bold">
      Slope = -α
    </text>
  </g>
  
  <!-- Formula box -->
  <g transform="translate(100, 600)">
    <rect x="0" y="0" width="800" height="80" fill="#ecf0f1" stroke="#34495e" stroke-width="2" rx="5"/>
    
    <text x="400" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Power Law Formula: P(k) = k · k⁻ᵅ
    </text>
    
    <text x="400" y="55" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#34495e">
      Where α (exponent) is typically between 2 and 3 for most real-world networks
    </text>
  </g>
</svg>