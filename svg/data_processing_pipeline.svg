  <text x="720" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">MACHINE LEARNING</text>
  <text x="720" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">Model Training</text>
  <text x="720" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">Feature Engineering</text>
  <text x="720" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">Model Validation</text>
  <text x="720" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">Spark, TensorFlow</text>

