  <text x="920" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">MODEL APIs</text>
  <text x="920" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">Prediction Endpoints</text>
  <text x="920" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">Real-time Inference</text>
  <text x="920" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">REST/GraphQL APIs</text>

