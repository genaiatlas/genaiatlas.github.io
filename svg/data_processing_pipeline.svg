  <text x="110" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">MySQL</text>
  <text x="110" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">MongoDB</text>

