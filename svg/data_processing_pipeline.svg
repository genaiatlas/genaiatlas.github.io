  <text x="110" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">JSON/XML</text>
  <text x="110" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">Parquet</text>

