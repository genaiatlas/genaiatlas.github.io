  <!-- Flow Arrows -->
  <line x1="170" y1="300" x2="250" y2="300" stroke="#374151" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line x1="390" y1="300" x2="450" y2="300" stroke="#374151" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line x1="590" y1="300" x2="650" y2="300" stroke="#374151" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line x1="790" y1="300" x2="850" y2="300" stroke="#374151" stroke-width="3" marker-end="url(#arrowhead)"/>

  <!-- Monitoring and Governance -->
  <rect x="200" y="520" width="600" height="120" rx="15" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
  <text x="500" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#374151">MONITORING AND GOVERNANCE</text>
  <text x="250" y="575" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#374151">Data Quality:</text>
  <text x="250" y="595" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">Schema Validation, Data Profiling, Anomaly Detection</text>
  <text x="500" y="575" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#374151">Performance:</text>
  <text x="500" y="595" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">Pipeline Monitoring, Resource Usage, SLA Tracking</text>
  <text x="250" y="615" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#374151">Security:</text>
  <text x="250" y="635" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">Access Control, Data Encryption, Audit Logs</text>

  <!-- Key Technologies -->
  <rect x="50" y="680" width="1000" height="80" rx="10" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1"/>
  <text x="550" y="705" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#374151">Key Technologies and Frameworks</text>
  <text x="550" y="730" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">Apache Spark, Apache Kafka, Apache Airflow, Docker, Kubernetes, TensorFlow, PyTorch</text>
  <text x="550" y="750" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">AWS, Google Cloud, Azure, Snowflake, Databricks, MLflow, Great Expectations</text>
</svg>