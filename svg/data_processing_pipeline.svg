  <text x="920" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#374151">OUTPUT &amp;</text>
  <text x="920" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#374151">DEPLOYMENT</text>

  <!-- Data Sources -->
  <!-- Database Source -->
  <rect x="50" y="110" width="120" height="80" rx="10" fill="url(#source)" stroke="#4338ca" stroke-width="2" filter="url(#dropshadow)"/>
  <text x="110" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">DATABASES</text>
