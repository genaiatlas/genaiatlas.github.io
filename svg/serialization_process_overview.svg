<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#45a049;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2196F3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1976D2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF9800;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F57C00;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#333">
    Serialization Process Overview
  </text>
  
  <!-- Python Object -->
  <rect x="50" y="80" width="120" height="80" rx="10" fill="url(#grad1)" stroke="#333" stroke-width="2"/>
  <text x="110" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Python Object
  </text>
  <text x="110" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
    (ML Model, Data)
  </text>
  <text x="110" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
    In Memory
  </text>
  
  <!-- Serialization Arrow -->
  <path d="M 180 120 L 230 120" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="205" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">
    Serialize
  </text>
  
  <!-- Byte Stream -->
  <rect x="250" y="80" width="120" height="80" rx="10" fill="url(#grad2)" stroke="#333" stroke-width="2"/>
  <text x="310" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Byte Stream
  </text>
  <text x="310" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
    (Binary Format)
  </text>
  <text x="310" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
    Portable
  </text>
  
  <!-- Storage/Transmission Arrow -->
  <path d="M 380 120 L 430 120" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="405" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">
    Store/Send
  </text>
  
  <!-- File/Network -->
  <rect x="450" y="80" width="120" height="80" rx="10" fill="url(#grad3)" stroke="#333" stroke-width="2"/>
  <text x="510" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    File/Network
  </text>
  <text x="510" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
    (.pkl, .joblib)
  </text>
  <text x="510" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
    Persistent
  </text>
  
  <!-- Return Arrow -->
  <path d="M 460 200 L 180 200 L 180 170" stroke="#666" stroke-width="2" fill="none" stroke-dasharray="5,5" marker-end="url(#arrowhead2)"/>
  <text x="320" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">
    Deserialize (Load Back)
  </text>
  
  <!-- Libraries -->
  <text x="400" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">
    Python Libraries:
  </text>
  <rect x="300" y="250" width="60" height="25" rx="5" fill="#E8F5E8" stroke="#4CAF50" stroke-width="1"/>
  <text x="330" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2E7D32">
    Pickle
  </text>
  <rect x="370" y="250" width="60" height="25" rx="5" fill="#E3F2FD" stroke="#2196F3" stroke-width="1"/>
  <text x="400" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1565C0">
    Joblib
  </text>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowhead2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
</svg>