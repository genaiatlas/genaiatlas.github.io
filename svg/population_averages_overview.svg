<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="700" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="600" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Population Averages Algorithm Overview
  </text>
  
  <!-- User-Item Matrix Section -->
  <g transform="translate(100, 80)">
    <rect x="0" y="0" width="480" height="300" fill="#fff" stroke="#34495e" stroke-width="2" rx="8"/>
    <text x="240" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      User-Item Matrix (Sparse Data)
    </text>
    
    <!-- Matrix Grid -->
    <g transform="translate(40, 60)">
      <!-- Headers -->
      <text x="-20" y="15" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#7f8c8d">Users</text>
      <text x="20" y="-10" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#7f8c8d">Items (Restaurants)</text>
      
      <!-- Draw grid cells -->
      <g>
        <rect x="0" y="0" width="80" height="40" fill="#3498db" stroke="#2c3e50" stroke-width="1"/>
        <text x="40" y="25" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#fff">5★</text>
        
        <rect x="90" y="0" width="80" height="40" fill="#ecf0f1" stroke="#2c3e50" stroke-width="1"/>
        <text x="130" y="25" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#95a5a6">?</text>
        
        <rect x="180" y="0" width="80" height="40" fill="#3498db" stroke="#2c3e50" stroke-width="1"/>
        <text x="220" y="25" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#fff">4★</text>
        
        <rect x="270" y="0" width="80" height="40" fill="#ecf0f1" stroke="#2c3e50" stroke-width="1"/>
        <text x="310" y="25" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#95a5a6">?</text>
        
        <rect x="360" y="0" width="80" height="40" fill="#ecf0f1" stroke="#2c3e50" stroke-width="1"/>
        <text x="400" y="25" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#95a5a6">?</text>
      </g>
      
      <g transform="translate(0, 50)">
        <rect x="0" y="0" width="80" height="40" fill="#ecf0f1" stroke="#2c3e50" stroke-width="1"/>
        <text x="40" y="25" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#95a5a6">?</text>
        
        <rect x="90" y="0" width="80" height="40" fill="#3498db" stroke="#2c3e50" stroke-width="1"/>
        <text x="130" y="25" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#fff">3★</text>
        
        <rect x="180" y="0" width="80" height="40" fill="#ecf0f1" stroke="#2c3e50" stroke-width="1"/>
        <text x="220" y="25" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#95a5a6">?</text>
        
        <rect x="270" y="0" width="80" height="40" fill="#3498db" stroke="#2c3e50" stroke-width="1"/>
        <text x="310" y="25" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#fff">5★</text>
        
        <rect x="360" y="0" width="80" height="40" fill="#ecf0f1" stroke="#2c3e50" stroke-width="1"/>
        <text x="400" y="25" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#95a5a6">?</text>
      </g>
      
      <g transform="translate(0, 100)">
        <rect x="0" y="0" width="80" height="40" fill="#ecf0f1" stroke="#2c3e50" stroke-width="1"/>
        <text x="40" y="25" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#95a5a6">?</text>
        
        <rect x="90" y="0" width="80" height="40" fill="#ecf0f1" stroke="#2c3e50" stroke-width="1"/>
        <text x="130" y="25" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#95a5a6">?</text>
        
        <rect x="180" y="0" width="80" height="40" fill="#ecf0f1" stroke="#2c3e50" stroke-width="1"/>
        <text x="220" y="25" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#95a5a6">?</text>
        
        <rect x="270" y="0" width="80" height="40" fill="#ecf0f1" stroke="#2c3e50" stroke-width="1"/>
        <text x="310" y="25" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#95a5a6">?</text>
        
        <rect x="360" y="0" width="80" height="40" fill="#3498db" stroke="#2c3e50" stroke-width="1"/>
        <text x="400" y="25" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#fff">4★</text>
      </g>
      
      <g transform="translate(0, 150)">
        <rect x="0" y="0" width="80" height="40" fill="#3498db" stroke="#2c3e50" stroke-width="1"/>
        <text x="40" y="25" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#fff">5★</text>
        
        <rect x="90" y="0" width="80" height="40" fill="#ecf0f1" stroke="#2c3e50" stroke-width="1"/>
        <text x="130" y="25" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#95a5a6">?</text>
        
        <rect x="180" y="0" width="80" height="40" fill="#ecf0f1" stroke="#2c3e50" stroke-width="1"/>
        <text x="220" y="25" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#95a5a6">?</text>
        
        <rect x="270" y="0" width="80" height="40" fill="#ecf0f1" stroke="#2c3e50" stroke-width="1"/>
        <text x="310" y="25" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#95a5a6">?</text>
        
        <rect x="360" y="0" width="80" height="40" fill="#ecf0f1" stroke="#2c3e50" stroke-width="1"/>
        <text x="400" y="25" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#95a5a6">?</text>
      </g>
    </g>
    
    <text x="240" y="270" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#e74c3c" font-style="italic">
      Most entries are missing (sparse data)
    </text>
  </g>
  
  <!-- Arrow -->
  <g transform="translate(600, 230)">
    <line x1="0" y1="0" x2="80" y2="0" stroke="#2c3e50" stroke-width="3" marker-end="url(#arrowhead)"/>
    <text x="40" y="-10" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50" font-weight="bold">
      Algorithm
    </text>
  </g>
  
  <!-- Algorithm Process Section -->
  <g transform="translate(700, 80)">
    <rect x="0" y="0" width="420" height="300" fill="#fff" stroke="#34495e" stroke-width="2" rx="8"/>
    <text x="210" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Population Averages Process
    </text>
    
    <!-- Step 1 -->
    <g transform="translate(20, 60)">
      <circle cx="15" cy="15" r="15" fill="#27ae60"/>
      <text x="15" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">1</text>
      <text x="40" y="20" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">
        Calculate average rating for each item
      </text>
      <text x="40" y="40" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d" font-style="italic">
        Avg = Σ(ratings) / n
      </text>
    </g>
    
    <!-- Step 2 -->
    <g transform="translate(20, 120)">
      <circle cx="15" cy="15" r="15" fill="#2980b9"/>
      <text x="15" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">2</text>
      <text x="40" y="20" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">
        Apply correction for sample size
      </text>
      <text x="40" y="40" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d" font-style="italic">
        Adjusted = Avg ± C/√n
      </text>
    </g>
    
    <!-- Step 3 -->
    <g transform="translate(20, 180)">
      <circle cx="15" cy="15" r="15" fill="#8e44ad"/>
      <text x="15" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">3</text>
      <text x="40" y="20" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">
        Rank items by adjusted score
      </text>
      <text x="40" y="40" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d" font-style="italic">
        Higher score = Better rank
      </text>
    </g>
    
    <!-- Step 4 -->
    <g transform="translate(20, 240)">
      <circle cx="15" cy="15" r="15" fill="#e67e22"/>
      <text x="15" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">4</text>
      <text x="40" y="20" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">
        Present ranked recommendations
      </text>
    </g>
  </g>
  
  <!-- Key Insight Box -->
  <g transform="translate(100, 430)">
    <rect x="0" y="0" width="1000" height="230" fill="#ecf9ff" stroke="#3498db" stroke-width="2" rx="8"/>
    <text x="500" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      🎯 Key Insights
    </text>
    
    <!-- Insight 1 -->
    <g transform="translate(30, 60)">
      <rect x="0" y="0" width="450" height="70" fill="#fff" stroke="#3498db" stroke-width="1" rx="4"/>
      <text x="10" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2980b9">
        Problem:
      </text>
      <text x="10" y="45" font-family="Arial, sans-serif" font-size="13" fill="#34495e">
        Simple averages fail with sparse data
      </text>
      <text x="10" y="62" font-family="Arial, sans-serif" font-size="13" fill="#34495e">
        (few ratings → unreliable estimates)
      </text>
    </g>
    
    <!-- Insight 2 -->
    <g transform="translate(520, 60)">
      <rect x="0" y="0" width="450" height="70" fill="#fff" stroke="#27ae60" stroke-width="1" rx="4"/>
      <text x="10" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#27ae60">
        Solution:
      </text>
      <text x="10" y="45" font-family="Arial, sans-serif" font-size="13" fill="#34495e">
        Apply corrections based on Central Limit
      </text>
      <text x="10" y="62" font-family="Arial, sans-serif" font-size="13" fill="#34495e">
        Theorem (penalty scales with 1/√n)
      </text>
    </g>
    
    <!-- Insight 3 -->
    <g transform="translate(30, 150)">
      <rect x="0" y="0" width="450" height="60" fill="#fff" stroke="#e67e22" stroke-width="1" rx="4"/>
      <text x="10" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e67e22">
        Conservative: Avg - C/√n
      </text>
      <text x="10" y="45" font-family="Arial, sans-serif" font-size="13" fill="#34495e">
        Prevents gaming, safe for users
      </text>
    </g>
    
    <!-- Insight 4 -->
    <g transform="translate(520, 150)">
      <rect x="0" y="0" width="450" height="60" fill="#fff" stroke="#9b59b6" stroke-width="1" rx="4"/>
      <text x="10" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#8e44ad">
        Optimistic: Avg + C/√n
      </text>
      <text x="10" y="45" font-family="Arial, sans-serif" font-size="13" fill="#34495e">
        Encourages exploration of new items
      </text>
    </g>
  </g>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#2c3e50"/>
    </marker>
  </defs>
</svg>