<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="900" height="700" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="450" y="40" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Linear Regression Framework
  </text>
  
  <!-- Main sections with connecting arrows -->
  
  <!-- SECTION 1: Model Specification -->
  <rect x="50" y="80" width="250" height="140" fill="#3498db" stroke="#2c3e50" stroke-width="2" rx="10"/>
  <text x="175" y="110" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
    1. Model Specification
  </text>
  <text x="175" y="140" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="white">
    Y = β₀ + β₁X₁ + ... + βₚXₚ + ε
  </text>
  <text x="175" y="165" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    • Define response variable Y
  </text>
  <text x="175" y="185" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    • Select predictor variables X
  </text>
  <text x="175" y="205" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    • Assume linearity
  </text>
  
  <!-- Arrow 1 -->
  <path d="M 300 150 L 360 150" stroke="#2c3e50" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  
  <!-- SECTION 2: Assumptions -->
  <rect x="360" y="80" width="250" height="140" fill="#9b59b6" stroke="#2c3e50" stroke-width="2" rx="10"/>
  <text x="485" y="110" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
    2. Check Assumptions
  </text>
  <text x="485" y="140" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    • Linearity
  </text>
  <text x="485" y="160" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    • Independence of errors
  </text>
  <text x="485" y="180" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    • Homoscedasticity (constant variance)
  </text>
  <text x="485" y="200" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    • Normality of residuals
  </text>
  
  <!-- Arrow 2 -->
  <path d="M 610 150 L 670 150" stroke="#2c3e50" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  
  <!-- SECTION 3: Estimation -->
  <rect x="670" y="80" width="200" height="140" fill="#e67e22" stroke="#2c3e50" stroke-width="2" rx="10"/>
  <text x="770" y="110" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
    3. Estimation
  </text>
  <text x="770" y="140" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="white">
    β̂ = (X'X)⁻¹X'Y
  </text>
  <text x="770" y="165" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    Ordinary Least Squares
  </text>
  <text x="770" y="185" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    Minimize: Σ(Yᵢ - Ŷᵢ)²
  </text>
  <text x="770" y="205" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    (sum of squared residuals)
  </text>
  
  <!-- Arrow down from estimation -->
  <path d="M 770 220 L 770 270" stroke="#2c3e50" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  
  <!-- SECTION 4: Model Evaluation -->
  <rect x="670" y="270" width="200" height="140" fill="#16a085" stroke="#2c3e50" stroke-width="2" rx="10"/>
  <text x="770" y="300" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
    4. Model Evaluation
  </text>
  <text x="770" y="330" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    • R² (coefficient of determination)
  </text>
  <text x="770" y="350" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    • Adjusted R²
  </text>
  <text x="770" y="370" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    • RMSE (Root Mean Square Error)
  </text>
  <text x="770" y="390" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    • Residual plots analysis
  </text>
  
  <!-- Arrow down -->
  <path d="M 770 410 L 770 460" stroke="#2c3e50" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  
  <!-- SECTION 5: Inference -->
  <rect x="670" y="460" width="200" height="140" fill="#c0392b" stroke="#2c3e50" stroke-width="2" rx="10"/>
  <text x="770" y="490" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
    5. Statistical Inference
  </text>
  <text x="770" y="520" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    • Confidence intervals for β
  </text>
  <text x="770" y="540" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    • Hypothesis tests (t-tests, F-test)
  </text>
  <text x="770" y="560" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    • p-values for coefficients
  </text>
  <text x="770" y="580" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    • Prediction intervals
  </text>
  
  <!-- Arrow left from inference -->
  <path d="M 670 530 L 610 530" stroke="#2c3e50" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  
  <!-- SECTION 6: Prediction -->
  <rect x="360" y="460" width="250" height="140" fill="#27ae60" stroke="#2c3e50" stroke-width="2" rx="10"/>
  <text x="485" y="490" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
    6. Prediction
  </text>
  <text x="485" y="520" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="white">
    Ŷₙₑw = β̂₀ + β̂₁X₁ + ... + β̂ₚXₚ
  </text>
  <text x="485" y="550" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    • Point predictions
  </text>
  <text x="485" y="570" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    • Prediction intervals
  </text>
  <text x="485" y="590" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    • Model deployment
  </text>
  
  <!-- Arrow left from prediction -->
  <path d="M 360 530 L 300 530" stroke="#2c3e50" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  
  <!-- SECTION 7: Diagnostics -->
  <rect x="50" y="460" width="250" height="140" fill="#f39c12" stroke="#2c3e50" stroke-width="2" rx="10"/>
  <text x="175" y="490" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
    7. Diagnostics
  </text>
  <text x="175" y="520" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    • Residual plots (normality, patterns)
  </text>
  <text x="175" y="540" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    • Influence measures (Cook's D)
  </text>
  <text x="175" y="560" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    • Multicollinearity (VIF)
  </text>
  <text x="175" y="580" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    • Leverage and outliers
  </text>
  
  <!-- Feedback arrow from diagnostics back to model -->
  <path d="M 175 460 L 175 390 Q 175 350, 200 320 L 200 220" stroke="#7f8c8d" stroke-width="2" fill="none" marker-end="url(#arrow2)" stroke-dasharray="8,4"/>
  
  <text x="140" y="340" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d" font-weight="bold">
    Model
  </text>
  <text x="140" y="355" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d" font-weight="bold">
    Refinement
  </text>
  
  <!-- Center data flow box -->
  <rect x="360" y="270" width="250" height="140" fill="white" stroke="#34495e" stroke-width="2" rx="10"/>
  <text x="485" y="300" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Data Requirements
  </text>
  <text x="485" y="330" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">
    • Sample size: n &gt; p (preferably n ≥ 10p)
  </text>
  <text x="485" y="350" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">
    • No perfect multicollinearity
  </text>
  <text x="485" y="370" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">
    • Representative sample
  </text>
  <text x="485" y="390" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">
    • Quality data collection
  </text>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="3" orient="auto">
      <polygon points="0 0, 12 3, 0 6" fill="#2c3e50"/>
    </marker>
    <marker id="arrow2" markerWidth="12" markerHeight="12" refX="10" refY="3" orient="auto">
      <polygon points="0 0, 12 3, 0 6" fill="#7f8c8d"/>
    </marker>
  </defs>
  
  <!-- Bottom note -->
  <text x="450" y="680" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d" font-style="italic">
    Iterative process: refinement based on diagnostics and evaluation
  </text>
</svg>