<svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="treeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E8F5E8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4CAF50;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="boostGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E3F2FD;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2196F3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="neuralGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FCE4EC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E91E63;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="svmGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFF3E0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF9800;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#333">
    Types of Hyperparameters by Algorithm Family
  </text>
  
  <!-- Tree-Based Models -->
  <rect x="50" y="60" width="220" height="180" rx="10" fill="url(#treeGrad)" stroke="#4CAF50" stroke-width="2"/>
  <text x="160" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    Tree-Based Models
  </text>
  <text x="160" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
    Random Forest, Decision Trees
  </text>
  
  <text x="70" y="125" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">
    Key Parameters:
  </text>
  <text x="75" y="145" font-family="Arial, sans-serif" font-size="10" fill="white">
    • n_estimators (50-500)
  </text>
  <text x="75" y="160" font-family="Arial, sans-serif" font-size="10" fill="white">
    • max_depth (3-20, None)
  </text>
  <text x="75" y="175" font-family="Arial, sans-serif" font-size="10" fill="white">
    • min_samples_split (2-20)
  </text>
  <text x="75" y="190" font-family="Arial, sans-serif" font-size="10" fill="white">
    • min_samples_leaf (1-10)
  </text>
  <text x="75" y="205" font-family="Arial, sans-serif" font-size="10" fill="white">
    • max_features (sqrt, log2, 0.1-1.0)
  </text>
  <text x="75" y="220" font-family="Arial, sans-serif" font-size="10" fill="white">
    • criterion (gini, entropy)
  </text>
  
  <!-- Boosting Models -->
  <rect x="290" y="60" width="220" height="180" rx="10" fill="url(#boostGrad)" stroke="#2196F3" stroke-width="2"/>
  <text x="400" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    Boosting Models
  </text>
  <text x="400" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
    AdaBoost, GradientBoost, XGBoost
  </text>
  
  <text x="310" y="125" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">
    Key Parameters:
  </text>
  <text x="315" y="145" font-family="Arial, sans-serif" font-size="10" fill="white">
    • learning_rate (0.01-0.3)
  </text>
  <text x="315" y="160" font-family="Arial, sans-serif" font-size="10" fill="white">
    • n_estimators (50-1000)
  </text>
  <text x="315" y="175" font-family="Arial, sans-serif" font-size="10" fill="white">
    • max_depth (3-10)
  </text>
  <text x="315" y="190" font-family="Arial, sans-serif" font-size="10" fill="white">
    • subsample (0.5-1.0)
  </text>
  <text x="315" y="205" font-family="Arial, sans-serif" font-size="10" fill="white">
    • reg_alpha (0-1)
  </text>
  <text x="315" y="220" font-family="Arial, sans-serif" font-size="10" fill="white">
    • reg_lambda (0-1)
  </text>
  
  <!-- Neural Networks -->
  <rect x="530" y="60" width="220" height="180" rx="10" fill="url(#neuralGrad)" stroke="#E91E63" stroke-width="2"/>
  <text x="640" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    Neural Networks
  </text>
  <text x="640" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
    Deep Learning Models
  </text>
  
  <text x="550" y="125" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">
    Key Parameters:
  </text>
  <text x="555" y="145" font-family="Arial, sans-serif" font-size="10" fill="white">
    • learning_rate (1e-5 to 1e-1)
  </text>
  <text x="555" y="160" font-family="Arial, sans-serif" font-size="10" fill="white">
    • batch_size (16, 32, 64, 128)
  </text>
  <text x="555" y="175" font-family="Arial, sans-serif" font-size="10" fill="white">
    • hidden_layers (1-10)
  </text>
  <text x="555" y="190" font-family="Arial, sans-serif" font-size="10" fill="white">
    • neurons_per_layer (32-512)
  </text>
  <text x="555" y="205" font-family="Arial, sans-serif" font-size="10" fill="white">
    • dropout_rate (0.1-0.5)
  </text>
  <text x="555" y="220" font-family="Arial, sans-serif" font-size="10" fill="white">
    • activation (relu, tanh, sigmoid)
  </text>
  
  <!-- Support Vector Machines -->
  <rect x="770" y="60" width="220" height="180" rx="10" fill="url(#svmGrad)" stroke="#FF9800" stroke-width="2"/>
  <text x="880" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    Support Vector
  </text>
  <text x="880" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    Machines
  </text>
  
  <text x="790" y="125" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">
    Key Parameters:
  </text>
  <text x="795" y="145" font-family="Arial, sans-serif" font-size="10" fill="white">
    • C (0.1, 1, 10, 100)
  </text>
  <text x="795" y="160" font-family="Arial, sans-serif" font-size="10" fill="white">
    • kernel (linear, poly, rbf)
  </text>
  <text x="795" y="175" font-family="Arial, sans-serif" font-size="10" fill="white">
    • gamma (scale, auto, 0.001-1)
  </text>
  <text x="795" y="190" font-family="Arial, sans-serif" font-size="10" fill="white">
    • degree (2-5, for poly)
  </text>
  <text x="795" y="205" font-family="Arial, sans-serif" font-size="10" fill="white">
    • epsilon (0.01-1, for SVR)
  </text>
  <text x="795" y="220" font-family="Arial, sans-serif" font-size="10" fill="white">
    • coef0 (-1 to 1, for poly/sigmoid)
  </text>
  
  <!-- Parameter Types Classification -->
  <text x="500" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">
    Hyperparameter Categories
  </text>
  
  <!-- Discrete Parameters -->
  <rect x="100" y="300" width="180" height="80" rx="8" fill="#E8F5E8" stroke="#4CAF50" stroke-width="1"/>
  <text x="190" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2E7D32">
    Discrete Parameters
  </text>
  <text x="110" y="340" font-family="Arial, sans-serif" font-size="10" fill="#2E7D32">
    • Integer values
  </text>
  <text x="110" y="355" font-family="Arial, sans-serif" font-size="10" fill="#2E7D32">
    • Categorical choices
  </text>
  <text x="110" y="370" font-family="Arial, sans-serif" font-size="10" fill="#2E7D32">
    • Examples: n_estimators, kernel
  </text>
  
  <!-- Continuous Parameters -->
  <rect x="300" y="300" width="180" height="80" rx="8" fill="#E3F2FD" stroke="#2196F3" stroke-width="1"/>
  <text x="390" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1565C0">
    Continuous Parameters
  </text>
  <text x="310" y="340" font-family="Arial, sans-serif" font-size="10" fill="#1565C0">
    • Float values
  </text>
  <text x="310" y="355" font-family="Arial, sans-serif" font-size="10" fill="#1565C0">
    • Range-based
  </text>
  <text x="310" y="370" font-family="Arial, sans-serif" font-size="10" fill="#1565C0">
    • Examples: learning_rate, C
  </text>
  
  <!-- Conditional Parameters -->
  <rect x="500" y="300" width="180" height="80" rx="8" fill="#FCE4EC" stroke="#E91E63" stroke-width="1"/>
  <text x="590" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#C2185B">
    Conditional Parameters
  </text>
  <text x="510" y="340" font-family="Arial, sans-serif" font-size="10" fill="#C2185B">
    • Depend on other params
  </text>
  <text x="510" y="355" font-family="Arial, sans-serif" font-size="10" fill="#C2185B">
    • Context-sensitive
  </text>
  <text x="510" y="370" font-family="Arial, sans-serif" font-size="10" fill="#C2185B">
    • Examples: degree (if poly kernel)
  </text>
  
  <!-- Ordinal Parameters -->
  <rect x="700" y="300" width="180" height="80" rx="8" fill="#FFF3E0" stroke="#FF9800" stroke-width="1"/>
  <text x="790" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#E65100">
    Ordinal Parameters
  </text>
  <text x="710" y="340" font-family="Arial, sans-serif" font-size="10" fill="#E65100">
    • Ordered categories
  </text>
  <text x="710" y="355" font-family="Arial, sans-serif" font-size="10" fill="#E65100">
    • Meaningful sequence
  </text>
  <text x="710" y="370" font-family="Arial, sans-serif" font-size="10" fill="#E65100">
    • Examples: max_depth levels
  </text>
  
  <!-- Tuning Complexity -->
  <text x="500" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">
    Tuning Complexity Scale
  </text>
  
  <!-- Complexity arrows -->
  <rect x="150" y="440" width="700" height="10" rx="5" fill="#ddd"/>
  <rect x="150" y="440" width="140" height="10" rx="5" fill="#4CAF50"/>
  <rect x="290" y="440" width="170" height="10" rx="5" fill="#FFEB3B"/>
  <rect x="460" y="440" width="200" height="10" rx="5" fill="#FF5722"/>
  <rect x="660" y="440" width="190" height="10" rx="5" fill="#9C27B0"/>
  
  <text x="220" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">
    Simple (Tree-based)
  </text>
  <text x="375" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">
    Moderate (Boosting)
  </text>
  <text x="560" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">
    Complex (Neural Networks)
  </text>
  <text x="755" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">
    Advanced (Deep Learning)
  </text>
</svg>