<svg viewBox="0 0 900 650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .node { fill: #4A90E2; stroke: #2E5D8A; stroke-width: 2; }
      .input-node { fill: #7ED321; stroke: #5AA016; }
      .output-node { fill: #F5A623; stroke: #D1890B; }
      .gradient-very-small { fill: #FFE6E6; stroke: #FF9999; stroke-width: 1; }
      .gradient-small { fill: #FFCCCC; stroke: #FF6666; stroke-width: 1.5; }
      .gradient-medium { fill: #FFB3B3; stroke: #FF3333; stroke-width: 2; }
      .gradient-large { fill: #FF9999; stroke: #FF0000; stroke-width: 2.5; }
      .gradient-very-large { fill: #FF8080; stroke: #CC0000; stroke-width: 3; }
      .connection { stroke: #666; stroke-width: 1; opacity: 0.3; }
      .backward-flow { stroke: #E74C3C; stroke-width: 2; fill: none; stroke-dasharray: 5,5; }
      .text-label { font-family: Arial, sans-serif; font-size: 12px; text-anchor: middle; fill: #333; font-weight: bold; }
      .gradient-label { font-family: 'Times New Roman', serif; font-size: 10px; text-anchor: middle; fill: #333; }
      .layer-label { font-family: Arial, sans-serif; font-size: 14px; text-anchor: middle; fill: #333; font-weight: bold; }
      .title-text { font-family: Arial, sans-serif; font-size: 18px; text-anchor: middle; fill: #333; font-weight: bold; }
      .equation-text { font-family: 'Times New Roman', serif; font-size: 12px; text-anchor: middle; fill: #333; }
      .problem-text { font-family: Arial, sans-serif; font-size: 14px; fill: #C0392B; font-weight: bold; }
    </style>
    <marker id="gradient-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#E74C3C" />
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="650" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>
  
  <!-- Title -->
  <text x="450" y="30" class="title-text">Vanishing Gradient Problem in Deep Networks</text>
  
  <!-- Layer Labels -->
  <text x="100" y="70" class="layer-label">Input</text>
  <text x="200" y="70" class="layer-label">Layer 1</text>
  <text x="300" y="70" class="layer-label">Layer 2</text>
  <text x="400" y="70" class="layer-label">Layer 3</text>
  <text x="500" y="70" class="layer-label">Layer 4</text>
  <text x="600" y="70" class="layer-label">Layer 5</text>
  <text x="700" y="70" class="layer-label">Output</text>
  
  <!-- Deep Network Architecture -->
  <!-- Input Layer -->
  <circle cx="100" cy="120" r="12" class="input-node"/>
  <circle cx="100" cy="150" r="12" class="input-node"/>
  <circle cx="100" cy="180" r="12" class="input-node"/>
  
  <!-- Layer 1 -->
  <circle cx="200" cy="105" r="10" class="node"/>
  <circle cx="200" cy="130" r="10" class="node"/>
  <circle cx="200" cy="155" r="10" class="node"/>
  <circle cx="200" cy="180" r="10" class="node"/>
  <circle cx="200" cy="205" r="10" class="node"/>
  
  <!-- Layer 2 -->
  <circle cx="300" cy="105" r="10" class="node"/>
  <circle cx="300" cy="130" r="10" class="node"/>
  <circle cx="300" cy="155" r="10" class="node"/>
  <circle cx="300" cy="180" r="10" class="node"/>
  <circle cx="300" cy="205" r="10" class="node"/>
  
  <!-- Layer 3 -->
  <circle cx="400" cy="105" r="10" class="node"/>
  <circle cx="400" cy="130" r="10" class="node"/>
  <circle cx="400" cy="155" r="10" class="node"/>
  <circle cx="400" cy="180" r="10" class="node"/>
  <circle cx="400" cy="205" r="10" class="node"/>
  
  <!-- Layer 4 -->
  <circle cx="500" cy="105" r="10" class="node"/>
  <circle cx="500" cy="130" r="10" class="node"/>
  <circle cx="500" cy="155" r="10" class="node"/>
  <circle cx="500" cy="180" r="10" class="node"/>
  <circle cx="500" cy="205" r="10" class="node"/>
  
  <!-- Layer 5 -->
  <circle cx="600" cy="105" r="10" class="node"/>
  <circle cx="600" cy="130" r="10" class="node"/>
  <circle cx="600" cy="155" r="10" class="node"/>
  <circle cx="600" cy="180" r="10" class="node"/>
  <circle cx="600" cy="205" r="10" class="node"/>
  
  <!-- Output Layer -->
  <circle cx="700" cy="150" r="12" class="output-node"/>
  
  <!-- Connections (simplified) -->
  <line x1="112" y1="120" x2="188" y2="130" class="connection"/>
  <line x1="112" y1="150" x2="188" y2="155" class="connection"/>
  <line x1="112" y1="180" x2="188" y2="180" class="connection"/>
  
  <line x1="210" y1="130" x2="290" y2="130" class="connection"/>
  <line x1="210" y1="155" x2="290" y2="155" class="connection"/>
  <line x1="210" y1="180" x2="290" y2="180" class="connection"/>
  
  <line x1="310" y1="130" x2="390" y2="130" class="connection"/>
  <line x1="310" y1="155" x2="390" y2="155" class="connection"/>
  <line x1="310" y1="180" x2="390" y2="180" class="connection"/>
  
  <line x1="410" y1="130" x2="490" y2="130" class="connection"/>
  <line x1="410" y1="155" x2="490" y2="155" class="connection"/>
  <line x1="410" y1="180" x2="490" y2="180" class="connection"/>
  
  <line x1="510" y1="130" x2="590" y2="130" class="connection"/>
  <line x1="510" y1="155" x2="590" y2="155" class="connection"/>
  <line x1="510" y1="180" x2="590" y2="180" class="connection"/>
  
  <line x1="610" y1="155" x2="688" y2="150" class="connection"/>
  
  <!-- Gradient Flow Visualization -->
  <line x1="670" y1="250" x2="630" y2="250" class="backward-flow" marker-end="url(#gradient-arrow)"/>
  <line x1="580" y1="250" x2="530" y2="250" class="backward-flow" marker-end="url(#gradient-arrow)"/>
  <line x1="480" y1="250" x2="430" y2="250" class="backward-flow" marker-end="url(#gradient-arrow)"/>
  <line x1="380" y1="250" x2="330" y2="250" class="backward-flow" marker-end="url(#gradient-arrow)"/>
  <line x1="280" y1="250" x2="230" y2="250" class="backward-flow" marker-end="url(#gradient-arrow)"/>
  <line x1="180" y1="250" x2="130" y2="250" class="backward-flow" marker-end="url(#gradient-arrow)"/>
  
  <!-- Gradient Magnitude Visualization -->
  <text x="450" y="280" class="text-label">Gradient Magnitude (Backward Flow)</text>
  
  <!-- Very Large Gradient (Output) -->
  <rect x="680" y="300" width="40" height="30" class="gradient-very-large" rx="5"/>
  <text x="700" y="318" class="gradient-label">1.0</text>
  <text x="700" y="340" class="gradient-label">Large</text>
  
  <!-- Large Gradient -->
  <rect x="580" y="300" width="40" height="25" class="gradient-large" rx="5"/>
  <text x="600" y="315" class="gradient-label">0.3</text>
  <text x="600" y="335" class="gradient-label">Medium</text>
  
  <!-- Medium Gradient -->
  <rect x="480" y="300" width="40" height="20" class="gradient-medium" rx="5"/>
  <text x="500" y="312" class="gradient-label">0.08</text>
  <text x="500" y="330" class="gradient-label">Small</text>
  
  <!-- Small Gradient -->
  <rect x="380" y="300" width="40" height="15" class="gradient-small" rx="5"/>
  <text x="400" y="310" class="gradient-label">0.02</text>
  <text x="400" y="325" class="gradient-label">Tiny</text>
  
  <!-- Very Small Gradient -->
  <rect x="280" y="300" width="40" height="10" class="gradient-small" rx="5"/>
  <text x="300" y="307" class="gradient-label">0.005</text>
  <text x="300" y="320" class="gradient-label">Vanishing</text>
  
  <!-- Vanished Gradient -->
  <rect x="180" y="300" width="40" height="5" class="gradient-very-small" rx="2"/>
  <text x="200" y="305" class="gradient-label">≈0</text>
  <text x="200" y="315" class="gradient-label">Vanished</text>
  
  <!-- Mathematical Explanation -->
  <rect x="50" y="370" width="800" height="120" fill="#FFF5F5" stroke="#E74C3C" stroke-width="2" rx="10"/>
  <text x="450" y="395" class="title-text" style="fill: #C0392B;">Mathematical Cause</text>
  
  <text x="450" y="420" class="equation-text">Gradient = ∂ℒ/∂W¹ = (∂ℒ/∂a⁶) · (∂a⁶/∂a⁵) · (∂a⁵/∂a⁴) · (∂a⁴/∂a³) · (∂a³/∂a²) · (∂a²/∂a¹) · (∂a¹/∂W¹)</text>
  
  <text x="450" y="445" class="equation-text">If each ∂aᵢ/∂aᵢ₋₁ ≤ 0.25 (sigmoid activation), then:</text>
  <text x="450" y="465" class="equation-text">Product ≈ (0.25)⁵ = 0.001 → Vanishing gradient for early layers</text>
  
  <!-- Problem Effects -->
  <rect x="50" y="510" width="380" height="120" fill="#FFE6E6" stroke="#FF9999" stroke-width="2" rx="10"/>
  <text x="240" y="535" class="problem-text">Problems Caused:</text>
  <text x="70" y="555" class="problem-text" style="font-size: 12px;">• Early layers learn very slowly</text>
  <text x="70" y="575" class="problem-text" style="font-size: 12px;">• Poor feature representation</text>
  <text x="70" y="595" class="problem-text" style="font-size: 12px;">• Training stagnation</text>
  <text x="70" y="615" class="problem-text" style="font-size: 12px;">• Difficulty training deep networks</text>
  
  <!-- Solutions -->
  <rect x="470" y="510" width="380" height="120" fill="#E6FFE6" stroke="#99FF99" stroke-width="2" rx="10"/>
  <text x="660" y="535" class="problem-text" style="color: #2E7D2E;">Solutions:</text>
  <text x="490" y="555" class="problem-text" style="font-size: 12px; color: #2E7D2E;">• ReLU activations (f'(x) = 1)</text>
  <text x="490" y="575" class="problem-text" style="font-size: 12px; color: #2E7D2E;">• Better initialization (He/Xavier)</text>
  <text x="490" y="595" class="problem-text" style="font-size: 12px; color: #2E7D2E;">• Residual connections (ResNet)</text>
  <text x="490" y="615" class="problem-text" style="font-size: 12px; color: #2E7D2E;">• Batch normalization</text>
</svg>