<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="500" y="35" font-size="24" font-weight="bold" text-anchor="middle" fill="#2C3E50">
    User Similarity in Comparison Space
  </text>
  
  <!-- User comparison vectors -->
  <rect x="50" y="70" width="900" height="280" fill="#F8F9F9" stroke="#34495E" stroke-width="2" rx="10"/>
  <text x="500" y="100" font-size="18" font-weight="bold" text-anchor="middle" fill="#2C3E50">
    Comparison Vectors for Three Users
  </text>
  
  <!-- Three users side by side -->
  <!-- User 1: Prof -->
  <g transform="translate(100, 130)">
    <rect x="0" y="0" width="230" height="190" fill="#E8F4F8" stroke="#3498DB" stroke-width="2" rx="6"/>
    <text x="115" y="25" font-size="15" font-weight="bold" text-anchor="middle" fill="#2C3E50">Prof. Devavrat</text>
    
    <!-- Comparison 1: AB -->
    <rect x="15" y="45" width="200" height="40" fill="white" stroke="#BDC3C7" stroke-width="1" rx="3"/>
    <text x="25" y="65" font-size="12" fill="#7F8C8D">A vs B:</text>
    <circle cx="180" cy="60" r="15" fill="#27AE60"/>
    <text x="180" y="66" font-size="13" font-weight="bold" fill="white" text-anchor="middle">+1</text>
    
    <!-- Comparison 2: BC -->
    <rect x="15" y="95" width="200" height="40" fill="white" stroke="#BDC3C7" stroke-width="1" rx="3"/>
    <text x="25" y="115" font-size="12" fill="#7F8C8D">B vs C:</text>
    <circle cx="180" cy="110" r="15" fill="#27AE60"/>
    <text x="180" y="116" font-size="13" font-weight="bold" fill="white" text-anchor="middle">+1</text>
    
    <!-- Comparison 3: CA -->
    <rect x="15" y="145" width="200" height="40" fill="white" stroke="#BDC3C7" stroke-width="1" rx="3"/>
    <text x="25" y="165" font-size="12" fill="#7F8C8D">C vs A:</text>
    <circle cx="180" cy="160" r="15" fill="#E74C3C"/>
    <text x="180" y="166" font-size="13" font-weight="bold" fill="white" text-anchor="middle">-1</text>
  </g>
  
  <!-- User 2: You -->
  <g transform="translate(385, 130)">
    <rect x="0" y="0" width="230" height="190" fill="#FEF5E7" stroke="#E67E22" stroke-width="2" rx="6"/>
    <text x="115" y="25" font-size="15" font-weight="bold" text-anchor="middle" fill="#2C3E50">You</text>
    
    <!-- Comparison 1: AB -->
    <rect x="15" y="45" width="200" height="40" fill="white" stroke="#BDC3C7" stroke-width="1" rx="3"/>
    <text x="25" y="65" font-size="12" fill="#7F8C8D">A vs B:</text>
    <circle cx="180" cy="60" r="15" fill="#27AE60"/>
    <text x="180" y="66" font-size="13" font-weight="bold" fill="white" text-anchor="middle">+1</text>
    
    <!-- Comparison 2: BC -->
    <rect x="15" y="95" width="200" height="40" fill="white" stroke="#BDC3C7" stroke-width="1" rx="3"/>
    <text x="25" y="115" font-size="12" fill="#7F8C8D">B vs C:</text>
    <circle cx="180" cy="110" r="15" fill="#E74C3C"/>
    <text x="180" y="116" font-size="13" font-weight="bold" fill="white" text-anchor="middle">-1</text>
    
    <!-- Comparison 3: CA -->
    <rect x="15" y="145" width="200" height="40" fill="white" stroke="#BDC3C7" stroke-width="1" rx="3"/>
    <text x="25" y="165" font-size="12" fill="#7F8C8D">C vs A:</text>
    <circle cx="180" cy="160" r="15" fill="#E74C3C"/>
    <text x="180" y="166" font-size="13" font-weight="bold" fill="white" text-anchor="middle">-1</text>
  </g>
  
  <!-- User 3: Philip -->
  <g transform="translate(670, 130)">
    <rect x="0" y="0" width="230" height="190" fill="#FADBD8" stroke="#E74C3C" stroke-width="2" rx="6"/>
    <text x="115" y="25" font-size="15" font-weight="bold" text-anchor="middle" fill="#2C3E50">Philip</text>
    
    <!-- Comparison 1: AB -->
    <rect x="15" y="45" width="200" height="40" fill="white" stroke="#BDC3C7" stroke-width="1" rx="3"/>
    <text x="25" y="65" font-size="12" fill="#7F8C8D">A vs B:</text>
    <circle cx="180" cy="60" r="15" fill="#E74C3C"/>
    <text x="180" y="66" font-size="13" font-weight="bold" fill="white" text-anchor="middle">-1</text>
    
    <!-- Comparison 2: BC -->
    <rect x="15" y="95" width="200" height="40" fill="white" stroke="#BDC3C7" stroke-width="1" rx="3"/>
    <text x="25" y="115" font-size="12" fill="#7F8C8D">B vs C:</text>
    <circle cx="180" cy="110" r="15" fill="#27AE60"/>
    <text x="180" y="116" font-size="13" font-weight="bold" fill="white" text-anchor="middle">+1</text>
    
    <!-- Comparison 3: CA -->
    <rect x="15" y="145" width="200" height="40" fill="white" stroke="#BDC3C7" stroke-width="1" rx="3"/>
    <text x="25" y="165" font-size="12" fill="#7F8C8D">C vs A:</text>
    <circle cx="180" cy="160" r="15" fill="#27AE60"/>
    <text x="180" y="166" font-size="13" font-weight="bold" fill="white" text-anchor="middle">+1</text>
  </g>
  
  <!-- Similarity Analysis -->
  <text x="500" y="390" font-size="18" font-weight="bold" text-anchor="middle" fill="#2C3E50">
    Pairwise Similarity Analysis
  </text>
  
  <!-- Prof vs You -->
  <g transform="translate(50, 410)">
    <rect x="0" y="0" width="280" height="250" fill="#E8F8F5" stroke="#27AE60" stroke-width="2" rx="8"/>
    <text x="140" y="30" font-size="15" font-weight="bold" text-anchor="middle" fill="#2C3E50">Prof vs You</text>
    
    <!-- Agreement visualization -->
    <circle cx="50" cy="70" r="8" fill="#27AE60"/>
    <text x="70" y="75" font-size="12" fill="#2C3E50">A vs B: Both +1 ✓</text>
    
    <circle cx="50" cy="100" r="8" fill="#E74C3C"/>
    <text x="70" y="105" font-size="12" fill="#2C3E50">B vs C: +1 vs -1 ✗</text>
    
    <circle cx="50" cy="130" r="8" fill="#27AE60"/>
    <text x="70" y="135" font-size="12" fill="#2C3E50">C vs A: Both -1 ✓</text>
    
    <line x1="20" y1="155" x2="260" y2="155" stroke="#BDC3C7" stroke-width="1"/>
    
    <text x="140" y="180" font-size="13" fill="#2C3E50" text-anchor="middle" font-weight="bold">Agreement: 2/3</text>
    
    <rect x="40" y="195" width="200" height="40" fill="#27AE60" rx="5"/>
    <text x="140" y="218" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Similarity = +1/3</text>
    <text x="140" y="233" font-size="11" fill="white" text-anchor="middle">(Positive correlation)</text>
  </g>
  
  <!-- Prof vs Philip -->
  <g transform="translate(360, 410)">
    <rect x="0" y="0" width="280" height="250" fill="#FADBD8" stroke="#E74C3C" stroke-width="2" rx="8"/>
    <text x="140" y="30" font-size="15" font-weight="bold" text-anchor="middle" fill="#2C3E50">Prof vs Philip</text>
    
    <!-- Agreement visualization -->
    <circle cx="50" cy="70" r="8" fill="#E74C3C"/>
    <text x="70" y="75" font-size="12" fill="#2C3E50">A vs B: +1 vs -1 ✗</text>
    
    <circle cx="50" cy="100" r="8" fill="#27AE60"/>
    <text x="70" y="105" font-size="12" fill="#2C3E50">B vs C: Both +1 ✓</text>
    
    <circle cx="50" cy="130" r="8" fill="#E74C3C"/>
    <text x="70" y="135" font-size="12" fill="#2C3E50">C vs A: -1 vs +1 ✗</text>
    
    <line x1="20" y1="155" x2="260" y2="155" stroke="#BDC3C7" stroke-width="1"/>
    
    <text x="140" y="180" font-size="13" fill="#2C3E50" text-anchor="middle" font-weight="bold">Agreement: 1/3</text>
    
    <rect x="40" y="195" width="200" height="40" fill="#E74C3C" rx="5"/>
    <text x="140" y="218" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Similarity = -1/3</text>
    <text x="140" y="233" font-size="11" fill="white" text-anchor="middle">(Negative correlation)</text>
  </g>
  
  <!-- You vs Philip -->
  <g transform="translate(670, 410)">
    <rect x="0" y="0" width="280" height="250" fill="#FEF9E7" stroke="#F39C12" stroke-width="2" rx="8"/>
    <text x="140" y="30" font-size="15" font-weight="bold" text-anchor="middle" fill="#2C3E50">You vs Philip</text>
    
    <!-- Agreement visualization -->
    <circle cx="50" cy="70" r="8" fill="#E74C3C"/>
    <text x="70" y="75" font-size="12" fill="#2C3E50">A vs B: +1 vs -1 ✗</text>
    
    <circle cx="50" cy="100" r="8" fill="#E74C3C"/>
    <text x="70" y="105" font-size="12" fill="#2C3E50">B vs C: -1 vs +1 ✗</text>
    
    <circle cx="50" cy="130" r="8" fill="#E74C3C"/>
    <text x="70" y="135" font-size="12" fill="#2C3E50">C vs A: -1 vs +1 ✗</text>
    
    <line x1="20" y1="155" x2="260" y2="155" stroke="#BDC3C7" stroke-width="1"/>
    
    <text x="140" y="180" font-size="13" fill="#2C3E50" text-anchor="middle" font-weight="bold">Agreement: 0/3</text>
    
    <rect x="40" y="195" width="200" height="40" fill="#F39C12" rx="5"/>
    <text x="140" y="218" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Similarity = -1</text>
    <text x="140" y="233" font-size="11" fill="white" text-anchor="middle">(Complete disagreement)</text>
  </g>
</svg>