<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="600" y="40" font-size="28" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Gaussian Graphical Model: Weather Station Network
  </text>
  
  <!-- Background -->
  <rect x="50" y="70" width="1100" height="700" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2" rx="10"/>
  
  <!-- Legend -->
  <g transform="translate(80, 100)">
    <text x="0" y="0" font-size="20" font-weight="bold" fill="#495057">Edge Representation:</text>
    <line x1="10" y1="35" x2="80" y2="35" stroke="#2ecc71" stroke-width="8"/>
    <text x="90" y="42" font-size="16" fill="#495057">Strong Dependency (ρ ≥ 0.7)</text>
    <line x1="10" y1="65" x2="80" y2="65" stroke="#3498db" stroke-width="5"/>
    <text x="90" y="72" font-size="16" fill="#495057">Moderate Dependency (0.4 ≤ ρ &lt; 0.7)</text>
    <line x1="10" y1="95" x2="80" y2="95" stroke="#95a5a6" stroke-width="2"/>
    <text x="90" y="102" font-size="16" fill="#495057">Weak Dependency (ρ &lt; 0.4)</text>
  </g>
  
  <!-- Main Graph -->
  <g transform="translate(600, 400)">
    <!-- New York (Center hub) -->
    <circle cx="0" cy="0" r="45" fill="#e74c3c" stroke="#c0392b" stroke-width="3"/>
    <text x="0" y="-5" font-size="16" font-weight="bold" text-anchor="middle" fill="white">New</text>
    <text x="0" y="12" font-size="16" font-weight="bold" text-anchor="middle" fill="white">York</text>
    <text x="0" y="28" font-size="11" text-anchor="middle" fill="white">Central Hub</text>
    
    <!-- Boston (North East) -->
    <circle cx="180" cy="-120" r="38" fill="#3498db" stroke="#2980b9" stroke-width="3"/>
    <text x="180" y="-5" font-size="15" font-weight="bold" text-anchor="middle" fill="white">Boston</text>
    <text x="180" y="12" font-size="10" text-anchor="middle" fill="white">Wind: 15 mph</text>
    
    <!-- Washington DC (South) -->
    <circle cx="0" cy="160" r="38" fill="#3498db" stroke="#2980b9" stroke-width="3"/>
    <text x="0" y="155" font-size="15" font-weight="bold" text-anchor="middle" fill="white">Washington</text>
    <text x="0" y="172" font-size="10" text-anchor="middle" fill="white">Wind: 12 mph</text>
    
    <!-- Philadelphia (North East close) -->
    <circle cx="120" cy="-50" r="35" fill="#27ae60" stroke="#229954" stroke-width="3"/>
    <text x="120" y="-42" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Philly</text>
    <text x="120" y="-25" font-size="10" text-anchor="middle" fill="white">Wind: 14 mph</text>
    
    <!-- Baltimore (Between Philly and DC) -->
    <circle cx="60" cy="80" r="35" fill="#27ae60" stroke="#229954" stroke-width="3"/>
    <text x="60" y="77" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Baltimore</text>
    <text x="60" y="94" font-size="10" text-anchor="middle" fill="white">Wind: 13 mph</text>
    
    <!-- Chicago (West) -->
    <circle cx="-200" cy="-50" r="38" fill="#9b59b6" stroke="#8e44ad" stroke-width="3"/>
    <text x="-200" y="-42" font-size="15" font-weight="bold" text-anchor="middle" fill="white">Chicago</text>
    <text x="-200" y="-25" font-size="10" text-anchor="middle" fill="white">Wind: 18 mph</text>
    
    <!-- Pittsburgh (West) -->
    <circle cx="-140" cy="60" r="35" fill="#27ae60" stroke="#229954" stroke-width="3"/>
    <text x="-140" y="57" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Pittsburgh</text>
    <text x="-140" y="74" font-size="10" text-anchor="middle" fill="white">Wind: 16 mph</text>
    
    <!-- Toronto (North) -->
    <circle cx="-80" cy="-140" r="35" fill="#f39c12" stroke="#e67e22" stroke-width="3"/>
    <text x="-80" y="-132" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Toronto</text>
    <text x="-80" y="-115" font-size="10" text-anchor="middle" fill="white">Wind: 17 mph</text>
    
    <!-- Edges from New York (Strong connections) -->
    <!-- NY to Boston -->
    <line x1="32" y1="-32" x2="150" y2="-92" stroke="#2ecc71" stroke-width="8" opacity="0.7"/>
    <g transform="translate(90, -70)">
      <rect x="-22" y="-12" width="44" height="24" fill="white" stroke="#27ae60" stroke-width="2" rx="5"/>
      <text x="0" y="5" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">ρ=0.85</text>
    </g>
    
    <!-- NY to Washington DC -->
    <line x1="0" y1="45" x2="0" y2="122" stroke="#2ecc71" stroke-width="8" opacity="0.7"/>
    <g transform="translate(25, 85)">
      <rect x="-22" y="-12" width="44" height="24" fill="white" stroke="#27ae60" stroke-width="2" rx="5"/>
      <text x="0" y="5" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">ρ=0.78</text>
    </g>
    
    <!-- NY to Philadelphia -->
    <line x1="30" y1="-28" x2="93" y2="-43" stroke="#3498db" stroke-width="5" opacity="0.7"/>
    <g transform="translate(63, -38)">
      <rect x="-22" y="-12" width="44" height="24" fill="white" stroke="#3498db" stroke-width="2" rx="5"/>
      <text x="0" y="5" font-size="12" font-weight="bold" text-anchor="middle" fill="#3498db">ρ=0.65</text>
    </g>
    
    <!-- NY to Chicago -->
    <line x1="-38" y1="-28" x2="-165" y2="-43" stroke="#3498db" stroke-width="5" opacity="0.7"/>
    <g transform="translate(-105, -40)">
      <rect x="-22" y="-12" width="44" height="24" fill="white" stroke="#3498db" stroke-width="2" rx="5"/>
      <text x="0" y="5" font-size="12" font-weight="bold" text-anchor="middle" fill="#3498db">ρ=0.52</text>
    </g>
    
    <!-- Philadelphia to Boston (Moderate) -->
    <line x1="140" y1="-60" x2="165" y2="-100" stroke="#3498db" stroke-width="5" opacity="0.7"/>
    
    <!-- Boston to Toronto (Weak) -->
    <line x1="157" y1="-135" x2="-50" y2="-135" stroke="#95a5a6" stroke-width="2" opacity="0.5"/>
    
    <!-- Baltimore to Washington DC (Strong - local) -->
    <line x1="45" y1="110" x2="15" y2="135" stroke="#2ecc71" stroke-width="8" opacity="0.7"/>
    <g transform="translate(32, 122)">
      <rect x="-22" y="-12" width="44" height="24" fill="white" stroke="#27ae60" stroke-width="2" rx="5"/>
      <text x="0" y="5" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">ρ=0.92</text>
    </g>
    
    <!-- Baltimore to Philadelphia (Moderate) -->
    <line x1="78" y1="57" x2="98" y2="-20" stroke="#3498db" stroke-width="5" opacity="0.7"/>
    
    <!-- Chicago to Toronto (Moderate) -->
    <line x1="-175" y1="-70" x2="-100" y2="-120" stroke="#3498db" stroke-width="5" opacity="0.7"/>
    
    <!-- Pittsburgh to Chicago (Moderate) -->
    <line x1="-152" y1="42" x2="-182" y2="-22" stroke="#3498db" stroke-width="5" opacity="0.7"/>
    
    <!-- Pittsburgh to Baltimore (Weak) -->
    <line x1="-108" y1="72" x2="28" y2="77" stroke="#95a5a6" stroke-width="2" opacity="0.5"/>
    
    <!-- NO EDGE between Boston and Washington (conditional independence given NY) -->
    <!-- This is intentionally missing to show conditional independence -->
    
    <!-- Annotation showing no direct edge -->
    <path d="M 145,135 Q 90,80 100,-95" fill="none" stroke="#e74c3c" stroke-width="3" stroke-dasharray="10,5" opacity="0.5"/>
    <g transform="translate(95, 20)">
      <rect x="-55" y="-12" width="110" height="24" fill="#ffe5e5" stroke="#e74c3c" stroke-width="2" rx="5"/>
      <text x="0" y="5" font-size="11" font-weight="bold" text-anchor="middle" fill="#e74c3c">No Direct Edge</text>
    </g>
  </g>
  
  <!-- Conditional Independence Explanation -->
  <g transform="translate(80, 250)">
    <rect x="0" y="0" width="280" height="160" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" rx="8"/>
    <text x="140" y="25" font-size="16" font-weight="bold" text-anchor="middle" fill="#2e7d32">Conditional Independence</text>
    <text x="15" y="55" font-size="13" fill="#2e7d32">Boston ⊥ Washington | NY</text>
    <text x="15" y="80" font-size="12" fill="#2e7d32">Given wind speed in New York,</text>
    <text x="15" y="98" font-size="12" fill="#2e7d32">Washington provides no additional</text>
    <text x="15" y="116" font-size="12" fill="#2e7d32">information about Boston.</text>
    <text x="15" y="140" font-size="12" font-style="italic" fill="#2e7d32">This is the Markov property!</text>
  </g>
  
  <!-- Precision Matrix Info -->
  <g transform="translate(840, 250)">
    <rect x="0" y="0" width="280" height="160" fill="#fff3cd" stroke="#ffc107" stroke-width="2" rx="8"/>
    <text x="140" y="25" font-size="16" font-weight="bold" text-anchor="middle" fill="#856404">Precision Matrix Θ</text>
    <text x="15" y="55" font-size="13" fill="#856404">Θ = Σ⁻¹ (inverse covariance)</text>
    <text x="15" y="80" font-size="12" fill="#856404">Key Property:</text>
    <text x="15" y="100" font-size="12" fill="#856404">Θᵢⱼ = 0 ⟺ i ⊥ j | all others</text>
    <text x="15" y="125" font-size="11" fill="#856404">Non-zero entries reveal graph</text>
    <text x="15" y="143" font-size="11" fill="#856404">structure directly!</text>
  </g>
  
  <!-- Applications -->
  <g transform="translate(80, 650)">
    <rect x="0" y="0" width="1040" height="100" fill="#e3f2fd" stroke="#2196f3" stroke-width="2" rx="8"/>
    <text x="520" y="25" font-size="18" font-weight="bold" text-anchor="middle" fill="#1565c0">Applications of Gaussian Graphical Models</text>
    <text x="20" y="50" font-size="14" fill="#1565c0">• Meteorology: Wind speed, temperature forecasting across spatial networks</text>
    <text x="20" y="72" font-size="14" fill="#1565c0">• Finance: Stock correlations, portfolio dependencies, risk management</text>
    <text x="20" y="94" font-size="14" fill="#1565c0">• Biology: Gene expression networks, protein interactions, regulatory pathways</text>
  </g>
  
  <!-- Mathematical notation -->
  <g transform="translate(400, 585)">
    <text x="0" y="0" font-size="16" font-weight="bold" fill="#2c3e50">Multivariate Gaussian:</text>
    <text x="220" y="3" font-size="15" fill="#2c3e50">X ~ N(μ, Σ)</text>
  </g>
  
  <g transform="translate(400, 615)">
    <text x="0" y="0" font-size="16" font-weight="bold" fill="#2c3e50">Partial Correlation:</text>
    <text x="200" y="3" font-size="15" fill="#2c3e50">ρᵢⱼ|rest = -Θᵢⱼ / √(Θᵢᵢ Θⱼⱼ)</text>
  </g>
</svg>