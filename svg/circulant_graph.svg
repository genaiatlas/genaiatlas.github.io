<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="500" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" font-size="22" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Circulant Graph Structure
  </text>
  <text x="400" y="55" font-size="14" text-anchor="middle" fill="#7f8c8d">
    10 nodes, each connected to neighbors within distance d=2
  </text>
  
  <!-- Main circulant graph -->
  <g id="circulant">
    <!-- Circle guide (invisible) -->
    <circle cx="400" cy="270" r="150" fill="none" stroke="#bdc3c7" stroke-width="1" stroke-dasharray="5,5"/>
    
    <!-- Nodes positioned around circle -->
    <!-- Node 0 (top) -->
    <circle cx="400" cy="120" r="18" fill="#3498db" stroke="#2c3e50" stroke-width="2"/>
    <text x="400" y="127" font-size="13" font-weight="bold" text-anchor="middle" fill="white">0</text>
    
    <!-- Node 1 -->
    <circle cx="546.4" cy="157.5" r="18" fill="#3498db" stroke="#2c3e50" stroke-width="2"/>
    <text x="546.4" y="164.5" font-size="13" font-weight="bold" text-anchor="middle" fill="white">1</text>
    
    <!-- Node 2 -->
    <circle cx="611.8" cy="270" r="18" fill="#3498db" stroke="#2c3e50" stroke-width="2"/>
    <text x="611.8" y="277" font-size="13" font-weight="bold" text-anchor="middle" fill="white">2</text>
    
    <!-- Node 3 -->
    <circle cx="546.4" cy="382.5" r="18" fill="#3498db" stroke="#2c3e50" stroke-width="2"/>
    <text x="546.4" y="389.5" font-size="13" font-weight="bold" text-anchor="middle" fill="white">3</text>
    
    <!-- Node 4 -->
    <circle cx="400" cy="420" r="18" fill="#3498db" stroke="#2c3e50" stroke-width="2"/>
    <text x="400" y="427" font-size="13" font-weight="bold" text-anchor="middle" fill="white">4</text>
    
    <!-- Node 5 -->
    <circle cx="253.6" cy="382.5" r="18" fill="#3498db" stroke="#2c3e50" stroke-width="2"/>
    <text x="253.6" y="389.5" font-size="13" font-weight="bold" text-anchor="middle" fill="white">5</text>
    
    <!-- Node 6 -->
    <circle cx="188.2" cy="270" r="18" fill="#3498db" stroke="#2c3e50" stroke-width="2"/>
    <text x="188.2" y="277" font-size="13" font-weight="bold" text-anchor="middle" fill="white">6</text>
    
    <!-- Node 7 -->
    <circle cx="253.6" cy="157.5" r="18" fill="#3498db" stroke="#2c3e50" stroke-width="2"/>
    <text x="253.6" y="164.5" font-size="13" font-weight="bold" text-anchor="middle" fill="white">7</text>
    
    <!-- Node 8 -->
    <circle cx="329.1" cy="147.5" r="18" fill="#3498db" stroke="#2c3e50" stroke-width="2"/>
    <text x="329.1" y="154.5" font-size="13" font-weight="bold" text-anchor="middle" fill="white">8</text>
    
    <!-- Node 9 -->
    <circle cx="470.9" cy="147.5" r="18" fill="#3498db" stroke="#2c3e50" stroke-width="2"/>
    <text x="470.9" y="154.5" font-size="13" font-weight="bold" text-anchor="middle" fill="white">9</text>
    
    <!-- Edges - distance 1 (adjacent neighbors) -->
    <line x1="400" y1="120" x2="470.9" y2="147.5" stroke="#27ae60" stroke-width="2.5"/>
    <line x1="470.9" y1="147.5" x2="546.4" y2="157.5" stroke="#27ae60" stroke-width="2.5"/>
    <line x1="546.4" y1="157.5" x2="611.8" y2="270" stroke="#27ae60" stroke-width="2.5"/>
    <line x1="611.8" y1="270" x2="546.4" y2="382.5" stroke="#27ae60" stroke-width="2.5"/>
    <line x1="546.4" y1="382.5" x2="400" y2="420" stroke="#27ae60" stroke-width="2.5"/>
    <line x1="400" y1="420" x2="253.6" y2="382.5" stroke="#27ae60" stroke-width="2.5"/>
    <line x1="253.6" y1="382.5" x2="188.2" y2="270" stroke="#27ae60" stroke-width="2.5"/>
    <line x1="188.2" y1="270" x2="253.6" y2="157.5" stroke="#27ae60" stroke-width="2.5"/>
    <line x1="253.6" y1="157.5" x2="329.1" y2="147.5" stroke="#27ae60" stroke-width="2.5"/>
    <line x1="329.1" y1="147.5" x2="400" y2="120" stroke="#27ae60" stroke-width="2.5"/>
    
    <!-- Edges - distance 2 (skip one neighbor) -->
    <line x1="400" y1="120" x2="546.4" y2="157.5" stroke="#e74c3c" stroke-width="2"/>
    <line x1="546.4" y1="157.5" x2="611.8" y2="270" stroke="#e74c3c" stroke-width="2"/>
    <line x1="611.8" y1="270" x2="546.4" y2="382.5" stroke="#e74c3c" stroke-width="2"/>
    <line x1="546.4" y1="382.5" x2="400" y2="420" stroke="#e74c3c" stroke-width="2"/>
    <line x1="400" y1="420" x2="253.6" y2="382.5" stroke="#e74c3c" stroke-width="2"/>
    <line x1="253.6" y1="382.5" x2="188.2" y2="270" stroke="#e74c3c" stroke-width="2"/>
    <line x1="188.2" y1="270" x2="253.6" y2="157.5" stroke="#e74c3c" stroke-width="2"/>
    <line x1="253.6" y1="157.5" x2="400" y2="120" stroke="#e74c3c" stroke-width="2"/>
    <line x1="329.1" y1="147.5" x2="470.9" y2="147.5" stroke="#e74c3c" stroke-width="2"/>
    <line x1="470.9" y1="147.5" x2="611.8" y2="270" stroke="#e74c3c" stroke-width="2"/>
    
    <!-- Triangle highlight (showing high clustering) -->
    <path d="M 400,120 L 470.9,147.5 L 546.4,157.5 Z" 
          fill="#f39c12" fill-opacity="0.25" stroke="none"/>
    <text x="475" y="135" font-size="10" fill="#f39c12" font-weight="bold">Triangle</text>
    
    <!-- Radius annotation -->
    <line x1="400" y1="270" x2="400" y2="120" stroke="#9b59b6" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="410" y="200" font-size="11" fill="#9b59b6" font-weight="bold">Radius</text>
    
    <!-- Distance d annotation -->
    <path d="M 470.9,147.5 Q 480,140 490,145" 
          fill="none" stroke="#e67e22" stroke-width="2" marker-end="url(#arrowhead2)"/>
    <text x="500" y="145" font-size="11" fill="#e67e22" font-weight="bold">d=2 hops</text>
  </g>
  
  <!-- Properties Box -->
  <g id="properties">
    <rect x="50" y="95" width="250" height="140" fill="white" stroke="#34495e" stroke-width="2" rx="8"/>
    
    <text x="175" y="120" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Graph Properties
    </text>
    
    <circle cx="70" cy="145" r="5" fill="#27ae60"/>
    <text x="85" y="150" font-size="11" fill="#2c3e50">
      Distance 1 edges (10)
    </text>
    
    <circle cx="70" cy="165" r="5" fill="#e74c3c"/>
    <text x="85" y="170" font-size="11" fill="#2c3e50">
      Distance 2 edges (10)
    </text>
    
    <text x="70" y="190" font-size="11" fill="#2c3e50">
      • Degree of each node: 4
    </text>
    <text x="70" y="205" font-size="11" fill="#2c3e50">
      • High clustering (many triangles)
    </text>
    <text x="70" y="220" font-size="11" fill="#2c3e50">
      • Large diameter: ~n/(2d) ≈ 2.5
    </text>
  </g>
  
  <!-- Key Characteristics Box -->
  <g id="characteristics">
    <rect x="50" y="455" width="700" height="35" fill="#ecf0f1" stroke="#95a5a6" stroke-width="1" rx="5"/>
    
    <text x="400" y="475" font-size="12" text-anchor="middle" fill="#2c3e50">
      <tspan font-weight="bold">Circulant Graphs:</tspan> High clustering ✓ | Regular structure ✓ | 
      Small diameter ✗ | Power-law distribution ✗
    </text>
  </g>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead2" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e67e22"/>
    </marker>
  </defs>
</svg>