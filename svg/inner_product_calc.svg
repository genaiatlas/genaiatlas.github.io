      <text x="260" y="-5" text-anchor="middle" fill="#7F8C8D" font-size="10">3×2</text>
      
      <rect x="285" y="0" width="40" height="30" fill="#27AE60" rx="3" opacity="0.8" />
      <text x="305" y="20" text-anchor="middle" fill="white" font-size="12">4</text>
      <text x="305" y="-5" text-anchor="middle" fill="#7F8C8D" font-size="10">2×2</text>
      
      <rect x="330" y="0" width="40" height="30" fill="#27AE60" rx="3" opacity="0.8" />
