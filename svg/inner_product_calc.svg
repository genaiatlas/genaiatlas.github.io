  <!-- Interpretation Box -->
  <g transform="translate(100, 520)">
    <rect x="0" y="0" width="600" height="50" rx="5" fill="#ECF0F1" stroke="#BDC3C7" />
    <text x="300" y="20" text-anchor="middle" font-size="12" fill="#2C3E50" font-weight="bold">
      Interpretation
    </text>
    <text x="300" y="40" text-anchor="middle" font-size="11" fill="#34495E">
      Higher inner product → More similar users | Lower inner product → Less similar users
    </text>
  </g>
