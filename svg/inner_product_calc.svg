    <text x="275" y="40" text-anchor="middle" font-size="14" fill="#2C3E50">
      12 + 9 + 2 + 9 + 6 + 4 + 6 + 12 + 25 + 16 = 
    </text>
    <rect x="380" y="22" width="60" height="35" fill="#E74C3C" rx="3" />
    <text x="410" y="45" text-anchor="middle" fill="white" font-size="18" font-weight="bold">101</text>
    
    <text x="275" y="65" text-anchor="middle" font-size="12" fill="#7F8C8D">
