<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="500" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">Probability Distribution Classification</text>
  
  <!-- Main root box -->
  <rect x="300" y="80" width="200" height="60" fill="#3498db" stroke="#2980b9" stroke-width="2" rx="10"/>
  <text x="400" y="110" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Probability</text>
  <text x="400" y="130" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Distributions</text>
  
  <!-- Lines from root to main categories -->
  <line x1="350" y1="140" x2="200" y2="200" stroke="#34495e" stroke-width="3"/>
  <line x1="450" y1="140" x2="600" y2="200" stroke="#34495e" stroke-width="3"/>
  
  <!-- Discrete Distribution -->
  <rect x="100" y="200" width="200" height="60" fill="#e74c3c" stroke="#c0392b" stroke-width="2" rx="10"/>
  <text x="200" y="225" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Discrete</text>
  <text x="200" y="245" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Distributions</text>
  
  <!-- Continuous Distribution -->
  <rect x="500" y="200" width="200" height="60" fill="#27ae60" stroke="#229954" stroke-width="2" rx="10"/>
  <text x="600" y="225" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Continuous</text>
  <text x="600" y="245" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Distributions</text>
  
  <!-- Lines to examples -->
  <line x1="150" y1="260" x2="100" y2="320" stroke="#34495e" stroke-width="2"/>
  <line x1="200" y1="260" x2="200" y2="320" stroke="#34495e" stroke-width="2"/>
  <line x1="250" y1="260" x2="300" y2="320" stroke="#34495e" stroke-width="2"/>
  
  <line x1="550" y1="260" x2="500" y2="320" stroke="#34495e" stroke-width="2"/>
  <line x1="600" y1="260" x2="600" y2="320" stroke="#34495e" stroke-width="2"/>
  <line x1="650" y1="260" x2="700" y2="320" stroke="#34495e" stroke-width="2"/>
  
  <!-- Discrete examples -->
  <rect x="50" y="320" width="100" height="50" fill="#f39c12" stroke="#d68910" stroke-width="2" rx="5"/>
  <text x="100" y="340" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Binomial</text>
  <text x="100" y="355" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Distribution</text>
  
  <rect x="150" y="320" width="100" height="50" fill="#f39c12" stroke="#d68910" stroke-width="2" rx="5"/>
  <text x="200" y="340" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Poisson</text>
  <text x="200" y="355" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Distribution</text>
  
  <rect x="250" y="320" width="100" height="50" fill="#f39c12" stroke="#d68910" stroke-width="2" rx="5"/>
  <text x="300" y="340" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Geometric</text>
  <text x="300" y="355" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Distribution</text>
  
  <!-- Continuous examples -->
  <rect x="450" y="320" width="100" height="50" fill="#9b59b6" stroke="#8e44ad" stroke-width="2" rx="5"/>
  <text x="500" y="340" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Normal</text>
  <text x="500" y="355" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Distribution</text>
  
  <rect x="550" y="320" width="100" height="50" fill="#9b59b6" stroke="#8e44ad" stroke-width="2" rx="5"/>
  <text x="600" y="340" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Exponential</text>
  <text x="600" y="355" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Distribution</text>
  
  <rect x="650" y="320" width="100" height="50" fill="#9b59b6" stroke="#8e44ad" stroke-width="2" rx="5"/>
  <text x="700" y="340" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Uniform</text>
  <text x="700" y="355" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Distribution</text>
  
  <!-- Characteristics -->
  <text x="200" y="400" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50">Countable outcomes</text>
  <text x="200" y="420" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50">(e.g., number of successes)</text>
  
  <text x="600" y="400" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50">Uncountable outcomes</text>
  <text x="600" y="420" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2c3e50">(e.g., time, weight, height)</text>
</svg>