<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="trainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="validGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="resultGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <dropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="700" fill="#fafafa"/>
  
  <!-- Title -->
  <text x="500" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#1f2937">
    k-Fold Cross-Validation
  </text>
  
  <!-- Subtitle -->
  <text x="500" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">
    Model Assessment and Selection through Repeated Train/Validation Splits
  </text>

  <!-- Original Dataset -->
  <text x="50" y="95" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2937">
    Original Dataset (n observations)
  </text>
  
  <rect x="50" y="105" width="800" height="30" rx="4" fill="#e5e7eb" stroke="#9ca3af" stroke-width="2"/>
  <text x="450" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#374151">
    Randomly partition into k roughly equal folds
  </text>

  <!-- 5-Fold Cross-Validation Illustration -->
  <text x="50" y="170" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2937">
    5-Fold Cross-Validation Process
  </text>

  <!-- Fold 1 -->
  <g transform="translate(50, 190)">
    <text x="0" y="18" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#374151">
      Fold 1:
    </text>
    <rect x="60" y="0" width="140" height="25" rx="3" fill="url(#trainGrad)" stroke="#1d4ed8" stroke-width="1"/>
    <rect x="205" y="0" width="35" height="25" rx="3" fill="url(#validGrad)" stroke="#dc2626" stroke-width="1"/>
    <rect x="245" y="0" width="140" height="25" rx="3" fill="url(#trainGrad)" stroke="#1d4ed8" stroke-width="1"/>
    <rect x="390" y="0" width="140" height="25" rx="3" fill="url(#trainGrad)" stroke="#1d4ed8" stroke-width="1"/>
    <rect x="535" y="0" width="140" height="25" rx="3" fill="url(#trainGrad)" stroke="#1d4ed8" stroke-width="1"/>
    <text x="700" y="18" font-family="Arial, sans-serif" font-size="11" fill="#374151">
      CV₁ = MSE(y_val, ŷ_val)
    </text>
  </g>

  <!-- Fold 2 -->
  <g transform="translate(50, 230)">
    <text x="0" y="18" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#374151">
      Fold 2:
    </text>
    <rect x="60" y="0" width="35" height="25" rx="3" fill="url(#validGrad)" stroke="#dc2626" stroke-width="1"/>
    <rect x="100" y="0" width="140" height="25" rx="3" fill="url(#trainGrad)" stroke="#1d4ed8" stroke-width="1"/>
    <rect x="245" y="0" width="140" height="25" rx="3" fill="url(#trainGrad)" stroke="#1d4ed8" stroke-width="1"/>
    <rect x="390" y="0" width="140" height="25" rx="3" fill="url(#trainGrad)" stroke="#1d4ed8" stroke-width="1"/>
    <rect x="535" y="0" width="140" height="25" rx="3" fill="url(#trainGrad)" stroke="#1d4ed8" stroke-width="1"/>
    <text x="700" y="18" font-family="Arial, sans-serif" font-size="11" fill="#374151">
      CV₂ = MSE(y_val, ŷ_val)
    </text>
  </g>

  <!-- Fold 3 -->
  <g transform="translate(50, 270)">
    <text x="0" y="18" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#374151">
      Fold 3:
    </text>
    <rect x="60" y="0" width="140" height="25" rx="3" fill="url(#trainGrad)" stroke="#1d4ed8" stroke-width="1"/>
    <rect x="205" y="0" width="140" height="25" rx="3" fill="url(#trainGrad)" stroke="#1d4ed8" stroke-width="1"/>
    <rect x="350" y="0" width="35" height="25" rx="3" fill="url(#validGrad)" stroke="#dc2626" stroke-width="1"/>
    <rect x="390" y="0" width="140" height="25" rx="3" fill="url(#trainGrad)" stroke="#1d4ed8" stroke-width="1"/>
    <rect x="535" y="0" width="140" height="25" rx="3" fill="url(#trainGrad)" stroke="#1d4ed8" stroke-width="1"/>
    <text x="700" y="18" font-family="Arial, sans-serif" font-size="11" fill="#374151">
      CV₃ = MSE(y_val, ŷ_val)
    </text>
  </g>

  <!-- Fold 4 -->
  <g transform="translate(50, 310)">
    <text x="0" y="18" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#374151">
      Fold 4:
    </text>
    <rect x="60" y="0" width="140" height="25" rx="3" fill="url(#trainGrad)" stroke="#1d4ed8" stroke-width="1"/>
    <rect x="205" y="0" width="140" height="25" rx="3" fill="url(#trainGrad)" stroke="#1d4ed8" stroke-width="1"/>
    <rect x="350" y="0" width="140" height="25" rx="3" fill="url(#trainGrad)" stroke="#1d4ed8" stroke-width="1"/>
    <rect x="495" y="0" width="35" height="25" rx="3" fill="url(#validGrad)" stroke="#dc2626" stroke-width="1"/>
    <rect x="535" y="0" width="140" height="25" rx="3" fill="url(#trainGrad)" stroke="#1d4ed8" stroke-width="1"/>
    <text x="700" y="18" font-family="Arial, sans-serif" font-size="11" fill="#374151">
      CV₄ = MSE(y_val, ŷ_val)
    </text>
  </g>

  <!-- Fold 5 -->
  <g transform="translate(50, 350)">
    <text x="0" y="18" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#374151">
      Fold 5:
    </text>
    <rect x="60" y="0" width="140" height="25" rx="3" fill="url(#trainGrad)" stroke="#1d4ed8" stroke-width="1"/>
    <rect x="205" y="0" width="140" height="25" rx="3" fill="url(#trainGrad)" stroke="#1d4ed8" stroke-width="1"/>
    <rect x="350" y="0" width="140" height="25" rx="3" fill="url(#trainGrad)" stroke="#1d4ed8" stroke-width="1"/>
    <rect x="495" y="0" width="140" height="25" rx="3" fill="url(#trainGrad)" stroke="#1d4ed8" stroke-width="1"/>
    <rect x="640" y="0" width="35" height="25" rx="3" fill="url(#validGrad)" stroke="#dc2626" stroke-width="1"/>
    <text x="700" y="18" font-family="Arial, sans-serif" font-size="11" fill="#374151">
      CV₅ = MSE(y_val, ŷ_val)
    </text>
  </g>

  <!-- Legend -->
  <g transform="translate(50, 390)">
    <rect x="0" y="0" width="25" height="15" rx="2" fill="url(#trainGrad)"/>
    <text x="35" y="12" font-family="Arial, sans-serif" font-size="12" fill="#374151">
      Training Data (4/5 of dataset)
    </text>
    <rect x="200" y="0" width="25" height="15" rx="2" fill="url(#validGrad)"/>
    <text x="235" y="12" font-family="Arial, sans-serif" font-size="12" fill="#374151">
      Validation Data (1/5 of dataset)
    </text>
  </g>

  <!-- Final CV Score -->
  <rect x="50" y="430" width="600" height="50" rx="8" fill="url(#resultGrad)" filter="url(#shadow)"/>
  <text x="350" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    Final Cross-Validation Score
  </text>
  <text x="350" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
    CV(k) = (1/k) Σᵢ₌₁ᵏ CVᵢ = (CV₁ + CV₂ + CV₃ + CV₄ + CV₅) / 5
  </text>

  <!-- CV Types Comparison -->
  <g transform="translate(680, 180)">
    <rect x="0" y="0" width="300" height="300" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <text x="150" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2937">
      CV Variations
    </text>
    
    <!-- LOOCV -->
    <rect x="20" y="40" width="260" height="50" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
    <text x="30" y="55" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#92400e">
      Leave-One-Out CV (LOOCV)
    </text>
    <text x="30" y="70" font-family="Arial, sans-serif" font-size="10" fill="#92400e">
      k = n, each fold has 1 observation
    </text>
    <text x="30" y="82" font-family="Arial, sans-serif" font-size="10" fill="#92400e">
      Maximum training data, high variance
    </text>
    
    <!-- k-fold -->
    <rect x="20" y="100" width="260" height="50" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
    <text x="30" y="115" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e40af">
      k-Fold CV (k = 5, 10)
    </text>
    <text x="30" y="130" font-family="Arial, sans-serif" font-size="10" fill="#1e40af">
      Good bias-variance tradeoff
    </text>
    <text x="30" y="142" font-family="Arial, sans-serif" font-size="10" fill="#1e40af">
      Computational efficiency
    </text>
    
    <!-- Stratified -->
    <rect x="20" y="160" width="260" height="50" rx="4" fill="#dcfce7" stroke="#10b981" stroke-width="1"/>
    <text x="30" y="175" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#047857">
      Stratified CV
    </text>
    <text x="30" y="190" font-family="Arial, sans-serif" font-size="10" fill="#047857">
      Preserve class proportions
    </text>
    <text x="30" y="202" font-family="Arial, sans-serif" font-size="10" fill="#047857">
      For classification problems
    </text>
    
    <!-- Time Series -->
    <rect x="20" y="220" width="260" height="70" rx="4" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
    <text x="30" y="235" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#dc2626">
      Time Series CV (Walk-Forward)
    </text>
    <text x="30" y="250" font-family="Arial, sans-serif" font-size="10" fill="#dc2626">
      Fold 1: Train[1...t₁] → Test[t₁+1...t₁+h]
    </text>
    <text x="30" y="262" font-family="Arial, sans-serif" font-size="10" fill="#dc2626">
      Fold 2: Train[1...t₂] → Test[t₂+1...t₂+h]
    </text>
    <text x="30" y="274" font-family="Arial, sans-serif" font-size="10" fill="#dc2626">
      No random sampling - respect temporal order
    </text>
    <text x="30" y="286" font-family="Arial, sans-serif" font-size="10" fill="#dc2626">
      Expanding or sliding window approaches
    </text>
  </g>

  <!-- Model Selection Process -->
  <rect x="50" y="510" width="400" height="150" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="250" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#92400e">
    Model Selection Process
  </text>
  <text x="70" y="560" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#92400e">
    1. Define model candidates:
  </text>
  <text x="80" y="575" font-family="Arial, sans-serif" font-size="11" fill="#92400e">
    Different algorithms, hyperparameters
  </text>
  <text x="70" y="595" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#92400e">
    2. Apply k-fold CV to each:
  </text>
  <text x="80" y="610" font-family="Arial, sans-serif" font-size="11" fill="#92400e">
    Estimate generalization error CV(k)
  </text>
  <text x="70" y="630" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#92400e">
    3. Select best model:
  </text>
  <text x="80" y="645" font-family="Arial, sans-serif" font-size="11" fill="#92400e">
    Minimum CV error + refit on full dataset
  </text>

  <!-- Bias-Variance Properties -->
  <rect x="480" y="510" width="470" height="150" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="715" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#047857">
    Bias-Variance Properties
  </text>
  <text x="500" y="560" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#047857">
    Training Set Size Effect:
  </text>
  <text x="500" y="580" font-family="Arial, sans-serif" font-size="11" fill="#047857">
    • Larger training sets → Lower bias, higher computation
  </text>
  <text x="500" y="595" font-family="Arial, sans-serif" font-size="11" fill="#047857">
    • Smaller training sets → Higher bias, lower computation
  </text>
  <text x="500" y="615" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#047857">
    Number of Folds Trade-off:
  </text>
  <text x="500" y="635" font-family="Arial, sans-serif" font-size="11" fill="#047857">
    • More folds (↑k) → Lower bias, higher variance
  </text>
  <text x="500" y="650" font-family="Arial, sans-serif" font-size="11" fill="#047857">
    • Fewer folds (↓k) → Higher bias, lower variance
  </text>

  <!-- Mathematical Foundation -->
  <rect x="50" y="680" width="900" height="15" rx="4" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="500" y="692" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#374151">
    CV Error Estimate: E[L(Y,f̂(X))] ≈ (1/k)Σᵢ₌₁ᵏ L(yᵢ,f̂⁻ⁱ(xᵢ)) | One SE Rule: Select simplest model within 1 SE of minimum
  </text>

</svg>