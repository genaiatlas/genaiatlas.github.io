<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="300" viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
    <!-- Coordinate axis -->
    <line x1="100" y1="150" x2="700" y2="150" stroke="black" stroke-width="2"/>
    
    <!-- Arrow at end of axis -->
    <polygon points="700,150 690,145 690,155" fill="black"/>
    
    <!-- Zero point marker -->
    <line x1="550" y1="140" x2="550" y2="160" stroke="black" stroke-width="2"/>
    <circle cx="550" cy="150" r="5" fill="black"/>
    <text x="550" y="175" font-family="Arial" font-size="16" text-anchor="middle">0</text>
    
    <!-- Confidence interval -->
    <line x1="300" y1="150" x2="450" y2="150" stroke="#FF5370" stroke-width="6"/>
    
    <!-- Confidence interval endpoints -->
    <line x1="300" y1="140" x2="300" y2="160" stroke="#FF5370" stroke-width="2"/>
    <line x1="450" y1="140" x2="450" y2="160" stroke="#FF5370" stroke-width="2"/>
    
    <!-- Theta hat marker -->
    <circle cx="375" cy="150" r="5" fill="#4B6CB7"/>
    <text x="375" y="130" font-family="Arial" font-size="16" text-anchor="middle">θ̂j</text>
    
    <!-- Decision label -->
    <text x="400" y="220" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">reject the null</text>
    <text x="400" y="250" font-family="Arial" font-size="16" text-anchor="middle" font-style="italic">(confidence interval doesn't contain 0)</text>
    
    <!-- Title -->
    <text x="400" y="50" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">Wald Test - Rejecting the Null Hypothesis</text>
</svg>