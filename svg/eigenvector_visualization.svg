<svg viewBox="0 0 800 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #2c3e50; }
      .subtitle { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #34495e; }
      .text { font-family: Arial, sans-serif; font-size: 12px; fill: #2c3e50; }
      .math-text { font-family: 'Courier New', monospace; font-size: 14px; fill: #2c3e50; }
      .grid-line { stroke: #ecf0f1; stroke-width: 0.5; }
      .axis { stroke: #95a5a6; stroke-width: 1; }
      .axis-label { font-family: Arial, sans-serif; font-size: 11px; fill: #7f8c8d; }
      .original-vector { stroke: #3498db; stroke-width: 3; fill: none; marker-end: url(#bluearrow); }
      .transformed-vector { stroke: #e74c3c; stroke-width: 3; fill: none; marker-end: url(#redarrow); }
      .eigenvector { stroke: #27ae60; stroke-width: 4; fill: none; marker-end: url(#greenarrow); }
      .eigenvector-transformed { stroke: #16a085; stroke-width: 4; fill: none; marker-end: url(#tealarrow); stroke-dasharray: 5,5; }
      .matrix-box { fill: #f8f9fa; stroke: #6c757d; stroke-width: 1; }
      .equation-box { fill: #e8f4fd; stroke: #3498db; stroke-width: 2; }
    </style>
    <marker id="bluearrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3498db" />
    </marker>
    <marker id="redarrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c" />
    </marker>
    <marker id="greenarrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#27ae60" />
    </marker>
    <marker id="tealarrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a085" />
    </marker>
  </defs>

  <text x="400" y="25" class="title" text-anchor="middle">Eigenvectors and Eigenvalues: Linear Transformation</text>

  <!-- Grid and Coordinate System -->
  <g transform="translate(150, 150)">
    <!-- Grid lines -->
    <g opacity="0.3">
      <line x1="0" y1="0" x2="300" y2="0" class="grid-line"/>
      <line x1="0" y1="60" x2="300" y2="60" class="grid-line"/>
      <line x1="0" y1="120" x2="300" y2="120" class="grid-line"/>
      <line x1="0" y1="180" x2="300" y2="180" class="grid-line"/>
      <line x1="0" y1="-60" x2="300" y2="-60" class="grid-line"/>
      <line x1="0" y1="-120" x2="300" y2="-120" class="grid-line"/>
      <line x1="60" y1="-120" x2="60" y2="180" class="grid-line"/>
      <line x1="120" y1="-120" x2="120" y2="180" class="grid-line"/>
      <line x1="180" y1="-120" x2="180" y2="180" class="grid-line"/>
      <line x1="240" y1="-120" x2="240" y2="180" class="grid-line"/>
      <line x1="300" y1="-120" x2="300" y2="180" class="grid-line"/>
    </g>

    <!-- Axes -->
    <line x1="0" y1="-120" x2="0" y2="180" class="axis"/>
    <line x1="-20" y1="0" x2="320" y2="0" class="axis"/>
    
    <!-- Axis labels -->
    <text x="310" y="5" class="axis-label">x</text>
    <text x="-15" y="-110" class="axis-label">y</text>
    <text x="-10" y="5" class="axis-label">0</text>

    <!-- Regular vector transformation -->
    <text x="20" y="-140" class="subtitle">Regular Vector Transformation</text>
    
    <!-- Original vector -->
    <line x1="0" y1="0" x2="120" y2="60" class="original-vector"/>
    <text x="125" y="65" class="text" fill="#3498db">v = [2, 1]</text>
    
    <!-- Transformed vector -->
    <line x1="0" y1="0" x2="120" y2="120" class="transformed-vector"/>
    <text x="125" y="125" class="text" fill="#e74c3c">Av = [4, 4]</text>
    
    <!-- Eigenvector example -->
    <text x="20" y="210" class="subtitle">Eigenvector (Direction Preserved)</text>
    
    <!-- Original eigenvector -->
    <line x1="0" y1="0" x2="120" y2="120" class="eigenvector"/>
    <text x="125" y="140" class="text" fill="#27ae60">eigenvector = [1, 1]</text>
    
    <!-- Transformed eigenvector (scaled) -->
    <line x1="0" y1="0" x2="180" y2="180" class="eigenvector-transformed"/>
    <text x="185" y="185" class="text" fill="#16a085">A×eigenvector = 3×[1, 1]</text>
    <text x="185" y="200" class="text" fill="#16a085">λ = 3 (eigenvalue)</text>
  </g>

  <!-- Transformation Matrix -->
  <g transform="translate(500, 80)">
    <rect x="-10" y="-10" width="150" height="80" class="matrix-box" rx="5"/>
    <text x="10" y="0" class="subtitle">Transformation Matrix A</text>
    <text x="40" y="25" class="math-text">⎡2  1⎤</text>
    <text x="10" y="30" class="math-text">A =</text>
    <text x="40" y="45" class="math-text">⎣1  2⎦</text>
  </g>

  <!-- Mathematical Equation -->
  <g transform="translate(50, 420)">
    <rect x="-10" y="-10" width="700" height="120" class="equation-box" rx="5"/>
    <text x="10" y="10" class="subtitle">Eigenvector Equation: Av = λv</text>
    
    <text x="20" y="35" class="text">Where:</text>
    <text x="30" y="50" class="text">• A = transformation matrix</text>
    <text x="30" y="65" class="text">• v = eigenvector (direction doesn't change)</text>
    <text x="30" y="80" class="text">• λ (lambda) = eigenvalue (scaling factor)</text>
    <text x="30" y="95" class="text">• The eigenvector only gets scaled by λ, not rotated</text>
  </g>

  <!-- Eigenvalue Calculation -->
  <g transform="translate(50, 560)">
    <text x="0" y="0" class="subtitle">Finding Eigenvalues: det(A - λI) = 0</text>
    
    <g transform="translate(0, 20)">
      <text x="0" y="15" class="math-text">det(⎡2-λ   1  ⎤) = 0</text>
      <text x="35" y="30" class="math-text">⎣ 1   2-λ⎦</text>
      
      <text x="200" y="22" class="math-text">(2-λ)(2-λ) - 1×1 = 0</text>
      
      <text x="0" y="60" class="math-text">λ² - 4λ + 3 = 0</text>
      <text x="200" y="60" class="math-text">(λ-1)(λ-3) = 0</text>
      
      <text x="0" y="90" class="text" fill="#e74c3c">Eigenvalues: λ₁ = 1, λ₂ = 3</text>
      <text x="250" y="90" class="text" fill="#27ae60">Corresponding eigenvectors: [1,-1], [1,1]</text>
    </g>
  </g>
</svg>