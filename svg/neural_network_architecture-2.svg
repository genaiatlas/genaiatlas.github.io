<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <dropShadow dx="2" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="#f8f9fa"/>
  
  <!-- Layer backgrounds -->
  <rect x="50" y="50" width="120" height="300" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="10" opacity="0.3"/>
  <rect x="340" y="50" width="120" height="300" fill="#e8f5e8" stroke="#4caf50" stroke-width="2" rx="10" opacity="0.3"/>
  <rect x="630" y="50" width="120" height="300" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="10" opacity="0.3"/>
  
  <!-- Input Layer -->
  <text x="110" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1976d2">Input Layer</text>
  
  <!-- Input neurons -->
  <circle cx="110" cy="140" r="25" fill="#2196f3" stroke="#1565c0" stroke-width="3" filter="url(#shadow)"/>
  <text x="110" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">x₁</text>
  
  <circle cx="110" cy="260" r="25" fill="#2196f3" stroke="#1565c0" stroke-width="3" filter="url(#shadow)"/>
  <text x="110" y="266" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">x₂</text>
  
  <!-- Hidden Layer -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4caf50">Hidden Layer</text>
  <text x="400" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#4caf50">New Encoding</text>
  <text x="400" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#4caf50">(Representation)</text>
  
  <!-- Hidden neurons -->
  <circle cx="400" cy="120" r="30" fill="#4caf50" stroke="#2e7d32" stroke-width="3" filter="url(#shadow)"/>
  <text x="385" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">z₁</text>
  <text x="415" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">f₁(z₁)</text>
  
  <circle cx="400" cy="280" r="30" fill="#4caf50" stroke="#2e7d32" stroke-width="3" filter="url(#shadow)"/>
  <text x="385" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">z₂</text>
  <text x="415" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">f₂(z₂)</text>
  
  <!-- Output Layer -->
  <text x="690" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ff9800">Output Layer</text>
  
  <!-- Output neuron -->
  <circle cx="690" cy="200" r="30" fill="#ff9800" stroke="#f57c00" stroke-width="3" filter="url(#shadow)"/>
  <text x="690" y="206" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">f(z)</text>
  
  <!-- Connections with weights -->
  <!-- x1 to z1 -->
  <line x1="135" y1="140" x2="370" y2="120" stroke="#666" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="220" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">w₁₁</text>
  
  <!-- x1 to z2 -->
  <line x1="135" y1="140" x2="370" y2="280" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="220" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">w₁₂</text>
  
  <!-- x2 to z1 -->
  <line x1="135" y1="260" x2="370" y2="120" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="280" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">w₂₁</text>
  
  <!-- x2 to z2 -->
  <line x1="135" y1="260" x2="370" y2="280" stroke="#666" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="280" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">w₂₂</text>
  
  <!-- Hidden to output -->
  <line x1="430" y1="120" x2="660" y2="200" stroke="#666" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line x1="430" y1="280" x2="660" y2="200" stroke="#666" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Mathematical equations -->
  <text x="400" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">Z₁ = X₁ × W₁₁ + X₂ × W₂₁</text>
  <text x="400" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">Z₂ = X₁ × W₁₂ + X₂ × W₂₂</text>
  
  <!-- Title -->
  <text x="400" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#333">Neural Network Architecture: One Hidden Layer with Two Neurons</text>
</svg>