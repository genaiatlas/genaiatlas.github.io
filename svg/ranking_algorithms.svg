<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="1000" height="600" fill="#f8f9fa"/>
  <text x="500" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Ranking Algorithms Comparison
  </text>
  
  <!-- Algorithm 1: BM25 -->
  <rect x="50" y="70" width="280" height="220" rx="8" fill="white" stroke="#e74c3c" stroke-width="3"/>
  <rect x="50" y="70" width="280" height="45" rx="8" fill="#e74c3c"/>
  <text x="190" y="98" font-size="15" font-weight="bold" text-anchor="middle" fill="white">BM25 Algorithm</text>
  
  <g transform="translate(60, 130)">
    <text x="0" y="0" font-size="12" font-weight="bold" fill="#1a1a1a">Formula:</text>
    <text x="0" y="18" font-size="9" fill="#666">score = IDF(q_i) * (f * (k1 + 1))</text>
    <text x="80" y="32" font-size="9" fill="#666">/ (f + k1 * (1 - b + b * |D|/avgdl))</text>
    
    <text x="0" y="55" font-size="11" font-weight="bold" fill="#27ae60">Strengths:</text>
    <text x="0" y="70" font-size="9" fill="#555">• Fast (1-5ms)</text>
    <text x="0" y="83" font-size="9" fill="#555">• No training needed</text>
    <text x="0" y="96" font-size="9" fill="#555">• Excellent for keywords</text>
    
    <text x="0" y="118" font-size="11" font-weight="bold" fill="#e74c3c">Limitations:</text>
    <text x="0" y="133" font-size="9" fill="#555">• No semantic understanding</text>
    <text x="0" y="146" font-size="9" fill="#555">• Exact term matching only</text>
    <text x="0" y="159" font-size="9" fill="#555">• Vocabulary mismatch issues</text>
  </g>
  
  <!-- Algorithm 2: Vector Similarity -->
  <rect x="360" y="70" width="280" height="220" rx="8" fill="white" stroke="#3498db" stroke-width="3"/>
  <rect x="360" y="70" width="280" height="45" rx="8" fill="#3498db"/>
  <text x="500" y="98" font-size="15" font-weight="bold" text-anchor="middle" fill="white">Vector Similarity</text>
  
  <g transform="translate(370, 130)">
    <text x="0" y="0" font-size="12" font-weight="bold" fill="#1a1a1a">Formula:</text>
    <text x="0" y="18" font-size="9" fill="#666">similarity = cos(theta) = (A dot B) / (||A|| * ||B||)</text>
    <text x="0" y="32" font-size="9" fill="#666">= sum(A_i * B_i) / (sqrt sum A_i^2 * sqrt sum B_i^2)</text>
    
    <text x="0" y="55" font-size="11" font-weight="bold" fill="#27ae60">Strengths:</text>
    <text x="0" y="70" font-size="9" fill="#555">• Semantic understanding</text>
    <text x="0" y="83" font-size="9" fill="#555">• Handles synonyms</text>
    <text x="0" y="96" font-size="9" fill="#555">• Cross-lingual capabilities</text>
    
    <text x="0" y="118" font-size="11" font-weight="bold" fill="#e74c3c">Limitations:</text>
    <text x="0" y="133" font-size="9" fill="#555">• Slower (10-50ms)</text>
    <text x="0" y="146" font-size="9" fill="#555">• Misses exact keywords</text>
    <text x="0" y="159" font-size="9" fill="#555">• Requires embeddings</text>
  </g>
  
  <!-- Algorithm 3: Cross-Encoder -->
  <rect x="670" y="70" width="280" height="220" rx="8" fill="white" stroke="#9b59b6" stroke-width="3"/>
  <rect x="670" y="70" width="280" height="45" rx="8" fill="#9b59b6"/>
  <text x="810" y="98" font-size="15" font-weight="bold" text-anchor="middle" fill="white">Cross-Encoder</text>
  
  <g transform="translate(680, 130)">
    <text x="0" y="0" font-size="12" font-weight="bold" fill="#1a1a1a">Architecture:</text>
    <text x="0" y="18" font-size="9" fill="#666">[CLS] query [SEP] doc [SEP]</text>
    <text x="0" y="32" font-size="9" fill="#666">BERT then Classification then Score</text>
    
    <text x="0" y="55" font-size="11" font-weight="bold" fill="#27ae60">Strengths:</text>
    <text x="0" y="70" font-size="9" fill="#555">• Highest accuracy</text>
    <text x="0" y="83" font-size="9" fill="#555">• Deep interaction</text>
    <text x="0" y="96" font-size="9" fill="#555">• Contextual matching</text>
    
    <text x="0" y="118" font-size="11" font-weight="bold" fill="#e74c3c">Limitations:</text>
    <text x="0" y="133" font-size="9" fill="#555">• Very slow (100-500ms)</text>
    <text x="0" y="146" font-size="9" fill="#555">• Not scalable alone</text>
    <text x="0" y="159" font-size="9" fill="#555">• Requires GPU</text>
  </g>
  
  <!-- Performance Comparison Chart -->
  <rect x="50" y="320" width="900" height="230" rx="8" fill="white" stroke="#ddd" stroke-width="2"/>
  <text x="500" y="350" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Performance Metrics Comparison
  </text>
  
  <!-- Metric bars -->
  <g transform="translate(100, 380)">
    <!-- Accuracy -->
    <text x="-50" y="20" font-size="11" font-weight="bold" fill="#666">Accuracy</text>
    <rect x="0" y="5" width="220" height="25" rx="4" fill="#e74c3c"/>
    <text x="230" y="22" font-size="10" fill="#666">75% - BM25</text>
    
    <rect x="0" y="35" width="280" height="25" rx="4" fill="#3498db"/>
    <text x="290" y="52" font-size="10" fill="#666">85% - Vector</text>
    
    <rect x="0" y="65" width="340" height="25" rx="4" fill="#9b59b6"/>
    <text x="350" y="82" font-size="10" fill="#666">95% - Cross-Encoder</text>
    
    <!-- Speed (inverted - lower is better) -->
    <text x="-50" y="125" font-size="11" font-weight="bold" fill="#666">Speed</text>
    <rect x="0" y="110" width="40" height="25" rx="4" fill="#e74c3c"/>
    <text x="50" y="127" font-size="10" fill="#666">5ms - BM25</text>
    
    <rect x="0" y="140" width="100" height="25" rx="4" fill="#3498db"/>
    <text x="110" y="157" font-size="10" fill="#666">30ms - Vector</text>
    
    <rect x="0" y="170" width="300" height="25" rx="4" fill="#9b59b6"/>
    <text x="310" y="187" font-size="10" fill="#666">200ms - Cross-Encoder</text>
  </g>
  
  <!-- Legend -->
  <g transform="translate(650, 380)">
    <text x="0" y="0" font-size="12" font-weight="bold" fill="#1a1a1a">Best Use Cases</text>
    
    <circle cx="5" cy="20" r="4" fill="#e74c3c"/>
    <text x="15" y="24" font-size="10" fill="#666">BM25: Keyword search, speed critical</text>
    
    <circle cx="5" cy="40" r="4" fill="#3498db"/>
    <text x="15" y="44" font-size="10" fill="#666">Vector: Semantic search, multilingual</text>
    
    <circle cx="5" cy="60" r="4" fill="#9b59b6"/>
    <text x="15" y="64" font-size="10" fill="#666">Cross-Encoder: Re-ranking top results</text>
    
    <rect x="-5" y="80" width="240" height="90" rx="4" fill="#f8f9fa" stroke="#ddd"/>
    <text x="115" y="100" font-size="11" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Recommendation</text>
    <text x="5" y="118" font-size="9" fill="#555">Use hybrid approach:</text>
    <text x="5" y="132" font-size="9" fill="#555">1. BM25 + Vector (broad search)</text>
    <text x="5" y="146" font-size="9" fill="#555">2. Cross-Encoder (re-rank top 20)</text>
    <text x="5" y="160" font-size="9" fill="#555">Best balance of speed and accuracy</text>
  </g>
</svg>