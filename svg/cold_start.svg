<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="coldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5DADE2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2874A6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="warmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F39C12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E67E22;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="3" dy="3" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
    <pattern id="stripes" patternUnits="userSpaceOnUse" width="10" height="10">
      <line x1="0" y1="0" x2="10" y2="10" stroke="#ddd" stroke-width="2"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="700" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#2c3e50">
    The Cold Start Problem
  </text>
  
  <!-- Three Scenarios -->
  
  <!-- New User Problem -->
  <g transform="translate(100, 100)">
    <rect x="0" y="0" width="320" height="200" rx="15" fill="white" stroke="#3498db" stroke-width="2" filter="url(#shadow)"/>
    <text x="160" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#2c3e50">New User Problem</text>
    
    <!-- New User Icon -->
    <circle cx="80" cy="100" r="40" fill="url(#coldGrad)" filter="url(#shadow)"/>
    <text x="80" y="105" text-anchor="middle" font-size="24" fill="white">?</text>
    <text x="80" y="160" text-anchor="middle" font-size="12" fill="#34495e">No History</text>
    
    <!-- Arrow -->
    <path d="M 130 100 L 180 100" stroke="#95a5a6" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="5,5"/>
    
    <!-- Empty Recommendations -->
    <g transform="translate(200, 70)">
      <rect x="0" y="0" width="80" height="25" rx="5" fill="#ecf0f1" stroke="#95a5a6" stroke-dasharray="3,3"/>
      <text x="40" y="17" text-anchor="middle" font-size="11" fill="#95a5a6">No Recs</text>
    </g>
    <g transform="translate(200, 100)">
      <rect x="0" y="0" width="80" height="25" rx="5" fill="#ecf0f1" stroke="#95a5a6" stroke-dasharray="3,3"/>
      <text x="40" y="17" text-anchor="middle" font-size="11" fill="#95a5a6">No Recs</text>
    </g>
    <g transform="translate(200, 130)">
      <rect x="0" y="0" width="80" height="25" rx="5" fill="#ecf0f1" stroke="#95a5a6" stroke-dasharray="3,3"/>
      <text x="40" y="17" text-anchor="middle" font-size="11" fill="#95a5a6">No Recs</text>
    </g>
  </g>
  
  <!-- New Item Problem -->
  <g transform="translate(440, 100)">
    <rect x="0" y="0" width="320" height="200" rx="15" fill="white" stroke="#e74c3c" stroke-width="2" filter="url(#shadow)"/>
    <text x="160" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#2c3e50">New Item Problem</text>
    
    <!-- New Item Icon -->
    <rect x="40" y="70" width="80" height="80" rx="10" fill="url(#coldGrad)" filter="url(#shadow)"/>
    <text x="80" y="115" text-anchor="middle" font-size="24" fill="white">NEW</text>
    <text x="80" y="170" text-anchor="middle" font-size="12" fill="#34495e">No Ratings</text>
    
    <!-- Arrow -->
    <path d="M 130 110 L 180 110" stroke="#95a5a6" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="5,5"/>
    
    <!-- No Users -->
    <g transform="translate(200, 80)">
      <circle cx="20" cy="20" r="15" fill="#ecf0f1" stroke="#95a5a6" stroke-dasharray="3,3"/>
      <text x="20" y="25" text-anchor="middle" font-size="10" fill="#95a5a6">?</text>
    </g>
    <g transform="translate(240, 80)">
      <circle cx="20" cy="20" r="15" fill="#ecf0f1" stroke="#95a5a6" stroke-dasharray="3,3"/>
      <text x="20" y="25" text-anchor="middle" font-size="10" fill="#95a5a6">?</text>
    </g>
    <g transform="translate(220, 120)">
      <circle cx="20" cy="20" r="15" fill="#ecf0f1" stroke="#95a5a6" stroke-dasharray="3,3"/>
      <text x="20" y="25" text-anchor="middle" font-size="10" fill="#95a5a6">?</text>
    </g>
    <text x="230" y="180" text-anchor="middle" font-size="11" fill="#95a5a6">No Users Found</text>
  </g>
  
  <!-- System Bootstrap -->
  <g transform="translate(780, 100)">
    <rect x="0" y="0" width="320" height="200" rx="15" fill="white" stroke="#9b59b6" stroke-width="2" filter="url(#shadow)"/>
    <text x="160" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#2c3e50">System Bootstrap</text>
    
    <!-- Empty System -->
    <rect x="60" y="70" width="200" height="100" rx="10" fill="url(#stripes)" stroke="#95a5a6" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="160" y="120" text-anchor="middle" font-size="18" fill="#95a5a6">Empty Database</text>
    <text x="160" y="145" text-anchor="middle" font-size="14" fill="#95a5a6">No Data Available</text>
  </g>
  
  <!-- Solutions Section -->
  <g transform="translate(100, 350)">
    <text x="500" y="0" text-anchor="middle" font-size="24" font-weight="bold" fill="#2c3e50">Cold Start Solutions</text>
    
    <!-- Solution Cards -->
    <g transform="translate(0, 40)">
      <!-- Hybrid Approach -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="220" height="150" rx="10" fill="url(#warmGrad)" filter="url(#shadow)"/>
        <text x="110" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="white">Hybrid Approach</text>
        <text x="110" y="55" text-anchor="middle" font-size="12" fill="white">• Content-based</text>
        <text x="110" y="75" text-anchor="middle" font-size="12" fill="white">• Demographics</text>
        <text x="110" y="95" text-anchor="middle" font-size="12" fill="white">• Knowledge-based</text>
        <text x="110" y="115" text-anchor="middle" font-size="12" fill="white">• Popularity-based</text>
      </g>
      
      <!-- Active Learning -->
      <g transform="translate(240, 0)">
        <rect x="0" y="0" width="220" height="150" rx="10" fill="#27ae60" filter="url(#shadow)"/>
        <text x="110" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="white">Active Learning</text>
        <text x="110" y="55" text-anchor="middle" font-size="12" fill="white">• Onboarding quiz</text>
        <text x="110" y="75" text-anchor="middle" font-size="12" fill="white">• Initial preferences</text>
        <text x="110" y="95" text-anchor="middle" font-size="12" fill="white">• Quick ratings</text>
        <text x="110" y="115" text-anchor="middle" font-size="12" fill="white">• Social login</text>
      </g>
      
      <!-- Transfer Learning -->
      <g transform="translate(480, 0)">
        <rect x="0" y="0" width="220" height="150" rx="10" fill="#8e44ad" filter="url(#shadow)"/>
        <text x="110" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="white">Transfer Learning</text>
        <text x="110" y="55" text-anchor="middle" font-size="12" fill="white">• Cross-domain data</text>
        <text x="110" y="75" text-anchor="middle" font-size="12" fill="white">• Similar platforms</text>
        <text x="110" y="95" text-anchor="middle" font-size="12" fill="white">• Pre-trained models</text>
        <text x="110" y="115" text-anchor="middle" font-size="12" fill="white">• External APIs</text>
      </g>
      
      <!-- Default Strategy -->
      <g transform="translate(720, 0)">
        <rect x="0" y="0" width="220" height="150" rx="10" fill="#34495e" filter="url(#shadow)"/>
        <text x="110" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="white">Default Strategy</text>
        <text x="110" y="55" text-anchor="middle" font-size="12" fill="white">• Top popular items</text>
        <text x="110" y="75" text-anchor="middle" font-size="12" fill="white">• Editor's picks</text>
        <text x="110" y="95" text-anchor="middle" font-size="12" fill="white">• Trending now</text>
        <text x="110" y="115" text-anchor="middle" font-size="12" fill="white">• Regional favorites</text>
      </g>
    </g>
  </g>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#95a5a6"/>
    </marker>
  </defs>
  
  <!-- Transition Arrows -->
  <g transform="translate(100, 320)">
    <path d="M 60 0 L 60 20" stroke="#2ecc71" stroke-width="3" marker-end="url(#arrowhead)"/>
    <path d="M 300 0 L 300 20" stroke="#2ecc71" stroke-width="3" marker-end="url(#arrowhead)"/>
    <path d="M 540 0 L 540 20" stroke="#2ecc71" stroke-width="3" marker-end="url(#arrowhead)"/>
    <path d="M 780 0 L 780 20" stroke="#2ecc71" stroke-width="3" marker-end="url(#arrowhead)"/>
  </g>
</svg>