<svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="modelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E3F2FD;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2196F3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="tuningGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E8F5E8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4CAF50;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="performanceGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFF3E0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF9800;stop-opacity:1" />
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#333">
    Hyperparameter Tuning Process Overview
  </text>
  
  <!-- Default Model -->
  <rect x="50" y="80" width="180" height="100" rx="10" fill="url(#modelGrad)" stroke="#1976D2" stroke-width="2"/>
  <text x="140" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1976D2">
    Default Model
  </text>
  <text x="140" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1976D2">
    Standard hyperparameters
  </text>
  <text x="140" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1976D2">
    Baseline performance
  </text>
  <text x="140" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1976D2">
    Quick implementation
  </text>
  
  <!-- Arrow 1 -->
  <path d="M 240 130 L 310 130" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="275" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333" font-weight="bold">
    Tune
  </text>
  
  <!-- Hyperparameter Tuning -->
  <rect x="320" y="80" width="180" height="100" rx="10" fill="url(#tuningGrad)" stroke="#4CAF50" stroke-width="2"/>
  <text x="410" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2E7D32">
    Hyperparameter
  </text>
  <text x="410" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2E7D32">
    Tuning
  </text>
  <text x="410" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2E7D32">
    Grid/Random Search
  </text>
  <text x="410" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2E7D32">
    Cross-validation
  </text>
  
  <!-- Arrow 2 -->
  <path d="M 510 130 L 580 130" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="545" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333" font-weight="bold">
    Optimize
  </text>
  
  <!-- Optimized Model -->
  <rect x="590" y="80" width="180" height="100" rx="10" fill="url(#performanceGrad)" stroke="#F57C00" stroke-width="2"/>
  <text x="680" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#E65100">
    Optimized Model
  </text>
  <text x="680" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#E65100">
    Best hyperparameters
  </text>
  <text x="680" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#E65100">
    Improved performance
  </text>
  <text x="680" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#E65100">
    Production ready
  </text>
  
  <!-- Performance Improvement Bar Chart -->
  <text x="500" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">
    Performance Improvement Example
  </text>
  
  <!-- Accuracy bars -->
  <rect x="200" y="260" width="150" height="30" rx="5" fill="#E3F2FD" stroke="#2196F3" stroke-width="1"/>
  <text x="275" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1976D2">
    Baseline: 85.2%
  </text>
  
  <rect x="400" y="260" width="200" height="30" rx="5" fill="#FFF3E0" stroke="#FF9800" stroke-width="1"/>
  <text x="500" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#E65100">
    Tuned: 92.7% (+7.5%)
  </text>
  
  <!-- Key Benefits -->
  <rect x="50" y="320" width="900" height="60" rx="10" fill="#F5F5F5" stroke="#ddd" stroke-width="1"/>
  <text x="70" y="340" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">
    Key Benefits of Hyperparameter Tuning:
  </text>
  <text x="80" y="360" font-family="Arial, sans-serif" font-size="12" fill="#333">
    • Improved model accuracy and generalization  • Reduced overfitting and underfitting  • Better resource utilization
  </text>
  <text x="80" y="375" font-family="Arial, sans-serif" font-size="12" fill="#333">
    • Optimized training time  • Enhanced model robustness  • Competitive edge in production
  </text>
  
  <!-- Arrows showing improvement -->
  <path d="M 360 275 L 390 275" stroke="#4CAF50" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <text x="375" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#4CAF50" font-weight="bold">
    +7.5%
  </text>
</svg>