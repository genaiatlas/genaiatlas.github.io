<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .node-circle { fill: #4A90E2; stroke: #2E5C8A; stroke-width: 3; }
      .node-observed { fill: #E89B3C; stroke: #B87420; stroke-width: 3; }
      .node-label { font-family: 'Arial', sans-serif; font-size: 16px; fill: white; font-weight: bold; text-anchor: middle; }
      .edge-line { stroke: #666; stroke-width: 2; fill: none; }
      .title-text { font-family: 'Arial', sans-serif; font-size: 24px; font-weight: bold; fill: #2C3E50; }
      .subtitle-text { font-family: 'Arial', sans-serif; font-size: 16px; fill: #555; }
      .legend-text { font-family: 'Arial', sans-serif; font-size: 14px; fill: #333; }
    </style>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" class="title-text" text-anchor="middle">Graphical Model Network</text>
  <text x="400" y="55" class="subtitle-text" text-anchor="middle">Ising Model for Social Network Preferences</text>
  
  <!-- Network Edges -->
  <line x1="150" y1="150" x2="250" y2="150" class="edge-line"/>
  <line x1="250" y1="150" x2="350" y2="150" class="edge-line"/>
  <line x1="350" y1="150" x2="450" y2="200" class="edge-line"/>
  <line x1="150" y1="150" x2="200" y2="250" class="edge-line"/>
  <line x1="250" y1="150" x2="300" y2="250" class="edge-line"/>
  <line x1="200" y1="250" x2="300" y2="250" class="edge-line"/>
  <line x1="300" y1="250" x2="400" y2="300" class="edge-line"/>
  <line x1="450" y1="200" x2="550" y2="150" class="edge-line"/>
  <line x1="550" y1="150" x2="650" y2="150" class="edge-line"/>
  <line x1="650" y1="150" x2="700" y2="200" class="edge-line"/>
  <line x1="550" y1="150" x2="600" y2="250" class="edge-line"/>
  <line x1="600" y1="250" x2="700" y2="250" class="edge-line"/>
  <line x1="700" y1="200" x2="700" y2="250" class="edge-line"/>
  <line x1="400" y1="300" x2="500" y2="350" class="edge-line"/>
  <line x1="500" y1="350" x2="600" y2="350" class="edge-line"/>
  <line x1="600" y1="250" x2="600" y2="350" class="edge-line"/>
  
  <!-- Unobserved Nodes -->
  <circle cx="150" cy="150" r="25" class="node-circle"/>
  <text x="150" y="157" class="node-label">X₁</text>
  
  <circle cx="250" cy="150" r="25" class="node-circle"/>
  <text x="250" y="157" class="node-label">X₂</text>
  
  <circle cx="350" cy="150" r="25" class="node-circle"/>
  <text x="350" y="157" class="node-label">X₃</text>
  
  <circle cx="200" cy="250" r="25" class="node-circle"/>
  <text x="200" y="257" class="node-label">X₄</text>
  
  <circle cx="550" cy="150" r="25" class="node-circle"/>
  <text x="550" y="157" class="node-label">X₈</text>
  
  <circle cx="650" cy="150" r="25" class="node-circle"/>
  <text x="650" y="157" class="node-label">X₉</text>
  
  <circle cx="700" cy="200" r="25" class="node-circle"/>
  <text x="700" y="207" class="node-label">X₁₀</text>
  
  <circle cx="400" cy="300" r="25" class="node-circle"/>
  <text x="400" y="307" class="node-label">X₁₁</text>
  
  <circle cx="500" cy="350" r="25" class="node-circle"/>
  <text x="500" y="357" class="node-label">X₁₂</text>
  
  <!-- Observed Nodes (Evidence) -->
  <circle cx="300" cy="250" r="25" class="node-observed"/>
  <text x="300" y="257" class="node-label">X₅</text>
  <text x="300" y="295" class="legend-text" text-anchor="middle" style="font-size: 12px; fill: #E89B3C; font-weight: bold;">+1</text>
  
  <circle cx="450" cy="200" r="25" class="node-observed"/>
  <text x="450" y="207" class="node-label">X₆</text>
  <text x="450" y="245" class="legend-text" text-anchor="middle" style="font-size: 12px; fill: #E89B3C; font-weight: bold;">-1</text>
  
  <circle cx="600" cy="250" r="25" class="node-observed"/>
  <text x="600" y="257" class="node-label">X₇</text>
  <text x="600" y="295" class="legend-text" text-anchor="middle" style="font-size: 12px; fill: #E89B3C; font-weight: bold;">+1</text>
  
  <circle cx="700" cy="250" r="25" class="node-observed"/>
  <text x="700" y="257" class="node-label">X₁₃</text>
  <text x="700" y="295" class="legend-text" text-anchor="middle" style="font-size: 12px; fill: #E89B3C; font-weight: bold;">+1</text>
  
  <circle cx="600" cy="350" r="25" class="node-observed"/>
  <text x="600" y="357" class="node-label">X₁₄</text>
  <text x="600" y="395" class="legend-text" text-anchor="middle" style="font-size: 12px; fill: #E89B3C; font-weight: bold;">-1</text>
  
  <!-- Legend -->
  <rect x="50" y="400" width="350" height="80" fill="#F8F9FA" stroke="#CCC" stroke-width="2" rx="5"/>
  <text x="225" y="425" class="legend-text" text-anchor="middle" font-weight="bold">Legend</text>
  
  <circle cx="100" cy="455" r="15" class="node-circle"/>
  <text x="130" y="462" class="legend-text">Unobserved nodes (to predict)</text>
  
  <circle cx="100" cy="480" r="15" class="node-observed"/>
  <text x="130" y="487" class="legend-text">Observed nodes (evidence)</text>
  
  <!-- Inference Task -->
  <rect x="420" y="400" width="330" height="80" fill="#E8F4F8" stroke="#4A90E2" stroke-width="2" rx="5"/>
  <text x="585" y="425" class="legend-text" text-anchor="middle" font-weight="bold">Inference Task</text>
  <text x="585" y="450" class="legend-text" text-anchor="middle">Compute P(Xᵢ | observed values)</text>
  <text x="585" y="472" class="legend-text" text-anchor="middle">for all unobserved nodes</text>
</svg>