<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="700" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">Deep Learning Success: Four Pillars of the Revolution</text>
  
  <!-- Central Deep Learning Hub -->
  <g id="central-hub">
    <circle cx="500" cy="350" r="100" fill="#34495e" stroke="#2c3e50" stroke-width="4"/>
    <text x="500" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#fff">DEEP</text>
    <text x="500" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#fff">LEARNING</text>
    <text x="500" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#fff">SUCCESS</text>
    
    <!-- Inner rings showing interconnection -->
    <circle cx="500" cy="350" r="85" fill="none" stroke="#ecf0f1" stroke-width="1" opacity="0.5" stroke-dasharray="5,5"/>
    <circle cx="500" cy="350" r="70" fill="none" stroke="#ecf0f1" stroke-width="1" opacity="0.3" stroke-dasharray="3,3"/>
  </g>
  
  <!-- Factor 1: Big Data -->
  <g id="big-data">
    <rect x="50" y="50" width="300" height="180" fill="#e8f6f3" stroke="#16a085" stroke-width="3" rx="15"/>
    <text x="200" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#16a085">📊 Lots of Data</text>
    
    <!-- Data growth visualization -->
    <g id="data-growth">
      <rect x="80" y="100" width="20" height="30" fill="#16a085" opacity="0.3"/>
      <rect x="110" y="100" width="20" height="45" fill="#16a085" opacity="0.5"/>
      <rect x="140" y="100" width="20" height="65" fill="#16a085" opacity="0.7"/>
      <rect x="170" y="100" width="20" height="85" fill="#16a085" opacity="0.9"/>
      <rect x="200" y="100" width="20" height="105" fill="#16a085"/>
      <rect x="230" y="100" width="20" height="85" fill="#16a085" opacity="0.9"/>
      <rect x="260" y="100" width="20" height="65" fill="#16a085" opacity="0.7"/>
      <rect x="290" y="100" width="20" height="45" fill="#16a085" opacity="0.5"/>
      
      <!-- Years -->
      <text x="90" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">2000</text>
      <text x="150" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">2010</text>
      <text x="210" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">2020</text>
      <text x="270" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">2025</text>
    </g>
    
    <text x="70" y="245" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• Internet-scale datasets</text>
    <text x="70" y="260" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• Billions of images, texts, interactions</text>
    <text x="70" y="275" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• IoT and sensor networks</text>
    <text x="70" y="290" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• Digital transformation</text>
    
    <!-- Arrow to center -->
    <line x1="320" y1="160" x2="420" y2="280" stroke="#16a085" stroke-width="4" marker-end="url(#arrow-green)"/>
    <text x="370" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#16a085" transform="rotate(-35 370,210)">Data Fuel</text>
  </g>
  
  <!-- Factor 2: Computational Resources -->
  <g id="computational-resources">
    <rect x="650" y="50" width="300" height="180" fill="#fff3e0" stroke="#ff9800" stroke-width="3" rx="15"/>
    <text x="800" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ff9800">🖥️ Computational Power</text>
    
    <!-- GPU visualization -->
    <g id="gpu-viz">
      <!-- GPU cores representation -->
      <rect x="720" y="110" width="15" height="15" fill="#ff9800"/>
      <rect x="740" y="110" width="15" height="15" fill="#ff9800"/>
      <rect x="760" y="110" width="15" height="15" fill="#ff9800"/>
      <rect x="780" y="110" width="15" height="15" fill="#ff9800"/>
      <rect x="800" y="110" width="15" height="15" fill="#ff9800"/>
      <rect x="820" y="110" width="15" height="15" fill="#ff9800"/>
      <rect x="840" y="110" width="15" height="15" fill="#ff9800"/>
      <rect x="860" y="110" width="15" height="15" fill="#ff9800"/>
      
      <rect x="720" y="130" width="15" height="15" fill="#ff9800"/>
      <rect x="740" y="130" width="15" height="15" fill="#ff9800"/>
      <rect x="760" y="130" width="15" height="15" fill="#ff9800"/>
      <rect x="780" y="130" width="15" height="15" fill="#ff9800"/>
      <rect x="800" y="130" width="15" height="15" fill="#ff9800"/>
      <rect x="820" y="130" width="15" height="15" fill="#ff9800"/>
      <rect x="840" y="130" width="15" height="15" fill="#ff9800"/>
      <rect x="860" y="130" width="15" height="15" fill="#ff9800"/>
      
      <rect x="720" y="150" width="15" height="15" fill="#ff9800"/>
      <rect x="740" y="150" width="15" height="15" fill="#ff9800"/>
      <rect x="760" y="150" width="15" height="15" fill="#ff9800"/>
      <rect x="780" y="150" width="15" height="15" fill="#ff9800"/>
      <rect x="800" y="150" width="15" height="15" fill="#ff9800"/>
      <rect x="820" y="150" width="15" height="15" fill="#ff9800"/>
      <rect x="840" y="150" width="15" height="15" fill="#ff9800"/>
      <rect x="860" y="150" width="15" height="15" fill="#ff9800"/>
      
      <text x="800" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ff9800">Parallel Processing</text>
    </g>
    
    <text x="670" y="220" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• GPUs and TPUs</text>
    <text x="670" y="235" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• Cloud computing infrastructure</text>
    <text x="670" y="250" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• Distributed training systems</text>
    <text x="670" y="265" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• Specialized AI chips</text>
    
    <!-- Arrow to center -->
    <line x1="680" y1="160" x2="580" y2="280" stroke="#ff9800" stroke-width="4" marker-end="url(#arrow-orange)"/>
    <text x="630" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ff9800" transform="rotate(35 630,210)">Computing Power</text>
  </g>
  
  <!-- Factor 3: Large Models are Easier to Train -->
  <g id="large-models">
    <rect x="50" y="470" width="300" height="180" fill="#f4ecf7" stroke="#8e44ad" stroke-width="3" rx="15"/>
    <text x="200" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#8e44ad">🎯 Large Models</text>
    <text x="200" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#8e44ad">Easier to Train</text>
    
    <!-- Model complexity visualization -->
    <g id="model-complexity">
      <!-- Small model (more sharp minima) -->
      <g id="small-model">
        <path d="M 80 570 Q 120 540 160 570" fill="none" stroke="#e74c3c" stroke-width="2"/>
        <path d="M 90 580 Q 100 565 110 580" fill="none" stroke="#e74c3c" stroke-width="2"/>
        <path d="M 130 580 Q 140 565 150 580" fill="none" stroke="#e74c3c" stroke-width="2"/>
        <text x="120" y="595" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c">Small Model</text>
        <text x="120" y="608" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#e74c3c">Sharp minima</text>
      </g>
      
      <!-- Large model (smoother landscape) -->
      <g id="large-model">
        <path d="M 220 570 Q 280 555 340 570" fill="none" stroke="#27ae60" stroke-width="3"/>
        <circle cx="280" cy="555" r="3" fill="#27ae60"/>
        <text x="280" y="595" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#27ae60">Large Model</text>
        <text x="280" y="608" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#27ae60">Smooth optimization</text>
      </g>
    </g>
    
    <text x="70" y="535" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• Over-parameterization helps</text>
    <text x="70" y="550" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• Smoother loss landscapes</text>
    <text x="70" y="625" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• Better gradient flow</text>
    <text x="70" y="640" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• Implicit regularization</text>
    
    <!-- Arrow to center -->
    <line x1="320" y1="540" x2="420" y2="420" stroke="#8e44ad" stroke-width="4" marker-end="url(#arrow-purple)"/>
    <text x="370" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#8e44ad" transform="rotate(35 370,480)">Optimization</text>
  </g>
  
  <!-- Factor 4: Flexible Building Blocks -->
  <g id="flexible-blocks">
    <rect x="650" y="470" width="300" height="180" fill="#e8f5e8" stroke="#27ae60" stroke-width="3" rx="15"/>
    <text x="800" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#27ae60">🧱 Flexible Building</text>
    <text x="800" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#27ae60">Blocks</text>
    
    <!-- Building blocks visualization -->
    <g id="building-blocks">
      <!-- Convolution block -->
      <rect x="680" y="540" width="40" height="25" fill="#3498db" stroke="#2980b9" stroke-width="1" rx="3"/>
      <text x="700" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#fff">Conv</text>
      
      <!-- Attention block -->
      <rect x="730" y="540" width="40" height="25" fill="#e74c3c" stroke="#c0392b" stroke-width="1" rx="3"/>
      <text x="750" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#fff">Attn</text>
      
      <!-- RNN block -->
      <rect x="780" y="540" width="40" height="25" fill="#f39c12" stroke="#e67e22" stroke-width="1" rx="3"/>
      <text x="800" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#fff">RNN</text>
      
      <!-- Normalization block -->
      <rect x="830" y="540" width="40" height="25" fill="#9b59b6" stroke="#8e44ad" stroke-width="1" rx="3"/>
      <text x="850" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#fff">Norm</text>
      
      <!-- Connections showing modularity -->
      <line x1="720" y1="552" x2="730" y2="552" stroke="#34495e" stroke-width="1"/>
      <line x1="770" y1="552" x2="780" y2="552" stroke="#34495e" stroke-width="1"/>
      <line x1="820" y1="552" x2="830" y2="552" stroke="#34495e" stroke-width="1"/>
    </g>
    
    <text x="670" y="585" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• Modular architectures</text>
    <text x="670" y="600" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• Transferable components</text>
    <text x="670" y="615" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• Mix-and-match design</text>
    <text x="670" y="630" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• Architecture search</text>
    
    <!-- Arrow to center -->
    <line x1="680" y1="540" x2="580" y2="420" stroke="#27ae60" stroke-width="4" marker-end="url(#arrow-green-2)"/>
    <text x="630" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#27ae60" transform="rotate(-35 630,480)">Modularity</text>
  </g>
  
  <!-- Interconnection lines between factors -->
  <g id="interconnections" opacity="0.3">
    <!-- Big Data to Computational -->
    <line x1="350" y1="140" x2="650" y2="140" stroke="#7f8c8d" stroke-width="2" stroke-dasharray="5,5"/>
    
    <!-- Computational to Flexible Blocks -->
    <line x1="800" y1="230" x2="800" y2="470" stroke="#7f8c8d" stroke-width="2" stroke-dasharray="5,5"/>
    
    <!-- Flexible Blocks to Large Models -->
    <line x1="650" y1="560" x2="350" y2="560" stroke="#7f8c8d" stroke-width="2" stroke-dasharray="5,5"/>
    
    <!-- Large Models to Big Data -->
    <line x1="200" y1="470" x2="200" y2="230" stroke="#7f8c8d" stroke-width="2" stroke-dasharray="5,5"/>
  </g>
  
  <!-- Timeline at bottom -->
  <g id="timeline">
    <rect x="150" y="680" width="700" height="15" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" rx="7"/>
    <text x="500" y="672" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Deep Learning Timeline</text>
    
    <!-- Timeline markers -->
    <circle cx="200" cy="687" r="3" fill="#e74c3c"/>
    <text x="200" y="705" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">2006</text>
    <text x="200" y="715" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#2c3e50">Deep Belief</text>
    
    <circle cx="350" cy="687" r="3" fill="#f39c12"/>
    <text x="350" y="705" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">2012</text>
    <text x="350" y="715" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#2c3e50">AlexNet</text>
    
    <circle cx="500" cy="687" r="3" fill="#3498db"/>
    <text x="500" y="705" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">2017</text>
    <text x="500" y="715" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#2c3e50">Transformers</text>
    
    <circle cx="650" cy="687" r="3" fill="#27ae60"/>
    <text x="650" y="705" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">2020</text>
    <text x="650" y="715" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#2c3e50">GPT-3</text>
    
    <circle cx="800" cy="687" r="3" fill="#9b59b6"/>
    <text x="800" y="705" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">2025</text>
    <text x="800" y="715" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#2c3e50">Present</text>
  </g>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrow-green" markerWidth="12" markerHeight="8" refX="0" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#16a085" />
    </marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="8" refX="0" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#ff9800" />
    </marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="8" refX="0" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#8e44ad" />
    </marker>
    <marker id="arrow-green-2" markerWidth="12" markerHeight="8" refX="0" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#27ae60" />
    </marker>
  </defs>
</svg>