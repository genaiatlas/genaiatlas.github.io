<svg viewBox="0 0 900 650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cluster1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#ffa8a8;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="cluster2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ecdc4;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#96f2ed;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="cluster3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#45b7d1;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#85d7ff;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="650" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">
    Graph Clustering: From Networks to Communities
  </text>
  
  <!-- Section 1: Network Graph -->
  <g transform="translate(50, 70)">
    <text x="150" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">
      Original Network
    </text>
    
    <!-- Cluster 1 (Red) -->
    <ellipse cx="80" cy="80" rx="50" ry="35" fill="url(#cluster1)" stroke="#e74c3c" stroke-width="2" stroke-dasharray="5,5"/>
    
    <!-- Nodes in cluster 1 -->
    <circle cx="60" cy="70" r="8" fill="#e74c3c" stroke="#2c3e50" stroke-width="2"/>
    <circle cx="100" cy="65" r="8" fill="#e74c3c" stroke="#2c3e50" stroke-width="2"/>
    <circle cx="80" cy="95" r="8" fill="#e74c3c" stroke="#2c3e50" stroke-width="2"/>
    <circle cx="90" cy="85" r="8" fill="#e74c3c" stroke="#2c3e50" stroke-width="2"/>
    
    <!-- Node labels -->
    <text x="60" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">1</text>
    <text x="100" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">2</text>
    <text x="80" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">3</text>
    <text x="90" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">4</text>
    
    <!-- Edges within cluster 1 -->
    <line x1="60" y1="70" x2="100" y2="65" stroke="#2c3e50" stroke-width="2"/>
    <line x1="60" y1="70" x2="80" y2="95" stroke="#2c3e50" stroke-width="2"/>
    <line x1="100" y1="65" x2="90" y2="85" stroke="#2c3e50" stroke-width="2"/>
    <line x1="80" y1="95" x2="90" y2="85" stroke="#2c3e50" stroke-width="2"/>
    
    <!-- Cluster 2 (Teal) -->
    <ellipse cx="220" cy="80" rx="50" ry="35" fill="url(#cluster2)" stroke="#4ecdc4" stroke-width="2" stroke-dasharray="5,5"/>
    
    <!-- Nodes in cluster 2 -->
    <circle cx="200" cy="70" r="8" fill="#4ecdc4" stroke="#2c3e50" stroke-width="2"/>
    <circle cx="240" cy="65" r="8" fill="#4ecdc4" stroke="#2c3e50" stroke-width="2"/>
    <circle cx="220" cy="95" r="8" fill="#4ecdc4" stroke="#2c3e50" stroke-width="2"/>
    <circle cx="230" cy="85" r="8" fill="#4ecdc4" stroke="#2c3e50" stroke-width="2"/>
    
    <!-- Node labels -->
    <text x="200" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">5</text>
    <text x="240" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">6</text>
    <text x="220" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">7</text>
    <text x="230" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">8</text>
    
    <!-- Edges within cluster 2 -->
    <line x1="200" y1="70" x2="240" y2="65" stroke="#2c3e50" stroke-width="2"/>
    <line x1="200" y1="70" x2="220" y2="95" stroke="#2c3e50" stroke-width="2"/>
    <line x1="240" y1="65" x2="230" y2="85" stroke="#2c3e50" stroke-width="2"/>
    <line x1="220" y1="95" x2="230" y2="85" stroke="#2c3e50" stroke-width="2"/>
    
    <!-- Inter-cluster edges (few) -->
    <line x1="100" y1="65" x2="200" y2="70" stroke="#95a5a6" stroke-width="2" stroke-dasharray="3,3"/>
    <line x1="90" y1="85" x2="220" y2="95" stroke="#95a5a6" stroke-width="2" stroke-dasharray="3,3"/>
    
    <!-- Cut visualization -->
    <path d="M 130 40 Q 150 60 170 40" stroke="#f39c12" stroke-width="3" fill="none"/>
    <text x="150" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f39c12">
      Cut
    </text>
  </g>
  
  <!-- Section 2: Adjacency Matrix -->
  <g transform="translate(400, 70)">
    <text x="100" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">
      Adjacency Matrix
    </text>
    
    <!-- Matrix background -->
    <rect x="20" y="20" width="160" height="160" fill="#ffffff" stroke="#2c3e50" stroke-width="2"/>
    
    <!-- Row/column labels -->
    <text x="10" y="35" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">1</text>
    <text x="10" y="55" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">2</text>
    <text x="10" y="75" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">3</text>
    <text x="10" y="95" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">4</text>
    <text x="10" y="115" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">5</text>
    <text x="10" y="135" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">6</text>
    <text x="10" y="155" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">7</text>
    <text x="10" y="175" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">8</text>
    
    <text x="35" y="15" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">1</text>
    <text x="55" y="15" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">2</text>
    <text x="75" y="15" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">3</text>
    <text x="95" y="15" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">4</text>
    <text x="115" y="15" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">5</text>
    <text x="135" y="15" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">6</text>
    <text x="155" y="15" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">7</text>
    <text x="175" y="15" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">8</text>
    
    <!-- Block structure for cluster 1 -->
    <rect x="30" y="30" width="80" height="80" fill="#ffebee" stroke="#e74c3c" stroke-width="2"/>
    
    <!-- Block structure for cluster 2 -->
    <rect x="110" y="110" width="80" height="80" fill="#e0f2f1" stroke="#4ecdc4" stroke-width="2"/>
    
    <!-- Matrix entries - cluster 1 -->
    <text x="35" y="35" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">0</text>
    <text x="55" y="35" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">1</text>
    <text x="75" y="35" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">1</text>
    <text x="95" y="35" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">0</text>
    
    <text x="35" y="55" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">1</text>
    <text x="55" y="55" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">0</text>
    <text x="75" y="55" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">0</text>
    <text x="95" y="55" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">1</text>
    
    <!-- Cross-cluster connections -->
    <text x="115" y="35" font-family="Arial, sans-serif" font-size="8" fill="#f39c12">1</text>
    <text x="155" y="95" font-family="Arial, sans-serif" font-size="8" fill="#f39c12">1</text>
    
    <!-- Block structure label -->
    <text x="100" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
      Block structure reveals clusters
    </text>
  </g>
  
  <!-- Section 3: Cut criteria -->
  <g transform="translate(50, 250)">
    <text x="200" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">
      Clustering Criteria
    </text>
    
    <!-- Criterion 1: Cut -->
    <rect x="0" y="20" width="120" height="100" fill="#fff3cd" stroke="#ffc107" stroke-width="2" rx="10"/>
    <text x="60" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#856404">
      Cut Value
    </text>
    <text x="60" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#856404">
      Cut(C) = # edges
    </text>
    <text x="60" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#856404">
      to remove
    </text>
    <text x="60" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#856404">
      Problem: favors
    </text>
    <text x="60" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#856404">
      small clusters
    </text>
    
    <!-- Criterion 2: Conductance -->
    <rect x="140" y="20" width="120" height="100" fill="#d1ecf1" stroke="#17a2b8" stroke-width="2" rx="10"/>
    <text x="200" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0c5460">
      Conductance
    </text>
    <text x="200" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#0c5460">
      Cut(C) /
    </text>
    <text x="200" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#0c5460">
      min{Vol(C), Vol(V\C)}
    </text>
    <text x="200" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0c5460">
      Balances cut &
    </text>
    <text x="200" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0c5460">
      cluster size
    </text>
    
    <!-- Criterion 3: Normalized Cut -->
    <rect x="280" y="20" width="120" height="100" fill="#d4edda" stroke="#28a745" stroke-width="2" rx="10"/>
    <text x="340" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#155724">
      Normalized Cut
    </text>
    <text x="340" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#155724">
      Cut(C) /
    </text>
    <text x="340" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#155724">
      (Vol(C) + Vol(V\C))
    </text>
    <text x="340" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#155724">
      Considers total
    </text>
    <text x="340" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#155724">
      graph volume
    </text>
  </g>
  
  <!-- Section 4: Real-world applications -->
  <g transform="translate(500, 250)">
    <text x="200" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">
      Applications
    </text>
    
    <!-- Social Networks -->
    <g transform="translate(20, 30)">
      <circle cx="30" cy="30" r="25" fill="#e8f4f8" stroke="#3498db" stroke-width="2"/>
      <text x="30" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#2c3e50">
        Social
      </text>
      <text x="30" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">
        Friend groups
      </text>
      <text x="30" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">
        Communities
      </text>
    </g>
    
    <!-- Biological Networks -->
    <g transform="translate(120, 30)">
      <circle cx="30" cy="30" r="25" fill="#e8f8f5" stroke="#27ae60" stroke-width="2"/>
      <text x="30" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#2c3e50">
        Biology
      </text>
      <text x="30" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">
        Protein
      </text>
      <text x="30" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">
        modules
      </text>
    </g>
    
    <!-- Web Networks -->
    <g transform="translate(220, 30)">
      <circle cx="30" cy="30" r="25" fill="#fef5e7" stroke="#f39c12" stroke-width="2"/>
      <text x="30" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#2c3e50">
        Web
      </text>
      <text x="30" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">
        Page
      </text>
      <text x="30" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">
        clusters
      </text>
    </g>
    
    <!-- Transportation -->
    <g transform="translate(320, 30)">
      <circle cx="30" cy="30" r="25" fill="#fdebf7" stroke="#8e44ad" stroke-width="2"/>
      <text x="30" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#2c3e50">
        Transport
      </text>
      <text x="30" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">
        Route
      </text>
      <text x="30" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">
        planning
      </text>
    </g>
  </g>
  
  <!-- Section 5: Algorithm overview -->
  <g transform="translate(50, 450)">
    <text x="400" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">
      Graph Clustering Algorithm Pipeline
    </text>
    
    <!-- Step boxes -->
    <rect x="0" y="20" width="120" height="60" fill="#f8f9fa" stroke="#2c3e50" stroke-width="2" rx="5"/>
    <text x="60" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">
      1. Build Graph
    </text>
    <text x="60" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">
      Adjacency matrix
    </text>
    <text x="60" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">
      Edge weights
    </text>
    
    <!-- Arrow -->
    <path d="M 130 50 L 160 50 L 150 45 M 160 50 L 150 55" stroke="#2c3e50" stroke-width="2" fill="none"/>
    
    <rect x="170" y="20" width="120" height="60" fill="#f8f9fa" stroke="#2c3e50" stroke-width="2" rx="5"/>
    <text x="230" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">
      2. Choose Criterion
    </text>
    <text x="230" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">
      Cut, Conductance,
    </text>
    <text x="230" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">
      or Normalized Cut
    </text>
    
    <!-- Arrow -->
    <path d="M 300 50 L 330 50 L 320 45 M 330 50 L 320 55" stroke="#2c3e50" stroke-width="2" fill="none"/>
    
    <rect x="340" y="20" width="120" height="60" fill="#f8f9fa" stroke="#2c3e50" stroke-width="2" rx="5"/>
    <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">
      3. Optimize
    </text>
    <text x="400" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">
      Find optimal
    </text>
    <text x="400" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">
      partitioning
    </text>
    
    <!-- Arrow -->
    <path d="M 470 50 L 500 50 L 490 45 M 500 50 L 490 55" stroke="#2c3e50" stroke-width="2" fill="none"/>
    
    <rect x="510" y="20" width="120" height="60" fill="#f8f9fa" stroke="#2c3e50" stroke-width="2" rx="5"/>
    <text x="570" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">
      4. Extract Clusters
    </text>
    <text x="570" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">
      Community
    </text>
    <text x="570" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">
      detection
    </text>
  </g>
  
  <!-- Key metrics box -->
  <g transform="translate(650, 450)">
    <rect x="0" y="0" width="200" height="120" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2" rx="10"/>
    <text x="100" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
      Key Metrics
    </text>
    
    <text x="20" y="40" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
      • Volume: Total edges in cluster
    </text>
    <text x="20" y="55" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
      • Cut: Edges between clusters
    </text>
    <text x="20" y="70" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
      • Density: Volume per node
    </text>
    <text x="20" y="85" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
      • Modularity: vs random graph
    </text>
    <text x="20" y="100" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">
      • Separation: Inter-cluster edges
    </text>
  </g>
</svg>