<svg width="1200" height="675" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="675" fill="#f8f9fa"/>
  
  <!-- Fast Track Ribbon -->
  <polygon points="1050,0 1200,0 1200,150" fill="#e74c3c"/>
  <text x="1125" y="75" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" transform="rotate(45 1125 75)">FAST TRACK</text>
  
  <!-- Title -->
  <text x="600" y="50" fill="#2c3e50" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle">ANOVA &amp; Statistical Tests in Python</text>
  
  <!-- ANOVA Types -->
  <rect x="50" y="100" width="270" height="100" fill="#3498db" stroke="#2c3e50" stroke-width="2" rx="10"/>
  <text x="185" y="130" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">One-way ANOVA</text>
  <text x="185" y="150" fill="white" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">scipy.stats.f_oneway</text>
  <text x="185" y="170" fill="white" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Compare 3+ groups</text>
  <text x="185" y="190" fill="white" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">One factor</text>
  
  <rect x="340" y="100" width="270" height="100" fill="#27ae60" stroke="#2c3e50" stroke-width="2" rx="10"/>
  <text x="475" y="130" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Two-way ANOVA</text>
  <text x="475" y="150" fill="white" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">statsmodels.anova_lm</text>
  <text x="475" y="170" fill="white" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Multiple factors</text>
  <text x="475" y="190" fill="white" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Interactions</text>
  
  <rect x="630" y="100" width="270" height="100" fill="#f39c12" stroke="#2c3e50" stroke-width="2" rx="10"/>
  <text x="765" y="130" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Kruskal-Wallis</text>
  <text x="765" y="150" fill="white" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">scipy.stats.kruskal</text>
  <text x="765" y="170" fill="white" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Non-parametric</text>
  <text x="765" y="190" fill="white" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">No normal assumption</text>
  
  <rect x="920" y="100" width="270" height="100" fill="#9b59b6" stroke="#2c3e50" stroke-width="2" rx="10"/>
  <text x="1055" y="130" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Repeated Measures</text>
  <text x="1055" y="150" fill="white" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">statsmodels</text>
  <text x="1055" y="170" fill="white" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Within-subjects</text>
  <text x="1055" y="190" fill="white" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Same participants</text>
  
  <!-- ANOVA Steps -->
  <text x="100" y="250" fill="#2c3e50" font-family="Arial, sans-serif" font-size="18" font-weight="bold">ANOVA Process:</text>
  
  <rect x="50" y="270" width="180" height="60" fill="#ecf0f1" stroke="#34495e" stroke-width="1" rx="5"/>
  <text x="140" y="290" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">1. Check</text>
  <text x="140" y="310" fill="#7f8c8d" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Assumptions</text>
  
  <rect x="250" y="270" width="180" height="60" fill="#ecf0f1" stroke="#34495e" stroke-width="1" rx="5"/>
  <text x="340" y="290" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">2. Run ANOVA</text>
  <text x="340" y="310" fill="#7f8c8d" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">F-statistic</text>
  
  <rect x="450" y="270" width="180" height="60" fill="#ecf0f1" stroke="#34495e" stroke-width="1" rx="5"/>
  <text x="540" y="290" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">3. Interpret</text>
  <text x="540" y="310" fill="#7f8c8d" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">p-value</text>
  
  <rect x="650" y="270" width="180" height="60" fill="#ecf0f1" stroke="#34495e" stroke-width="1" rx="5"/>
  <text x="740" y="290" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">4. Post-hoc</text>
  <text x="740" y="310" fill="#7f8c8d" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Tukey HSD</text>
  
  <rect x="850" y="270" width="180" height="60" fill="#ecf0f1" stroke="#34495e" stroke-width="1" rx="5"/>
  <text x="940" y="290" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">5. Effect Size</text>
  <text x="940" y="310" fill="#7f8c8d" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">η² (eta-squared)</text>
  
  <!-- Arrows -->
  <path d="M 230 300 L 250 300" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 430 300 L 450 300" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 630 300 L 650 300" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 830 300 L 850 300" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Code Example -->
  <rect x="50" y="360" width="1100" height="140" fill="#2c3e50" stroke="#34495e" stroke-width="2" rx="5"/>
  <text x="70" y="390" fill="#f39c12" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Example Code:</text>
  <text x="70" y="420" fill="#ecf0f1" font-family="monospace" font-size="14">import scipy.stats as stats</text>
  <text x="70" y="440" fill="#ecf0f1" font-family="monospace" font-size="14">from statsmodels.stats.multicomp import pairwise_tukeyhsd</text>
  <text x="70" y="460" fill="#ecf0f1" font-family="monospace" font-size="14">F_stat, p_value = stats.f_oneway(group1, group2, group3)</text>
  <text x="70" y="480" fill="#ecf0f1" font-family="monospace" font-size="14">tukey = pairwise_tukeyhsd(data, groups)</text>
  
  <!-- Assumptions -->
  <rect x="50" y="530" width="350" height="100" fill="#e8f8f5" stroke="#27ae60" stroke-width="2" rx="5"/>
  <text x="70" y="560" fill="#27ae60" font-family="Arial, sans-serif" font-size="16" font-weight="bold">ANOVA Assumptions:</text>
  <text x="70" y="580" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12">• Independence of observations</text>
  <text x="70" y="600" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12">• Normality of residuals</text>
  <text x="70" y="620" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12">• Homogeneity of variance</text>
  
  <!-- Post-hoc Tests -->
  <rect x="420" y="530" width="350" height="100" fill="#fef9e7" stroke="#f39c12" stroke-width="2" rx="5"/>
  <text x="440" y="560" fill="#f39c12" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Post-hoc Tests:</text>
  <text x="440" y="580" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12">• Tukey HSD (equal variances)</text>
  <text x="440" y="600" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12">• Bonferroni (conservative)</text>
  <text x="440" y="620" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12">• Games-Howell (unequal var.)</text>
  
  <!-- Non-parametric -->
  <rect x="790" y="530" width="360" height="100" fill="#fdedec" stroke="#e74c3c" stroke-width="2" rx="5"/>
  <text x="810" y="560" fill="#e74c3c" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Non-parametric Tests:</text>
  <text x="810" y="580" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12">• Kruskal-Wallis (3+ groups)</text>
  <text x="810" y="600" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12">• Mann-Whitney U (2 groups)</text>
  <text x="810" y="620" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12">• Wilcoxon signed-rank (paired)</text>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/>
    </marker>
  </defs>
</svg>