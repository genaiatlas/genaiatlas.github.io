<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'Arial', sans-serif; font-size: 20px; font-weight: bold; fill: #2c3e50; }
      .subtitle { font-family: 'Arial', sans-serif; font-size: 16px; fill: #34495e; font-weight: bold; }
      .equation { font-family: 'Times New Roman', serif; font-size: 16px; fill: #2c3e50; }
      .large-equation { font-family: 'Times New Roman', serif; font-size: 20px; fill: #2c3e50; }
      .parameter { font-family: 'Times New Roman', serif; font-size: 14px; fill: #e74c3c; font-weight: bold; }
      .description { font-family: 'Arial', sans-serif; font-size: 12px; fill: #34495e; }
      .box { fill: #f8f9fa; stroke: #dee2e6; stroke-width: 2; rx: 8; }
      .highlight-box { fill: #e8f6f3; stroke: #16a085; stroke-width: 2; rx: 8; }
      .penalty-box { fill: #fef9e7; stroke: #f39c12; stroke-width: 2; rx: 8; }
      .arrow { stroke: #e74c3c; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .l2-norm { fill: #3498db; font-weight: bold; }
      .hyperparameter { fill: #e74c3c; font-weight: bold; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c" />
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title">Ridge Regression (L2 Regularization)</text>
  
  <!-- Main Equation Section -->
  <rect x="50" y="60" width="700" height="120" class="box"/>
  <text x="400" y="85" text-anchor="middle" class="subtitle">Objective Function</text>
  
  <!-- Ridge equation -->
  <text x="100" y="120" class="large-equation">min</text>
  <text x="135" y="125" class="parameter" font-size="12px">θ</text>
  
  <text x="170" y="120" class="large-equation">[</text>
  <text x="185" y="120" class="large-equation">∑</text>
  <text x="185" y="135" class="parameter" font-size="10px">i=1</text>
  <text x="175" y="105" class="parameter" font-size="10px">n</text>
  
  <text x="210" y="120" class="large-equation">(Y</text>
  <text x="235" y="125" class="parameter" font-size="12px">i</text>
  <text x="250" y="120" class="large-equation">- θ</text>
  <text x="275" y="105" class="parameter" font-size="12px">T</text>
  <text x="285" y="120" class="large-equation">X</text>
  <text x="300" y="125" class="parameter" font-size="12px">i</text>
  <text x="315" y="120" class="large-equation">)²</text>
  
  <text x="350" y="120" class="large-equation">+</text>
  
  <text x="380" y="120" class="hyperparameter large-equation">α</text>
  
  <text x="410" y="120" class="large-equation">∑</text>
  <text x="410" y="135" class="parameter" font-size="10px">j=1</text>
  <text x="400" y="105" class="parameter" font-size="10px">m</text>
  
  <text x="435" y="120" class="large-equation">θ</text>
  <text x="450" y="125" class="parameter" font-size="12px">j</text>
  <text x="465" y="120" class="large-equation">²</text>
  
  <text x="490" y="120" class="large-equation">]</text>
  
  <!-- Labels -->
  <text x="250" y="150" text-anchor="middle" class="description">Least Squares Loss</text>
  <path d="M 250 145 Q 250 130 250 115" class="arrow"/>
  
  <text x="450" y="150" text-anchor="middle" class="description">L2 Penalty Term</text>
  <path d="M 450 145 Q 450 130 450 115" class="arrow"/>
  
  <!-- Key Properties Section -->
  <text x="50" y="210" class="subtitle">Key Properties of Ridge Regression</text>
  
  <!-- Property boxes -->
  <rect x="50" y="230" width="220" height="100" class="highlight-box"/>
  <text x="160" y="250" text-anchor="middle" class="subtitle" fill="#16a085">Parameter Shrinkage</text>
  <text x="70" y="270" class="description">• Shrinks coefficients toward zero</text>
  <text x="70" y="285" class="description">• No coefficients set exactly to zero</text>
  <text x="70" y="300" class="description">• Proportional shrinkage based on α</text>
  <text x="70" y="315" class="description">• Reduces model variance</text>
  
  <rect x="290" y="230" width="220" height="100" class="highlight-box"/>
  <text x="400" y="250" text-anchor="middle" class="subtitle" fill="#16a085">Computational Benefits</text>
  <text x="310" y="270" class="description">• Closed-form solution exists</text>
  <text x="310" y="285" class="description">• Quadratic optimization problem</text>
  <text x="310" y="300" class="description">• Efficient for large datasets</text>
  <text x="310" y="315" class="description">• Handles multicollinearity well</text>
  
  <rect x="530" y="230" width="220" height="100" class="penalty-box"/>
  <text x="640" y="250" text-anchor="middle" class="subtitle" fill="#d68910">Hyperparameter α</text>
  <text x="550" y="270" class="description">• α = 0: No regularization (OLS)</text>
  <text x="550" y="285" class="description">• α small: Mild shrinkage</text>
  <text x="550" y="300" class="description">• α large: Heavy shrinkage</text>
  <text x="550" y="315" class="description">• Choose via cross-validation</text>
  
  <!-- Mathematical Interpretation -->
  <rect x="50" y="350" width="700" height="80" class="box"/>
  <text x="400" y="375" text-anchor="middle" class="subtitle">Mathematical Interpretation</text>
  
  <text x="70" y="400" class="equation">L2 Norm: ||θ||₂² = θ₁² + θ₂² + ... + θₘ²</text>
  <text x="70" y="420" class="equation">Effect: Penalizes large coefficients quadratically, encouraging small but non-zero values</text>
  
  <!-- Geometric Visualization -->
  <rect x="50" y="450" width="350" height="130" class="box"/>
  <text x="225" y="475" text-anchor="middle" class="subtitle">Geometric Intuition</text>
  
  <!-- Circle representing L2 constraint -->
  <circle cx="225" cy="520" r="40" fill="none" stroke="#3498db" stroke-width="3"/>
  <text x="225" y="525" text-anchor="middle" class="equation" fill="#3498db">||θ||₂ ≤ t</text>
  
  <!-- Elliptical contours for loss function -->
  <ellipse cx="225" cy="520" rx="60" ry="35" fill="none" stroke="#e74c3c" stroke-width="2" stroke-dasharray="3,3"/>
  <ellipse cx="225" cy="520" rx="80" ry="50" fill="none" stroke="#e74c3c" stroke-width="1" stroke-dasharray="3,3"/>
  
  <!-- Solution point -->
  <circle cx="245" cy="505" r="3" fill="#27ae60"/>
  <text x="255" y="500" class="description" fill="#27ae60">Solution</text>
  
  <text x="70" y="570" class="description">Circular constraint region leads to smooth coefficient shrinkage</text>
  
  <!-- Bias-Variance Analysis -->
  <rect x="420" y="450" width="330" height="130" class="highlight-box"/>
  <text x="585" y="475" text-anchor="middle" class="subtitle" fill="#16a085">Bias-Variance Tradeoff</text>
  
  <text x="440" y="500" class="description">Ridge regression introduces controlled bias to reduce variance:</text>
  
  <text x="450" y="520" class="description">• Bias ↑: Coefficients shrunk away from true values</text>
  <text x="450" y="535" class="description">• Variance ↓: Less sensitive to training data noise</text>
  <text x="450" y="550" class="description">• Total Error: Often decreases due to variance reduction</text>
  <text x="450" y="565" class="description">• Optimal α: Minimizes bias + variance + noise</text>
</svg>