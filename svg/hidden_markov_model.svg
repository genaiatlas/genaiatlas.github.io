<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="600" y="40" font-size="28" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Hidden Markov Model for Temporal Recommendations
  </text>
  
  <!-- Time axis -->
  <line x1="100" y1="150" x2="1100" y2="150" stroke="#95a5a6" stroke-width="2" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#95a5a6"/>
    </marker>
  </defs>
  <text x="1120" y="155" font-size="14" font-weight="bold" fill="#95a5a6">Time</text>
  
  <!-- Time labels -->
  <text x="250" y="140" font-size="14" font-weight="bold" text-anchor="middle" fill="#7f8c8d">t=1</text>
  <text x="500" y="140" font-size="14" font-weight="bold" text-anchor="middle" fill="#7f8c8d">t=2</text>
  <text x="750" y="140" font-size="14" font-weight="bold" text-anchor="middle" fill="#7f8c8d">t=3</text>
  <text x="1000" y="140" font-size="14" font-weight="bold" text-anchor="middle" fill="#7f8c8d">t=4</text>
  
  <!-- Hidden States Layer -->
  <text x="50" y="250" font-size="16" font-weight="bold" fill="#9b59b6">Hidden States:</text>
  
  <!-- Hidden state nodes -->
  <circle cx="250" cy="250" r="40" fill="#9b59b6" stroke="#8e44ad" stroke-width="3"/>
  <text x="250" y="250" font-size="16" font-weight="bold" text-anchor="middle" fill="white">H₁</text>
  <text x="250" y="268" font-size="11" text-anchor="middle" fill="white">(User State)</text>
  
  <circle cx="500" cy="250" r="40" fill="#9b59b6" stroke="#8e44ad" stroke-width="3"/>
  <text x="500" y="250" font-size="16" font-weight="bold" text-anchor="middle" fill="white">H₂</text>
  <text x="500" y="268" font-size="11" text-anchor="middle" fill="white">(User State)</text>
  
  <circle cx="750" cy="250" r="40" fill="#9b59b6" stroke="#8e44ad" stroke-width="3"/>
  <text x="750" y="250" font-size="16" font-weight="bold" text-anchor="middle" fill="white">H₃</text>
  <text x="750" y="268" font-size="11" text-anchor="middle" fill="white">(User State)</text>
  
  <circle cx="1000" cy="250" r="40" fill="#9b59b6" stroke="#8e44ad" stroke-width="3"/>
  <text x="1000" y="250" font-size="16" font-weight="bold" text-anchor="middle" fill="white">H₄</text>
  <text x="1000" y="268" font-size="11" text-anchor="middle" fill="white">(User State)</text>
  
  <!-- Transition arrows between hidden states -->
  <defs>
    <marker id="purple-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#9b59b6"/>
    </marker>
  </defs>
  
  <line x1="290" y1="250" x2="460" y2="250" stroke="#9b59b6" stroke-width="3" marker-end="url(#purple-arrow)"/>
  <text x="375" y="235" font-size="12" text-anchor="middle" fill="#9b59b6" font-weight="bold">P(H₂|H₁)</text>
  
  <line x1="540" y1="250" x2="710" y2="250" stroke="#9b59b6" stroke-width="3" marker-end="url(#purple-arrow)"/>
  <text x="625" y="235" font-size="12" text-anchor="middle" fill="#9b59b6" font-weight="bold">P(H₃|H₂)</text>
  
  <line x1="790" y1="250" x2="960" y2="250" stroke="#9b59b6" stroke-width="3" marker-end="url(#purple-arrow)"/>
  <text x="875" y="235" font-size="12" text-anchor="middle" fill="#9b59b6" font-weight="bold">P(H₄|H₃)</text>
  
  <!-- Observed States Layer -->
  <text x="50" y="430" font-size="16" font-weight="bold" fill="#e74c3c">Observations:</text>
  
  <!-- Observed state nodes -->
  <rect x="200" y="400" width="100" height="70" fill="#e74c3c" stroke="#c0392b" stroke-width="3" rx="8"/>
  <text x="250" y="425" font-size="14" font-weight="bold" text-anchor="middle" fill="white">O₁</text>
  <text x="250" y="445" font-size="11" text-anchor="middle" fill="white">Liked:</text>
  <text x="250" y="460" font-size="11" text-anchor="middle" fill="white">Goodfellas</text>
  
  <rect x="450" y="400" width="100" height="70" fill="#e74c3c" stroke="#c0392b" stroke-width="3" rx="8"/>
  <text x="500" y="425" font-size="14" font-weight="bold" text-anchor="middle" fill="white">O₂</text>
  <text x="500" y="445" font-size="11" text-anchor="middle" fill="white">Disliked:</text>
  <text x="500" y="460" font-size="11" text-anchor="middle" fill="white">Iron Man</text>
  
  <rect x="700" y="400" width="100" height="70" fill="#95a5a6" stroke="#7f8c8d" stroke-width="3" rx="8" stroke-dasharray="5,5"/>
  <text x="750" y="425" font-size="14" font-weight="bold" text-anchor="middle" fill="white">O₃</text>
  <text x="750" y="445" font-size="11" text-anchor="middle" fill="white">Predict</text>
  <text x="750" y="460" font-size="11" text-anchor="middle" fill="white">Next Movie</text>
  
  <rect x="950" y="400" width="100" height="70" fill="#95a5a6" stroke="#7f8c8d" stroke-width="3" rx="8" stroke-dasharray="5,5"/>
  <text x="1000" y="425" font-size="14" font-weight="bold" text-anchor="middle" fill="white">O₄</text>
  <text x="1000" y="445" font-size="11" text-anchor="middle" fill="white">Future</text>
  <text x="1000" y="460" font-size="11" text-anchor="middle" fill="white">Prediction</text>
  
  <!-- Emission arrows (hidden to observed) -->
  <defs>
    <marker id="red-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#e74c3c"/>
    </marker>
  </defs>
  
  <line x1="250" y1="290" x2="250" y2="395" stroke="#e74c3c" stroke-width="3" marker-end="url(#red-arrow)"/>
  <text x="270" y="345" font-size="12" fill="#e74c3c" font-weight="bold">P(O₁|H₁)</text>
  
  <line x1="500" y1="290" x2="500" y2="395" stroke="#e74c3c" stroke-width="3" marker-end="url(#red-arrow)"/>
  <text x="520" y="345" font-size="12" fill="#e74c3c" font-weight="bold">P(O₂|H₂)</text>
  
  <line x1="750" y1="290" x2="750" y2="395" stroke="#95a5a6" stroke-width="3" stroke-dasharray="5,5" marker-end="url(#red-arrow)"/>
  <text x="770" y="345" font-size="12" fill="#95a5a6" font-weight="bold">P(O₃|H₃)</text>
  
  <line x1="1000" y1="290" x2="1000" y2="395" stroke="#95a5a6" stroke-width="3" stroke-dasharray="5,5" marker-end="url(#red-arrow)"/>
  <text x="1020" y="345" font-size="12" fill="#95a5a6" font-weight="bold">P(O₄|H₄)</text>
  
  <!-- Bottom explanation boxes -->
  <g id="markov-property">
    <rect x="100" y="520" width="450" height="240" fill="#e8f5e9" stroke="#27ae60" stroke-width="2" rx="8"/>
    <text x="325" y="550" font-size="16" font-weight="bold" text-anchor="middle" fill="#27ae60">
      Markov Property
    </text>
    <text x="120" y="580" font-size="13" fill="#2c3e50">
      <tspan x="120" dy="0">Hidden State Evolution:</tspan>
      <tspan x="120" dy="25">• Current state depends only on</tspan>
      <tspan x="130" dy="20">previous state (not full history)</tspan>
      <tspan x="120" dy="25">• P(Hₜ₊₁ | H₁,...,Hₜ) = P(Hₜ₊₁ | Hₜ)</tspan>
      <tspan x="120" dy="25">• Transition probabilities are</tspan>
      <tspan x="130" dy="20">time-homogeneous</tspan>
      <tspan x="120" dy="30">Hidden States capture:</tspan>
      <tspan x="130" dy="20">✓ Latent user preferences</tspan>
      <tspan x="130" dy="20">✓ Unobserved taste profiles</tspan>
      <tspan x="130" dy="20">✓ Temporal preference dynamics</tspan>
    </text>
  </g>
  
  <g id="observation-model">
    <rect x="650" y="520" width="450" height="240" fill="#fff3e0" stroke="#f39c12" stroke-width="2" rx="8"/>
    <text x="875" y="550" font-size="16" font-weight="bold" text-anchor="middle" fill="#f39c12">
      Observation Model
    </text>
    <text x="670" y="580" font-size="13" fill="#2c3e50">
      <tspan x="670" dy="0">Observations (Movie Preferences):</tspan>
      <tspan x="670" dy="25">• Generated based on current</tspan>
      <tspan x="680" dy="20">hidden state</tspan>
      <tspan x="670" dy="25">• P(Oₜ | Hₜ) emission probability</tspan>
      <tspan x="670" dy="25">• Independent given hidden state</tspan>
      <tspan x="670" dy="30">Example:</tspan>
      <tspan x="680" dy="20">If H₁ = "Classic film lover"</tspan>
      <tspan x="680" dy="20">Then P(O₁ = Goodfellas liked) high</tspan>
      <tspan x="680" dy="20">And P(O₂ = Iron Man liked) low</tspan>
    </text>
  </g>
</svg>