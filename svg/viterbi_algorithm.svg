<svg viewBox="0 0 1100 850" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="550" y="35" font-size="26" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Viterbi Algorithm for HMM Inference
  </text>
  
  <!-- Background -->
  <rect x="50" y="60" width="1000" height="750" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2" rx="10"/>
  
  <!-- Problem Statement -->
  <rect x="70" y="80" width="960" height="70" fill="#e8eaf6" stroke="#5C6BC0" stroke-width="2" rx="8"/>
  <text x="550" y="105" font-size="18" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Problem: Find Most Likely State Sequence
  </text>
  <text x="550" y="132" font-size="15" text-anchor="middle" fill="#546e7a">
    Given observations Y₁:T, find X̂₁:T = argmax P(X₁:T | Y₁:T)
  </text>
  
  <!-- Trellis Diagram -->
  <text x="80" y="185" font-size="18" font-weight="bold" fill="#2c3e50">Trellis Diagram (Dynamic Programming)</text>
  <rect x="70" y="200" width="960" height="340" fill="white" stroke="#2196F3" stroke-width="2" rx="8"/>
  
  <!-- Time steps -->
  <text x="180" y="230" font-size="14" font-weight="bold" text-anchor="middle" fill="#666">t=1</text>
  <text x="350" y="230" font-size="14" font-weight="bold" text-anchor="middle" fill="#666">t=2</text>
  <text x="520" y="230" font-size="14" font-weight="bold" text-anchor="middle" fill="#666">t=3</text>
  <text x="690" y="230" font-size="14" font-weight="bold" text-anchor="middle" fill="#666">t=4</text>
  <text x="860" y="230" font-size="14" font-weight="bold" text-anchor="middle" fill="#666">t=T</text>
  
  <!-- State labels -->
  <text x="110" y="285" font-size="13" font-weight="bold" fill="#666">State 1</text>
  <text x="110" y="355" font-size="13" font-weight="bold" fill="#666">State 2</text>
  <text x="110" y="425" font-size="13" font-weight="bold" fill="#666">State 3</text>
  <text x="110" y="495" font-size="13" font-weight="bold" fill="#666">State N</text>
  
  <!-- State nodes at t=1 -->
  <circle cx="180" cy="280" r="18" fill="#90CAF9" stroke="#1976D2" stroke-width="2"/>
  <circle cx="180" cy="350" r="18" fill="#90CAF9" stroke="#1976D2" stroke-width="2"/>
  <circle cx="180" cy="420" r="18" fill="#90CAF9" stroke="#1976D2" stroke-width="2"/>
  <circle cx="180" cy="460" r="3" fill="#666"/>
  <circle cx="180" cy="475" r="3" fill="#666"/>
  <circle cx="180" cy="490" r="18" fill="#90CAF9" stroke="#1976D2" stroke-width="2"/>
  
  <!-- State nodes at t=2 -->
  <circle cx="350" cy="280" r="18" fill="#90CAF9" stroke="#1976D2" stroke-width="2"/>
  <circle cx="350" cy="350" r="18" fill="#90CAF9" stroke="#1976D2" stroke-width="2"/>
  <circle cx="350" cy="420" r="18" fill="#90CAF9" stroke="#1976D2" stroke-width="2"/>
  <circle cx="350" cy="460" r="3" fill="#666"/>
  <circle cx="350" cy="475" r="3" fill="#666"/>
  <circle cx="350" cy="490" r="18" fill="#90CAF9" stroke="#1976D2" stroke-width="2"/>
  
  <!-- State nodes at t=3 -->
  <circle cx="520" cy="280" r="18" fill="#90CAF9" stroke="#1976D2" stroke-width="2"/>
  <circle cx="520" cy="350" r="18" fill="#90CAF9" stroke="#1976D2" stroke-width="2"/>
  <circle cx="520" cy="420" r="18" fill="#90CAF9" stroke="#1976D2" stroke-width="2"/>
  <circle cx="520" cy="460" r="3" fill="#666"/>
  <circle cx="520" cy="475" r="3" fill="#666"/>
  <circle cx="520" cy="490" r="18" fill="#90CAF9" stroke="#1976D2" stroke-width="2"/>
  
  <!-- State nodes at t=4 -->
  <circle cx="690" cy="280" r="18" fill="#90CAF9" stroke="#1976D2" stroke-width="2"/>
  <circle cx="690" cy="350" r="18" fill="#90CAF9" stroke="#1976D2" stroke-width="2"/>
  <circle cx="690" cy="420" r="18" fill="#90CAF9" stroke="#1976D2" stroke-width="2"/>
  <circle cx="690" cy="460" r="3" fill="#666"/>
  <circle cx="690" cy="475" r="3" fill="#666"/>
  <circle cx="690" cy="490" r="18" fill="#90CAF9" stroke="#1976D2" stroke-width="2"/>
  
  <!-- State nodes at t=T -->
  <circle cx="860" cy="280" r="18" fill="#90CAF9" stroke="#1976D2" stroke-width="2"/>
  <circle cx="860" cy="350" r="18" fill="#90CAF9" stroke="#1976D2" stroke-width="2"/>
  <circle cx="860" cy="420" r="18" fill="#90CAF9" stroke="#1976D2" stroke-width="2"/>
  <circle cx="860" cy="460" r="3" fill="#666"/>
  <circle cx="860" cy="475" r="3" fill="#666"/>
  <circle cx="860" cy="490" r="18" fill="#90CAF9" stroke="#1976D2" stroke-width="2"/>
  
  <!-- Sample transitions (showing possible paths) -->
  <line x1="198" y1="280" x2="332" y2="280" stroke="#ccc" stroke-width="1"/>
  <line x1="198" y1="280" x2="332" y2="350" stroke="#ccc" stroke-width="1"/>
  <line x1="198" y1="350" x2="332" y2="280" stroke="#ccc" stroke-width="1"/>
  <line x1="198" y1="350" x2="332" y2="350" stroke="#ccc" stroke-width="1"/>
  <line x1="198" y1="350" x2="332" y2="420" stroke="#ccc" stroke-width="1"/>
  <line x1="198" y1="420" x2="332" y2="350" stroke="#ccc" stroke-width="1"/>
  <line x1="198" y1="420" x2="332" y2="420" stroke="#ccc" stroke-width="1"/>
  
  <line x1="368" y1="280" x2="502" y2="280" stroke="#ccc" stroke-width="1"/>
  <line x1="368" y1="350" x2="502" y2="350" stroke="#ccc" stroke-width="1"/>
  <line x1="368" y1="420" x2="502" y2="420" stroke="#ccc" stroke-width="1"/>
  
  <line x1="538" y1="280" x2="672" y2="280" stroke="#ccc" stroke-width="1"/>
  <line x1="538" y1="350" x2="672" y2="350" stroke="#ccc" stroke-width="1"/>
  <line x1="538" y1="420" x2="672" y2="420" stroke="#ccc" stroke-width="1"/>
  
  <!-- Best path (highlighted) -->
  <line x1="198" y1="350" x2="332" y2="350" stroke="#4CAF50" stroke-width="4"/>
  <line x1="368" y1="350" x2="502" y2="280" stroke="#4CAF50" stroke-width="4"/>
  <line x1="538" y1="280" x2="672" y2="280" stroke="#4CAF50" stroke-width="4"/>
  <line x1="708" y1="280" x2="775" y2="280" stroke="#4CAF50" stroke-width="4"/>
  
  <circle cx="785" cy="280" r="3" fill="#4CAF50"/>
  <circle cx="800" cy="280" r="3" fill="#4CAF50"/>
  <circle cx="815" cy="280" r="3" fill="#4CAF50"/>
  
  <line x1="830" y1="280" x2="842" y2="280" stroke="#4CAF50" stroke-width="4"/>
  
  <!-- Highlight best path nodes -->
  <circle cx="180" cy="350" r="18" fill="#66BB6A" stroke="#2E7D32" stroke-width="3"/>
  <circle cx="350" cy="350" r="18" fill="#66BB6A" stroke="#2E7D32" stroke-width="3"/>
  <circle cx="520" cy="280" r="18" fill="#66BB6A" stroke="#2E7D32" stroke-width="3"/>
  <circle cx="690" cy="280" r="18" fill="#66BB6A" stroke="#2E7D32" stroke-width="3"/>
  <circle cx="860" cy="280" r="18" fill="#66BB6A" stroke="#2E7D32" stroke-width="3"/>
  
  <!-- Algorithm Steps -->
  <rect x="70" y="560" width="960" height="235" fill="#fff3e0" stroke="#FF9800" stroke-width="2" rx="8"/>
  <text x="550" y="585" font-size="18" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Algorithm Steps
  </text>
  
  <!-- Step 1 -->
  <rect x="90" y="600" width="450" height="80" fill="white" stroke="#FF9800" stroke-width="1" rx="5"/>
  <text x="315" y="620" font-size="14" font-weight="bold" text-anchor="middle" fill="#E65100">
    1. Initialization (t=1)
  </text>
  <text x="110" y="642" font-size="12" fill="#333">
    δ₁(i) = π(i) · B(i, Y₁)
  </text>
  <text x="110" y="660" font-size="11" fill="#666">
    For each state i, compute probability of starting
  </text>
  <text x="110" y="674" font-size="11" fill="#666">
    in that state and emitting first observation
  </text>
  
  <!-- Step 2 -->
  <rect x="560" y="600" width="450" height="80" fill="white" stroke="#FF9800" stroke-width="1" rx="5"/>
  <text x="785" y="620" font-size="14" font-weight="bold" text-anchor="middle" fill="#E65100">
    2. Recursion (t=2 to T)
  </text>
  <text x="580" y="642" font-size="12" fill="#333">
    δₜ(j) = max[δₜ₋₁(i) · A(i,j)] · B(j, Yₜ)
  </text>
  <text x="580" y="660" font-size="11" fill="#666">
    For each state j at time t, find best previous state
  </text>
  <text x="580" y="674" font-size="11" fill="#666">
    ψₜ(j) = argmax[δₜ₋₁(i) · A(i,j)] stores best predecessor
  </text>
  
  <!-- Step 3 -->
  <rect x="90" y="695" width="450" height="80" fill="white" stroke="#FF9800" stroke-width="1" rx="5"/>
  <text x="315" y="715" font-size="14" font-weight="bold" text-anchor="middle" fill="#E65100">
    3. Termination
  </text>
  <text x="110" y="737" font-size="12" fill="#333">
    X̂ₜ = argmax δₜ(i)
  </text>
  <text x="110" y="755" font-size="11" fill="#666">
    Find state with highest probability at final time T
  </text>
  <text x="110" y="769" font-size="11" fill="#666">
    P* = max δₜ(i) gives the probability of best path
  </text>
  
  <!-- Step 4 -->
  <rect x="560" y="695" width="450" height="80" fill="white" stroke="#FF9800" stroke-width="1" rx="5"/>
  <text x="785" y="715" font-size="14" font-weight="bold" text-anchor="middle" fill="#E65100">
    4. Backtracking (t=T-1 to 1)
  </text>
  <text x="580" y="737" font-size="12" fill="#333">
    X̂ₜ = ψₜ₊₁(X̂ₜ₊₁)
  </text>
  <text x="580" y="755" font-size="11" fill="#666">
    Follow pointers backward to reconstruct optimal
  </text>
  <text x="580" y="769" font-size="11" fill="#666">
    state sequence (green path in diagram above)
  </text>
  
</svg>