<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .node { fill: #4A90E2; stroke: #2E5D8A; stroke-width: 2; }
      .input-node { fill: #7ED321; stroke: #5AA016; }
      .output-node { fill: #F5A623; stroke: #D1890B; }
      .connection { stroke: #333; stroke-width: 1.5; opacity: 0.6; }
      .thick-connection { stroke: #E74C3C; stroke-width: 3; opacity: 0.8; }
      .layer-label { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; fill: #333; }
      .node-label { font-family: Arial, sans-serif; font-size: 12px; text-anchor: middle; fill: white; font-weight: bold; }
      .equation { font-family: Arial, sans-serif; font-size: 14px; text-anchor: middle; fill: #333; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>
  
  <!-- Layer Labels -->
  <text x="100" y="30" class="layer-label">Input Layer</text>
  <text x="300" y="30" class="layer-label">Hidden Layer 1</text>
  <text x="500" y="30" class="layer-label">Hidden Layer 2</text>
  <text x="700" y="30" class="layer-label">Output Layer</text>
  
  <!-- Input Layer Nodes -->
  <circle cx="100" cy="100" r="20" class="node input-node"/>
  <text x="100" y="105" class="node-label">x₁</text>
  <circle cx="100" cy="180" r="20" class="node input-node"/>
  <text x="100" y="185" class="node-label">x₂</text>
  <circle cx="100" cy="260" r="20" class="node input-node"/>
  <text x="100" y="265" class="node-label">x₃</text>
  <circle cx="100" cy="340" r="20" class="node input-node"/>
  <text x="100" y="345" class="node-label">xₙ</text>
  
  <!-- Dots between x3 and xn -->
  <circle cx="100" cy="300" r="3" fill="#666"/>
  <circle cx="100" cy="310" r="3" fill="#666"/>
  <circle cx="100" cy="320" r="3" fill="#666"/>
  
  <!-- Hidden Layer 1 Nodes -->
  <circle cx="300" cy="80" r="18" class="node"/>
  <text x="300" y="85" class="node-label">h₁¹</text>
  <circle cx="300" cy="140" r="18" class="node"/>
  <text x="300" y="145" class="node-label">h₂¹</text>
  <circle cx="300" cy="200" r="18" class="node"/>
  <text x="300" y="205" class="node-label">h₃¹</text>
  <circle cx="300" cy="260" r="18" class="node"/>
  <text x="300" y="265" class="node-label">h₄¹</text>
  <circle cx="300" cy="320" r="18" class="node"/>
  <text x="300" y="325" class="node-label">h₅¹</text>
  <circle cx="300" cy="380" r="18" class="node"/>
  <text x="300" y="385" class="node-label">h₆¹</text>
  
  <!-- Hidden Layer 2 Nodes -->
  <circle cx="500" cy="120" r="18" class="node"/>
  <text x="500" y="125" class="node-label">h₁²</text>
  <circle cx="500" cy="180" r="18" class="node"/>
  <text x="500" y="185" class="node-label">h₂²</text>
  <circle cx="500" cy="240" r="18" class="node"/>
  <text x="500" y="245" class="node-label">h₃²</text>
  <circle cx="500" cy="300" r="18" class="node"/>
  <text x="500" y="305" class="node-label">h₄²</text>
  
  <!-- Output Layer Node -->
  <circle cx="700" cy="220" r="20" class="node output-node"/>
  <text x="700" y="225" class="node-label">ŷ</text>
  
  <!-- Connections from Input to Hidden Layer 1 -->
  <!-- From x1 -->
  <line x1="120" y1="100" x2="282" y2="80" class="connection"/>
  <line x1="120" y1="100" x2="282" y2="140" class="connection"/>
  <line x1="120" y1="100" x2="282" y2="200" class="connection"/>
  <line x1="120" y1="100" x2="282" y2="260" class="connection"/>
  <line x1="120" y1="100" x2="282" y2="320" class="connection"/>
  <line x1="120" y1="100" x2="282" y2="380" class="connection"/>
  
  <!-- From x2 -->
  <line x1="120" y1="180" x2="282" y2="80" class="connection"/>
  <line x1="120" y1="180" x2="282" y2="140" class="connection"/>
  <line x1="120" y1="180" x2="282" y2="200" class="connection"/>
  <line x1="120" y1="180" x2="282" y2="260" class="connection"/>
  <line x1="120" y1="180" x2="282" y2="320" class="connection"/>
  <line x1="120" y1="180" x2="282" y2="380" class="connection"/>
  
  <!-- From x3 -->
  <line x1="120" y1="260" x2="282" y2="80" class="connection"/>
  <line x1="120" y1="260" x2="282" y2="140" class="connection"/>
  <line x1="120" y1="260" x2="282" y2="200" class="thick-connection"/>
  <line x1="120" y1="260" x2="282" y2="260" class="connection"/>
  <line x1="120" y1="260" x2="282" y2="320" class="connection"/>
  <line x1="120" y1="260" x2="282" y2="380" class="connection"/>
  
  <!-- From xn -->
  <line x1="120" y1="340" x2="282" y2="80" class="connection"/>
  <line x1="120" y1="340" x2="282" y2="140" class="connection"/>
  <line x1="120" y1="340" x2="282" y2="200" class="connection"/>
  <line x1="120" y1="340" x2="282" y2="260" class="connection"/>
  <line x1="120" y1="340" x2="282" y2="320" class="connection"/>
  <line x1="120" y1="340" x2="282" y2="380" class="connection"/>
  
  <!-- Connections from Hidden Layer 1 to Hidden Layer 2 -->
  <!-- Sample connections to show complexity -->
  <line x1="318" y1="80" x2="482" y2="120" class="connection"/>
  <line x1="318" y1="80" x2="482" y2="180" class="connection"/>
  <line x1="318" y1="140" x2="482" y2="120" class="connection"/>
  <line x1="318" y1="140" x2="482" y2="240" class="connection"/>
  <line x1="318" y1="200" x2="482" y2="180" class="thick-connection"/>
  <line x1="318" y1="200" x2="482" y2="240" class="connection"/>
  <line x1="318" y1="200" x2="482" y2="300" class="connection"/>
  <line x1="318" y1="260" x2="482" y2="120" class="connection"/>
  <line x1="318" y1="260" x2="482" y2="300" class="connection"/>
  <line x1="318" y1="320" x2="482" y2="240" class="connection"/>
  <line x1="318" y1="380" x2="482" y2="300" class="connection"/>
  
  <!-- Connections from Hidden Layer 2 to Output -->
  <line x1="520" y1="120" x2="680" y2="220" class="connection"/>
  <line x1="520" y1="180" x2="680" y2="220" class="thick-connection"/>
  <line x1="520" y1="240" x2="680" y2="220" class="connection"/>
  <line x1="520" y1="300" x2="680" y2="220" class="connection"/>
  
  <!-- Weight annotations -->
  <text x="200" y="50" class="equation">W¹ᵢⱼ</text>
  <text x="400" y="50" class="equation">W²ᵢⱼ</text>
  <text x="600" y="50" class="equation">W³ᵢⱼ</text>
  
  <!-- Path highlighting annotation -->
  <text x="400" y="450" class="equation" style="font-weight: bold; fill: #E74C3C;">Multiple paths from input to output</text>
  <text x="400" y="470" class="equation" style="font-size: 12px;">Chain rule accounts for all paths efficiently</text>
  
  <!-- Function notation -->
  <text x="700" y="270" class="equation">F(x; θ)</text>
</svg>