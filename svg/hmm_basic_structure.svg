<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="500" y="35" font-size="26" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Hidden Markov Model - Basic Structure
  </text>
  
  <!-- Background -->
  <rect x="50" y="60" width="900" height="500" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2" rx="10"/>
  
  <!-- Hidden Layer Label -->
  <text x="100" y="110" font-size="18" font-weight="bold" fill="#2c3e50">Hidden States (X)</text>
  <rect x="90" y="130" width="820" height="140" fill="#e3f2fd" stroke="#2196F3" stroke-width="2" rx="8"/>
  
  <!-- Hidden States -->
  <circle cx="200" cy="200" r="35" fill="#2196F3" stroke="#1565C0" stroke-width="3"/>
  <text x="200" y="207" font-size="18" font-weight="bold" text-anchor="middle" fill="white">X₁</text>
  
  <circle cx="380" cy="200" r="35" fill="#2196F3" stroke="#1565C0" stroke-width="3"/>
  <text x="380" y="207" font-size="18" font-weight="bold" text-anchor="middle" fill="white">X₂</text>
  
  <circle cx="560" cy="200" r="35" fill="#2196F3" stroke="#1565C0" stroke-width="3"/>
  <text x="560" y="207" font-size="18" font-weight="bold" text-anchor="middle" fill="white">X₃</text>
  
  <circle cx="740" cy="200" r="35" fill="#2196F3" stroke="#1565C0" stroke-width="3"/>
  <text x="740" y="207" font-size="18" font-weight="bold" text-anchor="middle" fill="white">Xₜ</text>
  
  <!-- Transitions between hidden states -->
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/>
    </marker>
  </defs>
  
  <path d="M 235 200 L 345 200" stroke="#1565C0" stroke-width="3" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="290" y="185" font-size="14" font-weight="bold" text-anchor="middle" fill="#1565C0">A</text>
  
  <path d="M 415 200 L 525 200" stroke="#1565C0" stroke-width="3" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="470" y="185" font-size="14" font-weight="bold" text-anchor="middle" fill="#1565C0">A</text>
  
  <path d="M 595 200 L 705 200" stroke="#1565C0" stroke-width="3" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="650" y="185" font-size="14" font-weight="bold" text-anchor="middle" fill="#1565C0">A</text>
  
  <!-- Dots for continuation -->
  <circle cx="820" cy="200" r="4" fill="#1565C0"/>
  <circle cx="840" cy="200" r="4" fill="#1565C0"/>
  <circle cx="860" cy="200" r="4" fill="#1565C0"/>
  
  <!-- Observable Layer Label -->
  <text x="100" y="330" font-size="18" font-weight="bold" fill="#2c3e50">Observations (Y)</text>
  <rect x="90" y="350" width="820" height="140" fill="#fff3e0" stroke="#FF9800" stroke-width="2" rx="8"/>
  
  <!-- Observable States -->
  <circle cx="200" cy="420" r="35" fill="#FF9800" stroke="#F57C00" stroke-width="3"/>
  <text x="200" y="427" font-size="18" font-weight="bold" text-anchor="middle" fill="white">Y₁</text>
  
  <circle cx="380" cy="420" r="35" fill="#FF9800" stroke="#F57C00" stroke-width="3"/>
  <text x="380" y="427" font-size="18" font-weight="bold" text-anchor="middle" fill="white">Y₂</text>
  
  <circle cx="560" cy="420" r="35" fill="#FF9800" stroke="#F57C00" stroke-width="3"/>
  <text x="560" y="427" font-size="18" font-weight="bold" text-anchor="middle" fill="white">Y₃</text>
  
  <circle cx="740" cy="420" r="35" fill="#FF9800" stroke="#F57C00" stroke-width="3"/>
  <text x="740" y="427" font-size="18" font-weight="bold" text-anchor="middle" fill="white">Yₜ</text>
  
  <!-- Emissions from hidden to observable -->
  <defs>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#F57C00"/>
    </marker>
  </defs>
  
  <path d="M 200 235 L 200 385" stroke="#F57C00" stroke-width="3" fill="none" marker-end="url(#arrowOrange)"/>
  <text x="215" y="315" font-size="14" font-weight="bold" fill="#F57C00">B</text>
  
  <path d="M 380 235 L 380 385" stroke="#F57C00" stroke-width="3" fill="none" marker-end="url(#arrowOrange)"/>
  <text x="395" y="315" font-size="14" font-weight="bold" fill="#F57C00">B</text>
  
  <path d="M 560 235 L 560 385" stroke="#F57C00" stroke-width="3" fill="none" marker-end="url(#arrowOrange)"/>
  <text x="575" y="315" font-size="14" font-weight="bold" fill="#F57C00">B</text>
  
  <path d="M 740 235 L 740 385" stroke="#F57C00" stroke-width="3" fill="none" marker-end="url(#arrowOrange)"/>
  <text x="755" y="315" font-size="14" font-weight="bold" fill="#F57C00">B</text>
  
  <!-- Dots for continuation -->
  <circle cx="820" cy="420" r="4" fill="#F57C00"/>
  <circle cx="840" cy="420" r="4" fill="#F57C00"/>
  <circle cx="860" cy="420" r="4" fill="#F57C00"/>
  
  <!-- Legend -->
  <rect x="100" y="510" width="800" height="35" fill="white" stroke="#dee2e6" stroke-width="1" rx="5"/>
  
  <text x="120" y="532" font-size="14" font-weight="bold" fill="#2c3e50">Legend:</text>
  <text x="200" y="532" font-size="13" fill="#1565C0">A = Transition Probabilities</text>
  <text x="420" y="532" font-size="13" fill="#F57C00">B = Emission Probabilities</text>
  <text x="640" y="532" font-size="13" fill="#2c3e50">π = Initial Distribution</text>
  
</svg>