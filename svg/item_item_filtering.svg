<svg viewBox="0 0 1100 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1100" height="800" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="550" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Item-Item Collaborative Filtering
  </text>
  
  <text x="550" y="60" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#7f8c8d" font-style="italic">
    "Because you liked X, you might like Y..."
  </text>
  
  <!-- User-Item Rating Matrix -->
  <g transform="translate(50, 100)">
    <text x="200" y="-10" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#34495e">
      User-Item Rating Matrix
    </text>
    
    <!-- Matrix headers -->
    <text x="0" y="30" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#34495e">Users</text>
    <text x="120" y="10" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#34495e">Item 1</text>
    <text x="180" y="10" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#34495e">Item 2</text>
    <text x="240" y="10" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#f39c12">Item 3</text>
    <text x="300" y="10" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#34495e">Item 4</text>
    <text x="360" y="10" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#34495e">Item 5</text>
    
    <!-- Target Item 3 column highlight -->
    <rect x="235" y="20" width="50" height="160" fill="#fff3cd" stroke="#f39c12" stroke-width="3" stroke-dasharray="5,5"/>
    
    <!-- Alice (Target User) -->
    <rect x="0" y="20" width="400" height="40" fill="#e8f8f5" stroke="#27ae60" stroke-width="3"/>
    <text x="10" y="45" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#27ae60">Alice (Target)</text>
    <rect x="110" y="25" width="50" height="30" fill="#ebf5fb" stroke="#3498db" stroke-width="2"/>
    <text x="135" y="45" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#3498db" font-weight="bold">5</text>
    <rect x="170" y="25" width="50" height="30" fill="#ebf5fb" stroke="#3498db" stroke-width="2"/>
    <text x="195" y="45" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#3498db" font-weight="bold">3</text>
    <text x="260" y="45" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#e74c3c" font-weight="bold">?</text>
    <rect x="290" y="25" width="50" height="30" fill="#ebf5fb" stroke="#3498db" stroke-width="2"/>
    <text x="315" y="45" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#3498db" font-weight="bold">4</text>
    <rect x="350" y="25" width="50" height="30" fill="#ebf5fb" stroke="#3498db" stroke-width="2"/>
    <text x="375" y="45" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#3498db" font-weight="bold">2</text>
    
    <!-- Bob -->
    <rect x="0" y="60" width="400" height="40" fill="white" stroke="#bdc3c7" stroke-width="1"/>
    <text x="10" y="85" font-family="Arial, sans-serif" font-size="11" fill="#34495e">Bob</text>
    <text x="135" y="85" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">5</text>
    <text x="195" y="85" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">4</text>
    <text x="260" y="85" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">4</text>
    <text x="315" y="85" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">5</text>
    <text x="375" y="85" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">1</text>
    
    <!-- Carol -->
    <rect x="0" y="100" width="400" height="40" fill="white" stroke="#bdc3c7" stroke-width="1"/>
    <text x="10" y="125" font-family="Arial, sans-serif" font-size="11" fill="#34495e">Carol</text>
    <text x="135" y="125" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">4</text>
    <text x="195" y="125" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">3</text>
    <text x="260" y="125" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">5</text>
    <text x="315" y="125" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">4</text>
    <text x="375" y="125" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">3</text>
    
    <!-- Dave -->
    <rect x="0" y="140" width="400" height="40" fill="white" stroke="#bdc3c7" stroke-width="1"/>
    <text x="10" y="165" font-family="Arial, sans-serif" font-size="11" fill="#34495e">Dave</text>
    <text x="135" y="165" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">1</text>
    <text x="195" y="165" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">2</text>
    <text x="260" y="165" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">1</text>
    <text x="315" y="165" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">2</text>
    <text x="375" y="165" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">5</text>
    
    <!-- Alice's rated items highlight -->
    <text x="135" y="200" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#3498db">Alice rated</text>
    <text x="195" y="200" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#3498db">Alice rated</text>
    <text x="315" y="200" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#3498db">Alice rated</text>
    <text x="375" y="200" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#3498db">Alice rated</text>
  </g>
  
  <!-- Step-by-step process -->
  <g transform="translate(500, 100)">
    <text x="250" y="-10" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#34495e">
      Prediction Process
    </text>
    
    <!-- Step 1 -->
    <g transform="translate(0, 10)">
      <circle cx="20" cy="20" r="15" fill="#3498db"/>
      <text x="20" y="26" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">1</text>
      <rect x="45" y="5" width="505" height="45" fill="white" stroke="#3498db" stroke-width="2" rx="5"/>
      <text x="55" y="23" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#3498db">
        Find items Alice has rated
      </text>
      <text x="55" y="40" font-family="Arial, sans-serif" font-size="10" fill="#34495e">
        Alice rated Items 1, 2, 4, and 5 (but not Item 3)
      </text>
    </g>
    
    <!-- Step 2 -->
    <g transform="translate(0, 70)">
      <circle cx="20" cy="20" r="15" fill="#27ae60"/>
      <text x="20" y="26" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">2</text>
      <rect x="45" y="5" width="505" height="75" fill="white" stroke="#27ae60" stroke-width="2" rx="5"/>
      <text x="55" y="23" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#27ae60">
        Calculate similarity between Item 3 and Alice's items
      </text>
      <text x="55" y="42" font-family="Arial, sans-serif" font-size="10" fill="#34495e">
        sim(Item 3, Item 1) = 0.88 (high similarity)
      </text>
      <text x="55" y="57" font-family="Arial, sans-serif" font-size="10" fill="#34495e">
        sim(Item 3, Item 2) = 0.72 (moderate similarity)
      </text>
      <text x="55" y="72" font-family="Arial, sans-serif" font-size="10" fill="#34495e">
        sim(Item 3, Item 4) = 0.95 (very high similarity)
      </text>
    </g>
    
    <!-- Step 3 -->
    <g transform="translate(0, 160)">
      <circle cx="20" cy="20" r="15" fill="#f39c12"/>
      <text x="20" y="26" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">3</text>
      <rect x="45" y="5" width="505" height="45" fill="white" stroke="#f39c12" stroke-width="2" rx="5"/>
      <text x="55" y="23" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#f39c12">
        Select k most similar items (k=3)
      </text>
      <text x="55" y="40" font-family="Arial, sans-serif" font-size="10" fill="#34495e">
        Choose Items 1, 2, and 4 based on highest similarity
      </text>
    </g>
    
    <!-- Step 4 -->
    <g transform="translate(0, 220)">
      <circle cx="20" cy="20" r="15" fill="#9b59b6"/>
      <text x="20" y="26" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">4</text>
      <rect x="45" y="5" width="505" height="75" fill="white" stroke="#9b59b6" stroke-width="2" rx="5"/>
      <text x="55" y="23" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#9b59b6">
        Compute weighted average using Alice's ratings
      </text>
      <text x="55" y="45" font-family="Arial, sans-serif" font-size="10" fill="#34495e">
        Predicted = (0.88×5 + 0.72×3 + 0.95×4) / (0.88 + 0.72 + 0.95)
      </text>
      <text x="55" y="60" font-family="Arial, sans-serif" font-size="10" fill="#34495e">
        = (4.4 + 2.16 + 3.8) / 2.55 = 4.08
      </text>
    </g>
  </g>
  
  <!-- Visual representation of item similarity -->
  <g transform="translate(50, 380)">
    <text x="250" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#34495e">
      Item Similarity Network
    </text>
    
    <!-- Target Item 3 -->
    <rect x="210" y="60" width="80" height="80" fill="#f39c12" opacity="0.3" stroke="#f39c12" stroke-width="3" rx="5"/>
    <text x="250" y="95" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#f39c12">Item 3</text>
    <text x="250" y="110" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#f39c12">(Target)</text>
    <text x="250" y="125" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#e74c3c">Rating: ?</text>
    
    <!-- Similar Item 1 -->
    <rect x="60" y="180" width="70" height="70" fill="#3498db" opacity="0.3" stroke="#3498db" stroke-width="2" rx="5"/>
    <text x="95" y="210" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#3498db">Item 1</text>
    <text x="95" y="225" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#27ae60">Alice: 5★</text>
    
    <!-- Similar Item 2 -->
    <rect x="215" y="180" width="70" height="70" fill="#3498db" opacity="0.3" stroke="#3498db" stroke-width="2" rx="5"/>
    <text x="250" y="210" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#3498db">Item 2</text>
    <text x="250" y="225" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#27ae60">Alice: 3★</text>
    
    <!-- Similar Item 4 -->
    <rect x="370" y="180" width="70" height="70" fill="#3498db" opacity="0.3" stroke="#3498db" stroke-width="2" rx="5"/>
    <text x="405" y="210" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#3498db">Item 4</text>
    <text x="405" y="225" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#27ae60">Alice: 4★</text>
    
    <!-- Dissimilar Item 5 -->
    <rect x="215" y="270" width="70" height="60" fill="#95a5a6" opacity="0.2" stroke="#95a5a6" stroke-width="1" stroke-dasharray="3,3" rx="5"/>
    <text x="250" y="295" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">Item 5</text>
    <text x="250" y="310" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#7f8c8d">Alice: 2★</text>
    
    <!-- Similarity connections -->
    <line x1="230" y1="140" x2="110" y2="180" stroke="#27ae60" stroke-width="3"/>
    <text x="155" y="155" font-family="Arial, sans-serif" font-size="10" fill="#27ae60" font-weight="bold">0.88</text>
    
    <line x1="250" y1="140" x2="250" y2="180" stroke="#27ae60" stroke-width="3"/>
    <text x="260" y="165" font-family="Arial, sans-serif" font-size="10" fill="#27ae60" font-weight="bold">0.72</text>
    
    <line x1="270" y1="140" x2="390" y2="180" stroke="#27ae60" stroke-width="3"/>
    <text x="345" y="155" font-family="Arial, sans-serif" font-size="10" fill="#27ae60" font-weight="bold">0.95</text>
    
    <line x1="250" y1="140" x2="250" y2="270" stroke="#95a5a6" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="260" y="205" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">0.28</text>
  </g>
  
  <!-- Formula box -->
  <g transform="translate(550, 380)">
    <rect x="0" y="0" width="500" height="200" fill="white" stroke="#f39c12" stroke-width="2" rx="8"/>
    <text x="250" y="30" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#f39c12">
      Item-Based Prediction Formula
    </text>
    
    <text x="250" y="60" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#34495e">
      r̂(Alice, Item 3) = Σ sim(Item 3, i) × r(Alice, i) / Σ |sim(Item 3, i)|
    </text>
    
    <text x="250" y="95" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Key Advantages:
    </text>
    
    <circle cx="30" cy="118" r="3" fill="#27ae60"/>
    <text x="40" y="122" font-family="Arial, sans-serif" font-size="10" fill="#34495e">
      Item similarities are more stable over time
    </text>
    
    <circle cx="30" cy="138" r="3" fill="#27ae60"/>
    <text x="40" y="142" font-family="Arial, sans-serif" font-size="10" fill="#34495e">
      Can precompute item similarities offline
    </text>
    
    <circle cx="30" cy="158" r="3" fill="#27ae60"/>
    <text x="40" y="162" font-family="Arial, sans-serif" font-size="10" fill="#34495e">
      Better scalability for large user bases
    </text>
    
    <circle cx="30" cy="178" r="3" fill="#27ae60"/>
    <text x="40" y="182" font-family="Arial, sans-serif" font-size="10" fill="#34495e">
      Easier to explain: "You liked X, so you'll like Y"
    </text>
  </g>
  
  <!-- Bottom insight box -->
  <g transform="translate(100, 620)">
    <rect x="0" y="0" width="900" height="120" fill="#d5f4e6" stroke="#27ae60" stroke-width="2" rx="8"/>
    <text x="450" y="30" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#27ae60">
      💡 How Item-Item CF Works
    </text>
    
    <text x="450" y="55" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">
      Alice hasn't rated Item 3, but we know she rated Items 1, 2, and 4 highly.
    </text>
    <text x="450" y="73" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">
      Since Item 3 is very similar to Item 4 (0.95), similar to Item 1 (0.88), and moderately similar to Item 2 (0.72),
    </text>
    <text x="450" y="91" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">
      we predict Alice would rate Item 3 as 4.08★ based on her ratings of these similar items.
    </text>
  </g>
</svg>