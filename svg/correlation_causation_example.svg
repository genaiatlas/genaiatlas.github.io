<svg width="900" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #333; }
      .subtitle { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #333; }
      .label { font-family: Arial, sans-serif; font-size: 12px; fill: #333; }
      .small-label { font-family: Arial, sans-serif; font-size: 10px; fill: #333; }
      .axis { stroke: #333; stroke-width: 2; }
      .grid { stroke: #ddd; stroke-width: 0.5; }
      .correlation-line { stroke: #2196f3; stroke-width: 3; fill: none; }
      .causation-arrow { stroke: #f44336; stroke-width: 3; fill: none; marker-end: url(#causal-arrow); }
      .correlation-arrow { stroke: #2196f3; stroke-width: 2; fill: none; marker-end: url(#corr-arrow); stroke-dasharray: 5,5; }
      .ice-cream { fill: #ffb3e6; stroke: #e91e63; stroke-width: 2; }
      .ac-sales { fill: #b3e5fc; stroke: #03a9f4; stroke-width: 2; }
      .temperature { fill: #ffcc80; stroke: #ff9800; stroke-width: 2; }
      .point { fill: #666; }
      .warning-box { fill: #fff3e0; stroke: #ff9800; stroke-width: 2; rx: 5; }
      .example-box { fill: #f3e5f5; stroke: #9c27b0; stroke-width: 2; rx: 5; }
    </style>
    <marker id="causal-arrow" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#f44336" />
    </marker>
    <marker id="corr-arrow" markerWidth="10" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#2196f3" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" class="title">Correlation vs Causation: The Ice Cream Example</text>
  
  <!-- Section 1: Correlation Plot -->
  <g>
    <text x="200" y="70" text-anchor="middle" class="subtitle">Observed Correlation</text>
    
    <!-- Chart area -->
    <rect x="50" y="80" width="300" height="150" fill="#fafafa" stroke="#ddd" />
    
    <!-- Axes -->
    <line x1="50" y1="230" x2="350" y2="230" class="axis" />
    <line x1="50" y1="80" x2="50" y2="230" class="axis" />
    
    <!-- Data points -->
    <circle cx="80" cy="210" r="3" class="point" />
    <circle cx="120" cy="180" r="3" class="point" />
    <circle cx="160" cy="150" r="3" class="point" />
    <circle cx="200" cy="120" r="3" class="point" />
    <circle cx="240" cy="100" r="3" class="point" />
    <circle cx="280" cy="90" r="3" class="point" />
    <circle cx="320" cy="85" r="3" class="point" />
    
    <!-- Trend line -->
    <line x1="70" y1="220" x2="330" y2="80" class="correlation-line" />
    
    <!-- Labels -->
    <text x="200" y="250" text-anchor="middle" class="label">Ice Cream Sales</text>
    <text x="30" y="155" text-anchor="middle" class="label" transform="rotate(-90 30 155)">AC Sales</text>
    <text x="270" y="110" class="label" font-weight="bold">r = 0.85</text>
  </g>
  
  <!-- Section 2: Wrong Conclusion -->
  <g>
    <rect x="450" y="80" width="400" height="150" class="warning-box" />
    <text x="650" y="110" text-anchor="middle" class="subtitle">❌ Wrong Conclusion</text>
    <text x="650" y="140" text-anchor="middle" class="label">"Ice cream sales cause AC sales"</text>
    <text x="650" y="160" text-anchor="middle" class="label">OR</text>
    <text x="650" y="180" text-anchor="middle" class="label">"AC sales cause ice cream sales"</text>
    <text x="650" y="210" text-anchor="middle" class="small-label" font-weight="bold">Correlation ≠ Causation!</text>
  </g>
  
  <!-- Section 3: Confounding Variable Explanation -->
  <g>
    <text x="450" y="290" text-anchor="middle" class="subtitle">The Real Explanation: Confounding Variable</text>
    
    <!-- Hot Weather (top center) -->
    <ellipse cx="450" cy="330" rx="80" ry="25" class="temperature" />
    <text x="450" y="326" text-anchor="middle" class="label" font-weight="bold">Hot Weather</text>
    <text x="450" y="338" text-anchor="middle" class="small-label">(Confounding Variable)</text>
    
    <!-- Ice Cream Sales (bottom left) -->
    <ellipse cx="250" cy="420" rx="70" ry="25" class="ice-cream" />
    <text x="250" y="416" text-anchor="middle" class="label" font-weight="bold">Ice Cream</text>
    <text x="250" y="428" text-anchor="middle" class="small-label">Sales</text>
    
    <!-- AC Sales (bottom right) -->
    <ellipse cx="650" cy="420" rx="70" ry="25" class="ac-sales" />
    <text x="650" y="424" text-anchor="middle" class="label" font-weight="bold">AC Sales</text>
    
    <!-- Causal arrows -->
    <line x1="400" y1="350" x2="300" y2="400" class="causation-arrow" />
    <line x1="500" y1="350" x2="600" y2="400" class="causation-arrow" />
    
    <!-- Correlation arrow -->
    <line x1="320" y1="420" x2="580" y2="420" class="correlation-arrow" />
    
    <!-- Labels -->
    <text x="340" y="375" class="small-label" fill="#f44336">Causes</text>
    <text x="560" y="375" class="small-label" fill="#f44336">Causes</text>
    <text x="450" y="405" class="small-label" fill="#2196f3">Correlates (not causal)</text>
  </g>
  
  <!-- Section 4: Examples -->
  <g>
    <rect x="50" y="480" width="800" height="160" class="example-box" />
    <text x="450" y="510" text-anchor="middle" class="subtitle">More Examples of Correlation vs Causation</text>
    
    <!-- Example 1 -->
    <text x="80" y="540" class="label" font-weight="bold">1. Shoe Size ↔ Reading Ability</text>
    <text x="100" y="555" class="small-label">• Correlation: Larger shoes → better reading</text>
    <text x="100" y="570" class="small-label">• Confounding: Age (older children have both)</text>
    <text x="100" y="585" class="small-label">• Reality: No causal relationship</text>
    
    <!-- Example 2 -->
    <text x="480" y="540" class="label" font-weight="bold">2. Divorce Rate ↔ Margarine Consumption</text>
    <text x="500" y="555" class="small-label">• Correlation: 99.26% (spurious!)</text>
    <text x="500" y="570" class="small-label">• Reality: Random coincidence</text>
    <text x="500" y="585" class="small-label">• Lesson: High correlation can be meaningless</text>
    
    <!-- Guidelines -->
    <text x="80" y="615" class="label" font-weight="bold" fill="#4caf50">Establish Causation:</text>
    <text x="100" y="630" class="small-label">✓ Controlled experiments ✓ Temporal precedence ✓ Rule out alternatives</text>
    
    <text x="480" y="615" class="label" font-weight="bold" fill="#f44336">Red Flags:</text>
    <text x="500" y="630" class="small-label">⚠️ No controls ⚠️ No confounding discussion ⚠️ Correlation claims</text>
  </g>
  
  <!-- Section 5: Key Takeaways -->
  <g>
    <rect x="50" y="680" width="800" height="80" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2" rx="5" />
    <text x="450" y="710" text-anchor="middle" class="subtitle">Key Takeaway</text>
    <text x="450" y="735" text-anchor="middle" class="label">Always question whether correlation implies causation - look for confounding variables!</text>
    <text x="450" y="750" text-anchor="middle" class="small-label">Correlation can suggest relationships to investigate, but only controlled experiments establish causation.</text>
  </g>
</svg>