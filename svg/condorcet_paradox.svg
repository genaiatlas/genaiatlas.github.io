<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#E74C3C"/>
    </marker>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    The Condorcet Paradox
  </text>
  <text x="400" y="70" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#666">
    Circular Preferences in Pairwise Comparisons
  </text>
  
  <!-- Three Options Circle -->
  <g transform="translate(400, 300)">
    <!-- Option A -->
    <circle cx="0" cy="-120" r="50" fill="#3498db" stroke="#2980b9" stroke-width="3" filter="url(#shadow)"/>
    <text x="0" y="-115" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="white">A</text>
    
    <!-- Option B -->
    <circle cx="104" cy="60" r="50" fill="#e67e22" stroke="#d35400" stroke-width="3" filter="url(#shadow)"/>
    <text x="104" y="65" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="white">B</text>
    
    <!-- Option C -->
    <circle cx="-104" cy="60" r="50" fill="#27ae60" stroke="#229954" stroke-width="3" filter="url(#shadow)"/>
    <text x="-104" y="65" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="white">C</text>
    
    <!-- Arrows showing cycle -->
    <!-- A > B -->
    <path d="M 30 -80 Q 70 -30 70 20" fill="none" stroke="#E74C3C" stroke-width="3" marker-end="url(#arrow2)"/>
    <text x="65" y="-30" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#E74C3C">A &gt; B</text>
    
    <!-- B > C -->
    <path d="M 50 60 L -50 60" fill="none" stroke="#E74C3C" stroke-width="3" marker-end="url(#arrow2)"/>
    <text x="0" y="80" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#E74C3C">B &gt; C</text>
    
    <!-- C > A -->
    <path d="M -70 20 Q -70 -30 -30 -80" fill="none" stroke="#E74C3C" stroke-width="3" marker-end="url(#arrow2)"/>
    <text x="-75" y="-30" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#E74C3C">C &gt; A</text>
  </g>
  
  <!-- Voting preferences -->
  <g transform="translate(100, 150)">
    <rect x="0" y="0" width="180" height="100" rx="5" fill="white" stroke="#ddd" stroke-width="1"/>
    <text x="90" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">
      Voting Preferences
    </text>
    <text x="10" y="50" font-family="Arial, sans-serif" font-size="13" fill="#666">Vote 1: A &gt; B</text>
    <text x="10" y="70" font-family="Arial, sans-serif" font-size="13" fill="#666">Vote 2: B &gt; C</text>
    <text x="10" y="90" font-family="Arial, sans-serif" font-size="13" fill="#666">Vote 3: C &gt; A</text>
  </g>
  
  <!-- Paradox explanation -->
  <g transform="translate(520, 150)">
    <rect x="0" y="0" width="180" height="100" rx="5" fill="white" stroke="#ddd" stroke-width="1"/>
    <text x="90" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">
      The Problem
    </text>
    <text x="10" y="50" font-family="Arial, sans-serif" font-size="13" fill="#666">No clear winner!</text>
    <text x="10" y="70" font-family="Arial, sans-serif" font-size="13" fill="#666">Cycle: A→B→C→A</text>
    <text x="10" y="90" font-family="Arial, sans-serif" font-size="13" fill="#666">Linear order impossible</text>
  </g>
  
  <!-- Resolution with Rank Centrality -->
  <g transform="translate(200, 450)">
    <rect x="0" y="0" width="400" height="100" rx="10" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2"/>
    <text x="200" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Resolution via Rank Centrality
    </text>
    <text x="200" y="55" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#34495e">
      In perfect cycles: Score(A) = Score(B) = Score(C) = 0.5
    </text>
    <text x="200" y="80" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#34495e">
      Real data: Weighted scores break the tie
    </text>
  </g>
</svg>