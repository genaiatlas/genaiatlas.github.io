<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="900" fill="#f8f9fa"/>
  <text x="600" y="40" font-family="Arial" font-size="28" font-weight="bold" text-anchor="middle">Semantic Routing: Embedding Similarity</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" fill="#495057"/></marker></defs>
  
  <rect x="300" y="80" width="600" height="70" rx="10" fill="#fff3bf" stroke="#f59f00" stroke-width="3"/>
  <text x="600" y="110" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">User Query</text>
  <text x="600" y="132" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic">"How can I improve team collaboration?"</text>
  
  <line x1="600" y1="150" x2="600" y2="185" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  
  <rect x="350" y="195" width="500" height="60" rx="10" fill="#9333ea" stroke="#7950f2" stroke-width="3"/>
  <text x="600" y="230" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Embed Query with Embedding Model</text>
  
  <line x1="600" y1="255" x2="600" y2="290" stroke="#495057" stroke-width="3" marker-end="url(#arrow)"/>
  
  <rect x="400" y="300" width="400" height="50" rx="8" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
  <text x="600" y="330" font-family="Courier" font-size="10" text-anchor="middle">Query Embedding: [0.23, -0.41, 0.67, ...]</text>
  
  <g id="sources">
    <rect x="50" y="400" width="1100" height="280" rx="10" fill="#d3f9d8" stroke="#37b24d" stroke-width="3"/>
    <text x="600" y="430" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Pre-computed Source Embeddings</text>
    
    <rect x="80" y="450" width="330" height="210" rx="8" fill="#fff" stroke="#37b24d" stroke-width="2"/>
    <text x="245" y="475" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">HR Database</text>
    <text x="100" y="500" font-family="Arial" font-size="9">Description:</text>
    <text x="100" y="517" font-family="Arial" font-size="9" font-style="italic">"Employee management, HR policies,</text>
    <text x="100" y="532" font-family="Arial" font-size="9" font-style="italic">benefits, team structure, collaboration</text>
    <text x="100" y="547" font-family="Arial" font-size="9" font-style="italic">tools, performance reviews"</text>
    <text x="100" y="570" font-family="Courier" font-size="8">Embedding: [0.21, -0.38, 0.71, ...]</text>
    <rect x="100" y="590" width="290" height="50" rx="5" fill="#51cf66" stroke="#2f9e44" stroke-width="2"/>
    <text x="245" y="613" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">Similarity: 0.89</text>
    <text x="245" y="630" font-family="Arial" font-size="9" text-anchor="middle" fill="#2f9e44">High Match! ✓</text>
    
    <rect x="435" y="450" width="330" height="210" rx="8" fill="#fff" stroke="#37b24d" stroke-width="2"/>
    <text x="600" y="475" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Technical Docs</text>
    <text x="455" y="500" font-family="Arial" font-size="9">Description:</text>
    <text x="455" y="517" font-family="Arial" font-size="9" font-style="italic">"API documentation, system</text>
    <text x="455" y="532" font-family="Arial" font-size="9" font-style="italic">architecture, code examples,</text>
    <text x="455" y="547" font-family="Arial" font-size="9" font-style="italic">troubleshooting guides"</text>
    <text x="455" y="570" font-family="Courier" font-size="8">Embedding: [-0.12, 0.54, -0.33, ...]</text>
    <rect x="455" y="590" width="290" height="50" rx="5" fill="#ffc9c9" stroke="#f03e3e" stroke-width="2"/>
    <text x="600" y="613" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">Similarity: 0.34</text>
    <text x="600" y="630" font-family="Arial" font-size="9" text-anchor="middle" fill="#f03e3e">Low Match</text>
    
    <rect x="790" y="450" width="330" height="210" rx="8" fill="#fff" stroke="#37b24d" stroke-width="2"/>
    <text x="955" y="475" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Finance Database</text>
    <text x="810" y="500" font-family="Arial" font-size="9">Description:</text>
    <text x="810" y="517" font-family="Arial" font-size="9" font-style="italic">"Revenue, expenses, budgets,</text>
    <text x="810" y="532" font-family="Arial" font-size="9" font-style="italic">financial reports, forecasts,</text>
    <text x="810" y="547" font-family="Arial" font-size="9" font-style="italic">quarterly earnings"</text>
    <text x="810" y="570" font-family="Courier" font-size="8">Embedding: [0.62, 0.19, -0.47, ...]</text>
    <rect x="810" y="590" width="290" height="50" rx="5" fill="#fff9db" stroke="#fab005" stroke-width="2"/>
    <text x="955" y="613" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">Similarity: 0.52</text>
    <text x="955" y="630" font-family="Arial" font-size="9" text-anchor="middle" fill="#fd7e14">Medium Match</text>
  </g>
  
  <line x1="245" y1="680" x2="600" y2="740" stroke="#37b24d" stroke-width="3" marker-end="url(#arrow)"/>
  
  <rect x="300" y="750" width="600" height="120" rx="10" fill="#51cf66" stroke="#2f9e44" stroke-width="3"/>
  <text x="600" y="785" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Routing Decision</text>
  <text x="600" y="810" font-family="Arial" font-size="13" text-anchor="middle" fill="white">Route to: HR Database (0.89 similarity)</text>
  <rect x="330" y="825" width="540" height="30" rx="5" fill="#fff" stroke="#2f9e44" stroke-width="2"/>
  <text x="600" y="846" font-family="Arial" font-size="10" text-anchor="middle">Highest semantic similarity - best match for collaboration query</text>
</svg>