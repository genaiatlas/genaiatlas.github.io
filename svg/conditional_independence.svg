<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="700" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="600" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Conditional Independence in Chain Structure
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="70" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#7f8c8d">
    Example: A — B — C (Friends Not Yet Connected)
  </text>
  
  <!-- Main Chain Graph -->
  <g id="chain-graph">
    <rect x="200" y="120" width="800" height="250" fill="#e8f4f8" stroke="#3498db" stroke-width="2" rx="10"/>
    <text x="600" y="155" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Social Network Structure
    </text>
    
    <!-- Node A -->
    <circle cx="350" cy="245" r="50" fill="#27ae60" stroke="#1e8449" stroke-width="3"/>
    <text x="350" y="255" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="white">A</text>
    <text x="350" y="330" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#27ae60" font-weight="bold">User A</text>
    
    <!-- Node B -->
    <circle cx="600" cy="245" r="50" fill="#e67e22" stroke="#d35400" stroke-width="3"/>
    <text x="600" y="255" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="white">B</text>
    <text x="600" y="330" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#e67e22" font-weight="bold">User B (mutual friend)</text>
    
    <!-- Node C -->
    <circle cx="850" cy="245" r="50" fill="#3498db" stroke="#2980b9" stroke-width="3"/>
    <text x="850" y="255" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="white">C</text>
    <text x="850" y="330" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#3498db" font-weight="bold">User C</text>
    
    <!-- Edges A-B and B-C -->
    <line x1="402" y1="245" x2="548" y2="245" stroke="#2c3e50" stroke-width="5"/>
    <line x1="652" y1="245" x2="798" y2="245" stroke="#2c3e50" stroke-width="5"/>
    
    <!-- No edge between A and C (dashed to show absence) -->
    <line x1="395" y1="270" x2="815" y2="270" stroke="#e74c3c" stroke-width="3" stroke-dasharray="10,5" opacity="0.5"/>
    <text x="600" y="295" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#e74c3c" font-weight="bold">
      NO DIRECT EDGE (not yet friends)
    </text>
    
    <!-- Edge labels -->
    <text x="475" y="230" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#7f8c8d" font-style="italic">
      friends
    </text>
    <text x="725" y="230" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#7f8c8d" font-style="italic">
      friends
    </text>
  </g>
  
  <!-- Dependence Without Edge -->
  <g id="dependence">
    <rect x="50" y="400" width="520" height="250" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="10"/>
    <text x="310" y="435" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      ❌ Marginal Dependence
    </text>
    <text x="310" y="465" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#e65100">
      (Without Conditioning)
    </text>
    
    <text x="70" y="500" font-family="Arial, sans-serif" font-size="15" fill="#34495e">
      <tspan font-weight="bold">A and C are DEPENDENT</tspan> even without
    </text>
    <text x="70" y="525" font-family="Arial, sans-serif" font-size="15" fill="#34495e">
      a direct edge because they interact
    </text>
    <text x="70" y="550" font-family="Arial, sans-serif" font-size="15" fill="#34495e">
      through their mutual friend B.
    </text>
    
    <rect x="70" y="570" width="470" height="60" fill="#ffffff" stroke="#ff9800" stroke-width="2" rx="5"/>
    <text x="305" y="595" font-family="Arial, sans-serif" font-size="14" fill="#34495e" font-style="italic">
      "If A plays a game, B might be influenced to
    </text>
    <text x="305" y="615" font-family="Arial, sans-serif" font-size="14" fill="#34495e" font-style="italic">
      play, which then influences C to play."
    </text>
  </g>
  
  <!-- Conditional Independence -->
  <g id="conditional-independence">
    <rect x="630" y="400" width="520" height="250" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" rx="10"/>
    <text x="890" y="435" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      ✓ Conditional Independence
    </text>
    <text x="890" y="465" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#2e7d32">
      (Given B)
    </text>
    
    <text x="650" y="500" font-family="Arial, sans-serif" font-size="15" fill="#34495e">
      <tspan font-weight="bold">A and C are INDEPENDENT</tspan> once we
    </text>
    <text x="650" y="525" font-family="Arial, sans-serif" font-size="15" fill="#34495e">
      know whether B is playing. B "blocks"
    </text>
    <text x="650" y="550" font-family="Arial, sans-serif" font-size="15" fill="#34495e">
      information flow between A and C.
    </text>
    
    <rect x="650" y="570" width="470" height="60" fill="#ffffff" stroke="#4caf50" stroke-width="2" rx="5"/>
    <text x="885" y="595" font-family="Arial, sans-serif" font-size="14" fill="#34495e" font-style="italic">
      "Given that we know B's behavior, learning
    </text>
    <text x="885" y="615" font-family="Arial, sans-serif" font-size="14" fill="#34495e" font-style="italic">
      about A tells us nothing new about C."
    </text>
  </g>
  
  <!-- Mathematical Notation -->
  <g id="math-notation">
    <rect x="200" y="110" width="800" height="1" fill="none"/>
    
    <!-- Dependence formula -->
    <text x="310" y="680" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#e65100" font-weight="bold">
      A ⊥̸ C
    </text>
    
    <!-- Conditional independence formula -->
    <text x="890" y="680" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#2e7d32" font-weight="bold">
      A ⊥ C | B
    </text>
  </g>
  
  <!-- Key Insight Box -->
  <g id="insight">
    <rect x="50" y="50" width="120" height="60" fill="#fef5e7" stroke="#f39c12" stroke-width="2" rx="5"/>
    <text x="110" y="75" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#e67e22">
      Key Point:
    </text>
    <text x="110" y="95" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">
      Edges ≠ Only
    </text>
    <text x="110" y="107" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">
      Dependencies
    </text>
  </g>
</svg>