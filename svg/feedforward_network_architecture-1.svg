<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="500" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Feedforward Neural Network Architecture</text>
  
  <!-- Input Layer -->
  <g id="input-layer">
    <text x="100" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#3b82f6">Input Layer</text>
    <circle cx="100" cy="120" r="20" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="100" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1e40af">x₁</text>
    <text x="40" y="126" font-family="Arial, sans-serif" font-size="10" fill="#64748b">Fever?</text>
    
    <circle cx="100" cy="180" r="20" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="100" y="186" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1e40af">x₂</text>
    <text x="25" y="186" font-family="Arial, sans-serif" font-size="10" fill="#64748b">Stomach ache?</text>
    
    <circle cx="100" cy="240" r="20" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="100" y="246" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1e40af">x₃</text>
    <text x="40" y="246" font-family="Arial, sans-serif" font-size="10" fill="#64748b">Cough?</text>
    
    <circle cx="100" cy="300" r="20" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="100" y="306" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1e40af">x₄</text>
    <text x="25" y="320" font-family="Arial, sans-serif" font-size="10" fill="#64748b">Input data point X</text>
  </g>
  
  <!-- Hidden Layers -->
  <g id="hidden-layers">
    <text x="350" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#10b981">Hidden Layers</text>
    
    <!-- First Hidden Layer -->
    <circle cx="280" cy="100" r="18" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
    <circle cx="280" cy="160" r="18" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
    <circle cx="280" cy="220" r="18" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
    <circle cx="280" cy="280" r="18" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
    <circle cx="280" cy="340" r="18" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
    
    <!-- Second Hidden Layer -->
    <circle cx="420" cy="130" r="18" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
    <circle cx="420" cy="190" r="18" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
    <circle cx="420" cy="250" r="18" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
    <circle cx="420" cy="310" r="18" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
    
    <!-- Dots for more layers -->
    <circle cx="380" cy="200" r="3" fill="#6b7280"/>
    <circle cx="390" cy="200" r="3" fill="#6b7280"/>
    <circle cx="400" cy="200" r="3" fill="#6b7280"/>
  </g>
  
  <!-- Output Layer -->
  <g id="output-layer">
    <text x="600" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f59e0b">Output Layer</text>
    <circle cx="600" cy="220" r="25" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="600" y="228" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#92400e">F(x; θ)</text>
    <text x="680" y="210" font-family="Arial, sans-serif" font-size="11" fill="#64748b">"has the flu"</text>
    <text x="680" y="228" font-family="Arial, sans-serif" font-size="11" fill="#64748b">prediction</text>
  </g>
  
  <!-- Connections from input to first hidden -->
  <g stroke="#6b7280" stroke-width="1" opacity="0.7">
    <line x1="120" y1="120" x2="262" y2="100"/>
    <line x1="120" y1="120" x2="262" y2="160"/>
    <line x1="120" y1="120" x2="262" y2="220"/>
    <line x1="120" y1="120" x2="262" y2="280"/>
    
    <line x1="120" y1="180" x2="262" y2="100"/>
    <line x1="120" y1="180" x2="262" y2="160"/>
    <line x1="120" y1="180" x2="262" y2="220"/>
    <line x1="120" y1="180" x2="262" y2="280"/>
    <line x1="120" y1="180" x2="262" y2="340"/>
    
    <line x1="120" y1="240" x2="262" y2="100"/>
    <line x1="120" y1="240" x2="262" y2="160"/>
    <line x1="120" y1="240" x2="262" y2="220"/>
    <line x1="120" y1="240" x2="262" y2="280"/>
    <line x1="120" y1="240" x2="262" y2="340"/>
    
    <line x1="120" y1="300" x2="262" y2="160"/>
    <line x1="120" y1="300" x2="262" y2="220"/>
    <line x1="120" y1="300" x2="262" y2="280"/>
    <line x1="120" y1="300" x2="262" y2="340"/>
  </g>
  
  <!-- Connections from first to second hidden -->
  <g stroke="#6b7280" stroke-width="1" opacity="0.7">
    <line x1="298" y1="100" x2="402" y2="130"/>
    <line x1="298" y1="100" x2="402" y2="190"/>
    <line x1="298" y1="160" x2="402" y2="130"/>
    <line x1="298" y1="160" x2="402" y2="190"/>
    <line x1="298" y1="160" x2="402" y2="250"/>
    <line x1="298" y1="220" x2="402" y2="190"/>
    <line x1="298" y1="220" x2="402" y2="250"/>
    <line x1="298" y1="220" x2="402" y2="310"/>
    <line x1="298" y1="280" x2="402" y2="250"/>
    <line x1="298" y1="280" x2="402" y2="310"/>
    <line x1="298" y1="340" x2="402" y2="310"/>
  </g>
  
  <!-- Connections from second hidden to output -->
  <g stroke="#6b7280" stroke-width="1" opacity="0.7">
    <line x1="438" y1="130" x2="575" y2="220"/>
    <line x1="438" y1="190" x2="575" y2="220"/>
    <line x1="438" y1="250" x2="575" y2="220"/>
    <line x1="438" y1="310" x2="575" y2="220"/>
  </g>
  
  <!-- Key information boxes -->
  <g id="info-boxes">
    <rect x="50" y="380" width="200" height="80" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="60" y="400" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">Input Layer:</text>
    <text x="60" y="415" font-family="Arial, sans-serif" font-size="9" fill="#475569">• Passive, no processing</text>
    <text x="60" y="430" font-family="Arial, sans-serif" font-size="9" fill="#475569">• Holds input data</text>
    <text x="60" y="445" font-family="Arial, sans-serif" font-size="9" fill="#475569">• Feature vector</text>
    
    <rect x="300" y="380" width="200" height="80" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="310" y="400" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">Hidden Layers:</text>
    <text x="310" y="415" font-family="Arial, sans-serif" font-size="9" fill="#475569">• Multiple inputs × weights</text>
    <text x="310" y="430" font-family="Arial, sans-serif" font-size="9" fill="#475569">• Add bias + activation</text>
    <text x="310" y="445" font-family="Arial, sans-serif" font-size="9" fill="#475569">• Pattern detection</text>
    
    <rect x="550" y="380" width="200" height="80" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="560" y="400" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">Output Layer:</text>
    <text x="560" y="415" font-family="Arial, sans-serif" font-size="9" fill="#475569">• Classification: YES/NO</text>
    <text x="560" y="430" font-family="Arial, sans-serif" font-size="9" fill="#475569">• Regression: Real number</text>
    <text x="560" y="445" font-family="Arial, sans-serif" font-size="9" fill="#475569">• Final prediction</text>
  </g>
</svg>