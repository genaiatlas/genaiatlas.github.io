<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="675" fill="#f8fafc"/>
  
  <!-- Fast Track Ribbon -->
  <polygon points="1050,0 1200,0 1200,80 1050,60" fill="#3b82f6"/>
  <text x="1125" y="35" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">FAST TRACK</text>
  
  <!-- Title -->
  <text x="600" y="80" text-anchor="middle" fill="#1e293b" font-family="Arial, sans-serif" font-size="36" font-weight="bold">Collections &amp; Variables</text>
  
  <!-- List Box -->
  <rect x="80" y="140" width="250" height="160" fill="#ecfdf5" stroke="#059669" stroke-width="2" rx="8"/>
  <text x="205" y="170" text-anchor="middle" fill="#059669" font-family="Arial, sans-serif" font-size="20" font-weight="bold">List []</text>
  <text x="205" y="200" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="14">Ordered • Mutable</text>
  <text x="205" y="225" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="16">fruits = ["apple",</text>
  <text x="205" y="245" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="16">"banana", "orange"]</text>
  <text x="205" y="275" text-anchor="middle" fill="#6b7280" font-family="Arial, sans-serif" font-size="12">✓ Can change items</text>
  
  <!-- Tuple Box -->
  <rect x="350" y="140" width="250" height="160" fill="#fef3c7" stroke="#d97706" stroke-width="2" rx="8"/>
  <text x="475" y="170" text-anchor="middle" fill="#d97706" font-family="Arial, sans-serif" font-size="20" font-weight="bold">Tuple ()</text>
  <text x="475" y="200" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="14">Ordered • Immutable</text>
  <text x="475" y="225" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="16">coordinates = (10, 20)</text>
  <text x="475" y="245" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="16">rgb = (255, 128, 0)</text>
  <text x="475" y="275" text-anchor="middle" fill="#6b7280" font-family="Arial, sans-serif" font-size="12">✗ Cannot change</text>
  
  <!-- Dictionary Box -->
  <rect x="620" y="140" width="250" height="160" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" rx="8"/>
  <text x="745" y="170" text-anchor="middle" fill="#0284c7" font-family="Arial, sans-serif" font-size="20" font-weight="bold">Dict {}</text>
  <text x="745" y="200" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="14">Key-Value • Mutable</text>
  <text x="745" y="225" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="16">person = {"name":</text>
  <text x="745" y="245" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="16">"Alice", "age": 30}</text>
  <text x="745" y="275" text-anchor="middle" fill="#6b7280" font-family="Arial, sans-serif" font-size="12">✓ Fast lookup</text>
  
  <!-- Set Box -->
  <rect x="890" y="140" width="250" height="160" fill="#fce7f3" stroke="#db2777" stroke-width="2" rx="8"/>
  <text x="1015" y="170" text-anchor="middle" fill="#db2777" font-family="Arial, sans-serif" font-size="20" font-weight="bold">Set {}</text>
  <text x="1015" y="200" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="14">Unique • Unordered</text>
  <text x="1015" y="225" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="16">numbers = {1, 2, 3}</text>
  <text x="1015" y="245" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="16">unique_ids = {101, 205}</text>
  <text x="1015" y="275" text-anchor="middle" fill="#6b7280" font-family="Arial, sans-serif" font-size="12">✓ No duplicates</text>
  
  <!-- Usage Examples -->
  <rect x="100" y="350" width="1000" height="250" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="12"/>
  <text x="600" y="385" text-anchor="middle" fill="#1e293b" font-family="Arial, sans-serif" font-size="24" font-weight="bold">When to Use Each Type</text>
  
  <!-- List usage -->
  <rect x="140" y="420" width="200" height="80" fill="#f0fdf4" stroke="#22c55e" stroke-width="1" rx="6"/>
  <text x="240" y="445" text-anchor="middle" fill="#16a34a" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Lists</text>
  <text x="240" y="465" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">Shopping lists</text>
  <text x="240" y="480" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">Scores, temperatures</text>
  
  <!-- Tuple usage -->
  <rect x="370" y="420" width="200" height="80" fill="#fffbeb" stroke="#f59e0b" stroke-width="1" rx="6"/>
  <text x="470" y="445" text-anchor="middle" fill="#d97706" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Tuples</text>
  <text x="470" y="465" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">Coordinates</text>
  <text x="470" y="480" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">Database records</text>
  
  <!-- Dict usage -->
  <rect x="600" y="420" width="200" height="80" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1" rx="6"/>
  <text x="700" y="445" text-anchor="middle" fill="#0284c7" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Dictionaries</text>
  <text x="700" y="465" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">User profiles</text>
  <text x="700" y="480" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">Configuration</text>
  
  <!-- Set usage -->
  <rect x="830" y="420" width="200" height="80" fill="#fdf2f8" stroke="#ec4899" stroke-width="1" rx="6"/>
  <text x="930" y="445" text-anchor="middle" fill="#db2777" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Sets</text>
  <text x="930" y="465" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">Unique visitors</text>
  <text x="930" y="480" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">Remove duplicates</text>
  
  <!-- Memory tip -->
  <rect x="200" y="530" width="800" height="50" fill="#f1f5f9" stroke="#64748b" stroke-width="1" rx="6"/>
  <text x="600" y="550" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="14" font-weight="bold">💡 Memory Tip:</text>
  <text x="600" y="568" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="13">[] = changeable list, () = fixed tuple, {} = key-value dict or unique set</text>
</svg>