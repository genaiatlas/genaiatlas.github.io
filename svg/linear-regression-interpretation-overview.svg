<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title-text { font-family: 'Arial', sans-serif; font-size: 24px; font-weight: bold; fill: #2c3e50; }
      .subtitle-text { font-family: 'Arial', sans-serif; font-size: 18px; font-weight: bold; fill: #34495e; }
      .label-text { font-family: 'Arial', sans-serif; font-size: 14px; fill: #34495e; }
      .small-text { font-family: 'Arial', sans-serif; font-size: 12px; fill: #7f8c8d; }
      .equation-text { font-family: 'Times New Roman', serif; font-size: 14px; fill: #2c3e50; }
      .interpretation1-box { fill: #e8f5e8; stroke: #28a745; stroke-width: 2; rx: 10; }
      .interpretation2-box { fill: #fff3cd; stroke: #ffc107; stroke-width: 2; rx: 10; }
      .common-box { fill: #e3f2fd; stroke: #2196f3; stroke-width: 2; rx: 10; }
      .arrow { stroke: #6c757d; stroke-width: 2; fill: #6c757d; }
    </style>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title-text">Linear Regression: Two Interpretations</text>
  
  <!-- Linear Approximation Interpretation -->
  <g transform="translate(50, 70)">
    <rect x="0" y="0" width="300" height="200" class="interpretation1-box"/>
    <text x="150" y="25" text-anchor="middle" class="subtitle-text" fill="#155724">Linear Approximation</text>
    
    <text x="20" y="50" class="label-text" fill="#155724">Key Assumptions:</text>
    <text x="30" y="70" class="small-text">• Large population exists</text>
    <text x="30" y="85" class="small-text">• Complex (possibly nonlinear) relationship</text>
    <text x="30" y="100" class="small-text">• Seek best linear predictor</text>
    <text x="30" y="115" class="small-text">• Representative sampling</text>
    
    <text x="20" y="140" class="label-text" fill="#155724">Goal:</text>
    <text x="30" y="160" class="small-text">Build optimal linear predictor</text>
    <text x="30" y="175" class="small-text">for population-level performance</text>
  </g>
  
  <!-- Maximum Likelihood Interpretation -->
  <g transform="translate(450, 70)">
    <rect x="0" y="0" width="300" height="200" class="interpretation2-box"/>
    <text x="150" y="25" text-anchor="middle" class="subtitle-text" fill="#856404">Maximum Likelihood</text>
    
    <text x="20" y="50" class="label-text" fill="#856404">Key Assumptions:</text>
    <text x="30" y="70" class="small-text">• World is fundamentally linear</text>
    <text x="30" y="85" class="small-text">• Additive Gaussian noise</text>
    <text x="30" y="100" class="small-text">• Independent observations</text>
    <text x="30" y="115" class="small-text">• Known model structure</text>
    
    <text x="20" y="140" class="label-text" fill="#856404">Goal:</text>
    <text x="30" y="160" class="small-text">Learn true model parameters</text>
    <text x="30" y="175" class="small-text">from probabilistic framework</text>
  </g>
  
  <!-- Common Mathematical Result -->
  <g transform="translate(200, 320)">
    <rect x="0" y="0" width="400" height="120" class="common-box"/>
    <text x="200" y="25" text-anchor="middle" class="subtitle-text" fill="#1976d2">Common Mathematical Solution</text>
    
    <text x="200" y="55" text-anchor="middle" class="equation-text">min θ Σᵢ₌₁ⁿ (θᵀXᵢ - Yᵢ)²</text>
    
    <text x="200" y="80" text-anchor="middle" class="equation-text">θ̂ = (XᵀX)⁻¹Xᵀy</text>
    
    <text x="200" y="105" text-anchor="middle" class="small-text" fill="#1976d2">Both interpretations lead to identical optimization problem</text>
  </g>
  
  <!-- Arrows pointing to common solution -->
  <g transform="translate(200, 270)">
    <!-- Left arrow -->
    <path d="M 0 0 L 50 50 L 45 45 M 50 50 L 45 55" class="arrow"/>
    <!-- Right arrow -->
    <path d="M 400 0 L 350 50 L 355 45 M 350 50 L 355 55" class="arrow"/>
  </g>
  
  <!-- Comparison table -->
  <g transform="translate(50, 480)">
    <text x="350" y="0" text-anchor="middle" class="subtitle-text">Key Differences</text>
    
    <!-- Table headers -->
    <text x="50" y="30" class="label-text" font-weight="bold">Aspect</text>
    <text x="250" y="30" class="label-text" font-weight="bold">Linear Approximation</text>
    <text x="550" y="30" class="label-text" font-weight="bold">Maximum Likelihood</text>
    
    <!-- Table rows -->
    <text x="50" y="50" class="small-text">Primary Focus</text>
    <text x="250" y="50" class="small-text">Prediction accuracy</text>
    <text x="550" y="50" class="small-text">Parameter estimation</text>
    
    <text x="50" y="70" class="small-text">World View</text>
    <text x="250" y="70" class="small-text">Complex, nonlinear</text>
    <text x="550" y="70" class="small-text">Linear + noise</text>
    
    <text x="50" y="90" class="small-text">Assumptions</text>
    <text x="250" y="90" class="small-text">Weaker</text>
    <text x="550" y="90" class="small-text">Stronger</text>
    
    <text x="50" y="110" class="small-text">Use Case</text>
    <text x="250" y="110" class="small-text">Robust prediction</text>
    <text x="550" y="110" class="small-text">Scientific modeling</text>
  </g>
</svg>