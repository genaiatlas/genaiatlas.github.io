<svg viewBox="0 0 1200 850" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 28px; font-weight: bold; fill: #2c3e50; }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 20px; font-weight: 600; fill: #34495e; }
      .label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #2c3e50; }
      .small-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #555; }
      .node-influencer { fill: #e74c3c; stroke: #c0392b; stroke-width: 3; }
      .node-high { fill: #f39c12; stroke: #d68910; stroke-width: 2; }
      .node-medium { fill: #3498db; stroke: #2980b9; stroke-width: 2; }
      .node-low { fill: #95a5a6; stroke: #7f8c8d; stroke-width: 2; }
      .edge-strong { stroke: #e74c3c; stroke-width: 3; fill: none; }
      .edge-medium { stroke: #f39c12; stroke-width: 2.5; fill: none; }
      .edge-weak { stroke: #bdc3c7; stroke-width: 2; fill: none; }
      .box { fill: #ecf0f1; stroke: #34495e; stroke-width: 2; rx: 10; }
      .metric-box { fill: #fff; stroke: #3498db; stroke-width: 2; rx: 8; }
      .gradient { fill: url(#influence-gradient); }
    </style>
    <linearGradient id="influence-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#95a5a6;stop-opacity:1" />
    </linearGradient>
    <marker id="arrow-strong" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#e74c3c"/>
    </marker>
    <marker id="arrow-weak" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#bdc3c7"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="600" y="40" class="title" text-anchor="middle">Influence Propagation in Networks</text>
  
  <!-- Top Section: Influence Hierarchy -->
  <rect x="50" y="80" width="1100" height="350" class="box"/>
  <text x="600" y="115" class="subtitle" text-anchor="middle">Influence Spread Pattern</text>
  
  <!-- Central Influencer -->
  <circle cx="600" cy="220" r="30" class="node-influencer"/>
  <text x="600" y="225" class="label" text-anchor="middle" fill="white" font-weight="bold">I</text>
  <text x="600" y="265" class="label" text-anchor="middle" font-weight="bold">Influencer</text>
  
  <!-- First Ring: High Influence -->
  <circle cx="480" cy="180" r="20" class="node-high"/>
  <text x="480" y="185" class="small-label" text-anchor="middle" fill="white">H1</text>
  
  <circle cx="720" cy="180" r="20" class="node-high"/>
  <text x="720" y="185" class="small-label" text-anchor="middle" fill="white">H2</text>
  
  <circle cx="520" cy="320" r="20" class="node-high"/>
  <text x="520" y="325" class="small-label" text-anchor="middle" fill="white">H3</text>
  
  <circle cx="680" cy="320" r="20" class="node-high"/>
  <text x="680" y="325" class="small-label" text-anchor="middle" fill="white">H4</text>
  
  <!-- Strong connections from influencer -->
  <path d="M 575 205 L 495 190" class="edge-strong" marker-end="url(#arrow-strong)"/>
  <path d="M 625 205 L 705 190" class="edge-strong" marker-end="url(#arrow-strong)"/>
  <path d="M 580 240 L 535 310" class="edge-strong" marker-end="url(#arrow-strong)"/>
  <path d="M 620 240 L 665 310" class="edge-strong" marker-end="url(#arrow-strong)"/>
  
  <!-- Second Ring: Medium Influence -->
  <circle cx="380" cy="160" r="16" class="node-medium"/>
  <text x="380" y="165" class="small-label" text-anchor="middle" fill="white">M1</text>
  
  <circle cx="420" cy="280" r="16" class="node-medium"/>
  <text x="420" y="285" class="small-label" text-anchor="middle" fill="white">M2</text>
  
  <circle cx="780" cy="280" r="16" class="node-medium"/>
  <text x="780" y="285" class="small-label" text-anchor="middle" fill="white">M3</text>
  
  <circle cx="820" cy="160" r="16" class="node-medium"/>
  <text x="820" y="165" class="small-label" text-anchor="middle" fill="white">M4</text>
  
  <!-- Medium connections -->
  <path d="M 465 175 L 395 165" class="edge-medium" marker-end="url(#arrow-weak)"/>
  <path d="M 505 310 L 435 290" class="edge-medium" marker-end="url(#arrow-weak)"/>
  <path d="M 695 310 L 765 290" class="edge-medium" marker-end="url(#arrow-weak)"/>
  <path d="M 735 175 L 805 165" class="edge-medium" marker-end="url(#arrow-weak)"/>
  
  <!-- Third Ring: Low Influence -->
  <circle cx="320" cy="120" r="13" class="node-low"/>
  <text x="320" y="125" class="small-label" text-anchor="middle" fill="white">L1</text>
  
  <circle cx="340" cy="340" r="13" class="node-low"/>
  <text x="340" y="345" class="small-label" text-anchor="middle" fill="white">L2</text>
  
  <circle cx="860" cy="340" r="13" class="node-low"/>
  <text x="860" y="345" class="small-label" text-anchor="middle" fill="white">L3</text>
  
  <circle cx="880" cy="120" r="13" class="node-low"/>
  <text x="880" y="125" class="small-label" text-anchor="middle" fill="white">L4</text>
  
  <!-- Weak connections -->
  <line x1="370" y1="150" x2="330" y2="130" class="edge-weak"/>
  <line x1="410" y1="295" x2="350" y2="335" class="edge-weak"/>
  <line x1="790" y1="295" x2="850" y2="335" class="edge-weak"/>
  <line x1="830" y1="150" x2="870" y2="130" class="edge-weak"/>
  
  <!-- Legend -->
  <rect x="100" y="360" width="250" height="50" class="metric-box"/>
  <text x="225" y="380" class="small-label" text-anchor="middle" font-weight="bold">Influence Level:</text>
  <circle cx="130" cy="397" r="10" class="node-influencer"/>
  <text x="145" y="402" class="small-label">Primary</text>
  <circle cx="205" cy="397" r="8" class="node-high"/>
  <text x="220" y="402" class="small-label">High</text>
  <circle cx="270" cy="397" r="7" class="node-medium"/>
  <text x="285" y="402" class="small-label">Medium</text>
  <circle cx="330" cy="397" r="6" class="node-low"/>
  <text x="345" y="402" class="small-label">Low</text>
  
  <rect x="850" y="360" width="250" height="50" class="metric-box"/>
  <text x="975" y="380" class="small-label" text-anchor="middle" font-weight="bold">Connection Strength:</text>
  <line x1="870" y1="397" x2="920" y2="397" class="edge-strong"/>
  <text x="925" y="402" class="small-label">Strong</text>
  <line x1="960" y1="397" x2="1000" y2="397" class="edge-medium"/>
  <text x="1005" y="402" class="small-label">Medium</text>
  <line x1="1040" y1="397" x2="1075" y2="397" class="edge-weak"/>
  <text x="1080" y="402" class="small-label">Weak</text>
  
  <!-- Middle Section: Centrality Measures -->
  <rect x="50" y="460" width="540" height="360" class="box"/>
  <text x="320" y="495" class="subtitle" text-anchor="middle">Centrality Measures</text>
  
  <!-- Sample network for centrality -->
  <circle cx="200" cy="580" r="18" class="node-medium"/>
  <text x="200" y="585" class="small-label" text-anchor="middle" fill="white">A</text>
  
  <circle cx="320" cy="580" r="25" class="node-influencer"/>
  <text x="320" y="585" class="label" text-anchor="middle" fill="white">B</text>
  <text x="320" y="625" class="small-label" text-anchor="middle" font-weight="bold">Highest Centrality</text>
  
  <circle cx="440" cy="580" r="18" class="node-medium"/>
  <text x="440" y="585" class="small-label" text-anchor="middle" fill="white">C</text>
  
  <circle cx="260" cy="680" r="16" class="node-low"/>
  <text x="260" y="685" class="small-label" text-anchor="middle" fill="white">D</text>
  
  <circle cx="380" cy="680" r="16" class="node-low"/>
  <text x="380" y="685" class="small-label" text-anchor="middle" fill="white">E</text>
  
  <!-- Edges showing centrality -->
  <line x1="218" y1="580" x2="295" y2="580" class="edge-strong"/>
  <line x1="345" y1="580" x2="422" y2="580" class="edge-strong"/>
  <line x1="305" y1="600" x2="270" y2="665" class="edge-medium"/>
  <line x1="335" y1="600" x2="370" y2="665" class="edge-medium"/>
  <line x1="200" y1="598" x2="250" y2="665" class="edge-weak"/>
  <line x1="440" y1="598" x2="390" y2="665" class="edge-weak"/>
  
  <!-- Centrality metrics -->
  <rect x="80" y="720" width="480" height="80" class="metric-box"/>
  <text x="320" y="743" class="label" text-anchor="middle" font-weight="bold">Types of Centrality:</text>
  
  <text x="100" y="760" class="small-label">• Degree: Number of direct connections</text>
  <text x="100" y="775" class="small-label">• Betweenness: How often node lies on shortest paths</text>
  <text x="100" y="790" class="small-label">• Eigenvector: Importance based on neighbors' importance (PageRank)</text>
  
  <!-- Right Section: Influence Maximization -->
  <rect x="630" y="460" width="520" height="360" class="box"/>
  <text x="890" y="495" class="subtitle" text-anchor="middle">Influence Maximization</text>
  <text x="890" y="520" class="small-label" text-anchor="middle">Selecting optimal seed nodes to maximize spread</text>
  
  <!-- Comparison: Bad vs Good selection -->
  <text x="770" y="555" class="label" font-weight="bold" fill="#c0392b">❌ Suboptimal Choice</text>
  
  <!-- Bad choice: peripheral node -->
  <circle cx="720" cy="600" r="20" class="node-influencer"/>
  <text x="720" y="605" class="small-label" text-anchor="middle" fill="white">Seed</text>
  
  <circle cx="680" cy="650" r="14" class="node-medium"/>
  <circle cx="760" cy="650" r="14" class="node-low"/>
  <circle cx="720" cy="680" r="12" class="node-low"/>
  
  <line x1="710" y1="618" x2="688" y2="640" class="edge-medium"/>
  <line x1="730" y1="618" x2="752" y2="640" class="edge-weak"/>
  <line x1="720" y1="620" x2="720" y2="668" class="edge-weak"/>
  
  <text x="720" y="710" class="small-label" text-anchor="middle" fill="#c0392b">Limited reach: 3 nodes</text>
  
  <text x="1010" y="555" class="label" font-weight="bold" fill="#27ae60">✓ Optimal Choice</text>
  
  <!-- Good choice: central node -->
  <circle cx="960" cy="600" r="20" class="node-influencer"/>
  <text x="960" y="605" class="small-label" text-anchor="middle" fill="white">Seed</text>
  
  <!-- First level -->
  <circle cx="900" cy="650" r="16" class="node-high"/>
  <circle cx="960" cy="670" r="16" class="node-high"/>
  <circle cx="1020" cy="650" r="16" class="node-high"/>
  
  <!-- Second level -->
  <circle cx="870" cy="690" r="12" class="node-medium"/>
  <circle cx="930" cy="700" r="12" class="node-medium"/>
  <circle cx="990" cy="700" r="12" class="node-medium"/>
  <circle cx="1050" cy="690" r="12" class="node-medium"/>
  
  <line x1="945" y1="615" x2="910" y2="640" class="edge-strong"/>
  <line x1="960" y1="620" x2="960" y2="654" class="edge-strong"/>
  <line x1="975" y1="615" x2="1010" y2="640" class="edge-strong"/>
  
  <line x1="892" y1="665" x2="878" y2="680" class="edge-medium"/>
  <line x1="950" y1="685" x2="938" y2="692" class="edge-medium"/>
  <line x1="970" y1="685" x2="982" y2="692" class="edge-medium"/>
  <line x1="1028" y1="665" x2="1042" y2="680" class="edge-medium"/>
  
  <text x="960" y="730" class="small-label" text-anchor="middle" fill="#27ae60">Broad reach: 10 nodes</text>
  
  <!-- Strategy box -->
  <rect x="660" y="750" width="460" height="50" class="metric-box"/>
  <text x="890" y="770" class="label" text-anchor="middle" font-weight="bold">Optimization Strategy:</text>
  <text x="675" y="788" class="small-label">• Target nodes with high centrality and well-connected neighbors</text>
</svg>