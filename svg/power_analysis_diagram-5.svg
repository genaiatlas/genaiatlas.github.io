<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    Statistical Power Analysis
  </text>
  
  <!-- H₀ distribution (centered at 0) -->
  <path d="M 150 300 Q 200 220 250 240 Q 300 200 350 210 Q 400 220 450 300" 
        stroke="#2196f3" stroke-width="3" fill="rgba(33, 150, 243, 0.1)"/>
  <text x="300" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1976d2">
    H₀ Distribution
  </text>
  <text x="300" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1976d2">
    μ₀ = 0
  </text>
  
  <!-- H₁ distribution (shifted right) -->
  <path d="M 300 300 Q 350 220 400 240 Q 450 200 500 210 Q 550 220 600 300" 
        stroke="#ff5722" stroke-width="3" fill="rgba(255, 87, 34, 0.1)"/>
  <text x="450" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#d84315">
    H₁ Distribution
  </text>
  <text x="450" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#d84315">
    μ₁ = δ (effect size)
  </text>
  
  <!-- Critical value line -->
  <line x1="380" y1="180" x2="380" y2="320" stroke="#424242" stroke-width="3" stroke-dasharray="5,5"/>
  <text x="385" y="175" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#424242">
    Critical Value
  </text>
  <text x="385" y="335" font-family="Arial, sans-serif" font-size="11" fill="#424242">
    (z = 1.96 for α = 0.05)
  </text>
  
  <!-- Type I Error region (α) -->
  <path d="M 380 210 Q 415 220 450 300" 
        stroke="#f44336" stroke-width="2" fill="rgba(244, 67, 54, 0.4)"/>
  <text x="415" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#c62828">
    α = 0.05
  </text>
  <text x="415" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#c62828">
    Type I Error
  </text>
  
  <!-- Type II Error region (β) -->
  <path d="M 300 300 Q 330 250 340 240 Q 360 230 380 210" 
        stroke="#9c27b0" stroke-width="2" fill="rgba(156, 39, 176, 0.4)"/>
  <text x="340" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#7b1fa2">
    β
  </text>
  <text x="340" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7b1fa2">
    Type II Error
  </text>
  
  <!-- Power region (1-β) -->
  <path d="M 380 210 Q 415 200 450 210 Q 485 220 520 240 Q 550 260 600 300" 
        stroke="#4caf50" stroke-width="3" fill="rgba(76, 175, 80, 0.4)"/>
  <text x="490" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2e7d32">
    POWER = 1-β
  </text>
  <text x="490" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2e7d32">
    Probability of correctly
  </text>
  <text x="490" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2e7d32">
    rejecting false H₀
  </text>
  
  <!-- Effect size arrow -->
  <path d="M 300 350 L 450 350" stroke="#ff9800" stroke-width="4" fill="none" marker-end="url(#arrowhead)"/>
  <text x="375" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f57c00">
    Effect Size (δ)
  </text>
  <text x="375" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#f57c00">
    Distance between distributions
  </text>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff9800"/>
    </marker>
  </defs>
  
  <!-- Power components box -->
  <rect x="50" y="60" width="320" height="120" fill="#e8f5e8" stroke="#4caf50" stroke-width="2" rx="8"/>
  <text x="210" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2e7d32">
    💪 Factors Affecting Power
  </text>
  <text x="70" y="105" font-family="Arial, sans-serif" font-size="12" fill="#333">
    ↑ <tspan font-weight="bold">Effect Size (δ):</tspan> Larger differences easier to detect
  </text>
  <text x="70" y="120" font-family="Arial, sans-serif" font-size="12" fill="#333">
    ↑ <tspan font-weight="bold">Sample Size (n):</tspan> More data = more precision
  </text>
  <text x="70" y="135" font-family="Arial, sans-serif" font-size="12" fill="#333">
    ↑ <tspan font-weight="bold">Significance Level (α):</tspan> Less strict criterion
  </text>
  <text x="70" y="150" font-family="Arial, sans-serif" font-size="12" fill="#333">
    ↓ <tspan font-weight="bold">Population Variance (σ²):</tspan> Less noise
  </text>
  <text x="70" y="165" font-family="Arial, sans-serif" font-size="12" fill="#333">
    📏 <tspan font-weight="bold">One-tailed vs Two-tailed:</tspan> Direction matters
  </text>
  
  <!-- Sample size calculation box -->
  <rect x="430" y="60" width="320" height="120" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="8"/>
  <text x="590" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#f57c00">
    📊 Sample Size Formula
  </text>
  <text x="590" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#333">
    n = (Z₁₋α/₂ + Z₁₋β)² × σ²/δ²
  </text>
  <text x="450" y="125" font-family="Arial, sans-serif" font-size="11" fill="#666">
    Z₁₋α/₂ = critical value for α (e.g., 1.96 for α=0.05)
  </text>
  <text x="450" y="140" font-family="Arial, sans-serif" font-size="11" fill="#666">
    Z₁₋β = critical value for β (e.g., 0.84 for 80% power)
  </text>
  <text x="450" y="155" font-family="Arial, sans-serif" font-size="11" fill="#666">
    δ = effect size, σ = population standard deviation
  </text>
  <text x="450" y="170" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#f57c00">
    Standard: 80% power, α = 0.05
  </text>
  
  <!-- Power curve illustration -->
  <rect x="100" y="400" width="600" height="150" fill="#f5f5f5" stroke="#757575" stroke-width="1" rx="5"/>
  <text x="400" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#424242">
    Power Curve: Effect of Sample Size
  </text>
  
  <!-- Simple power curve -->
  <path d="M 130 520 Q 200 500 300 470 Q 400 440 500 420 Q 600 410 670 405" 
        stroke="#4caf50" stroke-width="3" fill="none"/>
  
  <!-- Axes -->
  <line x1="130" y1="530" x2="670" y2="530" stroke="#333" stroke-width="2"/>
  <line x1="130" y1="530" x2="130" y2="400" stroke="#333" stroke-width="2"/>
  
  <!-- Axis labels -->
  <text x="400" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">
    Sample Size (n)
  </text>
  <text x="115" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333" transform="rotate(-90 115 470)">
    Power (1-β)
  </text>
  
  <!-- Power benchmarks -->
  <line x1="125" y1="450" x2="135" y2="450" stroke="#4caf50" stroke-width="2"/>
  <text x="120" y="455" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#4caf50">0.80</text>
  <line x1="125" y1="410" x2="135" y2="410" stroke="#2e7d32" stroke-width="2"/>
  <text x="120" y="415" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#2e7d32">0.95</text>
  
  <!-- Sample size markers -->
  <line x1="250" y1="525" x2="250" y2="535" stroke="#666" stroke-width="1"/>
  <text x="250" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">n=30</text>
  <line x1="400" y1="525" x2="400" y2="535" stroke="#666" stroke-width="1"/>
  <text x="400" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">n=100</text>
  <line x1="550" y1="525" x2="550" y2="535" stroke="#666" stroke-width="1"/>
  <text x="550" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">n=200</text>
  
  <!-- Key insight -->
  <text x="520" y="475" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="#666">
    Key: Diminishing returns -
  </text>
  <text x="520" y="488" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="#666">
    quadrupling sample size
  </text>
  <text x="520" y="501" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="#666">
    doubles effect detection
  </text>
</svg>