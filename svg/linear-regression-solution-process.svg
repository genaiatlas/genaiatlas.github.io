<svg viewBox="0 0 800 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title-text { font-family: 'Arial', sans-serif; font-size: 24px; font-weight: bold; fill: #2c3e50; }
      .step-title { font-family: 'Arial', sans-serif; font-size: 18px; font-weight: bold; fill: #2c3e50; }
      .equation-text { font-family: 'Times New Roman', serif; font-size: 16px; fill: #2c3e50; }
      .label-text { font-family: 'Arial', sans-serif; font-size: 14px; fill: #34495e; }
      .small-text { font-family: 'Arial', sans-serif; font-size: 12px; fill: #7f8c8d; }
      .step-box { fill: #f8f9fa; stroke: #6c757d; stroke-width: 2; rx: 10; }
      .highlight-box { fill: #fff3cd; stroke: #ffc107; stroke-width: 2; rx: 5; }
      .result-box { fill: #d4edda; stroke: #28a745; stroke-width: 2; rx: 5; }
      .arrow { stroke: #6c757d; stroke-width: 2; fill: #6c757d; }
      .flow-arrow { stroke: #007bff; stroke-width: 3; fill: #007bff; }
    </style>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title-text">Linear Regression: Solution Process</text>
  
  <!-- Step 1: Problem Setup -->
  <g transform="translate(50, 70)">
    <rect x="0" y="0" width="700" height="80" class="step-box"/>
    <text x="20" y="25" class="step-title">Step 1: Problem Setup</text>
    <text x="20" y="45" class="equation-text">Objective: min θ (1/n) Σᵢ₌₁ⁿ (θᵀxᵢ - yᵢ)²</text>
    <text x="20" y="65" class="label-text">Find parameter vector θ that minimizes mean squared error</text>
  </g>
  
  <!-- Arrow 1 -->
  <g transform="translate(400, 150)">
    <path d="M 0 0 L 0 30 L -5 25 M 0 30 L 5 25" class="flow-arrow"/>
  </g>
  
  <!-- Step 2: Matrix Formulation -->
  <g transform="translate(50, 180)">
    <rect x="0" y="0" width="700" height="100" class="step-box"/>
    <text x="20" y="25" class="step-title">Step 2: Matrix Formulation</text>
    <text x="20" y="50" class="equation-text">H(θ) = ||Xθ - y||² = (Xθ - y)ᵀ(Xθ - y)</text>
    <text x="20" y="70" class="label-text">X: n×(m+1) design matrix, y: n×1 target vector, θ: (m+1)×1 parameter vector</text>
    <text x="20" y="90" class="small-text">Quadratic function in θ → Unique global minimum exists</text>
  </g>
  
  <!-- Arrow 2 -->
  <g transform="translate(400, 280)">
    <path d="M 0 0 L 0 30 L -5 25 M 0 30 L 5 25" class="flow-arrow"/>
  </g>
  
  <!-- Step 3: Take Derivative -->
  <g transform="translate(50, 310)">
    <rect x="0" y="0" width="700" height="100" class="step-box"/>
    <text x="20" y="25" class="step-title">Step 3: Gradient Calculation</text>
    <text x="20" y="50" class="equation-text">∇θ H(θ) = 2XᵀXθ - 2Xᵀy</text>
    <text x="20" y="70" class="label-text">Take gradient with respect to θ (derivative of quadratic is linear)</text>
    <text x="20" y="90" class="small-text">Chain rule: ∇θ[(Xθ - y)ᵀ(Xθ - y)] = 2XᵀXθ - 2Xᵀy</text>
  </g>
  
  <!-- Arrow 3 -->
  <g transform="translate(400, 410)">
    <path d="M 0 0 L 0 30 L -5 25 M 0 30 L 5 25" class="flow-arrow"/>
  </g>
  
  <!-- Step 4: Set to Zero -->
  <g transform="translate(50, 440)">
    <rect x="0" y="0" width="700" height="80" class="step-box"/>
    <text x="20" y="25" class="step-title">Step 4: Optimality Condition</text>
    <text x="20" y="50" class="equation-text">∇θ H(θ) = 0 ⟹ 2XᵀXθ - 2Xᵀy = 0</text>
    <text x="20" y="70" class="label-text">Set gradient to zero to find minimum (first-order optimality condition)</text>
  </g>
  
  <!-- Arrow 4 -->
  <g transform="translate(400, 520)">
    <path d="M 0 0 L 0 30 L -5 25 M 0 30 L 5 25" class="flow-arrow"/>
  </g>
  
  <!-- Step 5: Normal Equations -->
  <g transform="translate(50, 550)">
    <rect x="0" y="0" width="700" height="80" class="highlight-box"/>
    <text x="20" y="25" class="step-title">Step 5: Normal Equations</text>
    <text x="20" y="50" class="equation-text">XᵀXθ = Xᵀy</text>
    <text x="20" y="70" class="label-text">Linear system of (m+1) equations in (m+1) unknowns</text>
  </g>
  
  <!-- Arrow 5 -->
  <g transform="translate(400, 630)">
    <path d="M 0 0 L 0 30 L -5 25 M 0 30 L 5 25" class="flow-arrow"/>
  </g>
  
  <!-- Step 6: Final Solution -->
  <g transform="translate(150, 660)">
    <rect x="0" y="0" width="500" height="30" class="result-box"/>
    <text x="250" y="20" text-anchor="middle" class="equation-text">θ̂ = (XᵀX)⁻¹Xᵀy</text>
  </g>
  
  <!-- Side annotations -->
  <g transform="translate(520, 70)">
    <rect x="0" y="0" width="220" height="220" fill="#e3f2fd" stroke="#2196f3" stroke-width="2" rx="8"/>
    <text x="10" y="20" class="label-text" fill="#1976d2">Why This Works:</text>
    
    <text x="10" y="45" class="small-text">✓ Quadratic objective function</text>
    <text x="10" y="65" class="small-text">✓ Unique global minimum</text>
    <text x="10" y="85" class="small-text">✓ Closed-form solution exists</text>
    <text x="10" y="105" class="small-text">✓ No iterative optimization needed</text>
    <text x="10" y="125" class="small-text">✓ Computationally efficient</text>
    
    <text x="10" y="150" class="label-text" fill="#1976d2">Requirements:</text>
    <text x="10" y="170" class="small-text">• XᵀX must be invertible</text>
    <text x="10" y="190" class="small-text">• n ≥ m+1 (more data than parameters)</text>
    <text x="10" y="210" class="small-text">• Features linearly independent</text>
  </g>
  
  <!-- Computational complexity note -->
  <g transform="translate(520, 320)">
    <rect x="0" y="0" width="220" height="120" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="8"/>
    <text x="10" y="20" class="label-text" fill="#e65100">Computational Steps:</text>
    
    <text x="10" y="45" class="small-text">1. Compute XᵀX: O(nm²)</text>
    <text x="10" y="65" class="small-text">2. Compute Xᵀy: O(nm)</text>
    <text x="10" y="85" class="small-text">3. Solve linear system: O(m³)</text>
    <text x="10" y="105" class="small-text">Total: O(nm² + m³)</text>
  </g>
  
  <!-- Practical considerations -->
  <g transform="translate(520, 470)">
    <rect x="0" y="0" width="220" height="140" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2" rx="8"/>
    <text x="10" y="20" class="label-text" fill="#6a1b9a">Practical Notes:</text>
    
    <text x="10" y="45" class="small-text">• Use QR decomposition for</text>
    <text x="15" y="60" class="small-text">numerical stability</text>
    <text x="10" y="80" class="small-text">• Check condition number</text>
    <text x="15" y="95" class="small-text">of XᵀX</text>
    <text x="10" y="115" class="small-text">• Consider regularization</text>
    <text x="15" y="130" class="small-text">for ill-conditioned problems</text>
  </g>
</svg>