<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#2c3e50">Support Vector Machine - Margin Maximization</text>
  
  <!-- Main plot area -->
  <g transform="translate(50, 80)">
    
    <!-- Background for plot -->
    <rect width="500" height="400" fill="white" stroke="#bdc3c7" stroke-width="2"/>
    
    <!-- Class 1 data points (red squares) -->
    <rect x="80" y="80" width="12" height="12" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
    <rect x="120" y="100" width="12" height="12" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
    <rect x="90" y="150" width="12" height="12" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
    <rect x="130" y="180" width="12" height="12" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
    <rect x="70" y="200" width="12" height="12" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
    <rect x="110" y="230" width="12" height="12" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
    <rect x="150" y="120" width="12" height="12" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
    
    <!-- Class 2 data points (blue circles) -->
    <circle cx="350" cy="120" r="8" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    <circle cx="400" cy="150" r="8" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    <circle cx="380" cy="200" r="8" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    <circle cx="420" cy="250" r="8" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    <circle cx="450" cy="180" r="8" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    <circle cx="360" cy="280" r="8" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    <circle cx="410" cy="320" r="8" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    
    <!-- Support vectors (highlighted) -->
    <rect x="150" y="120" width="12" height="12" fill="#e74c3c" stroke="#f39c12" stroke-width="4"/>
    <rect x="130" y="180" width="12" height="12" fill="#e74c3c" stroke="#f39c12" stroke-width="4"/>
    <circle cx="350" cy="120" r="8" fill="#3498db" stroke="#f39c12" stroke-width="4"/>
    <circle cx="380" cy="200" r="8" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    
    <!-- Decision boundary (optimal hyperplane) -->
    <line x1="200" y1="50" x2="300" y2="350" stroke="#2c3e50" stroke-width="4"/>
    
    <!-- Margin boundaries -->
    <line x1="170" y1="50" x2="270" y2="350" stroke="#34495e" stroke-width="2" stroke-dasharray="10,5"/>
    <line x1="230" y1="50" x2="330" y2="350" stroke="#34495e" stroke-width="2" stroke-dasharray="10,5"/>
    
    <!-- Margin arrows and labels -->
    <line x1="180" y1="200" x2="220" y2="200" stroke="#f39c12" stroke-width="3"/>
    <polygon points="175,200 185,195 185,205" fill="#f39c12"/>
    <polygon points="225,200 215,195 215,205" fill="#f39c12"/>
    <text x="200" y="190" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#f39c12">Margin</text>
    
    <!-- Distance lines from support vectors to boundaries -->
    <line x1="156" y1="126" x2="170" y2="140" stroke="#f39c12" stroke-width="2" stroke-dasharray="3,3"/>
    <line x1="356" y1="126" x2="330" y2="140" stroke="#f39c12" stroke-width="2" stroke-dasharray="3,3"/>
    
  </g>
  
  <!-- Legend -->
  <g transform="translate(580, 100)">
    <rect x="0" y="0" width="200" height="180" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2" rx="10"/>
    <text x="100" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">Legend</text>
    
    <!-- Class 1 -->
    <rect x="20" y="45" width="12" height="12" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
    <text x="45" y="56" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Class 1 (Red)</text>
    
    <!-- Class 2 -->
    <circle cx="26" cy="75" r="8" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    <text x="45" y="80" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Class 2 (Blue)</text>
    
    <!-- Support Vectors -->
    <circle cx="26" cy="100" r="8" fill="#3498db" stroke="#f39c12" stroke-width="4"/>
    <text x="45" y="105" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Support Vectors</text>
    
    <!-- Decision Boundary -->
    <line x1="20" y1="125" x2="35" y2="125" stroke="#2c3e50" stroke-width="3"/>
    <text x="45" y="130" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Decision Boundary</text>
    
    <!-- Margin -->
    <line x1="20" y1="150" x2="35" y2="150" stroke="#34495e" stroke-width="2" stroke-dasharray="5,2"/>
    <text x="45" y="155" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Margin Boundaries</text>
  </g>
  
  <!-- Key concepts -->
  <g transform="translate(50, 520)">
    <rect x="0" y="0" width="700" height="70" fill="#ffffff" stroke="#bdc3c7" stroke-width="2" rx="10"/>
    <text x="350" y="20" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">SVM Key Concepts</text>
    
    <text x="20" y="40" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f39c12">Support Vectors:</text>
    <text x="120" y="40" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Data points closest to the decision boundary</text>
    
    <text x="20" y="55" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#34495e">Margin:</text>
    <text x="70" y="55" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Distance between decision boundary and nearest data points. SVM maximizes this margin.</text>
  </g>
  
  <!-- Margin types comparison -->
  <g transform="translate(580, 300)">
    <rect x="0" y="0" width="200" height="200" fill="#ffffff" stroke="#bdc3c7" stroke-width="2" rx="10"/>
    <text x="100" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">Margin Types</text>
    
    <text x="10" y="45" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e74c3c">Hard Margin:</text>
    <text x="10" y="60" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• No misclassification</text>
    <text x="10" y="75" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Perfect separation</text>
    <text x="10" y="90" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Sensitive to outliers</text>
    
    <text x="10" y="115" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#27ae60">Soft Margin:</text>
    <text x="10" y="130" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Allows some errors</text>
    <text x="10" y="145" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• More robust</text>
    <text x="10" y="160" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Better generalization</text>
    
    <text x="10" y="185" font-family="Arial, sans-serif" font-size="10" fill="#9b59b6">C parameter controls trade-off</text>
  </g>
</svg>