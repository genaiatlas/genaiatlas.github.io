<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    Hypothesis Testing Process
  </text>
  
  <!-- Step 1 -->
  <rect x="50" y="70" width="200" height="80" fill="#e8f5e8" stroke="#4caf50" stroke-width="2" rx="10"/>
  <text x="150" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2e7d32">
    Step 1: State Hypotheses
  </text>
  <text x="70" y="115" font-family="Arial, sans-serif" font-size="12" fill="#333">
    H₀: Null hypothesis
  </text>
  <text x="70" y="130" font-family="Arial, sans-serif" font-size="12" fill="#333">
    H₁: Alternative hypothesis
  </text>
  
  <!-- Step 2 -->
  <rect x="300" y="70" width="200" height="80" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="10"/>
  <text x="400" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#f57c00">
    Step 2: Set α Level
  </text>
  <text x="320" y="115" font-family="Arial, sans-serif" font-size="12" fill="#333">
    Choose significance level
  </text>
  <text x="320" y="130" font-family="Arial, sans-serif" font-size="12" fill="#333">
    Common: α = 0.05
  </text>
  
  <!-- Step 3 -->
  <rect x="550" y="70" width="200" height="80" fill="#e3f2fd" stroke="#2196f3" stroke-width="2" rx="10"/>
  <text x="650" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1976d2">
    Step 3: Select Test
  </text>
  <text x="570" y="115" font-family="Arial, sans-serif" font-size="12" fill="#333">
    Choose test statistic
  </text>
  <text x="570" y="130" font-family="Arial, sans-serif" font-size="12" fill="#333">
    (t, z, χ², F, etc.)
  </text>
  
  <!-- Step 4 -->
  <rect x="175" y="200" width="200" height="80" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2" rx="10"/>
  <text x="275" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#7b1fa2">
    Step 4: Calculate
  </text>
  <text x="195" y="245" font-family="Arial, sans-serif" font-size="12" fill="#333">
    Compute test statistic
  </text>
  <text x="195" y="260" font-family="Arial, sans-serif" font-size="12" fill="#333">
    Find p-value
  </text>
  
  <!-- Step 5 -->
  <rect x="425" y="200" width="200" height="80" fill="#ffebee" stroke="#f44336" stroke-width="2" rx="10"/>
  <text x="525" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#d32f2f">
    Step 5: Decide
  </text>
  <text x="445" y="245" font-family="Arial, sans-serif" font-size="12" fill="#333">
    Compare p-value to α
  </text>
  <text x="445" y="260" font-family="Arial, sans-serif" font-size="12" fill="#333">
    Reject or fail to reject H₀
  </text>
  
  <!-- Decision branches -->
  <rect x="100" y="340" width="250" height="100" fill="#e8f5e8" stroke="#4caf50" stroke-width="2" rx="10"/>
  <text x="225" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2e7d32">
    p-value ≤ α
  </text>
  <text x="120" y="385" font-family="Arial, sans-serif" font-size="12" fill="#333">
    ✅ Reject H₀
  </text>
  <text x="120" y="400" font-family="Arial, sans-serif" font-size="12" fill="#333">
    ✅ Accept H₁
  </text>
  <text x="120" y="415" font-family="Arial, sans-serif" font-size="12" fill="#333">
    ✅ Result is statistically significant
  </text>
  
  <rect x="450" y="340" width="250" height="100" fill="#ffebee" stroke="#f44336" stroke-width="2" rx="10"/>
  <text x="575" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#d32f2f">
    p-value > α
  </text>
  <text x="470" y="385" font-family="Arial, sans-serif" font-size="12" fill="#333">
    ❌ Fail to reject H₀
  </text>
  <text x="470" y="400" font-family="Arial, sans-serif" font-size="12" fill="#333">
    ❌ Do not accept H₁
  </text>
  <text x="470" y="415" font-family="Arial, sans-serif" font-size="12" fill="#333">
    ❌ Result is not significant
  </text>
  
  <!-- Example box -->
  <rect x="200" y="480" width="400" height="80" fill="#f5f5f5" stroke="#757575" stroke-width="1" rx="5"/>
  <text x="400" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#424242">
    Example: Testing if μ = 100
  </text>
  <text x="220" y="525" font-family="Arial, sans-serif" font-size="12" fill="#333">
    H₀: μ = 100, H₁: μ ≠ 100, α = 0.05
  </text>
  <text x="220" y="540" font-family="Arial, sans-serif" font-size="12" fill="#333">
    Sample: x̄ = 103, s = 8, n = 25 → t = 1.875, p = 0.073
  </text>
  <text x="220" y="555" font-family="Arial, sans-serif" font-size="12" fill="#333">
    Decision: p > 0.05, so fail to reject H₀
  </text>
  
  <!-- Arrows -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  
  <!-- Flow arrows -->
  <path d="M 250 110 L 300 110" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 500 110 L 550 110" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 400 150 L 275 200" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 400 150 L 525 200" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 325 280 L 225 340" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 475 280 L 575 340" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
</svg>