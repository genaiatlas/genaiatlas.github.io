<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="675" fill="#f8fafc"/>
  
  <!-- Fast Track Ribbon -->
  <polygon points="1050,0 1200,0 1200,80 1050,60" fill="#3b82f6"/>
  <text x="1125" y="35" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">FAST TRACK</text>
  
  <!-- Title -->
  <text x="600" y="80" text-anchor="middle" fill="#1e293b" font-family="Arial, sans-serif" font-size="36" font-weight="bold">File I/O &amp; Working with Files</text>
  
  <!-- Reading Files -->
  <rect x="80" y="130" width="260" height="160" fill="#f0f9ff" stroke="#0284c7" stroke-width="2" rx="8"/>
  <text x="210" y="160" text-anchor="middle" fill="#0284c7" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Reading Files</text>
  <rect x="120" y="180" width="180" height="100" fill="#ffffff" stroke="#d1d5db" stroke-width="1" rx="4"/>
  <text x="130" y="200" fill="#374151" font-family="Courier, monospace" font-size="11">with open("file.txt", "r") as f:</text>
  <text x="140" y="220" fill="#374151" font-family="Courier, monospace" font-size="11">content = f.read()</text>
  <text x="140" y="240" fill="#374151" font-family="Courier, monospace" font-size="11">lines = f.readlines()</text>
  <text x="140" y="260" fill="#374151" font-family="Courier, monospace" font-size="11">for line in f:</text>
  
  <!-- Writing Files -->
  <rect x="360" y="130" width="260" height="160" fill="#ecfdf5" stroke="#059669" stroke-width="2" rx="8"/>
  <text x="490" y="160" text-anchor="middle" fill="#059669" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Writing Files</text>
  <rect x="400" y="180" width="180" height="100" fill="#ffffff" stroke="#d1d5db" stroke-width="1" rx="4"/>
  <text x="410" y="200" fill="#374151" font-family="Courier, monospace" font-size="11">with open("file.txt", "w") as f:</text>
  <text x="420" y="220" fill="#374151" font-family="Courier, monospace" font-size="11">f.write("Hello World")</text>
  <text x="420" y="240" fill="#374151" font-family="Courier, monospace" font-size="11">f.writelines(lines)</text>
  <text x="420" y="260" fill="#374151" font-family="Courier, monospace" font-size="11">print("Data", file=f)</text>
  
  <!-- CSV Handling -->
  <rect x="640" y="130" width="260" height="160" fill="#fef3c7" stroke="#d97706" stroke-width="2" rx="8"/>
  <text x="770" y="160" text-anchor="middle" fill="#d97706" font-family="Arial, sans-serif" font-size="18" font-weight="bold">CSV Handling</text>
  <rect x="680" y="180" width="180" height="100" fill="#ffffff" stroke="#d1d5db" stroke-width="1" rx="4"/>
  <text x="690" y="200" fill="#374151" font-family="Courier, monospace" font-size="11">import csv</text>
  <text x="690" y="220" fill="#374151" font-family="Courier, monospace" font-size="11">with open("data.csv") as f:</text>
  <text x="700" y="240" fill="#374151" font-family="Courier, monospace" font-size="11">reader = csv.reader(f)</text>
  <text x="700" y="260" fill="#374151" font-family="Courier, monospace" font-size="11">for row in reader:</text>
  
  <!-- File Modes -->
  <rect x="920" y="130" width="260" height="160" fill="#fce7f3" stroke="#db2777" stroke-width="2" rx="8"/>
  <text x="1050" y="160" text-anchor="middle" fill="#db2777" font-family="Arial, sans-serif" font-size="18" font-weight="bold">File Modes</text>
  <rect x="960" y="180" width="180" height="100" fill="#ffffff" stroke="#d1d5db" stroke-width="1" rx="4"/>
  <text x="970" y="200" fill="#374151" font-family="Courier, monospace" font-size="12">"r" - Read only</text>
  <text x="970" y="220" fill="#374151" font-family="Courier, monospace" font-size="12">"w" - Write (overwrite)</text>
  <text x="970" y="240" fill="#374151" font-family="Courier, monospace" font-size="12">"a" - Append</text>
  <text x="970" y="260" fill="#374151" font-family="Courier, monospace" font-size="12">"x" - Create new</text>
  
  <!-- File Operations Flow -->
  <rect x="100" y="320" width="1000" height="280" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="12"/>
  <text x="600" y="355" text-anchor="middle" fill="#1e293b" font-family="Arial, sans-serif" font-size="24" font-weight="bold">File Operation Best Practices</text>
  
  <!-- With Statement -->
  <rect x="150" y="380" width="200" height="80" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="8"/>
  <text x="250" y="405" text-anchor="middle" fill="#1e40af" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Use "with" Statement</text>
  <text x="250" y="425" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">Automatically closes files</text>
  <text x="250" y="445" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">Handles exceptions</text>
  
  <!-- Error Handling -->
  <rect x="370" y="380" width="200" height="80" fill="#dcfce7" stroke="#16a34a" stroke-width="2" rx="8"/>
  <text x="470" y="405" text-anchor="middle" fill="#15803d" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Handle Exceptions</text>
  <text x="470" y="425" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">FileNotFoundError</text>
  <text x="470" y="445" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">PermissionError</text>
  
  <!-- File Paths -->
  <rect x="590" y="380" width="200" height="80" fill="#fef3c7" stroke="#d97706" stroke-width="2" rx="8"/>
  <text x="690" y="405" text-anchor="middle" fill="#b45309" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Use Path Objects</text>
  <text x="690" y="425" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">pathlib module</text>
  <text x="690" y="445" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">Cross-platform paths</text>
  
  <!-- Binary Files -->
  <rect x="810" y="380" width="200" height="80" fill="#fce7f3" stroke="#db2777" stroke-width="2" rx="8"/>
  <text x="910" y="405" text-anchor="middle" fill="#be185d" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Binary vs Text</text>
  <text x="910" y="425" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">"rb", "wb" for binary</text>
  <text x="910" y="445" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12">Images, videos, etc.</text>
  
  <!-- Code Example -->
  <rect x="150" y="490" width="900" height="100" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" rx="6"/>
  <text x="600" y="510" text-anchor="middle" fill="#1e293b" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Complete Example with Error Handling</text>
  <text x="170" y="535" fill="#374151" font-family="Courier, monospace" font-size="12">try:</text>
  <text x="190" y="555" fill="#374151" font-family="Courier, monospace" font-size="12">with open("data.txt", "r") as file:</text>
  <text x="210" y="575" fill="#374151" font-family="Courier, monospace" font-size="12">content = file.read()</text>
  <text x="600" y="535" fill="#374151" font-family="Courier, monospace" font-size="12">except FileNotFoundError:</text>
  <text x="620" y="555" fill="#374151" font-family="Courier, monospace" font-size="12">print("File not found!")</text>
  <text x="620" y="575" fill="#374151" font-family="Courier, monospace" font-size="12">create_default_file()</text>
  
  <!-- Common File Types -->
  <text x="150" y="620" fill="#374151" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Common File Operations:</text>
  <text x="150" y="640" fill="#6b7280" font-family="Arial, sans-serif" font-size="12">Text files (.txt), CSV data (.csv), JSON config (.json), Log files (.log), Binary data (images, videos)</text>
  <text x="150" y="655" fill="#6b7280" font-family="Arial, sans-serif" font-size="12">Always specify encoding for text files: open("file.txt", "r", encoding="utf-8")</text>
</svg>