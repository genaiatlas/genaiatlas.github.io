<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="priorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4285f4;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#4285f4;stop-opacity:0.4"/>
    </linearGradient>
    <linearGradient id="likelihoodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ea4335;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#ea4335;stop-opacity:0.4"/>
    </linearGradient>
    <linearGradient id="posteriorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#34a853;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#34a853;stop-opacity:0.4"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1a1a1a">
    Bayesian Framework Overview
  </text>
  
  <!-- Prior Box -->
  <rect x="50" y="80" width="180" height="120" rx="10" fill="url(#priorGrad)" stroke="#4285f4" stroke-width="2"/>
  <text x="140" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a1a1a">
    Prior P(θ)
  </text>
  <text x="140" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">
    Initial beliefs
  </text>
  <text x="140" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">
    about parameters
  </text>
  <text x="140" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">
    before observing data
  </text>
  <text x="140" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4285f4">
    Domain Knowledge
  </text>
  
  <!-- Likelihood Box -->
  <rect x="310" y="80" width="180" height="120" rx="10" fill="url(#likelihoodGrad)" stroke="#ea4335" stroke-width="2"/>
  <text x="400" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a1a1a">
    Likelihood P(D|θ)
  </text>
  <text x="400" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">
    Probability of
  </text>
  <text x="400" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">
    observing data D
  </text>
  <text x="400" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">
    given parameter θ
  </text>
  <text x="400" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ea4335">
    Data Evidence
  </text>
  
  <!-- Posterior Box -->
  <rect x="570" y="80" width="180" height="120" rx="10" fill="url(#posteriorGrad)" stroke="#34a853" stroke-width="2"/>
  <text x="660" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a1a1a">
    Posterior P(θ|D)
  </text>
  <text x="660" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">
    Updated beliefs
  </text>
  <text x="660" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">
    about parameters
  </text>
  <text x="660" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">
    after observing data
  </text>
  <text x="660" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#34a853">
    Combined Knowledge
  </text>
  
  <!-- Multiplication Arrow -->
  <polygon points="240,140 270,135 270,145" fill="#666"/>
  <line x1="240" y1="140" x2="270" y2="140" stroke="#666" stroke-width="2"/>
  <text x="255" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#666">×</text>
  
  <!-- Equals Arrow -->
  <polygon points="500,140 530,135 530,145" fill="#666"/>
  <line x1="500" y1="140" x2="530" y2="140" stroke="#666" stroke-width="2"/>
  <text x="515" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#666">∝</text>
  
  <!-- Bayes' Theorem Formula -->
  <rect x="150" y="250" width="500" height="80" rx="10" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="400" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1a1a1a">
    Bayes' Theorem
  </text>
  <text x="400" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#333">
    P(θ|D) = P(D|θ) × P(θ) / P(D)
  </text>
  <text x="400" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#555">
    Posterior = (Likelihood × Prior) / Evidence
  </text>
  
  <!-- Key Benefits -->
  <text x="50" y="380" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a1a1a">
    Key Benefits:
  </text>
  <text x="50" y="405" font-family="Arial, sans-serif" font-size="13" fill="#333">
    • Uncertainty Quantification: Full probability distributions
  </text>
  <text x="50" y="425" font-family="Arial, sans-serif" font-size="13" fill="#333">
    • Prior Knowledge Integration: Incorporate domain expertise
  </text>
  <text x="50" y="445" font-family="Arial, sans-serif" font-size="13" fill="#333">
    • Sequential Learning: Update beliefs as new data arrives
  </text>
  <text x="50" y="465" font-family="Arial, sans-serif" font-size="13" fill="#333">
    • Natural Regularization: Priors prevent overfitting
  </text>
  
  <!-- ML Applications -->
  <text x="450" y="380" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a1a1a">
    ML Applications:
  </text>
  <text x="450" y="405" font-family="Arial, sans-serif" font-size="13" fill="#333">
    • Bayesian Neural Networks
  </text>
  <text x="450" y="425" font-family="Arial, sans-serif" font-size="13" fill="#333">
    • Gaussian Processes
  </text>
  <text x="450" y="445" font-family="Arial, sans-serif" font-size="13" fill="#333">
    • Bayesian Optimization
  </text>
  <text x="450" y="465" font-family="Arial, sans-serif" font-size="13" fill="#333">
    • Probabilistic Programming
  </text>
</svg>