<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #2c3e50; }
      .subtitle { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #34495e; }
      .label { font-family: Arial, sans-serif; font-size: 12px; fill: #2c3e50; }
      .formula { font-family: Arial, sans-serif; font-size: 16px; fill: #e74c3c; font-weight: bold; }
      .center { fill: #e74c3c; stroke: #c0392b; stroke-width: 2; }
      .point-cluster1 { fill: #3498db; stroke: #2980b9; stroke-width: 1; }
      .point-cluster2 { fill: #f39c12; stroke: #e67e22; stroke-width: 1; }
      .point-cluster3 { fill: #9b59b6; stroke: #8e44ad; stroke-width: 1; }
      .distance-line { stroke: #e67e22; stroke-width: 1; stroke-dasharray: 2,2; opacity: 0.7; }
      .axis { stroke: #34495e; stroke-width: 2; }
      .grid { stroke: #ecf0f1; stroke-width: 0.5; }
      .background { fill: #f8f9fa; stroke: #dee2e6; stroke-width: 1; }
      .formula-box { fill: #fff5f5; stroke: #e74c3c; stroke-width: 2; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#34495e"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title">K-Means Objective Function: Global Dissimilarity</text>
  
  <!-- Main visualization -->
  <g transform="translate(50, 60)">
    <rect x="0" y="0" width="500" height="300" class="background" rx="10"/>
    <text x="250" y="25" text-anchor="middle" class="subtitle">Minimizing Within-Cluster Sum of Squares</text>
    
    <!-- Coordinate system -->
    <g transform="translate(50, 250)">
      <!-- Axes -->
      <line x1="0" y1="0" x2="400" y2="0" class="axis" marker-end="url(#arrowhead)"/>
      <line x1="0" y1="0" x2="0" y2="-200" class="axis" marker-end="url(#arrowhead)"/>
      
      <!-- Grid -->
      <defs>
        <pattern id="grid-main" width="25" height="25" patternUnits="userSpaceOnUse">
          <path d="M 25 0 L 0 0 0 25" fill="none" class="grid"/>
        </pattern>
      </defs>
      <rect x="0" y="-200" width="400" height="200" fill="url(#grid-main)"/>
      
      <!-- Cluster 1 -->
      <circle cx="80" cy="-150" r="6" class="center"/>
      <text x="80" y="-130" text-anchor="middle" class="label">μ₁</text>
      
      <circle cx="70" cy="-160" r="4" class="point-cluster1"/>
      <circle cx="90" cy="-140" r="4" class="point-cluster1"/>
      <circle cx="75" cy="-145" r="4" class="point-cluster1"/>
      <circle cx="85" cy="-155" r="4" class="point-cluster1"/>
      
      <!-- Distance lines for cluster 1 -->
      <line x1="80" y1="-150" x2="70" y2="-160" class="distance-line"/>
      <line x1="80" y1="-150" x2="90" y2="-140" class="distance-line"/>
      <line x1="80" y1="-150" x2="75" y2="-145" class="distance-line"/>
      <line x1="80" y1="-150" x2="85" y2="-155" class="distance-line"/>
      
      <!-- Cluster 2 -->
      <circle cx="200" cy="-100" r="6" class="center"/>
      <text x="200" y="-80" text-anchor="middle" class="label">μ₂</text>
      
      <circle cx="190" cy="-110" r="4" class="point-cluster2"/>
      <circle cx="210" cy="-90" r="4" class="point-cluster2"/>
      <circle cx="195" cy="-95" r="4" class="point-cluster2"/>
      <circle cx="205" cy="-105" r="4" class="point-cluster2"/>
      <circle cx="185" cy="-100" r="4" class="point-cluster2"/>
      
      <!-- Distance lines for cluster 2 -->
      <line x1="200" y1="-100" x2="190" y2="-110" class="distance-line"/>
      <line x1="200" y1="-100" x2="210" y2="-90" class="distance-line"/>
      <line x1="200" y1="-100" x2="195" y2="-95" class="distance-line"/>
      <line x1="200" y1="-100" x2="205" y2="-105" class="distance-line"/>
      <line x1="200" y1="-100" x2="185" y2="-100" class="distance-line"/>
      
      <!-- Cluster 3 -->
      <circle cx="320" cy="-170" r="6" class="center"/>
      <text x="320" y="-150" text-anchor="middle" class="label">μ₃</text>
      
      <circle cx="310" cy="-180" r="4" class="point-cluster3"/>
      <circle cx="330" cy="-160" r="4" class="point-cluster3"/>
      <circle cx="315" cy="-165" r="4" class="point-cluster3"/>
      
      <!-- Distance lines for cluster 3 -->
      <line x1="320" y1="-170" x2="310" y2="-180" class="distance-line"/>
      <line x1="320" y1="-170" x2="330" y2="-160" class="distance-line"/>
      <line x1="320" y1="-170" x2="315" y2="-165" class="distance-line"/>
      
      <!-- Axis labels -->
      <text x="410" y="5" class="label">Feature 1</text>
      <text x="-15" y="-205" class="label">Feature 2</text>
    </g>
    
    <!-- Legend -->
    <g transform="translate(350, 50)">
      <circle cx="0" cy="0" r="4" class="point-cluster1"/>
      <text x="10" y="5" class="label">Cluster 1 points</text>
      
      <circle cx="0" cy="20" r="4" class="point-cluster2"/>
      <text x="10" y="25" class="label">Cluster 2 points</text>
      
      <circle cx="0" cy="40" r="4" class="point-cluster3"/>
      <text x="10" y="45" class="label">Cluster 3 points</text>
      
      <circle cx="0" cy="60" r="6" class="center"/>
      <text x="10" y="65" class="label">Cluster centers μₖ</text>
      
      <line x1="0" y1="80" x2="20" y2="80" class="distance-line"/>
      <text x="25" y="85" class="label">Distances to center</text>
    </g>
  </g>
  
  <!-- Mathematical Formulation -->
  <g transform="translate(50, 380)">
    <rect x="0" y="0" width="700" height="180" class="formula-box" rx="10"/>
    <text x="350" y="25" text-anchor="middle" class="subtitle">Mathematical Formulation</text>
    
    <!-- Main formula -->
    <g transform="translate(50, 50)">
      <text x="0" y="0" class="formula">Objective Function (to minimize):</text>
      
      <text x="0" y="30" class="formula" style="font-size: 20px;">J = Σ   Σ     Σ   (x   - μ  )²</text>
      <text x="40" y="50" class="label" style="font-size: 12px;">k=1  n∈Sₖ  d=1</text>
      <text x="15" y="50" class="label" style="font-size: 12px;">K</text>
      <text x="130" y="50" class="label" style="font-size: 12px;">D</text>
      <text x="170" y="35" class="label" style="font-size: 12px;">n,d</text>
      <text x="190" y="35" class="label" style="font-size: 12px;">k,d</text>
      
      <text x="0" y="80" class="label">Where:</text>
      <text x="0" y="100" class="label">• K = number of clusters</text>
      <text x="0" y="115" class="label">• Sₖ = set of points assigned to cluster k</text>
      <text x="0" y="130" class="label">• D = number of features (dimensions)</text>
      <text x="0" y="145" class="label">• xₙ,ᵈ = value of feature d for point n</text>
      <text x="0" y="160" class="label">• μₖ,ᵈ = value of feature d for cluster center k</text>
    </g>
    
    <!-- Interpretation -->
    <g transform="translate(400, 50)">
      <text x="0" y="0" class="subtitle">Algorithm Goal:</text>
      <text x="0" y="25" class="label">Find cluster centers μₖ and</text>
      <text x="0" y="40" class="label">assignments that minimize J</text>
      
      <text x="0" y="70" class="subtitle">Nested Summation:</text>
      <text x="0" y="90" class="label">1. Sum over all K clusters</text>
      <text x="0" y="105" class="label">2. Sum over all points in each cluster</text>
      <text x="0" y="120" class="label">3. Sum over all D features</text>
      
      <text x="0" y="150" class="subtitle" style="color: #27ae60;">Result: Total within-cluster variance</text>
    </g>
  </g>
  
  <!-- Algorithm Connection -->
  <g transform="translate(600, 60)">
    <rect x="0" y="0" width="180" height="140" fill="#e8f5e8" stroke="#27ae60" stroke-width="2" rx="10"/>
    <text x="90" y="20" text-anchor="middle" class="subtitle" style="color: #27ae60;">How Algorithm Works</text>
    
    <text x="10" y="45" class="label">1. <tspan style="font-weight: bold;">Assignment Step:</tspan></text>
    <text x="10" y="60" class="label">   Minimize J by optimal</text>
    <text x="10" y="75" class="label">   point assignments</text>
    
    <text x="10" y="100" class="label">2. <tspan style="font-weight: bold;">Update Step:</tspan></text>
    <text x="10" y="115" class="label">   Minimize J by optimal</text>
    <text x="10" y="130" class="label">   center placement</text>
  </g>
</svg>