<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="900" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#2c3e50">Binary Classification Applications</text>
  
  <!-- Central Binary Classification Circle -->
  <g transform="translate(450, 300)">
    <circle cx="0" cy="0" r="80" fill="#3f51b5" opacity="0.1" stroke="#3f51b5" stroke-width="3"/>
    <text x="0" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#3f51b5">Binary</text>
    <text x="0" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#3f51b5">Classification</text>
  </g>
  
  <!-- Finance Sector -->
  <g transform="translate(150, 150)">
    <rect x="-70" y="-40" width="140" height="80" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="10"/>
    <text x="0" y="-20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e65100">💳 Finance</text>
    <text x="0" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e65100">Fraud vs Legitimate</text>
    <text x="0" y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e65100">Credit Approve vs Deny</text>
    <text x="0" y="21" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e65100">Buy vs Sell Signal</text>
    
    <!-- Connection line -->
    <line x1="70" y1="0" x2="300" y2="120" stroke="#999" stroke-width="2" stroke-dasharray="3,3"/>
  </g>
  
  <!-- Healthcare Sector -->
  <g transform="translate(750, 150)">
    <rect x="-70" y="-40" width="140" height="80" fill="#e8f5e8" stroke="#4caf50" stroke-width="2" rx="10"/>
    <text x="0" y="-20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2e7d32">🏥 Healthcare</text>
    <text x="0" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2e7d32">Healthy vs Disease</text>
    <text x="0" y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2e7d32">Benign vs Malignant</text>
    <text x="0" y="21" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2e7d32">Drug Effective vs Not</text>
    
    <!-- Connection line -->
    <line x1="-70" y1="0" x2="-300" y2="120" stroke="#999" stroke-width="2" stroke-dasharray="3,3"/>
  </g>
  
  <!-- Technology Sector -->
  <g transform="translate(150, 450)">
    <rect x="-70" y="-40" width="140" height="80" fill="#e3f2fd" stroke="#2196f3" stroke-width="2" rx="10"/>
    <text x="0" y="-20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1565c0">💻 Technology</text>
    <text x="0" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1565c0">Spam vs Ham Email</text>
    <text x="0" y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1565c0">Male vs Female (Image)</text>
    <text x="0" y="21" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1565c0">Object Present vs Absent</text>
    
    <!-- Connection line -->
    <line x1="70" y1="0" x2="300" y2="-120" stroke="#999" stroke-width="2" stroke-dasharray="3,3"/>
  </g>
  
  <!-- Security Sector -->
  <g transform="translate(750, 450)">
    <rect x="-70" y="-40" width="140" height="80" fill="#fce4ec" stroke="#e91e63" stroke-width="2" rx="10"/>
    <text x="0" y="-20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#c2185b">🔒 Security</text>
    <text x="0" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#c2185b">Intrusion vs Normal</text>
    <text x="0" y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#c2185b">Authorized vs Unauthorized</text>
    <text x="0" y="21" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#c2185b">Threat vs Safe</text>
    
    <!-- Connection line -->
    <line x1="-70" y1="0" x2="-300" y2="-120" stroke="#999" stroke-width="2" stroke-dasharray="3,3"/>
  </g>
  
  <!-- Detailed Example Boxes -->
  
  <!-- Credit Card Example -->
  <g transform="translate(50, 50)">
    <rect x="0" y="0" width="200" height="70" fill="#fff8e1" stroke="#ffa000" stroke-width="1" rx="5"/>
    <text x="10" y="15" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e65100">Credit Card Transaction</text>
    <text x="10" y="30" font-family="Arial, sans-serif" font-size="10" fill="#666">Features: Amount, Location, Time</text>
    <text x="10" y="45" font-family="Arial, sans-serif" font-size="10" fill="#666">Decision: Block (0) or Approve (1)</text>
    <text x="10" y="60" font-family="Arial, sans-serif" font-size="10" fill="#666">Speed: &lt; 100ms required</text>
  </g>
  
  <!-- Medical Example -->
  <g transform="translate(650, 50)">
    <rect x="0" y="0" width="200" height="70" fill="#f1f8e9" stroke="#689f38" stroke-width="1" rx="5"/>
    <text x="10" y="15" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2e7d32">Heart Attack Diagnosis</text>
    <text x="10" y="30" font-family="Arial, sans-serif" font-size="10" fill="#666">Features: Symptoms, Vitals, Tests</text>
    <text x="10" y="45" font-family="Arial, sans-serif" font-size="10" fill="#666">Decision: Heart Attack (1) or Not (0)</text>
    <text x="10" y="60" font-family="Arial, sans-serif" font-size="10" fill="#666">Accuracy: &gt; 99% required</text>
  </g>
  
  <!-- Email Example -->
  <g transform="translate(50, 520)">
    <rect x="0" y="0" width="200" height="70" fill="#e8eaf6" stroke="#3f51b5" stroke-width="1" rx="5"/>
    <text x="10" y="15" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1565c0">Email Classification</text>
    <text x="10" y="30" font-family="Arial, sans-serif" font-size="10" fill="#666">Features: Words, Sender, Links</text>
    <text x="10" y="45" font-family="Arial, sans-serif" font-size="10" fill="#666">Decision: Spam (1) or Ham (0)</text>
    <text x="10" y="60" font-family="Arial, sans-serif" font-size="10" fill="#666">Volume: Millions per day</text>
  </g>
  
  <!-- Biometric Example -->
  <g transform="translate(650, 520)">
    <rect x="0" y="0" width="200" height="70" fill="#fce4ec" stroke="#e91e63" stroke-width="1" rx="5"/>
    <text x="10" y="15" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#c2185b">Biometric Authentication</text>
    <text x="10" y="30" font-family="Arial, sans-serif" font-size="10" fill="#666">Features: Fingerprint, Face, Voice</text>
    <text x="10" y="45" font-family="Arial, sans-serif" font-size="10" fill="#666">Decision: Authorized (1) or Not (0)</text>
    <text x="10" y="60" font-family="Arial, sans-serif" font-size="10" fill="#666">Security: High precision needed</text>
  </g>
  
  <!-- Performance Requirements Legend -->
  <g transform="translate(300, 70)">
    <rect x="0" y="0" width="300" height="100" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="5"/>
    <text x="150" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Performance Requirements</text>
    
    <text x="10" y="35" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#d32f2f">High Speed:</text>
    <text x="80" y="35" font-family="Arial, sans-serif" font-size="10" fill="#666">Financial transactions, Real-time security</text>
    
    <text x="10" y="50" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ff9800">High Accuracy:</text>
    <text x="80" y="50" font-family="Arial, sans-serif" font-size="10" fill="#666">Medical diagnosis, Safety-critical systems</text>
    
    <text x="10" y="65" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#388e3c">High Volume:</text>
    <text x="80" y="65" font-family="Arial, sans-serif" font-size="10" fill="#666">Email filtering, Content moderation</text>
    
    <text x="10" y="80" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1976d2">Interpretability:</text>
    <text x="80" y="80" font-family="Arial, sans-serif" font-size="10" fill="#666">Legal decisions, Regulatory compliance</text>
  </g>
  
  <!-- Common Challenges Box -->
  <g transform="translate(300, 480)">
    <rect x="0" y="0" width="300" height="100" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="5"/>
    <text x="150" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Common Challenges</text>
    
    <text x="10" y="35" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#d32f2f">Class Imbalance:</text>
    <text x="100" y="35" font-family="Arial, sans-serif" font-size="10" fill="#666">Fraud (0.1%) vs Normal (99.9%)</text>
    
    <text x="10" y="50" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ff9800">Cost Sensitivity:</text>
    <text x="100" y="50" font-family="Arial, sans-serif" font-size="10" fill="#666">False positives vs False negatives</text>
    
    <text x="10" y="65" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#388e3c">Data Quality:</text>
    <text x="100" y="65" font-family="Arial, sans-serif" font-size="10" fill="#666">Missing values, Noise, Outliers</text>
    
    <text x="10" y="80" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1976d2">Concept Drift:</text>
    <text x="100" y="80" font-family="Arial, sans-serif" font-size="10" fill="#666">Changing patterns over time</text>
  </g>
</svg>