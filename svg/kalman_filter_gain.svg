<svg viewBox="0 0 1200 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="600" y="40" font-size="28" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Kalman Filter Gain: Balancing Prediction vs Measurement</text>
  
  <!-- Main equation box -->
  <rect x="300" y="70" width="600" height="80" rx="10" fill="#e3f2fd" stroke="#2c5aa0" stroke-width="3"/>
  <text x="600" y="105" font-size="18" font-weight="bold" text-anchor="middle" fill="#2c5aa0">Kalman Gain Equation</text>
  <text x="600" y="135" font-size="20" text-anchor="middle" fill="#1a1a1a">Kₜ = Σₜ|ₜ₋₁ · Bᵀ · (B · Σₜ|ₜ₋₁ · Bᵀ + R)⁻¹</text>
  
  <!-- Updated estimate equation -->
  <rect x="250" y="180" width="700" height="60" rx="10" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="600" y="210" font-size="16" font-weight="bold" text-anchor="middle" fill="#e65100">State Update Formula</text>
  <text x="600" y="235" font-size="18" text-anchor="middle" fill="#1a1a1a">μₜ|ₜ = μₜ|ₜ₋₁ + Kₜ · (Yₜ - B · μₜ|ₜ₋₁)</text>
  
  <!-- Interpretation diagram -->
  <text x="600" y="285" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Gain Interpretation: Weighted Average</text>
  
  <!-- Low Gain Section -->
  <rect x="50" y="320" width="350" height="280" rx="12" fill="#ffebee" stroke="#c62828" stroke-width="3"/>
  <text x="225" y="355" font-size="20" font-weight="bold" text-anchor="middle" fill="#c62828">LOW GAIN (Kₜ → 0)</text>
  
  <text x="70" y="390" font-size="16" font-weight="bold" fill="#1a1a1a">Trust Prediction More</text>
  <text x="80" y="415" font-size="14" fill="#333">State update reduces to:</text>
  <text x="225" y="440" font-size="15" text-anchor="middle" fill="#1a1a1a">μₜ|ₜ ≈ μₜ|ₜ₋₁</text>
  
  <text x="70" y="475" font-size="14" font-weight="bold" fill="#c62828">Characteristics:</text>
  <text x="80" y="495" font-size="13" fill="#333">✓ Smoother output</text>
  <text x="80" y="513" font-size="13" fill="#333">✓ Less noise sensitivity</text>
  <text x="80" y="531" font-size="13" fill="#333">✗ Slower response to changes</text>
  <text x="80" y="549" font-size="13" fill="#333">✗ May lag behind true state</text>
  
  <text x="70" y="575" font-size="13" font-weight="bold" fill="#1a1a1a">Occurs when:</text>
  <text x="80" y="592" font-size="12" fill="#666">• High measurement noise (R large)</text>
  
  <!-- Medium Gain Section -->
  <rect x="425" y="320" width="350" height="280" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/>
  <text x="600" y="355" font-size="20" font-weight="bold" text-anchor="middle" fill="#2e7d32">OPTIMAL GAIN</text>
  
  <text x="445" y="390" font-size="16" font-weight="bold" fill="#1a1a1a">Balanced Trust</text>
  <text x="455" y="415" font-size="14" fill="#333">Weighted combination:</text>
  <text x="600" y="440" font-size="14" text-anchor="middle" fill="#1a1a1a">Prediction ← Kₜ → Measurement</text>
  
  <text x="445" y="475" font-size="14" font-weight="bold" fill="#2e7d32">Characteristics:</text>
  <text x="455" y="495" font-size="13" fill="#333">✓ Minimum variance estimate</text>
  <text x="455" y="513" font-size="13" fill="#333">✓ Optimal noise filtering</text>
  <text x="455" y="531" font-size="13" fill="#333">✓ Good tracking performance</text>
  <text x="455" y="549" font-size="13" fill="#333">✓ Adaptive to conditions</text>
  
  <text x="445" y="575" font-size="13" font-weight="bold" fill="#1a1a1a">Computed from:</text>
  <text x="455" y="592" font-size="12" fill="#666">• Prediction uncertainty Σₜ|ₜ₋₁ and R</text>
  
  <!-- High Gain Section -->
  <rect x="800" y="320" width="350" height="280" rx="12" fill="#e1f5fe" stroke="#01579b" stroke-width="3"/>
  <text x="975" y="355" font-size="20" font-weight="bold" text-anchor="middle" fill="#01579b">HIGH GAIN (Kₜ → I)</text>
  
  <text x="820" y="390" font-size="16" font-weight="bold" fill="#1a1a1a">Trust Measurement More</text>
  <text x="830" y="415" font-size="14" fill="#333">State update emphasizes new data:</text>
  <text x="975" y="440" font-size="15" text-anchor="middle" fill="#1a1a1a">μₜ|ₜ ≈ B⁻¹ · Yₜ</text>
  
  <text x="820" y="475" font-size="14" font-weight="bold" fill="#01579b">Characteristics:</text>
  <text x="830" y="495" font-size="13" fill="#333">✓ Fast response to changes</text>
  <text x="830" y="513" font-size="13" fill="#333">✓ Tracks rapid variations</text>
  <text x="830" y="531" font-size="13" fill="#333">✗ More noise in output</text>
  <text x="830" y="549" font-size="13" fill="#333">✗ Can be erratic</text>
  
  <text x="820" y="575" font-size="13" font-weight="bold" fill="#1a1a1a">Occurs when:</text>
  <text x="830" y="592" font-size="12" fill="#666">• Low measurement noise (R small)</text>
  
  <!-- Visualization of gain effect -->
  <text x="600" y="645" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Effect on Estimate</text>
  
  <!-- Low gain graph -->
  <rect x="80" y="670" width="280" height="180" rx="8" fill="#fff" stroke="#c62828" stroke-width="2"/>
  <text x="220" y="695" font-size="14" font-weight="bold" text-anchor="middle" fill="#c62828">Low Gain</text>
  <line x1="100" y1="820" x2="340" y2="820" stroke="#333" stroke-width="1"/>
  <line x1="100" y1="820" x2="100" y2="700" stroke="#333" stroke-width="1"/>
  
  <!-- Smooth curve for low gain -->
  <path d="M 110 780 Q 160 770 210 768 T 330 765" stroke="#c62828" stroke-width="3" fill="none"/>
  <circle cx="210" cy="740" r="5" fill="#00695c"/>
  <text x="220" y="735" font-size="11" fill="#00695c">Measurement</text>
  <text x="110" y="845" font-size="11" fill="#333">Time →</text>
  <text x="85" y="710" font-size="11" fill="#333">State</text>
  
  <!-- Optimal gain graph -->
  <rect x="460" y="670" width="280" height="180" rx="8" fill="#fff" stroke="#2e7d32" stroke-width="2"/>
  <text x="600" y="695" font-size="14" font-weight="bold" text-anchor="middle" fill="#2e7d32">Optimal Gain</text>
  <line x1="480" y1="820" x2="720" y2="820" stroke="#333" stroke-width="1"/>
  <line x1="480" y1="820" x2="480" y2="700" stroke="#333" stroke-width="1"/>
  
  <!-- Balanced curve -->
  <path d="M 490 780 Q 540 760 590 755 T 710 748" stroke="#2e7d32" stroke-width="3" fill="none"/>
  <circle cx="590" cy="735" r="5" fill="#00695c"/>
  <text x="600" y="730" font-size="11" fill="#00695c">Measurement</text>
  <text x="490" y="845" font-size="11" fill="#333">Time →</text>
  
  <!-- High gain graph -->
  <rect x="840" y="670" width="280" height="180" rx="8" fill="#fff" stroke="#01579b" stroke-width="2"/>
  <text x="980" y="695" font-size="14" font-weight="bold" text-anchor="middle" fill="#01579b">High Gain</text>
  <line x1="860" y1="820" x2="1100" y2="820" stroke="#333" stroke-width="1"/>
  <line x1="860" y1="820" x2="860" y2="700" stroke="#333" stroke-width="1"/>
  
  <!-- Noisy curve for high gain -->
  <path d="M 870 780 L 890 770 L 910 790 L 930 760 L 950 775 L 970 755 L 990 780 L 1010 750 L 1030 770 L 1050 745 L 1070 760 L 1090 740" stroke="#01579b" stroke-width="3" fill="none"/>
  <circle cx="970" cy="735" r="5" fill="#00695c"/>
  <text x="980" y="730" font-size="11" fill="#00695c">Measurement</text>
  <text x="870" y="845" font-size="11" fill="#333">Time →</text>
  
  <!-- Key insight -->
  <rect x="200" y="900" width="800" height="80" rx="10" fill="#fff9c4" stroke="#f57f17" stroke-width="2"/>
  <text x="600" y="930" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a1a1a">🔑 Key Insight</text>
  <text x="600" y="955" font-size="14" text-anchor="middle" fill="#333">The Kalman gain automatically adapts based on prediction uncertainty (Σₜ|ₜ₋₁) and</text>
  <text x="600" y="972" font-size="14" text-anchor="middle" fill="#333">measurement noise (R) to find the optimal balance between smoothing and responsiveness</text>
</svg>