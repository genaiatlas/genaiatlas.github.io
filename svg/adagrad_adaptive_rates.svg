<svg viewBox="0 0 800 550" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="550" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">
    Adagrad: Adaptive Learning Rate Mechanism
  </text>
  
  <!-- Parameter comparison section -->
  <g transform="translate(50, 70)">
    <!-- Dense parameter section -->
    <g>
      <text x="150" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#e74c3c">
        Dense Feature Parameter
      </text>
      
      <rect x="20" y="30" width="260" height="120" fill="#fdf2f2" stroke="#e74c3c" stroke-width="2" rx="5"/>
      
      <!-- Frequent updates visualization -->
      <text x="35" y="55" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">
        Update Frequency: HIGH
      </text>
      
      <!-- Timeline with frequent updates -->
      <line x1="40" y1="75" x2="240" y2="75" stroke="#7f8c8d" stroke-width="2"/>
      
      <!-- Many update points -->
      <circle cx="60" cy="75" r="3" fill="#e74c3c"/>
      <circle cx="80" cy="75" r="3" fill="#e74c3c"/>
      <circle cx="100" cy="75" r="3" fill="#e74c3c"/>
      <circle cx="120" cy="75" r="3" fill="#e74c3c"/>
      <circle cx="140" cy="75" r="3" fill="#e74c3c"/>
      <circle cx="160" cy="75" r="3" fill="#e74c3c"/>
      <circle cx="180" cy="75" r="3" fill="#e74c3c"/>
      <circle cx="200" cy="75" r="3" fill="#e74c3c"/>
      <circle cx="220" cy="75" r="3" fill="#e74c3c"/>
      
      <!-- Accumulated gradients -->
      <text x="35" y="100" font-family="Arial, sans-serif" font-size="11" fill="#666">
        G(t) = Σ(∇J)² = Large value
      </text>
      
      <!-- Resulting learning rate -->
      <text x="35" y="120" font-family="Arial, sans-serif" font-size="11" fill="#e74c3c" font-weight="bold">
        Learning Rate: η/√G(t) = SMALL
      </text>
      
      <text x="35" y="135" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">
        → Conservative updates
      </text>
    </g>
    
    <!-- Sparse parameter section -->
    <g transform="translate(400, 0)">
      <text x="150" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#3498db">
        Sparse Feature Parameter
      </text>
      
      <rect x="20" y="30" width="260" height="120" fill="#e8f4fd" stroke="#3498db" stroke-width="2" rx="5"/>
      
      <!-- Infrequent updates visualization -->
      <text x="35" y="55" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">
        Update Frequency: LOW
      </text>
      
      <!-- Timeline with sparse updates -->
      <line x1="40" y1="75" x2="240" y2="75" stroke="#7f8c8d" stroke-width="2"/>
      
      <!-- Few update points -->
      <circle cx="80" cy="75" r="3" fill="#3498db"/>
      <circle cx="140" cy="75" r="3" fill="#3498db"/>
      <circle cx="200" cy="75" r="3" fill="#3498db"/>
      
      <!-- Gaps for sparse updates -->
      <text x="110" y="65" font-family="Arial, sans-serif" font-size="8" fill="#bdc3c7">...</text>
      <text x="170" y="65" font-family="Arial, sans-serif" font-size="8" fill="#bdc3c7">...</text>
      
      <!-- Accumulated gradients -->
      <text x="35" y="100" font-family="Arial, sans-serif" font-size="11" fill="#666">
        G(t) = Σ(∇J)² = Small value
      </text>
      
      <!-- Resulting learning rate -->
      <text x="35" y="120" font-family="Arial, sans-serif" font-size="11" fill="#3498db" font-weight="bold">
        Learning Rate: η/√G(t) = LARGE
      </text>
      
      <text x="35" y="135" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">
        → Aggressive updates
      </text>
    </g>
  </g>
  
  <!-- Mathematical formulation -->
  <g transform="translate(50, 230)">
    <rect x="0" y="0" width="700" height="100" fill="#f4f4f4" stroke="#95a5a6" stroke-width="1" rx="5"/>
    
    <text x="20" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
      Adagrad Mathematical Formulation:
    </text>
    
    <text x="50" y="50" font-family="Arial, sans-serif" font-size="13" fill="#333">
      G⁽ᵗ⁾ = G⁽ᵗ⁻¹⁾ + (∇J(θ))²
    </text>
    <text x="400" y="50" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">
      (Accumulate squared gradients)
    </text>
    
    <text x="50" y="75" font-family="Arial, sans-serif" font-size="13" fill="#333">
      θ⁽ᵗ⁺¹⁾ = θ⁽ᵗ⁾ - (η / √(G⁽ᵗ⁾ + ε)) · ∇J(θ)
    </text>
    <text x="400" y="75" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">
      (Adaptive parameter update)
    </text>
  </g>
  
  <!-- Learning rate evolution chart -->
  <g transform="translate(50, 360)">
    <text x="300" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#34495e">
      Learning Rate Evolution Over Time
    </text>
    
    <!-- Chart background -->
    <rect x="50" y="30" width="500" height="120" fill="white" stroke="#ddd" stroke-width="1"/>
    
    <!-- Axes -->
    <line x1="50" y1="150" x2="550" y2="150" stroke="#333" stroke-width="2"/>
    <line x1="50" y1="30" x2="50" y2="150" stroke="#333" stroke-width="2"/>
    
    <!-- X-axis labels -->
    <text x="50" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">0</text>
    <text x="200" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">100</text>
    <text x="350" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">200</text>
    <text x="500" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">300</text>
    <text x="300" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">Training Iterations</text>
    
    <!-- Y-axis labels -->
    <text x="40" y="155" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#666">0</text>
    <text x="40" y="120" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#666">0.01</text>
    <text x="40" y="85" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#666">0.02</text>
    <text x="40" y="50" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#666">0.03</text>
    <text x="20" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666" transform="rotate(-90, 20, 90)">Learning Rate</text>
    
    <!-- Dense parameter learning rate curve (decreasing rapidly) -->
    <path d="M 50 50 Q 150 60 250 90 Q 350 110 450 130 Q 500 140 550 145"
          fill="none" stroke="#e74c3c" stroke-width="3"/>
    
    <!-- Sparse parameter learning rate curve (decreasing slowly) -->
    <path d="M 50 50 Q 150 52 250 58 Q 350 65 450 75 Q 500 80 550 85"
          fill="none" stroke="#3498db" stroke-width="3"/>
    
    <!-- Legend -->
    <g transform="translate(400, 50)">
      <rect x="0" y="0" width="120" height="50" fill="white" stroke="#ddd" stroke-width="1"/>
      <line x1="10" y1="15" x2="30" y2="15" stroke="#e74c3c" stroke-width="3"/>
      <text x="35" y="19" font-family="Arial, sans-serif" font-size="10" fill="#333">Dense features</text>
      <line x1="10" y1="35" x2="30" y2="35" stroke="#3498db" stroke-width="3"/>
      <text x="35" y="39" font-family="Arial, sans-serif" font-size="10" fill="#333">Sparse features</text>
    </g>
  </g>
  
  <!-- Key insights -->
  <g transform="translate(600, 360)">
    <rect x="0" y="30" width="150" height="120" fill="#e8f5e8" stroke="#27ae60" stroke-width="1" rx="5"/>
    <text x="75" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#27ae60">
      Key Insight
    </text>
    <text x="10" y="70" font-family="Arial, sans-serif" font-size="10" fill="#333">
      Adagrad automatically
    </text>
    <text x="10" y="85" font-family="Arial, sans-serif" font-size="10" fill="#333">
      adjusts learning rates
    </text>
    <text x="10" y="100" font-family="Arial, sans-serif" font-size="10" fill="#333">
      based on parameter
    </text>
    <text x="10" y="115" font-family="Arial, sans-serif" font-size="10" fill="#333">
      update frequency!
    </text>
    <text x="10" y="135" font-family="Arial, sans-serif" font-size="10" fill="#27ae60" font-weight="bold">
      → Perfect for sparse data
    </text>
  </g>
</svg>