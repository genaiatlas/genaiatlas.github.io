<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="800" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="600" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Computational Complexity Comparison
  </text>
  
  <!-- Arrow marker definition must come first -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#2c3e50"/>
    </marker>
  </defs>
  
  <!-- Graph axes -->
  <line x1="100" y1="500" x2="100" y2="100" stroke="#2c3e50" stroke-width="3"/>
  <line x1="100" y1="500" x2="1100" y2="500" stroke="#2c3e50" stroke-width="3"/>
  
  <!-- Y-axis label -->
  <text x="40" y="300" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50" transform="rotate(-90, 40, 300)">
    Time Complexity (log scale)
  </text>
  
  <!-- X-axis label -->
  <text x="600" y="540" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Problem Size (N nodes, k budget)
  </text>
  
  <!-- Y-axis ticks and labels -->
  <line x1="95" y1="450" x2="100" y2="450" stroke="#2c3e50" stroke-width="2"/>
  <text x="85" y="455" font-family="Arial, sans-serif" font-size="11" text-anchor="end" fill="#2c3e50">10³</text>
  
  <line x1="95" y1="400" x2="100" y2="400" stroke="#2c3e50" stroke-width="2"/>
  <text x="85" y="405" font-family="Arial, sans-serif" font-size="11" text-anchor="end" fill="#2c3e50">10⁶</text>
  
  <line x1="95" y1="350" x2="100" y2="350" stroke="#2c3e50" stroke-width="2"/>
  <text x="85" y="355" font-family="Arial, sans-serif" font-size="11" text-anchor="end" fill="#2c3e50">10⁹</text>
  
  <line x1="95" y1="300" x2="100" y2="300" stroke="#2c3e50" stroke-width="2"/>
  <text x="85" y="305" font-family="Arial, sans-serif" font-size="11" text-anchor="end" fill="#2c3e50">10¹²</text>
  
  <line x1="95" y1="250" x2="100" y2="250" stroke="#2c3e50" stroke-width="2"/>
  <text x="85" y="255" font-family="Arial, sans-serif" font-size="11" text-anchor="end" fill="#2c3e50">10¹⁵</text>
  
  <line x1="95" y1="200" x2="100" y2="200" stroke="#2c3e50" stroke-width="2"/>
  <text x="85" y="205" font-family="Arial, sans-serif" font-size="11" text-anchor="end" fill="#2c3e50">10¹⁸</text>
  
  <line x1="95" y1="150" x2="100" y2="150" stroke="#2c3e50" stroke-width="2"/>
  <text x="85" y="155" font-family="Arial, sans-serif" font-size="11" text-anchor="end" fill="#2c3e50">10²¹</text>
  
  <line x1="95" y1="100" x2="100" y2="100" stroke="#2c3e50" stroke-width="2"/>
  <text x="85" y="105" font-family="Arial, sans-serif" font-size="11" text-anchor="end" fill="#2c3e50">10²⁴</text>
  
  <!-- X-axis ticks -->
  <line x1="300" y1="500" x2="300" y2="505" stroke="#2c3e50" stroke-width="2"/>
  <text x="300" y="525" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">100</text>
  
  <line x1="500" y1="500" x2="500" y2="505" stroke="#2c3e50" stroke-width="2"/>
  <text x="500" y="525" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">500</text>
  
  <line x1="700" y1="500" x2="700" y2="505" stroke="#2c3e50" stroke-width="2"/>
  <text x="700" y="525" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">1000</text>
  
  <line x1="900" y1="500" x2="900" y2="505" stroke="#2c3e50" stroke-width="2"/>
  <text x="900" y="525" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">5000</text>
  
  <line x1="1100" y1="500" x2="1100" y2="505" stroke="#2c3e50" stroke-width="2"/>
  <text x="1100" y="525" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2c3e50">10000</text>
  
  <!-- Infeasible region shading (must come before curves) -->
  <rect x="100" y="100" width="1000" height="250" fill="#e74c3c" opacity="0.1"/>
  <text x="600" y="220" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#e74c3c">
    INFEASIBLE REGION
  </text>
  
  <!-- Feasible region shading -->
  <rect x="100" y="350" width="1000" height="150" fill="#27ae60" opacity="0.1"/>
  <text x="600" y="430" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#27ae60">
    FEASIBLE REGION
  </text>
  
  <!-- Feasibility line -->
  <line x1="100" y1="350" x2="1100" y2="350" stroke="#95a5a6" stroke-width="2" stroke-dasharray="10,5"/>
  <text x="1110" y="355" font-family="Arial, sans-serif" font-size="12" fill="#95a5a6">Feasibility</text>
  <text x="1110" y="370" font-family="Arial, sans-serif" font-size="12" fill="#95a5a6">Threshold</text>
  
  <!-- Exhaustive curve (exponential) - very steep -->
  <path d="M 100 490 Q 300 450, 500 280 T 700 100 T 900 100" stroke="#e74c3c" stroke-width="4" fill="none"/>
  <text x="720" y="120" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#e74c3c">
    Exhaustive O(N^k)
  </text>
  
  <!-- Greedy curve (polynomial) - moderate growth -->
  <path d="M 100 490 L 300 470 L 500 440 L 700 400 L 900 350 L 1100 290" stroke="#27ae60" stroke-width="4" fill="none"/>
  <text x="920" y="340" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#27ae60">
    Greedy O(kNM log N)
  </text>
  
  <!-- Single node curve (linear-log) - gentle slope -->
  <path d="M 100 490 L 300 482 L 500 475 L 700 465 L 900 455 L 1100 442" stroke="#3498db" stroke-width="4" fill="none"/>
  <text x="920" y="448" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#3498db">
    Single Node O(M log N)
  </text>
  
  <!-- Complexity table -->
  <g id="complexity_table">
    <rect x="50" y="570" width="1100" height="210" fill="#ffffff" stroke="#bdc3c7" stroke-width="2" rx="10"/>
    <text x="600" y="600" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Complexity Analysis Summary
    </text>
    
    <!-- Table headers -->
    <rect x="80" y="620" width="320" height="40" fill="#34495e" rx="5"/>
    <text x="240" y="645" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">
      Approach
    </text>
    
    <rect x="420" y="620" width="320" height="40" fill="#34495e" rx="5"/>
    <text x="580" y="645" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">
      Time Complexity
    </text>
    
    <rect x="760" y="620" width="360" height="40" fill="#34495e" rx="5"/>
    <text x="940" y="645" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">
      Feasibility
    </text>
    
    <!-- Row 1: Single Node -->
    <rect x="80" y="670" width="320" height="35" fill="#d6eaf8" rx="3"/>
    <text x="240" y="693" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#2c3e50">
      Single Node (Monte Carlo)
    </text>
    
    <rect x="420" y="670" width="320" height="35" fill="#d6eaf8" rx="3"/>
    <text x="580" y="693" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#2c3e50">
      O(M × log N)
    </text>
    
    <rect x="760" y="670" width="360" height="35" fill="#d5f4e6" rx="3"/>
    <text x="940" y="693" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#27ae60">
      ✓ Fast and Feasible
    </text>
    
    <!-- Row 2: Greedy -->
    <rect x="80" y="715" width="320" height="35" fill="#d5f4e6" rx="3"/>
    <text x="240" y="738" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#2c3e50">
      Greedy k-Node Selection
    </text>
    
    <rect x="420" y="715" width="320" height="35" fill="#d5f4e6" rx="3"/>
    <text x="580" y="738" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#2c3e50">
      O(k × N × M × log N)
    </text>
    
    <rect x="760" y="715" width="360" height="35" fill="#d5f4e6" rx="3"/>
    <text x="940" y="738" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#27ae60">
      ✓ Tractable for large networks
    </text>
    
    <!-- Row 3: Exhaustive -->
    <rect x="80" y="720" width="320" height="35" fill="#fadbd8" rx="3"/>
    <text x="240" y="743" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#2c3e50">
      Exhaustive Search
    </text>
    
    <rect x="420" y="720" width="320" height="35" fill="#fadbd8" rx="3"/>
    <text x="580" y="743" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#2c3e50">
      O(N^k × M × log N)
    </text>
    
    <rect x="760" y="720" width="360" height="35" fill="#fadbd8" rx="3"/>
    <text x="940" y="743" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#e74c3c">
      ✗ Computationally infeasible
    </text>
  </g>
</svg>