<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="priorGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4285f4;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#4285f4;stop-opacity:0.3"/>
    </linearGradient>
    <linearGradient id="likelihoodGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ea4335;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#ea4335;stop-opacity:0.3"/>
    </linearGradient>
    <linearGradient id="posteriorGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34a853;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#34a853;stop-opacity:0.3"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#fafafa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1a1a1a">
    Posterior Distribution Example: Coin Flip Analysis
  </text>
  
  <!-- Example Setup -->
  <rect x="50" y="50" width="700" height="60" rx="5" fill="#f0f0f0" stroke="#ccc" stroke-width="1"/>
  <text x="400" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1a1a1a">
    Problem: Estimate bias θ of a coin | Data: 7 heads out of 10 flips
  </text>
  <text x="400" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">
    Prior: Beta(1,1) → Likelihood: Binomial(10,7) → Posterior: Beta(8,4)
  </text>
  
  <!-- Main Chart Area -->
  <rect x="80" y="130" width="640" height="300" fill="white" stroke="#ddd" stroke-width="1"/>
  
  <!-- Axes -->
  <line x1="100" y1="410" x2="700" y2="410" stroke="#333" stroke-width="2"/>
  <line x1="100" y1="410" x2="100" y2="150" stroke="#333" stroke-width="2"/>
  
  <!-- X-axis labels -->
  <text x="100" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">0.0</text>
  <text x="220" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">0.2</text>
  <text x="340" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">0.4</text>
  <text x="460" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">0.6</text>
  <text x="580" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">0.8</text>
  <text x="700" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">1.0</text>
  
  <!-- Y-axis label -->
  <text x="50" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333" transform="rotate(-90 50 280)">
    Probability Density
  </text>
  <text x="400" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">
    θ (Probability of Heads)
  </text>
  
  <!-- Prior: Beta(1,1) - Uniform -->
  <rect x="100" y="380" width="600" height="30" fill="url(#priorGradient)" opacity="0.6"/>
  <text x="120" y="375" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#4285f4">
    Prior: Beta(1,1)
  </text>
  
  <!-- Likelihood: scaled for visualization -->
  <path d="M 100 410 L 150 405 L 200 395 L 250 380 L 300 360 L 350 340 L 400 315 L 450 290 L 500 265 L 550 250 L 600 245 L 650 260 L 700 300" 
        fill="url(#likelihoodGradient)" stroke="#ea4335" stroke-width="2" opacity="0.7"/>
  <text x="550" y="235" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ea4335">
    Likelihood (scaled)
  </text>
  
  <!-- Posterior: Beta(8,4) -->
  <path d="M 100 410 L 150 405 L 200 395 L 250 380 L 300 360 L 350 330 L 400 280 L 450 220 L 500 180 L 550 170 L 600 200 L 650 280 L 700 380" 
        fill="url(#posteriorGradient)" stroke="#34a853" stroke-width="3" opacity="0.8"/>
  <text x="500" y="160" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#34a853">
    Posterior: Beta(8,4)
  </text>
  
  <!-- MLE and Posterior Mean markers -->
  <line x1="520" y1="150" x2="520" y2="410" stroke="#ff6b35" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="525" y="145" font-family="Arial, sans-serif" font-size="11" fill="#ff6b35" font-weight="bold">MLE = 0.7</text>
  
  <line x1="500" y1="150" x2="500" y2="410" stroke="#34a853" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="440" y="145" font-family="Arial, sans-serif" font-size="11" fill="#34a853" font-weight="bold">Posterior Mean = 0.67</text>
  
  <!-- Results Summary -->
  <rect x="100" y="480" width="600" height="90" rx="5" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="400" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a1a1a">
    Bayesian Update Results
  </text>
  
  <!-- Results in columns -->
  <text x="150" y="525" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">Before Data (Prior):</text>
  <text x="150" y="540" font-family="Arial, sans-serif" font-size="11" fill="#333">• Mean: 0.50</text>
  <text x="150" y="552" font-family="Arial, sans-serif" font-size="11" fill="#333">• Std: 0.29</text>
  
  <text x="300" y="525" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">Data Evidence:</text>
  <text x="300" y="540" font-family="Arial, sans-serif" font-size="11" fill="#333">• MLE: 0.70</text>
  <text x="300" y="552" font-family="Arial, sans-serif" font-size="11" fill="#333">• Strong signal</text>
  
  <text x="450" y="525" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">After Data (Posterior):</text>
  <text x="450" y="540" font-family="Arial, sans-serif" font-size="11" fill="#333">• Mean: 0.67</text>
  <text x="450" y="552" font-family="Arial, sans-serif" font-size="11" fill="#333">• Std: 0.14</text>
  
  <text x="600" y="525" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">95% Credible Interval:</text>
  <text x="600" y="540" font-family="Arial, sans-serif" font-size="11" fill="#333">• [0.44, 0.85]</text>
  <text x="600" y="552" font-family="Arial, sans-serif" font-size="11" fill="#333">• Reduced uncertainty</text>
</svg>