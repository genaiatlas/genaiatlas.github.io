<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 28px; font-weight: bold; fill: #2c3e50; }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: 600; fill: #34495e; }
      .label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #2c3e50; }
      .small-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #555; }
      .node-simple { fill: #3498db; stroke: #2c3e50; stroke-width: 2; }
      .node-tree { fill: #27ae60; stroke: #1e8449; stroke-width: 2; }
      .node-dag { fill: #9b59b6; stroke: #7d3c98; stroke-width: 2; }
      .node-bipartite-a { fill: #e74c3c; stroke: #c0392b; stroke-width: 2; }
      .node-bipartite-b { fill: #f39c12; stroke: #d68910; stroke-width: 2; }
      .edge { stroke: #7f8c8d; stroke-width: 2; fill: none; }
      .edge-bold { stroke: #2c3e50; stroke-width: 2.5; fill: none; }
      .box { fill: #ecf0f1; stroke: #34495e; stroke-width: 2; rx: 10; }
      .highlight-box { fill: #fff; stroke: #3498db; stroke-width: 2; rx: 8; }
    </style>
    <marker id="arrow-dag" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#9b59b6"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="600" y="40" class="title" text-anchor="middle">Network Categories and Types</text>
  
  <!-- Row 1: Simple Networks and Trees -->
  <!-- Simple Network -->
  <rect x="50" y="80" width="320" height="380" class="box"/>
  <text x="210" y="110" class="subtitle" text-anchor="middle">Simple Network</text>
  <text x="210" y="130" class="small-label" text-anchor="middle">No multiple edges, no self-loops</text>
  
  <!-- Simple Network Diagram -->
  <circle cx="140" cy="200" r="18" class="node-simple"/>
  <circle cx="240" cy="200" r="18" class="node-simple"/>
  <circle cx="190" cy="270" r="18" class="node-simple"/>
  <circle cx="120" cy="300" r="18" class="node-simple"/>
  <circle cx="260" cy="300" r="18" class="node-simple"/>
  
  <line x1="158" y1="200" x2="222" y2="200" class="edge"/>
  <line x1="155" y1="215" x2="175" y2="255" class="edge"/>
  <line x1="225" y1="215" x2="205" y2="255" class="edge"/>
  <line x1="135" y1="315" x2="175" y2="280" class="edge"/>
  <line x1="245" y1="315" x2="205" y2="280" class="edge"/>
  
  <rect x="70" y="340" width="280" height="105" class="highlight-box"/>
  <text x="210" y="360" class="label" text-anchor="middle" font-weight="bold">Properties:</text>
  <text x="80" y="378" class="small-label">✓ Max one edge between nodes</text>
  <text x="80" y="393" class="small-label">✓ No self-loops</text>
  <text x="80" y="408" class="small-label">✓ Clean, well-defined structure</text>
  <text x="80" y="428" class="small-label" font-weight="bold">Examples: Power grids, roads</text>
  
  <!-- Tree Network -->
  <rect x="420" y="80" width="320" height="380" class="box"/>
  <text x="580" y="110" class="subtitle" text-anchor="middle">Tree Network</text>
  <text x="580" y="130" class="small-label" text-anchor="middle">No cycles, hierarchical structure</text>
  
  <!-- Tree Diagram -->
  <circle cx="580" cy="180" r="18" class="node-tree"/>
  <text x="580" y="185" class="small-label" text-anchor="middle" fill="white">Root</text>
  
  <circle cx="500" cy="230" r="16" class="node-tree"/>
  <circle cx="580" cy="230" r="16" class="node-tree"/>
  <circle cx="660" cy="230" r="16" class="node-tree"/>
  
  <circle cx="470" cy="280" r="14" class="node-tree"/>
  <circle cx="530" cy="280" r="14" class="node-tree"/>
  <circle cx="630" cy="280" r="14" class="node-tree"/>
  <circle cx="690" cy="280" r="14" class="node-tree"/>
  
  <line x1="570" y1="195" x2="510" y2="215" class="edge-bold"/>
  <line x1="580" y1="195" x2="580" y2="215" class="edge-bold"/>
  <line x1="590" y1="195" x2="650" y2="215" class="edge-bold"/>
  
  <line x1="490" y1="245" x2="475" y2="268" class="edge-bold"/>
  <line x1="510" y1="245" x2="525" y2="268" class="edge-bold"/>
  <line x1="650" y1="245" x2="635" y2="268" class="edge-bold"/>
  <line x1="670" y1="245" x2="685" y2="268" class="edge-bold"/>
  
  <rect x="440" y="310" width="280" height="135" class="highlight-box"/>
  <text x="580" y="330" class="label" text-anchor="middle" font-weight="bold">Properties:</text>
  <text x="450" y="348" class="small-label">✓ No cycles at all</text>
  <text x="450" y="363" class="small-label">✓ Hierarchical organization</text>
  <text x="450" y="378" class="small-label">✓ Unique path between nodes</text>
  <text x="450" y="393" class="small-label">✓ n nodes → n-1 edges</text>
  <text x="450" y="413" class="small-label" font-weight="bold">Examples: Phylogenetic trees,</text>
  <text x="450" y="428" class="small-label" font-weight="bold">organizational charts</text>
  
  <!-- DAG Network -->
  <rect x="790" y="80" width="360" height="380" class="box"/>
  <text x="970" y="110" class="subtitle" text-anchor="middle">Directed Acyclic Graph (DAG)</text>
  <text x="970" y="130" class="small-label" text-anchor="middle">No directed cycles</text>
  
  <!-- DAG Diagram -->
  <circle cx="880" cy="180" r="18" class="node-dag"/>
  <text x="880" y="185" class="small-label" text-anchor="middle" fill="white">A</text>
  
  <circle cx="970" cy="180" r="18" class="node-dag"/>
  <text x="970" y="185" class="small-label" text-anchor="middle" fill="white">B</text>
  
  <circle cx="1060" cy="180" r="18" class="node-dag"/>
  <text x="1060" y="185" class="small-label" text-anchor="middle" fill="white">C</text>
  
  <circle cx="925" cy="250" r="18" class="node-dag"/>
  <text x="925" y="255" class="small-label" text-anchor="middle" fill="white">D</text>
  
  <circle cx="1015" cy="250" r="18" class="node-dag"/>
  <text x="1015" y="255" class="small-label" text-anchor="middle" fill="white">E</text>
  
  <circle cx="970" cy="310" r="18" class="node-dag"/>
  <text x="970" y="315" class="small-label" text-anchor="middle" fill="white">F</text>
  
  <path d="M 895 190 L 915 240" class="edge" marker-end="url(#arrow-dag)"/>
  <path d="M 970 198 L 970 232" class="edge" marker-end="url(#arrow-dag)"/>
  <path d="M 985 190 L 1005 240" class="edge" marker-end="url(#arrow-dag)"/>
  <path d="M 1050 195 L 1025 240" class="edge" marker-end="url(#arrow-dag)"/>
  <path d="M 935 265 L 960 295" class="edge" marker-end="url(#arrow-dag)"/>
  <path d="M 1005 265 L 980 295" class="edge" marker-end="url(#arrow-dag)"/>
  
  <rect x="810" y="340" width="330" height="105" class="highlight-box"/>
  <text x="975" y="360" class="label" text-anchor="middle" font-weight="bold">Properties:</text>
  <text x="820" y="378" class="small-label">✓ No directed cycles</text>
  <text x="820" y="393" class="small-label">✓ Can have undirected cycles</text>
  <text x="820" y="408" class="small-label">✓ Implies ordering/hierarchy</text>
  <text x="820" y="428" class="small-label" font-weight="bold">Examples: Citation networks, food webs</text>
  
  <!-- Bipartite Network -->
  <rect x="50" y="500" width="1100" height="360" class="box"/>
  <text x="600" y="535" class="subtitle" text-anchor="middle">Bipartite Network</text>
  <text x="600" y="555" class="small-label" text-anchor="middle">Two distinct node sets with edges only between sets</text>
  
  <!-- Bipartite Diagram -->
  <!-- Set A (Users) -->
  <text x="200" y="600" class="label" font-weight="bold" fill="#e74c3c">Set A (Users)</text>
  <circle cx="180" cy="640" r="20" class="node-bipartite-a"/>
  <text x="180" y="645" class="small-label" text-anchor="middle" fill="white">U1</text>
  
  <circle cx="180" cy="700" r="20" class="node-bipartite-a"/>
  <text x="180" y="705" class="small-label" text-anchor="middle" fill="white">U2</text>
  
  <circle cx="180" cy="760" r="20" class="node-bipartite-a"/>
  <text x="180" y="765" class="small-label" text-anchor="middle" fill="white">U3</text>
  
  <circle cx="180" cy="820" r="20" class="node-bipartite-a"/>
  <text x="180" y="825" class="small-label" text-anchor="middle" fill="white">U4</text>
  
  <!-- Set B (Movies) -->
  <text x="450" y="600" class="label" font-weight="bold" fill="#f39c12">Set B (Movies)</text>
  <circle cx="430" cy="650" r="20" class="node-bipartite-b"/>
  <text x="430" y="655" class="small-label" text-anchor="middle" fill="white">M1</text>
  
  <circle cx="430" cy="720" r="20" class="node-bipartite-b"/>
  <text x="430" y="725" class="small-label" text-anchor="middle" fill="white">M2</text>
  
  <circle cx="430" cy="790" r="20" class="node-bipartite-b"/>
  <text x="430" y="795" class="small-label" text-anchor="middle" fill="white">M3</text>
  
  <!-- Edges between sets -->
  <line x1="200" y1="640" x2="410" y2="650" class="edge"/>
  <line x1="200" y1="640" x2="410" y2="720" class="edge"/>
  <line x1="200" y1="700" x2="410" y2="720" class="edge"/>
  <line x1="200" y1="700" x2="410" y2="790" class="edge"/>
  <line x1="200" y1="760" x2="410" y2="650" class="edge"/>
  <line x1="200" y1="760" x2="410" y2="790" class="edge"/>
  <line x1="200" y1="820" x2="410" y2="650" class="edge"/>
  <line x1="200" y1="820" x2="410" y2="720" class="edge"/>
  <line x1="200" y1="820" x2="410" y2="790" class="edge"/>
  
  <!-- Properties and Examples -->
  <rect x="550" y="620" width="570" height="220" class="highlight-box"/>
  <text x="835" y="650" class="label" text-anchor="middle" font-weight="bold">Bipartite Properties:</text>
  
  <text x="570" y="680" class="small-label">✓ Two distinct node sets (A and B)</text>
  <text x="570" y="700" class="small-label">✓ Edges only connect between sets (A↔B)</text>
  <text x="570" y="720" class="small-label">✓ No edges within same set (no A↔A or B↔B)</text>
  <text x="570" y="740" class="small-label">✓ Can be represented as adjacency matrix</text>
  
  <text x="835" y="770" class="label" text-anchor="middle" font-weight="bold">Common Applications:</text>
  <text x="570" y="795" class="small-label" font-weight="bold">• Recommendation Systems: Users ↔ Items (Netflix, Amazon)</text>
  <text x="570" y="813" class="small-label" font-weight="bold">• Authorship Networks: Authors ↔ Papers</text>
  <text x="570" y="831" class="small-label" font-weight="bold">• Employment Networks: Workers ↔ Companies</text>
</svg>