<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#00000020"/>
    </filter>
    <pattern id="gridPattern" patternUnits="userSpaceOnUse" width="20" height="20">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e0e0e0" stroke-width="0.5"/>
    </pattern>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="700" fill="url(#bgGradient)"/>
  
  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#2c3e50">
    Confidence Intervals &amp; Margins of Error
  </text>
  
  <!-- Confidence Interval Visualization -->
  <g transform="translate(50, 80)">
    <text x="400" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">
      Confidence Interval Construction
    </text>
    
    <!-- Normal distribution curve -->
    <g transform="translate(50, 40)">
      <!-- Distribution curve -->
      <path d="M 50 120 Q 150 60 250 80 Q 350 60 450 80 Q 550 60 650 120" stroke="#2196F3" stroke-width="3" fill="none"/>
      <path d="M 50 120 Q 150 60 250 80 Q 350 60 450 80 Q 550 60 650 120 L 650 140 L 50 140 Z" fill="#2196F3" opacity="0.2"/>
      
      <!-- Mean line -->
      <line x1="350" y1="40" x2="350" y2="140" stroke="#FF0000" stroke-width="3" stroke-dasharray="5,5"/>
      <text x="350" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#FF0000">μ (true mean)</text>
      
      <!-- Sample mean -->
      <line x1="330" y1="50" x2="330" y2="140" stroke="#4CAF50" stroke-width="3"/>
      <text x="330" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#4CAF50">x̄</text>
      
      <!-- Confidence interval -->
      <line x1="280" y1="160" x2="380" y2="160" stroke="#9C27B0" stroke-width="4"/>
      <line x1="280" y1="155" x2="280" y2="165" stroke="#9C27B0" stroke-width="4"/>
      <line x1="380" y1="155" x2="380" y2="165" stroke="#9C27B0" stroke-width="4"/>
      
      <!-- Labels -->
      <text x="330" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#9C27B0">95% Confidence Interval</text>
      <text x="280" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">Lower Bound</text>
      <text x="380" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">Upper Bound</text>
      
      <!-- Critical values -->
      <line x1="200" y1="110" x2="200" y2="140" stroke="#FF9800" stroke-width="2"/>
      <text x="200" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#FF9800">-1.96</text>
      
      <line x1="500" y1="110" x2="500" y2="140" stroke="#FF9800" stroke-width="2"/>
      <text x="500" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#FF9800">+1.96</text>
      
      <!-- Alpha regions -->
      <path d="M 50 120 Q 125 80 200 110 L 200 140 L 50 140 Z" fill="#F44336" opacity="0.3"/>
      <text x="125" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#F44336">α/2 = 0.025</text>
      
      <path d="M 500 110 Q 575 80 650 120 L 650 140 L 500 140 Z" fill="#F44336" opacity="0.3"/>
      <text x="575" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#F44336">α/2 = 0.025</text>
      
      <!-- Central area -->
      <text x="350" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2196F3">95% of distribution</text>
    </g>
  </g>
  
  <!-- Formula Section -->
  <g transform="translate(50, 320)">
    <rect x="0" y="0" width="900" height="140" rx="10" fill="#E8F5E8" stroke="#4CAF50" stroke-width="2" filter="url(#shadow)"/>
    <text x="450" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">
      Confidence Interval Formulas
    </text>
    
    <!-- Known σ -->
    <g transform="translate(50, 40)">
      <text x="0" y="15" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Known Population Standard Deviation (σ):</text>
      <rect x="0" y="25" width="350" height="35" fill="#fff" stroke="#4CAF50" rx="5"/>
      <text x="175" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#2c3e50">CI = x̄ ± z<tspan baseline-shift="sub">α/2</tspan> × (σ/√n)</text>
      
      <text x="0" y="85" font-family="Arial, sans-serif" font-size="12" fill="#666">Use when: Population σ is known (rare in practice)</text>
      <text x="0" y="100" font-family="Arial, sans-serif" font-size="12" fill="#666">Distribution: Standard normal (z-distribution)</text>
    </g>
    
    <!-- Unknown σ -->
    <g transform="translate(450, 40)">
      <text x="0" y="15" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Unknown Population Standard Deviation (σ):</text>
      <rect x="0" y="25" width="350" height="35" fill="#fff" stroke="#4CAF50" rx="5"/>
      <text x="175" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#2c3e50">CI = x̄ ± t<tspan baseline-shift="sub">α/2,n-1</tspan> × (s/√n)</text>
      
      <text x="0" y="85" font-family="Arial, sans-serif" font-size="12" fill="#666">Use when: Population σ is unknown (most common)</text>
      <text x="0" y="100" font-family="Arial, sans-serif" font-size="12" fill="#666">Distribution: t-distribution with (n-1) degrees of freedom</text>
    </g>
  </g>
  
  <!-- Confidence Levels -->
  <g transform="translate(50, 480)">
    <rect x="0" y="0" width="400" height="180" rx="10" fill="#E3F2FD" stroke="#2196F3" stroke-width="2" filter="url(#shadow)"/>
    <text x="200" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">
      Common Confidence Levels
    </text>
    
    <!-- Table -->
    <g transform="translate(20, 40)">
      <!-- Headers -->
      <rect x="0" y="0" width="120" height="25" fill="#2196F3" opacity="0.1" stroke="#2196F3"/>
      <text x="60" y="17" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Confidence Level</text>
      
      <rect x="120" y="0" width="80" height="25" fill="#2196F3" opacity="0.1" stroke="#2196F3"/>
      <text x="160" y="17" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">α</text>
      
      <rect x="200" y="0" width="80" height="25" fill="#2196F3" opacity="0.1" stroke="#2196F3"/>
      <text x="240" y="17" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">α/2</text>
      
      <rect x="280" y="0" width="80" height="25" fill="#2196F3" opacity="0.1" stroke="#2196F3"/>
      <text x="320" y="17" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">z<tspan baseline-shift="sub">α/2</tspan></text>
      
      <!-- 90% -->
      <rect x="0" y="25" width="120" height="25" fill="#fff" stroke="#2196F3"/>
      <text x="60" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">90%</text>
      
      <rect x="120" y="25" width="80" height="25" fill="#fff" stroke="#2196F3"/>
      <text x="160" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">0.10</text>
      
      <rect x="200" y="25" width="80" height="25" fill="#fff" stroke="#2196F3"/>
      <text x="240" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">0.05</text>
      
      <rect x="280" y="25" width="80" height="25" fill="#fff" stroke="#2196F3"/>
      <text x="320" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">1.645</text>
      
      <!-- 95% -->
      <rect x="0" y="50" width="120" height="25" fill="#E8F5E8" stroke="#2196F3"/>
      <text x="60" y="67" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">95%</text>
      
      <rect x="120" y="50" width="80" height="25" fill="#E8F5E8" stroke="#2196F3"/>
      <text x="160" y="67" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">0.05</text>
      
      <rect x="200" y="50" width="80" height="25" fill="#E8F5E8" stroke="#2196F3"/>
      <text x="240" y="67" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">0.025</text>
      
      <rect x="280" y="50" width="80" height="25" fill="#E8F5E8" stroke="#2196F3"/>
      <text x="320" y="67" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">1.96</text>
      
      <!-- 99% -->
      <rect x="0" y="75" width="120" height="25" fill="#fff" stroke="#2196F3"/>
      <text x="60" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">99%</text>
      
      <rect x="120" y="75" width="80" height="25" fill="#fff" stroke="#2196F3"/>
      <text x="160" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">0.01</text>
      
      <rect x="200" y="75" width="80" height="25" fill="#fff" stroke="#2196F3"/>
      <text x="240" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">0.005</text>
      
      <rect x="280" y="75" width="80" height="25" fill="#fff" stroke="#2196F3"/>
      <text x="320" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">2.576</text>
      
      <text x="180" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">95% is most commonly used</text>
      <text x="180" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">Higher confidence = wider intervals</text>
      <text x="180" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">Trade-off: confidence vs precision</text>
    </g>
  </g>
  
  <!-- Margin of Error -->
  <g transform="translate(500, 480)">
    <rect x="0" y="0" width="450" height="180" rx="10" fill="#FFF3E0" stroke="#FF9800" stroke-width="2" filter="url(#shadow)"/>
    <text x="225" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">
      Margin of Error &amp; Sample Size
    </text>
    
    <!-- Margin of Error Formula -->
    <g transform="translate(20, 40)">
      <text x="0" y="15" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#E65100">Margin of Error:</text>
      <rect x="0" y="20" width="250" height="30" fill="#fff" stroke="#FF9800" rx="5"/>
      <text x="125" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">E = Critical Value × Standard Error</text>
      
      <text x="0" y="70" font-family="Arial, sans-serif" font-size="12" fill="#666">E = z<tspan baseline-shift="sub">α/2</tspan> × (σ/√n)  or  E = t<tspan baseline-shift="sub">α/2,n-1</tspan> × (s/√n)</text>
    </g>
    
    <!-- Sample Size Calculation -->
    <g transform="translate(20, 100)">
      <text x="0" y="15" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#E65100">Required Sample Size:</text>
      <rect x="0" y="20" width="200" height="30" fill="#fff" stroke="#FF9800" rx="5"/>
      <text x="100" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">n = (z<tspan baseline-shift="sub">α/2</tspan> × σ / E)²</text>
      
      <text x="220" y="35" font-family="Arial, sans-serif" font-size="12" fill="#666">Where E is desired margin of error</text>
    </g>
    
    <!-- Factors Affecting Margin of Error -->
    <g transform="translate(280, 40)">
      <text x="0" y="15" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#E65100">Factors Affecting Margin of Error:</text>
      
      <g transform="translate(0, 25)">
        <!-- Confidence Level Effect -->
        <text x="0" y="15" font-family="Arial, sans-serif" font-size="12" fill="#666">• Confidence Level:</text>
        <rect x="20" y="20" width="60" height="8" fill="#FF5722" opacity="0.7"/>
        <text x="85" y="27" font-family="Arial, sans-serif" font-size="10" fill="#666">Higher → Wider</text>
        
        <!-- Sample Size Effect -->
        <text x="0" y="40" font-family="Arial, sans-serif" font-size="12" fill="#666">• Sample Size:</text>
        <rect x="20" y="45" width="30" height="8" fill="#4CAF50" opacity="0.7"/>
        <text x="55" y="52" font-family="Arial, sans-serif" font-size="10" fill="#666">Larger → Smaller</text>
        
        <!-- Population Variability Effect -->
        <text x="0" y="65" font-family="Arial, sans-serif" font-size="12" fill="#666">• Pop. Variability:</text>
        <rect x="20" y="70" width="50" height="8" fill="#9C27B0" opacity="0.7"/>
        <text x="75" y="77" font-family="Arial, sans-serif" font-size="10" fill="#666">Higher → Wider</text>
      </g>
    </g>
  </g>
  
  <!-- Interpretation Guidelines -->
  <g transform="translate(50, 680)">
    <rect x="0" y="0" width="900" height="80" rx="10" fill="#FFEBEE" stroke="#F44336" stroke-width="2" filter="url(#shadow)"/>
    <text x="450" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">
      Correct Interpretation
    </text>
    
    <g transform="translate(20, 35)">
      <text x="0" y="15" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">✓ <tspan font-weight="bold" fill="#4CAF50">CORRECT:</tspan> "We are 95% confident that the true population mean lies between [lower] and [upper]"</text>
      <text x="0" y="35" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">✗ <tspan font-weight="bold" fill="#F44336">INCORRECT:</tspan> "There's a 95% chance the true mean is in this interval" or "95% of data falls in this range"</text>
    </g>
  </g>
</svg>