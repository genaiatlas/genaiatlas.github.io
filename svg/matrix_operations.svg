<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #2c3e50; }
      .subtitle { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #34495e; }
      .text { font-family: Arial, sans-serif; font-size: 12px; fill: #2c3e50; }
      .matrix-text { font-family: 'Courier New', monospace; font-size: 14px; fill: #2c3e50; }
      .arrow { stroke: #e74c3c; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .matrix-border { stroke: #3498db; stroke-width: 2; fill: none; }
      .result-border { stroke: #e74c3c; stroke-width: 2; fill: none; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c" />
    </marker>
  </defs>

  <text x="400" y="30" class="title" text-anchor="middle">Matrix Operations and Vector Transformations</text>

  <!-- Matrix A -->
  <g transform="translate(50, 80)">
    <text x="0" y="-10" class="subtitle">Matrix A (3×2)</text>
    <rect x="0" y="0" width="80" height="120" class="matrix-border" rx="5"/>
    <text x="15" y="25" class="matrix-text">1  2</text>
    <text x="15" y="50" class="matrix-text">3  4</text>
    <text x="15" y="75" class="matrix-text">5  6</text>
  </g>

  <!-- Vector X -->
  <g transform="translate(180, 80)">
    <text x="0" y="-10" class="subtitle">Vector X (2×1)</text>
    <rect x="0" y="0" width="40" height="80" class="matrix-border" rx="5"/>
    <text x="10" y="25" class="matrix-text">2</text>
    <text x="10" y="50" class="matrix-text">1</text>
  </g>

  <!-- Multiplication Arrow -->
  <line x1="140" y1="120" x2="170" y2="120" class="arrow"/>
  <text x="155" y="110" class="text" text-anchor="middle">×</text>

  <!-- Equals Arrow -->
  <line x1="230" y1="120" x2="270" y2="120" class="arrow"/>
  <text x="250" y="110" class="text" text-anchor="middle">=</text>

  <!-- Result Vector -->
  <g transform="translate(280, 80)">
    <text x="0" y="-10" class="subtitle">Result AX (3×1)</text>
    <rect x="0" y="0" width="40" height="120" class="result-border" rx="5"/>
    <text x="10" y="25" class="matrix-text">4</text>
    <text x="10" y="50" class="matrix-text">10</text>
    <text x="10" y="75" class="matrix-text">16</text>
  </g>

  <!-- Calculation Steps -->
  <g transform="translate(380, 80)">
    <text x="0" y="-10" class="subtitle">Calculation Steps:</text>
    <text x="0" y="20" class="text">Row 1: (1×2) + (2×1) = 4</text>
    <text x="0" y="40" class="text">Row 2: (3×2) + (4×1) = 10</text>
    <text x="0" y="60" class="text">Row 3: (5×2) + (6×1) = 16</text>
  </g>

  <!-- Matrix-Matrix Multiplication -->
  <text x="50" y="270" class="subtitle">Matrix-Matrix Multiplication (Dot Product)</text>

  <!-- Matrix B -->
  <g transform="translate(50, 300)">
    <text x="0" y="-10" class="subtitle">Matrix B (2×3)</text>
    <rect x="0" y="0" width="100" height="80" class="matrix-border" rx="5"/>
    <text x="10" y="25" class="matrix-text">1  2  3</text>
    <text x="10" y="50" class="matrix-text">4  5  6</text>
  </g>

  <!-- Matrix C -->
  <g transform="translate(200, 300)">
    <text x="0" y="-10" class="subtitle">Matrix C (3×2)</text>
    <rect x="0" y="0" width="80" height="120" class="matrix-border" rx="5"/>
    <text x="10" y="25" class="matrix-text">7  10</text>
    <text x="10" y="50" class="matrix-text">8  11</text>
    <text x="10" y="75" class="matrix-text">9  12</text>
  </g>

  <!-- Multiplication Arrow -->
  <line x1="160" y1="340" x2="190" y2="340" class="arrow"/>
  <text x="175" y="330" class="text" text-anchor="middle">×</text>

  <!-- Equals Arrow -->
  <line x1="290" y1="340" x2="330" y2="340" class="arrow"/>
  <text x="310" y="330" class="text" text-anchor="middle">=</text>

  <!-- Result Matrix -->
  <g transform="translate(340, 300)">
    <text x="0" y="-10" class="subtitle">Result BC (2×2)</text>
    <rect x="0" y="0" width="80" height="80" class="result-border" rx="5"/>
    <text x="10" y="25" class="matrix-text">50   68</text>
    <text x="10" y="50" class="matrix-text">122  167</text>
  </g>

  <!-- Detailed Calculation -->
  <g transform="translate(480, 300)">
    <text x="0" y="-10" class="subtitle">Element Calculations:</text>
    <text x="0" y="15" class="text">BC[1,1]: (1×7)+(2×8)+(3×9) = 50</text>
    <text x="0" y="35" class="text">BC[1,2]: (1×10)+(2×11)+(3×12) = 68</text>
    <text x="0" y="55" class="text">BC[2,1]: (4×7)+(5×8)+(6×9) = 122</text>
    <text x="0" y="75" class="text">BC[2,2]: (4×10)+(5×11)+(6×12) = 167</text>
  </g>

  <!-- Key Rules -->
  <g transform="translate(50, 480)">
    <rect x="-10" y="-10" width="700" height="100" fill="#ecf0f1" stroke="#bdc3c7" rx="5"/>
    <text x="10" y="10" class="subtitle">Key Rules for Matrix Operations:</text>
    <text x="20" y="30" class="text">• Matrix multiplication A×B: columns of A must equal rows of B</text>
    <text x="20" y="45" class="text">• Result dimensions: (m×n) × (n×p) = (m×p)</text>
    <text x="20" y="60" class="text">• Addition/Subtraction: matrices must have identical dimensions</text>
    <text x="20" y="75" class="text">• Matrix multiplication is NOT commutative: A×B ≠ B×A</text>
  </g>
</svg>