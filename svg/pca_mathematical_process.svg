<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="step1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498DB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980B9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="step2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E74C3C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C0392B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="step3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ECC71;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27AE60;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="step4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F39C12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E67E22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="step5Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9B59B6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8E44AD;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="700" fill="#F8F9FA"/>
  
  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2C3E50">
    PCA Mathematical Process - Step by Step
  </text>
  
  <!-- Step 1: Data Standardization -->
  <rect x="50" y="70" width="800" height="100" fill="url(#step1Grad)" rx="10"/>
  <text x="450" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">
    Step 1: Data Standardization
  </text>
  <text x="450" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">
    X̃ = (X - μ) / σ    where μ = mean, σ = standard deviation
  </text>
  <text x="450" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#E8F6F3">
    Center data around zero and scale to unit variance
  </text>
  <text x="450" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#E8F6F3">
    Ensures all features contribute equally to PCA
  </text>
  
  <!-- Arrow 1 -->
  <path d="M 450 180 L 450 200" stroke="#2C3E50" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Step 2: Covariance Matrix -->
  <rect x="50" y="210" width="800" height="100" fill="url(#step2Grad)" rx="10"/>
  <text x="450" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">
    Step 2: Compute Covariance Matrix
  </text>
  <text x="450" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">
    C = (1/n-1) × X̃ᵀ × X̃
  </text>
  <text x="450" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#FADBD8">
    Measures linear relationships between all pairs of features
  </text>
  <text x="450" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#FADBD8">
    Symmetric matrix where C[i,j] = covariance between feature i and j
  </text>
  
  <!-- Arrow 2 -->
  <path d="M 450 320 L 450 340" stroke="#2C3E50" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Step 3: Eigendecomposition -->
  <rect x="50" y="350" width="800" height="100" fill="url(#step3Grad)" rx="10"/>
  <text x="450" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">
    Step 3: Eigendecomposition of Covariance Matrix
  </text>
  <text x="450" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">
    C × v = λ × v    where v = eigenvector, λ = eigenvalue
  </text>
  <text x="450" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#D5F4E6">
    Eigenvectors define principal component directions
  </text>
  <text x="450" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#D5F4E6">
    Eigenvalues measure variance explained by each component
  </text>
  
  <!-- Arrow 3 -->
  <path d="M 450 460 L 450 480" stroke="#2C3E50" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Step 4: Sort and Select -->
  <rect x="50" y="490" width="800" height="100" fill="url(#step4Grad)" rx="10"/>
  <text x="450" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">
    Step 4: Sort by Eigenvalues & Select Components
  </text>
  <text x="450" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">
    Sort: λ₁ ≥ λ₂ ≥ λ₃ ≥ ... ≥ λₙ
  </text>
  <text x="450" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#FDF2E9">
    Choose first k components that capture desired variance (e.g., 95%)
  </text>
  <text x="450" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#FDF2E9">
    Principal components ordered by importance (variance explained)
  </text>
  
  <!-- Arrow 4 -->
  <path d="M 450 600 L 450 620" stroke="#2C3E50" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Step 5: Transform Data -->
  <rect x="50" y="630" width="800" height="100" fill="url(#step5Grad)" rx="10"/>
  <text x="450" y="660" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">
    Step 5: Transform Original Data
  </text>
  <text x="450" y="680" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">
    Y = X̃ × V    where V = matrix of selected eigenvectors
  </text>
  <text x="450" y="700" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#EBDEF0">
    Project data onto principal component space
  </text>
  <text x="450" y="715" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#EBDEF0">
    Result: Lower-dimensional representation preserving maximum variance
  </text>
  
  <!-- Side annotations -->
  <rect x="20" y="200" width="15" height="400" fill="#34495E" rx="7"/>
  <text x="12" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#34495E" transform="rotate(-90 12 400)">
    CORE PCA ALGORITHM
  </text>
  
  <rect x="865" y="200" width="15" height="400" fill="#34495E" rx="7"/>
  <text x="888" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#34495E" transform="rotate(90 888 400)">
    DIMENSIONALITY REDUCTION
  </text>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
     refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2C3E50"/>
    </marker>
  </defs>
</svg>