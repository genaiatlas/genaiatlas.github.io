<svg viewBox="0 0 1000 450" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="450" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="500" y="30" font-size="22" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Watts-Strogatz Small World Model: Edge Rewiring Process
  </text>
  
  <!-- Regular Lattice (p=0) -->
  <g id="regular">
    <text x="150" y="70" font-size="15" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      p = 0 (Regular Lattice)
    </text>
    
    <!-- Nodes -->
    <circle cx="150" cy="120" r="12" fill="#3498db" stroke="#2c3e50" stroke-width="1.5"/>
    <circle cx="210" cy="100" r="12" fill="#3498db" stroke="#2c3e50" stroke-width="1.5"/>
    <circle cx="250" cy="140" r="12" fill="#3498db" stroke="#2c3e50" stroke-width="1.5"/>
    <circle cx="240" cy="200" r="12" fill="#3498db" stroke="#2c3e50" stroke-width="1.5"/>
    <circle cx="170" cy="230" r="12" fill="#3498db" stroke="#2c3e50" stroke-width="1.5"/>
    <circle cx="100" cy="210" r="12" fill="#3498db" stroke="#2c3e50" stroke-width="1.5"/>
    <circle cx="70" cy="150" r="12" fill="#3498db" stroke="#2c3e50" stroke-width="1.5"/>
    <circle cx="90" cy="90" r="12" fill="#3498db" stroke="#2c3e50" stroke-width="1.5"/>
    
    <!-- Regular edges (ring) -->
    <line x1="150" y1="120" x2="210" y2="100" stroke="#27ae60" stroke-width="2"/>
    <line x1="210" y1="100" x2="250" y2="140" stroke="#27ae60" stroke-width="2"/>
    <line x1="250" y1="140" x2="240" y2="200" stroke="#27ae60" stroke-width="2"/>
    <line x1="240" y1="200" x2="170" y2="230" stroke="#27ae60" stroke-width="2"/>
    <line x1="170" y1="230" x2="100" y2="210" stroke="#27ae60" stroke-width="2"/>
    <line x1="100" y1="210" x2="70" y2="150" stroke="#27ae60" stroke-width="2"/>
    <line x1="70" y1="150" x2="90" y2="90" stroke="#27ae60" stroke-width="2"/>
    <line x1="90" y1="90" x2="150" y2="120" stroke="#27ae60" stroke-width="2"/>
    
    <!-- Properties -->
    <text x="150" y="265" font-size="11" text-anchor="middle" fill="#2c3e50">
      <tspan x="150" dy="0">High clustering: ✓</tspan>
      <tspan x="150" dy="15">Large diameter: ✗</tspan>
      <tspan x="150" dy="15">No shortcuts</tspan>
    </text>
  </g>
  
  <!-- Arrow 1 -->
  <line x1="280" y1="170" x2="320" y2="170" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead3)"/>
  <text x="300" y="160" font-size="11" text-anchor="middle" fill="#e74c3c" font-weight="bold">Rewire</text>
  <text x="300" y="187" font-size="10" text-anchor="middle" fill="#7f8c8d">p ≈ 0.1</text>
  
  <!-- Small World (0 < p < 1) -->
  <g id="smallworld">
    <text x="500" y="70" font-size="15" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      0 &lt; p &lt; 1 (Small World)
    </text>
    
    <!-- Nodes -->
    <circle cx="500" cy="120" r="12" fill="#3498db" stroke="#2c3e50" stroke-width="1.5"/>
    <circle cx="560" cy="100" r="12" fill="#3498db" stroke="#2c3e50" stroke-width="1.5"/>
    <circle cx="600" cy="140" r="12" fill="#3498db" stroke="#2c3e50" stroke-width="1.5"/>
    <circle cx="590" cy="200" r="12" fill="#3498db" stroke="#2c3e50" stroke-width="1.5"/>
    <circle cx="520" cy="230" r="12" fill="#3498db" stroke="#2c3e50" stroke-width="1.5"/>
    <circle cx="450" cy="210" r="12" fill="#3498db" stroke="#2c3e50" stroke-width="1.5"/>
    <circle cx="420" cy="150" r="12" fill="#3498db" stroke="#2c3e50" stroke-width="1.5"/>
    <circle cx="440" cy="90" r="12" fill="#3498db" stroke="#2c3e50" stroke-width="1.5"/>
    
    <!-- Most edges remain -->
    <line x1="500" y1="120" x2="560" y2="100" stroke="#27ae60" stroke-width="2"/>
    <line x1="250" y1="140" x2="240" y2="200" stroke="#27ae60" stroke-width="2"/>
    <line x1="590" y1="200" x2="520" y2="230" stroke="#27ae60" stroke-width="2"/>
    <line x1="520" y1="230" x2="450" y2="210" stroke="#27ae60" stroke-width="2"/>
    <line x1="450" y1="210" x2="420" y2="150" stroke="#27ae60" stroke-width="2"/>
    <line x1="420" y1="150" x2="440" y2="90" stroke="#27ae60" stroke-width="2"/>
    <line x1="440" y1="90" x2="500" y2="120" stroke="#27ae60" stroke-width="2"/>
    
    <!-- Rewired edges (shortcuts) -->
    <line x1="560" y1="100" x2="520" y2="230" stroke="#e74c3c" stroke-width="2.5" stroke-dasharray="5,3"/>
    <line x1="600" y1="140" x2="440" y2="90" stroke="#e74c3c" stroke-width="2.5" stroke-dasharray="5,3"/>
    <line x1="590" y1="200" x2="420" y2="150" stroke="#e74c3c" stroke-width="2.5" stroke-dasharray="5,3"/>
    
    <!-- Shortcut annotation -->
    <text x="540" y="175" font-size="10" fill="#e74c3c" font-weight="bold" transform="rotate(-60 540 175)">
      Shortcut
    </text>
    
    <!-- Properties -->
    <text x="500" y="265" font-size="11" text-anchor="middle" fill="#2c3e50">
      <tspan x="500" dy="0" font-weight="bold" fill="#27ae60">High clustering: ✓</tspan>
      <tspan x="500" dy="15" font-weight="bold" fill="#27ae60">Small diameter: ✓</tspan>
      <tspan x="500" dy="15" fill="#9b59b6">⭐ Small World Property ⭐</tspan>
    </text>
  </g>
  
  <!-- Arrow 2 -->
  <line x1="630" y1="170" x2="670" y2="170" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead3)"/>
  <text x="650" y="160" font-size="11" text-anchor="middle" fill="#e74c3c" font-weight="bold">More rewiring</text>
  <text x="650" y="187" font-size="10" text-anchor="middle" fill="#7f8c8d">p → 1</text>
  
  <!-- Random Graph (p=1) -->
  <g id="random">
    <text x="850" y="70" font-size="15" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      p = 1 (Random Graph)
    </text>
    
    <!-- Nodes -->
    <circle cx="850" cy="120" r="12" fill="#3498db" stroke="#2c3e50" stroke-width="1.5"/>
    <circle cx="910" cy="100" r="12" fill="#3498db" stroke="#2c3e50" stroke-width="1.5"/>
    <circle cx="950" cy="140" r="12" fill="#3498db" stroke="#2c3e50" stroke-width="1.5"/>
    <circle cx="940" cy="200" r="12" fill="#3498db" stroke="#2c3e50" stroke-width="1.5"/>
    <circle cx="870" cy="230" r="12" fill="#3498db" stroke="#2c3e50" stroke-width="1.5"/>
    <circle cx="800" cy="210" r="12" fill="#3498db" stroke="#2c3e50" stroke-width="1.5"/>
    <circle cx="770" cy="150" r="12" fill="#3498db" stroke="#2c3e50" stroke-width="1.5"/>
    <circle cx="790" cy="90" r="12" fill="#3498db" stroke="#2c3e50" stroke-width="1.5"/>
    
    <!-- Random edges -->
    <line x1="850" y1="120" x2="940" y2="200" stroke="#e74c3c" stroke-width="2"/>
    <line x1="910" y1="100" x2="770" y2="150" stroke="#e74c3c" stroke-width="2"/>
    <line x1="950" y1="140" x2="800" y2="210" stroke="#e74c3c" stroke-width="2"/>
    <line x1="940" y1="200" x2="790" y2="90" stroke="#e74c3c" stroke-width="2"/>
    <line x1="870" y1="230" x2="910" y2="100" stroke="#e74c3c" stroke-width="2"/>
    <line x1="800" y1="210" x2="850" y2="120" stroke="#e74c3c" stroke-width="2"/>
    <line x1="770" y1="150" x2="950" y2="140" stroke="#e74c3c" stroke-width="2"/>
    <line x1="790" y1="90" x2="870" y2="230" stroke="#e74c3c" stroke-width="2"/>
    
    <!-- Properties -->
    <text x="850" y="265" font-size="11" text-anchor="middle" fill="#2c3e50">
      <tspan x="850" dy="0">Low clustering: ✗</tspan>
      <tspan x="850" dy="15">Small diameter: ✓</tspan>
      <tspan x="850" dy="15">Fully random</tspan>
    </text>
  </g>
  
  <!-- Phase Transition Diagram -->
  <g id="phase">
    <rect x="50" y="340" width="900" height="90" fill="white" stroke="#34495e" stroke-width="2" rx="8"/>
    
    <text x="500" y="365" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Phase Transition with Rewiring Probability p
    </text>
    
    <!-- Axis -->
    <line x1="100" y1="400" x2="900" y2="400" stroke="#2c3e50" stroke-width="2"/>
    
    <!-- p=0 marker -->
    <line x1="100" y1="395" x2="100" y2="405" stroke="#2c3e50" stroke-width="2"/>
    <text x="100" y="420" font-size="11" text-anchor="middle" fill="#2c3e50">p=0</text>
    
    <!-- Small world region -->
    <rect x="200" y="375" width="400" height="30" fill="#27ae60" fill-opacity="0.3" stroke="#27ae60" stroke-width="2"/>
    <text x="400" y="395" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">
      Small World Region (p ≈ 0.01 to 0.1)
    </text>
    
    <!-- p=1 marker -->
    <line x1="900" y1="395" x2="900" y2="405" stroke="#2c3e50" stroke-width="2"/>
    <text x="900" y="420" font-size="11" text-anchor="middle" fill="#2c3e50">p=1</text>
    
    <!-- Key insight -->
    <text x="500" y="385" font-size="10" text-anchor="middle" fill="#7f8c8d" font-style="italic">
      Even small p creates shortcuts → dramatic diameter reduction while maintaining high clustering
    </text>
  </g>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead3" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#34495e"/>
    </marker>
  </defs>
</svg>