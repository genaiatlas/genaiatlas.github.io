<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="500" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">
    Stochastic Gradient Descent (SGD) Optimization Process
  </text>
  
  <!-- Dataset representation -->
  <g transform="translate(50, 80)">
    <text x="70" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#34495e">
      Training Dataset
    </text>
    <rect x="10" y="25" width="120" height="80" fill="#e8f4fd" stroke="#3498db" stroke-width="2" rx="5"/>
    
    <!-- Data points -->
    <circle cx="40" cy="50" r="4" fill="#3498db"/>
    <circle cx="70" cy="65" r="4" fill="#3498db"/>
    <circle cx="100" cy="55" r="4" fill="#3498db"/>
    <circle cx="40" cy="80" r="4" fill="#3498db"/>
    <circle cx="70" cy="90" r="4" fill="#3498db"/>
    <circle cx="100" cy="85" r="4" fill="#3498db"/>
    
    <text x="70" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">
      1000+ samples
    </text>
  </g>
  
  <!-- Arrow to random selection -->
  <path d="M 180 120 Q 220 120 260 120" fill="none" stroke="#e74c3c" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Random selection -->
  <g transform="translate(270, 80)">
    <text x="70" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e74c3c">
      Random Selection
    </text>
    <rect x="20" y="25" width="100" height="60" fill="#fdf2f2" stroke="#e74c3c" stroke-width="2" rx="5"/>
    <circle cx="70" cy="55" r="8" fill="#e74c3c"/>
    <text x="70" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">
      Single sample per iteration
    </text>
  </g>
  
  <!-- Arrow to gradient computation -->
  <path d="M 390 120 Q 430 120 470 120" fill="none" stroke="#f39c12" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Gradient computation -->
  <g transform="translate(480, 70)">
    <text x="80" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f39c12">
      Gradient Computation
    </text>
    <rect x="10" y="25" width="140" height="80" fill="#fef9e7" stroke="#f39c12" stroke-width="2" rx="5"/>
    
    <!-- Mathematical notation -->
    <text x="80" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">
      ∇J(θ; x⁽ⁱ⁾, y⁽ⁱ⁾)
    </text>
    
    <text x="80" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">
      Loss gradient for
    </text>
    <text x="80" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">
      selected sample
    </text>
    
    <text x="80" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">
      High variance updates
    </text>
  </g>
  
  <!-- Arrow down to parameter update -->
  <path d="M 550 160 Q 550 200 550 240" fill="none" stroke="#27ae60" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Parameter update -->
  <g transform="translate(460, 250)">
    <text x="90" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#27ae60">
      Parameter Update
    </text>
    <rect x="10" y="25" width="160" height="80" fill="#eafaf1" stroke="#27ae60" stroke-width="2" rx="5"/>
    
    <!-- Mathematical formula -->
    <text x="90" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">
      θ⁽ᵗ⁺¹⁾ = θ⁽ᵗ⁾ - η∇J(θ)
    </text>
    
    <text x="90" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">
      Learning rate η
    </text>
    <text x="90" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">
      controls step size
    </text>
    
    <text x="90" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">
      Slow convergence
    </text>
  </g>
  
  <!-- Feedback arrow -->
  <path d="M 460 290 Q 300 350 180 280 Q 100 240 70 160" fill="none" stroke="#9b59b6" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  
  <!-- Iteration label -->
  <text x="200" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#9b59b6">
    Next iteration: Select different random sample
  </text>
  
  <!-- Characteristics box -->
  <g transform="translate(50, 400)">
    <rect x="0" y="0" width="700" height="80" fill="#ecf0f1" stroke="#95a5a6" stroke-width="1" rx="5"/>
    <text x="20" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
      SGD Characteristics:
    </text>
    <text x="20" y="40" font-family="Arial, sans-serif" font-size="12" fill="#34495e">
      • Memory Efficient: Processes one sample at a time
    </text>
    <text x="300" y="40" font-family="Arial, sans-serif" font-size="12" fill="#34495e">
      • Noisy Updates: High variance in gradient estimates
    </text>
    <text x="20" y="60" font-family="Arial, sans-serif" font-size="12" fill="#34495e">
      • Slow Convergence: Gradual approach to optimal solution
    </text>
    <text x="300" y="60" font-family="Arial, sans-serif" font-size="12" fill="#34495e">
      • Online Learning: Can adapt to streaming data
    </text>
  </g>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="currentColor"/>
    </marker>
  </defs>
</svg>