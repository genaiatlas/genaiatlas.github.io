<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="900" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="450" y="30" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#2c3e50">Hypothesis Testing Process</text>
  
  <!-- Step 1: Formulate Hypotheses -->
  <rect x="50" y="80" width="180" height="80" fill="#3498db" stroke="#2980b9" stroke-width="2" rx="10"/>
  <text x="140" y="105" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">1. Formulate</text>
  <text x="140" y="125" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Hypotheses</text>
  <text x="140" y="145" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">H₀ and Hₐ</text>
  
  <!-- Arrow -->
  <polygon points="240,120 280,120 270,110 290,120 270,130" fill="#34495e"/>
  
  <!-- Step 2: Choose Significance Level -->
  <rect x="300" y="80" width="180" height="80" fill="#e74c3c" stroke="#c0392b" stroke-width="2" rx="10"/>
  <text x="390" y="105" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">2. Choose</text>
  <text x="390" y="125" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Significance Level</text>
  <text x="390" y="145" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">α = 0.05</text>
  
  <!-- Arrow -->
  <polygon points="490,120 530,120 520,110 540,120 520,130" fill="#34495e"/>
  
  <!-- Step 3: Calculate Test Statistic -->
  <rect x="550" y="80" width="180" height="80" fill="#27ae60" stroke="#229954" stroke-width="2" rx="10"/>
  <text x="640" y="105" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">3. Calculate</text>
  <text x="640" y="125" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Test Statistic</text>
  <text x="640" y="145" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Z-score</text>
  
  <!-- Arrow down -->
  <polygon points="640,170 640,210 630,200 640,220 650,200" fill="#34495e"/>
  
  <!-- Normal Distribution Curve -->
  <g transform="translate(450, 250)">
    <!-- Curve -->
    <path d="M 0 100 Q 50 20, 100 100 Q 150 20, 200 100 Q 250 20, 300 100 Q 350 20, 380 100" 
          fill="none" stroke="#3498db" stroke-width="3"/>
    
    <!-- Critical region (left tail) -->
    <path d="M 0 100 Q 25 40, 50 100" fill="#e74c3c" fill-opacity="0.3"/>
    
    <!-- Critical region (right tail) -->
    <path d="M 330 100 Q 355 40, 380 100" fill="#e74c3c" fill-opacity="0.3"/>
    
    <!-- Acceptance region -->
    <path d="M 50 100 Q 100 30, 150 100 Q 200 30, 250 100 Q 300 30, 330 100" 
          fill="#27ae60" fill-opacity="0.2"/>
    
    <!-- Labels -->
    <text x="25" y="130" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#e74c3c">Reject H₀</text>
    <text x="190" y="130" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#27ae60">Accept H₀</text>
    <text x="355" y="130" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#e74c3c">Reject H₀</text>
    
    <!-- Critical values -->
    <line x1="50" y1="50" x2="50" y2="120" stroke="#34495e" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="330" y1="50" x2="330" y2="120" stroke="#34495e" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="50" y="45" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">-1.96</text>
    <text x="330" y="45" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">+1.96</text>
    
    <!-- Alpha regions -->
    <text x="25" y="70" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#e74c3c">α/2 = 0.025</text>
    <text x="355" y="70" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#e74c3c">α/2 = 0.025</text>
  </g>
  
  <!-- Step 4: Decision -->
  <rect x="300" y="400" width="300" height="60" fill="#9b59b6" stroke="#8e44ad" stroke-width="2" rx="10"/>
  <text x="450" y="425" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">4. Make Decision</text>
  <text x="450" y="445" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Compare p-value with α</text>
  
  <!-- Decision branches -->
  <line x1="350" y1="460" x2="250" y2="500" stroke="#34495e" stroke-width="3"/>
  <line x1="550" y1="460" x2="650" y2="500" stroke="#34495e" stroke-width="3"/>
  
  <!-- Reject H0 -->
  <rect x="150" y="500" width="200" height="60" fill="#e74c3c" stroke="#c0392b" stroke-width="2" rx="10"/>
  <text x="250" y="525" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Reject H₀</text>
  <text x="250" y="545" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">if p-value ≤ α</text>
  
  <!-- Fail to Reject H0 -->
  <rect x="550" y="500" width="200" height="60" fill="#27ae60" stroke="#229954" stroke-width="2" rx="10"/>
  <text x="650" y="525" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Fail to Reject H₀</text>
  <text x="650" y="545" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">if p-value > α</text>
  
  <!-- Key formulas -->
  <rect x="50" y="200" width="300" height="120" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2" rx="10"/>
  <text x="200" y="220" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">Key Formulas</text>
  
  <text x="70" y="245" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Z-statistic:</text>
  <text x="70" y="265" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">Z = (x̅ - μ) / (σ/√n)</text>
  
  <text x="70" y="290" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Confidence Interval:</text>
  <text x="70" y="310" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">CI = x̅ ± Z(α/2) × (σ/√n)</text>
</svg>