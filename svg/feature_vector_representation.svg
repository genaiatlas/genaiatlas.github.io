<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="500" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">Feature Vector Representation: Email Classification</text>
  
  <!-- Email Example -->
  <rect x="50" y="60" width="300" height="150" fill="#e8f4fd" stroke="#3498db" stroke-width="2" rx="5"/>
  <text x="60" y="80" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Sample Email:</text>
  <text x="60" y="100" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">"Buy this amazing offer now!</text>
  <text x="60" y="115" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Limited time sale for you."</text>
  
  <text x="60" y="140" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e74c3c">Classification: SPAM</text>
  <text x="60" y="160" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">Contains: offer, buy, sale, limited</text>
  <text x="60" y="180" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">Missing: legitimate business terms</text>
  
  <!-- Arrow -->
  <path d="M 360 135 L 420 135" stroke="#34495e" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="390" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#34495e">converts to</text>
  
  <!-- Feature Vector -->
  <rect x="450" y="60" width="300" height="360" fill="#f0f8f0" stroke="#27ae60" stroke-width="2" rx="5"/>
  <text x="600" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Feature Vector</text>
  
  <!-- Vector entries -->
  <g font-family="Arial, sans-serif" font-size="11">
    <!-- Headers -->
    <text x="470" y="105" font-weight="bold" fill="#2c3e50">Word</text>
    <text x="580" y="105" font-weight="bold" fill="#2c3e50">Count</text>
    <text x="650" y="105" font-weight="bold" fill="#2c3e50">Feature</text>
    <text x="710" y="105" font-weight="bold" fill="#2c3e50">Index</text>
    
    <!-- Line separator -->
    <line x1="460" y1="110" x2="740" y2="110" stroke="#bdc3c7" stroke-width="1"/>
    
    <!-- Feature entries -->
    <text x="470" y="125" fill="#2c3e50">buy</text>
    <text x="590" y="125" fill="#e74c3c" font-weight="bold">2</text>
    <text x="660" y="125" fill="#27ae60">x₁</text>
    <text x="720" y="125" fill="#7f8c8d">[1]</text>
    
    <text x="470" y="140" fill="#2c3e50">offer</text>
    <text x="590" y="140" fill="#e74c3c" font-weight="bold">1</text>
    <text x="660" y="140" fill="#27ae60">x₂</text>
    <text x="720" y="140" fill="#7f8c8d">[2]</text>
    
    <text x="470" y="155" fill="#2c3e50">sale</text>
    <text x="590" y="155" fill="#e74c3c" font-weight="bold">1</text>
    <text x="660" y="155" fill="#27ae60">x₃</text>
    <text x="720" y="155" fill="#7f8c8d">[3]</text>
    
    <text x="470" y="170" fill="#2c3e50">limited</text>
    <text x="590" y="170" fill="#e74c3c" font-weight="bold">1</text>
    <text x="660" y="170" fill="#27ae60">x₄</text>
    <text x="720" y="170" fill="#7f8c8d">[4]</text>
    
    <text x="470" y="185" fill="#2c3e50">free</text>
    <text x="590" y="185" fill="#3498db">0</text>
    <text x="660" y="185" fill="#27ae60">x₅</text>
    <text x="720" y="185" fill="#7f8c8d">[5]</text>
    
    <text x="470" y="200" fill="#2c3e50">money</text>
    <text x="590" y="200" fill="#3498db">0</text>
    <text x="660" y="200" fill="#27ae60">x₆</text>
    <text x="720" y="200" fill="#7f8c8d">[6]</text>
    
    <text x="470" y="215" fill="#2c3e50">business</text>
    <text x="590" y="215" fill="#3498db">0</text>
    <text x="660" y="215" fill="#27ae60">x₇</text>
    <text x="720" y="215" fill="#7f8c8d">[7]</text>
    
    <text x="470" y="230" fill="#2c3e50">meeting</text>
    <text x="590" y="230" fill="#3498db">0</text>
    <text x="660" y="230" fill="#27ae60">x₈</text>
    <text x="720" y="230" fill="#7f8c8d">[8]</text>
    
    <text x="470" y="245" fill="#2c3e50">report</text>
    <text x="590" y="245" fill="#3498db">0</text>
    <text x="660" y="245" fill="#27ae60">x₉</text>
    <text x="720" y="245" fill="#7f8c8d">[9]</text>
    
    <text x="470" y="265" fill="#7f8c8d">...</text>
    <text x="590" y="265" fill="#7f8c8d">...</text>
    <text x="660" y="265" fill="#7f8c8d">...</text>
    <text x="720" y="265" fill="#7f8c8d">...</text>
    
    <text x="470" y="285" fill="#2c3e50">vocabulary</text>
    <text x="590" y="285" fill="#3498db">0</text>
    <text x="660" y="285" fill="#27ae60">xₙ</text>
    <text x="720" y="285" fill="#7f8c8d">[n]</text>
  </g>
  
  <!-- Vector notation -->
  <text x="600" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2c3e50">Vector Representation:</text>
  <text x="600" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#e74c3c">x⃗ = [2, 1, 1, 1, 0, 0, 0, 0, 0, ..., 0]</text>
  
  <!-- Dimensions note -->
  <text x="600" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">Typical dimensions: 10,000 - 50,000 words</text>
  <text x="600" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">Sparse vector (mostly zeros)</text>
  
  <!-- K-Means Application -->
  <rect x="50" y="260" width="350" height="180" fill="#fff3cd" stroke="#f39c12" stroke-width="2" rx="5"/>
  <text x="225" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">K-Means Application</text>
  
  <text x="60" y="300" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">1. Convert emails to feature vectors</text>
  <text x="60" y="315" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">2. Apply K-Means with K=2 clusters</text>
  <text x="60" y="330" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">3. Cluster 1: Spam emails (high spam words)</text>
  <text x="60" y="345" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">4. Cluster 2: Legitimate emails (business words)</text>
  
  <text x="60" y="365" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#d68910">Distance Metric: Euclidean distance</text>
  <text x="60" y="380" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">d(x⃗ᵢ, x⃗ⱼ) = √Σₖ(xᵢₖ - xⱼₖ)²</text>
  
  <text x="60" y="400" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#d68910">Cluster Assignment:</text>
  <text x="60" y="415" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">Email assigned to nearest centroid</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e"/>
    </marker>
  </defs>
</svg>