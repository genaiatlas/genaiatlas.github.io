  </text>
  <text x="520" y="135" font-family="Arial, sans-serif" font-size="12" fill="#475569">
    • Software Engineering
  </text>
  
  <text x="120" y="520" font-family="Arial, sans-serif" font-size="12" fill="#475569">
    • Hypothesis Testing
  </text>
  <text x="120" y="540" font-family="Arial, sans-serif" font-size="12" fill="#475569">
    • Probability Theory
  </text>
  <text x="120" y="560" font-family="Arial, sans-serif" font-size="12" fill="#475569">
    • Statistical Modeling
  </text>
  
  <text x="520" y="520" font-family="Arial, sans-serif" font-size="12" fill="#475569">
    • Data Pipelines
  </text>
  <text x="520" y="540" font-family="Arial, sans-serif" font-size="12" fill="#475569">
