  </text>
  
  <!-- Connecting Lines -->
  <line x1="265" y1="180" x2="340" y2="260" stroke="#64748b" stroke-width="3" opacity="0.7"/>
  <line x1="535" y1="180" x2="460" y2="260" stroke="#64748b" stroke-width="3" opacity="0.7"/>
  <line x1="265" y1="420" x2="340" y2="340" stroke="#64748b" stroke-width="3" opacity="0.7"/>
  <line x1="535" y1="420" x2="460" y2="340" stroke="#64748b" stroke-width="3" opacity="0.7"/>
  
  <!-- Skill Labels -->
  <text x="120" y="95" font-family="Arial, sans-serif" font-size="12" fill="#475569">
