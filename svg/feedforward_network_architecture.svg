<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="500" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">Feedforward Neural Network Architecture</text>
  
  <!-- Input Layer -->
  <g id="input-layer">
    <text x="80" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#34495e">Input Layer</text>
    <circle cx="80" cy="150" r="25" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    <circle cx="80" cy="220" r="25" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    <circle cx="80" cy="290" r="25" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    <circle cx="80" cy="360" r="25" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    
    <!-- Input labels -->
    <text x="30" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">x₁</text>
    <text x="30" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">x₂</text>
    <text x="30" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">x₃</text>
    <text x="30" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">x₄</text>
  </g>
  
  <!-- Hidden Layer 1 -->
  <g id="hidden-layer-1">
    <text x="280" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#34495e">Hidden Layer 1</text>
    <circle cx="280" cy="130" r="25" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
    <circle cx="280" cy="200" r="25" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
    <circle cx="280" cy="270" r="25" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
    <circle cx="280" cy="340" r="25" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
    <circle cx="280" cy="410" r="25" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
    
    <!-- Hidden layer 1 labels -->
    <text x="280" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff">h₁₁</text>
    <text x="280" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff">h₁₂</text>
    <text x="280" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff">h₁₃</text>
    <text x="280" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff">h₁₄</text>
    <text x="280" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff">h₁₅</text>
  </g>
  
  <!-- Hidden Layer 2 -->
  <g id="hidden-layer-2">
    <text x="480" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#34495e">Hidden Layer 2</text>
    <circle cx="480" cy="150" r="25" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
    <circle cx="480" cy="220" r="25" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
    <circle cx="480" cy="290" r="25" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
    <circle cx="480" cy="360" r="25" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
    
    <!-- Hidden layer 2 labels -->
    <text x="480" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff">h₂₁</text>
    <text x="480" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff">h₂₂</text>
    <text x="480" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff">h₂₃</text>
    <text x="480" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff">h₂₄</text>
  </g>
  
  <!-- Output Layer -->
  <g id="output-layer">
    <text x="680" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#34495e">Output Layer</text>
    <circle cx="680" cy="220" r="25" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
    <circle cx="680" cy="290" r="25" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
    
    <!-- Output labels -->
    <text x="680" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff">y₁</text>
    <text x="680" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff">y₂</text>
  </g>
  
  <!-- Connections Input to Hidden 1 -->
  <g id="connections-input-hidden1" opacity="0.6">
    <!-- From x1 -->
    <line x1="105" y1="150" x2="255" y2="130" stroke="#34495e" stroke-width="1"/>
    <line x1="105" y1="150" x2="255" y2="200" stroke="#34495e" stroke-width="1"/>
    <line x1="105" y1="150" x2="255" y2="270" stroke="#34495e" stroke-width="1"/>
    <line x1="105" y1="150" x2="255" y2="340" stroke="#34495e" stroke-width="1"/>
    <line x1="105" y1="150" x2="255" y2="410" stroke="#34495e" stroke-width="1"/>
    
    <!-- From x2 -->
    <line x1="105" y1="220" x2="255" y2="130" stroke="#34495e" stroke-width="1"/>
    <line x1="105" y1="220" x2="255" y2="200" stroke="#34495e" stroke-width="1"/>
    <line x1="105" y1="220" x2="255" y2="270" stroke="#34495e" stroke-width="1"/>
    <line x1="105" y1="220" x2="255" y2="340" stroke="#34495e" stroke-width="1"/>
    <line x1="105" y1="220" x2="255" y2="410" stroke="#34495e" stroke-width="1"/>
    
    <!-- From x3 -->
    <line x1="105" y1="290" x2="255" y2="130" stroke="#34495e" stroke-width="1"/>
    <line x1="105" y1="290" x2="255" y2="200" stroke="#34495e" stroke-width="1"/>
    <line x1="105" y1="290" x2="255" y2="270" stroke="#34495e" stroke-width="1"/>
    <line x1="105" y1="290" x2="255" y2="340" stroke="#34495e" stroke-width="1"/>
    <line x1="105" y1="290" x2="255" y2="410" stroke="#34495e" stroke-width="1"/>
    
    <!-- From x4 -->
    <line x1="105" y1="360" x2="255" y2="130" stroke="#34495e" stroke-width="1"/>
    <line x1="105" y1="360" x2="255" y2="200" stroke="#34495e" stroke-width="1"/>
    <line x1="105" y1="360" x2="255" y2="270" stroke="#34495e" stroke-width="1"/>
    <line x1="105" y1="360" x2="255" y2="340" stroke="#34495e" stroke-width="1"/>
    <line x1="105" y1="360" x2="255" y2="410" stroke="#34495e" stroke-width="1"/>
  </g>
  
  <!-- Connections Hidden 1 to Hidden 2 -->
  <g id="connections-hidden1-hidden2" opacity="0.6">
    <!-- From h11 to all h2 -->
    <line x1="305" y1="130" x2="455" y2="150" stroke="#34495e" stroke-width="1"/>
    <line x1="305" y1="130" x2="455" y2="220" stroke="#34495e" stroke-width="1"/>
    <line x1="305" y1="130" x2="455" y2="290" stroke="#34495e" stroke-width="1"/>
    <line x1="305" y1="130" x2="455" y2="360" stroke="#34495e" stroke-width="1"/>
    
    <!-- From h12 to all h2 -->
    <line x1="305" y1="200" x2="455" y2="150" stroke="#34495e" stroke-width="1"/>
    <line x1="305" y1="200" x2="455" y2="220" stroke="#34495e" stroke-width="1"/>
    <line x1="305" y1="200" x2="455" y2="290" stroke="#34495e" stroke-width="1"/>
    <line x1="305" y1="200" x2="455" y2="360" stroke="#34495e" stroke-width="1"/>
    
    <!-- From h13 to all h2 -->
    <line x1="305" y1="270" x2="455" y2="150" stroke="#34495e" stroke-width="1"/>
    <line x1="305" y1="270" x2="455" y2="220" stroke="#34495e" stroke-width="1"/>
    <line x1="305" y1="270" x2="455" y2="290" stroke="#34495e" stroke-width="1"/>
    <line x1="305" y1="270" x2="455" y2="360" stroke="#34495e" stroke-width="1"/>
    
    <!-- From h14 to all h2 -->
    <line x1="305" y1="340" x2="455" y2="150" stroke="#34495e" stroke-width="1"/>
    <line x1="305" y1="340" x2="455" y2="220" stroke="#34495e" stroke-width="1"/>
    <line x1="305" y1="340" x2="455" y2="290" stroke="#34495e" stroke-width="1"/>
    <line x1="305" y1="340" x2="455" y2="360" stroke="#34495e" stroke-width="1"/>
    
    <!-- From h15 to all h2 -->
    <line x1="305" y1="410" x2="455" y2="150" stroke="#34495e" stroke-width="1"/>
    <line x1="305" y1="410" x2="455" y2="220" stroke="#34495e" stroke-width="1"/>
    <line x1="305" y1="410" x2="455" y2="290" stroke="#34495e" stroke-width="1"/>
    <line x1="305" y1="410" x2="455" y2="360" stroke="#34495e" stroke-width="1"/>
  </g>
  
  <!-- Connections Hidden 2 to Output -->
  <g id="connections-hidden2-output" opacity="0.6">
    <!-- From h21 to outputs -->
    <line x1="505" y1="150" x2="655" y2="220" stroke="#34495e" stroke-width="1"/>
    <line x1="505" y1="150" x2="655" y2="290" stroke="#34495e" stroke-width="1"/>
    
    <!-- From h22 to outputs -->
    <line x1="505" y1="220" x2="655" y2="220" stroke="#34495e" stroke-width="1"/>
    <line x1="505" y1="220" x2="655" y2="290" stroke="#34495e" stroke-width="1"/>
    
    <!-- From h23 to outputs -->
    <line x1="505" y1="290" x2="655" y2="220" stroke="#34495e" stroke-width="1"/>
    <line x1="505" y1="290" x2="655" y2="290" stroke="#34495e" stroke-width="1"/>
    
    <!-- From h24 to outputs -->
    <line x1="505" y1="360" x2="655" y2="220" stroke="#34495e" stroke-width="1"/>
    <line x1="505" y1="360" x2="655" y2="290" stroke="#34495e" stroke-width="1"/>
  </g>
  
  <!-- Information flow arrows -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
     refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50" />
    </marker>
  </defs>
  
  <line x1="150" y1="460" x2="250" y2="460" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="350" y1="460" x2="450" y2="460" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="550" y1="460" x2="650" y2="460" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <text x="200" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">W⁽¹⁾, b⁽¹⁾</text>
  <text x="400" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">W⁽²⁾, b⁽²⁾</text>
  <text x="600" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">W⁽³⁾, b⁽³⁾</text>
  
  <!-- Legend -->
  <rect x="600" y="400" width="180" height="80" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" rx="5"/>
  <text x="690" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Information Flow</text>
  <text x="610" y="435" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Input → Hidden → Output</text>
  <text x="610" y="450" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• No cycles (feedforward)</text>
  <text x="610" y="465" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">• Weights (W) and biases (b)</text>
</svg>