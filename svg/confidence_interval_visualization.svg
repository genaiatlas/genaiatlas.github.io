<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    95% Confidence Interval Visualization
  </text>
  
  <!-- Normal distribution curve -->
  <path d="M 100 300 Q 200 200 300 250 Q 350 200 400 180 Q 450 200 500 250 Q 600 200 700 300" 
        stroke="#2196f3" stroke-width="3" fill="none"/>
  
  <!-- Population mean line -->
  <line x1="400" y1="170" x2="400" y2="320" stroke="#e91e63" stroke-width="3" stroke-dasharray="5,5"/>
  <text x="405" y="165" font-family="Arial, sans-serif" font-size="14" fill="#e91e63">μ (true mean)</text>
  
  <!-- Confidence interval samples -->
  <g id="sample1">
    <line x1="320" y1="350" x2="480" y2="350" stroke="#4caf50" stroke-width="4"/>
    <circle cx="320" cy="350" r="4" fill="#4caf50"/>
    <circle cx="480" cy="350" r="4" fill="#4caf50"/>
    <circle cx="400" cy="350" r="3" fill="#2e7d32"/>
    <text x="280" y="345" font-family="Arial, sans-serif" font-size="12" fill="#4caf50">CI₁</text>
  </g>
  
  <g id="sample2">
    <line x1="330" y1="380" x2="490" y2="380" stroke="#4caf50" stroke-width="4"/>
    <circle cx="330" cy="380" r="4" fill="#4caf50"/>
    <circle cx="490" cy="380" r="4" fill="#4caf50"/>
    <circle cx="410" cy="380" r="3" fill="#2e7d32"/>
    <text x="280" y="375" font-family="Arial, sans-serif" font-size="12" fill="#4caf50">CI₂</text>
  </g>
  
  <g id="sample3">
    <line x1="310" y1="410" x2="470" y2="410" stroke="#4caf50" stroke-width="4"/>
    <circle cx="310" cy="410" r="4" fill="#4caf50"/>
    <circle cx="470" cy="410" r="4" fill="#4caf50"/>
    <circle cx="390" cy="410" r="3" fill="#2e7d32"/>
    <text x="280" y="405" font-family="Arial, sans-serif" font-size="12" fill="#4caf50">CI₃</text>
  </g>
  
  <!-- One interval that misses -->
  <g id="sample4">
    <line x1="450" y1="440" x2="610" y2="440" stroke="#ff5722" stroke-width="4"/>
    <circle cx="450" cy="440" r="4" fill="#ff5722"/>
    <circle cx="610" cy="440" r="4" fill="#ff5722"/>
    <circle cx="530" cy="440" r="3" fill="#d84315"/>
    <text x="280" y="435" font-family="Arial, sans-serif" font-size="12" fill="#ff5722">CI₄</text>
  </g>
  
  <g id="sample5">
    <line x1="325" y1="470" x2="485" y2="470" stroke="#4caf50" stroke-width="4"/>
    <circle cx="325" cy="470" r="4" fill="#4caf50"/>
    <circle cx="485" cy="470" r="4" fill="#4caf50"/>
    <circle cx="405" cy="470" r="3" fill="#2e7d32"/>
    <text x="280" y="465" font-family="Arial, sans-serif" font-size="12" fill="#4caf50">CI₅</text>
  </g>
  
  <!-- Interpretation box -->
  <rect x="50" y="80" width="320" height="120" fill="#e8f5e8" stroke="#4caf50" stroke-width="2" rx="5"/>
  <text x="210" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2e7d32">
    Correct Interpretation
  </text>
  <text x="70" y="125" font-family="Arial, sans-serif" font-size="12" fill="#333">
    "We are 95% confident that the true
  </text>
  <text x="70" y="140" font-family="Arial, sans-serif" font-size="12" fill="#333">
    population parameter lies within this interval"
  </text>
  <text x="70" y="160" font-family="Arial, sans-serif" font-size="12" fill="#333">
    ✅ About the procedure/method
  </text>
  <text x="70" y="175" font-family="Arial, sans-serif" font-size="12" fill="#333">
    ✅ Long-run frequency interpretation
  </text>
  
  <!-- Wrong interpretation box -->
  <rect x="430" y="80" width="320" height="120" fill="#ffebee" stroke="#f44336" stroke-width="2" rx="5"/>
  <text x="590" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#d32f2f">
    Common Misinterpretation
  </text>
  <text x="450" y="125" font-family="Arial, sans-serif" font-size="12" fill="#333">
    "There's a 95% probability that the
  </text>
  <text x="450" y="140" font-family="Arial, sans-serif" font-size="12" fill="#333">
    parameter is in this specific interval"
  </text>
  <text x="450" y="160" font-family="Arial, sans-serif" font-size="12" fill="#333">
    ❌ About this specific interval
  </text>
  <text x="450" y="175" font-family="Arial, sans-serif" font-size="12" fill="#333">
    ❌ Probability statement about parameter
  </text>
  
  <!-- Legend -->
  <rect x="50" y="510" width="700" height="80" fill="#f5f5f5" stroke="#757575" stroke-width="1" rx="5"/>
  <text x="400" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#424242">
    Understanding the 95% Confidence Level
  </text>
  <text x="70" y="555" font-family="Arial, sans-serif" font-size="12" fill="#333">
    🟢 Green intervals: Contain the true parameter (95% of all possible samples)
  </text>
  <text x="70" y="570" font-family="Arial, sans-serif" font-size="12" fill="#333">
    🔴 Red interval: Misses the true parameter (5% of all possible samples)
  </text>
  
  <!-- Formula box -->
  <rect x="520" y="250" width="260" height="80" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="5"/>
  <text x="650" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f57c00">
    95% CI Formula
  </text>
  <text x="540" y="295" font-family="Arial, sans-serif" font-size="12" fill="#333">
    CI = x̄ ± t₀.₀₂₅ × (s/√n)
  </text>
  <text x="540" y="310" font-family="Arial, sans-serif" font-size="10" fill="#666">
    where t₀.₀₂₅ = critical value
  </text>
  
  <!-- Scale -->
  <line x1="100" y1="320" x2="700" y2="320" stroke="#666" stroke-width="1"/>
  <text x="100" y="335" font-family="Arial, sans-serif" font-size="10" fill="#666">-3σ</text>
  <text x="250" y="335" font-family="Arial, sans-serif" font-size="10" fill="#666">-2σ</text>
  <text x="395" y="335" font-family="Arial, sans-serif" font-size="10" fill="#666">μ</text>
  <text x="550" y="335" font-family="Arial, sans-serif" font-size="10" fill="#666">+2σ</text>
  <text x="695" y="335" font-family="Arial, sans-serif" font-size="10" fill="#666">+3σ</text>
</svg>