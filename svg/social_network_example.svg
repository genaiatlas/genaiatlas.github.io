<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="800" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="600" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Social Network Gaming Example
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="70" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#7f8c8d">
    Modeling Game Adoption Through Friendship Networks
  </text>
  
  <!-- Main Network Graph -->
  <g id="network">
    <!-- Users (Nodes) -->
    <!-- User 1 (Playing) -->
    <circle cx="300" cy="250" r="45" fill="#27ae60" stroke="#1e8449" stroke-width="3"/>
    <text x="300" y="260" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">U₁</text>
    <text x="300" y="325" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#27ae60" font-weight="bold">Playing</text>
    
    <!-- User 2 (Not Playing) -->
    <circle cx="500" cy="180" r="45" fill="#e74c3c" stroke="#c0392b" stroke-width="3"/>
    <text x="500" y="190" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">U₂</text>
    <text x="500" y="255" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#e74c3c" font-weight="bold">Not Playing</text>
    
    <!-- User 3 (Playing) -->
    <circle cx="700" cy="250" r="45" fill="#27ae60" stroke="#1e8449" stroke-width="3"/>
    <text x="700" y="260" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">U₃</text>
    <text x="700" y="325" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#27ae60" font-weight="bold">Playing</text>
    
    <!-- User 4 (Playing) -->
    <circle cx="900" cy="180" r="45" fill="#27ae60" stroke="#1e8449" stroke-width="3"/>
    <text x="900" y="190" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">U₄</text>
    <text x="900" y="255" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#27ae60" font-weight="bold">Playing</text>
    
    <!-- User 5 (Unknown - to predict) -->
    <circle cx="500" cy="400" r="45" fill="#f39c12" stroke="#d68910" stroke-width="3"/>
    <text x="500" y="410" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">U₅</text>
    <text x="500" y="475" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#e67e22" font-weight="bold">Predict?</text>
    
    <!-- User 6 (Not Playing) -->
    <circle cx="700" cy="450" r="45" fill="#e74c3c" stroke="#c0392b" stroke-width="3"/>
    <text x="700" y="460" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">U₆</text>
    <text x="700" y="525" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#e74c3c" font-weight="bold">Not Playing</text>
    
    <!-- Friendship Edges -->
    <line x1="335" y1="270" x2="462" y2="200" stroke="#34495e" stroke-width="4"/>
    <line x1="533" y1="202" x2="662" y2="268" stroke="#34495e" stroke-width="4"/>
    <line x1="733" y1="270" x2="862" y2="202" stroke="#34495e" stroke-width="4"/>
    <line x1="333" y1="283" x2="467" y2="375" stroke="#34495e" stroke-width="4"/>
    <line x1="533" y1="215" x2="467" y2="375" stroke="#34495e" stroke-width="4"/>
    <line x1="533" y1="423" x2="662" y2="430" stroke="#34495e" stroke-width="4"/>
    <line x1="733" y1="283" x2="667" y2="415" stroke="#34495e" stroke-width="4"/>
    
    <!-- Edge label -->
    <text x="400" y="235" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#7f8c8d" font-style="italic">
      friends
    </text>
  </g>
  
  <!-- Legend Box -->
  <g id="legend">
    <rect x="50" y="150" width="200" height="200" fill="#ffffff" stroke="#95a5a6" stroke-width="2" rx="8"/>
    <text x="150" y="180" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Status Legend
    </text>
    
    <!-- Playing -->
    <circle cx="80" cy="210" r="18" fill="#27ae60" stroke="#1e8449" stroke-width="2"/>
    <text x="115" y="217" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">
      Playing (X_i = 1)
    </text>
    
    <!-- Not Playing -->
    <circle cx="80" cy="250" r="18" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
    <text x="115" y="257" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">
      Not Playing (X_i = 0)
    </text>
    
    <!-- Unknown -->
    <circle cx="80" cy="290" r="18" fill="#f39c12" stroke="#d68910" stroke-width="2"/>
    <text x="115" y="297" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">
      Unknown (Predict)
    </text>
    
    <!-- Edge -->
    <line x1="60" y1="320" x2="100" y2="320" stroke="#34495e" stroke-width="3"/>
    <text x="115" y="327" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">
      Friendship
    </text>
  </g>
  
  <!-- Prediction Box -->
  <g id="prediction">
    <rect x="50" y="400" width="200" height="170" fill="#e8f6f3" stroke="#16a085" stroke-width="2" rx="8"/>
    <text x="150" y="430" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#16a085">
      Prediction Rule
    </text>
    
    <text x="150" y="460" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#2c3e50">
      P(X₅ | X_{N(5)})
    </text>
    
    <text x="60" y="490" font-family="Arial, sans-serif" font-size="13" fill="#34495e">
      • U₅'s neighbors: U₁, U₂
    </text>
    <text x="60" y="515" font-family="Arial, sans-serif" font-size="13" fill="#34495e">
      • U₁ is playing ✓
    </text>
    <text x="60" y="540" font-family="Arial, sans-serif" font-size="13" fill="#34495e">
      • U₂ is not playing ✗
    </text>
    <text x="60" y="560" font-family="Arial, sans-serif" font-size="12" fill="#16a085" font-weight="bold">
      → Mixed influence!
    </text>
  </g>
  
  <!-- Information Box -->
  <g id="info">
    <rect x="950" y="380" width="220" height="200" fill="#fff9e6" stroke="#f39c12" stroke-width="2" rx="8"/>
    <text x="1060" y="410" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#e67e22">
      Key Insights
    </text>
    
    <text x="960" y="440" font-family="Arial, sans-serif" font-size="12" fill="#34495e">
      ✓ Direct friends matter most
    </text>
    <text x="960" y="465" font-family="Arial, sans-serif" font-size="12" fill="#34495e">
      ✓ Distant users conditionally
    </text>
    <text x="970" y="485" font-family="Arial, sans-serif" font-size="12" fill="#34495e">
      independent given neighbors
    </text>
    <text x="960" y="510" font-family="Arial, sans-serif" font-size="12" fill="#34495e">
      ✓ Same network structure
    </text>
    <text x="970" y="530" font-family="Arial, sans-serif" font-size="12" fill="#34495e">
      across different games
    </text>
    <text x="960" y="555" font-family="Arial, sans-serif" font-size="12" fill="#34495e">
      ✓ Steady state captures
    </text>
    <text x="970" y="575" font-family="Arial, sans-serif" font-size="12" fill="#34495e">
      equilibrium distribution
    </text>
  </g>
  
  <!-- Binary Vector Representation -->
  <g id="binary-vector">
    <rect x="300" y="620" width="600" height="120" fill="#ffffff" stroke="#3498db" stroke-width="2" rx="8"/>
    <text x="600" y="650" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      State Vector for This Day
    </text>
    
    <text x="600" y="685" font-family="monospace" font-size="20" text-anchor="middle" fill="#2c3e50">
      X = (X₁, X₂, X₃, X₄, X₅, X₆) = (1, 0, 1, 1, ?, 0)
    </text>
    
    <text x="600" y="715" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#7f8c8d" font-style="italic">
      Binary encoding: 1 = playing, 0 = not playing, ? = unknown
    </text>
  </g>
  
  <!-- Footer -->
  <text x="600" y="780" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#7f8c8d" font-style="italic">
    Markov Property: P(X₅ | all others) = P(X₅ | X₁, X₂) — only neighbors matter!
  </text>
</svg>