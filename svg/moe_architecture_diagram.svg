<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradGate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196F3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1976D2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradExpert1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#388E3C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradExpert2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9800;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F57C00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradExpert3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9C27B0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7B1FA2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradExpert4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F44336;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D32F2F;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#333">Mixture of Experts (MoE)</text>
  <text x="400" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#666">Sparse Expert Activation Architecture</text>
  
  <!-- Input -->
  <rect x="350" y="520" width="100" height="40" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="5"/>
  <text x="400" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1976d2">Input Token</text>
  
  <!-- Gating Network -->
  <rect x="300" y="420" width="200" height="60" fill="url(#gradGate)" stroke="#333" stroke-width="2" rx="10"/>
  <text x="400" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Gating Network</text>
  <text x="400" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">Router Function</text>
  <text x="400" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#E3F2FD">G(x) = softmax(W_g · x)</text>
  
  <!-- Expert Networks -->
  <g id="expert1">
    <rect x="50" y="280" width="140" height="80" fill="url(#gradExpert1)" stroke="#333" stroke-width="2" rx="8"/>
    <text x="120" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">Expert 1</text>
    <text x="120" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#E8F5E8">Coding</text>
    <text x="120" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#E8F5E8">Specialist</text>
    <!-- Mini network inside -->
    <rect x="65" y="345" width="110" height="10" fill="#fff" opacity="0.8" rx="2"/>
    <text x="120" y="353" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">FFN Layers</text>
  </g>
  
  <g id="expert2">
    <rect x="220" y="280" width="140" height="80" fill="url(#gradExpert2)" stroke="#333" stroke-width="2" rx="8"/>
    <text x="290" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">Expert 2</text>
    <text x="290" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#FFF3E0">Math &amp;</text>
    <text x="290" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#FFF3E0">Reasoning</text>
    <!-- Mini network inside -->
    <rect x="235" y="345" width="110" height="10" fill="#fff" opacity="0.8" rx="2"/>
    <text x="290" y="353" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">FFN Layers</text>
  </g>
  
  <g id="expert3">
    <rect x="440" y="280" width="140" height="80" fill="url(#gradExpert3)" stroke="#333" stroke-width="2" rx="8"/>
    <text x="510" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">Expert 3</text>
    <text x="510" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#F3E5F5">Creative</text>
    <text x="510" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#F3E5F5">Writing</text>
    <!-- Mini network inside -->
    <rect x="455" y="345" width="110" height="10" fill="#fff" opacity="0.8" rx="2"/>
    <text x="510" y="353" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">FFN Layers</text>
  </g>
  
  <g id="expert4">
    <rect x="610" y="280" width="140" height="80" fill="url(#gradExpert4)" stroke="#333" stroke-width="2" rx="8"/>
    <text x="680" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">Expert 4</text>
    <text x="680" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#FFEBEE">Factual</text>
    <text x="680" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#FFEBEE">Knowledge</text>
    <!-- Mini network inside -->
    <rect x="625" y="345" width="110" height="10" fill="#fff" opacity="0.8" rx="2"/>
    <text x="680" y="353" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">FFN Layers</text>
  </g>
  
  <!-- Routing weights -->
  <g id="routing-weights">
    <text x="120" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#4CAF50">w₁ = 0.7</text>
    <text x="290" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#FF9800">w₂ = 0.3</text>
    <text x="510" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#9C27B0">w₃ = 0.0</text>
    <text x="680" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#F44336">w₄ = 0.0</text>
  </g>
  
  <!-- Combination Layer -->
  <rect x="300" y="180" width="200" height="60" fill="#fff" stroke="#333" stroke-width="2" rx="10"/>
  <text x="400" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Weighted Combination</text>
  <text x="400" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">Σ w_i · Expert_i(x)</text>
  <text x="400" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#999">Only top-k experts activated</text>
  
  <!-- Output -->
  <rect x="350" y="100" width="100" height="40" fill="#e8f5e8" stroke="#4caf50" stroke-width="2" rx="5"/>
  <text x="400" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4caf50">Output</text>
  
  <!-- Arrows -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4CAF50" />
    </marker>
    <marker id="arrowhead-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#FF9800" />
    </marker>
    <marker id="arrowhead-inactive" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ccc" />
    </marker>
  </defs>
  
  <!-- Input to Gating -->
  <path d="M 400 520 L 400 480" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Gating to Experts -->
  <path d="M 350 430 L 150 370" stroke="#4CAF50" stroke-width="4" marker-end="url(#arrowhead-green)"/>
  <path d="M 370 430 L 270 370" stroke="#FF9800" stroke-width="3" marker-end="url(#arrowhead-orange)"/>
  <path d="M 430 430 L 530 370" stroke="#ccc" stroke-width="1" stroke-dasharray="5,5" marker-end="url(#arrowhead-inactive)"/>
  <path d="M 450 430 L 660 370" stroke="#ccc" stroke-width="1" stroke-dasharray="5,5" marker-end="url(#arrowhead-inactive)"/>
  
  <!-- Experts to Combination -->
  <path d="M 150 280 L 350 240" stroke="#4CAF50" stroke-width="4" marker-end="url(#arrowhead-green)"/>
  <path d="M 270 280 L 380 240" stroke="#FF9800" stroke-width="3" marker-end="url(#arrowhead-orange)"/>
  
  <!-- Combination to Output -->
  <path d="M 400 180 L 400 140" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Efficiency Note -->
  <g id="efficiency-note">
    <rect x="520" y="150" width="260" height="80" fill="#f0f8ff" stroke="#2196F3" stroke-width="1" rx="5" opacity="0.9"/>
    <text x="650" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1976D2">Sparse Activation Benefits</text>
    <text x="530" y="190" font-family="Arial, sans-serif" font-size="11" fill="#333">• Only 2/4 experts activated</text>
    <text x="530" y="205" font-family="Arial, sans-serif" font-size="11" fill="#333">• 50% computational savings</text>
    <text x="530" y="220" font-family="Arial, sans-serif" font-size="11" fill="#333">• Maintains model capacity</text>
  </g>
  
  <!-- Top-k Selection indicator -->
  <text x="400" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Top-2 Selection (k=2)</text>
</svg>