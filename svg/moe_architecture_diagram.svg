<svg viewBox="0 0 900 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="900" height="800" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="450" y="35" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    MoE Architecture (Mixture of Experts)
  </text>
  
  <text x="450" y="60" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d" font-style="italic">
    Sparse Activation with Specialized Expert Networks
  </text>
  
  <!-- Input -->
  <g transform="translate(350, 90)">
    <rect x="0" y="0" width="200" height="50" fill="#3498db" stroke="#2980b9" stroke-width="2" rx="5"/>
    <text x="100" y="32" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">
      Input Token Sequence
    </text>
  </g>
  
  <line x1="450" y1="140" x2="450" y2="180" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Gating Network -->
  <g transform="translate(300, 180)">
    <rect x="0" y="0" width="300" height="80" fill="#f39c12" stroke="#d68910" stroke-width="3" rx="8"/>
    <text x="150" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
      Gating Network
    </text>
    <text x="150" y="45" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
      G(x) = softmax(W_g · x)
    </text>
    <text x="150" y="65" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
      Routes input to Top-K experts
    </text>
  </g>
  
  <!-- Routing arrows -->
  <line x1="350" y1="260" x2="150" y2="340" stroke="#27ae60" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="400" y1="260" x2="300" y2="340" stroke="#27ae60" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="450" y1="260" x2="450" y2="340" stroke="#95a5a6" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="500" y1="260" x2="600" y2="340" stroke="#27ae60" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="550" y1="260" x2="750" y2="340" stroke="#27ae60" stroke-width="3" marker-end="url(#arrow)"/>
  
  <!-- Routing weights -->
  <text x="230" y="300" font-family="Arial, sans-serif" font-size="10" fill="#27ae60" font-weight="bold">0.45</text>
  <text x="340" y="300" font-family="Arial, sans-serif" font-size="10" fill="#27ae60" font-weight="bold">0.30</text>
  <text x="445" y="305" font-family="Arial, sans-serif" font-size="9" fill="#95a5a6">inactive</text>
  <text x="560" y="300" font-family="Arial, sans-serif" font-size="10" fill="#27ae60" font-weight="bold">0.15</text>
  <text x="690" y="300" font-family="Arial, sans-serif" font-size="10" fill="#27ae60" font-weight="bold">0.10</text>
  
  <!-- Expert Networks -->
  <!-- Expert 1 - Coding (Active) -->
  <g transform="translate(50, 340)">
    <rect x="0" y="0" width="140" height="100" fill="#27ae60" stroke="#229954" stroke-width="3" rx="5"/>
    <text x="70" y="25" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">
      Expert 1
    </text>
    <text x="70" y="45" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
      💻 Coding
    </text>
    <text x="70" y="65" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">
      Programming
    </text>
    <text x="70" y="80" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">
      Debugging
    </text>
    <text x="70" y="93" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#d5f4e6">
      ✓ ACTIVE
    </text>
  </g>
  
  <!-- Expert 2 - Reasoning (Active) -->
  <g transform="translate(230, 340)">
    <rect x="0" y="0" width="140" height="100" fill="#27ae60" stroke="#229954" stroke-width="3" rx="5"/>
    <text x="70" y="25" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">
      Expert 2
    </text>
    <text x="70" y="45" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
      🧠 Reasoning
    </text>
    <text x="70" y="65" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">
      Logic
    </text>
    <text x="70" y="80" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">
      Mathematics
    </text>
    <text x="70" y="93" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#d5f4e6">
      ✓ ACTIVE
    </text>
  </g>
  
  <!-- Expert 3 - Creative (Inactive) -->
  <g transform="translate(410, 340)">
    <rect x="0" y="0" width="140" height="100" fill="#95a5a6" stroke="#7f8c8d" stroke-width="2" rx="5" opacity="0.5"/>
    <text x="70" y="25" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">
      Expert 3
    </text>
    <text x="70" y="45" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
      ✨ Creative
    </text>
    <text x="70" y="65" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">
      Writing
    </text>
    <text x="70" y="80" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">
      Storytelling
    </text>
    <text x="70" y="93" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#ecf0f1">
      ○ INACTIVE
    </text>
  </g>
  
  <!-- Expert 4 - Domain (Active) -->
  <g transform="translate(590, 340)">
    <rect x="0" y="0" width="140" height="100" fill="#27ae60" stroke="#229954" stroke-width="3" rx="5"/>
    <text x="70" y="25" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">
      Expert 4
    </text>
    <text x="70" y="45" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
      📚 Domain
    </text>
    <text x="70" y="65" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">
      Specialized
    </text>
    <text x="70" y="80" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">
      Knowledge
    </text>
    <text x="70" y="93" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#d5f4e6">
      ✓ ACTIVE
    </text>
  </g>
  
  <!-- Expert N (Inactive) -->
  <g transform="translate(770, 340)">
    <rect x="0" y="0" width="80" height="100" fill="#95a5a6" stroke="#7f8c8d" stroke-width="2" rx="5" opacity="0.5"/>
    <text x="40" y="40" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
      Expert
    </text>
    <text x="40" y="55" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">
      N
    </text>
    <text x="40" y="75" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">
      ...
    </text>
  </g>
  
  <!-- Aggregation arrows -->
  <line x1="120" y1="440" x2="400" y2="520" stroke="#9b59b6" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="440" x2="420" y2="520" stroke="#9b59b6" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="660" y1="440" x2="460" y2="520" stroke="#9b59b6" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="750" y1="440" x2="480" y2="520" stroke="#9b59b6" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Output Aggregation -->
  <g transform="translate(300, 520)">
    <rect x="0" y="0" width="300" height="70" fill="#9b59b6" stroke="#8e44ad" stroke-width="3" rx="8"/>
    <text x="150" y="25" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">
      Weighted Aggregation
    </text>
    <text x="150" y="48" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
      y = Σ G(x)ᵢ · Eᵢ(x)
    </text>
  </g>
  
  <line x1="450" y1="590" x2="450" y2="620" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Final Output -->
  <g transform="translate(350, 620)">
    <rect x="0" y="0" width="200" height="50" fill="#e74c3c" stroke="#c0392b" stroke-width="2" rx="5"/>
    <text x="100" y="32" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">
      Final Output
    </text>
  </g>
  
  <!-- Benefits Panel -->
  <g transform="translate(50, 700)">
    <rect x="0" y="0" width="800" height="80" fill="#fff3cd" stroke="#f39c12" stroke-width="2" rx="5"/>
    <text x="400" y="22" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#856404">
      💡 Key Benefits
    </text>
    <text x="400" y="42" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">
      ⚡ Efficiency: Only activate ~2-4 experts per input | 🎯 Specialization: Domain-specific optimization
    </text>
    <text x="400" y="58" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">
      📈 Scalability: Add experts without retraining entire model | 🚀 Performance: Better accuracy through specialization
    </text>
  </g>
  
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#34495e"/>
    </marker>
  </defs>
</svg>