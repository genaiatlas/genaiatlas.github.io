<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="500" y="35" font-size="24" font-weight="bold" text-anchor="middle" fill="#2C3E50">
    Score to Probability Conversion
  </text>
  
  <!-- Conversion Formula -->
  <rect x="200" y="60" width="600" height="80" fill="#E8F4F8" stroke="#3498DB" stroke-width="2" rx="10"/>
  <text x="500" y="90" font-size="16" font-weight="bold" text-anchor="middle" fill="#2C3E50">
    Conversion Formula
  </text>
  <text x="500" y="120" font-size="22" text-anchor="middle" fill="#3498DB" font-weight="bold">
    B = (X + 1) / 2
  </text>
  
  <!-- Scale visualization -->
  <g transform="translate(100, 170)">
    <!-- Comparison Score Scale -->
    <rect x="0" y="0" width="800" height="120" fill="#FEF5E7" stroke="#E67E22" stroke-width="2" rx="8"/>
    <text x="400" y="30" font-size="15" font-weight="bold" text-anchor="middle" fill="#2C3E50">
      Comparison Score Scale
    </text>
    
    <!-- Scale line -->
    <line x1="50" y1="70" x2="750" y2="70" stroke="#34495E" stroke-width="3"/>
    
    <!-- Markers -->
    <line x1="50" y1="60" x2="50" y2="80" stroke="#E74C3C" stroke-width="3"/>
    <text x="50" y="100" font-size="12" font-weight="bold" text-anchor="middle" fill="#E74C3C">-1</text>
    
    <line x1="400" y1="60" x2="400" y2="80" stroke="#95A5A6" stroke-width="3"/>
    <text x="400" y="100" font-size="12" font-weight="bold" text-anchor="middle" fill="#95A5A6">0</text>
    
    <line x1="750" y1="60" x2="750" y2="80" stroke="#27AE60" stroke-width="3"/>
    <text x="750" y="100" font-size="12" font-weight="bold" text-anchor="middle" fill="#27AE60">+1</text>
    
    <!-- Example points -->
    <circle cx="225" cy="70" r="6" fill="#E67E22"/>
    <text x="225" y="50" font-size="11" text-anchor="middle" fill="#E67E22">-0.5</text>
    
    <circle cx="575" cy="70" r="6" fill="#3498DB"/>
    <text x="575" y="50" font-size="11" text-anchor="middle" fill="#3498DB">+0.5</text>
  </g>
  
  <!-- Arrow down -->
  <path d="M 500 310 L 500 350" stroke="#7F8C8D" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="540" y="335" font-size="13" font-weight="bold" fill="#7F8C8D">Convert</text>
  
  <!-- Probability Scale -->
  <g transform="translate(100, 370)">
    <rect x="0" y="0" width="800" height="120" fill="#E8F8F5" stroke="#27AE60" stroke-width="2" rx="8"/>
    <text x="400" y="30" font-size="15" font-weight="bold" text-anchor="middle" fill="#2C3E50">
      Winning Probability Scale (B)
    </text>
    
    <!-- Scale line -->
    <line x1="50" y1="70" x2="750" y2="70" stroke="#34495E" stroke-width="3"/>
    
    <!-- Markers -->
    <line x1="50" y1="60" x2="50" y2="80" stroke="#E74C3C" stroke-width="3"/>
    <text x="50" y="100" font-size="12" font-weight="bold" text-anchor="middle" fill="#E74C3C">0.0 (0%)</text>
    
    <line x1="400" y1="60" x2="400" y2="80" stroke="#95A5A6" stroke-width="3"/>
    <text x="400" y="100" font-size="12" font-weight="bold" text-anchor="middle" fill="#95A5A6">0.5 (50%)</text>
    
    <line x1="750" y1="60" x2="750" y2="80" stroke="#27AE60" stroke-width="3"/>
    <text x="750" y="100" font-size="12" font-weight="bold" text-anchor="middle" fill="#27AE60">1.0 (100%)</text>
    
    <!-- Converted example points -->
    <circle cx="225" cy="70" r="6" fill="#E67E22"/>
    <text x="225" y="50" font-size="11" text-anchor="middle" fill="#E67E22">0.25 (25%)</text>
    
    <circle cx="575" cy="70" r="6" fill="#3498DB"/>
    <text x="575" y="50" font-size="11" text-anchor="middle" fill="#3498DB">0.75 (75%)</text>
  </g>
  
  <!-- Examples -->
  <rect x="50" y="520" width="900" height="160" fill="#F8F9F9" stroke="#34495E" stroke-width="2" rx="8"/>
  <text x="500" y="550" font-size="16" font-weight="bold" text-anchor="middle" fill="#2C3E50">
    Conversion Examples
  </text>
  
  <!-- Example 1 -->
  <g transform="translate(80, 565)">
    <rect x="0" y="0" width="270" height="95" fill="white" stroke="#27AE60" stroke-width="2" rx="5"/>
    <text x="135" y="25" font-size="13" font-weight="bold" text-anchor="middle" fill="#2C3E50">X = +1 (Always wins)</text>
    <text x="135" y="50" font-size="12" text-anchor="middle" fill="#34495E">B = (1 + 1) / 2 = 1.0</text>
    <text x="135" y="72" font-size="11" text-anchor="middle" fill="#7F8C8D">Item wins 100% of time</text>
    <circle cx="135" cy="85" r="3" fill="#27AE60"/>
  </g>
  
  <!-- Example 2 -->
  <g transform="translate(365, 565)">
    <rect x="0" y="0" width="270" height="95" fill="white" stroke="#95A5A6" stroke-width="2" rx="5"/>
    <text x="135" y="25" font-size="13" font-weight="bold" text-anchor="middle" fill="#2C3E50">X = 0 (Neutral)</text>
    <text x="135" y="50" font-size="12" text-anchor="middle" fill="#34495E">B = (0 + 1) / 2 = 0.5</text>
    <text x="135" y="72" font-size="11" text-anchor="middle" fill="#7F8C8D">Item wins 50% of time (tie)</text>
    <circle cx="135" cy="85" r="3" fill="#95A5A6"/>
  </g>
  
  <!-- Example 3 -->
  <g transform="translate(650, 565)">
    <rect x="0" y="0" width="270" height="95" fill="white" stroke="#E74C3C" stroke-width="2" rx="5"/>
    <text x="135" y="25" font-size="13" font-weight="bold" text-anchor="middle" fill="#2C3E50">X = -1 (Always loses)</text>
    <text x="135" y="50" font-size="12" text-anchor="middle" fill="#34495E">B = (-1 + 1) / 2 = 0.0</text>
    <text x="135" y="72" font-size="11" text-anchor="middle" fill="#7F8C8D">Item wins 0% of time</text>
    <circle cx="135" cy="85" r="3" fill="#E74C3C"/>
  </g>
  
  <!-- Special Example -->
  <g transform="translate(80, 670)">
    <rect x="0" y="0" width="840" height="0" fill="none"/>
  </g>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#7F8C8D"/>
    </marker>
  </defs>
</svg>