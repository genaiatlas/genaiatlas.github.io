<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="500" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Serialization Process Overview
  </text>
  
  <!-- Left side: Python Object (In-Memory) -->
  <g transform="translate(50, 100)">
    <text x="150" y="0" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#3498db">
      Python Object (In-Memory)
    </text>
    
    <rect x="0" y="20" width="300" height="200" fill="white" stroke="#3498db" stroke-width="3" rx="10"/>
    
    <!-- ML Model representation -->
    <g transform="translate(150, 70)">
      <circle cx="0" cy="0" r="50" fill="#3498db" opacity="0.2" stroke="#3498db" stroke-width="2"/>
      <text x="0" y="-10" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#3498db">ML Model</text>
      <text x="0" y="10" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">Trained</text>
      <text x="0" y="25" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">Parameters</text>
    </g>
    
    <text x="150" y="160" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d">
      • Model architecture
    </text>
    <text x="150" y="180" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d">
      • Trained weights
    </text>
    <text x="150" y="200" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d">
      • Hyperparameters
    </text>
  </g>
  
  <!-- Serialization Arrow -->
  <g transform="translate(370, 200)">
    <line x1="0" y1="0" x2="100" y2="0" stroke="#27ae60" stroke-width="4" marker-end="url(#arrowhead-green)"/>
    <rect x="15" y="-35" width="70" height="30" fill="#d5f4e6" stroke="#27ae60" stroke-width="2" rx="5"/>
    <text x="50" y="-12" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">
      Serialize
    </text>
    <text x="50" y="25" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#7f8c8d">
      pickle.dump() or
    </text>
    <text x="50" y="38" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#7f8c8d">
      joblib.dump()
    </text>
  </g>
  
  <!-- Center: Byte Stream / File -->
  <g transform="translate(490, 100)">
    <text x="100" y="0" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#f39c12">
      Serialized Format
    </text>
    
    <rect x="0" y="20" width="200" height="200" fill="white" stroke="#f39c12" stroke-width="3" rx="10"/>
    
    <!-- File representation -->
    <g transform="translate(100, 80)">
      <rect x="-40" y="-40" width="80" height="90" fill="#f39c12" opacity="0.2" stroke="#f39c12" stroke-width="2" rx="5"/>
      <rect x="-35" y="-30" width="70" height="5" fill="#f39c12" opacity="0.6"/>
      <rect x="-35" y="-20" width="70" height="5" fill="#f39c12" opacity="0.6"/>
      <rect x="-35" y="-10" width="50" height="5" fill="#f39c12" opacity="0.6"/>
      <rect x="-35" y="0" width="70" height="5" fill="#f39c12" opacity="0.6"/>
      <rect x="-35" y="10" width="60" height="5" fill="#f39c12" opacity="0.6"/>
      <rect x="-35" y="20" width="70" height="5" fill="#f39c12" opacity="0.6"/>
      <rect x="-35" y="30" width="45" height="5" fill="#f39c12" opacity="0.6"/>
    </g>
    
    <text x="100" y="150" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#34495e">
      model.pkl
    </text>
    <text x="100" y="168" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">
      or
    </text>
    <text x="100" y="185" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#34495e">
      model.joblib
    </text>
  </g>
  
  <!-- Deserialization Arrow -->
  <g transform="translate(710, 200)">
    <line x1="0" y1="0" x2="100" y2="0" stroke="#e74c3c" stroke-width="4" marker-end="url(#arrowhead-red)"/>
    <rect x="15" y="-35" width="70" height="30" fill="#fadbd8" stroke="#e74c3c" stroke-width="2" rx="5"/>
    <text x="50" y="-12" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#e74c3c">
      Deserialize
    </text>
    <text x="50" y="25" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#7f8c8d">
      pickle.load() or
    </text>
    <text x="50" y="38" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#7f8c8d">
      joblib.load()
    </text>
  </g>
  
  <!-- Right side: Reconstructed Python Object -->
  <g transform="translate(830, 100)">
    <text x="85" y="0" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#9b59b6">
      Loaded Model
    </text>
    
    <rect x="0" y="20" width="170" height="200" fill="white" stroke="#9b59b6" stroke-width="3" rx="10"/>
    
    <!-- Restored model -->
    <g transform="translate(85, 70)">
      <circle cx="0" cy="0" r="40" fill="#9b59b6" opacity="0.2" stroke="#9b59b6" stroke-width="2"/>
      <text x="0" y="-5" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#9b59b6">Ready</text>
      <text x="0" y="10" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">to predict</text>
    </g>
    
    <text x="85" y="150" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d">
      Same model
    </text>
    <text x="85" y="168" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d">
      architecture &amp;
    </text>
    <text x="85" y="186" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d">
      parameters
    </text>
  </g>
  
  <!-- Bottom: Key Benefits -->
  <g transform="translate(100, 380)">
    <text x="400" y="0" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#2c3e50">
      Key Benefits of Serialization
    </text>
    
    <g transform="translate(0, 25)">
      <!-- Benefit 1 -->
      <rect x="0" y="0" width="190" height="100" fill="white" stroke="#3498db" stroke-width="2" rx="5"/>
      <circle cx="20" cy="20" r="12" fill="#3498db"/>
      <text x="20" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">💾</text>
      <text x="95" y="30" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#3498db">
        Model Persistence
      </text>
      <text x="95" y="55" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">
        Save trained models
      </text>
      <text x="95" y="72" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">
        to disk for later use
      </text>
    </g>
    
    <g transform="translate(210, 25)">
      <!-- Benefit 2 -->
      <rect x="0" y="0" width="190" height="100" fill="white" stroke="#27ae60" stroke-width="2" rx="5"/>
      <circle cx="20" cy="20" r="12" fill="#27ae60"/>
      <text x="20" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">⏱️</text>
      <text x="95" y="30" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">
        Time Efficiency
      </text>
      <text x="95" y="55" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">
        Avoid retraining
      </text>
      <text x="95" y="72" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">
        models repeatedly
      </text>
    </g>
    
    <g transform="translate(420, 25)">
      <!-- Benefit 3 -->
      <rect x="0" y="0" width="190" height="100" fill="white" stroke="#f39c12" stroke-width="2" rx="5"/>
      <circle cx="20" cy="20" r="12" fill="#f39c12"/>
      <text x="20" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">🚀</text>
      <text x="95" y="30" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#f39c12">
        Deployment
      </text>
      <text x="95" y="55" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">
        Transmit models
      </text>
      <text x="95" y="72" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">
        across systems
      </text>
    </g>
    
    <g transform="translate(630, 25)">
      <!-- Benefit 4 -->
      <rect x="0" y="0" width="190" height="100" fill="white" stroke="#9b59b6" stroke-width="2" rx="5"/>
      <circle cx="20" cy="20" r="12" fill="#9b59b6"/>
      <text x="20" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">📊</text>
      <text x="95" y="30" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#9b59b6">
        Reproducibility
      </text>
      <text x="95" y="55" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">
        Store model states
      </text>
      <text x="95" y="72" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#34495e">
        for research
      </text>
    </g>
  </g>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead-green" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#27ae60"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#e74c3c"/>
    </marker>
  </defs>
</svg>